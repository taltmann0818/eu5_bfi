 banking_office: "Banka Şubesi"
 banking_office_desc: "Yerel bir banka ofisi. Yeni devlet kredisi, mevduat ve yatırımlar, devletin mevcut sermayesinde bankanın sahip olduğu tamamlanmış bir şubeyi gerektirir. Mevcut talepler geçerliliğini korur; bankadan bankaya yapılan işin şubeye ihtiyacı yoktur."
