l_turkish:
 banking_office: "Banka Şubesi"
 banking_office_desc: "Yerel bir banka şubesi. İmtiyazlı bankası olan hükümdar, ev sahibiyle ilişkiler ve olağan bina şartları çerçevesinde yabancı şubeleri normal inşaat yoluyla finanse edebilir. Tamamlanan şube imtiyazlı bankaya aittir. Yeni devlet kredileri, mevduatlar ve yatırımlar için hükümdarın mevcut başkentinde bankaya ait tamamlanmış bir şube gerekir. Mevcut alacakların hizmeti sürer."
