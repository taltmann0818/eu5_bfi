l_turkish:
 central_bank_desc: "Rezervlerin korunması ve kamu kredilerinin düzenlenmesi için merkezi bir kurum, dağınık finans işlerini tek bir çatı altında topluyor. Tamamlanmış bir Merkez Bankası tarafından desteklenen imtiyazlı bir banka ödeme yapar 15% Gerekli ilerlemeler araştırıldıkça yönetim maliyetleri azalır ve parasal hizmetlere erişim sağlanır. Senetler destekli yükümlülükler olarak kalır; ihraçları banka karı yaratmaz."
