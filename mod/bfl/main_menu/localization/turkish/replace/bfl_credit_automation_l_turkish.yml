 AUTOMATED_SYSTEM_CREDIT: "Kredi Yönetimi"
 AUTOMATED_SYSTEM_CREDIT_DESC: "Devlet kredilerini ve tahvillerini yönetin. Bankanız ayrıca kredi devralmalarını inceler, nakde ihtiyacı olan borçlulara fonlu krediler sunar ve yedek nakitleri mevcut hisselere yatırır. Şirketler ticareti ve araştırmayı yönetir. Banka rezerv tutar ve borç kapasitesini kontrol eder; borçlular yeni kredileri kabul etmelidir."
 AUTOMATE_SYSTEM_TOOLTIP_CREDIT: "Otomasyonda Kredi Yönetimini Etkinleştirin: devlet borcu, banka kredileri, yatırımlar ve şirket operasyonları."
 DEAUTOMATE_SYSTEM_TOOLTIP_CREDIT: "Kredi Yönetimini devre dışı bırakın. Mevcut krediler, mevduatlar ve taahhüt edilen ödemelere hizmet verilmeye devam edilmektedir."
