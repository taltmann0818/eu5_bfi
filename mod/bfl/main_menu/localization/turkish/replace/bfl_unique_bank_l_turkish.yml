l_turkish:
 wisselbank_desc: "Şehrin kambiyo bankası, eski belediye binasının çatısı altında sikke ve senetleri toplayarak sınırları aşan ticareti düzene sokar. Rezervleri ve özenli defterleri kamu kredisine güveni korur. Tamamlanmış bir Wisselbank, imtiyazlı bankanın idare giderlerini şu oranda azaltır: 15% ve gerekli ilerlemelerden sonra parasal hizmetleri destekler."
 riksbank_desc: "Zümrelerin gözetimindeki kalıcı banka, krallığın rezervlerini saklar ve kamu kredisini düzenler. Kâtipleri mevduat kabul eder, yükümlülükleri kapatır ve devletin sözlerine güveni korur. Tamamlanmış bir Riksbank, imtiyazlı bankanın idare giderlerini şu oranda azaltır: 15% ve gerekli ilerlemelerden sonra parasal hizmetleri destekler."
