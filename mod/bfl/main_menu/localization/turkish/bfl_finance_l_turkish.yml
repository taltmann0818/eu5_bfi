 AM_bfl_chartered_bank: "Yeminli Banka"
 LEAD_bfl_chartered_bank: "Yeminli Banka denetleyicisi"
 MODIFIER_TYPE_DESC_bfl_enable_advanced_clearing: "Katılımcı kurumlar arasındaki doğrulanmış karşılıklı yükümlülüklerin net mutabakatının kilidini açar. Takas, her sahibinin hakkını korumalı ve fonlanan net bakiyeyi para yaratmadan kapatmalıdır. Yerel bankalararası mutabakat hala mevcut değil."
 MODIFIER_TYPE_DESC_bfl_enable_bank_capital_subscriptions: "Birincil aboneliklere izin verir 100 altın bir bankaya yatırıldı. Yeni sahiplik birimleri mevcut net varlık değeri üzerinden fiyatlandırılır. Abonelik gelirleri, gerçekleşen kar yerine ödenmiş sermayeyi artırır ve sonraki dağıtımlarda orantılı bir hak satın alır."
 MODIFIER_TYPE_DESC_bfl_enable_bank_share_dealing: "Banka hissesi transfer hizmetinin mevcut kayıtlı birimleri belirlenen sahipleri arasında taşımasına izin verir. Bir transfer, yeni birimler ihraç etmeden veya banka karı yaratmadan mülkiyeti değiştirir. Sicilin kapasitesi olmalı ve her sahibinin hakkını korumalıdır."
 MODIFIER_TYPE_DESC_bfl_enable_collateralization: "Kayıtlı teminat rehinlerinin ve bunların uygunluk kontrollerinin kilidini açar. İpotekli varlıklar ikinci bir hak talebinde bulunulamaz ve tahsilatın orijinal borç ilişkisini koruması gerekir. Yerel teminat uygulaması hâlâ mevcut değil."
 MODIFIER_TYPE_DESC_bfl_enable_commenda: "Denizaşırı Yatırım yolculuğu-ortaklık yetkisinin kilidini açar. Her girişim, tanımlanmış bir ortak, finanse edilen sermaye, kayıtlı bir kar paylaşımı sözleşmesi ve gerçekleşen gelirlerin ödenmesini gerektirir. Bu geliştirme yapısında proje yürütme kullanılamıyor."
 MODIFIER_TYPE_DESC_bfl_enable_commercial_bills: "Tamamen finanse edilen ödeme faturalarına izin verir. Alıcı öder 100 ihraç edilmeden önce altın; banka eşit borç ve nakit taahhüt kaydeder. Adı geçen kişi, faturayı bir ay sonra yalnızca bir kez kullanabilir. İhraç kar değildir."
 MODIFIER_TYPE_DESC_bfl_enable_commodity_forwards: "Merchant Finance ileri teslimat sözleşmelerinin kilidini açar. Her anlaşma, ipotekli envanteri yeniden kullanmadan karşı tarafını, mallarını, miktarını, teslimat tarihini ve desteğini kaydetmelidir. Yerel ticaret uygulaması kullanılamıyor."
 MODIFIER_TYPE_DESC_bfl_enable_commodity_investments: "Merchant Finance envanter yetkisinin kilidini açar. Emtia pozisyonları, finanse edilen yerli mal varlıklarını temsil etmeli ve satın alma maliyetini, miktarını ve saklamasını korumalıdır. Bu geliştirme yapısında ticaretin yürütülmesi kullanılamıyor."
 MODIFIER_TYPE_DESC_bfl_enable_company_equity: "Yurtdışı Yatırım şirketi sermaye yetkisinin kilidini açar. Mali hisseler siyasi konu kontrolünden ayrı olarak kaydedilir. Yalnızca doğrulanmış şirket dağıtımları banka geliri haline gelebilir; abonelikler ve sermaye iadesi hariçtir. Yerel yürütme kullanılamıyor."
 MODIFIER_TYPE_DESC_bfl_enable_corporate_credit: "Merchant Finance kurumsal kredi yetkisinin kilidini açar. Krediler, banka nakdini belirli bir kuruluşa aktarmalı ve eşit derecede geri kazanılabilir bir talep oluşturmalıdır; Anapara geri ödemeleri kâra dahil edilmez. Yerel yürütme kullanılamıyor."
 MODIFIER_TYPE_DESC_bfl_enable_debt_restructuring: "Egemen yeniden yapılandırma yetkisinin kilidini açar. Borçlunun mutabakatı ile revize edilen vade, faiz ve anaparanın mevcut alaca eklenmesi gerekmektedir. Yerli borç mutabakatı desteklenene kadar uygulama mümkün olmayacaktır."
 MODIFIER_TYPE_DESC_bfl_enable_liquidity_facilities: "Güvenli geçici likiditenin kilidini açar. Finansman gerçek bir karşı taraftan gelmeli, nakit ve sermaye limitleri dahilinde kalmalı ve kayıtlı teminat taşımalıdır. Sıraya alınan para çekme işlemlerinin önceliği korunur. Yerel tesis yürütmesi kullanılamıyor."
 MODIFIER_TYPE_DESC_bfl_enable_margining_and_risk_management: "Merchant Finance ileri pozisyonları için marj gereksinimlerinin kilidini açar. Risk, mevcut teminat ve nakde göre ölçülmeli ve taahhütler artmadan önce ek finansman gerekli olmalıdır. Yerel ticaret ve marj uygulaması hâlâ kullanılamıyor."
 MODIFIER_TYPE_DESC_bfl_enable_project_security: "Yurtdışı Yatırım projeleri için güvenliğin kilidini açar. Tanımlanan proje varlıkları ve gelirleri, öncelik takas veya geri kazanım yoluyla korunacak şekilde kayıtlı tek bir yükümlülüğe rehnedilmelidir. Yerel proje yürütme kullanılamıyor."
 MODIFIER_TYPE_DESC_bfl_enable_public_financial_backstops: "Yetkili bir sözleşmeli banka için genel destek yetkisinin kilidini açar. Yardım, gerçek bir hazine katkısı ve kayıtlı hak talepleri veya sahiplik birimleri gerektirir; garantiler nakit basamaz veya zararları silemez. Daimi geri döndürmez yürütme henüz uygulanmamıştır."
 MODIFIER_TYPE_DESC_bfl_enable_sovereign_banknotes: "Yetkili bir yeminli banka için devlet tahvili ihracının kilidini açar. Senetler itfa edilebilir yükümlülüklerdir; Destek, banknotların kendilerinin satılmasıyla elde edilen nakitleri kapsamaz. Yerel düzenleme ve sahip ödeme yönlendirmesi hâlâ kullanılamıyor."
 MODIFIER_TYPE_DESC_bfl_enable_term_deposits: "Sabit faizli mevduatlara izin verir 100 on iki ay vadeli altın. Faiz, hesap açıldığında kabul edilen oranda aylık olarak tahakkuk eder; olgunlaşmamış anapara geri alınamaz. Mevduat bankanın borcu olmaya devam ediyor."
 MODIFIER_TYPE_DESC_bfl_enable_warehouse_receipts: "Tanımlanan envanter partileri tarafından desteklenen Merchant Finance makbuzlarının kilidini açar. Her makbuz, ipoteksiz on birim ayırır ve finanse edilen bir saklama ücreti alır. Yeni makbuzların düzenlenebilmesi için yerli mal saklamanın desteklenmesi gerekmektedir."
 MODIFIER_TYPE_DESC_bfl_no_automatic_tribute_cost_modifier: "Charter ilişkisinin otomatik harcı yoktur. Devlet geliri mevduat faizlerinden ve sahip olunan banka hisselerinden elde edilen temettülerden gelir."
