 bfl_accept_money_claims.desc: "Mod etkileşimleri yoluyla eşit olarak sunulan, tamamen finanse edilen faturaları ve senetleri gönüllü olarak kabul edin veya kabul etmeyi bırakın. Bir transfer için hâlâ mevcut hazineniz gerekiyor. Kabul edilen talepler, kabul kapatıldıktan sonra kullanılabilir durumda kalır. Yerel ödemelerde altın kullanmaya devam ediliyor."
 bfl_accept_money_claims.title: "Banka ödeme taleplerinin kabulünü değiştir"
 bfl_accounts_explanation: "Yerel hazine nakittir. Mevduat ve senetler yükümlülüktür. Borç verme, bir varlık için nakit takası yapar; anapara, abonelikler ve ihraçlar kar değildir."
 bfl_activity_title: "Aylık aktivite bildirimi"
 bfl_activity_title_tip: "Yerel kupon gözlemleri yerel net bütçeyi sınıflandırır; altını asla iki kez taşımazlar. Yerleşik yerel getiri gelirleri, bir kazanç veya kayıp kabul edilmeden önce gerçek satın alma maliyetini serbest bırakır. Şirket dağıtımları ve özel fonlu makbuzlar kendi bölmelerine girer. Ana para, mevduat ve abonelikler kârın dışındadır."
 bfl_administer_estates: "Miras alınan finansal mülkleri yönetmek"
 bfl_administer_estates.desc: "Yıkılan bir kurumun ayrı olarak tutulan nakit parasını ve yükümlülüklerini inceleyin. Mütevelli makamı asla nakit parasını ulusal hazinenin bir parçası yapmaz."
 bfl_administer_estates.title: "Miras alınan finansal mülkleri yönetmek"
 bfl_administer_estates_desc: "Yıkılan bir kurumun ayrı olarak tutulan nakit parasını ve yükümlülüklerini inceleyin. Mütevelli makamı asla nakit parasını ulusal hazinenin bir parçası yapmaz."
 bfl_advanced_clearing: "Gelişmiş Takas"
 bfl_advanced_clearing_desc: "Birbirlerine çok sayıda borcu olan bankaların her borcu ayrı ayrı madeni parayla ödemesi gerekmiyor. Takas hesapları, alacak taleplerini uzlaştırır ve yalnızca kalan bakiyeyi aktararak ticareti sürdürmek için gereken parayı azaltır."
 bfl_advanced_tip: "Araştırma yetkinin kilidini açar. Banka aynı zamanda uzmanlık, likidite ve işletme gereksinimlerini de karşılamalıdır. Kullanılamayan yürütme devre dışı kalır."
 bfl_ai_equity_offering: "Bankayı kabul edin ve ödenmiş sermaye teklifini açın"
 bfl_ai_equity_offering_desc: "Yapay zeka yönetimi, Hisse Senedi İşlemleri ve takas tamamlandıktan sonra gerçek bankasını kabul edebilir ve ücretli birincil aboneliklere izin verebilir. Giriş sırasında nakit veya hisse oluşturulmaz."
 bfl_ai_equity_purchase: "Finanse edilen döviz yatırımını düşünün"
 bfl_ai_equity_purchase_desc: "Yapay zeka satın alımı, oyuncuyla aynı canlı araştırma, oluşturma, yetki, kapasite ve kesin fiyat onayı kontrollerini kullanır. Aylık fırsat incelemesi, en azından 500 nakit altın ve sermaye fazlası. Piyasa üstü hiçbir şey sormaz."
 bfl_ai_exchange_priority: "Borsa erişimine öncelik verin"
