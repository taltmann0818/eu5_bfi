 bfl_custom_bonds_title: "Devlet tahvilleri"
 bfl_custom_bonds_title_tip: "Banka, özel kalıcı devlet tahvillerini fonlamaktadır. Mevcut sahipler aylık kuponlar ve itibari değer itfası alırlar. Birleşik gümrük ve yerli borç kapasitesi 24 aylık yerli gelir ile 100-minimum altın; özel kuponlar en fazla tüketebilir 25% yerli gelir. Ödenmemiş kuponlar yeni kupon verilmesini ve yeniden satışını engeller."
 bfl_dealer_inventory_class: "Piyasa yapıcı envanteri · oy yok"
 bfl_debt: "Yerli borç portföyü"
 bfl_debt_explanation: "Yeminli banka, özel devlet tahvillerini fonlamaktadır. İkincil ticaret, erken etkinlik hibeleri de dahil olmak üzere her iki tarafta da tamamlanmış Menkul Kıymetler Borsası gerektirir. Yerel kredi, kabul edilen teklifleri ve kalıcı talep kayıtları ile araştırılmış borç ertelemesini kullanır."
 bfl_debt_facility: "Borç Kolaylığı"
 bfl_debt_resale: "Borç Yeniden Satışı"
 bfl_debt_resale_tip: "#T Devlet tahvilinin yeniden satışı#!\nİkincil devlet tahvillerini satmak ve satın almak, Borsa avansını ve sahip olunan bir Borsa binasını gerektirir. Açık bir teklif, aynı özel talebi aşağıdakiler için aktarır: 98% nominal değerde; ihraççı yeni gelir almaz. Kuponlar ve geri ödeme alıcıyı takip eder."
 bfl_debt_restructuring: "Borç Yeniden Yapılandırması"
 bfl_debt_restructuring_desc: "Belirlenen günde tahsil edilemeyen bir borcun değersiz olması gerekmez. Alacaklılar, sıkıntılı bir borçluyu doğrudan temerrüde düşürmek yerine, yeni şartları kabul ederek taleplerinin çoğunu koruyabilirler."
 bfl_debt_tip: "#T Borç ve kredi#!\nBorç verme, sigortalama, yeniden yapılandırma ve borç transferlerine ilişkin izinler. Her satırın kendi araştırma, uzmanlık, likidite ve yürütme gereksinimleri vardır. Kilit, yeni oluşturmanın mümkün olmadığı anlamına gelir; mevcut talepleri iptal etmez."
 bfl_demand_deposit: "Vadesiz Mevduat"
 bfl_deposit_1: "Mevduat 100 isteğe göre altın"
 bfl_deposit_1_tip: "#T Vadesiz mevduat#!\nAktarım 100 altını anlaşmalı bankanıza gönderin. Yeni hesap yıllık teklifi, görüntülenen taban ücret artı bir 1% kiralama primi. Talep faizi, finanse edildiğinde hazinenize aylık olarak yüzde taşıma ile ödenir; ödenmeyen faiz borcu devam ediyor. Mevcut hesaplar kabul edilen oranları korur. Para çekme, anaparayı ve ödenmemiş faizi geri öder. Bağımsız bankalar mevduatları diplomasi yoluyla kabul ediyor +50 görüş veya daha iyisi ve taban ücreti teklif edin."
 bfl_deposit_2: "Mevduat 100 için altın 12 aylar"
 bfl_deposit_2_tip: "#T Vadeli mevduat#!\nAktarım 100 altını on iki ay boyunca anlaşmalı bankanıza gönderin. Yeni hesap yıllık teklifi, görüntülenen dönem ücreti artı 1% kiralama primi. Faiz aylık olarak tahakkuk eder ve vade sonunda anaparayla birlikte ödenir. Yerel Bankacılık, izin verilen yaş ve ücretsiz hesap yuvası gerektirir. Bağımsız vadeli hesaplara diplomasi yoluyla ulaşılabilir: +50 görüş veya daha iyisi."
 bfl_deposit_decline_tip: "Depozito talebinin tamamını saklayın. Nakit hareketi yok ve hisse senedi ihraç edilmiyor."
 bfl_deposit_equity_tip: "Kote edilen talebi, yalnızca hayatta kalan bankanın pozitif somut NAV'a ve hissedar kapasitesine sahip olması durumunda gerçek hisselere dönüştürün. Hiçbir abonelik parası veya kazanç yaratılmaz."
 bfl_deposit_explanation: "Her hesap, kabul edilen sabit yıllık ücreti saklar. Oranın değiştirilmesi yeni hesapları etkiler. Vadeli hesaplar şu tarihten sonra olgunlaşır: 12 aylar. Para çekme eksiklikleri yükümlülük olarak kalmaya devam ediyor ve yeni taahhütleri askıya alıyor."
 bfl_deposit_haircut_tip: "Alıntılananı kabul et 20% Alacaklının, kalan alacak hakkının, araştırma ve yetkisinin yeniden kontrol edilmesinden sonra indirim yapılır. Kayıtlı bir kamu garantisi ayrı olarak finanse edilmeye devam eder."
 bfl_deposit_income_tip: "Bu ay anlaşmalı bankanız ve bağımsız bankalar tarafından ödenen talep faizi. Ödenmemiş faiz borcu devam ediyor. Anapara çekimleri ve sermaye katkıları hariçtir."
 bfl_deposit_interest: "Mevduat Faizi"
 bfl_deposit_ledger_help: "Her lot kabul edilen oranını korur. Eşleşen mevduat toplamı; vadeli mevduatlar şu tarihten sonra olgunlaşır: 12 aylar. Karantinaya alınan taleplerin borçluluğu devam eder ve geçerli bir alıcı mevcut olana kadar tahakkuk etmesi durdurulur. Emlak anaparası ve faizi aynı havuza geri döner."
 bfl_deposit_ledger_title: "Mevduat defteri ve hizmet"
 bfl_deposit_ledger_title_tip: "Banka yükümlülükleri, kabul edilen koşullar ve ödenmemiş alacaklar. Hizmet hiçbir zaman diplomatik kabulün devam etmesine bağlı değildir."
 bfl_deposit_policy_title: "Yeni para yatırma oranları"
 bfl_deposit_policy_title_tip: "#T Yeni para yatırma oranları#!\nYeni vadesiz hesapların kabul ettiği yıllık faiz oranını seçin.\n\nMevcut teklif: [Country.MakeScope.GetVariable('bfl_demand_rate').GetValue|%2]\nDönem hesabı teklifi: [Country.MakeScope.GetVariable('bfl_term_rate').GetValue|%2]\n\nMevcut hesaplar, açıldıklarında kararlaştırılan oranı korur. Aylık alacaklandırılan faiz, bankanın yükümlülüğünü artırır ve birikmiş karlarını azaltır; ödeme yapılıncaya kadar nakit taşımaz."
 bfl_deposits: "Mevduat ve oranlar"
 bfl_deposits_label: "Mevduat talepleri"
 bfl_dev_notice: "Finanse edilen kredi, devlet tahvilleri, şirket yatırımı, mallar, commenda ve parasal hizmetler araştırma, profil ve inşaat gereksinimlerini takip eder. Sürüm genelindeki kampanya dengesi ve uyumluluğu doğrulama aşamasındadır."
 bfl_distress: "Tehlike ve gelişme kapıları"
 bfl_distribution_title: "Kâr dağıtımı"
 bfl_distribution_title_tip: "#T Aylık hisse temettüleri#!\nDevlet temettü = devlet hisseleri Ã— ((aylık banka net geliri Ã— ödeme oranı) / ödenmemiş hisseler).\n\nÖdeme oranı: [Country.MakeScope.GetVariable('bfl_payout_ratio').GetValue|%0]\nMaliyetler ve taşınan zararlar sonrası net gelir: [Country.MakeScope.GetVariable('bfl_monthly_net_income').GetValue|2]@gold!\nEgemen hisseler: [Country.MakeScope.GetVariable('bfl_state_units').GetValue|2]\nÖdenmemiş hisseler: [Country.MakeScope.GetVariable('bfl_total_units').GetValue|2]\nSon toplam temettüler: [Country.MakeScope.GetVariable('bfl_dividend_paid').GetValue|2]@gold!\nSon egemen temettü: [Country.MakeScope.GetVariable('bfl_state_dividend_paid').GetValue|2]@gold!\n\nEgemen başlangıçta sahip olur 100%. Yeni banka abonelikleri sermayeyi artırıyor ve mülkiyeti zayıflatıyor. Nakit, sermaye ve ödenmemiş yükümlülükler, finanse edilen ödemenin üst sınırıdır. Negatif gelir temettü ödemez; dağıtılmayan kar gelecek ay tekrar sayılmaz. Anapara, mevduatlar, abonelikler ve borçlanmalar hariçtir."
 bfl_dividend_explanation: "Mevduat faizi, faaliyet giderleri ve taşınan zararlar fonu temettüleri sonrası aylık net gelir. Her sahip, sahip olunan hisseleri, ödenmemiş hisse başına finanse edilen ödemeyle çarparak alır. Birikmiş karlar gelecek ay tekrar dağıtılmayacaktır."
 bfl_draw_bond: "Borç al 100 bankadan"
 bfl_draw_bond_tip: "Anlaşmalı banka ödüyor 100 kalıcı bir devlet tahvili karşılığında altın. Korumalı nakit, sermaye ve ihraççının borç kapasitesine bağlı olarak ayda bir ihraç. Gelirler finansmandır. Kullanımdan kaldırılması için mevcut sahibine nominal değerini geri ödeyin."
 bfl_equity_debt: "Banka özsermayesi ve borcu"
 bfl_equity_debt_tip: "#T Banka özsermayesi ve borcu#!\nOn iki adede kadar gerçek aylık ödeme anlık görüntüsü. Yeşil, varlıklar eksi yükümlülüklerdir; kırmızı bankanın toplam yükümlülükleridir. Her ikisi de negatif özsermaye de dahil olmak üzere aynı otomatik olarak ölçeklenen altın eksenini kullanır. Örnekler soldaki en eskiden sağdaki en yeniye doğru ilerler. Değeri ve muhasebe ayı için bir örneğin üzerine gelin. Devlet kredileri bu bankanın geçmişine dahil değildir."
 bfl_equity_label: "Banka özsermayesi"
 bfl_equity_label_tip: "#T Banka özsermayesi#!\nBankanın sahiplerine yükümlülüklerinden sonra ait olan kalıntı değer.\n\nVarlıklar: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_assets')|2]@gold!\nDaha az toplam borç: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_liabilities')|2]@gold!\nÖzsermaye: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_equity')|2]@gold!\n\nKaydedilen durum birimleri: [Country.MakeScope.GetVariable('bfl_state_units').GetValue|2]\nToplam sahiplik birimleri: [Country.MakeScope.GetVariable('bfl_total_units').GetValue|2]\nSermaye boşluğu: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_capital_headroom')|2]@gold!\n\nNegatif özsermaye iflas anlamına gelir. Sermaye tavan payı yukarıda özsermayedir 10% minimum sıfır olmak üzere varlıkların sayısı; dağıtımlar hem bu boşluk hem de mevcut nakit ile sınırlıdır. Özsermaye hemen çekilebilecek miktar değildir."
 bfl_equity_market: "Hisse fiyatı ve geçmişi"
 bfl_equity_subscribe_0: "Hazine: abone ol 100 altın"
 bfl_equity_subscribe_0_tip: "Birincil NAV aboneliği: ihraççıya ödeme yapar ve mevcut sahipleri sulandırır. Emlak satın alımlarında gerçek emlak cüzdanı kullanılır ve 25 altın. Bir banka yatırımcısı yalnızca kendi korumalı nakit ve sermaye fazlasını kullanır; şirket sermayesi Yurtdışı Yatırım araştırmasını gerektirir."
 bfl_equity_subscribe_1: "Burghers: abone olun 100 altın"
 bfl_equity_subscribe_1_tip: "Birincil NAV aboneliği: ihraççıya ödeme yapar ve mevcut sahipleri sulandırır. Emlak satın alımlarında gerçek emlak cüzdanı kullanılır ve 25 altın. Bir banka yatırımcısı yalnızca kendi korumalı nakit ve sermaye fazlasını kullanır; şirket sermayesi Yurtdışı Yatırım araştırmasını gerektirir."
