 bfl_workout_trade_access_desc: "Ticari koruma, iki yıla kadar ayrı olarak kabul edilen bir tahvil anlaşmasıyla kaldırılır. Mevcut olağan ticari erişim anlaşmaları bu imtiyazdan bağımsızdır."
