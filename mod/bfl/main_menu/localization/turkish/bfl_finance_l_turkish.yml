 bfl_venture_preset_0: "Tek taraflı · 75% banka fazlası"
 bfl_venture_preset_1: "İki taraflı · eşit fazla"
 bfl_venture_preset_tip: "Tek taraflı: banka tüm sermayeyi finanse eder ve alır 75% fazlalık. İki taraflı: üçte ikisi banka tarafından finanse edilir, üçte biri operatör tarafından sağlanır, fazlalık eşit olarak bölünür. Zararlar sermaye katkılarını takip eder."
 bfl_venture_settings_tip: "Önerilen terimleri genişletin. Değişiklikler yalnızca gelecekteki teklifleri etkiler; Kabul edilen projeler orijinal sözleşmelerini korur."
 bfl_venture_state_1: "Aktif · risk altındaki sermaye"
 bfl_venture_state_2: "Kapalı · sermaye geri kazanıldı"
 bfl_venture_state_3: "Kapalı · zarar kabul edildi"
 bfl_venture_state_4: "Finanse edilmedi · uygulama mevcut değil"
 bfl_venture_subtitle: "Adlandırılmış faaliyetler · ölçülen maliyetler ve satışlar"
 bfl_venture_ticket_100: "Finansman limiti · 100 altın"
 bfl_venture_ticket_200: "Finansman limiti · 200 altın"
 bfl_venture_ticket_400: "Finansman limiti · 400 altın"
 bfl_venture_ticket_tip: "Maksimum banka yetkilendirmesini değiştir 100, 200 veya 400 altın. Yalnızca faaliyetin fiili maliyeti çizilir. Kullanılmayan kargo finansmanı derhal serbest bırakılır; Kullanılmayan sefer finansmanı, vadeye kadar uygun bir keşfedilen alan kargosu için ayrılmış olarak kalır. İkili şartlar, operatörden banka yetkilendirmesinin yarısı kadar kapasite gerektirmektedir."
 bfl_venture_title: "Övgü girişimleri"
 bfl_ventures: "Girişimler ve şirketler · Yurtdışı Yatırım"
 bfl_ventures_explanation: "Commenda Discovery'de başlar; yerli şirketler ve şirket sermayesi Reformasyona ihtiyaç duyar. Siyasi derebeylik kontrolü ve mali mülkiyet ayrı kalır. Proje sermayesi temettü değildir."
 bfl_ventures_tip: "#T Girişimler ve şirketler#!\nFinanse edilen girişimler, şirket yatırımları, proje güvenliği ve banka hissesi transferlerine ilişkin izinler. Bunlar sermayeyi yatırım riskine maruz bırakır ve ilgili araştırma ve uzmanlığı gerektirir."
 bfl_warehouse_receipt: "Depo Fişi"
 bfl_warehouse_receipt_tip: "#T Depo makbuzu#!\nTanımlanabilir depolanmış mallara karşı hak talebinde bulunun. Depo Makbuzları araştırması, Ticari Finansman ve Mutlakiyetçilik çağı veya sonrası gerektirir. Doğrulanmış depolama ve mal yürütme bu yapıda mevcut değil."
 bfl_warehouse_receipts: "Depo Fişleri"
 bfl_warehouse_receipts_desc: "Saygın bir depoda tutulan mallar, her satışta taşınmadan ticareti destekleyebilir. Bir makbuz, depolanan mal üzerinde hak talebinde bulunulmasını sağlar ve mallar gözaltındayken sahibinin finansman elde etmesine olanak tanır."
 bfl_withdraw: "Vadesi geçmiş devlet mevduatlarının çekilmesi"
 bfl_withdraw_tip: "#T Vadesi geçmiş devlet mevduatlarının çekilmesi#!\nEyaletinizin vadesiz hesaplarının ve vadesi dolmuş vadeli hesaplarının geri ödenmesini talep edin. Banka, ana para ve alacaklı faizini mevcut nakitten öder. Ödenmeyen tutarlar para çekme kuyruğunda kayıtlı kalır ve yeni işlerin askıya alınmasına neden olur. Bu işlemle yurt dışı hesaplar ve vadesi gelmemiş vadeli mevduatlar çekilemez."
 bfl_workout_decline: "Hak talebinin tamamını koruyun"
 bfl_workout_desc: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_workout_bank').GetCountry.GetName] depozitonuz için koşullar önerir [ROOT.GetCountry.MakeScope.GetVariable('bfl_workout_claim').GetValue|2] altın. Feragat edebilirsiniz 20% kalan hak talebinin tamamını dönüşüm öncesi maddi NAV'da yeni ihraç edilen hisselere dönüştürün veya talebinizi koruyun. Dönüşüm, pozitif NAD ve hissedar kapasitesi gerektirir ve banka alacaklıları için mümkün değildir. Alacaklı havuzu [ROOT.GetCountry.MakeScope.GetVariable('bfl_workout_pool').GetValue|0]: 0 hazine, 1 kasabalılar, 2 soylular, 3 din adamları, 4 köylüler. Site şartları, o sitenin yürürlüğe konmuş Çalışma Talimatını gerektirir. Fiyat teklifinin süresi bu ay doluyor; kurtarma veya yönetim değişikliği bunu geçersiz kılar."
 bfl_workout_equity: "Hak talebini hisselere dönüştürün (pozitif NAV gereklidir)"
