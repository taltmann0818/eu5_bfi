 bfl_banking_finance_companies__reduced_motion: "Azaltılmış hareket"
 bfl_banking_finance_companies__reduced_motion_desc: "Statik işlem makbuzlarını ve uyarılarını kullanın. Taahhüt edilen ödemelerden sonra kısa, tek işlem vurgularına izin vermeyi devre dışı bırakın; döngüsel finansal flaşlar yok."
 bfl_banking_finance_companies__reduced_motion_name: "Azaltılmış hareket"
