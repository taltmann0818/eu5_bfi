 bfl_goods_previous: "Önceki partiler"
 bfl_goods_quote_desc: "miktar: [ROOT.GetCountry.MakeScope.GetVariable('bfl_goods_quote_quantity').GetValue|3]. Fiyat: [ROOT.GetCountry.MakeScope.GetVariable('bfl_goods_quote_price').GetValue|2] altın artı 1 altın saklama ücreti. Depo fişi malın hemen sahibi olur. Fiziksel bir ileri üç ay içinde teslimatın tamamının ön ödemesini yapar. Her ikisi de destekli ürünler gerektirir. Depolama maliyetleri 0.1 ayda; fiziksel kayıp 2% yıllık. Forward sabit miktarını korur: eksik birimler orantısal olarak iade artı eşit satıcı güvenlik tazminatı verir. Başka bir pazara teslimat iki ay sürüyor, maliyetler 1 altın ve kaybeder 1% miktar. Depolama ve taşıma kayıpları, teslim miktarını azaltır. Geçersiz taraflar veya kaybedilen erişim, malları ve teminatları geri alınmak üzere saklar. Yalnızca bu koşullar size uygunsa kabul edin."
 bfl_goods_quote_title: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_goods_quote_type').Goods.GetNameWithNoTooltip] depo makbuzu"
 bfl_goods_set_allocation_tip: "Döngü 0%, 10%, 25% veya 50% banka nakit artı sahip olunan stok maliyeti. Korunan nakit her zaman korunur. Tahsisin azaltılması, erişilebilir serbest pozisyonların hedefin altına kadar satılmasına neden olur."
 bfl_goods_set_contracts_tip: "Yalnızca spot, otomatik olarak makbuz teklif edin veya otomatik olarak fiziksel iletme teklif edin. Teklifler, enstrümanın yaşını ve araştırmasını gerektirir, desteklenir ve karşı tarafın ayrı olarak kabul edilmesini bekler. Mevcut kabul edilen yükümlülükler korunmaya devam eder."
 bfl_goods_set_mandate_tip: "Otomatik: Poliçeniz kapsamında alım ve satım yapın. Duraklatıldı: isteğe bağlı işlem yok. Kaçmak: Erişilebilir ücretsiz envanteri değiştirmeden satmak. Tüm modlarda mevcut sözleşmeler, depolama ve kayıplar devam ediyor."
 bfl_goods_set_risk_tip: "Dikkatli: kâr edin +10%, kaybı durdur −5%. Dengeli: +20% / −15%. Maceracı: +35% / −25%. Limitler, kalan maliyete karşılık yerel satış tekliflerini kullanır; uygulama aylıktır ve fiyatlar değişebilir."
 bfl_goods_set_turnover_tip: "Maksimum tutma süresi: 6, 12 veya 24 aylar. Banka, vade sonunda erişilebilir serbest pozisyonları satar ve yeni malları otomatik olarak seçer."
 bfl_goods_settings: "Ticaret politikası"
 bfl_goods_settings_tip: "Bankanın yetkisini, tahsisini, risk limitlerini, elde tutma süresini ve sözleşme politikasını belirleyin. Banka tüm malları ve miktarlarını aylık kapanışta seçiyor."
 bfl_goods_tip: "#T Mal ve ticaret#!\nEnvanter, makbuz, gelecekteki teslimat ve marjı içeren Ticari Finansman araçları. Kayıtlı izin, mal veya ticaret yolu oluşturmaz; fiziksel yürütme gereklidir."
 bfl_goods_trading_locked: "Ticaret kilitlendi · gereksinimler için fareyle üzerine gelin"
 bfl_goods_transfer_desc: "Fiyat: [ROOT.GetCountry.MakeScope.GetVariable('bfl_goods_transfer_price').GetValue|2] altın. miktar: [ROOT.GetCountry.MakeScope.GetVariable('bfl_goods_transfer_quantity').GetValue|3]. Ödemeniz mevcut sahibine gider. Velayet bankada kalır; depolama, bozulma ve teslim süreleri devam etmektedir. Kabul, değişen desteği, sahibi, parti oluşumunu veya fiyatı reddeder."
 bfl_goods_transfer_title: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_goods_transfer_type').Goods.GetNameWithNoTooltip] makbuz transferi"
