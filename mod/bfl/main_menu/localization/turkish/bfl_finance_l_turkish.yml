 bfl_cost_contracts: "Özel finansal sözleşmeler: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_operating_contracts_count')|0] × 0.10"
 bfl_cost_current: "Mevcut aylık maliyet: #R [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_operating_expense')|2]@gold!#!"
 bfl_cost_payment_detail: "Maliyetler varlık değerine göre değil, karmaşıklığa göre artar. Korunan rezervlerin üzerinde ayda bir kez ücret alınır; ödenmemiş giderler temettüyü kısıtlar. Mevduat faizi ve yerel giderler ayrıdır. İndirimler bir araya getirilir; toplam sente yuvarlanır."
