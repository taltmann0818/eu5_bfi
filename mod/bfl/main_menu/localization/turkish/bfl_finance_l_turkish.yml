 bfl_credit_1_desc: "Bir banka teklif ediyor 100 için altın 60 Aylık olarak belirtilen yıllık oran üzerinden. Kabul, finansmanı, yetkiyi, borç kapasitesini ve uygunluğunuzu yeniden kontrol eder. Anapara finansmandır, gelir değil.\nYıllık ücret: [ROOT.GetCountry.MakeScope.GetVariable('bfl_credit_offer_rate').GetValue|%1]."
 bfl_credit_1_title: "Kredi teklifi"
 bfl_credit_2_desc: "Borç vereniniz bir teklif sunuyor 20% anapara indirimi ve yıllık yüzde bir puanlık faiz indirimi (minimum 1%). Bu yalnızca mevcut teminatsız krediyi değiştirir. Vadesi değişmeden kalır."
