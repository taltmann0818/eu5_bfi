 bfl_resolution_guarantee_command: "Garantiyi yetkilendir"
 bfl_resolution_guarantee_command_tip: "Düzenli çözüm, yeni taahhütleri ve dağıtımları dondurur. Ayrılmış para ve emanet rezervleri korunmaya devam eder; Mevduatlar, mevcut nakitleri gider borçları ve özsermayeden önce orantılı olarak paylaştırır. Kayıp alacaklılar haklarını saklı tutar. Gönüllü şartlar, mevcut alacaklının onayını ve Renaissance Debt Restructuring'i gerektirir. Kamu garantisi şunları kapsar: 50% kabul edilen mevduat zararlarının toplamı 100 kayıtlı hükümdarı tarafından finanse edilen toplam altın; ödenmemiş çağrılar beklemede kalır. Kapatma, tüm yükümlülüklerin ve nakit dışı varlıkların temizlenmesini gerektirir. Kapatılan siteler yeniden açılamaz."
 bfl_resolution_heading: "Çözüm ve alacaklı kurtarma"
 bfl_resolution_heading_tip: "Kalıcı finansal çözüm; nakit geri kazanımları ve mutabakata varılan değişiklikler, kazançlardan ayrı olarak kaydedilir."
 bfl_resolution_help: "Teminatlı ve saklama rezervleri → orantılı mevduatlar → ödenmemiş giderler → kalan hissedarlar. Talepler eksikliklerden ve kaynak yetkisinin kaybından sonra varlığını sürdürür. Şartları sunmadan önce çözünürlüğü girin."
 bfl_resolution_liquidate_command: "Mevcut varlıkları hayata geçirin"
 bfl_resolution_liquidate_command_tip: "Erişilebilir, ipoteksiz yerel envanter satabilir ve mevcut hizmetleri aracılığıyla vadesi geçmiş mevduatları, faturaları ve senetleri toplayabilirsiniz. Gerçek makbuzlar kurtarma şelalesini finanse ediyor. Kullanılamayan veya olgunlaşmamış pozisyonlar kayıtlı kalır; hiçbir taşıma değeri altın haline gelmez."
 bfl_resolution_next_command: "Sonraki mevduat hesabı"
 bfl_resolution_next_command_tip: "Aktif mevduat hesaplarını değiştir. Veraset alacaklıları, hükümetlerinin gönüllü şartları kabul edebilmesi için, kendi Çalışma Talimatlarının yürürlüğe girmesine ihtiyaç duyarlar. Ödemeler kayıtlı hazineye veya emlak cüzdanına geri döner."
 bfl_resolution_notice_acknowledge: "Nihai sonucu kabul edin"
 bfl_resolution_notice_desc: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_notice_bank').GetCountry.GetName] mali faaliyetlerini kapatmıştır.\n\nÖdenen depozito geri ödemeleri: [ROOT.GetCountry.MakeScope.GetVariable('bfl_notice_bank').GetCountry.MakeScope.GetVariable('bfl_resolution_paid').GetValue|2]@gold!\nKabul edilen mevduat zararları: [ROOT.GetCountry.MakeScope.GetVariable('bfl_notice_bank').GetCountry.MakeScope.GetVariable('bfl_resolution_waived').GetValue|2]@gold!\nKaydedilen yasal kayıplar: [ROOT.GetCountry.MakeScope.GetVariable('bfl_notice_bank').GetCountry.MakeScope.GetVariable('bfl_resolution_statutory_loss').GetValue|2]@gold!\n\nKaydedilen kayıplar ödenmemiş tutarlardır; geri kazanımlar veya yeni gelirler değildir. Tarihsel mülkiyet ve nihai mülk kayıtlı kalır; Kapatılan kurum tekrar açılamaz."
 bfl_resolution_notice_title: "Banka kararı kapatıldı"
 bfl_resolution_offer_command: "Alacaklı şartları teklif edin"
 bfl_resolution_offer_command_tip: "Düzenli çözüm, yeni taahhütleri ve dağıtımları dondurur. Ayrılmış para ve emanet rezervleri korunmaya devam eder; Mevduatlar, mevcut nakitleri gider borçları ve özsermayeden önce orantılı olarak paylaştırır. Kayıp alacaklılar haklarını saklı tutar. Gönüllü şartlar, mevcut alacaklının onayını ve Renaissance Debt Restructuring'i gerektirir. Kamu garantisi şunları kapsar: 50% kabul edilen mevduat zararlarının toplamı 100 kayıtlı hükümdarı tarafından finanse edilen toplam altın; ödenmemiş çağrılar beklemede kalır. Kapatma, tüm yükümlülüklerin ve nakit dışı varlıkların temizlenmesini gerektirir. Kapatılan siteler yeniden açılamaz."
 bfl_resolution_pay_command: "Ödeme kurtarma"
 bfl_resolution_pay_command_tip: "Düzenli çözüm, yeni taahhütleri ve dağıtımları dondurur. Ayrılmış para ve emanet rezervleri korunmaya devam eder; Mevduatlar, mevcut nakitleri gider borçları ve özsermayeden önce orantılı olarak paylaştırır. Kayıp alacaklılar haklarını saklı tutar. Gönüllü şartlar, mevcut alacaklının onayını ve Renaissance Debt Restructuring'i gerektirir. Kamu garantisi şunları kapsar: 50% kabul edilen mevduat zararlarının toplamı 100 kayıtlı hükümdarı tarafından finanse edilen toplam altın; ödenmemiş çağrılar beklemede kalır. Kapatma, tüm yükümlülüklerin ve nakit dışı varlıkların temizlenmesini gerektirir. Kapatılan siteler yeniden açılamaz."
 bfl_resolution_resume_command: "İyileşmeden sonra devam et"
 bfl_resolution_resume_command_tip: "Düzenli çözüm, yeni taahhütleri ve dağıtımları dondurur. Ayrılmış para ve emanet rezervleri korunmaya devam eder; Mevduatlar, mevcut nakitleri gider borçları ve özsermayeden önce orantılı olarak paylaştırır. Kayıp alacaklılar haklarını saklı tutar. Gönüllü şartlar, mevcut alacaklının onayını ve Renaissance Debt Restructuring'i gerektirir. Kamu garantisi şunları kapsar: 50% kabul edilen mevduat zararlarının toplamı 100 kayıtlı hükümdarı tarafından finanse edilen toplam altın; ödenmemiş çağrılar beklemede kalır. Kapatma, tüm yükümlülüklerin ve nakit dışı varlıkların temizlenmesini gerektirir. Kapatılan siteler yeniden açılamaz."
 bfl_review_trade: "Ticareti inceleyin"
 bfl_review_trade_tip: "Seçilen birimleri ve tam ödemeyi inceleyin. Bir satış en az şuna yuvarlanmalıdır: 0.01 altın; İnceleme kullanılamıyorsa miktarı artırın. Geçerli bir ticaret çözülene kadar hiçbir diplomat harcanmaz."
 bfl_safeguards_title: "Likidite ve güvenceler"
 bfl_safeguards_title_tip: "#T Likidite ve güvenceler#!\nMevcut banka parası: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_free_cash')|2]@gold!\nKorumalı nakit ihtiyacı: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_protected_cash')|2]@gold!\nSıraya alınan para çekme işlemleri: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_withdrawals_due')|2]@gold!\n\nYeniden sermayelendirme devlet sermayesi sağlar. Mevduatların askıya alınması, mevcut yükümlülükleri korurken yeni hesap fonlamasını da durdurur."
 bfl_sale_unavailable: "Hisse emri yerine getirilemedi"
 bfl_sale_unavailable_desc: "İhraççının bir aylık işlem bekleme süresi vardır, diplomatınız yoktur, teklifinizin süresi dolmuştur veya mevcut hisseler, fonlar veya borsa erişimi değişmiştir. Yeni bir fiyat teklifi için hisse alımlarını veya satışlarını yeniden açın. Hiçbir nakit ya da hisse taşınmadı."
 bfl_secured_liquidity: "Güvenli Likidite"
 bfl_secured_liquidity_tip: "#T Güvenli likidite#!\nMutlakiyetçilik, Teminatlandırma ve Likidite İmkanları. İlerleme 75 ayrı olarak finanse edilen bir fona karşı altın 100-altın üçüncü banka bonosu. Teminat bir kez kilitlenir. Kabul edilen sabit yıllık oran şuna bölünür: 12. Bankalar arasında şubeye gerek yoktur."
 bfl_security_bank_results: "Son banka kapanışı"
 bfl_security_financial_heading: "Somut mali durum"
 bfl_security_financial_subtitle: "Hisse fiyatını neler destekliyor?"
 bfl_security_financial_title: "Özsermaye [Country.GetName]"
 bfl_security_price_heading: "Hisse fiyatı ve sahiplik"
 bfl_security_price_math: "Piyasa fiyatı = hisse başına somut NAV × aylık piyasa primi. Sipariş baskısı, oynaklık, ortalamanın tersine dönmesi ve sıkıntı bu primi değiştirebilir. Birincil sermaye NAV seviyesinde fiyatlanmaya devam ediyor; Gerçekleşmemiş kazançlar kredi veya temettüleri finanse etmez."
 bfl_security_primary_note: "Temettüler nakit ve NAV'ı bir kez azaltır. Yeni sermaye NAV üzerinden fiyatlanıyor ve herhangi bir satın alma baskısı sinyali yaratmıyor. Bayinin yeniden satış teklifi NAV'ı aştığında abonelikler duraklatılır ve anında kâr garantisi önlenir. Tarih gerçek gözlemleri içerir; yeniden yükleme, kaydedilen aylık şoku yeniden kaydetmez."
 bfl_select_buy_shares: "Banka ve şirket hisselerini satın alın"
 bfl_select_profile: "Bekleyen uzmanlığı seçin"
 bfl_select_profile_tip: "#T Banka uzmanlığı#!\nBu banka henüz kalıcı bir profil seçmediyse uzmanlık seçeneğini açın. Ticari Finansman ve Yurtdışı Yatırım farklı araştırma yolları açar. Tamamlanmış bir uzmanlık bu düğmeyle değiştirilemez."
 bfl_select_sell_shares: "Sahip olduğunuz hisseleri satmak"
 bfl_selector_next: "Sonraki bankalar"
 bfl_selector_previous: "Önceki bankalar"
 bfl_sell_confirm_desc: "Sat [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_quantity').GetValue|3] hisseleri [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_issuer').GetCountry.GetName] için [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_total').GetValue|2]@gold!. Gizli piyasa yapıcı, kotasyon geçerli olduğu sürece kote edilmiş işlem spreadi de dahil olmak üzere bu satışı garanti eder. Hisse senetleri portföyünüzden anında çıkar; arka plandaki yapay zeka satın alımları ödemeyi geciktirmez. Gelirler bankanızın hazinesine gider. Anlaşma bir diplomat tüketir ve bu ihraççının bir aylık alım/satım bekleme süresini başlatır."
 bfl_sell_confirm_title: "Anında hisse satışını onaylayın"
 bfl_sell_shares: "Hisse satmak"
 bfl_sell_shares_desc: "Varlıklarınızdan birini ve miktarını seçin. Gizli piyasa yapıcı, hisselerinizi anında piyasa fiyatından, gösterilen bayi spreadi düşülerek satın alır. Yapay zeka bankaları envanterini arka planda satın alıyor."
 bfl_sell_shares_tip: "Varlıklarınızdan birini ve miktarını seçin. Gizli piyasa yapıcı, hisselerinizi anında piyasa fiyatından, gösterilen bayi spreadi düşülerek satın alır. Yapay zeka bankaları envanterini arka planda satın alıyor.\nTamamlanmış bir takas, Hisse Senedi İşlemi ve en az bir diplomat gerektirir. Her başarılı ticaret bir diplomat tüketir ve o ihraççı için bir aylık bekleme süresini başlatır. Mevcut diplomatlar: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bfl_available_trade_diplomats')|2]. Siparişlerin nakit değeri en az olmalıdır 0.01 altın."
 bfl_sell_state_confirm_desc: "Sat [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_quantity').GetValue|3] hazinenizin hisseleri [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_issuer').GetCountry.GetName] için [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_total').GetValue|2]@gold!, ülkenizin hazinesine ödenir. Banka finansman almıyor ve ihraç edilen hisseler değişmiyor. Gizli krupiyer, kote edilmiş krupiyer spreadi de dahil olmak üzere görüntülenen kotasyonu garanti eder. Anlaşma bir diplomatı tüketir ve bu ihraççı için bir aylık alım/satım bekleme süresini başlatır. Kiralamanızın parasal otoritesi yanınızda kalır."
