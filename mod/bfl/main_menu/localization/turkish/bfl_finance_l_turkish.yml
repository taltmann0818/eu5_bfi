 bfl_margining: "Kenar boşluğu"
 bfl_margining_and_risk_management: "Marj ve Risk Yönetimi"
 bfl_margining_and_risk_management_desc: "Gelecekte teslimat sözü veren satıcılar, sözleşmelerinin süresi dolmadan çok önce değişen fiyatlarla karşı karşıya kalıyor. Riskler arttıkça ek güvenliğe ihtiyaç duyulması, bankacılara, olumsuz bir piyasa temerrüde düşmeden önce kayıpları kontrol altına alma olanağı sağlar."
 bfl_margining_tip: "#T Marj ve risk yönetimi#!\nDeğişen emtia riskine karşı teminat ve değişim marjı talep edin. Marjlama ve Risk Yönetimi araştırması, Ticari Finansman ve Devrimler çağı gerektirir. Bu yapıda mal destekli marj uygulaması mevcut değildir."
 bfl_market_sort_price: "Hisse başına fiyata göre sırala"
 bfl_monetary: "Para politikası ve likidite"
 bfl_monetary_explanation: "Paranın, egemen otoriteye ve tamamlanmış bir Merkez Bankasına sahip rezerve edilmiş tahvillerle değiştirilmesi. Teminatlandırma ve Likidite İmkanları sonrasında üçüncü banka bonolarının iskonto edilmesi; Revolutions, finanse edilen üye ağı ve sınırlı kamu güvenceli destek ekler. Kabul edilen fiyatlar sabit kalır."
 bfl_monetary_tip: "#T Parasal araçlar#!\nDevlet tahvilleri, güvenli likidite, takas ve kamu desteği için ileri yaş izinleri. Her biri kendi yetkilendirmesini, desteğini ve çalışma koşullarını gerektirir."
 bfl_money_accept: "Kabul ve indirimleri aç/kapat"
 bfl_money_accept_tip: "Tamamen saklı bir talep için notlar takas türü. Kabul isteğe bağlıdır. İndirimler avans 75 a'ya karşı altın 100-altın üçüncü banka bonosu. Takas, vadesi geçmiş faturaların eşleştirilmesi ancak her üyenin net borcunu ödeyebilmesi durumunda gerçekleşir. Mevcut iddialar, kaybedilen yetki ve binalardan varlığını sürdürüyor."
 bfl_money_acceptance_action: "Gönüllü kabulü değiştir"
 bfl_money_authorize: "Notları yetkilendir"
 bfl_money_authorize_tip: "Egemen kontrolör, imtiyazlı bankasına yetki verir. Mevcut sermayede devlete ait tamamlanmış bir Merkez Bankası gerekmektedir. Yeni ihraç aynı zamanda ihraççının sermayesinin Banka Şubesi ve senet araştırmasını da gerektiriyor."
 bfl_money_clear: "Üye faturalarını ödeme"
 bfl_money_clear_open: "Girişi temizleme"
 bfl_money_clear_open_tip: "Takas grubunuza girişi açın veya kapatın. Revolutions, Clearing House ve Advanced Clearing araştırması ile bankanın veya onun canlı devletinin sahip olduğu tamamlanmış bir Takas Odası gerektirir. Maksimum dört üye."
 bfl_money_clear_tip: "Bu ay bir kez, vadesi dolmuş üye faturalarını eşleştirin. Her üye, diğer rezervleri korurken net borcunu karşılamak zorundadır. Kısa bir üye tüm partiyi korur. Rehinli ve üye olmayan talepler hariçtir."
 bfl_money_empty: "Dolaşımda banknot yok. Parasal araştırma, otorite ve tamamlanmış binalar yeni hizmetlerin kilidini açar."
 bfl_money_empty_tip: "Tamamen saklı bir talep için notlar takas türü. Kabul isteğe bağlıdır. İndirimler avans 75 a'ya karşı altın 100-altın üçüncü banka bonosu. Takas, vadesi geçmiş faturaların eşleştirilmesi ancak her üyenin net borcunu ödeyebilmesi durumunda gerçekleşir. Mevcut iddialar, kaybedilen yetki ve binalardan varlığını sürdürüyor."
