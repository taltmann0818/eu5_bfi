 bfl_venture_accept: "Ortaklığı kabul et"
 bfl_venture_accept_tip: "Canlı yatırımcı otoritesini, değişmeyen teklif koşullarını, yaşı, araştırmayı, bedava nakiti, sermayeyi, kapasiteyi ve operatör katkısını yeniden kontrol edin. Finansman yalnızca seçilen etkinliğin gerçek yerel maliyetini öder. Hiçbir şirket hissesine veya siyasi kontrole izin vermez."
 bfl_venture_decline: "Reddet"
 bfl_venture_duration_12: "Süre · 12 aylar"
 bfl_venture_duration_120: "Süre · 120 aylar"
 bfl_venture_duration_24: "Süre · 24 aylar"
 bfl_venture_duration_6: "Süre · 6 aylar"
 bfl_venture_duration_60: "Süre · 60 aylar"
 bfl_venture_duration_tip: "Döngü 6, 12, 24, 60 veya 120 aylar. Uzun vadeler yerel keşiflere uygundur. Yerel erişim geçerli kalırsa kargo iki ay sonra satılır; bloke kargo gözaltında kalır. Bağlantılı satış geliri olmayan keşif masrafları vade sonunda silinir."
 bfl_venture_empty: "Aktif girişim yok. Şartları teklif etmeden önce bir kargo operasyonu veya yerel sefer seçin."
 bfl_venture_help: "Döngü yapmak için bir terimi tıklayın. Her operatör ayrı ayrı kabul eder. Mevcut anlaşmalar bir politika veya araştırma değişikliğinden sonra da devam eder."
 bfl_venture_hint: "Etkinlik, maliyetler, kargo ve iadeler için fareyle üzerine gelin"
 bfl_venture_locked: "Yeni girişimler kilitlendi · gereksinimler için fareyle üzerine gelin"
 bfl_venture_note: "Sermaye kârdan önce geri alınır. Kayıplar katkıları takip eder. Yalnızca adı geçen operasyonun edindiği kargo, gelirlerini finanse edebilir. İlgisiz ticaret bu anlaşmayı asla ödemez. Keşif tek başına hiçbir şey kazandırmaz. Kapalı satırlar, yeni kabul edilen bir sözleşmeyle değiştirilene kadar kalır."
 bfl_venture_offer_desc: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_bank').GetCountry.GetName] teklifler [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_ticket').GetValue|0] için altın [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_duration').GetValue|0] aylar. Ön ayar [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_preset').GetValue|0]: 0 = yatırımcı tüm sermayeyi fonlar, alır 75% fazlalık; 1 = Yatırımcı üçte iki katkıda bulunur, operatör üçte bir oranında katkıda bulunur, fazlalık eşit olarak bölünür. Önce sermaye geri kazanılır; kayıplar katkıları takip eder. Yalnızca adı geçen operasyonun fiili satış gelirleri kar sağlayabilir. Keşif başarısı bir fırsat verir, altın değil. Bu teklifin süresi üç ay sonra dolacaktır."
 bfl_venture_offer_desc_0: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_bank').GetCountry.GetName] kadar yetki verir [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_ticket').GetValue|0] banka fonunun altınları [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_duration').GetValue|0] aylar. Satın al 10 [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_good').Goods.GetNameWithNoTooltip] içinde [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_from').GetMarket.GetName]iki ay taşı, sonra sat [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_to').GetMarket.GetName]. Banka tüm masrafları karşılar ve alır 75% fazlalık.\n\nYalnızca gerçek yerel maliyetler çizilir. Kullanılmayan fon bankada kalır. Sermaye fazlalıktan önce geri kazanılır; kayıplar katkıları takip eder. Yalnızca bu kargonun ölçülen satış geliri bu anlaşmayı sonuçlandırıyor. İlgisiz gelir ve keşif hiçbir şey kazandırmaz. Teklifin süresi üç ay sonra doluyor."
 bfl_venture_offer_desc_1: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_bank').GetCountry.GetName] kadar yetki verir [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_ticket').GetValue|0] banka fonunun altınları [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_duration').GetValue|0] aylar. Satın al 10 [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_good').Goods.GetNameWithNoTooltip] içinde [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_from').GetMarket.GetName]iki ay taşı, sonra sat [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_to').GetMarket.GetName]. Banka maliyetlerin üçte ikisini karşılıyor; üçte birini ödersiniz. Fazlalık eşit olarak paylaştırılır.\n\nYalnızca gerçek yerel maliyetler çizilir. Kullanılmayan fon bankada kalır. Sermaye fazlalıktan önce geri kazanılır; kayıplar katkıları takip eder. Yalnızca bu kargonun ölçülen satış geliri bu anlaşmayı sonuçlandırıyor. İlgisiz gelir ve keşif hiçbir şey kazandırmaz. Teklifin süresi üç ay sonra doluyor."
 bfl_venture_offer_desc_2: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_bank').GetCountry.GetName] kadar yetki verir [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_ticket').GetValue|0] banka fonunun altınları [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_duration').GetValue|0] aylar. Yerel keşif hazırlayın [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_area').GetArea.GetName] itibaren [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_port').GetLocation.GetName] ile [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_explorer').GetCharacter.GetName]. Banka, kararlaştırılan tüm altın maliyetlerini karşılar ve alır 75% sözleşme fazlası. Hazırlıklarda iptal dahil iade yapılmaz. Bu finansman anlaşmasının dışında mürettebat, yerel bakım ve isteğe bağlı keşif gezisi harcamalarını siz sağlarsınız. Geriye kalan banka yetkilendirmesi, yerel erişime bağlı olarak, keşfedilen alanın içinde veya sınırında bulunan bir pazardan on birimlik bir kargoyu finanse edebilir. Yalnızca söz konusu kargonun ölçülen satışlarından kayıtlı hazırlık ve kargo masrafları düşüldükten sonra kalan tutar, sözleşmeden doğan fazlalığı ödeyebilir. Keşif ve ilgisiz ticaret hiçbir şey kazandırmaz. Teklifin süresi üç ay sonra doluyor. "
 bfl_venture_offer_desc_3: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_bank').GetCountry.GetName] kadar yetki verir [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_ticket').GetValue|0] banka fonunun altınları [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_duration').GetValue|0] aylar. Yerel keşif hazırlayın [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_area').GetArea.GetName] itibaren [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_port').GetLocation.GetName] ile [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_explorer').GetCharacter.GetName]. Banka, üzerinde anlaşmaya varılan altın maliyetlerinin üçte ikisini karşılıyor; üçte birini ödersiniz. Sözleşme fazlası eşit olarak paylaştırılır. Hazırlıklarda iptal dahil iade yapılmaz. Bu finansman anlaşmasının dışında mürettebat, yerel bakım ve isteğe bağlı keşif gezisi harcamalarını siz sağlarsınız. Geriye kalan banka yetkilendirmesi, yerel erişime bağlı olarak, keşfedilen alanın içinde veya sınırında bulunan bir pazardan on birimlik bir kargoyu finanse edebilir. Yalnızca söz konusu kargonun ölçülen satışlarından kayıtlı hazırlık ve kargo masrafları düşüldükten sonra kalan tutar, sözleşmeden doğan fazlalığı ödeyebilir. Keşif ve ilgisiz ticaret hiçbir şey kazandırmaz. Teklifin süresi üç ay sonra doluyor. "
