 bfl_prepare_bond_panel: "Devlet Tahvilleri"
 bfl_prepare_bond_panel_tip: "Kredi'de devlet finansmanını ve mevcut talepleri görüntüleyin."
 bfl_probe_P11: "Geliştirme kapısı: Bu bağdaştırıcının yürütülebilmesi için önce P11'in oyunda ölçülmesi gerekir."
 bfl_profile_0: "Bir uzmanlık seçin"
 bfl_profile_1: "Ticari Finansman"
 bfl_profile_2: "Yurtdışı Yatırım"
 bfl_project_security: "Proje Güvenliği"
 bfl_project_security_desc: "Uzaktaki işletmeleri finansörlerinin denetlemesi zordur. Varlıkları ve gelirleri üzerindeki alacaklar, sermaye yatırılmadan önce belirlenir ve yatırımcılara, bir girişimin kötüye gitmesi durumunda çıkarlarını korumaları için bir araç sağlar."
 bfl_project_security_tip: "#T Proje güvenliği#!\nBir girişimi tanımlanabilir proje iddialarına karşı güvence altına alın. Proje Güvenliği araştırması, Denizaşırı Yatırım ve Mutlakiyetçilik çağı veya üzeri gerektirir. Bu yapıda yerel proje teminat uygulaması mevcut değildir."
 bfl_protected_label: "Korumalı nakit"
 bfl_public_backstop: "Kamuya Açık Durdurucu"
 bfl_public_backstop_tip: "#T Kamu güvenli desteği#!\nDevrimler, Kamu Mali Destekleri ve egemen başkentte tamamlanmış bir Merkez Bankası ile canlı bir sözleşme. Açıkça kabul edildi 75-altın avanslarında kamu bankasının kendi bedava nakit parası kullanılır, 25% fatura saç kesimi ve en azından 9% yıllık faiz. Ücretsiz yeniden sermayelendirme yok."
 bfl_public_financial_backstops: "Kamu Mali Destekleri"
 bfl_public_financial_backstops_desc: "Büyük bir bankanın başarısızlığı kamu kredisini ve ticareti tehdit ettiğinde hükümet müdahale edebilir. Bu tür bir destek, hazinenin kaynaklarını bankanın iyileşmesine bağlar ve yardım şartlarını bir kamu politikası meselesi haline getirir."
 bfl_purchase_funded_bill: "Finanse edilen bir ödeme faturası satın alın"
 bfl_purchase_funded_bill_act: "$bfl_purchase_funded_bill$"
 bfl_purchase_funded_bill_desc: "Profil, yaş, araştırma ve sicil kontrollerinin ardından kendi hazinenizden finanse edilir. Anapara banka karı değildir. Bir banka sermaye aboneliği, birimleri mevcut net varlık değerinden satın alır."
 bfl_purchase_funded_bill_effect_text: "$bfl_purchase_funded_bill$"
 bfl_purchase_funded_bill_effect_text_past: "$bfl_purchase_funded_bill$"
 bfl_purchase_native_loan: "Banka: yerli emlak kredisi satın alın"
 bfl_purchase_native_loan_act: "$bfl_purchase_native_loan$"
 bfl_purchase_native_loan_desc: "Bankanız alıcıdır. Ek ücretsiz nakit ve sermaye çekleriyle birlikte yerel fiyat ve uygunluk geçerlidir. Bankacılık siteleri satın alma bedelini alır ve aynı kredi sahibini değiştirir. Tahviller ve hâlihazırda ülkede tutulan krediler hariçtir."
 bfl_purchase_native_loan_effect_text: "$bfl_purchase_native_loan$"
 bfl_purchase_native_loan_effect_text_past: "$bfl_purchase_native_loan$"
 bfl_purchase_native_loan_tip: "#T Banka adına krediyi devralmak#!\nUygun mülk borcuna sahip başka bir egemenlik seçin. Anlaşmalı bankanız o ülkenin bankacılık sitelerine yerli satın alma bedelini öder ve aynı kredinin alacaklısı olur. Anapara ve faiz alacakları bankaya ait olup; devlet, hisse temettüleri yoluyla borç verme geliri elde eder. Bankalar ayrıca rezervlerin ve sermayenin izin vermesi durumunda her ay bağımsız olarak uygun bir kredi satın alır. Tahviller ve hâlihazırda ülkede tutulan krediler hariçtir."
 bfl_rate_0: "Yeni hesaplara talep faizi yok"
 bfl_rate_0_short: "0%"
 bfl_rate_0_tip: "Teklif 0% Yeni vadesiz mevduatlara yıllık faiz. Mevcut vadesiz hesaplar ve ayrı vadeli hesap oranı, kabul edilen oranlarda kalır."
 bfl_rate_1: "1% yeni hesaplar için yıllık talep oranı"
 bfl_rate_1_short: "1%"
 bfl_rate_1_tip: "Teklif 1% Yeni vadesiz mevduatlara yıllık faiz. Faiz, aylık olarak yüzde taşıma ile yatırılır. Mevcut vadesiz hesaplar kabul edilen oranları korur."
