 bfl_funding_title_tip: "#T Mevduat ve sermaye#!\nDepozito devlet parasını bankaya aktarır ve geri ödenebilir bir talep yaratır. Sermaye aboneliği, sahiplik birimleri satın alır ve değer kaybedebilir. Her ikisi de mevcut altını aktarıyor; ikisi de banka karı sayılmaz."
 bfl_goods: "Mal ve saklama · Ticari Finansman"
 bfl_goods_accept: "Bu şartları kabul edin"
 bfl_goods_accept_branch_tip: "Görüntülenen on iki aylık Gümrük Dairesi sözleşmesini kabul edin. Aylık olarak finanse edilen erişim ücretleri, rıza gösteren ev sahibine gider; kabul etmek hiçbir stok, mal talebi veya anında satın alma yaratmaz."
 bfl_goods_accept_quote_tip: "Görüntülenen sözleşme fiyatını artı ayrı bir altın saklama ücretini saklamacıya ödeyin. Canlı desteği, fiyatı, tarafları, izinleri, erişimi ve korunan fonları yeniden kontrol edin; Değişen veya eski şartlar para taşımaz."
 bfl_goods_accept_transfer_tip: "Görüntülenen transfer fiyatını mevcut sahibine ödeyin. Mevcut fişi bir kez aktarmadan önce sahibini, miktarını, parti oluşumunu, araştırmasını, son kullanma tarihini ve finansmanını tekrar kontrol edin."
 bfl_goods_branch_desc: "Ev sahibi, sermaye piyasasına erişim sunuyor 12 aylar 1 ev sahibine ödenen aylık altın. Yerel satın alımlar kendi nakit ücretlerini korur; bu ayrı bir saklama hizmetidir. Erişim, ev sahibinin gümrük binasını tamamlamış olmasını ve huzurunu gerektirir. Ücretsiz erişim, sürenin sona ermesi, bina kaybı veya savaş, yeni satın alma ve teslimatı durdurur. Ev sahibi yerel gözetimi dondurabilir; nakit veya mal yaratılmaz. Erişimi geri yüklemek için aynı ana bilgisayarla yenileyin."
 bfl_goods_branch_title: "Gümrük Dairesi saklama sözleşmesi"
 bfl_goods_browser_desc: "Teklifini incelemek için fiziksel bir lot seçin. Mevcut sahipler teslimat talebinde bulunabilir; rıza gösteren Gümrük Dairesi sahibi, erişilemeyen saklamayı dondurabilir ve erişimin yenilenmesinden sonra serbest bırakabilir. Seçimde teklif kabulü gerçekleşmez."
 bfl_goods_browser_title: "Mal teklifleri ve velayet talepleri"
 bfl_goods_claim_desc: "Bu dekontun sermaye piyasanıza teslim edilmesini talep edin. Pazarlar arası teslimat iki ay sürer, maliyetler 1 altın ve kaybeder 1% miktar. Alternatif olarak bu pencereyi kapatın ve diplomaside Depo girişi aktarımı teklif et seçeneğini kullanın. Transferler saklamacıda Devirleri, Marjı ve Risk Yönetimini gerektirir; alıcının geçerli bir teklifi kabul etmesi gerekir."
 bfl_goods_claim_title: "Depo talebiniz"
 bfl_goods_close: "Kapat"
 bfl_goods_decline: "Reddet"
 bfl_goods_deliver: "Fiziki teslimat talep edin"
 bfl_goods_explanation: "Finanse edilen yerel envanter, desteklenen makbuzlar ve iletmeler, Merchant Finance'ı, avanslarını ve P09 yürütme/saklama doğrulamasını gerektirir. İpotekli mallar ikinci bir iddiayı destekleyemez."
 bfl_goods_forward_title: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_goods_quote_type').Goods.GetNameWithNoTooltip] fiziksel ileri"
 bfl_goods_inventory_empty: "Gözaltında mal yok. Otomatik satın almalar bir sonraki uygun aylık banka kapanışında başlar."
 bfl_goods_inventory_hint: "Mallar, miktarlar, değer ve iade için fareyle üzerine gelin"
 bfl_goods_inventory_note: "Gösterge niteliğinde yerli satış değeri; kalan ödenmiş maliyet karşılığında gerçekleşmemiş getiri. Üçüncü şahıslara ait tahsilatlar banka toplamına dahil edilmemiştir. Maliyetler, bozulma ve erişim kaybı gelirleri etkiler. Saklanan her konum için kaydırın."
 bfl_goods_inventory_subtitle: "Fiziksel saklama · gösterge niteliğindeki piyasa değeri"
