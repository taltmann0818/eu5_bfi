 bfl_offer_commenda: "Bir kargo operasyonunu finanse etmek"
 bfl_offer_commenda_act: "Bir kargo operasyonunu finanse etmek"
 bfl_offer_commenda_desc: "Bankanın önerdiği koşullar kapsamında risk sermayesi teklif edin. Kabul, adı geçen kargoyu kendi maliyeti üzerinden satın alır; kullanılmayan yetki bankada kalır. Sermaye ve getiriler asla garanti edilmez."
 bfl_offer_commenda_effect_text: "Bir kargo operasyonunu finanse etmek"
 bfl_offer_commenda_effect_text_past: "Bir kargo operasyonunu finanse etmek"
 bfl_offer_commenda_tip: "Discovery veya daha sonra, Yurtdışı Yatırım ve Commenda araştırması. On birimlik kargo için bir operatör, kaynak pazar, varış yeri ve mal seçin. Kabul, yetkinizi, bedava nakit paranızı, sermayenizi ve kapasitenizi yeniden kontrol eder. Operatör başına bir aktif sözleşme; banka başına sekize kadar."
 bfl_offer_credit: "Finanse edilen bir kredi teklif edin"
 bfl_offer_credit_act: "$bfl_offer_credit$"
 bfl_offer_credit_desc: "Borçlu açık bir teklif alır. Kabul edilene kadar nakit veya şartlarda değişiklik yapılmaz; yürütme, canlı otoriteyi, profili, araştırmayı ve fonları yeniden kontrol eder."
 bfl_offer_credit_effect_text: "$bfl_offer_credit$"
 bfl_offer_credit_effect_text_past: "$bfl_offer_credit$"
 bfl_offer_credit_tip: "Bağımsız veya uygun bir yerel şirket seçin. Her iki profil de egemenlere borç verir; şirket kredisi Ticari Finansman, Reformasyon ve Kurumsal Kredi gerektirir. Borçların hafifletilmesi aynı zamanda Rönesans Borçlarının Yeniden Yapılandırılmasını da gerektirir."
 bfl_offer_goods_transfer: "Depo girişi transferi teklifi"
 bfl_offer_goods_transfer_act: "$bfl_offer_goods_transfer$"
 bfl_offer_goods_transfer_desc: "Mal teklifleri ve velayet taleplerinde en son seçilen makbuzu sunun. Alıcı, mevcut sahibine ödeme yapmadan önce fiyatı ve miktarı inceler."
 bfl_offer_goods_transfer_effect_text: "$bfl_offer_goods_transfer$"
 bfl_offer_goods_transfer_effect_text_past: "$bfl_offer_goods_transfer$"
 bfl_offer_held_sovereign_bond: "Elde tutulan bir devlet tahvili teklif edin"
 bfl_offer_held_sovereign_bond_act: "$bfl_offer_held_sovereign_bond$"
 bfl_offer_held_sovereign_bond_desc: "Bir ihraççı seçin ve devlet tahvillerinizden birini şu adreste listeleyin: 98% nominal değerde. Sahip olunan tamamlanmış bir Borsa binası gerektirir."
 bfl_offer_held_sovereign_bond_effect_text: "$bfl_offer_held_sovereign_bond$"
 bfl_offer_held_sovereign_bond_effect_text_past: "$bfl_offer_held_sovereign_bond$"
 bfl_offer_held_sovereign_bond_tip: "Üç ay boyunca sahip olduğunuz mevcut bir tahvili listeleyin. Finanse edilen bir alıcı kabul edene kadar hak talebini saklı tutarsınız; Kuponlar ve geri ödeme daha sonra o alıcıyı takip eder."
 bfl_offer_restructuring: "Borç erteleme teklif et"
 bfl_offer_restructuring_act: "$bfl_offer_restructuring$"
 bfl_offer_restructuring_desc: "Borçlu açık bir teklif alır. Kabul edilene kadar nakit veya şartlarda değişiklik yapılmaz; yürütme, canlı otoriteyi, profili, araştırmayı ve fonları yeniden kontrol eder."
 bfl_offer_restructuring_effect_text: "$bfl_offer_restructuring$"
 bfl_offer_restructuring_effect_text_past: "$bfl_offer_restructuring$"
 bfl_offer_restructuring_tip: "Bağımsız veya uygun bir yerel şirket seçin. Her iki profil de egemenlere borç verir; şirket kredisi Ticari Finansman, Reformasyon ve Kurumsal Kredi gerektirir. Borçların hafifletilmesi aynı zamanda Rönesans Borçlarının Yeniden Yapılandırılmasını da gerektirir."
 bfl_operating_costs: "Aylık işletme giderleri"
 bfl_operating_costs_tip: "Aktif mevduat hesapları, sözleşmeler, şubeler ve varlık sınıflarıyla sabit aylık maliyet skalası. Devlet Yeminli Banka reformu maliyetleri azaltıyor 5%, Bankacılık 10%, Gelişmiş Takas 15%ve kolaylaştırılmış yönetim 10%. Ödenmemiş maliyetler yükümlülük olarak kalır ve temettüleri bloke eder."
 bfl_overview: "Hesaplar ve uzmanlık"
 bfl_overview_hint: "Varlıklar: dış halka = tür; iç halka = ülkeler. Renkli dökümler için fareyle üzerine gelin."
 bfl_payout_0: "Kârınızı koruyun"
 bfl_payout_0_short: "Tut"
 bfl_payout_0_tip: "Uygun gerçekleşen tüm kârı koruyun. Bu politika kapsamında yeni bir temettü ödenmemektedir; dağıtılmayan kar likiditeyi ve özsermayeyi destekler."
 bfl_payout_25: "25% ödeme"
 bfl_payout_25_short: "25%"
 bfl_payout_25_tip: "kadar tahsis et 25% uygun gerçekleşmiş kârın zararlardan sonraki temettülere oranı. Mevcut nakit, sermaye payı ve kayıtlı sahiplik hâlâ ödemeyi sınırlıyor."
 bfl_payout_50: "50% ödeme"
 bfl_payout_50_short: "50%"
 bfl_payout_50_tip: "kadar tahsis et 50% uygun gerçekleşmiş kârın zararlardan sonraki temettülere oranı. Mevcut nakit, sermaye payı ve kayıtlı sahiplik hâlâ ödemeyi sınırlıyor."
 bfl_peasants_estate_workout_mandate: "Emlak çalışma yetkisi"
 bfl_peasants_estate_workout_mandate_desc: "Bu mülk, hükümetine, kendisi adına gönüllü banka mevduatı çalışmalarını gözden geçirme yetkisini açıkça veriyor. Her teklifin hâlâ ayrı bir kabule ihtiyacı vardır. Bu ayrıcalığın iptal edilmesi, bekleyen emlak şartlarını geçersiz kılar. Kurtarma ödemeleri emlak cüzdanına devam ediyor."
 bfl_place_deposit_1: "Bir aç 100 altın vadesiz mevduat"
 bfl_place_deposit_1_act: "$bfl_place_deposit_1$"
 bfl_place_deposit_1_desc: "Bağımsız bankalar en azından bir görüşe ihtiyaç duyar +50 Bir hesap açmanız için size doğru. Anlaşmalı bankanız ekstra bir teklif sunuyor 1% yıllık faiz. Talep faizi fonlandığında aylık olarak ödenir; ödenmemiş faiz borçlu kalır. Düşen ilişkiler asla olgunlaşmış haklarınızın geri çekilmesine engel değildir."
