 bfl_equity_vote_payout_0: "Çoğunluk oyu: 0% temettü ödemesi"
 bfl_equity_vote_payout_0_tip: "Verilen mali oyların yarısından fazlasını gerektirir. Şirket yalnızca elde tutulan kazançları ve bağımsız banka ödeme politikasını kullandı. Yeminli para ve ödeme politikası, canlı iniş kontrolöründe kalır. Siyasi konu aktarımı yok."
 bfl_equity_vote_payout_25: "Çoğunluk oyu: 25% temettü ödemesi"
 bfl_equity_vote_payout_25_tip: "Verilen mali oyların yarısından fazlasını gerektirir. Şirket yalnızca elde tutulan kazançları ve bağımsız banka ödeme politikasını kullandı. Yeminli para ve ödeme politikası, canlı iniş kontrolöründe kalır. Siyasi konu aktarımı yok."
 bfl_equity_vote_payout_50: "Çoğunluk oyu: 50% temettü ödemesi"
