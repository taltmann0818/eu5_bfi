 bfl_recapitalize_command: "Şununla yeniden sermayelendir: 100 altın"
 bfl_recapitalize_command_tip: "Ödeme 100 ülkenizin hazinesinden banka sermayesi olarak altın. gerektirir 100 altın ve bayinin yeniden satış teklifi somut NAV'dan yüksek değil; anında yeniden satış kârını önlemek için daha büyük bir piyasa primi sırasında sermaye duraklar. Sıfır veya negatif NAV'de finanse edilen kurtarma mevcut olmaya devam ediyor."
