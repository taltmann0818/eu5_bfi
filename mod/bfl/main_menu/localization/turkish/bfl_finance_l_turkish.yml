 bfl_facility_0: "Tesis kapalı"
 bfl_facility_0_short: "Kapalı"
 bfl_facility_0_tip: "Daimi borç tesisi yetkisini kapatın. Planlanmış bir banka finansmanı talep edilmez. Mevcut yükümlülükler ödenmeye devam edecektir."
 bfl_facility_1: "Borç ilk tesis"
 bfl_facility_1_short: "Önce borç"
 bfl_facility_1_tip: "Şunlar için özel tahvil finansmanı talep edin: 60% tahmini aylık harcamanın üst sınırı 100 altın ve ayda bir sayı. Devlet parası ulaştığında çekilişleri atla 500 altın veya bankanın veya ihraççının kapasitesi yok."
 bfl_facility_2: "Tampon tesisi"
 bfl_facility_2_short: "Tampon"
 bfl_facility_2_tip: "Özel tahvil finansmanı talep edin 200 tahmin bakiyesinden sonra eyalet altını 100 altın ve ayda bir sayı. Finanse edilmeyen talepler borç veya nakit yaratmaz."
 bfl_facility_reason_1: "#O Araştırmayı, şube erişimini, ihraççının gelirini ve kupon kapasitesini kontrol edin.#!"
 bfl_facility_reason_2: "#O Korunan nakit yetersiz likit banka fonu bırakıyor.#!"
 bfl_facility_reason_3: "#O Yeni talep bankanın sermaye tavanını aşacak.#!"
 bfl_facility_reason_4: "#O Birleşik devlet yükümlülükleri ihraççının borç kapasitesine ulaştı.#!"
 bfl_facility_reason_5: "#O Ödenmemiş devlet kuponları daha fazla ihracın yapılmasını engeller.#!"
 bfl_facility_reason_6: "#O Egemen bu ay zaten bir tahvil ihraç etti.#!"
 bfl_facility_reason_7: "#O Tüm devlet tahvili kayıt yuvaları dolu.#!"
 bfl_facility_tip: "Bu ay özel devlet tahvili ihracından elde edilen banka nakit parası. Finansman borç yaratır ve kazanılan gelirin dışında tutulur."
 bfl_facility_title: "Borç tesisi yetkisi"
 bfl_facility_title_tip: "#T Borç tesisi yetkisi#!\nBanka, özel devlet tahvillerini sabit yıllık kuponlarla fonlamaktadır. Kapalı, planlanmış sorunları durdurur. Borç ilk talepleri 60% tahmini harcamalar. Tampon hedefleri 200 Tahmini aylık bakiyeden sonra altın durumunu belirtin. Her ikisi de durur 500 devlet altını.\n\nSon talep: [Country.MakeScope.GetVariable('bfl_facility_requested').GetValue|2]@gold!\nSon finanse edilen tarih: [Country.MakeScope.GetVariable('bfl_facility_paid').GetValue|2]@gold!\n\nEn fazla bir konu ve 100 ayda altın. Korunan banka nakit parası, sermayesi, ihraççı kapasitesi ve ödenmemiş kuponlar çekilişi engelleyebilir. Gelirler finansmandır, gelir değil."
 bfl_feedback_1: "Alınan kuruluş sermayesi"
 bfl_feedback_2: "Alınan depozito"
 bfl_feedback_3: "Para çekme ödendi"
 bfl_feedback_4: "Ödenen temettü"
 bfl_feedback_5: "Tahvil satışında anlaşmaya varıldı"
 bfl_feedback_6: "Girişim gelirleri alındı"
 bfl_feedback_7: "#O Yeni likidite uyarısı#!"
 bfl_feedback_8: "Çözüm kapandı · kaydedilen kayıplar görünür durumda"
 bfl_feedback_9: "#O Tesis hedefi finanse edilmedi#!"
 bfl_feedback_note: "En son taahhüt edilen işlem · tutar zaten rezerve edilmiştir. Bu görünümün açılması geçmiş efektleri yeniden oynatmaz. Azaltılmış hareket aynı alındı ​​ve uyarıları korur. Discovery tek başına herhangi bir ödeme göstergesi üretmez."
