 bfl_equity_vote_reserve_100: "Çoğunluk oyu: yedek 100, ticaret bütçesi 50"
 bfl_equity_vote_reserve_100_tip: "Çoğunluk mali oyu, şirketin yeniden yatırım rezervini ve ticaret bütçesini seçebilir. Siyasi yetkiler, yerel derebeylik, nakit para ve alacaklıların mevcut talepleri ayrı kalıyor."
 bfl_equity_vote_reserve_200: "Çoğunluk oyu: yedek 200, ticaret bütçesi 25"
 bfl_equity_vote_reserve_200_tip: "Çoğunluk mali oyu, şirketin yeniden yatırım rezervini ve ticaret bütçesini seçebilir. Siyasi yetkiler, yerel derebeylik, nakit para ve alacaklıların mevcut talepleri ayrı kalıyor."
 bfl_establish_chartered_bank.a: "Mevcut Devlet Bankasını seçin"
 bfl_establish_chartered_bank.desc: "Mevcut bir Devlet Bankasını yerinde dönüştürün ve sözleşme tamamlandığında Bankacılık Geleneklerini kazanın. Mevcut çağın yatırımı 500 / 750 / 1,000 / 1,500 / 2,000 / 3,000 altın devlet öz sermayesi olarak hazineye aktarılır. Sermaye piyasanıza sahip olmalısınız. Herhangi bir ödeme veya araştırma yapılmadan önce bir banka seçin."
 bfl_establish_chartered_bank.title: "Devlet İmtiyazlı Bankasının Kurulması"
 bfl_estate_bond_back: "Emlak yönetimine geri dön"
 bfl_estate_bond_desc: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_managed_estate').GetCountry.GetName] borçlu [ROOT.GetCountry.MakeScope.GetVariable('bfl_estate_bond_face').GetValue|2] müdür ve [ROOT.GetCountry.MakeScope.GetVariable('bfl_estate_bond_due').GetValue|2] ödenmemiş kuponlar [ROOT.GetCountry.MakeScope.GetVariable('bfl_estate_bond_holder').GetCountry.GetName]. Nakit kurtarma, teminatsız sınıfı mevduatlarla paylaşır. Gönüllü indirim, yeni bir teklif ve bu sahibinin açık kabulünü gerektirir; ödemeler veya mütevelli heyetinin değişmesi, bekleyen koşulları geçersiz kılar."
 bfl_estate_bond_next: "Sonraki bağı seç"
 bfl_estate_bond_title: "Emlak tahvili alacaklısı"
 bfl_estate_close_tip: "Tüm yükümlülükler, gayri nakdi haklar ve sahipler yeniden kontrol edildikten sonra tamamen yerleşmiş olan bu mülkü kalıcı olarak kapatın."
 bfl_estate_default_tip: "Bu tükenmiş, yıkılmış kurumu sonlandırın: ödenmemiş alacaklı zararlarını bir kez kaydedin ve alt giderleri söndürün. Hiçbir hissedar gelir elde etmez."
 bfl_estate_deposit_1: "Burgher'lar: talep 100"
 bfl_estate_deposit_1_act: "$bfl_estate_deposit_1$"
 bfl_estate_deposit_1_desc: "Gerçek emlak altınını seçilen bankadaki birleştirilmiş vadesiz hesaba yerleştirin. Devlet mevduatı primi uygulanmaz."
 bfl_estate_deposit_1_effect_text: "$bfl_estate_deposit_1$"
 bfl_estate_deposit_1_effect_text_past: "$bfl_estate_deposit_1$"
 bfl_estate_deposit_1_tip: "En azından koruyarak bu emlak havuzunu kullanır 25 emlak altın. Anapara ve faiz aynı mülke geri döner, asla devlet hazinesine değil. Tekrarlanan eşleşen hesaplar toplanır. Hanehalkı katılımı bu emlak havuzları tarafından temsil edilmektedir."
