 bfl_request_discount_command: "$bfl_request_discount$"
 bfl_request_discount_command_desc: "$bfl_request_discount_desc$"
 bfl_request_discount_desc: "Talep et 75- finanse ettiğiniz paraya karşılık altın avansı 100-altın üçüncü banka bonosu. Canlı borç verenin yöneticisi talebi inceler; kabul, tüm tarafları ve teminatları yeniden kontrol eder. Bankalar arasında Banka Şubesi zorunluluğu bulunmamaktadır."
 bfl_request_discount_effect_text: "$bfl_request_discount$"
 bfl_request_discount_effect_text_past: "$bfl_request_discount$"
 bfl_request_discount_tip: "Bir süre için borç vereni seçin 75-taahhüt edilmemiş, finanse edilmiş kredinize karşılık bir aylık altın avans 100-üçüncü bir bankadaki altın banknot. Teminat ve Likidite İmkanları gerektirir. Borç verenin rızası olmalıdır; Bankalar arası Banka Şubesi zorunluluğu yoktur."
 bfl_request_public_support: "Herkese açık güvenli destek isteyin"
