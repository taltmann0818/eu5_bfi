 bfl_request_public_support_command: "$bfl_request_public_support$"
 bfl_request_public_support_command_desc: "$bfl_request_public_support_desc$"
 bfl_request_public_support_desc: "Talep et 75- finanse ettiğiniz paraya karşılık altın avansı 100-altın üçüncü banka bonosu. Canlı borç verenin yöneticisi talebi inceler; kabul, tüm tarafları ve teminatları yeniden kontrol eder. Bankalar arasında Banka Şubesi zorunluluğu bulunmamaktadır."
 bfl_request_public_support_effect_text: "$bfl_request_public_support$"
 bfl_request_public_support_effect_text_past: "$bfl_request_public_support$"
 bfl_request_public_support_tip: "Kamu Mali Desteklerine ve devletin tamamlanmış sermayesine sahip Merkez Bankasına sahip imtiyazlı bir borç veren seçin. Mevcut yöneticisinin onay vermesi gerekir. 75-altın teminatlı avans, en azından banka nakit parasını ve masraflarını kullanır 9% yıllık; hiçbir garanti veya yeniden sermayelendirme yaratmaz."
 bfl_resolution_begin_command: "Çözümlemeye başlayın"
 bfl_resolution_begin_command_tip: "Düzenli çözüm, yeni taahhütleri ve dağıtımları dondurur. Ayrılmış para ve emanet rezervleri korunmaya devam eder; Mevduatlar, mevcut nakitleri gider borçları ve özsermayeden önce orantılı olarak paylaştırır. Kayıp alacaklılar haklarını saklı tutar. Gönüllü şartlar, mevcut alacaklının onayını ve Renaissance Debt Restructuring'i gerektirir. Kamu garantisi şunları kapsar: 50% kabul edilen mevduat zararlarının toplamı 100 kayıtlı hükümdarı tarafından finanse edilen toplam altın; ödenmemiş çağrılar beklemede kalır. Kapatma, tüm yükümlülüklerin ve nakit dışı varlıkların temizlenmesini gerektirir. Kapatılan siteler yeniden açılamaz."
 bfl_resolution_call_command: "Bekleyen garantiyi öde"
