 bfl_assets_label: "Toplam varlıklar"
 bfl_assets_label_tip: "#T Toplam varlıklar#!\nBankanın sahip olduğu nakit ve kayıtlı varlıklar.\n\nHazine nakit: [Country.GetFixedPointCurrencyValue('gold')|2]@gold!\nKredi portföyü: [Country.MakeScope.GetVariable('bfl_native_credit_value').GetValue|2]@gold!\nHisse pozisyonları (taşınan değer): [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_security_carrying')|2]@gold!\nÖzel kredi ve tahviller: [Country.MakeScope.GetVariable('bfl_custom_credit_value').GetValue|2]@gold!\nEnvanter: [Country.MakeScope.GetVariable('bfl_inventory_value').GetValue|2]@gold!\nProjeler: [Country.MakeScope.GetVariable('bfl_project_value').GetValue|2]@gold!\nToplam: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_assets')|2]@gold!\n\nKrediler, özsermaye pozisyonları, envanter ve projeler, harcanabilecek nakit değil kayıtlı varlık değerleridir. Anapara geri ödemeleri, bir kredi varlığını nakitle değiştirir; kâr yaratmazlar."
 bfl_authorize_note_bank: "Kullanılabilir banknotlara yetki verme"
 bfl_authorize_note_bank_act: "$bfl_authorize_note_bank$"
 bfl_authorize_note_bank_desc: "Gerekli araştırmaların ardından, anlaşmalı bankanıza veya başkentinizde şubesi bulunan bağımsız bir bankaya, tam destekli itfa edilebilir senetler karşılığında para takası yapma yetkisi verin. Yeni ihraçlar için sermayenizde tamamlanmış bir Merkez Bankası da gereklidir. Yetki altın yaratmaz ve geri çekilebilir."
 bfl_authorize_note_bank_effect_text: "$bfl_authorize_note_bank$"
 bfl_authorize_note_bank_effect_text_past: "$bfl_authorize_note_bank$"
 bfl_back_to_bank: "Banka hesapları"
 bfl_balance_paid_tip: "Son aylık ödemede alınan fonlu ödeme. Bu transferler hâlihazırda hazinenizdedir ve yerel gelir toplamına tekrar eklenmemelidir."
 bfl_bank_capital_subscriptions_desc: "Bir bankanın tamamen kurucu ailesinin servetine bağlı olması gerekmez. Abonelikler, her yatırımcının gelecekteki refahına ilişkin iddiasını kaydederken, sermayelerini bir havuzda toplayarak işletmeye ek ortaklar getirir."
 bfl_bank_dividends: "Banka Temettüleri"
 bfl_bank_equity_subscribe: "Banka hazinesi: abone olun 100 altın"
 bfl_bank_equity_subscribe_tip: "Yatırım yap 100 seçilen ihraççının somut NAV'ındaki fiili yönetilen bankanın korunan nakit ve sermaye fazlasının oranı. Yeni ücretli birimler banka portföyüne giriyor. Maksimum 25% bir bankanın veya 60% Yurtdışı izinli bir şirkete ait. Bu birincil finansmandır, mevcut bir hissedardan satın alma değildir."
 bfl_bank_identity_tip: "[Country.GetName] kendi hazinesine, varlıklarına ve yükümlülüklerine sahiptir. Bu toplamlar devlet hazinenizden ayrı olarak bankaya aittir. Merchant Finance ticari ve kurumsal krediler konusunda uzmanlaşmıştır; Overseas Investment, girişimler ve şirketler konusunda uzmanlaşmıştır. Bir banka kalıcı bir uzmanlık seçer."
 bfl_bank_share_dealing: "Banka Hissesi İşlemleri"
 bfl_bank_share_dealing_desc: "Bir ortağın servetinin sonsuza kadar aynı bankaya bağlı kalması gerekmez. Tanınmış mülkiyet devirleri, yatırımcıların hisselerini başkalarına satmalarına olanak tanırken, kurum sermayesini geri çekmeden faaliyetlerini sürdürür."
 bfl_bank_share_transfer: "Banka Hissesi Transferi"
 bfl_bank_share_transfer_tip: "#T Banka hissesi devri#!\nKayıtlı banka mülkiyet birimlerinin finanse edilen taraflar arasında aktarılması. Banka Hissesi Alım Satım araştırması ve Reformasyon çağı veya sonrasını gerektirir. Bu satır izinleri bildirir; kendisi ikincil bir hisse senedi ticareti yürütmemektedir."
 bfl_bank_status_tip: "İşletme: Diğer gereklilikler karşılandığında yeni işe izin verilir. Nakit baskı altında: Mevcut nakit tükendi. Para çekme işlemleri sıraya alındı: ödenmemiş para çekme talepleri yeni işleri askıya alır. Borcunu ödeyemeyen: borçlar varlıklardan fazladır. Çözünürlükte veya Kapalı: sıradan işler kısıtlanmıştır. Mevcut talepler kayıtlı kalır."
 bfl_bank_subscription: "Banka Aboneliği"
