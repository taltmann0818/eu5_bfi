 bfl_strategy_credit: "Son inceleme: onay için kredi teklif edildi"
 bfl_strategy_delegated: "Yatırım yetkisi · devredildi"
 bfl_strategy_deposit: "Son inceleme: 100 talebe göre altın veriliyor"
 bfl_strategy_disable: "Yatırımları yönetin"
 bfl_strategy_disable_tip: "Otomatik kredi alımlarına, yeni strateji tekliflerine ve talep yerleştirmelerine son verin. Mevcut krediler, mevduatlar ve bekleyen alacaklara hizmet verilmeye devam edilmektedir. Mal, hisse ve şube politikaları ayrı kalır."
 bfl_strategy_enable: "Yatırımları devredin"
 bfl_strategy_enable_tip: "Uygun yapay zeka karşı taraflarına mevcut yerel kredilerin, kredi ve kargo tekliflerinin puanlı satın alımlarına ve fazla nakit talebi yerleşimlerine yetki verin. Düşük likidite, sahip olunan bir devlet tahvilini şu anda listeleyebilir: 98% yüz; Kabul edilen bir yeniden satış zarara neden olabilir. Cargo, mevcut Koşullarınızı, olağan onayınızı ve fiziksel anlaşmanızı kullanır. Devlet borçlanması, temettüler, mallar ve para otoritesi ayrı politikalarını korur. Yeni işler çözümde durur."
 bfl_strategy_idle: "Son inceleme: tutulan likidite"
 bfl_strategy_manual: "Yatırım talimatı · el kitabı"
 bfl_strategy_recall: "Son inceleme: depozitonun geri alınması talep edildi"
 bfl_strategy_resale: "Son inceleme: likidite için sahip olunan bir tahvil teklif edildi"
 bfl_strategy_secondary_statement: "Otomatik yerli kredi alımları: [Country.MakeScope.GetVariable('bfl_strategy_takeovers').GetValue|0] · Tahvil yeniden satış fiyatları: [Country.MakeScope.GetVariable('bfl_strategy_resales').GetValue|0]"
 bfl_strategy_secondary_tip: "En fazla on iki tamamlanmış sermaye şubesi müşterisinin mevcut kredi satın alımlarının incelenmesi. Borçlunun likiditeye, barışa, olumsuz olmayan bir bütçeye ve en azından 0.50 kredibilite. Satın alınanlar korunur 100 bedava nakit, satın alma priminin üst sınırı 25% kalan anapara ve toplam borçlu riskinin 25% eşitlik. Beklenen aylık marj en az olmalıdır 0.10 primden sonra altın, hizmet ödeneği ve ihtiyatlı finansman maliyetleri. Bu bir tahmindir; Erken geri ödeme ve temerrüt yine de zarara neden olabilir. Düşük likidite, sahip olunan bir devlet tahvilinin fiyatına kote olabilir 98% Tamamlanmış bir Borsa aracılığıyla yüz yüze. Finanse edilen alıcının izni olmadan hiçbir yeniden satış geliri kaydedilmez."
 bfl_strategy_statement: "Aylık incelemeler: [Country.MakeScope.GetVariable('bfl_strategy_reviewed').GetValue|0]/12  · Puan: [Country.MakeScope.GetVariable('bfl_strategy_score').GetValue|2]\nKredi teklifleri: [Country.MakeScope.GetVariable('bfl_strategy_offers').GetValue|0]  · Yatırılan depozitolar: [Country.MakeScope.GetVariable('bfl_strategy_placements').GetValue|0]  · Hatırlar: [Country.MakeScope.GetVariable('bfl_strategy_recalls').GetValue|0]"
 bfl_strategy_title: "Yatırım yetkisi"
 bfl_strategy_title_tip: "Muhafazakar bir aylık görev. En fazla on iki kredi adayını, her biri dört kaynak piyasaya sahip on iki bağlantılı girişim operatörünü veya on iki mevduat bankasını inceleyin. En fazla bir kredi teklifi, kargo teklifi veya 100-Aylık altın talebi yerleştirme. Kredi ve kargo teklifleri üç ay süreyle soğuyor. Kargo, en azından kote edilmiş bir marj gerektirir 10% ve bir altın bankası fazlası, muhafaza ediliyor 500 bedava nakit ve iki aktif anlaşmayla sınırlıdır ve 25% eşitlik. Fiyat teklifleri değişebilir; kayıplar olası olmaya devam ediyor. Korumalı nakit, araştırma, şube ve profil izinleri hâlâ geçerlidir."
 bfl_strategy_venture: "Son inceleme: rıza için kargo ortaklığı teklif edildi"
 bfl_streamline_bank: "Yönetimi kolaylaştırın · 100 altın"
 bfl_streamline_bank_tip: "Ödeme 100 sabit banka işletme giderlerini bir kez azaltmak için devlet altını 10%. Charter reformu, Bankacılık ve Gelişmiş Takas ek indirimler sağlıyor. Bu karar banka karı yaratmaz."
 bfl_subscribe_bank: "Abone ol 100 banka sermayesinin altını"
 bfl_subscribe_bank_act: "$bfl_subscribe_bank$"
 bfl_subscribe_bank_desc: "Profil, yaş, araştırma ve sicil kontrollerinin ardından kendi hazinenizden finanse edilir. Anapara banka karı değildir. Bir banka sermaye aboneliği, birimleri mevcut net varlık değerinden satın alır."
 bfl_subscribe_bank_effect_text: "$bfl_subscribe_bank$"
 bfl_subscribe_bank_effect_text_past: "$bfl_subscribe_bank$"
 bfl_suspend_command: "Yeni para yatırma işlemlerini askıya alın"
 bfl_suspend_command_tip: "#T Yeni para yatırma işlemlerini askıya alın#!\nYeni mevduat kabul etmeyi ve mevduat kabulü gerektiren fonlama işlemlerini durdurun. Mevcut hesaplar, faiz yükümlülükleri ve para çekme talepleri kayıt altında kalır. Bu kontrol bankayı kapatmaz veya borçlarını affetmez."
 bfl_term_accept: "Bu sabit şartları kabul edin"
 bfl_term_decline: "Mevcut hesabı koru"
 bfl_term_deposit: "Vadeli Mevduat"
 bfl_term_deposits_desc: "Tüccarlar paralarını her zaman aynı anda kullanamazlar. Bunu kararlaştırılan bir süre için bir bankaya emanet ederek, bankacıya daha istikrarlı bir sermaye kaynağı sağlıyorlar ve fonlarına anında erişimden vazgeçmeleri karşılığında tazminat alıyorlar."
 bfl_term_offer_1_desc: "Olgunluğunuzu yenileyin [ROOT.GetCountry.MakeScope.GetVariable('bfl_deposit_offer_principal').GetValue|2] için altın anapara 12 aylar [ROOT.GetCountry.MakeScope.GetVariable('bfl_deposit_offer_rate').GetValue|%1] yıllık. Tahakkuk eden faiz ayrı olarak borçlu kalır. Yeni anapara aktarılmıyor. Bu teklifin süresi ay sonunda dolacaktır; değişen talepler yeni bir teklif gerektirir."
 bfl_term_offer_1_title: "Vadesi geçmiş vadeli mevduatı yenileyin"
 bfl_term_offer_2_desc: "Erken çekilme kuyruğu [ROOT.GetCountry.MakeScope.GetVariable('bfl_deposit_offer_principal').GetValue|2] iptalden sonra altın anapara [ROOT.GetCountry.MakeScope.GetVariable('bfl_deposit_offer_penalty').GetValue|2] tahakkuk eden faizin altın (en fazla 1% müdür). Ana para cezası uygulanmaz. Para çekme kuyruğunda borçlu olunan nakit sıkıntısı devam ediyor. Bu teklifin süresi ay sonunda dolacaktır; değişen talepler yeni bir teklif gerektirir."
 bfl_term_offer_2_title: "Erken dönem para çekme teklifi"
 bfl_term_service_1: "Vadesi dolan ilk vadeli hesabı yenileyin"
