 bfl_bond_secured_accept_tip: "Belirtilen indirimi özel iki yıllık gelir taahhüdü ve ticari koruma imtiyazıyla birlikte kabul edin. Fiili uygulama, ihraççının mevcut nakit parasıyla sınırlı olmaya devam ediyor."
 bfl_bond_selected_name: "[Country.GetName]"
 bfl_bond_underwriting: "Tahvil Sigortalaması"
 bfl_bond_underwriting_tip: "#T Tahvil yüklenimi#!\nAnlaşmalı bankanız özel bir devlet tahvili için gerçek nakit ödeme yapar. Her iki uzmanlık da sigortalanabilir. Sabit yıllık kuponlar aylık olarak ödenir; mevcut sahibi, itfa sırasında itibari değeri alır. İhraç, banka likiditesi, sermaye ve egemenlik kapasitesi gerektirir."
 bfl_bond_unpaid: "Ödenmemiş kuponlar"
 bfl_bond_workout_accept: "Tahvil yeniden yapılandırmasını kabul edin"
 bfl_bond_workout_desc: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_bond_workout_issuer').GetCountry.GetName] mevcut sahibi olarak sizden feragat etmenizi ister 20% bu tahvilin anapara ve ödenmemiş kuponlarının yüzde 1 oranında azaltılması ve yıllık kuponunun 1% kat. Azalmak tüm koşulları korur. Teklifin süresi bu ay doluyor; ödeme, transfer veya başka bir değişiklik bunu geçersiz kılar. Olağan kabul yeni bir güvenlik sağlamaz. Teklif edildiğinde, güvenli kabul, iki yıllık ticari koruma imtiyazını ve 10% ödenmemiş kuponlar için aylık gelir. Uygulama, diğer özel tahvil kuponlarından önce yalnızca mevcut hazine altınını kullanıyor; hiçbir garanti veya anapara ödemesi yaratmaz."
 bfl_bond_workout_secured: "İki yıllık ticaret imtiyazı ve gelir taahhüdü ile kabul edin"
 bfl_bond_workout_title: "Tahvil yeniden yapılandırma teklifi"
 bfl_branch_construction: "Sermaye Bankası Şubesi Kurulması"
 bfl_branch_required: "Yeni egemen iş, bu bankanın mevcut sermayede tamamlanmış Banka Şubesini gerektirir. Bankalar arası işler muaftır; mevcut alacaklar borçlu olmaya devam etmektedir."
 bfl_browse_bond_issuers: "İhraççılara ve holdinglere göz atın"
 bfl_browse_bond_issuers_desc: "Bankanızın elinde bulunan alacaklar da dahil olmak üzere, ödenmemiş tahvil ve teklifleri incelemek için bir ihraççı seçin."
 bfl_browse_bond_issuers_tip: "Ödenmemiş özel tahvillere sahip canlı bir ihraççı seçin. Bu hiçbir şey satın almaz veya satmaz."
 bfl_browse_goods: "Mal teklifleri ve velayet talepleri"
 bfl_browse_goods_act: "$bfl_browse_goods$"
 bfl_browse_goods_desc: "Fiziksel saklama tekliflerini, mevcut talepleri veya gönüllü Gümrük Dairesi erişim anlaşmasını inceleyin. Bir ülke seçmek para kazandırmaz."
 bfl_browse_goods_effect_text: "$bfl_browse_goods$"
 bfl_browse_goods_effect_text_past: "$bfl_browse_goods$"
 bfl_burghers_estate_workout_mandate: "Emlak çalışma yetkisi"
 bfl_burghers_estate_workout_mandate_desc: "Bu mülk, hükümetine, kendisi adına gönüllü banka mevduatı çalışmalarını gözden geçirme yetkisini açıkça veriyor. Her teklifin hâlâ ayrı bir kabule ihtiyacı vardır. Bu ayrıcalığın iptal edilmesi, bekleyen emlak şartlarını geçersiz kılar. Kurtarma ödemeleri emlak cüzdanına devam ediyor."
 bfl_buy_bill: "Finanse edilen ödeme faturası · 100 altın"
 bfl_buy_bill_tip: "#T Finanse edilen ödeme faturası#!\nAktarım 100 finanse edilen bir ödeme faturası için altını bankaya gönderin. Fatura, banka kârı veya teminatsız bir kredi yerine ödenecek bir borç olarak kaydediliyor. Ticari Bono araştırması, sözleşme masası alanı ve bu işi kabul eden faaliyet gösteren bir banka gerektirir."
 bfl_buy_capital: "Sermayeye abone ol · 100 altın"
 bfl_buy_capital_tip: "#T Banka sermayesine abone olun#!\nAktarım 100 yeni banka mülkiyet birimleri satın almak için devlet altını. Birimler, mevcut birim başına pozitif banka özsermayesinden fiyatlandırılır. Bu, kârdan ziyade banka nakit parasını ve ödenmiş sermayeyi artırır. Yerel Bankacılık araştırması, sermaye tablosu alanı ve bu işi kabul eden faaliyet gösteren bir banka tarafından kilidi açıldı. Sermaye zarara uğrar ve mevduat olarak çekilemez."
 bfl_buy_confirm_desc: "Satın alma [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_quantity').GetValue|3] hisseleri [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_issuer').GetCountry.GetName] için [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_total').GetValue|2]@gold!. Bunlar piyasa yapıcı envanterindeki mevcut hisselerdir. İhraççı finansman almaz ve ihraç edilen hisseler değişmez. Teklif fiyatı, canlı piyasa erişimi, mevcut adetler, korunan nakit ve konsantrasyon limiti kabul sırasında tekrar kontrol edilir. Anlaşma bir diplomat tüketir ve bu ihraççının bir aylık alım/satım bekleme süresini başlatır."
 bfl_buy_confirm_title: "Hisse satın alımını onaylayın"
 bfl_buy_secondary_confirm_desc: "Satın al [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_quantity').GetValue|3] mevcut hisseler [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_issuer').GetCountry.GetName] itibaren [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_seller').GetCountry.GetName] için [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_total').GetValue|2]@gold!. Ödemeyi mevcut satıcı alır. İhraççı finansman almaz ve ihraç edilen hisseler değişmez. Kabul sırasında kullanılabilirlik, erişim, korunan fonlar ve bu teklifin revizyonu tekrar kontrol edilir. Anlaşma bir diplomat tüketir ve bu ihraççının bir aylık alım/satım bekleme süresini başlatır."
 bfl_buy_selected_bond: "Mevcut hak talebini satın alın"
 bfl_buy_selected_bond_tip: "Teklif edilen fiyatı mevcut satıcıya ödeyin. İhraççı yeni para almaz. Yürütme, mülkiyeti, son kullanma tarihini, üretimi, hem takasları hem de borçları ve nakdi yeniden kontrol eder."
 bfl_buy_shares: "Hisse satın al"
 bfl_buy_shares_desc: "Bir banka veya şirket seçin, hisse miktarını belirleyin ve ardından toplamı inceleyin. Satın alma, bir satış teklifinden veya piyasa yapıcı envanterinden mevcut hisseleri transfer eder. Yeni ihraçları finanse etmek için ayrı sermaye aboneliği eylemini kullanın."
 bfl_buy_shares_tip: "Bir banka veya şirket seçin, hisse miktarını belirleyin ve ardından toplamı inceleyin. Satın alma, bir satış teklifinden veya piyasa yapıcı envanterinden mevcut hisseleri transfer eder. Yeni ihraçları finanse etmek için ayrı sermaye aboneliği eylemini kullanın.\nTamamlanmış bir takas, Hisse Senedi İşlemi ve en az bir diplomat gerektirir. Her başarılı ticaret bir diplomat tüketir ve o ihraççı için bir aylık bekleme süresini başlatır. Mevcut diplomatlar: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bfl_available_trade_diplomats')|2]. Siparişlerin nakit değeri en az olmalıdır 0.01 altın."
 bfl_buy_sovereign_bond: "Teklif edilen bir devlet tahvili satın alın"
 bfl_buy_sovereign_bond_act: "$bfl_buy_sovereign_bond$"
 bfl_buy_sovereign_bond_desc: "Mevcut sahibinden mevcut bir devlet tahvili satın alın. Sahip olunan tamamlanmış bir Borsa binası gerektirir."
 bfl_buy_sovereign_bond_effect_text: "$bfl_buy_sovereign_bond$"
 bfl_buy_sovereign_bond_effect_text_past: "$bfl_buy_sovereign_bond$"
 bfl_buy_sovereign_bond_tip: "Açık bir teklifin ihraççısını seçin. Ödeme mevcut sahibine gider; ihraççı yeni gelir almaz. Alacağın tamamı, sabit yıllık kuponu ve anaparası bozulmadan el değiştirir."
 bfl_buy_state_confirm_desc: "Geri satın al [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_quantity').GetValue|3] mevcut hisseler [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_issuer').GetCountry.GetName] için piyasa yapıcı envanterinden [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_total').GetValue|2]@gold!, ülkenizin hazinesinden ödenir. Bu hisseler hazine hissenize geri döner. Banka finansman almıyor ve ihraç edilen hisseler değişmiyor. Mevcut bayi stoku, güncel piyasa fiyatı, canlı kiralama otoritesi ve hazine nakitleri tekrar kontrol edilir. Anlaşma bir diplomatı tüketiyor ve bu bankanın bir aylık alım/satım bekleme süresini başlatıyor."
 bfl_cancel: "İptal"
 bfl_cancel_selected_bond_offer: "Listelemeyi iptal et"
 bfl_cancel_selected_bond_offer_tip: "Size veya canlı sözleşmeli bankanıza ait bir teklifi geri çekin. Borç ve kupon değişmeden kalır."
 bfl_capital_button: "Sermayeye abone ol · 100 altın"
 bfl_cash: "Hazine nakit"
 bfl_cash_tip: "#T Hazine nakit#!\nAltın şu anda bankanın elinde.\n\nToplam nakit: [Country.GetFixedPointCurrencyValue('gold')|2]@gold!\nKorumalı nakit: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_protected_cash')|2]@gold!\nMevcut nakit: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_free_cash')|2]@gold!\n\nKorumalı nakit rezervleri 25% sıraya alınmış para çekme işlemlerinden sonra kalan yükümlülüklerin tamamı, tam para çekme kuyruğu, 25 altın işletim tamponu ve taahhüt edilen nakit. Mevcut nakit, minimum sıfır olmak üzere hazine nakitinden bu rezervin çıkarılmasıyla elde edilen tutardır. Korunan nakit zorunlu bir rezervdir; gerçekte tutulan nakit miktarını aşabilir."
