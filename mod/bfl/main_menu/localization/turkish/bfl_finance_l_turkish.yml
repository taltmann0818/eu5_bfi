 bfl_share_value_label: "Portföy değeri"
 bfl_sovereign_accounts: "Egemen hesaplar - banka varlıklarından ayrı"
 bfl_sovereign_accounts_subtitle: "Yerli devlet kredileri – banka varlıkları değil"
 bfl_sovereign_accounts_tip: "Bu yerli borç ve alacaklar devletin bankasına değil, devletindir. Bankaya ait krediler varlık donutuna dahil edilmiştir; Banka borçları mevduatları ve ödenmemiş işletme giderlerini içermektedir. Yerli borçlanma, geri ödeme ve kredi listeleri egemenin aktör olmasını sağlıyor."
 bfl_sovereign_banknotes: "Egemen Banknotlar"
 bfl_sovereign_banknotes_desc: "Kamu otoritesi tarafından desteklenen bir banka, ağır para yerine yazılı ödeme vaatleri dağıtabilir. Bunların kabulü, kurumun bunları geri ödeyeceğine ve veren makamın yükümlülüklerini yerine getireceğine duyulan güvene dayanır."
 bfl_sovereign_credit: "Devlet Kredisi"
 bfl_sovereign_credit_tip: "#T Egemen kredi#!\nGeri ödeme talebinin banka varlığı olarak kaydedildiği, banka nakitinden toprak sahibi bir devlete verilen kredi. Faaliyet gösteren bir banka ve yerel kredi koşullarını gerektirir. Bu yapıda yeni kredi uygulaması mevcut değil."
 bfl_sovereign_debt: "Devlet borcu"
 bfl_sovereign_debt_heading: "Devlet borcu [Country.GetName]"
 bfl_sovereign_note: "Egemenlik Notu"
 bfl_sovereign_note_tip: "#T Kullanılabilir banknotlar#!\nMutlakiyetçilik, Egemen Banknot araştırması, egemen yetkilendirme, sermaye Merkez Bankası ve ihraççının Banka Şubesi. Değişim 100 tamamen saklı bir iddia için tür. Bağımsız özsermaye bazlı tavan, gelen nakit parayı içermez. Gönüllü eşit transferler; Yerel ödemeler altın cinsinden kalıyor."
 bfl_sovereign_receivables: "Devlet alacakları"
 bfl_sovereign_receivables_heading: "Devlet alacakları [Country.GetName]"
 bfl_sovereign_restructuring: "Egemenliğin Yeniden Yapılanması"
 bfl_sovereign_restructuring_tip: "#T Egemen yeniden yapılanma#!\nBorç Yeniden Yapılandırma avansı kapsamında devlet borcunu yeniden müzakere edin. İzin verilen yaş, faaliyet gösteren bir banka ve desteklenen bir yerel borç işlemi gerektirir. Bu yapıda yerel yeniden yapılandırma uygulaması kullanılamaz."
 bfl_specialization_title: "Banka uzmanlığı"
 bfl_state_bonds_tip: "#T Devlet tahvili kapasitesi#!\nOlağanüstü yerel devlet tahvilleri: [GetPlayer.GetNumBonds]\nMaksimum yerel tahvil slotu: [GetPlayer.GetDoubleModifierValue('max_bonds', 'max_bonds_modifier')|0]\n\nBunlar, bankanın mevduatlarından, özsermayesinden ve diğer yükümlülüklerinden ayrı olarak devletinizin tahvilleridir. Kapasite, yerel temel yuvaları ve bağ kapasitesi değiştiricilerini içerir. Tahvil satmak aynı zamanda yerel borçlanma koşullarını da gerektirir."
 bfl_state_bonds_value: "Tahviller: [GetPlayer.GetNumBonds] / [GetPlayer.GetDoubleModifierValue('max_bonds', 'max_bonds_modifier')|0]"
 bfl_state_chartered_bank: "Devlet Yeminli Bankası"
 bfl_state_chartered_bank_desc: "Ayrı olarak finanse edilen yerel bir banka konusu. Egemen başlangıçta tüm hisselerin sahibidir ve Kredi'deki aylık temettü ödemesini belirler. Yeni banka abonelikleri sermayeyi artırıyor ve mevcut sahipliği zayıflatıyor. Devlet mevduatları imtiyazlı faiz kazanır."
