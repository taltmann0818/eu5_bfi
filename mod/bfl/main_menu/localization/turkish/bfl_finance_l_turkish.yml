 bfl_money_leave: "Temizlemeyi bırak"
 bfl_money_leave_tip: "Tamamen saklı bir talep için notlar takas türü. Kabul isteğe bağlıdır. İndirimler avans 75 a'ya karşı altın 100-altın üçüncü banka bonosu. Takas, vadesi geçmiş faturaların eşleştirilmesi ancak her üyenin net borcunu ödeyebilmesi durumunda gerçekleşir. Mevcut iddialar, kaybedilen yetki ve binalardan varlığını sürdürüyor."
 bfl_money_lending_rate: "Yeni kredi tabanı"
 bfl_money_lending_rate_tip: "Gelecekteki olağan krediler için yıllık tabanı şu şekilde değiştir: 3%, 6% ve 9%. Borçlu düzenlemeleri hala geçerlidir. Kabul edilen krediler oranlarını korur."
 bfl_money_notes: "Edinme 100 notlarda"
 bfl_money_notes_tip: "Mevcut sermayede Mutlakiyetçilik, Merkez Bankacılığı ve Devlet Banknotları araştırması, canlı devlet yetkilendirmesi, ihraççının tamamlanmış Banka Şubesi ve devletin tamamlanmış Merkez Bankası gerektirir, 100 hazine altını ve kullanılmayan banknot kapasitesi. Daha küçük olanı 25% banka özsermayesi ve 500 altın kapak dolaşımı."
 bfl_money_offer_accept: "Teminatlı avansı fonlayın"
 bfl_money_offer_accept_tip: "Fon 75 Mevcut yöneticinin, teklifin ve üçüncü banka teminatının geçerli kalması durumunda, borç verenin mevcut nakitinden altın. Bu tesis için kabul edilen yıllık ücret sabittir; en azından kamu destek ücretleri 9%."
 bfl_money_offer_decline: "İsteği reddet"
 bfl_money_offer_decline_tip: "Altını taşımadan veya teminat vermeden bu talebi kapatın."
 bfl_money_offer_desc: "İlerleme 75 ayrı olarak finanse edilen bir fona karşı altın 100-üçüncü bir bankada tutulan altın banknot. A 25% saç kesimi borç vereni korur. Kabul edilen yıllık indirim oranı bir ay süreyle geçerlidir; en azından kamu destek ücretleri 9%. Uzlaşma, önce borç verene ödeme yapar ve geri kalanı borçluya iade eder. Finanse edilmemiş teminat her iki iddiayı da korur. Bu isteğin süresi bu ay doluyor."
 bfl_money_offer_title: "Güvenli bir yerleşim tesisi"
 bfl_money_policy_rate: "Döngü gelecekteki indirim oranı"
 bfl_money_policy_rate_tip: "Gelecekteki teminatlı avanslar için yıllık oranı şu şekilde değiştirin: 6%, 9% ve 12%. Kabul sırasında bir aylık ücret alınır; Mevcut tesisler ücretlerini korur. En azından kamu destek ücretleri 9%."
 bfl_money_redeem: "Durum notlarını kullan"
 bfl_money_redeem_tip: "Egemen kontrolör tarafından tutulan tüm banknotları nominal değerleri karşılığında kullanın. Kaybolan yetki, araştırma veya şubeler mevcut talepleri iptal etmez. Ödenmemiş bir tazminat borcu devam ediyor."
 bfl_money_repay: "Güvenli tesis geri ödeme"
 bfl_money_repay_tip: "Üçüncü banka bono rehinini serbest bırakmak için mevcut teminatlı avansı artı kabul edilen sabit ücretini geri ödeyin. Yeterli miktarda kullanılabilir altın gerektirir."
 bfl_money_revoke: "Yetkiyi iptal et"
 bfl_money_revoke_tip: "Yeni banknotlar için egemen yetkiyi geri çekin. Mevcut notlar kullanılabilir durumda kalır."
 bfl_money_settings: "Politika"
 bfl_money_settings_tip: "Para politikasını, senet yetkisini, teminatlı kredi ve takas kontrollerini gösterin veya gizleyin."
 bfl_money_settings_tip_tip: "Tamamen saklı bir talep için notlar takas türü. Kabul isteğe bağlıdır. İndirimler avans 75 a'ya karşı altın 100-altın üçüncü banka bonosu. Takas, vadesi geçmiş faturaların eşleştirilmesi ancak her üyenin net borcunu ödeyebilmesi durumunda gerçekleşir. Mevcut iddialar, kaybedilen yetki ve binalardan varlığını sürdürüyor."
 bfl_money_subtitle: "Paraya çevrilebilir talepler · finanse edilen uzlaşma"
 bfl_money_subtitle_tip: "Tamamen saklı bir talep için notlar takas türü. Kabul isteğe bağlıdır. İndirimler avans 75 a'ya karşı altın 100-altın üçüncü banka bonosu. Takas, vadesi geçmiş faturaların eşleştirilmesi ancak her üyenin net borcunu ödeyebilmesi durumunda gerçekleşir. Mevcut iddialar, kaybedilen yetki ve binalardan varlığını sürdürüyor."
 bfl_money_terms: "Ana para ve ihraçlar gelirden hariç tutulur. İndirim oranları yıllıktır ve kabul edildiğinde sabittir. Güven düşüyor 25 rezerv açığında; tamamen desteklenen notlar enflasyon eklemez. Vanilya ödemelerinde yerli altın kullanılmaya devam ediyor."
 bfl_money_terms_tip: "Tamamen saklı bir talep için notlar takas türü. Kabul isteğe bağlıdır. İndirimler avans 75 a'ya karşı altın 100-altın üçüncü banka bonosu. Takas, vadesi geçmiş faturaların eşleştirilmesi ancak her üyenin net borcunu ödeyebilmesi durumunda gerçekleşir. Mevcut iddialar, kaybedilen yetki ve binalardan varlığını sürdürüyor."
 bfl_money_title: "Para ve yerleşim"
 bfl_money_title_tip: "Ana para ve ihraçlar gelirden hariç tutulur. İndirim oranları yıllıktır ve kabul edildiğinde sabittir. Güven düşüyor 25 rezerv açığında; tamamen desteklenen notlar enflasyon eklemez. Vanilya ödemelerinde yerli altın kullanılmaya devam ediyor."
 bfl_native_credit_label: "Kredi portföyü"
 bfl_native_tab: "Devlet kredileri"
 bfl_native_takeover: "Yerel Devralma"
 bfl_new_capital_subscription: "Yeni sermayeye abone olun"
 bfl_new_capital_subscription_desc: "Yatırım yap 100@gold! bankanızın fonlarının [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_issuer').GetCountry.GetName] maddi NAV'ında yeni ihraç edilen özsermaye olarak. İhraççı ödemeyi alır ve mevcut sahipler sulandırılır. Bu, hisse satın alma işleminden ayrı bir sermaye aboneliğidir. Yürütme, ele geçirilen NAV'ı, ihraç edilen birimleri, araştırmayı, korunan fonları ve konsantrasyon limitini yeniden kontrol eder. Bir diplomat tüketir ve bu ihraççının bir aylık alım satım bekleme süresini başlatır."
 bfl_new_capital_subscription_tip: "Birincil finansman: yatırım 100 yönetilen bankadan altın. İhraççı nakit alır ve yeni hisseler ihraç eder. Bu, mevcut hisse senedi alım satımından farklıdır."
 bfl_no_automatic_tribute: "Otomatik charter haraç yok"
 bfl_no_automatic_tribute_cost_modifier: "Otomatik kiralama haraç maliyeti"
 bfl_no_bank: "Mevcut bir Devlet Bankasını Kararlar aracılığıyla kiralayın veya bağımsız bir bankacılık ülkesini oynayın. Ülkenizin bir banka kiralayabilmesi için kendi sermaye piyasasına sahip olması gerekir."
 bfl_nobles_estate_workout_mandate: "Emlak çalışma yetkisi"
 bfl_nobles_estate_workout_mandate_desc: "Bu mülk, hükümetine, kendisi adına gönüllü banka mevduatı çalışmalarını gözden geçirme yetkisini açıkça veriyor. Her teklifin hâlâ ayrı bir kabule ihtiyacı vardır. Bu ayrıcalığın iptal edilmesi, bekleyen emlak şartlarını geçersiz kılar. Kurtarma ödemeleri emlak cüzdanına devam ediyor."
 bfl_offer_bank_shares: "Yeni banka hisseleri teklif edin"
 bfl_offer_bank_shares_tip: "Diğer bankaların ve ülkelerin abone olmasına izin ver 100 altın, bankanın mevcut net varlık değerinde. Yeni hisseler yalnızca bedeli ödendiğinde ihraç edilir; mevcut sahipler seyreltilir. Yerli Bankacılık araştırması ve pozitif özsermaye hala gerekli."
 bfl_offer_bond: "Bankada tutulan devlet tahvili teklif edin"
 bfl_offer_bond_tip: "Üç ay boyunca bankalarda tutulan en eski tahvilleri şu adreste listeleyin: 98% nominal değerde. Hem satmak hem de satın almak, sahip olunan tamamlanmış bir Borsa binası gerektirir. Kabul, satıcıyı, mevcut sahibi, üretimi, fonları ve son kullanma tarihini yeniden kontrol eder. Borçlar ticareti engeller."
 bfl_offer_bond_workout_01: "Yeniden yapılandırma teklifi"
 bfl_offer_bond_workout_01_tip: "Bu mevcut sahibin bir teklifi kabul etmesini isteyin 20% anapara ve ödenmemiş kupon indirimi ve yıllık kupon kesintisinin bir puan olması, 1% kat. Sahibi ayrıca kabul etmedikçe hiçbir para hareket etmez. Fiyat teklifinin süresi bu ay doluyor ve hak talebinde yapılan değişiklikler teklifi geçersiz kılıyor."
 bfl_offer_bond_workout_02: "Yeniden yapılandırma teklifi"
 bfl_offer_bond_workout_02_tip: "Bu mevcut sahibin bir teklifi kabul etmesini isteyin 20% anapara ve ödenmemiş kupon indirimi ve yıllık kupon kesintisinin bir puan olması, 1% kat. Sahibi ayrıca kabul etmedikçe hiçbir para hareket etmez. Fiyat teklifinin süresi bu ay doluyor ve hak talebinde yapılan değişiklikler teklifi geçersiz kılıyor."
