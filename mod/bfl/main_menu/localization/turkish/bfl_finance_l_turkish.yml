 bfl_investment_title: "Kredi ve yatırımlar"
 bfl_invite_equity_capital: "Banka özsermayesini ekleyin"
 bfl_invite_equity_capital_desc: "Abone ol 100 altın [ROOT.GetCountry.MakeScope.GetVariable('bfl_capital_issuer').GetCountry.GetName] seçilen hazine veya emlak cüzdanından. Abone piyasa fiyatından yeni hisseler alır. Emlak cüzdanları en azından 25 altın. Ödenen hisseleri finansal mülkiyet, gelecekteki temettüler ve seyreltme takip etmektedir."
 bfl_invite_equity_capital_tip: "Abone olmak için hazineyi veya emlak cüzdanını seçin 100 altın bankanın mevcut NAV'ında. Yeni hisseler mevcut sahipleri sulandırır; banka ödemeyi alır."
 bfl_join_clearing_group: "Bir takas grubuna katılın"
 bfl_join_clearing_group_act: "$bfl_join_clearing_group$"
 bfl_join_clearing_group_command: "$bfl_join_clearing_group$"
 bfl_join_clearing_group_command_desc: "$bfl_join_clearing_group_desc$"
 bfl_join_clearing_group_desc: "Üye kabul eden bir operatöre katılın. Grup başına dört banka; Eşleşen vadesi geçmiş ödeme faturaları, fonlanan net borçla kapatılır. Kısa üye, talepleri silmeden grubu bloke eder."
 bfl_join_clearing_group_effect_text: "$bfl_join_clearing_group$"
 bfl_join_clearing_group_effect_text_past: "$bfl_join_clearing_group$"
 bfl_join_clearing_group_tip: "Üye kabul eden, araştırılmış bir takas operatörü seçin. Devrimler, Takas Odası ve Gelişmiş Takas araştırması gereklidir. En fazla dört banka açıkça katılıyor; kısa bir üye tüm hak taleplerini korur."
 bfl_liabilities_label: "Banka yükümlülükleri"
 bfl_liabilities_label_tip: "#T Toplam borç#!\nBanka hesaplarına kaydedilen yükümlülükler. Bu, eyaletinizin yerel kredilerinden ve tahvillerinden ayrıdır.\n\nMevduat anaparası: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_deposit_principal')|2]@gold!\nKredili mevduat faizi: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_deposit_interest')|2]@gold!\nOlağanüstü notlar: [Country.MakeScope.GetVariable('bfl_notes_outstanding').GetValue|2]@gold!\nDiğer borçlar: [Country.MakeScope.GetVariable('bfl_other_payables').GetValue|2]@gold!\nToplam: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_liabilities')|2]@gold!\n\nSıraya alınmış para çekme işlemleri [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_withdrawals_due')|2]@gold! zaten depozito taleplerinin bir parçasıdır ve ikinci kez eklenmez."
 bfl_liquidity_facilities: "Likidite Olanakları"
 bfl_liquidity_facilities_desc: "Güçlü bir bankacılık kurumu bile her madeni para talebini aynı anda karşılayamayabilir. Yardımın kurumun kaldıramayacağı kayıpları gizlememesi koşuluyla, sağlam varlıklara yönelik geçici avanslar bu açığı kapatabilir."
 bfl_liquidity_warning: "Banka likiditesi dikkat gerektiriyor"
 bfl_liquidity_warning_desc: "Bankanız para çekme kuyruğunda veya yetersiz sermayeye sahip. Mevduatları ve yeniden sermayelendirmeyi incelemek için Açık Ekonomi → Bankacılık ve Finans."
