 bfl_charter_begin_tip: "Uygun Devlet Bankası seçicisini açın. Bir banka seçilene kadar hiçbir para veya araştırma değişmez; İptal her iki hazineyi de değiştirmeden bırakır."
 bfl_charter_selection_tip: "Aktarım [ROOT.GetCountry.MakeScope.ScriptValue('bfl_charter_investment')|0]@gold! seçilen bankaya yeni devlet sermayesi olarak. Ülkesini, binalarını, mevcut iddialarını ve yükümlülüklerini koruyun, ardından kalıcı uzmanlığını seçin."
 bfl_chartered_bank: "Yeminli Banka"
 bfl_chartered_bank_desc: "Bina bazlı bir Devlet Bankası devreye girdi. Nakit parası ve yükümlülükleri hükümdarından ayrı kalır. Otomatik haraç toplanmaz."
 bfl_clearing: "Takas"
 bfl_clearing_tip: "#T Gelişmiş takas#!\nDevrimler, Gelişmiş Takas ve yerel Takas Odası araştırması. Sahip olunan tamamlanmış bir Takas Odası ve açık üye kabulü, eşleşen vadesi geçmiş senetlerin atomik net mutabakatına olanak sağlar. Kısa üye, grubu bloke eder ve her talebi korur."
 bfl_clergy_estate_workout_mandate: "Emlak çalışma yetkisi"
 bfl_clergy_estate_workout_mandate_desc: "Bu mülk, hükümetine, kendisi adına gönüllü banka mevduatı çalışmalarını gözden geçirme yetkisini açıkça veriyor. Her teklifin hâlâ ayrı bir kabule ihtiyacı vardır. Bu ayrıcalığın iptal edilmesi, bekleyen emlak şartlarını geçersiz kılar. Kurtarma ödemeleri emlak cüzdanına devam ediyor."
 bfl_close_bank_offering: "Hisse teklifini kapat"
 bfl_close_bank_offering_tip: "Harici abonelikleri kabul etmeyi bırakın. Mevcut mülkiyet ve temettü hakları geçerliliğini korur. Egemen hâlâ kendi bankasının sermayesini yeniden yapılandırabilir."
 bfl_close_bond_offer: "Yakın tahvil teklifi"
 bfl_close_bond_offer_tip: "Mevcut ikincil teklifi geri çekin. Ödenmemiş borç ve kuponlar ödenmemiş durumda."
 bfl_collateral: "Teminat"
 bfl_collateralization: "Teminatlandırma"
 bfl_collateralization_desc: "Bir söz mülkle desteklendiğinde güven güçlenir. Bir rehin ve alacaklının bu rehin üzerindeki haklarını kaydederek, bankacılar, borçlunun anlaşmaya uymaması durumunda geri alınabilecek varlıklar karşılığında borç verebilirler."
 bfl_commenda: "Övgü"
 bfl_commenda_available_color: "green"
 bfl_commenda_available_icon: "@bfl_commenda_opportunity!"
 bfl_commenda_available_left_click: "Bu işlemi inceleyin"
 bfl_commenda_available_name: "Övgü finanse edilebilir"
 bfl_commenda_available_tooltip: "[GetPlayer.MakeScope.GetVariable('bfl_op_country').GetCountry.GetName] · 10 [GetPlayer.MakeScope.GetVariable('bfl_op_good').Goods.GetNameWithNoTooltip]\n[GetPlayer.MakeScope.GetVariable('bfl_op_from').GetMarket.GetName] → [GetPlayer.MakeScope.GetVariable('bfl_op_to').GetMarket.GetName]\nTahmini banka maliyeti: [GetPlayer.MakeScope.GetVariable('bfl_op_cost').GetValue|2]@gold!\nGösterge banka fazlası: +[GetPlayer.MakeScope.GetVariable('bfl_op_surplus').GetValue|2]@gold!\n\nİki aylık kargo operasyonu için güncel piyasa fiyatları; Fazlalık, geri kazanılan sermayeyi içermez. Fiyatlar ve erişim değişebilir. Sermaye ve getiriler risk altındadır. Yalnızca bu kargonun fiili satışı anlaşmayı karşılar. Operatör kabul etmelidir. Fırsatlar aylık olarak yenilenir ve bir teklif gönderilmeden önce tekrar kontrol edilir."
 bfl_commenda_cargo: "Öneri: keşfedilen bölgedeki kargo gemisi"
 bfl_commenda_cargo_act: "Gemi keşfedilen alan kargosu"
 bfl_commenda_cargo_desc: "Sponsorlu operatörü ve keşfedilen alanın ortasında veya sınırında bulunan bir pazardan on birimlik bir kargo seçin. Yalnızca kullanılmayan, kabul edilen finansman, yerel satın alma maliyetini ödeyebilir. Keşif ödemesi veya ilgisiz ticari atıf yok."
 bfl_commenda_cargo_effect_text: "Gemi keşfedilen alan kargosu"
 bfl_commenda_cargo_effect_text_past: "Gemi keşfedilen alan kargosu"
 bfl_commenda_cargo_tip: "Kabul edilen keşif gezisinin doğrulanmış keşfini, kalan yetkiyi, yerel pazar erişimini ve stokunu gerektirir. Operatör veya siyasi kontrolör yolculuğu yönetir."
 bfl_commenda_desc: "Bir yolculuğa çıkan bir tüccar, bir gemiyi dolduracak sermayeye ihtiyaç duymadan ticaret yapma becerisine sahip olabilir. Commada, bir finansörün parasını seyahat ortağının emeğine katarak girişimin gelirini anlaşmaya göre paylaştırıyor."
 bfl_commenda_expedition: "Adlandırılmış bir keşif gezisine fon sağlayın"
 bfl_commenda_expedition_act: "Adlandırılmış bir keşif gezisine fon sağlayın"
 bfl_commenda_expedition_desc: "Bir operatör, fırlatma limanı, keşfedilmemiş bir deniz alanı ve kaşif seçin. Deniz hedefleri operatörün deniz menzili içerisinde olmalıdır; topraksız şirketler seçilen sahip olunan tesis sahibinin menzilini kullanır. Kabul, önerilen koşullar altında yerel hazırlığı finanse eder. Banka hiçbir siyasi kontrol elde edemez."
 bfl_commenda_expedition_effect_text: "Adlandırılmış bir keşif gezisine fon sağlayın"
 bfl_commenda_expedition_effect_text_past: "Adlandırılmış bir keşif gezisine fon sağlayın"
 bfl_commenda_expedition_tip: "Onay vermeden önce bir operatör, alan, fırlatma limanı ve kaşif seçin. Finansman yalnızca gerçek yerel hazırlık maliyetini öder. Hazırlık iade edilmez. Kalan yetki, keşfedilen alanın içinde veya sınırında bulunan bir pazardan gelen kargoyu finanse edebilir; yalnızca ölçülen satış gelirleri geri ödeme yapabilir."
 bfl_commenda_opportunity_consent: "Bu isimli kargoyu ve canlı finansman yetkilinizi tekrar kontrol edin. Mevcut Koşullarınızı kullanarak bir teklif gönderin; operatör kabul edene kadar para hareket etmez."
 bfl_commenda_opportunity_later: "Daha sonra düşünün"
 bfl_commenda_opportunity_propose: "Bu şartları operatöre gönderin"
 bfl_commenda_opportunity_review: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_op_country').GetCountry.GetName] · 10 [ROOT.GetCountry.MakeScope.GetVariable('bfl_op_good').Goods.GetNameWithNoTooltip]\n[ROOT.GetCountry.MakeScope.GetVariable('bfl_op_from').GetMarket.GetName] → [ROOT.GetCountry.MakeScope.GetVariable('bfl_op_to').GetMarket.GetName]\nTahmini banka maliyeti: [ROOT.GetCountry.MakeScope.GetVariable('bfl_op_cost').GetValue|2]@gold!\nGösterge banka fazlası: +[ROOT.GetCountry.MakeScope.GetVariable('bfl_op_surplus').GetValue|2]@gold!\n\nİki aylık kargo operasyonu için güncel piyasa fiyatları; Fazlalık, geri kazanılan sermayeyi içermez. Fiyatlar ve erişim değişebilir. Sermaye ve getiriler risk altındadır. Yalnızca bu kargonun fiili satışı anlaşmayı karşılar. Operatör kabul etmelidir. Fırsatlar aylık olarak yenilenir ve bir teklif gönderilmeden önce tekrar kontrol edilir."
 bfl_commenda_tip: "#T Övgü#!\nTanımlanmış bir kar payı karşılığında bir seyahate veya ticaret girişimine sermaye taahhüt edin. Commenda araştırması, Yurtdışı Yatırım ve Keşif yaşı veya üzerini gerektirir. Bu yapıda yerel proje yürütme kullanılamıyor."
 bfl_commercial_bill: "Ticari Fatura"
 bfl_commercial_bills: "Ticari Faturalar"
 bfl_commercial_bills_desc: "Ticari merkezler arasında madeni para taşımak maliyetli ve tehlikelidir. Yazılı senetler, tüccarların yükümlülüklerini güvenilir bankacılık kurumları aracılığıyla ödemelerine olanak tanıyarak, ihraççının itibarını bir ticaret aracı haline getirir."
 bfl_commodity_forward: "Emtia İleri"
 bfl_commodity_forward_tip: "#T Emtia ileri#!\nFinanse edilen gelecekteki mal teslimatını kabul edin. Commodity Forwards araştırması, Merchant Finance ve Mutlakiyetçilik çağı veya üzerini gerektirir. Bu yapıda fiziki teslimat ve yerleşim mevcut değildir."
 bfl_commodity_forwards: "Emtia Vadeli İşlemleri"
 bfl_commodity_forwards_desc: "Bir hasat, sevkıyat veya atölye siparişi teslimattan önce satılabilir. Gelecekteki bir fiyatı sabitleyen anlaşmalar, tüccarların uzak pazarların belirsizliğine ve değişen mevsimlere rağmen işlerini düzenlemelerine yardımcı olur."
 bfl_commodity_inventory: "Emtia Envanteri"
 bfl_commodity_inventory_tip: "#T Emtia envanteri#!\nTicaret amacıyla tutulan finans malları. Emtia Yatırımları araştırması, Merchant Finance ve Discovery yaşı veya üzerini gerektirir. Bu yapıda fiziksel malların satın alınması, saklanması ve teslim edilmesi mümkün değildir."
 bfl_commodity_investments: "Emtia Yatırımları"
 bfl_commodity_investments_desc: "Ticareti finanse eden bankacılar da malları kendileri tutabilirler. Tahıl, yün ve diğer mallar, değeri depolamaya, taşımaya ve uzak pazarların değişen ihtiyaçlarına bağlı olan yatırımlara dönüşüyor."
 bfl_company_crew: "Aktarım 250 denizciler şirkete"
 bfl_company_crew_desc: "Şu anda kontrol ettiğiniz yerel bir şirketi yönetin. Fonlanan sermaye işletme gelirine dahil edilmez."
 bfl_company_crew_tip: "Şu anda kontrol ettiğiniz yerel bir şirketi yönetin. Sermaye katkıları finansmandır. Şirket dağıtımları, yerel maliyetlerden, taşınan zararlardan, borç rezervlerinden ve nakit tamponlarından sonra birikmiş ticari kazançları kullanır. Siyasi derebey ile mali sahip ayrıdır."
 bfl_company_equity: "Şirket Sermayesi"
 bfl_company_equity_desc: "Büyük ticari girişimler, çok az tüccarın tek başına sağlayabileceği servetlere ihtiyaç duyar. Mülkiyetin yatırımcılar arasında bölünmesi, bir şirketin taahhütlerinin risklerini ve ödüllerini dağıtırken kalıcı sermaye oluşturmasına olanak tanır."
 bfl_company_equity_tip: "#T Şirket özsermayesi#!\nTanınmış bir şirkette sahiplik payı için sermayeye abone olun. Şirket Sermayesi araştırması, Yurtdışı Yatırım ve Reformasyon çağı veya sonrasını gerektirir. Bu yapıda yerel şirket düzenlemesi ve sahiplik anlaşması mevcut değildir."
 bfl_company_expedition: "Şirket: yerel keşif hazırlamak"
 bfl_company_expedition_desc: "Bir şirket tesisinde deniz keşfine hazırlanmak için şirket hazinesini, denizcileri ve kaşifi kullanın. Yerel hazırlık ve ilerleme geçerlidir. Discovery hiçbir nakit veya yatırım karı sağlamaz."
 bfl_company_expedition_tip: "Ticaret ve keşif yetkisi, Harita yapımı, uygun bir şirket kaşifi, denizciler ve mevcut girişim bütçesi gerektirir. Yerel hazırlık süresi geçerlidir."
 bfl_company_exploration_capacity: "Şirket keşif kurulumu"
 bfl_company_exploration_capacity_desc: "Kapasite 500 denizciler bir keşif yetkisine sahipken. Denizciler şirketten gelmeli veya siyasi kontrolörden finanse edilen bir transfer olmalıdır."
 bfl_company_explore: "Şirketin görevi: ticaret ve keşif"
 bfl_company_explore_desc: "Şu anda kontrol ettiğiniz yerel bir şirketi yönetin. Fonlanan sermaye işletme gelirine dahil edilmez."
 bfl_company_explore_tip: "Şu anda kontrol ettiğiniz yerel bir şirketi yönetin. Sermaye katkıları finansmandır. Şirket dağıtımları, yerel maliyetlerden, taşınan zararlardan, borç rezervlerinden ve nakit tamponlarından sonra birikmiş ticari kazançları kullanır. Siyasi derebey ile mali sahip ayrıdır."
 bfl_company_fund: "Katkıda bulunun 100 altından şirket sermayesine"
 bfl_company_fund_desc: "Şu anda kontrol ettiğiniz yerel bir şirketi yönetin. Fonlanan sermaye işletme gelirine dahil edilmez."
 bfl_company_fund_tip: "Şu anda kontrol ettiğiniz yerel bir şirketi yönetin. Sermaye katkıları finansmandır. Şirket dağıtımları, yerel maliyetlerden, taşınan zararlardan, borç rezervlerinden ve nakit tamponlarından sonra birikmiş ticari kazançları kullanır. Siyasi derebey ile mali sahip ayrıdır."
 bfl_company_list_equity: "Şirket özsermaye listelemesini yetkilendirin"
 bfl_company_list_equity_desc: "Ücretli NAV birincil aboneliklerini ve ikincil ticaretini yetkilendirin. Banka satın almaları, Yurtdışı Yatırım, Şirket Sermayesi araştırması ve ikincil işlemler için tamamlanmış takas gerektirir. Siyasi egemenlik değişmeden kalır."
 bfl_company_list_equity_tip: "Canlı siyasi kontrolör piyasa katılımına izin verir. Nakit veya birim verilmez."
 bfl_company_native_channels: "Yerel Genel Merkez geliri ve söz konusu ödemeler yerel bütçede kalır. Şirket sermaye piyasaları, banka kurumsal kredileri ve commenda, ayrı araştırma ve dağıtım kapılarını kullanır."
 bfl_company_panel: "İşletme şirketleri"
 bfl_company_panel_tip: "Şirket hazineleri ve siyasi kontrol, banka hesaplarından ayrı kalır. Yerel Karargah sahibi geliri, Karargahın doğrudan derebeyi geliri ve yerli tabi ödemeler, yerli alıcılarda kalır. Yalnızca yerel maliyetlerden arındırılmış tutulan ticaret, ek bir sahip dağıtımını finanse edebilir. Sermaye ve keşif hariçtir."
 bfl_company_retain: "Şirketin görevi: kazançları korumak"
 bfl_company_retain_desc: "Şu anda kontrol ettiğiniz yerel bir şirketi yönetin. Fonlanan sermaye işletme gelirine dahil edilmez."
 bfl_company_retain_tip: "Şu anda kontrol ettiğiniz yerel bir şirketi yönetin. Sermaye katkıları finansmandır. Şirket dağıtımları, yerel maliyetlerden, taşınan zararlardan, borç rezervlerinden ve nakit tamponlarından sonra birikmiş ticari kazançları kullanır. Siyasi derebey ile mali sahip ayrıdır."
 bfl_company_route: "Şirket: yerli ticaret yolunu aç"
 bfl_company_route_desc: "Aşağıdakileri kullanarak şirkete ait bir yerel rota açın: 0.1 tüccar kapasitesi. Bir ticaret yetkisi, mevcut işletme bütçesi, yerel pazara erişim, fazlalık ve kapasite gerektirir. Şirket başına ayda maksimum bir komutalı rota. Yerel AI kendi ticaret davranışını korur."
 bfl_company_route_tip: "Şirketi, kaynak pazarı, hedef pazarı, ticari pazarı ve malları seçin. Yerel ticaret maliyetleri motor tarafından tahsil edilir."
 bfl_company_select: "İşletmeci şirketi seçin"
 bfl_company_select_desc: "Mevcut siyasi kontrolünüz altındaki yerel bir şirketi inceleyin."
 bfl_company_select_tip: "Şu anda kontrol ettiğiniz yerel bir şirketi seçin. Seçim ve ekstre gösterimi, nakit taşımaz veya bir ayı kapatmaz."
 bfl_company_statement: "Nakit: [Country.GetFixedPointCurrencyValue('gold')|2]@gold!   Ayrılmış arabellek: [Country.MakeScope.GetVariable('bfl_company_buffer').GetValue|2]@gold!\nYerli ticaret: [Country.MakeScope.GetVariable('bfl_company_trade_receipts').GetValue|2]   Net bütçe: [Country.MakeScope.GetVariable('bfl_company_native_net').GetValue|2]\nUygun kazançlar: [Country.MakeScope.GetVariable('bfl_company_verified_profit').GetValue|2]   Sahibine ödenen tutar: [Country.MakeScope.GetVariable('bfl_company_dividend').GetValue|2]@gold!\nTesisler: [Country.MakeScope.GetVariable('bfl_company_facility_count').GetValue|0]   Rotalar: [Country.MakeScope.GetVariable('bfl_company_route_count').GetValue|0]   Yürütülen hacim: [Country.MakeScope.GetVariable('bfl_company_volume').GetValue|2]\nTicaret bütçesi: 50   Yeniden yatırım rezervi: 100   Girişim bütçesi: 100   Sahip ödemesi: 25%"
 bfl_company_strategy_construction: "Şirket rezervlerini yerel bir ticaret tesisinde yeniden yatırın"
 bfl_company_trade: "Şirketin görevi: ticaret"
 bfl_company_trade_desc: "Şu anda kontrol ettiğiniz yerel bir şirketi yönetin. Fonlanan sermaye işletme gelirine dahil edilmez."
 bfl_company_trade_tip: "Şu anda kontrol ettiğiniz yerel bir şirketi yönetin. Sermaye katkıları finansmandır. Şirket dağıtımları, yerel maliyetlerden, taşınan zararlardan, borç rezervlerinden ve nakit tamponlarından sonra birikmiş ticari kazançları kullanır. Siyasi derebey ile mali sahip ayrıdır."
 bfl_corporate_credit: "Kurumsal Kredi"
 bfl_corporate_credit_desc: "Ticari işletmelerin tek bir sefer veya sezonu doldurması nedeniyle kredi ihtiyaçları daha kalıcı hale geliyor. Bankacılık kurumları, bir işletmenin kaynakları ve beklentilerinin yanı sıra bireysel tüccarların durumlarını da değerlendirmeyi öğrenirler."
 bfl_corporate_credit_tip: "#T Kurumsal kredi#!\nTanınmış bir ticaret şirketine borç verin. Kurumsal Kredi araştırması, Ticari Finansman ve Reformasyon çağı veya üzerini gerektirir. Bu yapıda yeni yerel şirket kredisi uygulaması kullanılamıyor."
