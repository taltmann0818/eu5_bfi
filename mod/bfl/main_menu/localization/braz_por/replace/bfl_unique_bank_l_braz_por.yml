l_braz_por:
 wisselbank_desc: "O banco de câmbio da cidade reúne moedas e letras sob o teto da antiga prefeitura, organizando um comércio que cruza todas as fronteiras. Suas reservas e livros cuidadosos sustentam a confiança no crédito público. Uma Wisselbank concluída reduz a administração do banco autorizado em 15% e permite serviços monetários após os avanços necessários."
 riksbank_desc: "Sob a guarda dos estamentos, um banco permanente mantém as reservas do reino e organiza seu crédito público. Seus escriturários recebem depósitos, liquidam obrigações e preservam a confiança nas promessas do Estado. Uma Riksbank concluída reduz a administração do banco autorizado em 15% e permite serviços monetários após os avanços necessários."
