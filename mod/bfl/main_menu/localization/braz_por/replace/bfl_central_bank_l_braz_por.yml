l_braz_por:
 central_bank_desc: "Uma instituição central para a guarda de reservas e a ordenação do crédito público reúne o negócio disperso das finanças sob o mesmo tecto. Um banco credenciado apoiado por um Banco Central completo paga 15% menos custos administrativos e ganha acesso a serviços monetários à medida que são pesquisados os avanços necessários. As notas permanecem obrigações garantidas; a sua emissão não gera lucro bancário."
