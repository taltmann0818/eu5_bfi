l_braz_por:
 AUTOMATED_SYSTEM_CREDIT: "Gestão de Crédito"
 AUTOMATED_SYSTEM_CREDIT_DESC: "Gerenciar empréstimos e títulos do estado. Seu banco também analisa aquisições de empréstimos, oferece empréstimos financiados a mutuários que precisam de dinheiro e investe o dinheiro disponível em ações pesquisadas. As empresas gerenciam o comércio e a exploração. O banco mantém reservas e verifica a capacidade de endividamento; os mutuários devem aceitar novos empréstimos."
 AUTOMATE_SYSTEM_TOOLTIP_CREDIT: "Habilite o gerenciamento de crédito na automação: dívida estadual, empréstimos bancários, investimentos e operações empresariais."
 DEAUTOMATE_SYSTEM_TOOLTIP_CREDIT: "Desative o gerenciamento de crédito. Os empréstimos, depósitos e pagamentos prometidos existentes continuam a ser atendidos."
