l_braz_por:
 banking_office: "Agência Bancária"
 banking_office_desc: "Uma agência bancária local. Um soberano com banco autorizado pode financiar agências estrangeiras pela construção normal, sujeita às relações com o anfitrião e aos requisitos habituais. Após concluída, a agência pertence ao banco autorizado. Novos créditos soberanos, depósitos e investimentos exigem uma agência concluída do banco na capital atual do soberano. As obrigações existentes continuam sendo administradas."
