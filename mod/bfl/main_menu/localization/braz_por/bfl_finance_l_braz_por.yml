 bfl_assets_label: "Ativos totais"
 bfl_assets_label_tip: "#T Ativos totais#!\nDinheiro e ativos registrados de propriedade do banco.\n\nDinheiro do Tesouro: [Country.GetFixedPointCurrencyValue('gold')|2]@gold!\nCarteira de empréstimos: [Country.MakeScope.GetVariable('bfl_native_credit_value').GetValue|2]@gold!\nPosições patrimoniais (valor contábil): [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_security_carrying')|2]@gold!\nCrédito e títulos personalizados: [Country.MakeScope.GetVariable('bfl_custom_credit_value').GetValue|2]@gold!\nInventário: [Country.MakeScope.GetVariable('bfl_inventory_value').GetValue|2]@gold!\nProjetos: [Country.MakeScope.GetVariable('bfl_project_value').GetValue|2]@gold!\nTotal: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_assets')|2]@gold!\n\nEmpréstimos, posições patrimoniais, estoques e projetos são registrados como valores de ativos, e não dinheiro disponível para gastar. Os reembolsos do principal trocam um ativo de empréstimo por dinheiro; eles não geram lucro."
 bfl_authorize_note_bank: "Autorizar notas resgatáveis"
 bfl_authorize_note_bank_act: "$bfl_authorize_note_bank$"
 bfl_authorize_note_bank_desc: "Autorize seu banco credenciado, ou um banco independente com filial em sua capital, a trocar espécies por notas resgatáveis totalmente lastreadas após a pesquisa necessária. Um Banco Central completo em sua capital também é necessário para novas emissões. A autorização não cria ouro e pode ser retirada."
 bfl_authorize_note_bank_effect_text: "$bfl_authorize_note_bank$"
 bfl_authorize_note_bank_effect_text_past: "$bfl_authorize_note_bank$"
 bfl_back_to_bank: "Contas bancárias"
 bfl_balance_paid_tip: "Pagamento financiado recebido na última liquidação mensal. Essas transferências já estão em sua tesouraria e não devem ser adicionadas novamente ao total da renda nativa."
 bfl_bank_capital_subscriptions_desc: "Uma casa bancária não precisa depender inteiramente da fortuna da sua família fundadora. As subscrições trazem parceiros adicionais para a empresa, reunindo o seu capital enquanto registam a reivindicação de cada investidor sobre a sua prosperidade futura."
 bfl_bank_dividends: "Dividendos Bancários"
 bfl_bank_equity_subscribe: "Tesouraria bancária: subscrever 100 ouro"
 bfl_bank_equity_subscribe_tip: "Investir 100 do excedente de capital e caixa protegido real do banco administrado ao NAV tangível do emissor selecionado. Novas unidades pagas entram na carteira do banco. Máximo 25% de um banco ou 60% de uma empresa com permissão no exterior. Este é um financiamento primário, não uma compra de um acionista existente."
 bfl_bank_identity_tip: "[Country.GetName] detém seu próprio tesouro, ativos e obrigações. Esses totais pertencem ao banco, separadamente do tesouro estadual. A Merchant Finance é especializada em empréstimos comerciais e corporativos; Overseas Investment é especializada em empreendimentos e empresas. Um banco escolhe uma especialização permanente."
 bfl_bank_share_dealing: "Negociação de ações bancárias"
 bfl_bank_share_dealing_desc: "A fortuna de um sócio não precisa permanecer vinculada ao mesmo banco para sempre. As transferências de propriedade reconhecidas permitem que os investidores vendam os seus interesses a terceiros enquanto a instituição continua a sua actividade sem retirar o seu capital."
 bfl_bank_share_transfer: "Transferência Bancária de Ações"
 bfl_bank_share_transfer_tip: "#T Transferência de ações bancárias#!\nTransferir unidades de propriedade bancária registradas entre partes financiadas. Requer pesquisa sobre negociação de ações bancárias e a era da Reforma ou posterior. Esta linha relata permissão; ele próprio não executa uma negociação secundária de ações."
 bfl_bank_status_tip: "Operacional: novos negócios são permitidos quando seus demais requisitos forem atendidos. Dinheiro sob pressão: o caixa disponível está esgotado. Retiradas na fila: solicitações de retirada não pagas suspendem novos negócios. Insolvente: os passivos excedem os ativos. Em resolução ou Fechado: negócios normais são restritos. As reivindicações existentes permanecem registradas."
 bfl_bank_subscription: "Assinatura Bancária"
 bfl_banking_finance_companies: "Empresas Bancárias, Financeiras e Comerciais"
 bfl_banking_finance_companies__expanded_details: "Detalhes expandidos da atividade"
 bfl_banking_finance_companies__expanded_details_desc: "Preferência de apresentação reservada para visualização detalhada do extrato."
