 bfl_accept_money_claims.desc: "Aceite ou pare voluntariamente de aceitar contas e notas totalmente financiadas oferecidas ao par por meio de interações mod. Uma transferência ainda requer seu tesouro disponível. As reivindicações aceitas permanecem resgatáveis ​​após o encerramento da aceitação. Os pagamentos nativos continuam a usar ouro."
 bfl_accept_money_claims.title: "Alternar aceitação de solicitações de pagamento bancário"
 bfl_accounts_explanation: "O tesouro nativo é dinheiro. Depósitos e notas são passivos. O empréstimo troca dinheiro por um ativo; principal, subscrições e emissões não constituem lucro."
 bfl_activity_title: "Declaração mensal de atividades"
 bfl_activity_title_tip: "As observações dos cupons nativos classificam o orçamento líquido nativo; eles nunca movem ouro duas vezes. Os recursos de pagamento nativos liquidados liberam o custo de aquisição real antes de reconhecer um ganho ou perda. As distribuições da empresa e as receitas financiadas personalizadas entram em seus próprios grupos. O principal, os depósitos e as subscrições estão excluídos dos lucros."
 bfl_administer_estates: "Administrar patrimônios financeiros herdados"
 bfl_administer_estates.desc: "Revise o dinheiro e as obrigações mantidos separadamente de uma instituição destruída. A autoridade fiduciária nunca faz com que o seu dinheiro faça parte do tesouro nacional."
 bfl_administer_estates.title: "Administrar patrimônios financeiros herdados"
 bfl_administer_estates_desc: "Revise o dinheiro e as obrigações mantidos separadamente de uma instituição destruída. A autoridade fiduciária nunca faz com que o seu dinheiro faça parte do tesouro nacional."
 bfl_advanced_clearing: "Compensação Avançada"
 bfl_advanced_clearing_desc: "As casas bancárias que devem muitos pagamentos entre si não precisam liquidar todas as obrigações separadamente em moedas. As contas de compensação reconciliam os seus créditos e transferem apenas o saldo restante, reduzindo o dinheiro necessário para sustentar o comércio."
 bfl_advanced_tip: "A pesquisa desbloqueia o mandato. O banco também deve atender aos seus requisitos de especialização, liquidez e operacionais. A execução indisponível permanece desabilitada."
 bfl_ai_equity_offering: "Admitir banco e abrir oferta de capital pago"
 bfl_ai_equity_offering_desc: "A gestão da IA pode admitir o seu banco real e autorizar subscrições primárias pagas após a negociação de ações e uma troca concluída. Nenhum dinheiro ou ações são criados por admissão."
 bfl_ai_equity_purchase: "Considere investimento em bolsa financiado"
 bfl_ai_equity_purchase_desc: "A compra de IA usa as mesmas verificações de pesquisa ao vivo, construção, autoridade, capacidade e confirmação de cotação exata que o jogador. Revisão mensal da oportunidade, com pelo menos 500 ouro em dinheiro e excedente de capital. Nenhuma pergunta acima do mercado."
 bfl_ai_exchange_priority: "Priorize o acesso à bolsa de valores"
