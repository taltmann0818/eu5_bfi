 bfl_offer_commenda: "Financiar uma operação de carga"
 bfl_offer_commenda_act: "Financiar uma operação de carga"
 bfl_offer_commenda_desc: "Oferecer capital de risco nos termos propostos pelo banco. A aceitação compra a carga nomeada pelo seu custo nativo; a autorização não utilizada permanece com o banco. Capital e retorno nunca são garantidos."
 bfl_offer_commenda_effect_text: "Financiar uma operação de carga"
 bfl_offer_commenda_effect_text_past: "Financiar uma operação de carga"
 bfl_offer_commenda_tip: "Discovery ou posteriormente, pesquisa de Investimento no Exterior e Commenda. Escolha uma operadora, mercado de origem, destino e mercadorias para uma carga de dez unidades. A aceitação verifica novamente sua autoridade, dinheiro livre, capital e capacidade. Um contrato ativo por operadora; até oito por banco."
 bfl_offer_credit: "Ofereça um empréstimo financiado"
 bfl_offer_credit_act: "$bfl_offer_credit$"
 bfl_offer_credit_desc: "O mutuário recebe uma oferta explícita. Nenhum dinheiro ou termos serão alterados até a aceitação; a execução verifica novamente a autoridade, o perfil, a pesquisa e os fundos em tempo real."
 bfl_offer_credit_effect_text: "$bfl_offer_credit$"
 bfl_offer_credit_effect_text_past: "$bfl_offer_credit$"
 bfl_offer_credit_tip: "Selecione uma empresa soberana ou nativa elegível. Ambos os perfis emprestam a governos soberanos; o crédito da empresa requer Merchant Finance, Reformation e Corporate Credit. O alívio da dívida também exige a reestruturação da dívida renascentista."
 bfl_offer_goods_transfer: "Oferecer transferência de recibo de armazém"
 bfl_offer_goods_transfer_act: "$bfl_offer_goods_transfer$"
 bfl_offer_goods_transfer_desc: "Ofereça o recibo selecionado mais recentemente em Ofertas de mercadorias e reivindicações de custódia. O destinatário analisa o preço e a quantidade antes de pagar ao titular atual."
 bfl_offer_goods_transfer_effect_text: "$bfl_offer_goods_transfer$"
 bfl_offer_goods_transfer_effect_text_past: "$bfl_offer_goods_transfer$"
 bfl_offer_held_sovereign_bond: "Oferecer um título soberano mantido"
 bfl_offer_held_sovereign_bond_act: "$bfl_offer_held_sovereign_bond$"
 bfl_offer_held_sovereign_bond_desc: "Selecione um emissor e liste um de seus títulos soberanos em 98% do valor nominal. Requer um edifício próprio da Bolsa de Valores concluído."
 bfl_offer_held_sovereign_bond_effect_text: "$bfl_offer_held_sovereign_bond$"
 bfl_offer_held_sovereign_bond_effect_text_past: "$bfl_offer_held_sovereign_bond$"
 bfl_offer_held_sovereign_bond_tip: "Liste um título existente que você possui por três meses. Você retém a reivindicação até que um comprador financiado aceite; cupons e resgates seguem esse comprador."
 bfl_offer_restructuring: "Oferecer alívio da dívida"
