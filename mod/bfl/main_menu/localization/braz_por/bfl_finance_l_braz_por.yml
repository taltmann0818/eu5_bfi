 bfl_money_hint: "Passe o mouse para reservas, titulares e liquidação"
 bfl_money_hint_tip: "As notas trocam espécie por um crédito totalmente reservado. A aceitação é voluntária. Descontos antecipados 75 ouro contra um 100-nota de ouro do terceiro banco. A compensação liquida as contas vencidas correspondentes somente quando cada membro pode pagar seu débito líquido. As reivindicações existentes sobrevivem à perda de autoridade e edifícios."
 bfl_money_leave: "Sair da compensação"
 bfl_money_leave_tip: "As notas trocam espécie por um crédito totalmente reservado. A aceitação é voluntária. Descontos antecipados 75 ouro contra um 100-nota de ouro do terceiro banco. A compensação liquida as contas vencidas correspondentes somente quando cada membro pode pagar seu débito líquido. As reivindicações existentes sobrevivem à perda de autoridade e edifícios."
 bfl_money_lending_rate: "Nova base de empréstimos"
 bfl_money_lending_rate_tip: "Percorrer a base anual para futuros empréstimos ordinários através 3%, 6% e 9%. Os ajustes do mutuário ainda se aplicam. Os empréstimos aceitos mantêm suas taxas."
 bfl_money_notes: "Adquirir 100 em notas"
 bfl_money_notes_tip: "Requer pesquisa de absolutismo, banco central e notas soberanas, autorização soberana em tempo real, agência bancária do emissor preenchida e banco central do soberano preenchido no capital atual, 100 ouro do tesouro e capacidade de notas não utilizadas. O menor dos 25% patrimônio bancário e 500 circulação de tampas de ouro."
 bfl_money_offer_accept: "Financie o adiantamento garantido"
 bfl_money_offer_accept_tip: "Fundo 75 ouro do dinheiro disponível do credor se o gestor atual, a cotação e a garantia de um terceiro banco permanecerem válidos. A taxa anual aceite é fixa para esta facilidade; taxas de apoio público pelo menos 9%."
 bfl_money_offer_decline: "Recusar o pedido"
 bfl_money_offer_decline_tip: "Feche esta solicitação sem mover ouro ou prometer garantias."
 bfl_money_offer_desc: "Avançar 75 ouro contra um financiamento separado 100-nota de ouro mantida em um terceiro banco. UM 25% corte de cabelo protege o credor. A taxa de desconto anual aceite aplica-se durante um mês; taxas de apoio público pelo menos 9%. A liquidação paga primeiro ao credor e devolve o restante ao mutuário. A garantia não financiada preserva ambas as reivindicações. Esta solicitação expira este mês."
 bfl_money_offer_title: "Um mecanismo de liquidação seguro"
 bfl_money_policy_rate: "Ciclo de taxa de desconto futuro"
 bfl_money_policy_rate_tip: "Alterne a taxa anual para adiantamentos garantidos futuros através 6%, 9% e 12%. Um mês é cobrado na aceitação; as instalações existentes mantêm a sua taxa. Cobranças de apoio público pelo menos 9%."
 bfl_money_redeem: "Resgatar notas estaduais"
 bfl_money_redeem_tip: "Resgatar todas as notas detidas pelo controlador soberano pelo seu valor nominal. Autoridade, pesquisa ou filiais perdidas não cancelam reivindicações existentes. Uma reclamação não paga permanece devida."
 bfl_money_repay: "Reembolsar instalação garantida"
 bfl_money_repay_tip: "Reembolsar o adiantamento garantido atual mais a taxa fixa aceita para liberar o penhor da letra do terceiro banco. Requer ouro disponível suficiente."
 bfl_money_revoke: "Revogar autoridade"
 bfl_money_revoke_tip: "Retirar autorização soberana para novas notas. As notas existentes permanecem resgatáveis."
 bfl_money_settings: "Política"
 bfl_money_settings_tip: "Mostre ou oculte política monetária, autoridade de notas, crédito garantido e controles de compensação."
 bfl_money_settings_tip_tip: "As notas trocam espécie por um crédito totalmente reservado. A aceitação é voluntária. Descontos antecipados 75 ouro contra um 100-nota de ouro do terceiro banco. A compensação liquida as contas vencidas correspondentes somente quando cada membro pode pagar seu débito líquido. As reivindicações existentes sobrevivem à perda de autoridade e edifícios."
 bfl_money_subtitle: "Reivindicações resgatáveis · liquidação financiada"
 bfl_money_subtitle_tip: "As notas trocam espécie por um crédito totalmente reservado. A aceitação é voluntária. Descontos antecipados 75 ouro contra um 100-nota de ouro do terceiro banco. A compensação liquida as contas vencidas correspondentes somente quando cada membro pode pagar seu débito líquido. As reivindicações existentes sobrevivem à perda de autoridade e edifícios."
 bfl_money_terms: "O principal e a emissão estão excluídos do resultado. As taxas de desconto são anuais e fixas quando aceitas. A confiança cai para 25 num défice de reservas; notas totalmente garantidas não acrescentam inflação. Os pagamentos Vanilla continuam a usar ouro nativo."
 bfl_money_terms_tip: "As notas trocam espécie por um crédito totalmente reservado. A aceitação é voluntária. Descontos antecipados 75 ouro contra um 100-nota de ouro do terceiro banco. A compensação liquida as contas vencidas correspondentes somente quando cada membro pode pagar seu débito líquido. As reivindicações existentes sobrevivem à perda de autoridade e edifícios."
 bfl_money_title: "Dinheiro e liquidação"
 bfl_money_title_tip: "O principal e a emissão estão excluídos do resultado. As taxas de desconto são anuais e fixas quando aceitas. A confiança cai para 25 num défice de reservas; notas totalmente garantidas não acrescentam inflação. Os pagamentos Vanilla continuam a usar ouro nativo."
 bfl_native_credit_label: "Carteira de empréstimos"
 bfl_native_tab: "Empréstimos estatais"
 bfl_native_takeover: "Aquisição nativa"
 bfl_new_capital_subscription: "Subscrever novo capital"
 bfl_new_capital_subscription_desc: "Investir 100@gold! dos fundos do seu banco em [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_issuer').GetCountry.GetName] como ações recém-emitidas pelo seu NAV tangível. O emissor recebe o pagamento e os titulares existentes são diluídos. Esta é uma subscrição de capital, separada da Compra de ações. A execução verifica novamente o NAV capturado, unidades emitidas, pesquisas, fundos protegidos e limite de concentração. Ele consome um diplomata e inicia o período de espera de negociação de um mês deste emissor."
 bfl_new_capital_subscription_tip: "Financiamento primário: investir 100 ouro do banco administrado. O emissor recebe dinheiro e emite novas ações. Isto é separado da negociação de ações existentes."
 bfl_no_automatic_tribute: "Sem tributo de fretamento automático"
 bfl_no_automatic_tribute_cost_modifier: "Custo automático do tributo de fretamento"
 bfl_no_bank: "Fundar um banco estatal existente por meio de decisões ou atuar como um país bancário independente. Seu país deve possuir seu mercado de capitais para fundar um banco."
 bfl_nobles_estate_workout_mandate: "Mandato de treino imobiliário"
 bfl_nobles_estate_workout_mandate_desc: "Esta propriedade autoriza explicitamente o seu governo a rever as negociações de depósitos bancários voluntários em seu nome. Cada proposta ainda precisa de aceitação separada. A revogação deste privilégio invalida os termos de propriedade pendentes. Os pagamentos de recuperação continuam na carteira do patrimônio."
 bfl_offer_bank_shares: "Oferecer novas ações bancárias"
 bfl_offer_bank_shares_tip: "Permitir que outros bancos e países assinem 100 ouro ao valor patrimonial líquido atual do banco. Novas ações são emitidas somente quando pagas; os proprietários existentes são diluídos. A pesquisa do Native Banking e o patrimônio positivo continuam sendo necessários."
 bfl_offer_bond: "Oferecer um título soberano detido por um banco"
 bfl_offer_bond_tip: "Liste o título mais antigo mantido por um banco há três meses em 98% do valor nominal. Vender e comprar ambos exigem um prédio próprio e concluído da Bolsa de Valores. A aceitação verifica novamente o vendedor, o titular atual, a geração, os fundos e o vencimento. Os atrasos bloqueiam a negociação."
 bfl_offer_bond_workout_01: "Oferecer reestruturação"
 bfl_offer_bond_workout_01_tip: "Peça ao titular atual para aceitar um 20% redução do principal e dos cupons não pagos, e um corte anual de cupom de um ponto percentual, com um 1% chão. Nenhum dinheiro é movimentado, a menos que o titular aceite separadamente. A cotação expira este mês e alterações na reivindicação a invalidam."
