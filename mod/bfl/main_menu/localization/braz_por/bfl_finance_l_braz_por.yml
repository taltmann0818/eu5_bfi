 bfl_facility_tip: "O dinheiro do banco efetivamente recebido pela emissão de títulos soberanos personalizados este mês. O financiamento cria dívida e é excluído dos rendimentos auferidos."
 bfl_facility_title: "Mandato do mecanismo de dívida"
 bfl_facility_title_tip: "#T Mandato do mecanismo de dívida#!\nO banco financia títulos soberanos personalizados com cupons anuais fixos. Off interrompe problemas agendados. Primeiras solicitações de dívida 60% de gastos previstos. Alvos de buffer 200 ouro estadual após o saldo mensal previsto. Ambos param em 500 ouro do estado.\n\nÚltima solicitação: [Country.MakeScope.GetVariable('bfl_facility_requested').GetValue|2]@gold!\nÚltimo financiado: [Country.MakeScope.GetVariable('bfl_facility_paid').GetValue|2]@gold!\n\nNo máximo um problema e 100 ouro por mês. O dinheiro do banco protegido, o capital, a capacidade do emissor e os cupons não pagos podem impedir um empate. Os rendimentos são financiamento, não receitas."
 bfl_feedback_1: "Capital de fretamento recebido"
 bfl_feedback_2: "Depósito recebido"
 bfl_feedback_3: "Retirada paga"
 bfl_feedback_4: "Dividendo pago"
 bfl_feedback_5: "Revenda de títulos liquidada"
 bfl_feedback_6: "Receitas de risco recebidas"
 bfl_feedback_7: "#O Novo aviso de liquidez#!"
 bfl_feedback_8: "Resolução encerrada · perdas registradas permanecem visíveis"
 bfl_feedback_9: "#O A meta do mecanismo não foi financiada#!"
 bfl_feedback_note: "Última transação confirmada · o valor já está reservado. Abrir esta visualização não reproduz efeitos anteriores. O movimento reduzido mantém os mesmos recibos e avisos. A descoberta por si só não produz nenhum indicador de pagamento."
 bfl_feedback_signature: "[Country.GetTag]:[Country.MakeScope.GetVariable('bfl_feedback_sequence').GetValue|0]"
 bfl_finance.100.desc: "Escolha uma especialização permanente. Ambos servem crédito e depósitos soberanos. A Merchant Finance desenvolve instrumentos de commodities e de crédito corporativo; Overseas Investment desenvolve comenda e patrimônio da empresa. Os limites de pesquisa e idade continuam a ser aplicados."
 bfl_finance.100.merchant: "Finanças Comerciais"
