 bfl_venture_accept: "Aceite a parceria"
 bfl_venture_accept_tip: "Verifique novamente a autoridade do investidor em tempo real, termos de oferta inalterados, idade, pesquisa, dinheiro livre, capital, capacidade e contribuição do operador. O financiamento paga apenas o custo nativo real da atividade selecionada. Não concede ações da empresa ou controle político."
 bfl_venture_decline: "Recusar"
 bfl_venture_duration_12: "Duração · 12 meses"
 bfl_venture_duration_120: "Duração · 120 meses"
 bfl_venture_duration_24: "Duração · 24 meses"
 bfl_venture_duration_6: "Duração · 6 meses"
 bfl_venture_duration_60: "Duração · 60 meses"
 bfl_venture_duration_tip: "Ciclo 6, 12, 24, 60 ou 120 meses. Longos prazos acomodam a exploração nativa. A carga é vendida após dois meses se o acesso nativo permanecer válido; carga bloqueada permanece sob custódia. Os custos de expedição sem o valor da venda vinculada são baixados no vencimento."
 bfl_venture_empty: "Nenhum empreendimento ativo. Selecione uma operação de carga ou expedição nativa antes de oferecer os termos."
 bfl_venture_help: "Clique em um termo para percorrer. Cada operadora aceita separadamente. Os acordos existentes continuam após uma mudança de política ou pesquisa."
 bfl_venture_hint: "Passe o mouse para atividades, custos, carga e devoluções"
 bfl_venture_locked: "Novos empreendimentos bloqueados · passe o mouse para ver os requisitos"
 bfl_venture_note: "O capital é recuperado antes do lucro. As perdas seguem as contribuições. Somente a carga adquirida pela operação nomeada pode financiar seus rendimentos. O comércio não relacionado nunca compensa este acordo. A descoberta por si só não paga nada. As linhas fechadas permanecem até serem substituídas por um contrato recém-aceito."
 bfl_venture_offer_desc: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_bank').GetCountry.GetName] ofertas [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_ticket').GetValue|0] ouro para [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_duration').GetValue|0] meses. Predefinido [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_preset').GetValue|0]: 0 = o investidor financia todo o capital, recebe 75% de excedente; 1 = o investidor contribui com dois terços, o operador com um terço, o excedente é dividido igualmente. O capital é recuperado primeiro; as perdas seguem as contribuições. Somente o produto real da venda da operação nomeada pode gerar lucro. O sucesso da exploração garante uma oportunidade, nunca ouro. Esta oferta expira em três meses."
 bfl_venture_offer_desc_0: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_bank').GetCountry.GetName] autoriza até [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_ticket').GetValue|0] ouro de financiamento bancário para [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_duration').GetValue|0] meses. Comprar 10 [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_good').Goods.GetNameWithNoTooltip] em [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_from').GetMarket.GetName], carregue-os por dois meses e depois venda [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_to').GetMarket.GetName]. O banco financia todos os custos e recebe 75% de excedente.\n\nApenas os custos nativos reais são calculados. O financiamento não utilizado permanece no banco. O capital é recuperado antes do excedente; as perdas seguem as contribuições. Somente o produto medido da venda desta carga liquida este acordo. A renda e a descoberta não relacionadas não pagam nada. A oferta expira em três meses."
 bfl_venture_offer_desc_1: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_bank').GetCountry.GetName] autoriza até [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_ticket').GetValue|0] ouro de financiamento bancário para [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_duration').GetValue|0] meses. Comprar 10 [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_good').Goods.GetNameWithNoTooltip] em [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_from').GetMarket.GetName], carregue-os por dois meses e depois venda [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_to').GetMarket.GetName]. O banco financia dois terços dos custos; você paga um terço. O excedente é dividido igualmente.\n\nApenas os custos nativos reais são calculados. O financiamento não utilizado permanece no banco. O capital é recuperado antes do excedente; as perdas seguem as contribuições. Somente o produto medido da venda desta carga liquida este acordo. A renda e a descoberta não relacionadas não pagam nada. A oferta expira em três meses."
 bfl_venture_offer_desc_2: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_bank').GetCountry.GetName] autoriza até [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_ticket').GetValue|0] ouro de financiamento bancário para [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_duration').GetValue|0] meses. Prepare a exploração nativa de [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_area').GetArea.GetName] de [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_port').GetLocation.GetName] com [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_explorer').GetCharacter.GetName]. O banco financia todos os custos acordados do ouro e recebe 75% do excedente contratual. A preparação não é reembolsável, incluindo cancelamento. Você fornece tripulação, manutenção nativa e despesas opcionais de expedição fora deste contrato de financiamento. A autorização bancária restante poderá financiar uma carga de dez unidades proveniente de um mercado centrado ou limítrofe à área descoberta, sujeito ao acesso nativo. Somente as vendas medidas dessa carga, menos os custos registrados de preparação e carga, poderão pagar o excedente contratual. A descoberta e o comércio não relacionado não pagam nada. A oferta expira em três meses. "
 bfl_venture_offer_desc_3: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_bank').GetCountry.GetName] autoriza até [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_ticket').GetValue|0] ouro de financiamento bancário para [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_duration').GetValue|0] meses. Prepare a exploração nativa de [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_area').GetArea.GetName] de [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_port').GetLocation.GetName] com [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_explorer').GetCharacter.GetName]. O banco financia dois terços dos custos acordados do ouro; você paga um terço. O excedente contratual é dividido igualmente. A preparação não é reembolsável, incluindo cancelamento. Você fornece tripulação, manutenção nativa e despesas opcionais de expedição fora deste contrato de financiamento. A autorização bancária restante poderá financiar uma carga de dez unidades proveniente de mercado centrado ou limítrofe à área descoberta, sujeito a acesso nativo. Somente as vendas medidas dessa carga, deduzidas os custos registrados de preparação e carga, poderão pagar o excedente contratual. A descoberta e o comércio não relacionado não pagam nada. A oferta expira em três meses. "
