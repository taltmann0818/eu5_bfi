 bfl_request_deposit_withdrawal: "Retirar depósitos vencidos"
 bfl_request_deposit_withdrawal_act: "$bfl_request_deposit_withdrawal$"
 bfl_request_deposit_withdrawal_desc: "Retire suas próprias reivindicações amadurecidas. Os valores não pagos permanecem como passivos pendentes do banco. Nenhuma retirada pode exceder o principal registrado mais os juros creditados."
 bfl_request_deposit_withdrawal_effect_text: "$bfl_request_deposit_withdrawal$"
 bfl_request_deposit_withdrawal_effect_text_past: "$bfl_request_deposit_withdrawal$"
 bfl_request_discount: "Solicitar crédito de liquidação garantido"
 bfl_request_discount_act: "$bfl_request_discount$"
 bfl_request_discount_command: "$bfl_request_discount$"
 bfl_request_discount_command_desc: "$bfl_request_discount_desc$"
 bfl_request_discount_desc: "Solicite um 75-adiantamento de ouro contra o seu financiado 100-nota de ouro do terceiro banco. O gerente do credor ativo analisa a solicitação; a aceitação verifica novamente todas as partes e garantias. Nenhuma agência bancária é necessária entre bancos."
 bfl_request_discount_effect_text: "$bfl_request_discount$"
 bfl_request_discount_effect_text_past: "$bfl_request_discount$"
 bfl_request_discount_tip: "Escolha um credor para um 75-ouro adiantado de um mês contra o seu não prometido e financiado 100-nota de ouro em um terceiro banco. Requer facilidades de garantia e liquidez. O credor deve consentir; nenhuma agência bancária é necessária entre bancos."
 bfl_request_public_support: "Solicite suporte público seguro"
 bfl_request_public_support_act: "$bfl_request_public_support$"
 bfl_request_public_support_command: "$bfl_request_public_support$"
 bfl_request_public_support_command_desc: "$bfl_request_public_support_desc$"
 bfl_request_public_support_desc: "Solicite um 75-adiantamento de ouro contra o seu financiado 100-nota de ouro do terceiro banco. O gerente do credor ativo analisa a solicitação; a aceitação verifica novamente todas as partes e garantias. Nenhuma agência bancária é necessária entre bancos."
 bfl_request_public_support_effect_text: "$bfl_request_public_support$"
 bfl_request_public_support_effect_text_past: "$bfl_request_public_support$"
 bfl_request_public_support_tip: "Escolha um credor credenciado com Backstops Financeiros Públicos e o Banco Central de capital completo do seu soberano. Seu atual gerente deve consentir. O 75-o adiantamento garantido em ouro usa dinheiro do banco e cobra pelo menos 9% anualmente; não cria nenhuma garantia ou recapitalização."
 bfl_resolution_begin_command: "Iniciar resolução"
 bfl_resolution_begin_command_tip: "A resolução ordenada congela novos compromissos e distribuições. As reservas monetárias e de custódia segregadas permanecem protegidas; os depósitos compartilham o caixa disponível proporcionalmente antes das despesas atrasadas e do patrimônio líquido. Os credores em falta mantêm os seus créditos. Os termos voluntários exigem o consentimento atual do credor e a reestruturação da dívida da Renaissance. Uma garantia pública cobre 50% de perdas de depósitos aceitas, até 100 ouro no total, financiado pelo seu soberano registrado; chamadas não pagas permanecem pendentes. O encerramento exige a compensação de todas as obrigações e ativos não monetários. Propriedades fechadas não podem reabrir."
 bfl_resolution_call_command: "Pagar garantia pendente"
 bfl_resolution_call_command_tip: "A resolução ordenada congela novos compromissos e distribuições. As reservas monetárias e de custódia segregadas permanecem protegidas; os depósitos compartilham o caixa disponível proporcionalmente antes das despesas atrasadas e do patrimônio líquido. Os credores em falta mantêm os seus créditos. Os termos voluntários exigem o consentimento atual do credor e a reestruturação da dívida da Renaissance. Uma garantia pública cobre 50% de perdas de depósitos aceitas, até 100 ouro no total, financiado pelo seu soberano registrado; chamadas não pagas permanecem pendentes. O encerramento exige a compensação de todas as obrigações e ativos não monetários. Propriedades fechadas não podem reabrir."
 bfl_resolution_close_command: "Fechar propriedade"
 bfl_resolution_close_command_tip: "A resolução ordenada congela novos compromissos e distribuições. As reservas monetárias e de custódia segregadas permanecem protegidas; os depósitos compartilham o caixa disponível proporcionalmente antes das despesas atrasadas e do patrimônio líquido. Os credores em falta mantêm os seus créditos. Os termos voluntários exigem o consentimento atual do credor e a reestruturação da dívida da Renaissance. Uma garantia pública cobre 50% de perdas de depósitos aceitas, até 100 ouro no total, financiado pelo seu soberano registrado; chamadas não pagas permanecem pendentes. O encerramento exige a compensação de todas as obrigações e ativos não monetários. Propriedades fechadas não podem reabrir."
 bfl_resolution_guarantee_command: "Autorizar garantia"
 bfl_resolution_guarantee_command_tip: "A resolução ordenada congela novos compromissos e distribuições. As reservas monetárias e de custódia segregadas permanecem protegidas; os depósitos compartilham o caixa disponível proporcionalmente antes das despesas atrasadas e do patrimônio líquido. Os credores em falta mantêm os seus créditos. Os termos voluntários exigem o consentimento atual do credor e a reestruturação da dívida da Renaissance. Uma garantia pública cobre 50% de perdas de depósitos aceitas, até 100 ouro no total, financiado pelo seu soberano registrado; chamadas não pagas permanecem pendentes. O encerramento exige a compensação de todas as obrigações e ativos não monetários. Propriedades fechadas não podem reabrir."
 bfl_resolution_heading: "Resolução e recuperação de credores"
 bfl_resolution_heading_tip: "Resolução financeira persistente; as recuperações de caixa e as alterações consensuais são registadas separadamente dos resultados."
 bfl_resolution_help: "Reservas garantidas e de custódia → depósitos proporcionais → despesas atrasadas → acionistas residuais. As reivindicações sobrevivem às deficiências e à perda da autoridade de originação. Insira a resolução antes de oferecer os termos."
 bfl_resolution_liquidate_command: "Realize os ativos disponíveis"
 bfl_resolution_liquidate_command_tip: "Venda estoque nativo acessível e livre de ônus e colete depósitos, faturas e notas vencidas por meio de seus serviços existentes. As receitas reais financiam a cascata de recuperação. As posições indisponíveis ou imaturas ficam registradas; nenhum valor contábil se torna ouro."
 bfl_resolution_next_command: "Próxima conta de depósito"
 bfl_resolution_next_command_tip: "Ciclo de contas de depósito ativas. Os credores imobiliários exigem o seu Workout Mandate promulgado antes que o seu governo possa aceitar termos voluntários. Os pagamentos são devolvidos ao tesouro registrado ou à carteira imobiliária."
 bfl_resolution_notice_acknowledge: "Reconheça o resultado final"
 bfl_resolution_notice_desc: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_notice_bank').GetCountry.GetName] encerrou suas operações financeiras.\n\nRecuperações de depósitos pagos: [ROOT.GetCountry.MakeScope.GetVariable('bfl_notice_bank').GetCountry.MakeScope.GetVariable('bfl_resolution_paid').GetValue|2]@gold!\nPerdas de depósito consentidas: [ROOT.GetCountry.MakeScope.GetVariable('bfl_notice_bank').GetCountry.MakeScope.GetVariable('bfl_resolution_waived').GetValue|2]@gold!\nPerdas legais registradas: [ROOT.GetCountry.MakeScope.GetVariable('bfl_notice_bank').GetCountry.MakeScope.GetVariable('bfl_resolution_statutory_loss').GetValue|2]@gold!\n\nAs perdas registadas são montantes não pagos, não recuperações ou novos rendimentos. A propriedade histórica e o patrimônio final permanecem registrados; a instituição fechada não pode reabrir."
 bfl_resolution_notice_title: "Resolução bancária encerrada"
 bfl_resolution_offer_command: "Oferecer termos de credor"
 bfl_resolution_offer_command_tip: "A resolução ordenada congela novos compromissos e distribuições. As reservas monetárias e de custódia segregadas permanecem protegidas; os depósitos compartilham o caixa disponível proporcionalmente antes das despesas atrasadas e do patrimônio líquido. Os credores em falta mantêm os seus créditos. Os termos voluntários exigem o consentimento atual do credor e a reestruturação da dívida da Renaissance. Uma garantia pública cobre 50% de perdas de depósitos aceitas, até 100 ouro no total, financiado pelo seu soberano registrado; chamadas não pagas permanecem pendentes. O encerramento exige a compensação de todas as obrigações e ativos não monetários. Propriedades fechadas não podem reabrir."
 bfl_resolution_pay_command: "Recuperação de pagamento"
 bfl_resolution_pay_command_tip: "A resolução ordenada congela novos compromissos e distribuições. As reservas monetárias e de custódia segregadas permanecem protegidas; os depósitos compartilham o caixa disponível proporcionalmente antes das despesas atrasadas e do patrimônio líquido. Os credores em falta mantêm os seus créditos. Os termos voluntários exigem o consentimento atual do credor e a reestruturação da dívida da Renaissance. Uma garantia pública cobre 50% de perdas de depósitos aceitas, até 100 ouro no total, financiado pelo seu soberano registrado; chamadas não pagas permanecem pendentes. O encerramento exige a compensação de todas as obrigações e ativos não monetários. Propriedades fechadas não podem reabrir."
 bfl_resolution_resume_command: "Retomar após recuperação"
 bfl_resolution_resume_command_tip: "A resolução ordenada congela novos compromissos e distribuições. As reservas monetárias e de custódia segregadas permanecem protegidas; os depósitos compartilham o caixa disponível proporcionalmente antes das despesas atrasadas e do patrimônio líquido. Os credores em falta mantêm os seus créditos. Os termos voluntários exigem o consentimento atual do credor e a reestruturação da dívida da Renaissance. Uma garantia pública cobre 50% de perdas de depósitos aceitas, até 100 ouro no total, financiado pelo seu soberano registrado; chamadas não pagas permanecem pendentes. O encerramento exige a compensação de todas as obrigações e ativos não monetários. Propriedades fechadas não podem reabrir."
 bfl_review_trade: "Revise o comércio"
 bfl_review_trade_tip: "Revise as unidades selecionadas e o pagamento exato. Uma venda deve ser arredondada para pelo menos 0.01 ouro; aumente a quantidade se a Revisão não estiver disponível. Nenhum diplomata é gasto até que um comércio válido seja estabelecido."
 bfl_safeguards_title: "Liquidez e salvaguardas"
 bfl_safeguards_title_tip: "#T Liquidez e salvaguardas#!\nDinheiro bancário disponível: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_free_cash')|2]@gold!\nRequisito de dinheiro protegido: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_protected_cash')|2]@gold!\nRetiradas na fila: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_withdrawals_due')|2]@gold!\n\nA recapitalização abastece o capital do estado. A suspensão de depósitos interrompe o financiamento de novas contas, preservando as obrigações existentes."
 bfl_sale_unavailable: "O pedido de ações não pôde ser liquidado"
 bfl_sale_unavailable_desc: "O emissor tem um período de espera de negociação de um mês, você não tem diplomata, sua cotação expirou ou as ações, fundos ou acesso à bolsa disponíveis foram alterados. Reabra Compre ou Venda ações para uma nova cotação. Nenhum dinheiro ou ações foram movimentados."
 bfl_secured_liquidity: "Liquidez Garantida"
 bfl_secured_liquidity_tip: "#T Liquidez garantida#!\nAbsolutismo, Garantias e Facilidades de Liquidez. Avançar 75 ouro contra um financiamento separado 100-nota de ouro do terceiro banco. A garantia é bloqueada uma vez. A taxa anual fixa aceita é dividida por 12. Não é necessária agência entre bancos."
 bfl_security_bank_results: "Último fechamento do banco"
 bfl_security_financial_heading: "Posição financeira tangível"
 bfl_security_financial_subtitle: "O que sustenta o preço das ações"
 bfl_security_financial_title: "Patrimônio líquido de [Country.GetName]"
 bfl_security_price_heading: "Preço das ações e propriedade"
 bfl_security_price_math: "Preço de mercado = NAV tangível por ação × prêmio de mercado mensal. A pressão das ordens, a volatilidade, a reversão à média e a dificuldade podem alterar esse prémio. O capital primário permanece cotado ao NAV; os ganhos não realizados não financiam empréstimos ou dividendos."
 bfl_security_primary_note: "Os dividendos reduzem o caixa e o NAV uma vez. O novo capital é precificado pelo NAV e não cria nenhum sinal de pressão de compra. As assinaturas são pausadas enquanto o lance de revenda do revendedor excede o NAV, impedindo um lucro imediato garantido. A história contém observações reais; recarregar não rola novamente um choque mensal salvo."
 bfl_select_buy_shares: "Compre ações de bancos e empresas"
 bfl_select_profile: "Escolha especialização pendente"
 bfl_select_profile_tip: "#T Especialização bancária#!\nAbra a opção de especialização caso este banco ainda não tenha escolhido um perfil permanente. Merchant Finance e Overseas Investment abrem diferentes caminhos de pesquisa. Uma especialização concluída não pode ser substituída por este botão."
 bfl_select_sell_shares: "Venda ações que você possui"
 bfl_selector_next: "Próximos bancos"
 bfl_selector_previous: "Bancos anteriores"
 bfl_sell_confirm_desc: "Vender [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_quantity').GetValue|3] ações de [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_issuer').GetCountry.GetName] para [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_total').GetValue|2]@gold!. O criador de mercado oculto garante esta venda, incluindo o spread de negociação cotado, enquanto a cotação for válida. As ações saem do seu portfólio imediatamente; As compras de IA em segundo plano não atrasam o pagamento. Os rendimentos vão para a tesouraria do seu banco. A liquidação consome um diplomata e inicia o período de espera de compra/venda de um mês deste emissor."
 bfl_sell_confirm_title: "Confirme a venda instantânea de ações"
 bfl_sell_shares: "Vender ações"
 bfl_sell_shares_desc: "Escolha uma de suas participações e uma quantidade. O criador de mercado oculto compra imediatamente suas ações pela cotação de mercado menos o spread do negociante exibido. Os bancos de IA compram seu estoque em segundo plano."
 bfl_sell_shares_tip: "Escolha uma de suas participações e uma quantidade. O criador de mercado oculto compra imediatamente suas ações pela cotação de mercado menos o spread do negociante exibido. Os bancos de IA compram seu estoque em segundo plano.\nRequer uma troca concluída, negociação de ações e pelo menos um diplomata. Cada negociação bem-sucedida consome um diplomata e inicia um período de espera de um mês para esse emissor. Diplomatas disponíveis: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bfl_available_trade_diplomats')|2]. As encomendas devem ter um valor em dinheiro de pelo menos 0.01 ouro."
 bfl_sell_state_confirm_desc: "Vender [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_quantity').GetValue|3] ações da participação do seu tesouro em [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_issuer').GetCountry.GetName] para [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_total').GetValue|2]@gold!, pago ao tesouro do seu país. O banco não recebe financiamento e as ações emitidas não sofrem alterações. O revendedor oculto garante a cotação exibida, incluindo o spread do revendedor cotado. O acordo consome um diplomata e inicia um período de espera de compra/venda de um mês para este emissor. A autoridade monetária da sua carta permanece com você."
