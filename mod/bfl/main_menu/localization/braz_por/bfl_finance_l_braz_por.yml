 bfl_loan_button: "Assumir empréstimo"
 bfl_log_charter: "Fretou e capitalizou um Banco Estadual para"
 bfl_manage_shareholdings: "Decisões dos acionistas"
 bfl_manage_shareholdings_desc: "Selecione uma participação financeira. Mais da metade dos votos emitidos podem definir dividendos de bancos independentes ou política de pagamento e reinvestimento da empresa. Um controlador ativo pode exercer os votos do seu banco administrado. A política monetária regulamentada e a soberania política permanecem separadas."
 bfl_margining: "Margem"
 bfl_margining_and_risk_management: "Margem e gerenciamento de risco"
 bfl_margining_and_risk_management_desc: "Os comerciantes que prometem entregas futuras enfrentam alterações nos preços muito antes do vencimento dos seus contratos. Exigir segurança adicional à medida que as exposições aumentam dá aos banqueiros um meio de conter perdas antes que um mercado desfavorável se torne num incumprimento."
 bfl_margining_tip: "#T Margem e gerenciamento de risco#!\nExigir garantias e margem de variação contra alterações na exposição a commodities. Requer pesquisa de margem e gerenciamento de risco, finanças mercantis e a era das revoluções. A execução de margem garantida por mercadorias não está disponível nesta versão."
 bfl_market_sort_price: "Classificar por preço por ação"
 bfl_monetary: "Política monetária e liquidez"
 bfl_monetary_explanation: "Trocar espécie por notas reservadas com autoridade soberana e Banco Central completo. Desconto de letras de terceiros após Garantias e Facilidades de Liquidez; Revolutions adiciona rede de membros financiada e apoio público garantido limitado. As tarifas aceitas permanecem fixas."
 bfl_monetary_tip: "#T Instrumentos monetários#!\nPermissões posteriores para notas soberanas, liquidez garantida, compensação e apoio público. Cada um requer sua própria autorização, suporte e condições de operação."
 bfl_money_accept: "Alternar aceitação e descontos"
 bfl_money_accept_tip: "As notas trocam espécie por um crédito totalmente reservado. A aceitação é voluntária. Descontos antecipados 75 ouro contra um 100-nota de ouro do terceiro banco. A compensação liquida as contas vencidas correspondentes somente quando cada membro pode pagar seu débito líquido. As reivindicações existentes sobrevivem à perda de autoridade e edifícios."
 bfl_money_acceptance_action: "Alterar aceitação voluntária"
 bfl_money_authorize: "Autorizar notas"
 bfl_money_authorize_tip: "O controlador soberano autoriza seu banco licenciado. Um Banco Central concluído e de propriedade soberana é necessário no capital atual. A nova emissão também requer a agência bancária de capital do emissor e a pesquisa das notas."
 bfl_money_clear: "Liquidar contas de membros"
 bfl_money_clear_open: "Liberando admissão"
 bfl_money_clear_open_tip: "Abra ou feche a admissão ao seu grupo de compensação. Requer pesquisa de Revolutions, Câmara de Compensação e Compensação Avançada, e uma Câmara de Compensação concluída de propriedade do banco ou de seu soberano ativo. Máximo de quatro membros."
 bfl_money_clear_tip: "Liquidar as contas correspondentes dos membros vencidos uma vez este mês. Cada membro deve cobrir o seu débito líquido, protegendo ao mesmo tempo outras reservas. Um membro curto preserva todo o lote. Excluem-se as reivindicações prometidas e de não membros."
 bfl_money_empty: "Nenhuma nota em circulação. A investigação monetária, a autoridade e os edifícios concluídos desbloqueiam novos serviços."
 bfl_money_empty_tip: "As notas trocam espécie por um crédito totalmente reservado. A aceitação é voluntária. Descontos antecipados 75 ouro contra um 100-nota de ouro do terceiro banco. A compensação liquida as contas vencidas correspondentes somente quando cada membro pode pagar seu débito líquido. As reivindicações existentes sobrevivem à perda de autoridade e edifícios."
 bfl_money_help: "As notas trocam espécie por um crédito totalmente reservado. A aceitação é voluntária. Descontos antecipados 75 ouro contra um 100-nota de ouro do terceiro banco. A compensação liquida as contas vencidas correspondentes somente quando cada membro pode pagar seu débito líquido. As reivindicações existentes sobrevivem à perda de autoridade e edifícios."
