 bfl_offer_restructuring_desc: "O mutuário recebe uma oferta explícita. Nenhum dinheiro ou termos serão alterados até a aceitação; a execução verifica novamente a autoridade, o perfil, a pesquisa e os fundos em tempo real."
 bfl_offer_restructuring_effect_text: "$bfl_offer_restructuring$"
 bfl_offer_restructuring_effect_text_past: "$bfl_offer_restructuring$"
 bfl_offer_restructuring_tip: "Selecione uma empresa soberana ou nativa elegível. Ambos os perfis emprestam a governos soberanos; o crédito da empresa requer Merchant Finance, Reformation e Corporate Credit. O alívio da dívida também exige a reestruturação da dívida renascentista."
 bfl_operating_costs: "Despesas operacionais mensais"
 bfl_operating_costs_tip: "Escala de custos fixos mensais com contas de depósito ativas, contratos, agências e classes de ativos. A reforma do State Chartered Bank reduz os custos 5%, Bancário por 10%, Compensação Avançada por 15%e administração simplificada por 10%. Os custos não pagos permanecem passivos e bloqueiam os dividendos."
 bfl_overview: "Contas e especialização"
 bfl_overview_hint: "Ativos: anel externo = tipo; anel interno = países. Passe o mouse para ver detalhes coloridos."
 bfl_payout_0: "Reter lucros"
 bfl_payout_0_short: "Reter"
 bfl_payout_0_tip: "Retenha todo o lucro realizado elegível. Nenhum novo dividendo é pago sob esta política; o lucro retido apoia a liquidez e o capital próprio."
 bfl_payout_25: "25% pagamento"
 bfl_payout_25_short: "25%"
 bfl_payout_25_tip: "Alocar até 25% do lucro realizado elegível em dividendos após prejuízos. O dinheiro disponível, a margem de capital e a propriedade registada ainda limitam o pagamento."
 bfl_payout_50: "50% pagamento"
 bfl_payout_50_short: "50%"
 bfl_payout_50_tip: "Alocar até 50% do lucro realizado elegível em dividendos após prejuízos. O dinheiro disponível, a margem de capital e a propriedade registada ainda limitam o pagamento."
 bfl_peasants_estate_workout_mandate: "Mandato de treino imobiliário"
 bfl_peasants_estate_workout_mandate_desc: "Esta propriedade autoriza explicitamente o seu governo a rever as negociações de depósitos bancários voluntários em seu nome. Cada proposta ainda precisa de aceitação separada. A revogação deste privilégio invalida os termos de propriedade pendentes. Os pagamentos de recuperação continuam na carteira do patrimônio."
 bfl_place_deposit_1: "Abra um 100 depósito à vista de ouro"
 bfl_place_deposit_1_act: "$bfl_place_deposit_1$"
 bfl_place_deposit_1_desc: "Os bancos independentes exigem uma opinião de pelo menos +50 em sua direção para abrir uma conta. Seu banco credenciado oferece um extra 1% juros anuais. Os juros à vista são pagos mensalmente quando financiados; os juros não pagos permanecem devidos. A queda nas relações nunca impede a retirada de suas próprias reivindicações amadurecidas."
 bfl_place_deposit_1_effect_text: "$bfl_place_deposit_1$"
 bfl_place_deposit_1_effect_text_past: "$bfl_place_deposit_1$"
 bfl_place_deposit_2: "Abra um 100 depósito a prazo em ouro"
