 bfl_banking_finance_companies__finance_notifications: "Notificações financeiras"
 bfl_banking_finance_companies__finance_notifications_desc: "Preferência de apresentação de notificações; as obrigações nunca são canceladas pelo silenciamento."
 bfl_banking_finance_companies__finance_notifications_name: "Notificações financeiras"
