 bfl_bond_underwriting: "Subscrição de títulos"
 bfl_bond_underwriting_tip: "#T Subscrição de títulos#!\nSeu banco licenciado paga em dinheiro real por um título soberano personalizado. Ambas as especializações podem subscrever. Os cupons anuais fixos são pagos mensalmente; o atual titular recebe o valor nominal no resgate. A emissão requer liquidez bancária, capital e capacidade soberana."
 bfl_bond_unpaid: "Cupons não pagos"
 bfl_bond_workout_accept: "Aceite a reestruturação do título"
 bfl_bond_workout_desc: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_bond_workout_issuer').GetCountry.GetName] pede a você, atual titular, que renuncie 20% do capital e dos cupões não pagos desta obrigação e reduzir o seu cupão anual em um ponto percentual, com uma 1% chão. A recusa preserva todos os termos. A proposta expira este mês; pagamento, transferência ou outra alteração o invalida. A aceitação comum não oferece nenhuma nova segurança. Quando oferecida, a aceitação segura acrescenta uma concessão de proteção comercial de dois anos e um compromisso exclusivo de até 10% de renda mensal para cupons não pagos. A aplicação usa apenas o ouro disponível do tesouro, antes de outros cupons de títulos personalizados; não cria nenhuma garantia ou pagamento de principal."
 bfl_bond_workout_secured: "Aceite com uma concessão comercial de dois anos e promessa de receita"
 bfl_bond_workout_title: "Proposta de reestruturação de títulos"
 bfl_branch_construction: "Estabelecer uma agência bancária de capital"
 bfl_branch_required: "Novos negócios soberanos exigem que este banco tenha uma agência bancária concluída na capital atual. Os negócios entre bancos estão isentos; as reivindicações existentes permanecem devidas."
