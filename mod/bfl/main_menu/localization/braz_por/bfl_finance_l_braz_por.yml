 bfl_sovereign_accounts: "Contas soberanas — separadas dos ativos bancários"
 bfl_sovereign_accounts_subtitle: "Empréstimos soberanos nativos – não ativos bancários"
 bfl_sovereign_accounts_tip: "Estas dívidas e valores a receber locais pertencem ao soberano e não ao seu banco. Os empréstimos pertencentes a bancos estão incluídos no donut de ativos; os passivos bancários incluem depósitos e despesas operacionais não pagas. As listas nativas de empréstimos, reembolsos e empréstimos mantêm o soberano como ator."
 bfl_sovereign_banknotes: "Notas Soberanas"
 bfl_sovereign_banknotes_desc: "Um banco apoiado pela autoridade pública pode fazer circular promessas escritas de pagamento em vez de moedas pesadas. A sua aceitação baseia-se na confiança de que a instituição os resgatará e que a autoridade emissora cumprirá as suas obrigações."
 bfl_sovereign_credit: "Crédito Soberano"
 bfl_sovereign_credit_tip: "#T Crédito soberano#!\nUm empréstimo em numerário bancário a um estado fundiário, com um pedido de reembolso registado como um activo bancário. Requer um banco operacional e as condições de empréstimo nativas. A execução de novos empréstimos não está disponível nesta versão."
 bfl_sovereign_debt: "Dívida soberana"
 bfl_sovereign_debt_heading: "Dívida soberana de [Country.GetName]"
 bfl_sovereign_note: "Nota Soberana"
 bfl_sovereign_note_tip: "#T Notas resgatáveis#!\nAbsolutismo, pesquisa de Notas Soberanas, autorização soberana, Banco Central de capital e Agência Bancária do emissor. Troca 100 espécie para uma reivindicação totalmente reservada. O limite baseado em ações independentes exclui a entrada de notas em dinheiro. Transferências voluntárias de paridade; os pagamentos nativos permanecem em ouro."
 bfl_sovereign_receivables: "Contas a receber soberanas"
 bfl_sovereign_receivables_heading: "Contas a receber soberanas de [Country.GetName]"
 bfl_sovereign_restructuring: "Reestruturação Soberana"
 bfl_sovereign_restructuring_tip: "#T Reestruturação soberana#!\nRenegociar a dívida soberana no âmbito do adiantamento de Reestruturação da Dívida. Requer a idade permitida, um banco operacional e uma transação de dívida local suportada. A execução de reestruturação nativa não está disponível nesta compilação."
 bfl_specialization_title: "Especialização bancária"
 bfl_state_bonds_tip: "#T Capacidade de títulos estaduais#!\nTítulos estaduais locais em circulação: [GetPlayer.GetNumBonds]\nSlots máximos de títulos nativos: [GetPlayer.GetDoubleModifierValue('max_bonds', 'max_bonds_modifier')|0]\n\nEstes são os títulos do seu estado, separados dos depósitos, patrimônio e outros passivos do banco. A capacidade inclui slots de base nativos e modificadores de capacidade de ligação. A venda de um título também requer as condições de empréstimo locais."
 bfl_state_bonds_value: "Títulos: [GetPlayer.GetNumBonds] / [GetPlayer.GetDoubleModifierValue('max_bonds', 'max_bonds_modifier')|0]"
 bfl_state_chartered_bank: "Banco fretado estadual"
 bfl_state_chartered_bank_desc: "Um assunto bancário nativo financiado separadamente. O soberano inicialmente possui todas as ações e define o pagamento mensal de dividendos em Crédito. Novas subscrições bancárias aumentam o capital e diluem a propriedade existente. Os depósitos do Estado rendem juros preferenciais."
 bfl_state_credit: "Crédito estatal"
 bfl_state_credit_value: "Crédito: [Multiply_CFixedPoint(GetPlayer.GetCreditworthiness, '(CFixedPoint)100')|0]"
 bfl_state_interest_value: "Interesse: [GetPlayer.GetModifierValueNoFormat('bank_interest')]"
 bfl_status_0: "Operando"
 bfl_status_1: "Dinheiro sob pressão"
 bfl_status_2: "Retiradas na fila"
