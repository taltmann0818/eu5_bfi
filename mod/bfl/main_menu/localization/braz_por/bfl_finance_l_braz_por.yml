 bfl_finance.110.desc: "O investimento compra novo capital estatal. A conversão preserva a identidade do país do banco. Fechar esta seleção não transfere nenhum dinheiro. Oito assuntos diretos elegíveis são mostrados por página; use Próximo para acessar bancos adicionais."
 bfl_finance.110.title: "Escolha o Banco do Estado"
 bfl_finance_title: "Bancário e Financeiro"
 bfl_financial_advance: "Adiantamento bancário"
 bfl_financial_advance_desc: "Conhecimento financeiro para bancos independentes e bancos licenciados pelo estado."
 bfl_founder_class: "Fundadores · pool de burgueses locais"
 bfl_free_cash_label: "Dinheiro disponível"
 bfl_funded_bill_button: "Conta de pagamento financiada · 100 ouro"
 bfl_funding_tab: "Financiamento e Dívida"
 bfl_funding_title: "Depósitos e capital"
 bfl_funding_title_tip: "#T Depósitos e capital#!\nUm depósito transfere dinheiro do estado para o banco e cria um crédito reembolsável. Uma subscrição de capital compra unidades de propriedade e pode perder valor. Ambos transferem o ouro existente; nenhum dos dois conta como lucro do banco."
 bfl_goods: "Bens e custódia · Merchant Finance"
 bfl_goods_accept: "Aceite estes termos"
 bfl_goods_accept_branch_tip: "Aceite o contrato da Alfândega de doze meses exibido. As taxas mensais de acesso financiadas vão para o anfitrião que consente; a aceitação não cria estoque, reclamação de mercadorias ou compra imediata."
 bfl_goods_accept_quote_tip: "Pague o preço do contrato exibido mais a taxa de custódia separada de ouro ao custodiante. Verifique novamente o apoio ao vivo, preço, partes, permissões, acesso e fundos protegidos; termos alterados ou obsoletos não movimentam dinheiro."
 bfl_goods_accept_transfer_tip: "Pague o preço de transferência exibido ao titular atual. Verifique novamente o titular, a quantidade, a geração do lote, a pesquisa, o vencimento e o financiamento antes de transferir uma vez o recibo existente."
 bfl_goods_branch_desc: "O anfitrião oferece acesso ao seu mercado de capitais para 12 meses em 1 ouro por mês, pago ao anfitrião. As compras locais mantêm sua própria cobrança em dinheiro; este é um serviço de custódia separado. O acesso requer que o anfitrião possua alfândega preenchida e paz. Acesso não pago, expiração, perda de construção ou guerra impedem novas compras e entregas. O anfitrião pode congelar a custódia local; nenhum dinheiro ou bens são criados. Renove com o mesmo host para restaurar o acesso."
 bfl_goods_branch_title: "Acordo de custódia da Alfândega"
 bfl_goods_browser_desc: "Selecione um lote físico para analisar sua oferta. Os titulares existentes podem solicitar entrega; o anfitrião da Alfândega que consentir pode congelar a custódia inacessível e liberá-la após o acesso renovado. Nenhuma aceitação de oferta ocorre na seleção."
 bfl_goods_browser_title: "Ofertas de mercadorias e reivindicações de custódia"
 bfl_goods_claim_desc: "Solicite a entrega deste recibo em seu mercado de capitais. A entrega entre mercados leva dois meses, custos 1 ouro e perde 1% de quantidade. Como alternativa, feche esta janela e use Oferecer transferência de recibo de armazém na diplomacia. As transferências exigem Revoluções e Margens e Gestão de Risco no custodiante; o comprador deve aceitar uma cotação atual."
 bfl_goods_claim_title: "Sua reivindicação de armazém"
 bfl_goods_close: "Fechar"
 bfl_goods_decline: "Recusar"
 bfl_goods_deliver: "Solicite entrega física"
 bfl_goods_explanation: "Inventário nativo financiado, recibos garantidos e encaminhamentos exigem Merchant Finance, seus adiantamentos e verificação de execução/custódia P09. Bens onerados não podem respaldar uma segunda reclamação."
 bfl_goods_forward_title: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_goods_quote_type').Goods.GetNameWithNoTooltip] atacante físico"
 bfl_goods_inventory_empty: "Nenhuma mercadoria sob custódia. As compras automáticas começam no próximo fechamento mensal do banco qualificado."
 bfl_goods_inventory_hint: "Passe o mouse para mercadorias, quantidades, valor e retorno"
 bfl_goods_inventory_note: "Valor de venda nativo indicativo; retorno não realizado contra o custo pago restante. Os recebimentos de terceiros são excluídos do total bancário. Custos, deterioração e perda de acesso afetam os lucros. Role para cada posição armazenada."
 bfl_goods_inventory_subtitle: "Custódia física · valor de mercado indicativo"
 bfl_goods_inventory_title: "Inventário de mercadorias"
 bfl_goods_next: "Próximos lotes"
 bfl_goods_policy_allocation_0: "Alocação · 0%"
 bfl_goods_policy_allocation_10: "Alocação · 10%"
 bfl_goods_policy_allocation_25: "Alocação · 25%"
 bfl_goods_policy_allocation_50: "Alocação · 50%"
 bfl_goods_policy_button: "Política"
 bfl_goods_policy_contracts_0: "Contratos · Somente spot"
 bfl_goods_policy_contracts_1: "Contratos · Oferecer recibos"
 bfl_goods_policy_contracts_2: "Contratos · Oferta a termo"
 bfl_goods_policy_help: "Clique em uma configuração para alternar. O banco escolhe mercadorias e quantidades no fechamento mensal. Passe o mouse sobre cada configuração para ver suas regras."
 bfl_goods_policy_mandate_0: "Mandato · Pausado"
 bfl_goods_policy_mandate_1: "Mandato · Automático"
 bfl_goods_policy_mandate_2: "Mandato · Fuga"
 bfl_goods_policy_risk_0: "Risco · Cauteloso"
 bfl_goods_policy_risk_1: "Risco · Equilibrado"
 bfl_goods_policy_risk_2: "Risco · Aventureiro"
 bfl_goods_policy_turnover_12: "Segure até · 12 meses"
 bfl_goods_policy_turnover_24: "Segure até · 24 meses"
 bfl_goods_policy_turnover_6: "Segure até · 6 meses"
 bfl_goods_previous: "Lotes anteriores"
 bfl_goods_quote_desc: "Quantidade: [ROOT.GetCountry.MakeScope.GetVariable('bfl_goods_quote_quantity').GetValue|3]. Preço: [ROOT.GetCountry.MakeScope.GetVariable('bfl_goods_quote_price').GetValue|2] ouro mais 1 taxa de custódia de ouro. Um recibo de armazém possui as mercadorias imediatamente. Um encaminhamento físico pré-financia totalmente a entrega em três meses. Ambos exigem bens garantidos. Custos de armazenamento 0.1 por mês; perda física é 2% anualmente. Um forward mantém sua quantidade fixa: reembolso de unidades faltantes pro rata mais compensação igual de segurança do vendedor. A entrega para outro mercado demora dois meses, custa 1 ouro e perde 1% de quantidade. As perdas no armazenamento e no transporte reduzem a quantidade recebida. Partes inválidas ou acesso perdido preservam bens e garantias para recuperação. Aceite apenas se estes termos forem adequados para você."
 bfl_goods_quote_title: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_goods_quote_type').Goods.GetNameWithNoTooltip] recibo de armazém"
 bfl_goods_set_allocation_tip: "Ciclo 0%, 10%, 25% ou 50% do caixa do banco mais o custo do estoque próprio. O dinheiro protegido é sempre retido. A redução da alocação vende posições livres acessíveis até abaixo da meta."
 bfl_goods_set_contracts_tip: "Apenas à vista, ofereça recibos automaticamente ou ofereça encaminhamentos físicos automaticamente. As ofertas exigem a idade e a pesquisa do instrumento, permanecem garantidas e aguardam a aceitação separada da contraparte. As obrigações aceitas existentes permanecem protegidas."
 bfl_goods_set_mandate_tip: "Automático: compre e venda de acordo com sua apólice. Pausado: sem negociações discricionárias. Fuga: venda estoque gratuito acessível sem substituí-lo. Os contratos existentes, armazenamento e perdas continuam em todos os modais."
 bfl_goods_set_risk_tip: "Cauteloso: obtenha lucro +10%, parar a perda −5%. Equilibrado: +20% / −15%. Aventureiro: +35% / −25%. Os limites usam cotações de venda nativas em relação ao custo restante; a execução é mensal e os preços podem variar."
 bfl_goods_set_turnover_tip: "Período máximo de retenção: 6, 12 ou 24 meses. O banco vende posições gratuitas acessíveis no vencimento e escolhe novos produtos automaticamente."
 bfl_goods_settings: "Política comercial"
 bfl_goods_settings_tip: "Defina o mandato, alocação, limites de risco, período de manutenção e política contratual do banco. O banco escolhe todas as mercadorias e quantidades no fechamento mensal."
 bfl_goods_tip: "#T Bens e comércio#!\nInstrumentos de Merchant Finance envolvendo estoque, recebimentos, entrega futura e margem. A permissão registrada não cria mercadorias ou uma rota comercial; a execução física é necessária."
 bfl_goods_trading_locked: "Negociação bloqueada · passe o mouse sobre os requisitos"
 bfl_goods_transfer_desc: "Preço: [ROOT.GetCountry.MakeScope.GetVariable('bfl_goods_transfer_price').GetValue|2] ouro. Quantidade: [ROOT.GetCountry.MakeScope.GetVariable('bfl_goods_transfer_quantity').GetValue|3]. Seu pagamento vai para o titular atual. A custódia fica no banco; os prazos de armazenamento, deterioração e entrega continuam. A aceitação rejeita alteração de lastro, titular, geração de lote ou preço."
 bfl_goods_transfer_title: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_goods_transfer_type').Goods.GetNameWithNoTooltip] transferência de recibo"
 bfl_grant_goods_branch: "Oferecer acesso à custódia da Alfândega"
 bfl_grant_goods_branch_act: "$bfl_grant_goods_branch$"
 bfl_grant_goods_branch_desc: "Revise as ofertas de custódia física, as reivindicações existentes ou um acordo voluntário de acesso à Alfândega. Selecionar um país não movimenta dinheiro."
 bfl_grant_goods_branch_effect_text: "$bfl_grant_goods_branch$"
 bfl_grant_goods_branch_effect_text_past: "$bfl_grant_goods_branch$"
 bfl_history_empty: "O histórico começa na próxima liquidação mensal."
 bfl_investment_tab: "Empréstimos e investimentos"
 bfl_investment_title: "Crédito e investimentos"
 bfl_invite_equity_capital: "Adicionar capital próprio do banco"
 bfl_invite_equity_capital_desc: "Inscrever-se 100 ouro para [ROOT.GetCountry.MakeScope.GetVariable('bfl_capital_issuer').GetCountry.GetName] do tesouro ou carteira imobiliária selecionada. O subscritor recebe novas ações pela cotação de mercado. As carteiras imobiliárias retêm pelo menos 25 ouro. A propriedade financeira, os dividendos futuros e a diluição seguem as ações pagas."
 bfl_invite_equity_capital_tip: "Escolha o tesouro ou uma carteira imobiliária para assinar 100 ouro ao NAV atual do banco. Novas ações diluem os detentores existentes; o banco recebe o pagamento."
 bfl_join_clearing_group: "Junte-se a um grupo de compensação"
 bfl_join_clearing_group_act: "$bfl_join_clearing_group$"
 bfl_join_clearing_group_command: "$bfl_join_clearing_group$"
 bfl_join_clearing_group_command_desc: "$bfl_join_clearing_group_desc$"
 bfl_join_clearing_group_desc: "Junte-se a uma operadora que aceita membros. Quatro bancos por grupo; as contas de pagamento vencidas compensadas são liquidadas por débito líquido financiado. Um membro curto bloqueia o lote sem apagar as reivindicações."
 bfl_join_clearing_group_effect_text: "$bfl_join_clearing_group$"
 bfl_join_clearing_group_effect_text_past: "$bfl_join_clearing_group$"
 bfl_join_clearing_group_tip: "Escolha um operador de compensação pesquisado que aceite membros. São necessárias pesquisas sobre Revolutions, Clearing House e Advanced Clearing. Até quatro bancos aderem explicitamente; um membro curto preserva todas as reivindicações."
 bfl_liabilities_label: "Passivos bancários"
 bfl_liabilities_label_tip: "#T Dívida total#!\nObrigações registadas nas contas do banco. Isso é separado dos empréstimos e títulos nativos do seu estado.\n\nPrincipal de depósito: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_deposit_principal')|2]@gold!\nJuros de depósito creditados: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_deposit_interest')|2]@gold!\nNotas pendentes: [Country.MakeScope.GetVariable('bfl_notes_outstanding').GetValue|2]@gold!\nOutras contas a pagar: [Country.MakeScope.GetVariable('bfl_other_payables').GetValue|2]@gold!\nTotal: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_liabilities')|2]@gold!\n\nRetiradas em fila de [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_withdrawals_due')|2]@gold! já fazem parte dos pedidos de depósito e não são adicionados uma segunda vez."
 bfl_liquidity_facilities: "Facilidades de Liquidez"
 bfl_liquidity_facilities_desc: "Mesmo uma casa bancária solvente pode não ser capaz de satisfazer todas as procuras de moedas de uma só vez. Adiantamentos temporários contra activos sólidos podem colmatar esta escassez, desde que a assistência não esconda perdas que a instituição não possa suportar."
 bfl_liquidity_warning: "Liquidez bancária requer atenção"
 bfl_liquidity_warning_desc: "Seu banco enfileirou saques ou capital inadequado. Economia Aberta → Bancário e Financeiro para revisão de depósitos e recapitalização."
 bfl_list_selected_bond_01_tip: "Ofereça esta reivindicação exata em 98% de rosto por três meses. Seu titular atual retém os cupons até a aceitação financiada. Ambas as partes ainda devem ter uma troca quando a venda for executada."
