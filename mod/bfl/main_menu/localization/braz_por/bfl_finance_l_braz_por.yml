 bfl_transfer_bank_bill_desc: "Escolha o emissor e um beneficiário aceitante. O primeiro elegível 100- transferências de reivindicações de ouro para 100 ouro pago ao seu atual detentor. A garantia bloqueada não pode ser transferida. As notas exigem pesquisa de aceitação do Revolutions. Todas as verificações de financiamento, propriedade e filial de capital são repetidas na execução."
