 bfl_place_deposit_2_desc: "Os bancos independentes exigem uma opinião de pelo menos +50 em sua direção para abrir uma conta. Seu banco credenciado oferece um extra 1% juros anuais. Os juros à vista são pagos mensalmente quando financiados; os juros não pagos permanecem devidos. A queda nas relações nunca impede a retirada de suas próprias reivindicações amadurecidas."
