 bfl_browse_goods_act: "$bfl_browse_goods$"
 bfl_browse_goods_desc: "Revise as ofertas de custódia física, as reivindicações existentes ou um acordo voluntário de acesso à Alfândega. Selecionar um país não movimenta dinheiro."
 bfl_browse_goods_effect_text: "$bfl_browse_goods$"
 bfl_browse_goods_effect_text_past: "$bfl_browse_goods$"
 bfl_burghers_estate_workout_mandate: "Mandato de treino imobiliário"
 bfl_burghers_estate_workout_mandate_desc: "Esta propriedade autoriza explicitamente o seu governo a rever as negociações de depósitos bancários voluntários em seu nome. Cada proposta ainda precisa de aceitação separada. A revogação deste privilégio invalida os termos de propriedade pendentes. Os pagamentos de recuperação continuam na carteira do patrimônio."
 bfl_buy_bill: "Conta de pagamento financiada · 100 ouro"
 bfl_buy_bill_tip: "#T Conta de pagamento financiada#!\nTransferência 100 doar ouro ao banco para uma conta de pagamento financiada. A fatura é registrada como uma conta a pagar, em vez de lucro bancário ou empréstimo sem garantia. Requer pesquisa de faturas comerciais, espaço na mesa de contratos e um banco operacional que aceite este negócio."
 bfl_buy_capital: "Subscrever capital · 100 ouro"
 bfl_buy_capital_tip: "#T Subscrever capital bancário#!\nTransferência 100 ouro estatal para comprar novas unidades de propriedade bancária. As unidades são precificadas a partir do patrimônio líquido positivo do banco por unidade existente. Isto aumenta o caixa bancário e o capital integralizado, em vez do lucro. Desbloqueado por pesquisas bancárias locais, espaço de mesa de capital e um banco operacional que aceita este negócio. O capital está exposto a perdas e não pode ser retirado como depósito."
 bfl_buy_confirm_desc: "Comprar [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_quantity').GetValue|3] ações de [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_issuer').GetCountry.GetName] para [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_total').GetValue|2]@gold!. Estas são ações existentes do estoque do formador de mercado. O emissor não recebe financiamento e as ações emitidas não sofrem alterações. O preço cotado, o acesso ao mercado ao vivo, as unidades disponíveis, o dinheiro protegido e o limite de concentração são verificados novamente na aceitação. A liquidação consome um diplomata e inicia o período de espera de compra/venda de um mês deste emissor."
 bfl_buy_confirm_title: "Confirmar compra de ações"
 bfl_buy_secondary_confirm_desc: "Comprar [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_quantity').GetValue|3] ações existentes de [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_issuer').GetCountry.GetName] de [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_seller').GetCountry.GetName] para [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_total').GetValue|2]@gold!. O vendedor atual recebe o pagamento. O emissor não recebe financiamento e as ações emitidas não sofrem alterações. A disponibilidade, o acesso, os fundos protegidos e a revisão desta oferta são verificados novamente no momento da aceitação. A liquidação consome um diplomata e inicia o período de espera de compra/venda de um mês deste emissor."
 bfl_buy_selected_bond: "Comprar reivindicação existente"
 bfl_buy_selected_bond_tip: "Pague o preço cotado ao vendedor atual. O emissor não recebe dinheiro novo. A execução verifica novamente a propriedade, o vencimento, a geração, as trocas, os atrasos e o dinheiro."
 bfl_buy_shares: "Comprar ações"
 bfl_buy_shares_desc: "Escolha um banco ou empresa, defina uma quantidade de ações e revise o total. A compra transfere ações existentes de uma oferta de venda ou estoque do formador de mercado. Utilizar a ação separada de subscrição de capital para financiar novas emissões."
 bfl_buy_shares_tip: "Escolha um banco ou empresa, defina uma quantidade de ações e revise o total. A compra transfere ações existentes de uma oferta de venda ou estoque do formador de mercado. Utilizar a ação separada de subscrição de capital para financiar novas emissões.\nRequer uma troca concluída, negociação de ações e pelo menos um diplomata. Cada negociação bem-sucedida consome um diplomata e inicia um período de espera de um mês para esse emissor. Diplomatas disponíveis: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bfl_available_trade_diplomats')|2]. As encomendas devem ter um valor em dinheiro de pelo menos 0.01 ouro."
 bfl_buy_sovereign_bond: "Compre um título soberano oferecido"
 bfl_buy_sovereign_bond_act: "$bfl_buy_sovereign_bond$"
 bfl_buy_sovereign_bond_desc: "Compre um título soberano existente de seu titular atual. Requer um edifício próprio da Bolsa de Valores concluído."
 bfl_buy_sovereign_bond_effect_text: "$bfl_buy_sovereign_bond$"
 bfl_buy_sovereign_bond_effect_text_past: "$bfl_buy_sovereign_bond$"
 bfl_buy_sovereign_bond_tip: "Selecione o emissor de uma oferta aberta. O pagamento vai para o titular existente; o emissor não recebe novos recursos. Todo o crédito muda de mãos com seu cupom anual fixo e principal intactos."
 bfl_buy_state_confirm_desc: "Comprar de volta [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_quantity').GetValue|3] ações existentes de [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_issuer').GetCountry.GetName] do estoque do formador de mercado para [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_total').GetValue|2]@gold!, pago pelo tesouro do seu país. Essas ações retornam para sua participação em tesouraria. O banco não recebe financiamento e as ações emitidas não sofrem alterações. O estoque disponível do revendedor, a cotação atual do mercado, a autoridade de fretamento em tempo real e o dinheiro do tesouro são verificados novamente. O acordo consome um diplomata e inicia o período de espera de compra/venda de um mês deste banco."
 bfl_cancel: "Cancelar"
 bfl_cancel_selected_bond_offer: "Cancelar listagem"
 bfl_cancel_selected_bond_offer_tip: "Retire uma oferta de sua propriedade ou de seu banco licenciado. A dívida e o cupom permanecem inalterados."
 bfl_capital_button: "Subscrever capital · 100 ouro"
 bfl_cash: "Dinheiro do Tesouro"
 bfl_cash_tip: "#T Dinheiro do Tesouro#!\nOuro atualmente em poder do banco.\n\nDinheiro total: [Country.GetFixedPointCurrencyValue('gold')|2]@gold!\nDinheiro protegido: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_protected_cash')|2]@gold!\nDinheiro disponível: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_free_cash')|2]@gold!\n\nReservas de dinheiro protegidas 25% de passivos restantes após retiradas em fila, a fila de retirada completa, um 25 buffer operacional de ouro e dinheiro comprometido. O caixa disponível é o dinheiro do tesouro menos essa reserva, com um mínimo de zero. O dinheiro protegido é uma reserva obrigatória; pode exceder o dinheiro realmente retido."
 bfl_chart_debt_01: "Dívida: [Country.MakeScope.GetVariable('bfl_history_debt_01').GetValue|2]@gold! · mês contábil [Country.MakeScope.GetVariable('bfl_history_period_01').GetValue|0]"
