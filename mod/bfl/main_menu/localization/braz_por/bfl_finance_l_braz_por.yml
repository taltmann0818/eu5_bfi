 bfl_custom_bond_terms: "Cupons em novos títulos"
 bfl_custom_bond_totals: "Excelente: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bfl_bond_debt')|2]@gold! · cupom mensal: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bfl_bond_monthly_coupon')|2]@gold! · não remunerado: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bfl_bond_arrears')|2]@gold!"
 bfl_custom_bonds_title: "Títulos soberanos"
 bfl_custom_bonds_title_tip: "O banco financia títulos soberanos perpétuos personalizados. Os atuais titulares recebem cupons mensais e resgate pelo valor nominal. A capacidade combinada de dívida personalizada e nativa é 24 meses de renda nativa com um 100-mínimo de ouro; cupons personalizados podem consumir no máximo 25% da renda nativa. Cupons não pagos bloqueiam novas emissões e revendas."
 bfl_dealer_inventory_class: "Inventário do formador de mercado · sem votos"
 bfl_debt: "Carteira de dívida nativa"
 bfl_debt_explanation: "O banco licenciado financia títulos soberanos personalizados. A negociação secundária requer bolsas de valores concluídas em ambos os lados, incluindo concessões de eventos antecipados. O crédito nativo usa ofertas aceitas e pesquisa de alívio de dívidas com registros de reivindicações persistentes."
 bfl_debt_facility: "Mecanismo de dívida"
 bfl_debt_resale: "Revenda de dívidas"
 bfl_debt_resale_tip: "#T Revenda de títulos soberanos#!\nA venda e a compra de títulos soberanos secundários exigem o adiantamento da Bolsa de Valores e um prédio próprio da Bolsa de Valores. Uma oferta aberta transfere a mesma reivindicação personalizada para 98% do valor nominal; o emissor não recebe novos recursos. Cupons e resgates seguem o comprador."
 bfl_debt_restructuring: "Reestruturação de dívida"
 bfl_debt_restructuring_desc: "Uma dívida que não pode ser cobrada no dia marcado não precisa ser inútil. Os credores podem preservar mais os seus créditos concordando com novos termos do que pressionando um devedor em dificuldades a entrar em incumprimento total."
 bfl_debt_tip: "#T Dívida e crédito#!\nPermissões para empréstimos, subscrição, reestruturação e transferências de dívidas. Cada linha tem seus próprios requisitos de pesquisa, especialização, liquidez e execução. Um bloqueio significa que a nova origem não está disponível; não cancela reivindicações existentes."
 bfl_demand_deposit: "Depósito à vista"
 bfl_deposit_1: "Depósito 100 ouro sob demanda"
 bfl_deposit_1_tip: "#T Depósito à vista#!\nTransferência 100 indique ouro para seu banco licenciado. Sua oferta anual para novas contas é a taxa básica exibida mais um 1% prêmio de fretamento. Os juros à vista são pagos ao seu tesouro mensalmente quando financiados, com carregamento de centavos; os juros não pagos permanecem devidos. As contas existentes mantêm a taxa aceita. A retirada reembolsa o principal e os juros não pagos. Os bancos independentes aceitam depósitos através da diplomacia em +50 opinião ou melhor e oferecer a taxa básica."
 bfl_deposit_2: "Depósito 100 ouro para 12 meses"
 bfl_deposit_2_tip: "#T Depósito a prazo#!\nTransferência 100 indique ouro ao seu banco credenciado por doze meses. Sua oferta anual para novas contas é a taxa de prazo exibida mais um 1% prêmio de fretamento. Os juros são acumulados mensalmente e pagos com o principal no vencimento. Requer banco nativo, idade permitida e espaço de conta gratuito. Contas a prazo independentes estão disponíveis através da diplomacia em +50 opinião ou melhor."
 bfl_deposit_decline_tip: "Retenha a reivindicação de depósito integral. Nenhuma movimentação de dinheiro e nenhuma ação são emitidas."
 bfl_deposit_equity_tip: "Converta o crédito cotado em ações reais apenas se o banco sobrevivente tiver um NAV tangível positivo e capacidade acionista. Nenhum dinheiro ou ganhos de assinatura são gerados."
 bfl_deposit_explanation: "Cada conta armazena sua taxa anual fixa aceita. A alteração da taxa afeta novas contas. As contas a prazo vencem após 12 meses. A escassez de retiradas continua a ser um passivo e suspende novos compromissos."
 bfl_deposit_haircut_tip: "Aceite o citado 20% redução após nova verificação do credor, crédito remanescente, pesquisa e autoridade. Uma garantia pública registada permanece financiada separadamente."
 bfl_deposit_income_tip: "Exija juros realmente pagos este mês pelo seu banco credenciado e bancos independentes. Os juros não pagos permanecem devidos. Excluem-se os levantamentos de capital e as contribuições de capital."
 bfl_deposit_interest: "Juros de depósito"
 bfl_deposit_ledger_help: "Cada lote mantém sua taxa aceita. Agregado de depósitos correspondentes; os depósitos a prazo vencem após 12 meses. As reivindicações em quarentena permanecem devidas e param de ser acumuladas até que um destinatário válido esteja disponível. O principal e os juros do patrimônio retornam para o mesmo pool."
 bfl_deposit_ledger_title: "Livro razão de depósito e manutenção"
 bfl_deposit_ledger_title_tip: "Passivos bancários, termos aceitos e reclamações não pagas. O serviço nunca depende da continuação da admissão diplomática."
 bfl_deposit_policy_title: "Taxas para novos depósitos"
 bfl_deposit_policy_title_tip: "#T Taxas para novos depósitos#!\nEscolha a taxa de juros anual aceita pelas novas contas à vista.\n\nOferta atual: [Country.MakeScope.GetVariable('bfl_demand_rate').GetValue|%2]\nOferta de conta a prazo: [Country.MakeScope.GetVariable('bfl_term_rate').GetValue|%2]\n\nAs contas existentes mantêm a taxa acordada quando foram abertas. Os juros creditados mensalmente aumentam o passivo do banco e reduzem os seus lucros retidos; ele não movimenta dinheiro até ser pago."
 bfl_deposits: "Depósitos e taxas"
 bfl_deposits_label: "Reivindicações de depósito"
 bfl_dev_notice: "O crédito financiado, as obrigações soberanas, o investimento empresarial, os bens, as comendas e os serviços monetários obedecem aos seus requisitos de investigação, perfil e construção. O equilíbrio e a compatibilidade da campanha em todo o lançamento permanecem em validação."
 bfl_distress: "Portões de sofrimento e desenvolvimento"
 bfl_distribution_title: "Distribuição de lucros"
 bfl_distribution_title_tip: "#T Dividendos mensais em ações#!\nDividendo soberano = ações soberanas Ã— ((lucro líquido mensal do banco Ã— índice de distribuição) / ações em circulação).\n\nTaxa de pagamento: [Country.MakeScope.GetVariable('bfl_payout_ratio').GetValue|%0]\nLucro líquido após custos e perdas transportadas: [Country.MakeScope.GetVariable('bfl_monthly_net_income').GetValue|2]@gold!\nAções soberanas: [Country.MakeScope.GetVariable('bfl_state_units').GetValue|2]\nAções em circulação: [Country.MakeScope.GetVariable('bfl_total_units').GetValue|2]\nÚltimos dividendos totais: [Country.MakeScope.GetVariable('bfl_dividend_paid').GetValue|2]@gold!\nÚltimo dividendo soberano: [Country.MakeScope.GetVariable('bfl_state_dividend_paid').GetValue|2]@gold!\n\nO soberano inicialmente possui 100%. Novas subscrições bancárias aumentam o capital e diluem a propriedade. Dinheiro, capital e obrigações pendentes limitam o pagamento financiado. O rendimento negativo não paga dividendos; o lucro retido não é contabilizado novamente no próximo mês. Excluem-se o capital, os depósitos, as subscrições e os empréstimos."
 bfl_dividend_explanation: "O lucro líquido mensal após juros de depósitos, despesas operacionais e perdas transportadas financia dividendos. Cada proprietário recebe as ações próprias multiplicadas pelo pagamento financiado por ação em circulação. Os lucros retidos não serão distribuídos novamente no próximo mês."
 bfl_draw_bond: "Emprestar 100 do banco"
 bfl_draw_bond_tip: "O banco credenciado paga 100 ouro por um título soberano perpétuo. Uma emissão por mês, sujeita à proteção de caixa, capital e capacidade de dívida do emissor. Os rendimentos são financiamento. Reembolsar o valor nominal ao seu titular atual para aposentá-lo."
 bfl_equity_debt: "Patrimônio e dívida bancária"
 bfl_equity_debt_tip: "#T Patrimônio e dívida bancária#!\nAté doze instantâneos de liquidação mensais reais. Verde são ativos menos passivos; vermelho é o passivo total do banco. Ambos usam o mesmo eixo do ouro dimensionado automaticamente, incluindo patrimônio líquido negativo. As amostras vão do mais antigo à esquerda até o mais recente à direita. Passe o mouse sobre uma amostra para ver seu valor e mês contábil. Os empréstimos estatais não estão incluídos neste histórico bancário."
 bfl_equity_label: "Patrimônio bancário"
 bfl_equity_label_tip: "#T Patrimônio bancário#!\nO valor residual pertencente aos proprietários do banco após as suas obrigações.\n\nAtivos: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_assets')|2]@gold!\nMenos dívida total: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_liabilities')|2]@gold!\nPatrimônio líquido: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_equity')|2]@gold!\n\nUnidades de estado registradas: [Country.MakeScope.GetVariable('bfl_state_units').GetValue|2]\nTotal de unidades de propriedade: [Country.MakeScope.GetVariable('bfl_total_units').GetValue|2]\nCapacidade de capital: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_capital_headroom')|2]@gold!\n\nPatrimônio líquido negativo significa insolvência. A margem de capital é o patrimônio acima 10% de ativos, com mínimo de zero; as distribuições são limitadas tanto por esse espaço quanto pelo dinheiro disponível. O patrimônio líquido não é o valor que pode ser sacado imediatamente."
 bfl_equity_market: "Preço e histórico das ações"
 bfl_equity_subscribe_0: "Tesouro: subscrever 100 ouro"
 bfl_equity_subscribe_0_tip: "Subscrição primária do NAV: paga ao emissor e dilui os titulares existentes. As compras de imóveis utilizam a carteira imobiliária, preservando 25 ouro. Um investidor bancário utiliza apenas o seu próprio excedente de capital e de caixa protegido; o patrimônio da empresa exige pesquisa de investimentos no exterior."
 bfl_equity_subscribe_1: "Burgueses: inscreva-se 100 ouro"
 bfl_equity_subscribe_1_tip: "Subscrição primária do NAV: paga ao emissor e dilui os titulares existentes. As compras de imóveis utilizam a carteira imobiliária, preservando 25 ouro. Um investidor bancário utiliza apenas o seu próprio excedente de capital e de caixa protegido; o patrimônio da empresa exige pesquisa de investimentos no exterior."
 bfl_equity_subscribe_2: "Nobres: inscreva-se 100 ouro"
 bfl_equity_subscribe_2_tip: "Subscrição primária do NAV: paga ao emissor e dilui os titulares existentes. As compras de imóveis utilizam a carteira imobiliária, preservando 25 ouro. Um investidor bancário utiliza apenas o seu próprio excedente de capital e de caixa protegido; o patrimônio da empresa exige pesquisa de investimentos no exterior."
 bfl_equity_subscribe_3: "Clero: inscreva-se 100 ouro"
 bfl_equity_subscribe_3_tip: "Subscrição primária do NAV: paga ao emissor e dilui os titulares existentes. As compras de imóveis utilizam a carteira imobiliária, preservando 25 ouro. Um investidor bancário utiliza apenas o seu próprio excedente de capital e de caixa protegido; o patrimônio da empresa exige pesquisa de investimentos no exterior."
 bfl_equity_subscribe_4: "Camponeses: inscreva-se 100 ouro"
 bfl_equity_subscribe_4_tip: "Subscrição primária do NAV: paga ao emissor e dilui os titulares existentes. As compras de imóveis utilizam a carteira imobiliária, preservando 25 ouro. Um investidor bancário utiliza apenas o seu próprio excedente de capital e de caixa protegido; o patrimônio da empresa exige pesquisa de investimentos no exterior."
 bfl_equity_vote_payout_0: "Votação majoritária: 0% pagamento de dividendos"
 bfl_equity_vote_payout_0_tip: "Requer mais da metade dos votos financeiros emitidos. Lucros retidos da empresa e política de pagamento de banco independente apenas. A política monetária e de pagamento regulamentada permanece com o controlador em tempo real. Nenhuma transferência de assunto político."
 bfl_equity_vote_payout_25: "Votação majoritária: 25% pagamento de dividendos"
 bfl_equity_vote_payout_25_tip: "Requer mais da metade dos votos financeiros emitidos. Lucros retidos da empresa e política de pagamento de banco independente apenas. A política monetária e de pagamento regulamentada permanece com o controlador em tempo real. Nenhuma transferência de assunto político."
