 bfl_venture_policy: "Termos"
 bfl_venture_preset_0: "unilateral · 75% excedente bancário"
 bfl_venture_preset_1: "Bilateral · superávit igual"
 bfl_venture_preset_tip: "Unilateral: o banco financia todo o capital e recebe 75% de excedente. Bilateral: o banco financia dois terços, o operador um terço, o excedente é dividido igualmente. As perdas seguem as contribuições de capital."
 bfl_venture_settings_tip: "Expanda os termos propostos. As alterações afetam apenas ofertas futuras; os projetos aceitos mantêm seu contrato original."
 bfl_venture_state_1: "Ativo · capital em risco"
 bfl_venture_state_2: "Fechado · capital recuperado"
 bfl_venture_state_3: "Fechado · perda reconhecida"
 bfl_venture_state_4: "Não financiado · execução indisponível"
 bfl_venture_subtitle: "Atividades nomeadas · custos e vendas medidos"
 bfl_venture_ticket_100: "Limite de financiamento · 100 ouro"
 bfl_venture_ticket_200: "Limite de financiamento · 200 ouro"
 bfl_venture_ticket_400: "Limite de financiamento · 400 ouro"
 bfl_venture_ticket_tip: "Ciclo de uma autorização bancária máxima de 100, 200 ou 400 ouro. Apenas é calculado o custo real da atividade. O financiamento de cargas não utilizadas é liberado imediatamente; o financiamento de expedição não utilizado permanece reservado para uma carga elegível de área descoberta até o vencimento. Os termos bilaterais exigem capacidade para metade da autorização bancária da operadora."
 bfl_venture_title: "Comenda empreendimentos"
 bfl_ventures: "Ventures e empresas · Investimento no exterior"
 bfl_ventures_explanation: "Commenda começa no Discovery; as empresas nativas e o patrimônio da empresa exigem Reforma. O controlo político e a propriedade financeira permanecem separados. O capital do projeto não é um dividendo."
 bfl_ventures_tip: "#T Empreendimentos e empresas#!\nPermissões para empreendimentos financiados, investimentos de empresas, segurança de projetos e transferências de ações bancárias. Estes expõem o capital ao risco de investimento e requerem investigação e especialização relevantes."
 bfl_warehouse_receipt: "Recibo de armazém"
 bfl_warehouse_receipt_tip: "#T Recibo de armazém#!\nEmitir uma reclamação contra mercadorias armazenadas identificáveis. Requer pesquisa de recibos de armazém, finanças mercantis e a era do absolutismo ou posterior. O armazenamento verificado e a execução de mercadorias não estão disponíveis nesta versão."
 bfl_warehouse_receipts: "Recibos de armazém"
 bfl_warehouse_receipts_desc: "As mercadorias mantidas em um depósito confiável podem apoiar o comércio sem serem movimentadas a cada venda. O recibo estabelece o direito à mercadoria armazenada, permitindo ao seu proprietário obter financiamento enquanto a mercadoria permanece sob custódia."
 bfl_withdraw: "Retirar depósitos estatais vencidos"
 bfl_withdraw_tip: "#T Retirar depósitos estatais vencidos#!\nSolicite o reembolso das contas à vista e das contas a prazo vencidas do seu estado. O banco paga o principal e os juros creditados com o dinheiro disponível. Os valores não pagos permanecem registrados na fila de saque e suspendem novos negócios. Contas estrangeiras e depósitos a prazo não vencidos não podem ser sacados por esta ação."
 bfl_workout_decline: "Mantenha a reivindicação completa"
 bfl_workout_desc: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_workout_bank').GetCountry.GetName] propõe condições para o seu depósito de [ROOT.GetCountry.MakeScope.GetVariable('bfl_workout_claim').GetValue|2] ouro. Você pode renunciar 20% do crédito restante, converter todo o crédito em ações recém-emitidas com NAV tangível pré-conversão ou manter o seu crédito. A conversão requer NAV positivo e capacidade accionista e não está disponível para os credores bancários. Conjunto de credores [ROOT.GetCountry.MakeScope.GetVariable('bfl_workout_pool').GetValue|0]: 0 tesouro, 1 burgueses, 2 nobres, 3 clero, 4 camponeses. Os termos da propriedade exigem o Mandato de Treino promulgado pela propriedade. A cotação expira este mês; a recuperação ou uma mudança de gestão invalida-o."
 bfl_workout_equity: "Converter o crédito em ações (NAV positivo necessário)"
 bfl_workout_haircut: "Aceite um 20% redução"
 bfl_workout_title: "Proposta de treino do credor"
 bfl_workout_trade_access: "Concessão comercial de treino"
 bfl_workout_trade_access_desc: "A proteção comercial é levantada por uma negociação de títulos aceita separadamente por até dois anos. Os acordos ordinários de acesso ao comércio existentes são independentes desta concessão."
