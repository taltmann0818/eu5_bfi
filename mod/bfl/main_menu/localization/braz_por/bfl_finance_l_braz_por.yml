 bfl_status_5: "Fechado"
 bfl_strategy_automatic: "Mandato de IA · automático"
 bfl_strategy_credit: "Última revisão: crédito oferecido para consentimento"
 bfl_strategy_delegated: "Mandato de investimento · delegado"
 bfl_strategy_deposit: "Última revisão: 100 ouro colocado sob demanda"
 bfl_strategy_disable: "Gerenciar investimentos"
 bfl_strategy_disable_tip: "Pare de compras automáticas de empréstimos, ofertas de novas estratégias e colocações de demanda. Os empréstimos, depósitos e reivindicações em fila existentes continuam a ser atendidos. As políticas de bens, ações e filiais permanecem separadas."
 bfl_strategy_enable: "Delegar investimentos"
 bfl_strategy_enable_tip: "Autorizar compras pontuadas de empréstimos nativos existentes, ofertas de crédito e carga para contrapartes de IA elegíveis e colocações de demanda em excesso de dinheiro. A baixa liquidez pode listar um título soberano de propriedade em 98% de rosto; uma revenda aceita pode gerar uma perda. Cargo usa seus Termos atuais e consentimento ordinário e liquidação física. Os empréstimos soberanos, os dividendos, os bens e a autoridade monetária mantêm as suas políticas separadas. Novos negócios param em resolução."
 bfl_strategy_idle: "Última revisão: liquidez retida"
 bfl_strategy_manual: "Mandato de investimento · manual"
 bfl_strategy_recall: "Última revisão: solicitação de cancelamento de depósito"
 bfl_strategy_resale: "Última revisão: um título próprio é oferecido para liquidez"
 bfl_strategy_secondary_statement: "Compras automáticas de empréstimos nativos: [Country.MakeScope.GetVariable('bfl_strategy_takeovers').GetValue|0] · Cotações de revenda de títulos: [Country.MakeScope.GetVariable('bfl_strategy_resales').GetValue|0]"
 bfl_strategy_secondary_tip: "As compras de empréstimos existentes analisam no máximo doze clientes concluídos da agência de capital. O mutuário precisa de liquidez, paz, um orçamento não negativo e pelo menos 0.50 credibilidade. Compras retidas 100 dinheiro livre, limite o prêmio de aquisição em 25% do principal restante e da exposição total do mutuário em 25% de patrimônio. A margem mensal esperada deve ser de pelo menos 0.10 ouro após o prémio, um subsídio de serviço e custos de financiamento conservadores. Esta é uma estimativa; o reembolso antecipado e a inadimplência ainda podem causar perdas. A baixa liquidez pode cotar um título soberano de propriedade a 98% de face através de uma Bolsa de Valores concluída. Nenhum produto de revenda é contabilizado antes do consentimento do comprador financiado."
 bfl_strategy_statement: "Avaliações mensais: [Country.MakeScope.GetVariable('bfl_strategy_reviewed').GetValue|0]/12  · Pontuação: [Country.MakeScope.GetVariable('bfl_strategy_score').GetValue|2]\nOfertas de crédito: [Country.MakeScope.GetVariable('bfl_strategy_offers').GetValue|0]  · Depósitos efetuados: [Country.MakeScope.GetVariable('bfl_strategy_placements').GetValue|0]  · Recordações: [Country.MakeScope.GetVariable('bfl_strategy_recalls').GetValue|0]"
 bfl_strategy_title: "Mandato de investimento"
 bfl_strategy_title_tip: "Um mandato mensal conservador. Analise até doze candidatos a crédito, doze operadores de risco conectados com quatro mercados de origem cada, ou doze bancos de depósito. No máximo uma oferta de crédito, oferta de carga ou 100-colocação de demanda de ouro mensalmente. Ofertas de crédito e carga esfriam por três meses. A carga exige uma margem cotada de pelo menos 10% e um excedente do banco de ouro, retém 500 dinheiro livre e é limitado a dois acordos ativos e 25% patrimônio líquido. As cotações podem mudar; as perdas continuam possíveis. Permissões protegidas de dinheiro, pesquisa, filiais e perfil ainda se aplicam."
 bfl_strategy_venture: "Última revisão: parceria de carga oferecida para consentimento"
 bfl_streamline_bank: "Simplifique a administração · 100 ouro"
 bfl_streamline_bank_tip: "Pagar 100 declarar ouro uma vez para reduzir despesas operacionais fixas do banco em 10%. A reforma da carta, a Banca e a Compensação Avançada proporcionam reduções adicionais. Esta decisão não gera lucro bancário."
 bfl_subscribe_bank: "Inscrever-se 100 ouro do capital bancário"
 bfl_subscribe_bank_act: "$bfl_subscribe_bank$"
 bfl_subscribe_bank_desc: "Financiado com seu próprio tesouro após verificações de perfil, idade, pesquisa e registro. O principal não é o lucro do banco. Uma subscrição de capital bancário compra unidades pelo seu valor patrimonial líquido atual."
 bfl_subscribe_bank_effect_text: "$bfl_subscribe_bank$"
 bfl_subscribe_bank_effect_text_past: "$bfl_subscribe_bank$"
 bfl_suspend_command: "Suspender novos depósitos"
 bfl_suspend_command_tip: "#T Suspender novos depósitos#!\nPare de aceitar novos depósitos e ações de financiamento que exigem aceitação de depósitos. As contas existentes, as obrigações de juros e os pedidos de levantamento permanecem registados. Esse controle não fecha o banco nem perdoa suas dívidas."
 bfl_term_accept: "Aceite estes termos fixos"
 bfl_term_decline: "Manter a conta existente"
 bfl_term_deposit: "Depósito a Prazo"
 bfl_term_deposits_desc: "Os comerciantes nem sempre podem empregar o seu dinheiro de uma só vez. Ao confiá-lo a uma casa bancária por um prazo acordado, dão ao banqueiro uma fonte mais estável de capital e recebem uma compensação por abrir mão do acesso imediato aos seus fundos."
 bfl_term_offer_1_desc: "Renove seu amadurecimento [ROOT.GetCountry.MakeScope.GetVariable('bfl_deposit_offer_principal').GetValue|2] principal ouro para 12 meses em [ROOT.GetCountry.MakeScope.GetVariable('bfl_deposit_offer_rate').GetValue|%1] anualmente. Os juros acumulados permanecem devidos separadamente. Nenhum novo principal é transferido. Esta oferta expira no final do mês; reivindicações alteradas exigem uma nova oferta."
 bfl_term_offer_1_title: "Renovar depósito a prazo vencido"
 bfl_term_offer_2_desc: "Enfileirar uma retirada antecipada de [ROOT.GetCountry.MakeScope.GetVariable('bfl_deposit_offer_principal').GetValue|2] principal ouro após cancelamento [ROOT.GetCountry.MakeScope.GetVariable('bfl_deposit_offer_penalty').GetValue|2] ouro com juros acumulados (no máximo 1% do principal). Nenhuma penalidade principal se aplica. A falta de dinheiro permanece na fila de saque. Esta oferta expira no final do mês; reivindicações alteradas exigem uma nova oferta."
 bfl_term_offer_2_title: "Oferta de saque antecipado"
 bfl_term_service_1: "Renovar a primeira conta a prazo vencida"
 bfl_term_service_1_act: "$bfl_term_service_1$"
 bfl_term_service_1_desc: "Solicite uma oferta de serviço por prazo no banco selecionado. A aceitação preserva os sinistros não pagos e verifica novamente a geração do lote."
 bfl_term_service_1_effect_text: "$bfl_term_service_1$"
 bfl_term_service_1_effect_text_past: "$bfl_term_service_1$"
 bfl_term_service_1_tip: "Seleciona seu primeiro lote a prazo elegível. O banco apresenta prazos fixos para aceitação explícita. A renovação requer admissão atual e permissões de prazo; a saída antecipada e a retirada amadurecida permanecem disponíveis após relações ou perda de autoridade. Cotações alteradas ou expiradas não podem ser executadas."
 bfl_term_service_2: "Solicitar saque antecipado"
