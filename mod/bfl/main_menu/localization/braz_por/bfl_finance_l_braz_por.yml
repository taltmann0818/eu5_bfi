 AM_bfl_chartered_bank: "Banco fretado"
 LEAD_bfl_chartered_bank: "Controlador do Chartered Bank"
 MODIFIER_TYPE_DESC_bfl_enable_advanced_clearing: "Desbloqueia a liquidação líquida de obrigações recíprocas verificadas entre as instituições participantes. A compensação deve preservar os direitos de cada detentor e liquidar o saldo líquido financiado sem criar dinheiro. A liquidação interbancária nativa permanece indisponível."
 MODIFIER_TYPE_DESC_bfl_enable_bank_capital_subscriptions: "Permite assinaturas primárias de 100 ouro em um banco. As novas unidades de propriedade são avaliadas pelo valor patrimonial líquido atual. O produto da subscrição aumenta o capital integralizado em vez do lucro realizado e compra um direito proporcional nas distribuições subsequentes."
 MODIFIER_TYPE_DESC_bfl_enable_bank_share_dealing: "Permite que o serviço de transferência de ações bancárias mova unidades registradas existentes entre titulares identificados. Uma transferência altera a propriedade sem emitir novas unidades ou gerar lucro bancário. O registro deve ter capacidade e preservar a titularidade de cada titular."
 MODIFIER_TYPE_DESC_bfl_enable_collateralization: "Desbloqueia promessas de garantia registradas e suas verificações de elegibilidade. Os activos onerados não podem garantir um segundo crédito e a recuperação deve preservar a relação de dívida original. A execução de garantias nativas permanece indisponível."
 MODIFIER_TYPE_DESC_bfl_enable_commenda: "Desbloqueia o mandato de parceria para viagens de investimento no exterior. Cada empreendimento requer um parceiro identificado, capital financiado, um acordo de participação nos lucros registrado e liquidação dos rendimentos realizados. A execução do projeto permanece indisponível nesta versão de desenvolvimento."
 MODIFIER_TYPE_DESC_bfl_enable_commercial_bills: "Permite contas de pagamento totalmente financiadas. O comprador paga 100 ouro antes da emissão; o banco registra um compromisso de caixa e contas a pagar iguais. O titular indicado poderá resgatar a letra após um mês, apenas uma vez. A emissão não é lucro."
 MODIFIER_TYPE_DESC_bfl_enable_commodity_forwards: "Desbloqueia contratos de entrega futura do Merchant Finance. Cada contrato deve registrar sua contraparte, mercadorias, quantidade, data de entrega e suporte, sem reutilizar estoques onerados. A execução de negociação nativa permanece indisponível."
 MODIFIER_TYPE_DESC_bfl_enable_commodity_investments: "Desbloqueia o mandato de inventário do Merchant Finance. As posições de commodities devem representar participações de bens locais financiadas e preservar o custo de aquisição, quantidade e custódia. A execução de negociação permanece indisponível nesta versão de desenvolvimento."
 MODIFIER_TYPE_DESC_bfl_enable_company_equity: "Desbloqueia o mandato de capital de empresa de investimento estrangeiro. As participações financeiras são registradas separadamente do controle político. Apenas as distribuições verificadas da empresa podem tornar-se receitas bancárias; estão excluídas subscrições e devoluções de capital. A execução nativa permanece indisponível."
 MODIFIER_TYPE_DESC_bfl_enable_corporate_credit: "Desbloqueia o mandato de crédito corporativo do Merchant Finance. Os empréstimos devem transferir dinheiro bancário para uma empresa identificada e criar um crédito recuperável igual; os reembolsos do principal não entram nos lucros. A execução nativa permanece indisponível."
 MODIFIER_TYPE_DESC_bfl_enable_debt_restructuring: "Desbloqueia o mandato de reestruturação soberana. O vencimento, os juros e o principal revisados ​​devem ser anexados ao crédito existente, com o acordo do devedor. A execução permanece indisponível até que a reconciliação da dívida nativa seja apoiada."
 MODIFIER_TYPE_DESC_bfl_enable_liquidity_facilities: "Desbloqueia liquidez temporária garantida. O financiamento deve provir de uma contraparte real, permanecer dentro dos limites de caixa e de capital e ter garantias registradas. As retiradas na fila mantêm a prioridade. A execução da instalação nativa permanece indisponível."
 MODIFIER_TYPE_DESC_bfl_enable_margining_and_risk_management: "Desbloqueia requisitos de margem para posições a termo do Merchant Finance. A exposição deve ser medida em relação às garantias e ao dinheiro disponíveis, sendo necessário financiamento adicional antes que os compromissos aumentem. A negociação nativa e a execução de margens permanecem indisponíveis."
 MODIFIER_TYPE_DESC_bfl_enable_project_security: "Desbloqueia a segurança para projetos de investimento no exterior. Os activos e receitas do projecto identificados devem ser penhorados numa única obrigação registada, com prioridade preservada através de liquidação ou recuperação. A execução do projeto nativo permanece indisponível."
 MODIFIER_TYPE_DESC_bfl_enable_public_financial_backstops: "Desbloqueia o mandato de apoio público para um banco licenciado autorizado. A assistência requer uma contribuição real do tesouro e créditos ou unidades de propriedade registadas; as garantias não podem cunhar dinheiro ou apagar perdas. A execução permanente do backstop ainda não foi implementada."
 MODIFIER_TYPE_DESC_bfl_enable_sovereign_banknotes: "Desbloqueia a emissão de notas soberanas para um banco credenciado autorizado. As notas são passivos resgatáveis; o apoio exclui o dinheiro arrecadado com a venda das próprias notas. A emissão nativa e o roteamento de pagamento ao titular permanecem indisponíveis."
 MODIFIER_TYPE_DESC_bfl_enable_term_deposits: "Permite depósitos a taxas fixas de 100 ouro com vencimento em doze meses. Os juros são acumulados mensalmente à taxa aceita no momento da abertura da conta; o principal imaturo não pode ser retirado. Os depósitos continuam sendo passivos do banco."
 MODIFIER_TYPE_DESC_bfl_enable_warehouse_receipts: "Desbloqueia recibos do Merchant Finance respaldados por lotes de estoque identificados. Cada recibo reserva dez unidades livres e cobra uma taxa de custódia financiada. A custódia de bens nativos deve ser apoiada antes que novos recibos possam ser emitidos."
 MODIFIER_TYPE_DESC_bfl_no_automatic_tribute_cost_modifier: "A relação de afretamento não possui tributo automático. A receita do Estado provém de juros de depósitos e dividendos sobre ações bancárias detidas."
