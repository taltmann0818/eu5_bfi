 bfl_portfolio_history_axis: "Do mais antigo para o mais recente · até 12 observações mensais"
 bfl_portfolio_history_empty: "A história começa no próximo fechamento mensal do banco."
 bfl_portfolio_history_flows: "O valor inclui compras e vendas; este não é um índice de retorno de investimento."
 bfl_portfolio_history_title: "Valor do portfólio ao longo do tempo"
 bfl_portfolio_owner_note: "As participações do Tesouro e dos bancos têm proprietários separados. Passe o mouse sobre uma entidade para ver suas finanças."
 bfl_portfolio_total_heading: "Valor patrimonial atual"
 bfl_portfolio_treasury_heading: "Participações do tesouro soberano"
 bfl_prepare_bond_panel: "Títulos soberanos"
 bfl_prepare_bond_panel_tip: "Visualize o financiamento estadual e as reivindicações existentes em Crédito."
 bfl_probe_P11: "Portão de desenvolvimento: P11 deve ser medido no jogo antes que este adaptador possa ser executado."
 bfl_profile_0: "Escolha uma especialização"
 bfl_profile_1: "Finanças Comerciais"
 bfl_profile_2: "Investimento no exterior"
 bfl_project_security: "Segurança do Projeto"
 bfl_project_security_desc: "As empresas distantes são difíceis de supervisionar pelos seus financiadores. Os direitos sobre os seus activos e rendimentos, estabelecidos antes do adiantamento do capital, proporcionam aos investidores um meio de proteger os seus interesses quando um empreendimento se desvia."
 bfl_project_security_tip: "#T Segurança do projeto#!\nProteja um empreendimento contra reivindicações de projeto identificáveis. Requer pesquisa de Segurança do Projeto, Investimento no Exterior e a era do Absolutismo ou posterior. A execução colateral do projeto nativo não está disponível nesta compilação."
 bfl_protected_label: "Dinheiro protegido"
 bfl_public_backstop: "Backstop público"
 bfl_public_backstop_tip: "#T Suporte público seguro#!\nRevoluções, Backstops Financeiros Públicos e uma carta viva com um Banco Central concluído na capital soberana. Aceito explicitamente 75-os adiantamentos de ouro utilizam o dinheiro livre do próprio banco público, um 25% corte de cabelo da conta e pelo menos 9% juros anuais. Sem recapitalização gratuita."
 bfl_public_financial_backstops: "Apoios Financeiros Públicos"
 bfl_public_financial_backstops_desc: "Quando a falência de uma grande casa bancária ameaça o crédito público e o comércio, o governo pode intervir. Esse apoio vincula os recursos do tesouro à recuperação do banco e torna os termos da assistência uma questão de política pública."
 bfl_purchase_funded_bill: "Compre uma fatura de pagamento financiada"
 bfl_purchase_funded_bill_act: "$bfl_purchase_funded_bill$"
 bfl_purchase_funded_bill_desc: "Financiado com seu próprio tesouro após verificações de perfil, idade, pesquisa e registro. O principal não é o lucro do banco. Uma subscrição de capital bancário compra unidades pelo seu valor patrimonial líquido atual."
 bfl_purchase_funded_bill_effect_text: "$bfl_purchase_funded_bill$"
 bfl_purchase_funded_bill_effect_text_past: "$bfl_purchase_funded_bill$"
 bfl_purchase_native_loan: "Banco: comprar empréstimo imobiliário local"
 bfl_purchase_native_loan_act: "$bfl_purchase_native_loan$"
 bfl_purchase_native_loan_desc: "Seu banco é o comprador. Aplicam-se o preço nativo e a elegibilidade, com dinheiro adicional gratuito e cheques de capital. As propriedades bancárias recebem o preço de compra e o mesmo empréstimo muda de proprietário. Estão excluídos títulos e empréstimos já detidos pelo país."
 bfl_purchase_native_loan_effect_text: "$bfl_purchase_native_loan$"
 bfl_purchase_native_loan_effect_text_past: "$bfl_purchase_native_loan$"
 bfl_purchase_native_loan_tip: "#T Assumir empréstimo para o banco#!\nSelecione outro soberano com dívida imobiliária elegível. Seu banco credenciado paga o preço de compra nativo às propriedades bancárias daquele país e se torna o credor do mesmo empréstimo. O principal e os juros a receber pertencem ao banco; o soberano obtém rendimentos de empréstimos através dos dividendos das suas ações. Os bancos também adquirem um empréstimo elegível de forma autónoma todos os meses, quando as reservas e o capital o permitem. Estão excluídos títulos e empréstimos já detidos pelo país."
 bfl_rate_0: "Sem juros de demanda para novas contas"
 bfl_rate_0_short: "0%"
 bfl_rate_0_tip: "Oferta 0% juros anuais sobre novos depósitos à vista. As contas à vista existentes e a taxa da conta a prazo separada permanecem com as taxas aceitas."
 bfl_rate_1: "1% taxa anual de demanda por novas contas"
 bfl_rate_1_short: "1%"
 bfl_rate_1_tip: "Oferta 1% juros anuais sobre novos depósitos à vista. Os juros são creditados mensalmente com cent carry. As contas à vista existentes mantêm as taxas aceitas."
 bfl_rate_2: "2% taxa anual de demanda por novas contas"
 bfl_rate_2_short: "2%"
 bfl_rate_2_tip: "Oferta 2% juros anuais sobre novos depósitos à vista. Os juros são creditados mensalmente com cent carry. As contas à vista existentes mantêm as taxas aceitas."
 bfl_recapitalize_command: "Recapitalizar com 100 ouro"
 bfl_recapitalize_command_tip: "Pagar 100 ouro do tesouro do seu país como capital bancário. Requer 100 ouro e um lance de revenda do revendedor não superior ao NAV tangível; o capital faz uma pausa durante um prêmio de mercado maior para evitar um lucro de revenda imediato. O resgate financiado com NAV zero ou negativo permanece disponível."
 bfl_redeem_bond: "Resgatar"
 bfl_redeem_bond_01_tip: "Pague o valor nominal mais todos os cupons acumulados ao titular atual. Uma escassez deixa todo o título pendente. O resgate encerra a reivindicação uma vez; os laços nativos não são afetados."
