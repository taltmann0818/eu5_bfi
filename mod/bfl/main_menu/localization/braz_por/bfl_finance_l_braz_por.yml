 bfl_chart_equity_12: "Patrimônio líquido: [Country.MakeScope.GetVariable('bfl_history_equity_12').GetValue|2]@gold! · mês contábil [Country.MakeScope.GetVariable('bfl_history_period_12').GetValue|0]"
 bfl_charter_begin_tip: "Abra o seletor do State Bank elegível. Nenhum dinheiro ou pesquisa será alterado até que um banco seja selecionado; Cancelar deixa ambos os tesouros inalterados."
 bfl_charter_selection_tip: "Transferência [ROOT.GetCountry.MakeScope.ScriptValue('bfl_charter_investment')|0]@gold! ao banco selecionado como novo capital estatal. Preservar o seu país, edifícios, reivindicações e obrigações existentes, depois escolher a sua especialização permanente."
 bfl_chartered_bank: "Banco fretado"
 bfl_chartered_bank_desc: "Um Banco Estatal baseado em edifício foi fundado. O seu dinheiro e obrigações permanecem separados do seu soberano. Nenhum tributo automático é recolhido."
 bfl_clearing: "Limpeza"
 bfl_clearing_tip: "#T Compensação avançada#!\nRevolutions, Advanced Clearing e pesquisa nativa da Clearing House. Uma Câmara de Compensação própria e concluída e a admissão explícita de membros permitem a liquidação líquida atômica de contas vencidas correspondentes. Um membro curto bloqueia o lote e preserva todas as declarações."
 bfl_clergy_estate_workout_mandate: "Mandato de treino imobiliário"
 bfl_clergy_estate_workout_mandate_desc: "Esta propriedade autoriza explicitamente o seu governo a rever as negociações de depósitos bancários voluntários em seu nome. Cada proposta ainda precisa de aceitação separada. A revogação deste privilégio invalida os termos de propriedade pendentes. Os pagamentos de recuperação continuam na carteira do patrimônio."
 bfl_close_bank_offering: "Fechar oferta de ações"
 bfl_close_bank_offering_tip: "Pare de aceitar assinaturas externas. Os direitos de propriedade e dividendos existentes permanecem em vigor. O soberano ainda pode recapitalizar o seu próprio banco."
 bfl_close_bond_offer: "Fechar oferta de títulos"
 bfl_close_bond_offer_tip: "Retirar a oferta secundária atual. Dívidas pendentes e cupons permanecem devidos."
 bfl_collateral: "Garantia"
 bfl_collateralization: "Garantia"
 bfl_collateralization_desc: "A confiança é fortalecida quando uma promessa é apoiada por propriedades. Ao registar um penhor e os direitos do credor sobre ele, os banqueiros podem emprestar contra activos que podem ser recuperados se o devedor não honrar o acordo."
 bfl_commenda: "Comenda"
 bfl_commenda_available_color: "green"
 bfl_commenda_available_icon: "@bfl_commenda_opportunity!"
 bfl_commenda_available_left_click: "Revise esta operação"
 bfl_commenda_available_name: "Comenda disponível para financiar"
 bfl_commenda_available_tooltip: "[GetPlayer.MakeScope.GetVariable('bfl_op_country').GetCountry.GetName] · 10 [GetPlayer.MakeScope.GetVariable('bfl_op_good').Goods.GetNameWithNoTooltip]\n[GetPlayer.MakeScope.GetVariable('bfl_op_from').GetMarket.GetName] → [GetPlayer.MakeScope.GetVariable('bfl_op_to').GetMarket.GetName]\nCusto bancário estimado: [GetPlayer.MakeScope.GetVariable('bfl_op_cost').GetValue|2]@gold!\nSuperávit bancário indicativo: +[GetPlayer.MakeScope.GetVariable('bfl_op_surplus').GetValue|2]@gold!\n\nCotações atuais de mercado para uma operação de carga de dois meses; o excedente exclui o capital recuperado. Preços e acesso podem mudar. O capital e os retornos estão em risco. Somente a venda efetiva desta carga paga o acordo. A operadora deve aceitar. As oportunidades são atualizadas mensalmente e verificadas novamente antes de uma oferta ser enviada."
 bfl_commenda_cargo: "Commenda: navio de carga na área descoberta"
 bfl_commenda_cargo_act: "Carga da área descoberta do navio"
 bfl_commenda_cargo_desc: "Selecione o operador patrocinado e uma carga de dez unidades de um mercado centrado ou limítrofe à sua área descoberta. Somente o financiamento aceito não utilizado pode pagar seu custo de compra local. Nenhum pagamento de descoberta ou atribuição comercial não relacionada."
 bfl_commenda_cargo_effect_text: "Carga da área descoberta do navio"
 bfl_commenda_cargo_effect_text_past: "Carga da área descoberta do navio"
 bfl_commenda_cargo_tip: "Requer descoberta verificada da expedição aceita, autorização restante, acesso ao mercado local e estoque. Operador ou controlador político comanda a viagem."
 bfl_commenda_desc: "Um comerciante que empreende uma viagem pode possuir a habilidade de negociar sem capital para encher um navio. A comenda une o dinheiro de um financiador ao trabalho de um companheiro de viagem, dividindo os lucros do empreendimento conforme seu acordo."
 bfl_commenda_expedition: "Financie uma expedição nomeada"
 bfl_commenda_expedition_act: "Financie uma expedição nomeada"
 bfl_commenda_expedition_desc: "Escolha um operador, seu porto de lançamento, uma área marítima desconhecida e um explorador. Os alvos marítimos devem estar dentro do alcance naval do operador; empresas sem terra usam a gama de instalações próprias selecionadas. A aceitação financia a preparação nativa nos termos propostos. O banco não ganha controle político."
 bfl_commenda_expedition_effect_text: "Financie uma expedição nomeada"
 bfl_commenda_expedition_effect_text_past: "Financie uma expedição nomeada"
 bfl_commenda_expedition_tip: "Escolha um operador, área, porto de lançamento e explorador antes do consentimento. O financiamento paga apenas o custo real de preparação nativa. A preparação não é reembolsável. A autorização restante poderá financiar carga proveniente de mercado centrado ou limítrofe à área descoberta; apenas o produto da venda medido pode pagar retornos."
 bfl_commenda_opportunity_consent: "Verifique novamente esta carga nomeada e sua autoridade de financiamento ativa. Envie uma oferta usando seus Termos atuais; nenhum dinheiro se move até que o operador aceite."
 bfl_commenda_opportunity_later: "Considere mais tarde"
 bfl_commenda_opportunity_propose: "Envie estes termos para a operadora"
 bfl_commenda_opportunity_review: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_op_country').GetCountry.GetName] · 10 [ROOT.GetCountry.MakeScope.GetVariable('bfl_op_good').Goods.GetNameWithNoTooltip]\n[ROOT.GetCountry.MakeScope.GetVariable('bfl_op_from').GetMarket.GetName] → [ROOT.GetCountry.MakeScope.GetVariable('bfl_op_to').GetMarket.GetName]\nCusto bancário estimado: [ROOT.GetCountry.MakeScope.GetVariable('bfl_op_cost').GetValue|2]@gold!\nSuperávit bancário indicativo: +[ROOT.GetCountry.MakeScope.GetVariable('bfl_op_surplus').GetValue|2]@gold!\n\nCotações atuais de mercado para uma operação de carga de dois meses; o excedente exclui o capital recuperado. Preços e acesso podem mudar. O capital e os retornos estão em risco. Somente a venda efetiva desta carga paga o acordo. A operadora deve aceitar. As oportunidades são atualizadas mensalmente e verificadas novamente antes de uma oferta ser enviada."
 bfl_commenda_tip: "#T Comenda#!\nComprometa capital em uma viagem ou empreendimento comercial em troca de uma participação definida nos lucros. Requer pesquisa Commenda, investimento no exterior e idade de descoberta ou posterior. A execução do projeto nativo não está disponível nesta compilação."
 bfl_commercial_bill: "Conta Comercial"
 bfl_commercial_bills: "Contas Comerciais"
 bfl_commercial_bills_desc: "Transportar moedas entre centros comerciais é caro e perigoso. As faturas escritas permitem que os comerciantes liquidem obrigações através de bancos de confiança, tornando a reputação do emissor um instrumento de comércio."
 bfl_commodity_forward: "Avanço de commodities"
 bfl_commodity_forward_tip: "#T Commodity forward#!\nCombine uma entrega futura de mercadorias financiada. Requer pesquisa de Commodity Forwards, Merchant Finance e a era do Absolutismo ou posterior. A entrega física e a liquidação não estão disponíveis nesta versão."
 bfl_commodity_forwards: "Encaminhamentos de commodities"
 bfl_commodity_forwards_desc: "Uma encomenda de colheita, carregamento ou oficina poderá ser vendida antes da sua entrega. Os acordos que fixam um preço futuro ajudam os comerciantes a organizar os seus negócios, apesar da incerteza dos mercados distantes e das mudanças das estações."
 bfl_commodity_inventory: "Inventário de mercadorias"
 bfl_commodity_inventory_tip: "#T Inventário de mercadorias#!\nBens financeiros mantidos para comércio. Requer pesquisa de investimentos em commodities, financiamento mercantil e era da descoberta ou posterior. A compra, custódia e entrega de bens físicos não estão disponíveis nesta versão."
 bfl_commodity_investments: "Investimentos em commodities"
 bfl_commodity_investments_desc: "Os banqueiros que financiam o comércio também podem deter eles próprios os bens. Os cereais, a lã e outras mercadorias tornam-se investimentos cujo valor depende do armazenamento, do transporte e da evolução das necessidades dos mercados distantes."
 bfl_company_crew: "Transferência 250 marinheiros para companhia"
 bfl_company_crew_desc: "Gerencie uma empresa nativa que você controla atualmente. O capital financiado é excluído do resultado operacional."
 bfl_company_crew_tip: "Gerencie uma empresa nativa que você controla atualmente. As contribuições de capital são financiamento. As distribuições da empresa utilizam lucros comerciais retidos após custos nativos, perdas transportadas, reservas de dívida e reservas de caixa. O senhor político e o proprietário financeiro são separados."
 bfl_company_equity: "Patrimônio da empresa"
 bfl_company_equity_desc: "As grandes empresas comerciais exigem fortunas que poucos comerciantes conseguem fornecer sozinhos. A divisão da propriedade entre investidores permite que uma empresa reúna capital duradouro ao mesmo tempo que distribui os riscos e recompensas dos seus empreendimentos."
 bfl_company_equity_tip: "#T Patrimônio da empresa#!\nSubscrever capital para uma participação acionária em uma empresa reconhecida. Requer pesquisa de patrimônio da empresa, investimento no exterior e era da Reforma ou posterior. A emissão da empresa nativa e a liquidação do titular não estão disponíveis nesta versão."
 bfl_company_expedition: "Empresa: prepare a exploração nativa"
 bfl_company_expedition_desc: "Use o tesouro da empresa, os marinheiros e o explorador para preparar uma exploração marítima nas instalações da empresa. Aplicam-se preparação e progresso nativos. A Discovery não produz dinheiro ou lucro de investimento."
 bfl_company_expedition_tip: "Requer um mandato comercial e de exploração, cartografia, um explorador de empresa elegível, marinheiros e orçamento de empreendimento disponível. Aplica-se o tempo de preparação nativo."
 bfl_company_exploration_capacity: "Estabelecimento de exploração da empresa"
 bfl_company_exploration_capacity_desc: "Capacidade para 500 marinheiros enquanto um mandato de exploração for autorizado. Os marinheiros devem vir da empresa ou de uma transferência financiada de seu controlador político."
 bfl_company_explore: "Mandato da empresa: comércio e exploração"
 bfl_company_explore_desc: "Gerencie uma empresa nativa que você controla atualmente. O capital financiado é excluído do resultado operacional."
 bfl_company_explore_tip: "Gerencie uma empresa nativa que você controla atualmente. As contribuições de capital são financiamento. As distribuições da empresa utilizam lucros comerciais retidos após custos nativos, perdas transportadas, reservas de dívida e reservas de caixa. O senhor político e o proprietário financeiro são separados."
 bfl_company_fund: "Contribua 100 ouro para capital da empresa"
 bfl_company_fund_desc: "Gerencie uma empresa nativa que você controla atualmente. O capital financiado é excluído do resultado operacional."
 bfl_company_fund_tip: "Gerencie uma empresa nativa que você controla atualmente. As contribuições de capital são financiamento. As distribuições da empresa utilizam lucros comerciais retidos após custos nativos, perdas transportadas, reservas de dívida e reservas de caixa. O senhor político e o proprietário financeiro são separados."
 bfl_company_list_equity: "Autorizar listagem de ações da empresa"
 bfl_company_list_equity_desc: "Autorizar assinaturas primárias pagas de NAV e negociações secundárias. As aquisições bancárias exigem investimento no exterior, pesquisa de patrimônio da empresa e a troca concluída para negociações secundárias. A soberania política permanece inalterada."
 bfl_company_list_equity_tip: "O controlador político ao vivo autoriza a participação no mercado. Nenhum dinheiro ou unidades são concedidos."
 bfl_company_native_channels: "A renda da sede nativa e os pagamentos das disciplinas permanecem no orçamento nativo. Os mercados de ações de empresas, o crédito corporativo bancário e as comendas usam suas portas separadas de pesquisa e entrega."
 bfl_company_panel: "Empresas operacionais"
 bfl_company_panel_tip: "Os tesouros das empresas e o controlo político permanecem separados das contas bancárias. A renda do proprietário do QG nativo, a renda do senhor direto do QG e os pagamentos dos súditos nativos permanecem com seus destinatários nativos. Somente o comércio retido executado, líquido dos custos nativos, pode financiar uma distribuição adicional do proprietário. Capital e descoberta estão excluídos."
 bfl_company_retain: "Mandato da empresa: reter lucros"
 bfl_company_retain_desc: "Gerencie uma empresa nativa que você controla atualmente. O capital financiado é excluído do resultado operacional."
 bfl_company_retain_tip: "Gerencie uma empresa nativa que você controla atualmente. As contribuições de capital são financiamento. As distribuições da empresa utilizam lucros comerciais retidos após custos nativos, perdas transportadas, reservas de dívida e reservas de caixa. O senhor político e o proprietário financeiro são separados."
 bfl_company_route: "Empresa: abre rota comercial nativa"
 bfl_company_route_desc: "Abra uma rota nativa de propriedade da empresa usando 0.1 capacidade mercantil. Requer um mandato comercial, orçamento operacional disponível, acesso ao mercado nativo, excedente e capacidade. Máximo de uma rota comandada por empresa por mês. A IA nativa mantém seu próprio comportamento comercial."
 bfl_company_route_tip: "Selecione a empresa, o mercado de origem, o mercado de destino, o mercado comercial e as mercadorias. Os custos de comércio nativo são cobrados pelo motor."
 bfl_company_select: "Selecione a empresa operadora"
 bfl_company_select_desc: "Inspecione uma empresa nativa sob seu controle político atual."
 bfl_company_select_tip: "Selecione uma empresa nativa que você controla atualmente. A seleção e exibição do extrato não movimentam dinheiro nem fecham mês."
 bfl_company_statement: "Dinheiro: [Country.GetFixedPointCurrencyValue('gold')|2]@gold!   Buffer reservado: [Country.MakeScope.GetVariable('bfl_company_buffer').GetValue|2]@gold!\nComércio nativo: [Country.MakeScope.GetVariable('bfl_company_trade_receipts').GetValue|2]   Orçamento líquido: [Country.MakeScope.GetVariable('bfl_company_native_net').GetValue|2]\nGanhos elegíveis: [Country.MakeScope.GetVariable('bfl_company_verified_profit').GetValue|2]   Pago ao proprietário: [Country.MakeScope.GetVariable('bfl_company_dividend').GetValue|2]@gold!\nInstalações: [Country.MakeScope.GetVariable('bfl_company_facility_count').GetValue|0]   Rotas: [Country.MakeScope.GetVariable('bfl_company_route_count').GetValue|0]   Volume executado: [Country.MakeScope.GetVariable('bfl_company_volume').GetValue|2]\nOrçamento comercial: 50   Reserva de reinvestimento: 100   Orçamento de risco: 100   Pagamento do proprietário: 25%"
 bfl_company_strategy_construction: "Reinvestir as reservas da empresa em um sistema comercial nativo"
 bfl_company_trade: "Mandato da empresa: comércio"
 bfl_company_trade_desc: "Gerencie uma empresa nativa que você controla atualmente. O capital financiado é excluído do resultado operacional."
 bfl_company_trade_tip: "Gerencie uma empresa nativa que você controla atualmente. As contribuições de capital são financiamento. As distribuições da empresa utilizam lucros comerciais retidos após custos nativos, perdas transportadas, reservas de dívida e reservas de caixa. O senhor político e o proprietário financeiro são separados."
 bfl_corporate_credit: "Crédito Corporativo"
 bfl_corporate_credit_desc: "À medida que as empresas comerciais superam uma única viagem ou estação, a sua necessidade de crédito torna-se mais duradoura. As casas bancárias aprendem a avaliar os recursos e as perspectivas de uma empresa, bem como a posição dos seus comerciantes individuais."
 bfl_corporate_credit_tip: "#T Crédito corporativo#!\nEmpreste para uma empresa comercial reconhecida. Requer pesquisa de crédito corporativo, financiamento mercantil e era da Reforma ou posterior. A nova execução nativa de empréstimo da empresa não está disponível nesta versão."
 bfl_cost_accounts: "Contas de depósito: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_operating_accounts_count')|0] × 0.05"
 bfl_cost_asset_types: "Classes de ativos não monetários: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_operating_asset_types_count')|0] × 0.25"
 bfl_cost_base: "Administração básica"
 bfl_cost_branches: "Filiais: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_operating_branches_count')|0] × 0.50"
 bfl_cost_contracts: "Contratos financeiros personalizados: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_operating_contracts_count')|0] × 0.10"
 bfl_cost_current: "Custo mensal atual: #R [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_operating_expense')|2]@gold!#!"
 bfl_cost_payment_detail: "Os custos aumentam com a complexidade e não com o valor do ativo. Cobrado uma vez por mês acima das reservas protegidas; despesas não pagas restringem os dividendos. Os juros de depósito e as despesas nativas são separados. As reduções se somam; o total é arredondado para centavos."
 bfl_cost_reduction_administration: "Administração simplificada"
 bfl_cost_reduction_banking: "Bancário"
 bfl_cost_reduction_charter: "Banco fretado estadual"
 bfl_cost_reduction_clearing: "Compensação Avançada"
 bfl_cost_reductions: "Custo base [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_operating_complexity')|2]@gold! é reduzido em #G −[GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_operating_total_reduction')|%0]#! devido a:"
 bfl_cost_settlement_arrears: "Despesas não pagas"
 bfl_cost_settlement_due: "Despesa avaliada"
 bfl_cost_settlement_paid: "Dinheiro pago (incluindo atrasos)"
 bfl_cost_settlement_title: "Última liquidação mensal"
 bfl_cost_subtitle: "Administração bancária mensal"
 bfl_cost_title: "Despesas operacionais de [Country.GetName]"
 bfl_credit_1_desc: "Um banco oferece 100 ouro para 60 meses à taxa anual cotada. A aceitação verifica novamente o financiamento, autoridade, capacidade de endividamento e sua elegibilidade. O principal é financiamento, não receita.\nTaxa anual: [ROOT.GetCountry.MakeScope.GetVariable('bfl_credit_offer_rate').GetValue|%1]."
 bfl_credit_1_title: "Oferta de crédito"
 bfl_credit_2_desc: "Seu credor oferece um 20% redução do principal e uma redução da taxa anual de um ponto percentual (mínimo 1%). Isto altera apenas o empréstimo sem garantia existente. Sua maturidade permanece inalterada."
 bfl_credit_2_title: "Oferta de alívio da dívida"
 bfl_credit_accept: "Aceite os termos"
 bfl_credit_partial: "Em vez disso, pague 25% desta reivindicação, incluindo seu interesse remanescente nativo"
 bfl_credit_refinance: "Em vez disso, resolva esta reivindicação e refinancie seu principal para 60 meses"
 bfl_credit_reject: "Recusar"
