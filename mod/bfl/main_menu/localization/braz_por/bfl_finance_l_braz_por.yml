 bfl_banking_finance_companies__reduced_motion: "Movimento reduzido"
 bfl_banking_finance_companies__reduced_motion_desc: "Use avisos e recibos de transações estáticas. Desative para permitir destaques breves e únicos de transações após pagamentos confirmados; sem flashes financeiros em loop."
 bfl_banking_finance_companies__reduced_motion_name: "Movimento reduzido"
 bfl_banking_finance_companies_desc: "Apenas configurações de apresentação. A política da instituição é gerenciada na Economia."
