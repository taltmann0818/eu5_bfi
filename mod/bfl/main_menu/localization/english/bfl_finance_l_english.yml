 bfl_collateralization: "Collateralization"
 bfl_collateralization_desc: "Trust is strengthened when a promise is supported by property. By recording a pledge and the creditor's rights over it, bankers can lend against assets that may be recovered if the debtor fails to honor the agreement."
 bfl_commenda: "Commenda"
 bfl_commenda_desc: "A merchant undertaking a voyage may possess the skill to trade without the capital to fill a ship. The commenda joins a financier's money to a traveling partner's labor, sharing the venture's proceeds according to their agreement."
 bfl_commercial_bill: "Commercial Bill"
 bfl_commercial_bills: "Commercial Bills"
 bfl_commercial_bills_desc: "Carrying coin between commercial centers is costly and dangerous. Written bills allow merchants to settle obligations through trusted banking houses, making the reputation of the issuer an instrument of trade."
 bfl_commodity_forward: "Commodity Forward"
 bfl_commodity_forwards: "Commodity Forwards"
 bfl_commodity_forwards_desc: "A harvest, shipment or workshop order may be sold before its delivery. Agreements that fix a future price help merchants arrange their affairs despite the uncertainty of distant markets and changing seasons."
 bfl_commodity_inventory: "Commodity Inventory"
 bfl_commodity_investments: "Commodity Investments"
 bfl_commodity_investments_desc: "Bankers who finance trade can also hold the goods themselves. Grain, wool and other merchandise become investments whose value depends upon storage, transport and the changing needs of distant markets."
 bfl_company_equity: "Company Equity"
 bfl_company_equity_desc: "Large trading enterprises require fortunes that few merchants can supply alone. Dividing ownership among investors allows a company to assemble lasting capital while distributing the risks and rewards of its undertakings."
 bfl_corporate_credit: "Corporate Credit"
 bfl_corporate_credit_desc: "As commercial enterprises outgrow a single voyage or season, their need for credit becomes more enduring. Banking houses learn to judge the resources and prospects of an enterprise as well as the standing of its individual merchants."
 bfl_debt: "Native debt portfolio"
