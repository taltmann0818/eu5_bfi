 bfl_cost_gross: "#T Cost before reductions#!"
 bfl_cost_net: "#T Monthly cost after reductions#!"
 bfl_cost_payment_detail: "Charged once per month from cash above protected reserves. Unpaid costs reduce earnings and restrict dividends. Deposit interest and native expenses are separate. Costs scale with complexity, not asset value."
 bfl_cost_reduction_administration: "Streamlined administration (10% if adopted)"
 bfl_cost_reduction_banking: "Banking (10% if researched)"
 bfl_cost_reduction_charter: "State charter (5% if valid)"
