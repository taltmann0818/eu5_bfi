 bfl_facility_1: "Debt first facility"
 bfl_facility_1_definition: "Expenses: borrow up to 60% of forecast state spending each month regardless of the state cash balance. Funding stops at the shared monthly limit, debt capacity and bank cash and capital limits."
 bfl_facility_1_short: "Expenses"
 bfl_facility_1_tip: "Request custom bond financing for 60% of forecast monthly spending, within a shared 1,000 gold monthly limit. Skip draws when state cash reaches 500 gold or the bank or issuer lacks capacity."
 bfl_facility_2: "Buffer facility"
