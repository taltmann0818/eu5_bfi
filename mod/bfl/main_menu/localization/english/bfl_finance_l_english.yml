 bfl_request_public_support_command: "$bfl_request_public_support$"
 bfl_request_public_support_command_desc: "$bfl_request_public_support_desc$"
 bfl_request_public_support_desc: "Request a 75-gold advance against your funded 100-gold third-bank bill. The live lender manager reviews the request; acceptance rechecks all parties and collateral. No Bank Branch is required between banks."
 bfl_request_public_support_effect_text: "$bfl_request_public_support$"
 bfl_request_public_support_effect_text_past: "$bfl_request_public_support$"
 bfl_request_public_support_tip: "Choose a chartered lender with Public Financial Backstops and its sovereign’s completed capital Central Bank. Its current manager must consent. The 75-gold secured advance uses bank cash and charges at least 9% annually; it creates no guarantee or recapitalization."
 bfl_reserves: "Reserved cash"
 bfl_reserves_tip: "Cash kept for deposits and promised payments."
 bfl_resolution_begin_command: "Begin resolution"
 bfl_resolution_begin_command_tip: "Orderly resolution freezes new commitments and distributions. Segregated monetary and custody reserves stay protected; deposits share available cash proportionately before expense arrears and equity. Missing creditors retain their claims. Voluntary terms require current creditor consent and Renaissance Debt Restructuring. A public guarantee covers 50% of accepted deposit losses, up to 100 gold in total, funded by its recorded sovereign; unpaid calls remain pending. Closure requires all obligations and non-cash assets cleared. Closed estates cannot reopen."
 bfl_resolution_call_command: "Pay pending guarantee"
 bfl_resolution_call_command_tip: "Orderly resolution freezes new commitments and distributions. Segregated monetary and custody reserves stay protected; deposits share available cash proportionately before expense arrears and equity. Missing creditors retain their claims. Voluntary terms require current creditor consent and Renaissance Debt Restructuring. A public guarantee covers 50% of accepted deposit losses, up to 100 gold in total, funded by its recorded sovereign; unpaid calls remain pending. Closure requires all obligations and non-cash assets cleared. Closed estates cannot reopen."
 bfl_resolution_close_command: "Close estate"
 bfl_resolution_close_command_tip: "Orderly resolution freezes new commitments and distributions. Segregated monetary and custody reserves stay protected; deposits share available cash proportionately before expense arrears and equity. Missing creditors retain their claims. Voluntary terms require current creditor consent and Renaissance Debt Restructuring. A public guarantee covers 50% of accepted deposit losses, up to 100 gold in total, funded by its recorded sovereign; unpaid calls remain pending. Closure requires all obligations and non-cash assets cleared. Closed estates cannot reopen."
 bfl_resolution_guarantee_command: "Authorize guarantee"
 bfl_resolution_guarantee_command_tip: "Orderly resolution freezes new commitments and distributions. Segregated monetary and custody reserves stay protected; deposits share available cash proportionately before expense arrears and equity. Missing creditors retain their claims. Voluntary terms require current creditor consent and Renaissance Debt Restructuring. A public guarantee covers 50% of accepted deposit losses, up to 100 gold in total, funded by its recorded sovereign; unpaid calls remain pending. Closure requires all obligations and non-cash assets cleared. Closed estates cannot reopen."
 bfl_resolution_heading: "Resolution & creditor recovery"
 bfl_resolution_heading_tip: "Persistent financial resolution; cash recoveries and consensual changes are recorded separately from earnings."
 bfl_resolution_help: "Secured and custody reserves → proportional deposits → expense arrears → residual shareholders. Claims survive shortfalls and loss of origination authority. Enter resolution before offering terms."
 bfl_resolution_liquidate_command: "Realize available assets"
 bfl_resolution_liquidate_command_tip: "Sell accessible unencumbered native inventory and collect matured deposits, bills and notes through their existing services. Actual receipts fund the recovery waterfall. Unavailable or immature positions stay recorded; no carrying value becomes gold."
 bfl_resolution_next_command: "Next deposit account"
 bfl_resolution_next_command_tip: "Cycle active deposit accounts. Estate creditors require their enacted Workout Mandate before their government may accept voluntary terms. Payments return to the recorded treasury or estate wallet."
 bfl_resolution_notice_acknowledge: "Acknowledge the final outcome"
 bfl_resolution_notice_desc: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_notice_bank').GetCountry.GetName] has closed its financial operations.\n\nDeposit recoveries paid: [ROOT.GetCountry.MakeScope.GetVariable('bfl_notice_bank').GetCountry.MakeScope.GetVariable('bfl_resolution_paid').GetValue|2]@gold!\nConsented deposit losses: [ROOT.GetCountry.MakeScope.GetVariable('bfl_notice_bank').GetCountry.MakeScope.GetVariable('bfl_resolution_waived').GetValue|2]@gold!\nRecorded statutory losses: [ROOT.GetCountry.MakeScope.GetVariable('bfl_notice_bank').GetCountry.MakeScope.GetVariable('bfl_resolution_statutory_loss').GetValue|2]@gold!\n\nRecorded losses are unpaid amounts, not recoveries or new income. Historical ownership and the final estate remain recorded; the closed institution cannot reopen."
 bfl_resolution_notice_title: "Bank resolution closed"
 bfl_resolution_offer_command: "Offer creditor terms"
 bfl_resolution_offer_command_tip: "Orderly resolution freezes new commitments and distributions. Segregated monetary and custody reserves stay protected; deposits share available cash proportionately before expense arrears and equity. Missing creditors retain their claims. Voluntary terms require current creditor consent and Renaissance Debt Restructuring. A public guarantee covers 50% of accepted deposit losses, up to 100 gold in total, funded by its recorded sovereign; unpaid calls remain pending. Closure requires all obligations and non-cash assets cleared. Closed estates cannot reopen."
 bfl_resolution_pay_command: "Pay recovery"
 bfl_resolution_pay_command_tip: "Orderly resolution freezes new commitments and distributions. Segregated monetary and custody reserves stay protected; deposits share available cash proportionately before expense arrears and equity. Missing creditors retain their claims. Voluntary terms require current creditor consent and Renaissance Debt Restructuring. A public guarantee covers 50% of accepted deposit losses, up to 100 gold in total, funded by its recorded sovereign; unpaid calls remain pending. Closure requires all obligations and non-cash assets cleared. Closed estates cannot reopen."
 bfl_resolution_resume_command: "Resume after recovery"
 bfl_resolution_resume_command_tip: "Orderly resolution freezes new commitments and distributions. Segregated monetary and custody reserves stay protected; deposits share available cash proportionately before expense arrears and equity. Missing creditors retain their claims. Voluntary terms require current creditor consent and Renaissance Debt Restructuring. A public guarantee covers 50% of accepted deposit losses, up to 100 gold in total, funded by its recorded sovereign; unpaid calls remain pending. Closure requires all obligations and non-cash assets cleared. Closed estates cannot reopen."
 bfl_review_trade: "Review trade"
 bfl_review_trade_tip: "Review the selected units and exact payment. A sale must round to at least 0.01 gold; increase the quantity if Review is unavailable. No diplomat is spent until a valid trade settles."
 bfl_riksbank_founding_tt: "Establish Sveriges Riksbank as our Chartered Bank, funded from available treasury cash up to the standard charter investment."
 bfl_riksbank_name: "Sveriges Riksbank"
 bfl_safeguards_title: "Liquidity & safeguards"
 bfl_safeguards_title_tip: "#T Liquidity and safeguards#!\nAvailable bank cash: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_free_cash')|2]@gold!\nProtected cash requirement: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_protected_cash')|2]@gold!\nQueued withdrawals: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_withdrawals_due')|2]@gold!\n\nRecapitalization supplies state capital. Suspending deposits stops new account funding while preserving existing obligations."
 bfl_sale_unavailable: "Share order could not settle"
 bfl_sale_unavailable_desc: "The issuer has a one-month trading cooldown, you lack a diplomat, your quote expired, or available shares, funds or exchange access changed. Reopen Buy or Sell shares for a fresh quote. No cash or shares moved."
 bfl_secured_liquidity: "Secured Liquidity"
 bfl_secured_liquidity_tip: "#T Secured liquidity#!\nAbsolutism, Collateralization and Liquidity Facilities. Advance 75 gold against a separately funded 100-gold third-bank bill. Collateral is locked once. The fixed accepted annual rate is divided by 12. No branch required between banks."
 bfl_security_bank_results: "Last bank close"
 bfl_security_financial_heading: "Tangible financial position"
 bfl_security_financial_subtitle: "What supports the share price"
 bfl_security_financial_title: "Equity of [Country.GetName]"
 bfl_security_price_heading: "Share price and ownership"
 bfl_security_price_math: "Market price = tangible NAV per share × the monthly market premium. Order pressure, volatility, mean reversion and distress can change that premium. Primary capital remains priced at NAV; unrealized gains do not fund lending or dividends."
 bfl_security_primary_note: "Dividends reduce cash and NAV once. New capital is priced at NAV and creates no buy-pressure signal. Subscriptions pause while the dealer resale bid exceeds NAV, preventing a guaranteed immediate profit. History contains actual observations; reloading does not reroll a saved monthly shock."
 bfl_select_buy_shares: "Buy bank & company shares"
 bfl_select_profile: "Choose pending specialization"
 bfl_select_profile_tip: "#T Bank specialization#!\nOpen the specialization choice if this bank has not yet chosen a permanent profile. Merchant Finance and Overseas Investment open different research paths. A completed specialization cannot be replaced by this button."
 bfl_select_sell_shares: "Sell shares you own"
 bfl_selector_next: "Next banks"
 bfl_selector_previous: "Previous banks"
 bfl_sell_confirm_desc: "Sell [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_quantity').GetValue|3] shares of [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_issuer').GetCountry.GetName] for [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_total').GetValue|2]@gold!. The hidden market maker guarantees this sale, including the quoted dealing spread, while the quote is valid. Shares leave your portfolio immediately; background AI purchases do not delay payment. Proceeds go to your bank’s treasury. Settlement consumes one diplomat and starts this issuer’s one-month buy/sell cooldown."
 bfl_sell_confirm_title: "Confirm instant share sale"
 bfl_sell_shares: "Sell shares"
 bfl_sell_shares_desc: "Choose one of your holdings and a quantity. The hidden market maker immediately buys your shares at the market quote less the displayed dealer spread. AI banks purchase its inventory in the background."
 bfl_sell_shares_tip: "Choose one of your holdings and a quantity. The hidden market maker immediately buys your shares at the market quote less the displayed dealer spread. AI banks purchase its inventory in the background.\nRequires a completed exchange, Share Dealing and at least one diplomat. Each successful trade consumes one diplomat and starts a one-month cooldown for that issuer. Available diplomats: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bfl_available_trade_diplomats')|2]. Orders must have a cash value of at least 0.01 gold."
 bfl_sell_state_confirm_desc: "Sell [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_quantity').GetValue|3] shares of your treasury’s stake in [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_issuer').GetCountry.GetName] for [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_total').GetValue|2]@gold!, paid to your country treasury. The bank receives no financing and issued shares do not change. The hidden dealer guarantees the displayed quote, including the quoted dealer spread. Settlement consumes one diplomat and starts a one-month buy/sell cooldown for this issuer. Your charter’s monetary authority stays with you."
