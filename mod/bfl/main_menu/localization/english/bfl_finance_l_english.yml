 bfl_cost_settlement_title: "Last monthly settlement"
 bfl_cost_subtitle: "Monthly bank administration"
 bfl_cost_title: "Operating expenses of [Country.GetName]"
 bfl_credit_1_desc: "A bank offers 100 gold for 60 months at the quoted annual rate. Acceptance rechecks funding, authority, debt capacity and your eligibility. Principal is financing, not income.\nAnnual rate: [ROOT.GetCountry.MakeScope.GetVariable('bfl_credit_offer_rate').GetValue|%1]."
 bfl_credit_1_title: "Credit offer"
 bfl_credit_2_desc: "Your lender offers a 20% principal reduction and a one percentage-point annual rate reduction (minimum 1%). This changes the existing unsecured loan only. Its maturity stays unchanged."
