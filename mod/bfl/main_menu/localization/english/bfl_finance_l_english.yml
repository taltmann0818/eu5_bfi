 bfl_bond_selected_name: "[Country.GetName]"
 bfl_bond_underwriting: "Bond Underwriting"
 bfl_bond_underwriting_tip: "#T Bond underwriting#!\nYour chartered bank pays actual cash for a custom sovereign bond. Both specializations can underwrite. Fixed annual coupons are paid monthly; the current holder receives face value on redemption. Issuance requires bank liquidity, capital and sovereign capacity."
 bfl_bond_unpaid: "Unpaid coupons"
 bfl_browse_bond_issuers: "Browse issuers & holdings"
 bfl_browse_bond_issuers_desc: "Choose an issuer to inspect outstanding bonds and offers, including claims held by your bank."
 bfl_browse_bond_issuers_tip: "Select a live issuer with outstanding custom bonds. This does not buy or sell anything."
 bfl_browse_goods: "Goods offers and custody claims"
 bfl_browse_goods_desc: "Review physical custody offers, existing claims or a voluntary Customs House access agreement. Selecting a country moves no money."
 bfl_buy_bill: "Funded payment bill · 100 gold"
 bfl_buy_bill_tip: "#T Funded payment bill#!\nTransfer 100 state gold to the bank for a funded payment bill. The bill is recorded as a payable, rather than bank profit or an unsecured loan. Requires Commercial Bills research, contract-table space and an operating bank accepting this business."
 bfl_buy_capital: "Subscribe capital · 100 gold"
 bfl_buy_capital_tip: "#T Subscribe bank capital#!\nTransfer 100 state gold to purchase new bank ownership units. Units are priced from positive bank equity per existing unit. This increases bank cash and paid-in capital, rather than profit. Unlocked by native Banking research, capital-table space and an operating bank accepting this business. Capital is exposed to losses and cannot be withdrawn as a deposit."
 bfl_buy_confirm_desc: "Purchase [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_quantity').GetValue|3] shares of [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_issuer').GetCountry.GetName] for [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_total').GetValue|2]@gold!. These are existing shares from market-maker inventory. The issuer receives no financing and issued shares do not change. The quoted price, live market access, available units, protected cash and concentration limit are checked again on acceptance. Settlement consumes one diplomat and starts this issuer’s one-month buy/sell cooldown."
 bfl_buy_confirm_title: "Confirm share purchase"
 bfl_buy_secondary_confirm_desc: "Buy [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_quantity').GetValue|3] existing shares of [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_issuer').GetCountry.GetName] from [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_seller').GetCountry.GetName] for [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_total').GetValue|2]@gold!. The current seller receives the payment. The issuer receives no financing and issued shares do not change. Availability, access, protected funds and this offer’s revision are checked again on acceptance. Settlement consumes one diplomat and starts this issuer’s one-month buy/sell cooldown."
 bfl_buy_selected_bond: "Buy existing claim"
 bfl_buy_selected_bond_tip: "Pay the quoted price to the current seller. The issuer receives no new money. Execution rechecks ownership, expiry, generation, both exchanges, arrears and cash."
 bfl_buy_shares: "Buy shares"
 bfl_buy_shares_desc: "Choose a bank or company, set a share quantity, then review the total. Buy transfers existing shares from a sell offer or market-maker inventory. Use the separate capital-subscription action to fund new issuance."
 bfl_buy_shares_tip: "Choose a bank or company, set a share quantity, then review the total. Buy transfers existing shares from a sell offer or market-maker inventory. Use the separate capital-subscription action to fund new issuance.\nRequires a completed exchange, Share Dealing and at least one diplomat. Each successful trade consumes one diplomat and starts a one-month cooldown for that issuer. Available diplomats: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bfl_available_trade_diplomats')|2]. Orders must have a cash value of at least 0.01 gold."
 bfl_buy_sovereign_bond: "Buy an offered sovereign bond"
 bfl_buy_sovereign_bond_desc: "Buy an existing sovereign bond from its current holder. Requires an owned completed Stock Exchange building."
 bfl_buy_sovereign_bond_tip: "Select the issuer of an open offering. Payment goes to the existing holder; the issuer receives no new proceeds. The whole claim changes hands with its fixed annual coupon and principal intact."
 bfl_buy_state_confirm_desc: "Buy back [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_quantity').GetValue|3] existing shares of [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_issuer').GetCountry.GetName] from market-maker inventory for [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_total').GetValue|2]@gold!, paid from your country treasury. These shares return to your treasury stake. The bank receives no financing and issued shares do not change. Available dealer stock, current market quote, live charter authority and treasury cash are checked again. Settlement consumes one diplomat and starts this bank’s one-month buy/sell cooldown."
 bfl_cancel: "Cancel"
 bfl_cancel_selected_bond_offer: "Cancel listing"
 bfl_cancel_selected_bond_offer_tip: "Withdraw an offering owned by you or your live chartered bank. The debt and coupon remain unchanged."
 bfl_capital_button: "Subscribe capital · 100 gold"
 bfl_cash: "Treasury cash"
 bfl_cash_tip: "#T Treasury cash#!\nGold currently held by the bank.\n\nTotal cash: [Country.GetFixedPointCurrencyValue('gold')|2]@gold!\nProtected cash: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_protected_cash')|2]@gold!\nAvailable cash: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_free_cash')|2]@gold!\n\nProtected cash reserves 25% of liabilities remaining after queued withdrawals, the full withdrawal queue, a 25 gold operating buffer and committed cash. Available cash is treasury cash less that reserve, with a minimum of zero. Protected cash is a required reserve; it can exceed the cash actually held."
