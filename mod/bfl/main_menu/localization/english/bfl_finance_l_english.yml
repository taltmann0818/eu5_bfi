 bfl_goods_quote_desc: "Quantity: [ROOT.GetCountry.MakeScope.GetVariable('bfl_goods_quote_quantity').GetValue|3]. Price: [ROOT.GetCountry.MakeScope.GetVariable('bfl_goods_quote_price').GetValue|2] gold plus 1 gold custody fee. A warehouse receipt owns the goods immediately. A physical forward fully prefunds delivery in three months. Both require backed goods. Storage costs 0.1 per month; physical loss is 2% yearly. A forward keeps its fixed quantity: missing units refund pro rata plus equal seller security compensation. Delivery to another market takes two months, costs 1 gold and loses 1% of quantity. Storage and transport losses reduce receipt quantity. Invalid parties or lost access preserve goods and collateral for recovery. Accept only if these terms suit you."
 bfl_goods_quote_title: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_goods_quote_type').Goods.GetNameWithNoTooltip] warehouse receipt"
 bfl_goods_set_allocation_tip: "Cycle 0%, 10%, 25% or 50% of bank cash plus owned inventory cost. Protected cash is always retained. Reducing the allocation sells accessible free positions until under target."
 bfl_goods_set_contracts_tip: "Spot only, automatically offer receipts, or automatically offer physical forwards. Offers require the instrument’s age and research, stay backed and await separate counterparty acceptance. Existing accepted obligations remain protected."
 bfl_goods_set_mandate_tip: "Automatic: buy and sell under your policy. Paused: no discretionary trades. Run off: sell accessible free inventory without replacing it. Existing contracts, storage and losses continue in all modes."
 bfl_goods_set_risk_tip: "Cautious: take profit +10%, stop loss −5%. Balanced: +20% / −15%. Adventurous: +35% / −25%. Limits use native sale quotes against remaining cost; execution is monthly and prices can move."
 bfl_goods_set_turnover_tip: "Maximum holding period: 6, 12 or 24 months. The bank sells accessible free positions at expiry and chooses new goods automatically."
 bfl_goods_settings: "Trading policy"
 bfl_goods_settings_tip: "Set the bank’s mandate, allocation, risk limits, holding period and contract policy. The bank chooses all goods and quantities at its monthly close."
 bfl_goods_tip: "#T Goods and trade#!\nMerchant Finance instruments involving inventory, receipts, future delivery and margin. Recorded permission does not create goods or a trade route; physical execution is required."
 bfl_goods_trading_locked: "Trading locked · hover for requirements"
 bfl_goods_transfer_desc: "Price: [ROOT.GetCountry.MakeScope.GetVariable('bfl_goods_transfer_price').GetValue|2] gold. Quantity: [ROOT.GetCountry.MakeScope.GetVariable('bfl_goods_transfer_quantity').GetValue|3]. Your payment goes to the current holder. Custody stays at the bank; storage, spoilage and delivery terms continue. Acceptance rejects changed backing, holder, lot generation or price."
 bfl_goods_transfer_title: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_goods_transfer_type').Goods.GetNameWithNoTooltip] receipt transfer"
 bfl_grant_goods_branch: "Offer Customs House custody access"
 bfl_grant_goods_branch_act: "$bfl_grant_goods_branch$"
 bfl_grant_goods_branch_desc: "Review physical custody offers, existing claims or a voluntary Customs House access agreement. Selecting a country moves no money."
 bfl_grant_goods_branch_effect_text: "$bfl_grant_goods_branch$"
 bfl_grant_goods_branch_effect_text_past: "$bfl_grant_goods_branch$"
 bfl_historical_bank_independent: "Allow the bank to remain an ordinary institution."
 bfl_history_empty: "History begins at the next monthly settlement."
 bfl_investment_bank: "Investment Bank"
 bfl_investment_bank_desc: "As commerce draws distant kingdoms into a common exchange, the bank must look beyond the streets surrounding its counting house. Its correspondents gather the promises of merchants and princes, while experienced partners seek ventures across the seas. A larger establishment is costly to maintain, yet its reputation commands better terms for the capital entrusted to its care."
 bfl_investment_tab: "Lending & Investments"
 bfl_investment_title: "Lending"
 bfl_invite_equity_capital: "Add bank equity capital"
 bfl_invite_equity_capital_desc: "Subscribe 100 gold to [ROOT.GetCountry.MakeScope.GetVariable('bfl_capital_issuer').GetCountry.GetName] from the selected treasury or estate wallet. The subscriber receives new shares at the market quote. Estate wallets retain at least 25 gold. Financial ownership, future dividends and dilution follow the paid shares."
 bfl_invite_equity_capital_tip: "Choose the treasury or an estate wallet to subscribe 100 gold at the bank's current NAV. New shares dilute existing holders; the bank receives the payment."
 bfl_join_clearing_group: "Join a clearing group"
 bfl_join_clearing_group_act: "$bfl_join_clearing_group$"
 bfl_join_clearing_group_command: "$bfl_join_clearing_group$"
 bfl_join_clearing_group_command_desc: "$bfl_join_clearing_group_desc$"
 bfl_join_clearing_group_desc: "Join an operator accepting members. Four banks per group; matched matured payment bills settle by funded net debit. A short member blocks the batch without erasing claims."
 bfl_join_clearing_group_effect_text: "$bfl_join_clearing_group$"
 bfl_join_clearing_group_effect_text_past: "$bfl_join_clearing_group$"
 bfl_join_clearing_group_tip: "Choose a researched clearing operator accepting members. Revolutions, Clearing House and Advanced Clearing research are required. Up to four banks join explicitly; a short member preserves all claims."
 bfl_liabilities_detail_title: "Liabilities of [Country.GetName]"
 bfl_liabilities_label: "Liabilities"
 bfl_liabilities_label_tip: "#T Total debt#!\nObligations recorded in the bank's accounts. This is separate from your state's native loans and bonds.\n\nDeposit principal: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_deposit_principal')|2]@gold!\nCredited deposit interest: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_deposit_interest')|2]@gold!\nNotes outstanding: [Country.MakeScope.GetVariable('bfl_notes_outstanding').GetValue|2]@gold!\nOther payables: [Country.MakeScope.GetVariable('bfl_other_payables').GetValue|2]@gold!\nTotal: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_liabilities')|2]@gold!\n\nQueued withdrawals of [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_withdrawals_due')|2]@gold! are already part of deposit claims and are not added a second time."
 bfl_liquidity_facilities: "Liquidity Facilities"
 bfl_liquidity_facilities_desc: "Even a solvent banking house may be unable to meet every demand for coin at once. Temporary advances against sound assets can bridge this shortage, provided that assistance does not conceal losses that the institution cannot bear."
 bfl_liquidity_warning: "Bank liquidity requires attention"
 bfl_liquidity_warning_desc: "Your bank has queued withdrawals or inadequate capital. Open Economy → Banking & Finance to review deposits and recapitalization."
