 bfl_cost_current: "Current monthly cost: #R [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_operating_expense')|2]@gold!#!"
 bfl_cost_payment_detail: "Costs scale with complexity, not asset value. Charged once monthly above protected reserves; unpaid expenses restrict dividends. Deposit interest and native expenses are separate. Ordinary reductions add together, then the banking constitution’s expense multiplier applies. The total is rounded to cents."
