 bfl_share_07_tip: "#T [Country.MakeScope.GetVariable('bfl_shr_07_party').GetCountry.GetName]#!\nShares: [Country.MakeScope.GetVariable('bfl_shr_07_units').GetValue|2]\nOwnership: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_share_fraction_07')|%2]"
 bfl_share_08_tip: "#T [Country.MakeScope.GetVariable('bfl_shr_08_party').GetCountry.GetName]#!\nShares: [Country.MakeScope.GetVariable('bfl_shr_08_units').GetValue|2]\nOwnership: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_share_fraction_08')|%2]"
 bfl_share_09_tip: "#T [Country.MakeScope.GetVariable('bfl_shr_09_party').GetCountry.GetName]#!\nShares: [Country.MakeScope.GetVariable('bfl_shr_09_units').GetValue|2]\nOwnership: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_share_fraction_09')|%2]"
 bfl_share_10_tip: "#T [Country.MakeScope.GetVariable('bfl_shr_10_party').GetCountry.GetName]#!\nShares: [Country.MakeScope.GetVariable('bfl_shr_10_units').GetValue|2]\nOwnership: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_share_fraction_10')|%2]"
 bfl_share_11_tip: "#T [Country.MakeScope.GetVariable('bfl_shr_11_party').GetCountry.GetName]#!\nShares: [Country.MakeScope.GetVariable('bfl_shr_11_units').GetValue|2]\nOwnership: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_share_fraction_11')|%2]"
 bfl_share_12_tip: "#T [Country.MakeScope.GetVariable('bfl_shr_12_party').GetCountry.GetName]#!\nShares: [Country.MakeScope.GetVariable('bfl_shr_12_units').GetValue|2]\nOwnership: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_share_fraction_12')|%2]"
 bfl_share_13_tip: "#T [Country.MakeScope.GetVariable('bfl_shr_13_party').GetCountry.GetName]#!\nShares: [Country.MakeScope.GetVariable('bfl_shr_13_units').GetValue|2]\nOwnership: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_share_fraction_13')|%2]"
 bfl_share_14_tip: "#T [Country.MakeScope.GetVariable('bfl_shr_14_party').GetCountry.GetName]#!\nShares: [Country.MakeScope.GetVariable('bfl_shr_14_units').GetValue|2]\nOwnership: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_share_fraction_14')|%2]"
 bfl_share_15_tip: "#T [Country.MakeScope.GetVariable('bfl_shr_15_party').GetCountry.GetName]#!\nShares: [Country.MakeScope.GetVariable('bfl_shr_15_units').GetValue|2]\nOwnership: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_share_fraction_15')|%2]"
