l_english:
 MODIFIER_TYPE_DESC_bfl_enable_advanced_clearing: "Unlocks net settlement of verified reciprocal obligations between participating institutions. Clearing must preserve every holder's entitlement and settle the funded net balance without creating money. Native interbank settlement remains unavailable."
 MODIFIER_TYPE_DESC_bfl_enable_bank_capital_subscriptions: "Allows primary subscriptions of 100 gold into a bank. New ownership units are priced at current net asset value. Subscription proceeds increase paid-in capital rather than realized profit and buy a proportional claim on subsequent distributions."
 MODIFIER_TYPE_DESC_bfl_enable_bank_share_dealing: "Permits the bank-share transfer service to move existing registered units between identified holders. A transfer changes ownership without issuing new units or creating bank profit. The registry must have capacity and preserve each holder's entitlement."
 MODIFIER_TYPE_DESC_bfl_enable_collateralization: "Unlocks recorded collateral pledges and their eligibility checks. Encumbered assets cannot secure a second claim, and recovery must preserve the original debt relationship. Native collateral execution remains unavailable."
 MODIFIER_TYPE_DESC_bfl_enable_commenda: "Unlocks the Overseas Investment voyage-partnership mandate. Each venture requires an identified partner, funded capital, a recorded profit-sharing agreement and settlement of realized proceeds. Project execution remains unavailable in this development build."
 MODIFIER_TYPE_DESC_bfl_enable_commercial_bills: "Allows fully funded payment bills. The purchaser pays 100 gold before issuance; the bank records an equal payable and cash commitment. The named holder may redeem the bill after one month, once only. Issuance is not profit."
 MODIFIER_TYPE_DESC_bfl_enable_commodity_forwards: "Unlocks Merchant Finance forward-delivery contracts. Each agreement must record its counterparty, goods, quantity, delivery date and backing without reusing encumbered inventory. Native trading execution remains unavailable."
 MODIFIER_TYPE_DESC_bfl_enable_commodity_investments: "Unlocks the Merchant Finance inventory mandate. Commodity positions must represent funded native goods holdings and preserve acquisition cost, quantity and custody. Trading execution remains unavailable in this development build."
 MODIFIER_TYPE_DESC_bfl_enable_company_equity: "Unlocks the Overseas Investment company-equity mandate. Financial shares are recorded separately from political subject control. Only verified company distributions may become bank income; subscriptions and return of capital are excluded. Native execution remains unavailable."
 MODIFIER_TYPE_DESC_bfl_enable_corporate_credit: "Unlocks the Merchant Finance corporate credit mandate. Loans must transfer bank cash to an identified enterprise and create an equal recoverable claim; principal repayments do not enter profits. Native execution remains unavailable."
 MODIFIER_TYPE_DESC_bfl_enable_debt_restructuring: "Unlocks the sovereign restructuring mandate. Revised maturity, interest and principal must attach to the existing claim, with the debtor's agreement. Execution remains unavailable until native debt reconciliation is supported."
 MODIFIER_TYPE_DESC_bfl_enable_liquidity_facilities: "Unlocks secured temporary liquidity. Funding must come from a real counterparty, remain within cash and capital limits and carry recorded collateral. Queued withdrawals retain priority. Native facility execution remains unavailable."
 MODIFIER_TYPE_DESC_bfl_enable_margining_and_risk_management: "Unlocks margin requirements for Merchant Finance forward positions. Exposure must be measured against available collateral and cash, with additional funding required before commitments increase. Native trading and margin execution remain unavailable."
 MODIFIER_TYPE_DESC_bfl_enable_project_security: "Unlocks security for Overseas Investment projects. Identified project assets and proceeds must be pledged to a single recorded obligation, with priority preserved through settlement or recovery. Native project execution remains unavailable."
 MODIFIER_TYPE_DESC_bfl_enable_public_financial_backstops: "Unlocks the public backstop mandate for an authorized chartered bank. Assistance requires a real treasury contribution and recorded claims or ownership units; guarantees cannot mint cash or erase losses. Standing backstop execution is not yet implemented."
 MODIFIER_TYPE_DESC_bfl_enable_sovereign_banknotes: "Unlocks sovereign note issuance for an authorized chartered bank. Notes are redeemable liabilities; backing excludes cash raised by selling the notes themselves. Native issuance and holder-payment routing remain unavailable."
 MODIFIER_TYPE_DESC_bfl_enable_term_deposits: "Allows fixed-rate deposits of 100 gold with a twelve-month maturity. Interest accrues monthly at the rate accepted when the account opens; immature principal cannot be withdrawn. Deposits remain liabilities of the bank."
 MODIFIER_TYPE_DESC_bfl_enable_warehouse_receipts: "Unlocks Merchant Finance receipts backed by identified inventory lots. Each receipt reserves ten unencumbered units and charges a funded custody fee. Native goods custody must be supported before new receipts can be issued."
 MODIFIER_TYPE_DESC_bfl_no_automatic_tribute_cost_modifier: "Adjusts the charter relationship’s automatic payment price. The charter price is zero; the bank’s separately funded royalty is processed in its own accounts."
