 bfl_loan_button: "Take over loan"
 bfl_log_charter: "Chartered and capitalized a State Bank for"
 bfl_manage_shareholdings: "Shareholder decisions"
 bfl_manage_shareholdings_desc: "Select a financial holding. More than half of the issued votes may set independent-bank dividends or company payout and reinvestment policy. A live controller may exercise its managed bank's votes. Chartered monetary policy and political overlordship remain separate."
 bfl_margining: "Margining"
 bfl_margining_and_risk_management: "Margining And Risk Management"
 bfl_margining_and_risk_management_desc: "Merchants who promise future deliveries face changing prices long before their contracts mature. Requiring additional security as exposures grow gives bankers a means of containing losses before an unfavorable market becomes a default."
 bfl_margining_tip: "#T Margin and risk management#!\nRequire collateral and variation margin against changing commodity exposure. Requires Margining and Risk Management research, Merchant Finance and the Revolutions age. Goods-backed margin execution is unavailable in this build."
 bfl_market_sort_price: "Sort by price per share"
 bfl_monetary: "Monetary policy and liquidity"
 bfl_monetary_explanation: "Bills precede sovereign notes. Notes require an authorized charter, Absolutism research and backing that excludes note-sale cash. Secured liquidity and clearing have later research and adapter gates."
 bfl_monetary_tip: "#T Monetary instruments#!\nLater-age permissions for sovereign notes, secured liquidity, clearing and public support. Each requires its own authorization, backing and operating conditions."
 bfl_native_credit_label: "Loan portfolio"
 bfl_native_tab: "State loans"
 bfl_native_takeover: "Native Takeover"
 bfl_new_capital_subscription: "Subscribe new capital"
 bfl_new_capital_subscription_desc: "Invest 100@gold! of your bank’s funds in [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_issuer').GetCountry.GetName] as newly issued equity at its tangible NAV. The issuer receives the payment and existing holders are diluted. This is a capital subscription, separate from Buy shares. Execution rechecks the captured NAV, issued units, research, protected funds and concentration limit. It consumes one diplomat and starts this issuer’s one-month trading cooldown."
 bfl_new_capital_subscription_tip: "Primary financing: invest 100 gold from the managed bank. The issuer receives cash and issues new shares. This is separate from trading existing stock."
 bfl_no_automatic_tribute: "No automatic charter tribute"
 bfl_no_automatic_tribute_cost_modifier: "Automatic charter tribute cost"
 bfl_no_bank: "Charter an existing State Bank through Decisions, or play an independent banking country. Your country must own its capital market to charter a bank."
 bfl_offer_bank_shares: "Offer new bank shares"
 bfl_offer_bank_shares_tip: "Allow other banks and countries to subscribe 100 gold at the bank's current net asset value. New shares are issued only when paid for; existing owners are diluted. Native Banking research and positive equity remain required."
 bfl_offer_bond: "Offer a bank-held sovereign bond"
 bfl_offer_bond_tip: "List the oldest bank-held bond for three months at 98% of face value. Selling and buying both require an owned completed Stock Exchange building. Acceptance rechecks the seller, current holder, generation, funds and expiry. Arrears block trading."
 bfl_offer_commenda: "Fund a cargo operation"
 bfl_offer_commenda_act: "Fund a cargo operation"
 bfl_offer_commenda_desc: "Offer risk capital under the bank’s proposed terms. Acceptance buys the named cargo at its native cost; unused authorization stays with the bank. Capital and returns are never guaranteed."
 bfl_offer_commenda_effect_text: "Fund a cargo operation"
 bfl_offer_commenda_effect_text_past: "Fund a cargo operation"
 bfl_offer_commenda_tip: "Discovery or later, Overseas Investment and Commenda research. Choose an operator, source market, destination and goods for a ten-unit cargo. Acceptance rechecks your authority, free cash, capital and capacity. One active agreement per operator; up to eight per bank."
 bfl_offer_credit: "Offer a funded loan"
 bfl_offer_credit_desc: "The borrower receives an explicit offer. No cash or terms change until acceptance; execution rechecks live authority, profile, research and funds."
 bfl_offer_credit_tip: "Select a sovereign or eligible native company. Both profiles lend to sovereigns; company credit requires Merchant Finance, Reformation and Corporate Credit. Debt relief also requires Renaissance Debt Restructuring."
 bfl_offer_goods_transfer: "Offer warehouse receipt transfer"
 bfl_offer_goods_transfer_desc: "Offer the receipt most recently selected in Goods offers and custody claims. The recipient reviews price and quantity before paying the current holder."
 bfl_offer_held_sovereign_bond: "Offer a held sovereign bond"
 bfl_offer_held_sovereign_bond_desc: "Select an issuer and list one of your sovereign bonds at 98% of face value. Requires an owned completed Stock Exchange building."
 bfl_offer_held_sovereign_bond_tip: "List an existing bond you own for three months. You retain the claim until a funded buyer accepts; coupons and redemption then follow that buyer."
 bfl_offer_restructuring: "Offer debt relief"
 bfl_offer_restructuring_desc: "The borrower receives an explicit offer. No cash or terms change until acceptance; execution rechecks live authority, profile, research and funds."
 bfl_offer_restructuring_tip: "Select a sovereign or eligible native company. Both profiles lend to sovereigns; company credit requires Merchant Finance, Reformation and Corporate Credit. Debt relief also requires Renaissance Debt Restructuring."
 bfl_operating_costs: "Monthly operating expenses"
 bfl_operating_costs_tip: "Fixed monthly costs scale with active deposit accounts, contracts, branches and asset classes. The State Chartered Bank reform reduces costs by 5%, Banking by 10%, Advanced Clearing by 15%, and streamlined administration by 10%. Unpaid costs remain liabilities and block dividends."
 bfl_overview: "Accounts and specialization"
 bfl_overview_hint: "Assets: outer ring = type; inner ring = countries. Hover for colored breakdowns."
 bfl_payout_0: "Retain profits"
 bfl_payout_0_short: "Retain"
 bfl_payout_0_tip: "Retain all eligible realized profit. No new dividend is paid under this policy; retained profit supports liquidity and equity."
 bfl_payout_25: "25% payout"
 bfl_payout_25_short: "25%"
 bfl_payout_25_tip: "Allocate up to 25% of eligible realized profit to dividends after losses. Available cash, capital headroom and recorded ownership still limit payment."
 bfl_payout_50: "50% payout"
 bfl_payout_50_short: "50%"
 bfl_payout_50_tip: "Allocate up to 50% of eligible realized profit to dividends after losses. Available cash, capital headroom and recorded ownership still limit payment."
 bfl_place_deposit_1: "Open a 100 gold demand deposit"
 bfl_place_deposit_1_desc: "Independent banks require an opinion of at least +50 toward you to open an account. Your chartered bank offers an extra 1% annual interest. Demand interest is paid monthly when funded; unpaid interest stays owed. Falling relations never prevent withdrawal of your own matured claims."
 bfl_place_deposit_2: "Open a 100 gold term deposit"
 bfl_place_deposit_2_desc: "Independent banks require an opinion of at least +50 toward you to open an account. Your chartered bank offers an extra 1% annual interest. Demand interest is paid monthly when funded; unpaid interest stays owed. Falling relations never prevent withdrawal of your own matured claims."
 bfl_portfolio_bank_heading: "Investments held by [Country.GetName]"
 bfl_portfolio_history_axis: "Oldest to latest · up to 12 monthly observations"
 bfl_portfolio_history_empty: "History starts at the next monthly bank close."
 bfl_portfolio_history_flows: "Value includes purchases and sales; this is not an investment-return index."
 bfl_portfolio_history_title: "Portfolio value over time"
 bfl_portfolio_owner_note: "Treasury and bank holdings have separate owners. Hover an entity for its finances."
 bfl_portfolio_total_heading: "Current equity value"
 bfl_portfolio_treasury_heading: "Sovereign treasury holdings"
 bfl_prepare_bond_panel: "Sovereign Bonds"
 bfl_prepare_bond_panel_tip: "View state financing and existing claims in Credit."
 bfl_probe_P04: "Development gate: P04 must be measured in game before this adapter can execute."
 bfl_probe_P05: "Development gate: P05 must be measured in game before this adapter can execute."
 bfl_probe_P10: "Development gate: P10 must be measured in game before this adapter can execute."
