 bfl_venture_accept: "Accept the partnership"
 bfl_venture_accept_tip: "Recheck live investor authority, unchanged offer terms, age, research, free cash, capital, capacity and operator contribution. Funding pays only the selected activity’s actual native cost. It grants no company shares or political control."
 bfl_venture_decline: "Decline"
 bfl_venture_duration_12: "Duration · 12 months"
 bfl_venture_duration_120: "Duration · 120 months"
 bfl_venture_duration_24: "Duration · 24 months"
 bfl_venture_duration_6: "Duration · 6 months"
 bfl_venture_duration_60: "Duration · 60 months"
 bfl_venture_duration_tip: "Cycle 6, 12, 24, 60 or 120 months. Long terms accommodate native exploration. Cargo sells after two months if native access remains valid; blocked cargo stays in custody. Expedition costs without linked sale proceeds are written off at maturity."
 bfl_venture_empty: "No active ventures. Select a cargo operation or native expedition before offering terms."
 bfl_venture_help: "Click a term to cycle. Each operator accepts separately. Existing agreements continue after a policy or research change."
 bfl_venture_hint: "Hover for activity, costs, cargo and returns"
 bfl_venture_locked: "New ventures locked · hover for requirements"
 bfl_venture_note: "Capital is recovered before profit. Losses follow contributions. Only the named operation’s acquired cargo can fund its proceeds. Unrelated trade never pays this agreement. Discovery alone pays nothing. Closed rows remain until replaced by a newly accepted agreement."
 bfl_venture_offer_desc: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_bank').GetCountry.GetName] offers [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_ticket').GetValue|0] gold for [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_duration').GetValue|0] months. Preset [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_preset').GetValue|0]: 0 = investor funds all capital, receives 75% of surplus; 1 = investor contributes two thirds, operator one third, surplus split equally. Capital is recovered first; losses follow contributions. Only the named operation’s actual sale proceeds can pay profit. Exploration success grants an opportunity, never gold. This offer expires in three months."
 bfl_venture_offer_desc_0: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_bank').GetCountry.GetName] authorizes up to [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_ticket').GetValue|0] gold of bank funding for [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_duration').GetValue|0] months. Buy 10 [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_good').Goods.GetNameWithNoTooltip] in [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_from').GetMarket.GetName], carry them for two months, then sell in [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_to').GetMarket.GetName]. The bank funds all costs and receives [GuiScope.SetRoot(ROOT.GetCountry.MakeScope).ScriptValue('bfl_venture_offered_profit_fraction')|%1] of surplus. You keep the remainder.\n\nOnly actual native costs are drawn. Unused funding stays at the bank. Capital is recovered before surplus; losses follow contributions. Only this cargo’s measured sale proceeds settle this agreement. Unrelated income and discovery pay nothing. Offer expires in three months."
 bfl_venture_offer_desc_1: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_bank').GetCountry.GetName] authorizes up to [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_ticket').GetValue|0] gold of bank funding for [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_duration').GetValue|0] months. Buy 10 [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_good').Goods.GetNameWithNoTooltip] in [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_from').GetMarket.GetName], carry them for two months, then sell in [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_to').GetMarket.GetName]. The bank funds two thirds of costs; you pay one third. The bank receives [GuiScope.SetRoot(ROOT.GetCountry.MakeScope).ScriptValue('bfl_venture_offered_profit_fraction')|%1] of surplus and you keep the remainder.\n\nOnly actual native costs are drawn. Unused funding stays at the bank. Capital is recovered before surplus; losses follow contributions. Only this cargo’s measured sale proceeds settle this agreement. Unrelated income and discovery pay nothing. Offer expires in three months."
 bfl_venture_offer_desc_2: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_bank').GetCountry.GetName] authorizes up to [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_ticket').GetValue|0] gold of bank funding for [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_duration').GetValue|0] months. Prepare native exploration of [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_area').GetArea.GetName] from [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_port').GetLocation.GetName] with [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_explorer').GetCharacter.GetName]. The bank funds all agreed gold costs and receives [GuiScope.SetRoot(ROOT.GetCountry.MakeScope).ScriptValue('bfl_venture_offered_profit_fraction')|%1] of contractual surplus. You keep the remainder. Preparation is non-refundable, including cancellation. You provide crew, native upkeep and optional expedition spending outside this funding agreement. Remaining bank authorization may fund one ten-unit cargo from a market centered in or bordering the discovered area, subject to native access. Only that cargo’s measured sales, less the recorded preparation and cargo costs, can pay contractual surplus. Discovery and unrelated trade pay nothing. The offer expires in three months. "
 bfl_venture_offer_desc_3: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_bank').GetCountry.GetName] authorizes up to [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_ticket').GetValue|0] gold of bank funding for [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_duration').GetValue|0] months. Prepare native exploration of [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_area').GetArea.GetName] from [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_port').GetLocation.GetName] with [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_explorer').GetCharacter.GetName]. The bank funds two thirds of agreed gold costs; you pay one third. The bank receives [GuiScope.SetRoot(ROOT.GetCountry.MakeScope).ScriptValue('bfl_venture_offered_profit_fraction')|%1] of contractual surplus and you keep the remainder. Preparation is non-refundable, including cancellation. You provide crew, native upkeep and optional expedition spending outside this funding agreement. Remaining bank authorization may fund one ten-unit cargo from a market centered in or bordering the discovered area, subject to native access. Only that cargo’s measured sales, less the recorded preparation and cargo costs, can pay contractual surplus. Discovery and unrelated trade pay nothing. The offer expires in three months. "
