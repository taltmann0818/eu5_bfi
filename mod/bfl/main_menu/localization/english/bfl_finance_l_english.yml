 bfl_accounts_explanation: "Native treasury is cash. Deposits and notes are liabilities. Lending exchanges cash for an asset; principal, subscriptions and issuance are not profit."
 bfl_activity_title: "Monthly activity statement"
 bfl_activity_title_tip: "Native coupon observations classify the native net budget; they never move gold twice. Settled native payoff proceeds release actual acquisition cost before recognizing a gain or loss. Company distributions and custom funded receipts enter their own buckets. Principal, deposits and subscriptions are excluded from profits."
 bfl_advanced_clearing: "Advanced Clearing"
 bfl_advanced_clearing_desc: "Banking houses that owe one another many payments need not settle every obligation separately in coin. Clearing accounts reconcile their claims and transfer only the remaining balance, reducing the money required to sustain commerce."
 bfl_advanced_tip: "Research unlocks the mandate. The bank must also meet its specialization, liquidity and operating requirements. Unavailable execution remains disabled."
 bfl_ai_equity_offering: "Admit bank and open paid capital offering"
 bfl_ai_equity_offering_desc: "AI management may admit its actual bank and authorize paid primary subscriptions after Share Dealing and a completed exchange. No cash or shares are created by admission."
 bfl_ai_equity_purchase: "Consider funded exchange investment"
 bfl_ai_equity_purchase_desc: "AI purchase uses the same live research, building, authority, capacity and exact-quote confirmation checks as the player. Monthly opportunity review, with at least 500 gold of cash and capital surplus. No above-market asks."
 bfl_ai_exchange_priority: "Prioritize stock exchange access"
