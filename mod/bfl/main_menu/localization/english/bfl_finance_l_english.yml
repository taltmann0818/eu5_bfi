 bfl_assets_label: "Total assets"
 bfl_assets_label_tip: "#T Total assets#!\nCash and recorded assets owned by the bank.\n\nTreasury cash: [Country.GetFixedPointCurrencyValue('gold')|2]@gold!\nLoan portfolio: [Country.MakeScope.GetVariable('bfl_native_credit_value').GetValue|2]@gold!\nEquity positions (carrying value): [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_security_carrying')|2]@gold!\nCustom credit and bonds: [Country.MakeScope.GetVariable('bfl_custom_credit_value').GetValue|2]@gold!\nInventory: [Country.MakeScope.GetVariable('bfl_inventory_value').GetValue|2]@gold!\nProjects: [Country.MakeScope.GetVariable('bfl_project_value').GetValue|2]@gold!\nTotal: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_assets')|2]@gold!\n\nLoans, equity positions, inventory and projects are recorded asset values, not cash available to spend. Principal repayments exchange a loan asset for cash; they do not create profit."
 bfl_back_to_bank: "Bank accounts"
 bfl_balance_paid_tip: "Funded payment received at the last monthly settlement. These transfers are already in your treasury and must not be added again to the native income total."
 bfl_bank_capital_subscriptions_desc: "A banking house need not rely entirely on the fortune of its founding family. Subscriptions bring additional partners into the enterprise, pooling their capital while recording each investor's claim upon its future prosperity."
 bfl_bank_dividends: "Bank Dividends"
 bfl_bank_equity_subscribe: "Bank treasury: subscribe 100 gold"
 bfl_bank_equity_subscribe_tip: "Invest 100 of the actual managed bank's protected-cash and capital surplus at the selected issuer's tangible NAV. New paid units enter the bank portfolio. Maximum 25% of a bank or 60% of an Overseas-permitted company. This is primary financing, not a purchase from an existing shareholder."
 bfl_bank_identity_tip: "[Country.GetName] holds its own treasury, assets and obligations. These totals belong to the bank, separately from your state treasury. Merchant Finance specializes in trade and corporate lending; Overseas Investment specializes in ventures and companies. A bank chooses one permanent specialization."
 bfl_bank_share_dealing: "Bank Share Dealing"
 bfl_bank_share_dealing_desc: "A partner's fortune need not remain tied to the same banking house forever. Recognized transfers of ownership let investors sell their interests to others while the institution continues its business without withdrawing its capital."
 bfl_bank_share_transfer: "Bank Share Transfer"
 bfl_bank_share_transfer_tip: "#T Bank share transfer#!\nTransfer recorded bank ownership units between funded parties. Requires Bank Share Dealing research and the Reformation age or later. This row reports permission; it does not itself execute a secondary share trade."
 bfl_bank_status_tip: "Operating: new business is permitted when its other requirements are met. Cash under pressure: available cash is exhausted. Withdrawals queued: unpaid withdrawal requests suspend new business. Insolvent: liabilities exceed assets. In resolution or Closed: ordinary business is restricted. Existing claims remain recorded."
