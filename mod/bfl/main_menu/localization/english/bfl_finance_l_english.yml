 bfl_sovereign_accounts: "Sovereign accounts — separate from bank assets"
 bfl_sovereign_accounts_subtitle: "Native sovereign loans — not bank assets"
 bfl_sovereign_accounts_tip: "These native debts and receivables belong to the sovereign, not its bank. Bank-owned loans are included in the asset donut; bank liabilities include deposits and unpaid operating expenses. Native borrowing, repayment and loan lists keep the sovereign as actor."
 bfl_sovereign_banknotes: "Sovereign Banknotes"
 bfl_sovereign_banknotes_desc: "A bank supported by public authority may circulate written promises to pay in place of heavy coin. Their acceptance rests upon confidence that the institution will redeem them and that the issuing authority will uphold its obligations."
 bfl_sovereign_credit: "Sovereign Credit"
 bfl_sovereign_credit_tip: "#T Sovereign credit#!\nA loan from bank cash to a landed state, with a repayment claim recorded as a bank asset. Requires an operating bank and the native loan conditions. New loan execution is unavailable in this build."
 bfl_sovereign_debt: "Sovereign debt"
 bfl_sovereign_debt_heading: "Sovereign debt of [Country.GetName]"
 bfl_sovereign_note: "Sovereign Note"
 bfl_sovereign_note_tip: "#T Sovereign banknotes#!\nIssue charter-authorized notes with verified backing. Requires Sovereign Banknotes research, a state charter and the Absolutism age or later. Note-sale proceeds cannot count as their own backing. Native note execution is unavailable in this build."
 bfl_sovereign_receivables: "Sovereign receivables"
 bfl_sovereign_receivables_heading: "Sovereign receivables of [Country.GetName]"
 bfl_sovereign_restructuring: "Sovereign Restructuring"
 bfl_sovereign_restructuring_tip: "#T Sovereign restructuring#!\nRenegotiate sovereign debt under the Debt Restructuring advance. Requires the permitted age, an operating bank and a supported native debt transaction. Native restructuring execution is unavailable in this build."
 bfl_specialization_title: "Bank specialization"
 bfl_state_bonds_tip: "#T State bond capacity#!\nOutstanding native state bonds: [GetPlayer.GetNumBonds]\nMaximum native bond slots: [GetPlayer.GetDoubleModifierValue('max_bonds', 'max_bonds_modifier')|0]\n\nThese are your state's bonds, separate from the bank's deposits, equity and other liabilities. The capacity includes native base slots and bond-capacity modifiers. Selling a bond also requires the native borrowing conditions."
 bfl_state_bonds_value: "Bonds: [GetPlayer.GetNumBonds] / [GetPlayer.GetDoubleModifierValue('max_bonds', 'max_bonds_modifier')|0]"
 bfl_state_chartered_bank: "State Chartered Bank"
 bfl_state_chartered_bank_desc: "A separately funded native bank subject. The sovereign initially owns all shares and sets the monthly dividend payout in Credit. New bank subscriptions raise capital and dilute existing ownership. State deposits earn preferential interest."
 bfl_state_credit: "State credit"
 bfl_state_credit_value: "Credit: [Multiply_CFixedPoint(GetPlayer.GetCreditworthiness, '(CFixedPoint)100')|0]"
 bfl_state_interest_value: "Interest: [GetPlayer.GetModifierValueNoFormat('bank_interest')]"
 bfl_status_0: "Operating"
 bfl_status_1: "Cash under pressure"
 bfl_status_2: "Withdrawals queued"
 bfl_status_3: "Insolvent"
 bfl_status_4: "In resolution"
 bfl_status_5: "Closed"
 bfl_streamline_bank: "Streamline administration · 100 gold"
 bfl_streamline_bank_tip: "Pay 100 state gold once to reduce fixed bank operating expenses by 10%. The charter reform, Banking and Advanced Clearing provide additional reductions. This decision does not create bank profit."
 bfl_subscribe_bank: "Subscribe 100 gold of bank capital"
 bfl_subscribe_bank_desc: "Funded from your own treasury after profile, age, research and registry checks. Principal is not bank profit. A bank capital subscription buys units at its current net asset value."
 bfl_suspend_command: "Suspend new deposits"
 bfl_suspend_command_tip: "#T Suspend new deposits#!\nStop accepting new deposits and the funding actions that require deposit acceptance. Existing accounts, interest obligations and withdrawal requests remain recorded. This control does not close the bank or forgive its debts."
 bfl_term_accept: "Accept these fixed terms"
 bfl_term_decline: "Keep the existing account"
 bfl_term_deposit: "Term Deposit"
 bfl_term_deposits_desc: "Merchants cannot always employ their money at once. By entrusting it to a banking house for an agreed term, they give the banker a steadier source of capital and receive compensation for surrendering immediate access to their funds."
 bfl_term_offer_1_desc: "Renew your matured [ROOT.GetCountry.MakeScope.GetVariable('bfl_deposit_offer_principal').GetValue|2] gold principal for 12 months at [ROOT.GetCountry.MakeScope.GetVariable('bfl_deposit_offer_rate').GetValue|%1] annually. Accrued interest stays owed separately. No new principal is transferred. This offer expires at month end; changed claims require a new offer."
 bfl_term_offer_1_title: "Renew matured term deposit"
 bfl_term_offer_2_desc: "Queue an early withdrawal of [ROOT.GetCountry.MakeScope.GetVariable('bfl_deposit_offer_principal').GetValue|2] gold principal after cancelling [ROOT.GetCountry.MakeScope.GetVariable('bfl_deposit_offer_penalty').GetValue|2] gold of accrued interest (at most 1% of principal). No principal penalty applies. Cash shortages remain owed in the withdrawal queue. This offer expires at month end; changed claims require a new offer."
 bfl_term_offer_2_title: "Early term withdrawal offer"
 bfl_term_service_1: "Renew the first matured term account"
 bfl_term_service_1_desc: "Request a term servicing offer at the selected bank. Acceptance preserves unpaid claims and rechecks the lot generation."
 bfl_term_service_1_tip: "Selects your first eligible term lot. The bank presents fixed terms for explicit acceptance. Renewal requires current admission and term permissions; early exit and matured withdrawal remain available after relations or authority loss. Changed or expired quotes cannot execute."
 bfl_term_service_2: "Request early term withdrawal"
 bfl_term_service_2_desc: "Request a term servicing offer at the selected bank. Acceptance preserves unpaid claims and rechecks the lot generation."
 bfl_term_service_2_tip: "Selects your first eligible term lot. The bank presents fixed terms for explicit acceptance. Renewal requires current admission and term permissions; early exit and matured withdrawal remain available after relations or authority loss. Changed or expired quotes cannot execute."
 bfl_treasury: "Treasury funding"
 bfl_treasury_stake: "Your treasury stake"
 bfl_twelve_months: "12 monthly settlements · oldest → latest"
 bfl_venture_accept: "Accept the partnership"
 bfl_venture_accept_tip: "Recheck live investor authority, unchanged offer terms, age, research, free cash, capital, capacity and operator contribution. Funding pays only the selected activity’s actual native cost. It grants no company shares or political control."
 bfl_venture_decline: "Decline"
 bfl_venture_duration_12: "Duration · 12 months"
 bfl_venture_duration_120: "Duration · 120 months"
 bfl_venture_duration_24: "Duration · 24 months"
 bfl_venture_duration_6: "Duration · 6 months"
 bfl_venture_duration_60: "Duration · 60 months"
 bfl_venture_duration_tip: "Cycle 6, 12, 24, 60 or 120 months. Long terms accommodate native exploration. Cargo sells after two months if native access remains valid; blocked cargo stays in custody. Expedition costs without linked sale proceeds are written off at maturity."
 bfl_venture_empty: "No active ventures. Select a cargo operation or native expedition before offering terms."
 bfl_venture_help: "Click a term to cycle. Each operator accepts separately. Existing agreements continue after a policy or research change."
 bfl_venture_hint: "Hover for activity, costs, cargo and returns"
 bfl_venture_locked: "New ventures locked · hover for requirements"
 bfl_venture_note: "Capital is recovered before profit. Losses follow contributions. Only the named operation’s acquired cargo can fund its proceeds. Unrelated trade never pays this agreement. Discovery alone pays nothing. Closed rows remain until replaced by a newly accepted agreement."
 bfl_venture_offer_desc: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_bank').GetCountry.GetName] offers [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_ticket').GetValue|0] gold for [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_duration').GetValue|0] months. Preset [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_preset').GetValue|0]: 0 = investor funds all capital, receives 75% of surplus; 1 = investor contributes two thirds, operator one third, surplus split equally. Capital is recovered first; losses follow contributions. Only the named operation’s actual sale proceeds can pay profit. Exploration success grants an opportunity, never gold. This offer expires in three months."
 bfl_venture_offer_desc_0: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_bank').GetCountry.GetName] authorizes up to [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_ticket').GetValue|0] gold of bank funding for [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_duration').GetValue|0] months. Buy 10 [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_good').Goods.GetNameWithNoTooltip] in [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_from').GetMarket.GetName], carry them for two months, then sell in [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_to').GetMarket.GetName]. The bank funds all costs and receives 75% of surplus.\n\nOnly actual native costs are drawn. Unused funding stays at the bank. Capital is recovered before surplus; losses follow contributions. Only this cargo’s measured sale proceeds settle this agreement. Unrelated income and discovery pay nothing. Offer expires in three months."
 bfl_venture_offer_desc_1: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_bank').GetCountry.GetName] authorizes up to [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_ticket').GetValue|0] gold of bank funding for [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_duration').GetValue|0] months. Buy 10 [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_good').Goods.GetNameWithNoTooltip] in [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_from').GetMarket.GetName], carry them for two months, then sell in [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_to').GetMarket.GetName]. The bank funds two thirds of costs; you pay one third. Surplus is split equally.\n\nOnly actual native costs are drawn. Unused funding stays at the bank. Capital is recovered before surplus; losses follow contributions. Only this cargo’s measured sale proceeds settle this agreement. Unrelated income and discovery pay nothing. Offer expires in three months."
 bfl_venture_offer_desc_2: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_bank').GetCountry.GetName] authorizes up to [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_ticket').GetValue|0] gold of bank funding for [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_duration').GetValue|0] months. Prepare native exploration of [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_area').GetArea.GetName] from [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_port').GetLocation.GetName] with [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_explorer').GetCharacter.GetName]. The bank funds all agreed gold costs and receives 75% of contractual surplus. Preparation is non-refundable, including cancellation. You provide crew, native upkeep and optional expedition spending outside this funding agreement. Remaining bank authorization may fund one ten-unit cargo from a market centered in or bordering the discovered area, subject to native access. Only that cargo’s measured sales, less the recorded preparation and cargo costs, can pay contractual surplus. Discovery and unrelated trade pay nothing. The offer expires in three months. "
 bfl_venture_offer_desc_3: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_bank').GetCountry.GetName] authorizes up to [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_ticket').GetValue|0] gold of bank funding for [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_duration').GetValue|0] months. Prepare native exploration of [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_area').GetArea.GetName] from [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_port').GetLocation.GetName] with [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_explorer').GetCharacter.GetName]. The bank funds two thirds of agreed gold costs; you pay one third. Contractual surplus is split equally. Preparation is non-refundable, including cancellation. You provide crew, native upkeep and optional expedition spending outside this funding agreement. Remaining bank authorization may fund one ten-unit cargo from a market centered in or bordering the discovered area, subject to native access. Only that cargo’s measured sales, less the recorded preparation and cargo costs, can pay contractual surplus. Discovery and unrelated trade pay nothing. The offer expires in three months. "
