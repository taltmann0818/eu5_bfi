 bfl_strategy_automatic: "AI mandate · automatic"
 bfl_strategy_credit: "Last review: credit offered for consent"
 bfl_strategy_delegated: "Investment mandate · delegated"
 bfl_strategy_deposit: "Last review: 100 gold placed on demand"
 bfl_strategy_disable: "Manage investments"
 bfl_strategy_disable_tip: "Stop automatic loan purchases, new strategy offers and demand placements. Existing loans, deposits and queued claims continue to be serviced. Goods, share and branch policies remain separate."
 bfl_strategy_enable: "Delegate investments"
 bfl_strategy_enable_tip: "Authorize scored purchases of existing native loans, credit and cargo offers to eligible AI counterparties, and excess-cash demand placements. Low liquidity may list one owned sovereign bond at 98% of face; an accepted resale can realize a loss. Cargo uses your current Terms and ordinary consent and physical settlement. Sovereign borrowing, dividends, goods and monetary authority retain their separate policies. New business stops in resolution."
 bfl_strategy_idle: "Last review: retained liquidity"
 bfl_strategy_manual: "Investment mandate · manual"
 bfl_strategy_recall: "Last review: deposit recall requested"
 bfl_strategy_resale: "Last review: an owned bond is offered for liquidity"
 bfl_strategy_secondary_statement: "Automatic native-loan purchases: [Country.MakeScope.GetVariable('bfl_strategy_takeovers').GetValue|0] · Bond resale quotes: [Country.MakeScope.GetVariable('bfl_strategy_resales').GetValue|0]"
 bfl_strategy_secondary_tip: "Existing-loan purchases review at most twelve completed capital-branch clients. The borrower needs liquidity, peace, a nonnegative budget and at least 0.50 creditworthiness. Purchases retain 100 free cash, cap the acquisition premium at 25% of remaining principal and total borrower exposure at 25% of equity. Expected monthly margin must be at least 0.10 gold after the premium, a servicing allowance and conservative funding costs. This is an estimate; early repayment and default can still cause a loss. Low liquidity may quote one owned sovereign bond at 98% of face through a completed Stock Exchange. No resale proceeds are booked before funded buyer consent."
 bfl_strategy_statement: "Monthly reviews: [Country.MakeScope.GetVariable('bfl_strategy_reviewed').GetValue|0]/12  ·  Score: [Country.MakeScope.GetVariable('bfl_strategy_score').GetValue|2]\nCredit offers: [Country.MakeScope.GetVariable('bfl_strategy_offers').GetValue|0]  ·  Deposits placed: [Country.MakeScope.GetVariable('bfl_strategy_placements').GetValue|0]  ·  Recalls: [Country.MakeScope.GetVariable('bfl_strategy_recalls').GetValue|0]"
 bfl_strategy_title: "Investment mandate"
 bfl_strategy_title_tip: "A conservative monthly mandate. Review up to twelve credit candidates, twelve connected venture operators with four source markets each, or twelve deposit banks. At most one credit offer, cargo offer or 100-gold demand placement monthly. Credit and cargo offers cool down for three months. Cargo requires a quoted margin of at least 10% and one gold bank surplus, retains 500 free cash, and is capped at two active agreements and 25% equity. Quotes can change; losses remain possible. Protected cash, research, branches and profile permissions still apply."
 bfl_strategy_venture: "Last review: cargo partnership offered for consent"
 bfl_streamline_bank: "Streamline administration · 100 gold"
 bfl_streamline_bank_tip: "Pay 100 state gold once to reduce fixed bank operating expenses by 10%. The charter reform, Banking and Advanced Clearing provide additional reductions. This decision does not create bank profit."
 bfl_subscribe_bank: "Subscribe 100 gold of bank capital"
 bfl_subscribe_bank_act: "$bfl_subscribe_bank$"
 bfl_subscribe_bank_desc: "Funded from your own treasury after profile, age, research and registry checks. Principal is not bank profit. A bank capital subscription buys units at its current net asset value."
 bfl_subscribe_bank_effect_text: "$bfl_subscribe_bank$"
 bfl_subscribe_bank_effect_text_past: "$bfl_subscribe_bank$"
 bfl_suspend_command: "Suspend new deposits"
 bfl_suspend_command_tip: "#T Suspend new deposits#!\nStop accepting new deposits and the funding actions that require deposit acceptance. Existing accounts, interest obligations and withdrawal requests remain recorded. This control does not close the bank or forgive its debts."
 bfl_term_accept: "Accept these fixed terms"
 bfl_term_amount: "Term deposit"
 bfl_term_amount_desc: "Choose how much to deposit. Term deposits run for twelve months."
 bfl_term_amount_tip: "Choose a bank and an amount. Move treasury cash into an account. Interest and withdrawals belong to the depositor. The bank checks funds and terms again when you confirm."
 bfl_term_decline: "Keep the existing account"
 bfl_term_deposit: "Term Deposit"
 bfl_term_deposits_desc: "Merchants cannot always employ their money at once. By entrusting it to a banking house for an agreed term, they give the banker a steadier source of capital and receive compensation for surrendering immediate access to their funds."
 bfl_term_offer_1_desc: "Renew your matured [ROOT.GetCountry.MakeScope.GetVariable('bfl_deposit_offer_principal').GetValue|2] gold principal for 12 months at [ROOT.GetCountry.MakeScope.GetVariable('bfl_deposit_offer_rate').GetValue|%1] annually. Accrued interest stays owed separately. No new principal is transferred. This offer expires at month end; changed claims require a new offer."
 bfl_term_offer_1_title: "Renew matured term deposit"
 bfl_term_offer_2_desc: "Queue an early withdrawal of [ROOT.GetCountry.MakeScope.GetVariable('bfl_deposit_offer_principal').GetValue|2] gold principal after cancelling [ROOT.GetCountry.MakeScope.GetVariable('bfl_deposit_offer_penalty').GetValue|2] gold of accrued interest (at most 1% of principal). No principal penalty applies. Cash shortages remain owed in the withdrawal queue. This offer expires at month end; changed claims require a new offer."
 bfl_term_offer_2_title: "Early term withdrawal offer"
 bfl_term_service_1: "Renew the first matured term account"
 bfl_term_service_1_act: "$bfl_term_service_1$"
 bfl_term_service_1_desc: "Request a term servicing offer at the selected bank. Acceptance preserves unpaid claims and rechecks the lot generation."
 bfl_term_service_1_effect_text: "$bfl_term_service_1$"
 bfl_term_service_1_effect_text_past: "$bfl_term_service_1$"
 bfl_term_service_1_tip: "Selects your first eligible term lot. The bank presents fixed terms for explicit acceptance. Renewal requires current admission and term permissions; early exit and matured withdrawal remain available after relations or authority loss. Changed or expired quotes cannot execute."
 bfl_term_service_2: "Request early term withdrawal"
 bfl_term_service_2_act: "$bfl_term_service_2$"
