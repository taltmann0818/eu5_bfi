 bfl_facility_1_short: "Debt first"
 bfl_facility_1_tip: "Request custom bond financing for 60% of forecast monthly spending, capped at 100 gold and one issue per month. Skip draws when state cash reaches 500 gold or the bank or issuer lacks capacity."
