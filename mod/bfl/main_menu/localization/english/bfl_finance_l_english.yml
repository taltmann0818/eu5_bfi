 bfl_florentine_choice_cash_tt: "Receive 250 ducats. The banks retain their ownership, charters, buildings and accounts."
 bfl_florentine_choice_desc: "Beneath the shadow of the Signoria, the great banking houses have become powers in their own right. Their clerks weigh the promises of kings beside the bills of cloth merchants, and the credit of Florence travels wherever their factors keep a desk. Now the city must decide whether to bind one of these houses more closely to the public treasury. A charter would place its experience at our service, while a new palace would proclaim the bargain in stone. Yet some councillors would rather take a contribution today and leave the bankers to their own affairs."
