 bfl_cost_reductions: "#T Applicable reductions#!"
 bfl_cost_rounding: "Rounded to the nearest 0.01 gold. Research qualifies through the bank or its sovereign; each bonus applies once."
 bfl_cost_settlement_arrears: "Unpaid operating-expense liability"
 bfl_cost_settlement_due: "Last monthly expense assessed"
 bfl_cost_settlement_paid: "Last cash payment (including old arrears)"
 bfl_cost_title: "#T Monthly operating expenses#!"
 bfl_debt: "Native debt portfolio"
 bfl_debt_explanation: "Use the Bank: purchase native estate loan diplomatic action to select a debtor. Native Credit remains available above. Bond funding, resale and restructuring are development gated pending P03–P06; no ordinary loan substitutes for a bond."
 bfl_debt_facility: "Debt Facility"
 bfl_debt_resale: "Debt Resale"
 bfl_debt_resale_tip: "#T Debt resale#!\nTransfer a debt claim to an identified new holder for a funded price. Coupons and redemption must follow the new holder. Native claim-transfer execution is unavailable in this build."
 bfl_debt_restructuring: "Debt Restructuring"
 bfl_debt_restructuring_desc: "A debt that cannot be collected on its appointed day need not be worthless. Creditors may preserve more of their claims by agreeing to new terms than by pressing a distressed debtor into outright default."
 bfl_debt_tip: "#T Debt and credit#!\nPermissions for lending, underwriting, restructuring and debt transfers. Each row has its own research, specialization, liquidity and execution requirements. A lock means new origination is unavailable; it does not cancel existing claims."
 bfl_demand_deposit: "Demand Deposit"
 bfl_deposit_1: "Deposit 100 gold on demand"
 bfl_deposit_1_tip: "#T Demand deposit#!\nTransfer 100 state gold to your chartered bank. Its new-account annual offer is the displayed base rate plus a 1% charter premium. Demand interest is paid to your treasury monthly when funded, with cent carry; unpaid interest remains owed. Existing accounts keep their accepted rate. Withdraw repays principal and unpaid interest. Independent banks accept deposits through diplomacy at +50 opinion or better and offer the base rate."
 bfl_deposit_2: "Deposit 100 gold for 12 months"
 bfl_deposit_2_tip: "#T Term deposit#!\nTransfer 100 state gold to your chartered bank for twelve months. Its new-account annual offer is the displayed term rate plus a 1% charter premium. Interest accrues monthly and is paid with principal at maturity. Requires native Banking, the permitted age and a free account slot. Independent term accounts are available through diplomacy at +50 opinion or better."
 bfl_deposit_explanation: "Each account stores its accepted fixed annual rate. Changing the rate affects new accounts. Term accounts mature after 12 months. Withdrawal shortages remain liabilities and suspend new commitments."
 bfl_deposit_income_tip: "Demand interest actually paid this month by your chartered bank and independent banks. Unpaid interest remains owed. Principal withdrawals and capital contributions are excluded."
 bfl_deposit_interest: "Deposit Interest"
 bfl_deposit_policy_title: "Rates for new deposits"
 bfl_deposit_policy_title_tip: "#T Rates for new deposits#!\nChoose the annual interest rate accepted by new demand accounts.\n\nCurrent offer: [Country.MakeScope.GetVariable('bfl_demand_rate').GetValue|%2]\nTerm-account offer: [Country.MakeScope.GetVariable('bfl_term_rate').GetValue|%2]\n\nExisting accounts retain the rate agreed when they opened. Monthly credited interest increases the bank's liability and reduces its retained earnings; it does not move cash until paid."
 bfl_deposits: "Deposits and rates"
 bfl_deposits_label: "Deposit claims"
 bfl_dev_notice: "Development build: native bond funding, holder payment routing, goods execution and receipt attribution require the documented in-game probes. Locked adapters never move cash. See docs/acceptance.md before testing."
 bfl_distress: "Distress and development gates"
 bfl_distribution_title: "Profit distribution"
 bfl_distribution_title_tip: "#T Monthly share dividends#!\nSovereign dividend = sovereign shares × ((monthly bank net income × payout ratio) / shares outstanding).\n\nPayout ratio: [Country.MakeScope.GetVariable('bfl_payout_ratio').GetValue|%0]\nNet income after costs and carried losses: [Country.MakeScope.GetVariable('bfl_monthly_net_income').GetValue|2]@gold!\nSovereign shares: [Country.MakeScope.GetVariable('bfl_state_units').GetValue|2]\nShares outstanding: [Country.MakeScope.GetVariable('bfl_total_units').GetValue|2]\nLast total dividends: [Country.MakeScope.GetVariable('bfl_dividend_paid').GetValue|2]@gold!\nLast sovereign dividend: [Country.MakeScope.GetVariable('bfl_state_dividend_paid').GetValue|2]@gold!\n\nThe sovereign initially owns 100%. New bank subscriptions raise capital and dilute ownership. Cash, capital and outstanding obligations cap the funded payout. Negative income pays no dividend; retained profit is not counted again next month. Principal, deposits, subscriptions and borrowing are excluded."
 bfl_dividend_explanation: "Monthly net income after deposit interest, operating expenses and carried losses funds dividends. Each owner receives owned shares multiplied by the funded payout per outstanding share. Retained earnings are not distributed again next month."
 bfl_equity_debt: "Bank equity & debt"
 bfl_equity_debt_tip: "#T Bank equity and debt#!\nUp to twelve actual monthly settlement snapshots. Green is assets minus liabilities; red is the bank's total liabilities. Both use the same automatically scaled gold axis, including negative equity. Samples run from oldest on the left to latest on the right. Hover over a sample for its value and accounting month. State loans are not included in this bank history."
 bfl_equity_label: "Bank equity"
 bfl_equity_label_tip: "#T Bank equity#!\nThe residual value belonging to the bank's owners after its obligations.\n\nAssets: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_assets')|2]@gold!\nLess total debt: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_liabilities')|2]@gold!\nEquity: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_equity')|2]@gold!\n\nRecorded state units: [Country.MakeScope.GetVariable('bfl_state_units').GetValue|2]\nTotal ownership units: [Country.MakeScope.GetVariable('bfl_total_units').GetValue|2]\nCapital headroom: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_capital_headroom')|2]@gold!\n\nNegative equity means insolvency. Capital headroom is equity above 10% of assets, with a minimum of zero; distributions are limited by both this headroom and available cash. Equity is not the amount that can immediately be withdrawn."
 bfl_establish_chartered_bank: "Establish a State Chartered Bank"
 bfl_establish_chartered_bank.a: "Select the existing State Bank"
 bfl_establish_chartered_bank_desc: "Convert one existing State Bank in place and gain Banking Traditions when the charter is completed. The current-age investment of 500 / 750 / 1,000 / 1,500 / 2,000 / 3,000 gold is transferred to its treasury as state equity. You must own your capital market. Select a bank before any payment or research occurs."
 bfl_facility_0: "Facility off"
 bfl_facility_0_short: "Off"
 bfl_facility_0_tip: "Turn off the standing debt facility mandate. No scheduled bank funding is requested. Existing obligations remain payable."
 bfl_facility_1: "Debt first facility"
 bfl_facility_1_short: "Debt first"
 bfl_facility_1_tip: "Record a debt-first funding mandate for the state. Native bank-backed bond execution is unavailable, so this currently records policy without issuing debt or moving gold."
 bfl_facility_2: "Buffer facility"
 bfl_facility_2_short: "Buffer"
 bfl_facility_2_tip: "Record a buffer mandate to fund forecast cash shortfalls. Native bank-backed bond execution is unavailable, so this currently records policy without issuing debt or moving gold."
 bfl_facility_tip: "Monthly funding actually received. Native bond execution remains unavailable in this development build; an unfunded mandate pays zero."
 bfl_facility_title: "Debt facility mandate"
 bfl_facility_title_tip: "#T Debt facility mandate#!\nThe state's standing instruction for bank-backed borrowing. Off requests no scheduled borrowing. Debt first prioritizes debt funding; Buffer requests funding for a forecast cash shortfall.\n\nLast requested: [Country.MakeScope.GetVariable('bfl_facility_requested').GetValue|2]@gold!\nLast funded: [Country.MakeScope.GetVariable('bfl_facility_paid').GetValue|2]@gold!\n\nThe native bond funding connection is unavailable in this build. These buttons record the mandate only; they do not issue a loan, sell a bond or move gold. A selected mandate therefore pays zero until execution is available."
 bfl_finance.100.desc: "Choose one permanent specialization. Both serve sovereign credit and deposits. Merchant Finance develops commodity and corporate credit instruments; Overseas Investment develops commenda and company equity. Research and age gates continue to apply."
 bfl_finance.100.merchant: "Merchant Finance"
 bfl_finance.100.overseas: "Overseas Investment"
 bfl_finance.100.title: "The Bank’s Specialization"
 bfl_finance.110.bank_01: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_candidate_01').GetCountry.GetName]"
 bfl_finance.110.bank_02: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_candidate_02').GetCountry.GetName]"
 bfl_finance.110.bank_03: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_candidate_03').GetCountry.GetName]"
 bfl_finance.110.bank_04: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_candidate_04').GetCountry.GetName]"
 bfl_finance.110.bank_05: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_candidate_05').GetCountry.GetName]"
 bfl_finance.110.bank_06: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_candidate_06').GetCountry.GetName]"
 bfl_finance.110.bank_07: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_candidate_07').GetCountry.GetName]"
 bfl_finance.110.bank_08: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_candidate_08').GetCountry.GetName]"
 bfl_finance.110.desc: "The investment buys new state equity without confiscating the bank’s existing capital. Conversion preserves the bank’s country identity. Closing this selection transfers no money. Up to eight eligible direct subjects are listed."
 bfl_finance.110.title: "Choose the State Bank"
 bfl_finance_title: "Banking & Finance"
 bfl_financial_advance: "Banking advance"
 bfl_financial_advance_desc: "Financial knowledge for independent banking houses and state-chartered banks."
 bfl_free_cash_label: "Available cash"
 bfl_funded_bill_button: "Funded payment bill · 100 gold"
 bfl_funding_tab: "Funding & Debt"
 bfl_funding_title: "Deposits & capital"
 bfl_funding_title_tip: "#T Deposits and capital#!\nA deposit transfers state cash to the bank and creates a repayable claim. A capital subscription purchases ownership units and can lose value. Both transfer existing gold; neither counts as bank profit."
 bfl_goods: "Goods and custody · Merchant Finance"
 bfl_goods_explanation: "Funded native inventory, backed receipts and forwards require Merchant Finance, their advances and P09 execution/custody verification. Encumbered goods cannot back a second claim."
 bfl_goods_tip: "#T Goods and trade#!\nMerchant Finance instruments involving inventory, receipts, future delivery and margin. Recorded permission does not create goods or a trade route; physical execution is required."
 bfl_history_empty: "History begins at the next monthly settlement."
 bfl_investment_tab: "Lending & Investments"
 bfl_investment_title: "Credit & investments"
 bfl_liabilities_label: "Total debt"
 bfl_liabilities_label_tip: "#T Total debt#!\nObligations recorded in the bank's accounts. This is separate from your state's native loans and bonds.\n\nDeposit principal: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_deposit_principal')|2]@gold!\nCredited deposit interest: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_deposit_interest')|2]@gold!\nNotes outstanding: [Country.MakeScope.GetVariable('bfl_notes_outstanding').GetValue|2]@gold!\nOther payables: [Country.MakeScope.GetVariable('bfl_other_payables').GetValue|2]@gold!\nTotal: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_liabilities')|2]@gold!\n\nQueued withdrawals of [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_withdrawals_due')|2]@gold! are already part of deposit claims and are not added a second time."
 bfl_liquidity_facilities: "Liquidity Facilities"
 bfl_liquidity_facilities_desc: "Even a solvent banking house may be unable to meet every demand for coin at once. Temporary advances against sound assets can bridge this shortage, provided that assistance does not conceal losses that the institution cannot bear."
 bfl_liquidity_warning: "Bank liquidity requires attention"
 bfl_liquidity_warning_desc: "Your bank has queued withdrawals or inadequate capital. Open Economy → Banking & Finance to review deposits and recapitalization."
 bfl_loan_button: "Take over loan"
 bfl_log_charter: "Chartered and capitalized a State Bank for"
 bfl_margining: "Margining"
 bfl_margining_and_risk_management: "Margining And Risk Management"
 bfl_margining_and_risk_management_desc: "Merchants who promise future deliveries face changing prices long before their contracts mature. Requiring additional security as exposures grow gives bankers a means of containing losses before an unfavorable market becomes a default."
 bfl_margining_tip: "#T Margin and risk management#!\nRequire collateral and variation margin against changing commodity exposure. Requires Margining and Risk Management research, Merchant Finance and the Revolutions age. Goods-backed margin execution is unavailable in this build."
 bfl_monetary: "Monetary policy and liquidity"
 bfl_monetary_explanation: "Bills precede sovereign notes. Notes require an authorized charter, Absolutism research and backing that excludes note-sale cash. Secured liquidity and clearing have later research and adapter gates."
 bfl_monetary_tip: "#T Monetary instruments#!\nLater-age permissions for sovereign notes, secured liquidity, clearing and public support. Each requires its own authorization, backing and operating conditions."
 bfl_native_credit_label: "Loan portfolio"
 bfl_native_tab: "State loans"
 bfl_native_takeover: "Native Takeover"
 bfl_no_automatic_tribute: "No automatic charter tribute"
 bfl_no_automatic_tribute_cost_modifier: "Automatic charter tribute cost"
 bfl_no_bank: "Charter an existing State Bank through Decisions, or play an independent banking country. Your country must own its capital market to charter a bank."
 bfl_offer_bank_shares: "Offer new bank shares"
 bfl_offer_bank_shares_tip: "Allow other banks and countries to subscribe 100 gold at the bank's current net asset value. New shares are issued only when paid for; existing owners are diluted. Native Banking research and positive equity remain required."
 bfl_operating_costs: "Monthly operating expenses"
 bfl_operating_costs_tip: "Fixed monthly costs scale with active deposit accounts, contracts, branches and asset classes. The State Chartered Bank reform reduces costs by 5%, Banking by 10%, Advanced Clearing by 15%, and streamlined administration by 10%. Unpaid costs remain liabilities and block dividends."
 bfl_overview: "Accounts and specialization"
 bfl_overview_hint: "Hover a donut segment for ownership or assets by counterparty."
 bfl_payout_0: "Retain profits"
 bfl_payout_0_short: "Retain"
 bfl_payout_0_tip: "Retain all eligible realized profit. No new dividend is paid under this policy; retained profit supports liquidity and equity."
 bfl_payout_25: "25% payout"
 bfl_payout_25_short: "25%"
 bfl_payout_25_tip: "Allocate up to 25% of eligible realized profit to dividends after losses. Available cash, capital headroom and recorded ownership still limit payment."
 bfl_payout_50: "50% payout"
 bfl_payout_50_short: "50%"
 bfl_payout_50_tip: "Allocate up to 50% of eligible realized profit to dividends after losses. Available cash, capital headroom and recorded ownership still limit payment."
 bfl_place_deposit_1: "Open a 100 gold demand deposit"
 bfl_place_deposit_1_desc: "Independent banks require an opinion of at least +50 toward you to open an account. Your chartered bank offers an extra 1% annual interest. Demand interest is paid monthly when funded; unpaid interest stays owed. Falling relations never prevent withdrawal of your own matured claims."
 bfl_place_deposit_2: "Open a 100 gold term deposit"
 bfl_place_deposit_2_desc: "Independent banks require an opinion of at least +50 toward you to open an account. Your chartered bank offers an extra 1% annual interest. Demand interest is paid monthly when funded; unpaid interest stays owed. Falling relations never prevent withdrawal of your own matured claims."
 bfl_probe_P03: "Development gate: P03 must be measured in game before this adapter can execute."
 bfl_probe_P04: "Development gate: P04 must be measured in game before this adapter can execute."
 bfl_probe_P05: "Development gate: P05 must be measured in game before this adapter can execute."
 bfl_probe_P06: "Development gate: P06 must be measured in game before this adapter can execute."
 bfl_probe_P07: "Development gate: P07 must be measured in game before this adapter can execute."
 bfl_probe_P09: "Development gate: P09 must be measured in game before this adapter can execute."
 bfl_probe_P10: "Development gate: P10 must be measured in game before this adapter can execute."
 bfl_probe_P11: "Development gate: P11 must be measured in game before this adapter can execute."
 bfl_profile_0: "Choose a specialization"
 bfl_profile_1: "Merchant Finance"
 bfl_profile_2: "Overseas Investment"
 bfl_project_security: "Project Security"
 bfl_project_security_desc: "Distant enterprises are difficult for their financiers to oversee. Claims upon their assets and proceeds, set down before capital is advanced, give investors a means of protecting their interests when a venture goes astray."
 bfl_project_security_tip: "#T Project security#!\nSecure a venture against identifiable project claims. Requires Project Security research, Overseas Investment and the Absolutism age or later. Native project collateral execution is unavailable in this build."
 bfl_protected_label: "Protected cash"
 bfl_public_backstop: "Public Backstop"
 bfl_public_backstop_tip: "#T Public financial backstop#!\nAuthorize chartered financial support under Public Financial Backstops research in the Revolutions age. This row reports permission; it does not supply a free guarantee, mint gold or execute a rescue. A funded support transaction must be available separately."
 bfl_public_financial_backstops: "Public Financial Backstops"
 bfl_public_financial_backstops_desc: "When the failure of a great banking house threatens public credit and commerce, the government may intervene. Such support binds the resources of the treasury to the bank's recovery and makes the terms of assistance a matter of public policy."
 bfl_purchase_funded_bill: "Purchase a funded payment bill"
 bfl_purchase_funded_bill_desc: "Funded from your own treasury after profile, age, research and registry checks. Principal is not bank profit. A bank capital subscription buys units at its current net asset value."
 bfl_purchase_native_loan: "Bank: purchase native estate loan"
 bfl_purchase_native_loan_desc: "Your bank is the buyer. The native price and eligibility apply, with additional free cash and capital checks. Banking estates receive the purchase price and the same loan changes owner. Bonds and already country-held loans are excluded."
 bfl_purchase_native_loan_tip: "#T Take over loan for the bank#!\nSelect another sovereign with eligible estate debt. Your chartered bank pays the native purchase price to that country's banking estates and becomes the creditor of the same loan. Principal and interest receivables belong to the bank; the sovereign earns lending income through its share dividends. Banks also purchase one eligible loan autonomously each month when reserves and capital permit. Bonds and already country-held loans are excluded."
 bfl_rate_0: "No demand interest for new accounts"
 bfl_rate_0_short: "0%"
 bfl_rate_0_tip: "Offer 0% annual interest on new demand deposits. Existing demand accounts and the separate term-account rate remain at their accepted rates."
 bfl_rate_1: "1% annual demand rate for new accounts"
 bfl_rate_1_short: "1%"
 bfl_rate_1_tip: "Offer 1% annual interest on new demand deposits. Interest is credited monthly with cent carry. Existing demand accounts keep their accepted rates."
 bfl_rate_2: "2% annual demand rate for new accounts"
 bfl_rate_2_short: "2%"
 bfl_rate_2_tip: "Offer 2% annual interest on new demand deposits. Interest is credited monthly with cent carry. Existing demand accounts keep their accepted rates."
 bfl_recapitalize_command: "Recapitalize with 100 gold"
 bfl_recapitalize_command_tip: "#T Recapitalize with 100 gold#!\nTransfer 100 gold from the controlling state's treasury to the chartered bank. The rescue contribution adds 100 state ownership units and paid-in capital. It is not bank revenue. Requires the live charter controller and at least 100 state gold."
 bfl_redeem_funded_bills: "Redeem matured funded bills"
 bfl_redeem_funded_bills_desc: "Redeem only bills recorded for your country. The same bill cannot be redeemed twice. Unfunded claims are retained."
 bfl_request_deposit_withdrawal: "Withdraw matured deposits"
 bfl_request_deposit_withdrawal_desc: "Withdraw your own matured claims. Unpaid amounts remain queued liabilities of the bank. No withdrawal can exceed the recorded principal plus credited interest."
 bfl_safeguards_title: "Liquidity & safeguards"
 bfl_safeguards_title_tip: "#T Liquidity and safeguards#!\nAvailable bank cash: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_free_cash')|2]@gold!\nProtected cash requirement: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_protected_cash')|2]@gold!\nQueued withdrawals: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_withdrawals_due')|2]@gold!\n\nRecapitalization supplies state capital. Suspending deposits stops new account funding while preserving existing obligations."
 bfl_secured_liquidity: "Secured Liquidity"
 bfl_secured_liquidity_tip: "#T Secured liquidity#!\nObtain short-term cash against eligible pledged assets. Requires Liquidity Facilities research and the Absolutism age or later. Native collateral and refinancing execution are unavailable in this build."
 bfl_select_profile: "Choose pending specialization"
 bfl_select_profile_tip: "#T Bank specialization#!\nOpen the specialization choice if this bank has not yet chosen a permanent profile. Merchant Finance and Overseas Investment open different research paths. A completed specialization cannot be replaced by this button."
 bfl_share_01_tip: "#T [Country.MakeScope.GetVariable('bfl_shr_01_party').GetCountry.GetName]#!\nShares: [Country.MakeScope.GetVariable('bfl_shr_01_units').GetValue|2]\nOwnership: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_share_fraction_01')|%2]"
 bfl_share_02_tip: "#T [Country.MakeScope.GetVariable('bfl_shr_02_party').GetCountry.GetName]#!\nShares: [Country.MakeScope.GetVariable('bfl_shr_02_units').GetValue|2]\nOwnership: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_share_fraction_02')|%2]"
 bfl_share_03_tip: "#T [Country.MakeScope.GetVariable('bfl_shr_03_party').GetCountry.GetName]#!\nShares: [Country.MakeScope.GetVariable('bfl_shr_03_units').GetValue|2]\nOwnership: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_share_fraction_03')|%2]"
