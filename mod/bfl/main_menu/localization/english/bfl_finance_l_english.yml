 bfl_clearing_tip: "#T Advanced clearing#!\nSettle mutual payment obligations through a funded clearing process. Requires Advanced Clearing research and the Revolutions age. Native clearing execution is unavailable in this build."
 bfl_close_bank_offering: "Close share offering"
 bfl_close_bank_offering_tip: "Stop accepting external subscriptions. Existing ownership and dividend rights remain in force. The sovereign can still recapitalize its own bank."
 bfl_close_bond_offer: "Close bond offering"
 bfl_close_bond_offer_tip: "Withdraw the current secondary offering. Outstanding debt and coupons remain owed."
 bfl_collateral: "Collateral"
 bfl_collateralization: "Collateralization"
 bfl_collateralization_desc: "Trust is strengthened when a promise is supported by property. By recording a pledge and the creditor's rights over it, bankers can lend against assets that may be recovered if the debtor fails to honor the agreement."
 bfl_commenda: "Commenda"
 bfl_commenda_cargo: "Commenda: ship discovered-area cargo"
 bfl_commenda_cargo_act: "Ship discovered-area cargo"
 bfl_commenda_cargo_desc: "Select the sponsored operator and a ten-unit cargo from a market centered in or bordering its discovered area. Only unused accepted funding can pay its native purchase cost. No discovery payout or unrelated trade attribution."
 bfl_commenda_cargo_effect_text: "Ship discovered-area cargo"
 bfl_commenda_cargo_effect_text_past: "Ship discovered-area cargo"
 bfl_commenda_cargo_tip: "Requires the accepted expedition’s verified discovery, remaining authorization, native market access and stock. Operator or political controller commands the voyage."
 bfl_commenda_desc: "A merchant undertaking a voyage may possess the skill to trade without the capital to fill a ship. The commenda joins a financier's money to a traveling partner's labor, sharing the venture's proceeds according to their agreement."
 bfl_commenda_expedition: "Fund a named expedition"
 bfl_commenda_expedition_act: "Fund a named expedition"
 bfl_commenda_expedition_desc: "Use an accepted venture operator’s native exploration. Native preparation, crew costs and outcome apply. The bank does not gain political control."
 bfl_commenda_expedition_effect_text: "Fund a named expedition"
 bfl_commenda_expedition_effect_text_past: "Fund a named expedition"
 bfl_commenda_expedition_tip: "Choose an operator, area, launch port and explorer before consent. Funding pays only actual native preparation cost. Preparation is non-refundable. Remaining authorization may finance cargo from a market centered in or bordering the discovered area; only its measured sale proceeds can pay returns."
 bfl_commenda_tip: "#T Commenda#!\nCommit capital to a voyage or trade venture in return for a defined profit share. Requires Commenda research, Overseas Investment and the Discovery age or later. Native project execution is unavailable in this build."
 bfl_commercial_bill: "Commercial Bill"
 bfl_commercial_bills: "Commercial Bills"
 bfl_commercial_bills_desc: "Carrying coin between commercial centers is costly and dangerous. Written bills allow merchants to settle obligations through trusted banking houses, making the reputation of the issuer an instrument of trade."
 bfl_commodity_forward: "Commodity Forward"
 bfl_commodity_forward_tip: "#T Commodity forward#!\nAgree a funded future goods delivery. Requires Commodity Forwards research, Merchant Finance and the Absolutism age or later. Physical delivery and settlement are unavailable in this build."
 bfl_commodity_forwards: "Commodity Forwards"
 bfl_commodity_forwards_desc: "A harvest, shipment or workshop order may be sold before its delivery. Agreements that fix a future price help merchants arrange their affairs despite the uncertainty of distant markets and changing seasons."
 bfl_commodity_inventory: "Commodity Inventory"
 bfl_commodity_inventory_tip: "#T Commodity inventory#!\nFinance goods held for trade. Requires Commodity Investments research, Merchant Finance and the Discovery age or later. Physical goods purchase, custody and delivery are unavailable in this build."
 bfl_commodity_investments: "Commodity Investments"
 bfl_commodity_investments_desc: "Bankers who finance trade can also hold the goods themselves. Grain, wool and other merchandise become investments whose value depends upon storage, transport and the changing needs of distant markets."
 bfl_company_crew: "Transfer 250 sailors to company"
 bfl_company_crew_desc: "Manage a native company you currently control. Funded capital is excluded from operating income."
 bfl_company_crew_tip: "Manage a native company you currently control. Capital contributions are financing. Company distributions use retained trade earnings after native costs, carried losses, debt reserves and cash buffers. The political overlord and financial owner are separate."
 bfl_company_equity: "Company Equity"
 bfl_company_equity_desc: "Large trading enterprises require fortunes that few merchants can supply alone. Dividing ownership among investors allows a company to assemble lasting capital while distributing the risks and rewards of its undertakings."
 bfl_company_equity_tip: "#T Company equity#!\nSubscribe capital for an ownership share in a recognized company. Requires Company Equity research, Overseas Investment and the Reformation age or later. Native company issuance and holder settlement are unavailable in this build."
 bfl_company_expedition: "Company: prepare native exploration"
 bfl_company_expedition_desc: "Use the company treasury, sailors and explorer to prepare a sea exploration at a company facility. Native preparation and progress apply. Discovery produces no cash or investment profit."
 bfl_company_expedition_tip: "Requires a trade and exploration mandate, Mapmaking, an eligible company explorer, sailors and available venture budget. Native preparation time applies."
 bfl_company_exploration_capacity: "Company exploration establishment"
 bfl_company_exploration_capacity_desc: "Capacity for 500 sailors while an exploration mandate is authorized. Sailors must come from the company or a funded transfer from its political controller."
 bfl_company_explore: "Company mandate: trade and exploration"
 bfl_company_explore_desc: "Manage a native company you currently control. Funded capital is excluded from operating income."
 bfl_company_explore_tip: "Manage a native company you currently control. Capital contributions are financing. Company distributions use retained trade earnings after native costs, carried losses, debt reserves and cash buffers. The political overlord and financial owner are separate."
 bfl_company_fund: "Contribute 100 gold to company capital"
 bfl_company_fund_desc: "Manage a native company you currently control. Funded capital is excluded from operating income."
 bfl_company_fund_tip: "Manage a native company you currently control. Capital contributions are financing. Company distributions use retained trade earnings after native costs, carried losses, debt reserves and cash buffers. The political overlord and financial owner are separate."
 bfl_company_list_equity: "Authorize company equity listing"
 bfl_company_list_equity_desc: "Authorize paid NAV primary subscriptions and secondary trading. Bank acquisitions require Overseas Investment, Company Equity research and the completed exchange for secondary trades. Political overlordship stays unchanged."
 bfl_company_list_equity_tip: "The live political controller authorizes market participation. No cash or units are granted."
 bfl_company_native_channels: "Native HQ income and subject payments remain in the native budget. Company equity markets, bank corporate credit and commenda use their separate research and delivery gates."
 bfl_company_panel: "Operating companies"
 bfl_company_panel_tip: "Company treasuries and political control remain separate from bank accounts. Native HQ owner income, HQ direct-overlord income and native subject payments remain with their native recipients. Only executed retained trade net of native costs can fund an additional owner distribution. Capital and discovery are excluded."
 bfl_company_retain: "Company mandate: retain earnings"
 bfl_company_retain_desc: "Manage a native company you currently control. Funded capital is excluded from operating income."
 bfl_company_retain_tip: "Manage a native company you currently control. Capital contributions are financing. Company distributions use retained trade earnings after native costs, carried losses, debt reserves and cash buffers. The political overlord and financial owner are separate."
 bfl_company_route: "Company: open native trade route"
 bfl_company_route_desc: "Open one company-owned native route using 0.1 merchant capacity. Requires a trade mandate, available operating budget, native market access, surplus and capacity. Maximum one commanded route per company per month. Native AI retains its own trading behavior."
 bfl_company_route_tip: "Select the company, source market, destination market, merchant market and goods. Native trade costs are charged by the engine."
 bfl_company_select: "Select operating company"
 bfl_company_select_desc: "Inspect a native company under your current political control."
 bfl_company_select_tip: "Select a native company you currently control. Selection and statement display do not move cash or close a month."
 bfl_company_statement: "Cash: [Country.GetFixedPointCurrencyValue('gold')|2]@gold!   Reserved buffer: [Country.MakeScope.GetVariable('bfl_company_buffer').GetValue|2]@gold!\nNative trade: [Country.MakeScope.GetVariable('bfl_company_trade_receipts').GetValue|2]   Net budget: [Country.MakeScope.GetVariable('bfl_company_native_net').GetValue|2]\nEligible earnings: [Country.MakeScope.GetVariable('bfl_company_verified_profit').GetValue|2]   Paid to owner: [Country.MakeScope.GetVariable('bfl_company_dividend').GetValue|2]@gold!\nFacilities: [Country.MakeScope.GetVariable('bfl_company_facility_count').GetValue|0]   Routes: [Country.MakeScope.GetVariable('bfl_company_route_count').GetValue|0]   Executed volume: [Country.MakeScope.GetVariable('bfl_company_volume').GetValue|2]\nTrade budget: 50   Reinvestment reserve: 100   Venture budget: 100   Owner payout: 25%"
 bfl_company_trade: "Company mandate: trade"
 bfl_company_trade_desc: "Manage a native company you currently control. Funded capital is excluded from operating income."
 bfl_company_trade_tip: "Manage a native company you currently control. Capital contributions are financing. Company distributions use retained trade earnings after native costs, carried losses, debt reserves and cash buffers. The political overlord and financial owner are separate."
 bfl_corporate_credit: "Corporate Credit"
 bfl_corporate_credit_desc: "As commercial enterprises outgrow a single voyage or season, their need for credit becomes more enduring. Banking houses learn to judge the resources and prospects of an enterprise as well as the standing of its individual merchants."
 bfl_corporate_credit_tip: "#T Corporate credit#!\nLend to a recognized trade company. Requires Corporate Credit research, Merchant Finance and the Reformation age or later. New native company-loan execution is unavailable in this build."
 bfl_cost_accounts: "Deposit accounts: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_operating_accounts_count')|0] × 0.05"
