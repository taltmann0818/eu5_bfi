 bfl_warehouse_receipt: "Warehouse Receipt"
 bfl_warehouse_receipt_tip: "#T Warehouse receipt#!\nIssue a claim against identifiable stored goods. Requires Warehouse Receipts research, Merchant Finance and the Absolutism age or later. Verified storage and goods execution are unavailable in this build."
 bfl_warehouse_receipts: "Warehouse Receipts"
 bfl_warehouse_receipts_desc: "Goods kept in a reputable warehouse can support commerce without being moved at every sale. A receipt establishes a claim to the stored merchandise, allowing its owner to obtain finance while the goods remain in custody."
 bfl_welserhaus: "Welserhaus"
 bfl_welserhaus_desc: "From this Augsburg house, factors send their instructions along the roads and sea lanes of commerce. Its established credit lowers the owner’s borrowing interest by half a percentage point, while its network increases merchant capacity and trade income by ten percent."
 bfl_welserhaus_maintenance: "Welserhaus administration"
 bfl_wisselbank_founding_tt: "Establish Wisselbank as our Chartered Bank, funded from available treasury cash up to the standard charter investment."
 bfl_wisselbank_name: "Wisselbank"
 bfl_withdraw: "Withdraw matured state deposits"
 bfl_withdraw_tip: "#T Withdraw matured state deposits#!\nRequest repayment of your state's demand accounts and matured term accounts. The bank pays principal and credited interest from available cash. Unpaid amounts remain recorded in the withdrawal queue and suspend new business. Foreign accounts and unmatured term deposits cannot be withdrawn by this action."
 bfl_workout_decline: "Keep the full claim"
 bfl_workout_desc: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_workout_bank').GetCountry.GetName] proposes terms for your deposit of [ROOT.GetCountry.MakeScope.GetVariable('bfl_workout_claim').GetValue|2] gold. You may waive 20% of the remaining claim, convert the entire claim into newly issued shares at pre-conversion tangible NAV, or retain your claim. Conversion requires positive NAV and shareholder capacity and is unavailable to bank creditors. Creditor pool [ROOT.GetCountry.MakeScope.GetVariable('bfl_workout_pool').GetValue|0]: 0 treasury, 1 burghers, 2 nobles, 3 clergy, 4 peasants. Estate terms require that estate's enacted Workout Mandate. The quote expires this month; recovery or a change of management invalidates it."
