 bfl_cost_branches: "Branches: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_operating_branches_count')|0] × 0.50"
 bfl_cost_constitution: "Banking constitution"
 bfl_cost_constitution_factor: "Administration multiplier"
