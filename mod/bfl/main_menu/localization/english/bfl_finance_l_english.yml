 bfl_margining: "Margining"
 bfl_margining_and_risk_management: "Margining And Risk Management"
 bfl_margining_and_risk_management_desc: "Merchants who promise future deliveries face changing prices long before their contracts mature. Requiring additional security as exposures grow gives bankers a means of containing losses before an unfavorable market becomes a default."
 bfl_margining_tip: "#T Margin and risk management#!\nRequire collateral and variation margin against changing commodity exposure. Requires Margining and Risk Management research, Merchant Finance and the Revolutions age. Goods-backed margin execution is unavailable in this build."
 bfl_market_company_requirement: "Company shares require Overseas Investment and Company Equity research. Bank shares use Share Dealing."
 bfl_market_funds_requirement: "Your bank can afford shares within its cash, capital and ownership limits."
 bfl_market_holder_requirement: "The issuer has a free shareholder slot or already records your buying bank as a shareholder."
 bfl_market_portfolio_requirement: "Your buying bank has a free portfolio slot or already holds this security."
 bfl_market_sort_price: "Sort by price per share"
 bfl_mediceo_maintenance: "Banco Mediceo administration"
 bfl_medici_decline: "Our treasury has other demands."
 bfl_medici_desc: "From their great stone palaces, the Medici direct a web of credit that reaches across Italy and beyond the Alps. A permanent house in Milan would place their clerks and reserves close to our court. In return for a charter and a subscription of two thousand ducats, the bank offers to bind its fortunes to our public credit, while keeping its existing accounts and obligations."
 bfl_medici_fund: "Subscribe 2,000 ducats and grant the charter."
 bfl_medici_funding_tt: "Transfer 2,000 ducats to the Medici Bank and make it our Chartered Bank. Establish the Banco Mediceo in Milan and completed Bank Branches in Milan and our current capital. Existing bank loans and obligations are preserved. A bank already chartered by another sovereign cannot be taken over."
 bfl_medici_house_only: "Welcome the banking house without a public subscription."
 bfl_medici_house_only_tt: "Establish the Banco Mediceo building in Milan without funding or chartering the Medici Bank."
 bfl_medici_title: "The Banco Mediceo in Milan"
 bfl_mendes_spice_house: "The House of Mendes"
 bfl_mendes_spice_house_desc: "Across the seas, the factors of the Mendes household bind the spice ports to the counting houses of Europe. Their correspondence opens markets for pepper and cloves, while the steady movement of bills and cargo sustains a commerce that looks beyond the barriers of princes. By granting this house a lasting constitution, we place its experience at the service of a freer exchange."
 bfl_monetary: "Monetary policy and liquidity"
 bfl_monetary_explanation: "Exchange specie for reserved notes with sovereign authority and a completed Central Bank. Discount third-bank bills after Collateralization and Liquidity Facilities; Revolutions adds funded member netting and capped public secured support. Accepted rates stay fixed."
 bfl_monetary_tip: "#T Monetary instruments#!\nLater-age permissions for sovereign notes, secured liquidity, clearing and public support. Each requires its own authorization, backing and operating conditions."
 bfl_money_accept: "Toggle acceptance & discounts"
 bfl_money_accept_tip: "Notes exchange specie for a fully reserved claim. Acceptance is voluntary. Discounts advance 75 gold against a 100-gold third-bank bill. Clearing settles matching matured bills only when every member can pay its net debit. Existing claims survive lost authority and buildings."
 bfl_money_acceptance_action: "Change voluntary acceptance"
 bfl_money_authorize: "Authorize notes"
 bfl_money_authorize_tip: "The sovereign controller authorizes its chartered bank. A sovereign-owned completed Central Bank is required in the current capital. New issuance also requires the issuer’s capital Bank Branch and note research."
 bfl_money_clear: "Settle member bills"
 bfl_money_clear_open: "Clearing admission"
 bfl_money_clear_open_tip: "Open or close admission to your clearing group. Requires Revolutions, Clearing House and Advanced Clearing research, and a completed Clearing House owned by the bank or its live sovereign. Four members maximum."
 bfl_money_clear_tip: "Settle matching matured member bills once this month. Each member must cover its net debit while protecting other reserves. One short member preserves the entire batch. Pledged and nonmember claims are excluded."
 bfl_money_empty: "No notes in circulation. Monetary research, authority and completed buildings unlock new services."
 bfl_money_empty_tip: "Notes exchange specie for a fully reserved claim. Acceptance is voluntary. Discounts advance 75 gold against a 100-gold third-bank bill. Clearing settles matching matured bills only when every member can pay its net debit. Existing claims survive lost authority and buildings."
 bfl_money_help: "Notes exchange specie for a fully reserved claim. Acceptance is voluntary. Discounts advance 75 gold against a 100-gold third-bank bill. Clearing settles matching matured bills only when every member can pay its net debit. Existing claims survive lost authority and buildings."
 bfl_money_help_tip: "Notes exchange specie for a fully reserved claim. Acceptance is voluntary. Discounts advance 75 gold against a 100-gold third-bank bill. Clearing settles matching matured bills only when every member can pay its net debit. Existing claims survive lost authority and buildings."
 bfl_money_hint: "Hover for reserves, holders and settlement"
 bfl_money_hint_tip: "Notes exchange specie for a fully reserved claim. Acceptance is voluntary. Discounts advance 75 gold against a 100-gold third-bank bill. Clearing settles matching matured bills only when every member can pay its net debit. Existing claims survive lost authority and buildings."
 bfl_money_leave: "Leave clearing"
 bfl_money_leave_tip: "Notes exchange specie for a fully reserved claim. Acceptance is voluntary. Discounts advance 75 gold against a 100-gold third-bank bill. Clearing settles matching matured bills only when every member can pay its net debit. Existing claims survive lost authority and buildings."
 bfl_money_lending_rate: "New lending base"
 bfl_money_lending_rate_tip: "Cycle the annual base for future ordinary loans through 3%, 6% and 9%. Borrower adjustments still apply. Accepted loans keep their rates."
 bfl_money_notes: "Acquire 100 in notes"
 bfl_money_notes_tip: "Requires Absolutism, Central Banking and Sovereign Banknotes research, live sovereign authorization, the issuer’s completed Bank Branch and the sovereign’s completed Central Bank in the current capital, 100 treasury gold and unused note capacity. The smaller of 25% bank equity and 500 gold caps circulation."
 bfl_money_offer_accept: "Fund the secured advance"
 bfl_money_offer_accept_tip: "Fund 75 gold from the lender’s available cash if the current manager, quote and third-bank collateral remain valid. The accepted annual rate is fixed for this facility; public support charges at least 9%."
 bfl_money_offer_decline: "Decline the request"
 bfl_money_offer_decline_tip: "Close this request without moving gold or pledging collateral."
 bfl_money_offer_desc: "Advance 75 gold against a separately funded 100-gold bill held at a third bank. A 25% haircut protects the lender. The accepted annual discount rate applies for one month; public support charges at least 9%. Settlement pays the lender first and returns the remainder to the borrower. Unfunded collateral preserves both claims. This request expires this month."
 bfl_money_offer_title: "A secured settlement facility"
 bfl_money_policy_rate: "Cycle future discount rate"
 bfl_money_policy_rate_tip: "Cycle the annual rate for future secured advances through 6%, 9% and 12%. One month is charged at acceptance; existing facilities keep their fee. Public support charges at least 9%."
 bfl_money_redeem: "Redeem state notes"
 bfl_money_redeem_tip: "Redeem all notes held by the sovereign controller for their face value. Lost authority, research or branches do not cancel existing claims. An unpaid claim remains owed."
 bfl_money_repay: "Repay secured facility"
 bfl_money_repay_tip: "Repay the current secured advance plus its fixed accepted fee to release the third-bank bill pledge. Requires enough available gold."
 bfl_money_revoke: "Revoke authority"
 bfl_money_revoke_tip: "Withdraw sovereign authorization for new notes. Existing notes remain redeemable."
 bfl_money_settings: "Policy"
 bfl_money_settings_tip: "Show or hide monetary policy, note authority, secured credit and clearing controls."
 bfl_money_settings_tip_tip: "Notes exchange specie for a fully reserved claim. Acceptance is voluntary. Discounts advance 75 gold against a 100-gold third-bank bill. Clearing settles matching matured bills only when every member can pay its net debit. Existing claims survive lost authority and buildings."
 bfl_money_subtitle: "Redeemable claims · funded settlement"
 bfl_money_subtitle_tip: "Notes exchange specie for a fully reserved claim. Acceptance is voluntary. Discounts advance 75 gold against a 100-gold third-bank bill. Clearing settles matching matured bills only when every member can pay its net debit. Existing claims survive lost authority and buildings."
 bfl_money_terms: "Principal and issuance are excluded from income. Discount rates are annual and fixed when accepted. Confidence falls to 25 on a reserve shortfall; fully backed notes add no inflation. Vanilla payments continue to use native gold."
 bfl_money_terms_tip: "Notes exchange specie for a fully reserved claim. Acceptance is voluntary. Discounts advance 75 gold against a 100-gold third-bank bill. Clearing settles matching matured bills only when every member can pay its net debit. Existing claims survive lost authority and buildings."
 bfl_money_title: "Money & settlement"
 bfl_money_title_tip: "Principal and issuance are excluded from income. Discount rates are annual and fixed when accepted. Confidence falls to 25 on a reserve shortfall; fully backed notes add no inflation. Vanilla payments continue to use native gold."
 bfl_mortzenhaus: "Mortzenhaus"
 bfl_mortzenhaus_desc: "From the Mortzenhaus, merchants direct ships, letters and credit through the northern ports. Its counting rooms lighten the burden of administration, while the firm’s network draws commerce towards Hamburg."
 bfl_mortzenhaus_maintenance: "Mortzenhaus administration"
 bfl_native_credit_label: "Loan portfolio"
 bfl_native_credit_label_tip: "Loans held by the bank at recorded acquisition value. Rows show principal, annual interest and months remaining at the last review."
 bfl_native_tab: "State loans"
 bfl_native_takeover: "Native Takeover"
 bfl_native_takeover_result_tt: "Our bank purchases one eligible estate-held loan at the quoted native price. The estates receive payment, the same loan passes to the bank, and the borrower receives no new principal. The bank must have an operating branch in the borrower’s capital and enough uncommitted cash and capital."
 bfl_new_capital_subscription: "Subscribe new capital"
 bfl_new_capital_subscription_desc: "Invest 100@gold! of your bank’s funds in [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_issuer').GetCountry.GetName] as newly issued equity at its tangible NAV. The issuer receives the payment and existing holders are diluted. This is a capital subscription, separate from Buy shares. Execution rechecks the captured NAV, issued units, research, protected funds and concentration limit. It consumes one diplomat and starts this issuer’s one-month trading cooldown."
 bfl_new_capital_subscription_tip: "Primary financing: invest 100 gold from the managed bank. The issuer receives cash and issues new shares. This is separate from trading existing stock."
 bfl_no_automatic_tribute: "No automatic charter tribute"
 bfl_no_automatic_tribute_cost_modifier: "Automatic charter tribute cost"
 bfl_no_bank: "Charter an existing State Bank through Decisions, or play an independent banking country. Your country must own its capital market to charter a bank."
 bfl_no_bank_holdings: "No shares held by the bank."
 bfl_no_bank_short: "No chartered bank"
 bfl_no_deposit_accounts: "No deposits"
 bfl_nobles_estate_workout_mandate: "Estate workout mandate"
 bfl_nobles_estate_workout_mandate_desc: "This estate explicitly authorizes its government to review voluntary bank-deposit workouts on its behalf. Every proposal still needs separate acceptance. Revoking this privilege invalidates pending estate terms. Recovery payments continue to the estate wallet."
 bfl_offer_bank_shares: "Offer new bank shares"
 bfl_offer_bank_shares_tip: "Allow other banks and countries to subscribe 100 gold at the bank's current net asset value. New shares are issued only when paid for; existing owners are diluted. Native Banking research and positive equity remain required."
 bfl_offer_bond: "Offer a bank-held sovereign bond"
 bfl_offer_bond_tip: "List the oldest bank-held bond for three months at 98% of face value. Selling and buying both require an owned completed Stock Exchange building. Acceptance rechecks the seller, current holder, generation, funds and expiry. Arrears block trading."
 bfl_offer_bond_workout_01: "Offer restructuring"
 bfl_offer_bond_workout_01_tip: "Ask this current holder to accept a 20% reduction of principal and unpaid coupons, and a one percentage point annual coupon cut, with a 1% floor. No money moves unless the holder separately accepts. The quote expires this month and changes to the claim invalidate it."
 bfl_offer_bond_workout_02: "Offer restructuring"
 bfl_offer_bond_workout_02_tip: "Ask this current holder to accept a 20% reduction of principal and unpaid coupons, and a one percentage point annual coupon cut, with a 1% floor. No money moves unless the holder separately accepts. The quote expires this month and changes to the claim invalidate it."
