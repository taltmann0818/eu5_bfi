 bfl_assets_label: "Assets"
 bfl_assets_label_tip: "#T Total assets#!\nCash and recorded assets owned by the bank.\n\nTreasury cash: [Country.GetFixedPointCurrencyValue('gold')|2]@gold!\nLoan portfolio: [Country.MakeScope.GetVariable('bfl_native_credit_value').GetValue|2]@gold!\nEquity positions (carrying value): [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_security_carrying')|2]@gold!\nCustom credit and bonds: [Country.MakeScope.GetVariable('bfl_custom_credit_value').GetValue|2]@gold!\nInventory: [Country.MakeScope.GetVariable('bfl_inventory_value').GetValue|2]@gold!\nProjects: [Country.MakeScope.GetVariable('bfl_project_value').GetValue|2]@gold!\nTotal: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_assets')|2]@gold!\n\nLoans, equity positions, inventory and projects are recorded asset values, not cash available to spend. Principal repayments exchange a loan asset for cash; they do not create profit."
 bfl_authorize_note_bank: "Authorize redeemable banknotes"
 bfl_authorize_note_bank_act: "$bfl_authorize_note_bank$"
 bfl_authorize_note_bank_desc: "Authorize your chartered bank, or an independent bank with a branch in your capital, to exchange specie for fully backed redeemable notes after the required research. A completed Central Bank in your capital is also required for new issues. Authorization creates no gold and can be withdrawn."
 bfl_authorize_note_bank_effect_text: "$bfl_authorize_note_bank$"
 bfl_authorize_note_bank_effect_text_past: "$bfl_authorize_note_bank$"
 bfl_automation_notice: "Credit Management"
 bfl_automation_notice_tip: "Use Credit Management in the header to let the bank manage lending and investments. The bank keeps reserves, pays creditors and checks research and cash before investing."
 bfl_available: "Available cash"
 bfl_available_tip: "Cash the bank can use after keeping its reserves."
 bfl_back_to_bank: "Bank accounts"
 bfl_balance_paid_tip: "Funded payment received at the last monthly settlement. These transfers are already in your treasury and must not be added again to the native income total."
 bfl_balance_sheet_subtitle: "Current bank accounts"
 bfl_banco_del_giro: "Banco del Giro"
 bfl_banco_del_giro_desc: "Beneath the arcades of the Rialto, public credit passes from ledger to ledger. The bank receives coin, settles the obligations of merchants and gives the republic a lasting foundation for its debts."
 bfl_banco_del_giro_maintenance: "Banco del Giro administration"
 bfl_banco_mediceo: "Banco Mediceo"
 bfl_banco_mediceo_desc: "Within the heavy stone walls of this great banking house, merchants settle their accounts and princes seek the credit of the Medici. Its clerks order the flow of bills and coin through Milan, supporting the public finances and the wider business of the bank. A completed house reduces chartered bank administration by 15% and supports monetary services after the necessary advances."
 bfl_bank_capital_subscriptions_desc: "A banking house need not rely entirely on the fortune of its founding family. Subscriptions bring additional partners into the enterprise, pooling their capital while recording each investor's claim upon its future prosperity."
 bfl_bank_dividends: "Bank Dividends (yearly)"
 bfl_bank_equity_subscribe: "Bank treasury: subscribe 100 gold"
 bfl_bank_equity_subscribe_tip: "Invest 100 of the actual managed bank's protected-cash and capital surplus at the selected issuer's tangible NAV. New paid units enter the bank portfolio. Maximum 25% of a bank or 60% of an Overseas-permitted company. This is primary financing, not a purchase from an existing shareholder."
 bfl_bank_headquarters_cost_reduction: "Chartered bank headquarters operating cost reduction"
 bfl_bank_holdings: "Bank investments"
 bfl_bank_identity_tip: "[Country.GetName] holds its own treasury, assets and obligations. These totals belong to the bank, separately from your state treasury. Merchant Finance specializes in trade and corporate lending; Overseas Investment specializes in ventures and companies. A bank chooses one permanent specialization."
 bfl_bank_loan_yield_bonus: "Interest on new bank loan offers"
 bfl_bank_of_england_founding_tt: "Establish the Bank of England as our Chartered Bank in London, funded from available treasury cash up to the standard charter investment."
 bfl_bank_of_england_name: "Bank of England"
 bfl_bank_palace_cost_reduction: "Bank operating cost reduction"
 bfl_bank_share_dealing: "Bank Share Dealing"
 bfl_bank_share_dealing_desc: "A partner's fortune need not remain tied to the same banking house forever. Recognized transfers of ownership let investors sell their interests to others while the institution continues its business without withdrawing its capital."
 bfl_bank_share_price_bonus: "Bank share price"
 bfl_bank_share_transfer: "Bank Share Transfer"
 bfl_bank_share_transfer_tip: "#T Bank share transfer#!\nTransfer recorded bank ownership units between funded parties. Requires Bank Share Dealing research and the Reformation age or later. This row reports permission; it does not itself execute a secondary share trade."
 bfl_bank_status_tip: "Operating: new business is permitted when its other requirements are met. Cash under pressure: available cash is exhausted. Withdrawals queued: unpaid withdrawal requests suspend new business. Insolvent: liabilities exceed assets. In resolution or Closed: ordinary business is restricted. Existing claims remain recorded."
 bfl_bank_subscription: "Bank Subscription"
 bfl_banking_company: "Banking Company"
 bfl_banking_company_desc: "The affairs of this bank have outgrown the household that once kept its books. A body of directors now oversees its clerks, while common accounts and established offices bind together a company that can endure beyond the fortunes of any single family. Experience passes from one generation of servants to the next, bringing order and economy to the daily business of credit."
 bfl_banking_finance_companies__expanded_details_desc: "Reserved presentation preference for the detailed statement view."
 bfl_banking_finance_companies__expanded_details_name: "Expanded activity details"
 bfl_banking_finance_companies__finance_notifications_desc: "Notification presentation preference; obligations are never canceled by muting."
 bfl_banking_finance_companies__finance_notifications_name: "Finance notifications"
 bfl_banking_finance_companies__interface_name: "Interface"
 bfl_banking_finance_companies__presentation__interface_name: "Interface"
 bfl_banking_finance_companies__presentation_name: "Presentation"
 bfl_banking_finance_companies__reduced_motion_desc: "Use static transaction receipts and warnings. Disable to allow brief, single transaction highlights after committed payments; no looping financial flashes."
 bfl_banking_finance_companies__reduced_motion_name: "Reduced motion"
 bfl_banking_finance_companies_desc: "Presentation settings only. Institution policy is managed in Economy."
 bfl_banking_finance_companies_name: "Banking, Finance and Trade Companies"
 bfl_bond_accept_tip: "Accept the quoted principal/coupon reduction and annual rate cut after rechecking the current holder, claim and authority. No new security or cash payment."
