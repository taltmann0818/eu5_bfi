 bfl_share_ownership: "Share ownership"
 bfl_share_state_tip: "#T [Country.GetDiplomacy.GetOverlord.GetName]#!\nOwned shares: [Country.MakeScope.GetVariable('bfl_state_units').GetValue|2] / [Country.MakeScope.GetVariable('bfl_total_units').GetValue|2]\nOwnership: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_state_share_fraction')|%2]\nLast monthly dividend: [Country.MakeScope.GetVariable('bfl_state_dividend_paid').GetValue|2]@gold!"
 bfl_sovereign_banknotes: "Sovereign Banknotes"
 bfl_sovereign_banknotes_desc: "A bank supported by public authority may circulate written promises to pay in place of heavy coin. Their acceptance rests upon confidence that the institution will redeem them and that the issuing authority will uphold its obligations."
 bfl_sovereign_credit: "Sovereign Credit"
 bfl_sovereign_credit_tip: "#T Sovereign credit#!\nA loan from bank cash to a landed state, with a repayment claim recorded as a bank asset. Requires an operating bank and the native loan conditions. New loan execution is unavailable in this build."
 bfl_sovereign_note: "Sovereign Note"
 bfl_sovereign_note_tip: "#T Sovereign banknotes#!\nIssue charter-authorized notes with verified backing. Requires Sovereign Banknotes research, a state charter and the Absolutism age or later. Note-sale proceeds cannot count as their own backing. Native note execution is unavailable in this build."
 bfl_sovereign_restructuring: "Sovereign Restructuring"
 bfl_sovereign_restructuring_tip: "#T Sovereign restructuring#!\nRenegotiate sovereign debt under the Debt Restructuring advance. Requires the permitted age, an operating bank and a supported native debt transaction. Native restructuring execution is unavailable in this build."
 bfl_specialization_title: "Bank specialization"
 bfl_state_bonds_tip: "#T State bond capacity#!\nOutstanding native state bonds: [GetPlayer.GetNumBonds]\nMaximum native bond slots: [GetPlayer.GetDoubleModifierValue('max_bonds', 'max_bonds_modifier')|0]\n\nThese are your state's bonds, separate from the bank's deposits, equity and other liabilities. The capacity includes native base slots and bond-capacity modifiers. Selling a bond also requires the native borrowing conditions."
 bfl_state_bonds_value: "Bonds: [GetPlayer.GetNumBonds] / [GetPlayer.GetDoubleModifierValue('max_bonds', 'max_bonds_modifier')|0]"
 bfl_state_chartered_bank: "State Chartered Bank"
 bfl_state_chartered_bank_desc: "A separately funded native bank subject. The sovereign initially owns all shares and sets the monthly dividend payout in Credit. New bank subscriptions raise capital and dilute existing ownership. State deposits earn preferential interest."
 bfl_state_credit: "State credit"
 bfl_state_credit_value: "Credit: [Multiply_CFixedPoint(GetPlayer.GetCreditworthiness, '(CFixedPoint)100')|0]"
 bfl_state_interest_value: "Interest: [GetPlayer.GetModifierValueNoFormat('bank_interest')]"
 bfl_status_0: "Operating"
 bfl_status_1: "Cash under pressure"
 bfl_status_2: "Withdrawals queued"
 bfl_status_3: "Insolvent"
 bfl_status_4: "In resolution"
 bfl_status_5: "Closed"
 bfl_streamline_bank: "Streamline administration · 100 gold"
 bfl_streamline_bank_tip: "Pay 100 state gold once to reduce fixed bank operating expenses by 10%. The charter reform, Banking and Advanced Clearing provide additional reductions. This decision does not create bank profit."
 bfl_subscribe_bank: "Subscribe 100 gold of bank capital"
 bfl_subscribe_bank_desc: "Funded from your own treasury after profile, age, research and registry checks. Principal is not bank profit. A bank capital subscription buys units at its current net asset value."
 bfl_suspend_command: "Suspend new deposits"
 bfl_suspend_command_tip: "#T Suspend new deposits#!\nStop accepting new deposits and the funding actions that require deposit acceptance. Existing accounts, interest obligations and withdrawal requests remain recorded. This control does not close the bank or forgive its debts."
 bfl_term_deposit: "Term Deposit"
 bfl_term_deposits_desc: "Merchants cannot always employ their money at once. By entrusting it to a banking house for an agreed term, they give the banker a steadier source of capital and receive compensation for surrendering immediate access to their funds."
 bfl_treasury: "Treasury funding"
 bfl_twelve_months: "12 monthly settlements · oldest → latest"
 bfl_ventures: "Ventures and companies · Overseas Investment"
 bfl_ventures_explanation: "Commenda starts in Discovery; native companies and company equity require Reformation. Political overlord control and financial ownership stay separate. Project capital is not a dividend."
 bfl_ventures_tip: "#T Ventures and companies#!\nPermissions for funded ventures, company investments, project security and bank-share transfers. These expose capital to investment risk and require the relevant research and specialization."
 bfl_warehouse_receipt: "Warehouse Receipt"
 bfl_warehouse_receipt_tip: "#T Warehouse receipt#!\nIssue a claim against identifiable stored goods. Requires Warehouse Receipts research, Merchant Finance and the Absolutism age or later. Verified storage and goods execution are unavailable in this build."
 bfl_warehouse_receipts: "Warehouse Receipts"
 bfl_warehouse_receipts_desc: "Goods kept in a reputable warehouse can support commerce without being moved at every sale. A receipt establishes a claim to the stored merchandise, allowing its owner to obtain finance while the goods remain in custody."
 bfl_withdraw: "Withdraw matured state deposits"
 bfl_withdraw_tip: "#T Withdraw matured state deposits#!\nRequest repayment of your state's demand accounts and matured term accounts. The bank pays principal and credited interest from available cash. Unpaid amounts remain recorded in the withdrawal queue and suspend new business. Foreign accounts and unmatured term deposits cannot be withdrawn by this action."
