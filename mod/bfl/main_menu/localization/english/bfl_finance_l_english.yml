 bfl_accounts_explanation: "Native treasury is cash. Deposits and notes are liabilities. Lending exchanges cash for an asset; principal, subscriptions and issuance are not profit."
 bfl_advanced_clearing: "Advanced Clearing"
 bfl_advanced_clearing_desc: "Banking houses that owe one another many payments need not settle every obligation separately in coin. Clearing accounts reconcile their claims and transfer only the remaining balance, reducing the money required to sustain commerce."
 bfl_advanced_tip: "Research unlocks the mandate. The bank must also meet its specialization, liquidity and operating requirements. Unavailable execution remains disabled."
