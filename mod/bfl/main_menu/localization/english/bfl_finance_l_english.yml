 bfl_custom_bonds_title: "Sovereign bonds"
 bfl_custom_bonds_title_tip: "The bank funds custom perpetual sovereign bonds. Current holders receive monthly coupons and face-value redemption. Combined custom and native debt capacity is 24 months of native income with a 100-gold minimum; custom coupons may consume at most 25% of native income. Unpaid coupons block new issuance and resale."
 bfl_dealer_inventory_class: "Market maker inventory · no votes"
 bfl_debt: "Native debt portfolio"
 bfl_debt_explanation: "The chartered bank funds custom sovereign bonds. Secondary trading requires completed Stock Exchanges on both sides, including early event grants. Native credit uses accepted offers and researched debt relief with persisted claim records."
 bfl_debt_facility: "Debt Facility"
 bfl_debt_resale: "Debt Resale"
 bfl_debt_resale_tip: "#T Sovereign bond resale#!\nSelling and buying secondary sovereign bonds require the Stock Exchange advance and an owned Stock Exchange building. An open offering transfers the same custom claim for 98% of face value; the issuer receives no new proceeds. Coupons and redemption follow the buyer."
 bfl_debt_restructuring: "Debt Restructuring"
 bfl_debt_restructuring_desc: "A debt that cannot be collected on its appointed day need not be worthless. Creditors may preserve more of their claims by agreeing to new terms than by pressing a distressed debtor into outright default."
 bfl_debt_tip: "#T Debt and credit#!\nPermissions for lending, underwriting, restructuring and debt transfers. Each row has its own research, specialization, liquidity and execution requirements. A lock means new origination is unavailable; it does not cancel existing claims."
 bfl_demand_deposit: "Demand Deposit"
 bfl_deposit_1: "Deposit 100 gold on demand"
 bfl_deposit_1_tip: "#T Demand deposit#!\nTransfer 100 state gold to your chartered bank. Its new-account annual offer is the displayed base rate plus a 1% charter premium. Demand interest is paid to your treasury monthly when funded, with cent carry; unpaid interest remains owed. Existing accounts keep their accepted rate. Withdraw repays principal and unpaid interest. Independent banks accept deposits through diplomacy at +50 opinion or better and offer the base rate."
 bfl_deposit_2: "Deposit 100 gold for 12 months"
 bfl_deposit_2_tip: "#T Term deposit#!\nTransfer 100 state gold to your chartered bank for twelve months. Its new-account annual offer is the displayed term rate plus a 1% charter premium. Interest accrues monthly and is paid with principal at maturity. Requires native Banking, the permitted age and a free account slot. Independent term accounts are available through diplomacy at +50 opinion or better."
 bfl_deposit_explanation: "Each account stores its accepted fixed annual rate. Changing the rate affects new accounts. Term accounts mature after 12 months. Withdrawal shortages remain liabilities and suspend new commitments."
 bfl_deposit_income_tip: "Demand interest actually paid this month by your chartered bank and independent banks. Unpaid interest remains owed. Principal withdrawals and capital contributions are excluded."
 bfl_deposit_interest: "Deposit Interest"
 bfl_deposit_ledger_help: "Each lot retains its accepted rate. Matching deposits aggregate; term deposits mature after 12 months. Quarantined claims remain owed and stop accruing until a valid recipient is available. Estate principal and interest return to the same pool."
 bfl_deposit_ledger_title: "Deposit ledger and servicing"
 bfl_deposit_ledger_title_tip: "Bank liabilities, accepted terms and unpaid claims. Servicing never depends on continuing diplomatic admission."
 bfl_deposit_policy_title: "Rates for new deposits"
 bfl_deposit_policy_title_tip: "#T Rates for new deposits#!\nChoose the annual interest rate accepted by new demand accounts.\n\nCurrent offer: [Country.MakeScope.GetVariable('bfl_demand_rate').GetValue|%2]\nTerm-account offer: [Country.MakeScope.GetVariable('bfl_term_rate').GetValue|%2]\n\nExisting accounts retain the rate agreed when they opened. Monthly credited interest increases the bank's liability and reduces its retained earnings; it does not move cash until paid."
 bfl_deposits: "Deposits and rates"
 bfl_deposits_label: "Deposit claims"
 bfl_dev_notice: "Sovereign bonds use funded custom claims with fixed annual coupons. Physical goods, company receipts and advanced native adapters remain under development."
 bfl_distress: "Distress and development gates"
 bfl_distribution_title: "Profit distribution"
 bfl_distribution_title_tip: "#T Monthly share dividends#!\nSovereign dividend = sovereign shares × ((monthly bank net income × payout ratio) / shares outstanding).\n\nPayout ratio: [Country.MakeScope.GetVariable('bfl_payout_ratio').GetValue|%0]\nNet income after costs and carried losses: [Country.MakeScope.GetVariable('bfl_monthly_net_income').GetValue|2]@gold!\nSovereign shares: [Country.MakeScope.GetVariable('bfl_state_units').GetValue|2]\nShares outstanding: [Country.MakeScope.GetVariable('bfl_total_units').GetValue|2]\nLast total dividends: [Country.MakeScope.GetVariable('bfl_dividend_paid').GetValue|2]@gold!\nLast sovereign dividend: [Country.MakeScope.GetVariable('bfl_state_dividend_paid').GetValue|2]@gold!\n\nThe sovereign initially owns 100%. New bank subscriptions raise capital and dilute ownership. Cash, capital and outstanding obligations cap the funded payout. Negative income pays no dividend; retained profit is not counted again next month. Principal, deposits, subscriptions and borrowing are excluded."
 bfl_dividend_explanation: "Monthly net income after deposit interest, operating expenses and carried losses funds dividends. Each owner receives owned shares multiplied by the funded payout per outstanding share. Retained earnings are not distributed again next month."
 bfl_draw_bond: "Borrow 100 from the bank"
 bfl_draw_bond_tip: "The chartered bank pays 100 gold for a perpetual sovereign bond. One issue per month, subject to protected cash, capital and issuer debt capacity. Proceeds are financing. Repay face value to its current holder to retire it."
 bfl_equity_debt: "Bank equity & debt"
 bfl_equity_debt_tip: "#T Bank equity and debt#!\nUp to twelve actual monthly settlement snapshots. Green is assets minus liabilities; red is the bank's total liabilities. Both use the same automatically scaled gold axis, including negative equity. Samples run from oldest on the left to latest on the right. Hover over a sample for its value and accounting month. State loans are not included in this bank history."
 bfl_equity_label: "Bank equity"
 bfl_equity_label_tip: "#T Bank equity#!\nThe residual value belonging to the bank's owners after its obligations.\n\nAssets: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_assets')|2]@gold!\nLess total debt: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_liabilities')|2]@gold!\nEquity: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_equity')|2]@gold!\n\nRecorded state units: [Country.MakeScope.GetVariable('bfl_state_units').GetValue|2]\nTotal ownership units: [Country.MakeScope.GetVariable('bfl_total_units').GetValue|2]\nCapital headroom: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_capital_headroom')|2]@gold!\n\nNegative equity means insolvency. Capital headroom is equity above 10% of assets, with a minimum of zero; distributions are limited by both this headroom and available cash. Equity is not the amount that can immediately be withdrawn."
 bfl_equity_market: "Share price and history"
 bfl_equity_subscribe_0: "Treasury: subscribe 100 gold"
 bfl_equity_subscribe_0_tip: "Primary NAV subscription: pays the issuer and dilutes existing holders. Estate purchases use the actual estate wallet, preserving 25 gold. A bank investor uses only its own protected-cash and capital surplus; company equity requires Overseas Investment research."
 bfl_equity_subscribe_1: "Burghers: subscribe 100 gold"
 bfl_equity_subscribe_1_tip: "Primary NAV subscription: pays the issuer and dilutes existing holders. Estate purchases use the actual estate wallet, preserving 25 gold. A bank investor uses only its own protected-cash and capital surplus; company equity requires Overseas Investment research."
 bfl_equity_subscribe_2: "Nobles: subscribe 100 gold"
 bfl_equity_subscribe_2_tip: "Primary NAV subscription: pays the issuer and dilutes existing holders. Estate purchases use the actual estate wallet, preserving 25 gold. A bank investor uses only its own protected-cash and capital surplus; company equity requires Overseas Investment research."
 bfl_equity_subscribe_3: "Clergy: subscribe 100 gold"
 bfl_equity_subscribe_3_tip: "Primary NAV subscription: pays the issuer and dilutes existing holders. Estate purchases use the actual estate wallet, preserving 25 gold. A bank investor uses only its own protected-cash and capital surplus; company equity requires Overseas Investment research."
 bfl_equity_subscribe_4: "Peasants: subscribe 100 gold"
 bfl_equity_subscribe_4_tip: "Primary NAV subscription: pays the issuer and dilutes existing holders. Estate purchases use the actual estate wallet, preserving 25 gold. A bank investor uses only its own protected-cash and capital surplus; company equity requires Overseas Investment research."
 bfl_equity_vote_payout_0: "Majority vote: 0% dividend payout"
 bfl_equity_vote_payout_0_tip: "Requires more than half of issued financial votes. Company retained earnings and independent-bank payout policy only. Chartered monetary and payout policy remain with the live landed controller. No political subject transfer."
 bfl_equity_vote_payout_25: "Majority vote: 25% dividend payout"
 bfl_equity_vote_payout_25_tip: "Requires more than half of issued financial votes. Company retained earnings and independent-bank payout policy only. Chartered monetary and payout policy remain with the live landed controller. No political subject transfer."
 bfl_equity_vote_payout_50: "Majority vote: 50% dividend payout"
 bfl_equity_vote_payout_50_tip: "Requires more than half of issued financial votes. Company retained earnings and independent-bank payout policy only. Chartered monetary and payout policy remain with the live landed controller. No political subject transfer."
 bfl_equity_vote_reserve_100: "Majority vote: reserve 100, trade budget 50"
 bfl_equity_vote_reserve_100_tip: "Majority financial votes may choose the company reinvestment reserve and trade budget. Political mandates, native overlordship, cash and existing creditor claims remain separate."
 bfl_equity_vote_reserve_200: "Majority vote: reserve 200, trade budget 25"
 bfl_equity_vote_reserve_200_tip: "Majority financial votes may choose the company reinvestment reserve and trade budget. Political mandates, native overlordship, cash and existing creditor claims remain separate."
 bfl_establish_chartered_bank.a: "Select the existing State Bank"
 bfl_establish_chartered_bank.desc: "Convert one existing State Bank in place and gain Banking Traditions when the charter is completed. The current-age investment of 500 / 750 / 1,000 / 1,500 / 2,000 / 3,000 gold is transferred to its treasury as state equity. You must own your capital market. Select a bank before any payment or research occurs."
 bfl_establish_chartered_bank.title: "Establish a State Chartered Bank"
 bfl_estate_deposit_1: "Burghers: demand 100"
 bfl_estate_deposit_1_desc: "Place actual estate gold in a pooled demand account at the selected bank. No sovereign deposit premium applies."
 bfl_estate_deposit_1_tip: "Uses this estate pool, preserving at least 25 estate gold. Principal and interest return to the same estate, never the sovereign treasury. Repeated matching accounts aggregate. Household participation is represented by these estate pools."
 bfl_estate_deposit_2: "Nobles: demand 100"
 bfl_estate_deposit_2_desc: "Place actual estate gold in a pooled demand account at the selected bank. No sovereign deposit premium applies."
