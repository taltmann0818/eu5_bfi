 bfl_facility_2_tip: "Request custom bond financing toward 200 state gold after the forecast balance, capped at 100 gold and one issue per month. Unfunded requests create no debt or cash."
 bfl_facility_tip: "Bank cash actually received from custom sovereign bond issuance this month. Financing creates debt and is excluded from earned income."
 bfl_facility_title: "Debt facility mandate"
 bfl_facility_title_tip: "#T Debt facility mandate#!\nThe bank funds custom sovereign bonds with fixed annual coupons. Off stops scheduled issues. Debt first requests 60% of forecast spending. Buffer targets 200 state gold after the forecast monthly balance. Both stop at 500 state gold.\n\nLast requested: [Country.MakeScope.GetVariable('bfl_facility_requested').GetValue|2]@gold!\nLast funded: [Country.MakeScope.GetVariable('bfl_facility_paid').GetValue|2]@gold!\n\nAt most one issue and 100 gold per month. Protected bank cash, capital, issuer capacity and unpaid coupons can prevent a draw. Proceeds are financing, not income."
