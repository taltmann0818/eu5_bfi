 bfl_offer_commenda: "Fund a cargo operation"
 bfl_offer_commenda_act: "Fund a cargo operation"
 bfl_offer_commenda_desc: "Offer risk capital under the bank’s proposed terms. Acceptance buys the named cargo at its native cost; unused authorization stays with the bank. Capital and returns are never guaranteed."
 bfl_offer_commenda_effect_text: "Fund a cargo operation"
 bfl_offer_commenda_effect_text_past: "Fund a cargo operation"
 bfl_offer_commenda_tip: "Discovery or later, Overseas Investment and Commenda research. Choose an operator, source market, destination and goods for a ten-unit cargo. Acceptance rechecks your authority, free cash, capital and capacity. One active agreement per operator; up to eight per bank."
 bfl_offer_credit: "Offer a funded loan"
 bfl_offer_credit_act: "$bfl_offer_credit$"
 bfl_offer_credit_desc: "The borrower receives an explicit offer. No cash or terms change until acceptance; execution rechecks live authority, profile, research and funds."
 bfl_offer_credit_effect_text: "$bfl_offer_credit$"
 bfl_offer_credit_effect_text_past: "$bfl_offer_credit$"
 bfl_offer_credit_tip: "Select a sovereign or eligible native company. Both profiles lend to sovereigns; company credit requires Merchant Finance, Reformation and Corporate Credit. Debt relief also requires Renaissance Debt Restructuring."
 bfl_offer_goods_transfer: "Offer warehouse receipt transfer"
 bfl_offer_goods_transfer_act: "$bfl_offer_goods_transfer$"
 bfl_offer_goods_transfer_desc: "Offer the receipt most recently selected in Goods offers and custody claims. The recipient reviews price and quantity before paying the current holder."
 bfl_offer_goods_transfer_effect_text: "$bfl_offer_goods_transfer$"
 bfl_offer_goods_transfer_effect_text_past: "$bfl_offer_goods_transfer$"
 bfl_offer_held_sovereign_bond: "Offer a held sovereign bond"
 bfl_offer_held_sovereign_bond_act: "$bfl_offer_held_sovereign_bond$"
 bfl_offer_held_sovereign_bond_desc: "Select an issuer and list one of your sovereign bonds at 98% of face value. Requires an owned completed Stock Exchange building."
 bfl_offer_held_sovereign_bond_effect_text: "$bfl_offer_held_sovereign_bond$"
 bfl_offer_held_sovereign_bond_effect_text_past: "$bfl_offer_held_sovereign_bond$"
 bfl_offer_held_sovereign_bond_tip: "List an existing bond you own for three months. You retain the claim until a funded buyer accepts; coupons and redemption then follow that buyer."
 bfl_offer_restructuring: "Offer debt relief"
 bfl_offer_restructuring_act: "$bfl_offer_restructuring$"
 bfl_offer_restructuring_desc: "The borrower receives an explicit offer. No cash or terms change until acceptance; execution rechecks live authority, profile, research and funds."
 bfl_offer_restructuring_effect_text: "$bfl_offer_restructuring$"
 bfl_offer_restructuring_effect_text_past: "$bfl_offer_restructuring$"
 bfl_offer_restructuring_tip: "Select a sovereign or eligible native company. Both profiles lend to sovereigns; company credit requires Merchant Finance, Reformation and Corporate Credit. Debt relief also requires Renaissance Debt Restructuring."
 bfl_offering_closed: "Closed"
 bfl_offering_open: "Open"
 bfl_operating_costs: "Monthly operating expenses"
 bfl_operating_costs_tip: "Fixed monthly costs scale with active deposit accounts, contracts, branches and asset classes. The State Chartered Bank reform reduces costs by 5%, Banking by 10%, Advanced Clearing by 15%, streamlined administration by 10%, a completed bank headquarters by 15%, and an owned Florentine banking palace by 10%. The total reduction remains capped at 75%. Unpaid costs remain liabilities and block dividends."
 bfl_overview: "Accounts and specialization"
 bfl_overview_hint: "Assets: outer ring = type; inner ring = countries. Hover for colored breakdowns."
 bfl_palace_saint_george: "Palace of Saint George"
 bfl_palace_saint_george_desc: "The palace beside Genoa’s harbour gives a common home to the creditors of the republic. Its enduring authority strengthens confidence in the bank’s shares, while experienced clerks order the debts and revenues committed to their care."
 bfl_palace_saint_george_maintenance: "Palace of Saint George administration"
 bfl_palazzo_acciaiuoli: "Palazzo Acciaiuoli"
 bfl_palazzo_acciaiuoli_desc: "Behind the sober stone walls of their Florentine palace, the Acciaioli bring scattered accounts under a single roof. The orderly work of their clerks reduces the bank’s operating expenses."
 bfl_palazzo_acciaiuoli_maintenance: "Palazzo Acciaiuoli administration"
 bfl_palazzo_busini_bardi: "Palazzo Busini-Bardi"
 bfl_palazzo_busini_bardi_desc: "Within these ordered stone walls, the Bardi gather accounts from courts and counting houses across Europe. The completed palace reduces bank administration by ten percent and adds half a percentage point to newly offered loan rates, subject to the usual ceiling. Existing contracts retain their agreed rates."
 bfl_palazzo_busini_bardi_maintenance: "Palazzo Busini-Bardi administration"
 bfl_palazzo_peruzzi: "Palazzo Peruzzi"
 bfl_palazzo_peruzzi_desc: "The Peruzzi unite the counting house with the commerce of the cloth merchants. Their clerks settle obligations beneath a roof sustained by distant markets. The completed palace reduces bank administration by ten percent. Its cloth business adds demand in the local market, supporting the price of fine cloth as supply and demand permit."
 bfl_palazzo_peruzzi_maintenance: "Palazzo Peruzzi administration"
 bfl_palazzo_salimbeni: "Palazzo Salimbeni"
 bfl_palazzo_salimbeni_desc: "Within the stern walls of the Salimbeni palace, Siena entrusts its savings to a lasting institution. Careful administration and the patient extension of credit sustain both the bank and those who seek its aid."
 bfl_palazzo_salimbeni_maintenance: "Palazzo Salimbeni administration"
 bfl_payout_0: "Retain profits"
 bfl_payout_0_short: "Retain"
 bfl_payout_0_tip: "Retain all eligible realized profit. No new dividend is paid under this policy; retained profit supports liquidity and equity."
 bfl_payout_25: "25% payout"
 bfl_payout_25_short: "25%"
 bfl_payout_25_tip: "Allocate up to 25% of eligible realized profit to dividends after losses. Available cash, capital headroom and recorded ownership still limit payment."
 bfl_payout_50: "50% payout"
 bfl_payout_50_short: "50%"
 bfl_payout_50_tip: "Allocate up to 50% of eligible realized profit to dividends after losses. Available cash, capital headroom and recorded ownership still limit payment."
 bfl_peasants_estate_workout_mandate: "Estate workout mandate"
 bfl_peasants_estate_workout_mandate_desc: "This estate explicitly authorizes its government to review voluntary bank-deposit workouts on its behalf. Every proposal still needs separate acceptance. Revoking this privilege invalidates pending estate terms. Recovery payments continue to the estate wallet."
