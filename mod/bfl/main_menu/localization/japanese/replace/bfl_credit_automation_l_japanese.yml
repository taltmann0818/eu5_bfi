l_japanese:
 AUTOMATED_SYSTEM_CREDIT: "与信管理"
 AUTOMATED_SYSTEM_CREDIT_DESC: "国のローンと債券を管理します。また、銀行はローンの乗っ取りを調査し、現金が必要な借り手に積立ローンを提供し、余った現金を利用可能な株式に投資します。企業は貿易と探査を管理します。銀行は準備金を保管し、債務能力をチェックします。借り手は新たなローンを受け入れなければなりません。"
 AUTOMATE_SYSTEM_TOOLTIP_CREDIT: "自動化で信用管理を有効にします: 国家債務、銀行融資、投資、会社運営。"
 DEAUTOMATE_SYSTEM_TOOLTIP_CREDIT: "クレジット管理を無効にします。既存のローン、預金、約束された支払いは引き続き実行されます。"
