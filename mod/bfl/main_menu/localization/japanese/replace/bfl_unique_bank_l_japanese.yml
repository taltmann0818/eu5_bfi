 wisselbank_desc: "旧市庁舎の屋根の下で、市の為替銀行は貨幣と手形を集め、国境を越える商業を整える。準備金と厳密な帳簿は公信用への信頼を支える。完成したWisselbankによる勅許銀行の管理費削減率は 15% となり、必要な進歩の研究後には通貨サービスも利用できる。"
 riksbank_desc: "諸身分の監督の下、常設銀行は王国の準備金を保管し、公信用を整える。書記たちは預金を受け入れ、債務を決済し、国家の約束への信頼を守る。完成したRiksbankによる勅許銀行の管理費削減率は 15% となり、必要な進歩の研究後には通貨サービスも利用できる。"
