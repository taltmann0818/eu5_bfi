 bfl_request_discount_command_desc: "$bfl_request_discount_desc$"
 bfl_request_discount_desc: "リクエストする 75-あなたの資金に対するゴールドの前払い 100-金の第三銀行券。ライブレンダーマネージャーがリクエストを確認します。受諾では、すべての当事者と担保が再確認されます。銀行間に銀行支店は必要ありません。"
 bfl_request_discount_effect_text: "$bfl_request_discount$"
 bfl_request_discount_effect_text_past: "$bfl_request_discount$"
 bfl_request_discount_tip: "融資先を選ぶ 75-未誓約済み、資金提供済みのゴールドの 1 か月前払い 100- 第三の銀行の金紙幣。担保と流動性の機能が必要です。貸し手は同意する必要があります。銀行間に銀行支店は必要ありません。"
 bfl_request_public_support: "公的に保護されたサポートをリクエストする"
 bfl_request_public_support_act: "$bfl_request_public_support$"
 bfl_request_public_support_command: "$bfl_request_public_support$"
 bfl_request_public_support_command_desc: "$bfl_request_public_support_desc$"
 bfl_request_public_support_desc: "リクエストする 75-あなたの資金に対するゴールドの前払い 100-金の第三銀行券。ライブレンダーマネージャーがリクエストを確認します。受諾では、すべての当事者と担保が再確認されます。銀行間に銀行支店は必要ありません。"
 bfl_request_public_support_effect_text: "$bfl_request_public_support$"
 bfl_request_public_support_effect_text_past: "$bfl_request_public_support$"
 bfl_request_public_support_tip: "公的金融のバックストップとその主権資本である中央銀行を備えた公認貸し手を選択してください。現在の管理者が同意する必要があります。の 75- ゴールドセキュアアドバンスは銀行現金を使用し、少なくとも請求します 9% 毎年;それは保証や資本再構築を生み出すものではありません。"
 bfl_resolution_begin_command: "解決を開始する"
 bfl_resolution_begin_command_tip: "秩序ある解決により、新しいコミットメントと分配が凍結されます。分離された金銭および保管準備金は引き続き保護されます。預金は、経費の滞納前に利用可能な現金と資本を比例的に分配します。行方不明の債権者は債権を保持します。任意条件には、現在の債権者の同意とルネッサンス債務再編が必要です。公的保証が適用されます 50% 受け入れられた預金損失のうち、最大 100 記録上の主権者によって資金提供された総額の金。未払いの通話は保留のままです。閉鎖するには、すべての義務と非現金資産を清算する必要があります。閉鎖された不動産は再開できません。"
 bfl_resolution_call_command: "支払い保留中の保証"
 bfl_resolution_call_command_tip: "秩序ある解決により、新しいコミットメントと分配が凍結されます。分離された金銭および保管準備金は引き続き保護されます。預金は、経費の滞納前に利用可能な現金と資本を比例的に分配します。行方不明の債権者は債権を保持します。任意条件には、現在の債権者の同意とルネッサンス債務再編が必要です。公的保証が適用されます 50% 受け入れられた預金損失のうち、最大 100 記録上の主権者によって資金提供された総額の金。未払いの通話は保留のままです。閉鎖するには、すべての義務と非現金資産を清算する必要があります。閉鎖された不動産は再開できません。"
