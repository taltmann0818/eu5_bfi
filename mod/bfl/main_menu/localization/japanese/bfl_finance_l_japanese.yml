 bfl_custom_bonds_title: "国債"
 bfl_custom_bonds_title_tip: "この銀行はカスタム永久ソブリン債に資金を提供しています。現在の保有者は毎月クーポンと額面金額の引き換えを受け取ります。カスタム債務とネイティブ債務を合わせたキャパシティーは、 24 月々の現地収入 100-ゴールドミニマム;カスタム クーポンは最大でも消費できます 25% ネイティブ収入の。未払いのクーポンは新規発行や再販を阻止します。"
 bfl_dealer_inventory_class: "マーケットメーカー在庫 · 投票なし"
 bfl_debt: "自然債ポートフォリオ"
 bfl_debt_explanation: "公認銀行はカスタムソブリン債に資金を提供しています。二次取引には、早期イベントの付与を含め、双方で完了した証券取引所が必要です。ネイティブ クレジットでは、受け入れられたオファーと、永続的な請求記録による調査済みの債務救済が使用されます。"
 bfl_debt_facility: "債務ファシリティ"
 bfl_debt_resale: "借金の転売"
 bfl_debt_resale_tip: "#T ソブリン債の転売#!\n二次ソブリン債の売買には、証券取引所の前払いと所有する証券取引所の建物が必要です。オープン オファリングでは、同じカスタム クレームが転送されます。 98% 額面通り。発行者は新たな収益を受け取りません。クーポンと引き換えは購入者に続きます。"
 bfl_debt_restructuring: "債務再編"
 bfl_debt_restructuring_desc: "約束の日に回収できない借金が無価値である必要はありません。債権者は、窮地に陥った債務者を完全な債務不履行に追い込むよりも、新たな条件に同意することで、より多くの債権を保全できる可能性がある。"
 bfl_debt_tip: "#T 借金と信用#!\n融資、引受、再構築、債務移転の許可。各行には独自の調査、専門化、流動性、実行要件があります。ロックは、新しい発信が利用できないことを意味します。既存の請求は取り消されません。"
 bfl_demand_deposit: "要求払預金"
 bfl_deposit_1: "デポジット 100 オンデマンドのゴールド"
 bfl_deposit_1_tip: "#T 要求払預金#!\n転送 100 州の金をあなたの公認銀行に送ります。新規アカウントの年間オファーは、表示されている基本料金に追加料金が加算されます。 1% チャータープレミアム。需要利息は、資金調達時にセントキャリーで毎月財務省に支払われます。未払い利息はまだ残っています。既存のアカウントは受け入れレートを維持します。出金すると元金と未払い利息が返済されます。独立系銀行は外交を通じて預金を受け入れます。 +50 またはそれ以上の意見を提示し、基本料金を提供します。"
 bfl_deposit_2: "デポジット 100 のための金 12 月"
 bfl_deposit_2_tip: "#T 定期預金#!\n転送 100 州の金をあなたの公認銀行に12か月間預けます。新規アカウントの年間オファーは、表示されている期間レートに、 1% チャータープレミアム。利息は毎月発生し、満期時に元本と一緒に支払われます。ネイティブ バンキング、許可された年齢、無料アカウント スロットが必要です。独立した定期口座は、次の外交を通じて入手できます。 +50 意見以上。"
 bfl_deposit_decline_tip: "全額のデポジット請求を保持します。現金の移動や株式の発行はありません。"
 bfl_deposit_equity_tip: "存続銀行がプラスの具体的なNAVと株主能力を持っている場合にのみ、見積請求額を現物株式に変換します。サブスクリプションの現金や収益は発生しません。"
 bfl_deposit_explanation: "各アカウントには、受け入れられた固定年率が保存されます。レートを変更すると、新しいアカウントに影響します。定期口座の満期日は次のとおりです 12 数か月。引き出し不足は負債のままであり、新たな約束は保留される。"
 bfl_deposit_haircut_tip: "引用文を受け入れる 20% 債権者、残りの請求権、調査および権限を再確認した後、減額されます。記録された公的保証は引き続き別途資金提供されます。"
 bfl_deposit_income_tip: "認可銀行および独立銀行によって今月実際に支払われた要求金利。未払いの利息はまだ残っています。元本の引き出しや出資は除きます。"
 bfl_deposit_interest: "預金利息"
 bfl_deposit_ledger_help: "各ロットはその許容レートを維持します。マッチング預金が集計されます。定期預金は満期を迎えます 12 数か月。隔離された請求は未払いのままであり、有効な受信者が利用可能になるまで発生が停止されます。不動産の元本と利息は同じプールに返されます。"
 bfl_deposit_ledger_title: "預金台帳と整備"
 bfl_deposit_ledger_title_tip: "銀行の負債、承認された条件、未払いの請求。奉仕活動は外交許可の継続に依存するものではありません。"
 bfl_deposit_policy_title: "新規預金の金利"
 bfl_deposit_policy_title_tip: "#T 新規預金の金利#!\n新しい需要口座で受け入れられる年利を選択します。\n\n現在のオファー: [Country.MakeScope.GetVariable('bfl_demand_rate').GetValue|%2]\n定期口座オファー: [Country.MakeScope.GetVariable('bfl_term_rate').GetValue|%2]\n\n既存のアカウントは開設時に合意したレートを維持します。毎月の貸付利息は銀行の負債を増加させ、剰余金を減少​​させます。支払われるまで現金は移動しません。"
 bfl_deposits: "デポジットと金利"
 bfl_deposits_label: "預金請求"
 bfl_dev_notice: "資金提供されたクレジット、ソブリン債、企業投資、商品、コメンダ、金融サービスは、調査、プロファイル、構築要件に従います。リリース全体のキャンペーンのバランスと互換性はまだ検証中です。"
 bfl_distress: "苦痛と発達のゲート"
 bfl_distribution_title: "利益配分"
 bfl_distribution_title_tip: "#T 毎月の株式配当金#!\nソブリン配当 = ソブリン株式 × ((銀行の月次純利益 × 配当性向) / 発行済株式数)。\n\n配当性向： [Country.MakeScope.GetVariable('bfl_payout_ratio').GetValue|%0]\n費用と繰越損失後の純利益: [Country.MakeScope.GetVariable('bfl_monthly_net_income').GetValue|2]@gold!\nソブリン株式: [Country.MakeScope.GetVariable('bfl_state_units').GetValue|2]\n発行済株式数: [Country.MakeScope.GetVariable('bfl_total_units').GetValue|2]\n前回の配当総額: [Country.MakeScope.GetVariable('bfl_dividend_paid').GetValue|2]@gold!\n最後のソブリン配当: [Country.MakeScope.GetVariable('bfl_state_dividend_paid').GetValue|2]@gold!\n\n主権者が最初に所有する 100%。新たに銀行に加入すると資本が増加し、所有権が希薄化します。資金による支払いは、現金、資本、未払いの債務によって制限されます。マイナスの利益は配当をもたらさない。留保利益は翌月には再度カウントされません。元金、預金、定期借入、借入は除きます。"
 bfl_dividend_explanation: "預金利息、営業経費、繰越損失資金の配当を差し引いた月次純利益。各所有者は、発行済み株式ごとに資金提供された配当金を乗じた所有株式を受け取ります。利益剰余金は翌月には再度分配されません。"
 bfl_draw_bond: "借りる 100 銀行から"
 bfl_draw_bond_tip: "チャータード銀行が支払います 100 永久国債には金。毎月 1 回の発行で、保護された現金、資本、および発行者の負債能力が条件となります。収益は融資となります。現在の所有者に額面を返済して引退させます。"
 bfl_equity_debt: "銀行の資本と負債"
 bfl_equity_debt_tip: "#T 銀行の資本と負債#!\n最大 12 個の実際の月次決済スナップショット。緑色は資産から負債を引いたものです。赤は銀行の負債総額です。どちらも、マイナスの資本を含む、自動的にスケーリングされる同じゴールド軸を使用します。サンプルは左側の最も古いものから右側の最新のものまで実行されます。値と会計月のサンプルにマウスを移動します。州の融資はこの銀行履歴には含まれていません。"
 bfl_equity_label: "銀行資本"
 bfl_equity_label_tip: "#T 銀行資本#!\n義務を終えた後の銀行の所有者に属する残存価値。\n\n資産: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_assets')|2]@gold!\n負債総額が少なくなる: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_liabilities')|2]@gold!\n資本: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_equity')|2]@gold!\n\n記録された状態単位: [Country.MakeScope.GetVariable('bfl_state_units').GetValue|2]\n総所有単位: [Country.MakeScope.GetVariable('bfl_total_units').GetValue|2]\n資本のヘッドルーム: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_capital_headroom')|2]@gold!\n\n資本がマイナスになると破産を意味します。資本のヘッドルームは自己資本を上回ります 10% 資産の最小値はゼロ。分配金は、このヘッドルームと利用可能な現金の両方によって制限されます。資本はすぐに出金できる金額ではありません。"
 bfl_equity_market: "株価と歴史"
 bfl_equity_subscribe_0: "財務省: 購読する 100 ゴールド"
 bfl_equity_subscribe_0_tip: "プライマリ NAV サブスクリプション: 発行者に支払い、既存の保有者を希薄化します。不動産の購入には実際の不動産ウォレットが使用され、資産が保存されます。 25 ゴールド。銀行投資家は、保護された自己の現金と資本剰余金のみを使用します。会社の資本については海外投資の調査が必要です。"
 bfl_equity_subscribe_1: "バーガー: 購読する 100 ゴールド"
 bfl_equity_subscribe_1_tip: "プライマリ NAV サブスクリプション: 発行者に支払い、既存の保有者を希薄化します。不動産の購入には実際の不動産ウォレットが使用され、資産が保存されます。 25 ゴールド。銀行投資家は、保護された自己の現金と資本剰余金のみを使用します。会社の資本については海外投資の調査が必要です。"
