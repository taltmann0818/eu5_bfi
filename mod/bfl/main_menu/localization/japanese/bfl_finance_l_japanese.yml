 bfl_money_hint: "カーソルを合わせると準備金、保有者、決済が表示されます"
 bfl_money_hint_tip: "ノートは完全に留保された請求と正貨を交換します。受け入れは任意です。事前割引 75 対する金 100-金の第三銀行券。清算は、すべての会員が正味借方を支払うことができる場合にのみ、一致する満期手形を決済します。既存の請求権は、失われた権限と建物を存続させます。"
 bfl_money_leave: "Leave clearing"
 bfl_money_leave_tip: "ノートは完全に留保された請求と正貨を交換します。受け入れは任意です。事前割引 75 対する金 100-金の第三銀行券。清算は、すべての会員が正味借方を支払うことができる場合にのみ、一致する満期手形を決済します。既存の請求権は、失われた権限と建物を存続させます。"
 bfl_money_lending_rate: "New lending base"
 bfl_money_lending_rate_tip: "将来の普通融資の年間基準を循環させる 3%, 6% そして 9%。借り手調整は引き続き適用されます。承認されたローンは金利を維持します。"
 bfl_money_notes: "Acquire 100 in notes"
 bfl_money_notes_tip: "絶対主義、中央銀行とソブリン紙幣の研究、生きたソブリン認可、現在の首都における発行者の完成した銀行支店とソブリンの完成した中央銀行が必要です。 100 国庫の金と未使用の紙幣の容量。 The smaller of 25% bank equity and 500 gold caps circulation."
 bfl_money_offer_accept: "Fund the secured advance"
 bfl_money_offer_accept_tip: "Fund 75 現在の管理者、見積書、および第三銀行の担保が有効な場合、貸し手が利用可能な現金から金を調達します。この施設では、受け入れられる年率が固定されています。少なくとも生活保護費は 9%."
 bfl_money_offer_decline: "Decline the request"
 bfl_money_offer_decline_tip: "ゴールドを移動したり担保を差し入れたりせずに、このリクエストを閉じます。"
 bfl_money_offer_desc: "前進 75 別途資金を調達した金との対比 100- 第三の銀行に保管されている金紙幣。あ 25% ヘアカットは貸し手を守る。承認された年間割引率は 1 か月間適用されます。少なくとも生活保護費は 9%。決済ではまず貸し手に支払い、残りを借り手に返します。資金のない担保は両方の請求権を保持します。このリクエストは今月期限切れになります。"
 bfl_money_offer_title: "安全な決済施設"
 bfl_money_policy_rate: "サイクル将来割引率"
 bfl_money_policy_rate_tip: "将来の担保付き前払いの年率を次のように循環させます。 6%, 9% そして 12%。受付時に 1 か月分の料金がかかります。既存の施設は料金を維持します。少なくとも生活保護費は 9%."
 bfl_money_redeem: "州紙幣を引き換える"
 bfl_money_redeem_tip: "主権管理者が保有するすべての紙幣を額面と引き換えます。権限、研究機関、支部を失っても、既存の請求は取り消されません。未払いの請求がまだ残っています。"
 bfl_money_repay: "返済保障制度"
 bfl_money_repay_tip: "現在の担保付き前払い金とその固定受領手数料を返済して、第 3 銀行の手形質権を解除します。十分な量のゴールドが必要です。"
 bfl_money_revoke: "権限を取り消す"
 bfl_money_revoke_tip: "新しい紙幣に対するソブリン認可を撤回します。既存のノートは引き続き引き換え可能です。"
 bfl_money_settings: "ポリシー"
 bfl_money_settings_tip: "金融政策、メモ権限、安全な信用および決済管理を表示または非表示にします。"
 bfl_money_settings_tip_tip: "ノートは完全に留保された請求と正貨を交換します。受け入れは任意です。事前割引 75 対する金 100-金の第三銀行券。清算は、すべての会員が正味借方を支払うことができる場合にのみ、一致する満期手形を決済します。既存の請求権は、失われた権限と建物を存続させます。"
 bfl_money_subtitle: "償還請求・積立決済"
 bfl_money_subtitle_tip: "ノートは完全に留保された請求と正貨を交換します。受け入れは任意です。事前割引 75 対する金 100-金の第三銀行券。清算は、すべての会員が正味借方を支払うことができる場合にのみ、一致する満期手形を決済します。既存の請求権は、失われた権限と建物を存続させます。"
 bfl_money_terms: "元本と発行額は収入から除外されます。割引率は年間であり、承認された時点で固定されます。自信が失われる 25 準備金不足について。完全に裏付けされたノートではインフレは発生しません。バニラの支払いでは引き続きネイティブゴールドが使用されます。"
 bfl_money_terms_tip: "ノートは完全に留保された請求と正貨を交換します。受け入れは任意です。事前割引 75 対する金 100-金の第三銀行券。清算は、すべての会員が正味借方を支払うことができる場合にのみ、一致する満期手形を決済します。既存の請求権は、失われた権限と建物を存続させます。"
 bfl_money_title: "お金と決済"
 bfl_money_title_tip: "元本と発行額は収入から除外されます。割引率は年間であり、承認された時点で固定されます。自信が失われる 25 準備金不足について。完全に裏付けされたノートではインフレは発生しません。バニラの支払いでは引き続きネイティブゴールドが使用されます。"
 bfl_mortzenhaus: "モルツェンハウス"
 bfl_mortzenhaus_desc: "モルツェンハウスから、商人は北部の港を経由して船、手紙、信用を送ります。同社の計数室は管理の負担を軽減し、同社のネットワークはハンブルクへの商取引を引き寄せます。"
 bfl_mortzenhaus_maintenance: "モルツェンハウス管理"
 bfl_native_credit_label: "融資ポートフォリオ"
 bfl_native_credit_label_tip: "記録された取得価格で銀行が保有するローン。行には、元本、年利、および最後のレビュー時の残りの月数が表示されます。"
 bfl_native_tab: "国の融資"
 bfl_native_takeover: "ネイティブテイクオーバー"
 bfl_native_takeover_result_tt: "当銀行は、適格な不動産保有ローンを 1 件、見積価格で購入します。遺産は支払いを受け取り、同じローンが銀行に渡され、借り手は新たな元金を受け取りません。銀行は借り手の資本の中に営業支店を持ち、十分な未コミットの現金と資本を持っていなければなりません。"
 bfl_new_capital_subscription: "新しい資本を購読する"
 bfl_new_capital_subscription_desc: "投資する 100@gold! あなたの銀行の資金のうち、 [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_issuer').GetCountry.GetName] 有形NAVでの新規発行株式として。発行者は支払いを受け取り、既存の保有者は希薄化されます。これは株式の購入とは別の資本の申し込みです。実行では、取得されたNAV、発行されたユニット、研究、保護された資金、集中制限が再チェックされます。外交官を 1 人消費し、この発行者の 1 か月の取引クールダウンを開始します。"
 bfl_new_capital_subscription_tip: "主な資金調達: 投資 100 管理された銀行からの金。発行者は現金を受け取り、新株を発行します。これは既存の株式の取引とは別のものです。"
 bfl_no_automatic_tribute: "自動チャーターのトリビュートなし"
 bfl_no_automatic_tribute_cost_modifier: "自動チャーターのトリビュート費用"
 bfl_no_bank: "意思決定を通じて既存の州立銀行を認可するか、独立した銀行国としてプレイします。銀行を設立するには、あなたの国が資本市場を所有している必要があります。"
 bfl_no_bank_holdings: "銀行が保有する株式はありません。"
 bfl_no_bank_short: "チャーター銀行なし"
 bfl_no_deposit_accounts: "デポジットなし"
 bfl_nobles_estate_workout_mandate: "エステートトレーニングの義務化"
 bfl_nobles_estate_workout_mandate_desc: "この財団は政府に、政府に代わって自主的な銀行預金ワークアウトを審査する権限を明示的に与えている。すべての提案は依然として個別に承認される必要があります。この特権を取り消すと、保留中の財産条件が無効になります。回復の支払いは遺産ウォレットに継続されます。"
 bfl_offer_bank_shares: "新しい銀行株を売り出す"
 bfl_offer_bank_shares_tip: "他の銀行や国が購読できるようにする 100 銀行の現在の純資産価値での金。新株は支払いが行われた場合にのみ発行されます。既存の所有者は希薄化する。ネイティブ バンキングの調査とプラスの資本は引き続き必要です。"
 bfl_offer_bond: "銀行保有のソブリン債を発行する"
 bfl_offer_bond_tip: "銀行が保有する最も古い債券を 3 か月間リストします。 98% 額面通り。販売と購入の両方で、所有する完成した証券取引所の建物が必要です。承認では、販売者、現在の所有者、世代、資金、有効期限が再確認されます。延滞は取引をブロックします。"
 bfl_offer_bond_workout_01: "オファーの再構築"
 bfl_offer_bond_workout_01_tip: "この現在の保有者に、 20% 元本と未払いクーポンの削減、および年間 1 パーセント ポイントのクーポン削減。 1% 床。保有者が別途承諾しない限り、お金は動きません。見積もりの​​有効期限は今月であり、請求を変更すると無効になります。"
