 bfl_fuggerhauser_desc: "このアウグスブルクのファサードの裏に保管されている帳簿には、銅貿易に対する王室の借金が紐付けられています。その家は所有者の借入金利を0.5パーセントポイント引き下げます。同社の銅事業は地元市場の需要を増加させ、需要と供給が許す限り銅の価格を支えています。"
