 bfl_strategy_automatic: "AI義務化・自動化"
 bfl_strategy_credit: "最終レビュー: 同意のために提供されたクレジット"
 bfl_strategy_delegated: "投資権限・委任"
 bfl_strategy_deposit: "前回のレビュー: 100 要求に応じて配置される金"
 bfl_strategy_disable: "投資を管理する"
 bfl_strategy_disable_tip: "自動ローン購入、新しい戦略の提案、および需要の配置を停止します。既存のローン、預金、待機中の請求は引き続き処理されます。商品、株式、支店のポリシーは分離されたままです。"
 bfl_strategy_enable: "投資を委任する"
 bfl_strategy_enable_tip: "既存のネイティブ ローンのスコア付き購入、適格な AI 取引相手へのクレジットおよび貨物のオファー、および超過現金需要の配置を承認します。流動性が低い場合、所有するソブリン債が 1 つ上場される可能性があります。 98% 顔の;認められた再販では損失が発生する可能性があります。 Cargo は、現在の規約と通常の同意および物理的な決済を使用します。ソブリン借入、配当、商品、金融当局は個別のポリシーを維持します。新規事業は解決策で止まってしまう。"
 bfl_strategy_idle: "最終レビュー: 流動性の保持"
 bfl_strategy_manual: "投資命令・マニュアル"
 bfl_strategy_recall: "最終レビュー: 預金の回収が要求されました"
 bfl_strategy_resale: "最終レビュー: 流動性を得るために所有債券が提供されます"
 bfl_strategy_secondary_statement: "ネイティブローンの自動購入: [Country.MakeScope.GetVariable('bfl_strategy_takeovers').GetValue|0] · 債券再販相場: [Country.MakeScope.GetVariable('bfl_strategy_resales').GetValue|0]"
 bfl_strategy_secondary_tip: "既存のローンの購入では、最大 12 件の完了した資本支店の顧客が審査されます。借り手は流動性、平和、マイナスでない予算、そして少なくとも 0.50 信用力。購入したものは保持されます 100 無料の現金、取得プレミアムの上限は 25% 残りの元本と借り手のエクスポージャー総額の合計 25% 資本の。予想される月間マージンは少なくとも 0.10 プレミアム、整備手当、保守的な資金コストを除いた金。これは推定値です。早期返済や債務不履行によっても損失が生じる可能性があります。流動性が低い場合、所有するソブリン債が 1 つで価格が変動する可能性があります。 98% 完了した証券取引所を通じて顔の一部を公開します。資金提供された購入者の同意が得られるまで、再販収益は計上されません。"
 bfl_strategy_statement: "月次レビュー: [Country.MakeScope.GetVariable('bfl_strategy_reviewed').GetValue|0]/12  · スコア: [Country.MakeScope.GetVariable('bfl_strategy_score').GetValue|2]\nクレジット特典: [Country.MakeScope.GetVariable('bfl_strategy_offers').GetValue|0]  · 入金済み: [Country.MakeScope.GetVariable('bfl_strategy_placements').GetValue|0]  · 回想: [Country.MakeScope.GetVariable('bfl_strategy_recalls').GetValue|0]"
 bfl_strategy_title: "投資義務"
 bfl_strategy_title_tip: "保守的な毎月の義務。最大 12 の信用候補者、それぞれ 4 つのソース市場を持つ 12 の接続ベンチャー オペレーター、または 12 の預金銀行を検討します。 At most one credit offer, cargo offer or 100-gold demand placement monthly.クレジットと貨物のオファーは 3 か月間クールダウンされます。 Cargo requires a quoted margin of at least 10% and one gold bank surplus, retains 500 無料の現金、および 2 つのアクティブな契約に制限されており、 25% 資本。引用符は変更される可能性があります。損失の可能性は依然として残ります。保護された現金、研究、支店、プロファイルの権限は引き続き適用されます。"
 bfl_strategy_venture: "最終レビュー: 同意のために貨物パートナーシップが提案されました"
 bfl_streamline_bank: "管理の合理化 · 100 ゴールド"
 bfl_streamline_bank_tip: "支払う 100 国の金を一度、固定銀行運営費を削減する 10%。憲章改革、銀行業務および高度清算により、追加の削減が行われます。この決定は銀行の利益を生み出しません。"
 bfl_subscribe_bank: "購読する 100 銀行資本の金"
 bfl_subscribe_bank_act: "$bfl_subscribe_bank$"
 bfl_subscribe_bank_desc: "プロフィール、年齢、調査、登録チェックを経て、あなた自身の金庫から資金が提供されます。元本は銀行の利益ではありません。銀行資本サブスクリプションでは、現在の純資産価値でユニットを購入します。"
 bfl_subscribe_bank_effect_text: "$bfl_subscribe_bank$"
 bfl_subscribe_bank_effect_text_past: "$bfl_subscribe_bank$"
 bfl_suspend_command: "新規入金の停止"
 bfl_suspend_command_tip: "#T 新規入金の停止#!\n新しい預金の受け入れと、預金の受け入れを必要とする資金調達アクションを停止します。既存の口座、利息義務、出金要求は記録されたままになります。この規制は銀行を閉鎖したり、借金を免除したりするものではありません。"
 bfl_term_accept: "これらの固定条件に同意します"
 bfl_term_decline: "既存のアカウントを維持する"
 bfl_term_deposit: "定期預金"
 bfl_term_deposits_desc: "商人は常に自分の資金を同時に使用できるわけではありません。合意された期間にわたって銀行に資金を預けることで、彼らは銀行家に安定した資金源を与え、資金への即時アクセスを放棄することに対する補償を受け取ります。"
 bfl_term_offer_1_desc: "成熟した自分を更新する [ROOT.GetCountry.MakeScope.GetVariable('bfl_deposit_offer_principal').GetValue|2] の金元金 12 月に [ROOT.GetCountry.MakeScope.GetVariable('bfl_deposit_offer_rate').GetValue|%1] 毎年。未払い利息は別途お支払いいただきます。新しいプリンシパルの異動はありません。このオファーは月末に期限切れになります。変更された申し立てには新しいオファーが必要です。"
 bfl_term_offer_1_title: "満期定期預金を更新する"
 bfl_term_offer_2_desc: "早期引き出しのキューに入れる [ROOT.GetCountry.MakeScope.GetVariable('bfl_deposit_offer_principal').GetValue|2] 解約後のゴールド元本 [ROOT.GetCountry.MakeScope.GetVariable('bfl_deposit_offer_penalty').GetValue|2] 未払い利息の金（最大でも 1% 校長の）。主なペナルティは適用されません。現金不足は引き出しキューに残ったままになります。このオファーは月末に期限切れになります。変更された申し立てには新しいオファーが必要です。"
