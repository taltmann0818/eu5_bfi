 AM_bfl_chartered_bank: "チャータード銀行"
 LEAD_bfl_chartered_bank: "チャータード銀行コントローラー"
 MODIFIER_TYPE_DESC_bfl_bank_headquarters_cost_reduction: "完成した本社は、このような定期的な管理の削減により、銀行またはその主権者の認可銀行をサポートします。本社サポートの上限は 15% そして主権資本を必要としません。"
 MODIFIER_TYPE_DESC_bfl_bank_loan_yield_bonus: "通常の範囲内で、新規銀行ローンの金利にパーセントポイントを追加します。 20% 天井。在来品へのアクセスは、建物の貢献を拡大します。既存のローンは受け入れられた金利を維持します。"
 MODIFIER_TYPE_DESC_bfl_bank_operating_expenses_modifier: "通常の営業削減後の銀行の経常管理費を変更します。正の値を指定すると経費が増加します。負の値を指定すると減少します。これは管理を変更するものであり、預金金利、現地の建物の​​維持管理、既存の信用契約を変更するものではありません。"
 MODIFIER_TYPE_DESC_bfl_bank_palace_cost_reduction: "所有銀行の定期的な管理を削減します。在来品へのアクセスは、建物の貢献を拡大します。敷金利息、現地の建物の​​維持費、既存の契約は個別に計算されます。"
 MODIFIER_TYPE_DESC_bfl_bank_share_price_bonus: "所有銀行の二次株価をこのパーセンテージだけ引き上げます。在来品へのアクセスは、建物の貢献を拡大します。純資産価値、財務省現金および所有単位は変更されません。"
 MODIFIER_TYPE_DESC_bfl_base_share_value_modifier: "銀行の二次株価を通常の評価額よりも引き上げます。現金の創出、純資産価値の変更、新株の発行、所有単位の変更は行われません。"
 MODIFIER_TYPE_DESC_bfl_commenda_expertise: "信頼できるネットワークにより、各国は収益性の高いコメンダの提案を積極的に受け入れるようになり、実現されたベンチャー余剰に対する銀行の交渉シェアがこの割合だけ増加します。あ 10% ボーナスの変更 75% 共有する 82.5%、または 50% 共有する 55%。利益は生まれません。すべての支払いは、指定されたアクティビティの実際の収益から発生します。承認された契約は元の条件を保持します。"
 MODIFIER_TYPE_DESC_bfl_copper_market_demand: "完成したフッガーハウザーは、独自の市場に銅の名前付きの非スタック需要を追加します。本来の供給と需要が結果として生じる価格を決定します。商品契約には合意された条件が保持されます。"
 MODIFIER_TYPE_DESC_bfl_enable_advanced_clearing: "参加機関間で検証された相互義務のネット決済を可能にします。清算は、すべての保有者の権利を保持し、資金を生み出すことなく、資金提供された純残高を決済する必要があります。ネイティブの銀行間決済は引き続き利用できません。"
 MODIFIER_TYPE_DESC_bfl_enable_bank_capital_subscriptions: "のプライマリ サブスクリプションを許可します 100 金を銀行に預ける。新しい所有権ユニットの価格は現在の純資産価値に基づいて決定されます。サブスクリプションの収益は、実現利益ではなく払込資本を増加させ、その後の分配に対する比例債権を購入します。"
 MODIFIER_TYPE_DESC_bfl_enable_bank_share_dealing: "従来の権限。銀行株を取得するには、調査なしで完了した証券取引所が必要です。"
 MODIFIER_TYPE_DESC_bfl_enable_collateralization: "記録された担保質権とその適格性チェックのロックを解除します。債務を負担した資産は 2 番目の請求を確保することはできず、回収するには元の債務関係を維持する必要があります。ネイティブ担保実行は引き続き利用できません。"
 MODIFIER_TYPE_DESC_bfl_enable_commenda: "大航海時代の基本金融商品の後に受け入れられたコメンダパートナーシップのロックを解除します。海外投資銀行は、特定された貨物輸送または遠征に資金を提供する場合があります。本来のコスト、保管および測定された販売収益によって収益が決まります。資本は依然としてリスクにさらされています。"
 MODIFIER_TYPE_DESC_bfl_enable_commercial_bills: "全額資金による支払い請求書を許可します。購入者が支払います 100 発行前の金。銀行は支払額と現金の約束を同等に記録します。指定された所有者は、1 か月後に 1 回のみ請求書を引き換えることができます。発行は利益ではありません。"
 MODIFIER_TYPE_DESC_bfl_enable_commodity_forwards: "Merchant Finance の先渡し契約のロックを解除します。各契約では、負担在庫を再利用することなく、相手方、商品、数量、納期、裏付けを記録する必要があります。ネイティブの取引執行は引き続き利用できません。"
 MODIFIER_TYPE_DESC_bfl_enable_commodity_investments: "Merchant Finance の在庫権限のロックを解除します。商品ポジションは、資金提供された在来商品の保有を表し、取得コスト、数量、および管理を維持する必要があります。この開発ビルドでは取引の実行は引き続き利用できません。"
 MODIFIER_TYPE_DESC_bfl_enable_company_equity: "海外投資会社の株式の義務を解除します。金融シェアは、政治的主体の支配とは別に記録されます。確認された企業の分配のみが銀行収入となる可能性があります。サブスクリプションと資本の返還は除外されます。ネイティブ実行は引き続き利用できません。"
 MODIFIER_TYPE_DESC_bfl_enable_corporate_credit: "Merchant Finance の企業信用権限のロックを解除します。融資は銀行現金を特定された企業に移転し、同等の回収可能債権を作成する必要があります。元金返済は利益にはなりません。ネイティブ実行は引き続き利用できません。"
 MODIFIER_TYPE_DESC_bfl_enable_debt_restructuring: "主権再編の使命を解き放つ。修正された満期、利息および元本は、債務者の同意を得て、既存の債権に添付する必要があります。ネイティブ債務調整がサポートされるまで、執行は利用できません。"
 MODIFIER_TYPE_DESC_bfl_enable_liquidity_facilities: "確保された一時的な流動性を解除します。資金は実際の取引先から調達し、現金および資本の制限内に留め、記録された担保を保有する必要があります。キューに入れられた出金は優先度を保持します。ネイティブ機能の実行は引き続き利用できません。"
 MODIFIER_TYPE_DESC_bfl_enable_margining_and_risk_management: "Merchant Finance のフォワード ポジションの証拠金要件を解除します。エクスポージャーは利用可能な担保と現金に基づいて測定する必要があり、コミットメントが増加する前に追加の資金が必要になります。ネイティブ取引と証拠金執行は引き続き利用できません。"
 MODIFIER_TYPE_DESC_bfl_enable_project_security: "海外投資プロジェクトのセキュリティを解除します。特定されたプロジェクト資産および収益は、決済または回収を通じて優先的に保存される単一の記録された債務に担保されなければなりません。ネイティブ プロジェクトの実行は引き続き利用できません。"
 MODIFIER_TYPE_DESC_bfl_enable_public_financial_backstops: "認可されたチャーター銀行に対する公的バックストップの権限を解除します。支援には、実際の国庫拠出と記録された請求権または所有単位が必要です。保証は現金を鋳造したり、損失を消したりすることはできません。スタンディングバックストップ実行はまだ実装されていません。"
 MODIFIER_TYPE_DESC_bfl_enable_sovereign_banknotes: "認可されたチャータード銀行のソブリン紙幣発行のロックを解除します。手形は償還可能な負債です。裏付けには、紙幣自体を売却して調達した現金は含まれません。ネイティブ発行と所有者支払いルーティングは引き続き利用できません。"
 MODIFIER_TYPE_DESC_bfl_enable_term_deposits: "の定額預金が可能 100 12か月満期のゴールド。利息は口座開設時に承認された利率で毎月発生します。未熟な元本は引き出すことができません。預金は銀行の負債のままです。"
 MODIFIER_TYPE_DESC_bfl_enable_warehouse_receipts: "特定された在庫ロットに裏付けられた Merchant Finance の領収書のロックを解除します。各領収書は、負担のないユニット 10 個を予約し、積立された保管手数料を請求します。新しい領収書を発行するには、ネイティブ商品の保管がサポートされている必要があります。"
 MODIFIER_TYPE_DESC_bfl_fine_cloth_market_demand: "完成したパラッツォ ペルッツィは、独自の市場に高級布地に対する明確な非累積需要を追加します。本来の供給と需要が結果として生じる価格を決定します。商品契約には合意された条件が保持されます。"
 MODIFIER_TYPE_DESC_bfl_global_bank_access: "銀行は、首都に銀行支店が完成していない国でもサービスを提供することができます。研究、専門化、外交、同意、流動性、資本の要件は引き続き適用されます。"
 MODIFIER_TYPE_DESC_bfl_loan_profitability_modifier: "新しく提供されるローンに提示される金利を掛け合わせます。あ 5% ボーナスの変更 10% に引用する 10.5%、通常の条件に従って 20% 天井。借り手は申し出を受け入れなければなりません。既存のローンは合意された金利を維持します。"
 MODIFIER_TYPE_DESC_bfl_no_automatic_tribute_cost_modifier: "チャーター関係には自動的な貢ぎ物はありません。国の収入は、保有する銀行株の預金利子と配当から得られます。"
