 bfl_facility_title_tip: "#T 債務ファシリティの義務#!\nこの銀行は、固定の年次クーポンを使用してカスタムソブリン債に資金を供給しています。オフにすると、スケジュールされた問題が停止します。借金の最初の要求 60% 支出予測の。バッファターゲット 200 予測月次残高後の状態の金。どちらも止まります 500 状態はゴールド。\n\n最後にリクエストしたもの: [Country.MakeScope.GetVariable('bfl_facility_requested').GetValue|2]@gold!\n最後に資金を提供した: [Country.MakeScope.GetVariable('bfl_facility_paid').GetValue|2]@gold!\n\n手動描画と自動描画は、 1,000 ゴールドの月間制限。銀行の現金、資本、発行者の能力、未払いのクーポンが保護されていれば、引き分けを防ぐことができます。収益は収入ではなく融資です。"
