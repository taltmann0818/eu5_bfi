 bfl_goods_transfer_desc: "価格: [ROOT.GetCountry.MakeScope.GetVariable('bfl_goods_transfer_price').GetValue|2] ゴールド。数量: [ROOT.GetCountry.MakeScope.GetVariable('bfl_goods_transfer_quantity').GetValue|3]。あなたの支払いは現在の所有者に送られます。保管は銀行にあります。保管、腐敗、配送期間は継続します。受け入れは、変更されたバッキング、ホルダー、ロット生成、または価格を拒否します。"
