 bfl_charter_begin_tip: "対象となる州銀行セレクターを開きます。銀行が選択されるまで、資金や研究内容は変更されません。キャンセルすると、両方の財務省は変更されません。"
 bfl_charter_selection_tip: "転送 [ROOT.GetCountry.MakeScope.ScriptValue('bfl_charter_investment')|0]@gold! 選択された銀行に新しい州資本として譲渡されます。国、建物、既存の請求権と義務を維持し、その後、永続的な専門分野を選択します。"
 bfl_chartered_bank: "チャータード銀行"
 bfl_chartered_bank_desc: "建物を拠点とする州立銀行が設立されました。その現金と債務は主権者から分離されたままです。自動的に貢物が徴収されることはありません。"
 bfl_clearing: "クリアリング"
 bfl_clearing_tip: "#T 高度なクリアリング#!\n革命、アドバンスト・クリアリング、およびネイティブ・クリアリング・ハウスの研究。所有されている完了した手形交換所と明示的な会員登録により、一致する満期手形のアトミックな純決済が可能になります。 short メンバーはバッチをブロックし、すべてのクレームを保持します。"
 bfl_clergy_estate_workout_mandate: "エステートトレーニングの義務化"
 bfl_clergy_estate_workout_mandate_desc: "この財団は政府に、政府に代わって自主的な銀行預金ワークアウトを審査する権限を明示的に与えている。すべての提案は依然として個別に承認される必要があります。この特権を取り消すと、保留中の財産条件が無効になります。回復の支払いは遺産ウォレットに継続されます。"
 bfl_close_bank_offering: "株式公開を終了する"
 bfl_close_bank_offering_tip: "外部サブスクリプションの受け入れを停止します。既存の所有権と配当の権利は引き続き有効です。ソブリンは依然として自らの銀行の資本を増強することができる。"
 bfl_close_bond_offer: "クローズ債券の発行"
 bfl_close_bond_offer_tip: "現在の二次募集を撤回します。未払いの負債とクーポンは未払いのままです。"
 bfl_collateral: "担保"
 bfl_collateralization: "担保化"
 bfl_collateralization_desc: "約束が財産によって裏付けられると、信頼は強化されます。質権とそれに対する債権者の権利を記録することで、銀行家は、債務者が契約を守らなかった場合に回収できる資産を担保に融資を行うことができます。"
 bfl_commenda: "コメンダ"
 bfl_commenda_available_color: "green"
 bfl_commenda_available_icon: "@bfl_commenda_opportunity!"
 bfl_commenda_available_left_click: "この操作を確認してください"
 bfl_commenda_available_name: "資金提供可能なコメンダ"
 bfl_commenda_available_tooltip: "[GetPlayer.MakeScope.GetVariable('bfl_op_country').GetCountry.GetName] · 10 [GetPlayer.MakeScope.GetVariable('bfl_op_good').Goods.GetNameWithNoTooltip]\n[GetPlayer.MakeScope.GetVariable('bfl_op_from').GetMarket.GetName] → [GetPlayer.MakeScope.GetVariable('bfl_op_to').GetMarket.GetName]\n推定銀行コスト: [GetPlayer.MakeScope.GetVariable('bfl_op_cost').GetValue|2]@gold!\n示唆的な銀行黒字: +[GetPlayer.MakeScope.GetVariable('bfl_op_surplus').GetValue|2]@gold!\n\n現在の市場相場は 2 か月間の貨物輸送です。剰余金には回収された資本は含まれません。料金やアクセスは変更される場合があります。資本と収益がリスクにさらされています。この貨物の実際の販売のみが契約の支払いとなります。オペレーターは受け入れる必要があります。商談は毎月更新され、オファーが送信される前に再度チェックされます。"
 bfl_commenda_cargo: "コメンダ: 発見された地域の貨物を輸送する"
 bfl_commenda_cargo_act: "発見された地域の貨物を船舶で輸送する"
 bfl_commenda_cargo_desc: "スポンサー付きのオペレーターと、発見されたエリアの中心またはその境界にある市場から 10 単位の貨物を選択します。未使用の受け入れられた資金のみが、本来の購入コストを支払うことができます。証拠開示の支払いや無関係な取引の帰属はありません。"
 bfl_commenda_cargo_effect_text: "発見された地域の貨物を船舶で輸送する"
 bfl_commenda_cargo_effect_text_past: "発見された地域の貨物を船舶で輸送する"
 bfl_commenda_cargo_tip: "承認された遠征の検証済み発見、残りの承認、ネイティブ市場へのアクセスおよび在庫が必要です。オペレーターまたは政治的コントローラーが航海の指揮を執ります。"
 bfl_commenda_desc: "航海を行う商人は、船を満杯にする資本がなくても取引できるスキルを持っている場合があります。コメンダは、投資家の資金を旅行パートナーの労働力に結合し、合意に従って事業の収益を分配します。"
 bfl_commenda_expedition: "指定された遠征に資金を提供する"
 bfl_commenda_expedition_act: "指定された遠征に資金を提供する"
 bfl_commenda_expedition_desc: "オペレーター、その発射港、未発見の海域、および探検家を選択してください。海上目標はオペレーターの海軍射程内にある必要があります。土地を持たない企業は、選択された所有施設ホストの範囲を使用します。受け入れは、提案された条件に基づいたネイティブの準備に資金を提供します。銀行は政治的支​​配を一切得ません。"
 bfl_commenda_expedition_effect_text: "指定された遠征に資金を提供する"
 bfl_commenda_expedition_effect_text_past: "指定された遠征に資金を提供する"
 bfl_commenda_expedition_tip: "同意する前に、オペレーター、エリア、発射港、探査機を選択してください。資金提供により実際のネイティブ準備費用のみが支払われます。準備品は返金できません。残りの認可は、発見された地域を中心とする、または発見された地域に隣接する市場からの貨物に融資することができます。測定された売上収益のみが返品を支払うことができます。"
 bfl_commenda_opportunity_consent: "この名前付き貨物と実際の資金提供機関を再確認してください。現在の利用規約を使用してオファーを送信します。オペレーターが承諾するまでお金は動きません。"
 bfl_commenda_opportunity_later: "後で検討してください"
 bfl_commenda_opportunity_propose: "これらの規約をオペレーターに送信してください"
 bfl_commenda_opportunity_review: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_op_country').GetCountry.GetName] · 10 [ROOT.GetCountry.MakeScope.GetVariable('bfl_op_good').Goods.GetNameWithNoTooltip]\n[ROOT.GetCountry.MakeScope.GetVariable('bfl_op_from').GetMarket.GetName] → [ROOT.GetCountry.MakeScope.GetVariable('bfl_op_to').GetMarket.GetName]\n推定銀行コスト: [ROOT.GetCountry.MakeScope.GetVariable('bfl_op_cost').GetValue|2]@gold!\n示唆的な銀行黒字: +[ROOT.GetCountry.MakeScope.GetVariable('bfl_op_surplus').GetValue|2]@gold!\n\n現在の市場相場は 2 か月間の貨物輸送です。剰余金には回収された資本は含まれません。料金やアクセスは変更される場合があります。資本と収益がリスクにさらされています。この貨物の実際の販売のみが契約の支払いとなります。オペレーターは受け入れる必要があります。商談は毎月更新され、オファーが送信される前に再度チェックされます。"
 bfl_commenda_tip: "#T コメンダ#!\n定められた利益分配と引き換えに、航海や貿易事業に資金を投入します。コメンダの研究、海外投資、大航海時代以降が必要です。このビルドではネイティブ プロジェクトの実行は利用できません。"
 bfl_commercial_bill: "商業法案"
 bfl_commercial_bills: "商業手形"
 bfl_commercial_bills_desc: "商業センター間でコインを運ぶのは費用がかかり、危険です。書面による手形により、商人は信頼できる銀行を通じて債務を決済できるため、発行者の評判が取引手段となります。"
 bfl_commodity_forward: "コモディティフォワード"
 bfl_commodity_forward_tip: "#T コモディティフォワード#!\n将来の商品配送に資金を提供することに同意する。コモディティ・フォワードの調査、マーチャント・ファイナンスおよび絶対主義時代以降が必要です。このビルドでは物理的な配送と決済は利用できません。"
 bfl_commodity_forwards: "コモディティ先物"
 bfl_commodity_forwards_desc: "収穫、出荷、またはワークショップの注文は、配達前に販売される場合があります。将来の価格を確定する協定は、遠い市場や季節の変化などの不確実性にもかかわらず、商人が業務を調整するのに役立ちます。"
 bfl_commodity_inventory: "商品在庫"
 bfl_commodity_inventory_tip: "#T 商品在庫#!\n貿易のために保有される金融商品。コモディティ投資のリサーチ、マーチャント ファイナンス、大航海時代以降が必要です。このビルドでは、物理的な商品の購入、保管、配送は利用できません。"
 bfl_commodity_investments: "コモディティ投資"
 bfl_commodity_investments_desc: "貿易に融資する銀行家は、自ら商品を保有することもできます。穀物、羊毛、その他の商品は投資となり、その価値は保管、輸送、遠く離れた市場の変化するニーズに依存します。"
 bfl_company_crew: "転送 250 船員が会社へ"
 bfl_company_crew_desc: "現在管理しているネイティブ企業を管理します。出資資本は営業利益から除外されます。"
 bfl_company_crew_tip: "現在管理しているネイティブ企業を管理します。出資は資金調達です。企業の分配は、固有コスト、繰越損失、債務準備金、および現金バッファーを除いた留保された貿易収益を使用します。政治的支配者と財政的所有者は別である。"
 bfl_company_equity: "会社の資本"
 bfl_company_equity_desc: "大規模な貿易企業は、少数の商人だけで供給できる財産を必要とします。投資家間で所有権を分割することで、企業は事業のリスクと利益を分散しながら、永続的な資本を集めることができます。"
 bfl_company_equity_tip: "#T 会社の資本#!\n認知された企業の所有権を得るために資本を引き受けます。企業株式の調査、海外投資、宗教改革時代以降が必要です。このビルドでは、ネイティブ企業の発行とホルダーの決済は利用できません。"
 bfl_company_expedition: "会社: ネイティブ探索を準備する"
 bfl_company_expedition_desc: "会社の財務、船員、探検家を利用して、会社の施設で海洋探検の準備をしましょう。ネイティブの準備と進行状況が適用されます。 Discovery は現金や投資利益を生み出しません。"
 bfl_company_expedition_tip: "貿易と探検の任務、地図作成、適格な企業探検家、船員、および利用可能なベンチャー予算が必要です。ネイティブの準備時間が適用されます。"
 bfl_company_exploration_capacity: "企業探索設立"
 bfl_company_exploration_capacity_desc: "容量 500 探査任務が認可されている間は船員。船員は会社から来るか、その政治的責任者から資金提供を受けて来る必要があります。"
 bfl_company_explore: "会社の使命: 貿易と探査"
 bfl_company_explore_desc: "現在管理しているネイティブ企業を管理します。出資資本は営業利益から除外されます。"
 bfl_company_explore_tip: "現在管理しているネイティブ企業を管理します。出資は資金調達です。企業の分配は、固有コスト、繰越損失、債務準備金、および現金バッファーを除いた留保された貿易収益を使用します。政治的支配者と財政的所有者は別である。"
 bfl_company_fund: "貢献する 100 金を会社資本に"
 bfl_company_fund_desc: "現在管理しているネイティブ企業を管理します。出資資本は営業利益から除外されます。"
 bfl_company_fund_tip: "現在管理しているネイティブ企業を管理します。出資は資金調達です。企業の分配は、固有コスト、繰越損失、債務準備金、および現金バッファーを除いた留保された貿易収益を使用します。政治的支配者と財政的所有者は別である。"
 bfl_company_list_equity: "企業株式上場の認可"
 bfl_company_list_equity_desc: "有料 NAV のプライマリ サブスクリプションとセカンダリ取引を承認します。銀行買収には、海外投資、企業株式の調査、二次取引のための完了した取引が必要です。政治的覇権は変わらない。"
 bfl_company_list_equity_tip: "ライブ政治コントローラーは市場への参加を承認します。現金や単位は付与されません。"
 bfl_company_native_channels: "ネイティブ本社の収入と対象者の支払いはネイティブ予算に残ります。企業の株式市場、銀行の企業信用およびコメンダは、それぞれ別の調査および配信ゲートを使用します。"
 bfl_company_panel: "事業会社"
 bfl_company_panel_tip: "会社の財務と政治的支配は、銀行口座から分離されたままです。ネイティブの HQ オーナーの収入、HQ の直接のオーバーロードの収入、およびネイティブのサブジェクトの支払いは、ネイティブの受信者に残ります。ネイティブコストを差し引いた実行された留保取引のみが、追加の所有者分配に資金を提供できます。資本と発見は除外されます。"
 bfl_company_retain: "会社の義務: 利益剰余金"
 bfl_company_retain_desc: "現在管理しているネイティブ企業を管理します。出資資本は営業利益から除外されます。"
 bfl_company_retain_tip: "現在管理しているネイティブ企業を管理します。出資は資金調達です。企業の分配は、固有コスト、繰越損失、債務準備金、および現金バッファーを除いた留保された貿易収益を使用します。政治的支配者と財政的所有者は別である。"
 bfl_company_route: "会社: ネイティブ貿易ルートを開く"
 bfl_company_route_desc: "次を使用して会社所有のネイティブ ルートを 1 つ開きます 0.1 商人の能力。貿易権限、利用可能な運営予算、ネイティブ市場へのアクセス、余剰および生産能力が必要です。 1 社につき月に最大 1 つの指令ルート。ネイティブ AI は独自の取引動作を保持します。"
 bfl_company_route_tip: "会社、ソース市場、宛先市場、販売者市場、商品を選択します。ネイティブ取引コストはエンジンによって課金されます。"
 bfl_company_select: "運営会社を選択"
 bfl_company_select_desc: "現在の政治的支配下にある現地企業を視察してください。"
 bfl_company_select_tip: "現在管理しているネイティブ企業を選択してください。選択および明細表示では、現金の移動や月締めは行われません。"
 bfl_company_statement: "現金: [Country.GetFixedPointCurrencyValue('gold')|2]@gold!   予約済みバッファ: [Country.MakeScope.GetVariable('bfl_company_buffer').GetValue|2]@gold!\nネイティブ貿易: [Country.MakeScope.GetVariable('bfl_company_trade_receipts').GetValue|2]   正味予算: [Country.MakeScope.GetVariable('bfl_company_native_net').GetValue|2]\n対象となる収益: [Country.MakeScope.GetVariable('bfl_company_verified_profit').GetValue|2]   所有者に支払われる: [Country.MakeScope.GetVariable('bfl_company_dividend').GetValue|2]@gold!\n設備: [Country.MakeScope.GetVariable('bfl_company_facility_count').GetValue|0]   ルート: [Country.MakeScope.GetVariable('bfl_company_route_count').GetValue|0]   実行量: [Country.MakeScope.GetVariable('bfl_company_volume').GetValue|2]\n貿易予算: 50   再投資準備金: 100   ベンチャー予算: 100   オーナーへの支払い: 25%"
 bfl_company_strategy_construction: "企業の準備金をネイティブの取引施設に再投資する"
 bfl_company_trade: "会社の使命: 貿易"
 bfl_company_trade_desc: "現在管理しているネイティブ企業を管理します。出資資本は営業利益から除外されます。"
 bfl_company_trade_tip: "現在管理しているネイティブ企業を管理します。出資は資金調達です。企業の分配は、固有コスト、繰越損失、債務準備金、および現金バッファーを除いた留保された貿易収益を使用します。政治的支配者と財政的所有者は別である。"
 bfl_corporate_credit: "企業信用"
 bfl_corporate_credit_desc: "営利企業が 1 回の航海またはシーズンを超えて成長するにつれて、信用の必要性がより永続的になります。銀行は、企業の資源と将来性、そして個々の加盟店の立場を判断する方法を学びます。"
 bfl_corporate_credit_tip: "#T 企業信用#!\n有名な貿易会社に融資します。企業信用調査、マーチャントファイナンス、宗教改革時代以降が必要です。このビルドでは、新しいネイティブ企業ローンの実行は利用できません。"
