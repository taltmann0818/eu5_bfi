 bfl_venture_ticket_tip: "最大の銀行承認をサイクルします 100, 200 または 400 ゴールド。アクティビティの実際のコストのみが描画されます。未使用貨物の資金は直ちに解放されます。未使用の遠征資金は満期まで適格な発見地域貨物のために留保されます。二国間条件では、オペレーターからの銀行承認の半分の容量が必要です。"
 bfl_venture_title: "コメンダベンチャーズ"
 bfl_ventures: "ベンチャー・企業・海外投資"
 bfl_ventures_explanation: "コメンダはディスカバリーから始まります。ネイティブ企業と企業資本には改革が必要です。政治的大君主の支配と財政的所有権は分離されたままである。プロジェクト資本は配当ではありません。"
 bfl_ventures_tip: "#T ベンチャー・企業#!\n資金提供を受けたベンチャー企業、企業投資、プロジェクトのセキュリティ、銀行株式の譲渡に対する許可。これらは資本を投資リスクにさらし、関連する調査と専門知識を必要とします。"
 bfl_view_companies: "企業"
 bfl_view_goods: "グッズ"
 bfl_view_loans: "ローン"
 bfl_view_monetary: "金融サービス"
 bfl_view_monetary_tip: "紙幣、流動性の確保と清算。"
 bfl_view_shares: "株式"
 bfl_view_trade: "貿易金融"
 bfl_warehouse_receipt: "倉庫受領書"
 bfl_warehouse_receipt_tip: "#T 倉庫受領書#!\n識別可能な保管商品に対してクレームを発行します。倉庫受入調査、マーチャント・ファイナンスおよび絶対主義時代以降が必要です。このビルドでは、検証済みのストレージと商品の実行は利用できません。"
 bfl_warehouse_receipts: "倉庫の領収書"
 bfl_warehouse_receipts_desc: "信頼できる倉庫に保管されている商品は、販売のたびに移動することなく商業をサポートできます。領収書により、保管されている商品に対する請求が確立され、商品が保管されている間、その所有者は融資を受けることができます。"
 bfl_welserhaus: "ヴェルザーハウス"
 bfl_welserhaus_desc: "このアウグスブルクの家から、さまざまな要因が道路や海上交通路に沿って指示を送ります。確立された信用により、所有者の借入利息が 0.5 パーセント低下し、そのネットワークにより販売能力と貿易収入が 10 パーセント増加します。"
 bfl_welserhaus_maintenance: "ヴェルザーハウス管理"
 bfl_wisselbank_founding_tt: "Wisselbankを我が国の勅許銀行として設立し、標準の出資額を上限として利用可能な国庫資金を投入する。"
 bfl_wisselbank_name: "Wisselbank"
 bfl_withdraw: "満期を迎えた州預金の引き出し"
 bfl_withdraw_tip: "#T 満期を迎えた州預金の引き出し#!\n州の需要口座と満期定期口座の返済を要求します。銀行は利用可能な現金から元本と貸方利息を支払います。未払いの金額は引き出しキューに記録されたままとなり、新規取引が停止されます。外国口座および満期定期預金は、この措置では引き出すことができません。"
 bfl_workout_decline: "全額の請求を保持する"
 bfl_workout_desc: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_workout_bank').GetCountry.GetName] の入金条件を提案します [ROOT.GetCountry.MakeScope.GetVariable('bfl_workout_claim').GetValue|2] ゴールド。放棄してもよい 20% 残りの請求権のうち、変換前の有形NAVで請求権全体を新規発行株式に変換するか、請求権を保持します。転換にはプラスのNAVと株主の能力が必要ですが、銀行債権者は利用できません。債権者プール [ROOT.GetCountry.MakeScope.GetVariable('bfl_workout_pool').GetValue|0]: 0 財務省、 1 バーガー、 2 貴族、 3 聖職者、 4 農民。エステートの規約には、そのエステートが制定したワークアウト指令が必要です。見積もりの​​有効期限は今月です。回復または管理者の変更により、それは無効になります。"
 bfl_workout_equity: "債権を株式に変換します (プラスの NAV が必要)"
 bfl_workout_haircut: "受け入れる 20% 削減"
 bfl_workout_title: "債権者向けワークアウト提案"
