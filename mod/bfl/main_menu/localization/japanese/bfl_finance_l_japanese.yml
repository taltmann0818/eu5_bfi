 bfl_funding_title: "預金と資本"
 bfl_funding_title_tip: "#T 預金と資本金#!\n預金は州の現金を銀行に移し、返済可能な債権を生み出します。資本サブスクリプションは所有単位を購入するため、価値が失われる可能性があります。どちらも既存のゴールドを転送します。どちらも銀行の利益としてカウントされません。"
 bfl_goods: "商品と保管 · マーチャントファイナンス"
 bfl_goods_accept: "これらの規約に同意します"
 bfl_goods_accept_branch_tip: "表示された 12 か月の税関協定に同意します。毎月の資金提供によるアクセス料金は、同意したホストに支払われます。受け入れると、在庫、商品クレーム、または即時購入が作成されません。"
 bfl_goods_accept_quote_tip: "表示された落札価格に別途1ゴールド保管料を加えた金額を保管業者にお支払いください。ライブバッキング、価格、パーティー、許可、アクセス、保護された資金を再確認します。条件が変更されたり期限切れになったりしても、お金は動きません。"
 bfl_goods_accept_transfer_tip: "表示された譲渡価格を現在の保有者に支払います。既存の領収書を一度転送する前に、所有者、数量、ロット生成、調査、有効期限、および資金を再確認してください。"
 bfl_goods_branch_desc: "ホストは、その資本市場へのアクセスを提供します。 12 月に 1 ホストに支払われる月あたりのゴールド。ネイティブ購入では独自の現金チャージが保持されます。これは別個の保管サービスです。アクセスするには、ホスト自身が完成した税関と平和が必要です。未払いのアクセス、期限切れ、建物の損失、または戦争により、新規の購入と配送が停止されます。ホストは現地保管権を凍結することができます。現金や物品は作成されません。アクセスを復元するには、同じホストで更新します。"
 bfl_goods_branch_title: "税関保管協定書"
 bfl_goods_browser_desc: "物理ロットを選択して、そのオファーを確認します。既存の保有者は配送をリクエストできます。同意した税関の主催者は、アクセスできない保管場所を凍結し、再度アクセスした後に解放することができます。選考時にはオファーの受諾は行われません。"
 bfl_goods_browser_title: "商品の提供と保管の請求"
 bfl_goods_claim_desc: "この領収書を資本市場に送付するようリクエストしてください。各市場への配送には 2 か月かかり、コストもかかる 1 金と負け 1% 量の。あるいは、このウィンドウを閉じて、外交における倉庫受領書転送のオファーを使用します。送金にはレボリューション、マージン、カストディアンでのリスク管理が必要です。買い手は現在の見積もりを受け入れる必要があります。"
 bfl_goods_claim_title: "倉庫クレーム"
