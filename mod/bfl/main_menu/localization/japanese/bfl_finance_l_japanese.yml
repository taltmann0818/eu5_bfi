 bfl_review_trade: "取引を確認する"
 bfl_review_trade_tip: "選択したユニットと正確な支払いを確認してください。売上は少なくとも次のように四捨五入する必要があります 0.01 金;レビューが利用できない場合は数量を増やしてください。有効な貿易が完了するまで外交官は費やされません。"
 bfl_safeguards_title: "流動性と安全対策"
 bfl_safeguards_title_tip: "#T 流動性と安全対策#!\n利用可能な銀行現金： [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_free_cash')|2]@gold!\n保護された現金の要件: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_protected_cash')|2]@gold!\n待機中の出金: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_withdrawals_due')|2]@gold!\n\n資本再構築は州資本を供給します。預金を一時停止すると、既存の義務は維持されたまま、新しい口座への資金提供が停止されます。"
 bfl_sale_unavailable: "株式注文を決済できませんでした"
 bfl_sale_unavailable_desc: "発行者には 1 か月の取引クールダウンがある、外交官がいない、相場が期限切れになっている、または利用可能な株式、資金、取引所へのアクセスが変更されている。新しい相場を得るために株の売買を再開してください。現金や株式の移動はありませんでした。"
 bfl_secured_liquidity: "流動性の確保"
 bfl_secured_liquidity_tip: "#T 流動性の確保#!\n絶対主義、担保化および流動性施設。前進 75 別途資金を調達した金との対比 100-金の第三銀行券。担保は一度ロックされます。受け入れられる固定年率を次で割ります。 12。銀行間の支店は必要ありません。"
 bfl_security_bank_results: "最後の銀行閉鎖"
 bfl_security_financial_heading: "具体的な財務状況"
 bfl_security_financial_subtitle: "株価を支えているもの"
 bfl_security_financial_title: "の資本 [Country.GetName]"
 bfl_security_price_heading: "株価と所有権"
 bfl_security_price_math: "市場価格 = 1 株あたりの具体的な NAV × 毎月の市場プレミアム。注文圧力、ボラティリティ、平均回帰、ディストレストによってプレミアムは変化する可能性があります。主要資本の価格は引き続き NAV で設定されます。未実現利益は融資や配当の原資にはなりません。"
 bfl_security_primary_note: "配当により現金と基準価額が一度減ります。新規資本の価格はNAVで設定されており、買い圧力のシグナルは発生しません。ディーラーの再販入札額が NAV を超えている間は定期購入が一時停止され、即時利益の保証が妨げられます。歴史には実際の観察が含まれています。リロードしても、保存されたマンスリーショックは再ロールされません。"
 bfl_select_buy_shares: "銀行や会社の株を買う"
 bfl_select_profile: "保留中のスペシャライゼーションを選択してください"
 bfl_select_profile_tip: "#T 銀行の専門化#!\nこの銀行がまだ永続的なプロファイルを選択していない場合は、専門分野の選択を開きます。マーチャント ファイナンスと海外投資では、さまざまな研究の道が開かれます。完了したスペシャライゼーションをこのボタンで置き換えることはできません。"
