 bfl_goods_previous: "以前のロット"
 bfl_goods_quote_desc: "数量: [ROOT.GetCountry.MakeScope.GetVariable('bfl_goods_quote_quantity').GetValue|3]。価格: [ROOT.GetCountry.MakeScope.GetVariable('bfl_goods_quote_price').GetValue|2] ゴールドプラス 1 ゴールド保管料。倉庫受領書により、商品は直ちに所有されます。物理的なフォワードは、3 か月後の納品に全額前払いされます。どちらも裏付けのある商品が必要です。保管コスト 0.1 月あたり。物理的な損失は 2% 毎年。フォワードは固定数量を維持します。欠落したユニットは比例配分で返金され、さらに同等の売り手セキュリティ補償が適用されます。別の市場への納品には 2 か月かかり、コストがかかります 1 金と負け 1% 量の。保管と輸送のロスにより、入荷数量が減少します。当事者が無効であるかアクセスが失われた場合、商品と担保は回収のために保存されます。これらの条件がご自身に合った場合にのみ同意してください。"
 bfl_goods_quote_title: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_goods_quote_type').Goods.GetNameWithNoTooltip] 倉庫受け取り"
 bfl_goods_set_allocation_tip: "サイクル 0%, 10%, 25% または 50% 銀行現金と所有在庫コストの合計。保護された現金は常に保持されます。割り当てを減らすと、目標を下回るまでアクセス可能なフリーポジションを売却できます。"
 bfl_goods_set_contracts_tip: "スポットのみ、レシートを自動的に提供する、または物理的な転送を自動的に提供します。オファーには商品の使用年数と調査が必要であり、後退して別の取引相手の承認を待ちます。既存の受け入れられた義務は引き続き保護されます。"
 bfl_goods_set_mandate_tip: "自動: ポリシーに基づいて売買します。一時停止: 裁量取引は禁止されています。ランオフ: アクセス可能な無料在庫を交換せずに販売します。既存の契約、保管、損失はすべてのモードで継続されます。"
 bfl_goods_set_risk_tip: "慎重：利益確定 +10%、ストップロス −5%。バランスのとれた: +20% / −15%。冒険好き: +35% / −25%。制限では、残りのコストに対してネイティブの販売見積もりが使用されます。約定は毎月であり、価格は変動する可能性があります。"
 bfl_goods_set_turnover_tip: "最大保有期間： 6, 12 または 24 数か月。銀行は満期時にアクセス可能な無料ポジションを販売し、新しい商品を自動的に選択します。"
 bfl_goods_settings: "取引方針"
 bfl_goods_settings_tip: "銀行の権限、配分、リスク制限、保有期間、契約ポリシーを設定します。銀行は月次締め切り時にすべての商品と数量を選択します。"
 bfl_goods_tip: "#T 商品と貿易#!\nマーチャント 在庫、受領書、将来の配送、マージンを含む金融商品。記録された許可は商品や貿易ルートを作成しません。物理的な実行が必要です。"
 bfl_goods_trading_locked: "取引がロックされています · 要件にカーソルを合わせてください"
 bfl_goods_transfer_desc: "価格: [ROOT.GetCountry.MakeScope.GetVariable('bfl_goods_transfer_price').GetValue|2] ゴールド。数量: [ROOT.GetCountry.MakeScope.GetVariable('bfl_goods_transfer_quantity').GetValue|3]。あなたの支払いは現在の所有者に送られます。保管は銀行にあります。保管、腐敗、配送期間は継続します。受け入れは、変更されたバッキング、ホルダー、ロット生成、または価格を拒否します。"
 bfl_goods_transfer_title: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_goods_transfer_type').Goods.GetNameWithNoTooltip] 領収書の転送"
