 bfl_bond_secured_accept_tip: "2年間の独占的な歳入誓約と貿易保護の譲歩とともに、見積もられた削減額を受け入れる。実際の執行は発行者の利用可能な現金によって依然として制限されています。"
 bfl_bond_selected_name: "[Country.GetName]"
 bfl_bond_underwriting: "社債引受業務"
 bfl_bond_underwriting_tip: "#T 社債引受業務#!\nチャータード銀行は、カスタムソブリン債の代金を実際に現金で支払います。どちらの専門分野でも引き受けることができます。固定の年間クーポンは毎月支払われます。現在の保有者は償還時に額面を受け取ります。発行には銀行の流動性、資本、主権能力が必要です。"
 bfl_bond_unpaid: "未払いクーポン"
 bfl_bond_workout_accept: "債券再編を受け入れる"
 bfl_bond_workout_desc: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_bond_workout_issuer').GetCountry.GetName] 現在の保有者であるあなたに権利放棄を求めます 20% この債券の元本と未払いクーポンを減額し、年間クーポンを 1 パーセント ポイント削減します。 1% 床。拒否するとすべての条件が保持されます。この提案は今月期限切れになります。支払い、振込、その他の変更があった場合は無効となります。通常の受け入れでは新たな安全性は得られません。オファーがあれば、確実に受け入れられると、2 年間の貿易保護譲歩と最大 2 年間の独占的約束が追加されます。 10% 未払いクーポンの月収の合計。執行では、他のカスタム債券クーポンの前に、利用可能な国庫金のみが使用されます。保証や元本の支払いは発生しません。"
 bfl_bond_workout_secured: "2年間の貿易譲歩と収益約束で受け入れる"
 bfl_bond_workout_title: "社債再編案"
 bfl_branch_construction: "資本銀行支店を設立"
 bfl_branch_required: "新しいソブリン事業には、この銀行が現在の首都に完成した銀行支店が必要です。銀行間のビジネスは免除されます。既存の請求は未払いのままです。"
 bfl_browse_bond_issuers: "発行者と保有銘柄を閲覧する"
 bfl_browse_bond_issuers_desc: "銀行が保有する債権を含む、未払いの債券やオファーを検査する発行者を選択します。"
 bfl_browse_bond_issuers_tip: "未払いのカスタム債券があるライブ発行者を選択します。これでは何も売買されません。"
 bfl_browse_goods: "商品の提供と保管の請求"
 bfl_browse_goods_act: "$bfl_browse_goods$"
 bfl_browse_goods_desc: "身体的監護の提案、既存の請求、または任意の税関アクセス協定を確認してください。国を選択してもお金は動きません。"
 bfl_browse_goods_effect_text: "$bfl_browse_goods$"
 bfl_browse_goods_effect_text_past: "$bfl_browse_goods$"
 bfl_burghers_estate_workout_mandate: "エステートトレーニングの義務化"
 bfl_burghers_estate_workout_mandate_desc: "この財団は政府に、政府に代わって自主的な銀行預金ワークアウトを審査する権限を明示的に与えている。すべての提案は依然として個別に承認される必要があります。この特権を取り消すと、保留中の財産条件が無効になります。回復の支払いは遺産ウォレットに継続されます。"
 bfl_buy_bill: "資金提供された支払い請求書 · 100 ゴールド"
 bfl_buy_bill_tip: "#T 資金提供された支払い請求書#!\n転送 100 支払い請求書に資金を提供するために、州の金を銀行に送ります。この手形は、銀行の利益や無担保ローンではなく、買掛金として記録されます。商業手形の調査、契約テーブルのスペース、およびこのビジネスを受け入れる営業銀行が必要です。"
 bfl_buy_capital: "出資を引き受ける · 100 ゴールド"
 bfl_buy_capital_tip: "#T 銀行資本を購読する#!\n転送 100 州の金で新たな銀行所有単位を購入する。ユニットの価格は、既存ユニットあたりのプラスの銀行資本に基づいて決定されます。これにより、銀行の利益ではなく、現金と払込資本が増加します。ネイティブの銀行調査、資本テーブルのスペース、およびこのビジネスを受け入れる営業銀行によってロックが解除されます。資本は損失の危険にさらされており、預金として引き出すことはできません。"
 bfl_buy_confirm_desc: "購入する [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_quantity').GetValue|3] の株式 [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_issuer').GetCountry.GetName] のために [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_total').GetValue|2]@gold!。これらはマーケットメーカーの在庫からの既存の株式です。発行者は融資を受けず、発行済み株式数は変化しません。見積価格、ライブ市場へのアクセス、利用可能な単位、保護された現金、および集中制限が受け入れ時に再度チェックされます。決済には外交官が 1 人消費され、この発行者の 1 か月間の売買クールダウンが開始されます。"
 bfl_buy_confirm_title: "株式購入の確認"
 bfl_buy_secondary_confirm_desc: "購入する [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_quantity').GetValue|3] の既存株式 [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_issuer').GetCountry.GetName] から [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_seller').GetCountry.GetName] のために [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_total').GetValue|2]@gold!。現在の販売者が支払いを受け取ります。発行者は融資を受けず、発行済み株式数は変化しません。可用性、アクセス、保護された資金、およびこのオファーの改訂は、承諾時に再度確認されます。決済には外交官が 1 人消費され、この発行者の 1 か月間の売買クールダウンが開始されます。"
 bfl_buy_selected_bond: "既存の請求を購入する"
 bfl_buy_selected_bond_tip: "現在の売主に見積価格を支払います。発行者は新たなお金を受け取りません。実行では、所有権、有効期限、生成、両替、延滞、現金が再チェックされます。"
 bfl_buy_shares: "株を買う"
 bfl_buy_shares_desc: "銀行または会社を選択し、株式数量を設定して、合計を確認します。買いは、売りオファーまたはマーケットメーカー在庫から既存の株式を転送します。新規発行の資金を調達するには、別の資本引受アクションを使用します。"
 bfl_buy_shares_tip: "銀行または会社を選択し、株式数量を設定して、合計を確認します。買いは、売りオファーまたはマーケットメーカー在庫から既存の株式を転送します。新規発行の資金を調達するには、別の資本引受アクションを使用します。\n完了した交換、株式取引、および少なくとも 1 人の外交官が必要です。取引が成功するたびに外交官が 1 人消費され、その発行者に対して 1 か月のクールダウンが開始されます。利用可能な外交官: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bfl_available_trade_diplomats')|2]。注文には少なくとも現金価値が必要です 0.01 ゴールド。"
 bfl_buy_sovereign_bond: "募集された国債を購入する"
 bfl_buy_sovereign_bond_act: "$bfl_buy_sovereign_bond$"
 bfl_buy_sovereign_bond_desc: "現在の保有者から既存のソブリン債を購入します。所有する完成した証券取引所の建物が必要です。"
 bfl_buy_sovereign_bond_effect_text: "$bfl_buy_sovereign_bond$"
 bfl_buy_sovereign_bond_effect_text_past: "$bfl_buy_sovereign_bond$"
 bfl_buy_sovereign_bond_tip: "公募の発行者を選択します。支払いは既存の所有者に送られます。発行者は新たな収益を受け取りません。請求権全体は、固定の年次クーポンと元本をそのままにして所有者を変更します。"
 bfl_buy_state_confirm_desc: "買い戻す [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_quantity').GetValue|3] の既存株式 [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_issuer').GetCountry.GetName] マーケットメーカーの在庫から [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_total').GetValue|2]@gold!、あなたの国の財務省から支払われます。これらの株式はあなたの金庫の持ち分に戻ります。銀行は融資を受けず、発行済み株式は変わりません。入手可能なディーラー在庫、現在の市場相場、ライブチャーター権限、および財務省の現金が再度チェックされます。決済には外交官が 1 人消費され、この銀行の 1 か月間の売買クールダウンが開始されます。"
 bfl_cancel: "キャンセル"
 bfl_cancel_selected_bond_offer: "出品をキャンセルする"
 bfl_cancel_selected_bond_offer_tip: "あなたまたはあなたのライブチャーター銀行が所有するオファーを引き出します。負債とクーポンは変更されません。"
 bfl_capital_button: "出資を引き受ける · 100 ゴールド"
 bfl_cash: "国庫現金"
 bfl_cash_tip: "#T 国庫現金#!\n現在銀行が保有している金。\n\n現金総額: [Country.GetFixedPointCurrencyValue('gold')|2]@gold!\n保護された現金: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_protected_cash')|2]@gold!\n利用可能な現金: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_free_cash')|2]@gold!\n\n保護された現金準備金 25% キューに入れられた引き出し後に残っている負債、完全な引き出しキュー、 25 ゴールドの営業バッファーと約束された現金。利用可能な現金は、財務省の現金から準備金を差し引いたもので、最小値はゼロです。保護された現金は必要な準備金です。実際に保有している現金を超える可能性があります。"
