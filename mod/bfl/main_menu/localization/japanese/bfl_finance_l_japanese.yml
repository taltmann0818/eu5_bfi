 bfl_venture_accept: "パートナーシップを受け入れる"
 bfl_venture_accept_tip: "現在の投資家の権限、変更されていないオファー条件、年齢、リサーチ、フリーキャッシュ、資本、能力、オペレーターの貢献を再確認します。資金提供により、選択したアクティビティの実際のネイティブコストのみが支払われます。会社の株式や政治的支配は認められません。"
 bfl_venture_decline: "辞退"
 bfl_venture_duration_12: "期間・ 12 月"
 bfl_venture_duration_120: "期間・ 120 月"
 bfl_venture_duration_24: "期間・ 24 月"
 bfl_venture_duration_6: "期間・ 6 月"
 bfl_venture_duration_60: "期間・ 60 月"
 bfl_venture_duration_tip: "サイクル 6, 12, 24, 60 または 120 数か月。長期はネイティブの探索に対応します。ネイティブアクセスが有効な場合、貨物は 2 か月後に販売されます。ブロックされた貨物は保管されたままになります。リンクされた販売収益のない遠征費用は満期時に償却されます。"
 bfl_venture_empty: "活発な事業はありません。条件を提示する前に、貨物輸送または現地遠征を選択してください。"
 bfl_venture_help: "循環する用語をクリックします。各オペレーターが個別に受け付けます。既存の契約は、政策または研究の変更後も継続されます。"
 bfl_venture_hint: "カーソルを合わせるとアクティビティ、コスト、貨物、返品が表示されます"
 bfl_venture_locked: "新しい事業はロックされています · 要件を確認するためにホバーします"
 bfl_venture_note: "利益の前に資本が回収されます。損失は​​貢献に続きます。指定された事業で取得した貨物のみがその収益に資金を提供できます。無関係な貿易がこの契約を支払うことはありません。発見だけでは何の利益も得られません。閉じられた行は、新たに受け入れられた契約に置き換えられるまで残ります。"
 bfl_venture_offer_desc: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_bank').GetCountry.GetName] オファー [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_ticket').GetValue|0] のための金 [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_duration').GetValue|0] 数か月。プリセット [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_preset').GetValue|0]: 0 = 投資家がすべての資本を資金提供し、受け取る 75% 余剰の; 1 = 投資家は 3 分の 2、運営者は 3 分の 1 を出資し、剰余金は均等に分割されます。資本が最初に回収されます。損失は​​貢献に続きます。指定された事業の実際の販売収益のみが利益を支払うことができます。探査の成功は機会を与えますが、決して金ではありません。このオファーの有効期限は 3 か月です。"
 bfl_venture_offer_desc_0: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_bank').GetCountry.GetName] まで許可します [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_ticket').GetValue|0] ～のための銀行資金の金 [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_duration').GetValue|0] 数か月。購入する 10 [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_good').Goods.GetNameWithNoTooltip] で [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_from').GetMarket.GetName]、2か月間保管してから販売します [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_to').GetMarket.GetName]。銀行はすべての費用を資金提供し、受け取ります [GuiScope.SetRoot(ROOT.GetCountry.MakeScope).ScriptValue('bfl_venture_offered_profit_fraction')|%1] 余剰分の。残りはあなたが保管します。\n\n実際のネイティブコストのみが描画されます。未使用の資金は銀行に残ります。資本は剰余金の前に回収されます。損失は​​貢献に続きます。この貨物の測定された販売収益のみがこの契約を解決します。無関係な収入や発見は何の利益にもなりません。オファーの有効期限は 3 か月です。"
 bfl_venture_offer_desc_1: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_bank').GetCountry.GetName] まで許可します [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_ticket').GetValue|0] ～のための銀行資金の金 [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_duration').GetValue|0] 数か月。購入する 10 [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_good').Goods.GetNameWithNoTooltip] で [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_from').GetMarket.GetName]、2か月間保管してから販売します [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_to').GetMarket.GetName]。銀行は費用の 3 分の 2 を資金提供します。あなたは3分の1を支払います。銀行が受け取ります [GuiScope.SetRoot(ROOT.GetCountry.MakeScope).ScriptValue('bfl_venture_offered_profit_fraction')|%1] 余剰分は残りを保管してください。\n\n実際のネイティブコストのみが描画されます。未使用の資金は銀行に残ります。資本は剰余金の前に回収されます。損失は​​貢献に続きます。この貨物の測定された販売収益のみがこの契約を解決します。無関係な収入や発見は何の利益にもなりません。オファーの有効期限は 3 か月です。"
 bfl_venture_offer_desc_2: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_bank').GetCountry.GetName] まで許可します [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_ticket').GetValue|0] ～のための銀行資金の金 [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_duration').GetValue|0] 数か月。ネイティブ探索を準備する [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_area').GetArea.GetName] から [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_port').GetLocation.GetName] と [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_explorer').GetCharacter.GetName]。銀行は合意されたすべての金コストに資金を提供し、受け取ります [GuiScope.SetRoot(ROOT.GetCountry.MakeScope).ScriptValue('bfl_venture_offered_profit_fraction')|%1] 契約上の剰余金。残りはあなたが保管します。準備品はキャンセルを含め返金不可となります。あなたは、この資金提供契約の外で、乗組員、現地の維持費、およびオプションの遠征費を提供します。残りの銀行承認は、ネイティブアクセスを条件として、発見されたエリアの中心またはその境界にある市場からの10ユニットの貨物に資金を提供することができます。契約上の余剰金を支払うことができるのは、その貨物の測定された売上高から、記録された準備コストと貨物コストを差し引いた額だけです。発見と無関係な取引は何の利益ももたらしません。この特典は 3 か月後に期限切れになります。 "
 bfl_venture_offer_desc_3: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_bank').GetCountry.GetName] まで許可します [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_ticket').GetValue|0] ～のための銀行資金の金 [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_duration').GetValue|0] 数か月。ネイティブ探索を準備する [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_area').GetArea.GetName] から [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_port').GetLocation.GetName] と [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_explorer').GetCharacter.GetName]。銀行は合意された金価格の 3 分の 2 を資金提供します。あなたは3分の1を支払います。銀行が受け取ります [GuiScope.SetRoot(ROOT.GetCountry.MakeScope).ScriptValue('bfl_venture_offered_profit_fraction')|%1] 契約上の剰余金を差し引いた後、残りを保持します。準備品はキャンセルを含め返金不可となります。あなたは、この資金提供契約の外で、乗組員、現地の維持費、およびオプションの遠征費を提供します。残りの銀行承認は、ネイティブアクセスを条件として、発見されたエリアの中心またはその境界にある市場からの10ユニットの貨物に資金を提供することができます。契約上の余剰金を支払うことができるのは、その貨物の測定された売上高から、記録された準備コストと貨物コストを差し引いた額だけです。発見と無関係な取引は何の利益ももたらしません。この特典は 3 か月後に期限切れになります。 "
