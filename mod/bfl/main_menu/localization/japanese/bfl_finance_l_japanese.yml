 bfl_grimaldi_albergo: "ザ グリマルディ アルベルゴ"
 bfl_grimaldi_albergo_desc: "共通の条項により、グリマルディ家は継続的な法人として結び付けられます。家族の長老たちは家族の共通の義務を管理し、一支部の財産を超えて家族の信用を守ります。"
 bfl_historical_bank_independent: "銀行が普通の機関であり続けることを認めてください。"
 bfl_history_empty: "履歴は次の月の決済から始まります。"
 bfl_investment_bank: "投資銀行"
 bfl_investment_bank_desc: "商業が遠方の王国を共通の取引所に引き込む中、銀行は会計事務所を囲む街路の向こう側にも目を向ける必要がある。特派員は商人や王子の約束を集め、経験豊富なパートナーは海を越えて冒険を求めます。大規模な施設は維持に費用がかかりますが、その評判は、その管理を委託される資本にとってより良い条件をもたらします。"
 bfl_investment_tab: "融資と投資"
 bfl_investment_title: "貸し出し"
 bfl_invite_equity_capital: "銀行の自己資本を追加する"
 bfl_invite_equity_capital_desc: "購読する 100 ゴールドに [ROOT.GetCountry.MakeScope.GetVariable('bfl_capital_issuer').GetCountry.GetName] 選択した財務省または不動産ウォレットから。加入者は市場相場で新株を受け取ります。不動産ウォレットには少なくとも 25 ゴールド。金銭的所有権、将来の配当および希薄化は、支払われた株式に続きます。"
 bfl_invite_equity_capital_tip: "購読する財務省または不動産ウォレットを選択してください 100 銀行の現在のNAVでの金。新しい株式は既存の保有者を希薄化します。銀行が支払いを受け取ります。"
 bfl_join_clearing_group: "決済グループに参加する"
