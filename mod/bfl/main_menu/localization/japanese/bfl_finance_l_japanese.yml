 bfl_credit_1_desc: "銀行が提供する 100 のための金 60 見積年率での月数。承諾すると、資金、権限、債務能力、適格性が再確認されます。元本は収入ではなく融資です。\n年率: [ROOT.GetCountry.MakeScope.GetVariable('bfl_credit_offer_rate').GetValue|%1]."
