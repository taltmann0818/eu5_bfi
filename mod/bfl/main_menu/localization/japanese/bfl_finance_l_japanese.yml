 bfl_establish_chartered_bank.title: "州公認銀行を設立する"
 bfl_estate_bond_back: "不動産管理に戻る"
 bfl_estate_bond_desc: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_managed_estate').GetCountry.GetName] 借りがある [ROOT.GetCountry.MakeScope.GetVariable('bfl_estate_bond_face').GetValue|2] 校長と [ROOT.GetCountry.MakeScope.GetVariable('bfl_estate_bond_due').GetValue|2] 未払いのクーポンを [ROOT.GetCountry.MakeScope.GetVariable('bfl_estate_bond_holder').GetCountry.GetName]。現金回収は無担保クラスを預金と共有します。自主的な削減には、新しい提案とこの所有者の明示的な承認が必要です。支払いまたは受託者の変更により、保留中の条件は無効になります。"
 bfl_estate_bond_next: "次の結合を選択してください"
