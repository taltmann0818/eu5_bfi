 bfl_goods_inventory_hint: "カーソルを合わせると商品、数量、金額、返品が表示されます"
 bfl_goods_inventory_note: "ネイティブ販売額の指標。残りの支払コストに対する未実現利益。第三者の領収書は銀行合計から除外されます。費用、破損、アクセス不能は収益に影響します。保存されているすべての位置をスクロールします。"
