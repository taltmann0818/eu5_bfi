 bfl_sovereign_accounts: "ソブリン口座 — 銀行資産とは分離"
 bfl_sovereign_accounts_subtitle: "銀行資産ではなく、ネイティブのソブリンローン"
 bfl_sovereign_accounts_tip: "これらの自然債務と売掛金は、銀行ではなく国王に帰属します。銀行所有のローンは資産ドーナツに含まれます。銀行負債には預金と未払いの営業費用が含まれます。本来の借入、返済、融資リストは主権者を行為者として保ちます。"
 bfl_sovereign_banknotes: "ソブリン紙幣"
 bfl_sovereign_banknotes_desc: "公的機関の支援を受けた銀行は、重い硬貨の代わりに支払うという書面による約束を配布する場合があります。それらの受け入れは、機関がそれらを償還し、発行当局がその義務を遵守するという確信に基づいています。"
 bfl_sovereign_credit: "ソブリンクレジット"
 bfl_sovereign_credit_tip: "#T ソブリン信用#!\n銀行の現金から陸地への融資であり、返済請求は銀行資産として記録されます。運営銀行とネイティブの融資条件が必要です。このビルドでは、新しいローンの実行は利用できません。"
 bfl_sovereign_debt: "ソブリン債務"
 bfl_sovereign_debt_heading: "ソブリン債務 [Country.GetName]"
 bfl_sovereign_note: "ソブリンノート"
 bfl_sovereign_note_tip: "#T 換金可能な紙幣#!\n絶対主義、ソブリン紙幣の研究、ソブリンの認可、首都中央銀行、発行者の銀行支店。交換 100 完全に予約されたクレームの正貨。独立した株式ベースの上限には、入金される手形現金は含まれません。自発的なパー転送。ネイティブの支払いはゴールドのままです。"
 bfl_sovereign_receivables: "ソブリン債権"
 bfl_sovereign_receivables_heading: "ソブリン債権 [Country.GetName]"
 bfl_sovereign_restructuring: "主権再編"
 bfl_sovereign_restructuring_tip: "#T 主権再編#!\n債務再編の事前交渉に基づいてソブリン債務を再交渉する。許可されている年齢、運営銀行、サポートされているネイティブデット取引が必要です。このビルドでは、ネイティブの再構築の実行は利用できません。"
 bfl_specialization_title: "銀行の専門化"
 bfl_state_bonds_tip: "#T 国債発行能力#!\n在来州債券の残高: [GetPlayer.GetNumBonds]\n最大ネイティブ ボンド スロット: [GetPlayer.GetDoubleModifierValue('max_bonds', 'max_bonds_modifier')|0]\n\nこれらは州の債券であり、銀行の預金、株式、その他の負債とは別のものです。容量には、ネイティブのベース スロットと結合容量モディファイアが含まれます。債券を販売するには、ネイティブの借入条件も必要です。"
 bfl_state_bonds_value: "債券: [GetPlayer.GetNumBonds] / [GetPlayer.GetDoubleModifierValue('max_bonds', 'max_bonds_modifier')|0]"
 bfl_state_chartered_bank: "州公認銀行"
 bfl_state_chartered_bank_desc: "別途資金提供されたネイティブバンクの対象。ソブリンは最初にすべての株式を所有し、毎月の配当支払いをクレジットで設定します。新たな銀行契約は資本を調達し、既存の所有権を希薄化します。国の預金には優遇金利が付きます。"
 bfl_state_credit: "国の信用"
