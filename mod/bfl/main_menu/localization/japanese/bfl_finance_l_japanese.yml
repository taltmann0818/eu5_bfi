 bfl_dividend_breakdown: "銀行の配当金"
 bfl_dividend_breakdown_subtitle: "年率と月々決済"
 bfl_dividend_calculation: "毎月の配当計算"
 bfl_dividend_capital_reason: "配当に利用できる資本がありません。"
 bfl_dividend_cash_reason: "現金は債権者および営業債務のために留保されます。"
 bfl_dividend_explanation: "預金利息、営業経費、繰越損失資金の配当を差し引いた月次純利益。各所有者は、発行済み株式ごとに資金提供された配当金を乗じた所有株式を受け取ります。利益剰余金は翌月には再度分配されません。"
