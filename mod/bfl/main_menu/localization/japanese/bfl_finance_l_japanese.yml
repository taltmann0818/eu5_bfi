 STATIC_MODIFIER_DESC_bfl_company_exploration_capacity: "容量 500 探査任務が認可されている間は船員。船員は会社から来るか、その政治的責任者から資金提供を受けて来る必要があります。"
 STATIC_MODIFIER_DESC_bfl_dhe_annual_giro: "銀行はさらに1年間存続する可能性があり、その権限は依然として上院に依存している。"
 STATIC_MODIFIER_DESC_bfl_dhe_balanced_captains: "政務を共有することでライバル家のバランスを取り、公共の収入を分配しながら商業を支援します。"
 STATIC_MODIFIER_DESC_bfl_dhe_banker_captains: "銀行家一族は共和国の事務所と収入に対して安定した影響力を獲得した。"
 STATIC_MODIFIER_DESC_bfl_dhe_bardi_patronage: "家族の礼拝堂の豪華さは、この銀行家に特別な印象を与えています。"
 STATIC_MODIFIER_DESC_bfl_dhe_bubble_contagion: "投機的な申し込みの崩壊により、同行の上場株式に対する信頼が弱まっています。"
 STATIC_MODIFIER_DESC_bfl_dhe_bubble_restructuring: "この救済は銀行への信頼を裏付ける一方、再編された口座の管理により経費は増大する。"
 STATIC_MODIFIER_DESC_bfl_dhe_city_concessions: "銀行への商店の貢献は市への譲歩によって確保された。"
 STATIC_MODIFIER_DESC_bfl_dhe_civic_neutrality: "シニョリーアは党の部門を越えてコミューンにサービスを提供することを銀行に要求している。"
 STATIC_MODIFIER_DESC_bfl_dhe_civic_notaries: "共和国の公証人は、銀行協定に関するより明確な公的説明を維持している。"
 STATIC_MODIFIER_DESC_bfl_dhe_credit_contraction_1772: "民間信用の破綻は商業とそれが維持する収益に打撃を与える。"
 STATIC_MODIFIER_DESC_bfl_dhe_credit_relief_1772: "財務省は危機を通じて信用を安定させるために資源を投入した。"
 STATIC_MODIFIER_DESC_bfl_dhe_discount_1772: "専門の事務員が新しいクレジット事業をより詳しく調査し、より高い経常コストで条件を改善します。"
 STATIC_MODIFIER_DESC_bfl_dhe_english_court_accounts: "王室のつながりは、より収益性の高い新規ローンの提案をサポートしますが、法廷への高額の出席が必要です。"
 STATIC_MODIFIER_DESC_bfl_dhe_english_wool_factors: "要素は英国の羊毛貿易に従い、商業的なつながりと独自の高価な家を維持します。"
 STATIC_MODIFIER_DESC_bfl_dhe_european_factors: "幅広い要因により、銀行は複数の裁判所や市場と結びついています。"
 STATIC_MODIFIER_DESC_bfl_dhe_exchequer_register: "財務省は独自の登記簿を維持しており、市との摩擦を犠牲にして独立性を保っている。"
 STATIC_MODIFIER_DESC_bfl_dhe_farmed_excises: "個人コレクターは物品税を保証し、取引からその価格を正確に算出します。"
 STATIC_MODIFIER_DESC_bfl_dhe_florentine_settlement: "公的和解は、古い紛争の費用を国庫に請求しながら、商業の回復に役立ちます。"
 STATIC_MODIFIER_DESC_bfl_dhe_giro_measured_specie: "小規模な施設では、銀行に継続的な費用を負担して、適切な設備を提供します。"
 STATIC_MODIFIER_DESC_bfl_dhe_giro_senate: "上院は常設銀行機関に対する継続的な公共料金を受け入れる。"
 STATIC_MODIFIER_DESC_bfl_dhe_giro_specie: "財務省の準備金と有人カウンターが、この新種の施設の評判を支えています。"
 STATIC_MODIFIER_DESC_bfl_dhe_giro_transfer_office: "ジロは、より広範な正貨施設を求める商人の要求にもかかわらず、安価な書籍の譲渡を支持しています。"
 STATIC_MODIFIER_DESC_bfl_dhe_giro_winddown: "ジロでの新規事業の終了は、その振替帳簿に慣れている加盟店を混乱させる。"
 STATIC_MODIFIER_DESC_bfl_dhe_grimaldi_concessions: "共和国はグリマルディ法人の継続と引き換えに家族特権を認めた。"
 STATIC_MODIFIER_DESC_bfl_dhe_guelph_compact: "バルディ家の先祖代々の同盟は、公の信用を教皇の友人たちに結びつけています。"
 STATIC_MODIFIER_DESC_bfl_dhe_hired_halls: "分散したオフィスと混雑したカウンターは、成長を続ける銀行の経費を増大させます。"
 STATIC_MODIFIER_DESC_bfl_dhe_imperial_accounts: "宮廷への出席は新たな融資条件をサポートし、銀行業務のコストを増加させます。"
 STATIC_MODIFIER_DESC_bfl_dhe_italian_concentration: "銀行は、遠方の契約とその維持コストを削減します。"
 STATIC_MODIFIER_DESC_bfl_dhe_military_giro: "共和国は商人の通常の業務よりも軍事会計を優先している。"
 STATIC_MODIFIER_DESC_bfl_dhe_notarial_albergo: "公証人は家族の義務を共通の監督下にまとめます。"
 STATIC_MODIFIER_DESC_bfl_dhe_old_litigation: "大手銀行の未解決の債務が商業を妨げ続けています。"
 STATIC_MODIFIER_DESC_bfl_dhe_ordered_books: "経験豊富な事務員が銀行の分散した口座を整理整頓します。"
 STATIC_MODIFIER_DESC_bfl_dhe_parish_burden: "小教区と近隣地域は救済措置を行っているが、国庫はその資金提供を拒否している。"
 STATIC_MODIFIER_DESC_bfl_dhe_partners_levy: "パートナーは、より広範なビジネスを犠牲にして公共資源を保護するために、法外な徴収金を負担している。"
 STATIC_MODIFIER_DESC_bfl_dhe_permanent_giro: "ジロは期限切れの任務が相次ぐ代わりに、安定した運営を行っている。"
 STATIC_MODIFIER_DESC_bfl_dhe_plague_accounts: "銀行は緊急支出に備えて追加のレジスターと事務員を維持しなければなりません。"
 STATIC_MODIFIER_DESC_bfl_dhe_public_bubble_relief: "公的資金は、サブスクリプションの崩壊後に信頼を回復するコストを負担します。"
 STATIC_MODIFIER_DESC_bfl_dhe_public_register: "公募および振替は、当銀行との合意に基づいて記録されます。"
 STATIC_MODIFIER_DESC_bfl_dhe_register_clerks: "常駐のスタッフが株式登録簿を管理し、配当金を支払います。"
 STATIC_MODIFIER_DESC_bfl_dhe_republic_first: "この共和国は、外国の法廷で得られる外交上の利点よりも、自国の歳入を優先している。"
 STATIC_MODIFIER_DESC_bfl_dhe_reserves_1772: "公的寄付は銀行の準備金に対する信頼を強化します。"
 STATIC_MODIFIER_DESC_bfl_dhe_retained_earnings: "新たな収益は経営者に分配されるのではなく、銀行に残ります。別の方針が採用されない限り、この契約の期限が切れると、以前の配当方針が再開されます。"
 STATIC_MODIFIER_DESC_bfl_dhe_separate_offices: "銀行家は自ら国政を指揮するのではなく、公務員と交渉しなければならない。"
 STATIC_MODIFIER_DESC_bfl_dhe_south_sea_failures: "サブスクリプションの失敗や債務の争いにより、市の通常業務が中断されます。"
 STATIC_MODIFIER_DESC_bfl_dhe_threadneedle_merchants: "経営者たちは常設棟とより効率的な銀行の建物の代金を支払った。"
 STATIC_MODIFIER_DESC_bfl_dhe_threadneedle_public: "恒久的な公共施設により、銀行の各部門は秩序ある管理下に置かれます。"
 STATIC_MODIFIER_DESC_bfl_dhe_ungilded_accounts: "公的資金は家族の後援に費やされるのではなく、アカウント内に保管されてきました。"
 STATIC_MODIFIER_DESC_bfl_dhe_venetian_relief: "公的支出は共和国の歳入に負担を与えながら民間商業を維持している。"
 STATIC_MODIFIER_DESC_bfl_dhe_war_accounts: "ジロは軍事費の支払いのために別個の高額な管理を行っています。"
