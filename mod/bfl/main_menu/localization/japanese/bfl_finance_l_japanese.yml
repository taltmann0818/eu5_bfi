 bfl_dhe_south_sea_failures: "エクスチェンジアレーの失敗"
 bfl_dhe_south_sea_failures_desc: "サブスクリプションの失敗や債務の争いにより、市の通常業務が中断されます。"
 bfl_dhe_stale: "状況は変わりました。請願を却下する。"
 bfl_dhe_threadneedle_merchants: "オーナーズウィング"
 bfl_dhe_threadneedle_merchants_desc: "経営者たちは常設棟とより効率的な銀行の建物の代金を支払った。"
 bfl_dhe_threadneedle_public: "スレッドニードル ストリート エスタブリッシュメント"
