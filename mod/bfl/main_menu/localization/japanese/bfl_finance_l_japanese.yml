 bfl_dividend_profit_reason: "費用と繰越損失を除いた分配可能な利益はありません。"
 bfl_dividend_rate_note: "年率は、直近の月々の収入に 12 を乗じたものであり、約束ではありません。銀行コストには、預金金利、営業コスト、繰越損失が含まれます。各所有者は、資金提供された支払いの取り分を受け取り、ドゥカットとセントに切り捨てられます。"
 bfl_dividend_retained_reason: "配当はすべての利益を保持するように設定されています。"
 bfl_draw_bond: "借りる 100 銀行から"
 bfl_draw_bond_tip: "チャータード銀行が支払います 100 永久国債には金。毎月、最大で複数の銘柄に資金を提供できます。 1,000 合計でゴールド。銀行は十分な現金と資本を保持しなければならず、国家は利子を支払う余裕がなければなりません。収益は融資となります。現在の所有者に額面を返済して引退させます。"
 bfl_equity_debt: "銀行の資本と負債"
 bfl_equity_debt_tip: "#T 銀行の資本と負債#!\n最大 12 個の実際の月次決済スナップショット。緑色は資産から負債を引いたものです。赤は銀行の負債総額です。どちらも、マイナスの資本を含む、自動的にスケーリングされる同じゴールド軸を使用します。サンプルは左側の最も古いものから右側の最新のものまで実行されます。値と会計月のサンプルにマウスを移動します。州の融資はこの銀行履歴には含まれていません。"
 bfl_equity_detail_title: "の資本 [Country.GetName]"
 bfl_equity_label: "資本"
 bfl_equity_label_tip: "#T 銀行資本#!\n義務を終えた後の銀行の所有者に属する残存価値。\n\n資産: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_assets')|2]@gold!\n負債総額が少なくなる: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_liabilities')|2]@gold!\n資本: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_equity')|2]@gold!\n\n記録された状態単位: [Country.MakeScope.GetVariable('bfl_state_units').GetValue|2]\n総所有単位: [Country.MakeScope.GetVariable('bfl_total_units').GetValue|2]\n資本のヘッドルーム: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_capital_headroom')|2]@gold!\n\n資本がマイナスになると破産を意味します。資本のヘッドルームは自己資本を上回ります 10% 資産の最小値はゼロ。分配金は、このヘッドルームと利用可能な現金の両方によって制限されます。資本はすぐに出金できる金額ではありません。"
 bfl_equity_market: "株価と歴史"
 bfl_equity_subscribe_0: "財務省: 購読する 100 ゴールド"
