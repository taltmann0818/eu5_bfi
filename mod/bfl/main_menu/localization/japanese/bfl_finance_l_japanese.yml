 bfl_resolution_close_command_tip: "秩序ある解決により、新しいコミットメントと分配が凍結されます。分離された金銭および保管準備金は引き続き保護されます。預金は、経費の滞納前に利用可能な現金と資本を比例的に分配します。行方不明の債権者は債権を保持します。任意条件には、現在の債権者の同意とルネッサンス債務再編が必要です。公的保証が適用されます 50% 受け入れられた預金損失のうち、最大 100 記録上の主権者によって資金提供された総額の金。未払いの通話は保留のままです。閉鎖するには、すべての義務と非現金資産を清算する必要があります。閉鎖された不動産は再開できません。"
 bfl_resolution_guarantee_command: "保証を承認する"
 bfl_resolution_guarantee_command_tip: "秩序ある解決により、新しいコミットメントと分配が凍結されます。分離された金銭および保管準備金は引き続き保護されます。預金は、経費の滞納前に利用可能な現金と資本を比例的に分配します。行方不明の債権者は債権を保持します。任意条件には、現在の債権者の同意とルネッサンス債務再編が必要です。公的保証が適用されます 50% 受け入れられた預金損失のうち、最大 100 記録上の主権者によって資金提供された総額の金。未払いの通話は保留のままです。閉鎖するには、すべての義務と非現金資産を清算する必要があります。閉鎖された不動産は再開できません。"
 bfl_resolution_heading: "解決と債権者の回収"
 bfl_resolution_heading_tip: "持続的な財政的解決。現金回収および合意による変更は収益とは別に記録されます。"
 bfl_resolution_help: "担保および保管準備金 → 比例預金 → 経費の延滞 → 残留株主。請求は不足や発行権限の喪失の後も存続します。条件を提示する前に解決策を入力してください。"
 bfl_resolution_liquidate_command: "利用可能な資産を実現する"
 bfl_resolution_liquidate_command_tip: "アクセス可能な負担のないネイティブ在庫を販売し、既存のサービスを通じて満期の預金、請求書、手形を収集します。実際の受け取りは回復ウォーターフォールの資金となります。利用できないポジションや未熟なポジションは記録されたままになります。いかなる簿価も金にはなりません。"
 bfl_resolution_next_command: "次回の預金口座"
 bfl_resolution_next_command_tip: "アクティブな預金口座をサイクルします。不動産債権者は、政府が自主的な条件を受け入れる前に、制定されたワークアウト指令を要求します。支払いは記録された財務省または遺産ウォレットに返されます。"
 bfl_resolution_notice_acknowledge: "最終的な結果を認識する"
 bfl_resolution_notice_desc: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_notice_bank').GetCountry.GetName] は金融業務を終了しました。\n\n支払われた預金の回収: [ROOT.GetCountry.MakeScope.GetVariable('bfl_notice_bank').GetCountry.MakeScope.GetVariable('bfl_resolution_paid').GetValue|2]@gold!\n同意された預金損失: [ROOT.GetCountry.MakeScope.GetVariable('bfl_notice_bank').GetCountry.MakeScope.GetVariable('bfl_resolution_waived').GetValue|2]@gold!\n法定損失の記録: [ROOT.GetCountry.MakeScope.GetVariable('bfl_notice_bank').GetCountry.MakeScope.GetVariable('bfl_resolution_statutory_loss').GetValue|2]@gold!\n\n記録された損失は未払い金額であり、回収や新たな収入ではありません。歴史的な所有権と最終的な財産は記録されたままになります。閉鎖された施設は再開できません。"
 bfl_resolution_notice_title: "銀行決議は終了しました"
