 bfl_facility_0_tip: "常駐債務枠義務を解除します。予定された銀行融資は要求されません。既存の債務は引き続き支払われます。"
 bfl_facility_1: "借金優先制度"
 bfl_facility_1_short: "まずは借金"
 bfl_facility_1_tip: "～に対するカスタム債券融資をリクエストする 60% 予測月間支出のうち、上限は 100 ゴールドで毎月1冊発行されます。州の現金に達したときに抽選をスキップする 500 金、銀行、発行者には能力がありません。"
 bfl_facility_2: "緩衝施設"
 bfl_facility_2_short: "バッファー"
 bfl_facility_2_tip: "カスタム債券融資をリクエストする 200 予測残高後の状態の金、上限 100 ゴールドで毎月1冊発行されます。資金が提供されていないリクエストでは、借金や現金は発生しません。"
 bfl_facility_reason_1: "#O リサーチ、支店へのアクセス、発行者の収入、クーポンのキャパシティを確認します。#!"
 bfl_facility_reason_2: "#O 現金が保護されると、銀行の流動資金が不足します。#!"
 bfl_facility_reason_3: "#O 新たな請求は銀行の資本余裕を超えることになる。#!"
 bfl_facility_reason_4: "#O ソブリン債務を合わせた額は発行体の債務能力に達しました。#!"
 bfl_facility_reason_5: "#O 未払いのソブリンクーポンはさらなる発行を阻止する。#!"
 bfl_facility_reason_6: "#O ソブリンは今月すでに債券を発行している。#!"
 bfl_facility_reason_7: "#O すべてのソブリン債記録スロットが占有されています。#!"
 bfl_facility_tip: "今月、カスタムソブリン債発行により実際に受け取った銀行現金。融資は借金を生み出し、勤労所得から除外されます。"
 bfl_facility_title: "債務ファシリティの義務"
 bfl_facility_title_tip: "#T 債務ファシリティの義務#!\nこの銀行は、固定の年次クーポンを使用してカスタムソブリン債に資金を供給しています。オフにすると、スケジュールされた問題が停止します。借金の最初の要求 60% 支出予測の。バッファターゲット 200 予測月次残高後の状態の金。どちらも止まります 500 状態はゴールド。\n\n最後にリクエストしたもの: [Country.MakeScope.GetVariable('bfl_facility_requested').GetValue|2]@gold!\n最後に資金を提供した: [Country.MakeScope.GetVariable('bfl_facility_paid').GetValue|2]@gold!\n\n最大でも 1 つの問題と、 100 毎月のゴールド。銀行の現金、資本、発行者の能力、未払いのクーポンが保護されていれば、引き分けを防ぐことができます。収益は収入ではなく融資です。"
