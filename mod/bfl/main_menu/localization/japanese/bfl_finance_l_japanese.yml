 bfl_portfolio_bank_heading: "が保有する投資 [Country.GetName]"
 bfl_portfolio_history_axis: "古いものから最新のものまで · まで 12 毎月の観察"
 bfl_portfolio_history_empty: "履歴は次の月の銀行締め日から始まります。"
 bfl_portfolio_history_flows: "価値には購入と販売が含まれます。これは投資収益率の指標ではありません。"
 bfl_portfolio_history_title: "長期にわたるポートフォリオの価値"
 bfl_portfolio_owner_note: "財務省と銀行の保有資産には別々の所有者がいます。財務上のエンティティにマウスを移動します。"
 bfl_portfolio_total_heading: "現在の株式価値"
 bfl_portfolio_treasury_heading: "国債保有額"
 bfl_prepare_bond_panel: "ソブリン債"
 bfl_prepare_bond_panel_tip: "州の融資と既存の請求をクレジットで表示します。"
 bfl_probe_P11: "開発ゲート: このアダプターを実行する前に、ゲーム内で P11 を測定する必要があります。"
 bfl_profile_0: "専門分野を選択してください"
 bfl_profile_1: "マーチャントファイナンス"
 bfl_profile_2: "海外投資"
 bfl_project_security: "プロジェクトのセキュリティ"
 bfl_project_security_desc: "遠く離れた企業は、投資家にとって監督するのが困難です。資本が前払いされる前に設定される資産と収益に対する請求権は、ベンチャー企業が道に迷ったときに投資家に自分の利益を守る手段を提供します。"
 bfl_project_security_tip: "#T プロジェクトのセキュリティ#!\n特定可能なプロジェクトの申し立てからベンチャーを保護します。プロジェクトセキュリティの研究、海外投資、絶対主義時代以降が必要です。このビルドでは、ネイティブ プロジェクト担保実行は利用できません。"
 bfl_protected_label: "保護された現金"
 bfl_public_backstop: "パブリックバックストップ"
 bfl_public_backstop_tip: "#T 公的保障のあるサポート#!\n革命、公的金融のバックストップ、そして主権首都に完成した中央銀行とのライブチャーター。明示的に受け入れられる 75-金の前払いには公的銀行独自の無料現金が使用されます。 25% 請求書のヘアカットと少なくとも 9% 年利。無料の資本再構成はありません。"
 bfl_public_financial_backstops: "公的財政のバックストップ"
 bfl_public_financial_backstops_desc: "大手銀行の破綻により公的信用と商業が脅かされると、政府が介入することがあります。このような支援は財務省の資源を銀行の回復に拘束し、支援条件を公共政策の問題にする。"
 bfl_purchase_funded_bill: "積立支払い請求書を購入する"
 bfl_purchase_funded_bill_act: "$bfl_purchase_funded_bill$"
 bfl_purchase_funded_bill_desc: "プロフィール、年齢、調査、登録チェックを経て、あなた自身の金庫から資金が提供されます。元本は銀行の利益ではありません。銀行資本サブスクリプションでは、現在の純資産価値でユニットを購入します。"
 bfl_purchase_funded_bill_effect_text: "$bfl_purchase_funded_bill$"
 bfl_purchase_funded_bill_effect_text_past: "$bfl_purchase_funded_bill$"
 bfl_purchase_native_loan: "銀行: 先住民不動産ローンを購入する"
 bfl_purchase_native_loan_act: "$bfl_purchase_native_loan$"
 bfl_purchase_native_loan_desc: "あなたの銀行が買い手です。通常の価格と資格が適用され、追加の無料の現金と資本小切手が適用されます。銀行団地は購入価格を受け取り、同じローンが所有者を変更します。債券およびすでに国が保有しているローンは除外されます。"
 bfl_purchase_native_loan_effect_text: "$bfl_purchase_native_loan$"
 bfl_purchase_native_loan_effect_text_past: "$bfl_purchase_native_loan$"
 bfl_purchase_native_loan_tip: "#T 銀行の融資を引き継ぐ#!\n適格な不動産債務を持つ別のソブリンを選択します。あなたの公認銀行は、その国の銀行団地にネイティブの購入価格を支払い、同じローンの債権者になります。元金および利息の債権は銀行に帰属します。ソブリンは株式配当を通じて貸付収入を得る。銀行はまた、準備金と資本が許す限り、毎月 1 件の適格ローンを自主的に購入します。債券およびすでに国が保有しているローンは除外されます。"
 bfl_rate_0: "新規口座の場合は利息不要"
 bfl_rate_0_short: "0%"
 bfl_rate_0_tip: "オファー 0% 新規普通預金の年利。既存の需要口座と個別の定期口座金利は、許容された金利のままです。"
 bfl_rate_1: "1% 新規口座の年間需要率"
 bfl_rate_1_short: "1%"
 bfl_rate_1_tip: "オファー 1% 新規普通預金の年利。利息は毎月セントキャリーで入金されます。既存の需要アカウントは受け入れられたレートを維持します。"
 bfl_rate_2: "2% 新規口座の年間需要率"
 bfl_rate_2_short: "2%"
 bfl_rate_2_tip: "オファー 2% 新規普通預金の年利。利息は毎月セントキャリーで入金されます。既存の需要アカウントは受け入れられたレートを維持します。"
 bfl_recapitalize_command: "資本を再構成する 100 ゴールド"
 bfl_recapitalize_command_tip: "支払う 100 あなたの国の財務省からの金を銀行資本として。必要なもの 100 金とディーラーの再販入札は、有形のNAVを超えません。市場プレミアムが大きくなっている間は、即時の再販利益を防ぐために資本が一時停止します。 NAVがゼロまたはマイナスの場合でも資金による救済は引き続き利用可能です。"
