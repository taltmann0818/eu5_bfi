 bfl_sell_confirm_desc: "売る [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_quantity').GetValue|3] の株式 [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_issuer').GetCountry.GetName] のために [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_total').GetValue|2]@gold!。隠れマーケットメーカーは、相場が有効である間、相場の取引スプレッドを含めてこの販売を保証します。株式はすぐにポートフォリオから削除されます。バックグラウンド AI による購入では支払いが遅れることはありません。収益は銀行の財務省に送られます。決済には外交官が 1 人消費され、この発行者の 1 か月間の売買クールダウンが開始されます。"
 bfl_sell_confirm_title: "即時株式売却を確認する"
 bfl_sell_shares: "株を売る"
 bfl_sell_shares_desc: "保有資産の 1 つと数量を選択します。隠れたマーケットメーカーは、表示されたディーラーのスプレッドを差し引いた市場相場であなたの株を即座に購入します。 AI 銀行はバックグラウンドで在庫を購入します。"
 bfl_sell_shares_tip: "保有資産の 1 つと数量を選択します。隠れたマーケットメーカーは、表示されたディーラーのスプレッドを差し引いた市場相場であなたの株を即座に購入します。 AI 銀行はバックグラウンドで在庫を購入します。\n完了した交換、株式取引、および少なくとも 1 人の外交官が必要です。取引が成功するたびに外交官が 1 人消費され、その発行者に対して 1 か月のクールダウンが開始されます。利用可能な外交官: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bfl_available_trade_diplomats')|2]。注文には少なくとも現金価値が必要です 0.01 ゴールド。"
 bfl_sell_state_confirm_desc: "売る [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_quantity').GetValue|3] あなたの財務省の株式の株式 [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_issuer').GetCountry.GetName] のために [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_total').GetValue|2]@gold!、あなたの国の財務省に支払われます。銀行は融資を受けず、発行済み株式は変わりません。隠れディーラーは、提示されたディーラースプレッドを含む、表示された相場を保証します。決済には 1 人の外交官が消費され、この発行者の 1 か月の売買クールダウンが開始されます。あなたの憲章の通貨権限はあなたに残ります。"
