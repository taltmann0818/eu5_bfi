 bfl_offer_restructuring: "債務免除を提案する"
 bfl_offer_restructuring_act: "$bfl_offer_restructuring$"
 bfl_offer_restructuring_desc: "借り手は明示的なオファーを受け取ります。受理されるまで現金や条件の変更はありません。執行では、実際の権限、プロフィール、研究、資金が再チェックされます。"
 bfl_offer_restructuring_effect_text: "$bfl_offer_restructuring$"
 bfl_offer_restructuring_effect_text_past: "$bfl_offer_restructuring$"
 bfl_offer_restructuring_tip: "主権企業または適格なネイティブ企業を選択します。どちらのプロファイルも主権者に有利です。企業信用には、マーチャント ファイナンス、改革、企業信用が必要です。債務救済にはルネサンス債務再編も必要だ。"
 bfl_operating_costs: "月々の運営費"
 bfl_operating_costs_tip: "毎月の固定コストは、アクティブな預金口座、契約、支店、資産クラスに応じて拡大します。州立チャータード銀行改革により、次のようなコストが削減されます。 5%、銀行による 10%、アドバンスクリアによる 15%、およびによる管理の合理化 10%。未払いのコストは負債として残り、配当を妨げます。"
 bfl_overview: "アカウントと専門分野"
 bfl_overview_hint: "アセット: 外側のリング = タイプ;内輪＝国。カーソルを合わせると色分けされた内訳が表示されます。"
 bfl_payout_0: "利益を留保する"
 bfl_payout_0_short: "保持する"
 bfl_payout_0_tip: "適格な実現利益をすべて保持します。この方針に基づいて新たな配当は支払われません。内部留保は流動性と資本を支えます。"
 bfl_payout_25: "25% 支払い"
 bfl_payout_25_short: "25%"
 bfl_payout_25_tip: "まで割り当てます 25% 適格実現利益の損失後の配当への割合。利用可能な現金、資本の余裕、記録された所有権は依然として支払いを制限しています。"
 bfl_payout_50: "50% 支払い"
 bfl_payout_50_short: "50%"
 bfl_payout_50_tip: "まで割り当てます 50% 適格実現利益の損失後の配当への割合。利用可能な現金、資本の余裕、記録された所有権は依然として支払いを制限しています。"
 bfl_peasants_estate_workout_mandate: "エステートトレーニングの義務化"
 bfl_peasants_estate_workout_mandate_desc: "この財団は政府に、政府に代わって自主的な銀行預金ワークアウトを審査する権限を明示的に与えている。すべての提案は依然として個別に承認される必要があります。この特権を取り消すと、保留中の財産条件が無効になります。回復の支払いは遺産ウォレットに継続されます。"
 bfl_place_deposit_1: "開く 100 金要求払預金"
 bfl_place_deposit_1_act: "$bfl_place_deposit_1$"
 bfl_place_deposit_1_desc: "独立系銀行には少なくとも次の意見が必要です。 +50 アカウントを開設するためにあなたに向けて。あなたのチャーター銀行は追加のサービスを提供しています 1% 年利。需要利息は資金調達時に毎月支払われます。未払いの利息はそのまま残ります。関係が悪化しても、あなた自身の成熟した主張の撤回を妨げることはありません。"
 bfl_place_deposit_1_effect_text: "$bfl_place_deposit_1$"
 bfl_place_deposit_1_effect_text_past: "$bfl_place_deposit_1$"
 bfl_place_deposit_2: "開く 100 金定期預金"
 bfl_place_deposit_2_act: "$bfl_place_deposit_2$"
 bfl_place_deposit_2_desc: "独立系銀行には少なくとも次の意見が必要です。 +50 アカウントを開設するためにあなたに向けて。あなたのチャーター銀行は追加のサービスを提供しています 1% 年利。需要利息は資金調達時に毎月支払われます。未払いの利息はそのまま残ります。関係が悪化しても、あなた自身の成熟した主張の撤回を妨げることはありません。"
