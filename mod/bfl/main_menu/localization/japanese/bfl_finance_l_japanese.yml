 bfl_toggle_deposit_admission_tip: "銀行で新しい預金を開設または閉鎖します。入場を終了すると、既存のアカウント、利息、引き出しが保持されます。再開するには銀行が営業していなければなりません。"
 bfl_transfer_bank_bill: "銀行保有の手形を額面で売却する"
 bfl_transfer_bank_bill_act: "$bfl_transfer_bank_bill$"
 bfl_transfer_bank_bill_command: "$bfl_transfer_bank_bill$"
 bfl_transfer_bank_bill_command_desc: "$bfl_transfer_bank_bill_desc$"
 bfl_transfer_bank_bill_desc: "発行者と受取人を選択します。最初の対象者 100-ゴールド請求の転送 100 現在の所有者に支払われるゴールド。ロックされた担保は譲渡できません。メモには、Revolutions の受け入れ調査が必要です。すべての資金調達、所有権、資本支店のチェックは実行時に繰り返されます。"
