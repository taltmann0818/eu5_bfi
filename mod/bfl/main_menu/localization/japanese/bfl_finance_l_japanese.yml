 bfl_offer_commenda: "貨物輸送に資金を提供する"
 bfl_offer_commenda_act: "貨物輸送に資金を提供する"
 bfl_offer_commenda_desc: "銀行が提案した条件に基づいてリスク資本を提供します。承諾すると、指定された貨物が本来の価格で購入されます。未使用の承認は銀行に残ります。元本と収益は決して保証されません。"
 bfl_offer_commenda_effect_text: "貨物輸送に資金を提供する"
 bfl_offer_commenda_effect_text_past: "貨物輸送に資金を提供する"
 bfl_offer_commenda_tip: "ディスカバリー以降、海外投資とコメンダ調査。 10 個単位の貨物の運航者、供給元市場、目的地、商品を選択します。承認により、あなたの権限、自由な現金、資本、能力が再確認されます。オペレーターごとに 1 つの有効な契約。バンクごとに最大 8 つまで。"
 bfl_offer_credit: "積立ローンを提供する"
 bfl_offer_credit_act: "$bfl_offer_credit$"
 bfl_offer_credit_desc: "借り手は明示的なオファーを受け取ります。受理されるまで現金や条件の変更はありません。執行では、実際の権限、プロフィール、研究、資金が再チェックされます。"
 bfl_offer_credit_effect_text: "$bfl_offer_credit$"
 bfl_offer_credit_effect_text_past: "$bfl_offer_credit$"
 bfl_offer_credit_tip: "主権企業または適格なネイティブ企業を選択します。どちらのプロファイルも主権者に有利です。企業信用には、マーチャント ファイナンス、改革、企業信用が必要です。債務救済にはルネサンス債務再編も必要だ。"
 bfl_offer_goods_transfer: "倉庫受け取り転送を提供します"
 bfl_offer_goods_transfer_act: "$bfl_offer_goods_transfer$"
 bfl_offer_goods_transfer_desc: "商品オファーと保管請求で最後に選択された領収書を提示します。受取人は現在の所有者に支払う前に価格と数量を確認します。"
 bfl_offer_goods_transfer_effect_text: "$bfl_offer_goods_transfer$"
 bfl_offer_goods_transfer_effect_text_past: "$bfl_offer_goods_transfer$"
 bfl_offer_held_sovereign_bond: "保有国債を売り出す"
 bfl_offer_held_sovereign_bond_act: "$bfl_offer_held_sovereign_bond$"
 bfl_offer_held_sovereign_bond_desc: "発行体を選択し、国債の 1 つを次の URL にリストします。 98% 額面通り。所有する完成した証券取引所の建物が必要です。"
 bfl_offer_held_sovereign_bond_effect_text: "$bfl_offer_held_sovereign_bond$"
 bfl_offer_held_sovereign_bond_effect_text_past: "$bfl_offer_held_sovereign_bond$"
 bfl_offer_held_sovereign_bond_tip: "3 か月間所有している既存の債券をリストします。資金提供を受けた購入者が承諾するまで、お客様はその請求を保持します。クーポンと引き換えはその購入者をフォローします。"
 bfl_offer_restructuring: "債務免除を提案する"
 bfl_offer_restructuring_act: "$bfl_offer_restructuring$"
 bfl_offer_restructuring_desc: "借り手は明示的なオファーを受け取ります。受理されるまで現金や条件の変更はありません。執行では、実際の権限、プロフィール、研究、資金が再チェックされます。"
 bfl_offer_restructuring_effect_text: "$bfl_offer_restructuring$"
 bfl_offer_restructuring_effect_text_past: "$bfl_offer_restructuring$"
 bfl_offer_restructuring_tip: "主権企業または適格なネイティブ企業を選択します。どちらのプロファイルも主権者に有利です。企業信用には、マーチャント ファイナンス、改革、企業信用が必要です。債務救済にはルネサンス債務再編も必要だ。"
 bfl_offering_closed: "閉店"
 bfl_offering_open: "開く"
 bfl_operating_costs: "月々の運営費"
 bfl_operating_costs_tip: "毎月の固定コストは、アクティブな預金口座、契約、支店、資産クラスに応じて拡大します。州立チャータード銀行改革により、次のようなコストが削減されます。 5%、銀行による 10%、アドバンスクリアによる 15%、による管理の合理化 10%、完成した銀行本店 15%、そして所有するフィレンツェの銀行宮殿 10%。総削減量の上限は引き続き次のとおりです。 75%。未払いのコストは負債として残り、配当を妨げます。"
 bfl_overview: "アカウントと専門分野"
 bfl_overview_hint: "アセット: 外側のリング = タイプ;内輪＝国。カーソルを合わせると色分けされた内訳が表示されます。"
 bfl_palace_saint_george: "セント ジョージ宮殿"
 bfl_palace_saint_george_desc: "ジェノヴァの港の横にある宮殿は、共和国の債権者の共同の住居となっています。その永続的な権威が銀行株への信頼を強める一方、経験豊富な行員が債務と収益の管理に専念するように命令します。"
 bfl_palace_saint_george_maintenance: "セント ジョージ宮殿の管理"
 bfl_palazzo_acciaiuoli: "パラッツォ アッチャイオーリ"
 bfl_palazzo_acciaiuoli_desc: "フィレンツェ宮殿の地味な石壁の後ろで、アッチャイオーリ家は 1 つの屋根の下で散在する記録をまとめています。行員の秩序ある仕事により、銀行の営業経費が削減されます。"
 bfl_palazzo_acciaiuoli_maintenance: "パラッツォ・アッチャイオーリ管理"
 bfl_palazzo_busini_bardi: "パラッツォ ブジーニ バルディ"
 bfl_palazzo_busini_bardi_desc: "これらの規則正しい石壁の中で、バルディ教徒はヨーロッパ中の法廷や数え所から報告書を集めます。完成した宮殿では、銀行管理が 10 パーセント削減され、通常の上限に従って、新たに提供される融資金利に 0.5 パーセント ポイントが追加されます。既存の契約は合意されたレートを維持します。"
 bfl_palazzo_busini_bardi_maintenance: "パラッツォ ブジーニ バルディ行政"
 bfl_palazzo_peruzzi: "パラッツォ ペルッツィ"
 bfl_palazzo_peruzzi_desc: "ペルッツィ家は、会計事務所と布地商人の商業を結び付けています。彼らの店員は、遠く離れた市場によって支えられている屋根の下で義務を解決します。完成した宮殿により、銀行管理が 10 パーセント削減されます。同社の布地事業は地元市場の需要を増やし、需要と供給が許す限り高級布地の価格を支えています。"
 bfl_palazzo_peruzzi_maintenance: "パラッツォ・ペルッツィ行政"
 bfl_palazzo_salimbeni: "パラッツォ サリンベーニ"
 bfl_palazzo_salimbeni_desc: "サリンベーニ宮殿の厳重な城壁の中で、シエナはその貯蓄を永続的な施設に預けています。慎重な管理と忍耐強い融資延長が、銀行とその援助を求める人々の両方を支えます。"
 bfl_palazzo_salimbeni_maintenance: "サリンベーニ宮殿の管理"
 bfl_payout_0: "利益を留保する"
 bfl_payout_0_short: "保持する"
 bfl_payout_0_tip: "適格な実現利益をすべて保持します。この方針に基づいて新たな配当は支払われません。内部留保は流動性と資本を支えます。"
 bfl_payout_25: "25% 支払い"
 bfl_payout_25_short: "25%"
 bfl_payout_25_tip: "まで割り当てます 25% 適格実現利益の損失後の配当への割合。利用可能な現金、資本の余裕、記録された所有権は依然として支払いを制限しています。"
 bfl_payout_50: "50% 支払い"
 bfl_payout_50_short: "50%"
 bfl_payout_50_tip: "まで割り当てます 50% 適格実現利益の損失後の配当への割合。利用可能な現金、資本の余裕、記録された所有権は依然として支払いを制限しています。"
 bfl_peasants_estate_workout_mandate: "エステートトレーニングの義務化"
 bfl_peasants_estate_workout_mandate_desc: "この財団は政府に、政府に代わって自主的な銀行預金ワークアウトを審査する権限を明示的に与えている。すべての提案は依然として個別に承認される必要があります。この特権を取り消すと、保留中の財産条件が無効になります。回復の支払いは遺産ウォレットに継続されます。"
 bfl_peruzzi_cloth_demand: "ペルッツィ布商事"
 bfl_place_deposit_1: "開く 100 金要求払預金"
 bfl_place_deposit_1_act: "$bfl_place_deposit_1$"
 bfl_place_deposit_1_desc: "独立系銀行には少なくとも次の意見が必要です。 +50 アカウントを開設するためにあなたに向けて。あなたのチャーター銀行は追加のサービスを提供しています 1% 年利。需要利息は資金調達時に毎月支払われます。未払いの利息はそのまま残ります。関係が悪化しても、あなた自身の成熟した主張の撤回を妨げることはありません。"
