 bfl_asset_unsecured_heading: "無担保ローン [Country.GetName]"
 bfl_asset_unsecured_summary: "無担保ローン： [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_asset_fraction_unsecured')|%2]"
 bfl_asset_unsecured_title: "無担保ローン"
 bfl_assets_detail_title: "の資産 [Country.GetName]"
 bfl_assets_label: "資産"
 bfl_assets_label_tip: "#T 総資産#!\n銀行が所有する現金および記録資産。\n\n国庫現金: [Country.GetFixedPointCurrencyValue('gold')|2]@gold!\n融資ポートフォリオ: [Country.MakeScope.GetVariable('bfl_native_credit_value').GetValue|2]@gold!\n株式ポジション (簿価): [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_security_carrying')|2]@gold!\nカスタムクレジットと債券: [Country.MakeScope.GetVariable('bfl_custom_credit_value').GetValue|2]@gold!\n在庫: [Country.MakeScope.GetVariable('bfl_inventory_value').GetValue|2]@gold!\nプロジェクト: [Country.MakeScope.GetVariable('bfl_project_value').GetValue|2]@gold!\n合計: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_assets')|2]@gold!\n\nローン、株式ポジション、在庫、プロジェクトは記録された資産価値であり、使用できる現金ではありません。元金の返済によりローン資産が現金に交換されます。彼らは利益を生み出しません。"
 bfl_authorize_note_bank: "換金可能な紙幣を承認する"
 bfl_authorize_note_bank_act: "$bfl_authorize_note_bank$"
 bfl_authorize_note_bank_desc: "必要な調査を行った後、公認銀行、または首都内に支店を持つ独立銀行に、正貨を全額裏付けされた償還可能な紙幣と交換する権限を与えます。新規発行には首都に完成した中央銀行も必要です。認可によってゴールドは生成されず、撤回することができます。"
 bfl_authorize_note_bank_effect_text: "$bfl_authorize_note_bank$"
 bfl_authorize_note_bank_effect_text_past: "$bfl_authorize_note_bank$"
 bfl_automation_notice: "与信管理"
 bfl_automation_notice_tip: "ヘッダーの Credit Management を使用して、銀行が融資と投資を管理できるようにします。銀行は準備金を保管し、債権者に支払い、投資前に研究と現金をチェックします。"
 bfl_available: "利用可能な現金"
 bfl_available_tip: "銀行が準備金を保管した後に使用できる現金。"
 bfl_back_to_bank: "銀行口座"
 bfl_balance_paid_tip: "最後の月次決済時に受け取った資金による支払い。これらの送金はすでに国庫に保管されているため、母国の所得合計に再度追加することはできません。"
 bfl_balance_sheet_subtitle: "現在の銀行口座"
 bfl_banco_del_giro: "バンコ デル ジロ"
 bfl_banco_del_giro_desc: "リアルトのアーケードの下では、公的信用が台帳から台帳へと受け継がれています。銀行はコインを受け取り、商人の債務を解決し、共和国に永続的な債務の基盤を与えます。"
 bfl_banco_del_giro_maintenance: "デル・ジロ銀行の管理"
 bfl_banco_mediceo: "Banco Mediceo"
 bfl_banco_mediceo_desc: "この大銀行の厚い石壁の内側では、商人が勘定を清算し、諸侯がメディチ家の信用を求める。書記たちはミラノを通る手形と貨幣の流れを整え、国庫と銀行業務を支える。完成した施設による勅許銀行の管理費削減率は 15% となり、必要な進歩の研究後には通貨サービスも利用できる。"
 bfl_bank_capital_subscriptions_desc: "銀行会社は、創業者一族の財産に全面的に依存する必要はありません。サブスクリプションにより、企業に追加のパートナーが参加し、資本をプールしながら、将来の繁栄に対する各投資家の主張を記録します。"
 bfl_bank_dividends: "銀行配当金（年間）"
 bfl_bank_eng.1.a: "登録簿を銀行に5パーセントで委託します。"
 bfl_bank_eng.1.b: "独立した財務省レジスターの料金を支払います。"
 bfl_bank_eng.1.c: "消費税農家にお金を見つけてもらいましょう。"
 bfl_bank_eng.1.desc: "コモンズはイングランド銀行の新たな用途を発見した。すべての引き受け、譲渡、配当を財務省の手に委ねる代わりに、銀行は政府株式の公的登録簿を保管することになる。取締役たちは、その関心が尊重されるという条件で、自らその号を購読することを申し出ます。財務当局は、登記簿の管理者が公的信用の門番になることに反対している。一方、消費税農家は市にそれほど権限を明け渡さずに収入を約束している。"
 bfl_bank_eng.1.entry: "公的信用の方法と手段"
 bfl_bank_eng.1.title: "公的信用の方法と手段"
 bfl_bank_eng.3.a: "社会的信用に値する施設を構築します。"
 bfl_bank_eng.3.b: "経営者の立場と彼らの譲歩を受け入れてください。"
 bfl_bank_eng.3.c: "雇われたホールと国庫のコインを保管してください。"
 bfl_bank_eng.3.desc: "銀行の貸し部屋は、配当金を待つ帳簿係、出納係、経営者で混雑している。その取締役たちは、スレッドニードル・ストリートに恒久的な施設を建設する計画を確保しました。公共の建物があれば、財務省はその管理にしっかりとした権限を与えることになるが、その代償はかなりのものだ。販売業者の経営者は、市に譲歩する代わりに、独自の安価なサブスクリプションを提供します。古い部屋に残っておけば今日のお金は節約できますが、分散したオフィスの増大する出費を銀行に任せることになります。"
 bfl_bank_eng.3.entry: "スレッドニードル ストリート エスタブリッシュメント"
 bfl_bank_eng.3.title: "スレッドニードル ストリート エスタブリッシュメント"
 bfl_bank_eng.4.a: "健全なビジネスのための監視付きディスカウントオフィスを開設します。"
 bfl_bank_eng.4.b: "財務省のコインを銀行の準備金の後ろに置きます。"
 bfl_bank_eng.4.c: "公共の宿泊施設はあってはならない。"
 bfl_bank_eng.4.desc: "切れた紙幣の連鎖は、ロンドンからスコットランド、そして海を越えて人々の苦しみを運びました。繁栄しているように見えた家は、明日の支払いに耐えるためのコインを入手できません。イングランド銀行は、対応範囲を拡大するよう求められているが、理事らは、健全な商業手形と、破綻した投機家の手形とを区別しなければならないと主張している。商人は屈辱的な問い合わせをせずに救済を要求している。財務省は代わりに銀行を強化することも、損失が損失を被った者のものであると宣言することもできる。"
 bfl_bank_eng.4.entry: "6月の請求書"
 bfl_bank_eng.4.title: "6月の請求書"
 bfl_bank_equity_subscribe: "銀行財務部: 購読する 100 ゴールド"
 bfl_bank_equity_subscribe_tip: "投資する 100 実際に管理されている銀行の保護された現金および資本剰余金を、選択した発行体の有形基準価額で換算したもの。新しい有償ユニットが銀行のポートフォリオに加わります。最大値 25% 銀行の、または 60% 海外の許可を受けた企業のもの。これは主要な資金調達であり、既存株主からの買収ではありません。"
 bfl_bank_flo.1.a: "グエルフのコンパクトに敬意を表します。"
 bfl_bank_flo.1.b: "銀行はいかなる当事者よりも先にフィレンツェにサービスを提供するものとする。"
 bfl_bank_flo.1.c: "家の間で和解を購入します。"
 bfl_bank_flo.1.desc: "バルディ家は、最初に自分たちの家をフィレンツェで勢力にした同盟を忘れていません。彼らの親族たちは、古いブオンデルモンティの大義を発動し、市の公認銀行が教皇庁の友人たちと堂々と協力するよう求めている。シニョリーアの役人たちは、あらゆるアカウントに派閥の色が付くのではないかと懸念している。公立銀行は市の党を強化するかもしれないが、旧部門にまたがって事業を展開する商人はむしろ、その門戸が双方に開かれたままであることを望んでいる。"
 bfl_bank_flo.1.entry: "ブオンデルモンティの義務"
 bfl_bank_flo.1.title: "ブオンデルモンティの義務"
 bfl_bank_flo.2.a: "要因を羊毛船に従わせてみましょう。"
 bfl_bank_flo.2.b: "王室に言い寄って、政治的な代償を受け入れてください。"
 bfl_bank_flo.2.c: "アカウントをイタリアに集中させます。"
 bfl_bank_flo.2.desc: "英国の銀行家の要因は、シニョリーアの前に 2 種類のビジネスをもたらします。羊毛商人は、俵、紙幣、税関領収書の安定した取引を行っています。王室代理人は、はるかに大きな財布へのアクセスを提供しますが、その財布がすぐに開かれることはめったにありません。取締役たちは、私たちの憲章の保護の下で英国の家を更新することになりました。問題は、その行員たちが羊毛船に従うべきか、宮廷を開拓すべきか、それとも英国の約束を他の銀行に任せるべきかということである。"
 bfl_bank_flo.2.entry: "羊毛、紙幣、そして英国王冠"
 bfl_bank_flo.2.title: "羊毛、紙幣、そして英国王冠"
 bfl_bank_flo.3.a: "バルディの名前でチャペルサイクルを委託してください。"
 bfl_bank_flo.3.b: "家族の勝利なしに、都市に祭壇を与えてください。"
 bfl_bank_flo.3.c: "お金は銀行の口座に保管してください。"
 bfl_bank_flo.3.desc: "サンタ・クローチェの修道士たちは、塗装された礼拝堂の計画をバルディに持ちかけた。家族はその敬虔さを色と石で記憶し、シニョーリア家はフィレンツェが単なる帳簿の都市以上のものであることを世界に記憶させるでしょう。一連の絵画は銀行の常連客に敬意を表するでしょう。都市の名前で支払われた質素な祭壇は、家族を超えてより多くの愛情を獲得するかもしれません。レジ担当者は、すでにデスクで待機している要求のみを確認します。"
 bfl_bank_flo.3.entry: "銀行家と修道士たち"
 bfl_bank_flo.3.title: "銀行家と修道士たち"
 bfl_bank_flo.4.a: "係争中のアカウントの公的和解を購入します。"
 bfl_bank_flo.4.b: "都市全体ではなく、提携銀行に徴収します。"
 bfl_bank_flo.4.c: "裁判所と債権者に損失を解明してもらいましょう。"
 bfl_bank_flo.4.desc: "The failures of the great banking houses left more than unpaid English promises behind them. The surviving books contain contested claims, advances against wool and accounts whose owners insist that the city must now protect them.私たちの憲章は議論を再開しました：フローレンスが公的和解の費用を支払うべきか、パートナーに特別な賦課金の負担を強制するべきか、それとも古い請求を法廷に残しておくべきか？ The English crown is only one name in a history of war, withdrawals and broken confidence, but it is the name most often spoken in the chamber."
 bfl_bank_flo.4.entry: "イギリスの借金の計算"
 bfl_bank_flo.4.title: "イギリスの借金の計算"
 bfl_bank_gen.1.a: "Bind the imperial account more closely to San Giorgio."
 bfl_bank_gen.1.b: "代わりに、私たちの要素をいくつかの裁判所に送ります。"
 bfl_bank_gen.1.c: "共和国のアカウントが最優先されなければなりません。"
 bfl_bank_gen.1.desc: "An imperial envoy has come to San Giorgio with promises of revenues and requests for further credit. The protectors know the advantage of an account which reaches across Europe, and the danger of allowing one great debtor to overshadow the rest. The republic’s merchants would profit from imperial favor. Its diplomats warn that favor at one court is suspicion at another.共和国が帝国とのつながりを望んでいるのか、より幅広い借り手の輪を広げたいのか、あるいはより安全な事業を小規模に行うことを望んでいるのか、銀行の取締役たちに告げなければならない。"
 bfl_bank_gen.1.entry: "皇帝のアカウント"
 bfl_bank_gen.1.title: "皇帝のアカウント"
 bfl_bank_gen.2.a: "Recognize the albergo and the authority of its elders."
 bfl_bank_gen.2.b: "公証人に監視付きの契約書を作成させます。"
 bfl_bank_gen.2.c: "No family shall make a state within the republic."
 bfl_bank_gen.2.desc: "グリマルディ家は、分散した家族の利益をアルベルゴ内に結び付けることを提案します。共通の条項、共通の責任、共通の名前によって、銀行は一世帯では約束できない永続性を得ることができます。家族は自分たちの長老たちに協定を統治するよう求めます。市の公証人は、書籍を公的監視下に置くという別の取り決めを提案している。どちらの和解も家を強化するでしょう。問題は、誰がその問題の鍵を手に入れるのかということだ。"
 bfl_bank_gen.2.entry: "ザ グリマルディ アルベルゴ"
 bfl_bank_gen.2.title: "ザ グリマルディ アルベルゴ"
 bfl_bank_gen.3.a: "キャプテンとしてバンカーに落ち着いた発言権を与えましょう。"
 bfl_bank_gen.3.b: "共有の統治下にある家のバランスを保ちます。"
 bfl_bank_gen.3.c: "共和国の役人は銀行家であってはいけない。"
 bfl_bank_gen.3.desc: "スピノラの銀行家たちは古い前例を議会に持ち込みました。ガレオット・スピノラとラファエレ・ドリアはかつて一緒にキャプテンを務め、ジェノヴァにおけるナポリ王の支配を終わらせた。彼らの子孫は、共和国の信用を維持する人々が再び政府内に定住するべきだと主張している。銀行家のキャプテンシーを好む人もいれば、ライバルハウス間のバランスを好む人もいます。判事らは、貸し手がその請求を裁かなければならない役所の外に留まることを望んでいる。"
 bfl_bank_gen.3.entry: "キャプテンの先例"
 bfl_bank_gen.3.title: "キャプテンの先例"
 bfl_bank_headquarters_cost_reduction: "チャーター銀行本部の運営コスト削減"
 bfl_bank_holdings: "銀行投資"
 bfl_bank_identity_tip: "[Country.GetName] 独自の財務、資産、義務を保有します。これらの合計は、国庫とは別に銀行に属します。 Merchant Finance は貿易および法人融資を専門としています。海外投資はベンチャーや企業に特化しています。銀行は永続的な専門分野を 1 つ選択します。"
 bfl_bank_loan_yield_bonus: "新しい銀行ローンのオファーに対する金利"
 bfl_bank_of_england_founding_tt: "標準的なチャーター投資を上限として利用可能な財務省現金から資金を調達し、ロンドンにイングランド銀行をチャータード銀行として設立します。"
 bfl_bank_of_england_name: "イングランド銀行"
 bfl_bank_palace_cost_reduction: "銀行運営コストの削減"
 bfl_bank_petitions.1.a: "強盗の購読を認めて本を開いてください。"
 bfl_bank_petitions.1.b: "私たちは公共の利益を希薄化するつもりはありません。"
 bfl_bank_petitions.1.desc: "取引所の開設により、私たちの公認銀行の株式は最初の加入者を超えて存続することができました。その取締役たちは現在、新たな資金を調達するために休暇を求めており、主要なブルガーたちは新たな株式の一部を受け取る用意ができている。彼らは、より広範な経営者が銀行にコインとコネをもたらすことを約束している。私たちの財務担当者はそれほど熱心ではありません。私たちが加盟店と一緒に購読しない限り、新株が発行されるたびに、将来の配当のうちソブリンの部分が減ることになります。"
 bfl_bank_petitions.1.entry: "新しいサブスクリプション"
 bfl_bank_petitions.1.title: "新しいサブスクリプション"
 bfl_bank_petitions.2.a: "当社の株式のこの部分については公正な支払いを受け入れてください。"
 bfl_bank_petitions.2.b: "公的出資はそのまま維持されるものとする。"
 bfl_bank_petitions.2.desc: "私たちの公認銀行の取締役たちは、財務省が保有する株式の一部を購入することを申し出ました。証明書は取り消され、残りの経営者が銀行の将来の収益の大部分を手にすることになる。住民たちはこの提案を歓迎するが、財務担当者は、これからもたらされる収入と引き換えにすぐに支払いができると考えている。しかし、今日放棄された株式は、新たな申し込みがなければ明日再び売り出すことはできません。ディレクターたちは私たちの答えを待っています。"
 bfl_bank_petitions.2.entry: "ソブリンの株式"
 bfl_bank_petitions.2.title: "ソブリンの株式"
 bfl_bank_petitions.3.a: "収益は2年間銀行内に保管してください。"
 bfl_bank_petitions.3.b: "財務省は慣れ親しんだ収入を必要とします。"
 bfl_bank_petitions.3.desc: "銀行の取締役たちは財務省に帳簿を置き、忍耐を求めた。彼らは、今後の利益を分配するのではなく、準備金が充実するまで銀行に保管しておくでしょう。商人の経営者らは、国王が同様に応じるなら待つことに同意した。私たちの役員たちは、予想される配当がすでに公的口座にその地位を占めていると抗議しています。拒否すれば私たちの収入は保たれますが、銀行の将来よりも次の支払いを大切にしていると取締役たちに納得してもらうことになります。"
 bfl_bank_petitions.3.entry: "配当は待たなければなりません"
 bfl_bank_petitions.3.title: "配当は待たなければなりません"
 bfl_bank_share_dealing: "銀行株取引"
 bfl_bank_share_dealing_desc: "パートナーの財産を同じ銀行に永遠に結び付けておく必要はありません。承認された所有権の移転により、投資家は自分の権益を他人に売却できる一方、金融機関は資本を引き出すことなく事業を継続できます。"
 bfl_bank_share_price_bonus: "銀行株価"
 bfl_bank_share_transfer: "銀行株式譲渡"
 bfl_bank_share_transfer_tip: "#T 銀行株式譲渡#!\n記録された銀行所有権単位を資金提供者間で移転します。完了した証券取引所が必要です。この行は権限を報告します。それ自体は二次株式取引を実行しません。"
 bfl_bank_status_tip: "運営: 他の要件が満たされている場合、新しいビジネスが許可されます。現金が圧迫されている: 利用可能な現金が枯渇しています。出金が待機中: 未払いの出金リクエストにより、新規ビジネスが停止されます。支払不能：負債が資産を上回っている。決議中またはクローズ済み: 通常の業務が制限されます。既存の申し立ては記録されたままになります。"
 bfl_bank_subscription: "銀行の定期購読"
 bfl_bank_ven.1.a: "ジロを共和国の常設機関とする。"
 bfl_bank_ven.1.b: "上院の同意を得て、1年間更新してください。"
 bfl_bank_ven.1.c: "実験を終了します。既存のアカウントにサービスを提供します。"
 bfl_bank_ven.1.desc: "バンコ・デル・ジロは便宜的なものであるはずだった。共和国に譲渡可能な義務を課すのに3年かかり、その後その事業は縮小されるだろう。期限は近づいていますが、商人の帳簿にはこれまで以上に多くの送金が記載されています。上院は、永続的な公的機関、新たな短期間の任務、そして新規事業の秩序ある終了のいずれかを選択しなければならない。遅れが生じるたびに、一時的な銀行を解雇することが難しくなります。それぞれの恒久的な義務は、共和国を債権者とより密接に結びつけます。"
 bfl_bank_ven.1.entry: "ジロの3年間"
 bfl_bank_ven.1.title: "ジロの3年間"
 bfl_bank_ven.2.a: "救援金を支払い、公的口座を動かし続けましょう。"
 bfl_bank_ven.2.b: "軍事アカウントを優先してください。"
 bfl_bank_ven.2.c: "小教区や近隣地域に救援物資を届けてもらいましょう。"
 bfl_bank_ven.2.desc: "ジロの本は、共和国の緊急事態に対処する場となっている。戦勝者らは軍の口座を提示し、公衆衛生当局は自らの罪状の支払いを求める。あらゆる要求を即座に尊重することは財務省に負担を与えることになる。調理室を優先すると、民間商業が待たされることになる。上院議員の中には、すでに最も重い負担を負っている人々を犠牲にして国民の財布を節約し、その仕事を教区や近隣地域に投げかける人もいた。"
 bfl_bank_ven.2.entry: "戦争と疫病の本"
 bfl_bank_ven.2.title: "戦争と疫病の本"
 bfl_bank_ven.3.a: "国庫準備金を公的正金窓口に資金提供します。"
 bfl_bank_ven.3.b: "銀行自身のコストでより狭い窓口を用意してもらいましょう。"
 bfl_bank_ven.3.c: "より安価な公共交通機関を保存してください。"
 bfl_bank_ven.3.desc: "商人たちはもはや、公簿に記載されたことが問題の終わりとなることを望んでいません。彼らは、銀貨でバランスが取れる定期的な窓口を求め、ジロの評判はその答え次第だと警告している。上院議員らは、潤沢な資金を備えた正貨施設の代金を支払ったり、銀行に対し自己資金でより狭い枠を用意するよう要求したり、より安価な送金機械を支持したりすることができる。準備ができたコインの約束には、金庫内のコインとカウンターの店員が必要です。"
 bfl_bank_ven.3.entry: "ジロで銀メダル"
 bfl_bank_ven.3.title: "ジロで銀メダル"
 bfl_bank_ven.4.a: "ジロを共和国の常設機関とする。"
 bfl_bank_ven.4.b: "上院の同意を得て、1年間更新してください。"
 bfl_bank_ven.4.c: "実験を終了します。既存のアカウントにサービスを提供します。"
 bfl_bank_ven.4.desc: "もう一つの年次任務が終わりました。ジロの書記たちは再び上院に対し、新しい帳簿を準備すべきか、それとも古い帳簿を閉鎖し始めるべきかを尋ねている。かつては一時的な便法を歓迎していた商人も、今ではその送金を通常の商取引の一部として扱っている。任務を更新するには上院の裁量権が保たれるが、新たな歳出が必要となる。永続性があれば問題は解決するでしょう。新しい事業を閉鎖すれば、共和国はその結果に対処することになるだろう。"
 bfl_bank_ven.4.entry: "ジロのもう一年"
 bfl_bank_ven.4.title: "ジロのもう一年"
 bfl_banking_company: "銀行会社"
 bfl_banking_company_desc: "この銀行の業務は、かつて帳簿を保管していた世帯を超えて大きくなりました。現在、取締役会が事務員を監督しており、共通の口座と確立されたオフィスが、一家の財産を超えて存続できる会社を結び付けています。経験は使用人の世代から世代へと受け継がれ、日々の信用業務に秩序と経済性をもたらします。"
 bfl_banking_finance_companies__expanded_details_desc: "詳細ステートメントビュー用に予約された表示設定。"
 bfl_banking_finance_companies__expanded_details_name: "拡張された活動の詳細"
 bfl_banking_finance_companies__finance_notifications_desc: "通知の表示設定。ミュートによって義務がキャンセルされることはありません。"
 bfl_banking_finance_companies__finance_notifications_name: "財務に関する通知"
 bfl_banking_finance_companies__interface_name: "インターフェース"
 bfl_banking_finance_companies__presentation__interface_name: "インターフェース"
 bfl_banking_finance_companies__presentation_name: "プレゼンテーション"
 bfl_banking_finance_companies__reduced_motion_desc: "静的なトランザクションの受信と警告を使用します。約束された支払い後の簡単な単一トランザクションのハイライトを許可しないようにします。財務上のフラッシュがループすることはありません。"
 bfl_banking_finance_companies__reduced_motion_name: "動きの減少"
 bfl_banking_finance_companies_desc: "プレゼンテーション設定のみ。教育機関のポリシーはエコノミーで管理されます。"
 bfl_banking_finance_companies_name: "銀行、金融、貿易会社"
 bfl_bardi_chapel_cycle: "バルディ礼拝堂のサイクル"
 bfl_bardi_chapel_cycle_desc: "バルディの名で依頼されたフィレンツェのフランシスコ会礼拝堂の一連のフレスコ画。聖フランシスコの生涯の場面が、世俗的な所有物の放棄、貧しい人々の世話、聖人の最後の祝福など、ペイントされた建築全体に展開されます。静かな顔と意図的な身振りが、神聖な物語に目撃された出来事の重みを与えます。寄付者たちは聖徒たちの下にひざまずき、彼らの高価な衣服は修道士たちの素朴な習慣とは対照的です。このコントラストは、家族の献身と、使徒たちの貧困の傍らにある不安な富の両方を表しています。祭壇の向こうには、バルディの腕が壁の建設費を支払った家の記憶を保存しています。"
 bfl_bond_accept_tip: "現在の所有者、請求権、および権限を再確認した後、見積もられた元本/クーポンの減額および年率の引き下げを受け入れます。新たなセキュリティや現金の支払いはありません。"
 bfl_bond_buy_row_tip: "このオファーされた債券を銀行を通じて購入してください。銀行は現在の保有者に見積価格を支払います。発行者は新たなお金を受け取りません。両方の取引所、支店へのアクセス、利用可能な現金、資本、現在の所有者と有効期限が再チェックされます。"
