 bfl_join_clearing_group_desc: "メンバーを受け入れているオペレーターに参加してください。グループごとに 4 つの銀行。一致する満期支払請求書は、積立ネットデビットによって決済されます。短いメンバーはクレームを消去せずにバッチをブロックします。"
 bfl_join_clearing_group_effect_text: "$bfl_join_clearing_group$"
 bfl_join_clearing_group_effect_text_past: "$bfl_join_clearing_group$"
 bfl_join_clearing_group_tip: "会員を受け入れている調査済みの決済オペレーターを選択してください。革命、クリアリングハウス、高度なクリアリングの研究が必要です。最大 4 つの銀行が明示的に参加します。 short メンバーはすべてのクレームを保持します。"
 bfl_liabilities_detail_title: "の負債 [Country.GetName]"
 bfl_liabilities_label: "負債"
 bfl_liabilities_label_tip: "#T 負債総額#!\n銀行口座に記録される義務。これは、州固有のローンや債券とは別のものです。\n\n預金元本: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_deposit_principal')|2]@gold!\n入金利息: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_deposit_interest')|2]@gold!\n未処理のメモ: [Country.MakeScope.GetVariable('bfl_notes_outstanding').GetValue|2]@gold!\nその他の未払金: [Country.MakeScope.GetVariable('bfl_other_payables').GetValue|2]@gold!\n合計: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_liabilities')|2]@gold!\n\n待機中の出金 [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_withdrawals_due')|2]@gold! すでに預金請求の一部となっており、再度追加されることはありません。"
 bfl_liquidity_facilities: "流動性ファシリティ"
 bfl_liquidity_facilities_desc: "健全な銀行であっても、コインのすべての需要を一度に満たすことはできないかもしれません。支援によって金融機関が耐えられない損失を隠蔽しない限り、健全な資産に対する一時的な前払いがこの不足を埋めることができる。"
 bfl_liquidity_warning: "銀行の流動性には注意が必要です"
 bfl_liquidity_warning_desc: "銀行が引き出しを待機しているか、資本が不十分です。オープンエコノミー→銀行と金融で預金と資本再構築を確認します。"
