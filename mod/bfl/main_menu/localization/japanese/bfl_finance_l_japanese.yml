 bfl_venture_preset_tip: "一方的: 銀行がすべての資本に資金を提供し、受け取ります 75% 余剰分の。二国間: 銀行が 3 分の 2、事業者が 3 分の 1 を出資し、剰余金は均等に分割されます。資本拠出に応じて損失が発生します。"
