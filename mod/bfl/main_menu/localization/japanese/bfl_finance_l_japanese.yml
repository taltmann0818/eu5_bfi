 bfl_goods_deliver: "物理的な配送をリクエストする"
 bfl_goods_explanation: "資金提供されたネイティブ在庫、裏付けされた受入および転送には、マーチャント ファイナンス、その前払い、および P09 執行/保管検証が必要です。抵当商品は 2 番目の請求を裏付けることはできません。"
