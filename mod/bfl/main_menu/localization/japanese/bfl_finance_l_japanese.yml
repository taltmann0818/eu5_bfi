 bfl_florentine_altar: "フィレンツェ・コミューンの祭壇"
 bfl_florentine_altar_desc: "単一の銀行王朝ではなく、フィレンツェのコミューンの名で捧げられた祭壇画。聖母子が中央を占め、洗礼者聖ヨハネと聖フランシスコが出席しています。その下には、施し、誠実な労働、そして苦境にある家庭の救済を示す小さな場面が描かれています。控えめな金メッキが、鮮明な色や測定された数字を圧倒することなく、チャペルの光を捉えます。市のユリは下位の装飾品の中に表示されますが、最前線の位置を主張する寄贈者家族はいません。その控えめな規模は、身近な場所での礼拝を促し、市民の慈善活動を一家の富の記念碑ではなく、共通の義務として提示しています。"
 bfl_florentine_choice_acciaioli: "アッチャイオーリを信頼してください。"
 bfl_florentine_choice_bardi: "私たちの公的信用をバルディに委ねてください。"
 bfl_florentine_choice_cash: "寄付を受け入れて銀行を独立させます。"
 bfl_florentine_choice_cash_tt: "受信 250 ダカット。銀行は所有権、免許証、建物、口座を保持します。"
 bfl_florentine_choice_desc: "シニョリーアの影の下で、大手銀行はそれ自体で権力を握るようになりました。彼らの事務員たちは、布地商人の請求書と並んで王の約束を秤にかけており、彼らの仕事が机の上にあるところならどこにでも、フィレンツェの名誉が伝わります。現在、市はこれらの住宅のうちの 1 つを国庫とより密接に結びつけるかどうかを決定する必要がある。憲章はその経験を私たちの役に立ちますが、新しい宮殿はその取引を石で宣言することになります。しかし、一部の市議会議員は、むしろ今日は寄付金を受け取り、銀行家たちのことは自分たちのことに任せたいと考えている。"
 bfl_florentine_choice_peruzzi: "ペルッツィは我々の憲章を受け取ることになる。"
