 bfl_custom_bonds_title: "国債"
 bfl_custom_bonds_title_tip: "銀行は国に現金を貸し、債券を受け取ります。所有者は毎月の利息と返済を受け取ります。借入総額は以下に制限されます 24 月々の現地収入、 500-ゴールドの開始手当。債券利息は最大でも使用できます 25% ネイティブ収入の。未払いの利息が新たな債券の発行や販売を妨げます。"
 bfl_cycle_bond_rate_tip: "新しい債券の年利を変更します。 1%, 3% または 6%。既存の債券は金利を維持します。"
 bfl_cycle_deposit_rate_tip: "新規預金の金利変更: 0%, 1% または 2% 一年。既存のアカウントはレートを維持します。"
 bfl_cycle_facility_tip: "毎月の資金を変更します: オフ、経費、または現金バッファー。経費は国の支出の一部に充てられます。現金バッファーは州の現金を補充します。どちらも、手動借入による月間制限を共有します。"
 bfl_cycle_payout_tip: "配当を変更する: 利益はすべて保持し、支払います 25%、または支払う 50%。支払いには、コストと損失を除いた獲得利益が使用されます。配当政策の管理が必要です。"
 bfl_cycle_share_offering_tip: "新しい共有サブスクリプションを開くか閉じます。有料サブスクリプションでは資本と新しい株式が追加されます。既存の所有者は株式と配当の権利を保持します。"
 bfl_dealer_inventory_class: "マーケットメーカー在庫 · 投票なし"
 bfl_debt: "自然債ポートフォリオ"
 bfl_debt_explanation: "公認銀行はカスタムソブリン債に資金を提供しています。二次取引には、早期イベントの付与を含め、双方で完了した証券取引所が必要です。ネイティブ クレジットでは、受け入れられたオファーと、永続的な請求記録による調査済みの債務救済が使用されます。"
 bfl_debt_facility: "債務ファシリティ"
 bfl_debt_resale: "借金の転売"
 bfl_debt_resale_tip: "#T ソブリン債の転売#!\n二次ソブリン債の売買には、証券取引所の前払いと所有する証券取引所の建物が必要です。オープン オファリングでは、同じカスタム クレームが転送されます。 98% 額面通り。発行者は新たな収益を受け取りません。クーポンと引き換えは購入者に続きます。"
 bfl_debt_restructuring: "債務再編"
 bfl_debt_restructuring_desc: "約束の日に回収できない借金が無価値である必要はありません。債権者は、窮地に陥った債務者を完全な債務不履行に追い込むよりも、新たな条件に同意することで、より多くの債権を保全できる可能性がある。"
 bfl_debt_tip: "#T 借金と信用#!\n融資、引受、再構築、債務移転の許可。各行には独自の調査、専門化、流動性、実行要件があります。ロックは、新しい発信が利用できないことを意味します。既存の請求は取り消されません。"
 bfl_demand_deposit: "要求払預金"
 bfl_deposit_1: "デポジット 100 オンデマンドのゴールド"
 bfl_deposit_1_tip: "#T 要求払預金#!\n転送 100 州の金をあなたの公認銀行に送ります。新規アカウントの年間オファーは、表示されている基本料金に追加料金が加算されます。 1% チャータープレミアム。需要利息は、資金調達時にセントキャリーで毎月財務省に支払われます。未払い利息はまだ残っています。既存のアカウントは受け入れレートを維持します。出金すると元金と未払い利息が返済されます。独立系銀行は外交を通じて預金を受け入れます。 +50 またはそれ以上の意見を提示し、基本料金を提供します。"
 bfl_deposit_2: "デポジット 100 のための金 12 月"
 bfl_deposit_2_tip: "#T 定期預金#!\n転送 100 州の金をあなたの公認銀行に12か月間預けます。新規アカウントの年間オファーは、表示されている期間レートに、 1% チャータープレミアム。利息は毎月発生し、満期時に元本と一緒に支払われます。ネイティブ バンキング、許可された年齢、無料アカウント スロットが必要です。独立した定期口座は、次の外交を通じて入手できます。 +50 意見以上。"
 bfl_deposit_accounts_heading: "預金口座"
 bfl_deposit_admission: "新規預金"
 bfl_deposit_amount: "デポジット"
 bfl_deposit_amount_desc: "入金する金額を選択します。定期預金の期間は 12 か月です。"
 bfl_deposit_amount_label: "入金額"
 bfl_deposit_amount_tip: "銀行と金額を選択します。国庫の現金を口座に移動します。利息と出金は預金者に帰属します。銀行は、お客様が確認する際に資金と条件を再度確認します。"
 bfl_deposit_business_reason: "銀行は、停止中、破産中、破綻処理中は新たな取引を開始できません。"
 bfl_deposit_closed_reason: "新規預金は閉鎖されています。以下で新しい入金を再開して受け入れてください。"
 bfl_deposit_decline_tip: "全額のデポジット請求を保持します。現金の移動や株式の発行はありません。"
 bfl_deposit_equity_tip: "存続銀行がプラスの具体的なNAVと株主能力を持っている場合にのみ、見積請求額を現物株式に変換します。サブスクリプションの現金や収益は発生しません。"
 bfl_deposit_explanation: "各アカウントには、受け入れられた固定年率が保存されます。レートを変更すると、新しいアカウントに影響します。定期口座の満期日は次のとおりです 12 数か月。引き出し不足は負債のままであり、新たな約束は保留される。"
 bfl_deposit_haircut_tip: "引用文を受け入れる 20% 債権者、残りの請求権、調査および権限を再確認した後、減額されます。記録された公的保証は引き続き別途資金提供されます。"
 bfl_deposit_income_tip: "認可銀行および独立銀行によって今月実際に支払われた要求金利。未払いの利息はまだ残っています。元本の引き出しや出資は除きます。"
 bfl_deposit_interest: "預金利息"
 bfl_deposit_ledger_help: "各アカウントは合意された金利を維持します。定期預金の期間は 12 か月です。お金と利息は預金者に戻ります。"
 bfl_deposit_ledger_subtitle: "当座預金"
 bfl_deposit_ledger_title: "預金者"
 bfl_deposit_ledger_title_tip: "この銀行にお金を持っている人は誰ですか。マウスを移動すると、アカウントと引き出しを確認できます。"
 bfl_deposit_policy_title: "預金金利"
 bfl_deposit_policy_title_tip: "新規入金に提供される年率。既存の預金は合意された金利を維持します。"
 bfl_deposit_total: "預金"
 bfl_deposit_total_tip: "銀行が預金者に支払うべきお金（未払い利息を含む）。"
 bfl_deposits: "デポジットと金利"
 bfl_deposits_label: "預金請求"
 bfl_dev_notice: "資金提供されたクレジット、ソブリン債、企業投資、商品、コメンダ、金融サービスは、調査、プロファイル、構築要件に従います。リリース全体のキャンペーンのバランスと互換性はまだ検証中です。"
 bfl_dhe_annual_giro: "ジロの年次任務"
 bfl_dhe_annual_giro_desc: "銀行はさらに1年間存続する可能性があり、その権限は依然として上院に依存している。"
 bfl_dhe_annuity_tt: "積立国債を創設する 100@gold! 銀行が保有し、固定金を支払う 5% 毎年恒例のクーポン。既存の債券は金利が維持されます。"
 bfl_dhe_approve_tt: "私たちに対する銀行の評価は 15 ハンバーガーの満足度は 5 パーセンテージポイント。"
 bfl_dhe_audit_tt: "支払う 100 銀行の帳簿を再編するためのドゥカット。銀行の管理コストが減少 5 パーセントポイント 10 年。"
 bfl_dhe_balanced_captains: "バランスのとれた治安判事制度"
 bfl_dhe_balanced_captains_desc: "政務を共有することでライバル家のバランスを取り、公共の収入を分配しながら商業を支援します。"
 bfl_dhe_banker_captains: "バンカーキャプテンズ"
 bfl_dhe_banker_captains_desc: "銀行家一族は共和国の事務所と収入に対して安定した影響力を獲得した。"
 bfl_dhe_bardi_patronage: "バルディの後援の素晴らしさ"
 bfl_dhe_bardi_patronage_desc: "家族の礼拝堂の豪華さは、この銀行家に特別な印象を与えています。"
 bfl_dhe_bubble_contagion: "銀行と失敗したサブスクリプション"
 bfl_dhe_bubble_contagion_desc: "投機的な申し込みの崩壊により、同行の上場株式に対する信頼が弱まっています。"
 bfl_dhe_bubble_restructuring: "南海再建会計"
 bfl_dhe_bubble_restructuring_desc: "この救済は銀行への信頼を裏付ける一方、再編された口座の管理により経費は増大する。"
 bfl_dhe_buyback_quote_tt: "銀行支払い: [SCOPE.sCountry('bfl_event_bank').MakeScope.GetVariable('bfl_dhe_buy_price').GetValue|2]@gold!\nキャンセルされた株式: [SCOPE.sCountry('bfl_event_bank').MakeScope.GetVariable('bfl_dhe_buy_units').GetValue|3]\n1株あたりNAV: [SCOPE.sCountry('bfl_event_bank').MakeScope.GetVariable('bfl_dhe_buy_nav').GetValue|3]@gold!"
 bfl_dhe_buyback_tt: "銀行は最大で国庫に支払います 5% 発行済み株式を見積純資産価格で売却し、その後、それらの株式を消却します。銀行は、未コミットの現金と資本の余裕から支払いを賄わなければなりません。他の株主は単元を保持します。"
 bfl_dhe_city_concessions: "市への譲歩"
 bfl_dhe_city_concessions_desc: "銀行への商店の貢献は市への譲歩によって確保された。"
 bfl_dhe_civic_neutrality: "派閥を超えた銀行"
 bfl_dhe_civic_neutrality_desc: "シニョリーアは党の部門を越えてコミューンにサービスを提供することを銀行に要求している。"
 bfl_dhe_civic_notaries: "共和国の公証人"
 bfl_dhe_civic_notaries_desc: "共和国の公証人は、銀行協定に関するより明確な公的説明を維持している。"
 bfl_dhe_credit_contraction_1772: "信用の収縮"
 bfl_dhe_credit_contraction_1772_desc: "民間信用の破綻は商業とそれが維持する収益に打撃を与える。"
 bfl_dhe_credit_relief_1772: "財務省の信用救済"
 bfl_dhe_credit_relief_1772_desc: "財務省は危機を通じて信用を安定させるために資源を投入した。"
 bfl_dhe_discount_1772: "監視付き割引オフィス"
 bfl_dhe_discount_1772_desc: "専門の事務員が新しいクレジット事業をより詳しく調査し、より高い経常コストで条件を改善します。"
 bfl_dhe_english_court_accounts: "英国法廷の報告"
 bfl_dhe_english_court_accounts_desc: "王室のつながりは、より収益性の高い新規ローンの提案をサポートしますが、法廷への高額の出席が必要です。"
 bfl_dhe_english_wool_factors: "英国羊毛の要素"
 bfl_dhe_english_wool_factors_desc: "要素は英国の羊毛貿易に従い、商業的なつながりと独自の高価な家を維持します。"
 bfl_dhe_european_factors: "サンジョルジョのヨーロッパの要素"
 bfl_dhe_european_factors_desc: "幅広い要因により、銀行は複数の裁判所や市場と結びついています。"
 bfl_dhe_exchequer_register: "独立した財務省登録簿"
 bfl_dhe_exchequer_register_desc: "財務省は独自の登記簿を維持しており、市との摩擦を犠牲にして独立性を保っている。"
 bfl_dhe_farmed_excises: "個人コレクター向けに養殖された物品税"
 bfl_dhe_farmed_excises_desc: "個人コレクターは物品税を保証し、取引からその価格を正確に算出します。"
 bfl_dhe_favored: "銀行の立場を支持"
 bfl_dhe_florentine_settlement: "旧会計の公的決済"
 bfl_dhe_florentine_settlement_desc: "公的和解は、古い紛争の費用を国庫に請求しながら、商業の回復に役立ちます。"
 bfl_dhe_fund_tt: "購読する 100 銀行の純資産価値に応じて財務省からドゥカットが支払われます。新たに発行された株式を受け取る。既存の所有者は比例的に希薄化されます。"
 bfl_dhe_giro_measured_specie: "測定された正貨ウィンドウ"
 bfl_dhe_giro_measured_specie_desc: "小規模な施設では、銀行に継続的な費用を負担して、適切な設備を提供します。"
 bfl_dhe_giro_senate: "上院の永久銀行手数料"
 bfl_dhe_giro_senate_desc: "上院は常設銀行機関に対する継続的な公共料金を受け入れる。"
 bfl_dhe_giro_specie: "ジロの公共正貨窓"
 bfl_dhe_giro_specie_desc: "財務省の準備金と有人カウンターが、この新種の施設の評判を支えています。"
 bfl_dhe_giro_transfer_office: "公共交通機関"
 bfl_dhe_giro_transfer_office_desc: "ジロは、より広範な正貨施設を求める商人の要求にもかかわらず、安価な書籍の譲渡を支持しています。"
 bfl_dhe_giro_winddown: "ジロの終わり"
 bfl_dhe_giro_winddown_desc: "ジロでの新規事業の終了は、その振替帳簿に慣れている加盟店を混乱させる。"
 bfl_dhe_grimaldi_concessions: "グリマルディ家の譲歩"
 bfl_dhe_grimaldi_concessions_desc: "共和国はグリマルディ法人の継続と引き換えに家族特権を認めた。"
 bfl_dhe_guelph_compact: "バルディ・グエルフ・コンパクト"
 bfl_dhe_guelph_compact_desc: "バルディ家の先祖代々の同盟は、公の信用を教皇の友人たちに結びつけています。"
 bfl_dhe_hired_halls: "混雑した貸切ホール"
 bfl_dhe_hired_halls_desc: "分散したオフィスと混雑したカウンターは、成長を続ける銀行の経費を増大させます。"
 bfl_dhe_imperial_accounts: "サン・ジョルジョの帝国会計"
 bfl_dhe_imperial_accounts_desc: "宮廷への出席は新たな融資条件をサポートし、銀行業務のコストを増加させます。"
 bfl_dhe_issue_tt: "住民はお金を払う 100 新しく発行された銀行株式の純資産価値でのドゥカット。銀行をさらに資本募集し、株式を上場できるようにします。既存の所有者は希薄化している。その後の再販は販売者に支払います。"
 bfl_dhe_italian_concentration: "イタリアの集中力"
 bfl_dhe_italian_concentration_desc: "銀行は、遠方の契約とその維持コストを削減します。"
 bfl_dhe_military_giro: "軍事アカウントの優先順位"
 bfl_dhe_military_giro_desc: "共和国は商人の通常の業務よりも軍事会計を優先している。"
 bfl_dhe_notarial_albergo: "公証コンパクト"
 bfl_dhe_notarial_albergo_desc: "公証人は家族の義務を共通の監督下にまとめます。"
 bfl_dhe_old_litigation: "古い銀行債務の訴訟"
 bfl_dhe_old_litigation_desc: "大手銀行の未解決の債務が商業を妨げ続けています。"
 bfl_dhe_ordered_books: "注文された銀行通帳"
 bfl_dhe_ordered_books_desc: "経験豊富な事務員が銀行の分散した口座を整理整頓します。"
 bfl_dhe_papal_friend: "グエルフ・コンパクトを尊重"
 bfl_dhe_papal_respect: "フィレンツェの諸家を和解させた"
 bfl_dhe_parish_burden: "ヴェネツィア教区の負担"
 bfl_dhe_parish_burden_desc: "小教区と近隣地域は救済措置を行っているが、国庫はその資金提供を拒否している。"
 bfl_dhe_partners_levy: "提携銀行に対する課税"
 bfl_dhe_partners_levy_desc: "パートナーは、より広範なビジネスを犠牲にして公共資源を保護するために、法外な徴収金を負担している。"
 bfl_dhe_permanent_giro: "常設銀行バンコ デル ジロ"
 bfl_dhe_permanent_giro_desc: "ジロは期限切れの任務が相次ぐ代わりに、安定した運営を行っている。"
 bfl_dhe_petition_granted: "銀行の請願を聞き入れた"
 bfl_dhe_petition_refused: "銀行の請願を拒否した"
 bfl_dhe_plague_accounts: "ジロの救済アカウント"
 bfl_dhe_plague_accounts_desc: "銀行は緊急支出に備えて追加のレジスターと事務員を維持しなければなりません。"
 bfl_dhe_primary_shares_tt: "住民は新たに発行された株式を純資産価値で受け取り、既存の所有者の価値を希薄化する。"
 bfl_dhe_public_bubble_relief: "南海救助の公的費用"
 bfl_dhe_public_bubble_relief_desc: "公的資金は、サブスクリプションの崩壊後に信頼を回復するコストを負担します。"
 bfl_dhe_public_register: "銀行の公的登録簿"
 bfl_dhe_public_register_desc: "公募および振替は、当銀行との合意に基づいて記録されます。"
 bfl_dhe_rebuffed: "銀行の立場を拒否"
 bfl_dhe_refuse_tt: "私たちに対する銀行の評価は下がった 20 そしてハンバーガーの満足度は低下する 5 パーセンテージポイント。"
 bfl_dhe_register_clerks: "官公庁の職員"
 bfl_dhe_register_clerks_desc: "常駐のスタッフが株式登録簿を管理し、配当金を支払います。"
 bfl_dhe_republic_first: "外国の王冠が誕生する前の共和国"
 bfl_dhe_republic_first_desc: "この共和国は、外国の法廷で得られる外交上の利点よりも、自国の歳入を優先している。"
 bfl_dhe_reserves_1772: "信用危機で準備金が強化される"
 bfl_dhe_reserves_1772_desc: "公的寄付は銀行の準備金に対する信頼を強化します。"
 bfl_dhe_retain_tt: "～の新規配当を停止する 24 数か月。その後、その間に変更されない限り、以前の支払いポリシーが再開されます。受理された請求は引き続き支払われます。"
 bfl_dhe_retained_earnings: "銀行に留保される配当金"
 bfl_dhe_retained_earnings_desc: "新たな収益は経営者に分配されるのではなく、銀行に残ります。別の方針が採用されない限り、この契約の期限が切れると、以前の配当方針が再開されます。"
 bfl_dhe_royal_friend: "クラウンのアカウントを開設しました"
 bfl_dhe_royal_rival: "ライバルクラウンを支持した"
 bfl_dhe_separate_offices: "別々の官公庁と銀行事務所"
