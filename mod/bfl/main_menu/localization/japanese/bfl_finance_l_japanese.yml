 bfl_accept_money_claims.desc: "MOD インタラクションを通じて、額面で提供される全額資金の請求書や紙幣を自発的に受け入れるか、受け入れを停止します。転送には引き続き利用可能な財務省が必要です。受理された請求は、受理が終了した後も償還可能です。ネイティブ決済では引き続きゴールドが使用されます。"
 bfl_accept_money_claims.title: "銀行支払い請求の受け入れを切り替え"
 bfl_accounts_explanation: "本来の国庫は現金です。預金や手形は負債です。融資は現金を資産と交換します。元本、募集、発行は利益ではありません。"
 bfl_activity_title: "月次活動報告書"
 bfl_activity_title_tip: "ネイティブ クーポンの観察により、ネイティブの純予算が分類されます。彼らは金を二度動かすことはありません。決済されたネイティブペイオフ収益は、損益を認識する前に実際の取得コストを解放します。会社の分配とカスタム資金入金は独自のバケットに入ります。元本、預金、引受金は利益から除外されます。"
 bfl_administer_estates: "相続した金融資産を管理する"
 bfl_administer_estates.desc: "破壊された機関の個別に保管されている現金と債務を確認します。管財当局はその現金を国庫の一部にすることは決してありません。"
 bfl_administer_estates.title: "相続した金融資産を管理する"
 bfl_administer_estates_desc: "破壊された機関の個別に保管されている現金と債務を確認します。管財当局はその現金を国庫の一部にすることは決してありません。"
 bfl_advanced_clearing: "高度なクリアリング"
 bfl_advanced_clearing_desc: "相互に多くの支払いを負っている銀行は、すべての債務をコインで個別に決済する必要はありません。清算口座は請求を調整し、残りの残高のみを移転することで、商取引を維持するために必要な資金を削減します。"
 bfl_advanced_tip: "研究により使命が解き明かされます。銀行はまた、専門性、流動性、および運営要件も満たさなければなりません。利用できない実行は無効のままになります。"
 bfl_ai_equity_offering: "銀行を受け入れ、有償資本の提供を開始する"
 bfl_ai_equity_offering_desc: "AI 管理者は、実際の銀行を認め、株式取引と交換の完了後に有料の主要サブスクリプションを承認する場合があります。入場によって現金や株式が作成されることはありません。"
 bfl_ai_equity_purchase: "積立型取引所への投資を検討する"
 bfl_ai_equity_purchase_desc: "AI 購入では、プレイヤーと同じライブリサーチ、建物、権限、容量、および正確な見積もりの確認チェックが使用されます。毎月の機会レビュー、少なくとも 500 現金と資本剰余金の金。市場価格以上の要求はありません。"
 bfl_ai_exchange_priority: "証券取引所へのアクセスを優先する"
 bfl_asset_bonds_heading: "の絆 [Country.GetName]"
 bfl_asset_bonds_summary: "債券: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_asset_fraction_bonds')|%2]"
