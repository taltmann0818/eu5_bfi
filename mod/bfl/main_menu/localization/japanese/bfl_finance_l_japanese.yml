 bfl_manage_shareholdings: "株主の決定"
 bfl_manage_shareholdings_desc: "配当を設定する [ROOT.GetCountry.MakeScope.GetVariable('bfl_exchange_selected').GetCountry.GetName]。財務票の過半数が企業および独立銀行の支払いを左右します。州は独自の公認銀行を管理している。企業の準備金の選択は、政治的支配を変更しないままにします。"
 bfl_manage_shareholdings_tip: "配当を設定する会社または銀行を選択します。財務上の投票の過半数、または公認銀行の管理が必要です。少数株主は、要件が満たされていない状態で表示されたままになります。"
 bfl_margining: "余白"
 bfl_margining_and_risk_management: "マージンとリスク管理"
 bfl_margining_and_risk_management_desc: "将来の配達を約束した販売者は、契約が満了するずっと前に価格の変動に直面することになる。エクスポージャが増大するにつれて追加のセキュリティが必要になることで、銀行家は不利な市場がデフォルトになる前に損失を抑える手段が得られます。"
 bfl_margining_tip: "#T マージンとリスクの管理#!\n変化する商品エクスポージャーに対する担保と変動証拠金が必要です。マージンとリスク管理の研究、マーチャントファイナンスと革命時代が必要です。このビルドでは、商品担保証拠金の実行は利用できません。"
 bfl_market_company_requirement: "銀行は、運営会社の財務省から株式を購入できます。他の企業への投資には、海外投資と企業株式の調査が必要です。銀行株を取得するには証券取引所が完了している必要があります。"
 bfl_market_funds_requirement: "あなたの銀行は、現金、資本金、所有権の範囲内で株式を購入する余裕があります。"
 bfl_market_holder_requirement: "発行会社は無料の株主枠を持っているか、すでに購入銀行を株主として記録しています。"
 bfl_market_portfolio_requirement: "購入銀行には無料のポートフォリオ スロットがあるか、すでにこの証券を保有しています。"
 bfl_market_sort_price: "一株あたりの価格で並べ替える"
 bfl_mediceo_maintenance: "バンコ・メディセオ管理"
 bfl_medici_decline: "国庫にはほかの使い道がある。"
 bfl_medici_desc: "メディチ家は壮大な石造の宮殿から、イタリア全土とアルプスの向こうへ広がる信用網を操っている。ミラノに常設の拠点を設ければ、その書記と準備金を宮廷の近くに置ける。勅許と二千ダカットの出資と引き換えに、銀行は既存の勘定と債務を維持しながら、その命運を我が国の公信用に結びつけると申し出た。"
 bfl_medici_fund: "購読する 2,000 ダカットを出資し、勅許を与える。"
 bfl_medici_funding_tt: "転送 2,000 ダカットをメディチ銀行に移し、我が国の勅許銀行とする。ミラノにBanco Mediceoを設立し、ミラノと現在の首都に完成済みの銀行支店を設ける。既存の貸付と債務は維持される。他国の君主からすでに勅許を受けた銀行は引き継げない。"
 bfl_medici_house_only: "公的出資をせずに銀行の進出を歓迎する。"
 bfl_medici_house_only_tt: "メディチ銀行への出資や勅許なしに、ミラノにBanco Mediceoの建物を設立する。"
 bfl_medici_title: "ミラノのBanco Mediceo"
 bfl_mendes_spice_house: "メンデスの家"
 bfl_mendes_spice_house_desc: "メンデス家の要素は、海を越えてスパイス港とヨーロッパの計数所を結びつけています。彼らの文通によってコショウやクローブの市場が開かれる一方、紙幣や貨物の安定した動きにより、王子たちの垣根を越えた貿易が維持されています。この家に永続的な憲法を与えることで、私たちはその経験をより自由な交流に役立てることができます。"
 bfl_monetary: "金融政策と流動性"
 bfl_monetary_explanation: "正貨を主権当局と完成した中央銀行との予約紙幣に交換します。担保および流動性ファシリティーを適用した後、第三銀行手形を割引します。レボリューションズは、資金提供による会員網と上限付き公的保障サポートを追加します。受け入れられる料金は固定のままです。"
 bfl_monetary_tip: "#T 金融商品#!\nソブリン紙幣の後期許可、流動性の確保、清算および公的支援。それぞれに独自の認可、裏付け、および動作条件が必要です。"
 bfl_money_accept: "承認と割引の切り替え"
 bfl_money_accept_tip: "ノートは完全に留保された請求と正貨を交換します。受け入れは任意です。事前割引 75 対する金 100-金の第三銀行券。清算は、すべての会員が正味借方を支払うことができる場合にのみ、一致する満期手形を決済します。既存の請求権は、失われた権限と建物を存続させます。"
 bfl_money_acceptance_action: "自主的な受け入れを変更する"
 bfl_money_authorize: "メモを承認する"
 bfl_money_authorize_tip: "ソブリン管理者は、そのチャーター銀行を認可します。現在の首都には、主権所有の完成した中央銀行が必要です。新規発行には、発行者の資本銀行支店と手形の調査も必要です。"
 bfl_money_clear: "会員料金の決済"
 bfl_money_clear_open: "入場の清算"
 bfl_money_clear_open_tip: "清算グループへの入場を開始または終了します。レボリューション、クリアリング ハウス、アドバンスト クリアリングの研究、および銀行またはその現存するソブリンが所有する完成したクリアリング ハウスが必要です。メンバーは最大4人まで。"
 bfl_money_clear_tip: "今月 1 回、一致する満期の会員請求書を決済します。各メンバーは、他の準備金を保護しながら、純借方をカバーしなければなりません。 1 つの短いメンバーがバッチ全体を保持します。質権のある請求および非会員の請求は除外されます。"
 bfl_money_empty: "No notes in circulation.通貨調査、権限、完成した建物により、新しいサービスが解放されます。"
 bfl_money_empty_tip: "ノートは完全に留保された請求と正貨を交換します。受け入れは任意です。事前割引 75 対する金 100-金の第三銀行券。清算は、すべての会員が正味借方を支払うことができる場合にのみ、一致する満期手形を決済します。既存の請求権は、失われた権限と建物を存続させます。"
 bfl_money_help: "ノートは完全に留保された請求と正貨を交換します。受け入れは任意です。事前割引 75 対する金 100-金の第三銀行券。清算は、すべての会員が正味借方を支払うことができる場合にのみ、一致する満期手形を決済します。既存の請求権は、失われた権限と建物を存続させます。"
