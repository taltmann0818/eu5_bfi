 bfl_new_capital_subscription: "新しい資本を購読する"
 bfl_new_capital_subscription_desc: "投資する 100@gold! あなたの銀行の資金のうち、 [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_issuer').GetCountry.GetName] 有形NAVでの新規発行株式として。発行者は支払いを受け取り、既存の保有者は希薄化されます。これは株式の購入とは別の資本の申し込みです。実行では、取得されたNAV、発行されたユニット、研究、保護された資金、集中制限が再チェックされます。外交官を 1 人消費し、この発行者の 1 か月の取引クールダウンを開始します。"
 bfl_new_capital_subscription_tip: "主な資金調達: 投資 100 管理された銀行からの金。発行者は現金を受け取り、新株を発行します。これは既存の株式の取引とは別のものです。"
 bfl_no_automatic_tribute: "自動チャーターのトリビュートなし"
 bfl_no_automatic_tribute_cost_modifier: "自動チャーターのトリビュート費用"
 bfl_no_bank: "意思決定を通じて既存の州立銀行を認可するか、独立した銀行国としてプレイします。銀行を設立するには、あなたの国が資本市場を所有している必要があります。"
 bfl_nobles_estate_workout_mandate: "エステートトレーニングの義務化"
 bfl_nobles_estate_workout_mandate_desc: "この財団は政府に、政府に代わって自主的な銀行預金ワークアウトを審査する権限を明示的に与えている。すべての提案は依然として個別に承認される必要があります。この特権を取り消すと、保留中の財産条件が無効になります。回復の支払いは遺産ウォレットに継続されます。"
 bfl_offer_bank_shares: "新しい銀行株を売り出す"
 bfl_offer_bank_shares_tip: "他の銀行や国が購読できるようにする 100 銀行の現在の純資産価値での金。新株は支払いが行われた場合にのみ発行されます。既存の所有者は希薄化する。ネイティブ バンキングの調査とプラスの資本は引き続き必要です。"
 bfl_offer_bond: "銀行保有のソブリン債を発行する"
 bfl_offer_bond_tip: "銀行が保有する最も古い債券を 3 か月間リストします。 98% 額面通り。販売と購入の両方で、所有する完成した証券取引所の建物が必要です。承認では、販売者、現在の所有者、世代、資金、有効期限が再確認されます。延滞は取引をブロックします。"
