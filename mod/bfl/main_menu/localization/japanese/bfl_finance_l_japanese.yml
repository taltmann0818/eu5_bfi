 bfl_term_service_1_tip: "最初の対象期間ロットを選択します。銀行は明示的な受け入れについて一定の条件を提示します。更新には現在の入学許可と期間許可が必要です。早期撤退と成熟した撤退は、関係または権限の喪失後も利用可能です。変更または期限切れの見積もりは実行できません。"
