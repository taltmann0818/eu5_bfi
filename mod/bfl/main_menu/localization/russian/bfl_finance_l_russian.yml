 bfl_custom_bonds_title: "Суверенные облигации"
 bfl_custom_bonds_title_tip: "Банк финансирует таможенные бессрочные суверенные облигации. Текущие держатели получают ежемесячные купоны и погашение номинальной стоимости. Совокупная таможенная и собственная долговая емкость составляет 24 месяцев собственного дохода с 100-золотой минимум; пользовательские купоны могут потреблять максимум 25% местного дохода. Невыплаченные купоны блокируют новый выпуск и перепродажу."
 bfl_dealer_inventory_class: "Инвентарь маркет-мейкера · нет голосов"
 bfl_debt: "Собственный долговой портфель"
 bfl_debt_explanation: "Уполномоченный банк финансирует таможенные суверенные облигации. Вторичная торговля требует наличия завершенных фондовых бирж с обеих сторон, включая гранты на ранние мероприятия. Native Credit использует принятые предложения и исследует облегчение бремени задолженности с сохранением записей о требованиях."
 bfl_debt_facility: "Долговой механизм"
 bfl_debt_resale: "Перепродажа долга"
 bfl_debt_resale_tip: "#T Перепродажа суверенных облигаций#!\nДля продажи и покупки вторичных государственных облигаций требуется аванс Фондовой биржи и собственное здание Фондовой биржи. Открытое предложение передает одно и то же специальное требование для 98% номинальной стоимости; эмитент не получает новых доходов. Купоны и погашение следуют за покупателем."
 bfl_debt_restructuring: "Реструктуризация долга"
 bfl_debt_restructuring_desc: "Долг, который не может быть взыскан в назначенный день, не обязательно должен быть бесполезным. Кредиторы могут сохранить больше своих требований, согласившись на новые условия, чем принуждая проблемного должника к прямому дефолту."
 bfl_debt_tip: "#T Долг и кредит#!\nРазрешения на кредитование, андеррайтинг, реструктуризацию и перевод долга. Каждая строка имеет свои собственные требования к исследованиям, специализации, ликвидности и исполнению. Блокировка означает, что новое происхождение недоступно; он не отменяет существующие претензии."
 bfl_demand_deposit: "Депозит до востребования"
 bfl_deposit_1: "Депозит 100 золото по требованию"
 bfl_deposit_1_tip: "#T Депозит до востребования#!\nТрансфер 100 государственного золота в ваш уполномоченный банк. Его годовое предложение для нового счета представляет собой отображаемую базовую ставку плюс 1% чартерная премия. Проценты до востребования выплачиваются в вашу казну ежемесячно при финансировании с учетом переноса процентов; невыплаченные проценты остаются задолженностью. Существующие учетные записи сохраняют принятую ставку. Снятие средств погашает основную сумму долга и невыплаченные проценты. Независимые банки принимают депозиты дипломатическим путем на +50 мнение или лучше и предложите базовую ставку."
 bfl_deposit_2: "Депозит 100 золото для 12 месяцы"
 bfl_deposit_2_tip: "#T Срочный вклад#!\nТрансфер 100 передать золото в свой уполномоченный банк на двенадцать месяцев. Его годовое предложение для нового счета представляет собой отображаемую срочную ставку плюс 1% чартерная премия. Проценты начисляются ежемесячно и выплачиваются вместе с основной суммой при наступлении срока погашения. Требуется встроенный банкинг, разрешенный возраст и свободный слот для учетной записи. Независимые срочные счета доступны через дипломатию по адресу +50 мнение или лучше."
 bfl_deposit_decline_tip: "Сохраните полную сумму залога. Денежные средства не перемещаются и акции не выпускаются."
 bfl_deposit_equity_tip: "Конвертируйте котируемое требование в реальные акции только в том случае, если выживший банк имеет положительную материальную чистую стоимость активов и акционерный потенциал. Никакие денежные средства или доходы от подписки не создаются."
 bfl_deposit_explanation: "На каждом счете хранится принятая фиксированная годовая ставка. Изменение курса влияет на новые аккаунты. Срок действия срочных счетов истекает после 12 месяцев. Нехватка средств остается пассивом и приостанавливает новые обязательства."
 bfl_deposit_haircut_tip: "Примите цитируемое 20% уменьшение после перепроверки кредитора, оставшихся претензий, исследований и полномочий. Зарегистрированная государственная гарантия по-прежнему финансируется отдельно."
 bfl_deposit_income_tip: "Требуйте проценты, фактически выплаченные в этом месяце вашим зарегистрированным банком и независимыми банками. Невыплаченные проценты остаются задолженностью. Выводы основной суммы и вклады в капитал исключены."
 bfl_deposit_interest: "Проценты по депозиту"
 bfl_deposit_ledger_help: "Для каждого лота сохраняется принятая ставка. Совокупность соответствующих депозитов; Срок погашения срочных депозитов наступает после 12 месяцев. Заявки, помещенные на карантин, остаются задолженностью и перестают накапливаться до тех пор, пока не появится действительный получатель. Основная сумма имущества и проценты возвращаются в один и тот же пул."
 bfl_deposit_ledger_title: "Депозитный регистр и обслуживание"
 bfl_deposit_ledger_title_tip: "Обязательства банка, принятые условия и неоплаченные претензии. Обслуживание никогда не зависит от продолжения дипломатического допуска."
 bfl_deposit_policy_title: "Ставки на новые депозиты"
 bfl_deposit_policy_title_tip: "#T Ставки на новые депозиты#!\nВыберите годовую процентную ставку, принимаемую для новых счетов до востребования.\n\nТекущее предложение: [Country.MakeScope.GetVariable('bfl_demand_rate').GetValue|%2]\nПредложение по срочному счету: [Country.MakeScope.GetVariable('bfl_term_rate').GetValue|%2]\n\nДля существующих счетов сохраняется ставка, согласованная при их открытии. Ежемесячно начисляемые проценты увеличивают обязательства банка и уменьшают его нераспределенную прибыль; он не переводит наличные деньги до тех пор, пока они не будут оплачены."
 bfl_deposits: "Депозиты и ставки"
 bfl_deposits_label: "Депозитные требования"
 bfl_dev_notice: "Накопительный кредит, суверенные облигации, инвестиции компаний, товары, вознаграждения и денежные услуги соответствуют требованиям их исследований, профиля и строительства. Баланс кампании и совместимость в рамках всей версии все еще находятся на проверке."
 bfl_distress: "Бедствие и врата развития"
 bfl_distribution_title: "Распределение прибыли"
 bfl_distribution_title_tip: "#T Ежемесячные дивиденды по акциям#!\nСуверенные дивиденды = суверенные акции Ã — ((ежемесячная чистая прибыль банка Ã — коэффициент выплат) / акции в обращении).\n\nКоэффициент выплат: [Country.MakeScope.GetVariable('bfl_payout_ratio').GetValue|%0]\nЧистая прибыль после затрат и убытков: [Country.MakeScope.GetVariable('bfl_monthly_net_income').GetValue|2]@gold!\nСуверенные акции: [Country.MakeScope.GetVariable('bfl_state_units').GetValue|2]\nАкции в обращении: [Country.MakeScope.GetVariable('bfl_total_units').GetValue|2]\nПоследние общие дивиденды: [Country.MakeScope.GetVariable('bfl_dividend_paid').GetValue|2]@gold!\nПоследние суверенные дивиденды: [Country.MakeScope.GetVariable('bfl_state_dividend_paid').GetValue|2]@gold!\n\nПервоначально суверен владеет 100%. Новые банковские подписки увеличивают капитал и размывают собственность. Денежные средства, капитал и непогашенные обязательства ограничивают финансируемую выплату. Отрицательный доход не приносит дивидендов; нераспределенная прибыль не учитывается повторно в следующем месяце. Основная сумма, депозиты, подписки и займы исключены."
 bfl_dividend_explanation: "Ежемесячная чистая прибыль после вычета процентов по вкладам, операционных расходов и убытков, средств и дивидендов. Каждый владелец получает принадлежащие ему акции, умноженные на финансируемую выплату на одну размещенную акцию. Нераспределенная прибыль не распределяется снова в следующем месяце."
 bfl_draw_bond: "Одолжить 100 из банка"
 bfl_draw_bond_tip: "Зарегистрированный банк платит 100 золото за бессрочную суверенную облигацию. Один выпуск в месяц при условии защиты денежных средств, капитала и долговой мощности эмитента. Доходы – это финансирование. Выплатите номинальную стоимость его нынешнему владельцу, чтобы вывести его из обращения."
 bfl_equity_debt: "Банковский капитал и долг"
 bfl_equity_debt_tip: "#T Банковский капитал и долг#!\nДо двенадцати фактических ежемесячных снимков расчетов. Зеленый — активы минус обязательства; красный — общие обязательства банка. Оба используют одну и ту же автоматически масштабируемую ось золота, включая отрицательный капитал. Выборки располагаются от самых старых слева до самых последних справа. Наведите курсор на образец, чтобы узнать его стоимость и отчетный месяц. Государственные кредиты не включены в эту банковскую историю."
 bfl_equity_label: "Банковский капитал"
 bfl_equity_label_tip: "#T Банковский капитал#!\nОстаточная стоимость, принадлежащая владельцам банка после его обязательств.\n\nАктивы: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_assets')|2]@gold!\nМинус общий долг: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_liabilities')|2]@gold!\nКапитал: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_equity')|2]@gold!\n\nЗаписанные единицы состояния: [Country.MakeScope.GetVariable('bfl_state_units').GetValue|2]\nВсего единиц собственности: [Country.MakeScope.GetVariable('bfl_total_units').GetValue|2]\nКапитальный запас: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_capital_headroom')|2]@gold!\n\nОтрицательный капитал означает неплатежеспособность. Запас капитала равен капиталу выше 10% активов, минимум ноль; распределения ограничены как этим запасом, так и доступными денежными средствами. Эквити – это не сумма, которую можно немедленно вывести."
 bfl_equity_market: "Стоимость акций и история"
 bfl_equity_subscribe_0: "Казначейство: подписаться 100 золото"
 bfl_equity_subscribe_0_tip: "Первичная подписка NAV: платит эмитенту и размывает существующих держателей. При покупке недвижимости используется реальный кошелек недвижимости, сохраняя 25 золото. Банковский инвестор использует только свои собственные защищенные денежные средства и излишек капитала; капитал компании требует исследования зарубежных инвестиций."
 bfl_equity_subscribe_1: "Бюргеры: подписывайтесь 100 золото"
 bfl_equity_subscribe_1_tip: "Первичная подписка NAV: платит эмитенту и размывает существующих держателей. При покупке недвижимости используется реальный кошелек недвижимости, сохраняя 25 золото. Банковский инвестор использует только свои собственные защищенные денежные средства и излишек капитала; капитал компании требует исследования зарубежных инвестиций."
