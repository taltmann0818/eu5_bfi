 bfl_bond_secured_accept_tip: "Примите указанное сокращение вместе с эксклюзивным двухлетним обещанием поступлений и уступкой по защите торговли. Фактическое исполнение по-прежнему ограничено доступными денежными средствами эмитента."
 bfl_bond_selected_name: "[Country.GetName]"
 bfl_bond_underwriting: "Андеррайтинг облигаций"
 bfl_bond_underwriting_tip: "#T Андеррайтинг облигаций#!\nВаш зарегистрированный банк платит реальные деньги за таможенную суверенную облигацию. Обе специализации могут гарантировать. Фиксированные годовые купоны выплачиваются ежемесячно; текущий держатель получает номинальную стоимость при погашении. Для выпуска необходимы банковская ликвидность, капитал и суверенные возможности."
 bfl_bond_unpaid: "Невыплаченные купоны"
 bfl_bond_workout_accept: "Согласиться на реструктуризацию облигаций"
 bfl_bond_workout_desc: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_bond_workout_issuer').GetCountry.GetName] просит вас, нынешнего владельца, отказаться 20% основной суммы и невыплаченных купонов этой облигации и уменьшить ее годовой купон на один процентный пункт, с 1% пол. При отклонении сохраняются все условия. Срок действия предложения истекает в этом месяце; оплата, перевод или другое изменение делает его недействительным. Обычное принятие не обеспечивает никакой новой безопасности. Обеспеченное принятие, если оно предлагается, добавляет двухлетнюю уступку в области торговой защиты и эксклюзивный залог на сумму до 10% ежемесячного дохода за невыплаченные купоны. Правоохранительные органы используют только доступное казначейское золото перед другими купонами на таможенные облигации; он не создает никаких гарантий или выплаты основной суммы долга."
 bfl_bond_workout_secured: "Принять с двухлетней торговой концессией и обещанием доходов"
 bfl_bond_workout_title: "Предложение по реструктуризации облигаций"
 bfl_branch_construction: "Открыть филиал столичного банка"
 bfl_branch_required: "Для нового суверенного бизнеса требуется завершенное отделение банка в нынешней столице. Межбанковские операции освобождены от налога; существующие претензии остаются невыполненными."
 bfl_browse_bond_issuers: "Обзор эмитентов и холдингов"
 bfl_browse_bond_issuers_desc: "Выберите эмитента для проверки непогашенных облигаций и предложений, включая требования вашего банка."
 bfl_browse_bond_issuers_tip: "Выберите действующего эмитента с обращающимися пользовательскими облигациями. Это ничего не покупает и не продает."
 bfl_browse_goods: "Товарные предложения и претензии по хранению"
 bfl_browse_goods_act: "$bfl_browse_goods$"
 bfl_browse_goods_desc: "Ознакомьтесь с предложениями о физическом хранении, существующими претензиями или добровольным соглашением о доступе к таможне. Выбор страны не приносит денег."
 bfl_browse_goods_effect_text: "$bfl_browse_goods$"
 bfl_browse_goods_effect_text_past: "$bfl_browse_goods$"
 bfl_burghers_estate_workout_mandate: "Мандат на тренировки по недвижимости"
 bfl_burghers_estate_workout_mandate_desc: "Это имущество прямо уполномочивает свое правительство пересматривать добровольные меры по урегулированию банковских депозитов от его имени. Каждое предложение по-прежнему требует отдельного принятия. Отзыв этой привилегии делает недействительными ожидающие рассмотрения условия наследства. Выплаты по восстановлению продолжают поступать в кошелек недвижимости."
 bfl_buy_bill: "Накопительный счет на оплату · 100 золото"
 bfl_buy_bill_tip: "#T Фондовый платежный счет#!\nТрансфер 100 государственного золота в банк для накопительного платежного счета. Счет учитывается как кредиторская задолженность, а не как банковская прибыль или необеспеченный кредит. Требуется исследование коммерческих векселей, место на столе контрактов и действующий банк, принимающий этот бизнес."
 bfl_buy_capital: "Подписать капитал · 100 золото"
 bfl_buy_capital_tip: "#T Подписаться на капитал банка#!\nТрансфер 100 государственное золото для покупки новых долей банковской собственности. Стоимость паев определяется исходя из положительного банковского капитала на одну существующую единицу. Это увеличивает банковские денежные средства и оплаченный капитал, а не прибыль. Разблокируется местным банковским исследованием, пространством таблицы капитала и действующим банком, принимающим этот бизнес. Капитал подвержен убыткам и не может быть изъят в качестве депозита."
 bfl_buy_confirm_desc: "Покупка [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_quantity').GetValue|3] акции [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_issuer').GetCountry.GetName] для [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_total').GetValue|2]@gold!. Это существующие акции из инвентаря маркет-мейкеров. Эмитент не получает финансирования и выпущенные акции не изменяются. Котировочная цена, доступ к рынку в реальном времени, доступные единицы, защищенные денежные средства и предел концентрации проверяются еще раз при приемке. Для урегулирования требуется один дипломат и начинается месячный период восстановления покупки/продажи этого эмитента."
 bfl_buy_confirm_title: "Подтвердите покупку акций"
 bfl_buy_secondary_confirm_desc: "Купить [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_quantity').GetValue|3] существующие акции [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_issuer').GetCountry.GetName] из [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_seller').GetCountry.GetName] для [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_total').GetValue|2]@gold!. Текущий продавец получает платеж. Эмитент не получает финансирования и выпущенные акции не изменяются. Наличие, доступ, защищенные средства и версия этого предложения проверяются еще раз при принятии. Для урегулирования требуется один дипломат и начинается месячный период восстановления покупки/продажи этого эмитента."
 bfl_buy_selected_bond: "Купить существующую заявку"
 bfl_buy_selected_bond_tip: "Заплатите указанную цену текущему продавцу. Эмитент не получает новых денег. Исполнение перепроверяет право собственности, срок действия, генерацию, обмен, задолженность и наличные."
 bfl_buy_shares: "Купить акции"
 bfl_buy_shares_desc: "Выберите банк или компанию, установите количество акций, а затем просмотрите общую сумму. Покупка передает существующие акции из предложения о продаже или из инвентаря маркет-мейкера. Используйте отдельное действие по подписке на капитал для финансирования нового выпуска."
 bfl_buy_shares_tip: "Выберите банк или компанию, установите количество акций, а затем просмотрите общую сумму. Покупка передает существующие акции из предложения о продаже или из инвентаря маркет-мейкера. Используйте отдельное действие по подписке на капитал для финансирования нового выпуска.\nТребуется завершенный обмен, торговля акциями и хотя бы один дипломат. Каждая успешная сделка потребляет один дипломат и запускает месячный период восстановления для этого эмитента. Доступные дипломаты: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bfl_available_trade_diplomats')|2]. Заказы должны иметь денежную стоимость не менее 0.01 золото."
 bfl_buy_sovereign_bond: "Купить предлагаемую суверенную облигацию"
 bfl_buy_sovereign_bond_act: "$bfl_buy_sovereign_bond$"
 bfl_buy_sovereign_bond_desc: "Купите существующую суверенную облигацию у ее текущего владельца. Требуется готовое здание фондовой биржи."
 bfl_buy_sovereign_bond_effect_text: "$bfl_buy_sovereign_bond$"
 bfl_buy_sovereign_bond_effect_text_past: "$bfl_buy_sovereign_bond$"
 bfl_buy_sovereign_bond_tip: "Выберите эмитента открытого предложения. Оплата поступает существующему держателю; эмитент не получает новых доходов. Вся заявка переходит из рук в руки с неизменным фиксированным годовым купоном и основной суммой долга."
 bfl_buy_state_confirm_desc: "Выкупить обратно [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_quantity').GetValue|3] существующие акции [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_issuer').GetCountry.GetName] из инвентаря маркет-мейкера для [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_total').GetValue|2]@gold!, оплаченный из казны вашей страны. Эти акции возвращаются в вашу казначейскую долю. Банк не получает финансирования и выпущенные акции не меняются. Доступные дилерские акции, текущие рыночные котировки, действующие уставные полномочия и казначейские средства проверяются еще раз. Поселение требует одного дипломата и запускает месячный период восстановления покупки/продажи этого банка."
 bfl_cancel: "Отмена"
 bfl_cancel_selected_bond_offer: "Отменить объявление"
 bfl_cancel_selected_bond_offer_tip: "Отозвать предложение, принадлежащее вам или вашему действующему чартерному банку. Долг и купон остаются неизменными."
 bfl_capital_button: "Подписать капитал · 100 золото"
 bfl_cash: "Казначейские наличные"
 bfl_cash_tip: "#T Казначейские наличные#!\nЗолото, которое в настоящее время принадлежит банку.\n\nИтого наличные: [Country.GetFixedPointCurrencyValue('gold')|2]@gold!\nЗащищенные деньги: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_protected_cash')|2]@gold!\nДоступные денежные средства: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_free_cash')|2]@gold!\n\nЗащищенные денежные резервы 25% обязательств, оставшихся после очереди вывода средств, полная очередь вывода средств, 25 золотой операционный буфер и выделенные денежные средства. Доступные денежные средства представляют собой казначейские деньги за вычетом резерва, но минимум равен нулю. Защищенные денежные средства являются обязательным резервом; он может превышать фактически имеющиеся денежные средства."
 bfl_chart_debt_01: "Долг: [Country.MakeScope.GetVariable('bfl_history_debt_01').GetValue|2]@gold! · отчетный месяц [Country.MakeScope.GetVariable('bfl_history_period_01').GetValue|0]"
 bfl_chart_debt_02: "Долг: [Country.MakeScope.GetVariable('bfl_history_debt_02').GetValue|2]@gold! · отчетный месяц [Country.MakeScope.GetVariable('bfl_history_period_02').GetValue|0]"
