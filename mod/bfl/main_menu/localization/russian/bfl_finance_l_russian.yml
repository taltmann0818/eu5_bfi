 bfl_accept_money_claims.desc: "Добровольно принимайте или прекращайте принимать полностью профинансированные счета и банкноты, предлагаемые по номинальной стоимости посредством взаимодействия с модами. Для перевода по-прежнему требуется ваша доступная казна. Принятые претензии остаются подлежащими погашению после завершения приема. В отечественных платежах по-прежнему используется золото."
 bfl_accept_money_claims.title: "Переключить прием требований банковских платежей"
 bfl_accounts_explanation: "Родная казна – это наличные. Депозиты и векселя являются пассивами. Кредитование обменивает денежные средства на активы; основной капитал, подписки и выпуск не являются прибылью."
 bfl_activity_title: "Ежемесячный отчет о деятельности"
 bfl_activity_title_tip: "Наблюдения за собственными купонами классифицируют собственный чистый бюджет; они никогда не перемещают золото дважды. Урегулированные собственные поступления от выплат освобождают от фактической стоимости приобретения до признания прибыли или убытка. Распределения компаний и поступления, финансируемые по индивидуальному заказу, попадают в отдельные корзины. Основная сумма, депозиты и подписки исключаются из прибыли."
 bfl_administer_estates: "Управлять унаследованным финансовым имуществом"
 bfl_administer_estates.desc: "Просмотрите отдельно хранящиеся денежные средства и обязательства разрушенного учреждения. Попечительский орган никогда не делает свои денежные средства частью национальной казны."
 bfl_administer_estates.title: "Управлять унаследованным финансовым имуществом"
 bfl_administer_estates_desc: "Просмотрите отдельно хранящиеся денежные средства и обязательства разрушенного учреждения. Попечительский орган никогда не делает свои денежные средства частью национальной казны."
 bfl_advanced_clearing: "Расширенный клиринг"
 bfl_advanced_clearing_desc: "Банковские дома, которые должны друг другу множество платежей, не обязаны оплачивать каждое обязательство отдельно монетами. Клиринговые счета согласовывают их требования и переводят только оставшийся баланс, сокращая деньги, необходимые для поддержания торговли."
 bfl_advanced_tip: "Исследования раскрывают мандат. Банк также должен соответствовать своей специализации, ликвидности и операционным требованиям. Недоступное выполнение остается отключенным."
 bfl_ai_equity_offering: "Принять банк и открыть оплаченное предложение капитала"
 bfl_ai_equity_offering_desc: "Руководство AI может признать свой настоящий банк и разрешить платную первичную подписку после сделки с акциями и завершения обмена. При поступлении не создаются денежные средства или акции."
 bfl_ai_equity_purchase: "Рассмотрите возможность инвестирования в обменные фонды"
 bfl_ai_equity_purchase_desc: "При покупке ИИ используются те же проверки в реальном времени, что и при подтверждении строительства, строительства, авторитета, мощности и точной цены. Ежемесячный обзор возможностей, по крайней мере, 500 золото денежных средств и излишка капитала. Никаких запросов выше рынка."
 bfl_ai_exchange_priority: "Приоритет доступа к фондовой бирже"
 bfl_asset_bonds_heading: "Облигации [Country.GetName]"
 bfl_asset_bonds_summary: "Облигации: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_asset_fraction_bonds')|%2]"
 bfl_asset_bonds_title: "Облигации"
 bfl_asset_cash_heading: "Казначейские наличные [Country.GetName]"
 bfl_asset_cash_summary: "Денежные средства казначейства: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_asset_fraction_cash')|%2]"
