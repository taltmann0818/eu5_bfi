 bfl_estate_deposit_2_act: "$bfl_estate_deposit_2$"
 bfl_estate_deposit_2_desc: "Поместите золото от недвижимого имущества на объединенный счет до востребования в выбранном банке. Премия по суверенному депозиту не применяется."
