 bfl_facility_tip: "Банковские денежные средства, фактически полученные от выпуска таможенных государственных облигаций в этом месяце. Финансирование создает долг и исключается из трудового дохода."
 bfl_facility_title: "Мандат на кредитование долга"
 bfl_facility_title_tip: "#T Мандат на кредитование долга#!\nБанк финансирует таможенные суверенные облигации с фиксированными годовыми купонами. Выключение останавливает запланированные проблемы. Первые запросы по долгам 60% прогнозируемых расходов. Буферные цели 200 состояние золота после прогноза ежемесячного баланса. Оба останавливаются на 500 государственное золото.\n\nПоследний запрос: [Country.MakeScope.GetVariable('bfl_facility_requested').GetValue|2]@gold!\nПоследнее финансирование: [Country.MakeScope.GetVariable('bfl_facility_paid').GetValue|2]@gold!\n\nМаксимум одна проблема и 100 золото в месяц. Защищенные банковские денежные средства, капитал, возможности эмитента и невыплаченные купоны могут предотвратить розыгрыш. Выручка – это финансирование, а не доход."
 bfl_feedback_1: "Уставный капитал получен"
 bfl_feedback_2: "Депозит получен"
 bfl_feedback_3: "Вывод оплачен"
 bfl_feedback_4: "Дивиденды выплачены"
 bfl_feedback_5: "Перепродажа облигаций урегулирована"
 bfl_feedback_6: "Полученные венчурные доходы"
 bfl_feedback_7: "#O Новое предупреждение о ликвидности#!"
 bfl_feedback_8: "Решение закрыто · зарегистрированные убытки остаются видимыми"
 bfl_feedback_9: "#O Целевой объект не был профинансирован#!"
 bfl_feedback_note: "Последняя совершенная транзакция · сумма уже зарезервирована. Открытие этого представления не воспроизводит прошлые эффекты. При уменьшенном движении сохраняются те же сообщения и предупреждения. Само по себе обнаружение не дает индикатора оплаты."
 bfl_feedback_signature: "[GetPlayer.GetTag]:[GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bfl_player_feedback_period')|0]:[GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bfl_player_feedback_sequence')|0]"
 bfl_finance.100.desc: "Выберите одну постоянную специализацию. Оба обслуживают суверенные кредиты и депозиты. Merchant Finance разрабатывает товарные и корпоративные кредитные инструменты; Зарубежные инвестиции развивают признание и капитал компании. Исследования и возрастные ограничения продолжают применяться."
