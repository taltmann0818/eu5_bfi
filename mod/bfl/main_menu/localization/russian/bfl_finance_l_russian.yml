 bfl_chart_equity_09: "Капитал: [Country.MakeScope.GetVariable('bfl_history_equity_09').GetValue|2]@gold! · отчетный месяц [Country.MakeScope.GetVariable('bfl_history_period_09').GetValue|0]"
 bfl_chart_equity_10: "Капитал: [Country.MakeScope.GetVariable('bfl_history_equity_10').GetValue|2]@gold! · отчетный месяц [Country.MakeScope.GetVariable('bfl_history_period_10').GetValue|0]"
 bfl_chart_equity_11: "Капитал: [Country.MakeScope.GetVariable('bfl_history_equity_11').GetValue|2]@gold! · отчетный месяц [Country.MakeScope.GetVariable('bfl_history_period_11').GetValue|0]"
 bfl_chart_equity_12: "Капитал: [Country.MakeScope.GetVariable('bfl_history_equity_12').GetValue|2]@gold! · отчетный месяц [Country.MakeScope.GetVariable('bfl_history_period_12').GetValue|0]"
 bfl_charter_begin_tip: "Откройте подходящий селектор государственного банка. Никакие деньги или исследования не меняются до тех пор, пока не будет выбран банк; Отмена оставляет обе казны без изменений."
 bfl_charter_selection_tip: "Трансфер [ROOT.GetCountry.MakeScope.ScriptValue('bfl_charter_investment')|0]@gold! выбранному банку в качестве нового государственного капитала. Сохраните свою страну, здания, существующие претензии и обязательства, а затем выберите свою постоянную специализацию."
 bfl_chartered_bank: "Чартерный банк"
 bfl_chartered_bank_desc: "Создан Государственный банк на базе здания. Его денежные средства и обязательства остаются отделенными от его суверенитета. Автоматическая дань не взимается."
 bfl_clearing: "Клиринг"
 bfl_clearing_tip: "#T Расширенный клиринг#!\nРеволюции, продвинутый клиринг и исследования собственной клиринговой палаты. Собственная завершенная клиринговая палата и явный прием в члены позволяют проводить атомарные чистые расчеты по совпадающим векселям с наступившим сроком погашения. Короткий участник блокирует пакет и сохраняет все претензии."
 bfl_clergy_estate_workout_mandate: "Мандат на тренировки по недвижимости"
 bfl_clergy_estate_workout_mandate_desc: "Это имущество прямо уполномочивает свое правительство пересматривать добровольные меры по урегулированию банковских депозитов от его имени. Каждое предложение по-прежнему требует отдельного принятия. Отзыв этой привилегии делает недействительными ожидающие рассмотрения условия наследства. Выплаты по восстановлению продолжают поступать в кошелек недвижимости."
 bfl_close_bank_offering: "Закрыть размещение акций"
 bfl_close_bank_offering_tip: "Прекратите принимать внешние подписки. Существующие права собственности и дивидендные права остаются в силе. Суверен все еще может рекапитализировать свой банк."
 bfl_close_bond_offer: "Закрытое размещение облигаций"
 bfl_close_bond_offer_tip: "Отозвать текущее вторичное предложение. Непогашенный долг и купоны остаются невыплаченными."
 bfl_collateral: "Залог"
 bfl_collateralization: "Обеспечение"
 bfl_collateralization_desc: "Доверие укрепляется, когда обещание подкреплено имуществом. Зафиксировав залог и права кредитора по нему, банкиры могут давать кредиты под активы, которые могут быть возвращены, если должник не выполнит соглашение."
 bfl_commenda: "Комменда"
 bfl_commenda_available_color: "green"
 bfl_commenda_available_icon: "@bfl_commenda_opportunity!"
 bfl_commenda_available_left_click: "Просмотрите эту операцию"
 bfl_commenda_available_name: "Commenda доступна для финансирования"
 bfl_commenda_available_tooltip: "[GetPlayer.MakeScope.GetVariable('bfl_op_country').GetCountry.GetName] · 10 [GetPlayer.MakeScope.GetVariable('bfl_op_good').Goods.GetNameWithNoTooltip]\n[GetPlayer.MakeScope.GetVariable('bfl_op_from').GetMarket.GetName] → [GetPlayer.MakeScope.GetVariable('bfl_op_to').GetMarket.GetName]\nОриентировочная стоимость банка: [GetPlayer.MakeScope.GetVariable('bfl_op_cost').GetValue|2]@gold!\nОриентировочный профицит банка: +[GetPlayer.MakeScope.GetVariable('bfl_op_surplus').GetValue|2]@gold!\n\nТекущие рыночные котировки на двухмесячную грузовую операцию; профицит исключает восстановленный капитал. Цены и доступ могут измениться. Капитал и доходы находятся под угрозой. Только фактическая продажа этого груза оплачивает договор. Оператор должен принять. Возможности обновляются ежемесячно и проверяются еще раз перед отправкой предложения."
 bfl_commenda_cargo: "Комменда: отправить груз в обнаруженную зону."
 bfl_commenda_cargo_act: "Отгрузить груз обнаруженного района"
 bfl_commenda_cargo_desc: "Выберите спонсируемого оператора и груз из десяти единиц на рынке, расположенном в обнаруженной области или граничащем с ней. Только неиспользованное принятое финансирование может покрыть его исходную стоимость покупки. Никаких выплат за открытие или несвязанной торговой атрибуции."
 bfl_commenda_cargo_effect_text: "Отгрузить груз обнаруженного района"
 bfl_commenda_cargo_effect_text_past: "Отгрузить груз обнаруженного района"
 bfl_commenda_cargo_tip: "Требуется подтвержденное открытие принятой экспедиции, оставшееся разрешение, доступ к местному рынку и запасы. Оператор или политический контролер командует рейсом."
 bfl_commenda_desc: "Купец, отправляющийся в путешествие, может обладать навыками торговли, не имея капитала для наполнения корабля. Комменда объединяет деньги финансиста с трудом путешествующего партнера, разделяя доходы от предприятия в соответствии с их соглашением."
 bfl_commenda_expedition: "Профинансировать названную экспедицию"
 bfl_commenda_expedition_act: "Профинансировать названную экспедицию"
 bfl_commenda_expedition_desc: "Выберите оператора, порт запуска, неизведанную морскую акваторию и исследователя. Морские цели должны находиться в пределах морской досягаемости оператора; безземельные компании используют выбранный участок хозяина объекта, находящегося в собственности. Прием средств нативного препарата на предложенных условиях. Банк не получает политического контроля."
 bfl_commenda_expedition_effect_text: "Профинансировать названную экспедицию"
 bfl_commenda_expedition_effect_text_past: "Профинансировать названную экспедицию"
 bfl_commenda_expedition_tip: "Прежде чем дать согласие, выберите оператора, регион, порт запуска и проводник. Финансирование покрывает только фактическую стоимость подготовки нативного препарата. Подготовка не подлежит возврату. Оставшееся разрешение может использоваться для финансирования грузов с рынка, расположенного в обнаруженном районе или граничащего с ним; только измеренная выручка от продажи может приносить прибыль."
 bfl_commenda_opportunity_consent: "Еще раз проверьте этот названный груз и свой действующий финансовый орган. Отправьте предложение, используя текущие Условия; деньги не переводятся, пока оператор не примет."
 bfl_commenda_opportunity_later: "Рассмотрим позже"
 bfl_commenda_opportunity_propose: "Отправьте данные условия оператору"
 bfl_commenda_opportunity_review: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_op_country').GetCountry.GetName] · 10 [ROOT.GetCountry.MakeScope.GetVariable('bfl_op_good').Goods.GetNameWithNoTooltip]\n[ROOT.GetCountry.MakeScope.GetVariable('bfl_op_from').GetMarket.GetName] → [ROOT.GetCountry.MakeScope.GetVariable('bfl_op_to').GetMarket.GetName]\nОриентировочная стоимость банка: [ROOT.GetCountry.MakeScope.GetVariable('bfl_op_cost').GetValue|2]@gold!\nОриентировочный профицит банка: +[ROOT.GetCountry.MakeScope.GetVariable('bfl_op_surplus').GetValue|2]@gold!\n\nТекущие рыночные котировки на двухмесячную грузовую операцию; профицит исключает восстановленный капитал. Цены и доступ могут измениться. Капитал и доходы находятся под угрозой. Только фактическая продажа этого груза оплачивает договор. Оператор должен принять. Возможности обновляются ежемесячно и проверяются еще раз перед отправкой предложения."
 bfl_commenda_tip: "#T Комменда#!\nВложите капитал в путешествие или торговое предприятие в обмен на определенную долю прибыли. Требуются исследования Commenda, зарубежные инвестиции и возраст Discovery или более поздний. В этой сборке недоступно собственное выполнение проекта."
 bfl_commercial_bill: "Коммерческий законопроект"
 bfl_commercial_bills: "Коммерческие счета"
 bfl_commercial_bills_desc: "Перевозка монет между торговыми центрами обходится дорого и опасно. Письменные векселя позволяют торговцам рассчитываться по обязательствам через доверенные банкирские дома, делая репутацию эмитента инструментом торговли."
 bfl_commodity_forward: "Товарный форвард"
 bfl_commodity_forward_tip: "#T Товарный форвард#!\nСогласуйте оплачиваемую поставку товара в будущем. Требуется исследование товарных форвардов, торговое финансирование и эпоха абсолютизма или позже. Физическая доставка и расчет недоступны в этой сборке."
 bfl_commodity_forwards: "Товарные форварды"
 bfl_commodity_forwards_desc: "Заказ урожая, отгрузки или мастерской может быть продан до его доставки. Соглашения, фиксирующие будущую цену, помогают торговцам упорядочить свои дела, несмотря на неопределенность отдаленных рынков и смену времен года."
 bfl_commodity_inventory: "Товарный запас"
 bfl_commodity_inventory_tip: "#T Товарный запас#!\nФинансирование товаров, предназначенных для торговли. Требуются исследования в области сырьевых инвестиций, торгового финансирования и эпохи открытий или более поздней версии. В этой сборке недоступны покупка, хранение и доставка физических товаров."
 bfl_commodity_investments: "Товарные инвестиции"
 bfl_commodity_investments_desc: "Банкиры, финансирующие торговлю, также могут сами владеть товарами. Зерно, шерсть и другие товары становятся инвестициями, стоимость которых зависит от хранения, транспортировки и меняющихся потребностей отдаленных рынков."
 bfl_company_crew: "Трансфер 250 моряки в компанию"
 bfl_company_crew_desc: "Управляйте родной компанией, которую вы сейчас контролируете. Накопительный капитал исключается из операционного дохода."
 bfl_company_crew_tip: "Управляйте родной компанией, которую вы сейчас контролируете. Капитальные взносы являются финансированием. Распределения компаний используют нераспределенную торговую прибыль после учета собственных затрат, текущих убытков, долговых резервов и денежных буферов. Политический повелитель и финансовый владелец разделены."
 bfl_company_equity: "Акционерный капитал компании"
 bfl_company_equity_desc: "Крупным торговым предприятиям требуются состояния, которые немногие торговцы могут обеспечить в одиночку. Разделение собственности между инвесторами позволяет компании накопить прочный капитал, одновременно распределяя риски и выгоды от своих предприятий."
 bfl_company_equity_tip: "#T Капитал компании#!\nПодписать капитал на долю собственности в признанной компании. Требуется исследование акционерного капитала компании, зарубежные инвестиции и эпоха Реформации или более поздняя. В этой сборке недоступны выпуск собственных компаний и расчет держателей."
 bfl_company_expedition: "Компания: подготовить местную разведку"
 bfl_company_expedition_desc: "Используйте казну компании, моряков и исследователей, чтобы подготовить морское исследование на объекте компании. Применяются родная подготовка и прогресс. Discovery не приносит никакой денежной или инвестиционной прибыли."
 bfl_company_expedition_tip: "Требуется мандат на торговлю и исследования, картографирование, подходящая компания-исследователь, моряки и доступный венчурный бюджет. Применяется родное время подготовки."
 bfl_company_exploration_capacity: "Создание геологоразведочной компании"
 bfl_company_exploration_capacity_desc: "Емкость для 500 моряков, пока разрешен мандат на разведку. Моряки должны быть выходцами из компании или переведены из ее политического контролера."
 bfl_company_explore: "Мандат компании: торговля и разведка"
 bfl_company_explore_desc: "Управляйте родной компанией, которую вы сейчас контролируете. Накопительный капитал исключается из операционного дохода."
 bfl_company_explore_tip: "Управляйте родной компанией, которую вы сейчас контролируете. Капитальные взносы являются финансированием. Распределения компаний используют нераспределенную торговую прибыль после учета собственных затрат, текущих убытков, долговых резервов и денежных буферов. Политический повелитель и финансовый владелец разделены."
 bfl_company_fund: "Внести свой вклад 100 золото в капитал компании"
 bfl_company_fund_desc: "Управляйте родной компанией, которую вы сейчас контролируете. Накопительный капитал исключается из операционного дохода."
 bfl_company_fund_tip: "Управляйте родной компанией, которую вы сейчас контролируете. Капитальные взносы являются финансированием. Распределения компаний используют нераспределенную торговую прибыль после учета собственных затрат, текущих убытков, долговых резервов и денежных буферов. Политический повелитель и финансовый владелец разделены."
 bfl_company_list_equity: "Разрешить листинг акций компании"
 bfl_company_list_equity_desc: "Разрешить платную первичную подписку NAV и вторичную торговлю. Приобретения банков требуют зарубежных инвестиций, исследования капитала компании и завершенного обмена на вторичные сделки. Политическое господство остается неизменным."
 bfl_company_list_equity_tip: "Действующий политический контролер разрешает участие в рынке. Денежные средства или паи не предоставляются."
 bfl_company_native_channels: "Доходы штаб-квартиры и выплаты субъектов остаются в местном бюджете. Рынки акций компаний, банковские корпоративные кредиты и комменда используют отдельные порталы для исследований и доставки."
 bfl_company_panel: "Операционные компании"
 bfl_company_panel_tip: "Казначейства компаний и политический контроль остаются отделенными от банковских счетов. Доходы владельцев штаб-квартиры коренных жителей, доходы прямых повелителей штаб-квартиры и выплаты местным подданным остаются у их местных получателей. Только реализованная сохраненная торговля за вычетом собственных затрат может финансировать дополнительное распределение собственников. Капитал и открытия исключены."
 bfl_company_retain: "Мандат компании: сохранять прибыль"
 bfl_company_retain_desc: "Управляйте родной компанией, которую вы сейчас контролируете. Накопительный капитал исключается из операционного дохода."
 bfl_company_retain_tip: "Управляйте родной компанией, которую вы сейчас контролируете. Капитальные взносы являются финансированием. Распределения компаний используют нераспределенную торговую прибыль после учета собственных затрат, текущих убытков, долговых резервов и денежных буферов. Политический повелитель и финансовый владелец разделены."
 bfl_company_route: "Компания: открыть отечественный торговый путь"
 bfl_company_route_desc: "Откройте один собственный маршрут, принадлежащий компании, используя 0.1 торговая мощность. Требуется торговый мандат, доступный операционный бюджет, доступ к внутреннему рынку, излишки и мощности. Максимум один управляемый маршрут на роту в месяц. Нативный ИИ сохраняет собственное торговое поведение."
 bfl_company_route_tip: "Выберите компанию, исходный рынок, рынок назначения, торговый рынок и товары. Собственные торговые издержки взимаются движком."
 bfl_company_select: "Выберите управляющую компанию"
 bfl_company_select_desc: "Осмотрите местную компанию, находящуюся под вашим нынешним политическим контролем."
 bfl_company_select_tip: "Выберите местную компанию, которую вы в настоящее время контролируете. Выбор и отображение выписки не перемещают денежные средства и не закрывают месяц."
 bfl_company_statement: "Наличные: [Country.GetFixedPointCurrencyValue('gold')|2]@gold!   Зарезервированный буфер: [Country.MakeScope.GetVariable('bfl_company_buffer').GetValue|2]@gold!\nРодная торговля: [Country.MakeScope.GetVariable('bfl_company_trade_receipts').GetValue|2]   Чистый бюджет: [Country.MakeScope.GetVariable('bfl_company_native_net').GetValue|2]\nПриемлемые доходы: [Country.MakeScope.GetVariable('bfl_company_verified_profit').GetValue|2]   Выплачено владельцу: [Country.MakeScope.GetVariable('bfl_company_dividend').GetValue|2]@gold!\nУдобства: [Country.MakeScope.GetVariable('bfl_company_facility_count').GetValue|0]   Маршруты: [Country.MakeScope.GetVariable('bfl_company_route_count').GetValue|0]   Выполненный объём: [Country.MakeScope.GetVariable('bfl_company_volume').GetValue|2]\nТорговый бюджет: 50   Резерв реинвестирования: 100   Венчурный бюджет: 100   Выплата владельцу: 25%"
 bfl_company_strategy_construction: "Реинвестируйте резервы компании в местную торговую площадку"
 bfl_company_trade: "Мандат компании: торговля"
 bfl_company_trade_desc: "Управляйте родной компанией, которую вы сейчас контролируете. Накопительный капитал исключается из операционного дохода."
 bfl_company_trade_tip: "Управляйте родной компанией, которую вы сейчас контролируете. Капитальные взносы являются финансированием. Распределения компаний используют нераспределенную торговую прибыль после учета собственных затрат, текущих убытков, долговых резервов и денежных буферов. Политический повелитель и финансовый владелец разделены."
 bfl_corporate_credit: "Корпоративный кредит"
 bfl_corporate_credit_desc: "По мере того как коммерческие предприятия перерастают один рейс или сезон, их потребность в кредитах становится все более устойчивой. Банковские дома учатся оценивать ресурсы и перспективы предприятия, а также положение его отдельных торговцев."
 bfl_corporate_credit_tip: "#T Корпоративный кредит#!\nКредит признанной торговой компании. Требуются исследования корпоративного кредита, торгового финансирования и эпохи Реформации или позже. В этой сборке недоступно новое исполнение корпоративного кредита."
 bfl_cost_accounts: "Депозитные счета: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_operating_accounts_count')|0] × 0.05"
 bfl_cost_asset_types: "Классы неденежных активов: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_operating_asset_types_count')|0] × 0.25"
 bfl_cost_base: "Администрация базы"
 bfl_cost_branches: "Филиалы: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_operating_branches_count')|0] × 0.50"
 bfl_cost_contracts: "Пользовательские финансовые контракты: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_operating_contracts_count')|0] × 0.10"
 bfl_cost_current: "Текущая ежемесячная стоимость: #R [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_operating_expense')|2]@gold!#!"
 bfl_cost_payment_detail: "Затраты масштабируются в зависимости от сложности, а не от стоимости активов. Взимается один раз в месяц сверх защищенных резервов; неоплаченные расходы ограничивают дивиденды. Проценты по депозиту и собственные расходы разделены. Скидки суммируются; общая сумма округляется до центов."
