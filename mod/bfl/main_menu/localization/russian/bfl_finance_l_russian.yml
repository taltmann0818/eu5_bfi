 bfl_cost_settlement_paid: "Денежные средства выплачены (включая задолженность)"
 bfl_cost_settlement_title: "Последний ежемесячный расчет"
 bfl_cost_subtitle: "Ежемесячное администрирование банка"
 bfl_cost_title: "Операционные расходы [Country.GetName]"
 bfl_credit_1_desc: "Банк предлагает 100 золото для 60 месяцев по указанному годовому тарифу. Принятие перепроверяет финансирование, полномочия, кредитоспособность и ваше право на участие. Главное – финансирование, а не доход.\nГодовая ставка: [ROOT.GetCountry.MakeScope.GetVariable('bfl_credit_offer_rate').GetValue|%1]."
 bfl_credit_1_title: "Кредитное предложение"
 bfl_credit_2_desc: "Ваш кредитор предлагает 20% снижение основной суммы долга и годовое снижение ставки на один процентный пункт (минимальный 1%). Это изменяет только существующий необеспеченный кредит. Срок его погашения остается неизменным."
 bfl_credit_2_title: "Предложение по облегчению долга"
 bfl_credit_accept: "Примите условия"
 bfl_credit_partial: "Вместо этого погасить 25% этого иска, включая его естественные оставшиеся проценты"
 bfl_credit_refinance: "Вместо этого урегулируйте это требование и рефинансируйте его основную сумму для 60 месяцы"
