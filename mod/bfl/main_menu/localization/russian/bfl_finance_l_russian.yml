 bfl_assets_label: "Всего активов"
 bfl_assets_label_tip: "#T Всего активов#!\nДенежные средства и учтенные активы, принадлежащие банку.\n\nДенежные средства казначейства: [Country.GetFixedPointCurrencyValue('gold')|2]@gold!\nКредитный портфель: [Country.MakeScope.GetVariable('bfl_native_credit_value').GetValue|2]@gold!\nПозиции в капитале (балансовая стоимость): [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_security_carrying')|2]@gold!\nПользовательские кредиты и облигации: [Country.MakeScope.GetVariable('bfl_custom_credit_value').GetValue|2]@gold!\nИнвентарь: [Country.MakeScope.GetVariable('bfl_inventory_value').GetValue|2]@gold!\nПроекты: [Country.MakeScope.GetVariable('bfl_project_value').GetValue|2]@gold!\nИтого: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_assets')|2]@gold!\n\nСсуды, позиции в акционерном капитале, запасы и проекты отражают стоимость активов, а не денежных средств, доступных для расходования. Погашение основной суммы долга обменивает кредитный актив на наличные; они не приносят прибыли."
 bfl_authorize_note_bank: "Авторизовать погашаемые банкноты"
 bfl_authorize_note_bank_act: "$bfl_authorize_note_bank$"
 bfl_authorize_note_bank_desc: "Разрешите своему зарегистрированному банку или независимому банку с филиалом в вашей столице обменивать звонкую монету на полностью обеспеченные погашаемые банкноты после необходимого исследования. Для новых эмиссий также необходим готовый ЦБ в вашей столице. Авторизация не создает золота и может быть отозвана."
 bfl_authorize_note_bank_effect_text: "$bfl_authorize_note_bank$"
 bfl_authorize_note_bank_effect_text_past: "$bfl_authorize_note_bank$"
 bfl_back_to_bank: "Банковские счета"
 bfl_balance_paid_tip: "Накопительный платеж получен при последнем ежемесячном расчете. Эти переводы уже находятся в вашей казне, и их нельзя снова добавлять к общей сумме местного дохода."
 bfl_bank_capital_subscriptions_desc: "Банковскому дому не обязательно полностью полагаться на состояние семьи его основателей. Подписки привлекают в предприятие дополнительных партнеров, объединяя их капитал и фиксируя притязания каждого инвестора на его будущее процветание."
 bfl_bank_dividends: "Банковские дивиденды"
 bfl_bank_equity_subscribe: "Казначейство банка: подписаться 100 золото"
 bfl_bank_equity_subscribe_tip: "Инвестировать 100 фактической защищенной денежной наличности и профицита капитала управляемого банка при материальной чистой стоимости выбранного эмитента. В портфель банка поступают новые платные паи. Максимум 25% банка или 60% компании с зарубежным разрешением. Это первичное финансирование, а не покупка у существующего акционера."
 bfl_bank_identity_tip: "[Country.GetName] имеет собственную казну, активы и обязательства. Эти суммы принадлежат банку отдельно от вашей государственной казны. Merchant Finance специализируется на торговом и корпоративном кредитовании; Компания Overseas Investment специализируется на венчурных предприятиях и компаниях. Банк выбирает одну постоянную специализацию."
 bfl_bank_share_dealing: "Операции с акциями банка"
 bfl_bank_share_dealing_desc: "Состояние партнера не обязательно навсегда останется привязанным к одному и тому же банковскому дому. Признанная передача права собственности позволяет инвесторам продавать свои доли другим, в то время как учреждение продолжает свою деятельность, не выводя свой капитал."
 bfl_bank_share_transfer: "Банковский перевод акций"
 bfl_bank_share_transfer_tip: "#T Банковский перевод акций#!\nПередача зарегистрированных единиц банковской собственности между финансируемыми сторонами. Требуется исследование банковских операций с акциями и эпоха Реформации или более поздняя. Эта строка сообщает о разрешении; он сам не осуществляет вторичную торговлю акциями."
 bfl_bank_status_tip: "Операционная деятельность: новый бизнес разрешается при соблюдении других требований. Денежные средства под давлением: имеющиеся денежные средства исчерпаны. Вывод средств в очереди: неоплаченные запросы на вывод средств приостанавливают новый бизнес. Неплатежеспособность: обязательства превышают активы. В разрешении или закрыто: обычный бизнес ограничен. Существующие претензии остаются зарегистрированными."
 bfl_bank_subscription: "Банковская подписка"
 bfl_banking_finance_companies__expanded_details_desc: "Зарезервировано предпочтение представления для подробного просмотра выписки."
 bfl_banking_finance_companies__expanded_details_name: "Расширенные сведения о деятельности"
 bfl_banking_finance_companies__finance_notifications_desc: "Предпочтение представления уведомлений; обязательства никогда не отменяются путем приглушения."
 bfl_banking_finance_companies__finance_notifications_name: "Финансовые уведомления"
 bfl_banking_finance_companies__interface_name: "Интерфейс"
 bfl_banking_finance_companies__presentation__interface_name: "Интерфейс"
 bfl_banking_finance_companies__presentation_name: "Презентация"
 bfl_banking_finance_companies__reduced_motion_desc: "Используйте статические квитанции и предупреждения о транзакциях. Отключите, чтобы разрешить краткое отображение отдельных транзакций после совершения платежей; никаких циклических финансовых вспышек."
 bfl_banking_finance_companies__reduced_motion_name: "Уменьшение движения"
 bfl_banking_finance_companies_desc: "Только настройки презентации. Политика учреждения управляется в сфере экономики."
 bfl_banking_finance_companies_name: "Банковские, финансовые и торговые компании"
 bfl_bond_accept_tip: "Примите указанное снижение основной суммы/купона и снижение годовой ставки после перепроверки текущего держателя, требования и полномочий. Никакого нового обеспечения или оплаты наличными."
