 bfl_offer_commenda: "Профинансировать грузовую операцию"
 bfl_offer_commenda_act: "Профинансировать грузовую операцию"
 bfl_offer_commenda_desc: "Предложить рисковый капитал на предложенных банком условиях. Акцепт покупает названный груз по его натуральной стоимости; неиспользованная авторизация остается в банке. Капитал и прибыль никогда не гарантируются."
 bfl_offer_commenda_effect_text: "Профинансировать грузовую операцию"
 bfl_offer_commenda_effect_text_past: "Профинансировать грузовую операцию"
 bfl_offer_commenda_tip: "Открытие или позднее, исследования зарубежных инвестиций и Commenda. Выберите оператора, рынок происхождения, пункт назначения и товар для десятиединичного груза. Приемка перепроверяет ваш авторитет, свободные денежные средства, капитал и возможности. Одно активное соглашение на каждого оператора; до восьми на банк."
 bfl_offer_credit: "Предложите накопительный кредит"
 bfl_offer_credit_act: "$bfl_offer_credit$"
 bfl_offer_credit_desc: "Заемщик получает четкое предложение. Никакие денежные средства или условия не меняются до момента принятия; исполнение перепроверяет живой авторитет, профиль, исследования и фонды."
 bfl_offer_credit_effect_text: "$bfl_offer_credit$"
 bfl_offer_credit_effect_text_past: "$bfl_offer_credit$"
 bfl_offer_credit_tip: "Выберите суверенную или подходящую местную компанию. Оба профиля кредитуют суверенные государства; кредит компании требует торгового финансирования, реформирования и корпоративного кредита. Облегчение долгового бремени также требует реструктуризации долга эпохи Возрождения."
 bfl_offer_goods_transfer: "Предложить передачу складских расписок"
 bfl_offer_goods_transfer_act: "$bfl_offer_goods_transfer$"
 bfl_offer_goods_transfer_desc: "Предложите квитанцию, которая была выбрана последней в разделе «Предложения на товары» и «Заявки на хранение». Получатель проверяет цену и количество, прежде чем платить текущему владельцу."
 bfl_offer_goods_transfer_effect_text: "$bfl_offer_goods_transfer$"
 bfl_offer_goods_transfer_effect_text_past: "$bfl_offer_goods_transfer$"
 bfl_offer_held_sovereign_bond: "Предложить удерживаемые суверенные облигации"
 bfl_offer_held_sovereign_bond_act: "$bfl_offer_held_sovereign_bond$"
 bfl_offer_held_sovereign_bond_desc: "Выберите эмитента и разместите одну из своих государственных облигаций на 98% номинальной стоимости. Требуется готовое здание фондовой биржи."
 bfl_offer_held_sovereign_bond_effect_text: "$bfl_offer_held_sovereign_bond$"
 bfl_offer_held_sovereign_bond_effect_text_past: "$bfl_offer_held_sovereign_bond$"
 bfl_offer_held_sovereign_bond_tip: "Перечислите существующую облигацию, которой вы владеете в течение трех месяцев. Вы сохраняете претензию до тех пор, пока финансируемый покупатель не примет ее; купоны и выкуп затем следуют за этим покупателем."
 bfl_offer_restructuring: "Предложите списать долг"
 bfl_offer_restructuring_act: "$bfl_offer_restructuring$"
 bfl_offer_restructuring_desc: "Заемщик получает четкое предложение. Никакие денежные средства или условия не меняются до момента принятия; исполнение перепроверяет живой авторитет, профиль, исследования и фонды."
 bfl_offer_restructuring_effect_text: "$bfl_offer_restructuring$"
 bfl_offer_restructuring_effect_text_past: "$bfl_offer_restructuring$"
 bfl_offer_restructuring_tip: "Выберите суверенную или подходящую местную компанию. Оба профиля кредитуют суверенные государства; кредит компании требует торгового финансирования, реформирования и корпоративного кредита. Облегчение долгового бремени также требует реструктуризации долга эпохи Возрождения."
 bfl_operating_costs: "Ежемесячные операционные расходы"
 bfl_operating_costs_tip: "Фиксированная ежемесячная шкала расходов с активными депозитными счетами, контрактами, филиалами и классами активов. Реформа государственного дипломированного банка снижает затраты на 5%, Банковское дело 10%, Расширенная очистка 15%и упрощенное администрирование 10%. Неоплаченные затраты остаются обязательствами и блокируют дивиденды."
 bfl_overview: "Счета и специализация"
 bfl_overview_hint: "Активы: внешнее кольцо = тип; внутреннее кольцо = страны. Наведите курсор на цветные разбивки."
 bfl_payout_0: "Сохраняйте прибыль"
 bfl_payout_0_short: "сохранить"
 bfl_payout_0_tip: "Сохранять всю соответствующую реализованную прибыль. В соответствии с этой политикой новые дивиденды не выплачиваются; нераспределенная прибыль поддерживает ликвидность и капитал."
 bfl_payout_25: "25% выплата"
 bfl_payout_25_short: "25%"
 bfl_payout_25_tip: "Выделить до 25% приемлемой реализованной прибыли к дивидендам после убытков. Доступные денежные средства, запас капитала и зарегистрированная собственность по-прежнему ограничивают выплаты."
 bfl_payout_50: "50% выплата"
 bfl_payout_50_short: "50%"
 bfl_payout_50_tip: "Выделить до 50% приемлемой реализованной прибыли к дивидендам после убытков. Доступные денежные средства, запас капитала и зарегистрированная собственность по-прежнему ограничивают выплаты."
 bfl_peasants_estate_workout_mandate: "Мандат на тренировки по недвижимости"
 bfl_peasants_estate_workout_mandate_desc: "Это имущество прямо уполномочивает свое правительство пересматривать добровольные меры по урегулированию банковских депозитов от его имени. Каждое предложение по-прежнему требует отдельного принятия. Отзыв этой привилегии делает недействительными ожидающие рассмотрения условия наследства. Выплаты по восстановлению продолжают поступать в кошелек недвижимости."
 bfl_place_deposit_1: "Откройте 100 депозит до востребования в золоте"
 bfl_place_deposit_1_act: "$bfl_place_deposit_1$"
 bfl_place_deposit_1_desc: "Независимые банки требуют заключения как минимум +50 к вам, чтобы открыть счет. Ваш зарегистрированный банк предлагает дополнительные 1% годовые проценты. Проценты до востребования выплачиваются ежемесячно при финансировании; невыплаченные проценты остаются задолженностью. Разрушение отношений никогда не мешает отзыву собственных назревших претензий."
 bfl_place_deposit_1_effect_text: "$bfl_place_deposit_1$"
 bfl_place_deposit_1_effect_text_past: "$bfl_place_deposit_1$"
 bfl_place_deposit_2: "Откройте 100 золотой срочный депозит"
 bfl_place_deposit_2_act: "$bfl_place_deposit_2$"
 bfl_place_deposit_2_desc: "Независимые банки требуют заключения как минимум +50 к вам, чтобы открыть счет. Ваш зарегистрированный банк предлагает дополнительные 1% годовые проценты. Проценты до востребования выплачиваются ежемесячно при финансировании; невыплаченные проценты остаются задолженностью. Разрушение отношений никогда не мешает отзыву собственных назревших претензий."
 bfl_place_deposit_2_effect_text: "$bfl_place_deposit_2$"
 bfl_place_deposit_2_effect_text_past: "$bfl_place_deposit_2$"
 bfl_portfolio_bank_heading: "Инвестиции принадлежат [Country.GetName]"
 bfl_portfolio_history_axis: "От самого раннего до последнего · до 12 ежемесячные наблюдения"
 bfl_portfolio_history_empty: "История начинается при закрытии банка следующего месяца."
 bfl_portfolio_history_flows: "Стоимость включает покупки и продажи; это не индекс доходности инвестиций."
 bfl_portfolio_history_title: "Стоимость портфеля с течением времени"
 bfl_portfolio_owner_note: "Казначейские и банковские холдинги имеют отдельных владельцев. Наведите курсор на организацию, чтобы узнать ее финансы."
 bfl_portfolio_total_heading: "Текущая стоимость акционерного капитала"
 bfl_portfolio_treasury_heading: "Суверенные казначейские активы"
 bfl_prepare_bond_panel: "Суверенные облигации"
 bfl_prepare_bond_panel_tip: "Просмотр государственного финансирования и существующих требований в Кредите."
 bfl_probe_P11: "Ворота разработки: P11 должен быть измерен в игре, прежде чем этот адаптер сможет работать."
 bfl_profile_0: "Выберите специализацию"
 bfl_profile_1: "Торговое финансирование"
 bfl_profile_2: "Зарубежные инвестиции"
 bfl_project_security: "Безопасность проекта"
 bfl_project_security_desc: "Финансистам трудно контролировать удаленные предприятия. Претензии на их активы и доходы, предъявляемые до авансирования капитала, дают инвесторам возможность защитить свои интересы, когда предприятие пойдет не по плану."
 bfl_project_security_tip: "#T Безопасность проекта#!\nЗащитите предприятие от идентифицируемых претензий по проекту. Требуются исследования безопасности проекта, зарубежные инвестиции и эпоха абсолютизма или позже. В этой сборке недоступно собственное исполнение обеспечения проекта."
 bfl_protected_label: "Защищенные деньги"
 bfl_public_backstop: "Общественная поддержка"
 bfl_public_backstop_tip: "#T Государственная гарантированная поддержка#!\nРеволюции, государственная финансовая поддержка и действующий устав с завершенным Центральным банком в суверенной столице. Явно принято 75- при выдаче золота используются собственные свободные денежные средства государственного банка, 25% стрижка Билла и хотя бы 9% годовые проценты. Никакой бесплатной рекапитализации."
 bfl_public_financial_backstops: "Государственная финансовая поддержка"
 bfl_public_financial_backstops_desc: "Когда крах крупного банковского дома угрожает государственному кредиту и торговле, правительство может вмешаться. Такая поддержка связывает ресурсы казначейства с восстановлением банка и делает условия помощи вопросом государственной политики."
 bfl_purchase_funded_bill: "Приобретение накопительного платежного счета"
 bfl_purchase_funded_bill_act: "$bfl_purchase_funded_bill$"
 bfl_purchase_funded_bill_desc: "Финансируется из вашей собственной казны после проверки профиля, возраста, исследований и регистрации. Принципал не является прибылью банка. Подписка на банковский капитал покупает паи по текущей стоимости чистых активов."
 bfl_purchase_funded_bill_effect_text: "$bfl_purchase_funded_bill$"
 bfl_purchase_funded_bill_effect_text_past: "$bfl_purchase_funded_bill$"
 bfl_purchase_native_loan: "Банк: кредит на покупку недвижимости"
 bfl_purchase_native_loan_act: "$bfl_purchase_native_loan$"
 bfl_purchase_native_loan_desc: "Ваш банк является покупателем. Применяются исходная цена и право на участие, а также дополнительные бесплатные денежные средства и чеки капитала. Банковские поместья получают покупную цену, и тот же кредит меняет владельца. Облигации и уже имеющиеся в стране кредиты исключены."
 bfl_purchase_native_loan_effect_text: "$bfl_purchase_native_loan$"
 bfl_purchase_native_loan_effect_text_past: "$bfl_purchase_native_loan$"
 bfl_purchase_native_loan_tip: "#T Взять кредит для банка#!\nВыберите другого суверена с приемлемым долгом по наследству. Ваш зарегистрированный банк платит местную покупную цену банковским владениям этой страны и становится кредитором того же кредита. Основная сумма долга и проценты к получению принадлежат банку; государство получает доход от кредитования через дивиденды по акциям. Банки также самостоятельно приобретают один соответствующий критериям кредит каждый месяц, когда позволяют резервы и капитал. Облигации и уже имеющиеся в стране кредиты исключены."
 bfl_rate_0: "Никаких процентов за новые счета."
 bfl_rate_0_short: "0%"
 bfl_rate_0_tip: "Предложение 0% годовые проценты по новым депозитам до востребования. Существующие счета до востребования и отдельные ставки по срочным счетам остаются по принятым ставкам."
 bfl_rate_1: "1% годовой спрос на новые аккаунты"
 bfl_rate_1_short: "1%"
 bfl_rate_1_tip: "Предложение 1% годовые проценты по новым депозитам до востребования. Проценты начисляются ежемесячно с учетом переноса процентов. Существующие счета спроса сохраняют свои принятые ставки."
 bfl_rate_2: "2% годовой спрос на новые аккаунты"
 bfl_rate_2_short: "2%"
 bfl_rate_2_tip: "Предложение 2% годовые проценты по новым депозитам до востребования. Проценты начисляются ежемесячно с учетом переноса процентов. Существующие счета спроса сохраняют свои принятые ставки."
 bfl_recapitalize_command: "Рекапитализировать с 100 золото"
 bfl_recapitalize_command_tip: "Оплата 100 золото из казны вашей страны в качестве банковского капитала. Требуется 100 золото и ставка дилерской перепродажи не выше материальной чистой стоимости активов; капитал приостанавливается во время большей рыночной премии, чтобы предотвратить немедленную прибыль от перепродажи. Финансируемое спасение при нулевой или отрицательной NAV остается доступным."
 bfl_redeem_bond: "выкупить"
 bfl_redeem_bond_01_tip: "Выплатите номинальную стоимость плюс все начисленные купоны текущему держателю. Дефицит оставляет всю облигацию непогашенной. Погашение закрывает заявку один раз; нативные облигации не затронуты."
