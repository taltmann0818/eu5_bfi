 bfl_loan_button: "Взять на себя кредит"
 bfl_log_charter: "Учредил и капитализировал Государственный банк для"
 bfl_manage_shareholdings: "Решения акционеров"
 bfl_manage_shareholdings_desc: "Выберите финансовый холдинг. Более половины отданных голосов могут установить дивиденды независимого банка или политику выплат и реинвестирования компании. Действующий контролер может использовать голоса управляемого им банка. Четкая денежно-кредитная политика и политическое господство остаются отдельными."
 bfl_margining: "Маржа"
 bfl_margining_and_risk_management: "Маржа и управление рисками"
 bfl_margining_and_risk_management_desc: "Торговцы, обещающие будущие поставки, сталкиваются с изменением цен задолго до истечения срока действия их контрактов. Требование дополнительной безопасности по мере роста рисков дает банкирам возможность сдерживать потери до того, как неблагоприятный рынок станет дефолтом."
 bfl_margining_tip: "#T Маржа и управление рисками#!\nТребуйте залога и вариационной маржи на случай изменения подверженности сырьевым товарам. Требуются исследования в области маржинальности и управления рисками, торгового финансирования и эпохи революций. В этой сборке недоступно исполнение маржи, обеспеченной товарами."
 bfl_market_sort_price: "Сортировать по цене за акцию"
 bfl_monetary: "Денежно-кредитная политика и ликвидность"
 bfl_monetary_explanation: "Обменяйте звонкую монету на зарезервированные банкноты с суверенной властью и завершенным Центральным банком. Учет векселей третьих банков после механизмов обеспечения и ликвидности; Revolutions добавляет финансируемую сетку участников и ограниченную государственную гарантированную поддержку. Принятые тарифы остаются фиксированными."
 bfl_monetary_tip: "#T Денежные инструменты#!\nРазрешения на поздние сроки обращения суверенных облигаций, гарантированная ликвидность, клиринг и общественная поддержка. Для каждого требуется свое разрешение, поддержка и условия эксплуатации."
 bfl_money_accept: "Переключить принятие и скидки"
 bfl_money_accept_tip: "Банкноты обменивают монету на полностью зарезервированное требование. Принятие является добровольным. Скидки заранее 75 золото против 100-золотой вексель третьего банка. Клиринговые расчеты производятся по счетам с наступившим сроком погашения только тогда, когда каждый участник может оплатить свой чистый дебет. Существующие претензии сохраняются после утраты авторитета и зданий."
 bfl_money_acceptance_action: "Изменить добровольное принятие"
 bfl_money_authorize: "Авторизовать заметки"
 bfl_money_authorize_tip: "Суверенный контролер уполномочивает свой зарегистрированный банк. В текущем капитале необходим полноценный Центральный банк, находящийся в собственности суверенного государства. Для нового выпуска также требуется наличие филиала банка-эмитента и исследование примечаний."
 bfl_money_clear: "Оплатить счета участников"
 bfl_money_clear_open: "Очистка допуска"
 bfl_money_clear_open_tip: "Открытый или закрытый прием в вашу клиринговую группу. Требуется исследование «Революции», «Клиринговая палата» и «Продвинутая клиринговая палата», а также завершенная клиринговая палата, принадлежащая банку или его действующему государству. Максимум четыре участника."
 bfl_money_clear_tip: "Урегулируйте соответствующие счета участников с наступившим сроком погашения один раз в этом месяце. Каждый член должен покрывать свой чистый дебет, защищая при этом другие резервы. Один короткий член сохраняет всю партию. Заложенные претензии и претензии нечленов исключаются."
 bfl_money_empty: "Банкнот в обращении нет. Денежные исследования, авторитет и завершенные здания открывают новые услуги."
 bfl_money_empty_tip: "Банкноты обменивают монету на полностью зарезервированное требование. Принятие является добровольным. Скидки заранее 75 золото против 100-золотой вексель третьего банка. Клиринговые расчеты производятся по счетам с наступившим сроком погашения только тогда, когда каждый участник может оплатить свой чистый дебет. Существующие претензии сохраняются после утраты авторитета и зданий."
