 bfl_equity_subscribe_4_tip: "Первичная подписка NAV: платит эмитенту и размывает существующих держателей. При покупке недвижимости используется реальный кошелек недвижимости, сохраняя 25 золото. Банковский инвестор использует только свои собственные защищенные денежные средства и излишек капитала; капитал компании требует исследования зарубежных инвестиций."
 bfl_equity_vote_payout_0: "Голосование большинства: 0% выплата дивидендов"
 bfl_equity_vote_payout_0_tip: "Требуется более половины выданных финансовых голосов. Компания сохранила только нераспределенную прибыль и политику выплат независимого банка. Уставная денежная политика и политика выплат остаются за действующим земельным контролером. Никакого переноса политических тем."
 bfl_equity_vote_payout_25: "Голосование большинства: 25% выплата дивидендов"
 bfl_equity_vote_payout_25_tip: "Требуется более половины выданных финансовых голосов. Компания сохранила только нераспределенную прибыль и политику выплат независимого банка. Уставная денежная политика и политика выплат остаются за действующим земельным контролером. Никакого переноса политических тем."
 bfl_equity_vote_payout_50: "Голосование большинства: 50% выплата дивидендов"
 bfl_equity_vote_payout_50_tip: "Требуется более половины выданных финансовых голосов. Компания сохранила только нераспределенную прибыль и политику выплат независимого банка. Уставная денежная политика и политика выплат остаются за действующим земельным контролером. Никакого переноса политических тем."
 bfl_equity_vote_reserve_100: "Большинство голосов: резерв 100, торговый бюджет 50"
 bfl_equity_vote_reserve_100_tip: "Большинство финансовых голосов может выбрать резерв реинвестирования компании и торговый бюджет. Политические мандаты, местное господство, денежные средства и существующие требования кредиторов остаются отдельными."
 bfl_equity_vote_reserve_200: "Большинство голосов: резерв 200, торговый бюджет 25"
 bfl_equity_vote_reserve_200_tip: "Большинство финансовых голосов может выбрать резерв реинвестирования компании и торговый бюджет. Политические мандаты, местное господство, денежные средства и существующие требования кредиторов остаются отдельными."
 bfl_establish_chartered_bank.a: "Выберите существующий Государственный банк"
 bfl_establish_chartered_bank.desc: "Преобразуйте один существующий государственный банк и приобретите банковские традиции после завершения устава. Инвестиции текущего возраста 500 / 750 / 1,000 / 1,500 / 2,000 / 3,000 золото передается в его казну в качестве государственного капитала. Вы должны владеть своим рынком капитала. Выберите банк до того, как произойдет какой-либо платеж или исследование."
 bfl_establish_chartered_bank.title: "Создать государственный дипломированный банк"
 bfl_estate_bond_back: "Вернуться в администрацию поместья"
 bfl_estate_bond_desc: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_managed_estate').GetCountry.GetName] должен [ROOT.GetCountry.MakeScope.GetVariable('bfl_estate_bond_face').GetValue|2] главный и [ROOT.GetCountry.MakeScope.GetVariable('bfl_estate_bond_due').GetValue|2] неоплаченные купоны на [ROOT.GetCountry.MakeScope.GetVariable('bfl_estate_bond_holder').GetCountry.GetName]. Возврат денежных средств относится к необеспеченному классу с депозитами. Добровольное сокращение требует нового предложения и явного согласия владельца; платежи или смена доверенного лица аннулируют ожидающие условия."
 bfl_estate_bond_next: "Выбрать следующую облигацию"
 bfl_estate_bond_title: "Кредитор по облигациям недвижимости"
 bfl_estate_close_tip: "Закройте это полностью обжитое имущество навсегда после перепроверки всех обязательств, безденежных прав и собственников."
 bfl_estate_default_tip: "Завершить работу этого истощенного разрушенного учреждения: один раз зафиксировать неоплаченные убытки кредиторов и погасить младшие расходы. Ни один акционер не получает выручку."
 bfl_estate_deposit_1: "Бюргеры: спрос 100"
 bfl_estate_deposit_1_act: "$bfl_estate_deposit_1$"
 bfl_estate_deposit_1_desc: "Поместите золото от недвижимого имущества на объединенный счет до востребования в выбранном банке. Премия по суверенному депозиту не применяется."
 bfl_estate_deposit_1_effect_text: "$bfl_estate_deposit_1$"
 bfl_estate_deposit_1_effect_text_past: "$bfl_estate_deposit_1$"
 bfl_estate_deposit_1_tip: "Использует этот пул поместья, сохраняя как минимум 25 золото недвижимости. Основная сумма и проценты возвращаются в одно и то же имущество, а не в государственную казну. Совокупность повторяющихся совпадающих счетов. Участие домохозяйств представлено этими пулами недвижимости."
