 bfl_venture_accept: "Принять партнерство"
 bfl_venture_accept_tip: "Перепроверьте авторитет действующего инвестора, неизменные условия предложения, возраст, исследования, свободные денежные средства, капитал, мощность и вклад оператора. При финансировании оплачивается только фактическая собственная стоимость выбранного мероприятия. Он не предоставляет никаких акций компании или политического контроля."
 bfl_venture_decline: "Снижение"
 bfl_venture_duration_12: "Продолжительность · 12 месяцы"
 bfl_venture_duration_120: "Продолжительность · 120 месяцы"
 bfl_venture_duration_24: "Продолжительность · 24 месяцы"
 bfl_venture_duration_6: "Продолжительность · 6 месяцы"
 bfl_venture_duration_60: "Продолжительность · 60 месяцы"
 bfl_venture_duration_tip: "Цикл 6, 12, 24, 60 или 120 месяцев. Длительные сроки позволяют проводить исследования на местах. Груз продается через два месяца, если собственный доступ остается действительным; заблокированный груз остается под стражей. Затраты на экспедицию без учета связанных доходов от продажи списываются при наступлении срока погашения."
 bfl_venture_empty: "Никаких активных предприятий. Прежде чем предлагать условия, выберите грузовую операцию или местную экспедицию."
 bfl_venture_help: "Нажмите на термин, чтобы просмотреть его. Каждый оператор принимает отдельно. Существующие соглашения продолжают действовать после изменения политики или исследований."
 bfl_venture_hint: "Наведите указатель мыши на информацию о деятельности, расходах, грузе и возвратах."
 bfl_venture_locked: "Новые предприятия заблокированы · наведите курсор на требования"
 bfl_venture_note: "Капитал возмещается до получения прибыли. Убытки следуют за вкладами. Только приобретенный груз названной операции может покрыть ее доходы. Несвязанная торговля никогда не оплачивается по этому соглашению. Открытие само по себе ничего не платит. Закрытые строки остаются до тех пор, пока не будут заменены новым принятым соглашением."
 bfl_venture_offer_desc: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_bank').GetCountry.GetName] предложения [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_ticket').GetValue|0] золото для [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_duration').GetValue|0] месяцев. Предустановка [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_preset').GetValue|0]: 0 = инвестор финансирует весь капитал, получает 75% излишков; 1 = инвестор вносит две трети, оператор — одну треть, излишки делятся поровну. Капитал восстанавливается первым; убытки следуют за взносами. Только фактическая выручка от продажи названной операции может приносить прибыль. Успех разведки дает возможность, а не золото. Срок действия данного предложения истекает через три месяца."
 bfl_venture_offer_desc_0: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_bank').GetCountry.GetName] разрешает до [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_ticket').GetValue|0] золото банковского финансирования для [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_duration').GetValue|0] месяцев. Купить 10 [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_good').Goods.GetNameWithNoTooltip] в [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_from').GetMarket.GetName], носить их два месяца, потом продать в [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_to').GetMarket.GetName]. Банк финансирует все расходы и получает 75% излишков.\n\nУчитываются только фактические собственные затраты. Неиспользованные средства остаются в банке. Капитал возмещается до получения профицита; убытки следуют за взносами. Настоящее соглашение регулируется только измеренной выручкой от продажи этого груза. Несвязанный доход и открытие ничего не платят. Срок действия предложения истекает через три месяца."
 bfl_venture_offer_desc_1: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_bank').GetCountry.GetName] разрешает до [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_ticket').GetValue|0] золото банковского финансирования для [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_duration').GetValue|0] месяцев. Купить 10 [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_good').Goods.GetNameWithNoTooltip] в [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_from').GetMarket.GetName], носить их два месяца, потом продать в [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_to').GetMarket.GetName]. Банк финансирует две трети затрат; вы платите одну треть. Излишки делятся поровну.\n\nУчитываются только фактические собственные затраты. Неиспользованные средства остаются в банке. Капитал возмещается до получения профицита; убытки следуют за взносами. Настоящее соглашение регулируется только измеренной выручкой от продажи этого груза. Несвязанный доход и открытие ничего не платят. Срок действия предложения истекает через три месяца."
 bfl_venture_offer_desc_2: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_bank').GetCountry.GetName] разрешает до [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_ticket').GetValue|0] золото банковского финансирования для [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_duration').GetValue|0] месяцев. Подготовьте местное исследование [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_area').GetArea.GetName] из [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_port').GetLocation.GetName] с [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_explorer').GetCharacter.GetName]. Банк финансирует все согласованные затраты на золото и получает 75% контрактного излишка. Подготовка не подлежит возврату, включая отмену. Вы обеспечиваете экипаж, содержание местных жителей и дополнительные расходы на экспедицию, не входящие в настоящее соглашение о финансировании. Оставшееся банковское разрешение может позволить оплатить один груз из десяти единиц с рынка, расположенного в центре обнаруженной области или граничащего с ней, при условии местного доступа. Только измеренные продажи этого груза за вычетом зарегистрированных затрат на подготовку и груз могут покрыть договорную прибыль. Открытие и несвязанная торговля ничего не приносят. Срок действия предложения истекает через три месяца. "
 bfl_venture_offer_desc_3: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_bank').GetCountry.GetName] разрешает до [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_ticket').GetValue|0] золото банковского финансирования для [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_duration').GetValue|0] месяцев. Подготовьте местное исследование [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_area').GetArea.GetName] из [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_port').GetLocation.GetName] с [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_explorer').GetCharacter.GetName]. Банк финансирует две трети согласованных затрат на золото; вы платите одну треть. Контрактный излишек делится поровну. Подготовка не подлежит возврату, включая отмену. Вы обеспечиваете экипаж, содержание местных жителей и дополнительные расходы на экспедицию, не входящие в настоящее соглашение о финансировании. Оставшееся банковское разрешение может позволить оплатить один груз из десяти единиц с рынка, расположенного в центре обнаруженной области или граничащего с ней, при условии местного доступа. Только измеренные продажи этого груза за вычетом зарегистрированных затрат на подготовку и груз могут покрыть договорную прибыль. Открытие и несвязанная торговля ничего не приносят. Срок действия предложения истекает через три месяца. "
 bfl_venture_offer_title: "Коммендное партнерство"
 bfl_venture_outcome_1: "Выполняется связанная местная экспедиция"
 bfl_venture_outcome_10: "Затраты или деятельность изменены · разрешение снято"
 bfl_venture_outcome_2: "Обнаружение зафиксировано · коммерческие квитанции все еще требуются"
 bfl_venture_outcome_3: "Экспедиция завершилась без подтвержденного открытия"
 bfl_venture_outcome_4: "Груз в пути · собственная покупка оформлена"
 bfl_venture_outcome_5: "Доставка заблокирована · приобретенный груз сохранен"
 bfl_venture_outcome_6: "Груз продан · оплачена только измеренная выручка"
 bfl_venture_outcome_7: "Унаследованный сток · нет профицита, связанного с деятельностью"
 bfl_venture_outcome_8: "Нативный препарат или результат, ожидающий подтверждения"
 bfl_venture_outcome_9: "Оператор больше не существует · хранение нарушено"
 bfl_venture_policy: "Условия"
 bfl_venture_preset_0: "Односторонний · 75% профицит банка"
 bfl_venture_preset_1: "Двусторонний · равный излишек"
 bfl_venture_preset_tip: "Односторонний: банк финансирует весь капитал и получает 75% излишков. Двусторонний: две трети средств банка, одна треть оператора, профицит делится поровну. Убытки следуют за капитальными вложениями."
 bfl_venture_settings_tip: "Расширьте предлагаемые условия. Изменения касаются только будущих предложений; принятые проекты сохраняют свое первоначальное соглашение."
 bfl_venture_state_1: "Активный · капитал под угрозой"
 bfl_venture_state_2: "Закрыто · капитал восстановлен"
 bfl_venture_state_3: "Закрыто · признан убыток"
 bfl_venture_state_4: "Не профинансировано · исполнение недоступно"
 bfl_venture_subtitle: "Названные виды деятельности · измеренные затраты и продажи"
 bfl_venture_ticket_100: "Лимит финансирования · 100 золото"
 bfl_venture_ticket_200: "Лимит финансирования · 200 золото"
 bfl_venture_ticket_400: "Лимит финансирования · 400 золото"
 bfl_venture_ticket_tip: "Цикл максимальной авторизации банка 100, 200 или 400 золото. Указывается только фактическая стоимость деятельности. Неиспользованное финансирование груза высвобождается немедленно; неиспользованное финансирование экспедиции остается зарезервированным для подходящего груза из открытого района до наступления срока погашения. Двусторонние условия требуют мощности на половину банковской авторизации от оператора."
 bfl_venture_title: "Комменда венчурс"
 bfl_ventures: "Предприятия и компании · Зарубежные инвестиции"
 bfl_ventures_explanation: "Commenda начинается в Discovery; местные компании и акционерный капитал компаний требуют Реформации. Политический контроль и финансовая собственность остаются отдельными. Капитал проекта не является дивидендом."
 bfl_ventures_tip: "#T Предприятия и компании#!\nРазрешения на финансируемые предприятия, инвестиции в компании, обеспечение безопасности проектов и банковские переводы акций. Они подвергают капитал инвестиционному риску и требуют соответствующих исследований и специализации."
 bfl_warehouse_receipt: "Складская квитанция"
 bfl_warehouse_receipt_tip: "#T Складская квитанция#!\nПодать претензию в отношении идентифицируемых хранящихся товаров. Требуется исследование складских квитанций, торговое финансирование и эпоха абсолютизма или позже. В данной сборке недоступно проверенное хранение и реализация товаров."
 bfl_warehouse_receipts: "Складские квитанции"
 bfl_warehouse_receipts_desc: "Товары, хранящиеся на складе с хорошей репутацией, могут поддерживать торговлю, не перемещаясь при каждой продаже. Квитанция устанавливает право требования к хранимому товару, позволяя его владельцу получить финансирование, пока товар остается на хранении."
 bfl_withdraw: "Вывод государственных депозитов с наступившим сроком погашения"
 bfl_withdraw_tip: "#T Вывод государственных депозитов с наступившим сроком погашения#!\nЗапросите погашение счетов до востребования вашего штата и счетов с наступившими сроками погашения. Банк выплачивает основную сумму долга и начисленные проценты из имеющихся денежных средств. Невыплаченные суммы остаются в очереди на снятие средств и приостанавливают новые операции. Зарубежные счета и срочные депозиты без наступления срока погашения не могут быть сняты с помощью этого действия."
 bfl_workout_decline: "Сохраните полную претензию"
 bfl_workout_desc: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_workout_bank').GetCountry.GetName] предлагает условия для вашего депозита [ROOT.GetCountry.MakeScope.GetVariable('bfl_workout_claim').GetValue|2] золото. Вы можете отказаться 20% оставшуюся часть требования конвертируйте всю сумму требования во вновь выпущенные акции по реальной чистой стоимости активов до конвертации или сохраните свое требование. Конверсия требует положительной чистой стоимости активов и акционерного капитала и недоступна для банковских кредиторов. Пул кредиторов [ROOT.GetCountry.MakeScope.GetVariable('bfl_workout_pool').GetValue|0]: 0 казначейство, 1 бюргеры, 2 дворяне, 3 духовенство, 4 крестьяне. Условия наследства требуют наличия действующего мандата на тренировки. Срок действия котировки истекает в этом месяце; восстановление или смена руководства делает его недействительным."
 bfl_workout_equity: "Конвертируйте требование в акции (требуется положительная NAV)"
 bfl_workout_haircut: "Примите 20% сокращение"
 bfl_workout_title: "Предложение по урегулированию ситуации с кредиторами"
 bfl_workout_trade_access: "Торговая льгота на тренировки"
 bfl_workout_trade_access_desc: "Торговая защита снимается посредством отдельно принятой программы погашения облигаций на срок до двух лет. Существующие обычные соглашения о доступе к торговле не зависят от этой уступки."
