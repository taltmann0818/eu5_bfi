 bfl_chart_equity_07: "Капитал: [Country.MakeScope.GetVariable('bfl_history_equity_07').GetValue|2]@gold! · отчетный месяц [Country.MakeScope.GetVariable('bfl_history_period_07').GetValue|0]"
