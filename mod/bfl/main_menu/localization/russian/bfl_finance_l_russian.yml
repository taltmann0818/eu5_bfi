 AM_bfl_chartered_bank: "Чартерный банк"
 LEAD_bfl_chartered_bank: "Дипломированный банковский контролер"
 MODIFIER_TYPE_DESC_bfl_enable_advanced_clearing: "Разблокирует чистый расчет проверенных взаимных обязательств между участвующими учреждениями. Клиринг должен сохранять права каждого держателя и погашать накопительный чистый баланс без создания денег. Собственные межбанковские расчеты остаются недоступными."
 MODIFIER_TYPE_DESC_bfl_enable_bank_capital_subscriptions: "Разрешает первичную подписку на 100 золото в банк. Новые единицы собственности оцениваются по текущей стоимости чистых активов. Доходы от подписки увеличивают оплаченный капитал, а не реализованную прибыль, и покупают пропорциональные права на последующие распределения."
 MODIFIER_TYPE_DESC_bfl_enable_bank_share_dealing: "Позволяет службе банковских переводов акций перемещать существующие зарегистрированные единицы между идентифицированными владельцами. Передача меняет владельца без выпуска новых паев или создания банковской прибыли. Реестр должен иметь емкость и сохранять права каждого владельца."
 MODIFIER_TYPE_DESC_bfl_enable_collateralization: "Разблокирует записанные залоговые обязательства и проверки их приемлемости. Обремененные активы не могут служить обеспечением второго требования, а возмещение должно сохранять первоначальные долговые отношения. Исполнение собственного обеспечения остается недоступным."
 MODIFIER_TYPE_DESC_bfl_enable_commenda: "Открывает мандат на сотрудничество с зарубежными инвестициями. Для каждого предприятия требуется определенный партнер, финансируемый капитал, зарегистрированное соглашение о разделе прибыли и расчет реализованной выручки. В этой разрабатываемой сборке выполнение проекта остается недоступным."
 MODIFIER_TYPE_DESC_bfl_enable_commercial_bills: "Позволяет полностью финансировать платежные счета. Покупатель платит 100 золото до выпуска; банк учитывает равную кредиторскую задолженность и денежные обязательства. Названный держатель может выкупить вексель через один месяц только один раз. Эмиссия не является прибылью."
 MODIFIER_TYPE_DESC_bfl_enable_commodity_forwards: "Открывает контракты на форвардную поставку торгового финансирования. В каждом соглашении должны быть указаны его контрагент, товары, количество, дата поставки и обеспечение без повторного использования обремененных товарно-материальных запасов. Нативное исполнение торговли остается недоступным."
 MODIFIER_TYPE_DESC_bfl_enable_commodity_investments: "Открывает мандат на инвентаризацию торгового финансирования. Товарные позиции должны представлять собой финансируемые запасы местных товаров и сохранять стоимость приобретения, количество и хранение. В этой версии разработки торговое исполнение остается недоступным."
 MODIFIER_TYPE_DESC_bfl_enable_company_equity: "Открывает мандат на участие в капитале зарубежных инвестиционных компаний. Финансовые доли учитываются отдельно от контроля политических субъектов. Только проверенные выплаты компании могут стать доходом банка; подписки и возврат капитала исключены. Собственное исполнение остается недоступным."
 MODIFIER_TYPE_DESC_bfl_enable_corporate_credit: "Открывает корпоративный кредитный мандат Merchant Finance. Ссуды должны переводить банковские денежные средства определенному предприятию и создавать равноценное возмещение; выплаты основной суммы долга не входят в прибыль. Собственное исполнение остается недоступным."
 MODIFIER_TYPE_DESC_bfl_enable_debt_restructuring: "Открывает мандат на суверенную реструктуризацию. Пересмотренный срок погашения, проценты и основная сумма долга должны быть присоединены к существующему требованию с согласия должника. Исполнение остается недоступным до тех пор, пока не будет поддержана сверка внутреннего долга."
 MODIFIER_TYPE_DESC_bfl_enable_liquidity_facilities: "Разблокирует обеспеченную временную ликвидность. Финансирование должно поступать от реального контрагента, оставаться в пределах денежных средств и капитала и иметь зарегистрированное обеспечение. Вывод средств в очереди сохраняет приоритет. Выполнение собственного объекта остается недоступным."
 MODIFIER_TYPE_DESC_bfl_enable_margining_and_risk_management: "Открывает маржинальные требования для форвардных позиций торгового финансирования. Риск должен оцениваться с учетом имеющегося залога и денежных средств, при этом до увеличения обязательств необходимо дополнительное финансирование. Собственная торговля и маржинальное исполнение остаются недоступными."
 MODIFIER_TYPE_DESC_bfl_enable_project_security: "Открывает безопасность для зарубежных инвестиционных проектов. Выявленные проектные активы и доходы должны быть заложены под одно зарегистрированное обязательство, при этом приоритет сохраняется посредством погашения или возмещения. Исполнение собственного проекта остается недоступным."
 MODIFIER_TYPE_DESC_bfl_enable_public_financial_backstops: "Открывает мандат публичной поддержки для уполномоченного дипломированного банка. Помощь требует реального вклада казначейства и зарегистрированных претензий или единиц собственности; гарантии не могут чеканить наличные или компенсировать убытки. Выполнение стоячего обратного хода еще не реализовано."
 MODIFIER_TYPE_DESC_bfl_enable_sovereign_banknotes: "Разблокирует выпуск суверенных банкнот для уполномоченного дипломированного банка. Векселя представляют собой погашаемые обязательства; В обеспечение не входят денежные средства, полученные от продажи самих облигаций. Собственный выпуск и маршрутизация платежей держателям остаются недоступными."
 MODIFIER_TYPE_DESC_bfl_enable_term_deposits: "Разрешает депозиты с фиксированной процентной ставкой 100 золото со сроком погашения двенадцать месяцев. Проценты начисляются ежемесячно по ставке, принятой при открытии счета; незрелая основная сумма не может быть отозвана. Депозиты остаются обязательствами банка."
 MODIFIER_TYPE_DESC_bfl_enable_warehouse_receipts: "Разблокирует квитанции торгового финансирования, подкрепленные идентифицированными партиями запасов. Каждая квитанция резервирует десять необремененных единиц и взимает накопительную плату за хранение. Прежде чем можно будет выдавать новые квитанции, необходимо обеспечить хранение местных товаров."
 MODIFIER_TYPE_DESC_bfl_no_automatic_tribute_cost_modifier: "Чартерные отношения не предусматривают автоматической дани. Государственный доход поступает от процентов по вкладам и дивидендов по принадлежащим банкам акциям."
 MODIFIER_TYPE_NAME_bfl_enable_advanced_clearing: "Клиринг"
