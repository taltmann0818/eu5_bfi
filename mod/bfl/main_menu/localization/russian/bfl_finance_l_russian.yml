 bfl_transfer_bank_bill_command: "$bfl_transfer_bank_bill$"
 bfl_transfer_bank_bill_command_desc: "$bfl_transfer_bank_bill_desc$"
 bfl_transfer_bank_bill_desc: "Выберите эмитента и принимающего бенефициара. Первый имеющий право 100-переводы претензий на золото для 100 золото, выплаченное его нынешнему владельцу. Заблокированное обеспечение не может быть передано. Примечания требуют исследования приемлемости Revolutions. Все проверки финансирования, владения и филиалов капитала повторяются при исполнении."
