 bfl_request_discount: "Запросить обеспеченный расчетный кредит"
 bfl_request_discount_act: "$bfl_request_discount$"
 bfl_request_discount_command: "$bfl_request_discount$"
 bfl_request_discount_command_desc: "$bfl_request_discount_desc$"
 bfl_request_discount_desc: "Запросить 75-золотой аванс против вашего профинансированного 100-золотой вексель третьего банка. Менеджер живого кредитора рассматривает запрос; Приемка перепроверяет все стороны и обеспечение. Между банками не требуется филиала банка."
 bfl_request_discount_effect_text: "$bfl_request_discount$"
 bfl_request_discount_effect_text_past: "$bfl_request_discount$"
 bfl_request_discount_tip: "Выберите кредитора для 75-золотой месячный аванс под ваш незаложенный, финансируемый 100-золотой вексель в третьем банке. Требуются средства обеспечения и ликвидности. Кредитор должен дать согласие; Между банками не требуется отделения банка."
 bfl_request_public_support: "Запросить государственную защищенную поддержку"
 bfl_request_public_support_act: "$bfl_request_public_support$"
 bfl_request_public_support_command: "$bfl_request_public_support$"
 bfl_request_public_support_command_desc: "$bfl_request_public_support_desc$"
 bfl_request_public_support_desc: "Запросить 75-золотой аванс против вашего профинансированного 100-золотой вексель третьего банка. Менеджер живого кредитора рассматривает запрос; Приемка перепроверяет все стороны и обеспечение. Между банками не требуется филиала банка."
 bfl_request_public_support_effect_text: "$bfl_request_public_support$"
 bfl_request_public_support_effect_text_past: "$bfl_request_public_support$"
 bfl_request_public_support_tip: "Выберите дипломированного кредитора с государственной финансовой поддержкой и полноценным суверенным капиталом Центрального банка. Его нынешний менеджер должен дать согласие. 75-Золотой обеспеченный аванс использует банковские наличные и взимает как минимум 9% ежегодно; это не создает никаких гарантий или рекапитализации."
 bfl_resolution_begin_command: "Начать разрешение"
 bfl_resolution_begin_command_tip: "Упорядоченное разрешение замораживает новые обязательства и распределения. Сегрегированные денежные и депозитарные резервы остаются под защитой; доля депозитов в имеющихся денежных средствах пропорционально сумме задолженности по расходам и собственному капиталу. Отсутствующие кредиторы сохраняют свои требования. Добровольные условия требуют текущего согласия кредиторов и реструктуризации долга «Ренессанс». Государственная гарантия покрывает 50% принятых убытков по депозитам, до 100 золото в целом, финансируемое его зарегистрированным сувереном; неоплаченные звонки остаются невыполненными. Для закрытия необходимо очистить все обязательства и неденежные активы. Закрытые поместья не могут вновь открыться."
 bfl_resolution_call_command: "Оплата в ожидании гарантии"
 bfl_resolution_call_command_tip: "Упорядоченное разрешение замораживает новые обязательства и распределения. Сегрегированные денежные и депозитарные резервы остаются под защитой; доля депозитов в имеющихся денежных средствах пропорционально сумме задолженности по расходам и собственному капиталу. Отсутствующие кредиторы сохраняют свои требования. Добровольные условия требуют текущего согласия кредиторов и реструктуризации долга «Ренессанс». Государственная гарантия покрывает 50% принятых убытков по депозитам, до 100 золото в целом, финансируемое его зарегистрированным сувереном; неоплаченные звонки остаются невыполненными. Для закрытия необходимо очистить все обязательства и неденежные активы. Закрытые поместья не могут вновь открыться."
 bfl_resolution_close_command: "Закрыть недвижимость"
 bfl_resolution_close_command_tip: "Упорядоченное разрешение замораживает новые обязательства и распределения. Сегрегированные денежные и депозитарные резервы остаются под защитой; доля депозитов в имеющихся денежных средствах пропорционально сумме задолженности по расходам и собственному капиталу. Отсутствующие кредиторы сохраняют свои требования. Добровольные условия требуют текущего согласия кредиторов и реструктуризации долга «Ренессанс». Государственная гарантия покрывает 50% принятых убытков по депозитам, до 100 золото в целом, финансируемое его зарегистрированным сувереном; неоплаченные звонки остаются невыполненными. Для закрытия необходимо очистить все обязательства и неденежные активы. Закрытые поместья не могут вновь открыться."
 bfl_resolution_guarantee_command: "Авторизовать гарантию"
 bfl_resolution_guarantee_command_tip: "Упорядоченное разрешение замораживает новые обязательства и распределения. Сегрегированные денежные и депозитарные резервы остаются под защитой; доля депозитов в имеющихся денежных средствах пропорционально сумме задолженности по расходам и собственному капиталу. Отсутствующие кредиторы сохраняют свои требования. Добровольные условия требуют текущего согласия кредиторов и реструктуризации долга «Ренессанс». Государственная гарантия покрывает 50% принятых убытков по депозитам, до 100 золото в целом, финансируемое его зарегистрированным сувереном; неоплаченные звонки остаются невыполненными. Для закрытия необходимо очистить все обязательства и неденежные активы. Закрытые поместья не могут вновь открыться."
 bfl_resolution_heading: "Разрешение и взыскание кредиторов"
 bfl_resolution_heading_tip: "Устойчивое финансовое решение; Возврат денежных средств и согласованные изменения учитываются отдельно от доходов."
 bfl_resolution_help: "Обеспеченные и депозитарные резервы → пропорциональные депозиты → задолженность по расходам → оставшиеся акционеры. Претензии остаются в силе в случае нехватки средств и потери полномочий подачи. Введите решение, прежде чем предлагать условия."
 bfl_resolution_liquidate_command: "Реализуйте доступные активы"
 bfl_resolution_liquidate_command_tip: "Продавайте доступные необремененные собственные запасы и собирайте депозиты, счета и банкноты с наступившим сроком действия с помощью существующих услуг. Фактические поступления финансируют водопад восстановления. Недоступные или незрелые позиции остаются в учете; никакая балансовая стоимость не становится золотом."
 bfl_resolution_next_command: "Следующий депозитный счет"
 bfl_resolution_next_command_tip: "Цикл активных депозитных счетов. Кредиторы по наследству требуют вступления в силу «Мандата по проведению работ», прежде чем их правительство сможет принять добровольные условия. Платежи возвращаются в зарегистрированную казну или кошелек недвижимости."
 bfl_resolution_notice_acknowledge: "Признайте окончательный результат"
 bfl_resolution_notice_desc: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_notice_bank').GetCountry.GetName] закрыла свою финансовую деятельность.\n\nВыплачено возмещение по депозитам: [ROOT.GetCountry.MakeScope.GetVariable('bfl_notice_bank').GetCountry.MakeScope.GetVariable('bfl_resolution_paid').GetValue|2]@gold!\nУбытки по согласованному депозиту: [ROOT.GetCountry.MakeScope.GetVariable('bfl_notice_bank').GetCountry.MakeScope.GetVariable('bfl_resolution_waived').GetValue|2]@gold!\nЗарегистрированные законом убытки: [ROOT.GetCountry.MakeScope.GetVariable('bfl_notice_bank').GetCountry.MakeScope.GetVariable('bfl_resolution_statutory_loss').GetValue|2]@gold!\n\nЗарегистрированные убытки представляют собой неоплаченные суммы, а не возмещения или новые доходы. Историческое право собственности и окончательное имущество остаются зарегистрированными; закрытое учреждение не может вновь открыться."
 bfl_resolution_notice_title: "Решение банка закрыто"
 bfl_resolution_offer_command: "Предложить условия кредитора"
 bfl_resolution_offer_command_tip: "Упорядоченное разрешение замораживает новые обязательства и распределения. Сегрегированные денежные и депозитарные резервы остаются под защитой; доля депозитов в имеющихся денежных средствах пропорционально сумме задолженности по расходам и собственному капиталу. Отсутствующие кредиторы сохраняют свои требования. Добровольные условия требуют текущего согласия кредиторов и реструктуризации долга «Ренессанс». Государственная гарантия покрывает 50% принятых убытков по депозитам, до 100 золото в целом, финансируемое его зарегистрированным сувереном; неоплаченные звонки остаются невыполненными. Для закрытия необходимо очистить все обязательства и неденежные активы. Закрытые поместья не могут вновь открыться."
 bfl_resolution_pay_command: "Восстановление оплаты"
 bfl_resolution_pay_command_tip: "Упорядоченное разрешение замораживает новые обязательства и распределения. Сегрегированные денежные и депозитарные резервы остаются под защитой; доля депозитов в имеющихся денежных средствах пропорционально сумме задолженности по расходам и собственному капиталу. Отсутствующие кредиторы сохраняют свои требования. Добровольные условия требуют текущего согласия кредиторов и реструктуризации долга «Ренессанс». Государственная гарантия покрывает 50% принятых убытков по депозитам, до 100 золото в целом, финансируемое его зарегистрированным сувереном; неоплаченные звонки остаются невыполненными. Для закрытия необходимо очистить все обязательства и неденежные активы. Закрытые поместья не могут вновь открыться."
 bfl_resolution_resume_command: "Возобновить работу после восстановления"
 bfl_resolution_resume_command_tip: "Упорядоченное разрешение замораживает новые обязательства и распределения. Сегрегированные денежные и депозитарные резервы остаются под защитой; доля депозитов в имеющихся денежных средствах пропорционально сумме задолженности по расходам и собственному капиталу. Отсутствующие кредиторы сохраняют свои требования. Добровольные условия требуют текущего согласия кредиторов и реструктуризации долга «Ренессанс». Государственная гарантия покрывает 50% принятых убытков по депозитам, до 100 золото в целом, финансируемое его зарегистрированным сувереном; неоплаченные звонки остаются невыполненными. Для закрытия необходимо очистить все обязательства и неденежные активы. Закрытые поместья не могут вновь открыться."
 bfl_review_trade: "Обзор сделки"
 bfl_review_trade_tip: "Просмотрите выбранные единицы и точную оплату. Продажу необходимо округлить как минимум до 0.01 золото; увеличьте количество, если просмотр недоступен. Ни один дипломат не будет потрачен до тех пор, пока не будет заключена действительная сделка."
 bfl_safeguards_title: "Ликвидность и гарантии"
 bfl_safeguards_title_tip: "#T Ликвидность и гарантии#!\nДоступные банковские наличные: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_free_cash')|2]@gold!\nТребования к защищенным денежным средствам: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_protected_cash')|2]@gold!\nВыводы в очереди: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_withdrawals_due')|2]@gold!\n\nРекапитализация пополняет государственный капитал. Приостановка депозитов останавливает пополнение новых счетов при сохранении существующих обязательств."
 bfl_sale_unavailable: "Заказ на акции не может быть выполнен"
 bfl_sale_unavailable_desc: "У эмитента есть месячный период восстановления торговли, у вас нет дипломата, истек срок действия вашей котировки или изменились доступные акции, фонды или доступ к бирже. Снова откройте покупку или продажу акций, чтобы получить новую котировку. Ни деньги, ни акции не перемещались."
 bfl_secured_liquidity: "Обеспеченная ликвидность"
 bfl_secured_liquidity_tip: "#T Обеспеченная ликвидность#!\nАбсолютизм, обеспечение и механизмы ликвидности. заранее 75 золото против отдельно финансируемого 100-золотой вексель третьего банка. Залог блокируется один раз. Фиксированная принятая годовая ставка делится на 12. Между банками не требуется филиал."
 bfl_security_bank_results: "Закрытие последнего банка"
 bfl_security_financial_heading: "Материальное финансовое положение"
 bfl_security_financial_subtitle: "Что поддерживает цену акций"
 bfl_security_financial_title: "Собственный капитал [Country.GetName]"
 bfl_security_price_heading: "Стоимость акций и право собственности"
 bfl_security_price_math: "Рыночная цена = материальная чистая стоимость акций на акцию × ежемесячная рыночная премия. Давление заказов, волатильность, возврат к среднему значению и стресс могут изменить эту премию. Первичный капитал по-прежнему оценивается на уровне чистой стоимости активов; нереализованная прибыль не финансирует кредитование или дивиденды."
 bfl_security_primary_note: "Дивиденды уменьшают денежные средства и чистую стоимость активов один раз. Новый капитал оценивается в NAV и не создает сигнала давления со стороны покупателей. Подписки приостанавливаются, когда ставка дилера при перепродаже превышает NAV, что предотвращает гарантированную немедленную прибыль. История содержит реальные наблюдения; перезагрузка не перезагружает сохраненный ежемесячный шок."
 bfl_select_buy_shares: "Купить акции банка и компании"
 bfl_select_profile: "Выберите ожидаемую специализацию"
 bfl_select_profile_tip: "#T Специализация банка#!\nОткройте выбор специализации, если этот банк еще не выбрал постоянный профиль. Торговое финансирование и зарубежные инвестиции открывают разные пути исследований. Завершенную специализацию нельзя заменить этой кнопкой."
 bfl_select_sell_shares: "Продать акции, которыми вы владеете"
 bfl_selector_next: "Следующие банки"
 bfl_selector_previous: "Предыдущие банки"
 bfl_sell_confirm_desc: "Продать [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_quantity').GetValue|3] акции [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_issuer').GetCountry.GetName] для [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_total').GetValue|2]@gold!. Скрытый маркет-мейкер гарантирует эту продажу, включая котируемый торговый спред, пока котировка действительна. Акции немедленно покидают ваш портфель; Фоновые покупки AI не задерживают оплату. Выручка поступает в казну вашего банка. Для урегулирования требуется один дипломат и начинается месячный период восстановления покупки/продажи этого эмитента."
 bfl_sell_confirm_title: "Подтвердите мгновенную продажу акций"
 bfl_sell_shares: "Продать акции"
 bfl_sell_shares_desc: "Выберите один из ваших активов и количество. Скрытый маркет-мейкер немедленно покупает ваши акции по рыночной котировке за вычетом отображаемого дилерского спреда. Банки ИИ покупают свои запасы в фоновом режиме."
 bfl_sell_shares_tip: "Выберите один из ваших активов и количество. Скрытый маркет-мейкер немедленно покупает ваши акции по рыночной котировке за вычетом отображаемого дилерского спреда. Банки ИИ покупают свои запасы в фоновом режиме.\nТребуется завершенный обмен, торговля акциями и хотя бы один дипломат. Каждая успешная сделка потребляет один дипломат и запускает месячный период восстановления для этого эмитента. Доступные дипломаты: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bfl_available_trade_diplomats')|2]. Заказы должны иметь денежную стоимость не менее 0.01 золото."
 bfl_sell_state_confirm_desc: "Продать [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_quantity').GetValue|3] доли вашей казначейской доли в [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_issuer').GetCountry.GetName] для [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_total').GetValue|2]@gold!, заплачено в казну вашей страны. Банк не получает финансирования и выпущенные акции не меняются. Скрытый дилер гарантирует отображаемую котировку, включая котируемый дилерский спред. Для урегулирования требуется один дипломат и начинается месячный период восстановления покупки/продажи для этого эмитента. Денежные полномочия вашего устава остаются за вами."
