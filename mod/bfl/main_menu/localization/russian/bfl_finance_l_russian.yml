 bfl_finance.110.desc: "Инвестиции покупают новый государственный капитал. Конвертация сохраняет идентичность страны банка. Закрытие этого выбора не передает денег. На странице показаны восемь подходящих прямых предметов; используйте «Далее», чтобы перейти к дополнительным банкам."
 bfl_finance.110.title: "Выберите Госбанк"
 bfl_finance_title: "Банковское дело и финансы"
 bfl_financial_advance: "Банковский аванс"
 bfl_financial_advance_desc: "Финансовые знания для независимых банковских домов и государственных банков."
 bfl_founder_class: "Основатели · местный бюргерский пул"
 bfl_free_cash_label: "Доступные денежные средства"
 bfl_funded_bill_button: "Накопительный счет на оплату · 100 золото"
 bfl_funding_tab: "Финансирование и долг"
 bfl_funding_title: "Депозиты и капитал"
 bfl_funding_title_tip: "#T Депозиты и капитал#!\nДепозит передает государственные денежные средства в банк и создает требование к погашению. Подписка на капитал покупает доли собственности и может потерять в цене. Оба передают существующее золото; ни то, ни другое не считается прибылью банка."
 bfl_goods: "Товары и хранение · Торговое финансирование"
 bfl_goods_accept: "Примите эти условия"
 bfl_goods_accept_branch_tip: "Примите отображаемое двенадцатимесячное соглашение с таможней. Ежемесячная плата за доступ поступает согласившемуся хосту; принятие не создает запасов, претензий на товары или немедленной покупки."
 bfl_goods_accept_quote_tip: "Заплатите хранителю указанную цену контракта плюс отдельную плату за хранение в размере одного золота. Перепроверьте действующую поддержку, цену, стороны, разрешения, доступ и защищенные средства; измененные или устаревшие условия не приносят денег."
 bfl_goods_accept_transfer_tip: "Оплатите отображаемую трансфертную цену текущему держателю. Прежде чем передавать существующую квитанцию ​​один раз, еще раз проверьте владельца, количество, создание лота, исследование, срок действия и финансирование."
 bfl_goods_branch_desc: "Хозяин предлагает доступ к своему рынку капитала для 12 месяцев в 1 золото в месяц, выплачивается хозяину. За собственные покупки сохраняется собственный денежный заряд; это отдельная кастодиальная служба. Для доступа требуется собственная завершенная таможня и мир. Неоплачиваемый доступ, истечение срока действия, потеря здания или война останавливают новые покупки и доставку. Принимающая сторона может заморозить местную опеку; никакие денежные средства или товары не создаются. Продлите подписку на том же хосте, чтобы восстановить доступ."
 bfl_goods_branch_title: "Соглашение о хранении на таможне"
 bfl_goods_browser_desc: "Выберите физический лот, чтобы просмотреть его предложение. Существующие держатели могут запросить доставку; принимающая сторона таможни, согласившаяся на это, может заморозить недоступное хранение и освободить его после возобновления доступа. При выборе акцепта предложения не происходит."
 bfl_goods_browser_title: "Товарные предложения и претензии по хранению"
 bfl_goods_claim_desc: "Запросите доставку этой квитанции на ваш рынок капитала. Доставка по рынкам занимает два месяца, стоимость 1 золото и проигрывает 1% количества. Альтернативно закройте это окно и используйте Предложить передачу складских расписок в дипломатии. Переводы требуют оборотов, маржи и управления рисками у хранителя; покупатель должен принять текущую цену."
 bfl_goods_claim_title: "Ваша складская претензия"
 bfl_goods_close: "Закрыть"
 bfl_goods_decline: "Снижение"
 bfl_goods_deliver: "Запросить физическую доставку"
 bfl_goods_explanation: "Для финансирования собственных запасов, обеспеченных квитанций и форвардов требуется торговое финансирование, их авансы и проверка исполнения/каденции P09. Обремененные товары не могут служить основанием для второго иска."
 bfl_goods_forward_title: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_goods_quote_type').Goods.GetNameWithNoTooltip] физический форвард"
 bfl_goods_inventory_empty: "Товара на хранении нет. Автоматические покупки начинаются при следующем ежемесячном закрытии банка."
 bfl_goods_inventory_hint: "Наведите указатель мыши на товары, количество, стоимость и возврат."
 bfl_goods_inventory_note: "Ориентировочная собственная продажная стоимость; нереализованная прибыль от оставшейся оплаченной стоимости. Поступления третьих лиц исключаются из итоговой суммы банка. Затраты, порча и потеря доступа влияют на выручку. Прокрутите для каждой сохраненной позиции."
 bfl_goods_inventory_subtitle: "Физическое хранение · ориентировочная рыночная стоимость"
 bfl_goods_inventory_title: "Инвентаризация товаров"
 bfl_goods_next: "Следующие лоты"
 bfl_goods_policy_allocation_0: "Распределение · 0%"
 bfl_goods_policy_allocation_10: "Распределение · 10%"
 bfl_goods_policy_allocation_25: "Распределение · 25%"
 bfl_goods_policy_allocation_50: "Распределение · 50%"
 bfl_goods_policy_button: "Политика"
 bfl_goods_policy_contracts_0: "Контракты · Только спотовые"
 bfl_goods_policy_contracts_1: "Контракты · Расписки о предложениях"
 bfl_goods_policy_contracts_2: "Контракты · Форвардные предложения"
 bfl_goods_policy_help: "Нажмите настройку для цикла. Банк выбирает товары и количества на момент закрытия месяца. Наведите курсор на каждый параметр, чтобы увидеть его правила."
 bfl_goods_policy_mandate_0: "Мандат · Приостановлено"
 bfl_goods_policy_mandate_1: "Мандат · Автоматический"
 bfl_goods_policy_mandate_2: "Мандат · Убежать"
 bfl_goods_policy_risk_0: "Риск · Осторожно"
 bfl_goods_policy_risk_1: "Риск · Сбалансированный"
 bfl_goods_policy_risk_2: "Риск · Приключения"
 bfl_goods_policy_turnover_12: "Подожди до · 12 месяцы"
 bfl_goods_policy_turnover_24: "Подожди до · 24 месяцы"
 bfl_goods_policy_turnover_6: "Подожди до · 6 месяцы"
 bfl_goods_previous: "Предыдущие лоты"
 bfl_goods_quote_desc: "Количество: [ROOT.GetCountry.MakeScope.GetVariable('bfl_goods_quote_quantity').GetValue|3]. Цена: [ROOT.GetCountry.MakeScope.GetVariable('bfl_goods_quote_price').GetValue|2] золото плюс 1 плата за хранение золота. Складское свидетельство сразу же является собственностью товара. Физический форвард полностью обеспечивает поставку за три месяца. Оба требуют обеспеченных товаров. Затраты на хранение 0.1 в месяц; физическая потеря - это 2% ежегодно. Форвард сохраняет фиксированное количество: недостающие единицы возмещаются пропорционально плюс равная компенсация безопасности продавца. Доставка на другой рынок занимает два месяца, стоимость 1 золото и проигрывает 1% количества. Потери при хранении и транспортировке уменьшают количество поступления. Недействительные стороны или потеря доступа сохраняют товары и залог для возврата. Принимайте, только если эти условия вас устраивают."
 bfl_goods_quote_title: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_goods_quote_type').Goods.GetNameWithNoTooltip] складская квитанция"
 bfl_goods_set_allocation_tip: "Цикл 0%, 10%, 25% или 50% банковских денежных средств плюс стоимость собственных запасов. Защищенные денежные средства всегда сохраняются. Сокращение распределения приводит к продаже доступных свободных позиций до тех пор, пока они не окажутся ниже целевого показателя."
 bfl_goods_set_contracts_tip: "Только спот, автоматически предлагать квитанции или автоматически предлагать физические форварды. Предложения требуют возраста и исследований инструмента, остаются поддержанными и ожидают отдельного принятия контрагентом. Существующие принятые обязательства остаются защищенными."
 bfl_goods_set_mandate_tip: "Автоматически: покупайте и продавайте по вашему полису. Приостановлено: никаких дискреционных сделок. Отбег: продать доступный бесплатный инвентарь, не заменяя его. Существующие контракты, хранение и потери продолжаются на всех режимах."
 bfl_goods_set_risk_tip: "Осторожно: фиксируйте прибыль +10%, стоп-лосс −5%. Сбалансированный: +20% / −15%. Авантюрный: +35% / −25%. В лимитах используются собственные котировки продаж в зависимости от оставшейся стоимости; исполнение ежемесячно, и цены могут меняться."
 bfl_goods_set_turnover_tip: "Максимальный период владения: 6, 12 или 24 месяцев. Банк продает доступные свободные позиции по истечении срока действия и автоматически выбирает новые товары."
 bfl_goods_settings: "Торговая политика"
 bfl_goods_settings_tip: "Установите мандат банка, распределение, лимиты риска, период владения и договорную политику. Банк выбирает все товары и количества при закрытии месяца."
 bfl_goods_tip: "#T Товары и торговля#!\nИнструменты торгового финансирования, включающие запасы, поступления, будущие поставки и маржу. Зарегистрированное разрешение не создает товаров или торговых путей; требуется физическое исполнение."
 bfl_goods_trading_locked: "Торговля заблокирована · наведите курсор на требования"
 bfl_goods_transfer_desc: "Цена: [ROOT.GetCountry.MakeScope.GetVariable('bfl_goods_transfer_price').GetValue|2] золото. Количество: [ROOT.GetCountry.MakeScope.GetVariable('bfl_goods_transfer_quantity').GetValue|3]. Ваш платеж поступает текущему владельцу. Хранение остается в банке; Условия хранения, порчи и доставки сохраняются. Приемка отклоняет измененную основу, держатель, формирование партии или цену."
 bfl_goods_transfer_title: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_goods_transfer_type').Goods.GetNameWithNoTooltip] передача квитанции"
 bfl_grant_goods_branch: "Предоставить доступ к хранению на таможне"
 bfl_grant_goods_branch_act: "$bfl_grant_goods_branch$"
 bfl_grant_goods_branch_desc: "Ознакомьтесь с предложениями о физическом хранении, существующими претензиями или добровольным соглашением о доступе к таможне. Выбор страны не приносит денег."
 bfl_grant_goods_branch_effect_text: "$bfl_grant_goods_branch$"
 bfl_grant_goods_branch_effect_text_past: "$bfl_grant_goods_branch$"
 bfl_history_empty: "История начинается со следующего ежемесячного расчета."
 bfl_investment_tab: "Кредитование и инвестиции"
 bfl_investment_title: "Кредит и инвестиции"
 bfl_invite_equity_capital: "Добавить акционерный капитал банка"
 bfl_invite_equity_capital_desc: "Подписаться 100 золото для [ROOT.GetCountry.MakeScope.GetVariable('bfl_capital_issuer').GetCountry.GetName] из выбранной казны или кошелька поместья. Подписчик получает новые акции по рыночной котировке. Кошельки недвижимости сохраняют как минимум 25 золото. Финансовая собственность, будущие дивиденды и разводнение следуют за оплаченными акциями."
 bfl_invite_equity_capital_tip: "Выберите казначейство или кошелек недвижимости для подписки 100 золота по текущей чистой стоимости банка. Новые акции размывают существующих владельцев; банк получает платеж."
 bfl_join_clearing_group: "Присоединяйтесь к клиринговой группе"
 bfl_join_clearing_group_act: "$bfl_join_clearing_group$"
 bfl_join_clearing_group_command: "$bfl_join_clearing_group$"
 bfl_join_clearing_group_command_desc: "$bfl_join_clearing_group_desc$"
 bfl_join_clearing_group_desc: "Присоединяйтесь к оператору, принимающему участников. Четыре банка на группу; согласованные платежные счета с наступившим сроком погашения погашаются фондированным чистым дебетом. Небольшой участник блокирует пакет, не удаляя претензии."
 bfl_join_clearing_group_effect_text: "$bfl_join_clearing_group$"
 bfl_join_clearing_group_effect_text_past: "$bfl_join_clearing_group$"
 bfl_join_clearing_group_tip: "Выберите исследованного клирингового оператора, принимающего участников. Требуются революции, клиринговая палата и передовые исследования клиринга. До четырех банков присоединяются явным образом; короткий член сохраняет все претензии."
 bfl_liabilities_label: "Обязательства банка"
 bfl_liabilities_label_tip: "#T Общий долг#!\nОбязательства учитываются на счетах банка. Это отдельно от местных займов и облигаций вашего штата.\n\nОсновная сумма депозита: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_deposit_principal')|2]@gold!\nЗачисленные проценты по депозиту: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_deposit_interest')|2]@gold!\nВыдающиеся замечания: [Country.MakeScope.GetVariable('bfl_notes_outstanding').GetValue|2]@gold!\nПрочая кредиторская задолженность: [Country.MakeScope.GetVariable('bfl_other_payables').GetValue|2]@gold!\nИтого: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_liabilities')|2]@gold!\n\nВывод средств в очереди [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_withdrawals_due')|2]@gold! уже являются частью требований по депозитам и не добавляются второй раз."
 bfl_liquidity_facilities: "Средства ликвидности"
 bfl_liquidity_facilities_desc: "Даже платежеспособный банковский дом может быть не в состоянии удовлетворить весь спрос на монеты одновременно. Временные авансы под надежные активы могут восполнить этот дефицит при условии, что помощь не скроет потерь, которые учреждение не может нести."
 bfl_liquidity_warning: "Банковская ликвидность требует внимания"
 bfl_liquidity_warning_desc: "В вашем банке возникла очередь на снятие средств или недостаточно капитала. Открытая экономика → Банковское дело и финансы для рассмотрения депозитов и рекапитализации."
 bfl_list_selected_bond_01_tip: "Предложите эту точную претензию на 98% лица в течение трех месяцев. Его нынешний владелец сохраняет купоны до принятия финансирования. Обе стороны должны иметь обмен, когда сделка состоится."
