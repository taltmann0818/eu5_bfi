 bfl_term_service_2_tip: "Выбирает первый подходящий лот на определенный срок. Банк представляет фиксированные условия для явного акцепта. Для продления требуется текущий допуск и разрешение на срок; ранний выход и зрелый выход остаются доступными после потери отношений или авторитета. Измененные или истекшие котировки не могут быть исполнены."
 bfl_transfer_bank_bill: "Продать банковский вексель по номиналу"
