 bfl_sovereign_accounts: "Суверенные счета — отдельно от банковских активов"
 bfl_sovereign_accounts_subtitle: "Нативные суверенные кредиты — не банковские активы"
 bfl_sovereign_accounts_tip: "Эти внутренние долги и дебиторская задолженность принадлежат государству, а не его банку. Кредиты, принадлежащие банкам, включены в список активов; Обязательства банка включают депозиты и неоплаченные операционные расходы. Внутренние заимствования, погашения и списки кредитов сохраняют суверенитет в качестве действующего лица."
 bfl_sovereign_banknotes: "Суверенные банкноты"
 bfl_sovereign_banknotes_desc: "Банк, поддерживаемый государственной властью, может распространять письменные обещания заплатить вместо крупной монеты. Их принятие основано на уверенности в том, что учреждение выкупит их и что орган, выпустивший их, выполнит свои обязательства."
 bfl_sovereign_credit: "Суверенный кредит"
 bfl_sovereign_credit_tip: "#T Суверенный кредит#!\nСсуда из банковских наличных земельному государству с требованием о погашении, записанным как банковский актив. Требуется действующий банк и родные условия кредита. В этой сборке исполнение нового кредита недоступно."
 bfl_sovereign_debt: "Суверенный долг"
 bfl_sovereign_debt_heading: "Государственный долг [Country.GetName]"
 bfl_sovereign_note: "Суверенная банкнота"
 bfl_sovereign_note_tip: "#T Погашаемые банкноты#!\nАбсолютизм, исследование суверенных банкнот, суверенная авторизация, столичный Центральный банк и филиал банка-эмитента. Обмен 100 для полностью зарезервированного требования. Независимый лимит, основанный на акционерном капитале, не включает входящие денежные средства по банкнотам. Добровольные переводы номиналов; местные платежи остаются в золоте."
 bfl_sovereign_receivables: "Суверенная дебиторская задолженность"
 bfl_sovereign_receivables_heading: "Суверенная дебиторская задолженность [Country.GetName]"
 bfl_sovereign_restructuring: "Суверенная реструктуризация"
 bfl_sovereign_restructuring_tip: "#T Суверенная реструктуризация#!\nПересмотр суверенного долга в рамках аванса на реструктуризацию долга. Требуется разрешенный возраст, действующий банк и поддерживаемая транзакция с собственным долгом. В этой сборке недоступно встроенное выполнение реструктуризации."
 bfl_specialization_title: "Специализация банка"
 bfl_state_bonds_tip: "#T Емкость государственных облигаций#!\nОблигации отечественного государства в обращении: [GetPlayer.GetNumBonds]\nМаксимальное количество слотов для собственных облигаций: [GetPlayer.GetDoubleModifierValue('max_bonds', 'max_bonds_modifier')|0]\n\nЭто облигации вашего государства, отделенные от банковских депозитов, капитала и других обязательств. Емкость включает в себя собственные базовые слоты и модификаторы емкости связи. Продажа облигаций также требует соблюдения местных условий заимствования."
 bfl_state_bonds_value: "Облигации: [GetPlayer.GetNumBonds] / [GetPlayer.GetDoubleModifierValue('max_bonds', 'max_bonds_modifier')|0]"
 bfl_state_chartered_bank: "Государственный дипломированный банк"
 bfl_state_chartered_bank_desc: "Отдельно финансируемый отечественный банковский субъект. Первоначально суверен владеет всеми акциями и устанавливает ежемесячную выплату дивидендов в кредит. Подписка на новые банки увеличивает капитал и размывает существующую собственность. По государственным депозитам начисляются льготные проценты."
 bfl_state_credit: "Государственный кредит"
 bfl_state_credit_value: "Кредит: [Multiply_CFixedPoint(GetPlayer.GetCreditworthiness, '(CFixedPoint)100')|0]"
 bfl_state_interest_value: "Интерес: [GetPlayer.GetModifierValueNoFormat('bank_interest')]"
