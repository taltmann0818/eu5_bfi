 bfl_strategy_automatic: "мандат AI · автоматический"
 bfl_strategy_credit: "Последний отзыв: за согласие предложен кредит"
 bfl_strategy_delegated: "Инвестиционный мандат · делегирован"
 bfl_strategy_deposit: "Последний отзыв: 100 золото, размещенное до востребования"
 bfl_strategy_disable: "Управляйте инвестициями"
 bfl_strategy_disable_tip: "Прекратите автоматические покупки кредитов, предложения новых стратегий и размещения до востребования. Существующие кредиты, депозиты и претензии, находящиеся в очереди, продолжают обслуживаться. Товары, акции и отраслевая политика остаются отдельными."
 bfl_strategy_enable: "Делегировать инвестиции"
 bfl_strategy_enable_tip: "Разрешите покупку существующих местных кредитов, кредитных и грузовых предложений соответствующим критериям AI-контрагентам, а также размещение избыточных денежных средств до востребования. Низкая ликвидность может привести к тому, что одна суверенная облигация, находящаяся в собственности, будет стоить 98% лица; принятая перепродажа может принести убытки. Cargo использует ваши текущие Условия, а также обычное согласие и физический расчет. Суверенные займы, дивиденды, товары и денежно-кредитная власть сохраняют свою отдельную политику. Новый бизнес останавливается в разрешении."
 bfl_strategy_idle: "Последний отзыв: сохраненная ликвидность"
 bfl_strategy_manual: "Инвестиционный мандат · руководство"
 bfl_strategy_recall: "Последний отзыв: запрос на отзыв депозита"
 bfl_strategy_resale: "Последний отзыв: в качестве ликвидности предлагается собственная облигация"
 bfl_strategy_secondary_statement: "Автоматические покупки в нативном кредите: [Country.MakeScope.GetVariable('bfl_strategy_takeovers').GetValue|0] · Котировки перепродажи облигаций: [Country.MakeScope.GetVariable('bfl_strategy_resales').GetValue|0]"
 bfl_strategy_secondary_tip: "Существующие кредитные покупки рассматриваются не более чем у двенадцати завершенных клиентов столичных филиалов. Заемщику нужна ликвидность, покой, неотрицательный бюджет и как минимум 0.50 кредитоспособность. Покупки сохраняются 100 свободные денежные средства, ограничьте премию за приобретение на уровне 25% оставшейся суммы основного долга и общего риска по заемщику на 25% капитала. Ожидаемая ежемесячная маржа должна быть не менее 0.10 золото после премии, надбавки на обслуживание и консервативных затрат на финансирование. Это приблизительная оценка; досрочное погашение и невыполнение обязательств по-прежнему могут привести к убыткам. Низкая ликвидность может привести к тому, что одна суверенная облигация, находящаяся в собственности, будет стоить 98% лица через завершенную фондовую биржу. Никакая выручка от перепродажи не регистрируется до получения согласия финансируемого покупателя."
 bfl_strategy_statement: "Ежемесячные обзоры: [Country.MakeScope.GetVariable('bfl_strategy_reviewed').GetValue|0]/12  · Оценка: [Country.MakeScope.GetVariable('bfl_strategy_score').GetValue|2]\nКредитные предложения: [Country.MakeScope.GetVariable('bfl_strategy_offers').GetValue|0]  · Депозиты размещены: [Country.MakeScope.GetVariable('bfl_strategy_placements').GetValue|0]  · Напоминает: [Country.MakeScope.GetVariable('bfl_strategy_recalls').GetValue|0]"
 bfl_strategy_title: "Инвестиционный мандат"
 bfl_strategy_title_tip: "Консервативный ежемесячный мандат. Просмотрите до двенадцати кандидатов на получение кредита, двенадцать связанных венчурных операторов с четырьмя исходными рынками каждый или двенадцать депозитных банков. Не более одного кредитного предложения, грузового предложения или 100-размещение спроса на золото ежемесячно. Кредитные и грузовые предложения остывают в течение трех месяцев. Для перевозки груза требуется указанная маржа не менее 10% и один профицит золотого банка, сохраняет 500 бесплатные денежные средства и ограничены двумя активными соглашениями и 25% капитал. Котировки могут меняться; потери остаются возможными. Разрешения на защищенные денежные средства, исследования, филиалы и профили по-прежнему применяются."
 bfl_strategy_venture: "Последний отзыв: предложено согласие на грузовое партнерство"
 bfl_streamline_bank: "Оптимизация администрирования · 100 золото"
 bfl_streamline_bank_tip: "Оплата 100 государственного золота один раз, чтобы сократить фиксированные операционные расходы банка на 10%. Реформа устава, банковского дела и расширенного клиринга обеспечивает дополнительные сокращения. Данное решение не создает банку прибыли."
 bfl_subscribe_bank: "Подписаться 100 золото банковского капитала"
 bfl_subscribe_bank_act: "$bfl_subscribe_bank$"
 bfl_subscribe_bank_desc: "Финансируется из вашей собственной казны после проверки профиля, возраста, исследований и регистрации. Принципал не является прибылью банка. Подписка на банковский капитал покупает паи по текущей стоимости чистых активов."
 bfl_subscribe_bank_effect_text: "$bfl_subscribe_bank$"
 bfl_subscribe_bank_effect_text_past: "$bfl_subscribe_bank$"
 bfl_suspend_command: "Приостановить новые депозиты"
 bfl_suspend_command_tip: "#T Приостановить новые депозиты#!\nПрекратите принимать новые депозиты и действия по финансированию, требующие принятия депозитов. Существующие счета, процентные обязательства и запросы на снятие средств остаются записанными. Этот контроль не закрывает банк и не прощает его долги."
 bfl_term_accept: "Примите эти фиксированные условия"
 bfl_term_decline: "Сохранить существующий аккаунт"
 bfl_term_deposit: "Срочный депозит"
 bfl_term_deposits_desc: "Торговцы не всегда могут использовать свои деньги сразу. Доверяя его банковскому дому на согласованный срок, они предоставляют банкиру более стабильный источник капитала и получают компенсацию за отказ от немедленного доступа к своим средствам."
 bfl_term_offer_1_desc: "Обнови свой повзрослевший [ROOT.GetCountry.MakeScope.GetVariable('bfl_deposit_offer_principal').GetValue|2] золотая основная сумма для 12 месяцев в [ROOT.GetCountry.MakeScope.GetVariable('bfl_deposit_offer_rate').GetValue|%1] ежегодно. Начисленные проценты остаются к уплате отдельно. Новый принципал не переносится. Срок действия этого предложения истекает в конце месяца; измененные претензии требуют нового предложения."
 bfl_term_offer_1_title: "Продлить срочный депозит"
 bfl_term_offer_2_desc: "Очередь на досрочный вывод [ROOT.GetCountry.MakeScope.GetVariable('bfl_deposit_offer_principal').GetValue|2] золотой основной долг после отмены [ROOT.GetCountry.MakeScope.GetVariable('bfl_deposit_offer_penalty').GetValue|2] золото начисленных процентов (не более 1% принципала). Никакого основного наказания не применяется. Нехватка наличных денег остается в очереди на снятие средств. Срок действия этого предложения истекает в конце месяца; измененные претензии требуют нового предложения."
 bfl_term_offer_2_title: "Предложение досрочного вывода средств"
 bfl_term_service_1: "Продлить первый срочный счет"
 bfl_term_service_1_act: "$bfl_term_service_1$"
 bfl_term_service_1_desc: "Запросите предложение срочного обслуживания в выбранном банке. При приемке сохраняются неоплаченные претензии и повторно проверяется формирование партии."
 bfl_term_service_1_effect_text: "$bfl_term_service_1$"
 bfl_term_service_1_effect_text_past: "$bfl_term_service_1$"
 bfl_term_service_1_tip: "Выбирает первый подходящий лот на определенный срок. Банк представляет фиксированные условия для явного акцепта. Для продления требуется текущий допуск и разрешение на срок; ранний выход и зрелый выход остаются доступными после потери отношений или авторитета. Измененные или истекшие котировки не могут быть исполнены."
 bfl_term_service_2: "Запросить досрочный вывод средств"
 bfl_term_service_2_act: "$bfl_term_service_2$"
 bfl_term_service_2_desc: "Запросите предложение срочного обслуживания в выбранном банке. При приемке сохраняются неоплаченные претензии и повторно проверяется формирование партии."
