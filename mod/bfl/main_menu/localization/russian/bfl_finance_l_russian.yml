 bfl_money_leave: "Покинуть поляну"
 bfl_money_leave_tip: "Банкноты обменивают монету на полностью зарезервированное требование. Принятие является добровольным. Скидки заранее 75 золото против 100-золотой вексель третьего банка. Клиринговые расчеты производятся по счетам с наступившим сроком погашения только тогда, когда каждый участник может оплатить свой чистый дебет. Существующие претензии сохраняются после утраты авторитета и зданий."
 bfl_money_lending_rate: "Новая кредитная база"
 bfl_money_lending_rate_tip: "Циклически перемещайте годовую базу для будущих обычных кредитов через 3%, 6% и 9%. Корректировки по заемщикам все еще применяются. Принятые кредиты сохраняют свои ставки."
 bfl_money_notes: "Приобретать 100 в примечаниях"
 bfl_money_notes_tip: "Требуется исследование абсолютизма, центрального банка и суверенных банкнот, действующее государственное разрешение, завершенное отделение банка эмитента и завершенный центральный банк суверенного государства в текущем капитале, 100 золото казначейства и неиспользованная банкнотная емкость. Меньший из 25% банковский капитал и 500 обращение золотых шапок."
 bfl_money_offer_accept: "Финансируйте обеспеченный аванс"
 bfl_money_offer_accept_tip: "Фонд 75 золото из имеющихся денежных средств кредитора, если текущий управляющий, котировка и залог третьего банка остаются в силе. Принятая годовая ставка фиксирована для этого объекта; как минимум плата за государственную поддержку 9%."
 bfl_money_offer_decline: "Отклонить запрос"
 bfl_money_offer_decline_tip: "Закройте этот запрос, не перемещая золото и не внося залог."
 bfl_money_offer_desc: "заранее 75 золото против отдельно финансируемого 100-золотой вексель, хранящийся в третьем банке. А 25% стрижка защищает кредитора. Принятая годовая ставка дисконтирования применяется в течение одного месяца; как минимум плата за государственную поддержку 9%. В рамках урегулирования сначала выплачивается кредитору, а оставшаяся часть возвращается заемщику. Необеспеченное обеспечение сохраняет оба требования. Срок действия этого запроса истекает в этом месяце."
 bfl_money_offer_title: "Надежный расчетный центр"
 bfl_money_policy_rate: "Циклическая будущая ставка дисконтирования"
 bfl_money_policy_rate_tip: "Циклически меняйте годовую ставку для будущих обеспеченных авансов через 6%, 9% и 12%. Плата за один месяц взимается при приеме; существующие объекты сохраняют свою плату. Минимум плата за государственную поддержку 9%."
 bfl_money_redeem: "Погасить государственные банкноты"
 bfl_money_redeem_tip: "Погасить все облигации, принадлежащие суверенному контролеру, по их номинальной стоимости. Утрата авторитета, исследований или ветвей не отменяет существующих претензий. Неоплаченное требование остается невыплаченным."
 bfl_money_repay: "Погашение обеспеченного объекта"
 bfl_money_repay_tip: "Погасите текущий обеспеченный аванс плюс фиксированную принятую комиссию, чтобы освободить залог по векселю третьего банка. Требуется достаточно доступного золота."
 bfl_money_revoke: "Отозвать полномочия"
 bfl_money_revoke_tip: "Отозвать суверенное разрешение на новые банкноты. Существующие банкноты остаются погашаемыми."
 bfl_money_settings: "Политика"
 bfl_money_settings_tip: "Покажите или скройте денежно-кредитную политику, обратите внимание на полномочия, обеспеченный кредитный и клиринговый контроль."
 bfl_money_settings_tip_tip: "Банкноты обменивают монету на полностью зарезервированное требование. Принятие является добровольным. Скидки заранее 75 золото против 100-золотой вексель третьего банка. Клиринговые расчеты производятся по счетам с наступившим сроком погашения только тогда, когда каждый участник может оплатить свой чистый дебет. Существующие претензии сохраняются после утраты авторитета и зданий."
 bfl_money_subtitle: "Погашаемые претензии · накопительное урегулирование"
 bfl_money_subtitle_tip: "Банкноты обменивают монету на полностью зарезервированное требование. Принятие является добровольным. Скидки заранее 75 золото против 100-золотой вексель третьего банка. Клиринговые расчеты производятся по счетам с наступившим сроком погашения только тогда, когда каждый участник может оплатить свой чистый дебет. Существующие претензии сохраняются после утраты авторитета и зданий."
 bfl_money_terms: "Основная сумма и эмиссия исключены из дохода. Ставки дисконтирования являются годовыми и фиксируются при их принятии. Уверенность падает до 25 о недостаче резервов; полностью обеспеченные банкноты не добавляют инфляции. В платежах Vanilla по-прежнему используется самородное золото."
 bfl_money_terms_tip: "Банкноты обменивают монету на полностью зарезервированное требование. Принятие является добровольным. Скидки заранее 75 золото против 100-золотой вексель третьего банка. Клиринговые расчеты производятся по счетам с наступившим сроком погашения только тогда, когда каждый участник может оплатить свой чистый дебет. Существующие претензии сохраняются после утраты авторитета и зданий."
 bfl_money_title: "Деньги и расчеты"
 bfl_money_title_tip: "Основная сумма и эмиссия исключены из дохода. Ставки дисконтирования являются годовыми и фиксируются при их принятии. Уверенность падает до 25 о недостаче резервов; полностью обеспеченные банкноты не добавляют инфляции. В платежах Vanilla по-прежнему используется самородное золото."
 bfl_native_credit_label: "Кредитный портфель"
 bfl_native_tab: "Государственные кредиты"
 bfl_native_takeover: "Родное поглощение"
 bfl_new_capital_subscription: "Подпишитесь на новую столицу"
 bfl_new_capital_subscription_desc: "Инвестировать 100@gold! средств вашего банка в [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_issuer').GetCountry.GetName] в качестве вновь выпущенных акций по их материальной чистой стоимости. Эмитент получает платеж, а существующие держатели акций размываются. Это подписка на капитал, отдельная от покупки акций. Исполнение перепроверяет захваченную СМА, выданные юниты, исследования, защищенные фонды и лимит концентрации. Он потребляет одного дипломата и запускает месячный период восстановления торговли этого эмитента."
 bfl_new_capital_subscription_tip: "Первичное финансирование: инвестировать 100 золото из управляемого банка. Эмитент получает денежные средства и выпускает новые акции. Это отличается от торговли существующими акциями."
 bfl_no_automatic_tribute: "Нет автоматического чартерного сбора"
 bfl_no_automatic_tribute_cost_modifier: "Автоматическая стоимость чартерного дани"
 bfl_no_bank: "Учредите существующий государственный банк посредством решений или сыграйте за независимую банковскую страну. Чтобы открыть банк, ваша страна должна владеть своим рынком капитала."
 bfl_nobles_estate_workout_mandate: "Мандат на тренировки по недвижимости"
 bfl_nobles_estate_workout_mandate_desc: "Это имущество прямо уполномочивает свое правительство пересматривать добровольные меры по урегулированию банковских депозитов от его имени. Каждое предложение по-прежнему требует отдельного принятия. Отзыв этой привилегии делает недействительными ожидающие рассмотрения условия наследства. Выплаты по восстановлению продолжают поступать в кошелек недвижимости."
 bfl_offer_bank_shares: "Предложить новые акции банка"
 bfl_offer_bank_shares_tip: "Разрешить другим банкам и странам подписаться 100 золото по текущей стоимости чистых активов банка. Новые акции выпускаются только после оплаты; существующие владельцы размыты. По-прежнему необходимы исследования в области отечественного банковского дела и положительный капитал."
 bfl_offer_bond: "Предложить суверенные облигации, принадлежащие банку"
 bfl_offer_bond_tip: "Перечислите старейшие банковские облигации сроком на три месяца на 98% номинальной стоимости. Для продажи и покупки требуется готовое здание фондовой биржи. При приемке перепроверяется продавец, текущий держатель, генерация, средства и срок действия. Задолженность блокирует торговлю."
 bfl_offer_bond_workout_01: "Предложить реструктуризацию"
 bfl_offer_bond_workout_01_tip: "Попросите текущего владельца принять 20% сокращение основной суммы и невыплаченных купонов, а также сокращение годового купона на один процентный пункт с 1% пол. Никакие деньги не перемещаются, если держатель отдельно не примет их. Срок действия ценового предложения истекает в этом месяце, и изменения в заявлении делают его недействительным."
