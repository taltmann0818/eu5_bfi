 bfl_chart_empty: "Нет зарегистрированных активов"
 bfl_chart_equity_01: "Капитал: [Country.MakeScope.GetVariable('bfl_history_equity_01').GetValue|2]@gold! · отчетный месяц [Country.MakeScope.GetVariable('bfl_history_period_01').GetValue|0]"
