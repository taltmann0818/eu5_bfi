l_russian:
 wisselbank_desc: "Городской обменный банк собирает монеты и векселя под крышей старой ратуши, упорядочивая торговлю через границы. Его резервы и аккуратные книги поддерживают доверие к государственному кредиту. Завершённый Wisselbank снижает административные расходы привилегированного банка на 15% и открывает денежные услуги после необходимых исследований."
 riksbank_desc: "Под опекой сословий постоянный банк хранит резервы королевства и упорядочивает государственный кредит. Его служащие принимают вклады, погашают обязательства и сохраняют доверие к обещаниям государства. Завершённый Riksbank снижает административные расходы привилегированного банка на 15% и открывает денежные услуги после необходимых исследований."
