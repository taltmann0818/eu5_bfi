l_russian:
 central_bank_desc: "Центральное учреждение по хранению резервов и упорядочению государственного кредита объединяет разрозненный финансовый бизнес под одной крышей. Зарегистрированный банк, поддерживаемый завершенным Центральным банком, платит 15% меньше административных расходов и получает доступ к денежным услугам по мере изучения необходимых достижений. Векселя остаются обеспеченными обязательствами; их выпуск не приносит банку прибыли."
