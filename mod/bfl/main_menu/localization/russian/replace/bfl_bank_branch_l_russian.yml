l_russian:
 banking_office: "Филиал Банка"
 banking_office_desc: "Местное отделение банка. Новые суверенные кредиты, депозиты и инвестиции требуют наличия законченного филиала, принадлежащего банку, в текущем суверенном капитале. Существующие претензии остаются в силе; Для межбанковского бизнеса не требуется филиала."
