l_russian:
 banking_office: "Филиал Банка"
 banking_office_desc: "Местное отделение банка. Государь с привилегированным банком может оплачивать зарубежные филиалы через обычное строительство с учётом отношений с хозяином и стандартных требований. Завершённый филиал принадлежит банку. Новые государственные кредиты, вклады и инвестиции требуют завершённого филиала банка в нынешней столице государя. Существующие требования продолжают обслуживаться."
