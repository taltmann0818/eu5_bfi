l_russian:
 AUTOMATED_SYSTEM_CREDIT: "Кредитный менеджмент"
 AUTOMATED_SYSTEM_CREDIT_DESC: "Управляйте государственными кредитами и облигациями. Ваш банк также рассматривает поглощения кредитов, предлагает финансируемые кредиты заемщикам, которым нужны наличные, и инвестирует свободные деньги в исследуемые акции. Компании управляют торговлей и разведкой. Банк сохраняет резервы и проверяет долговую способность; заемщики должны принимать новые кредиты."
 AUTOMATE_SYSTEM_TOOLTIP_CREDIT: "Включите управление кредитами в автоматизации: государственный долг, банковское кредитование, инвестиции и операции компании."
 DEAUTOMATE_SYSTEM_TOOLTIP_CREDIT: "Отключите кредитный менеджмент. Существующие кредиты, депозиты и обещанные платежи продолжают обслуживаться."
