 bfl_cost_current: "현재 월별 비용: #R [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_operating_expense')|2]@gold!#!"
 bfl_cost_payment_detail: "비용은 자산 가치가 아니라 복잡성에 따라 증가합니다. 보호 적립금 이상으로 월 1회 청구됩니다. 미지급 비용으로 인해 배당금이 제한됩니다. 예금이자 및 기본 비용은 별도입니다. 감소는 함께 추가됩니다. 총액은 센트로 반올림됩니다."
