 bfl_bond_secured_accept_tip: "독점적인 2년 수익 서약 및 무역 보호 양보와 함께 견적된 감소액을 수락하세요. 실제 집행은 사용 가능한 발행자 현금에 따라 제한됩니다."
 bfl_bond_summary_tip: "원금, 매월 갚아야 할 이자와 신규 대출 여유가 있습니다."
 bfl_bond_underwriting: "채권 인수"
 bfl_bond_underwriting_tip: "#T 채권 인수#!\n귀하의 공인 은행은 맞춤형 국채에 대해 실제 현금을 지불합니다. 두 전문 분야 모두 인수할 수 있습니다. 고정 연간 쿠폰은 매월 지급됩니다. 현재 보유자는 상환 시 액면가를 받습니다. 발행에는 은행 유동성, 자본 및 주권 능력이 필요합니다."
 bfl_bond_unpaid: "미지급쿠폰"
 bfl_bond_workout_accept: "채권 구조조정을 받아들여라"
 bfl_bond_workout_desc: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_bond_workout_issuer').GetCountry.GetName] 현재 보유자인 귀하에게 포기를 요청합니다. 20% 이 채권의 원금과 미지급 이표를 삭감하고 연간 이표를 1% 포인트 줄입니다. 1% 바닥. 거부하면 모든 조건이 유지됩니다. 제안은 이번 달에 만료됩니다. 지불, 송금 또는 기타 변경으로 인해 무효화됩니다. 일반적인 수락은 새로운 보안을 제공하지 않습니다. 제안된 경우, 확보된 수락에는 2년간의 무역 보호 양보와 최대 10% 미지급 쿠폰에 대한 월 소득. 집행에서는 다른 맞춤형 채권 쿠폰보다 먼저 사용 가능한 재무부 금만 사용합니다. 보증이나 원금 지급이 발생하지 않습니다."
 bfl_bond_workout_secured: "2년간의 무역 양보 및 수익 서약으로 수락"
 bfl_bond_workout_title: "채권 구조조정 제안"
 bfl_bonds_short: "국채"
 bfl_bonds_short_tip: "은행에서 빌리거나 기존 채권을 검토하세요."
 bfl_borrow_amount: "은행에서 빌리세요"
 bfl_borrow_amount_desc: "새로운 국채의 원금을 선택합니다. 은행은 주정부에 비용을 지불하고 채권을 보유합니다. 이자는 매달 지급됩니다. 확인 시 현금, 자본금, 부채 한도, 공유 월별 한도 등을 확인합니다."
 bfl_borrow_amount_tip: "대출 금액을 선택하세요. 지금 이용 가능: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bfl_bond_draw_max')|0]@gold!. 월별 한도는 주 소득에 따라 조정됩니다. 자금을 조달한 각 발행물은 하나의 채권을 생성합니다."
 bfl_branch_construction: "캐피탈은행 지점 설립"
 bfl_branch_required: "새로운 주권 사업을 위해서는 현재 자본금에 이 은행의 완성된 은행 지점이 필요합니다. 은행 간 사업은 면제됩니다. 기존 청구권은 여전히 ​​남아 있습니다."
 bfl_browse_bond_issuers: "발행자 및 보유 자산 찾아보기"
 bfl_browse_bond_issuers_desc: "은행이 보유한 청구권을 포함하여 미결제 채권 및 제안을 검사할 발행자를 선택하세요."
 bfl_browse_bond_issuers_tip: "뛰어난 맞춤형 채권을 보유하고 있는 실제 발행자를 선택하세요. 이것은 아무것도 사거나 팔지 않습니다."
 bfl_browse_goods: "상품 제안 및 양육권 청구"
 bfl_browse_goods_act: "$bfl_browse_goods$"
 bfl_browse_goods_desc: "물리적 보관 제안, 기존 청구 또는 자발적인 관세청 접근 계약을 검토하십시오. 국가를 선택하면 돈이 움직이지 않습니다."
 bfl_browse_goods_effect_text: "$bfl_browse_goods$"
 bfl_browse_goods_effect_text_past: "$bfl_browse_goods$"
 bfl_burghers_estate_workout_mandate: "부동산 운동 명령"
 bfl_burghers_estate_workout_mandate_desc: "이 부동산은 정부가 자신을 대신하여 자발적인 은행 예금 워크아웃을 검토할 수 있는 권한을 명시적으로 부여합니다. 모든 제안은 여전히 ​​별도의 승인이 필요합니다. 이 특권을 취소하면 보류 중인 유산 조건이 무효화됩니다. 복구 지불은 자산 지갑으로 계속됩니다."
 bfl_buy_bill: "자금 조달 청구서 · 100 금"
 bfl_buy_bill_tip: "#T 자금 조달 청구서#!\n환승 100 자금이 조달된 지불 청구서를 위해 은행에 금을 명시하십시오. 청구서는 은행 이익이나 무담보 대출이 아닌 미지급금으로 기록됩니다. 상업 어음 조사, 계약 테이블 공간 및 이 사업을 수락하는 운영 은행이 필요합니다."
 bfl_buy_capital: "자본금 · 청약 100 금"
 bfl_buy_capital_tip: "#T 은행캐피털 구독#!\n환승 100 새로운 은행 소유권 단위를 구입하기 위해 금을 주화하십시오. 단위는 기존 단위당 긍정적인 은행 자산을 기준으로 가격이 책정됩니다. 이는 이익보다는 은행 현금과 납입 자본을 증가시킵니다. 기본 은행 연구, 자본 테이블 공간 및 이 비즈니스를 수락하는 운영 은행을 통해 잠금 해제됩니다. 자본은 손실에 노출되어 있으며 예금으로 인출될 수 없습니다."
 bfl_buy_confirm_desc: "구매 [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_quantity').GetValue|3] 주식 [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_issuer').GetCountry.GetName] 에 대한 [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_total').GetValue|2]@gold!. 이는 시장 조성자 재고의 기존 주식입니다. 발행자는 자금 조달을 받지 않으며 발행된 주식은 변경되지 않습니다. 견적 가격, 실시간 시장 접근, 사용 가능한 단위, 보호된 현금 및 집중 한도는 승인 시 다시 확인됩니다. 결제에는 외교관 한 명이 소모되며 해당 발행자의 1개월 구매/판매 휴지 기간이 시작됩니다."
 bfl_buy_confirm_title: "주식매수 확인"
 bfl_buy_secondary_confirm_desc: "구매 [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_quantity').GetValue|3] 기존 주식 [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_issuer').GetCountry.GetName] 에서 [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_seller').GetCountry.GetName] 에 대한 [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_total').GetValue|2]@gold!. 현재 판매자가 대금을 받습니다. 발행자는 자금 조달을 받지 않으며 발행된 주식은 변경되지 않습니다. 가용성, 액세스, 보호 자금 및 이 제안의 개정은 수락 시 다시 확인됩니다. 결제에는 외교관 한 명이 소모되며 해당 발행자의 1개월 구매/판매 휴지 기간이 시작됩니다."
 bfl_buy_selected_bond: "기존 소유권 주장 구매"
 bfl_buy_selected_bond_tip: "현재 판매자에게 제시된 가격을 지불하세요. 발행자는 새로운 돈을 받지 않습니다. 실행은 소유권, 만료, 생성, 교환, 연체금 및 현금을 다시 확인합니다."
 bfl_buy_shares: "주식 구매"
 bfl_buy_shares_desc: "은행이나 회사를 선택하고 지분 수량을 설정한 후 총액을 검토하세요. 매수는 매도 제안 또는 시장 조성자 재고에서 기존 주식을 이전합니다. 새로운 발행에 자금을 조달하려면 별도의 자본 청약 조치를 사용하십시오."
 bfl_buy_shares_tip: "은행이나 회사를 선택하고 지분 수량을 설정한 후 총액을 검토하세요. 매수는 매도 제안 또는 시장 조성자 재고에서 기존 주식을 이전합니다. 새로운 발행에 자금을 조달하려면 별도의 자본 청약 조치를 사용하십시오.\n완료된 교환, 주식 거래 및 최소 한 명의 외교관이 필요합니다. 거래가 성공할 때마다 외교관 한 명이 소모되며 해당 발행자에 대해 1개월의 휴지 기간이 시작됩니다. 가능한 외교관: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bfl_available_trade_diplomats')|2]. 주문 금액은 현금 가치 이상이어야 합니다. 0.01 금."
 bfl_buy_sovereign_bond: "제안된 국채를 구매하세요"
 bfl_buy_sovereign_bond_act: "$bfl_buy_sovereign_bond$"
 bfl_buy_sovereign_bond_desc: "현재 보유자로부터 기존 국채를 구매합니다. 소유하고 완성된 증권 거래소 건물이 필요합니다."
 bfl_buy_sovereign_bond_effect_text: "$bfl_buy_sovereign_bond$"
 bfl_buy_sovereign_bond_effect_text_past: "$bfl_buy_sovereign_bond$"
 bfl_buy_sovereign_bond_tip: "공개 제안의 발행자를 선택합니다. 지불금은 기존 보유자에게 전달됩니다. 발행자는 새로운 수익금을 받지 않습니다. 전체 청구권은 고정된 연간 쿠폰과 원금을 그대로 유지하면서 소유권이 변경됩니다."
 bfl_buy_state_confirm_desc: "다시 구매 [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_quantity').GetValue|3] 기존 주식 [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_issuer').GetCountry.GetName] 시장조성자 재고로부터 [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_total').GetValue|2]@gold!, 귀하의 국가 재무부에서 지불됩니다. 이 주식은 귀하의 재무 지분으로 반환됩니다. 은행은 자금 조달을 받지 않으며 발행된 주식은 변경되지 않습니다. 사용 가능한 딜러 재고, 현재 시장 시세, 실시간 전세 권한 및 재무부 현금이 다시 확인됩니다. 정착에는 외교관 한 명이 소모되며 이 은행의 1개월 구매/판매 휴지 기간이 시작됩니다."
 bfl_cancel: "취소"
 bfl_cancel_selected_bond_offer: "목록 취소"
 bfl_cancel_selected_bond_offer_tip: "귀하 또는 귀하의 라이브 전세 은행이 소유한 상품을 인출하십시오. 부채와 쿠폰은 변경되지 않습니다."
