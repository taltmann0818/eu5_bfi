 bfl_capital_heading: "은행자본"
 bfl_cash: "현금"
 bfl_cash_detail_title: "현금 [Country.GetName]"
 bfl_cash_tip: "#T 재무부 현금#!\n현재 은행이 보유하고 있는 금입니다.\n\n총 현금: [Country.GetFixedPointCurrencyValue('gold')|2]@gold!\n보호된 현금: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_protected_cash')|2]@gold!\n사용 가능한 현금: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_free_cash')|2]@gold!\n\n보호된 현금 준비금 25% 인출 대기 후 남은 부채, 전체 인출 대기열, 25 금 운영 버퍼 및 약정 현금. 사용 가능한 현금은 재무부 현금에서 준비금을 뺀 금액이며 최소 금액은 0입니다. 보호된 현금은 필수 준비금입니다. 실제로 보유하고 있는 현금을 초과할 수 있습니다."
