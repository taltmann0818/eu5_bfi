 bfl_venture_accept: "파트너십을 수락하세요"
 bfl_venture_accept_tip: "실시간 투자자 권한, 변경되지 않은 제안 조건, 연령, 연구, 무료 현금, 자본, 용량 및 운영자 기여를 다시 확인하십시오. Funding은 선택한 활동의 ​​실제 기본 비용만 지불합니다. 이는 회사 지분이나 정치적 통제권을 부여하지 않습니다."
 bfl_venture_decline: "거절하다"
 bfl_venture_duration_12: "기간 · 12 개월"
 bfl_venture_duration_120: "기간 · 120 개월"
 bfl_venture_duration_24: "기간 · 24 개월"
 bfl_venture_duration_6: "기간 · 6 개월"
 bfl_venture_duration_60: "기간 · 60 개월"
 bfl_venture_duration_tip: "주기 6, 12, 24, 60 또는 120 개월. 장기적으로는 원주민 탐험을 수용할 수 있습니다. 기본 액세스가 유효한 경우 화물은 2개월 후에 판매됩니다. 막힌 화물은 계속 보관됩니다. 연계된 판매대금이 없는 원정비용은 만기 시 상각됩니다."
 bfl_venture_empty: "활발한 벤처가 없습니다. 조건을 제시하기 전에 화물 운영이나 현지 탐험을 선택하세요."
 bfl_venture_help: "순환하려면 용어를 클릭하세요. 각 운영자는 별도로 수락합니다. 기존 계약은 정책이나 연구 변경 후에도 계속됩니다."
 bfl_venture_hint: "활동, 비용, 화물 및 반품을 보려면 마우스를 올리세요."
 bfl_venture_locked: "새로운 벤처가 잠김 · 요구사항을 확인하기 위해 마우스를 가져가세요"
 bfl_venture_note: "자본은 이익보다 먼저 회수됩니다. 손실은 기여에 따릅니다. 지정된 운영에서 인수한 화물만이 수익금을 조달할 수 있습니다. 관련 없는 거래는 이 계약에 대한 비용을 지불하지 않습니다. 발견만으로는 아무것도 지불하지 않습니다. 닫힌 행은 새로 수락된 계약으로 대체될 때까지 남아 있습니다."
 bfl_venture_offer_desc: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_bank').GetCountry.GetName] 제안 [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_ticket').GetValue|0] 금 [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_duration').GetValue|0] 개월. 프리셋 [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_preset').GetValue|0]: 0 = 투자자는 모든 자본을 자금으로 조달하고 받습니다. 75% 잉여; 1 = 투자자는 2/3, 운영자는 1/3, 잉여분은 균등하게 분배됩니다. 자본이 먼저 회수됩니다. 손실은 기여에 따릅니다. 지정된 운영의 실제 판매 수익만이 수익을 지급할 수 있습니다. 탐험 성공은 금이 아닌 기회를 제공합니다. 이 제안은 3개월 후에 만료됩니다."
 bfl_venture_offer_desc_0: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_bank').GetCountry.GetName] 최대 승인 [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_ticket').GetValue|0] 은행 자금 조달의 금 [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_duration').GetValue|0] 개월. 구매 10 [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_good').Goods.GetNameWithNoTooltip] 안으로 [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_from').GetMarket.GetName], 두 달간 휴대한 후 판매하세요 [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_to').GetMarket.GetName]. 은행은 모든 비용을 조달하고 수령합니다. 75% 잉여.\n\n실제 기본 비용만 추출됩니다. 사용하지 않은 자금은 은행에 보관됩니다. 자본은 잉여 이전에 회수됩니다. 손실은 기여에 따릅니다. 이 화물의 측정된 판매 수익만이 이 계약을 체결합니다. 관련 없는 수입과 발견은 비용을 지불하지 않습니다. 제안은 3개월 후에 만료됩니다."
 bfl_venture_offer_desc_1: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_bank').GetCountry.GetName] 최대 승인 [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_ticket').GetValue|0] 은행 자금 조달의 금 [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_duration').GetValue|0] 개월. 구매 10 [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_good').Goods.GetNameWithNoTooltip] 안으로 [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_from').GetMarket.GetName], 두 달간 휴대한 후 판매하세요 [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_to').GetMarket.GetName]. 은행은 비용의 2/3를 지원합니다. 당신은 3분의 1을 지불합니다. 잉여분은 균등하게 분배됩니다.\n\n실제 기본 비용만 추출됩니다. 사용하지 않은 자금은 은행에 보관됩니다. 자본은 잉여 이전에 회수됩니다. 손실은 기여에 따릅니다. 이 화물의 측정된 판매 수익만이 이 계약을 체결합니다. 관련 없는 수입과 발견은 비용을 지불하지 않습니다. 제안은 3개월 후에 만료됩니다."
 bfl_venture_offer_desc_2: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_bank').GetCountry.GetName] 최대 승인 [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_ticket').GetValue|0] 은행 자금 조달의 금 [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_duration').GetValue|0] 개월. 기본 탐색 준비 [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_area').GetArea.GetName] 에서 [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_port').GetLocation.GetName] 와 [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_explorer').GetCharacter.GetName]. 은행은 합의된 모든 금 비용에 자금을 지원하고 수령합니다. 75% 계약상 잉여. 준비 과정은 취소를 포함하여 환불되지 않습니다. 귀하는 이 자금 계약 외에 승무원, 현지 유지비 및 선택적인 원정 지출을 제공합니다. 남은 은행 승인은 현지 접근에 따라 발견된 지역의 중심이나 경계에 있는 시장에서 10개 단위의 화물 1개에 자금을 지원할 수 있습니다. 기록된 준비 및 화물 비용을 제외한 해당 화물의 측정된 판매액만이 계약상의 잉여금을 지불할 수 있습니다. 발견과 관련 없는 거래에는 비용이 전혀 들지 않습니다. 이 제안은 3개월 후에 만료됩니다. "
 bfl_venture_offer_desc_3: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_bank').GetCountry.GetName] 최대 승인 [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_ticket').GetValue|0] 은행 자금 조달의 금 [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_duration').GetValue|0] 개월. 기본 탐색 준비 [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_area').GetArea.GetName] 에서 [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_port').GetLocation.GetName] 와 [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_explorer').GetCharacter.GetName]. 은행은 합의된 금 비용의 3분의 2를 자금으로 조달합니다. 당신은 3분의 1을 지불합니다. 계약상 잉여금은 균등하게 분할됩니다. 준비 과정은 취소를 포함하여 환불되지 않습니다. 귀하는 이 자금 계약 외에 승무원, 현지 유지비 및 선택적인 원정 지출을 제공합니다. 남은 은행 승인은 현지 접근에 따라 발견된 지역의 중심이나 경계에 있는 시장에서 10개 단위의 화물 1개에 자금을 지원할 수 있습니다. 기록된 준비 및 화물 비용을 제외한 해당 화물의 측정된 판매액만이 계약상의 잉여금을 지불할 수 있습니다. 발견과 관련 없는 거래에는 비용이 전혀 들지 않습니다. 이 제안은 3개월 후에 만료됩니다. "
 bfl_venture_offer_title: "칭찬 파트너십"
 bfl_venture_outcome_1: "연결된 기본 탐사 진행 중"
 bfl_venture_outcome_10: "비용 또는 활동이 변경됨 · 승인이 해제됨"
 bfl_venture_outcome_2: "발견 기록 · 상업 영수증은 여전히 필요함"
 bfl_venture_outcome_3: "확인된 발견 없이 탐험이 종료되었습니다."
 bfl_venture_outcome_4: "운송중인 화물 · 기본 구매 실행"
 bfl_venture_outcome_5: "배송이 차단됨 · 인수된 화물이 보관됨"
 bfl_venture_outcome_6: "화물 판매 · 측정된 수익금만 정산됨"
 bfl_venture_outcome_7: "레거시 결선 · 활동으로 인한 잉여 없음"
 bfl_venture_outcome_8: "기본 준비 또는 결과 확인 대기 중"
 bfl_venture_outcome_9: "운영자가 더 이상 존재하지 않음 · 양육권 침해"
 bfl_venture_policy: "이용약관"
 bfl_venture_preset_0: "일방적 · 75% 은행 흑자"
 bfl_venture_preset_1: "양자·균등잉여"
 bfl_venture_preset_tip: "일방적: 은행이 모든 자본에 자금을 지원하고 수령합니다. 75% 잉여. 양자간: 은행 자금의 2/3, 운영자의 1/3, 잉여분을 균등하게 분배합니다. 손실은 자본 기여에 따릅니다."
 bfl_venture_settings_tip: "제안된 용어를 확장합니다. 변경 사항은 향후 제안에만 영향을 미칩니다. 승인된 프로젝트는 원래 계약을 유지합니다."
 bfl_venture_state_1: "활성 · 위험에 처한 자본"
 bfl_venture_state_2: "폐쇄 · 자본회수"
 bfl_venture_state_3: "휴업 · 손실 인정"
 bfl_venture_state_4: "자금이 지원되지 않음 · 실행 불가"
 bfl_venture_subtitle: "명명된 활동 · 측정된 비용 및 매출"
 bfl_venture_ticket_100: "자금 한도 · 100 금"
 bfl_venture_ticket_200: "자금 한도 · 200 금"
 bfl_venture_ticket_400: "자금 한도 · 400 금"
 bfl_venture_ticket_tip: "최대 은행 승인 주기: 100, 200 또는 400 금. 활동의 실제 비용만 추출됩니다. 사용되지 않은 화물 자금은 즉시 해제됩니다. 사용하지 않은 탐험 자금은 만기까지 적격한 발견 지역 화물을 위해 예약되어 있습니다. 양자간 조건은 운영자로부터 은행 승인의 절반에 해당하는 용량을 요구합니다."
 bfl_venture_title: "코멘다 벤처"
 bfl_ventures: "벤처 및 기업 · 해외투자"
 bfl_ventures_explanation: "Commenda는 Discovery에서 시작됩니다. 원주민 회사와 회사 자산에는 개혁이 필요합니다. 정치적 대군주 통제와 재정적 소유권은 분리되어 있습니다. 프로젝트 자본은 배당금이 아닙니다."
 bfl_ventures_tip: "#T 벤처와 기업#!\n자금 지원 벤처, 회사 투자, 프로젝트 보안 및 은행 지분 이전에 대한 허가. 이는 자본을 투자 위험에 노출시키고 관련 연구와 전문화가 필요합니다."
 bfl_warehouse_receipt: "창고 영수증"
 bfl_warehouse_receipt_tip: "#T 창고 영수증#!\n식별 가능한 보관 물품에 대해 청구서를 발행합니다. 창고 영수증 연구, 상인 금융 및 절대주의 시대 이상이 필요합니다. 이 빌드에서는 확인된 저장 및 상품 실행을 사용할 수 없습니다."
 bfl_warehouse_receipts: "창고 영수증"
 bfl_warehouse_receipts_desc: "평판이 좋은 창고에 보관된 상품은 판매할 때마다 이동하지 않고도 상업을 지원할 수 있습니다. 영수증은 보관된 상품에 대한 청구권을 확립하므로 소유자는 상품을 보관하는 동안 자금을 확보할 수 있습니다."
 bfl_withdraw: "만기 국예금 인출"
 bfl_withdraw_tip: "#T 만기 국예금 인출#!\n해당 주의 수요 계정 및 만기 기간 계정에 대한 상환을 요청하세요. 은행은 사용 가능한 현금에서 원금과 적립된 이자를 지불합니다. 미지급 금액은 출금 대기열에 계속 기록되며 신규 거래가 중단됩니다. 이 조치로 인해 해외계좌 및 미만기 정기예금은 인출될 수 없습니다."
 bfl_workout_decline: "전체 소유권을 유지하세요"
 bfl_workout_desc: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_workout_bank').GetCountry.GetName] 귀하의 보증금에 대한 조건을 제안합니다 [ROOT.GetCountry.MakeScope.GetVariable('bfl_workout_claim').GetValue|2] 금. 포기할 수도 있습니다 20% 나머지 청구권 중 전체 청구권을 전환 전 유형 NAV로 새로 발행된 주식으로 전환하거나 청구권을 유지하십시오. 전환에는 긍정적인 NAV와 주주 역량이 필요하며 은행 채권자는 전환할 수 없습니다. 채권자 풀 [ROOT.GetCountry.MakeScope.GetVariable('bfl_workout_pool').GetValue|0]: 0 재무부, 1 버거, 2 귀족, 3 성직자, 4 농민. 유산 조건에 따라 유산의 운동 명령이 제정되어야 합니다. 견적은 이번 달에 만료됩니다. 복구 또는 관리 변경으로 인해 무효화됩니다."
 bfl_workout_equity: "청구권을 주식으로 전환하세요(긍정적인 NAV 필요)"
 bfl_workout_haircut: "수락 20% 감소"
 bfl_workout_title: "채권자 워크아웃 제안"
 bfl_workout_trade_access: "워크아웃 트레이드 양보"
 bfl_workout_trade_access_desc: "별도로 허용되는 채권 워크아웃을 통해 최대 2년 동안 무역 보호가 해제됩니다. 기존의 일반 무역 접근 협정은 이 양허와 무관합니다."
