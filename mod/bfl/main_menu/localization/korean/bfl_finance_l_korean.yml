 bfl_equity_subscribe_3_tip: "기본 NAV 구독: 발행자에게 비용을 지불하고 기존 보유자를 희석시킵니다. 부동산 매입은 실제 부동산 지갑을 이용, 보존 25 금. 은행 투자자는 자신의 보호된 현금과 자본 잉여분만을 사용합니다. 회사 지분에는 해외 투자 조사가 필요합니다."
