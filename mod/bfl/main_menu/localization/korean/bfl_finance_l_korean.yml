 AM_bfl_chartered_bank: "차타드 은행"
 LEAD_bfl_chartered_bank: "차터드 은행 컨트롤러"
 MODIFIER_TYPE_DESC_bfl_enable_advanced_clearing: "참여 기관 간의 검증된 상호 의무의 순 결제를 잠금 해제합니다. 청산은 모든 보유자의 자격을 보존하고 돈을 창출하지 않고 자금이 조달된 순 잔액을 정산해야 합니다. 기본 은행 간 결제는 여전히 불가능합니다."
 MODIFIER_TYPE_DESC_bfl_enable_bank_capital_subscriptions: "다음의 기본 구독을 허용합니다. 100 금을 은행으로. 새로운 소유권 단위의 가격은 현재 순자산 가치로 책정됩니다. 청약 수익금은 실현 이익보다는 납입 자본금을 늘리고 후속 분배에 대한 비례 청구권을 구매합니다."
 MODIFIER_TYPE_DESC_bfl_enable_bank_share_dealing: "식별된 보유자 간에 기존 등록 단위를 이동하기 위해 은행 지분 이체 서비스를 허용합니다. 이전은 새로운 단위를 발행하거나 은행 이익을 창출하지 않고 소유권을 변경합니다. 등록소는 수용 능력을 갖추고 각 보유자의 자격을 보존해야 합니다."
 MODIFIER_TYPE_DESC_bfl_enable_collateralization: "기록된 담보 약속과 자격 확인을 잠금 해제합니다. 담보자산은 두 번째 청구권을 확보할 수 없으며 회복은 원래의 부채 관계를 보존해야 합니다. 기본 담보 실행은 계속 사용할 수 없습니다."
 MODIFIER_TYPE_DESC_bfl_enable_commenda: "해외 투자 항해 파트너십 권한을 잠금 해제합니다. 각 벤처에는 식별된 파트너, 자금 지원 자본, 기록된 이익 공유 계약 및 실현 수익금 정산이 필요합니다. 이 개발 빌드에서는 프로젝트 실행을 계속 사용할 수 없습니다."
 MODIFIER_TYPE_DESC_bfl_enable_commercial_bills: "완전히 자금이 조달된 지불 청구서를 허용합니다. 구매자가 지불 100 발행 전 금; 은행은 동일 지급액과 현금 약정을 기록합니다. 지정된 보유자는 한 달 후에 한 번만 해당 청구서를 상환할 수 있습니다. 발행은 이익이 아니다."
 MODIFIER_TYPE_DESC_bfl_enable_commodity_forwards: "Merchant Finance 전달 계약을 잠금 해제합니다. 각 계약은 담보 재고를 재사용하지 않고 상대방, 상품, 수량, 배송 날짜 및 뒷받침을 기록해야 합니다. 기본 거래 실행을 계속 사용할 수 없습니다."
 MODIFIER_TYPE_DESC_bfl_enable_commodity_investments: "Merchant Finance 재고 의무를 잠금 해제합니다. 상품 위치는 자금 지원을 받은 원주민 상품 보유를 나타내고 취득 비용, 수량 및 보관권을 보존해야 합니다. 이 개발 빌드에서는 거래 실행을 계속 사용할 수 없습니다."
 MODIFIER_TYPE_DESC_bfl_enable_company_equity: "해외 투자 회사 지분 위임을 잠금 해제합니다. 금융 지분은 정치적 주체 통제와 별도로 기록됩니다. 검증된 회사 배당금만이 은행 수입이 될 수 있습니다. 구독 및 자본 반환은 제외됩니다. 기본 실행을 계속 사용할 수 없습니다."
 MODIFIER_TYPE_DESC_bfl_enable_corporate_credit: "Merchant Finance 기업 신용 의무를 잠금 해제합니다. 대출은 식별된 기업에 은행 현금을 이체하고 동등한 회수 가능 청구를 생성해야 합니다. 원금 상환은 이익에 포함되지 않습니다. 기본 실행을 계속 사용할 수 없습니다."
 MODIFIER_TYPE_DESC_bfl_enable_debt_restructuring: "주권 구조조정 명령을 해제합니다. 수정된 만기, 이자 및 원금은 채무자의 동의와 함께 기존 청구에 첨부되어야 합니다. 기본 부채 조정이 지원될 때까지는 실행이 불가능합니다."
 MODIFIER_TYPE_DESC_bfl_enable_liquidity_facilities: "확보된 임시 유동성을 잠금 해제합니다. 자금은 실제 거래상대방으로부터 이루어져야 하며 현금 및 자본 한도 내에서 유지되어야 하며 기록된 담보를 보유해야 합니다. 대기 중인 출금은 우선순위를 유지합니다. 기본 시설 실행을 계속 사용할 수 없습니다."
 MODIFIER_TYPE_DESC_bfl_enable_margining_and_risk_management: "Merchant Finance 포워드 포지션에 대한 마진 요구 사항을 잠금 해제합니다. 노출은 사용 가능한 담보 및 현금을 기준으로 측정해야 하며 약속을 늘리기 전에 추가 자금이 필요합니다. 기본 거래 및 마진 실행은 계속 사용할 수 없습니다."
 MODIFIER_TYPE_DESC_bfl_enable_project_security: "해외 투자 프로젝트에 대한 보안을 잠금 해제합니다. 식별된 프로젝트 자산 및 수익금은 단일 기록 채무에 대해 담보로 제공되어야 하며 결제 또는 회수를 통해 우선순위가 유지됩니다. 기본 프로젝트 실행은 계속 사용할 수 없습니다."
 MODIFIER_TYPE_DESC_bfl_enable_public_financial_backstops: "공인된 공인 은행에 대한 공공 백스톱 권한을 잠금 해제합니다. 지원을 위해서는 실제 재무 기부금과 기록된 청구권 또는 소유권 단위가 필요합니다. 보증은 현금을 발행하거나 손실을 지울 수 없습니다. 스탠딩 백스톱 실행은 아직 구현되지 않았습니다."
 MODIFIER_TYPE_DESC_bfl_enable_sovereign_banknotes: "공인된 공인 은행에 대한 주권 발행을 잠금 해제합니다. 메모는 상환 가능한 부채입니다. 백킹에는 채권 자체를 판매하여 조달된 현금이 제외됩니다. 기본 발행 및 보유자 지불 경로는 계속 사용할 수 없습니다."
 MODIFIER_TYPE_DESC_bfl_enable_term_deposits: "고정 금리 예금을 허용합니다 100 12개월 만기의 금. 이자는 계좌 개설 시 허용되는 비율로 매월 발생합니다. 미성숙한 교장은 철회될 수 없습니다. 예금은 은행의 부채로 남아 있습니다."
 MODIFIER_TYPE_DESC_bfl_enable_warehouse_receipts: "식별된 재고 로트로 뒷받침되는 Merchant Finance 영수증을 잠금 해제합니다. 각 영수증에는 10개의 무제한 단위가 예약되어 있으며 자금이 지원되는 보관 수수료가 부과됩니다. 새로운 영수증이 발행되기 전에 원주민 물품 보관이 지원되어야 합니다."
 MODIFIER_TYPE_DESC_bfl_no_automatic_tribute_cost_modifier: "헌장 관계에는 자동 헌납이 없습니다. 주정부 수입은 소유한 은행주에 대한 예금이자 및 배당금에서 나옵니다."
