 bfl_equity_subscribe_4_tip: "기본 NAV 구독: 발행자에게 비용을 지불하고 기존 보유자를 희석시킵니다. 부동산 매입은 실제 부동산 지갑을 이용, 보존 25 금. 은행 투자자는 자신의 보호된 현금과 자본 잉여분만을 사용합니다. 회사 지분에는 해외 투자 조사가 필요합니다."
 bfl_equity_vote_payout_0: "다수결: 0% 배당금 지급"
 bfl_equity_vote_payout_0_tip: "발행된 재정 투표수의 절반 이상이 필요합니다. 회사의 이익잉여금과 독립 은행 지급 정책만 해당됩니다. 공인된 화폐 및 지불금 정책은 실제 착륙한 컨트롤러에 그대로 유지됩니다. 정치적 주체 이전이 없습니다."
 bfl_equity_vote_payout_25: "다수결: 25% 배당금 지급"
 bfl_equity_vote_payout_25_tip: "발행된 재정 투표수의 절반 이상이 필요합니다. 회사의 이익잉여금과 독립 은행 지급 정책만 해당됩니다. 공인된 화폐 및 지불금 정책은 실제 착륙한 컨트롤러에 그대로 유지됩니다. 정치적 주체 이전이 없습니다."
 bfl_equity_vote_payout_50: "다수결: 50% 배당금 지급"
 bfl_equity_vote_payout_50_tip: "발행된 재정 투표수의 절반 이상이 필요합니다. 회사의 이익잉여금과 독립 은행 지급 정책만 해당됩니다. 공인된 화폐 및 지불금 정책은 실제 착륙한 컨트롤러에 그대로 유지됩니다. 정치적 주체 이전이 없습니다."
 bfl_equity_vote_reserve_100: "다수결: 예비 100, 무역예산 50"
 bfl_equity_vote_reserve_100_tip: "다수의 재무 투표로 회사 재투자 준비금과 무역 예산을 선택할 수 있습니다. 정치적 명령, 원주민의 지배권, 현금 및 기존 채권자 청구는 별도로 유지됩니다."
 bfl_equity_vote_reserve_200: "다수결: 예비 200, 무역예산 25"
 bfl_equity_vote_reserve_200_tip: "다수의 재무 투표로 회사 재투자 준비금과 무역 예산을 선택할 수 있습니다. 정치적 명령, 원주민의 지배권, 현금 및 기존 채권자 청구는 별도로 유지됩니다."
 bfl_establish_chartered_bank.a: "기존 주립은행을 선택하세요."
 bfl_establish_chartered_bank.desc: "기존 주립 은행 하나를 전환하고 차터가 완료되면 은행 전통을 얻습니다. 현 시대의 투자 500 / 750 / 1,000 / 1,500 / 2,000 / 3,000 금은 국가 자산으로 재무부에 이전됩니다. 귀하는 자본 시장을 소유해야 합니다. 지불이나 조사가 이루어지기 전에 은행을 선택하십시오."
 bfl_establish_chartered_bank.title: "국영 은행 설립"
 bfl_estate_bond_back: "부동산 관리로 돌아가기"
 bfl_estate_bond_desc: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_managed_estate').GetCountry.GetName] 빚진 [ROOT.GetCountry.MakeScope.GetVariable('bfl_estate_bond_face').GetValue|2] 교장과 [ROOT.GetCountry.MakeScope.GetVariable('bfl_estate_bond_due').GetValue|2] 미지급 쿠폰 [ROOT.GetCountry.MakeScope.GetVariable('bfl_estate_bond_holder').GetCountry.GetName]. 현금회수는 예금과 무담보 클래스를 공유합니다. 자발적인 축소에는 새로운 제안과 해당 보유자의 명시적인 수락이 필요합니다. 지불 또는 수탁자의 변경으로 인해 보류 중인 조건이 무효화됩니다."
 bfl_estate_bond_next: "다음 채권을 선택하세요"
 bfl_estate_bond_title: "부동산 채권 채권자"
 bfl_estate_close_tip: "모든 의무, 비현금 권리 및 소유자를 다시 확인한 후 완전히 정산된 이 자산을 영구적으로 폐쇄하십시오."
 bfl_estate_default_tip: "지치고 파괴된 이 기관을 마무리하십시오. 미지급 채권자 손실을 한 번 기록하고 후배 비용을 소멸시키십시오. 어떤 주주도 수익금을 받지 않습니다."
 bfl_estate_deposit_1: "버거 : 수요 100"
 bfl_estate_deposit_1_act: "$bfl_estate_deposit_1$"
 bfl_estate_deposit_1_desc: "선택한 은행의 풀 수요 계좌에 부동산 금을 넣으세요. 국채예금 프리미엄은 적용되지 않습니다."
 bfl_estate_deposit_1_effect_text: "$bfl_estate_deposit_1$"
 bfl_estate_deposit_1_effect_text_past: "$bfl_estate_deposit_1$"
 bfl_estate_deposit_1_tip: "최소한 보존하면서 이 부동산 풀을 사용합니다. 25 부동산 금. 원금과 이자는 동일한 재산으로 돌아가지 결코 주권 재무부에 돌아가지 않습니다. 반복적으로 일치하는 계정이 집계됩니다. 가구 참여는 이러한 부동산 풀로 표시됩니다."
