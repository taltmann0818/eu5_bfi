 bfl_banking_finance_companies_name: "은행, 금융 및 무역 회사"
 bfl_bardi_chapel_cycle: "바르디 채플 사이클"
 bfl_bardi_chapel_cycle_desc: "바르디라는 이름으로 의뢰받은 피렌체의 프란체스코회 예배당을 위한 프레스코화 시리즈. 성 프란치스코의 생애 장면이 그려진 건축물을 통해 펼쳐집니다. 세속적 소유를 포기하고 가난한 이들을 돌보며 성자의 마지막 축복이 펼쳐집니다. 조용한 얼굴과 고의적인 몸짓은 신성한 이야기에 목격된 사건의 심각성을 부여합니다. 기증자들은 성인들 아래 무릎을 꿇고 있으며, 그들의 값비싼 옷은 수도사의 평범한 습관에 어긋납니다. 대조는 가족의 헌신과 사도적 가난 옆에 막대한 부의 불안한 위치를 모두 선포합니다. 제단 너머에는 바르디 팔이 이 벽의 비용을 지불한 집의 기억을 보존하고 있습니다."
 bfl_bond_accept_tip: "현재 보유자, 청구권 및 권한을 재확인한 후 견적된 원금/쿠폰 감소 및 연간 금리 인하를 수락합니다. 새로운 담보나 현금 지불은 없습니다."
