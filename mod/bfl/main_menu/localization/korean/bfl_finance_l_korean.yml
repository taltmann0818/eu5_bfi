 bfl_strategy_disable: "투자 관리"
 bfl_strategy_disable_tip: "자동 대출 구매, 새로운 전략 제안 및 수요 배치를 중지하세요. 기존 대출, 예금 및 대기 중인 청구에 대한 서비스는 계속 제공됩니다. 상품, 지분 및 지점 정책은 별도로 유지됩니다."
 bfl_strategy_enable: "투자 위임"
 bfl_strategy_enable_tip: "적격 AI 상대방에 대한 기존 기본 대출, 신용 및 화물 제안 및 초과 현금 수요 배치에 대한 점수 매기기 구매를 승인합니다. 유동성이 낮으면 하나의 국채를 상장할 수 있습니다. 98% 얼굴; 승인된 재판매는 손실을 가져올 수 있습니다. Cargo는 귀하의 현재 약관과 일반적인 동의 및 물리적 합의를 사용합니다. 국채 차입, 배당금, 물품 및 통화 당국은 별도의 정책을 유지합니다. 새로운 사업이 해결되지 않습니다."
 bfl_strategy_idle: "마지막 검토: 유동성 유지"
 bfl_strategy_manual: "투자의무·매뉴얼"
 bfl_strategy_recall: "마지막 검토: 예금 회수 요청됨"
 bfl_strategy_resale: "마지막 검토: 유동성을 위해 소유 채권이 제공됩니다."
 bfl_strategy_secondary_statement: "자동 기본 대출 구매: [Country.MakeScope.GetVariable('bfl_strategy_takeovers').GetValue|0] · 채권 재판매 시세: [Country.MakeScope.GetVariable('bfl_strategy_resales').GetValue|0]"
 bfl_strategy_secondary_tip: "기존 대출 구매는 최대 12개의 완성된 자본 지점 고객을 검토합니다. 차용인에게는 유동성, 평화, 마이너스가 아닌 예산이 필요하며 최소한 0.50 신용도. 구매 유지 100 무료 현금, 인수 프리미엄 상한선 25% 잔여 원금 및 총 차용자 노출 25% 형평의. 예상 월별 마진은 다음 이상이어야 합니다. 0.10 프리미엄 후 금, 서비스 수당 및 보수적인 자금 조달 비용. 이것은 추정치입니다. 조기 상환 및 불이행으로 인해 여전히 손실이 발생할 수 있습니다. 유동성이 낮으면 단일 소유 국채를 인용할 수 있습니다. 98% 완성된 증권거래소를 통해 얼굴을 공개합니다. 자금을 지원받은 구매자의 동의가 있기 전에는 재판매 수익금이 예약되지 않습니다."
 bfl_strategy_statement: "월간 리뷰: [Country.MakeScope.GetVariable('bfl_strategy_reviewed').GetValue|0]/12  · 점수: [Country.MakeScope.GetVariable('bfl_strategy_score').GetValue|2]\n크레딧 혜택: [Country.MakeScope.GetVariable('bfl_strategy_offers').GetValue|0]  · 예치금: [Country.MakeScope.GetVariable('bfl_strategy_placements').GetValue|0]  · 회상: [Country.MakeScope.GetVariable('bfl_strategy_recalls').GetValue|0]"
 bfl_strategy_title: "투자 위임"
 bfl_strategy_title_tip: "보수적인 월별 의무입니다. 최대 12개의 신용 후보, 각각 4개의 소스 시장이 있는 12개의 연결된 벤처 운영자 또는 12개의 예금 은행을 검토합니다. 최대 1개의 신용 제안, 화물 제안 또는 100-월별 금 수요 배치. 신용 및 화물 혜택은 3개월 동안 휴지됩니다. 화물에는 최소한의 견적 마진이 필요합니다. 10% 그리고 하나의 금 은행 잉여가 유지됩니다. 500 무료 현금이며 2개의 활성 계약으로 제한됩니다. 25% 형평. 견적은 변경될 수 있습니다. 손실은 여전히 ​​가능합니다. 보호된 현금, 연구, 지점 및 프로필 권한은 계속 적용됩니다."
 bfl_strategy_venture: "마지막 검토: 동의를 위해 화물 파트너십 제안"
 bfl_streamline_bank: "효율적인 관리 · 100 금"
 bfl_streamline_bank_tip: "지불 100 고정 은행 운영 비용을 줄이기 위해 금을 한 번 사용하십시오. 10%. 헌장 개혁, 은행 업무 및 고급 청산을 통해 추가 비용 절감이 가능합니다. 이 결정은 은행 이익을 창출하지 않습니다."
 bfl_subscribe_bank: "구독 100 은행 자본의 금"
 bfl_subscribe_bank_act: "$bfl_subscribe_bank$"
 bfl_subscribe_bank_desc: "프로필, 연령, 연구 및 등록 확인 후 귀하의 재무부에서 자금을 조달합니다. 원금은 은행 이익이 아니다. 은행 자본 청약은 현재 순자산 가치로 단위를 구매합니다."
 bfl_subscribe_bank_effect_text: "$bfl_subscribe_bank$"
 bfl_subscribe_bank_effect_text_past: "$bfl_subscribe_bank$"
 bfl_suspend_command: "신규 예금을 중단하세요"
 bfl_suspend_command_tip: "#T 신규 예금을 중단하세요#!\n신규 입금 수락과 입금 수락을 요구하는 자금 조달 조치를 중단하세요. 기존 계좌, 이자 의무 및 인출 요청은 계속 기록됩니다. 이 통제는 은행을 폐쇄하거나 부채를 탕감하지 않습니다."
 bfl_term_accept: "고정된 약관에 동의하세요."
 bfl_term_decline: "기존 계정 유지"
 bfl_term_deposit: "정기예금"
 bfl_term_deposits_desc: "상인은 항상 돈을 동시에 사용할 수는 없습니다. 이를 합의된 기간 동안 은행에 맡김으로써 은행가에게 보다 안정적인 자본 공급원을 제공하고 자금에 대한 즉각적인 접근권을 포기한 대가로 보상을 받습니다."
 bfl_term_offer_1_desc: "성숙해진 당신을 갱신하세요 [ROOT.GetCountry.MakeScope.GetVariable('bfl_deposit_offer_principal').GetValue|2] 금 원금 12 개월 [ROOT.GetCountry.MakeScope.GetVariable('bfl_deposit_offer_rate').GetValue|%1] 매년. 발생한 이자는 별도로 청구됩니다. 새로운 주체는 이전되지 않습니다. 이 제안은 월말에 만료됩니다. 변경된 청구에는 새로운 제안이 필요합니다."
 bfl_term_offer_1_title: "만기 정기예금 갱신"
 bfl_term_offer_2_desc: "조기 인출 대기열 [ROOT.GetCountry.MakeScope.GetVariable('bfl_deposit_offer_principal').GetValue|2] 취소 후 금 원금 [ROOT.GetCountry.MakeScope.GetVariable('bfl_deposit_offer_penalty').GetValue|2] 발생한 이자 금(최대 1% 교장). 주요 벌금은 적용되지 않습니다. 인출 대기열에는 현금 부족이 남아 있습니다. 이 제안은 월말에 만료됩니다. 변경된 청구에는 새로운 제안이 필요합니다."
 bfl_term_offer_2_title: "조기 인출 제안"
 bfl_term_service_1: "첫 번째 만기 기간 계정 갱신"
 bfl_term_service_1_act: "$bfl_term_service_1$"
 bfl_term_service_1_desc: "선택한 은행에 기간별 서비스 제안을 요청하세요. 수락은 미지급 청구를 보존하고 로트 생성을 다시 확인합니다."
 bfl_term_service_1_effect_text: "$bfl_term_service_1$"
 bfl_term_service_1_effect_text_past: "$bfl_term_service_1$"
 bfl_term_service_1_tip: "첫 번째 적격 기간 로트를 선택합니다. 은행은 명시적인 승인을 위해 고정된 조건을 제시합니다. 갱신하려면 현재 입학 및 기간 허가가 필요합니다. 관계나 권위 상실 후에도 조기 종료 및 성숙한 철회가 가능합니다. 변경되거나 만료된 견적은 실행할 수 없습니다."
