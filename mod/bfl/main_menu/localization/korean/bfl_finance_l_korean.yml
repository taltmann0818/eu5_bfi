 bfl_finance.110.desc: "해당 투자는 새로운 주 지분을 매입합니다. 전환을 통해 은행의 국가 정체성이 유지됩니다. 이 선택을 닫으면 돈이 이체되지 않습니다. 페이지당 8개의 적격한 직접 주제가 표시됩니다. 추가 은행에 연결하려면 다음을 사용하세요."
 bfl_finance.110.title: "주립은행을 선택하세요"
 bfl_finance_title: "은행 및 금융"
 bfl_financial_advance: "은행 서비스"
 bfl_financial_advance_desc: "독립 은행 및 국가 공인 은행에 대한 금융 지식."
 bfl_founder_class: "창립자 · 지역 버거 풀"
 bfl_free_cash_label: "사용 가능한 현금"
 bfl_funded_bill_button: "자금 조달 청구서 · 100 금"
 bfl_funding_tab: "자금 및 부채"
 bfl_funding_title: "예금 및 자본"
 bfl_funding_title_tip: "#T 예금과 자본#!\n예금은 주정부 현금을 은행으로 이체하고 상환 가능한 청구권을 생성합니다. 자본 청약은 소유권 단위를 구매하고 가치를 잃을 수 있습니다. 둘 다 기존 금을 이전합니다. 둘 다 은행 이익으로 간주되지 않습니다."
 bfl_goods: "상품 및 보관 · 가맹점 금융"
 bfl_goods_accept: "이 약관에 동의하세요"
 bfl_goods_accept_branch_tip: "표시된 12개월 관세청 계약을 수락하세요. 월별 액세스 비용은 동의한 호스트에게 전달됩니다. 수락하면 재고, 물품 청구 또는 즉시 구매가 발생하지 않습니다."
 bfl_goods_accept_quote_tip: "표시된 계약 가격에 별도의 1골드 보관료를 관리인에게 지불합니다. 실시간 지원, 가격, 파티, 권한, 액세스 및 보호 자금을 다시 확인하세요. 변경되거나 오래된 조건으로는 돈이 움직이지 않습니다."
 bfl_goods_accept_transfer_tip: "표시된 이체가격을 현재 보유자에게 지급합니다. 기존 영수증을 한 번 전송하기 전에 보유자, 수량, 로트 생성, 연구, 만료 및 자금을 다시 확인하십시오."
 bfl_goods_branch_desc: "호스트는 자본 시장에 대한 접근을 제공합니다. 12 개월 1 매달 골드를 호스트에게 지급합니다. 기본 구매에는 자체 현금 요금이 유지됩니다. 이것은 별도의 양육권 서비스입니다. 이용하려면 호스트가 세관을 완성하고 평화를 유지해야 합니다. 무료 이용, 만료, 건물 손실 또는 전쟁으로 인해 신규 구매 및 배송이 중단됩니다. 호스트는 현지 양육권을 동결할 수 있습니다. 현금이나 상품이 생성되지 않습니다. 액세스 권한을 복원하려면 동일한 호스트로 갱신하세요."
 bfl_goods_branch_title: "관세청 보관 계약"
 bfl_goods_browser_desc: "제안을 검토하려면 실제 로트를 선택하세요. 기존 보유자는 배송을 요청할 수 있습니다. 동의한 세관 호스트는 접근할 수 없는 보관을 동결하고 접근이 재개된 후 이를 석방할 수 있습니다. 선택 시 제안 수락이 발생하지 않습니다."
 bfl_goods_browser_title: "상품 제안 및 양육권 청구"
 bfl_goods_claim_desc: "이 영수증을 귀하의 자본 시장에 전달하도록 요청하십시오. 시장 간 배송은 2개월 소요, 비용 1 금과 패배 1% 수량의. 또는 이 창을 닫고 외교적으로 창고 영수증 전송 제안을 사용하세요. 전송에는 관리인의 혁명과 마진 및 위험 관리가 필요합니다. 구매자는 현재 견적을 수락해야 합니다."
 bfl_goods_claim_title: "귀하의 창고 청구"
 bfl_goods_close: "닫기"
 bfl_goods_decline: "거절하다"
 bfl_goods_deliver: "실제 배송 요청"
 bfl_goods_explanation: "자금이 지원되는 기본 재고, 지원 영수증 및 전달에는 Merchant Finance, 해당 선급금 및 P09 실행/보관 확인이 필요합니다. 담보 물품은 두 번째 청구를 뒷받침할 수 없습니다."
 bfl_goods_forward_title: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_goods_quote_type').Goods.GetNameWithNoTooltip] 육체적인 전진"
 bfl_goods_inventory_empty: "보관된 물품이 없습니다. 자동 구매는 다음 적격 월별 은행 마감일에 시작됩니다."
 bfl_goods_inventory_hint: "상품, 수량, 가격 및 반품을 보려면 마우스를 올리세요."
 bfl_goods_inventory_note: "기본 판매 가치를 나타냅니다. 남은 지불 비용에 대한 미실현 수익. 제3자 영수증은 은행 총액에서 제외됩니다. 비용, 손상 및 접근권 상실은 수익금에 영향을 미칩니다. 저장된 모든 위치를 스크롤합니다."
 bfl_goods_inventory_subtitle: "물리적 보관권 · 지표적 시장 가치"
 bfl_goods_inventory_title: "물품 재고"
 bfl_goods_next: "다음 로트"
 bfl_goods_policy_allocation_0: "할당 · 0%"
 bfl_goods_policy_allocation_10: "할당 · 10%"
 bfl_goods_policy_allocation_25: "할당 · 25%"
 bfl_goods_policy_allocation_50: "할당 · 50%"
 bfl_goods_policy_button: "정책"
 bfl_goods_policy_contracts_0: "계약 · 현물 전용"
 bfl_goods_policy_contracts_1: "계약 · 제안 영수증"
 bfl_goods_policy_contracts_2: "계약 · 제안 전달"
 bfl_goods_policy_help: "순환할 설정을 클릭하세요. 은행은 월 마감 시 상품과 수량을 선택합니다. 각 설정에 마우스를 올려 해당 규칙을 확인하세요."
 bfl_goods_policy_mandate_0: "위임장 · 일시중지됨"
 bfl_goods_policy_mandate_1: "위임장 · 자동"
 bfl_goods_policy_mandate_2: "위임·도망"
 bfl_goods_policy_risk_0: "위험 · 주의"
 bfl_goods_policy_risk_1: "위험 · 균형"
 bfl_goods_policy_risk_2: "위험 · 모험심"
 bfl_goods_policy_turnover_12: "최대 · 12 개월"
 bfl_goods_policy_turnover_24: "최대 · 24 개월"
 bfl_goods_policy_turnover_6: "최대 · 6 개월"
 bfl_goods_previous: "이전 로트"
 bfl_goods_quote_desc: "수량: [ROOT.GetCountry.MakeScope.GetVariable('bfl_goods_quote_quantity').GetValue|3]. 가격: [ROOT.GetCountry.MakeScope.GetVariable('bfl_goods_quote_price').GetValue|2] 골드 플러스 1 금 보관 수수료. 창고 영수증은 상품을 즉시 소유합니다. 실물 선물환은 3개월 안에 배송비를 전액 선불로 지급합니다. 둘 다 보증 상품이 필요합니다. 보관 비용 0.1 매월; 육체적 손실은 2% 매년. 선도업체는 고정 수량을 유지합니다. 누락된 단위는 비례 배분으로 환불하고 판매자에게 동일한 보상을 보장합니다. 다른 시장으로의 배송은 2개월 소요, 비용 1 금과 패배 1% 수량의. 보관 및 운송 손실로 인해 수령 수량이 감소합니다. 당사자가 유효하지 않거나 접근 권한이 상실된 경우 복구를 위해 상품과 담보가 보존됩니다. 이 조건이 귀하에게 적합한 경우에만 동의하세요."
 bfl_goods_quote_title: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_goods_quote_type').Goods.GetNameWithNoTooltip] 창고 영수증"
 bfl_goods_set_allocation_tip: "주기 0%, 10%, 25% 또는 50% 은행 현금과 보유 재고 비용을 더한 금액입니다. 보호된 현금은 항상 보관됩니다. 할당을 줄이면 목표에 도달할 때까지 접근 가능한 무료 포지션을 판매합니다."
 bfl_goods_set_contracts_tip: "스팟 전용, 자동으로 영수증 제공 또는 자동으로 실물 전달 제공. 제안에는 해당 상품의 연령과 연구가 필요하며, 지원을 받고 별도의 상대방 수락을 기다립니다. 기존에 수락한 의무는 계속 보호됩니다."
 bfl_goods_set_mandate_tip: "자동: 귀하의 정책에 따라 구매 및 판매합니다. 일시중지됨: 임의 거래가 없습니다. 실행: 교체하지 않고 접근 가능한 무료 재고를 판매합니다. 기존 계약, 보관 및 손실은 모든 모드에서 계속됩니다."
 bfl_goods_set_risk_tip: "주의: 이익을 얻으세요 +10%, 손실 중지 −5%. 균형: +20% / −15%. 모험심: +35% / −25%. 한도는 남은 비용에 대해 기본 판매 견적을 사용합니다. 실행은 매월 이루어지며 가격은 변동될 수 있습니다."
 bfl_goods_set_turnover_tip: "최대 보유 기간: 6, 12 또는 24 개월. 은행은 만료 시 접근 가능한 무료 포지션을 판매하고 자동으로 새 상품을 선택합니다."
 bfl_goods_settings: "거래정책"
 bfl_goods_settings_tip: "은행의 권한, 할당, 위험 한도, 보유 기간 및 계약 정책을 설정합니다. 은행은 월 마감 시 모든 상품과 수량을 선택합니다."
 bfl_goods_tip: "#T 상품 및 무역#!\n재고, 영수증, 향후 배송 및 마진과 관련된 판매자 금융 도구입니다. 기록된 허가는 상품이나 무역 경로를 생성하지 않습니다. 물리적 실행이 필요합니다."
 bfl_goods_trading_locked: "거래 잠김 · 요구사항을 확인하려면 마우스를 올리세요"
 bfl_goods_transfer_desc: "가격: [ROOT.GetCountry.MakeScope.GetVariable('bfl_goods_transfer_price').GetValue|2] 금. 수량: [ROOT.GetCountry.MakeScope.GetVariable('bfl_goods_transfer_quantity').GetValue|3]. 귀하의 지불금은 현재 보유자에게 전달됩니다. 보관은 은행에 있습니다. 보관, 부패 및 배송 조건은 계속됩니다. 승인은 변경된 뒷받침, 보유자, 로트 생성 또는 가격을 거부합니다."
 bfl_goods_transfer_title: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_goods_transfer_type').Goods.GetNameWithNoTooltip] 영수증 양도"
 bfl_grant_goods_branch: "세관 보관권 제공"
 bfl_grant_goods_branch_act: "$bfl_grant_goods_branch$"
 bfl_grant_goods_branch_desc: "물리적 보관 제안, 기존 청구 또는 자발적인 관세청 접근 계약을 검토하십시오. 국가를 선택하면 돈이 움직이지 않습니다."
 bfl_grant_goods_branch_effect_text: "$bfl_grant_goods_branch$"
 bfl_grant_goods_branch_effect_text_past: "$bfl_grant_goods_branch$"
 bfl_history_empty: "역사는 다음 월별 정산부터 시작됩니다."
 bfl_investment_tab: "대출 및 투자"
 bfl_investment_title: "신용 및 투자"
 bfl_invite_equity_capital: "은행 자기자본 추가"
 bfl_invite_equity_capital_desc: "구독 100 금을 [ROOT.GetCountry.MakeScope.GetVariable('bfl_capital_issuer').GetCountry.GetName] 선택한 재무부 또는 부동산 지갑에서. 가입자는 시장 시세에 따라 새로운 주식을 받습니다. 부동산 지갑은 최소한 25 금. 재무적 소유권, 미래 배당금 및 희석액은 지급된 주식을 따릅니다."
 bfl_invite_equity_capital_tip: "구독할 재무부 또는 자산 지갑을 선택하세요. 100 은행의 현재 NAV에 따른 금. 새로운 주식은 기존 보유자를 희석시킵니다. 은행이 대금을 받습니다."
 bfl_join_clearing_group: "청산 그룹에 가입하세요"
 bfl_join_clearing_group_act: "$bfl_join_clearing_group$"
 bfl_join_clearing_group_command: "$bfl_join_clearing_group$"
 bfl_join_clearing_group_command_desc: "$bfl_join_clearing_group_desc$"
 bfl_join_clearing_group_desc: "회원을 받아들이는 운영자에 가입하세요. 그룹당 4개의 은행; 일치하는 만기 지불 청구서는 적립된 순 이체로 정산됩니다. 짧은 회원이 클레임을 삭제하지 않고 일괄 처리를 차단합니다."
 bfl_join_clearing_group_effect_text: "$bfl_join_clearing_group$"
 bfl_join_clearing_group_effect_text_past: "$bfl_join_clearing_group$"
 bfl_join_clearing_group_tip: "회원을 받아들이는 연구된 청산 운영업체를 선택하세요. Revolutions, Clearing House 및 Advanced Clearing 연구가 필요합니다. 최대 4개의 은행이 명시적으로 가입합니다. 짧은 회원은 모든 소유권을 유지합니다."
 bfl_liabilities_label: "은행 부채"
 bfl_liabilities_label_tip: "#T 총부채#!\n은행 계좌에 기록된 의무. 이는 해당 주의 기본 대출 및 채권과는 별개입니다.\n\n예금 원금: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_deposit_principal')|2]@gold!\n적립된 예금 이자: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_deposit_interest')|2]@gold!\n뛰어난 메모: [Country.MakeScope.GetVariable('bfl_notes_outstanding').GetValue|2]@gold!\n기타 미지급금: [Country.MakeScope.GetVariable('bfl_other_payables').GetValue|2]@gold!\n합계: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_liabilities')|2]@gold!\n\n대기열 인출 [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_withdrawals_due')|2]@gold! 이미 예금 청구의 일부이므로 두 번째로 추가되지 않습니다."
 bfl_liquidity_facilities: "유동성 시설"
 bfl_liquidity_facilities_desc: "심지어 지불 능력이 있는 은행이라도 코인에 대한 모든 수요를 한 번에 충족시키지 못할 수도 있습니다. 기관이 감당할 수 없는 손실을 지원이 숨기지 않는다면 건전한 자산에 대한 일시적인 발전은 이러한 부족을 해소할 수 있습니다."
 bfl_liquidity_warning: "은행 유동성에 주의가 필요합니다"
 bfl_liquidity_warning_desc: "귀하의 은행에 인출이 대기 중이거나 자본금이 부족합니다. 개방형 경제 → 은행 및 금융을 통해 예금 및 자본 확충을 검토합니다."
 bfl_list_selected_bond_01_tip: "이 정확한 주장을 다음에서 제공하십시오. 98% 3개월 동안의 얼굴. 현재 보유자는 자금이 승인될 때까지 쿠폰을 보유합니다. 판매가 실행될 때 양 당사자는 여전히 교환을 해야 합니다."
