 bfl_loan_button: "대출 인수"
 bfl_loans_columns: "차용자 원금 이자 개월"
 bfl_loans_empty: "은행대출은 없습니다. 대출 제안 및 완료된 인수가 여기에 표시됩니다."
 bfl_log_charter: "다음을 위해 주립은행을 설립하고 자본화했습니다."
 bfl_manage_shareholdings: "주주의 결정"
 bfl_manage_shareholdings_desc: "배당금 설정 [ROOT.GetCountry.MakeScope.GetVariable('bfl_exchange_selected').GetCountry.GetName]. 금융 투표의 대다수는 회사와 독립 은행 지급금을 통제합니다. 국가는 자체 공인 은행을 관리합니다. 회사의 예비 선택은 정치적 통제를 변경하지 않습니다."
 bfl_manage_shareholdings_tip: "배당금을 설정할 회사나 은행을 선택하세요. 재정 투표의 과반수 또는 공인 은행에 대한 통제권이 필요합니다. 소수 지분은 충족되지 않은 요구 사항으로 계속 표시됩니다."
 bfl_margining: "마진"
 bfl_margining_and_risk_management: "마진 및 위험 관리"
 bfl_margining_and_risk_management_desc: "향후 배송을 약속하는 판매자는 계약이 만료되기 훨씬 전에 가격 변동에 직면하게 됩니다. 익스포저가 증가함에 따라 추가 보안을 요구함으로써 은행가는 불리한 시장이 디폴트가 되기 전에 손실을 억제할 수 있는 수단을 제공합니다."
 bfl_margining_tip: "#T 마진 및 위험 관리#!\n변화하는 상품 노출에 대비한 담보 및 변동 증거금이 필요합니다. 마진 및 위험 관리 연구, 판매자 금융 및 혁명 시대가 필요합니다. 이 빌드에서는 상품 지원 마진 실행을 사용할 수 없습니다."
 bfl_market_company_requirement: "회사 주식에는 해외 투자 및 회사 지분 조사가 필요합니다. 은행 주식은 주식 거래를 사용합니다."
 bfl_market_funds_requirement: "귀하의 은행은 현금, 자본 및 소유 한도 내에서 주식을 감당할 수 있습니다."
 bfl_market_holder_requirement: "발행인은 무료 주주 자리를 갖고 있거나 이미 구매 은행을 주주로 등록했습니다."
 bfl_market_portfolio_requirement: "귀하의 구매 은행에는 무료 포트폴리오 슬롯이 있거나 이미 이 증권을 보유하고 있습니다."
 bfl_market_sort_price: "주당 가격으로 정렬"
 bfl_mediceo_maintenance: "방코메디세오 관리"
 bfl_medici_decline: "국고에는 다른 지출이 필요하다."
 bfl_medici_desc: "메디치 가문은 거대한 석조 궁전에서 이탈리아와 알프스 너머까지 뻗은 신용망을 이끈다. 밀라노에 상설 은행을 두면 서기들과 준비금을 궁정 가까이에 둘 수 있다. 은행은 특허와 이천 두카트의 출자를 받는 대가로 기존 계정과 채무를 유지하면서 국가 신용과 운명을 함께하겠다고 제안한다."
 bfl_medici_fund: "구독 2,000 두카트를 출자하고 특허를 부여한다."
 bfl_medici_funding_tt: "환승 2,000 두카트를 메디치 은행에 이전하여 우리의 특허 은행으로 삼는다. 밀라노에 Banco Mediceo를 설립하고 밀라노와 현재 수도에 완공된 은행 지점을 마련한다. 기존 대출과 채무는 유지된다. 다른 군주에게 이미 특허를 받은 은행은 인수할 수 없다."
 bfl_medici_house_only: "국가 출자 없이 은행을 환영한다."
 bfl_medici_house_only_tt: "메디치 은행에 자금을 대거나 특허를 부여하지 않고 밀라노에 Banco Mediceo 건물을 설립한다."
 bfl_medici_title: "밀라노의 Banco Mediceo"
 bfl_mendes_spice_house: "멘데스의 집"
 bfl_mendes_spice_house_desc: "바다 건너편에 있는 멘데스 가문의 요소들은 향신료 항구를 유럽의 계산원과 연결합니다. 그들의 서신은 후추와 정향 시장을 열어주며, 지폐와 화물의 꾸준한 이동은 왕자의 장벽 너머를 바라보는 상업을 유지합니다. 이 집에 지속적인 헌법을 부여함으로써 우리는 그 경험을 보다 자유로운 교환에 활용합니다."
 bfl_monetary: "통화정책과 유동성"
 bfl_monetary_explanation: "주권 기관 및 완성된 중앙 은행과 예약된 지폐를 교환합니다. 담보 및 유동성 시설 이후 제3은행 어음을 할인합니다. Revolutions는 자금 지원 회원 상계를 추가하고 공개 보안 지원을 제한합니다. 허용되는 요금은 고정되어 있습니다."
 bfl_monetary_tip: "#T 화폐수단#!\n국채에 대한 후기 허가, 유동성 확보, 청산 및 대중 지원. 각각에는 자체 승인, 지원 및 운영 조건이 필요합니다."
 bfl_money_accept: "수락 및 할인 전환"
 bfl_money_accept_tip: "완전히 유보된 청구권에 대한 메모 교환 지정입니다. 수락은 자발적입니다. 할인 진행 75 금을 상대로 100-금색 제3은행 지폐. 정산은 모든 회원이 순 차변을 지불할 수 있는 경우에만 일치하는 만기 청구서를 정산합니다. 기존 주장은 잃어버린 권위와 건물에서 살아남습니다."
 bfl_money_acceptance_action: "자발적 수용 변경"
 bfl_money_authorize: "메모 승인"
 bfl_money_authorize_tip: "주권 통제자는 공인 은행에 권한을 부여합니다. 현재 자본에는 주권 소유의 완성된 중앙 은행이 필요합니다. 신규 발행에는 발행자의 자본금 은행 지점 및 메모 조사도 필요합니다."
 bfl_money_clear: "회원 청구서 정산"
 bfl_money_clear_open: "입학 허가"
 bfl_money_clear_open_tip: "청산 그룹에 대한 승인을 열거나 닫습니다. Revolutions, Clearing House 및 Advanced Clearing 연구와 은행 또는 은행 소유 주권이 소유한 완성된 Clearing House가 필요합니다. 최대 4명의 멤버."
 bfl_money_clear_tip: "이번 달에 한 번 일치하는 만기 회원 청구서를 정산합니다. 각 회원은 다른 적립금을 보호하면서 순지불액을 충당해야 합니다. 하나의 짧은 구성원이 전체 배치를 보존합니다. 약정 및 비회원 청구는 제외됩니다."
 bfl_money_empty: "유통 중인 메모가 없습니다. 금전적 연구, 권한 및 완성된 건물을 통해 새로운 서비스가 제공됩니다."
 bfl_money_empty_tip: "완전히 유보된 청구권에 대한 메모 교환 지정입니다. 수락은 자발적입니다. 할인 진행 75 금을 상대로 100-금색 제3은행 지폐. 정산은 모든 회원이 순 차변을 지불할 수 있는 경우에만 일치하는 만기 청구서를 정산합니다. 기존 주장은 잃어버린 권위와 건물에서 살아남습니다."
 bfl_money_help: "완전히 유보된 청구권에 대한 메모 교환 지정입니다. 수락은 자발적입니다. 할인 진행 75 금을 상대로 100-금색 제3은행 지폐. 정산은 모든 회원이 순 차변을 지불할 수 있는 경우에만 일치하는 만기 청구서를 정산합니다. 기존 주장은 잃어버린 권위와 건물에서 살아남습니다."
