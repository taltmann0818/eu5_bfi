 bfl_offer_commenda: "화물 운영에 자금을 지원하세요"
 bfl_offer_commenda_act: "화물 운영에 자금을 지원하세요"
 bfl_offer_commenda_desc: "은행이 제안한 조건에 따라 위험 자본을 제공합니다. 인수는 지정된 화물을 원래 가격으로 구매합니다. 사용하지 않은 승인 금액은 은행에 보관됩니다. 자본금과 수익은 결코 보장되지 않습니다."
 bfl_offer_commenda_effect_text: "화물 운영에 자금을 지원하세요"
 bfl_offer_commenda_effect_text_past: "화물 운영에 자금을 지원하세요"
 bfl_offer_commenda_tip: "Discovery 이상, 해외투자 및 Commenda 연구. 10개 단위 화물에 대한 운영자, 소스 시장, 목적지 및 상품을 선택합니다. 수락을 통해 귀하의 권한, 무료 현금, 자본 및 능력을 다시 확인합니다. 운영자당 하나의 활성 계약; 은행당 최대 8개까지 가능합니다."
 bfl_offer_credit: "자금 대출 제공"
 bfl_offer_credit_act: "$bfl_offer_credit$"
 bfl_offer_credit_desc: "차용인은 명시적인 제안을 받습니다. 승인될 때까지 현금이나 조건이 변경되지 않습니다. 실행은 실제 권한, 프로필, 연구 및 자금을 다시 확인합니다."
 bfl_offer_credit_effect_text: "$bfl_offer_credit$"
 bfl_offer_credit_effect_text_past: "$bfl_offer_credit$"
 bfl_offer_credit_tip: "주권 또는 적격 국내 회사를 선택하십시오. 두 프로필 모두 주권자에게 대출을 제공합니다. 회사 신용에는 판매자 금융, 개혁 및 기업 신용이 필요합니다. 부채 구제에는 르네상스 부채 구조 조정도 필요합니다."
 bfl_offer_goods_transfer: "창고 영수증 전송 제공"
 bfl_offer_goods_transfer_act: "$bfl_offer_goods_transfer$"
 bfl_offer_goods_transfer_desc: "상품 제안 및 보관 청구에서 가장 최근에 선택한 영수증을 제공하십시오. 수령인은 현재 보유자에게 지불하기 전에 가격과 수량을 검토합니다."
 bfl_offer_goods_transfer_effect_text: "$bfl_offer_goods_transfer$"
 bfl_offer_goods_transfer_effect_text_past: "$bfl_offer_goods_transfer$"
 bfl_offer_held_sovereign_bond: "보유 국채 제공"
 bfl_offer_held_sovereign_bond_act: "$bfl_offer_held_sovereign_bond$"
 bfl_offer_held_sovereign_bond_desc: "발행자를 선택하고 국채 중 하나를 나열하십시오. 98% 액면가의. 소유하고 완성된 증권 거래소 건물이 필요합니다."
 bfl_offer_held_sovereign_bond_effect_text: "$bfl_offer_held_sovereign_bond$"
 bfl_offer_held_sovereign_bond_effect_text_past: "$bfl_offer_held_sovereign_bond$"
 bfl_offer_held_sovereign_bond_tip: "귀하가 3개월 동안 소유하고 있는 기존 채권을 나열하십시오. 자금을 지원받은 구매자가 수락할 때까지 귀하는 청구를 유지합니다. 쿠폰과 상환은 구매자를 따릅니다."
 bfl_offer_restructuring: "부채 탕감 제공"
 bfl_offer_restructuring_act: "$bfl_offer_restructuring$"
 bfl_offer_restructuring_desc: "차용인은 명시적인 제안을 받습니다. 승인될 때까지 현금이나 조건이 변경되지 않습니다. 실행은 실제 권한, 프로필, 연구 및 자금을 다시 확인합니다."
 bfl_offer_restructuring_effect_text: "$bfl_offer_restructuring$"
 bfl_offer_restructuring_effect_text_past: "$bfl_offer_restructuring$"
 bfl_offer_restructuring_tip: "주권 또는 적격 국내 회사를 선택하십시오. 두 프로필 모두 주권자에게 대출을 제공합니다. 회사 신용에는 판매자 금융, 개혁 및 기업 신용이 필요합니다. 부채 구제에는 르네상스 부채 구조 조정도 필요합니다."
 bfl_operating_costs: "월 운영비"
 bfl_operating_costs_tip: "활성 예금 계좌, 계약, 지점 및 자산 클래스를 통해 고정 월 비용 규모가 조정됩니다. State Chartered Bank 개혁은 다음과 같이 비용을 절감합니다. 5%, 은행업무 10%, 고급 청산 15%, 그리고 효율적인 관리를 통해 10%. 미지급 비용은 부채로 남아 배당금을 차단합니다."
 bfl_overview: "계정 및 전문 분야"
 bfl_overview_hint: "자산: 외부 링 = 유형; 내부 링 = 국가. 색상 분석을 보려면 마우스를 가져가세요."
 bfl_payout_0: "이익을 유지"
 bfl_payout_0_short: "유지"
 bfl_payout_0_tip: "모든 적격 실현 이익을 유지합니다. 이 정책에서는 새로운 배당금이 지급되지 않습니다. 이익잉여금은 유동성과 형평성을 뒷받침합니다."
 bfl_payout_25: "25% 지불금"
 bfl_payout_25_short: "25%"
 bfl_payout_25_tip: "최대 할당 25% 적격 실현 이익을 손실 후 배당금으로 계산합니다. 사용 가능한 현금, 자본 여유 및 기록된 소유권은 여전히 ​​지불을 제한합니다."
 bfl_payout_50: "50% 지불금"
 bfl_payout_50_short: "50%"
 bfl_payout_50_tip: "최대 할당 50% 적격 실현 이익을 손실 후 배당금으로 계산합니다. 사용 가능한 현금, 자본 여유 및 기록된 소유권은 여전히 ​​지불을 제한합니다."
 bfl_peasants_estate_workout_mandate: "부동산 운동 명령"
 bfl_peasants_estate_workout_mandate_desc: "이 부동산은 정부가 자신을 대신하여 자발적인 은행 예금 워크아웃을 검토할 수 있는 권한을 명시적으로 부여합니다. 모든 제안은 여전히 ​​별도의 승인이 필요합니다. 이 특권을 취소하면 보류 중인 유산 조건이 무효화됩니다. 복구 지불은 자산 지갑으로 계속됩니다."
 bfl_place_deposit_1: "열기 100 금 요구불 예금"
 bfl_place_deposit_1_act: "$bfl_place_deposit_1$"
 bfl_place_deposit_1_desc: "독립 은행은 최소한의 의견을 요구합니다. +50 당신을 향해 계좌를 개설합니다. 귀하의 공인 은행은 추가 혜택을 제공합니다 1% 연간이자. 수요이자는 자금이 조달되면 매월 지급됩니다. 미지급 이자가 계속 남아 있습니다. 관계가 무너지면 자신의 성숙한 주장이 철회되는 것을 결코 막을 수 없습니다."
 bfl_place_deposit_1_effect_text: "$bfl_place_deposit_1$"
 bfl_place_deposit_1_effect_text_past: "$bfl_place_deposit_1$"
 bfl_place_deposit_2: "열기 100 금 정기 예금"
 bfl_place_deposit_2_act: "$bfl_place_deposit_2$"
 bfl_place_deposit_2_desc: "독립 은행은 최소한의 의견을 요구합니다. +50 당신을 향해 계좌를 개설합니다. 귀하의 공인 은행은 추가 혜택을 제공합니다 1% 연간이자. 수요이자는 자금이 조달되면 매월 지급됩니다. 미지급 이자가 계속 남아 있습니다. 관계가 무너지면 자신의 성숙한 주장이 철회되는 것을 결코 막을 수 없습니다."
