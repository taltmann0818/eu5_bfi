 bfl_transfer_bank_bill_desc: "발행자와 수락 수혜자를 선택합니다. 첫 번째 자격 100-금 청구권 이전 100 현재 보유자에게 금이 지급됩니다. 잠긴 담보는 양도할 수 없습니다. 노트에는 Revolutions 수용 연구가 필요합니다. 모든 자금 조달, 소유권 및 자본 지점 확인은 실행 시 반복됩니다."
