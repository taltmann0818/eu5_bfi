 bfl_resolution_close_command_tip: "질서 있는 결의는 새로운 약속과 분배를 동결시킵니다. 분리된 화폐 및 보관 준비금은 보호됩니다. 예금은 비용 연체 전과 자본금 이전에 사용 가능한 현금을 비례적으로 공유합니다. 누락된 채권자는 자신의 청구권을 유지합니다. 자발적인 조건에는 현재 채권자의 동의와 르네상스 부채 구조 조정이 필요합니다. 공공 보증은 다음과 같습니다. 50% 허용된 예금 손실액 최대 100 총 금은 기록된 주권에 의해 자금이 지원됩니다. 미지급 통화는 보류 상태로 남아 있습니다. 폐쇄를 위해서는 모든 의무와 비현금 자산을 청산해야 합니다. 폐쇄된 부동산은 다시 열 수 없습니다."
 bfl_resolution_guarantee_command: "보증 승인"
 bfl_resolution_guarantee_command_tip: "질서 있는 결의는 새로운 약속과 분배를 동결시킵니다. 분리된 화폐 및 보관 준비금은 보호됩니다. 예금은 비용 연체 전과 자본금 이전에 사용 가능한 현금을 비례적으로 공유합니다. 누락된 채권자는 자신의 청구권을 유지합니다. 자발적인 조건에는 현재 채권자의 동의와 르네상스 부채 구조 조정이 필요합니다. 공공 보증은 다음과 같습니다. 50% 허용된 예금 손실액 최대 100 총 금은 기록된 주권에 의해 자금이 지원됩니다. 미지급 통화는 보류 상태로 남아 있습니다. 폐쇄를 위해서는 모든 의무와 비현금 자산을 청산해야 합니다. 폐쇄된 부동산은 다시 열 수 없습니다."
 bfl_resolution_heading: "해결 및 채권자 회수"
 bfl_resolution_heading_tip: "지속적인 재정 해결 현금 회수 및 합의에 따른 변경은 수익과 별도로 기록됩니다."
 bfl_resolution_help: "담보 및 보관예치금 → 비례예금 → 비용 연체 → 잔여 주주. 청구서는 부족분과 원본 권한의 상실에도 불구하고 유지됩니다. 조건을 제안하기 전에 해결 방법을 입력하세요."
 bfl_resolution_liquidate_command: "사용 가능한 자산 실현"
 bfl_resolution_liquidate_command_tip: "접근 가능한 무제한 기본 재고를 판매하고 기존 서비스를 통해 만기 예금, 청구서 및 메모를 수집합니다. 실제 영수증은 복구 폭포에 자금을 지원합니다. 사용할 수 없거나 미성숙한 위치는 계속 기록됩니다. 어떤 장부 가치도 금이 되지 않습니다."
 bfl_resolution_next_command: "다음 예금 계좌"
 bfl_resolution_next_command_tip: "활성 예금 계좌를 순환합니다. 부동산 채권자는 정부가 자발적인 조건을 수락하기 전에 제정된 워크아웃 명령을 요구합니다. 지불금은 기록된 재무부 또는 자산 지갑으로 반환됩니다."
 bfl_resolution_notice_acknowledge: "최종 결과를 확인하세요."
 bfl_resolution_notice_desc: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_notice_bank').GetCountry.GetName] 금융업무를 폐쇄했습니다.\n\n지불된 보증금 회수: [ROOT.GetCountry.MakeScope.GetVariable('bfl_notice_bank').GetCountry.MakeScope.GetVariable('bfl_resolution_paid').GetValue|2]@gold!\n동의된 보증금 손실: [ROOT.GetCountry.MakeScope.GetVariable('bfl_notice_bank').GetCountry.MakeScope.GetVariable('bfl_resolution_waived').GetValue|2]@gold!\n기록된 법정 손실: [ROOT.GetCountry.MakeScope.GetVariable('bfl_notice_bank').GetCountry.MakeScope.GetVariable('bfl_resolution_statutory_loss').GetValue|2]@gold!\n\n기록된 손실은 미지급 금액이며 회복이나 새로운 수입이 아닙니다. 역사적 소유권과 최종 재산은 계속 기록됩니다. 폐쇄된 기관은 다시 열 수 없습니다."
 bfl_resolution_notice_title: "은행 결의안 마감"
 bfl_resolution_offer_command: "채권자 조건 제공"
 bfl_resolution_offer_command_tip: "질서 있는 결의는 새로운 약속과 분배를 동결시킵니다. 분리된 화폐 및 보관 준비금은 보호됩니다. 예금은 비용 연체 전과 자본금 이전에 사용 가능한 현금을 비례적으로 공유합니다. 누락된 채권자는 자신의 청구권을 유지합니다. 자발적인 조건에는 현재 채권자의 동의와 르네상스 부채 구조 조정이 필요합니다. 공공 보증은 다음과 같습니다. 50% 허용된 예금 손실액 최대 100 총 금은 기록된 주권에 의해 자금이 지원됩니다. 미지급 통화는 보류 상태로 남아 있습니다. 폐쇄를 위해서는 모든 의무와 비현금 자산을 청산해야 합니다. 폐쇄된 부동산은 다시 열 수 없습니다."
 bfl_resolution_pay_command: "급여 회수"
 bfl_resolution_pay_command_tip: "질서 있는 결의는 새로운 약속과 분배를 동결시킵니다. 분리된 화폐 및 보관 준비금은 보호됩니다. 예금은 비용 연체 전과 자본금 이전에 사용 가능한 현금을 비례적으로 공유합니다. 누락된 채권자는 자신의 청구권을 유지합니다. 자발적인 조건에는 현재 채권자의 동의와 르네상스 부채 구조 조정이 필요합니다. 공공 보증은 다음과 같습니다. 50% 허용된 예금 손실액 최대 100 총 금은 기록된 주권에 의해 자금이 지원됩니다. 미지급 통화는 보류 상태로 남아 있습니다. 폐쇄를 위해서는 모든 의무와 비현금 자산을 청산해야 합니다. 폐쇄된 부동산은 다시 열 수 없습니다."
 bfl_resolution_resume_command: "복구 후 재개"
 bfl_resolution_resume_command_tip: "질서 있는 결의는 새로운 약속과 분배를 동결시킵니다. 분리된 화폐 및 보관 준비금은 보호됩니다. 예금은 비용 연체 전과 자본금 이전에 사용 가능한 현금을 비례적으로 공유합니다. 누락된 채권자는 자신의 청구권을 유지합니다. 자발적인 조건에는 현재 채권자의 동의와 르네상스 부채 구조 조정이 필요합니다. 공공 보증은 다음과 같습니다. 50% 허용된 예금 손실액 최대 100 총 금은 기록된 주권에 의해 자금이 지원됩니다. 미지급 통화는 보류 상태로 남아 있습니다. 폐쇄를 위해서는 모든 의무와 비현금 자산을 청산해야 합니다. 폐쇄된 부동산은 다시 열 수 없습니다."
 bfl_review_trade: "거래 검토"
 bfl_review_trade_tip: "선택한 단위와 정확한 결제 금액을 검토하세요. 판매는 최소한 반올림되어야 합니다. 0.01 금; 검토가 불가능할 경우 수량을 늘리십시오. 유효한 거래가 완료될 때까지 외교관은 소비되지 않습니다."
 bfl_safeguards_title: "유동성 및 보호 장치"
 bfl_safeguards_title_tip: "#T 유동성 및 보호 장치#!\n사용 가능한 은행 현금: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_free_cash')|2]@gold!\n보호된 현금 요구사항: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_protected_cash')|2]@gold!\n대기 중인 출금: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_withdrawals_due')|2]@gold!\n\n자본 확충은 국가 자본을 공급합니다. 예금을 중단하면 기존 의무를 유지하면서 새로운 계좌 자금 조달이 중단됩니다."
 bfl_sale_unavailable: "주식 주문을 결제할 수 없습니다."
 bfl_sale_unavailable_desc: "발행인의 거래 휴지 기간은 1개월이며, 외교관이 없거나 견적이 만료되었거나 사용 가능한 주식, 자금 또는 거래소 액세스가 변경되었습니다. 새로운 견적을 받으려면 주식 구매 또는 판매를 재개하세요. 현금이나 주식은 움직이지 않았습니다."
 bfl_secured_liquidity: "유동성 확보"
 bfl_secured_liquidity_tip: "#T 유동성 확보#!\n절대주의, 담보 및 유동성 시설. 사전 75 별도로 자금을 조달하는 금 100-금색 제3은행 지폐. 담보는 한 번 잠겨 있습니다. 고정 허용 연간 이율은 다음과 같이 나뉩니다. 12. 은행 간 지점이 필요하지 않습니다."
 bfl_security_bank_results: "마지막 은행 마감"
 bfl_security_financial_heading: "유형의 재무상태"
 bfl_security_financial_subtitle: "주가를 뒷받침하는 것은 무엇인가"
 bfl_security_financial_title: "지분 [Country.GetName]"
 bfl_security_price_heading: "주가와 소유권"
 bfl_security_price_math: "시장 가격 = 주당 유형 NAV × 월간 시장 프리미엄. 주문 압력, 변동성, 평균 회귀 및 고통으로 인해 프리미엄이 변경될 수 있습니다. 기본 자본의 가격은 NAV로 유지됩니다. 미실현 이익은 대출이나 배당금에 자금을 지원하지 않습니다."
 bfl_security_primary_note: "배당금은 현금과 NAV를 한 번 감소시킵니다. 신규 자본은 NAV로 가격이 책정되며 매수 압력 신호를 생성하지 않습니다. 딜러 재판매 입찰가가 NAV를 초과하는 동안 구독이 일시 중지되어 즉각적인 수익이 보장되지 않습니다. 역사에는 실제 관찰이 포함됩니다. 다시 로드해도 저장된 월별 충격은 다시 롤링되지 않습니다."
 bfl_select_buy_shares: "은행 및 회사 주식 구매"
 bfl_select_profile: "대기 중인 전문 분야 선택"
 bfl_select_profile_tip: "#T 은행 전문화#!\n이 은행이 아직 영구 프로필을 선택하지 않은 경우 전문화 선택을 엽니다. Merchant Finance와 해외 투자는 서로 다른 연구 경로를 열어줍니다. 완료된 전문화는 이 버튼으로 대체될 수 없습니다."
 bfl_select_sell_shares: "자신이 소유한 주식을 판매하세요"
 bfl_selector_next: "다음 은행"
 bfl_selector_previous: "이전 은행"
 bfl_sell_confirm_desc: "매도 [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_quantity').GetValue|3] 주식 [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_issuer').GetCountry.GetName] 에 대한 [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_total').GetValue|2]@gold!. 숨겨진 시장 조성자는 견적이 유효한 동안 견적된 거래 스프레드를 포함하여 이 판매를 보장합니다. 주식은 즉시 귀하의 포트폴리오를 떠납니다. 백그라운드 AI 구매로 인해 결제가 지연되지 않습니다. 수익금은 은행 금고로 들어갑니다. 결제에는 외교관 한 명이 소모되며 해당 발행자의 1개월 구매/판매 휴지 기간이 시작됩니다."
 bfl_sell_confirm_title: "즉시주식판매 확인"
 bfl_sell_shares: "주식 판매"
 bfl_sell_shares_desc: "보유 자산 중 하나와 수량을 선택하세요. 숨겨진 시장 조성자는 표시된 딜러 스프레드를 제외한 시장 시세로 귀하의 주식을 즉시 구매합니다. AI 은행은 백그라운드에서 재고를 구매합니다."
 bfl_sell_shares_tip: "보유 자산 중 하나와 수량을 선택하세요. 숨겨진 시장 조성자는 표시된 딜러 스프레드를 제외한 시장 시세로 귀하의 주식을 즉시 구매합니다. AI 은행은 백그라운드에서 재고를 구매합니다.\n완료된 교환, 주식 거래 및 최소 한 명의 외교관이 필요합니다. 거래가 성공할 때마다 외교관 한 명이 소모되며 해당 발행자에 대해 1개월의 휴지 기간이 시작됩니다. 가능한 외교관: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bfl_available_trade_diplomats')|2]. 주문 금액은 현금 가치 이상이어야 합니다. 0.01 금."
 bfl_sell_state_confirm_desc: "매도 [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_quantity').GetValue|3] 귀하의 재무부 지분 [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_issuer').GetCountry.GetName] 에 대한 [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_total').GetValue|2]@gold!, 귀하의 국가 재무부에 지불됩니다. 은행은 자금 조달을 받지 않으며 발행된 주식은 변경되지 않습니다. 숨겨진 딜러는 표시된 딜러 스프레드를 포함하여 표시된 견적을 보장합니다. 합의에는 외교관 한 명이 소모되며 해당 발행자에 대해 1개월간 구매/판매 휴지 기간이 시작됩니다. 귀하의 헌장의 통화 권한은 귀하에게 있습니다."
