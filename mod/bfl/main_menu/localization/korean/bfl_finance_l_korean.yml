 bfl_portfolio_history_axis: "오래된 것부터 최신 것까지 · 최대 12 월간 관찰"
 bfl_portfolio_history_empty: "역사는 다음 달 은행 마감일부터 시작됩니다."
 bfl_portfolio_history_flows: "가치에는 구매와 판매가 포함됩니다. 이것은 투자 수익 지수가 아닙니다."
 bfl_portfolio_history_title: "시간 경과에 따른 포트폴리오 가치"
 bfl_portfolio_owner_note: "재무부와 은행 보유는 별도의 소유자가 있습니다. 재정을 확인하려면 엔터티를 마우스로 가리키세요."
 bfl_portfolio_total_heading: "현재 자기자본 가치"
 bfl_portfolio_treasury_heading: "국채 보유"
 bfl_prepare_bond_panel: "국채"
 bfl_prepare_bond_panel_tip: "신용에서 주 자금 조달 및 기존 청구를 확인하세요."
 bfl_probe_P11: "개발 게이트: 이 어댑터를 실행하려면 게임에서 P11을 측정해야 합니다."
 bfl_profile_0: "전문 분야를 선택하세요"
 bfl_profile_1: "판매자 금융"
 bfl_profile_2: "해외투자"
 bfl_project_security: "프로젝트 보안"
 bfl_project_security_desc: "멀리 떨어진 기업은 금융가가 감독하기 어렵습니다. 자본이 충당되기 전에 설정된 자산 및 수익금에 대한 청구권은 벤처 기업이 길을 잃었을 때 투자자에게 자신의 이익을 보호할 수 있는 수단을 제공합니다."
 bfl_project_security_tip: "#T 프로젝트 보안#!\n식별 가능한 프로젝트 청구로부터 벤처를 보호합니다. 프로젝트 보안 연구, 해외 투자 및 절대주의 시대 이상이 필요합니다. 이 빌드에서는 기본 프로젝트 보조 실행을 사용할 수 없습니다."
 bfl_protected_label: "보호된 현금"
 bfl_public_backstop: "공공 백스톱"
 bfl_public_backstop_tip: "#T 공공 보장 지원#!\n혁명, 공공 금융 백스톱 및 주권 수도에서 중앙 은행이 완성된 라이브 헌장. 명시적으로 수락됨 75-금 선지급은 공공 은행의 무료 현금을 사용합니다. 25% 지폐 이발 그리고 적어도 9% 연간이자. 무료 자본 확충이 없습니다."
 bfl_public_financial_backstops: "공공 재정 지원"
 bfl_public_financial_backstops_desc: "대형 은행의 실패로 인해 공공 신용과 상업이 위협을 받으면 정부가 개입할 수도 있습니다. 이러한 지원은 재무부의 자원을 은행의 회복에 결속시키고 지원 조건을 공공 정책의 문제로 만듭니다."
 bfl_purchase_funded_bill: "자금 지원 청구서 구매"
 bfl_purchase_funded_bill_act: "$bfl_purchase_funded_bill$"
 bfl_purchase_funded_bill_desc: "프로필, 연령, 연구 및 등록 확인 후 귀하의 재무부에서 자금을 조달합니다. 원금은 은행 이익이 아니다. 은행 자본 청약은 현재 순자산 가치로 단위를 구매합니다."
 bfl_purchase_funded_bill_effect_text: "$bfl_purchase_funded_bill$"
 bfl_purchase_funded_bill_effect_text_past: "$bfl_purchase_funded_bill$"
 bfl_purchase_native_loan: "은행: 원주민 부동산 대출 구입"
 bfl_purchase_native_loan_act: "$bfl_purchase_native_loan$"
 bfl_purchase_native_loan_desc: "귀하의 은행이 구매자입니다. 추가 무료 현금 및 자본금 수표와 함께 기본 가격 및 자격이 적용됩니다. 은행 자산은 구매 가격을 받고 동일한 대출로 소유자가 변경됩니다. 채권 및 이미 국가가 보유하고 있는 대출은 제외됩니다."
 bfl_purchase_native_loan_effect_text: "$bfl_purchase_native_loan$"
 bfl_purchase_native_loan_effect_text_past: "$bfl_purchase_native_loan$"
 bfl_purchase_native_loan_tip: "#T 은행 대출 인수#!\n적격 부동산 부채가 있는 다른 주권을 선택하십시오. 귀하의 공인 은행은 해당 국가의 은행 자산에 기본 구매 가격을 지불하고 동일한 대출의 채권자가 됩니다. 원금과 이자 채권은 은행에 귀속됩니다. 주권자는 주식 배당을 통해 대출 수입을 얻습니다. 은행은 또한 준비금과 자본이 허용하는 한 매달 자율적으로 하나의 적격 대출을 구매합니다. 채권 및 이미 국가가 보유하고 있는 대출은 제외됩니다."
 bfl_rate_0: "신규 계좌에 대한 수요이자 없음"
 bfl_rate_0_short: "0%"
 bfl_rate_0_tip: "제안 0% 신규 요구불예금에 대한 연간 이자. 기존 수요 계정과 별도의 기간 계정 요율은 허용되는 요율로 유지됩니다."
 bfl_rate_1: "1% 신규 계정에 대한 연간 수요율"
 bfl_rate_1_short: "1%"
 bfl_rate_1_tip: "제안 1% 신규 요구불예금에 대한 연간 이자. 이자는 매월 센트 캐리로 적립됩니다. 기존 수요 계정은 허용되는 요율을 유지합니다."
 bfl_rate_2: "2% 신규 계정에 대한 연간 수요율"
 bfl_rate_2_short: "2%"
 bfl_rate_2_tip: "제안 2% 신규 요구불예금에 대한 연간 이자. 이자는 매월 센트 캐리로 적립됩니다. 기존 수요 계정은 허용되는 요율을 유지합니다."
 bfl_recapitalize_command: "다음으로 자본 확충 100 금"
 bfl_recapitalize_command_tip: "지불 100 국가 재무부의 금을 은행 자본으로 사용합니다. 필요하다 100 금과 딜러 재판매 입찰가는 실제 NAV보다 높지 않습니다. 즉각적인 재판매 이익을 방지하기 위해 더 큰 시장 프리미엄이 발생하는 동안 자본은 일시 중지됩니다. 0 또는 마이너스 NAV에서도 자금 지원 구조가 계속 가능합니다."
 bfl_redeem_bond: "사용"
 bfl_redeem_bond_01_tip: "액면가와 누적된 모든 쿠폰을 현재 보유자에게 지불합니다. 부족하면 전체 채권이 미결제 상태로 남습니다. 상환은 청구를 한 번 종료합니다. 기본 채권은 영향을 받지 않습니다."
