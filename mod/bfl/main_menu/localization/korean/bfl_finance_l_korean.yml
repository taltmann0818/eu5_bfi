 bfl_sovereign_accounts: "국가 계좌 - 은행 자산과 별개"
 bfl_sovereign_accounts_subtitle: "은행 자산이 아닌 기본 주권 대출"
 bfl_sovereign_accounts_tip: "이러한 기본 부채와 미수금은 은행이 아닌 주권자의 소유입니다. 자산 도넛에는 은행 소유 대출이 포함됩니다. 은행 부채에는 예금과 미지급 운영 비용이 포함됩니다. 원주민 차용, 상환 및 대출 목록은 주권자를 행위자로 유지합니다."
 bfl_sovereign_banknotes: "주권 지폐"
 bfl_sovereign_banknotes_desc: "공공 기관의 지원을 받는 은행은 중화폐 대신 지불 약속을 서면으로 배포할 수 있습니다. 해당 기관이 이를 상환하고 발행 기관이 의무를 이행할 것이라는 확신을 바탕으로 승인이 이루어집니다."
 bfl_sovereign_credit: "주권신용"
 bfl_sovereign_credit_tip: "#T 주권신용#!\n은행 현금에서 상륙국으로의 대출로, 상환 청구가 은행 자산으로 기록됩니다. 운영 은행과 기본 대출 조건이 필요합니다. 이 빌드에서는 새로운 대출 실행을 사용할 수 없습니다."
 bfl_sovereign_debt: "국채"
 bfl_sovereign_debt_heading: "국채 [Country.GetName]"
 bfl_sovereign_note: "소버린 노트"
 bfl_sovereign_note_tip: "#T 상환 가능한 지폐#!\n절대주의, 국채 연구, 주권 승인, 자본 중앙 은행 및 발행자의 은행 지점. 교환 100 완전히 예약된 주장을 위한 종. 독립 주식 기반 한도에는 들어오는 노트 현금이 제외됩니다. 자발적인 평가 이전; 기본 결제는 금으로 유지됩니다."
 bfl_sovereign_receivables: "국채채권"
 bfl_sovereign_receivables_heading: "주권채권 [Country.GetName]"
 bfl_sovereign_restructuring: "주권 구조조정"
 bfl_sovereign_restructuring_tip: "#T 주권 구조 조정#!\n부채 구조 조정 사전에 따라 국가 부채를 재협상합니다. 허용된 연령, 운영 은행 및 지원되는 기본 부채 거래가 필요합니다. 이 빌드에서는 기본 구조 조정 실행을 사용할 수 없습니다."
 bfl_specialization_title: "은행 전문화"
 bfl_state_bonds_tip: "#T 국채 용량#!\n뛰어난 자국 국채: [GetPlayer.GetNumBonds]\n최대 기본 본드 슬롯: [GetPlayer.GetDoubleModifierValue('max_bonds', 'max_bonds_modifier')|0]\n\n이는 은행 예금, 주식 및 기타 부채와는 별개로 주 정부의 채권입니다. 용량에는 기본 기본 슬롯과 본드 용량 수정자가 포함됩니다. 채권을 판매하려면 기본 차입 조건도 필요합니다."
 bfl_state_bonds_value: "채권: [GetPlayer.GetNumBonds] / [GetPlayer.GetDoubleModifierValue('max_bonds', 'max_bonds_modifier')|0]"
 bfl_state_chartered_bank: "스테이트 차타드 은행"
 bfl_state_chartered_bank_desc: "별도로 자금을 지원받는 기본 은행 과목입니다. 주권자는 처음에 모든 주식을 소유하고 매월 배당금을 신용으로 설정합니다. 새로운 은행 청약은 자본을 늘리고 기존 소유권을 희석시킵니다. 주 예금은 우선 이자를 받습니다."
