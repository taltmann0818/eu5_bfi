 bfl_credit_1_desc: "은행 제안 100 금 60 매월 견적된 연간 요율로 계산됩니다. 승인을 받으면 자금, 권한, 부채 능력 및 자격을 다시 확인합니다. 주된 것은 소득이 아니라 자금조달이다.\n연간 요금: [ROOT.GetCountry.MakeScope.GetVariable('bfl_credit_offer_rate').GetValue|%1]."
