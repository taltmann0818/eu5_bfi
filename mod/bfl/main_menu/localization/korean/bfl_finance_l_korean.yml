 bfl_offer_bond_workout_31: "제안 재구성"
 bfl_offer_bond_workout_31_tip: "현재 보유자에게 다음을 수락하도록 요청하세요. 20% 원금 및 미지급 이표를 감면하고, 연간 이표를 1% 포인트 삭감합니다. 1% 바닥. 보유자가 별도로 수락하지 않는 한 자금은 이동하지 않습니다. 견적은 이번 달에 만료되며 청구 변경으로 인해 무효화됩니다."
