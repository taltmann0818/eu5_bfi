 bfl_facility_0: "시설 꺼짐"
 bfl_facility_0_short: "끄기"
 bfl_facility_0_tip: "고정 부채 시설 명령을 해제하십시오. 예정된 은행 자금 조달은 요청되지 않습니다. 기존 채무는 계속 지불 가능합니다."
 bfl_facility_1: "부채 우선 시설"
 bfl_facility_1_short: "부채 우선"
 bfl_facility_1_tip: "맞춤형 채권 파이낸싱 요청 60% 예상 월별 지출(한도) 100 금과 한 달에 한 권. 주 현금이 도달하면 추첨 건너뛰기 500 금 또는 은행이나 발행인의 능력이 부족합니다."
 bfl_facility_2: "완충시설"
 bfl_facility_2_short: "버퍼"
 bfl_facility_2_tip: "맞춤형 채권 파이낸싱 요청 200 예측 잔액 이후의 주 금, 최대 한도는 다음과 같습니다. 100 금과 한 달에 한 권. 자금이 지원되지 않은 요청은 부채나 현금을 생성하지 않습니다."
 bfl_facility_reason_1: "#O 리서치, 지점 접근, 발행자 수입 및 쿠폰 용량을 확인하세요.#!"
 bfl_facility_reason_2: "#O 보호된 현금으로 인해 유동적인 은행 자금이 부족해졌습니다.#!"
 bfl_facility_reason_3: "#O 새로운 청구액은 은행의 자본 여유액을 초과하게 됩니다.#!"
 bfl_facility_reason_4: "#O 결합된 주권 의무가 발행자 부채 한도에 도달했습니다.#!"
 bfl_facility_reason_5: "#O 미지급된 주권 쿠폰으로 인해 추가 발행이 차단됩니다.#!"
 bfl_facility_reason_6: "#O 주권자는 이미 이번 달에 채권을 발행했습니다.#!"
 bfl_facility_reason_7: "#O 모든 국채 기록 슬롯이 점유됩니다.#!"
 bfl_facility_tip: "이번 달 관세국채 발행으로 실제로 받은 은행현금. 자금조달은 부채를 발생시키며 근로소득에서 제외됩니다."
 bfl_facility_title: "부채 편익 위임"
 bfl_facility_title_tip: "#T 부채 편익 위임#!\n은행은 고정된 연간 쿠폰으로 맞춤형 국채에 자금을 조달합니다. 끄면 예약된 문제가 중지됩니다. 부채 우선 요청 60% 예측 지출. 버퍼 타겟 200 예상 월별 잔액 후에 금을 상태로 표시합니다. 둘 다 에 정차 500 주 금.\n\n마지막 요청: [Country.MakeScope.GetVariable('bfl_facility_requested').GetValue|2]@gold!\n마지막 자금 조달: [Country.MakeScope.GetVariable('bfl_facility_paid').GetValue|2]@gold!\n\n최대 한 가지 문제와 100 한달에 골드. 은행 현금, 자본, 발행자 능력 및 미지급 쿠폰을 보호하면 무승부를 방지할 수 있습니다. 수익금은 수입이 아니라 자금조달입니다."
 bfl_feedback_1: "수권자본금 수령"
 bfl_feedback_2: "보증금 수령"
 bfl_feedback_3: "인출금 지급"
 bfl_feedback_4: "배당금 지급"
 bfl_feedback_5: "채권재판매 확정"
 bfl_feedback_6: "벤처 수익금 수령"
 bfl_feedback_7: "#O 새로운 유동성 경고#!"
 bfl_feedback_8: "결의안 처리 완료 · 기록된 손실이 계속 표시됨"
 bfl_feedback_9: "#O 시설 대상에 자금이 지원되지 않았습니다.#!"
 bfl_feedback_note: "최근 약정된 거래 · 금액이 이미 예약되었습니다. 이 보기를 열면 과거 효과가 재생되지 않습니다. 모션 감소는 동일한 수신 및 경고를 유지합니다. 발견만으로는 지불 지표가 생성되지 않습니다."
 bfl_feedback_signature: "[GetPlayer.GetTag]:[GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bfl_player_feedback_period')|0]:[GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bfl_player_feedback_sequence')|0]"
 bfl_finance.100.desc: "하나의 영구 전문화를 선택하십시오. 둘 다 국가 신용과 예금을 제공합니다. Merchant Finance는 상품 및 기업 신용 상품을 개발합니다. 해외 투자는 코멘다와 회사 자산을 개발합니다. 연구 및 연령 제한은 계속 적용됩니다."
 bfl_finance.100.merchant: "판매자 금융"
 bfl_finance.100.overseas: "해외투자"
 bfl_finance.100.title: "은행의 전문성"
