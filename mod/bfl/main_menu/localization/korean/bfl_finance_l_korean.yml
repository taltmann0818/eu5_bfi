 STATIC_MODIFIER_DESC_bfl_company_exploration_capacity: "용량 500 탐사 임무가 승인된 동안 선원. 선원은 회사에서 와야 하거나 정치 통제관으로부터 자금을 지원받아야 합니다."
 STATIC_MODIFIER_DESC_bfl_dhe_annual_giro: "은행은 1년 더 존속할 수 있으며 그 권한은 여전히 상원에 달려 있다."
 STATIC_MODIFIER_DESC_bfl_dhe_balanced_captains: "공유 치안은 경쟁 주택의 균형을 유지하여 상업을 지원하는 동시에 공공 수입을 분배합니다."
 STATIC_MODIFIER_DESC_bfl_dhe_banker_captains: "은행 가문은 공화국의 사무실과 수입에 대해 확고한 영향력을 행사했습니다."
 STATIC_MODIFIER_DESC_bfl_dhe_bardi_patronage: "가족 예배당의 화려함은 은행 건물을 돋보이게 합니다."
 STATIC_MODIFIER_DESC_bfl_dhe_bubble_contagion: "투기적 청약이 붕괴되면서 은행의 상장 주식에 대한 신뢰가 약화되었습니다."
 STATIC_MODIFIER_DESC_bfl_dhe_bubble_restructuring: "구조 조정은 은행에 대한 신뢰를 강화하는 반면, 재구성된 계좌 관리로 인해 비용이 증가합니다."
 STATIC_MODIFIER_DESC_bfl_dhe_city_concessions: "은행에 대한 상인의 기부는 시에 대한 양보로 확보되었습니다."
 STATIC_MODIFIER_DESC_bfl_dhe_civic_neutrality: "시뇨리아는 은행이 정당 부문 전반에 걸쳐 코뮌에 봉사할 것을 요구합니다."
 STATIC_MODIFIER_DESC_bfl_dhe_civic_notaries: "공화국의 공증인은 은행 계약에 대한 보다 명확한 공개 계정을 유지합니다."
 STATIC_MODIFIER_DESC_bfl_dhe_credit_contraction_1772: "민간 신용의 실패는 상업과 그것이 유지하는 수입에 영향을 미칩니다."
 STATIC_MODIFIER_DESC_bfl_dhe_credit_relief_1772: "재무부는 위기 동안 신용을 안정적으로 유지하기 위해 자원을 투입했습니다."
 STATIC_MODIFIER_DESC_bfl_dhe_discount_1772: "전문 사무원은 새로운 신용 사업을 더욱 면밀히 조사하여 더 높은 비용으로 조건을 개선합니다."
 STATIC_MODIFIER_DESC_bfl_dhe_english_court_accounts: "왕실 인맥은 수익성이 더 높은 신규 대출 제안을 지원하지만 법정 출석 비용이 많이 듭니다."
 STATIC_MODIFIER_DESC_bfl_dhe_english_wool_factors: "요인들은 영국의 양모 무역을 따라 상업적 연결과 값비싼 집을 유지합니다."
 STATIC_MODIFIER_DESC_bfl_dhe_european_factors: "더 넓은 범위의 요소가 은행을 여러 법원 및 시장에 연결합니다."
 STATIC_MODIFIER_DESC_bfl_dhe_exchequer_register: "재무부는 시와의 마찰을 감수하면서 독립성을 유지하면서 자체 기록을 유지합니다."
 STATIC_MODIFIER_DESC_bfl_dhe_farmed_excises: "개인 수집가는 소비세를 보장하고 상거래에서 가격을 정합니다."
 STATIC_MODIFIER_DESC_bfl_dhe_florentine_settlement: "공개 합의는 오래된 분쟁에 대해 재무부에 비용을 청구하는 동시에 상업 회복을 돕습니다."
 STATIC_MODIFIER_DESC_bfl_dhe_giro_measured_specie: "소규모 시설에서는 은행에 지속적인 비용을 지불하면서 적절한 편의를 제공합니다."
 STATIC_MODIFIER_DESC_bfl_dhe_giro_senate: "상원은 영구 은행 기관에 대한 지속적인 공적 부담을 수락합니다."
 STATIC_MODIFIER_DESC_bfl_dhe_giro_specie: "재무부 보유금과 직원이 있는 카운터는 새로운 정화 시설의 명성을 뒷받침합니다."
 STATIC_MODIFIER_DESC_bfl_dhe_giro_transfer_office: "Giro는 더 넓은 정화 시설에 대한 상인의 요구에도 불구하고 저렴한 도서 양도를 선호합니다."
 STATIC_MODIFIER_DESC_bfl_dhe_giro_winddown: "Giro의 새로운 사업이 종료되면 이체 장부에 익숙해진 상인들이 혼란을 겪게 됩니다."
 STATIC_MODIFIER_DESC_bfl_dhe_grimaldi_concessions: "공화국은 그리말디 회사를 계속 유지하는 대가로 가족의 특권을 인정했습니다."
 STATIC_MODIFIER_DESC_bfl_dhe_guelph_compact: "Bardi의 조상 동맹은 교황권의 친구들에게 공개적인 신용을 부여합니다."
 STATIC_MODIFIER_DESC_bfl_dhe_hired_halls: "흩어져 있는 사무실과 붐비는 카운터는 성장하는 은행의 비용을 가중시킵니다."
 STATIC_MODIFIER_DESC_bfl_dhe_imperial_accounts: "황실에 참석하면 새로운 대출 조건이 지원되고 은행 업무 비용이 증가합니다."
 STATIC_MODIFIER_DESC_bfl_dhe_italian_concentration: "은행은 먼 약속과 이를 유지하는 데 드는 비용을 줄입니다."
 STATIC_MODIFIER_DESC_bfl_dhe_military_giro: "공화국은 상인들의 일반적인 사업보다 군사 회계를 우선시합니다."
 STATIC_MODIFIER_DESC_bfl_dhe_notarial_albergo: "시민 공증인은 가족의 의무를 공통적이고 감독되는 순서로 정리합니다."
 STATIC_MODIFIER_DESC_bfl_dhe_old_litigation: "거대 은행들의 미해결 부채가 계속해서 상업을 방해하고 있습니다."
 STATIC_MODIFIER_DESC_bfl_dhe_ordered_books: "경험이 풍부한 사무원이 은행의 흩어져 있는 계좌를 정리정돈합니다."
 STATIC_MODIFIER_DESC_bfl_dhe_parish_burden: "본당과 인근 지역에는 국고가 자금 지원을 거부한 구호품이 전달됩니다."
 STATIC_MODIFIER_DESC_bfl_dhe_partners_levy: "파트너는 더 넓은 사업을 희생하면서 공공 자원을 보존하는 특별한 부담금을 부담합니다."
 STATIC_MODIFIER_DESC_bfl_dhe_permanent_giro: "지로(Giro)는 만료되는 일련의 권한 대신 안정된 행정을 갖고 있습니다."
 STATIC_MODIFIER_DESC_bfl_dhe_plague_accounts: "은행은 긴급 지출을 위해 추가 등록부와 직원을 유지해야 합니다."
 STATIC_MODIFIER_DESC_bfl_dhe_public_bubble_relief: "청약이 붕괴된 후 신뢰를 회복하는 데 드는 비용은 공공 지갑에서 부담합니다."
 STATIC_MODIFIER_DESC_bfl_dhe_public_register: "공공청약과 양도는 은행과의 합의에 따라 기록됩니다."
 STATIC_MODIFIER_DESC_bfl_dhe_register_clerks: "정규직 직원은 공공 주식 등록부를 보관하고 배당금을 지급합니다."
 STATIC_MODIFIER_DESC_bfl_dhe_republic_first: "공화국은 외국 법원 계좌의 외교적 이점보다 자국의 수입을 선호합니다."
 STATIC_MODIFIER_DESC_bfl_dhe_reserves_1772: "공공 기부는 은행 준비금에 대한 신뢰를 강화합니다."
 STATIC_MODIFIER_DESC_bfl_dhe_retained_earnings: "새로운 수익은 소유자에게 분배되지 않고 은행에 남아 있습니다. 다른 정책이 채택되지 않는 한, 본 계약이 만료되면 이전 배당 정책이 재개됩니다."
 STATIC_MODIFIER_DESC_bfl_dhe_separate_offices: "은행가들은 국가 업무를 스스로 지시하기보다는 공무원과 협상해야 합니다."
 STATIC_MODIFIER_DESC_bfl_dhe_south_sea_failures: "청약 실패와 부채 문제로 인해 시의 일상 업무가 중단됩니다."
 STATIC_MODIFIER_DESC_bfl_dhe_threadneedle_merchants: "소유주는 영구 건물과 보다 효율적인 은행 건물에 대한 비용을 지불했습니다."
 STATIC_MODIFIER_DESC_bfl_dhe_threadneedle_public: "영구 공공 시설은 은행 부서를 명령된 행정부 아래로 가져옵니다."
 STATIC_MODIFIER_DESC_bfl_dhe_ungilded_accounts: "공공 자원은 가족 후원에 사용되기보다는 계정에 보관되었습니다."
 STATIC_MODIFIER_DESC_bfl_dhe_venetian_relief: "공공 예산은 공화국의 수입에 부담을 주면서 민간 상업을 유지합니다."
 STATIC_MODIFIER_DESC_bfl_dhe_war_accounts: "Giro는 군비 지급에 대해 별도의 비용이 많이 드는 관리를 유지합니다."
