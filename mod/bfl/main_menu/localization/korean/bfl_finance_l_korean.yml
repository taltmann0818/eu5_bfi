 bfl_offering_open: "열기"
 bfl_operating_costs: "월 운영비"
 bfl_operating_costs_tip: "활성 예금 계좌, 계약, 지점 및 자산 클래스를 통해 고정 월 비용 규모가 조정됩니다. State Chartered Bank 개혁은 다음과 같이 비용을 절감합니다. 5%, 은행업무 10%, 고급 청산 15%, 효율적인 관리 10%, 완공된 은행 본점 15%, 그리고 소유한 피렌체 은행 궁전 10%. 총 감소액은 다음으로 제한됩니다. 75%. 미지급 비용은 부채로 남아 배당금을 차단합니다."
 bfl_overview: "계정 및 전문 분야"
 bfl_overview_hint: "자산: 외부 링 = 유형; 내부 링 = 국가. 색상 분석을 보려면 마우스를 가져가세요."
 bfl_palace_saint_george: "세인트 조지 궁전"
 bfl_palace_saint_george_desc: "제노아 항구 옆에 있는 궁전은 공화국의 채권자들에게 공동의 집을 제공합니다. 은행의 지속적인 권한은 은행 주식에 대한 신뢰를 강화하는 반면, 숙련된 사무원은 부채와 수익을 관리하도록 명령합니다."
 bfl_palace_saint_george_maintenance: "세인트 조지 궁전 관리"
 bfl_palazzo_acciaiuoli: "팔라초 아치아이우올리"
 bfl_palazzo_acciaiuoli_desc: "피렌체 궁전의 차분한 돌담 뒤에서 Acciaioli는 한 지붕 아래 흩어진 계정을 가져옵니다. 직원들의 질서 있는 업무는 은행의 운영 비용을 줄여줍니다."
 bfl_palazzo_acciaiuoli_maintenance: "Palazzo Acciaiuoli 관리"
 bfl_palazzo_busini_bardi: "팔라조 부시니-바르디"
 bfl_palazzo_busini_bardi_desc: "이렇게 질서정연한 돌담 안에서 Bardi는 유럽 전역의 법원과 계수 주택에서 회계를 수집합니다. 완성된 궁전은 은행 관리를 10% 줄이고 새로 제공되는 대출 금리에 일반적인 한도에 따라 0.5% 포인트를 추가합니다. 기존 계약은 합의된 요율을 유지합니다."
 bfl_palazzo_busini_bardi_maintenance: "Palazzo Busini-Bardi 행정부"
 bfl_palazzo_peruzzi: "팔라초 페루치"
 bfl_palazzo_peruzzi_desc: "페루치족은 회계원과 옷감 상인의 상업을 통합합니다. 그들의 점원은 먼 시장이 유지하는 지붕 아래에서 의무를 해결합니다. 완성된 궁전은 은행 행정을 10% 줄였습니다. 직물 사업은 현지 시장에 수요를 추가하여 수요와 공급이 허용하는 대로 고급 직물 가격을 뒷받침합니다."
 bfl_palazzo_peruzzi_maintenance: "Palazzo Peruzzi 관리"
 bfl_palazzo_salimbeni: "팔라조 살림베니"
 bfl_palazzo_salimbeni_desc: "살림베니(Salimbeni) 궁전의 엄격한 벽 안에 있는 시에나는 지속적인 기관에 저축을 맡깁니다. 신중한 행정과 환자의 신용 연장은 은행과 도움을 구하는 사람들 모두를 지탱합니다."
 bfl_palazzo_salimbeni_maintenance: "Palazzo Salimbeni 관리"
 bfl_payout_0: "이익을 유지"
 bfl_payout_0_short: "유지"
 bfl_payout_0_tip: "모든 적격 실현 이익을 유지합니다. 이 정책에서는 새로운 배당금이 지급되지 않습니다. 이익잉여금은 유동성과 형평성을 뒷받침합니다."
 bfl_payout_25: "25% 지불금"
 bfl_payout_25_short: "25%"
 bfl_payout_25_tip: "최대 할당 25% 적격 실현 이익을 손실 후 배당금으로 계산합니다. 사용 가능한 현금, 자본 여유 및 기록된 소유권은 여전히 ​​지불을 제한합니다."
 bfl_payout_50: "50% 지불금"
 bfl_payout_50_short: "50%"
 bfl_payout_50_tip: "최대 할당 50% 적격 실현 이익을 손실 후 배당금으로 계산합니다. 사용 가능한 현금, 자본 여유 및 기록된 소유권은 여전히 ​​지불을 제한합니다."
 bfl_peasants_estate_workout_mandate: "부동산 운동 명령"
 bfl_peasants_estate_workout_mandate_desc: "이 부동산은 정부가 자신을 대신하여 자발적인 은행 예금 워크아웃을 검토할 수 있는 권한을 명시적으로 부여합니다. 모든 제안은 여전히 ​​별도의 승인이 필요합니다. 이 특권을 취소하면 보류 중인 유산 조건이 무효화됩니다. 복구 지불은 자산 지갑으로 계속됩니다."
 bfl_peruzzi_cloth_demand: "페루치 옷감 상업"
 bfl_place_deposit_1: "열기 100 금 요구불 예금"
 bfl_place_deposit_1_act: "$bfl_place_deposit_1$"
 bfl_place_deposit_1_desc: "독립 은행은 최소한의 의견을 요구합니다. +50 당신을 향해 계좌를 개설합니다. 귀하의 공인 은행은 추가 혜택을 제공합니다 1% 연간이자. 수요이자는 자금이 조달되면 매월 지급됩니다. 미지급 이자가 계속 남아 있습니다. 관계가 무너지면 자신의 성숙한 주장이 철회되는 것을 결코 막을 수 없습니다."
 bfl_place_deposit_1_effect_text: "$bfl_place_deposit_1$"
 bfl_place_deposit_1_effect_text_past: "$bfl_place_deposit_1$"
 bfl_place_deposit_2: "열기 100 금 정기 예금"
 bfl_place_deposit_2_act: "$bfl_place_deposit_2$"
 bfl_place_deposit_2_desc: "독립 은행은 최소한의 의견을 요구합니다. +50 당신을 향해 계좌를 개설합니다. 귀하의 공인 은행은 추가 혜택을 제공합니다 1% 연간이자. 수요이자는 자금이 조달되면 매월 지급됩니다. 미지급 이자가 계속 남아 있습니다. 관계가 무너지면 자신의 성숙한 주장이 철회되는 것을 결코 막을 수 없습니다."
