 bfl_custom_bonds_title: "국채"
 bfl_custom_bonds_title_tip: "은행은 주정부에 현금을 빌려주고 채권을 받습니다. 소유자는 매달 이자와 상환금을 받습니다. 총 차입 한도는 다음과 같습니다. 24 몇 달 간의 기본 소득, 500-골드 시작 수당. 채권 이자는 최대 한도까지 사용할 수 있습니다. 25% 기본 소득의. 미지급 이자는 새로운 채권과 판매를 차단합니다."
 bfl_cycle_bond_rate_tip: "새 채권에 대한 연간 이자를 변경합니다. 1%, 3% 또는 6%. 기존 채권은 금리를 유지합니다."
 bfl_cycle_deposit_rate_tip: "신규 예금에 대한 이자 변경: 0%, 1% 또는 2% 1년. 기존 계정은 요율을 유지합니다."
 bfl_cycle_facility_tip: "월별 자금 변경: 끄기, 비용 또는 현금 버퍼. 비용은 주정부 지출의 일부입니다. 현금 완충 장치는 주정부 현금을 보충합니다. 둘 다 수동 대출과 월별 한도를 공유합니다."
 bfl_cycle_payout_tip: "배당금 변경: 모든 이익을 유지하고 지불 25%또는 지불 50%. 지불에는 비용과 손실을 차감한 수익이 사용됩니다. 배당 정책에 대한 통제가 필요합니다."
 bfl_cycle_share_offering_tip: "새로운 공유 구독을 열거나 닫습니다. 유료 구독에는 자본금과 신주가 추가됩니다. 기존 소유자는 지분과 배당권을 유지합니다."
 bfl_dealer_inventory_class: "마켓 메이커 인벤토리 · 투표 없음"
 bfl_debt: "기본 부채 포트폴리오"
 bfl_debt_explanation: "공인 은행은 맞춤형 국채에 자금을 지원합니다. 2차 거래를 위해서는 조기 이벤트 보조금을 포함하여 양쪽에서 완료된 증권 거래소가 필요합니다. 기본 신용은 승인된 제안을 사용하고 지속적인 청구 기록을 통해 부채 탕감을 조사합니다."
 bfl_debt_facility: "부채 제도"
 bfl_debt_resale: "부채 재판매"
 bfl_debt_resale_tip: "#T 국채 재판매#!\n2차 국채를 매매하려면 증권거래소 선지급과 소유 증권거래소 건물이 필요합니다. 공개 오퍼링은 다음에 대한 동일한 사용자 정의 청구를 전송합니다. 98% 액면가의; 발행자는 새로운 수익금을 받지 않습니다. 쿠폰과 상환은 구매자를 따릅니다."
 bfl_debt_restructuring: "부채 구조조정"
 bfl_debt_restructuring_desc: "지정된 날에 회수할 수 없는 부채가 반드시 가치가 없는 부채일 필요는 없습니다. 채권자는 어려움을 겪고 있는 채무자를 완전히 불이행하게 만드는 것보다 새로운 조건에 동의함으로써 자신의 청구권을 더 많이 보존할 수 있습니다."
 bfl_debt_tip: "#T 부채와 신용#!\n대출, 인수, 구조 조정 및 부채 양도에 대한 허가. 각 행에는 고유한 연구, 전문화, 유동성 및 실행 요구 사항이 있습니다. 잠금은 새로운 원본을 사용할 수 없음을 의미합니다. 기존 청구는 취소되지 않습니다."
 bfl_demand_deposit: "요구불예금"
 bfl_deposit_1: "예금 100 주문형 금"
 bfl_deposit_1_tip: "#T 요구불예금#!\n환승 100 귀하의 공인 은행에 금을 주십시요. 신규 계정의 연간 제안은 표시된 기본 요율에 1% 전세 프리미엄. 수요 이자는 자금이 조달되면 매월 재무부에 센트 캐리로 지급됩니다. 미지급 이자가 남아있습니다. 기존 계정은 허용되는 요율을 유지합니다. 인출은 원금과 미지급 이자를 상환합니다. 독립 은행은 외교를 통해 예금을 받습니다. +50 의견 이상을 선택하고 기본 요율을 제공합니다."
 bfl_deposit_2: "예금 100 금 12 개월"
 bfl_deposit_2_tip: "#T 정기예금#!\n환승 100 12개월 동안 귀하의 공인 은행에 금을 보관하십시오. 신규 계정의 연간 제안은 표시된 기간 요금에 1% 전세 프리미엄. 이자는 매월 발생하며 만기 시 원금과 함께 지급됩니다. 기본 뱅킹, 허용 연령 및 무료 계정 슬롯이 필요합니다. 독립 기간 계정은 외교를 통해 이용 가능합니다. +50 의견이나 그 이상."
 bfl_deposit_accounts_heading: "예금 계좌"
 bfl_deposit_amount: "예금"
 bfl_deposit_amount_desc: "입금할 금액을 선택하세요. 정기예금은 12개월간 운용됩니다."
 bfl_deposit_amount_label: "입금액"
 bfl_deposit_amount_tip: "은행과 금액을 선택하세요. 재무부 현금을 계좌로 옮기십시오. 이자와 인출은 예금자에게 속합니다. 귀하가 확인하면 은행은 자금과 조건을 다시 확인합니다."
 bfl_deposit_decline_tip: "전체 보증금 청구권을 유지하십시오. 현금 이동도 없고 주식도 발행되지 않습니다."
 bfl_deposit_equity_tip: "살아남은 은행이 긍정적인 유형의 NAV와 주주 능력을 보유하고 있는 경우에만 인용된 청구권을 실제 주식으로 전환하십시오. 구독 현금이나 수입이 생성되지 않습니다."
 bfl_deposit_explanation: "각 계정에는 허용되는 고정 연율이 저장됩니다. 요율을 변경하면 새 계정에 영향을 미칩니다. 기간 계정은 다음 이후에 만기됩니다. 12 개월. 인출 부족은 여전히 ​​부채로 남아 있으며 새로운 약정을 중단합니다."
 bfl_deposit_haircut_tip: "인용된 내용을 수락하세요. 20% 채권자, 남은 청구권, 조사 및 권한을 다시 확인한 후 감면됩니다. 기록된 공공 보증은 별도로 자금이 지원됩니다."
 bfl_deposit_income_tip: "실제로 이번 달에는 귀하의 공인 은행과 독립 은행이 지불한 수요 이자가 있습니다. 미지급 이자가 남아 있습니다. 원금인출과 자본출자는 제외됩니다."
 bfl_deposit_interest: "예금이자"
 bfl_deposit_ledger_help: "각 계좌는 합의된 이자율을 유지합니다. 정기예금은 12개월간 유효합니다. 돈과 이자는 예금자에게 돌아갑니다."
 bfl_deposit_ledger_subtitle: "당좌계좌"
 bfl_deposit_ledger_title: "예금자"
 bfl_deposit_ledger_title_tip: "이 은행에 돈이 있는 사람은 누구입니까? 계좌 및 출금을 확인하려면 마우스를 올리세요."
 bfl_deposit_policy_title: "예금율"
 bfl_deposit_policy_title_tip: "신규 예금에 제공되는 연간 금리입니다. 기존 예금은 합의된 금리를 유지합니다."
 bfl_deposit_total: "예금"
 bfl_deposit_total_tip: "미지급 이자를 포함하여 은행이 예금자에게 갚아야 할 돈입니다."
 bfl_deposits: "예금 및 금리"
 bfl_deposits_label: "예금 청구"
 bfl_dev_notice: "자금 지원 신용, 국채, 회사 투자, 상품, 칭찬 및 금융 서비스는 연구, 프로필 및 건축 요구 사항을 따릅니다. 릴리스 전체의 캠페인 균형 및 호환성은 여전히 ​​검증 중입니다."
 bfl_dhe_annual_giro: "지로에 대한 연간 의무 사항"
 bfl_dhe_annual_giro_desc: "은행은 1년 더 존속할 수 있으며 그 권한은 여전히 상원에 달려 있다."
 bfl_dhe_annuity_tt: "자금을 지원받는 정부 채권을 만듭니다. 100@gold! 은행이 보유하고 고정된 금액을 지불함 5% 연간쿠폰. 기존 채권은 금리를 유지합니다."
 bfl_dhe_approve_tt: "우리에 대한 은행의 의견은 다음과 같이 높아집니다. 15 버거 만족도는 5 백분율 포인트."
 bfl_dhe_audit_tt: "지불 100 ducats는 은행 장부를 재구성합니다. 은행 관리 비용이 감소합니다. 5 에 대한 백분율 포인트 10 년."
 bfl_dhe_balanced_captains: "균형 잡힌 치안 판사"
 bfl_dhe_balanced_captains_desc: "공유 치안은 경쟁 주택의 균형을 유지하여 상업을 지원하는 동시에 공공 수입을 분배합니다."
 bfl_dhe_banker_captains: "은행가 선장"
 bfl_dhe_banker_captains_desc: "은행 가문은 공화국의 사무실과 수입에 대해 확고한 영향력을 행사했습니다."
 bfl_dhe_bardi_patronage: "바르디 후원의 영광"
 bfl_dhe_bardi_patronage_desc: "가족 예배당의 화려함은 은행 건물을 돋보이게 합니다."
 bfl_dhe_bubble_contagion: "은행과 실패한 구독"
 bfl_dhe_bubble_contagion_desc: "투기적 청약이 붕괴되면서 은행의 상장 주식에 대한 신뢰가 약화되었습니다."
 bfl_dhe_bubble_restructuring: "남해 구조조정 계정"
 bfl_dhe_bubble_restructuring_desc: "구조 조정은 은행에 대한 신뢰를 강화하는 반면, 재구성된 계좌 관리로 인해 비용이 증가합니다."
 bfl_dhe_buyback_quote_tt: "은행 지불: [SCOPE.sCountry('bfl_event_bank').MakeScope.GetVariable('bfl_dhe_buy_price').GetValue|2]@gold!\n취소된 주식: [SCOPE.sCountry('bfl_event_bank').MakeScope.GetVariable('bfl_dhe_buy_units').GetValue|3]\n주당 NAV: [SCOPE.sCountry('bfl_event_bank').MakeScope.GetVariable('bfl_dhe_buy_nav').GetValue|3]@gold!"
 bfl_dhe_buyback_tt: "은행은 최대 한도까지 재무부에 지불합니다. 5% 공시된 순자산 가치로 발행 주식을 소각한 후 해당 주식을 취소합니다. 은행은 미사용 현금과 자본 여유로 지불금을 충당해야 합니다. 다른 주주들은 자신의 단위를 보유합니다."
 bfl_dhe_city_concessions: "시에 대한 양보"
 bfl_dhe_city_concessions_desc: "은행에 대한 상인의 기부는 시에 대한 양보로 확보되었습니다."
 bfl_dhe_civic_neutrality: "세력 위의 은행"
 bfl_dhe_civic_neutrality_desc: "시뇨리아는 은행이 정당 부문 전반에 걸쳐 코뮌에 봉사할 것을 요구합니다."
 bfl_dhe_civic_notaries: "공화국의 공증인"
 bfl_dhe_civic_notaries_desc: "공화국의 공증인은 은행 계약에 대한 보다 명확한 공개 계정을 유지합니다."
 bfl_dhe_credit_contraction_1772: "신용의 수축"
 bfl_dhe_credit_contraction_1772_desc: "민간 신용의 실패는 상업과 그것이 유지하는 수입에 영향을 미칩니다."
 bfl_dhe_credit_relief_1772: "재무부의 신용 구제"
 bfl_dhe_credit_relief_1772_desc: "재무부는 위기 동안 신용을 안정적으로 유지하기 위해 자원을 투입했습니다."
 bfl_dhe_discount_1772: "감독 할인 사무소"
 bfl_dhe_discount_1772_desc: "전문 사무원은 새로운 신용 사업을 더욱 면밀히 조사하여 더 높은 비용으로 조건을 개선합니다."
 bfl_dhe_english_court_accounts: "영국 법원 계정"
 bfl_dhe_english_court_accounts_desc: "왕실 인맥은 수익성이 더 높은 신규 대출 제안을 지원하지만 법정 출석 비용이 많이 듭니다."
 bfl_dhe_english_wool_factors: "영국 양모 요인"
 bfl_dhe_english_wool_factors_desc: "요인들은 영국의 양모 무역을 따라 상업적 연결과 값비싼 집을 유지합니다."
 bfl_dhe_european_factors: "산 조르지오의 유럽적 요인"
 bfl_dhe_european_factors_desc: "더 넓은 범위의 요소가 은행을 여러 법원 및 시장에 연결합니다."
 bfl_dhe_exchequer_register: "독립 재무관 등록부"
 bfl_dhe_exchequer_register_desc: "재무부는 시와의 마찰을 감수하면서 독립성을 유지하면서 자체 기록을 유지합니다."
 bfl_dhe_farmed_excises: "개인 수집가에게 귀속되는 소비세"
 bfl_dhe_farmed_excises_desc: "개인 수집가는 소비세를 보장하고 상거래에서 가격을 정합니다."
 bfl_dhe_favored: "은행의 입장을 지지함"
 bfl_dhe_florentine_settlement: "구계좌의 공개결제"
 bfl_dhe_florentine_settlement_desc: "공개 합의는 오래된 분쟁에 대해 재무부에 비용을 청구하는 동시에 상업 회복을 돕습니다."
 bfl_dhe_fund_tt: "구독 100 은행의 순자산 가치로 재무부에서 두캇을 받습니다. 새로 발행된 주식을 받습니다. 기존 소유자는 비례적으로 희석됩니다."
 bfl_dhe_giro_measured_specie: "측정된 종 창"
 bfl_dhe_giro_measured_specie_desc: "소규모 시설에서는 은행에 지속적인 비용을 지불하면서 적절한 편의를 제공합니다."
 bfl_dhe_giro_senate: "상원의 영구 은행 요금"
 bfl_dhe_giro_senate_desc: "상원은 영구 은행 기관에 대한 지속적인 공적 부담을 수락합니다."
 bfl_dhe_giro_specie: "지로의 공개 종 창"
 bfl_dhe_giro_specie_desc: "재무부 보유금과 직원이 있는 카운터는 새로운 정화 시설의 명성을 뒷받침합니다."
 bfl_dhe_giro_transfer_office: "공공 환승 사무실"
 bfl_dhe_giro_transfer_office_desc: "Giro는 더 넓은 정화 시설에 대한 상인의 요구에도 불구하고 저렴한 도서 양도를 선호합니다."
 bfl_dhe_giro_winddown: "지로의 와인딩 다운"
 bfl_dhe_giro_winddown_desc: "Giro의 새로운 사업이 종료되면 이체 장부에 익숙해진 상인들이 혼란을 겪게 됩니다."
 bfl_dhe_grimaldi_concessions: "그리말디 가문의 양보"
 bfl_dhe_grimaldi_concessions_desc: "공화국은 그리말디 회사를 계속 유지하는 대가로 가족의 특권을 인정했습니다."
 bfl_dhe_guelph_compact: "바르디 구엘프 협약"
 bfl_dhe_guelph_compact_desc: "Bardi의 조상 동맹은 교황권의 친구들에게 공개적인 신용을 부여합니다."
 bfl_dhe_hired_halls: "붐비는 고용 홀"
 bfl_dhe_hired_halls_desc: "흩어져 있는 사무실과 붐비는 카운터는 성장하는 은행의 비용을 가중시킵니다."
 bfl_dhe_imperial_accounts: "산 조르지오의 황실 기록"
 bfl_dhe_imperial_accounts_desc: "황실에 참석하면 새로운 대출 조건이 지원되고 은행 업무 비용이 증가합니다."
 bfl_dhe_issue_tt: "버거가 돈을 내는구나 100 순자산가치로 새로 발행된 은행주에 대한 두캇. 추가 자본 청약을 위해 은행을 열고 주식을 상장하세요. 기존 소유자는 희석됩니다. 나중에 재판매하면 판매자에게 비용이 지불됩니다."
 bfl_dhe_italian_concentration: "이탈리아 집중"
 bfl_dhe_italian_concentration_desc: "은행은 먼 약속과 이를 유지하는 데 드는 비용을 줄입니다."
 bfl_dhe_military_giro: "군사계정 우선순위"
 bfl_dhe_military_giro_desc: "공화국은 상인들의 일반적인 사업보다 군사 회계를 우선시합니다."
 bfl_dhe_notarial_albergo: "공증인 협약"
 bfl_dhe_notarial_albergo_desc: "시민 공증인은 가족의 의무를 공통적이고 감독되는 순서로 정리합니다."
 bfl_dhe_old_litigation: "오래된 은행 부채에 대한 소송"
 bfl_dhe_old_litigation_desc: "거대 은행들의 미해결 부채가 계속해서 상업을 방해하고 있습니다."
 bfl_dhe_ordered_books: "은행장부 주문"
 bfl_dhe_ordered_books_desc: "경험이 풍부한 사무원이 은행의 흩어져 있는 계좌를 정리정돈합니다."
 bfl_dhe_papal_friend: "구엘프 협정(Guelph Compact)을 체결했습니다."
 bfl_dhe_papal_respect: "피렌체 주택을 화해했습니다."
 bfl_dhe_parish_burden: "베네치아 교구의 부담"
 bfl_dhe_parish_burden_desc: "본당과 인근 지역에는 국고가 자금 지원을 거부한 구호품이 전달됩니다."
 bfl_dhe_partners_levy: "은행 파트너에 대한 부과금"
 bfl_dhe_partners_levy_desc: "파트너는 더 넓은 사업을 희생하면서 공공 자원을 보존하는 특별한 부담금을 부담합니다."
 bfl_dhe_permanent_giro: "영구 방코 델 지로"
 bfl_dhe_permanent_giro_desc: "지로(Giro)는 만료되는 일련의 권한 대신 안정된 행정을 갖고 있습니다."
 bfl_dhe_petition_granted: "은행의 청원을 들었다"
 bfl_dhe_petition_refused: "은행의 청원을 거부함"
 bfl_dhe_plague_accounts: "지로의 구호 계좌"
 bfl_dhe_plague_accounts_desc: "은행은 긴급 지출을 위해 추가 등록부와 직원을 유지해야 합니다."
 bfl_dhe_primary_shares_tt: "시민은 순자산 가치로 새로 발행된 주식을 받아 기존 소유주를 희석시킵니다."
 bfl_dhe_public_bubble_relief: "남해 구조의 공공 비용"
 bfl_dhe_public_bubble_relief_desc: "청약이 붕괴된 후 신뢰를 회복하는 데 드는 비용은 공공 지갑에서 부담합니다."
 bfl_dhe_public_register: "은행의 공공 등록부"
 bfl_dhe_public_register_desc: "공공청약과 양도는 은행과의 합의에 따라 기록됩니다."
 bfl_dhe_rebuffed: "은행의 입장을 거부함"
 bfl_dhe_refuse_tt: "우리에 대한 은행의 의견은 다음과 같습니다. 20 버거 만족도는 떨어지죠 5 백분율 포인트."
 bfl_dhe_register_clerks: "공공 등록부 서기"
 bfl_dhe_register_clerks_desc: "정규직 직원은 공공 주식 등록부를 보관하고 배당금을 지급합니다."
 bfl_dhe_republic_first: "외국 왕관 이전의 공화국"
 bfl_dhe_republic_first_desc: "공화국은 외국 법원 계좌의 외교적 이점보다 자국의 수입을 선호합니다."
 bfl_dhe_reserves_1772: "신용위기로 인한 준비금 강화"
 bfl_dhe_reserves_1772_desc: "공공 기부는 은행 준비금에 대한 신뢰를 강화합니다."
 bfl_dhe_retain_tt: "에 대한 새로운 배당금 분배를 중단합니다. 24 개월. 그 동안 변경되지 않는 한 이전 지급 정책이 재개됩니다. 승인된 청구는 지불 가능한 상태로 유지됩니다."
 bfl_dhe_retained_earnings: "은행에 유보된 배당금"
 bfl_dhe_retained_earnings_desc: "새로운 수익은 소유자에게 분배되지 않고 은행에 남아 있습니다. 다른 정책이 채택되지 않는 한, 본 계약이 만료되면 이전 배당 정책이 재개됩니다."
 bfl_dhe_royal_friend: "왕관의 계정을 육성했습니다"
 bfl_dhe_royal_rival: "라이벌 왕관을 선호함"
 bfl_dhe_separate_offices: "별도의 공공 및 은행 사무소"
 bfl_dhe_separate_offices_desc: "은행가들은 국가 업무를 스스로 지시하기보다는 공무원과 협상해야 합니다."
 bfl_dhe_south_sea_failures: "교류골목의 실패"
 bfl_dhe_south_sea_failures_desc: "청약 실패와 부채 문제로 인해 시의 일상 업무가 중단됩니다."
 bfl_dhe_stale: "상황이 바뀌었습니다. 청원을 기각합니다."
 bfl_dhe_threadneedle_merchants: "소유주 날개"
 bfl_dhe_threadneedle_merchants_desc: "소유주는 영구 건물과 보다 효율적인 은행 건물에 대한 비용을 지불했습니다."
 bfl_dhe_threadneedle_public: "Threadneedle Street 설립"
 bfl_dhe_threadneedle_public_desc: "영구 공공 시설은 은행 부서를 명령된 행정부 아래로 가져옵니다."
 bfl_dhe_trade_friend: "영어 요소를 환영"
 bfl_dhe_ungilded_accounts: "후원 전 계정"
 bfl_dhe_ungilded_accounts_desc: "공공 자원은 가족 후원에 사용되기보다는 계정에 보관되었습니다."
 bfl_dhe_venetian_relief: "공화국의 구호 예산"
 bfl_dhe_venetian_relief_desc: "공공 예산은 공화국의 수입에 부담을 주면서 민간 상업을 유지합니다."
 bfl_dhe_war_accounts: "지로의 군사 기록부"
 bfl_dhe_war_accounts_desc: "Giro는 군비 지급에 대해 별도의 비용이 많이 드는 관리를 유지합니다."
 bfl_distress: "조난 및 개발 게이트"
 bfl_distribution_title: "배당금 지급"
 bfl_distribution_title_tip: "소유자에게 지급되는 적격 월별 이익의 몫입니다. 나머지는 은행에 남아있습니다."
 bfl_dividend_breakdown: "은행 배당금"
 bfl_dividend_breakdown_subtitle: "연이율 및 월정산"
 bfl_dividend_calculation: "월별 배당금 계산"
 bfl_dividend_explanation: "예금이자, 운영비, 손실자금을 제외한 월 순이익은 배당금입니다. 각 소유자는 소유한 주식에 발행 주식당 자금 지원 지급액을 곱하여 받습니다. 이익잉여금은 다음 달에 다시 분배되지 않습니다."
 bfl_dividend_rate_note: "연이율은 약속이 아닌 지난 달 수입에 12를 곱한 금액입니다. 은행 비용에는 예금이자, 운영 비용 및 손실 손실이 포함됩니다. 각 소유자는 두카트(ducats)와 센트(cents)로 반올림된 자금 지급액 중 자신의 몫을 받습니다."
 bfl_draw_bond: "빌리기 100 은행에서"
 bfl_draw_bond_tip: "공인 은행이 지불합니다. 100 영구 주권 채권을 위한 금. 매달 여러 호에 자금을 지원받을 수 있습니다. 1,000 총 금. 은행은 충분한 현금과 자본을 보유해야 하고, 국가는 이자를 감당해야 합니다. 수익금은 자금 조달입니다. 현재 보유자에게 액면가를 상환하여 폐기합니다."
 bfl_equity_debt: "은행 자기자본 및 부채"
 bfl_equity_debt_tip: "#T 은행 자기자본과 부채#!\n최대 12개의 실제 월별 정산 스냅샷. 녹색은 자산에서 부채를 뺀 값입니다. 빨간색은 은행의 총 부채입니다. 둘 다 음수 형평성을 포함하여 자동으로 조정되는 동일한 금 축을 사용합니다. 샘플은 왼쪽의 가장 오래된 것부터 오른쪽의 최신 것까지 실행됩니다. 해당 값과 회계 월을 보려면 샘플 위로 마우스를 가져가세요. 주정부 대출은 이 은행 내역에 포함되지 않습니다."
 bfl_equity_detail_title: "지분 [Country.GetName]"
 bfl_equity_label: "형평성"
 bfl_equity_label_tip: "#T 은행 자산#!\n의무 이행 후 은행 소유주에게 귀속되는 잔존 가치입니다.\n\n자산: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_assets')|2]@gold!\n총 부채 감소: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_liabilities')|2]@gold!\n자산: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_equity')|2]@gold!\n\n기록된 상태 단위: [Country.MakeScope.GetVariable('bfl_state_units').GetValue|2]\n총 소유권 단위: [Country.MakeScope.GetVariable('bfl_total_units').GetValue|2]\n자본 여유: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_capital_headroom')|2]@gold!\n\n마이너스 형평은 파산을 의미합니다. 자본 여유는 위의 자본입니다. 10% 최소 0의 자산; 분배는 이 여유 공간과 사용 가능한 현금에 의해 제한됩니다. 자본은 즉시 인출할 수 있는 금액이 아닙니다."
 bfl_equity_market: "주가 및 내역"
 bfl_equity_subscribe_0: "재무부: 구독 100 금"
 bfl_equity_subscribe_0_tip: "기본 NAV 구독: 발행자에게 비용을 지불하고 기존 보유자를 희석시킵니다. 부동산 매입은 실제 부동산 지갑을 이용, 보존 25 금. 은행 투자자는 자신의 보호된 현금과 자본 잉여분만을 사용합니다. 회사 지분에는 해외 투자 조사가 필요합니다."
 bfl_equity_subscribe_1: "버거: 구독 100 금"
 bfl_equity_subscribe_1_tip: "기본 NAV 구독: 발행자에게 비용을 지불하고 기존 보유자를 희석시킵니다. 부동산 매입은 실제 부동산 지갑을 이용, 보존 25 금. 은행 투자자는 자신의 보호된 현금과 자본 잉여분만을 사용합니다. 회사 지분에는 해외 투자 조사가 필요합니다."
 bfl_equity_subscribe_2: "귀족: 구독 100 금"
