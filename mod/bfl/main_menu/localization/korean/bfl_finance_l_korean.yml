 bfl_accept_money_claims.desc: "모드 상호 작용을 통해 동등하게 제공되는 전액 자금 청구서 및 메모 수락을 자발적으로 수락하거나 중단합니다. 이체에는 여전히 사용 가능한 재무가 필요합니다. 수락된 청구는 수락이 종료된 후에도 계속 상환 가능합니다. 기본 결제에서는 계속해서 금을 사용합니다."
 bfl_accept_money_claims.title: "은행 지불 청구 수락 전환"
 bfl_accounts_explanation: "원주민 재무부는 현금입니다. 예금과 어음은 부채입니다. 대출은 현금을 자산으로 교환합니다. 원금, 청약, 발행은 수익이 아닙니다."
 bfl_activity_title: "당기순이익"
 bfl_activity_title_tip: "기본 쿠폰 관찰은 기본 순예산을 분류합니다. 그들은 금을 두 번 옮기지 않습니다. 정산된 기본 보상금은 손익을 인식하기 전에 실제 취득 비용을 공개합니다. 회사 배포 및 사용자 정의 자금 영수증은 자체 버킷에 입력됩니다. 원금, 예금, 청약금은 수익에서 제외됩니다."
 bfl_administer_estates: "상속받은 금융자산을 관리합니다."
 bfl_administer_estates.desc: "파괴된 기관의 별도로 보유된 현금과 채권을 검토합니다. 수탁 기관은 현금을 국고의 일부로 삼지 않습니다."
 bfl_administer_estates.title: "상속받은 금융자산을 관리합니다."
 bfl_administer_estates_desc: "파괴된 기관의 별도로 보유된 현금과 채권을 검토합니다. 수탁 기관은 현금을 국고의 일부로 삼지 않습니다."
 bfl_advanced_clearing: "고급 청산"
 bfl_advanced_clearing_desc: "서로 많은 지불금을 지불해야 하는 은행은 모든 채무를 별도로 동전으로 결제할 필요가 없습니다. 청산 계좌는 청구를 조정하고 남은 잔액만 이체하여 상거래를 유지하는 데 필요한 비용을 줄입니다."
 bfl_advanced_tip: "연구를 통해 권한이 해제됩니다. 은행은 또한 전문화, 유동성 및 운영 요구 사항을 충족해야 합니다. 사용할 수 없는 실행은 비활성화된 상태로 유지됩니다."
 bfl_ai_equity_offering: "은행 승인 및 공개 유급 자본 제공"
 bfl_ai_equity_offering_desc: "AI 경영진은 실제 은행을 인정하고 주식 거래 및 교환 완료 후 유료 기본 구독을 승인할 수 있습니다. 입장 시 현금이나 주식이 생성되지 않습니다."
 bfl_ai_equity_purchase: "자금을 조달한 교환 투자를 고려하세요"
 bfl_ai_equity_purchase_desc: "AI 구매는 플레이어와 동일한 실시간 연구, 건물, 권한, 용량 및 정확한 견적 확인을 사용합니다. 월별 기회 검토(최소) 500 현금과 자본잉여의 금. 위의 시장은 묻지 않습니다."
 bfl_ai_exchange_priority: "증권거래소 접근 우선순위"
