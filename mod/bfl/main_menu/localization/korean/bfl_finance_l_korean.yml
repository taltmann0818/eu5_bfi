 bfl_facility_0: "시설 꺼짐"
 bfl_facility_0_definition: "꺼짐: 자동 대여가 되지 않습니다. 여전히 수동으로 빌릴 수 있습니다."
 bfl_facility_0_short: "끄기"
 bfl_facility_0_tip: "고정 부채 시설 명령을 해제하십시오. 예정된 은행 자금 조달은 요청되지 않습니다. 기존 채무는 계속 지불 가능합니다."
 bfl_facility_1: "부채 우선 시설"
 bfl_facility_1_definition: "비용 : 최대 대출 60% 주 현금 잔액에 관계없이 매달 예상되는 주 지출. 자금 조달은 공유된 월별 한도, 부채 한도, 은행 현금 및 자본 한도에서 중단됩니다."
 bfl_facility_1_short: "비용"
 bfl_facility_1_tip: "맞춤형 채권 파이낸싱 요청 60% 공유 내 예측 월별 지출 1,000 골드 월 한도. 주 현금이 도달하면 추첨 건너뛰기 500 금 또는 은행이나 발행인의 능력이 부족합니다."
 bfl_facility_2: "완충시설"
 bfl_facility_2_definition: "현금 완충기: 예상 주 현금을 최대 100%까지 끌어올 수 있을 만큼 충분히 빌립니다. 200 두카트. 자금 조달은 공유된 월별 한도, 부채 한도, 은행 현금 및 자본 한도에서 중단됩니다."
 bfl_facility_2_short: "현금 완충기"
 bfl_facility_2_tip: "맞춤형 채권 파이낸싱 요청 200 예측 잔액 이후의 상태 금, 공유 내 1,000 골드 월 한도. 자금이 지원되지 않은 요청은 부채나 현금을 생성하지 않습니다."
 bfl_facility_reason_1: "#O 리서치, 지점 접근, 발행자 수입 및 쿠폰 용량을 확인하세요.#!"
 bfl_facility_reason_2: "#O 보호된 현금으로 인해 유동적인 은행 자금이 부족해졌습니다.#!"
 bfl_facility_reason_3: "#O 새로운 청구액은 은행의 자본 여유액을 초과하게 됩니다.#!"
 bfl_facility_reason_4: "#O 결합된 주권 의무가 발행자 부채 한도에 도달했습니다.#!"
 bfl_facility_reason_5: "#O 미지급된 주권 쿠폰으로 인해 추가 발행이 차단됩니다.#!"
 bfl_facility_reason_6: "#O 주권자는 이미 이번 달에 채권을 발행했습니다.#!"
 bfl_facility_reason_7: "#O 모든 국채 기록 슬롯이 점유됩니다.#!"
 bfl_facility_tip: "이번 달 관세국채 발행으로 실제로 받은 은행현금. 자금조달은 부채를 발생시키며 근로소득에서 제외됩니다."
 bfl_facility_title: "월간 펀딩"
 bfl_facility_title_tip: "#T 부채 편익 위임#!\n은행은 고정된 연간 쿠폰으로 맞춤형 국채에 자금을 조달합니다. 끄면 예약된 문제가 중지됩니다. 부채 우선 요청 60% 예측 지출. 버퍼 타겟 200 예상 월별 잔액 후에 금을 상태로 표시합니다. 둘 다 에 정차 500 주 금.\n\n마지막 요청: [Country.MakeScope.GetVariable('bfl_facility_requested').GetValue|2]@gold!\n마지막 자금 조달: [Country.MakeScope.GetVariable('bfl_facility_paid').GetValue|2]@gold!\n\n수동 및 자동 추첨은 1,000 골드 월 한도. 은행 현금, 자본, 발행자 능력 및 미지급 쿠폰을 보호하면 무승부를 방지할 수 있습니다. 수익금은 수입이 아니라 자금조달입니다."
