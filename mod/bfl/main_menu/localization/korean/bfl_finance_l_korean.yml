 bfl_venture_accept: "파트너십을 수락하세요"
 bfl_venture_accept_tip: "실시간 투자자 권한, 변경되지 않은 제안 조건, 연령, 연구, 무료 현금, 자본, 용량 및 운영자 기여를 다시 확인하십시오. Funding은 선택한 활동의 ​​실제 기본 비용만 지불합니다. 이는 회사 지분이나 정치적 통제권을 부여하지 않습니다."
 bfl_venture_decline: "거절하다"
 bfl_venture_duration_12: "기간 · 12 개월"
 bfl_venture_duration_120: "기간 · 120 개월"
 bfl_venture_duration_24: "기간 · 24 개월"
 bfl_venture_duration_6: "기간 · 6 개월"
 bfl_venture_duration_60: "기간 · 60 개월"
 bfl_venture_duration_tip: "주기 6, 12, 24, 60 또는 120 개월. 장기적으로는 원주민 탐험을 수용할 수 있습니다. 기본 액세스가 유효한 경우 화물은 2개월 후에 판매됩니다. 막힌 화물은 계속 보관됩니다. 연계된 판매대금이 없는 원정비용은 만기 시 상각됩니다."
 bfl_venture_empty: "활발한 벤처가 없습니다. 조건을 제시하기 전에 화물 운영이나 현지 탐험을 선택하세요."
 bfl_venture_help: "순환하려면 용어를 클릭하세요. 각 운영자는 별도로 수락합니다. 기존 계약은 정책이나 연구 변경 후에도 계속됩니다."
 bfl_venture_hint: "활동, 비용, 화물 및 반품을 보려면 마우스를 올리세요."
 bfl_venture_locked: "새로운 벤처가 잠김 · 요구사항을 확인하기 위해 마우스를 가져가세요"
 bfl_venture_note: "자본은 이익보다 먼저 회수됩니다. 손실은 기여에 따릅니다. 지정된 운영에서 인수한 화물만이 수익금을 조달할 수 있습니다. 관련 없는 거래는 이 계약에 대한 비용을 지불하지 않습니다. 발견만으로는 아무것도 지불하지 않습니다. 닫힌 행은 새로 수락된 계약으로 대체될 때까지 남아 있습니다."
 bfl_venture_offer_desc: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_bank').GetCountry.GetName] 제안 [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_ticket').GetValue|0] 금 [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_duration').GetValue|0] 개월. 프리셋 [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_preset').GetValue|0]: 0 = 투자자는 모든 자본을 자금으로 조달하고 받습니다. 75% 잉여; 1 = 투자자는 2/3, 운영자는 1/3, 잉여분은 균등하게 분배됩니다. 자본이 먼저 회수됩니다. 손실은 기여에 따릅니다. 지정된 운영의 실제 판매 수익만이 수익을 지급할 수 있습니다. 탐험 성공은 금이 아닌 기회를 제공합니다. 이 제안은 3개월 후에 만료됩니다."
 bfl_venture_offer_desc_0: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_bank').GetCountry.GetName] 최대 승인 [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_ticket').GetValue|0] 은행 자금 조달의 금 [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_duration').GetValue|0] 개월. 구매 10 [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_good').Goods.GetNameWithNoTooltip] 안으로 [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_from').GetMarket.GetName], 두 달간 휴대한 후 판매하세요 [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_to').GetMarket.GetName]. 은행은 모든 비용을 조달하고 수령합니다. [GuiScope.SetRoot(ROOT.GetCountry.MakeScope).ScriptValue('bfl_venture_offered_profit_fraction')|%1] 잉여. 나머지는 보관하세요.\n\n실제 기본 비용만 추출됩니다. 사용하지 않은 자금은 은행에 보관됩니다. 자본은 잉여 이전에 회수됩니다. 손실은 기여에 따릅니다. 이 화물의 측정된 판매 수익만이 이 계약을 체결합니다. 관련 없는 수입과 발견은 비용을 지불하지 않습니다. 제안은 3개월 후에 만료됩니다."
 bfl_venture_offer_desc_1: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_bank').GetCountry.GetName] 최대 승인 [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_ticket').GetValue|0] 은행 자금 조달의 금 [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_duration').GetValue|0] 개월. 구매 10 [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_good').Goods.GetNameWithNoTooltip] 안으로 [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_from').GetMarket.GetName], 두 달간 휴대한 후 판매하세요 [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_to').GetMarket.GetName]. 은행은 비용의 2/3를 지원합니다. 당신은 3분의 1을 지불합니다. 은행이 받음 [GuiScope.SetRoot(ROOT.GetCountry.MakeScope).ScriptValue('bfl_venture_offered_profit_fraction')|%1] 잉여분을 확보하고 나머지는 귀하가 유지합니다.\n\n실제 기본 비용만 추출됩니다. 사용하지 않은 자금은 은행에 보관됩니다. 자본은 잉여 이전에 회수됩니다. 손실은 기여에 따릅니다. 이 화물의 측정된 판매 수익만이 이 계약을 체결합니다. 관련 없는 수입과 발견은 비용을 지불하지 않습니다. 제안은 3개월 후에 만료됩니다."
 bfl_venture_offer_desc_2: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_bank').GetCountry.GetName] 최대 승인 [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_ticket').GetValue|0] 은행 자금 조달의 금 [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_duration').GetValue|0] 개월. 기본 탐색 준비 [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_area').GetArea.GetName] 에서 [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_port').GetLocation.GetName] 와 [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_explorer').GetCharacter.GetName]. 은행은 합의된 모든 금 비용에 자금을 지원하고 수령합니다. [GuiScope.SetRoot(ROOT.GetCountry.MakeScope).ScriptValue('bfl_venture_offered_profit_fraction')|%1] 계약상 잉여. 나머지는 보관하세요. 준비 과정은 취소를 포함하여 환불되지 않습니다. 귀하는 이 자금 계약 외에 승무원, 현지 유지비 및 선택적인 원정 지출을 제공합니다. 남은 은행 승인은 현지 접근에 따라 발견된 지역의 중심이나 경계에 있는 시장에서 10개 단위의 화물 1개에 자금을 지원할 수 있습니다. 기록된 준비 및 화물 비용을 제외한 해당 화물의 측정된 판매액만이 계약상의 잉여금을 지불할 수 있습니다. 발견과 관련 없는 거래에는 비용이 전혀 들지 않습니다. 이 제안은 3개월 후에 만료됩니다. "
 bfl_venture_offer_desc_3: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_bank').GetCountry.GetName] 최대 승인 [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_ticket').GetValue|0] 은행 자금 조달의 금 [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_duration').GetValue|0] 개월. 기본 탐색 준비 [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_area').GetArea.GetName] 에서 [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_port').GetLocation.GetName] 와 [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_explorer').GetCharacter.GetName]. 은행은 합의된 금 비용의 3분의 2를 자금으로 조달합니다. 당신은 3분의 1을 지불합니다. 은행이 받음 [GuiScope.SetRoot(ROOT.GetCountry.MakeScope).ScriptValue('bfl_venture_offered_profit_fraction')|%1] 계약상 잉여금을 확보하고 나머지는 귀하가 유지합니다. 준비 과정은 취소를 포함하여 환불되지 않습니다. 귀하는 이 자금 계약 외에 승무원, 현지 유지비 및 선택적인 원정 지출을 제공합니다. 남은 은행 승인은 현지 접근에 따라 발견된 지역의 중심이나 경계에 있는 시장에서 10개 단위의 화물 1개에 자금을 지원할 수 있습니다. 기록된 준비 및 화물 비용을 제외한 해당 화물의 측정된 판매액만이 계약상의 잉여금을 지불할 수 있습니다. 발견과 관련 없는 거래에는 비용이 전혀 들지 않습니다. 이 제안은 3개월 후에 만료됩니다. "
