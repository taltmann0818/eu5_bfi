 bfl_charter_begin_tip: "적격 주립은행 선택기를 엽니다. 은행이 선택될 때까지 돈이나 연구 결과가 변경되지 않습니다. 취소하면 두 재무부가 변경되지 않습니다."
 bfl_charter_selection_tip: "환승 [ROOT.GetCountry.MakeScope.ScriptValue('bfl_charter_investment')|0]@gold! 선택한 은행에 새로운 주 지분으로 부여됩니다. 국가, 건물, 기존 청구 및 의무를 보존한 다음 영구 전문화를 선택하십시오."
 bfl_chartered_bank: "차타드 은행"
 bfl_chartered_bank_desc: "건물 기반 주립 은행이 설립되었습니다. 현금과 채무는 주권과 별개로 유지됩니다. 자동으로 공물이 수집되지 않습니다."
 bfl_clearing: "청산"
 bfl_clearing_tip: "#T 고급 청산#!\n혁명, 고급 청산 및 기본 청산소 연구. 소유한 완성된 어음교환소와 명시적인 회원 가입을 통해 일치하는 만기 어음의 원자 순 결제가 가능합니다. 짧은 회원은 배치를 차단하고 모든 청구를 보존합니다."
 bfl_clergy_estate_workout_mandate: "부동산 운동 명령"
 bfl_clergy_estate_workout_mandate_desc: "이 부동산은 정부가 자신을 대신하여 자발적인 은행 예금 워크아웃을 검토할 수 있는 권한을 명시적으로 부여합니다. 모든 제안은 여전히 ​​별도의 승인이 필요합니다. 이 특권을 취소하면 보류 중인 유산 조건이 무효화됩니다. 복구 지불은 자산 지갑으로 계속됩니다."
 bfl_close_bank_offering: "주식 공모 마감"
 bfl_close_bank_offering_tip: "외부 구독 수락을 중지하세요. 기존 소유권과 배당권은 계속 유효합니다. 주권자는 여전히 자신의 은행에 자본을 확충할 수 있습니다."
 bfl_close_bond_offer: "채권 발행 마감"
 bfl_close_bond_offer_tip: "현재 2차 제안을 철회합니다. 미결제 부채와 쿠폰이 남아 있습니다."
 bfl_collateral: "담보"
 bfl_collateralization: "담보"
 bfl_collateralization_desc: "약속이 재산으로 뒷받침될 때 신뢰는 강화됩니다. 서약서와 이에 대한 채권자의 권리를 기록함으로써 은행가는 채무자가 계약을 이행하지 않을 경우 회수될 수 있는 자산에 대해 대출을 할 수 있습니다."
 bfl_commenda: "코멘다"
 bfl_commenda_available_color: "green"
 bfl_commenda_available_icon: "@bfl_commenda_opportunity!"
 bfl_commenda_available_left_click: "이 작업을 검토하세요"
 bfl_commenda_available_name: "펀딩 가능 코멘다"
 bfl_commenda_available_tooltip: "[GetPlayer.MakeScope.GetVariable('bfl_op_country').GetCountry.GetName] · 10 [GetPlayer.MakeScope.GetVariable('bfl_op_good').Goods.GetNameWithNoTooltip]\n[GetPlayer.MakeScope.GetVariable('bfl_op_from').GetMarket.GetName] → [GetPlayer.MakeScope.GetVariable('bfl_op_to').GetMarket.GetName]\n예상 은행 비용: [GetPlayer.MakeScope.GetVariable('bfl_op_cost').GetValue|2]@gold!\n은행 잉여: +[GetPlayer.MakeScope.GetVariable('bfl_op_surplus').GetValue|2]@gold!\n\n2개월간의 화물 운영에 대한 현재 시장 시세; 잉여에는 회수된 자본이 제외됩니다. 가격과 액세스 권한은 변경될 수 있습니다. 자본과 수익이 위험에 처해 있습니다. 이 화물의 실제 판매에 대해서만 계약금을 지불합니다. 운영자가 수락해야 합니다. 기회는 매월 새로 고쳐지고 제안이 전송되기 전에 다시 확인됩니다."
 bfl_commenda_cargo: "Commenda: 선박 발견 지역 화물"
 bfl_commenda_cargo_act: "선박 발견 지역 화물"
 bfl_commenda_cargo_desc: "발견된 지역에 중심을 두거나 경계를 이루는 시장에서 후원 운영자와 10개 단위 화물을 선택합니다. 사용되지 않은 승인된 자금만 기본 구매 비용을 지불할 수 있습니다. 발견 지불금이나 관련 없는 거래 귀속이 없습니다."
 bfl_commenda_cargo_effect_text: "선박 발견 지역 화물"
 bfl_commenda_cargo_effect_text_past: "선박 발견 지역 화물"
 bfl_commenda_cargo_tip: "승인된 탐험의 검증된 발견, 남은 승인, 현지 시장 접근 및 재고가 필요합니다. 운영자 또는 정치적 통제자가 항해를 지휘합니다."
 bfl_commenda_desc: "항해를 하는 상인은 배를 채울 자본이 없어도 무역을 할 수 있는 기술을 가질 수 있습니다. 코멘다는 금융가의 돈을 여행 파트너의 노동력에 결합하여 그들의 합의에 따라 벤처 수익금을 공유합니다."
 bfl_commenda_expedition: "명명된 탐험에 자금을 지원하세요"
 bfl_commenda_expedition_act: "명명된 탐험에 자금을 지원하세요"
 bfl_commenda_expedition_desc: "운영자, 발사항, 미지의 해역 및 탐험가를 선택하세요. 해상 목표는 운영자의 해군 범위 내에 있어야 합니다. 토지가 없는 회사는 선택된 소유 시설 호스트의 범위를 사용합니다. 제안된 조건에 따라 기본 준비 자금을 수락합니다. 은행은 정치적 통제권을 얻지 못합니다."
 bfl_commenda_expedition_effect_text: "명명된 탐험에 자금을 지원하세요"
 bfl_commenda_expedition_effect_text_past: "명명된 탐험에 자금을 지원하세요"
 bfl_commenda_expedition_tip: "동의하기 전에 운영자, 지역, 발사 포트 및 탐색기를 선택하십시오. 펀딩은 실제 네이티브 준비비용만 지급합니다. 준비물은 환불되지 않습니다. 남은 승인은 발견된 지역의 중심이나 경계에 있는 시장에서 화물에 자금을 조달할 수 있습니다. 측정된 판매 수익만이 수익금을 지불할 수 있습니다."
 bfl_commenda_opportunity_consent: "지정된 화물과 실제 자금 조달 권한을 다시 확인하세요. 현재 약관을 사용하여 제안을 보냅니다. 운영자가 수락할 때까지 돈은 움직이지 않습니다."
 bfl_commenda_opportunity_later: "나중에 고려하세요"
 bfl_commenda_opportunity_propose: "이 약관을 운영자에게 보내십시오."
 bfl_commenda_opportunity_review: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_op_country').GetCountry.GetName] · 10 [ROOT.GetCountry.MakeScope.GetVariable('bfl_op_good').Goods.GetNameWithNoTooltip]\n[ROOT.GetCountry.MakeScope.GetVariable('bfl_op_from').GetMarket.GetName] → [ROOT.GetCountry.MakeScope.GetVariable('bfl_op_to').GetMarket.GetName]\n예상 은행 비용: [ROOT.GetCountry.MakeScope.GetVariable('bfl_op_cost').GetValue|2]@gold!\n은행 잉여: +[ROOT.GetCountry.MakeScope.GetVariable('bfl_op_surplus').GetValue|2]@gold!\n\n2개월간의 화물 운영에 대한 현재 시장 시세; 잉여에는 회수된 자본이 제외됩니다. 가격과 액세스 권한은 변경될 수 있습니다. 자본과 수익이 위험에 처해 있습니다. 이 화물의 실제 판매에 대해서만 계약금을 지불합니다. 운영자가 수락해야 합니다. 기회는 매월 새로 고쳐지고 제안이 전송되기 전에 다시 확인됩니다."
 bfl_commenda_tip: "#T 코멘다#!\n확정된 이익 분배에 대한 대가로 항해 또는 무역 벤처에 자본을 투입합니다. Commenda 연구, 해외 투자 및 Discovery 연령 이상이 필요합니다. 이 빌드에서는 기본 프로젝트 실행을 사용할 수 없습니다."
 bfl_commercial_bill: "상업 청구서"
 bfl_commercial_bills: "상업 청구서"
 bfl_commercial_bills_desc: "상업 중심지 사이에서 동전을 운반하는 것은 비용이 많이 들고 위험합니다. 서면 청구서를 통해 상인은 신뢰할 수 있는 은행을 통해 채무를 결제할 수 있으므로 발행자의 평판이 거래 수단이 됩니다."
 bfl_commodity_forward: "상품 전달"
 bfl_commodity_forward_tip: "#T 상품 전달#!\n자금이 지원되는 미래 상품 배송에 동의합니다. Commodity Forwards 연구, Merchant Finance 및 Absolutism 시대 이상이 필요합니다. 본 빌드에서는 실물 배송 및 정산이 불가능합니다."
 bfl_commodity_forwards: "상품 전달"
 bfl_commodity_forwards_desc: "수확, 배송 또는 작업장 주문은 배송 전에 판매될 수 있습니다. 미래 가격을 고정하는 계약은 먼 시장의 불확실성과 계절 변화에도 불구하고 상인이 업무를 처리하는 데 도움이 됩니다."
 bfl_commodity_inventory: "상품 재고"
 bfl_commodity_inventory_tip: "#T 상품 재고#!\n무역을 위해 보류된 금융상품. 상품 투자 연구, 판매자 금융 및 발견 시대 이상이 필요합니다. 이 빌드에서는 실제 상품 구매, 보관 및 배송이 불가능합니다."
 bfl_commodity_investments: "원자재 투자"
 bfl_commodity_investments_desc: "무역에 자금을 조달하는 은행가도 상품을 직접 보유할 수 있습니다. 곡물, 양모 및 기타 상품은 저장, 운송 및 먼 시장의 변화하는 요구에 따라 가치가 달라지는 투자가 됩니다."
 bfl_company_crew: "환승 250 선원들이 회사로"
 bfl_company_crew_desc: "현재 관리하고 있는 현지 회사를 관리하세요. 적립금은 영업이익에서 제외됩니다."
 bfl_company_crew_tip: "현재 관리하고 있는 현지 회사를 관리하세요. 자본 기여는 자금 조달입니다. 회사 분배에는 기본 비용, 손실 발생액, 부채 준비금 및 현금 완충액을 제외한 이익잉여금이 사용됩니다. 정치적 군주와 재정적 소유자는 별개입니다."
 bfl_company_equity: "회사 지분"
 bfl_company_equity_desc: "대규모 무역 기업에는 소수의 상인만이 혼자서 공급할 수 있는 재산이 필요합니다. 투자자들 사이에 소유권을 분배하면 회사는 사업의 위험과 보상을 분배하면서 지속적인 자본을 모을 수 있습니다."
 bfl_company_equity_tip: "#T 회사 지분#!\n인정된 회사의 소유권 지분에 대한 자본을 청약합니다. 회사 지분 조사, 해외 투자 및 개혁 시대 이상이 필요합니다. 본 빌드에서는 네이티브 회사 발행 및 홀더 정산이 불가능합니다."
 bfl_company_expedition: "회사: 네이티브 탐험 준비"
 bfl_company_expedition_desc: "회사 재무부, 선원, 탐험가를 활용하여 회사 시설에서 바다 탐험을 준비하세요. 기본 준비 및 진행 상황이 적용됩니다. 발견은 현금이나 투자 이익을 창출하지 않습니다."
 bfl_company_expedition_tip: "무역 및 탐사 권한, 지도 제작, 적격 회사 탐험가, 선원 및 사용 가능한 벤처 예산이 필요합니다. 네이티브 준비 시간이 적용됩니다."
 bfl_company_exploration_capacity: "기업탐방설립"
 bfl_company_exploration_capacity_desc: "용량 500 탐사 임무가 승인된 동안 선원. 선원은 회사에서 와야 하거나 정치 통제관으로부터 자금을 지원받아야 합니다."
 bfl_company_explore: "회사의 임무: 무역과 탐사"
 bfl_company_explore_desc: "현재 관리하고 있는 현지 회사를 관리하세요. 적립금은 영업이익에서 제외됩니다."
 bfl_company_explore_tip: "현재 관리하고 있는 현지 회사를 관리하세요. 자본 기여는 자금 조달입니다. 회사 분배에는 기본 비용, 손실 발생액, 부채 준비금 및 현금 완충액을 제외한 이익잉여금이 사용됩니다. 정치적 군주와 재정적 소유자는 별개입니다."
 bfl_company_fund: "기여 100 금을 회사 자본으로"
 bfl_company_fund_desc: "현재 관리하고 있는 현지 회사를 관리하세요. 적립금은 영업이익에서 제외됩니다."
 bfl_company_fund_tip: "현재 관리하고 있는 현지 회사를 관리하세요. 자본 기여는 자금 조달입니다. 회사 분배에는 기본 비용, 손실 발생액, 부채 준비금 및 현금 완충액을 제외한 이익잉여금이 사용됩니다. 정치적 군주와 재정적 소유자는 별개입니다."
 bfl_company_list_equity: "회사 지분 상장 승인"
 bfl_company_list_equity_desc: "유료 NAV 기본 구독 및 2차 거래를 승인합니다. 은행 인수에는 해외 투자, 회사 지분 조사 및 2차 거래에 대한 완전한 교환이 필요합니다. 정치적 지배력은 변함이 없습니다."
 bfl_company_list_equity_tip: "실시간 정치 통제자는 시장 참여를 승인합니다. 현금이나 단위는 부여되지 않습니다."
 bfl_company_native_channels: "기본 HQ 수입과 과목 지급금은 기본 예산에 유지됩니다. 회사 주식 시장, 은행 기업 신용 및 추천서는 별도의 조사 및 전달 게이트를 사용합니다."
 bfl_company_panel: "운영 회사"
 bfl_company_panel_tip: "회사의 재무부와 정치적 통제는 은행 계좌와 분리되어 있습니다. 원주민 HQ 소유자 소득, HQ 직접 영주 소득 및 원주민 대상 지불금은 원주민 수령인에게 그대로 유지됩니다. 기본 비용을 제외하고 실행된 보유 거래만 추가 소유자 분배에 자금을 조달할 수 있습니다. 자본 및 발견은 제외됩니다."
 bfl_company_retain: "회사의 의무: 수익 유지"
 bfl_company_retain_desc: "현재 관리하고 있는 현지 회사를 관리하세요. 적립금은 영업이익에서 제외됩니다."
 bfl_company_retain_tip: "현재 관리하고 있는 현지 회사를 관리하세요. 자본 기여는 자금 조달입니다. 회사 분배에는 기본 비용, 손실 발생액, 부채 준비금 및 현금 완충액을 제외한 이익잉여금이 사용됩니다. 정치적 군주와 재정적 소유자는 별개입니다."
 bfl_company_route: "회사: 자국 무역로를 개척하다"
 bfl_company_route_desc: "다음을 사용하여 하나의 회사 소유 기본 경로를 엽니다. 0.1 상인 용량. 무역 명령, 사용 가능한 운영 예산, 현지 시장 접근, 잉여 및 생산 능력이 필요합니다. 회사당 월 최대 1개의 명령 경로가 제공됩니다. 네이티브 AI는 자체 거래 행동을 유지합니다."
 bfl_company_route_tip: "회사, 원천시장, 목적지 시장, 가맹점 시장, 상품을 선택하세요. 기본 거래 비용은 엔진에 의해 부과됩니다."
 bfl_company_select: "운영회사 선택"
 bfl_company_select_desc: "현재 정치적 통제하에 있는 현지 회사를 조사하십시오."
 bfl_company_select_tip: "현재 귀하가 관리하고 있는 기본 회사를 선택하십시오. 선택 및 명세서 표시는 현금을 이동하거나 월을 마감하지 않습니다."
 bfl_company_statement: "현금: [Country.GetFixedPointCurrencyValue('gold')|2]@gold!   예약된 버퍼: [Country.MakeScope.GetVariable('bfl_company_buffer').GetValue|2]@gold!\n원주민 무역: [Country.MakeScope.GetVariable('bfl_company_trade_receipts').GetValue|2]   순예산: [Country.MakeScope.GetVariable('bfl_company_native_net').GetValue|2]\n적격 수입: [Country.MakeScope.GetVariable('bfl_company_verified_profit').GetValue|2]   소유자에게 지급됨: [Country.MakeScope.GetVariable('bfl_company_dividend').GetValue|2]@gold!\n시설: [Country.MakeScope.GetVariable('bfl_company_facility_count').GetValue|0]   노선: [Country.MakeScope.GetVariable('bfl_company_route_count').GetValue|0]   실행된 볼륨: [Country.MakeScope.GetVariable('bfl_company_volume').GetValue|2]\n무역 예산: 50   재투자 준비금: 100   벤처 예산: 100   소유자 지불금: 25%"
 bfl_company_strategy_construction: "현지 거래 시설에 회사 보유금을 재투자합니다."
 bfl_company_trade: "회사의 임무: 무역"
 bfl_company_trade_desc: "현재 관리하고 있는 현지 회사를 관리하세요. 적립금은 영업이익에서 제외됩니다."
 bfl_company_trade_tip: "현재 관리하고 있는 현지 회사를 관리하세요. 자본 기여는 자금 조달입니다. 회사 분배에는 기본 비용, 손실 발생액, 부채 준비금 및 현금 완충액을 제외한 이익잉여금이 사용됩니다. 정치적 군주와 재정적 소유자는 별개입니다."
 bfl_corporate_credit: "기업신용"
 bfl_corporate_credit_desc: "상업 기업이 단일 항해 또는 시즌을 초과하면서 성장함에 따라 신용에 대한 필요성은 더욱 지속됩니다. 은행은 기업의 자원과 전망은 물론 개별 상인의 지위도 판단하는 방법을 배웁니다."
 bfl_corporate_credit_tip: "#T 기업신용#!\n인정받는 무역회사에 빌려주세요. 기업 신용 연구, 상인 금융 및 개혁 시대 이상이 필요합니다. 이 빌드에서는 새로운 기본 회사 대출 실행을 사용할 수 없습니다."
 bfl_cost_accounts: "예금 계좌: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_operating_accounts_count')|0] × 0.05"
 bfl_cost_asset_types: "비현금 자산군: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_operating_asset_types_count')|0] × 0.25"
 bfl_cost_base: "기본 관리"
 bfl_cost_branches: "지점: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_operating_branches_count')|0] × 0.50"
