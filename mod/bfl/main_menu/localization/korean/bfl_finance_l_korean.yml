 bfl_asset_investments_title: "주식 및 벤처"
 bfl_asset_legend_footer: "외부 링: 자산 유형. 내부 링 및 색상 키: 국가/은행. 백분율은 총 은행 자산의 비율입니다. 금액에는 가치가 있습니다."
