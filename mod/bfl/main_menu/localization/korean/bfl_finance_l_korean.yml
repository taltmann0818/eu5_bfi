 bfl_assets_detail_title: "자산 [Country.GetName]"
 bfl_assets_label: "자산"
 bfl_assets_label_tip: "#T 총 자산#!\n은행이 소유한 현금 및 기록자산입니다.\n\n재무부 현금: [Country.GetFixedPointCurrencyValue('gold')|2]@gold!\n대출 포트폴리오: [Country.MakeScope.GetVariable('bfl_native_credit_value').GetValue|2]@gold!\n지분 포지션(유지 가치): [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_security_carrying')|2]@gold!\n맞춤형 신용 및 채권: [Country.MakeScope.GetVariable('bfl_custom_credit_value').GetValue|2]@gold!\n인벤토리: [Country.MakeScope.GetVariable('bfl_inventory_value').GetValue|2]@gold!\n프로젝트: [Country.MakeScope.GetVariable('bfl_project_value').GetValue|2]@gold!\n합계: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_assets')|2]@gold!\n\n대출, 지분 포지션, 재고 및 프로젝트는 기록된 자산 가치이지 지출 가능한 현금이 아닙니다. 원금 상환은 대출 자산을 현금으로 교환합니다. 그들은 이익을 창출하지 않습니다."
 bfl_authorize_note_bank: "상환 가능한 지폐 승인"
 bfl_authorize_note_bank_act: "$bfl_authorize_note_bank$"
 bfl_authorize_note_bank_desc: "귀하의 공인 은행 또는 귀하의 자본금에 지점이 있는 독립 은행이 필요한 조사 후 완전 보증된 환매권으로 정금을 교환할 수 있도록 승인하십시오. 새로운 발행을 위해서는 수도에 완성된 중앙 은행도 필요합니다. 승인을 받으면 금이 생성되지 않으며 인출할 수 있습니다."
 bfl_authorize_note_bank_effect_text: "$bfl_authorize_note_bank$"
 bfl_authorize_note_bank_effect_text_past: "$bfl_authorize_note_bank$"
 bfl_automation_notice: "신용관리"
 bfl_automation_notice_tip: "헤더의 Credit Management를 사용하면 은행에서 대출과 투자를 관리할 수 있습니다. 은행은 투자하기 전에 준비금을 유지하고 채권자에게 지불하며 연구 조사 및 현금을 확인합니다."
 bfl_available: "사용 가능한 현금"
 bfl_available_tip: "은행은 준비금을 유지한 후 사용할 수 있는 현금입니다."
 bfl_back_to_bank: "은행 계좌"
 bfl_balance_paid_tip: "마지막 월별 정산 시 자금이 지급되었습니다. 이러한 이체는 이미 귀하의 재무부에 있으므로 기본 소득 총액에 다시 추가되어서는 안 됩니다."
 bfl_balance_sheet_subtitle: "현재 은행 계좌"
 bfl_banco_del_giro: "방코 델 지로"
 bfl_banco_del_giro_desc: "리알토 아케이드 아래에서는 공공 신용이 원장에서 원장으로 전달됩니다. 은행은 동전을 받고, 상인의 의무를 해결하며, 공화국에 부채에 대한 지속적인 기반을 제공합니다."
 bfl_banco_del_giro_maintenance: "방코델지로 행정부"
 bfl_banco_mediceo: "Banco Mediceo"
 bfl_banco_mediceo_desc: "이 거대한 은행의 두꺼운 석벽 안에서 상인들은 장부를 결산하고 군주들은 메디치의 신용을 구한다. 서기들은 밀라노를 지나는 어음과 주화의 흐름을 정돈하여 국가 재정과 은행 사업을 뒷받침한다. 완공된 건물이 특허 은행의 관리비를 줄이는 비율은 15% 이며 필요한 발전을 연구하면 통화 서비스도 지원한다."
 bfl_bank_capital_subscriptions_desc: "은행가는 창업 가문의 재산에 전적으로 의존할 필요는 없습니다. 구독을 통해 추가 파트너를 기업에 참여시켜 자본을 모으는 동시에 미래 번영에 대한 각 투자자의 주장을 기록할 수 있습니다."
 bfl_bank_dividends: "은행 배당금 (연간)"
 bfl_bank_eng.1.a: "등록부를 5%로 은행에 맡깁니다."
 bfl_bank_eng.1.b: "독립적인 Exchequer 등록 비용을 지불합니다."
 bfl_bank_eng.1.c: "소비세 농부들이 돈을 찾도록 하세요."
 bfl_bank_eng.1.desc: "커먼즈는 영란은행의 새로운 용도를 발견했습니다. 모든 청약, 양도, 배당을 재무장관의 손에 맡기는 대신 은행은 정부 주식의 공개 등록부를 보관할 것입니다. 이사들은 관심이 존중된다면 스스로 이슈를 구독하겠다고 제안합니다. 재무부 관리들은 등록부 관리인이 공공 신용의 문지기가 될 것이라고 반대합니다. 한편, 소비세 농부들은 시에 많은 권한을 넘겨주지 않으면서도 수익을 약속합니다."
 bfl_bank_eng.1.entry: "공공 신용의 방법과 수단"
 bfl_bank_eng.1.title: "공공 신용의 방법과 수단"
 bfl_bank_eng.3.a: "공공의 신용을 받을 만한 시설을 구축하십시오."
 bfl_bank_eng.3.b: "소유자의 날개와 양보를 받아들이십시오."
 bfl_bank_eng.3.c: "고용된 홀과 금고의 동전을 보관하십시오."
 bfl_bank_eng.3.desc: "은행의 임대실은 배당금을 기다리는 장부, 출납원, 소유주들로 붐비고 있습니다. 그 이사들은 Threadneedle Street에 영구 설립 계획을 확보했습니다. 공공 건물은 재무부가 관리에 대한 확고한 권한을 갖게 되지만 그 대가는 상당합니다. 상인 소유주는 시에 양보하는 대가로 더 저렴한 구독료를 제공합니다. 오래된 방에 남아 있으면 오늘날 돈을 절약할 수 있고, 흩어져 있는 사무실에 대한 비용 증가를 은행에 맡길 수 있습니다."
 bfl_bank_eng.3.entry: "Threadneedle Street 설립"
 bfl_bank_eng.3.title: "Threadneedle Street 설립"
 bfl_bank_eng.4.a: "건전한 사업을 위해 감리 할인 사무소를 개설합니다."
 bfl_bank_eng.4.b: "은행 준비금 뒤에 국채를 넣어두세요."
 bfl_bank_eng.4.c: "공공 편의 시설이 있어서는 안 됩니다."
 bfl_bank_eng.4.desc: "부서진 지폐 사슬은 런던에서 스코틀랜드까지 그리고 바다 건너편까지 고통을 가져왔습니다. 번영하는 것처럼 보였던 집은 내일의 지불금을 감당할 동전을 얻을 수 없습니다. 영란은행은 수용 범위를 확대해 달라는 요청을 받았지만 이사들은 건전한 상업 어음은 몰락한 투기꾼의 종이와 구별되어야 한다고 주장합니다. 상인들은 굴욕적인 문의 없이 구제를 요구합니다. 대신 재무부는 은행을 강화하거나 손실이 발생한 사람들의 소유라고 선언할 수 있습니다."
 bfl_bank_eng.4.entry: "6월의 청구서"
 bfl_bank_eng.4.title: "6월의 청구서"
 bfl_bank_equity_subscribe: "은행 재무부: 구독 100 금"
 bfl_bank_equity_subscribe_tip: "투자하다 100 선택된 발행자의 유형 NAV를 기준으로 실제 관리 은행의 보호현금 및 자본잉여금을 계산합니다. 새로운 유료 단위가 은행 포트폴리오에 포함됩니다. 최대 25% 은행이나 60% 해외 허가 회사의. 이는 기존 주주로부터의 구매가 아닌 1차 자금조달입니다."
 bfl_bank_flo.1.a: "Guelph 협약을 존중하세요."
 bfl_bank_flo.1.b: "은행은 어떤 당사자보다 먼저 피렌체에 서비스를 제공해야 합니다."
 bfl_bank_flo.1.c: "집들 사이의 화해를 구입하십시오."
 bfl_bank_flo.1.desc: "바르디 가문은 처음으로 자신들의 집을 피렌체에서 강력한 세력으로 만든 동맹을 잊지 않았습니다. 그들의 친척들은 옛 부온델몬티(Buondelmonti)의 명분을 언급하며 도시의 공인 은행이 교황의 친구들과 공개적으로 협력할 것을 요청합니다. Signoria의 장교들은 모든 계정이 세력 색상을 갖게 될 것을 두려워합니다. 공공 은행은 도시의 당을 강화할 수 있지만, 사업이 기존 부서를 넘나드는 상인들은 차라리 그 문이 양쪽 모두에게 열려 있기를 원합니다."
 bfl_bank_flo.1.entry: "Buondelmonti 의무"
 bfl_bank_flo.1.title: "Buondelmonti 의무"
 bfl_bank_flo.2.a: "요인들이 양모 선박을 따르도록 하십시오."
 bfl_bank_flo.2.b: "왕관을 구하고 정치적 대가를 받아들이십시오."
 bfl_bank_flo.2.c: "이탈리아에 계정을 집중하세요."
 bfl_bank_flo.2.desc: "영국의 은행가 요인은 Signoria 이전에 두 가지 종류의 비즈니스를 가져옵니다. 양모 상인은 꾸준하게 베일, 청구서, 관세 영수증을 거래합니다. 왕실 대리인은 훨씬 더 큰 지갑에 대한 접근 권한을 제공하지만 지갑이 즉시 열리는 경우는 거의 없습니다. 이사들은 우리 헌장의 보호 아래 영국식 집을 새롭게 단장할 것입니다. 문제는 그 점원이 양모 선박을 따라야 하는지, 법원을 경작해야 하는지, 아니면 영어 약속을 다른 은행에 맡겨야 하는지입니다."
 bfl_bank_flo.2.entry: "양모, 지폐 및 영국 왕관"
 bfl_bank_flo.2.title: "양모, 지폐 및 영국 왕관"
 bfl_bank_flo.3.a: "Bardi 이름으로 채플 사이클을 의뢰하십시오."
 bfl_bank_flo.3.b: "가족의 승리 없이 도시에 제단을 바치십시오."
 bfl_bank_flo.3.c: "은행 계좌에 돈을 보관하십시오."
 bfl_bank_flo.3.desc: "산타 크로체(Santa Croce)의 수사들은 그림이 그려진 예배당에 대한 계획을 가지고 바르디(Bardi)에 접근했습니다. 가족은 색상과 돌로 그 경건함을 기억하게 될 것이며, 시뇨리아는 피렌체가 회계 장부의 도시 이상임을 세계에 기억하게 될 것입니다. 그림의 큰 순환은 은행의 후원자들에게 경의를 표할 것입니다. 도시의 이름으로 지불된 겸손한 제단은 가족 이상으로 더 많은 애정을 얻을 수 있습니다. 계산원은 이미 책상에 대기 중인 요구 사항만 볼 수 있습니다."
 bfl_bank_flo.3.entry: "은행가와 수사"
 bfl_bank_flo.3.title: "은행가와 수사"
 bfl_bank_flo.4.a: "분쟁 계정에 대한 공개 합의를 구매하세요."
 bfl_bank_flo.4.b: "도시 전체가 아닌 은행 파트너에게 세금을 부과하세요."
 bfl_bank_flo.4.c: "법원과 채권자가 손실을 해결하도록 하십시오."
 bfl_bank_flo.4.desc: "거대 은행들의 실패는 그 뒤에 미지급된 영국의 약속 이상의 것을 남겼습니다. 살아남은 책에는 논쟁의 여지가 있는 주장, 양모에 대한 진전, 도시가 이제 이를 보호해야 한다고 주장하는 소유자의 계정이 포함되어 있습니다. 우리 헌장은 논쟁을 다시 시작했습니다. 피렌체가 공공 합의 비용을 지불해야 하는지, 파트너에게 특별 부담금을 부과하도록 강요해야 하는지, 아니면 법원에 이전 청구를 남겨 두어야 하는지에 대한 논쟁이 다시 시작되었습니다. 영국 왕실은 전쟁, 철수, 신뢰 상실의 역사에서 단 하나의 이름일 뿐이지만 의회에서 가장 자주 거론되는 이름입니다."
 bfl_bank_flo.4.entry: "영국 부채 계산"
 bfl_bank_flo.4.title: "영국 부채 계산"
 bfl_bank_gen.1.a: "황실 계정을 산 조르지오에 더 밀접하게 연결하십시오."
 bfl_bank_gen.1.b: "대신 우리 요인을 여러 법원에 보내십시오."
 bfl_bank_gen.1.c: "공화국의 회계가 우선되어야 합니다."
 bfl_bank_gen.1.desc: "제국 사절이 수입을 약속하고 추가 신용을 요청하면서 산 조르지오에 왔습니다. 보호자들은 유럽 전역에 걸쳐 적용되는 계좌의 이점과 한 명의 큰 채무자가 나머지를 무색하게 만드는 위험성을 알고 있습니다. 공화국의 상인들은 제국의 호의를 통해 이익을 얻을 것입니다. 외교관들은 한 법원의 호의가 다른 법원의 의심이라고 경고합니다. 공화국이 제국적 관계를 원하는지, 더 넓은 범위의 차용자를 원하는지, 아니면 더 작은 규모의 안전한 사업 장부를 원하는지 은행 이사들에게 알려야 합니다."
 bfl_bank_gen.1.entry: "황제의 계정"
 bfl_bank_gen.1.title: "황제의 계정"
 bfl_bank_gen.2.a: "알베르고와 그 장로들의 권위를 인정하십시오."
 bfl_bank_gen.2.b: "시민 공증인이 감독 협약을 작성하게 하십시오."
 bfl_bank_gen.2.c: "어떤 가족도 공화국 내에서 국가를 만들 수 없습니다."
 bfl_bank_gen.2.desc: "그리말디는 흩어져 있는 가족의 이익을 알베르고 내에 묶을 것을 제안합니다. 공통 조항, 공통 책임 및 공통 이름은 은행에 단일 가구가 약속할 수 없는 영속성을 부여할 것입니다. 가족은 자신의 장로들이 협약을 관리하도록 요청합니다. 시민 공증인은 책을 공공 감독하에 두는 또 다른 방법을 제안합니다. 어느 쪽이든 합의하면 집을 강화할 수 있습니다. 문제는 누가 그 일의 열쇠를 획득할 것인가이다."
 bfl_bank_gen.2.entry: "그리말디 알베르고"
 bfl_bank_gen.2.title: "그리말디 알베르고"
 bfl_bank_gen.3.a: "은행가들에게 선장직에서 확고한 목소리를 내십시오."
 bfl_bank_gen.3.b: "공유된 치안판사 아래 주택의 균형을 유지하세요."
 bfl_bank_gen.3.c: "공화국의 임원은 은행가가 되어서는 안 된다."
 bfl_bank_gen.3.desc: "Spinola 은행가들은 의회 회의장에 오래된 선례를 가져왔습니다. 갈레오토 스피놀라(Galeotto Spinola)와 라파엘레 도리아(Raffaele Doria)가 한때 공동 주장을 맡아 제노아에서 나폴리 왕의 왕위를 종식시켰습니다. 그들의 후손들은 공화국의 신용을 유지하는 사람들이 다시 정부에서 안정된 자리를 차지해야 한다고 주장합니다. 일부는 은행가의 주장을 선호하고 다른 일부는 라이벌 하우스 간의 균형을 선호합니다. 치안 판사는 대출 기관이 자신의 청구를 판단해야 하는 사무실 외부에 머무르는 것을 선호합니다."
 bfl_bank_gen.3.entry: "선장의 선례"
 bfl_bank_gen.3.title: "선장의 선례"
 bfl_bank_headquarters_cost_reduction: "공인은행 본점 운영비 절감"
 bfl_bank_holdings: "은행 투자"
 bfl_bank_identity_tip: "[Country.GetName] 자체 재무, 자산 및 의무를 보유합니다. 이 총액은 주 재무부와 별도로 은행에 속합니다. Merchant Finance는 무역 및 기업 대출을 전문으로 합니다. 해외투자는 벤처 및 기업에 특화되어 있습니다. 은행은 하나의 영구 전문 분야를 선택합니다."
 bfl_bank_loan_yield_bonus: "새로운 은행 대출 제안에 대한 이자"
 bfl_bank_of_england_founding_tt: "영국 은행을 런던의 공인 은행으로 설립하고, 사용 가능한 국고 현금부터 표준 전세 투자까지 자금을 조달합니다."
 bfl_bank_of_england_name: "영국 은행"
 bfl_bank_palace_cost_reduction: "은행 운영비 절감"
 bfl_bank_petitions.1.a: "시민의 구독을 승인하고 책을 펴세요."
 bfl_bank_petitions.1.b: "우리는 공공 지분을 희석하지 않을 것입니다."
 bfl_bank_petitions.1.desc: "거래소의 개설로 우리 공인 은행의 주식은 첫 번째 가입자 이상의 생명력을 갖게 되었습니다. 이제 회사의 이사들은 새로운 자본을 조달하기 위해 휴가를 요청하고 있으며 주요 시민은 새로운 주식의 일부를 인수할 준비가 되어 있습니다. 그들은 더 많은 소유주들이 은행에 코인과 연결을 가져올 것이라고 약속합니다. 우리 재무 담당자는 덜 열정적입니다. 우리가 상인과 함께 청약하지 않는 한 각각의 새로운 주식은 미래 배당금 중 주권의 몫을 줄일 것입니다."
 bfl_bank_petitions.1.entry: "새로운 구독"
 bfl_bank_petitions.1.title: "새로운 구독"
 bfl_bank_petitions.2.a: "우리 주식의 이 부분에 대해 공정한 지불을 수락하십시오."
 bfl_bank_petitions.2.b: "공공 지분은 그대로 유지됩니다."
 bfl_bank_petitions.2.desc: "우리 공인 은행의 이사들은 재무부가 보유한 주식의 일부를 매입하겠다고 제안했습니다. 인증서가 취소되어 나머지 소유주가 은행의 미래 수익 중 더 많은 부분을 갖게 됩니다. 시민은 이 제안을 환영하고, 우리 재무 담당자는 아직 오지 않은 수입에 대한 대가로 즉시 지불할 준비가 되어 있는 것을 확인합니다. 그러나 오늘 항복한 주식은 새로운 청약 없이 내일 다시 제공될 수 없습니다. 이사들은 우리의 답변을 기다리고 있습니다."
 bfl_bank_petitions.2.entry: "소버린의 주식"
 bfl_bank_petitions.2.title: "소버린의 주식"
 bfl_bank_petitions.3.a: "수익금은 2년 동안 은행에 보관하세요."
 bfl_bank_petitions.3.b: "재무부는 익숙한 수입이 필요합니다."
 bfl_bank_petitions.3.desc: "은행 이사들은 재무부에 장부를 놓고 인내심을 요청했습니다. 다가오는 이익을 분배하는 대신, 그들은 준비금이 더 강해질 때까지 은행에 보관할 것입니다. 상인들은 주권자께서도 그렇게 하시면 기다리기로 합의했습니다. 우리 임원들은 예상 배당금이 이미 공공 계정에 자리를 잡았다고 항의합니다. 거부하면 수입은 보존되지만 은행의 미래보다 다음 지불금을 더 중요하게 생각한다는 점을 이사들에게 확신시키십시오."
 bfl_bank_petitions.3.entry: "배당금은 기다려야 한다"
 bfl_bank_petitions.3.title: "배당금은 기다려야 한다"
 bfl_bank_share_dealing: "은행주식거래"
 bfl_bank_share_dealing_desc: "파트너의 재산이 동일한 은행에 영원히 묶여 있을 필요는 없습니다. 인정된 소유권 이전을 통해 투자자는 기관이 자본을 회수하지 않고 사업을 계속하는 동안 투자자가 자신의 지분을 다른 사람에게 판매할 수 있습니다."
 bfl_bank_share_price_bonus: "은행 주가"
 bfl_bank_share_transfer: "은행주식 이체"
 bfl_bank_share_transfer_tip: "#T 은행주식 이체#!\n자금 지원을 받는 당사자 간에 기록된 은행 소유권 단위를 이전합니다. 은행 주식 거래 연구와 종교 개혁 시대 이상이 필요합니다. 이 행은 권한을 보고합니다. 자체적으로 2차 주식 거래를 실행하지는 않습니다."
 bfl_bank_status_tip: "운영: 다른 요건이 충족되면 새로운 사업이 허용됩니다. 압박받는 현금: 사용 가능한 현금이 고갈되었습니다. 출금 대기 중: 미지급 출금 요청으로 인해 신규 사업이 중단됩니다. 부실: 부채가 자산을 초과합니다. 해결 중 또는 종료: 일반 업무가 제한됩니다. 기존 주장은 계속 기록됩니다."
 bfl_bank_subscription: "은행 구독"
 bfl_bank_ven.1.a: "Giro를 공화국의 영구 기관으로 만드십시오."
 bfl_bank_ven.1.b: "상원의 뜻에 따라 1년 동안 갱신하십시오."
 bfl_bank_ven.1.c: "실험을 종료합니다. 기존 계정을 서비스합니다."
 bfl_bank_ven.1.desc: "방코 델 지로(Banco del Giro)는 공화국의 양도 가능한 의무를 명령하는 데 3년이 걸리고 그 이후에는 사업이 중단될 수 있도록 고안되었습니다. 마감일이 다가왔지만 판매자의 장부에 그 어느 때보다 많은 이체가 포함되어 있습니다. 상원은 지속적인 공공 기관, 또 다른 단기 임무, 새로운 사업의 질서 있는 종료 중에서 선택해야 합니다. 지연될 때마다 임시 은행을 해산하기가 더 어려워집니다. 각각의 영구적인 의무는 공화국을 채권자와 더욱 긴밀하게 결속시킵니다."
 bfl_bank_ven.1.entry: "지로의 3년"
 bfl_bank_ven.1.title: "지로의 3년"
 bfl_bank_ven.2.a: "구제 비용을 지불하고 공개 계정을 계속 움직이십시오."
 bfl_bank_ven.2.b: "군사 계정에 우선 순위를 부여하십시오."
 bfl_bank_ven.2.c: "본당과 이웃이 구호품을 전달하도록 하십시오."
 bfl_bank_ven.2.desc: "Giro의 책은 공화국의 긴급 상황을 위한 만남의 장소가 되었습니다. 피해자는 군사 계정을 제시하고 공중 보건 담당관은 자신의 혐의에 대해 지불을 요구합니다. 모든 요구를 즉시 이행하는 것은 재무부에 부담이 될 것입니다. 갤리선을 선호하면 민간 상업이 기다리게 될 것입니다. 일부 상원의원은 이미 가장 무거운 짐을 지고 있는 사람들을 희생시키면서 공공 재정을 아끼면서 본당과 인근 지역에 일을 맡길 것입니다."
 bfl_bank_ven.2.entry: "전쟁과 역병에 관한 책들"
 bfl_bank_ven.2.title: "전쟁과 역병에 관한 책들"
 bfl_bank_ven.3.a: "국고 준비금으로 공공 정화 창구에 자금을 지원하세요."
 bfl_bank_ven.3.b: "은행이 자체 비용으로 더 좁은 창구를 준비하게 하세요."
 bfl_bank_ven.3.c: "저렴한 대중교통사무소를 보존하세요."
 bfl_bank_ven.3.desc: "상인들은 더 이상 공개 장부에 좋은 항목이 기재되어 문제가 끝나는 것을 원하지 않습니다. 그들은 은화로 잔액을 충족할 수 있는 정기적인 창구를 요구하고, 지로의 명성이 그 대답에 달려 있다고 경고합니다. 상원 의원은 자금이 넉넉한 정금 시설에 대한 비용을 지불하거나, 은행이 자체 자원으로 더 좁은 창구를 준비하도록 요구하거나, 더 저렴한 이체 기계를 선호할 수 있습니다. 준비된 동전을 약속하려면 금고에 동전이 있어야 하고 카운터에 직원이 있어야 합니다."
 bfl_bank_ven.3.entry: "Giro의 돈을 위한 은화"
 bfl_bank_ven.3.title: "Giro의 돈을 위한 은화"
 bfl_bank_ven.4.a: "Giro를 공화국의 영구 기관으로 만드십시오."
 bfl_bank_ven.4.b: "상원의 뜻에 따라 1년 동안 갱신하십시오."
 bfl_bank_ven.4.c: "실험을 종료합니다. 기존 계정을 서비스합니다."
 bfl_bank_ven.4.desc: "또 다른 연례 임무가 진행되었습니다. Giro의 서기들은 새 책을 준비해야 할지 아니면 오래된 책을 마감해야 할지 다시 상원에 묻고 있습니다. 한때 임시 방편을 환영했던 상인들은 이제 그 거래를 일반 상거래의 일부로 취급합니다. 위임장을 갱신하면 상원의 재량권이 유지되지만 또 다른 예산 책정이 필요합니다. 영속성이 문제를 해결할 것입니다. 새로운 사업을 폐쇄하면 공화국은 그 결과를 감당해야 할 것입니다."
 bfl_bank_ven.4.entry: "지로의 또 다른 해"
 bfl_bank_ven.4.title: "지로의 또 다른 해"
 bfl_banking_company: "은행회사"
 bfl_banking_company_desc: "이 은행의 업무는 한때 장부를 보관했던 가구보다 더 커졌습니다. 이제 이사회가 사무원을 감독하고, 공동 회계와 설립된 사무실은 한 가족의 재산 이상으로 지속될 수 있는 회사를 하나로 묶습니다. 경험은 한 세대에서 다음 세대로 전달되어 일상적인 신용 사업에 질서와 경제를 가져옵니다."
 bfl_banking_finance_companies__expanded_details_desc: "세부 명세서 보기에 대한 예약된 프리젠테이션 기본 설정입니다."
