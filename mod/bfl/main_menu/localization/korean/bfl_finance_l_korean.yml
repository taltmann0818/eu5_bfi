 bfl_money_hint: "준비금, 보유자 및 결산을 보려면 마우스를 올리세요."
 bfl_money_hint_tip: "완전히 유보된 청구권에 대한 메모 교환 지정입니다. 수락은 자발적입니다. 할인 진행 75 금을 상대로 100-금색 제3은행 지폐. 정산은 모든 회원이 순 차변을 지불할 수 있는 경우에만 일치하는 만기 청구서를 정산합니다. 기존 주장은 잃어버린 권위와 건물에서 살아남습니다."
 bfl_money_leave: "비워두고 떠나기"
 bfl_money_leave_tip: "완전히 유보된 청구권에 대한 메모 교환 지정입니다. 수락은 자발적입니다. 할인 진행 75 금을 상대로 100-금색 제3은행 지폐. 정산은 모든 회원이 순 차변을 지불할 수 있는 경우에만 일치하는 만기 청구서를 정산합니다. 기존 주장은 잃어버린 권위와 건물에서 살아남습니다."
 bfl_money_lending_rate: "새로운 대출 기반"
 bfl_money_lending_rate_tip: "다음을 통해 향후 일반 대출에 대한 연간 기준을 순환합니다. 3%, 6% 그리고 9%. 차용자 조정은 여전히 ​​적용됩니다. 수락된 대출은 금리를 유지합니다."
 bfl_money_notes: "획득 100 메모에"
 bfl_money_notes_tip: "절대주의, 중앙 은행 및 국권 은행권 연구, 실시간 주권 승인, 발행자의 완성된 은행 지점 및 현재 수도에 있는 주권의 완성된 중앙 은행이 필요합니다. 100 재무부 금 및 미사용 지폐 용량. 더 작은 것 25% 은행 자산과 500 금 모자 유통."
 bfl_money_offer_accept: "확보된 사전 자금을 조달하세요"
 bfl_money_offer_accept_tip: "기금 75 현재 관리자, 견적 및 제 3 은행 담보가 유효한 경우 대출 기관의 사용 가능한 현금에서 금. 이 시설에 허용되는 연간 요율은 고정되어 있습니다. 최소한 공공 지원 비용 9%."
 bfl_money_offer_decline: "요청을 거절하세요"
 bfl_money_offer_decline_tip: "금을 이동하거나 담보를 제공하지 않고 이 요청을 종료합니다."
 bfl_money_offer_desc: "사전 75 별도로 자금을 조달하는 금 100- 제3의 은행에 보관된 금 지폐. 에이 25% 이발은 대출 기관을 보호합니다. 허용되는 연간 할인율은 한 달 동안 적용됩니다. 최소한 공공 지원 비용 9%. 합의는 대출 기관에 먼저 비용을 지불하고 나머지 금액을 차용인에게 반환합니다. 자금이 지원되지 않은 담보는 두 가지 주장을 모두 보존합니다. 이 요청은 이번 달에 만료됩니다."
 bfl_money_offer_title: "안전한 정착시설"
 bfl_money_policy_rate: "사이클 미래 할인율"
 bfl_money_policy_rate_tip: "향후 보장된 대출을 위해 연간 이율을 다음을 통해 순환합니다. 6%, 9% 그리고 12%. 수락 시 1개월 요금이 청구됩니다. 기존 시설은 요금을 유지합니다. 최소한 공공 지원 비용 9%."
 bfl_money_redeem: "상태 메모 사용"
 bfl_money_redeem_tip: "주권자가 보유한 모든 지폐를 액면가로 상환합니다. 상실된 권한, 연구 또는 부서는 기존 청구를 취소하지 않습니다. 미지급 청구 금액이 남아 있습니다."
 bfl_money_repay: "확보된 시설을 상환"
 bfl_money_repay_tip: "제3은행 어음 서약을 해제하기 위해 현재 확보된 대출금과 고정 수락 수수료를 상환합니다. 충분한 금이 필요합니다."
 bfl_money_revoke: "권한 취소"
 bfl_money_revoke_tip: "새로운 지폐에 대한 주권 승인을 철회합니다. 기존 메모는 계속 사용할 수 있습니다."
 bfl_money_settings: "정책"
 bfl_money_settings_tip: "통화 정책, 메모 권한, 담보 신용 및 청산 제어를 표시하거나 숨깁니다."
 bfl_money_settings_tip_tip: "완전히 유보된 청구권에 대한 메모 교환 지정입니다. 수락은 자발적입니다. 할인 진행 75 금을 상대로 100-금색 제3은행 지폐. 정산은 모든 회원이 순 차변을 지불할 수 있는 경우에만 일치하는 만기 청구서를 정산합니다. 기존 주장은 잃어버린 권위와 건물에서 살아남습니다."
 bfl_money_subtitle: "상환 가능한 청구 · 자금 지원 결제"
 bfl_money_subtitle_tip: "완전히 유보된 청구권에 대한 메모 교환 지정입니다. 수락은 자발적입니다. 할인 진행 75 금을 상대로 100-금색 제3은행 지폐. 정산은 모든 회원이 순 차변을 지불할 수 있는 경우에만 일치하는 만기 청구서를 정산합니다. 기존 주장은 잃어버린 권위와 건물에서 살아남습니다."
 bfl_money_terms: "원금과 발행금은 소득에서 제외됩니다. 할인율은 연간이며 수락 시 고정됩니다. 자신감이 떨어지다 25 예비금 부족시; 완전히 백업된 노트는 인플레이션을 추가하지 않습니다. 바닐라 결제는 계속해서 천연 금을 사용합니다."
 bfl_money_terms_tip: "완전히 유보된 청구권에 대한 메모 교환 지정입니다. 수락은 자발적입니다. 할인 진행 75 금을 상대로 100-금색 제3은행 지폐. 정산은 모든 회원이 순 차변을 지불할 수 있는 경우에만 일치하는 만기 청구서를 정산합니다. 기존 주장은 잃어버린 권위와 건물에서 살아남습니다."
 bfl_money_title: "돈과 정산"
 bfl_money_title_tip: "원금과 발행금은 소득에서 제외됩니다. 할인율은 연간이며 수락 시 고정됩니다. 자신감이 떨어지다 25 예비금 부족시; 완전히 백업된 노트는 인플레이션을 추가하지 않습니다. 바닐라 결제는 계속해서 천연 금을 사용합니다."
 bfl_native_credit_label: "대출 포트폴리오"
 bfl_native_tab: "주정부 대출"
 bfl_native_takeover: "네이티브 테이크오버"
 bfl_new_capital_subscription: "새로운 자본을 구독하세요"
 bfl_new_capital_subscription_desc: "투자하다 100@gold! 귀하의 은행 자금 중 [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_issuer').GetCountry.GetName] 유형 NAV로 새로 발행된 주식으로. 발행자는 지급금을 받고 기존 보유자는 희석됩니다. 이는 주식 구매와 별개로 자본 청약입니다. 실행에서는 캡처된 NAV, 발행 단위, 연구, 보호 자금 및 집중 한도를 다시 확인합니다. 외교관 한 명을 소비하고 해당 발행자의 1개월 거래 휴지 기간을 시작합니다."
 bfl_new_capital_subscription_tip: "1차 자금 조달: 투자 100 관리 은행에서 금. 발행인은 현금을 받고 신주를 발행합니다. 이는 기존 주식 거래와는 별개입니다."
 bfl_no_automatic_tribute: "자동 헌장 헌정 없음"
 bfl_no_automatic_tribute_cost_modifier: "자동 헌장 헌금 비용"
 bfl_no_bank: "결정을 통해 기존 주립 은행을 승인하거나 독립 은행 국가로 플레이하세요. 귀하의 국가가 은행을 설립하려면 자본 시장을 소유해야 합니다."
 bfl_nobles_estate_workout_mandate: "부동산 운동 명령"
 bfl_nobles_estate_workout_mandate_desc: "이 부동산은 정부가 자신을 대신하여 자발적인 은행 예금 워크아웃을 검토할 수 있는 권한을 명시적으로 부여합니다. 모든 제안은 여전히 ​​별도의 승인이 필요합니다. 이 특권을 취소하면 보류 중인 유산 조건이 무효화됩니다. 복구 지불은 자산 지갑으로 계속됩니다."
 bfl_offer_bank_shares: "새로운 은행주를 제안하세요"
 bfl_offer_bank_shares_tip: "다른 은행 및 국가에서 구독하도록 허용 100 은행의 현재 순자산 가치로 금. 신주는 대금을 지불한 경우에만 발행됩니다. 기존 소유자는 희석됩니다. 네이티브 뱅킹 연구와 긍정적인 자산이 여전히 필요합니다."
 bfl_offer_bond: "은행 보유 국채 제공"
 bfl_offer_bond_tip: "3개월 동안 은행이 보유하고 있는 가장 오래된 채권을 나열하십시오. 98% 액면가의. 판매 및 구매 모두 소유하고 완성된 증권 거래소 건물이 필요합니다. 수락을 통해 판매자, 현재 보유자, 세대, 자금 및 만료를 다시 확인합니다. 블록거래를 연체합니다."
 bfl_offer_bond_workout_01: "제안 재구성"
 bfl_offer_bond_workout_01_tip: "현재 보유자에게 다음을 수락하도록 요청하세요. 20% 원금 및 미지급 이표를 감면하고, 연간 이표를 1% 포인트 삭감합니다. 1% 바닥. 보유자가 별도로 수락하지 않는 한 자금은 이동하지 않습니다. 견적은 이번 달에 만료되며 청구 변경으로 인해 무효화됩니다."
