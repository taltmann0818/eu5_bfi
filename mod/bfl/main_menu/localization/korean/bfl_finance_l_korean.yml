 bfl_request_public_support_desc: "요청 75-당신의 자금에 대한 골드 사전 100-금색 제3은행 지폐. 실시간 대출 관리자가 요청을 검토합니다. 수락은 모든 당사자와 담보를 다시 확인합니다. 은행 간에는 은행 지점이 필요하지 않습니다."
 bfl_request_public_support_effect_text: "$bfl_request_public_support$"
 bfl_request_public_support_effect_text_past: "$bfl_request_public_support$"
 bfl_request_public_support_tip: "공공 금융 지원을 갖춘 공인 대출 기관과 주권의 완성된 자본 중앙 은행을 선택하세요. 현재 관리자가 동의해야 합니다. 는 75- 금 담보 대출은 은행 현금을 사용하고 최소한의 비용을 청구합니다. 9% 매년; 그것은 보장이나 자본 확충을 생성하지 않습니다."
 bfl_reserves: "예비현금"
 bfl_reserves_tip: "예금 및 약속된 지불을 위해 현금을 보관합니다."
 bfl_resolution_begin_command: "해결 시작"
 bfl_resolution_begin_command_tip: "질서 있는 결의는 새로운 약속과 분배를 동결시킵니다. 분리된 화폐 및 보관 준비금은 보호됩니다. 예금은 비용 연체 전과 자본금 이전에 사용 가능한 현금을 비례적으로 공유합니다. 누락된 채권자는 자신의 청구권을 유지합니다. 자발적인 조건에는 현재 채권자의 동의와 르네상스 부채 구조 조정이 필요합니다. 공공 보증은 다음과 같습니다. 50% 허용된 예금 손실액 최대 100 총 금은 기록된 주권에 의해 자금이 지원됩니다. 미지급 통화는 보류 상태로 남아 있습니다. 폐쇄를 위해서는 모든 의무와 비현금 자산을 청산해야 합니다. 폐쇄된 부동산은 다시 열 수 없습니다."
 bfl_resolution_call_command: "지불 보류 보증"
 bfl_resolution_call_command_tip: "질서 있는 결의는 새로운 약속과 분배를 동결시킵니다. 분리된 화폐 및 보관 준비금은 보호됩니다. 예금은 비용 연체 전과 자본금 이전에 사용 가능한 현금을 비례적으로 공유합니다. 누락된 채권자는 자신의 청구권을 유지합니다. 자발적인 조건에는 현재 채권자의 동의와 르네상스 부채 구조 조정이 필요합니다. 공공 보증은 다음과 같습니다. 50% 허용된 예금 손실액 최대 100 총 금은 기록된 주권에 의해 자금이 지원됩니다. 미지급 통화는 보류 상태로 남아 있습니다. 폐쇄를 위해서는 모든 의무와 비현금 자산을 청산해야 합니다. 폐쇄된 부동산은 다시 열 수 없습니다."
