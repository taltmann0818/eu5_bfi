l_korean:
 wisselbank_desc: "도시의 환전 은행은 옛 시청 아래 주화와 어음을 모아 국경을 넘는 상업을 정돈한다. 준비금과 정밀한 장부는 국가 신용에 대한 신뢰를 지탱한다. 완공된 Wisselbank가 특허 은행의 관리비를 줄이는 비율은 15% 이며 필요한 발전을 연구하면 통화 서비스도 지원한다."
 riksbank_desc: "신분 의회의 감독 아래 상설 은행이 왕국의 준비금을 보관하고 국가 신용을 정돈한다. 서기들은 예금을 받고 채무를 결제하며 국가의 약속에 대한 신뢰를 지킨다. 완공된 Riksbank가 특허 은행의 관리비를 줄이는 비율은 15% 이며 필요한 발전을 연구하면 통화 서비스도 지원한다."
