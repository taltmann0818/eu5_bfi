l_korean:
 AUTOMATED_SYSTEM_CREDIT: "신용관리"
 AUTOMATED_SYSTEM_CREDIT_DESC: "주정부 대출 및 채권을 관리합니다. 은행은 또한 대출 인수를 검토하고, 현금이 필요한 대출자에게 자금 지원 대출을 제공하고, 여유 현금을 사용 가능한 주식에 투자합니다. 회사는 무역과 탐사를 관리합니다. 은행은 준비금을 유지하고 부채 용량을 확인합니다. 차용인은 새로운 대출을 수락해야합니다."
 AUTOMATE_SYSTEM_TOOLTIP_CREDIT: "자동화에서 신용 관리 활성화: 국가 부채, 은행 대출, 투자 및 회사 운영."
 DEAUTOMATE_SYSTEM_TOOLTIP_CREDIT: "신용 관리를 비활성화합니다. 기존 대출, 예금, 약속된 지급금은 계속해서 제공됩니다."
