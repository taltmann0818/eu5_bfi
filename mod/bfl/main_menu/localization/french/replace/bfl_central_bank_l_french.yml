l_french:
 central_bank_desc: "Une institution centrale chargée de conserver les réserves et d'ordonner le crédit public rassemble sous un même toit les activités financières dispersées. Une banque à charte soutenue par une banque centrale complétée paie 15% moins de frais d’administration et accède aux services monétaires à mesure que les avancées nécessaires sont recherchées. Les billets restent des obligations garanties ; leur émission ne crée pas de profit bancaire."
