l_french:
 banking_office: "Agence bancaire"
 banking_office_desc: "Un bureau de banque local. Les nouveaux crédits, dépôts et investissements souverains nécessitent une succursale achevée appartenant à la banque dans le capital actuel du souverain. Les réclamations existantes restent réparables ; les activités de banque à banque ne nécessitent aucune succursale."
