l_french:
 banking_office: "Agence bancaire"
 banking_office_desc: "Un bureau bancaire local. Un souverain doté d'une banque à charte peut financer des succursales étrangères par la construction normale, sous réserve des relations avec l'hôte et des exigences habituelles. À son achèvement, la succursale appartient à la banque. Les nouveaux crédits souverains, dépôts et investissements exigent une succursale achevée de la banque dans la capitale actuelle du souverain. Les créances existantes restent administrées."
