l_french:
 AUTOMATED_SYSTEM_CREDIT: "Gestion du crédit"
 AUTOMATED_SYSTEM_CREDIT_DESC: "Gérer les prêts et obligations de l'État. Votre banque examine également les rachats de prêts, propose des prêts financés aux emprunteurs qui ont besoin de liquidités et investit les liquidités disponibles dans des actions recherchées. Les entreprises gèrent le commerce et l’exploration. La banque conserve des réserves et vérifie la capacité d'endettement ; les emprunteurs doivent accepter de nouveaux prêts."
 AUTOMATE_SYSTEM_TOOLTIP_CREDIT: "Activez la gestion du crédit dans l’automatisation : dette publique, prêts bancaires, investissements et opérations de l’entreprise."
 DEAUTOMATE_SYSTEM_TOOLTIP_CREDIT: "Désactivez la gestion des crédits. Les prêts, dépôts et paiements promis existants continuent d’être remboursés."
