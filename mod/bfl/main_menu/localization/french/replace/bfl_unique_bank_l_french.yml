l_french:
 wisselbank_desc: "La banque de change de la ville rassemble monnaies et lettres de change sous le toit de l'ancien hôtel de ville, ordonnant un commerce qui traverse toutes les frontières. Ses réserves et ses livres soignés soutiennent la confiance dans le crédit public. Une Wisselbank achevée réduit les frais d'administration de la banque à charte de 15% et permet les services monétaires après les progrès nécessaires."
 riksbank_desc: "Sous la garde des états, une banque permanente conserve les réserves du royaume et organise son crédit public. Ses commis reçoivent les dépôts, règlent les obligations et entretiennent la confiance dans les promesses de l'État. Une Riksbank achevée réduit les frais d'administration de la banque à charte de 15% et permet les services monétaires après les progrès nécessaires."
