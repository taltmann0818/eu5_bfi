 bfl_report_history_heading: "Historique mensuel · revenus / dépenses"
 bfl_report_impairment_definition: "Nouvelles réductions de la valeur enregistrée des prêts bancaires ce mois-ci. Les pertes antérieures sont exclues."
 bfl_report_impairment_title: "Défauts et dépréciations"
 bfl_report_legend: "#G Revenu brut#!     #R Dépenses brutes#!"
 bfl_report_losses_definition: "Les pertes antérieures, les frais et les ajustements de ce règlement donnent le solde avant imputation des revenus. Les revenus utilisés pour couvrir ces pertes sont ensuite déduits afin d'afficher le report. Les ajustements comprennent les recouvrements et les écritures antérieures à cette ventilation. Ce total est distinct des dépenses brutes de ce mois."
 bfl_report_losses_title: "Coûts et pertes reportées"
 bfl_report_native_cost_definition: "Une perte réalisée dans le budget de la banque locale, après classification séparée des intérêts d’emprunt. Les revenus et dépenses bruts des autochtones ne sont pas déduits des revenus prévus."
 bfl_report_native_cost_title: "Perte de budget natif"
 bfl_report_native_gross_definition: "L'excédent budgétaire indigène réalisé enregistré par la banque, après classement des intérêts d'emprunt observés. Il s'agit d'une chaîne native du net ; les dépôts, l'émission d'obligations et les nouveaux capitaux sont exclus des revenus gagnés."
 bfl_report_native_gross_title: "Autres revenus bancaires"
 bfl_report_operating_cost_definition: "Les frais d'administration bancaire évalués ce mois-ci. Survolez les dépenses de fonctionnement pour sa formule."
 bfl_report_operating_cost_title: "Administration"
 bfl_report_principal_definition: "Le capital du prêt est restitué à la banque. Cela convertit une créance en espèces et est exclue du revenu."
 bfl_report_principal_title: "Le directeur est revenu"
 bfl_report_recovery_loss_definition: "Coût d'acquisition perdu sur les prêts remboursés. Le capital restitué est exclu du revenu."
 bfl_report_recovery_loss_title: "Pertes de crédit"
 bfl_report_retained_profit_definition: "Bénéfice éligible diminué du montant effectivement versé aux actionnaires."
 bfl_report_retained_profit_title: "Bénéfice conservé"
 bfl_report_services_definition: "Frais gagnés par les services bancaires effectués."
 bfl_report_services_title: "Prestations"
 bfl_report_trading_definition: "Gains ou pertes réalisés sur les titres vendus ou remboursés. Les variations de prix des invendus sont exclues."
 bfl_report_trading_title: "Négoce de titres"
 bfl_report_ventures_definition: "Bénéfice réalisé sur les investissements réalisés. Les nouveaux capitaux sont exclus."
 bfl_report_ventures_title: "Entreprises"
