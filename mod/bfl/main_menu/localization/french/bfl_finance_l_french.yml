 bfl_chart_equity_11: "Équité : [Country.MakeScope.GetVariable('bfl_history_equity_11').GetValue|2]@gold! · mois comptable [Country.MakeScope.GetVariable('bfl_history_period_11').GetValue|0]"
 bfl_chart_equity_12: "Équité : [Country.MakeScope.GetVariable('bfl_history_equity_12').GetValue|2]@gold! · mois comptable [Country.MakeScope.GetVariable('bfl_history_period_12').GetValue|0]"
 bfl_charter_begin_tip: "Ouvrez le sélecteur de banque d'État éligible. Aucun changement d’argent ou de recherche jusqu’à ce qu’une banque soit sélectionnée ; L'annulation laisse les deux trésors inchangés."
 bfl_charter_selection_tip: "Transfert [ROOT.GetCountry.MakeScope.ScriptValue('bfl_charter_investment')|0]@gold! à la banque sélectionnée en tant que nouveaux capitaux propres de l'État. Préserver son pays, ses bâtiments, ses revendications et obligations existantes, puis choisir sa spécialisation permanente."
 bfl_chartered_bank: "Banque à charte"
 bfl_chartered_bank_desc: "Une banque d'État basée sur un bâtiment a été créée en place. Sa trésorerie et ses obligations restent distinctes de son souverain. Aucun hommage automatique n’est collecté."
 bfl_choose_acciaioli_tt: "Affrétez la banque Acciaioli existante et transférez les liquidités disponibles jusqu'à concurrence de l'investissement charter normal. Préserver ses prêts, dépôts et obligations. Création du Palazzo Acciaiuoli à Florence, propriété de la banque. Une banque agréée par un autre souverain n’est pas disponible."
 bfl_choose_bardi_tt: "Affrétez la banque Bardi existante et transférez les liquidités disponibles jusqu'à concurrence de l'investissement d'affrètement normal. Préserver ses prêts, dépôts et obligations. Création du Palazzo Busini-Bardi à Florence, propriété de la banque. Une banque agréée par un autre souverain n’est pas disponible."
 bfl_choose_peruzzi_tt: "Affrétez la banque Peruzzi existante et transférez les liquidités disponibles jusqu'à concurrence de l'investissement d'affrètement normal. Préserver ses prêts, dépôts et obligations. Création du Palazzo Peruzzi à Florence, propriété de la banque. Une banque agréée par un autre souverain n’est pas disponible."
 bfl_clearing: "Dégagement"
 bfl_clearing_tip: "#T Effacement avancé#!\nRévolutions, Advanced Clearing et recherche native de Clearing House. Un centre de compensation complet et une admission explicite des membres permettent un règlement net atomique des factures échues appariées. Un membre court bloque le lot et préserve chaque réclamation."
 bfl_clergy_estate_workout_mandate: "Mandat de redressement successoral"
 bfl_clergy_estate_workout_mandate_desc: "Cette succession autorise explicitement son gouvernement à examiner en son nom les mesures volontaires de restructuration des dépôts bancaires. Chaque proposition doit encore être acceptée séparément. La révocation de ce privilège invalide les conditions successorales en cours. Les paiements de recouvrement continuent d’être versés au portefeuille de la succession."
 bfl_close_bank_offering: "Clôture de l'offre d'actions"
 bfl_close_bank_offering_tip: "Arrêtez d'accepter des abonnements externes. Les droits de propriété et de dividendes existants restent en vigueur. Le souverain peut toujours recapitaliser sa propre banque."
 bfl_close_bond_offer: "Clôture de l'émission d'obligations"
 bfl_close_bond_offer_tip: "Retirer l'offre secondaire actuelle. Les dettes impayées et les coupons restent dus."
 bfl_collateral: "Garantie"
 bfl_collateralization: "Garantie"
 bfl_collateralization_desc: "La confiance est renforcée lorsqu'une promesse est soutenue par la propriété. En enregistrant un gage et les droits du créancier sur celui-ci, les banquiers peuvent prêter contre des actifs qui peuvent être récupérés si le débiteur ne respecte pas l'accord."
 bfl_commenda: "Commenda"
 bfl_commenda_available_color: "green"
 bfl_commenda_available_icon: "@bfl_commenda_opportunity!"
 bfl_commenda_available_left_click: "Revoir cette opération"
 bfl_commenda_available_name: "Commenda disponible pour financer"
 bfl_commenda_available_tooltip: "[GetPlayer.MakeScope.GetVariable('bfl_op_country').GetCountry.GetName] · 10 [GetPlayer.MakeScope.GetVariable('bfl_op_good').Goods.GetNameWithNoTooltip]\n[GetPlayer.MakeScope.GetVariable('bfl_op_from').GetMarket.GetName] → [GetPlayer.MakeScope.GetVariable('bfl_op_to').GetMarket.GetName]\nCoût bancaire estimé : [GetPlayer.MakeScope.GetVariable('bfl_op_cost').GetValue|2]@gold!\nExcédent bancaire indicatif: +[GetPlayer.MakeScope.GetVariable('bfl_op_surplus').GetValue|2]@gold!\n\nCotations actuelles du marché pour une opération de fret de deux mois ; l’excédent exclut le capital récupéré. Les prix et l'accès peuvent changer. Le capital et les rendements sont menacés. Seule la vente effective de cette cargaison paie l’accord. L'opérateur doit accepter. Les opportunités sont actualisées mensuellement et sont vérifiées à nouveau avant l'envoi d'une offre."
 bfl_commenda_cargo: "Commenda : expédier une cargaison dans une zone découverte"
 bfl_commenda_cargo_act: "Expédier une cargaison dans une zone découverte"
 bfl_commenda_cargo_desc: "Sélectionnez l'opérateur parrainé et une cargaison de dix unités provenant d'un marché centré ou bordant sa zone découverte. Seuls les fonds acceptés non utilisés peuvent payer leur coût d'achat natif. Aucun paiement de découverte ni attribution commerciale sans rapport."
 bfl_commenda_cargo_effect_text: "Expédier une cargaison dans une zone découverte"
 bfl_commenda_cargo_effect_text_past: "Expédier une cargaison dans une zone découverte"
 bfl_commenda_cargo_tip: "Nécessite la découverte vérifiée de l’expédition acceptée, l’autorisation restante, l’accès au marché natif et le stock. L'opérateur ou le contrôleur politique commande le voyage."
 bfl_commenda_desc: "Un marchand entreprenant un voyage peut posséder les compétences nécessaires pour faire du commerce sans avoir le capital nécessaire pour remplir un navire. La commende associe l'argent d'un financier au travail d'un partenaire de voyage, partageant les bénéfices de l'entreprise conformément à leur accord."
 bfl_commenda_expedition: "Financer une expédition nommée"
 bfl_commenda_expedition_act: "Financer une expédition nommée"
 bfl_commenda_expedition_desc: "Choisissez un opérateur, son port de lancement, une zone maritime méconnue et un explorateur. Les cibles maritimes doivent être à portée navale de l'opérateur ; les entreprises sans terre utilisent la gamme de l’hôte de l’établissement sélectionné. L’acceptation finance la préparation native selon les conditions proposées. La banque n’obtient aucun contrôle politique."
 bfl_commenda_expedition_effect_text: "Financer une expédition nommée"
 bfl_commenda_expedition_effect_text_past: "Financer une expédition nommée"
 bfl_commenda_expedition_tip: "Choisissez un opérateur, une zone, un port de lancement et un explorateur avant de donner votre consentement. Le financement ne couvre que les coûts réels de préparation des autochtones. La préparation n'est pas remboursable. L'autorisation restante peut financer des marchandises provenant d'un marché centré ou bordant la zone découverte ; seul le produit de sa vente mesuré peut rapporter des bénéfices."
 bfl_commenda_opportunity_consent: "Revérifiez cette cargaison nommée et votre autorité de financement en direct. Envoyez une offre en utilisant vos conditions actuelles ; aucun argent ne circule jusqu'à ce que l'opérateur accepte."
 bfl_commenda_opportunity_later: "A considérer plus tard"
 bfl_commenda_opportunity_propose: "Envoyer ces conditions à l'opérateur"
 bfl_commenda_opportunity_review: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_op_country').GetCountry.GetName] · 10 [ROOT.GetCountry.MakeScope.GetVariable('bfl_op_good').Goods.GetNameWithNoTooltip]\n[ROOT.GetCountry.MakeScope.GetVariable('bfl_op_from').GetMarket.GetName] → [ROOT.GetCountry.MakeScope.GetVariable('bfl_op_to').GetMarket.GetName]\nCoût bancaire estimé : [ROOT.GetCountry.MakeScope.GetVariable('bfl_op_cost').GetValue|2]@gold!\nExcédent bancaire indicatif: +[ROOT.GetCountry.MakeScope.GetVariable('bfl_op_surplus').GetValue|2]@gold!\n\nCotations actuelles du marché pour une opération de fret de deux mois ; l’excédent exclut le capital récupéré. Les prix et l'accès peuvent changer. Le capital et les rendements sont menacés. Seule la vente effective de cette cargaison paie l’accord. L'opérateur doit accepter. Les opportunités sont actualisées mensuellement et sont vérifiées à nouveau avant l'envoi d'une offre."
 bfl_commenda_tip: "#T Commenda#!\nEngagez du capital dans un voyage ou une entreprise commerciale en échange d’une part des bénéfices définie. Nécessite la recherche Commenda, l'investissement à l'étranger et l'âge de la découverte ou une version ultérieure. L'exécution de projet natif n'est pas disponible dans cette version."
 bfl_commercial_bill: "Facture commerciale"
 bfl_commercial_bills: "Factures commerciales"
 bfl_commercial_bills_desc: "Transporter des pièces de monnaie entre les centres commerciaux est coûteux et dangereux. Les effets écrits permettent aux commerçants de régler leurs obligations par l'intermédiaire de banques de confiance, faisant ainsi de la réputation de l'émetteur un instrument de commerce."
 bfl_commodity_forward: "Marchandises à terme"
 bfl_commodity_forward_tip: "#T Marchandises à terme#!\nConvenez d’une future livraison de marchandises financée. Nécessite la recherche Commodity Forwards, Merchant Finance et l'ère de l'absolutisme ou une version ultérieure. La livraison physique et le règlement ne sont pas disponibles dans cette version."
 bfl_commodity_forwards: "Marchandises à terme"
 bfl_commodity_forwards_desc: "Une commande de récolte, d’expédition ou d’atelier peut être vendue avant sa livraison. Les accords qui fixent un prix futur aident les commerçants à organiser leurs affaires malgré l'incertitude des marchés lointains et des saisons changeantes."
 bfl_commodity_inventory: "Inventaire des produits"
 bfl_commodity_inventory_tip: "#T Inventaire des marchandises#!\nBiens financiers détenus à des fins commerciales. Nécessite une recherche sur les investissements en matières premières, Merchant Finance et l'âge Discovery ou version ultérieure. L'achat, la garde et la livraison de biens physiques ne sont pas disponibles dans cette version."
 bfl_commodity_investments: "Investissements en matières premières"
 bfl_commodity_investments_desc: "Les banquiers qui financent le commerce peuvent également détenir eux-mêmes les marchandises. Les céréales, la laine et autres marchandises deviennent des investissements dont la valeur dépend du stockage, du transport et de l'évolution des besoins des marchés lointains."
 bfl_companies_empty: "Aucune société d'exploitation sous votre contrôle."
 bfl_company_crew: "Transfert 250 marins à la compagnie"
 bfl_company_crew_desc: "Gérez une entreprise native que vous contrôlez actuellement. Le capital financé est exclu du résultat opérationnel."
 bfl_company_crew_tip: "Gérez une entreprise native que vous contrôlez actuellement. Les apports en capital sont un financement. Les distributions des sociétés utilisent les bénéfices commerciaux non distribués après les coûts natifs, les pertes reportées, les réserves de dette et les réserves de trésorerie. Le suzerain politique et le propriétaire financier sont distincts."
 bfl_company_equity: "Fonds propres de l'entreprise"
 bfl_company_equity_desc: "Les grandes entreprises commerciales ont besoin de fortunes que peu de commerçants peuvent fournir seuls. La répartition de la propriété entre les investisseurs permet à une entreprise de rassembler un capital durable tout en répartissant les risques et les récompenses de ses entreprises."
 bfl_company_equity_tip: "#T Fonds propres de l'entreprise#!\nSouscrivez du capital pour une part de propriété dans une entreprise reconnue. Nécessite une recherche sur les actions de l'entreprise, des investissements à l'étranger et l'âge de la Réforme ou plus tard. L'émission de sociétés natives et le règlement des détenteurs ne sont pas disponibles dans cette version."
 bfl_company_expedition: "Entreprise : préparer l’exploration native"
 bfl_company_expedition_desc: "Utilisez la trésorerie de l'entreprise, les marins et l'explorateur pour préparer une exploration maritime dans les locaux de l'entreprise. La préparation et les progrès natifs s'appliquent. La découverte ne produit aucun profit en espèces ou en investissement."
 bfl_company_expedition_tip: "Nécessite un mandat de commerce et d'exploration, une cartographie, une entreprise d'exploration éligible, des marins et un budget d'entreprise disponible. Un temps de préparation natif s'applique."
 bfl_company_exploration_capacity: "Création d'une société d'exploration"
 bfl_company_exploration_capacity_desc: "Capacité pour 500 marins alors qu’un mandat d’exploration est autorisé. Les marins doivent provenir de l'entreprise ou d'un transfert financé par son contrôleur politique."
 bfl_company_explore: "Mandat de l'entreprise : commerce et exploration"
 bfl_company_explore_desc: "Gérez une entreprise native que vous contrôlez actuellement. Le capital financé est exclu du résultat opérationnel."
 bfl_company_explore_tip: "Gérez une entreprise native que vous contrôlez actuellement. Les apports en capital sont un financement. Les distributions des sociétés utilisent les bénéfices commerciaux non distribués après les coûts natifs, les pertes reportées, les réserves de dette et les réserves de trésorerie. Le suzerain politique et le propriétaire financier sont distincts."
 bfl_company_fund: "Contribuer 100 de l'or au capital de l'entreprise"
 bfl_company_fund_desc: "Gérez une entreprise native que vous contrôlez actuellement. Le capital financé est exclu du résultat opérationnel."
 bfl_company_fund_tip: "Gérez une entreprise native que vous contrôlez actuellement. Les apports en capital sont un financement. Les distributions des sociétés utilisent les bénéfices commerciaux non distribués après les coûts natifs, les pertes reportées, les réserves de dette et les réserves de trésorerie. Le suzerain politique et le propriétaire financier sont distincts."
 bfl_company_list_equity: "Autoriser la cotation au capital de la société"
 bfl_company_list_equity_desc: "Autoriser les souscriptions primaires et les transactions secondaires payantes à la valeur liquidative. Les acquisitions bancaires nécessitent des investissements à l'étranger, une recherche sur les actions des entreprises et l'échange final pour les transactions secondaires. La suzeraineté politique reste inchangée."
 bfl_company_list_equity_tip: "Le contrôleur politique en direct autorise la participation au marché. Aucune somme d'argent ni unité n'est attribuée."
 bfl_company_overview_note: "La trésorerie de l’entreprise appartient à l’entreprise. Credit Management gère son commerce et son exploration. Les dividendes des propriétaires utilisent les bénéfices financés après réserves ; les nouveaux capitaux et les découvertes sont exclus."
 bfl_company_overview_subtitle: "Comptes sociaux · dernier règlement"
 bfl_company_overview_title: "[Country.GetName]"
 bfl_company_panel: "Sociétés d'exploitation"
 bfl_company_retain: "Mandat de l'entreprise : suspendre les nouvelles opérations"
 bfl_company_retain_desc: "Gérez une entreprise native que vous contrôlez actuellement. Le capital financé est exclu du résultat opérationnel."
 bfl_company_retain_tip: "Gérez une entreprise native que vous contrôlez actuellement. Les apports en capital sont un financement. Les distributions des sociétés utilisent les bénéfices commerciaux non distribués après les coûts natifs, les pertes reportées, les réserves de dette et les réserves de trésorerie. Le suzerain politique et le propriétaire financier sont distincts."
 bfl_company_route: "Entreprise : ouvrir la route commerciale indigène"
 bfl_company_route_desc: "Ouvrez une route native appartenant à l'entreprise à l'aide de 0.1 capacité marchande. Nécessite un mandat commercial, un budget de fonctionnement disponible, un accès au marché local, un excédent et une capacité. Maximum d’un itinéraire commandé par entreprise et par mois. Native AI conserve son propre comportement commercial."
 bfl_company_route_tip: "Sélectionnez l'entreprise, le marché source, le marché de destination, le marché marchand et les biens. Les coûts du commerce natif sont facturés par le moteur."
 bfl_company_select: "Sélectionnez la société d'exploitation"
 bfl_company_select_desc: "Inspectez une entreprise locale sous votre contrôle politique actuel."
 bfl_company_select_tip: "Inspectez une entreprise sous votre contrôle."
 bfl_company_strategy_construction: "Réinvestir les réserves de l'entreprise dans un système de trading natif"
 bfl_company_trade: "Mandat de l'entreprise : commerce"
 bfl_company_trade_desc: "Gérez une entreprise native que vous contrôlez actuellement. Le capital financé est exclu du résultat opérationnel."
 bfl_company_trade_tip: "Gérez une entreprise native que vous contrôlez actuellement. Les apports en capital sont un financement. Les distributions des sociétés utilisent les bénéfices commerciaux non distribués après les coûts natifs, les pertes reportées, les réserves de dette et les réserves de trésorerie. Le suzerain politique et le propriétaire financier sont distincts."
 bfl_copper_market_demand: "Demande de cuivre sur le marché local"
 bfl_corporate_credit: "Crédit aux entreprises"
 bfl_corporate_credit_desc: "À mesure que les entreprises commerciales dépassent la capacité d’un seul voyage ou d’une seule saison, leur besoin de crédit devient plus persistant. Les établissements bancaires apprennent à juger les ressources et les perspectives d'une entreprise ainsi que la position de ses commerçants individuels."
 bfl_corporate_credit_tip: "#T Crédit aux entreprises#!\nPrêtez à une entreprise commerciale reconnue. Nécessite une recherche sur le crédit d'entreprise, la finance marchande et l'ère de la Réforme ou une version ultérieure. La nouvelle exécution native de prêts d’entreprise n’est pas disponible dans cette version."
 bfl_cost_accounts: "Comptes de dépôt : [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_operating_accounts_count')|0] × 0.05"
 bfl_cost_asset_types: "Classes d'actifs non monétaires : [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_operating_asset_types_count')|0] × 0.25"
 bfl_cost_base: "Administration des bases"
 bfl_cost_branches: "Succursales : [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_operating_branches_count')|0] × 0.50"
 bfl_cost_constitution: "Constitution bancaire"
 bfl_cost_constitution_factor: "Multiplicateur d'administration"
 bfl_cost_contracts: "Contrats financiers personnalisés : [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_operating_contracts_count')|0] × 0.10"
 bfl_cost_current: "Coût mensuel actuel : #R [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_operating_expense')|2]@gold!#!"
 bfl_cost_payment_detail: "Les coûts évoluent avec la complexité, et non avec la valeur des actifs. Facturé une fois par mois au-dessus des réserves protégées ; les dépenses impayées limitent les dividendes. Les intérêts de dépôt et les dépenses locales sont distincts. Les réductions ordinaires s’additionnent, puis le multiplicateur de dépenses de la constitution bancaire s’applique. Le total est arrondi au centime."
 bfl_cost_reduction_administration: "Administration rationalisée"
