 bfl_fuggerhauser: "Fuggerhauser"
 bfl_fuggerhauser_desc: "Les registres conservés derrière cette façade d'Augsbourg lient les dettes princières envers le commerce du cuivre. La maison réduit les intérêts d’emprunt de son propriétaire d’un demi-point de pourcentage. Son activité cuivre accroît la demande sur le marché local, soutenant le prix du cuivre dans la mesure où l'offre et la demande le permettent."
