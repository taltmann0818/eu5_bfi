 bfl_manage_shareholdings_desc: "Fixer les dividendes pour [ROOT.GetCountry.MakeScope.GetVariable('bfl_exchange_selected').GetCountry.GetName]. Une majorité des votes financiers contrôle les paiements des entreprises et des banques indépendantes. L'État contrôle sa propre banque à charte. Les choix des entreprises en matière de réserves laissent le contrôle politique inchangé."
 bfl_manage_shareholdings_tip: "Choisissez une entreprise ou une banque pour fixer les dividendes. Nécessite une majorité des votes financiers ou le contrôle de votre banque à charte. Les participations minoritaires restent visibles avec leurs exigences non satisfaites."
 bfl_margining: "Marge"
 bfl_margining_and_risk_management: "Marge et gestion des risques"
 bfl_margining_and_risk_management_desc: "Les commerçants qui promettent des livraisons futures sont confrontés à des changements de prix bien avant l’échéance de leurs contrats. Exiger une sécurité supplémentaire à mesure que les expositions augmentent donne aux banquiers un moyen de contenir les pertes avant qu’un marché défavorable ne devienne un défaut."
 bfl_margining_tip: "#T Gestion des marges et des risques#!\nExiger des garanties et une marge de variation contre l’évolution de l’exposition aux matières premières. Nécessite des recherches sur les marges et la gestion des risques, la finance marchande et l’ère des révolutions. L’exécution de marge adossée à des marchandises n’est pas disponible dans cette version."
 bfl_market_company_requirement: "Les actions de la société nécessitent une recherche sur les investissements à l’étranger et les actions de la société. Les actions bancaires utilisent le Share Dealing."
 bfl_market_funds_requirement: "Votre banque peut offrir des actions dans les limites de ses liquidités, de son capital et de sa propriété."
 bfl_market_holder_requirement: "L'émetteur dispose d'un emplacement d'actionnaire gratuit ou enregistre déjà votre banque acheteuse comme actionnaire."
 bfl_market_portfolio_requirement: "Votre banque acheteuse dispose d’un emplacement de portefeuille gratuit ou détient déjà ce titre."
 bfl_market_sort_price: "Trier par prix par action"
 bfl_mediceo_maintenance: "Administration de la Banque Médicale"
 bfl_medici_decline: "Notre trésor a d'autres priorités."
 bfl_medici_desc: "Depuis leurs grands palais de pierre, les Médicis dirigent un réseau de crédit à travers l'Italie et au-delà des Alpes. Une maison permanente à Milan rapprocherait leurs commis et leurs réserves de notre cour. En échange d'une charte et d'une souscription de deux mille ducats, la banque propose de lier son sort à notre crédit public tout en conservant ses comptes et ses obligations existants."
 bfl_medici_fund: "Abonnez-vous 2,000 ducats et accorder la charte."
 bfl_medici_funding_tt: "Transfert 2,000 ducats à la banque des Médicis et en faire notre banque à charte. Établir le Banco Mediceo à Milan et des succursales achevées à Milan et dans notre capitale actuelle. Les prêts et obligations existants sont préservés. Une banque déjà sous charte d'un autre souverain ne peut être reprise."
 bfl_medici_house_only: "Accueillir la maison bancaire sans souscription publique."
 bfl_medici_house_only_tt: "Établir le bâtiment Banco Mediceo à Milan sans financer ni placer sous charte la banque des Médicis."
 bfl_medici_title: "Le Banco Mediceo à Milan"
 bfl_mendes_spice_house: "La maison de Mendès"
 bfl_mendes_spice_house_desc: "De l’autre côté des mers, les facteurs de la maison Mendès lient les ports d’épices aux comptoirs d’Europe. Leur correspondance ouvre des marchés pour le poivre et les clous de girofle, tandis que le mouvement constant des billets et des marchandises soutient un commerce qui dépasse les barrières des princes. En dotant cette maison d'une constitution pérenne, nous mettons son expérience au service d'un échange plus libre."
 bfl_monetary: "Politique monétaire et liquidité"
 bfl_monetary_explanation: "Échangez des espèces contre des billets réservés avec une autorité souveraine et une banque centrale complétée. Escompter les effets de banques tierces après les facilités de garantie et de liquidité ; Revolutions ajoute une compensation des membres financée et un soutien public sécurisé plafonné. Les tarifs acceptés restent fixes."
 bfl_monetary_tip: "#T Instruments monétaires#!\nAutorisations ultérieures pour les billets souverains, liquidité garantie, compensation et soutien public. Chacun nécessite sa propre autorisation, son support et ses conditions de fonctionnement."
 bfl_money_accept: "Basculer l'acceptation et les remises"
 bfl_money_accept_tip: "Les billets échangent des espèces contre une créance entièrement réservée. L'acceptation est volontaire. Avance des réductions 75 de l'or contre un 100-Billet d'or d'une troisième banque. Clearing ne règle les factures échues correspondantes que lorsque chaque membre peut payer son débit net. Les revendications existantes survivent à la perte d'autorité et de bâtiments."
 bfl_money_acceptance_action: "Changer l'acceptation volontaire"
 bfl_money_authorize: "Autoriser les notes"
 bfl_money_authorize_tip: "Le contrôleur souverain autorise sa banque à charte. Une banque centrale appartenant à l'État est requise dans le capital actuel. Les nouvelles émissions nécessitent également une recherche sur le capital de l’émetteur et sur les succursales bancaires et les billets."
 bfl_money_clear: "Régler les factures des membres"
 bfl_money_clear_open: "Admission de compensation"
 bfl_money_clear_open_tip: "Ouvrez ou fermez l'admission à votre groupe de compensation. Nécessite des recherches sur les révolutions, les chambres de compensation et les compensations avancées, ainsi qu'une chambre de compensation complétée appartenant à la banque ou à son souverain actif. Quatre membres maximum."
 bfl_money_clear_tip: "Réglez les factures échues des membres correspondants une fois ce mois-ci. Chaque membre doit couvrir son débit net tout en protégeant les autres réserves. Un membre court préserve l'intégralité du lot. Les créances gagées et non membres sont exclues."
 bfl_money_empty: "Aucun billet en circulation. La recherche monétaire, l'autorité et les bâtiments achevés débloquent de nouveaux services."
 bfl_money_empty_tip: "Les billets échangent des espèces contre une créance entièrement réservée. L'acceptation est volontaire. Avance des réductions 75 de l'or contre un 100-Billet d'or d'une troisième banque. Clearing ne règle les factures échues correspondantes que lorsque chaque membre peut payer son débit net. Les revendications existantes survivent à la perte d'autorité et de bâtiments."
 bfl_money_help: "Les billets échangent des espèces contre une créance entièrement réservée. L'acceptation est volontaire. Avance des réductions 75 de l'or contre un 100-Billet d'or d'une troisième banque. Clearing ne règle les factures échues correspondantes que lorsque chaque membre peut payer son débit net. Les revendications existantes survivent à la perte d'autorité et de bâtiments."
 bfl_money_help_tip: "Les billets échangent des espèces contre une créance entièrement réservée. L'acceptation est volontaire. Avance des réductions 75 de l'or contre un 100-Billet d'or d'une troisième banque. Clearing ne règle les factures échues correspondantes que lorsque chaque membre peut payer son débit net. Les revendications existantes survivent à la perte d'autorité et de bâtiments."
 bfl_money_hint: "Survolez les réserves, les détenteurs et le règlement"
 bfl_money_hint_tip: "Les billets échangent des espèces contre une créance entièrement réservée. L'acceptation est volontaire. Avance des réductions 75 de l'or contre un 100-Billet d'or d'une troisième banque. Clearing ne règle les factures échues correspondantes que lorsque chaque membre peut payer son débit net. Les revendications existantes survivent à la perte d'autorité et de bâtiments."
 bfl_money_leave: "Quitter la clairière"
 bfl_money_leave_tip: "Les billets échangent des espèces contre une créance entièrement réservée. L'acceptation est volontaire. Avance des réductions 75 de l'or contre un 100-Billet d'or d'une troisième banque. Clearing ne règle les factures échues correspondantes que lorsque chaque membre peut payer son débit net. Les revendications existantes survivent à la perte d'autorité et de bâtiments."
 bfl_money_lending_rate: "Nouvelle base de prêt"
 bfl_money_lending_rate_tip: "Cycle la base annuelle des futurs prêts ordinaires à travers 3%, 6% et 9%. Les ajustements de l’emprunteur s’appliquent toujours. Les prêts acceptés conservent leurs taux."
 bfl_money_notes: "Acquérir 100 en notes"
 bfl_money_notes_tip: "Nécessite une recherche sur l'absolutisme, les banques centrales et les billets souverains, une autorisation souveraine en direct, la succursale bancaire complétée par l'émetteur et la banque centrale complétée par le souverain dans le capital actuel, 100 l'or du Trésor et la capacité des billets inutilisés. Le plus petit de 25% fonds propres bancaires et 500 circulation des capsules d'or."
 bfl_money_offer_accept: "Financer l’avance garantie"
 bfl_money_offer_accept_tip: "Fonds 75 de l’or à partir des liquidités disponibles du prêteur si le gestionnaire actuel, la cotation et la garantie d’une troisième banque restent valides. Le tarif annuel accepté est fixe pour cet établissement ; frais de soutien public au moins 9%."
 bfl_money_offer_decline: "Refuser la demande"
 bfl_money_offer_decline_tip: "Clôturez cette demande sans déplacer d’or ni donner de garantie."
 bfl_money_offer_desc: "Avance 75 de l'or contre un fonds financé séparément 100-un billet d'or détenu dans une banque tierce. UN 25% la coupe de cheveux protège le prêteur. Le taux de remise annuel accepté s'applique pendant un mois ; frais de soutien public au moins 9%. Le règlement paie d'abord le prêteur et restitue le reste à l'emprunteur. La garantie non financée préserve les deux créances. Cette demande expire ce mois-ci."
 bfl_money_offer_title: "Une facilité de règlement sécurisée"
 bfl_money_policy_rate: "Cycle du taux d'actualisation futur"
 bfl_money_policy_rate_tip: "Faites défiler le taux annuel des futures avances garanties via 6%, 9% et 12%. Un mois est facturé à l'acceptation ; les installations existantes conservent leur redevance. Charges de soutien public au moins 9%."
 bfl_money_redeem: "Échanger des billets d'État"
 bfl_money_redeem_tip: "Racheter tous les billets détenus par le contrôleur souverain pour leur valeur nominale. La perte d'autorité, de recherche ou de succursales n'annule pas les réclamations existantes. Une créance impayée reste due."
 bfl_money_repay: "Rembourser la facilité garantie"
 bfl_money_repay_tip: "Remboursez l'avance garantie en cours plus ses frais fixes acceptés pour libérer le gage de facture de la troisième banque. Nécessite suffisamment d’or disponible."
 bfl_money_revoke: "Révoquer l'autorité"
 bfl_money_revoke_tip: "Retirer l’autorisation souveraine pour les nouveaux billets. Les billets existants restent remboursables."
 bfl_money_settings: "Politique"
 bfl_money_settings_tip: "Afficher ou masquer la politique monétaire, l'autorité de note, le crédit garanti et les contrôles de compensation."
 bfl_money_settings_tip_tip: "Les billets échangent des espèces contre une créance entièrement réservée. L'acceptation est volontaire. Avance des réductions 75 de l'or contre un 100-Billet d'or d'une troisième banque. Clearing ne règle les factures échues correspondantes que lorsque chaque membre peut payer son débit net. Les revendications existantes survivent à la perte d'autorité et de bâtiments."
 bfl_money_subtitle: "Créances rachetables · règlement financé"
 bfl_money_subtitle_tip: "Les billets échangent des espèces contre une créance entièrement réservée. L'acceptation est volontaire. Avance des réductions 75 de l'or contre un 100-Billet d'or d'une troisième banque. Clearing ne règle les factures échues correspondantes que lorsque chaque membre peut payer son débit net. Les revendications existantes survivent à la perte d'autorité et de bâtiments."
 bfl_money_terms: "Le principal et l'émission sont exclus du revenu. Les tarifs de remise sont annuels et fixes lorsqu'ils sont acceptés. La confiance tombe à 25 en cas de déficit de réserve ; les billets entièrement garantis n’ajoutent aucune inflation. Les paiements vanille continuent d’utiliser l’or natif."
 bfl_money_terms_tip: "Les billets échangent des espèces contre une créance entièrement réservée. L'acceptation est volontaire. Avance des réductions 75 de l'or contre un 100-Billet d'or d'une troisième banque. Clearing ne règle les factures échues correspondantes que lorsque chaque membre peut payer son débit net. Les revendications existantes survivent à la perte d'autorité et de bâtiments."
 bfl_money_title: "Argent et règlement"
 bfl_money_title_tip: "Le principal et l'émission sont exclus du revenu. Les tarifs de remise sont annuels et fixes lorsqu'ils sont acceptés. La confiance tombe à 25 en cas de déficit de réserve ; les billets entièrement garantis n’ajoutent aucune inflation. Les paiements vanille continuent d’utiliser l’or natif."
 bfl_mortzenhaus: "Maison Mortzen"
 bfl_mortzenhaus_desc: "Depuis le Mortzenhaus, les marchands dirigent les navires, les lettres et les crédits vers les ports du nord. Ses salles de comptage allègent les tâches administratives, tandis que le réseau de l’entreprise attire le commerce vers Hambourg."
 bfl_mortzenhaus_maintenance: "Administration de la Maison Mortzen"
 bfl_native_credit_label: "Portefeuille de prêts"
 bfl_native_credit_label_tip: "Prêts détenus par la banque à la valeur d'acquisition constatée. Les lignes indiquent le principal, les intérêts annuels et les mois restants lors de la dernière révision."
 bfl_native_tab: "Prêts de l'État"
 bfl_native_takeover: "Prise de contrôle native"
 bfl_native_takeover_result_tt: "Notre banque achète un prêt immobilier éligible au prix indiqué en vigueur. Les successions reçoivent le paiement, le même prêt passe à la banque et l'emprunteur ne reçoit aucun nouveau capital. La banque doit disposer d’une succursale opérationnelle dans le capital de l’emprunteur et de suffisamment de liquidités et de capital non engagés."
 bfl_new_capital_subscription: "Souscrire un nouveau capital"
 bfl_new_capital_subscription_desc: "Investir 100@gold! des fonds de votre banque en [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_issuer').GetCountry.GetName] en actions nouvellement émises à sa valeur liquidative tangible. L'émetteur reçoit le paiement et les détenteurs existants sont dilués. Il s'agit d'une souscription au capital, distincte de l'achat d'actions. L'exécution revérifie la valeur liquidative capturée, les unités émises, la recherche, les fonds protégés et la limite de concentration. Cela consomme un diplomate et démarre le temps de recharge d’un mois pour les échanges de cet émetteur."
 bfl_new_capital_subscription_tip: "Financement primaire : investir 100 l'or de la banque gérée. L'émetteur reçoit des liquidités et émet de nouvelles actions. Ceci est distinct de la négociation d’actions existantes."
 bfl_no_automatic_tribute: "Pas d'hommage automatique à la charte"
 bfl_no_automatic_tribute_cost_modifier: "Coût du tribut automatique en charter"
 bfl_no_bank: "Affrétez une banque d'État existante par le biais de décisions, ou incarnez un pays bancaire indépendant. Votre pays doit posséder son marché des capitaux pour créer une banque."
 bfl_no_bank_holdings: "Aucune action détenue par la banque."
 bfl_no_bank_short: "Aucune banque à charte"
 bfl_no_deposit_accounts: "Aucun dépôt"
 bfl_nobles_estate_workout_mandate: "Mandat de redressement successoral"
 bfl_nobles_estate_workout_mandate_desc: "Cette succession autorise explicitement son gouvernement à examiner en son nom les mesures volontaires de restructuration des dépôts bancaires. Chaque proposition doit encore être acceptée séparément. La révocation de ce privilège invalide les conditions successorales en cours. Les paiements de recouvrement continuent d’être versés au portefeuille de la succession."
 bfl_offer_bank_shares: "Proposer de nouvelles actions bancaires"
 bfl_offer_bank_shares_tip: "Autoriser d'autres banques et pays à s'abonner 100 de l'or à la valeur liquidative actuelle de la banque. Les actions nouvelles ne sont émises qu'au moment du paiement ; les propriétaires existants sont dilués. La recherche sur les banques natives et les capitaux propres positifs restent nécessaires."
 bfl_offer_bond: "Proposer une obligation souveraine détenue par une banque"
 bfl_offer_bond_tip: "Répertoriez l'obligation la plus ancienne détenue par la banque depuis trois mois à 98% de valeur nominale. La vente et l’achat nécessitent tous deux un bâtiment de bourse achevé en propriété. L'acceptation revérifie le vendeur, le détenteur actuel, la génération, les fonds et l'expiration. Les arriérés bloquent les échanges."
 bfl_offer_bond_workout_01: "Restructuration de l'offre"
 bfl_offer_bond_workout_01_tip: "Demander à ce titulaire actuel d'accepter un 20% réduction du principal et des coupons impayés, et une réduction annuelle des coupons d'un point de pourcentage, avec une 1% sol. Aucun argent ne bouge sauf si le détenteur l’accepte séparément. Le devis expire ce mois-ci et les modifications apportées à la réclamation l'invalident."
 bfl_offer_bond_workout_02: "Restructuration de l'offre"
 bfl_offer_bond_workout_02_tip: "Demander à ce titulaire actuel d'accepter un 20% réduction du principal et des coupons impayés, et une réduction annuelle des coupons d'un point de pourcentage, avec une 1% sol. Aucun argent ne bouge sauf si le détenteur l’accepte séparément. Le devis expire ce mois-ci et les modifications apportées à la réclamation l'invalident."
