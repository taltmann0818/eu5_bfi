 AM_bfl_chartered_bank: "Banque à charte"
 LEAD_bfl_chartered_bank: "Contrôleur de banque agréé"
 MODIFIER_TYPE_DESC_bfl_bank_headquarters_cost_reduction: "Un siège social terminé aide la banque ou la banque à charte souveraine avec cette réduction de l’administration récurrente. Le soutien du siège est plafonné à 15% et ne nécessite pas de capital souverain."
 MODIFIER_TYPE_DESC_bfl_bank_loan_yield_bonus: "Ajoute des points de pourcentage aux taux d'intérêt offerts sur les nouveaux prêts bancaires, dans les limites normales 20% plafond. L’accès aux biens autochtones augmente la contribution du bâtiment. Les prêts existants conservent leurs taux acceptés."
 MODIFIER_TYPE_DESC_bfl_bank_operating_expenses_modifier: "Modifie les dépenses administratives récurrentes de la banque après réductions opérationnelles ordinaires. Les valeurs positives augmentent les dépenses ; les valeurs négatives les réduisent. Cela change l'administration, et non les intérêts sur les dépôts, l'entretien des bâtiments locaux ou les contrats de crédit existants."
 MODIFIER_TYPE_DESC_bfl_bank_palace_cost_reduction: "Réduit l’administration récurrente de la banque propriétaire. L’accès aux biens autochtones augmente la contribution du bâtiment. Les intérêts de dépôt, l'entretien du bâtiment natif et les contrats existants sont calculés séparément."
 MODIFIER_TYPE_DESC_bfl_bank_share_price_bonus: "Augmente la cotation secondaire des actions de la banque propriétaire de ce pourcentage. L’accès aux biens autochtones augmente la contribution du bâtiment. La valeur liquidative, la trésorerie propre et les parts de propriété sont inchangées."
 MODIFIER_TYPE_DESC_bfl_base_share_value_modifier: "Augmente la cotation secondaire des actions de la banque par rapport à sa valorisation ordinaire. Il ne crée pas de trésorerie, ne modifie pas la valeur liquidative, n'émet pas de nouvelles actions et ne modifie pas les parts de propriété."
 MODIFIER_TYPE_DESC_bfl_commenda_expertise: "Un réseau de confiance rend les pays plus disposés à accepter des offres de commenda rentables et augmente de ce pourcentage la part négociée de la banque dans l’excédent de risque réalisé. Un 10% le bonus change un 75% partager avec 82.5%, ou un 50% partager avec 55%. Aucun profit n’est créé : tous les paiements proviennent des revenus réels de l’activité désignée. Les accords acceptés conservent leurs termes d’origine."
 MODIFIER_TYPE_DESC_bfl_copper_market_demand: "Le Fuggerhauser achevé ajoute une demande de cuivre nommée et non cumulable sur son propre marché. L'offre et la demande indigènes déterminent le prix qui en résulte. Les contrats de marchandises conservent leurs conditions convenues."
 MODIFIER_TYPE_DESC_bfl_enable_advanced_clearing: "Débloque le règlement net des obligations réciproques vérifiées entre les institutions participantes. La compensation doit préserver les droits de chaque détenteur et régler le solde net financé sans créer de monnaie. Le règlement interbancaire natif reste indisponible."
 MODIFIER_TYPE_DESC_bfl_enable_bank_capital_subscriptions: "Permet les abonnements principaux de 100 de l'or dans une banque. Les nouvelles unités de propriété sont évaluées à la valeur liquidative actuelle. Le produit de la souscription augmente le capital libéré plutôt que le bénéfice réalisé et achète une créance proportionnelle sur les distributions ultérieures."
 MODIFIER_TYPE_DESC_bfl_enable_bank_share_dealing: "Permet au service de transfert d'actions bancaires de déplacer des parts nominatives existantes entre des détenteurs identifiés. Un transfert change de propriétaire sans émettre de nouvelles parts ni créer de profit bancaire. Le registre doit avoir la capacité et préserver les droits de chaque titulaire."
 MODIFIER_TYPE_DESC_bfl_enable_collateralization: "Débloque les promesses de garantie enregistrées et leurs contrôles d'éligibilité. Les biens grevés ne peuvent pas garantir une seconde créance, et le recouvrement doit préserver la relation de dette initiale. L’exécution des garanties natives reste indisponible."
 MODIFIER_TYPE_DESC_bfl_enable_commenda: "Débloque les partenariats Commenda acceptés après les instruments financiers de base à l'ère de la découverte. Les banques d’investissement à l’étranger peuvent financer une opération ou une expédition de fret identifiée. Les coûts indigènes, la garde et le produit de la vente mesuré déterminent les rendements ; le capital reste en danger."
 MODIFIER_TYPE_DESC_bfl_enable_commercial_bills: "Permet de payer des factures entièrement financées. L'acheteur paie 100 l'or avant émission ; la banque enregistre une somme égale à payer et un engagement en espèces. Le titulaire désigné peut racheter l'effet au bout d'un mois, une seule fois. L'émission n'est pas un profit."
 MODIFIER_TYPE_DESC_bfl_enable_commodity_forwards: "Débloque les contrats de livraison à terme Merchant Finance. Chaque accord doit enregistrer sa contrepartie, ses marchandises, sa quantité, sa date de livraison et son support sans réutiliser les stocks grevés. L'exécution du trading natif reste indisponible."
 MODIFIER_TYPE_DESC_bfl_enable_commodity_investments: "Débloque le mandat d'inventaire Merchant Finance. Les positions en matières premières doivent représenter les avoirs de biens locaux financés et préserver le coût d'acquisition, la quantité et la garde. L'exécution des transactions reste indisponible dans cette version de développement."
 MODIFIER_TYPE_DESC_bfl_enable_company_equity: "Débloque le mandat de participation aux actions de la société Overseas Investment. Les parts financières sont enregistrées séparément du contrôle des sujets politiques. Seules les distributions vérifiées des sociétés peuvent devenir des revenus bancaires ; les souscriptions et le remboursement du capital sont exclus. L'exécution native reste indisponible."
 MODIFIER_TYPE_DESC_bfl_enable_corporate_credit: "Débloque le mandat de crédit d'entreprise Merchant Finance. Les prêts doivent transférer des liquidités bancaires à une entreprise identifiée et créer une créance recouvrable égale ; les remboursements du principal ne sont pas comptabilisés dans les bénéfices. L'exécution native reste indisponible."
 MODIFIER_TYPE_DESC_bfl_enable_debt_restructuring: "Débloque le mandat de restructuration souveraine. L'échéance révisée, les intérêts et le principal doivent s'attacher à la créance existante, avec l'accord du débiteur. L’exécution reste indisponible jusqu’à ce que le rapprochement de la dette nationale soit pris en charge."
 MODIFIER_TYPE_DESC_bfl_enable_liquidity_facilities: "Débloque des liquidités temporaires sécurisées. Le financement doit provenir d'une contrepartie réelle, rester dans les limites de trésorerie et de capital et comporter des garanties enregistrées. Les retraits en file d'attente conservent la priorité. L’exécution de l’installation native reste indisponible."
 MODIFIER_TYPE_DESC_bfl_enable_margining_and_risk_management: "Débloque les exigences de marge pour les positions à terme de Merchant Finance. L'exposition doit être mesurée par rapport aux garanties et aux liquidités disponibles, un financement supplémentaire étant requis avant que les engagements n'augmentent. Le trading natif et l’exécution sur marge restent indisponibles."
 MODIFIER_TYPE_DESC_bfl_enable_project_security: "Débloque la sécurité pour les projets d’investissement à l’étranger. Les actifs et les produits identifiés du projet doivent être nantis sur une seule obligation enregistrée, la priorité étant préservée par le biais du règlement ou du recouvrement. L'exécution de projet natif reste indisponible."
 MODIFIER_TYPE_DESC_bfl_enable_public_financial_backstops: "Débloque le mandat de filet de sécurité public pour une banque à charte autorisée. L'assistance nécessite un apport réel du trésor et des créances ou unités de propriété enregistrées ; les garanties ne peuvent pas frapper de liquidités ni effacer les pertes. L’exécution du filet de sécurité permanent n’est pas encore mise en œuvre."
 MODIFIER_TYPE_DESC_bfl_enable_sovereign_banknotes: "Débloque l'émission de billets souverains pour une banque à charte agréée. Les billets sont des passifs remboursables ; le soutien exclut les liquidités collectées en vendant les billets eux-mêmes. L'émission native et l'acheminement des paiements par le titulaire restent indisponibles."
 MODIFIER_TYPE_DESC_bfl_enable_term_deposits: "Permet des dépôts à taux fixe de 100 de l'or avec une échéance de douze mois. Les intérêts courent mensuellement au taux accepté à l’ouverture du compte ; le principal immature ne peut pas être retiré. Les dépôts restent le passif de la banque."
 MODIFIER_TYPE_DESC_bfl_enable_warehouse_receipts: "Débloque les reçus Merchant Finance appuyés par des lots d'inventaire identifiés. Chaque récépissé réserve dix unités non grevées et facture des frais de garde financés. La garde des marchandises indigènes doit être prise en charge avant que de nouveaux reçus puissent être délivrés."
 MODIFIER_TYPE_DESC_bfl_fine_cloth_market_demand: "Le Palazzo Peruzzi, achevé, ajoute une demande nommée et non cumulable de tissus fins sur son propre marché. L'offre et la demande indigènes déterminent le prix qui en résulte. Les contrats de marchandises conservent leurs conditions convenues."
 MODIFIER_TYPE_DESC_bfl_global_bank_access: "La banque peut desservir un pays sans succursale bancaire dans sa capitale. Les exigences en matière de recherche, de spécialisation, de diplomatie, de consentement, de liquidité et de capital s'appliquent toujours."
 MODIFIER_TYPE_DESC_bfl_loan_profitability_modifier: "Multiplie les taux d’intérêt indiqués sur les prêts nouvellement proposés. Un 5% le bonus change un 10% citation à 10.5%, sous réserve des règles normales 20% plafond. L'emprunteur doit accepter l'offre ; les prêts existants conservent leurs taux convenus."
 MODIFIER_TYPE_DESC_bfl_no_automatic_tribute_cost_modifier: "La relation de charte n'a pas d'hommage automatique. Les revenus de l’État proviennent des intérêts sur les dépôts et des dividendes sur les actions bancaires détenues."
