 bfl_finance.100.desc: "Choisissez une spécialisation permanente. Tous deux servent le crédit souverain et les dépôts. Merchant Finance développe des instruments de crédit sur matières premières et aux entreprises ; Overseas Investment développe la commenda et les capitaux propres de l'entreprise. La recherche et les limites d’âge continuent de s’appliquer."
