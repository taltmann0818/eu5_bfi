 bfl_share_state_tip: "#T [Country.MakeScope.GetVariable('bfl_state_owner').GetCountry.GetName]#!\nActions détenues : [Country.MakeScope.GetVariable('bfl_state_units').GetValue|2] / [Country.MakeScope.GetVariable('bfl_total_units').GetValue|2]\nPropriété : [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_state_share_fraction')|%2]\nDernier dividende mensuel : [Country.MakeScope.GetVariable('bfl_state_dividend_paid').GetValue|2]@gold!"
