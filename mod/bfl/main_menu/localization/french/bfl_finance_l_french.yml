 bfl_accept_money_claims.desc: "Acceptez ou arrêtez volontairement d'accepter des factures et des billets entièrement financés proposés au pair via les interactions de mod. Un transfert nécessite toujours votre trésorerie disponible. Les réclamations acceptées restent remboursables après la clôture de l'acceptation. Les paiements autochtones continuent d'utiliser l'or."
 bfl_accept_money_claims.title: "Toggle l'acceptation des demandes de paiement bancaire"
 bfl_accounts_explanation: "Le trésor autochtone est de l'argent liquide. Les dépôts et les billets sont des passifs. Le prêt échange de l’argent contre un actif ; le capital, les souscriptions et les émissions ne constituent pas un profit."
 bfl_activity_title: "Résultat net"
 bfl_activity_title_tip: "Les observations de coupons natifs classent le budget net natif ; ils ne déplacent jamais l’or deux fois. Le produit du paiement natif réglé libère le coût d’acquisition réel avant de comptabiliser un gain ou une perte. Les distributions de l'entreprise et les reçus financés sur mesure entrent dans leurs propres catégories. Le capital, les dépôts et les souscriptions sont exclus des bénéfices."
 bfl_administer_estates: "Administrer les patrimoines financiers hérités"
 bfl_administer_estates.desc: "Examiner les liquidités et les obligations détenues séparément d'une institution détruite. L’autorité fiduciaire n’intègre jamais son argent au trésor national."
 bfl_administer_estates.title: "Administrer les patrimoines financiers hérités"
 bfl_administer_estates_desc: "Examiner les liquidités et les obligations détenues séparément d'une institution détruite. L’autorité fiduciaire n’intègre jamais son argent au trésor national."
 bfl_advanced_clearing: "Compensation avancée"
 bfl_advanced_clearing_desc: "Les établissements bancaires qui se doivent de nombreux paiements ne sont pas obligés de régler chaque obligation séparément en espèces. Les comptes de compensation rapprochent leurs créances et transfèrent uniquement le solde restant, réduisant ainsi l'argent nécessaire au maintien du commerce."
 bfl_advanced_tip: "La recherche libère le mandat. La banque doit également répondre à ses exigences de spécialisation, de liquidité et de fonctionnement. L'exécution indisponible reste désactivée."
 bfl_ai_equity_offering: "Admettre la banque et ouvrir l’offre de capital versé"
 bfl_ai_equity_offering_desc: "La direction d'AI peut admettre sa banque réelle et autoriser les souscriptions primaires payantes après la négociation d'actions et un échange terminé. Aucune trésorerie ni action n'est créée par admission."
 bfl_ai_equity_purchase: "Envisagez un investissement en échange financé"
 bfl_ai_equity_purchase_desc: "L'achat par l'IA utilise les mêmes vérifications en direct de recherche, de bâtiment, d'autorité, de capacité et de confirmation de devis exact que le joueur. Revue mensuelle des opportunités, avec au moins 500 or de liquidités et excédents de capital. Aucune demande supérieure au marché."
 bfl_ai_exchange_priority: "Prioriser l’accès à la bourse"
 bfl_annual_dividends: "Taux de dividende annuel"
