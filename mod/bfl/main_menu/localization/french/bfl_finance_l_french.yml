 bfl_estate_review_default: "Conclure une liquidation épuisée et enregistrer les pertes des créanciers"
 bfl_estate_review_desc: "Domaine : [ROOT.GetCountry.MakeScope.GetVariable('bfl_managed_estate').GetCountry.GetName]. Situation financière [ROOT.GetCountry.MakeScope.GetVariable('bfl_estate_state_display').GetValue|0] (4 résoudre, 5 fermé). Espèces séparées : [ROOT.GetCountry.MakeScope.GetVariable('bfl_estate_cash_display').GetValue|2] l'or. Cautions encore dues : [ROOT.GetCountry.MakeScope.GetVariable('bfl_estate_deposits_display').GetValue|2]. Indemnisation du séquestre restant due : [ROOT.GetCountry.MakeScope.GetVariable('bfl_estate_receiver_display').GetValue|2]. Récupérations d'acomptes versées : [ROOT.GetCountry.MakeScope.GetVariable('bfl_estate_recovered_display').GetValue|2]. Le service utilise le produit réel de la vente et les remboursements. Les sinistres indisponibles restent enregistrés ; la clôture nécessite que chaque obligation et position non monétaire soit compensée."
