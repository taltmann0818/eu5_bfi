 bfl_venture_preset_0: "Unilatéral · 75% excédent bancaire"
 bfl_venture_preset_1: "Bilatéral · excédent égal"
 bfl_venture_preset_tip: "Unilatéral : la banque finance tout le capital et reçoit 75% de surplus. Bilatéral : la banque finance deux tiers, l'opérateur un tiers, l'excédent est réparti à parts égales. Les pertes suivent les apports en capital."
 bfl_venture_settings_tip: "Développez les termes proposés. Les modifications affectent uniquement les offres futures ; les projets acceptés conservent leur accord initial."
 bfl_venture_state_1: "Actif · capital à risque"
 bfl_venture_state_2: "Fermé · capital récupéré"
 bfl_venture_state_3: "Clôturé · perte reconnue"
 bfl_venture_state_4: "Non financé · exécution indisponible"
 bfl_venture_subtitle: "Activités nommées · coûts et ventes mesurés"
 bfl_venture_ticket_100: "Limite de financement · 100 or"
 bfl_venture_ticket_200: "Limite de financement · 200 or"
 bfl_venture_ticket_400: "Limite de financement · 400 or"
 bfl_venture_ticket_tip: "Cycle une autorisation bancaire maximale de 100, 200 ou 400 l'or. Seul le coût réel de l’activité est tiré. Le financement du fret inutilisé est immédiatement débloqué ; le financement de l'expédition inutilisé reste réservé à une cargaison éligible en zone découverte jusqu'à son échéance. Les conditions bilatérales exigent une capacité correspondant à la moitié de l'autorisation bancaire de l'opérateur."
 bfl_venture_title: "Entreprises Commenda"
 bfl_ventures: "Entreprises et sociétés · Investissement à l'étranger"
 bfl_ventures_explanation: "Commenda commence dans Discovery ; les entreprises indigènes et les capitaux propres des entreprises nécessitent une réforme. Le contrôle politique et la propriété financière restent séparés. Le capital projet n’est pas un dividende."
 bfl_ventures_tip: "#T Entreprises et sociétés#!\nAutorisations pour les entreprises financées, les investissements d'entreprises, la sécurité des projets et les transferts d'actions bancaires. Ceux-ci exposent le capital au risque d’investissement et nécessitent des recherches et une spécialisation appropriées."
 bfl_view_companies: "Entreprises"
 bfl_view_goods: "Marchandises"
 bfl_view_loans: "Prêts"
 bfl_view_monetary: "Services monétaires"
 bfl_view_monetary_tip: "Billets de banque, liquidité sécurisée et compensation."
 bfl_view_shares: "Actions"
 bfl_view_trade: "Financement du commerce"
 bfl_warehouse_receipt: "Récépissé d'entrepôt"
 bfl_warehouse_receipt_tip: "#T Récépissé d'entrepôt#!\nÉmettre une réclamation contre des marchandises stockées identifiables. Nécessite une recherche sur les récépissés d'entrepôt, la finance marchande et l'âge de l'absolutisme ou une version ultérieure. Le stockage vérifié et l’exécution des marchandises ne sont pas disponibles dans cette version."
 bfl_warehouse_receipts: "Récépissés d'entrepôt"
 bfl_warehouse_receipts_desc: "Les marchandises conservées dans un entrepôt réputé peuvent soutenir le commerce sans être déplacées à chaque vente. Un récépissé établit un droit sur la marchandise stockée, permettant à son propriétaire d'obtenir un financement pendant que la marchandise reste en garde."
 bfl_welserhaus: "Maison Welser"
 bfl_welserhaus_desc: "De cette maison d'Augsbourg, les facteurs envoient leurs instructions le long des routes et des voies maritimes du commerce. Son crédit établi réduit les intérêts d’emprunt du propriétaire d’un demi-point de pourcentage, tandis que son réseau augmente la capacité marchande et les revenus commerciaux de dix pour cent."
 bfl_welserhaus_maintenance: "Administration du Welserhaus"
 bfl_wisselbank_founding_tt: "Établir Wisselbank comme notre banque à charte, financée par la trésorerie disponible dans la limite de la dotation habituelle."
 bfl_wisselbank_name: "Wisselbank"
 bfl_withdraw: "Retirer les dépôts d'État échus"
 bfl_withdraw_tip: "#T Retirer les dépôts d'État échus#!\nDemandez le remboursement des comptes à vue et des comptes à terme de votre État. La banque paie le principal et les intérêts crédités à partir des liquidités disponibles. Les montants impayés restent enregistrés dans la file d’attente des retraits et suspendent les nouvelles affaires. Les comptes étrangers et les dépôts à terme non échus ne peuvent pas être retirés par cette action."
 bfl_workout_decline: "Conserver la réclamation complète"
 bfl_workout_desc: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_workout_bank').GetCountry.GetName] vous propose des modalités pour votre dépôt de [ROOT.GetCountry.MakeScope.GetVariable('bfl_workout_claim').GetValue|2] l'or. Vous pouvez renoncer 20% de la créance restante, convertissez la totalité de la créance en actions nouvellement émises à la valeur liquidative tangible avant la conversion, ou conservez votre créance. La conversion nécessite une valeur liquidative et une capacité actionnariale positives et n'est pas accessible aux créanciers bancaires. Pool de créanciers [ROOT.GetCountry.MakeScope.GetVariable('bfl_workout_pool').GetValue|0]: 0 trésor, 1 les bourgeois, 2 nobles, 3 le clergé, 4 paysans. Les conditions de la succession nécessitent le mandat d'exercice adopté par cette succession. Le devis expire ce mois-ci ; une reprise ou un changement de direction l’invalide."
 bfl_workout_equity: "Convertir la créance en actions (VNI positive requise)"
