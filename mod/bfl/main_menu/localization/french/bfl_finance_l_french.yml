 bfl_florentine_choice_cash_tt: "Recevoir 250 ducats. Les banques conservent leur propriété, leurs chartes, leurs immeubles et leurs comptes."
 bfl_florentine_choice_desc: "Sous l’ombre de la Signoria, les grandes maisons bancaires sont devenues des puissances à part entière. Leurs commis pèsent les promesses des rois à côté des factures des marchands de draps, et le crédit de Florence voyage partout où leurs facteurs tiennent un bureau. La ville doit maintenant décider si elle doit lier plus étroitement l’une de ces maisons au trésor public. Une charte mettrait son expérience à notre service, tandis qu'un nouveau palais proclamerait le marché dans la pierre. Pourtant, certains conseillers préfèrent aujourd’hui apporter leur contribution et laisser les banquiers se débrouiller seuls."
