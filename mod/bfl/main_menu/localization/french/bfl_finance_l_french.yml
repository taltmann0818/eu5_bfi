 bfl_exchange.1.desc: "Acheter [ROOT.GetCountry.MakeScope.GetVariable('bfl_order_units').GetValue|3] unités existantes de [ROOT.GetCountry.MakeScope.GetVariable('bfl_order_issuer').GetCountry.GetName] de [ROOT.GetCountry.MakeScope.GetVariable('bfl_order_seller').GetCountry.GetName] pour [ROOT.GetCountry.MakeScope.GetVariable('bfl_order_price').GetValue|2]@gold!. Le vendeur reçoit le paiement. L'émetteur ne reçoit aucun nouveau financement. L'exécution revérifie à la fois les échanges, la recherche, l'autorité en direct, les unités, le capital, les liquidités et la révision de cette cotation."
