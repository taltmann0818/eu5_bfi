 bfl_feedback_7: "#O Nouvel avertissement de liquidité#!"
 bfl_feedback_8: "Résolution clôturée · les pertes enregistrées restent visibles"
 bfl_feedback_9: "#O L'objectif de l'installation n'a pas été financé#!"
 bfl_feedback_note: "Dernière transaction validée · le montant est déjà comptabilisé. L'ouverture de cette vue ne rejoue pas les effets passés. Le mouvement réduit conserve le même reçu et les mêmes avertissements. La découverte seule ne produit aucun indicateur de paiement."
