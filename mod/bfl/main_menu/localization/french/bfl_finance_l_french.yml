 bfl_venture_accept: "Acceptez le partenariat"
 bfl_venture_accept_tip: "Revérifiez l'autorité de l'investisseur en direct, les conditions de l'offre inchangées, l'âge, la recherche, les liquidités disponibles, le capital, la capacité et la contribution de l'opérateur. Le financement ne paie que le coût natif réel de l’activité sélectionnée. Il n'accorde aucune part de la société ni aucun contrôle politique."
 bfl_venture_decline: "Refuser"
 bfl_venture_duration_12: "Durée · 12 mois"
 bfl_venture_duration_120: "Durée · 120 mois"
 bfl_venture_duration_24: "Durée · 24 mois"
 bfl_venture_duration_6: "Durée · 6 mois"
 bfl_venture_duration_60: "Durée · 60 mois"
 bfl_venture_duration_tip: "Cycle 6, 12, 24, 60 ou 120 mois. Les longs termes conviennent à l’exploration autochtone. Le cargo se vend au bout de deux mois si l'accès natif reste valable ; la cargaison bloquée reste en garde à vue. Les frais d'expédition sans produit de vente lié sont amortis à l'échéance."
 bfl_venture_empty: "Aucune entreprise active. Sélectionnez une opération de fret ou une expédition locale avant de proposer des conditions."
 bfl_venture_help: "Cliquez sur un terme pour faire un cycle. Chaque opérateur accepte séparément. Les accords existants se poursuivent après un changement de politique ou de recherche."
 bfl_venture_hint: "Survolez l'activité, les coûts, le fret et les retours"
 bfl_venture_locked: "Nouvelles entreprises verrouillées · survolez les exigences"
 bfl_venture_note: "Le capital est récupéré avant le profit. Les pertes suivent les cotisations. Seule la cargaison acquise par l’opération désignée peut financer ses recettes. Le commerce indépendant ne paie jamais cet accord. La découverte à elle seule ne rapporte rien. Les lignes fermées restent jusqu'à ce qu'elles soient remplacées par un accord nouvellement accepté."
 bfl_venture_offer_desc: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_bank').GetCountry.GetName] offres [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_ticket').GetValue|0] de l'or pour [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_duration').GetValue|0] mois. Préréglage [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_preset').GetValue|0]: 0 = l'investisseur finance tout le capital, reçoit 75% de surplus; 1 = l'investisseur contribue à hauteur de deux tiers, l'opérateur un tiers, le surplus étant réparti à parts égales. Le capital est récupéré en premier ; les pertes suivent les cotisations. Seul le produit réel de la vente de l’opération désignée peut générer des bénéfices. Le succès de l’exploration offre une opportunité, jamais de l’or. Cette offre expire dans trois mois."
 bfl_venture_offer_desc_0: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_bank').GetCountry.GetName] autorise jusqu'à [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_ticket').GetValue|0] l'or du financement bancaire pour [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_duration').GetValue|0] mois. Acheter 10 [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_good').Goods.GetNameWithNoTooltip] dans [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_from').GetMarket.GetName], portez-les pendant deux mois, puis revendez-les [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_to').GetMarket.GetName]. La banque finance tous les frais et reçoit [GuiScope.SetRoot(ROOT.GetCountry.MakeScope).ScriptValue('bfl_venture_offered_profit_fraction')|%1] de surplus. Vous gardez le reste.\n\nSeuls les coûts natifs réels sont calculés. Les fonds non utilisés restent à la banque. Le capital est récupéré avant l'excédent ; les pertes suivent les cotisations. Seul le produit de la vente mesuré de cette cargaison règle cet accord. Les revenus et la découverte non liés ne paient rien. L'offre expire dans trois mois."
 bfl_venture_offer_desc_1: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_bank').GetCountry.GetName] autorise jusqu'à [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_ticket').GetValue|0] l'or du financement bancaire pour [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_duration').GetValue|0] mois. Acheter 10 [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_good').Goods.GetNameWithNoTooltip] dans [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_from').GetMarket.GetName], portez-les pendant deux mois, puis revendez-les [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_to').GetMarket.GetName]. La banque finance les deux tiers des coûts ; vous payez un tiers. La banque reçoit [GuiScope.SetRoot(ROOT.GetCountry.MakeScope).ScriptValue('bfl_venture_offered_profit_fraction')|%1] du surplus et vous gardez le reste.\n\nSeuls les coûts natifs réels sont calculés. Les fonds non utilisés restent à la banque. Le capital est récupéré avant l'excédent ; les pertes suivent les cotisations. Seul le produit de la vente mesuré de cette cargaison règle cet accord. Les revenus et la découverte non liés ne paient rien. L'offre expire dans trois mois."
 bfl_venture_offer_desc_2: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_bank').GetCountry.GetName] autorise jusqu'à [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_ticket').GetValue|0] l'or du financement bancaire pour [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_duration').GetValue|0] mois. Préparer l'exploration native de [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_area').GetArea.GetName] de [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_port').GetLocation.GetName] avec [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_explorer').GetCharacter.GetName]. La banque finance tous les coûts en or convenus et reçoit [GuiScope.SetRoot(ROOT.GetCountry.MakeScope).ScriptValue('bfl_venture_offered_profit_fraction')|%1] d’excédent contractuel. Vous gardez le reste. La préparation n'est pas remboursable, y compris l'annulation. Vous fournissez l’équipage, l’entretien natif et les dépenses facultatives d’expédition en dehors de cet accord de financement. L'autorisation bancaire restante peut financer une cargaison de dix unités provenant d'un marché centré ou bordant la zone découverte, sous réserve d'un accès autochtone. Seules les ventes mesurées de cette cargaison, moins les coûts de préparation et de fret enregistrés, peuvent payer l’excédent contractuel. La découverte et le commerce indépendant ne paient rien. L'offre expire dans trois mois. "
 bfl_venture_offer_desc_3: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_bank').GetCountry.GetName] autorise jusqu'à [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_ticket').GetValue|0] l'or du financement bancaire pour [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_duration').GetValue|0] mois. Préparer l'exploration native de [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_area').GetArea.GetName] de [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_port').GetLocation.GetName] avec [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_explorer').GetCharacter.GetName]. La banque finance les deux tiers des coûts convenus en or ; vous payez un tiers. La banque reçoit [GuiScope.SetRoot(ROOT.GetCountry.MakeScope).ScriptValue('bfl_venture_offered_profit_fraction')|%1] du surplus contractuel et vous conservez le reliquat. La préparation n'est pas remboursable, y compris l'annulation. Vous fournissez l’équipage, l’entretien natif et les dépenses facultatives d’expédition en dehors de cet accord de financement. L'autorisation bancaire restante peut financer une cargaison de dix unités provenant d'un marché centré ou bordant la zone découverte, sous réserve d'un accès autochtone. Seules les ventes mesurées de cette cargaison, moins les coûts de préparation et de fret enregistrés, peuvent payer l’excédent contractuel. La découverte et le commerce indépendant ne paient rien. L'offre expire dans trois mois. "
