 bfl_equity_vote_payout_0: "Vote majoritaire : 0% distribution de dividendes"
 bfl_equity_vote_payout_0_tip: "Nécessite plus de la moitié des votes financiers émis. Bénéfices non répartis de l’entreprise et politique de paiement des banques indépendantes uniquement. La politique monétaire et de paiement agréée reste du ressort du contrôleur débarqué en direct. Pas de transfert de sujet politique."
 bfl_equity_vote_payout_25: "Vote majoritaire : 25% distribution de dividendes"
 bfl_equity_vote_payout_25_tip: "Nécessite plus de la moitié des votes financiers émis. Bénéfices non répartis de l’entreprise et politique de paiement des banques indépendantes uniquement. La politique monétaire et de paiement agréée reste du ressort du contrôleur débarqué en direct. Pas de transfert de sujet politique."
 bfl_equity_vote_payout_50: "Vote majoritaire : 50% distribution de dividendes"
 bfl_equity_vote_payout_50_tip: "Nécessite plus de la moitié des votes financiers émis. Bénéfices non répartis de l’entreprise et politique de paiement des banques indépendantes uniquement. La politique monétaire et de paiement agréée reste du ressort du contrôleur débarqué en direct. Pas de transfert de sujet politique."
 bfl_equity_vote_reserve_100: "Vote majoritaire : réserve 100, budget commercial 50"
 bfl_equity_vote_reserve_100_tip: "Les votes financiers majoritaires peuvent choisir la réserve de réinvestissement et le budget commercial de l'entreprise. Les mandats politiques, la suzeraineté autochtone, les liquidités et les créances existantes des créanciers restent distincts."
 bfl_equity_vote_reserve_200: "Vote majoritaire : réserve 200, budget commercial 25"
 bfl_equity_vote_reserve_200_tip: "Les votes financiers majoritaires peuvent choisir la réserve de réinvestissement et le budget commercial de l'entreprise. Les mandats politiques, la suzeraineté autochtone, les liquidités et les créances existantes des créanciers restent distincts."
 bfl_establish_chartered_bank.a: "Sélectionnez la banque d'État existante"
 bfl_establish_chartered_bank.desc: "Convertissez une banque d'État existante et acquérez des traditions bancaires une fois la charte terminée. L’investissement actuel de 500 / 750 / 1,000 / 1,500 / 2,000 / 3,000 l'or est transféré à son trésor en tant que capitaux propres de l'État. Vous devez posséder votre marché des capitaux. Sélectionnez une banque avant tout paiement ou recherche."
 bfl_establish_chartered_bank.title: "Créer une banque à charte d'État"
 bfl_estate_bond_back: "Retour à l'administration de la succession"
 bfl_estate_bond_desc: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_managed_estate').GetCountry.GetName] doit [ROOT.GetCountry.MakeScope.GetVariable('bfl_estate_bond_face').GetValue|2] directeur et [ROOT.GetCountry.MakeScope.GetVariable('bfl_estate_bond_due').GetValue|2] coupons impayés à [ROOT.GetCountry.MakeScope.GetVariable('bfl_estate_bond_holder').GetCountry.GetName]. Le recouvrement de liquidités partage la classe non garantie avec les dépôts. Une réduction volontaire nécessite une nouvelle proposition et l'acceptation explicite de ce titulaire ; les paiements ou un changement de fiduciaire invalident les termes en cours."
