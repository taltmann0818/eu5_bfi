 bfl_custom_bond_terms: "Coupons sur les nouvelles obligations"
 bfl_custom_bond_totals: "Exceptionnel : [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bfl_bond_debt')|2]@gold! · coupon mensuel : [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bfl_bond_monthly_coupon')|2]@gold! · impayé : [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bfl_bond_arrears')|2]@gold!"
 bfl_custom_bonds_title: "Obligations souveraines"
 bfl_custom_bonds_title_tip: "La banque prête de l’argent à l’État et reçoit une caution. Son propriétaire perçoit des intérêts et un remboursement mensuels. L'emprunt total est limité à 24 mois de revenu local, avec un 500-allocation de départ en or. Les intérêts des obligations peuvent utiliser au maximum 25% du revenu autochtone. Les intérêts impayés bloquent les nouvelles obligations et les ventes."
 bfl_cycle_bond_rate_tip: "Modifier les intérêts annuels des nouvelles obligations : 1%, 3% ou 6%. Les obligations existantes conservent leur taux."
 bfl_cycle_deposit_rate_tip: "Modifier les intérêts pour les nouveaux dépôts : 0%, 1% ou 2% un an. Les comptes existants conservent leur tarif."
 bfl_cycle_facility_tip: "Modifier le financement mensuel : Désactivé, Dépenses ou Tampon de trésorerie. Les dépenses financent une partie des dépenses de l’État. La réserve de trésorerie vient compléter les liquidités de l’État. Les deux partagent la limite mensuelle avec l’emprunt manuel."
 bfl_cycle_payout_tip: "Modifier les dividendes : conserver tous les bénéfices, payer 25%, ou payer 50%. Les paiements utilisent les bénéfices gagnés après coûts et pertes. Nécessite un contrôle de la politique de dividendes."
 bfl_cycle_share_offering_tip: "Ouvrez ou fermez de nouvelles souscriptions d'actions. Les souscriptions payantes ajoutent du capital et des actions nouvelles ; les propriétaires existants conservent leurs actions et leurs droits aux dividendes."
 bfl_dealer_inventory_class: "Inventaire des teneurs de marché · aucun vote"
 bfl_debt: "Portefeuille de dette autochtone"
 bfl_debt_explanation: "La banque à charte finance des obligations souveraines personnalisées. Les échanges sur le marché secondaire nécessitent des bourses de valeurs des deux côtés, y compris des subventions d'événements précoces. Le crédit natif utilise les offres acceptées et l'allègement de la dette recherché avec les dossiers de réclamations persistants."
 bfl_debt_facility: "Facilité de dette"
 bfl_debt_resale: "Revente de dettes"
 bfl_debt_resale_tip: "#T Revente d'obligations souveraines#!\nLa vente et l'achat d'obligations souveraines secondaires nécessitent une avance boursière et un bâtiment boursier détenu. Une offre ouverte transfère la même revendication personnalisée pour 98% de valeur nominale ; l'émetteur ne reçoit aucun nouveau produit. Les coupons et les échanges suivent l'acheteur."
 bfl_debt_restructuring: "Restructuration de la dette"
 bfl_debt_restructuring_desc: "Une dette qui ne peut être recouvrée au jour fixé ne doit pas nécessairement être sans valeur. Les créanciers peuvent préserver une plus grande part de leurs créances en acceptant de nouvelles conditions plutôt qu’en poussant un débiteur en difficulté à faire défaut."
 bfl_debt_tip: "#T Dette et crédit#!\nAutorisations de prêt, de souscription, de restructuration et de transfert de dettes. Chaque ligne a ses propres exigences en matière de recherche, de spécialisation, de liquidité et d'exécution. Un verrou signifie que la nouvelle origine n'est pas disponible ; il n'annule pas les réclamations existantes."
 bfl_demand_deposit: "Dépôt à vue"
 bfl_deposit_1: "Dépôt 100 or sur demande"
 bfl_deposit_1_tip: "#T Dépôt à vue#!\nTransfert 100 état de l'or à votre banque à charte. Son offre annuelle d'ouverture de compte est le tarif de base affiché majoré d'un 1% prime d'affrètement. Les intérêts à demande sont versés mensuellement à votre trésorerie une fois financés, avec portage en centimes ; les intérêts impayés restent dus. Les comptes existants conservent leur taux accepté. Le retrait rembourse le capital et les intérêts impayés. Les banques indépendantes acceptent les dépôts par voie diplomatique à +50 avis ou mieux et proposez le tarif de base."
 bfl_deposit_2: "Dépôt 100 de l'or pour 12 mois"
 bfl_deposit_2_tip: "#T Dépôt à terme#!\nTransfert 100 état de l'or à votre banque à charte pendant douze mois. Son offre annuelle d'ouverture de compte est le taux à terme affiché majoré d'un 1% prime d'affrètement. Les intérêts courent mensuellement et sont payés avec le capital à l’échéance. Nécessite des services bancaires natifs, l’âge autorisé et un emplacement de compte gratuit. Des comptes à terme indépendants sont disponibles par voie diplomatique à +50 avis ou mieux."
 bfl_deposit_accounts_heading: "Comptes de dépôt"
 bfl_deposit_amount: "Dépôt"
 bfl_deposit_amount_desc: "Choisissez le montant à déposer. Les dépôts à terme durent douze mois."
 bfl_deposit_amount_label: "Montant du dépôt"
 bfl_deposit_amount_tip: "Choisissez une banque et un montant. Déplacez les liquidités du Trésor sur un compte. Les intérêts et les retraits appartiennent au déposant. La banque vérifie à nouveau les fonds et les conditions lorsque vous confirmez."
 bfl_deposit_decline_tip: "Conservez la totalité de la demande de dépôt. Aucun mouvement de trésorerie et aucune action n'est émise."
 bfl_deposit_equity_tip: "Convertissez la créance cotée en actions réelles uniquement si la banque survivante a une valeur liquidative tangible et une capacité actionnariale positives. Aucun argent de souscription ni aucun gain n'est créé."
 bfl_deposit_explanation: "Chaque compte stocke son taux annuel fixe accepté. La modification du taux affecte les nouveaux comptes. Les comptes à terme arrivent à échéance après 12 mois. Les pénuries de retraits restent un passif et suspendent les nouveaux engagements."
 bfl_deposit_haircut_tip: "Acceptez le cité 20% réduction après revérification du créancier, de la créance restante, de la recherche et de l'autorité. Une garantie publique enregistrée reste financée séparément."
 bfl_deposit_income_tip: "Exigez les intérêts effectivement payés ce mois-ci par votre banque à charte et les banques indépendantes. Les intérêts impayés restent dus. Les retraits de capital et les apports en capital sont exclus."
 bfl_deposit_interest: "Intérêts de dépôt"
 bfl_deposit_ledger_help: "Chaque compte conserve son taux d'intérêt convenu. Les dépôts à terme durent douze mois. L'argent et les intérêts reviennent au déposant."
 bfl_deposit_ledger_subtitle: "Comptes courants"
 bfl_deposit_ledger_title: "Déposants"
 bfl_deposit_ledger_title_tip: "Qui a de l'argent dans cette banque. Passez la souris pour inspecter les comptes et les retraits."
 bfl_deposit_policy_title: "Taux de dépôt"
 bfl_deposit_policy_title_tip: "Le taux annuel offert aux nouveaux dépôts. Les dépôts existants conservent leur taux convenu."
 bfl_deposit_total: "Dépôts"
 bfl_deposit_total_tip: "Argent que la banque doit à ses déposants, y compris les intérêts impayés."
 bfl_deposits: "Dépôts et taux"
 bfl_deposits_label: "Demandes de dépôt"
 bfl_dev_notice: "Le crédit financé, les obligations souveraines, les investissements des entreprises, les biens, les commendes et les services monétaires suivent leurs exigences en matière de recherche, de profil et de construction. L'équilibre et la compatibilité de la campagne à l'échelle de la version restent en cours de validation."
 bfl_distress: "Portes de détresse et de développement"
 bfl_distribution_title: "Paiement de dividendes"
 bfl_distribution_title_tip: "La part du bénéfice mensuel éligible versée aux propriétaires. Le reste reste à la banque."
 bfl_dividend_breakdown: "Dividendes bancaires"
 bfl_dividend_breakdown_subtitle: "Tarif annuel et règlement mensuel"
 bfl_dividend_calculation: "Calcul du dividende mensuel"
 bfl_dividend_explanation: "Bénéfice net mensuel après intérêts sur les dépôts, charges d'exploitation et dividendes des fonds de pertes reportées. Chaque propriétaire reçoit les actions détenues multipliées par le paiement financé par action en circulation. Les bénéfices non distribués ne seront pas redistribués le mois prochain."
 bfl_dividend_rate_note: "Le taux annuel correspond aux dernières recettes mensuelles multipliées par douze, et non à une promesse. Les frais bancaires comprennent les intérêts sur les dépôts, les frais de fonctionnement et les pertes reportées. Chaque propriétaire reçoit sa part du paiement financé, arrondie aux ducats et aux centimes inférieurs."
 bfl_draw_bond: "Emprunter 100 de la banque"
 bfl_draw_bond_tip: "La banque à charte paie 100 de l'or contre une obligation souveraine perpétuelle. Plusieurs numéros peuvent être financés chaque mois, à hauteur de 1,000 de l'or au total. La banque doit conserver suffisamment de liquidités et de capital, et l’État doit payer les intérêts. Les bénéfices servent à financer. Remboursez la valeur nominale à son détenteur actuel pour le mettre à la retraite."
 bfl_equity_debt: "Fonds propres et dettes bancaires"
 bfl_equity_debt_tip: "#T Fonds propres et dettes bancaires#!\nJusqu'à douze instantanés de règlements mensuels réels. Le vert représente l'actif moins le passif ; le rouge représente le passif total de la banque. Les deux utilisent le même axe de l’or mis à l’échelle automatiquement, y compris les capitaux propres négatifs. Les échantillons vont du plus ancien à gauche au plus récent à droite. Survolez un échantillon pour connaître sa valeur et son mois comptable. Les prêts de l'État ne sont pas inclus dans cet historique bancaire."
 bfl_equity_detail_title: "Capitaux propres de [Country.GetName]"
 bfl_equity_label: "Équité"
 bfl_equity_label_tip: "#T Fonds propres bancaires#!\nLa valeur résiduelle appartenant aux propriétaires de la banque après ses obligations.\n\nActifs : [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_assets')|2]@gold!\nMoins la dette totale : [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_liabilities')|2]@gold!\nÉquité : [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_equity')|2]@gold!\n\nUnités d'état enregistrées : [Country.MakeScope.GetVariable('bfl_state_units').GetValue|2]\nUnités de propriété totales : [Country.MakeScope.GetVariable('bfl_total_units').GetValue|2]\nMarge de capital : [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_capital_headroom')|2]@gold!\n\nDes capitaux propres négatifs signifient l’insolvabilité. La marge de capital est supérieure aux capitaux propres 10% d'actifs, avec un minimum de zéro ; les distributions sont limitées à la fois par cette marge et par les liquidités disponibles. Les capitaux propres ne sont pas le montant qui peut être retiré immédiatement."
 bfl_equity_market: "Cours et historique de l’action"
 bfl_equity_subscribe_0: "Trésorerie : souscrire 100 or"
 bfl_equity_subscribe_0_tip: "Souscription à la VNI primaire : rémunère l'émetteur et dilue les détenteurs existants. Les achats immobiliers utilisent le portefeuille immobilier, préservant ainsi 25 l'or. Un investisseur bancaire utilise uniquement ses propres liquidités protégées et son excédent de capital ; les capitaux propres de l’entreprise nécessitent une recherche sur les investissements à l’étranger."
 bfl_equity_subscribe_1: "Bourgeois : abonnez-vous 100 or"
