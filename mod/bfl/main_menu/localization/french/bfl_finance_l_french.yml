 bfl_goods_policy_contracts_0: "Contrats · Spot uniquement"
 bfl_goods_policy_contracts_1: "Contrats · Reçus d'offres"
 bfl_goods_policy_contracts_2: "Contrats · Offre à terme"
 bfl_goods_policy_help: "Cliquez sur un paramètre à parcourir. La banque choisit les marchandises et les quantités à la clôture mensuelle. Survolez chaque paramètre pour connaître ses règles."
 bfl_goods_policy_mandate_0: "Mandat · Suspendu"
 bfl_goods_policy_mandate_1: "Mandat · Automatique"
 bfl_goods_policy_mandate_2: "Mandat · Run-off"
 bfl_goods_policy_risk_0: "Risque · Prudent"
 bfl_goods_policy_risk_1: "Risque · Équilibré"
 bfl_goods_policy_risk_2: "Risque · Aventureux"
 bfl_goods_policy_turnover_12: "Attendez · 12 mois"
 bfl_goods_policy_turnover_24: "Attendez · 24 mois"
 bfl_goods_policy_turnover_6: "Attendez · 6 mois"
 bfl_goods_previous: "Lots précédents"
 bfl_goods_quote_desc: "Quantité : [ROOT.GetCountry.MakeScope.GetVariable('bfl_goods_quote_quantity').GetValue|3]. Prix : [ROOT.GetCountry.MakeScope.GetVariable('bfl_goods_quote_price').GetValue|2] or plus 1 frais de garde d'or. Un récépissé d'entrepôt possède immédiatement les marchandises. Un transfert physique préfinance entièrement la livraison en trois mois. Les deux nécessitent des produits garantis. Frais de stockage 0.1 par mois ; la perte physique est 2% annuellement. Un forward conserve sa quantité fixe : les unités manquantes sont remboursées au prorata plus une compensation de sécurité égale du vendeur. La livraison sur un autre marché prend deux mois, coûte 1 l'or et perd 1% de quantité. Les pertes de stockage et de transport réduisent la quantité reçue. Les parties invalides ou l'accès perdu préservent les biens et les garanties pour la récupération. Acceptez uniquement si ces conditions vous conviennent."
 bfl_goods_quote_title: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_goods_quote_type').Goods.GetNameWithNoTooltip] récépissé d'entrepôt"
 bfl_goods_set_allocation_tip: "Cycle 0%, 10%, 25% ou 50% de liquidités bancaires plus le coût des stocks détenus. L’argent protégé est toujours conservé. La réduction de l'allocation vend des positions gratuites accessibles jusqu'à ce qu'elles soient inférieures à l'objectif."
 bfl_goods_set_contracts_tip: "Spot uniquement, proposez automatiquement des reçus ou proposez automatiquement des transferts physiques. Les offres nécessitent l’âge et la recherche de l’instrument, restent soutenues et attendent l’acceptation d’une contrepartie distincte. Les obligations acceptées existantes restent protégées."
 bfl_goods_set_mandate_tip: "Automatique : achetez et vendez selon votre police. En pause : aucune transaction discrétionnaire. Run off : vendez un inventaire gratuit accessible sans le remplacer. Les contrats existants, le stockage et les pertes se poursuivent dans tous les modes."
 bfl_goods_set_risk_tip: "Prudent : prenez des bénéfices +10%, arrêter la perte −5%. Equilibré : +20% / −15%. Aventurier : +35% / −25%. Les limites utilisent des devis de vente natifs par rapport au coût restant ; l'exécution est mensuelle et les prix peuvent évoluer."
 bfl_goods_set_turnover_tip: "Durée maximale de détention : 6, 12 ou 24 mois. La banque vend des positions gratuites accessibles à l'expiration et sélectionne automatiquement les nouveaux biens."
 bfl_goods_settings: "Politique commerciale"
 bfl_goods_settings_tip: "Définissez le mandat de la banque, l’allocation, les limites de risque, la période de détention et la politique contractuelle. La banque sélectionne toutes les marchandises et quantités lors de sa clôture mensuelle."
 bfl_goods_tip: "#T Marchandises et commerce#!\nInstruments de financement marchand impliquant l'inventaire, les reçus, les livraisons futures et la marge. L'autorisation enregistrée ne crée pas de marchandises ni de route commerciale ; une exécution physique est requise."
 bfl_goods_trading_locked: "Trading verrouillé · survolez les exigences"
 bfl_goods_transfer_desc: "Prix : [ROOT.GetCountry.MakeScope.GetVariable('bfl_goods_transfer_price').GetValue|2] l'or. Quantité : [ROOT.GetCountry.MakeScope.GetVariable('bfl_goods_transfer_quantity').GetValue|3]. Votre paiement va au titulaire actuel. La garde reste à la banque ; les conditions de stockage, de détérioration et de livraison continuent. L'acceptation rejette les modifications de support, de titulaire, de génération de lot ou de prix."
 bfl_goods_transfer_title: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_goods_transfer_type').Goods.GetNameWithNoTooltip] transfert de reçu"
