 bfl_grant_goods_branch_desc: "Examinez les offres de garde physique, les réclamations existantes ou un accord volontaire d’accès aux douanes. La sélection d’un pays ne déplace aucun argent."
 bfl_grant_goods_branch_effect_text: "$bfl_grant_goods_branch$"
