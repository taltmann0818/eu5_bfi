 bfl_share_value_label: "Valeur du portefeuille"
 bfl_shares_heading: "Actions"
 bfl_sovereign_accounts: "Comptes souverains – distincts des actifs bancaires"
 bfl_sovereign_accounts_subtitle: "Prêts souverains natifs – pas actifs bancaires"
 bfl_sovereign_accounts_tip: "Ces dettes et créances indigènes appartiennent au souverain et non à sa banque. Les prêts bancaires sont inclus dans l’actif ; les passifs bancaires comprennent les dépôts et les dépenses d’exploitation impayées. Le remboursement natif maintient le souverain comme acteur."
 bfl_sovereign_banknotes: "Billets souverains"
 bfl_sovereign_banknotes_desc: "Une banque soutenue par l'autorité publique peut faire circuler des promesses écrites de payer à la place de grosses pièces de monnaie. Leur acceptation repose sur la certitude que l'institution les rachètera et que l'autorité émettrice respectera ses obligations."
 bfl_sovereign_credit: "Crédit souverain"
 bfl_sovereign_credit_tip: "#T Crédit souverain#!\nPrêt en espèces auprès d'un État foncier, avec une demande de remboursement enregistrée comme un actif bancaire. Nécessite une banque opérationnelle et les conditions de prêt locales. L'exécution d'une nouvelle emprunte n'est pas disponible dans cette version."
 bfl_sovereign_debt: "Dette souveraine"
 bfl_sovereign_debt_heading: "Dette souveraine de [Country.GetName]"
 bfl_sovereign_note: "Billet souverain"
 bfl_sovereign_note_tip: "#T Billets remboursables#!\nAbsolutisme, recherche sur les billets souverains, autorisation souveraine, banque centrale au capital et succursale bancaire de l’émetteur. Échange 100 espèce pour une créance entièrement réservée. Le plafond indépendant basé sur les actions exclut les entrées de liquidités sous forme de billets. Transferts volontaires par participation ; les paiements indigènes restent en or."
 bfl_sovereign_receivables: "Créances souveraines"
 bfl_sovereign_receivables_heading: "Créances souveraines de [Country.GetName]"
 bfl_sovereign_restructuring: "Restructuration souveraine"
 bfl_sovereign_restructuring_tip: "#T Restructuration souveraine#!\nRenégocier la dette souveraine dans le cadre de l’avance de restructuration de la dette. Nécessite l’âge autorisé, une banque opérationnelle et une transaction de dette native prise en charge. L’exécution de restructuration native n’est pas disponible dans cette version."
 bfl_specialization_title: "Spécialisation bancaire"
 bfl_state_bonds_tip: "#T Capacité des obligations d’État#!\nObligations exceptionnelles de l’État natif : [GetPlayer.GetNumBonds]\nNombre maximal d'emplacements d'obligations natives : [GetPlayer.GetDoubleModifierValue('max_bonds', 'max_bonds_modifier')|0]\n\nIl s'agit des obligations de votre État, distinctes des dépôts, capitaux propres et autres passifs de la banque. La capacité comprend des emplacements de base natifs et des modificateurs de capacité de liaison. Vendre une obligation nécessite également les conditions d’emprunt locales."
 bfl_state_bonds_value: "Obligations : [GetPlayer.GetNumBonds] / [GetPlayer.GetDoubleModifierValue('max_bonds', 'max_bonds_modifier')|0]"
 bfl_state_chartered_bank: "Banque à charte d'État"
 bfl_state_chartered_bank_desc: "En confiant à une banque à charte la gestion du crédit public, nous lions la fortune de la Couronne à l'habileté de ses financiers. Les dépôts et le capital souscrit soutiennent une institution capable d’alléger le fardeau de la dette, tandis que ses comptes séparés préservent la confiance dans les obligations de l’État."
 bfl_state_credit: "Crédit d'État"
