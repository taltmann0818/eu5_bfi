 bfl_bond_row_32_tip: "Titulaire : [Country.MakeScope.GetVariable('bfl_bnd_32_holder').GetCountry.GetName]\nIntérêt annuel : [Country.MakeScope.GetVariable('bfl_bnd_32_rate').GetValue|%1]\nIntérêts impayés : [Country.MakeScope.GetVariable('bfl_bnd_32_due').GetValue|2]@gold!"
 bfl_bond_secured_accept_tip: "Acceptez la réduction proposée ainsi que l'engagement exclusif de revenus sur deux ans et la concession de protection commerciale. L'application effective reste limitée par les liquidités disponibles de l'émetteur."
 bfl_bond_summary_tip: "Capital, intérêts dus chaque mois et possibilité de nouveaux emprunts."
 bfl_bond_underwriting: "Souscription d'obligations"
 bfl_bond_underwriting_tip: "#T Souscription d'obligations#!\nVotre banque à charte paie en espèces pour une obligation souveraine personnalisée. Les deux spécialisations peuvent souscrire. Les coupons annuels fixes sont payés mensuellement ; le détenteur actuel reçoit la valeur nominale au moment du rachat. L’émission nécessite des liquidités bancaires, des capitaux et une capacité souveraine."
 bfl_bond_unpaid: "Coupons impayés"
 bfl_bond_workout_accept: "Accepter la restructuration obligataire"
 bfl_bond_workout_desc: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_bond_workout_issuer').GetCountry.GetName] vous demande, en tant que titulaire actuel, de renoncer 20% du principal et des coupons impayés de cette obligation et réduire son coupon annuel d'un point de pourcentage, avec un 1% sol. Le refus préserve tous les termes. La proposition expire ce mois-ci ; un paiement, un virement ou une autre modification l'invalide. L'acceptation ordinaire n'apporte aucune nouvelle sécurité. Lorsqu'elle est proposée, l'acceptation sécurisée ajoute une concession de protection commerciale de deux ans et un gage exclusif pouvant aller jusqu'à 10% du revenu mensuel pour les coupons impayés. L'application utilise uniquement l'or du Trésor disponible, avant les autres coupons d'obligations personnalisées ; il ne crée aucune garantie ni paiement du principal."
 bfl_bond_workout_secured: "Accepter avec une concession commerciale de deux ans et un engagement de revenus"
 bfl_bond_workout_title: "Proposition de restructuration obligataire"
 bfl_bonds_short: "Obligations souveraines"
 bfl_bonds_short_tip: "Empruntez auprès de votre banque ou examinez les obligations existantes."
 bfl_borrow_amount: "Emprunter à la banque"
 bfl_borrow_amount_desc: "Choisissez le principal d'une nouvelle obligation souveraine. La banque paie l'État et détient la caution. Les intérêts sont payés mensuellement. La trésorerie, le capital, la capacité d'endettement ainsi que le plafond mensuel partagé sont vérifiés lors de votre confirmation."
 bfl_borrow_amount_tip: "Choisissez combien emprunter. Disponible maintenant : [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bfl_bond_draw_max')|0]@gold!. La limite mensuelle évolue en fonction du revenu de l’État. Chaque émission financée crée une obligation."
 bfl_branch_construction: "Créer une succursale bancaire de capitale"
 bfl_branch_required: "Les nouvelles affaires souveraines nécessitent la création d’une succursale bancaire dans le capital actuel de cette banque. Les opérations de banque à banque sont exonérées ; les créances existantes restent dues."
 bfl_browse_bond_issuers: "Parcourir les émetteurs et les participations"
 bfl_browse_bond_issuers_desc: "Choisissez un émetteur pour inspecter les obligations et les offres en cours, y compris les créances détenues par votre banque."
 bfl_browse_bond_issuers_tip: "Sélectionnez un émetteur actif avec des obligations personnalisées en circulation. Cela n’achète ni ne vend rien."
 bfl_browse_goods: "Offres de marchandises et demandes de garde"
 bfl_browse_goods_act: "$bfl_browse_goods$"
 bfl_browse_goods_desc: "Examinez les offres de garde physique, les réclamations existantes ou un accord volontaire d’accès aux douanes. La sélection d’un pays ne déplace aucun argent."
 bfl_browse_goods_effect_text: "$bfl_browse_goods$"
 bfl_browse_goods_effect_text_past: "$bfl_browse_goods$"
 bfl_burghers_estate_workout_mandate: "Mandat de redressement successoral"
 bfl_burghers_estate_workout_mandate_desc: "Cette succession autorise explicitement son gouvernement à examiner en son nom les mesures volontaires de restructuration des dépôts bancaires. Chaque proposition doit encore être acceptée séparément. La révocation de ce privilège invalide les conditions successorales en cours. Les paiements de recouvrement continuent d’être versés au portefeuille de la succession."
 bfl_buy_bill: "Facture de paiement financée · 100 or"
 bfl_buy_bill_tip: "#T Facture de paiement financée#!\nTransfert 100 état de l'or à la banque pour une facture de paiement financée. La facture est enregistrée comme un créditeur plutôt que comme un bénéfice bancaire ou un prêt non garanti. Nécessite une recherche sur les effets de commerce, un espace pour la table des contrats et une banque opérationnelle acceptant cette affaire."
 bfl_buy_capital: "Capital souscrire · 100 or"
 bfl_buy_capital_tip: "#T Souscrire au capital bancaire#!\nTransfert 100 l'or de l'État pour acheter de nouvelles unités de propriété bancaire. Les unités sont évaluées à partir de capitaux propres bancaires positifs par unité existante. Cela augmente les liquidités bancaires et le capital versé, plutôt que les bénéfices. Débloqué grâce à une recherche bancaire native, à un espace de table de capital et à une banque opérationnelle acceptant cette activité. Le capital est exposé à des pertes et ne peut être retiré sous forme de dépôt."
 bfl_buy_confirm_desc: "Achat [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_quantity').GetValue|3] actions de [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_issuer').GetCountry.GetName] pour [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_total').GetValue|2]@gold!. Il s’agit d’actions existantes provenant de l’inventaire des teneurs de marché. L'émetteur ne reçoit aucun financement et les actions émises ne changent pas. Le prix coté, l'accès au marché en direct, les parts disponibles, les liquidités protégées et la limite de concentration sont à nouveau vérifiés lors de l'acceptation. Le règlement consomme un diplomate et démarre le temps de recharge d’achat/vente d’un mois de cet émetteur."
 bfl_buy_confirm_title: "Confirmer l'achat d'actions"
 bfl_buy_secondary_confirm_desc: "Acheter [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_quantity').GetValue|3] actions existantes de [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_issuer').GetCountry.GetName] de [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_seller').GetCountry.GetName] pour [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_total').GetValue|2]@gold!. Le vendeur actuel reçoit le paiement. L'émetteur ne reçoit aucun financement et les actions émises ne changent pas. La disponibilité, l’accès, les fonds protégés et la révision de cette offre sont à nouveau vérifiés lors de l’acceptation. Le règlement consomme un diplomate et démarre le temps de recharge d’achat/vente d’un mois de cet émetteur."
 bfl_buy_selected_bond: "Acheter une créance existante"
 bfl_buy_selected_bond_tip: "Payez le prix indiqué au vendeur actuel. L'émetteur ne reçoit aucun nouvel argent. L'exécution revérifie la propriété, l'expiration, la génération, les échanges, les arriérés et la trésorerie."
 bfl_buy_shares: "Acheter des actions"
 bfl_buy_shares_desc: "Choisissez une banque ou une entreprise, définissez une quantité de parts, puis vérifiez le total. L'achat transfère des actions existantes à partir d'une offre de vente ou d'un inventaire de teneur de marché. Utilisez l’action distincte de souscription de capital pour financer de nouvelles émissions."
 bfl_buy_shares_tip: "Choisissez une banque ou une entreprise, définissez une quantité de parts, puis vérifiez le total. L'achat transfère des actions existantes à partir d'une offre de vente ou d'un inventaire de teneur de marché. Utilisez l’action distincte de souscription de capital pour financer de nouvelles émissions.\nNécessite un échange terminé, un Share Dealing et au moins un diplomate. Chaque transaction réussie consomme un diplomate et démarre un temps de recharge d'un mois pour cet émetteur. Diplomates disponibles : [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bfl_available_trade_diplomats')|2]. Les commandes doivent avoir une valeur en espèces d'au moins 0.01 l'or."
 bfl_buy_sovereign_bond: "Acheter une obligation souveraine offerte"
 bfl_buy_sovereign_bond_act: "$bfl_buy_sovereign_bond$"
 bfl_buy_sovereign_bond_desc: "Achetez une obligation souveraine existante à son détenteur actuel. Nécessite un bâtiment de bourse achevé en propriété."
 bfl_buy_sovereign_bond_effect_text: "$bfl_buy_sovereign_bond$"
 bfl_buy_sovereign_bond_effect_text_past: "$bfl_buy_sovereign_bond$"
 bfl_buy_sovereign_bond_tip: "Sélectionnez l'émetteur d'une offre ouverte. Le paiement va au titulaire existant ; l'émetteur ne reçoit aucun nouveau produit. L'ensemble de la créance change de mains avec son coupon annuel fixe et son capital intacts."
 bfl_buy_state_confirm_desc: "Racheter [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_quantity').GetValue|3] actions existantes de [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_issuer').GetCountry.GetName] à partir de l'inventaire du teneur de marché pour [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_total').GetValue|2]@gold!, payé par le trésor de votre pays. Ces actions reviennent à votre participation en trésorerie. La banque ne reçoit aucun financement et les actions émises ne changent pas. Les stocks disponibles du concessionnaire, la cotation actuelle du marché, l'autorisation d'affrètement en direct et la trésorerie sont à nouveau vérifiés. La colonisation consomme un diplomate et démarre le temps de recharge d'achat/vente d'un mois de cette banque."
 bfl_cancel: "Annuler"
 bfl_cancel_selected_bond_offer: "Annuler l'annonce"
 bfl_cancel_selected_bond_offer_tip: "Retirez une offre appartenant à vous ou à votre banque à charte en direct. La dette et le coupon restent inchangés."
 bfl_capital_button: "Capital souscrire · 100 or"
 bfl_capital_heading: "Capital bancaire"
 bfl_cash: "Espèces"
 bfl_cash_detail_title: "Trésorerie de [Country.GetName]"
 bfl_cash_tip: "#T Trésorerie du Trésor#!\nOr actuellement détenu par la banque.\n\nTrésorerie totale : [Country.GetFixedPointCurrencyValue('gold')|2]@gold!\nArgent protégé : [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_protected_cash')|2]@gold!\nTrésorerie disponible : [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_free_cash')|2]@gold!\n\nRéserves de trésorerie protégées 25% du passif restant après les retraits en file d'attente, la file d'attente de retrait complète, un 25 réserve d'exploitation en or et liquidités engagées. La trésorerie disponible correspond à la trésorerie du Trésor moins cette réserve, avec un minimum de zéro. Les liquidités protégées sont une réserve obligatoire ; il peut dépasser les liquidités réellement détenues."
 bfl_chart_debt_01: "Dette : [Country.MakeScope.GetVariable('bfl_history_debt_01').GetValue|2]@gold! · mois comptable [Country.MakeScope.GetVariable('bfl_history_period_01').GetValue|0]"
