 bfl_cost_settlement_title: "Dernier règlement mensuel"
 bfl_cost_subtitle: "Administration bancaire mensuelle"
 bfl_cost_title: "Dépenses de fonctionnement de [Country.GetName]"
 bfl_credit_1_desc: "Une banque propose 100 de l'or pour 60 mois au taux annuel indiqué. L'acceptation revérifie le financement, l'autorité, la capacité d'endettement et votre éligibilité. Le principal est un financement, pas un revenu.\nTarif annuel : [ROOT.GetCountry.MakeScope.GetVariable('bfl_credit_offer_rate').GetValue|%1]."
 bfl_credit_1_title: "Offre de crédit"
 bfl_credit_2_desc: "Votre prêteur offre un 20% réduction du principal et une réduction annuelle du taux d'un point de pourcentage (minimum 1%). Cela modifie uniquement le prêt non garanti existant. Sa maturité reste inchangée."
 bfl_credit_2_title: "Offre d'allègement de la dette"
 bfl_credit_accept: "Acceptez les conditions"
 bfl_credit_partial: "Remboursez plutôt 25% de cette réclamation, y compris son intérêt natif restant"
 bfl_credit_refinance: "Réglez plutôt cette réclamation et refinancez son capital pour 60 mois"
 bfl_credit_reject: "Refuser"
