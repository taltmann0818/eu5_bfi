 bfl_asset_investments_title: "Actions et capital-risque"
 bfl_asset_legend_footer: "Anneau extérieur : types d’actifs. Bague intérieure et touches colorées : pays/banques. Les pourcentages correspondent aux parts du total des actifs bancaires ; les montants sont des valeurs comptables."
 bfl_asset_mix: "Actifs bancaires"
 bfl_asset_secured_heading: "Prêts garantis de [Country.GetName]"
 bfl_asset_secured_summary: "Prêts garantis : [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_asset_fraction_secured')|%2]"
 bfl_asset_secured_title: "Prêts garantis"
 bfl_asset_subtitle: "Type d'actif et contrepartie"
 bfl_asset_unlisted: "Autres contreparties / non cotées"
 bfl_asset_unsecured_heading: "Prêts non garantis de [Country.GetName]"
 bfl_asset_unsecured_summary: "Prêts non garantis : [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_asset_fraction_unsecured')|%2]"
 bfl_asset_unsecured_title: "Prêts non garantis"
 bfl_assets_detail_title: "Actifs de [Country.GetName]"
 bfl_assets_label: "Actifs"
 bfl_assets_label_tip: "#T Actif total#!\nTrésorerie et actifs enregistrés appartenant à la banque.\n\nTrésorerie du Trésor : [Country.GetFixedPointCurrencyValue('gold')|2]@gold!\nPortefeuille de prêts : [Country.MakeScope.GetVariable('bfl_native_credit_value').GetValue|2]@gold!\nPositions en actions (valeur comptable) : [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_security_carrying')|2]@gold!\nCrédits et cautionnements personnalisés : [Country.MakeScope.GetVariable('bfl_custom_credit_value').GetValue|2]@gold!\nInventaire : [Country.MakeScope.GetVariable('bfl_inventory_value').GetValue|2]@gold!\nProjets : [Country.MakeScope.GetVariable('bfl_project_value').GetValue|2]@gold!\nTotal : [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_assets')|2]@gold!\n\nLes prêts, les positions en capitaux propres, les stocks et les projets sont des valeurs d'actifs enregistrées et non des liquidités disponibles à dépenser. Les remboursements du principal échangent un actif de prêt contre de l'argent liquide ; ils ne créent pas de profit."
 bfl_authorize_note_bank: "Autoriser les billets remboursables"
 bfl_authorize_note_bank_act: "$bfl_authorize_note_bank$"
 bfl_authorize_note_bank_desc: "Autorisez votre banque à charte, ou une banque indépendante ayant une succursale dans votre capitale, à échanger des espèces contre des billets remboursables entièrement garantis après les recherches requises. Une banque centrale complétée dans votre capital est également requise pour les nouvelles émissions. L'autorisation ne crée aucun or et peut être retirée."
 bfl_authorize_note_bank_effect_text: "$bfl_authorize_note_bank$"
 bfl_authorize_note_bank_effect_text_past: "$bfl_authorize_note_bank$"
 bfl_automation_notice: "Gestion du crédit"
 bfl_automation_notice_tip: "Utilisez Credit Management dans l’en-tête pour permettre à la banque de gérer les prêts et les investissements. La banque conserve des réserves, paie les créanciers et vérifie les recherches et les liquidités avant d'investir."
 bfl_available: "Trésorerie disponible"
 bfl_available_tip: "Argent liquide que la banque peut utiliser après avoir conservé ses réserves."
 bfl_back_to_bank: "Comptes bancaires"
 bfl_balance_paid_tip: "Paiement financé reçu lors du dernier règlement mensuel. Ces transferts sont déjà dans votre trésorerie et ne doivent pas être ajoutés au total des revenus natifs."
 bfl_balance_sheet_subtitle: "Comptes bancaires courants"
 bfl_banco_del_giro: "Banque du Giro"
 bfl_banco_del_giro_desc: "Sous les arcades du Rialto, le crédit public passe de registre en registre. La banque reçoit de la monnaie, règle les obligations des commerçants et donne à la république une base durable pour ses dettes."
 bfl_banco_del_giro_maintenance: "Administration de la Banco del Giro"
 bfl_banco_mediceo: "Banco Mediceo"
 bfl_banco_mediceo_desc: "Derrière les épais murs de pierre de cette grande maison bancaire, les marchands règlent leurs comptes et les princes recherchent le crédit des Médicis. Ses commis organisent la circulation des lettres de change et des monnaies à Milan, au service des finances publiques et de la banque. Une maison achevée réduit les frais d'administration de la banque à charte de 15% et permet les services monétaires après les progrès nécessaires."
 bfl_bank_capital_subscriptions_desc: "Une banque ne doit pas nécessairement compter entièrement sur la fortune de sa famille fondatrice. Les souscriptions amènent des partenaires supplémentaires dans l'entreprise, mettant en commun leur capital tout en enregistrant les droits de chaque investisseur sur sa prospérité future."
 bfl_bank_dividends: "Dividendes bancaires (annuels)"
 bfl_bank_equity_subscribe: "Trésorerie bancaire : souscrire 100 or"
 bfl_bank_equity_subscribe_tip: "Investir 100 de la trésorerie protégée et de l'excédent de capital de la banque réellement gérée à la valeur liquidative tangible de l'émetteur sélectionné. De nouvelles unités payantes entrent dans le portefeuille bancaire. Maximale 25% d'une banque ou 60% d'une entreprise autorisée à l'étranger. Il s’agit d’un financement primaire et non d’un achat auprès d’un actionnaire existant."
 bfl_bank_headquarters_cost_reduction: "Réduction des coûts d'exploitation du siège social d'une banque à charte"
 bfl_bank_holdings: "Investissements bancaires"
 bfl_bank_identity_tip: "[Country.GetName] détient sa propre trésorerie, ses actifs et ses obligations. These totals belong to the bank, separately from your state treasury. Merchant Finance specializes in trade and corporate lending; Overseas Investment specializes in ventures and companies. Une banque choisit une spécialisation permanente."
 bfl_bank_loan_yield_bonus: "Intérêts sur les nouvelles offres de prêt bancaire"
 bfl_bank_of_england_founding_tt: "Établir la Banque d'Angleterre en tant que banque à charte à Londres, financée à partir des liquidités disponibles du Trésor jusqu'à l'investissement charter standard."
 bfl_bank_of_england_name: "Banque d'Angleterre"
 bfl_bank_palace_cost_reduction: "Réduction des coûts de fonctionnement des banques"
 bfl_bank_share_dealing: "Négociation d'actions bancaires"
 bfl_bank_share_dealing_desc: "A partner's fortune need not remain tied to the same banking house forever. Les transferts de propriété reconnus permettent aux investisseurs de vendre leurs intérêts à des tiers pendant que l'institution poursuit ses activités sans retirer son capital."
 bfl_bank_share_price_bonus: "Cours de l'action bancaire"
 bfl_bank_share_transfer: "Transfert d'actions bancaires"
 bfl_bank_share_transfer_tip: "#T Transfert d'actions bancaire#!\nTransfer recorded bank ownership units between funded parties. Requires Bank Share Dealing research and the Reformation age or later. Cette ligne indique l'autorisation ; it does not itself execute a secondary share trade."
 bfl_bank_status_tip: "Operating: new business is permitted when its other requirements are met. Cash under pressure: available cash is exhausted. Withdrawals queued: unpaid withdrawal requests suspend new business. Insolvable : le passif dépasse l'actif. In resolution or Closed: ordinary business is restricted. Les sinistres existants restent enregistrés."
 bfl_bank_subscription: "Abonnement bancaire"
 bfl_banking_company: "Société bancaire"
 bfl_banking_company_desc: "Les affaires de cette banque sont devenues trop grandes pour la maison qui tenait autrefois ses livres. Un corps d'administrateurs supervise désormais ses employés, tandis que des comptes communs et des bureaux établis unissent une entreprise qui peut perdurer au-delà de la fortune d'une seule famille. L'expérience passe d'une génération de serviteurs à la suivante, apportant ordre et économie aux affaires quotidiennes du crédit."
 bfl_banking_finance_companies__expanded_details_desc: "Reserved presentation preference for the detailed statement view."
 bfl_banking_finance_companies__expanded_details_name: "Détails étendus de l'activité"
 bfl_banking_finance_companies__finance_notifications_desc: "Préférence de présentation des notifications ; les obligations ne sont jamais annulées par la mise en sourdine."
 bfl_banking_finance_companies__finance_notifications_name: "Notifications financières"
 bfl_banking_finance_companies__interface_name: "Interface"
 bfl_banking_finance_companies__presentation__interface_name: "Interface"
 bfl_banking_finance_companies__presentation_name: "Présentation"
 bfl_banking_finance_companies__reduced_motion_desc: "Utilisez des reçus de transaction statiques et des avertissements. Désactivez pour autoriser de brèves mises en évidence d'une transaction unique après les paiements engagés ; pas de flashs financiers en boucle."
