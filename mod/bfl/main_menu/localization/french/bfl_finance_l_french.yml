 bfl_strategy_automatic: "Mandat IA · automatique"
 bfl_strategy_credit: "Dernier avis : crédit offert pour consentement"
 bfl_strategy_delegated: "Mandat d'investissement · délégué"
 bfl_strategy_deposit: "Dernier avis : 100 or placé sur demande"
 bfl_strategy_disable: "Gérer les investissements"
 bfl_strategy_disable_tip: "Arrêtez les achats automatiques de prêts, les nouvelles offres stratégiques et les placements à demande. Les prêts, dépôts et créances en attente continuent d’être remboursés. Les politiques relatives aux biens, aux partages et aux succursales restent distinctes."
 bfl_strategy_enable: "Déléguer les investissements"
 bfl_strategy_enable_tip: "Autorisez les achats notés de prêts natifs existants, les offres de crédit et de fret aux contreparties IA éligibles, ainsi que les placements sur demande de liquidités excédentaires. Une faible liquidité peut coter une obligation souveraine détenue à 98% du visage; une revente acceptée peut réaliser une perte. Cargo utilise vos conditions actuelles, votre consentement ordinaire et votre règlement physique. Les emprunts souverains, les dividendes, les biens et l’autorité monétaire conservent leurs politiques distinctes. Les nouvelles affaires s’arrêtent en résolution."
 bfl_strategy_idle: "Dernier examen : liquidité conservée"
 bfl_strategy_manual: "Mandat d'investissement · manuel"
 bfl_strategy_recall: "Dernier examen : rappel de consigne demandé"
 bfl_strategy_resale: "Dernier examen : une obligation détenue est proposée pour la liquidité"
 bfl_strategy_secondary_statement: "Achats automatiques de prêts natifs : [Country.MakeScope.GetVariable('bfl_strategy_takeovers').GetValue|0] · Cotations de revente d'obligations : [Country.MakeScope.GetVariable('bfl_strategy_resales').GetValue|0]"
 bfl_strategy_secondary_tip: "Les achats de prêts existants examinent au plus douze clients de la branche capital réalisés. L'emprunteur a besoin de liquidités, de paix, d'un budget non négatif et au moins 0.50 solvabilité. Les achats sont conservés 100 trésorerie disponible, plafonner la prime d'acquisition à 25% du capital restant et de l’exposition totale de l’emprunteur à 25% d'équité. La marge mensuelle attendue doit être d'au moins 0.10 de l'or après la prime, une allocation de service et des coûts de financement prudents. Il s'agit d'une estimation ; un remboursement anticipé et un défaut de paiement peuvent toujours entraîner une perte. Une faible liquidité peut coter une obligation souveraine détenue à 98% de face à travers une Bourse achevée. Aucun produit de revente n'est comptabilisé avant le consentement de l'acheteur financé."
 bfl_strategy_statement: "Bilans mensuels : [Country.MakeScope.GetVariable('bfl_strategy_reviewed').GetValue|0]/12  · Note : [Country.MakeScope.GetVariable('bfl_strategy_score').GetValue|2]\nOffres de crédit : [Country.MakeScope.GetVariable('bfl_strategy_offers').GetValue|0]  · Dépôts placés : [Country.MakeScope.GetVariable('bfl_strategy_placements').GetValue|0]  · Rappels : [Country.MakeScope.GetVariable('bfl_strategy_recalls').GetValue|0]"
 bfl_strategy_title: "Mandat d'investissement"
 bfl_strategy_title_tip: "Un mandat mensuel conservateur. Examinez jusqu'à douze candidats au crédit, douze opérateurs de capital-risque connectés avec quatre marchés sources chacun, ou douze banques de dépôt. Au plus une offre de crédit, une offre de fret ou 100-placement mensuel de la demande d'or. Les offres de crédit et de fret sont refroidies pendant trois mois. Le fret nécessite une marge indiquée d'au moins 10% et un excédent de banque d'or, conserve 500 trésorerie disponible, et est plafonné à deux accords actifs et 25% équité. Les citations peuvent changer ; des pertes restent possibles. Les autorisations protégées en matière d'argent liquide, de recherche, de succursales et de profil s'appliquent toujours."
 bfl_strategy_venture: "Dernier examen : partenariat cargo proposé pour consentement"
 bfl_streamline_bank: "Rationaliser l'administration · 100 or"
 bfl_streamline_bank_tip: "Payer 100 Etat de l'or une fois pour réduire les dépenses fixes d'exploitation des banques de 10%. La réforme des chartes, Banking et Advanced Clearing prévoient des réductions supplémentaires. Cette décision ne crée pas de profit bancaire."
 bfl_subscribe_bank: "Abonnez-vous 100 or du capital bancaire"
 bfl_subscribe_bank_act: "$bfl_subscribe_bank$"
 bfl_subscribe_bank_desc: "Financé par votre propre trésorerie après vérification du profil, de l'âge, des recherches et du registre. Le principal n’est pas le profit bancaire. Une souscription au capital bancaire achète des parts à leur valeur liquidative actuelle."
 bfl_subscribe_bank_effect_text: "$bfl_subscribe_bank$"
 bfl_subscribe_bank_effect_text_past: "$bfl_subscribe_bank$"
 bfl_suspend_command: "Suspendre les nouveaux dépôts"
 bfl_suspend_command_tip: "#T Suspendre les nouveaux dépôts#!\nArrêtez d'accepter de nouveaux dépôts et les actions de financement qui nécessitent l'acceptation des dépôts. Les comptes existants, les obligations d’intérêts et les demandes de retrait restent enregistrés. Ce contrôle ne ferme pas la banque ni n'efface ses dettes."
 bfl_term_accept: "Acceptez ces conditions fixes"
 bfl_term_amount: "Dépôt à terme"
 bfl_term_amount_desc: "Choisissez le montant à déposer. Les dépôts à terme durent douze mois."
 bfl_term_amount_tip: "Choisissez une banque et un montant. Déplacez les liquidités du Trésor sur un compte. Les intérêts et les retraits appartiennent au déposant. La banque vérifie à nouveau les fonds et les conditions lorsque vous confirmez."
 bfl_term_decline: "Conserver le compte existant"
 bfl_term_deposit: "Dépôt à terme"
 bfl_term_deposits_desc: "Les commerçants ne peuvent pas toujours employer leur argent d’un coup. En le confiant à une banque pour une durée convenue, ils donnent au banquier une source de capital plus stable et reçoivent une compensation pour la renonciation à un accès immédiat à leurs fonds."
 bfl_term_offer_1_desc: "Renouvelez votre maturité [ROOT.GetCountry.MakeScope.GetVariable('bfl_deposit_offer_principal').GetValue|2] principal en or pour 12 mois à [ROOT.GetCountry.MakeScope.GetVariable('bfl_deposit_offer_rate').GetValue|%1] annuellement. Les intérêts courus restent dus séparément. Aucun nouveau directeur n'est transféré. Cette offre expire à la fin du mois ; les réclamations modifiées nécessitent une nouvelle offre."
 bfl_term_offer_1_title: "Renouveler le dépôt à terme échu"
 bfl_term_offer_2_desc: "Mettre en file d'attente un retrait anticipé de [ROOT.GetCountry.MakeScope.GetVariable('bfl_deposit_offer_principal').GetValue|2] principal en or après annulation [ROOT.GetCountry.MakeScope.GetVariable('bfl_deposit_offer_penalty').GetValue|2] or des intérêts courus (au plus 1% du directeur). Aucune pénalité principale ne s’applique. Des pénuries de liquidités restent dues dans la file d’attente des retraits. Cette offre expire à la fin du mois ; les réclamations modifiées nécessitent une nouvelle offre."
 bfl_term_offer_2_title: "Offre de retrait anticipé"
 bfl_term_service_1: "Renouveler le premier compte à terme échu"
 bfl_term_service_1_act: "$bfl_term_service_1$"
 bfl_term_service_1_desc: "Demandez une offre de service à terme auprès de la banque sélectionnée. L'acceptation préserve les créances impayées et revérifie la génération des lots."
 bfl_term_service_1_effect_text: "$bfl_term_service_1$"
 bfl_term_service_1_effect_text_past: "$bfl_term_service_1$"
 bfl_term_service_1_tip: "Sélectionne votre premier lot à terme éligible. La banque présente des conditions fixes pour acceptation explicite. Le renouvellement nécessite des autorisations d'admission et de terme en cours ; une sortie anticipée et un retrait mûri restent disponibles après une perte de relations ou d’autorité. Les devis modifiés ou expirés ne peuvent pas être exécutés."
 bfl_term_service_2: "Demander un retrait anticipé"
 bfl_term_service_2_act: "$bfl_term_service_2$"
 bfl_term_service_2_desc: "Demandez une offre de service à terme auprès de la banque sélectionnée. L'acceptation préserve les créances impayées et revérifie la génération des lots."
