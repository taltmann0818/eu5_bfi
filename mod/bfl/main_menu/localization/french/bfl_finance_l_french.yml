 bfl_historical_bank_independent: "Permettre à la banque de rester une institution ordinaire."
 bfl_history_empty: "L'histoire commence au prochain règlement mensuel."
 bfl_investment_bank: "Banque d'investissement"
 bfl_investment_bank_desc: "Alors que le commerce attire des royaumes lointains vers un échange commun, la banque doit regarder au-delà des rues entourant son comptoir. Ses correspondants recueillent les promesses des marchands et des princes, tandis que des partenaires expérimentés cherchent des aventures à travers les mers. Un établissement plus grand est coûteux à entretenir, mais sa réputation impose de meilleures conditions pour le capital qui lui est confié."
 bfl_investment_tab: "Prêts et investissements"
 bfl_investment_title: "Prêts"
 bfl_invite_equity_capital: "Ajouter des fonds propres bancaires"
 bfl_invite_equity_capital_desc: "Abonnez-vous 100 de l'or à [ROOT.GetCountry.MakeScope.GetVariable('bfl_capital_issuer').GetCountry.GetName] à partir du portefeuille de trésorerie ou de succession sélectionné. Le souscripteur reçoit les nouvelles actions au cours du marché. Les portefeuilles successoraux conservent au moins 25 l'or. La propriété financière, les dividendes futurs et la dilution suivent les actions libérées."
 bfl_invite_equity_capital_tip: "Choisissez la trésorerie ou un portefeuille immobilier pour souscrire 100 de l'or à la valeur liquidative actuelle de la banque. Les nouvelles actions diluent les détenteurs existants ; la banque reçoit le paiement."
 bfl_join_clearing_group: "Rejoignez un groupe de compensation"
 bfl_join_clearing_group_act: "$bfl_join_clearing_group$"
 bfl_join_clearing_group_command: "$bfl_join_clearing_group$"
 bfl_join_clearing_group_command_desc: "$bfl_join_clearing_group_desc$"
 bfl_join_clearing_group_desc: "Rejoignez un opérateur acceptant des membres. Quatre banques par groupe ; les factures de paiement échues et appariées sont réglées par débit net financé. Un membre court bloque le lot sans effacer les réclamations."
 bfl_join_clearing_group_effect_text: "$bfl_join_clearing_group$"
 bfl_join_clearing_group_effect_text_past: "$bfl_join_clearing_group$"
 bfl_join_clearing_group_tip: "Choisissez un opérateur de compensation recherché acceptant les membres. Des recherches sur les révolutions, le Clearing House et le Advanced Clearing sont nécessaires. Jusqu'à quatre banques adhèrent explicitement ; un membre court préserve toutes les réclamations."
 bfl_liabilities_detail_title: "Passif de [Country.GetName]"
 bfl_liabilities_label: "Passif"
 bfl_liabilities_label_tip: "#T Dette totale#!\nObligations enregistrées dans les comptes de la banque. Ceci est distinct des prêts et obligations natifs de votre État.\n\nCapital du dépôt : [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_deposit_principal')|2]@gold!\nIntérêts de dépôt crédités : [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_deposit_interest')|2]@gold!\nNotes en circulation : [Country.MakeScope.GetVariable('bfl_notes_outstanding').GetValue|2]@gold!\nAutres dettes : [Country.MakeScope.GetVariable('bfl_other_payables').GetValue|2]@gold!\nTotal : [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_liabilities')|2]@gold!\n\nRetraits en file d'attente de [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_withdrawals_due')|2]@gold! font déjà partie des créances de dépôt et ne sont pas ajoutées une seconde fois."
 bfl_liquidity_facilities: "Facilités de liquidité"
 bfl_liquidity_facilities_desc: "Même une banque solvable peut ne pas être en mesure de répondre simultanément à toutes les demandes de pièces. Des avances temporaires sur des actifs sains peuvent combler cette pénurie, à condition que l'aide ne cache pas des pertes que l'institution ne peut supporter."
 bfl_liquidity_warning: "La liquidité bancaire nécessite une attention particulière"
 bfl_liquidity_warning_desc: "Votre banque a mis des retraits en file d'attente ou un capital insuffisant. Économie ouverte → Banque et finance pour revoir les dépôts et la recapitalisation."
