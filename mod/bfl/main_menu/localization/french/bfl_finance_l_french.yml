 bfl_facility_0: "Installation désactivée"
 bfl_facility_0_definition: "Désactivé : pas d'emprunt automatique. Vous pouvez toujours emprunter manuellement."
 bfl_facility_0_short: "Désactivé"
 bfl_facility_0_tip: "Désactivez le mandat de la facilité de dette permanente. Aucun financement bancaire programmé n’est demandé. Les obligations existantes restent exigibles."
 bfl_facility_1: "Facilité d’emprunt d’abord"
 bfl_facility_1_definition: "Dépenses : emprunter jusqu'à 60% des dépenses prévues de l'État chaque mois, quel que soit le solde de trésorerie de l'État. Le financement s’arrête à la limite mensuelle partagée, à la capacité d’endettement et aux limites de trésorerie et de capital bancaire."
 bfl_facility_1_short: "Dépenses"
 bfl_facility_1_tip: "Demander un financement obligataire personnalisé pour 60% des dépenses mensuelles prévues, dans le cadre d'un 1,000 limite mensuelle d’or. Ignorer les tirages lorsque l'argent de l'État arrive 500 l'or ou la banque ou l'émetteur manque de capacité."
 bfl_facility_2: "Installation tampon"
 bfl_facility_2_definition: "Réserve de trésorerie : emprunter suffisamment pour porter les liquidités prévues de l’État à hauteur de 200 ducats. Le financement s’arrête à la limite mensuelle partagée, à la capacité d’endettement et aux limites de trésorerie et de capital bancaire."
 bfl_facility_2_short: "Coussin de trésorerie"
 bfl_facility_2_tip: "Demander un financement obligataire personnalisé pour 200 l’or de l’État après le bilan prévisionnel, dans le cadre d’un 1,000 limite mensuelle d’or. Les demandes non financées ne créent ni dette ni trésorerie."
 bfl_facility_reason_1: "#O Vérifiez la recherche, l'accès aux succursales, les revenus des émetteurs et la capacité des coupons.#!"
 bfl_facility_reason_2: "#O Les liquidités protégées ne laissent pas suffisamment de liquidités aux banques.#!"
 bfl_facility_reason_3: "#O La nouvelle créance dépasserait la marge de capital de la banque.#!"
 bfl_facility_reason_4: "#O Les obligations souveraines combinées ont atteint la capacité de dette des émetteurs.#!"
 bfl_facility_reason_5: "#O Les coupons souverains non payés bloquent toute émission ultérieure.#!"
 bfl_facility_reason_6: "#O Le souverain a déjà émis une obligation ce mois-ci.#!"
 bfl_facility_reason_7: "#O Toutes les places record en obligations souveraines sont occupées.#!"
 bfl_facility_tip: "Cash bancaire effectivement reçu de l'émission d'obligations souveraines personnalisées ce mois-ci. Le financement crée de la dette et est exclu des revenus gagnés."
 bfl_facility_title: "Financement mensuel"
 bfl_facility_title_tip: "#T Mandat de la facilité de crédit#!\nLa banque finance des obligations souveraines personnalisées avec des coupons annuels fixes. Off arrête les problèmes planifiés. Premières demandes de dette 60% des dépenses prévues. Cibles tampons 200 l'or de l'État après le solde mensuel prévu. Les deux s'arrêtent à 500 l'or de l'État.\n\nDernière demande : [Country.MakeScope.GetVariable('bfl_facility_requested').GetValue|2]@gold!\nDernier financement : [Country.MakeScope.GetVariable('bfl_facility_paid').GetValue|2]@gold!\n\nLes tirages manuels et automatiques partagent un 1,000 limite mensuelle d’or. Les liquidités bancaires protégées, le capital, la capacité de l'émetteur et les coupons impayés peuvent empêcher un tirage. Les bénéfices constituent un financement et non un revenu."
