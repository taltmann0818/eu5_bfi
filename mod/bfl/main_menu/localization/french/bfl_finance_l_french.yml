 bfl_goods: "Marchandises et garde · Merchant Finance"
 bfl_goods_accept: "Acceptez ces conditions"
 bfl_goods_accept_branch_tip: "Acceptez l'accord des douanes de douze mois affiché. Les frais d'accès mensuels financés vont à l'hôte consentant ; l'acceptation ne crée aucun stock, ni réclamation de marchandise, ni achat immédiat."
 bfl_goods_accept_quote_tip: "Payez le prix du contrat affiché plus les frais de garde distincts d'un or au dépositaire. Revérifiez le support en direct, le prix, les parties, les autorisations, l'accès et les fonds protégés ; les conditions modifiées ou périmées ne rapportent aucun argent."
 bfl_goods_accept_transfer_tip: "Payez le prix de transfert affiché au titulaire actuel. Revérifiez le titulaire, la quantité, la génération du lot, la recherche, l'expiration et le financement avant de transférer une fois le reçu existant."
 bfl_goods_branch_desc: "L'hébergeur offre un accès à son marché des capitaux pour 12 mois à 1 or par mois, payé à l'hôte. Les achats indigènes conservent leur propre charge en espèces ; il s'agit d'un service de garde distinct. L'accès nécessite que l'hôte possède sa propre douane et la paix. L'accès non payé, l'expiration, la perte d'un bâtiment ou la guerre interrompent les nouveaux achats et les livraisons. L'hébergeur peut geler la garde locale ; aucun argent ni aucun bien n'est créé. Renouvelez avec le même hôte pour restaurer l’accès."
 bfl_goods_branch_title: "Accord de garde en douane"
 bfl_goods_browser_desc: "Sélectionnez un lot physique pour revoir son offre. Les titulaires existants peuvent demander la livraison ; l'hôte de la douane consentant peut geler la garde inaccessible et la libérer après un nouvel accès. Aucune acceptation d’offre n’a lieu lors de la sélection."
 bfl_goods_browser_title: "Offres de marchandises et demandes de garde"
 bfl_goods_claim_desc: "Demandez la livraison de ce reçu sur votre marché des capitaux. La livraison sur les marchés prend deux mois et coûte 1 l'or et perd 1% de quantité. Vous pouvez également fermer cette fenêtre et utiliser Proposer un transfert de récépissé d'entrepôt dans la diplomatie. Les transferts nécessitent des révolutions, des marges et une gestion des risques chez le dépositaire ; l'acheteur doit accepter un devis en cours."
 bfl_goods_claim_title: "Votre réclamation d'entrepôt"
 bfl_goods_close: "Fermer"
 bfl_goods_decline: "Refuser"
 bfl_goods_deliver: "Demander une livraison physique"
 bfl_goods_explanation: "L'inventaire natif financé, les reçus et les transferts garantis nécessitent Merchant Finance, leurs avances et la vérification de l'exécution/de la garde P09. Les marchandises grevées ne peuvent pas appuyer une seconde réclamation."
 bfl_goods_forward_title: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_goods_quote_type').Goods.GetNameWithNoTooltip] physique vers l'avant"
 bfl_goods_inventory_empty: "Aucune marchandise en garde à vue. Les achats automatiques commencent à la prochaine clôture bancaire mensuelle éligible."
 bfl_goods_inventory_hint: "Survolez les marchandises, les quantités, la valeur et le retour"
 bfl_goods_inventory_note: "Valeur de vente native indicative ; rendement non réalisé par rapport au coût payé restant. Les reçus de tiers sont exclus du total bancaire. Les coûts, la détérioration et la perte d'accès affectent les recettes. Faites défiler pour chaque position stockée."
 bfl_goods_inventory_subtitle: "Dépôt physique · valeur marchande indicative"
