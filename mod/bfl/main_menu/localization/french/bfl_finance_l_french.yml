 bfl_transfer_bank_bill_desc: "Choisissez l'émetteur et un bénéficiaire acceptant. Le premier éligible 100-transferts de réclamations d'or pour 100 l'or versé à son détenteur actuel. Les garanties verrouillées ne peuvent pas être transférées. Les notes nécessitent une recherche d’acceptation de Revolutions. Toutes les vérifications du financement, de la propriété et du capital sont répétées lors de l'exécution."
