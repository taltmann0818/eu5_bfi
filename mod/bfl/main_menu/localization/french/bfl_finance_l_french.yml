 bfl_request_discount_effect_text: "$bfl_request_discount$"
 bfl_request_discount_effect_text_past: "$bfl_request_discount$"
 bfl_request_discount_tip: "Choisissez un prêteur pour un 75-une avance d'un mois en or sur votre capital non promis et financé 100-un billet d'or dans une troisième banque. Nécessite des facilités de garantie et de liquidité. Le prêteur doit consentir; aucune succursale bancaire n’est requise entre les banques."
 bfl_request_public_support: "Demander une assistance publique sécurisée"
 bfl_request_public_support_act: "$bfl_request_public_support$"
 bfl_request_public_support_command: "$bfl_request_public_support$"
 bfl_request_public_support_command_desc: "$bfl_request_public_support_desc$"
 bfl_request_public_support_desc: "Demander un 75-avance en or sur votre financement 100-Billet d'or d'une troisième banque. Le responsable du prêteur en direct examine la demande ; l'acceptation revérifie toutes les parties et toutes les garanties. Aucune succursale bancaire n’est requise entre les banques."
 bfl_request_public_support_effect_text: "$bfl_request_public_support$"
 bfl_request_public_support_effect_text_past: "$bfl_request_public_support$"
 bfl_request_public_support_tip: "Choisissez un prêteur agréé doté de garanties financières publiques et d’une banque centrale au capital total de son souverain. Son dirigeant actuel doit y consentir. Le 75-l'avance garantie en or utilise au moins les espèces et les frais bancaires 9% annuellement ; il ne crée aucune garantie ni recapitalisation."
 bfl_reserves: "Trésorerie réservée"
 bfl_reserves_tip: "Espèces conservées pour les dépôts et les paiements promis."
 bfl_resolution_begin_command: "Commencer la résolution"
 bfl_resolution_begin_command_tip: "Une résolution ordonnée gèle les nouveaux engagements et distributions. Les réserves monétaires et de garde séparées restent protégées ; les dépôts se partagent la trésorerie disponible proportionnellement avant les arriérés de dépenses et les capitaux propres. Les créanciers disparus conservent leurs créances. Les conditions volontaires nécessitent le consentement actuel du créancier et la restructuration de la dette Renaissance. Une garantie publique couvre 50% de pertes sur dépôts acceptés, jusqu'à 100 l'or au total, financé par son souverain enregistré ; les appels impayés restent en attente. La clôture nécessite que toutes les obligations et tous les actifs non monétaires soient compensés. Les domaines fermés ne peuvent pas rouvrir."
 bfl_resolution_call_command: "Payer en attendant la garantie"
 bfl_resolution_call_command_tip: "Une résolution ordonnée gèle les nouveaux engagements et distributions. Les réserves monétaires et de garde séparées restent protégées ; les dépôts se partagent la trésorerie disponible proportionnellement avant les arriérés de dépenses et les capitaux propres. Les créanciers disparus conservent leurs créances. Les conditions volontaires nécessitent le consentement actuel du créancier et la restructuration de la dette Renaissance. Une garantie publique couvre 50% de pertes sur dépôts acceptés, jusqu'à 100 l'or au total, financé par son souverain enregistré ; les appels impayés restent en attente. La clôture nécessite que toutes les obligations et tous les actifs non monétaires soient compensés. Les domaines fermés ne peuvent pas rouvrir."
 bfl_resolution_close_command: "Fermer le domaine"
 bfl_resolution_close_command_tip: "Une résolution ordonnée gèle les nouveaux engagements et distributions. Les réserves monétaires et de garde séparées restent protégées ; les dépôts se partagent la trésorerie disponible proportionnellement avant les arriérés de dépenses et les capitaux propres. Les créanciers disparus conservent leurs créances. Les conditions volontaires nécessitent le consentement actuel du créancier et la restructuration de la dette Renaissance. Une garantie publique couvre 50% de pertes sur dépôts acceptés, jusqu'à 100 l'or au total, financé par son souverain enregistré ; les appels impayés restent en attente. La clôture nécessite que toutes les obligations et tous les actifs non monétaires soient compensés. Les domaines fermés ne peuvent pas rouvrir."
 bfl_resolution_guarantee_command: "Autoriser la garantie"
 bfl_resolution_guarantee_command_tip: "Une résolution ordonnée gèle les nouveaux engagements et distributions. Les réserves monétaires et de garde séparées restent protégées ; les dépôts se partagent la trésorerie disponible proportionnellement avant les arriérés de dépenses et les capitaux propres. Les créanciers disparus conservent leurs créances. Les conditions volontaires nécessitent le consentement actuel du créancier et la restructuration de la dette Renaissance. Une garantie publique couvre 50% de pertes sur dépôts acceptés, jusqu'à 100 l'or au total, financé par son souverain enregistré ; les appels impayés restent en attente. La clôture nécessite que toutes les obligations et tous les actifs non monétaires soient compensés. Les domaines fermés ne peuvent pas rouvrir."
 bfl_resolution_heading: "Résolution et recouvrement des créanciers"
 bfl_resolution_heading_tip: "Résolution financière persistante ; les recouvrements de trésorerie et les changements consensuels sont comptabilisés séparément des résultats."
 bfl_resolution_help: "Réserves garanties et de garde → dépôts proportionnels → arriérés de dépenses → actionnaires résiduels. Les réclamations survivent aux déficits et à la perte de l’autorité d’origine. Entrez la résolution avant de proposer des conditions."
 bfl_resolution_liquidate_command: "Réaliser les actifs disponibles"
 bfl_resolution_liquidate_command_tip: "Vendez un inventaire natif accessible et libre de toute charge et collectez des dépôts, des factures et des billets échus via leurs services existants. Les recettes réelles financent la cascade de récupération. Les positions indisponibles ou immatures restent enregistrées ; aucune valeur comptable ne devient de l'or."
 bfl_resolution_next_command: "Compte de dépôt suivant"
 bfl_resolution_next_command_tip: "Cyclez les comptes de dépôt actifs. Les créanciers successoraux exigent leur mandat d'exercice avant que leur gouvernement puisse accepter des conditions volontaires. Les paiements reviennent au trésor enregistré ou au portefeuille de la succession."
 bfl_resolution_notice_acknowledge: "Reconnaître le résultat final"
 bfl_resolution_notice_desc: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_notice_bank').GetCountry.GetName] a clôturé ses opérations financières.\n\nRécupérations d'acomptes versées : [ROOT.GetCountry.MakeScope.GetVariable('bfl_notice_bank').GetCountry.MakeScope.GetVariable('bfl_resolution_paid').GetValue|2]@gold!\nPertes sur dépôts consentis : [ROOT.GetCountry.MakeScope.GetVariable('bfl_notice_bank').GetCountry.MakeScope.GetVariable('bfl_resolution_waived').GetValue|2]@gold!\nPertes statutaires enregistrées : [ROOT.GetCountry.MakeScope.GetVariable('bfl_notice_bank').GetCountry.MakeScope.GetVariable('bfl_resolution_statutory_loss').GetValue|2]@gold!\n\nLes pertes enregistrées sont des montants impayés, et non des recouvrements ou de nouveaux revenus. La propriété historique et la succession définitive restent enregistrées ; l'établissement fermé ne peut pas rouvrir."
 bfl_resolution_notice_title: "Résolution bancaire clôturée"
 bfl_resolution_offer_command: "Proposer des conditions aux créanciers"
 bfl_resolution_offer_command_tip: "Une résolution ordonnée gèle les nouveaux engagements et distributions. Les réserves monétaires et de garde séparées restent protégées ; les dépôts se partagent la trésorerie disponible proportionnellement avant les arriérés de dépenses et les capitaux propres. Les créanciers disparus conservent leurs créances. Les conditions volontaires nécessitent le consentement actuel du créancier et la restructuration de la dette Renaissance. Une garantie publique couvre 50% de pertes sur dépôts acceptés, jusqu'à 100 l'or au total, financé par son souverain enregistré ; les appels impayés restent en attente. La clôture nécessite que toutes les obligations et tous les actifs non monétaires soient compensés. Les domaines fermés ne peuvent pas rouvrir."
 bfl_resolution_pay_command: "Récupération de salaire"
 bfl_resolution_pay_command_tip: "Une résolution ordonnée gèle les nouveaux engagements et distributions. Les réserves monétaires et de garde séparées restent protégées ; les dépôts se partagent la trésorerie disponible proportionnellement avant les arriérés de dépenses et les capitaux propres. Les créanciers disparus conservent leurs créances. Les conditions volontaires nécessitent le consentement actuel du créancier et la restructuration de la dette Renaissance. Une garantie publique couvre 50% de pertes sur dépôts acceptés, jusqu'à 100 l'or au total, financé par son souverain enregistré ; les appels impayés restent en attente. La clôture nécessite que toutes les obligations et tous les actifs non monétaires soient compensés. Les domaines fermés ne peuvent pas rouvrir."
 bfl_resolution_resume_command: "Reprise après récupération"
 bfl_resolution_resume_command_tip: "Une résolution ordonnée gèle les nouveaux engagements et distributions. Les réserves monétaires et de garde séparées restent protégées ; les dépôts se partagent la trésorerie disponible proportionnellement avant les arriérés de dépenses et les capitaux propres. Les créanciers disparus conservent leurs créances. Les conditions volontaires nécessitent le consentement actuel du créancier et la restructuration de la dette Renaissance. Une garantie publique couvre 50% de pertes sur dépôts acceptés, jusqu'à 100 l'or au total, financé par son souverain enregistré ; les appels impayés restent en attente. La clôture nécessite que toutes les obligations et tous les actifs non monétaires soient compensés. Les domaines fermés ne peuvent pas rouvrir."
 bfl_review_trade: "Revoir le commerce"
 bfl_review_trade_tip: "Passez en revue les unités sélectionnées et le paiement exact. Une vente doit être arrondie à au moins 0.01 l'or; augmentez la quantité si la révision n'est pas disponible. Aucun diplomate n'est dépensé jusqu'à ce qu'un échange valide soit réglé."
 bfl_riksbank_founding_tt: "Établir Sveriges Riksbank comme notre banque à charte, financée par la trésorerie disponible dans la limite de la dotation habituelle."
 bfl_riksbank_name: "Sveriges Riksbank"
 bfl_safeguards_title: "Liquidité et garanties"
 bfl_safeguards_title_tip: "#T Liquidité et garanties#!\nEspèces bancaires disponibles : [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_free_cash')|2]@gold!\nBesoin de trésorerie protégé : [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_protected_cash')|2]@gold!\nRetraits en file d'attente : [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_withdrawals_due')|2]@gold!\n\nLa recapitalisation approvisionne le capital de l’État. La suspension des dépôts arrête le financement des nouveaux comptes tout en préservant les obligations existantes."
 bfl_sale_unavailable: "L'ordre d'action n'a pas pu être réglé"
 bfl_sale_unavailable_desc: "L'émetteur dispose d'un délai de négociation d'un mois, vous n'avez pas de diplomate, votre cotation a expiré ou les actions, fonds ou accès aux échanges disponibles ont été modifiés. Rouvrez l'achat ou la vente d'actions pour une nouvelle cotation. Aucune trésorerie ni aucune action n'ont été déplacées."
 bfl_secured_liquidity: "Liquidité garantie"
 bfl_secured_liquidity_tip: "#T Liquidité sécurisée#!\nAbsolutisme, garanties et facilités de liquidité. Avance 75 de l'or contre un fonds financé séparément 100-Billet d'or d'une troisième banque. La garantie est verrouillée une fois. Le taux annuel fixe accepté est divisé par 12. Aucune succursale requise entre les banques."
 bfl_security_bank_results: "Dernière fermeture de banque"
 bfl_security_financial_heading: "Une situation financière tangible"
 bfl_security_financial_subtitle: "Ce qui soutient le cours de l'action"
 bfl_security_financial_title: "Capitaux propres de [Country.GetName]"
 bfl_security_price_heading: "Cours de l’action et propriété"
 bfl_security_price_math: "Prix de marché = VNI tangible par action × prime de marché mensuelle. La pression des ordres, la volatilité, le retour à la moyenne et les difficultés peuvent modifier cette prime. Le capital primaire reste évalué à la valeur liquidative ; les gains non réalisés ne financent pas les prêts ou les dividendes."
 bfl_security_primary_note: "Les dividendes réduisent les liquidités et la valeur liquidative une fois. Le nouveau capital est évalué à la valeur liquidative et ne crée aucun signal de pression d’achat. Les souscriptions sont suspendues pendant que l'offre de revente du concessionnaire dépasse la valeur liquidative, empêchant ainsi un profit immédiat garanti. L'histoire contient des observations réelles ; le rechargement ne relance pas un choc mensuel enregistré."
 bfl_select_buy_shares: "Acheter des actions de banques et d'entreprises"
 bfl_select_profile: "Choisir une spécialisation en attente"
 bfl_select_profile_tip: "#T Spécialisation bancaire#!\nOuvrez le choix de spécialisation si cette banque n'a pas encore choisi de profil permanent. Merchant Finance et Overseas Investment ouvrent différentes voies de recherche. Une spécialisation terminée ne peut pas être remplacée par ce bouton."
 bfl_select_sell_shares: "Vendez les actions que vous possédez"
 bfl_selector_next: "Banques suivantes"
 bfl_selector_previous: "Banques précédentes"
 bfl_sell_confirm_desc: "Vendre [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_quantity').GetValue|3] actions de [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_issuer').GetCountry.GetName] pour [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_total').GetValue|2]@gold!. Le teneur de marché caché garantit cette vente, y compris le spread de transaction coté, pendant que la cotation est valide. Les actions quittent immédiatement votre portefeuille ; Les achats d’IA en arrière-plan ne retardent pas le paiement. Les bénéfices vont à la trésorerie de votre banque. Le règlement consomme un diplomate et démarre le temps de recharge d’achat/vente d’un mois de cet émetteur."
 bfl_sell_confirm_title: "Confirmer la vente instantanée d'actions"
 bfl_sell_shares: "Vendre des actions"
 bfl_sell_shares_desc: "Choisissez un de vos avoirs et une quantité. Le teneur de marché caché achète immédiatement vos actions au cours du marché moins le spread affiché par le courtier. Les banques AI achètent leurs stocks en arrière-plan."
 bfl_sell_shares_tip: "Choisissez un de vos avoirs et une quantité. Le teneur de marché caché achète immédiatement vos actions au cours du marché moins le spread affiché par le courtier. Les banques AI achètent leurs stocks en arrière-plan.\nNécessite un échange terminé, un Share Dealing et au moins un diplomate. Chaque transaction réussie consomme un diplomate et démarre un temps de recharge d'un mois pour cet émetteur. Diplomates disponibles : [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bfl_available_trade_diplomats')|2]. Les commandes doivent avoir une valeur en espèces d'au moins 0.01 l'or."
 bfl_sell_state_confirm_desc: "Vendre [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_quantity').GetValue|3] actions de la participation de votre trésorerie dans [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_issuer').GetCountry.GetName] pour [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_total').GetValue|2]@gold!, versé au trésor de votre pays. La banque ne reçoit aucun financement et les actions émises ne changent pas. Le dealer caché garantit la cotation affichée, y compris le spread du dealer coté. Le règlement consomme un diplomate et démarre un temps de recharge d'achat/vente d'un mois pour cet émetteur. L’autorité monétaire de votre charte reste avec vous."
