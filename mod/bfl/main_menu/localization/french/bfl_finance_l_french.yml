 bfl_offer_commenda: "Financer une opération de fret"
 bfl_offer_commenda_act: "Financer une opération de fret"
 bfl_offer_commenda_desc: "Offrez du capital-risque selon les conditions proposées par la banque. L'acceptation achète la cargaison désignée à son prix d'origine ; l'autorisation non utilisée reste acquise à la banque. Le capital et les rendements ne sont jamais garantis."
 bfl_offer_commenda_effect_text: "Financer une opération de fret"
 bfl_offer_commenda_effect_text_past: "Financer une opération de fret"
 bfl_offer_commenda_tip: "Découverte ou plus tard, recherche sur les investissements à l'étranger et Commenda. Choisissez un opérateur, un marché source, une destination et des marchandises pour une cargaison de dix unités. L'acceptation revérifie votre autorité, vos liquidités disponibles, votre capital et votre capacité. Un accord actif par opérateur ; jusqu'à huit par banque."
 bfl_offer_credit: "Proposer un prêt financé"
 bfl_offer_credit_act: "$bfl_offer_credit$"
 bfl_offer_credit_desc: "L'emprunteur reçoit une offre explicite. Aucun paiement en espèces ni changement de conditions jusqu'à l'acceptation ; l'exécution revérifie l'autorité en direct, le profil, la recherche et les fonds."
 bfl_offer_credit_effect_text: "$bfl_offer_credit$"
 bfl_offer_credit_effect_text_past: "$bfl_offer_credit$"
 bfl_offer_credit_tip: "Sélectionnez une entreprise nationale souveraine ou éligible. Les deux profils prêtent aux souverains ; le crédit aux entreprises nécessite la finance marchande, la réforme et le crédit aux entreprises. L’allègement de la dette nécessite également une restructuration de la dette Renaissance."
 bfl_offer_goods_transfer: "Proposer le transfert de récépissé d'entrepôt"
 bfl_offer_goods_transfer_act: "$bfl_offer_goods_transfer$"
 bfl_offer_goods_transfer_desc: "Proposez le reçu le plus récemment sélectionné dans les offres de marchandises et les demandes de garde. Le destinataire examine le prix et la quantité avant de payer le détenteur actuel."
 bfl_offer_goods_transfer_effect_text: "$bfl_offer_goods_transfer$"
 bfl_offer_goods_transfer_effect_text_past: "$bfl_offer_goods_transfer$"
 bfl_offer_held_sovereign_bond: "Proposer une obligation souveraine détenue"
 bfl_offer_held_sovereign_bond_act: "$bfl_offer_held_sovereign_bond$"
 bfl_offer_held_sovereign_bond_desc: "Sélectionnez un émetteur et cotez une de vos obligations souveraines sur 98% de valeur nominale. Nécessite un bâtiment de bourse achevé en propriété."
 bfl_offer_held_sovereign_bond_effect_text: "$bfl_offer_held_sovereign_bond$"
 bfl_offer_held_sovereign_bond_effect_text_past: "$bfl_offer_held_sovereign_bond$"
 bfl_offer_held_sovereign_bond_tip: "Répertoriez une obligation existante que vous possédez depuis trois mois. Vous conservez la réclamation jusqu'à ce qu'un acheteur financé l'accepte ; les coupons et le remboursement suivent ensuite cet acheteur."
 bfl_offer_restructuring: "Offrir un allégement de la dette"
 bfl_offer_restructuring_act: "$bfl_offer_restructuring$"
 bfl_offer_restructuring_desc: "L'emprunteur reçoit une offre explicite. Aucun paiement en espèces ni changement de conditions jusqu'à l'acceptation ; l'exécution revérifie l'autorité en direct, le profil, la recherche et les fonds."
 bfl_offer_restructuring_effect_text: "$bfl_offer_restructuring$"
 bfl_offer_restructuring_effect_text_past: "$bfl_offer_restructuring$"
 bfl_offer_restructuring_tip: "Sélectionnez une entreprise nationale souveraine ou éligible. Les deux profils prêtent aux souverains ; le crédit aux entreprises nécessite la finance marchande, la réforme et le crédit aux entreprises. L’allègement de la dette nécessite également une restructuration de la dette Renaissance."
 bfl_offering_closed: "Fermé"
 bfl_offering_open: "Ouvert"
 bfl_operating_costs: "Dépenses de fonctionnement mensuelles"
 bfl_operating_costs_tip: "Les coûts mensuels fixes varient en fonction des comptes de dépôt actifs, des contrats, des succursales et des classes d'actifs. La réforme de la State Chartered Bank réduit les coûts de 5%, Services bancaires par 10%, Compensation avancée par 15%, une administration simplifiée par 10%, un siège de banque achevé par 15%, et un palais bancaire florentin appartenant à 10%. La réduction totale reste plafonnée à 75%. Les coûts impayés restent des passifs et bloquent les dividendes."
 bfl_overview: "Comptes et spécialisation"
 bfl_overview_hint: "Actifs : anneau extérieur = type ; anneau intérieur = pays. Survolez les pannes colorées."
 bfl_palace_saint_george: "Palais de Saint Georges"
 bfl_palace_saint_george_desc: "Le palais au bord du port de Gênes offre une maison commune aux créanciers de la république. Son autorité durable renforce la confiance dans les actions de la banque, tandis que des commis expérimentés confient à leurs soins les dettes et les revenus."
 bfl_palace_saint_george_maintenance: "Administration du palais Saint-Georges"
 bfl_palazzo_acciaiuoli: "Palais Acciaiuoli"
 bfl_palazzo_acciaiuoli_desc: "Derrière les sobres murs de pierre de leur palais florentin, les Acciaioli rassemblent sous un même toit des récits épars. Le travail ordonné de leurs commis réduit les dépenses de fonctionnement de la banque."
 bfl_palazzo_acciaiuoli_maintenance: "Administration du palais Acciaiuoli"
 bfl_palazzo_busini_bardi: "Palais Busini-Bardi"
 bfl_palazzo_busini_bardi_desc: "Au sein de ces murs de pierre ordonnés, les Bardi rassemblent les récits des tribunaux et des comptoirs de toute l’Europe. Le palais achevé réduit l'administration bancaire de dix pour cent et ajoute un demi-point de pourcentage aux taux de prêt nouvellement proposés, sous réserve du plafond habituel. Les contrats existants conservent leurs tarifs convenus."
 bfl_palazzo_busini_bardi_maintenance: "Administration du palais Busini-Bardi"
 bfl_palazzo_peruzzi: "Palais Peruzzi"
 bfl_palazzo_peruzzi_desc: "Les Peruzzi unissent le comptoir au commerce des marchands de draps. Leurs commis règlent leurs obligations sous un toit soutenu par des marchés lointains. Le palais achevé réduit l'administration bancaire de dix pour cent. Son activité de tissu accroît la demande sur le marché local, soutenant le prix du tissu fin dans la mesure où l'offre et la demande le permettent."
 bfl_palazzo_peruzzi_maintenance: "Administration du palais Peruzzi"
 bfl_palazzo_salimbeni: "Palais Salimbeni"
 bfl_palazzo_salimbeni_desc: "Dans l'enceinte austère du palais Salimbeni, Sienne confie ses économies à une institution pérenne. Une administration prudente et une patiente extension du crédit soutiennent à la fois la banque et ceux qui sollicitent son aide."
 bfl_palazzo_salimbeni_maintenance: "Administration du palais Salimbeni"
 bfl_payout_0: "Conserver les bénéfices"
 bfl_payout_0_short: "Conserver"
 bfl_payout_0_tip: "Conservez tous les bénéfices réalisés éligibles. Aucun nouveau dividende n'est versé au titre de ce contrat ; les bénéfices non répartis soutiennent la liquidité et les capitaux propres."
 bfl_payout_25: "25% paiement"
 bfl_payout_25_short: "25%"
 bfl_payout_25_tip: "Allouer jusqu'à 25% du bénéfice réalisé éligible aux dividendes après pertes. Les liquidités disponibles, la marge de capital et la propriété enregistrée limitent toujours les paiements."
 bfl_payout_50: "50% paiement"
 bfl_payout_50_short: "50%"
 bfl_payout_50_tip: "Allouer jusqu'à 50% du bénéfice réalisé éligible aux dividendes après pertes. Les liquidités disponibles, la marge de capital et la propriété enregistrée limitent toujours les paiements."
 bfl_peasants_estate_workout_mandate: "Mandat de redressement successoral"
 bfl_peasants_estate_workout_mandate_desc: "Cette succession autorise explicitement son gouvernement à examiner en son nom les mesures volontaires de restructuration des dépôts bancaires. Chaque proposition doit encore être acceptée séparément. La révocation de ce privilège invalide les conditions successorales en cours. Les paiements de recouvrement continuent d’être versés au portefeuille de la succession."
 bfl_peruzzi_cloth_demand: "Commerce de tissus Peruzzi"
 bfl_place_deposit_1: "Ouvrir un 100 dépôt à vue d'or"
 bfl_place_deposit_1_act: "$bfl_place_deposit_1$"
 bfl_place_deposit_1_desc: "Les banques indépendantes exigent un avis d'au moins +50 envers vous pour ouvrir un compte. Votre banque à charte offre un supplément 1% intérêts annuels. Les intérêts à demande sont payés mensuellement une fois financés ; les intérêts impayés restent dus. Les relations en déclin n’empêchent jamais le retrait de vos propres créances échues."
 bfl_place_deposit_1_effect_text: "$bfl_place_deposit_1$"
 bfl_place_deposit_1_effect_text_past: "$bfl_place_deposit_1$"
 bfl_place_deposit_2: "Ouvrir un 100 dépôt à terme en or"
 bfl_place_deposit_2_act: "$bfl_place_deposit_2$"
 bfl_place_deposit_2_desc: "Les banques indépendantes exigent un avis d'au moins +50 envers vous pour ouvrir un compte. Votre banque à charte offre un supplément 1% intérêts annuels. Les intérêts à demande sont payés mensuellement une fois financés ; les intérêts impayés restent dus. Les relations en déclin n’empêchent jamais le retrait de vos propres créances échues."
 bfl_place_deposit_2_effect_text: "$bfl_place_deposit_2$"
 bfl_place_deposit_2_effect_text_past: "$bfl_place_deposit_2$"
 bfl_portfolio_bank_heading: "Investissements détenus par [Country.GetName]"
 bfl_portfolio_history_axis: "Du plus ancien au plus récent · jusqu'à 12 observations mensuelles"
 bfl_portfolio_history_empty: "L’historique commence à la prochaine clôture mensuelle de la banque."
 bfl_portfolio_history_flows: "La valeur comprend les achats et les ventes ; il ne s’agit pas d’un indice de rendement des investissements."
 bfl_portfolio_history_title: "Valeur du portefeuille au fil du temps"
 bfl_portfolio_owner_note: "Les avoirs du Trésor et des banques ont des propriétaires distincts. Survolez une entité pour ses finances."
 bfl_portfolio_total_heading: "Valeur actuelle des capitaux propres"
 bfl_portfolio_treasury_heading: "Avoirs du Trésor souverain"
 bfl_prepare_bond_panel: "Obligations souveraines"
 bfl_prepare_bond_panel_tip: "Consultez le financement de l'État et les créances existantes dans Crédit."
 bfl_probe_P11: "Porte de développement : P11 doit être mesuré dans le jeu avant que cet adaptateur puisse s'exécuter."
 bfl_profile_0: "Choisissez une spécialisation"
 bfl_profile_1: "Financement des commerçants"
 bfl_profile_2: "Investissement à l'étranger"
 bfl_project_security: "Sécurité du projet"
 bfl_project_security_desc: "Les entreprises éloignées sont difficiles à superviser pour leurs financiers. Les créances sur leurs actifs et leurs revenus, établies avant l'avance du capital, donnent aux investisseurs un moyen de protéger leurs intérêts lorsqu'une entreprise tourne mal."
 bfl_project_security_tip: "#T Sécurité du projet#!\nProtégez une entreprise contre des réclamations identifiables liées au projet. Nécessite des recherches sur la sécurité des projets, des investissements à l'étranger et l'ère de l'absolutisme ou une version ultérieure. L’exécution native des garanties du projet n’est pas disponible dans cette version."
 bfl_protected_label: "Argent protégé"
 bfl_public_backstop: "Filet de sécurité public"
 bfl_public_backstop_tip: "#T Support public sécurisé#!\nDes révolutions, des soutiens financiers publics et une charte en direct avec une banque centrale achevée au capital souverain. Explicitement accepté 75-les avances en or utilisent les liquidités disponibles de la banque publique, 25% coupe de cheveux de facture et au moins 9% intérêts annuels. Pas de recapitalisation gratuite."
 bfl_public_financial_backstops: "Soutiens financiers publics"
 bfl_public_financial_backstops_desc: "Lorsque la faillite d’une grande banque menace le crédit public et le commerce, le gouvernement peut intervenir. Un tel soutien lie les ressources du Trésor au redressement de la banque et fait des conditions de l'aide une question de politique publique."
 bfl_purchase_funded_bill: "Acheter une facture de paiement financée"
 bfl_purchase_funded_bill_act: "$bfl_purchase_funded_bill$"
 bfl_purchase_funded_bill_desc: "Financé par votre propre trésorerie après vérification du profil, de l'âge, des recherches et du registre. Le principal n’est pas le profit bancaire. Une souscription au capital bancaire achète des parts à leur valeur liquidative actuelle."
 bfl_purchase_funded_bill_effect_text: "$bfl_purchase_funded_bill$"
 bfl_purchase_funded_bill_effect_text_past: "$bfl_purchase_funded_bill$"
 bfl_purchase_native_loan: "Banque : rachat de prêt immobilier local"
 bfl_purchase_native_loan_act: "$bfl_purchase_native_loan$"
 bfl_purchase_native_loan_desc: "Achetez un prêt immobilier admissible auprès de votre banque. La banque a besoin de sa propre branche de capital complétée, du prix d'achat total en espèces disponibles et d'un capital suffisant. Les obligations, les prêts détenus par le pays et les prêts à quarante mois ou moins restants sont exclus. Les successions reçoivent un paiement ; l'emprunteur ne contracte aucune nouvelle dette."
 bfl_purchase_native_loan_effect_text: "$bfl_purchase_native_loan$"
 bfl_purchase_native_loan_effect_text_past: "$bfl_purchase_native_loan$"
 bfl_purchase_native_loan_tip: "#T Reprendre le prêt pour la banque#!\nSélectionnez un autre souverain ayant une dette immobilière éligible. Votre banque à charte paie le prix d'achat local aux actifs bancaires de ce pays et devient créancière du même prêt. Le capital et les intérêts à recevoir appartiennent à la banque ; le souverain gagne des revenus de prêts grâce aux dividendes de ses actions. Les banques achètent également un prêt éligible de manière autonome chaque mois lorsque les réserves et le capital le permettent. Les obligations et les prêts déjà détenus par le pays sont exclus."
 bfl_rate_0: "Pas d'intérêt à demande pour les nouveaux comptes"
 bfl_rate_0_short: "0%"
 bfl_rate_0_tip: "Offre 0% intérêts annuels sur les nouveaux dépôts à vue. Les comptes à vue existants et le taux du compte à terme distinct restent à leurs taux acceptés."
 bfl_rate_1: "1% taux de demande annuel de nouveaux comptes"
 bfl_rate_1_short: "1%"
 bfl_rate_1_tip: "Offre 1% intérêts annuels sur les nouveaux dépôts à vue. Les intérêts sont crédités mensuellement avec portage en centimes. Les comptes à vue existants conservent leurs taux acceptés."
 bfl_rate_2: "2% taux de demande annuel de nouveaux comptes"
 bfl_rate_2_short: "2%"
 bfl_rate_2_tip: "Offre 2% intérêts annuels sur les nouveaux dépôts à vue. Les intérêts sont crédités mensuellement avec portage en centimes. Les comptes à vue existants conservent leurs taux acceptés."
 bfl_recapitalize_command: "Recapitaliser avec 100 or"
 bfl_recapitalize_command_tip: "Payer 100 l'or du trésor de votre pays comme capital bancaire. Nécessite 100 l'or et une offre de revente du concessionnaire ne dépassant pas la valeur liquidative tangible ; le capital fait une pause pendant une prime de marché plus importante pour empêcher un profit de revente immédiat. Le sauvetage financé à valeur liquidative nulle ou négative reste disponible."
 bfl_redeem_bond: "Échanger"
 bfl_redeem_bond_01_tip: "Payez la valeur nominale ainsi que tous les coupons accumulés au détenteur actuel. Une pénurie laisse la totalité de la caution impayée. Le rachat clôture la réclamation une fois ; les liens natifs ne sont pas affectés."
