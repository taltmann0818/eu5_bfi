 bfl_venture_accept: "Aceptar la asociación"
 bfl_venture_accept_tip: "Vuelva a verificar la autoridad del inversor en vivo, los términos de la oferta sin cambios, la antigüedad, la investigación, el efectivo libre, el capital, la capacidad y la contribución del operador. La financiación paga sólo el costo nativo real de la actividad seleccionada. No otorga acciones de la empresa ni control político."
 bfl_venture_decline: "Rechazar"
 bfl_venture_duration_12: "Duración · 12 meses"
 bfl_venture_duration_120: "Duración · 120 meses"
 bfl_venture_duration_24: "Duración · 24 meses"
 bfl_venture_duration_6: "Duración · 6 meses"
 bfl_venture_duration_60: "Duración · 60 meses"
 bfl_venture_duration_tip: "ciclo 6, 12, 24, 60 o 120 meses. Los plazos largos dan cabida a la exploración nativa. La carga se vende después de dos meses si el acceso nativo sigue siendo válido; La carga bloqueada permanece bajo custodia. Los costos de expedición sin el producto de la venta vinculado se cancelan al vencimiento."
 bfl_venture_empty: "No hay emprendimientos activos. Seleccione una operación de carga o expedición nativa antes de ofrecer términos."
 bfl_venture_help: "Haga clic en un término para realizar el ciclo. Cada operador acepta por separado. Los acuerdos existentes continúan después de un cambio de política o investigación."
 bfl_venture_hint: "Coloca el cursor sobre actividad, costos, carga y devoluciones."
 bfl_venture_locked: "Nuevas empresas bloqueadas · coloque el cursor para ver los requisitos"
 bfl_venture_note: "El capital se recupera antes que las ganancias. Las pérdidas siguen a las contribuciones. Sólo la carga adquirida por la operación mencionada puede financiar sus ganancias. El comercio no relacionado nunca paga este acuerdo. El descubrimiento por sí solo no paga nada. Las filas cerradas permanecen hasta que sean reemplazadas por un acuerdo recientemente aceptado."
 bfl_venture_offer_desc: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_bank').GetCountry.GetName] ofertas [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_ticket').GetValue|0] oro para [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_duration').GetValue|0] meses. Preestablecido [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_preset').GetValue|0]: 0 = el inversor financia todo el capital, recibe 75% de excedente; 1 = el inversor aporta dos tercios, el operador un tercio, el excedente se divide en partes iguales. Primero se recupera el capital; las pérdidas siguen a las contribuciones. Sólo los ingresos reales de la venta de la operación mencionada pueden generar ganancias. El éxito de la exploración otorga una oportunidad, nunca oro. Esta oferta vence en tres meses."
 bfl_venture_offer_desc_0: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_bank').GetCountry.GetName] autoriza hasta [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_ticket').GetValue|0] oro de la financiación bancaria para [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_duration').GetValue|0] meses. comprar 10 [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_good').Goods.GetNameWithNoTooltip] en [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_from').GetMarket.GetName], llevarlos durante dos meses y luego venderlos en [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_to').GetMarket.GetName]. El banco financia todos los costos y recibe 75% de excedente.\n\nSólo se extraen los costos nativos reales. Los fondos no utilizados permanecen en el banco. El capital se recupera antes que el excedente; las pérdidas siguen a las contribuciones. Sólo los ingresos medidos por la venta de esta carga resuelven este acuerdo. Los ingresos no relacionados y el descubrimiento no pagan nada. La oferta vence en tres meses."
 bfl_venture_offer_desc_1: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_bank').GetCountry.GetName] autoriza hasta [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_ticket').GetValue|0] oro de la financiación bancaria para [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_duration').GetValue|0] meses. comprar 10 [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_good').Goods.GetNameWithNoTooltip] en [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_from').GetMarket.GetName], llevarlos durante dos meses y luego venderlos en [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_to').GetMarket.GetName]. El banco financia dos tercios de los costes; pagas un tercio. El excedente se divide en partes iguales.\n\nSólo se extraen los costos nativos reales. Los fondos no utilizados permanecen en el banco. El capital se recupera antes que el excedente; las pérdidas siguen a las contribuciones. Sólo los ingresos medidos por la venta de esta carga resuelven este acuerdo. Los ingresos no relacionados y el descubrimiento no pagan nada. La oferta vence en tres meses."
 bfl_venture_offer_desc_2: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_bank').GetCountry.GetName] autoriza hasta [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_ticket').GetValue|0] oro de la financiación bancaria para [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_duration').GetValue|0] meses. Preparar la exploración nativa de [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_area').GetArea.GetName] de [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_port').GetLocation.GetName] con [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_explorer').GetCharacter.GetName]. El banco financia todos los costos de oro acordados y recibe 75% del excedente contractual. La preparación no es reembolsable, incluida la cancelación. Usted proporciona tripulación, mantenimiento local y gastos de expedición opcionales fuera de este acuerdo de financiación. La autorización bancaria restante puede financiar un cargamento de diez unidades de un mercado centrado en el área descubierta o que la bordea, sujeto al acceso local. Sólo las ventas medidas de esa carga, menos los costos registrados de preparación y carga, pueden pagar el excedente contractual. El descubrimiento y el comercio no relacionado no pagan nada. La oferta vence en tres meses. "
 bfl_venture_offer_desc_3: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_bank').GetCountry.GetName] autoriza hasta [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_ticket').GetValue|0] oro de la financiación bancaria para [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_duration').GetValue|0] meses. Preparar la exploración nativa de [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_area').GetArea.GetName] de [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_port').GetLocation.GetName] con [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_explorer').GetCharacter.GetName]. El banco financia dos tercios de los costes del oro acordados; pagas un tercio. El excedente contractual se divide en partes iguales. La preparación no es reembolsable, incluida la cancelación. Usted proporciona tripulación, mantenimiento local y gastos de expedición opcionales fuera de este acuerdo de financiación. La autorización bancaria restante puede financiar un cargamento de diez unidades de un mercado centrado en el área descubierta o que la bordea, sujeto al acceso local. Sólo las ventas medidas de esa carga, menos los costos registrados de preparación y carga, pueden pagar el excedente contractual. El descubrimiento y el comercio no relacionado no pagan nada. La oferta vence en tres meses. "
