 bfl_venture_preset_0: "unilateral · 75% superávit bancario"
 bfl_venture_preset_1: "Bilateral · superávit igual"
 bfl_venture_preset_tip: "Unilateral: el banco financia todo el capital y recibe 75% de excedente. Bilateral: fondos bancarios dos tercios, operador un tercio, excedente dividido en partes iguales. Las pérdidas siguen a las aportaciones de capital."
 bfl_venture_settings_tip: "Ampliar los términos propuestos. Los cambios afectan únicamente a ofertas futuras; Los proyectos aceptados mantienen su acuerdo original."
 bfl_venture_state_1: "Activo · capital en riesgo"
 bfl_venture_state_2: "Cerrado · capital recuperado"
 bfl_venture_state_3: "Cerrado · pérdida reconocida"
 bfl_venture_state_4: "No financiado · ejecución no disponible"
 bfl_venture_subtitle: "Actividades nombradas · costos y ventas medidos"
 bfl_venture_ticket_100: "Límite de financiación · 100 oro"
 bfl_venture_ticket_200: "Límite de financiación · 200 oro"
 bfl_venture_ticket_400: "Límite de financiación · 400 oro"
 bfl_venture_ticket_tip: "Ciclo de una autorización bancaria máxima de 100, 200 o 400 oro. Sólo se extrae el costo real de la actividad. Los fondos de carga no utilizados se liberan de inmediato; Los fondos de expedición no utilizados permanecen reservados para una carga elegible en el área descubierta hasta el vencimiento. Los términos bilaterales requieren capacidad para la mitad de la autorización bancaria del operador."
 bfl_venture_title: "Commenda emprendimientos"
 bfl_ventures: "Emprendimientos y empresas · Inversión en el Extranjero"
 bfl_ventures_explanation: "Commenda comienza en Discovery; Las empresas nativas y el capital social de las empresas requieren una reforma. El control político y la propiedad financiera permanecen separados. El capital del proyecto no es un dividendo."
 bfl_ventures_tip: "#T Emprendimientos y empresas#!\nPermisos para proyectos financiados, inversiones de empresas, seguridad de proyectos y transferencias bancarias de acciones. Estos exponen el capital al riesgo de inversión y requieren la investigación y especialización pertinentes."
