 bfl_request_public_support_command: "$bfl_request_public_support$"
 bfl_request_public_support_command_desc: "$bfl_request_public_support_desc$"
 bfl_request_public_support_desc: "Solicitar un 75-anticipo de oro contra su financiado 100-billete de oro de un tercer banco. El administrador del prestamista en vivo revisa la solicitud; la aceptación vuelve a verificar a todas las partes y la garantía. No se requiere Sucursal Bancaria entre bancos."
 bfl_request_public_support_effect_text: "$bfl_request_public_support$"
 bfl_request_public_support_effect_text_past: "$bfl_request_public_support$"
 bfl_request_public_support_tip: "Elija un prestamista autorizado con respaldo financiero público y su Banco Central de capital soberano completo. Su actual gerente debe dar su consentimiento. el 75-El anticipo garantizado con oro utiliza efectivo bancario y cobra al menos 9% anualmente; no crea ninguna garantía ni recapitalización."
 bfl_reserves: "efectivo reservado"
 bfl_reserves_tip: "Efectivo guardado para depósitos y pagos prometidos."
 bfl_resolution_begin_command: "Comenzar resolución"
 bfl_resolution_begin_command_tip: "La resolución ordenada congela nuevos compromisos y distribuciones. Las reservas monetarias y de custodia segregadas permanecen protegidas; los depósitos comparten el efectivo disponible proporcionalmente antes de los atrasos en gastos y el capital. Los acreedores faltantes conservan sus derechos. Los términos voluntarios requieren el consentimiento actual del acreedor y la reestructuración de deuda Renaissance. Una garantía pública cubre 50% de pérdidas de depósitos aceptados, hasta 100 oro en total, financiado por su soberano registrado; Las llamadas impagas quedan pendientes. El cierre requiere que se liquiden todas las obligaciones y activos no monetarios. Las fincas cerradas no pueden reabrir."
 bfl_resolution_call_command: "Pago pendiente de garantía"
 bfl_resolution_call_command_tip: "La resolución ordenada congela nuevos compromisos y distribuciones. Las reservas monetarias y de custodia segregadas permanecen protegidas; los depósitos comparten el efectivo disponible proporcionalmente antes de los atrasos en gastos y el capital. Los acreedores faltantes conservan sus derechos. Los términos voluntarios requieren el consentimiento actual del acreedor y la reestructuración de deuda Renaissance. Una garantía pública cubre 50% de pérdidas de depósitos aceptados, hasta 100 oro en total, financiado por su soberano registrado; Las llamadas impagas quedan pendientes. El cierre requiere que se liquiden todas las obligaciones y activos no monetarios. Las fincas cerradas no pueden reabrir."
 bfl_resolution_close_command: "Cerrar finca"
 bfl_resolution_close_command_tip: "La resolución ordenada congela nuevos compromisos y distribuciones. Las reservas monetarias y de custodia segregadas permanecen protegidas; los depósitos comparten el efectivo disponible proporcionalmente antes de los atrasos en gastos y el capital. Los acreedores faltantes conservan sus derechos. Los términos voluntarios requieren el consentimiento actual del acreedor y la reestructuración de deuda Renaissance. Una garantía pública cubre 50% de pérdidas de depósitos aceptados, hasta 100 oro en total, financiado por su soberano registrado; Las llamadas impagas quedan pendientes. El cierre requiere que se liquiden todas las obligaciones y activos no monetarios. Las fincas cerradas no pueden reabrir."
 bfl_resolution_guarantee_command: "Autorizar garantía"
 bfl_resolution_guarantee_command_tip: "La resolución ordenada congela nuevos compromisos y distribuciones. Las reservas monetarias y de custodia segregadas permanecen protegidas; los depósitos comparten el efectivo disponible proporcionalmente antes de los atrasos en gastos y el capital. Los acreedores faltantes conservan sus derechos. Los términos voluntarios requieren el consentimiento actual del acreedor y la reestructuración de deuda Renaissance. Una garantía pública cubre 50% de pérdidas de depósitos aceptados, hasta 100 oro en total, financiado por su soberano registrado; Las llamadas impagas quedan pendientes. El cierre requiere que se liquiden todas las obligaciones y activos no monetarios. Las fincas cerradas no pueden reabrir."
 bfl_resolution_heading: "Resolución y recuperación de acreedores"
 bfl_resolution_heading_tip: "Resolución financiera persistente; las recuperaciones de efectivo y los cambios consensuados se registran por separado de las ganancias."
 bfl_resolution_help: "Reservas garantizadas y de custodia → depósitos proporcionales → atrasos de gastos → accionistas residuales. Los reclamos sobreviven a los déficits y a la pérdida de autoridad de originación. Ingrese la resolución antes de ofrecer los términos."
 bfl_resolution_liquidate_command: "Obtener los activos disponibles"
 bfl_resolution_liquidate_command_tip: "Vender inventario nativo accesible y libre de cargas y cobrar depósitos, facturas y pagarés vencidos a través de sus servicios existentes. Los ingresos reales financian la cascada de recuperación. Las posiciones no disponibles o inmaduras permanecen registradas; ningún valor en libros se convierte en oro."
 bfl_resolution_next_command: "Próxima cuenta de depósito"
 bfl_resolution_next_command_tip: "Ciclo de cuentas de depósito activas. Los acreedores patrimoniales requieren su Mandato de Solución promulgado antes de que su gobierno pueda aceptar términos voluntarios. Los pagos regresan a la tesorería registrada o a la billetera patrimonial."
 bfl_resolution_notice_acknowledge: "Reconocer el resultado final."
 bfl_resolution_notice_desc: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_notice_bank').GetCountry.GetName] ha cerrado sus operaciones financieras.\n\nRecuperaciones de depósitos pagados: [ROOT.GetCountry.MakeScope.GetVariable('bfl_notice_bank').GetCountry.MakeScope.GetVariable('bfl_resolution_paid').GetValue|2]@gold!\nPérdidas de depósitos consentidas: [ROOT.GetCountry.MakeScope.GetVariable('bfl_notice_bank').GetCountry.MakeScope.GetVariable('bfl_resolution_waived').GetValue|2]@gold!\nPérdidas legales registradas: [ROOT.GetCountry.MakeScope.GetVariable('bfl_notice_bank').GetCountry.MakeScope.GetVariable('bfl_resolution_statutory_loss').GetValue|2]@gold!\n\nLas pérdidas registradas son importes impagos, no recuperaciones ni nuevos ingresos. La propiedad histórica y el patrimonio final permanecen registrados; la institución cerrada no puede reabrir."
 bfl_resolution_notice_title: "Resolución bancaria cerrada"
 bfl_resolution_offer_command: "Ofrecer condiciones al acreedor"
 bfl_resolution_offer_command_tip: "La resolución ordenada congela nuevos compromisos y distribuciones. Las reservas monetarias y de custodia segregadas permanecen protegidas; los depósitos comparten el efectivo disponible proporcionalmente antes de los atrasos en gastos y el capital. Los acreedores faltantes conservan sus derechos. Los términos voluntarios requieren el consentimiento actual del acreedor y la reestructuración de deuda Renaissance. Una garantía pública cubre 50% de pérdidas de depósitos aceptados, hasta 100 oro en total, financiado por su soberano registrado; Las llamadas impagas quedan pendientes. El cierre requiere que se liquiden todas las obligaciones y activos no monetarios. Las fincas cerradas no pueden reabrir."
 bfl_resolution_pay_command: "Recuperación de pago"
 bfl_resolution_pay_command_tip: "La resolución ordenada congela nuevos compromisos y distribuciones. Las reservas monetarias y de custodia segregadas permanecen protegidas; los depósitos comparten el efectivo disponible proporcionalmente antes de los atrasos en gastos y el capital. Los acreedores faltantes conservan sus derechos. Los términos voluntarios requieren el consentimiento actual del acreedor y la reestructuración de deuda Renaissance. Una garantía pública cubre 50% de pérdidas de depósitos aceptados, hasta 100 oro en total, financiado por su soberano registrado; Las llamadas impagas quedan pendientes. El cierre requiere que se liquiden todas las obligaciones y activos no monetarios. Las fincas cerradas no pueden reabrir."
 bfl_resolution_resume_command: "Reanudar después de la recuperación"
 bfl_resolution_resume_command_tip: "La resolución ordenada congela nuevos compromisos y distribuciones. Las reservas monetarias y de custodia segregadas permanecen protegidas; los depósitos comparten el efectivo disponible proporcionalmente antes de los atrasos en gastos y el capital. Los acreedores faltantes conservan sus derechos. Los términos voluntarios requieren el consentimiento actual del acreedor y la reestructuración de deuda Renaissance. Una garantía pública cubre 50% de pérdidas de depósitos aceptados, hasta 100 oro en total, financiado por su soberano registrado; Las llamadas impagas quedan pendientes. El cierre requiere que se liquiden todas las obligaciones y activos no monetarios. Las fincas cerradas no pueden reabrir."
 bfl_review_trade: "Revisar el comercio"
 bfl_review_trade_tip: "Revisar las unidades seleccionadas y pago exacto. Una venta debe redondearse al menos a 0.01 oro; aumente la cantidad si la revisión no está disponible. No se gasta ningún diplomático hasta que se establezca un acuerdo comercial válido."
 bfl_safeguards_title: "Liquidez y salvaguardias"
 bfl_safeguards_title_tip: "#T Liquidez y salvaguardias#!\nEfectivo bancario disponible: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_free_cash')|2]@gold!\nRequisito de efectivo protegido: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_protected_cash')|2]@gold!\nRetiros en cola: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_withdrawals_due')|2]@gold!\n\nLa recapitalización suministra capital estatal. La suspensión de los depósitos detiene la financiación de nuevas cuentas y al mismo tiempo preserva las obligaciones existentes."
 bfl_sale_unavailable: "La orden de acciones no se pudo liquidar"
 bfl_sale_unavailable_desc: "El emisor tiene un tiempo de reutilización comercial de un mes, usted carece de un diplomático, su cotización expiró o las acciones, los fondos o el acceso a la bolsa disponibles cambiaron. Vuelva a abrir Comprar o Vender acciones para obtener una nueva cotización. No se movió efectivo ni acciones."
 bfl_secured_liquidity: "Liquidez asegurada"
 bfl_secured_liquidity_tip: "#T Liquidez asegurada#!\nAbsolutismo, Líneas de Garantía y Liquidez. avance 75 oro contra un fondo financiado por separado 100-billete de oro de un tercer banco. La garantía se bloquea una vez. La tasa anual fija aceptada se divide por 12. No se requiere sucursal entre bancos."
 bfl_security_bank_results: "Último cierre bancario"
 bfl_security_financial_heading: "Posición financiera tangible"
 bfl_security_financial_subtitle: "¿Qué respalda el precio de las acciones?"
 bfl_security_financial_title: "Equidad de [Country.GetName]"
 bfl_security_price_heading: "Precio de las acciones y propiedad"
 bfl_security_price_math: "Precio de mercado = NAV tangible por acción × prima de mercado mensual. La presión de las órdenes, la volatilidad, la reversión a la media y las dificultades pueden cambiar esa prima. El capital primario sigue cotizando al NAV; Las ganancias no realizadas no financian préstamos ni dividendos."
 bfl_security_primary_note: "Los dividendos reducen el efectivo y el NAV una vez. El nuevo capital tiene un precio NAV y no crea ninguna señal de presión de compra. Las suscripciones se suspenden mientras la oferta de reventa del distribuidor excede el valor liquidativo, lo que impide obtener una ganancia inmediata garantizada. La historia contiene observaciones reales; La recarga no vuelve a lanzar una descarga mensual guardada."
 bfl_select_buy_shares: "Comprar acciones de bancos y empresas"
 bfl_select_profile: "Elige especialización pendiente"
 bfl_select_profile_tip: "#T Especialización bancaria#!\nAbra la opción de especialización si este banco aún no ha elegido un perfil permanente. Las finanzas mercantiles y las inversiones extranjeras abren diferentes caminos de investigación. Una especialización completada no puede ser reemplazada por este botón."
 bfl_select_sell_shares: "Vender acciones de su propiedad"
 bfl_selector_next: "próximos bancos"
 bfl_selector_previous: "Bancos anteriores"
 bfl_sell_confirm_desc: "Vender [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_quantity').GetValue|3] acciones de [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_issuer').GetCountry.GetName] para [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_total').GetValue|2]@gold!. El creador de mercado oculto garantiza esta venta, incluido el diferencial de negociación cotizado, mientras la cotización sea válida. Las acciones abandonan su cartera inmediatamente; Antecedentes Las compras de IA no retrasan el pago. Los ingresos van a la tesorería de su banco. La liquidación consume un diplomático e inicia el tiempo de reutilización de compra/venta de un mes de este emisor."
 bfl_sell_confirm_title: "Confirmar venta de acciones instantánea"
 bfl_sell_shares: "Vender acciones"
 bfl_sell_shares_desc: "Elija una de sus participaciones y una cantidad. El creador de mercado oculto compra inmediatamente sus acciones a la cotización de mercado menos el diferencial mostrado por el distribuidor. Los bancos de IA compran su inventario en segundo plano."
 bfl_sell_shares_tip: "Elija una de sus participaciones y una cantidad. El creador de mercado oculto compra inmediatamente sus acciones a la cotización de mercado menos el diferencial mostrado por el distribuidor. Los bancos de IA compran su inventario en segundo plano.\nRequiere un intercambio completo, negociación de acciones y al menos un diplomático. Cada operación exitosa consume un diplomático y comienza un tiempo de reutilización de un mes para ese emisor. Diplomáticos disponibles: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bfl_available_trade_diplomats')|2]. Los pedidos deben tener un valor en efectivo de al menos 0.01 oro."
 bfl_sell_state_confirm_desc: "Vender [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_quantity').GetValue|3] acciones de la participación de su tesorería en [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_issuer').GetCountry.GetName] para [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_total').GetValue|2]@gold!, pagado al tesoro de su país. El banco no recibe financiación y las acciones emitidas no cambian. El distribuidor oculto garantiza la cotización mostrada, incluido el diferencial del distribuidor cotizado. La liquidación consume un diplomático e inicia un tiempo de reutilización de compra/venta de un mes para este emisor. La autoridad monetaria de su estatuto permanece con usted."
