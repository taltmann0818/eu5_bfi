 bfl_strategy_credit: "Última revisión: crédito ofrecido por consentimiento"
 bfl_strategy_delegated: "Mandato de inversión · delegado"
 bfl_strategy_deposit: "Última reseña: 100 oro colocado bajo demanda"
 bfl_strategy_disable: "Gestionar inversiones"
 bfl_strategy_disable_tip: "Detén las compras automáticas de préstamos, las ofertas de nuevas estrategias y las colocaciones a la vista. Se siguen pagando los préstamos, depósitos y reclamaciones en espera existentes. Las políticas de bienes, acciones y sucursales permanecen separadas."
 bfl_strategy_enable: "Delegar inversiones"
 bfl_strategy_enable_tip: "Autorizar compras puntuadas de préstamos, créditos y ofertas de carga locales existentes a contrapartes de IA elegibles, y colocaciones de demanda de exceso de efectivo. La baja liquidez puede incluir un bono soberano en propiedad en 98% de cara; una reventa aceptada puede generar una pérdida. Cargo utiliza sus Términos actuales y el consentimiento ordinario y la liquidación física. El endeudamiento soberano, los dividendos, los bienes y la autoridad monetaria mantienen sus políticas separadas. Nuevos negocios se detienen en resolución."
 bfl_strategy_idle: "Última revisión: liquidez retenida"
 bfl_strategy_manual: "Mandato de inversión · manual"
 bfl_strategy_recall: "Última revisión: recuperación de depósito solicitada"
 bfl_strategy_resale: "Última revisión: se ofrece un bono en propiedad para obtener liquidez"
 bfl_strategy_secondary_statement: "Compras automáticas de préstamos nativos: [Country.MakeScope.GetVariable('bfl_strategy_takeovers').GetValue|0] · Cotizaciones de reventa de bonos: [Country.MakeScope.GetVariable('bfl_strategy_resales').GetValue|0]"
 bfl_strategy_secondary_tip: "Las compras de préstamos existentes revisan como máximo doce clientes de sucursales de capital completadas. El prestatario necesita liquidez, paz, un presupuesto no negativo y al menos 0.50 solvencia. Las compras retienen 100 efectivo libre, limitar la prima de adquisición a 25% del principal restante y la exposición total del prestatario al 25% de equidad. El margen mensual esperado debe ser al menos 0.10 oro después de la prima, una asignación por servicios y costos de financiación conservadores. Esta es una estimación; el pago anticipado y el impago aún pueden causar pérdidas. La baja liquidez puede cotizar un bono soberano en propiedad a 98% de cara a través de una Bolsa de Valores completada. No se registran ingresos de reventa antes del consentimiento del comprador financiado."
 bfl_strategy_statement: "Revisiones mensuales: [Country.MakeScope.GetVariable('bfl_strategy_reviewed').GetValue|0]/12  · Puntuación: [Country.MakeScope.GetVariable('bfl_strategy_score').GetValue|2]\nOfertas de crédito: [Country.MakeScope.GetVariable('bfl_strategy_offers').GetValue|0]  · Depósitos realizados: [Country.MakeScope.GetVariable('bfl_strategy_placements').GetValue|0]  · Recuerda: [Country.MakeScope.GetVariable('bfl_strategy_recalls').GetValue|0]"
 bfl_strategy_title: "Mandato de inversión"
 bfl_strategy_title_tip: "Un mandato mensual conservador. Revise hasta doce candidatos de crédito, doce operadores de riesgo conectados con cuatro mercados emisores cada uno o doce bancos de depósito. Como máximo una oferta de crédito, oferta de carga o 100-Colocación de demanda de oro mensualmente. Las ofertas de crédito y carga se enfrían durante tres meses. La carga requiere un margen cotizado de al menos 10% y un excedente de banco de oro, retiene 500 efectivo gratis, y tiene un límite de dos acuerdos activos y 25% equidad. Las cotizaciones pueden cambiar; las pérdidas siguen siendo posibles. Se siguen aplicando los permisos de efectivo protegido, investigación, sucursales y perfiles."
 bfl_strategy_venture: "Última revisión: asociación de carga ofrecida para consentimiento"
 bfl_streamline_bank: "Agilizar la administración · 100 oro"
 bfl_streamline_bank_tip: "pagar 100 oro estatal una vez para reducir los gastos operativos fijos del banco en 10%. La reforma de los estatutos, la Banca y la Compensación Avanzada prevén reducciones adicionales. Esta decisión no genera beneficios bancarios."
 bfl_subscribe_bank: "Suscríbete 100 oro del capital bancario"
 bfl_subscribe_bank_act: "$bfl_subscribe_bank$"
 bfl_subscribe_bank_desc: "Financiado con su propia tesorería después de verificaciones de perfil, edad, investigación y registro. El capital no es beneficio bancario. Una suscripción de capital bancaria compra participaciones a su valor liquidativo actual."
 bfl_subscribe_bank_effect_text: "$bfl_subscribe_bank$"
 bfl_subscribe_bank_effect_text_past: "$bfl_subscribe_bank$"
 bfl_suspend_command: "Suspender nuevos depósitos"
 bfl_suspend_command_tip: "#T Suspender nuevos depósitos#!\nDeje de aceptar nuevos depósitos y acciones de financiación que requieran la aceptación de depósitos. Las cuentas existentes, las obligaciones de intereses y las solicitudes de retiro permanecen registradas. Este control no cierra el banco ni perdona sus deudas."
 bfl_term_accept: "Acepta estos términos fijos"
 bfl_term_amount: "Depósito a plazo"
 bfl_term_amount_desc: "Elige cuánto depositar. Los depósitos a plazo tienen una duración de doce meses."
 bfl_term_amount_tip: "Elige un banco y un importe. Mueva el efectivo de la tesorería a una cuenta. Los intereses y retiros pertenecen al depositante. El banco verifica los fondos y los términos nuevamente cuando usted confirma."
 bfl_term_decline: "Mantener la cuenta existente"
 bfl_term_deposit: "Depósito a Plazo"
 bfl_term_deposits_desc: "Los comerciantes no siempre pueden emplear su dinero a la vez. Al confiarlo a una casa bancaria por un plazo acordado, le dan al banquero una fuente de capital más estable y reciben una compensación por ceder el acceso inmediato a sus fondos."
 bfl_term_offer_1_desc: "Renueva tu madurado [ROOT.GetCountry.MakeScope.GetVariable('bfl_deposit_offer_principal').GetValue|2] capital de oro para 12 meses en [ROOT.GetCountry.MakeScope.GetVariable('bfl_deposit_offer_rate').GetValue|%1] anualmente. Los intereses acumulados se deben pagar por separado. No se transfiere ningún nuevo principal. Esta oferta vence a fin de mes; Los reclamos modificados requieren una nueva oferta."
 bfl_term_offer_1_title: "Renovar depósito a plazo vencido"
 bfl_term_offer_2_desc: "Poner en cola un retiro anticipado de [ROOT.GetCountry.MakeScope.GetVariable('bfl_deposit_offer_principal').GetValue|2] capital de oro después de cancelar [ROOT.GetCountry.MakeScope.GetVariable('bfl_deposit_offer_penalty').GetValue|2] oro de intereses acumulados (como máximo 1% del principal). No se aplica ninguna pena principal. La escasez de efectivo sigue adeudada en la cola de retiros. Esta oferta vence a fin de mes; Los reclamos modificados requieren una nueva oferta."
 bfl_term_offer_2_title: "Oferta de retiro anticipado"
 bfl_term_service_1: "Renovar la primera cuenta a plazo vencida"
 bfl_term_service_1_act: "$bfl_term_service_1$"
 bfl_term_service_1_desc: "Solicite una oferta de servicio a plazo en el banco seleccionado. La aceptación preserva los créditos pendientes de pago y vuelve a verificar la generación del lote."
 bfl_term_service_1_effect_text: "$bfl_term_service_1$"
 bfl_term_service_1_effect_text_past: "$bfl_term_service_1$"
 bfl_term_service_1_tip: "Selecciona su primer lote a plazo elegible. El banco presenta términos fijos para su aceptación explícita. La renovación requiere permisos vigentes de admisión y término; la salida anticipada y el retiro maduro siguen estando disponibles después de la pérdida de relaciones o autoridad. Las cotizaciones modificadas o vencidas no se pueden ejecutar."
 bfl_term_service_2: "Solicitar retiro anticipado"
 bfl_term_service_2_act: "$bfl_term_service_2$"
 bfl_term_service_2_desc: "Solicite una oferta de servicio a plazo en el banco seleccionado. La aceptación preserva los créditos pendientes de pago y vuelve a verificar la generación del lote."
