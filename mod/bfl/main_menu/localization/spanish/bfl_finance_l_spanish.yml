 bfl_facility_0: "Instalación apagada"
 bfl_facility_0_definition: "Desactivado: no hay préstamo automático. Aún puedes pedir prestado manualmente."
 bfl_facility_0_short: "Apagado"
 bfl_facility_0_tip: "Desactivar el mandato de línea de crédito permanente. No se solicita financiación bancaria programada. Las obligaciones existentes siguen siendo pagaderas."
 bfl_facility_1: "Primera línea de deuda"
 bfl_facility_1_definition: "Gastos: pedir prestado hasta 60% del gasto estatal previsto cada mes, independientemente del saldo de efectivo del estado. La financiación se detiene en el límite mensual compartido, la capacidad de endeudamiento y los límites de efectivo y capital bancario."
 bfl_facility_1_short: "Gastos"
 bfl_facility_1_tip: "Solicite financiación de bonos personalizada para 60% del gasto mensual previsto, dentro de un período compartido 1,000 límite mensual de oro. Omitir sorteos cuando llegue el efectivo estatal 500 oro o el banco o emisor carece de capacidad."
 bfl_facility_2: "Instalación de amortiguación"
 bfl_facility_2_definition: "Reserva de efectivo: pedir prestado lo suficiente para que el efectivo estatal previsto alcance 200 ducados. La financiación se detiene en el límite mensual compartido, la capacidad de endeudamiento y los límites de efectivo y capital bancario."
 bfl_facility_2_short: "reserva de efectivo"
 bfl_facility_2_tip: "Solicite financiamiento de bonos personalizado para 200 oro estatal después del saldo previsto, dentro de un compartido 1,000 límite mensual de oro. Las solicitudes sin financiación no generan deuda ni efectivo."
 bfl_facility_reason_1: "#O Verifique la investigación, el acceso a sucursales, los ingresos del emisor y la capacidad de los cupones.#!"
 bfl_facility_reason_2: "#O El efectivo protegido deja fondos bancarios líquidos insuficientes.#!"
 bfl_facility_reason_3: "#O El nuevo reclamo excedería el margen de capital del banco.#!"
 bfl_facility_reason_4: "#O Las obligaciones soberanas combinadas han alcanzado la capacidad de endeudamiento del emisor.#!"
 bfl_facility_reason_5: "#O Los cupones soberanos impagos bloquean nuevas emisiones.#!"
 bfl_facility_reason_6: "#O El soberano ya emitió un bono este mes.#!"
 bfl_facility_reason_7: "#O Todos los récords de bonos soberanos están ocupados.#!"
 bfl_facility_tip: "El efectivo bancario realmente recibió de la emisión de bonos soberanos personalizados este mes. El financiamiento crea deuda y está excluido de los ingresos del trabajo."
 bfl_facility_title: "Financiamiento mensual"
 bfl_facility_title_tip: "#T Mandato de línea de crédito#!\nEl banco financia bonos soberanos personalizados con cupones anuales fijos. Off detiene los problemas programados. Primeras solicitudes de deuda 60% del gasto previsto. Objetivos de búfer 200 oro estatal después del balance mensual previsto. Ambos se detienen en 500 oro del estado.\n\nÚltima solicitud: [Country.MakeScope.GetVariable('bfl_facility_requested').GetValue|2]@gold!\nÚltima financiación: [Country.MakeScope.GetVariable('bfl_facility_paid').GetValue|2]@gold!\n\nLos sorteos manuales y automáticos comparten un 1,000 límite mensual de oro. El efectivo bancario protegido, el capital, la capacidad del emisor y los cupones impagos pueden evitar un empate. Los ingresos son financiación, no ingresos."
 bfl_feedback_1: "Capital social recibido"
 bfl_feedback_2: "Depósito recibido"
