 bfl_goods_policy_contracts_0: "Contratos · Sólo spot"
 bfl_goods_policy_contracts_1: "Contratos · Recibos de oferta"
 bfl_goods_policy_contracts_2: "Contratos · Oferta forward"
 bfl_goods_policy_help: "Haga clic en una configuración para realizar el ciclo. El banco elige bienes y cantidades al cierre mensual. Coloca el cursor sobre cada configuración para conocer sus reglas."
 bfl_goods_policy_mandate_0: "Mandato · En pausa"
 bfl_goods_policy_mandate_1: "Mandato · Automático"
 bfl_goods_policy_mandate_2: "Mandato · Run out"
 bfl_goods_policy_risk_0: "Riesgo · Cauteloso"
 bfl_goods_policy_risk_1: "Riesgo · Equilibrado"
 bfl_goods_policy_risk_2: "Riesgo · Aventurero"
 bfl_goods_policy_turnover_12: "Espera hasta · 12 meses"
 bfl_goods_policy_turnover_24: "Espera hasta · 24 meses"
 bfl_goods_policy_turnover_6: "Espera hasta · 6 meses"
 bfl_goods_previous: "Lotes anteriores"
 bfl_goods_quote_desc: "Cantidad: [ROOT.GetCountry.MakeScope.GetVariable('bfl_goods_quote_quantity').GetValue|3]. Precio: [ROOT.GetCountry.MakeScope.GetVariable('bfl_goods_quote_price').GetValue|2] oro más 1 Tarifa de custodia de oro. Un recibo de almacén posee la mercancía inmediatamente. Un forward físico prefinancia completamente la entrega en tres meses. Ambos requieren bienes respaldados. Costos de almacenamiento 0.1 por mes; la pérdida física es 2% anualmente. Un forward mantiene su cantidad fija: las unidades faltantes se reembolsan prorrateadamente más una compensación igual en garantía del vendedor. La entrega a otro mercado demora dos meses, cuesta 1 oro y pierde 1% de cantidad. Las pérdidas por almacenamiento y transporte reducen la cantidad de recibos. Las partes no válidas o el acceso perdido preservan los bienes y las garantías para su recuperación. Acepte sólo si estos términos le convienen."
 bfl_goods_quote_title: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_goods_quote_type').Goods.GetNameWithNoTooltip] recibo de almacén"
 bfl_goods_set_allocation_tip: "ciclo 0%, 10%, 25% o 50% del efectivo bancario más el costo del inventario propio. El efectivo protegido siempre se retiene. La reducción de la asignación vende posiciones libres accesibles hasta alcanzar el objetivo."
 bfl_goods_set_contracts_tip: "Solo al contado, ofrezca recibos automáticamente u ofrezca reenvíos físicos automáticamente. Las ofertas requieren la antigüedad y la investigación del instrumento, permanecer respaldadas y esperar la aceptación de la contraparte por separado. Las obligaciones aceptadas existentes permanecen protegidas."
 bfl_goods_set_mandate_tip: "Automático: compra y vende bajo tu póliza. En pausa: no hay operaciones discrecionales. Run off: vender inventario gratuito accesible sin reemplazarlo. Los contratos existentes, el almacenamiento y las pérdidas continúan en todos los modos."
 bfl_goods_set_risk_tip: "Cauteloso: obtenga ganancias +10%, detener la pérdida −5%. Equilibrado: +20% / −15%. Aventurero: +35% / −25%. Los límites utilizan cotizaciones de venta nativas contra el costo restante; La ejecución es mensual y los precios pueden moverse."
 bfl_goods_set_turnover_tip: "Período máximo de tenencia: 6, 12 o 24 meses. El banco vende posiciones libres accesibles al vencimiento y elige automáticamente nuevos productos."
 bfl_goods_settings: "Política comercial"
 bfl_goods_settings_tip: "Establecer el mandato, la asignación, los límites de riesgo, el período de tenencia y la política contractual del banco. El banco elige todos los bienes y cantidades en su cierre mensual."
 bfl_goods_tip: "#T Bienes y comercio#!\nInstrumentos de Merchant Finance que involucran inventario, recibos, entrega futura y margen. El permiso registrado no crea bienes ni una ruta comercial; Se requiere ejecución física."
 bfl_goods_trading_locked: "Comercio bloqueado · coloque el cursor para ver los requisitos"
 bfl_goods_transfer_desc: "Precio: [ROOT.GetCountry.MakeScope.GetVariable('bfl_goods_transfer_price').GetValue|2] oro. Cantidad: [ROOT.GetCountry.MakeScope.GetVariable('bfl_goods_transfer_quantity').GetValue|3]. Su pago va al titular actual. La custodia permanece en el banco; Los términos de almacenamiento, deterioro y entrega continúan. La aceptación rechaza cambios de respaldo, titular, generación de lote o precio."
 bfl_goods_transfer_title: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_goods_transfer_type').Goods.GetNameWithNoTooltip] transferencia de recibo"
 bfl_grant_goods_branch: "Ofrecer acceso de custodia a la Aduana"
 bfl_grant_goods_branch_act: "$bfl_grant_goods_branch$"
 bfl_grant_goods_branch_desc: "Revisar ofertas de custodia física, reclamos existentes o un acuerdo voluntario de acceso a la Aduana. Seleccionar un país no mueve dinero."
 bfl_grant_goods_branch_effect_text: "$bfl_grant_goods_branch$"
 bfl_grant_goods_branch_effect_text_past: "$bfl_grant_goods_branch$"
 bfl_history_empty: "La historia comienza en la siguiente liquidación mensual."
 bfl_investment_tab: "Préstamos e inversiones"
 bfl_investment_title: "Préstamo"
 bfl_invite_equity_capital: "Añadir capital social del banco"
 bfl_invite_equity_capital_desc: "Suscríbete 100 oro a [ROOT.GetCountry.MakeScope.GetVariable('bfl_capital_issuer').GetCountry.GetName] de la tesorería o billetera patrimonial seleccionada. El suscriptor recibe nuevas acciones según la cotización del mercado. Las carteras inmobiliarias retienen al menos 25 oro. La propiedad financiera, los dividendos futuros y la dilución siguen a las acciones pagadas."
 bfl_invite_equity_capital_tip: "Elija la tesorería o una billetera inmobiliaria para suscribirse 100 oro al valor liquidativo actual del banco. Las nuevas acciones diluyen a los tenedores existentes; el banco recibe el pago."
 bfl_join_clearing_group: "Únase a un grupo de compensación"
 bfl_join_clearing_group_act: "$bfl_join_clearing_group$"
 bfl_join_clearing_group_command: "$bfl_join_clearing_group$"
 bfl_join_clearing_group_command_desc: "$bfl_join_clearing_group_desc$"
 bfl_join_clearing_group_desc: "Únase a un operador que acepte miembros. Cuatro bancos por grupo; las facturas de pago vencidas casadas se liquidan mediante débito neto financiado. Un miembro corto bloquea el lote sin borrar los reclamos."
 bfl_join_clearing_group_effect_text: "$bfl_join_clearing_group$"
 bfl_join_clearing_group_effect_text_past: "$bfl_join_clearing_group$"
 bfl_join_clearing_group_tip: "Elija un operador de compensación investigado que acepte miembros. Se requieren investigaciones sobre revoluciones, cámara de compensación y compensación avanzada. Hasta cuatro bancos se unen explícitamente; un miembro corto conserva todos los derechos."
 bfl_liabilities_detail_title: "Pasivos de [Country.GetName]"
 bfl_liabilities_label: "Pasivos"
 bfl_liabilities_label_tip: "#T Deuda total#!\nObligaciones registradas en las cuentas del banco. Esto es independiente de los préstamos y bonos locales de su estado.\n\nPrincipal del depósito: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_deposit_principal')|2]@gold!\nIntereses de depósito acreditados: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_deposit_interest')|2]@gold!\nNotas destacadas: [Country.MakeScope.GetVariable('bfl_notes_outstanding').GetValue|2]@gold!\nOtras cuentas por pagar: [Country.MakeScope.GetVariable('bfl_other_payables').GetValue|2]@gold!\nTotales: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_liabilities')|2]@gold!\n\nRetiros en cola de [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_withdrawals_due')|2]@gold! ya forman parte de los derechos de depósito y no se agregan por segunda vez."
 bfl_liquidity_facilities: "Líneas de Liquidez"
 bfl_liquidity_facilities_desc: "Incluso una casa bancaria solvente puede ser incapaz de satisfacer todas las demandas de monedas a la vez. Los anticipos temporales contra activos sólidos pueden cubrir esta escasez, siempre que la asistencia no oculte pérdidas que la institución no pueda soportar."
 bfl_liquidity_warning: "La liquidez bancaria requiere atención"
 bfl_liquidity_warning_desc: "Su banco tiene retiros en cola o capital inadecuado. Economía Abierta → Banca y Finanzas para revisar depósitos y recapitalización."
 bfl_list_selected_bond_01_tip: "Ofrezca este bono a la venta en 98% de su mandante. Requiere Bolsa de Valores, titularidad y sin intereses impagos. El comprador paga al poseedor actual."
