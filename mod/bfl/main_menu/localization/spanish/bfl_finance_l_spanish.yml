 bfl_bond_debt_label: "Deuda pendiente"
 bfl_bond_debt_label_tip: "Capital, interés mensual y espacio para nuevos préstamos."
 bfl_bond_decline_tip: "Conserve el reclamo completo de la fianza existente y sus términos aceptados. Sin movimientos de efectivo."
 bfl_bond_empty: "No hay bonos pendientes. Aquí aparecerá financiación cuando un banco financie una emisión."
 bfl_bond_exchange_note: "Ambas partes necesitan una Bolsa de Valores propia y completa. Los intercambios anticipados otorgados por eventos califican antes de la investigación."
