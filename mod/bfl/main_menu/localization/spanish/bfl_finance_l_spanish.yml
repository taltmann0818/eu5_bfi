 bfl_money_hint: "Pase el cursor sobre reservas, tenedores y liquidación"
 bfl_money_hint_tip: "Los billetes se intercambian en especie por un derecho totalmente reservado. La aceptación es voluntaria. Avance de descuentos 75 oro contra un 100-billete de oro de un tercer banco. La compensación liquida las facturas vencidas coincidentes sólo cuando cada miembro puede pagar su débito neto. Los reclamos existentes sobreviven a la autoridad y los edificios perdidos."
 bfl_money_leave: "dejar claro"
 bfl_money_leave_tip: "Los billetes se intercambian en especie por un derecho totalmente reservado. La aceptación es voluntaria. Avance de descuentos 75 oro contra un 100-billete de oro de un tercer banco. La compensación liquida las facturas vencidas coincidentes sólo cuando cada miembro puede pagar su débito neto. Los reclamos existentes sobreviven a la autoridad y los edificios perdidos."
 bfl_money_lending_rate: "Nueva base de préstamos"
 bfl_money_lending_rate_tip: "Ciclar la base anual para futuros préstamos ordinarios a través de 3%, 6% y 9%. Los ajustes del prestatario aún se aplican. Los préstamos aceptados mantienen sus tasas."
 bfl_money_notes: "adquirir 100 en notas"
 bfl_money_notes_tip: "Requiere investigación sobre absolutismo, banca central y billetes soberanos, autorización soberana viva, sucursal bancaria completa del emisor y banco central soberano completo en la capital actual. 100 oro del tesoro y capacidad de billetes no utilizados. El menor de 25% patrimonio bancario y 500 Circulación de tapas de oro."
 bfl_money_offer_accept: "Financiar el anticipo garantizado"
 bfl_money_offer_accept_tip: "Fondo 75 oro del efectivo disponible del prestamista si el administrador actual, la cotización y la garantía del tercer banco siguen siendo válidos. La tasa anual aceptada es fija para esta instalación; cargos de manutención pública al menos 9%."
 bfl_money_offer_decline: "Rechazar la solicitud"
 bfl_money_offer_decline_tip: "Cierre esta solicitud sin mover oro ni prometer garantías."
 bfl_money_offer_desc: "avance 75 oro contra un fondo financiado por separado 100-billete de oro retenido en un tercer banco. A 25% El corte de pelo protege al prestamista. La tasa de descuento anual aceptada se aplica durante un mes; cargos de manutención pública al menos 9%. La liquidación paga primero al prestamista y devuelve el resto al prestatario. La garantía no financiada preserva ambos reclamos. Esta solicitud vence este mes."
 bfl_money_offer_title: "Una instalación de liquidación segura"
 bfl_money_policy_rate: "Tasa de descuento futura del ciclo"
 bfl_money_policy_rate_tip: "Realice un ciclo de la tasa anual para futuros anticipos garantizados a través de 6%, 9% y 12%. Se cobra un mes al momento de la aceptación; Las instalaciones existentes mantienen su tarifa. Cargos de apoyo público al menos. 9%."
 bfl_money_redeem: "Canjear notas estatales"
 bfl_money_redeem_tip: "Canjear todos los pagarés en poder del controlador soberano por su valor nominal. La pérdida de autoridad, investigación o sucursales no cancela los reclamos existentes. Queda adeudada una reclamación impaga."
 bfl_money_repay: "Reembolso seguro"
 bfl_money_repay_tip: "Pague el anticipo garantizado actual más su tarifa fija aceptada para liberar la prenda de la letra del tercer banco. Requiere suficiente oro disponible."
 bfl_money_revoke: "Revocar autoridad"
 bfl_money_revoke_tip: "Retirar la autorización soberana para nuevos billetes. Los billetes existentes siguen siendo canjeables."
 bfl_money_settings: "Política"
 bfl_money_settings_tip: "Muestre u oculte la política monetaria, la autoridad de notas, el crédito garantizado y los controles de compensación."
 bfl_money_settings_tip_tip: "Los billetes se intercambian en especie por un derecho totalmente reservado. La aceptación es voluntaria. Avance de descuentos 75 oro contra un 100-billete de oro de un tercer banco. La compensación liquida las facturas vencidas coincidentes sólo cuando cada miembro puede pagar su débito neto. Los reclamos existentes sobreviven a la autoridad y los edificios perdidos."
 bfl_money_subtitle: "Reclamaciones rescatables · liquidación financiada"
 bfl_money_subtitle_tip: "Los billetes se intercambian en especie por un derecho totalmente reservado. La aceptación es voluntaria. Avance de descuentos 75 oro contra un 100-billete de oro de un tercer banco. La compensación liquida las facturas vencidas coincidentes sólo cuando cada miembro puede pagar su débito neto. Los reclamos existentes sobreviven a la autoridad y los edificios perdidos."
 bfl_money_terms: "El capital y la emisión están excluidos de los ingresos. Las tasas de descuento son anuales y fijas cuando se aceptan. La confianza cae en 25 por un déficit de reservas; Los billetes totalmente respaldados no añaden inflación. Los pagos vainilla siguen utilizando oro nativo."
 bfl_money_terms_tip: "Los billetes se intercambian en especie por un derecho totalmente reservado. La aceptación es voluntaria. Avance de descuentos 75 oro contra un 100-billete de oro de un tercer banco. La compensación liquida las facturas vencidas coincidentes sólo cuando cada miembro puede pagar su débito neto. Los reclamos existentes sobreviven a la autoridad y los edificios perdidos."
 bfl_money_title: "Dinero y liquidación"
 bfl_money_title_tip: "El capital y la emisión están excluidos de los ingresos. Las tasas de descuento son anuales y fijas cuando se aceptan. La confianza cae en 25 por un déficit de reservas; Los billetes totalmente respaldados no añaden inflación. Los pagos vainilla siguen utilizando oro nativo."
 bfl_native_credit_label: "Cartera de préstamos"
 bfl_native_credit_label_tip: "Préstamos mantenidos por el banco a su valor de adquisición registrado. Las filas muestran el capital, el interés anual y los meses restantes hasta la última revisión."
 bfl_native_tab: "Préstamos estatales"
 bfl_native_takeover: "Adquisición nativa"
 bfl_new_capital_subscription: "Suscríbete nuevo capital"
 bfl_new_capital_subscription_desc: "invertir 100@gold! de los fondos de su banco en [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_issuer').GetCountry.GetName] como acciones de nueva emisión a su NAV tangible. El emisor recibe el pago y los tenedores existentes se diluyen. Se trata de una suscripción de capital, independiente de la compra de acciones. La ejecución vuelve a verificar el NAV capturado, las unidades emitidas, la investigación, los fondos protegidos y el límite de concentración. Consume un diplomático y comienza el enfriamiento comercial de un mes de este emisor."
 bfl_new_capital_subscription_tip: "Financiamiento primario: invertir 100 oro del banco administrado. El emisor recibe efectivo y emite nuevas acciones. Esto es independiente de la negociación de acciones existentes."
 bfl_no_automatic_tribute: "Sin tributo chárter automático"
 bfl_no_automatic_tribute_cost_modifier: "Costo del tributo de fletamento automático"
 bfl_no_bank: "Constituir un banco estatal existente a través de decisiones, o actuar como un país bancario independiente. Su país debe poseer su mercado de capitales para constituir un banco."
 bfl_no_bank_holdings: "No hay acciones en poder del banco."
 bfl_no_bank_short: "Ningún banco autorizado"
 bfl_no_deposit_accounts: "Sin depósitos"
 bfl_nobles_estate_workout_mandate: "Mandato de gestión patrimonial"
 bfl_nobles_estate_workout_mandate_desc: "Este poder autoriza explícitamente a su gobierno a revisar en su nombre las renegociaciones voluntarias de depósitos bancarios. Cada propuesta todavía necesita una aceptación por separado. Revocar este privilegio invalida los términos patrimoniales pendientes. Los pagos de recuperación continúan a la billetera del patrimonio."
 bfl_offer_bank_shares: "Ofrecer nuevas acciones bancarias"
 bfl_offer_bank_shares_tip: "Permitir que otros bancos y países se suscriban 100 oro al valor liquidativo actual del banco. Las nuevas acciones se emiten únicamente cuando están pagadas; los propietarios existentes se diluyen. Siguen siendo necesarios estudios de banca nativa y capital positivo."
 bfl_offer_bond: "Ofrecer un bono soberano en poder de un banco"
 bfl_offer_bond_tip: "Indique el bono en poder del banco más antiguo durante tres meses en 98% de valor nominal. Vender y comprar ambos requiere un edificio de la Bolsa de Valores terminado en propiedad. La aceptación vuelve a verificar al vendedor, titular actual, generación, fondos y vencimiento. Los atrasos bloquean el comercio."
 bfl_offer_bond_workout_01: "Oferta de reestructuración"
 bfl_offer_bond_workout_01_tip: "Pídale a este titular actual que acepte un 20% reducción del principal y de los cupones impagos, y un recorte anual de un punto porcentual en los cupones, con un 1% piso. No se mueve dinero a menos que el titular lo acepte por separado. La cotización vence este mes y los cambios en el reclamo la invalidan."
