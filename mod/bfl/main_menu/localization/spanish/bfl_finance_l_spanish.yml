 bfl_accept_money_claims.desc: "Acepte o deje de aceptar voluntariamente facturas y pagarés totalmente financiados ofrecidos a la par a través de interacciones mod. Una transferencia aún requiere su tesorería disponible. Los reclamos aceptados siguen siendo canjeables una vez cerrada la aceptación. Los pagos nativos siguen utilizando oro."
 bfl_accept_money_claims.title: "Alternar aceptación de reclamaciones de pago bancario"
 bfl_accounts_explanation: "El tesoro nativo es efectivo. Los depósitos y los pagarés son pasivos. Los préstamos intercambian efectivo por un activo; El capital, las suscripciones y las emisiones no generan fines de lucro."
 bfl_activity_title: "Ingreso neto"
 bfl_activity_title_tip: "Las observaciones de los cupones nativos clasifican el presupuesto neto nativo; nunca mueven oro dos veces. Los ingresos del pago nativo liquidados liberan el costo de adquisición real antes de reconocer una ganancia o pérdida. Las distribuciones de la empresa y los recibos financiados personalizados ingresan en sus propios depósitos. Se excluyen de las ganancias el principal, los depósitos y las suscripciones."
 bfl_administer_estates: "Administrar patrimonios financieros heredados"
 bfl_administer_estates.desc: "Revisar el efectivo mantenido por separado y las obligaciones de una institución destruida. La autoridad fiduciaria nunca hace que su efectivo forme parte del tesoro nacional."
 bfl_administer_estates.title: "Administrar patrimonios financieros heredados"
 bfl_administer_estates_desc: "Revisar el efectivo mantenido por separado y las obligaciones de una institución destruida. La autoridad fiduciaria nunca hace que su efectivo forme parte del tesoro nacional."
 bfl_advanced_clearing: "Limpieza avanzada"
 bfl_advanced_clearing_desc: "Las casas bancarias que se deben muchos pagos entre sí no necesitan liquidar cada obligación por separado en monedas. Las cuentas de compensación concilian sus reclamaciones y transfieren sólo el saldo restante, reduciendo el dinero necesario para sostener el comercio."
 bfl_advanced_tip: "La investigación desbloquea el mandato. El banco también debe cumplir con sus requisitos de especialización, liquidez y operación. La ejecución no disponible permanece deshabilitada."
 bfl_ai_equity_offering: "Admitir banco y oferta abierta de capital pagado"
 bfl_ai_equity_offering_desc: "La administración de AI puede admitir su banco real y autorizar suscripciones primarias pagas después de la negociación de acciones y un intercambio completo. No se crean efectivo ni acciones mediante la admisión."
 bfl_ai_equity_purchase: "Considere la inversión en divisas financiada"
 bfl_ai_equity_purchase_desc: "La compra de IA utiliza las mismas verificaciones en vivo de investigación, construcción, autoridad, capacidad y confirmación de cotización exacta que el jugador. Revisión mensual de oportunidades, con al menos 500 oro de efectivo y excedente de capital. No hay preguntas por encima del mercado."
 bfl_ai_exchange_priority: "Priorizar el acceso a la bolsa de valores"
 bfl_annual_dividends: "Tasa de dividendo anual"
