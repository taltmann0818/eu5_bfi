 bfl_custom_bond_terms: "Cupones sobre nuevos bonos"
 bfl_custom_bond_totals: "Destacado: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bfl_bond_debt')|2]@gold! · cupón mensual: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bfl_bond_monthly_coupon')|2]@gold! · no remunerado: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bfl_bond_arrears')|2]@gold!"
 bfl_custom_bonds_title: "Bonos soberanos"
 bfl_custom_bonds_title_tip: "El banco presta dinero en efectivo al Estado y recibe un bono. Su propietario recibe intereses y reembolsos mensuales. El endeudamiento total se limita a 24 meses de ingresos nativos, con un 500-Asignación inicial de oro. El interés de los bonos puede utilizarse como máximo 25% de ingresos nativos. Los intereses impagos bloquean nuevos bonos y ventas."
 bfl_cycle_bond_rate_tip: "Cambiar el interés anual de los nuevos bonos: 1%, 3% o 6%. Los bonos existentes mantienen su tasa."
 bfl_cycle_deposit_rate_tip: "Cambiar interés para nuevos depósitos: 0%, 1% o 2% un año. Las cuentas existentes mantienen su tasa."
 bfl_cycle_facility_tip: "Cambiar financiación mensual: Off, Gastos o Reserva de efectivo. Los fondos de gastos forman parte del gasto estatal. El colchón de efectivo complementa el efectivo estatal. Ambos comparten el límite mensual con el préstamo manual."
 bfl_cycle_payout_tip: "Cambiar dividendos: retener todas las ganancias, pagar 25%, o pagar 50%. Los pagos utilizan las ganancias obtenidas después de costos y pérdidas. Requiere control de la política de dividendos."
 bfl_cycle_share_offering_tip: "Abrir o cerrar nuevas suscripciones de acciones. Las suscripciones pagas añaden capital y nuevas acciones; Los propietarios existentes conservan sus acciones y derechos de dividendos."
 bfl_dealer_inventory_class: "Inventario de creadores de mercado · sin votos"
 bfl_debt: "Cartera de deuda nativa"
 bfl_debt_explanation: "El banco autorizado financia bonos soberanos personalizados. La negociación secundaria requiere Bolsas de Valores completadas en ambos lados, incluidas las subvenciones para eventos anticipados. Native Credit utiliza ofertas aceptadas y alivio de deuda investigado con registros de reclamos persistentes."
 bfl_debt_facility: "Facilidad de deuda"
 bfl_debt_resale: "Reventa de Deuda"
 bfl_debt_resale_tip: "#T Reventa de bonos soberanos#!\nPara vender y comprar bonos soberanos secundarios se necesita un anticipo de la Bolsa y un edificio propio de la Bolsa. Una oferta abierta transfiere el mismo reclamo personalizado para 98% de valor nominal; el emisor no recibe nuevos ingresos. Los cupones y el canje siguen al comprador."
 bfl_debt_restructuring: "Reestructuración de Deuda"
 bfl_debt_restructuring_desc: "Una deuda que no puede cobrarse en el día señalado no tiene por qué carecer de valor. Los acreedores pueden preservar más de sus créditos aceptando nuevos términos que presionando a un deudor en dificultades para que incumpla abiertamente."
 bfl_debt_tip: "#T Deuda y crédito#!\nPermisos para préstamos, suscripción, reestructuración y transferencias de deuda. Cada fila tiene sus propios requisitos de investigación, especialización, liquidez y ejecución. Un bloqueo significa que un nuevo origen no está disponible; no cancela reclamaciones existentes."
 bfl_demand_deposit: "Depósito a la vista"
 bfl_deposit_1: "Depósito 100 oro a pedido"
 bfl_deposit_1_tip: "#T depósito a la vista#!\nTransferir 100 oro estatal a su banco autorizado. Su oferta anual para cuenta nueva es la tarifa base mostrada más un 1% prima de fletamento. El interés a la vista se paga a su tesorería mensualmente cuando se financia, con un depósito de centavos; se siguen adeudando intereses impagos. Las cuentas existentes mantienen su tarifa aceptada. El retiro amortiza el capital y los intereses impagos. Los bancos independientes aceptan depósitos a través de la diplomacia en +50 opinión o mejor y ofrecer la tarifa base."
 bfl_deposit_2: "Depósito 100 oro para 12 meses"
 bfl_deposit_2_tip: "#T Depósito a plazo#!\nTransferir 100 oro estatal a su banco autorizado durante doce meses. Su oferta anual para cuenta nueva es la tasa a plazo mostrada más un 1% prima de fletamento. Los intereses se acumulan mensualmente y se pagan con el capital al vencimiento. Requiere Banca nativa, la edad permitida y un hueco de cuenta gratuito. Las cuentas a plazo independientes están disponibles a través de la diplomacia en +50 opinión o mejor."
 bfl_deposit_accounts_heading: "cuentas de deposito"
 bfl_deposit_amount: "Depósito"
 bfl_deposit_amount_desc: "Elige cuánto depositar. Los depósitos a plazo tienen una duración de doce meses."
 bfl_deposit_amount_label: "Monto del depósito"
 bfl_deposit_amount_tip: "Elige un banco y un importe. Mueva el efectivo de la tesorería a una cuenta. Los intereses y retiros pertenecen al depositante. El banco verifica los fondos y los términos nuevamente cuando usted confirma."
 bfl_deposit_decline_tip: "Conserve el reclamo de depósito completo. No se realizan movimientos de efectivo ni se emiten acciones."
 bfl_deposit_equity_tip: "Convierta el derecho cotizado en acciones reales solo si el banco superviviente tiene un valor liquidativo tangible positivo y capacidad de accionista. No se crean efectivo de suscripción ni ganancias."
 bfl_deposit_explanation: "Cada cuenta almacena su tasa anual fija aceptada. El cambio de tasa afecta a las cuentas nuevas. Las cuentas a plazo vencen después 12 meses. La escasez de retiros sigue siendo un pasivo y suspende nuevos compromisos."
 bfl_deposit_haircut_tip: "Aceptar lo cotizado 20% reducción después de volver a verificar al acreedor, reclamo restante, investigación y autoridad. Una garantía pública registrada sigue financiada por separado."
 bfl_deposit_income_tip: "Exija los intereses pagados este mes por su banco autorizado y por bancos independientes. Se adeudan intereses impagos. Se excluyen los retiros de principal y los aportes de capital."
 bfl_deposit_interest: "Intereses de depósito"
 bfl_deposit_ledger_help: "Cada cuenta mantiene su tasa de interés acordada. Los depósitos a plazo tienen una duración de doce meses. El dinero y los intereses regresan al depositante."
 bfl_deposit_ledger_subtitle: "cuentas corrientes"
 bfl_deposit_ledger_title: "Depositantes"
 bfl_deposit_ledger_title_tip: "¿Quién tiene dinero en este banco? Pase el cursor para inspeccionar cuentas y retiros."
 bfl_deposit_policy_title: "Tasa de depósito"
 bfl_deposit_policy_title_tip: "La tasa anual ofrecida a nuevos depósitos. Los depósitos existentes mantienen la tasa acordada."
 bfl_deposit_total: "Depósitos"
 bfl_deposit_total_tip: "Dinero que el banco debe a sus depositantes, incluidos los intereses impagos."
 bfl_deposits: "Depósitos y tasas"
 bfl_deposits_label: "Reclamaciones de depósito"
 bfl_dev_notice: "El crédito financiado, los bonos soberanos, las inversiones de empresas, los bienes, las recomendaciones y los servicios monetarios siguen sus necesidades de investigación, perfil y construcción. El equilibrio y la compatibilidad de la campaña en toda la versión aún están bajo validación."
 bfl_distress: "Puertas de angustia y desarrollo"
 bfl_distribution_title: "Pago de dividendos"
 bfl_distribution_title_tip: "La parte de la ganancia mensual elegible pagada a los propietarios. El resto se queda en el banco."
 bfl_dividend_breakdown: "dividendos bancarios"
 bfl_dividend_breakdown_subtitle: "Tasa anual y liquidación mensual"
 bfl_dividend_calculation: "Cálculo de dividendo mensual"
 bfl_dividend_explanation: "Utilidad neta mensual después de intereses de depósito, gastos operativos y dividendos de fondos de pérdidas acumuladas. Cada propietario recibe acciones de su propiedad multiplicadas por el pago financiado por acción en circulación. Las ganancias retenidas no se vuelven a distribuir el próximo mes."
 bfl_dividend_rate_note: "La tasa anual son los últimos ingresos mensuales multiplicados por doce, no una promesa. Los costos bancarios incluyen intereses de depósito, costos operativos y pérdidas acumuladas. Cada propietario recibe su parte del pago financiado, redondeado a la baja a ducados y centavos."
 bfl_draw_bond: "pedir prestado 100 del banco"
 bfl_draw_bond_tip: "El banco autorizado paga 100 oro por un bono soberano perpetuo. Se pueden financiar varias emisiones cada mes, hasta 1,000 oro en total. El banco debe mantener suficiente efectivo y capital, y el Estado debe pagar los intereses. Los ingresos son financiación. Devolver el valor nominal a su titular actual para retirarlo."
 bfl_equity_debt: "Capital y deuda bancaria"
 bfl_equity_debt_tip: "#T Patrimonio y deuda bancaria#!\nHasta doce instantáneas reales de liquidación mensual. El verde son activos menos pasivos; El rojo son los pasivos totales del banco. Ambos utilizan el mismo eje del oro escalado automáticamente, incluido el capital negativo. Las muestras van desde la más antigua a la izquierda hasta la más reciente a la derecha. Pase el cursor sobre una muestra para conocer su valor y mes contable. Los préstamos estatales no están incluidos en este historial bancario."
 bfl_equity_detail_title: "Equidad de [Country.GetName]"
 bfl_equity_label: "Equidad"
 bfl_equity_label_tip: "#T Patrimonio bancario#!\nEl valor residual que pertenece a los propietarios del banco después de sus obligaciones.\n\nActivos: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_assets')|2]@gold!\nMenos deuda total: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_liabilities')|2]@gold!\nEquidad: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_equity')|2]@gold!\n\nUnidades de estado registradas: [Country.MakeScope.GetVariable('bfl_state_units').GetValue|2]\nUnidades de propiedad total: [Country.MakeScope.GetVariable('bfl_total_units').GetValue|2]\nMargen de capital: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_capital_headroom')|2]@gold!\n\nEl patrimonio negativo significa insolvencia. El margen de capital está por encima del capital 10% de activos, con un mínimo de cero; Las distribuciones están limitadas tanto por este margen como por el efectivo disponible. El capital no es la cantidad que se puede retirar inmediatamente."
 bfl_equity_market: "Precio e historia de las acciones"
 bfl_equity_subscribe_0: "Hacienda: suscríbete 100 oro"
 bfl_equity_subscribe_0_tip: "Suscripción NAV primaria: paga al emisor y diluye a los tenedores existentes. Las compras de bienes inmuebles utilizan la billetera de bienes raíces, preservando 25 oro. Un inversor bancario utiliza sólo su propio excedente de capital y efectivo protegido; El capital de la empresa requiere una investigación sobre inversiones en el extranjero."
 bfl_equity_subscribe_1: "Burgueses: suscríbete 100 oro"
 bfl_equity_subscribe_1_tip: "Suscripción NAV primaria: paga al emisor y diluye a los tenedores existentes. Las compras de bienes inmuebles utilizan la billetera de bienes raíces, preservando 25 oro. Un inversor bancario utiliza sólo su propio excedente de capital y efectivo protegido; El capital de la empresa requiere una investigación sobre inversiones en el extranjero."
 bfl_equity_subscribe_2: "Nobles: suscríbete 100 oro"
 bfl_equity_subscribe_2_tip: "Suscripción NAV primaria: paga al emisor y diluye a los tenedores existentes. Las compras de bienes inmuebles utilizan la billetera de bienes raíces, preservando 25 oro. Un inversor bancario utiliza sólo su propio excedente de capital y efectivo protegido; El capital de la empresa requiere una investigación sobre inversiones en el extranjero."
 bfl_equity_subscribe_3: "Clero: suscríbete 100 oro"
 bfl_equity_subscribe_3_tip: "Suscripción NAV primaria: paga al emisor y diluye a los tenedores existentes. Las compras de bienes inmuebles utilizan la billetera de bienes raíces, preservando 25 oro. Un inversor bancario utiliza sólo su propio excedente de capital y efectivo protegido; El capital de la empresa requiere una investigación sobre inversiones en el extranjero."
 bfl_equity_subscribe_4: "Campesinos: suscríbete 100 oro"
 bfl_equity_subscribe_4_tip: "Suscripción NAV primaria: paga al emisor y diluye a los tenedores existentes. Las compras de bienes inmuebles utilizan la billetera de bienes raíces, preservando 25 oro. Un inversor bancario utiliza sólo su propio excedente de capital y efectivo protegido; El capital de la empresa requiere una investigación sobre inversiones en el extranjero."
 bfl_equity_vote_payout_0: "Voto mayoritario: 0% pago de dividendos"
 bfl_equity_vote_payout_0_tip: "Requiere más de la mitad de los votos financieros emitidos. Utilidades retenidas de la empresa y política de pagos de bancos independientes únicamente. La política monetaria y de pagos autorizada permanece en manos del controlador aterrizado en vivo. No hay transferencia de sujeto político."
 bfl_equity_vote_payout_25: "Voto mayoritario: 25% pago de dividendos"
 bfl_equity_vote_payout_25_tip: "Requiere más de la mitad de los votos financieros emitidos. Utilidades retenidas de la empresa y política de pagos de bancos independientes únicamente. La política monetaria y de pagos autorizada permanece en manos del controlador aterrizado en vivo. No hay transferencia de sujeto político."
 bfl_equity_vote_payout_50: "Voto mayoritario: 50% pago de dividendos"
 bfl_equity_vote_payout_50_tip: "Requiere más de la mitad de los votos financieros emitidos. Utilidades retenidas de la empresa y política de pagos de bancos independientes únicamente. La política monetaria y de pagos autorizada permanece en manos del controlador aterrizado en vivo. No hay transferencia de sujeto político."
 bfl_equity_vote_reserve_100: "Voto mayoritario: reserva 100, presupuesto comercial 50"
 bfl_equity_vote_reserve_100_tip: "La mayoría de votos económicos podrán elegir la reserva de reinversión de la empresa y el presupuesto comercial. Los mandatos políticos, el señorío nativo, el dinero en efectivo y los derechos de los acreedores existentes permanecen separados."
 bfl_equity_vote_reserve_200: "Voto mayoritario: reserva 200, presupuesto comercial 25"
 bfl_equity_vote_reserve_200_tip: "La mayoría de votos económicos podrán elegir la reserva de reinversión de la empresa y el presupuesto comercial. Los mandatos políticos, el señorío nativo, el dinero en efectivo y los derechos de los acreedores existentes permanecen separados."
 bfl_establish_chartered_bank.a: "Seleccione el banco estatal existente"
 bfl_establish_chartered_bank.desc: "Convertir un banco estatal existente y obtener tradiciones bancarias cuando se complete el estatuto. La inversión actual de 500 / 750 / 1,000 / 1,500 / 2,000 / 3,000 el oro se transfiere a su tesorería como patrimonio estatal. Debes ser dueño de tu mercado de capitales. Seleccione un banco antes de realizar cualquier pago o investigación."
 bfl_establish_chartered_bank.title: "Establecer un banco autorizado por el estado"
 bfl_estate_bond_back: "Regreso a la administración del patrimonio"
 bfl_estate_bond_desc: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_managed_estate').GetCountry.GetName] debe [ROOT.GetCountry.MakeScope.GetVariable('bfl_estate_bond_face').GetValue|2] director y [ROOT.GetCountry.MakeScope.GetVariable('bfl_estate_bond_due').GetValue|2] cupones impagos para [ROOT.GetCountry.MakeScope.GetVariable('bfl_estate_bond_holder').GetCountry.GetName]. La recuperación de efectivo comparte la clase no garantizada con los depósitos. La reducción voluntaria requiere una nueva propuesta y la aceptación explícita de este titular; los pagos o un cambio de administrador invalidan los términos pendientes."
 bfl_estate_bond_next: "Seleccione el siguiente bono"
 bfl_estate_bond_title: "Acreedor de bonos patrimoniales"
 bfl_estate_close_tip: "Cierre permanentemente este patrimonio totalmente liquidado después de volver a verificar todas las obligaciones, derechos no monetarios y propietarios."
 bfl_estate_default_tip: "Finalizar esta institución destruida y agotada: registrar las pérdidas de los acreedores impagos una vez y extinguir los gastos secundarios. Ningún accionista recibe ganancias."
 bfl_estate_deposit_1: "Burgueses: demanda 100"
 bfl_estate_deposit_1_act: "$bfl_estate_deposit_1$"
 bfl_estate_deposit_1_desc: "Coloque oro inmobiliario en una cuenta a la vista agrupada en el banco seleccionado. No se aplica ninguna prima de depósito soberano."
 bfl_estate_deposit_1_effect_text: "$bfl_estate_deposit_1$"
 bfl_estate_deposit_1_effect_text_past: "$bfl_estate_deposit_1$"
 bfl_estate_deposit_1_tip: "Utiliza este fondo de patrimonio, conservando al menos 25 oro de la finca. El capital y los intereses regresan al mismo patrimonio, nunca al tesoro soberano. Se agregan cuentas coincidentes repetidas. La participación de los hogares está representada por estos fondos de patrimonio."
 bfl_estate_deposit_2: "Nobles: demanda 100"
 bfl_estate_deposit_2_act: "$bfl_estate_deposit_2$"
 bfl_estate_deposit_2_desc: "Coloque oro inmobiliario en una cuenta a la vista agrupada en el banco seleccionado. No se aplica ninguna prima de depósito soberano."
 bfl_estate_deposit_2_effect_text: "$bfl_estate_deposit_2$"
 bfl_estate_deposit_2_effect_text_past: "$bfl_estate_deposit_2$"
 bfl_estate_deposit_2_tip: "Utiliza este fondo de patrimonio, conservando al menos 25 oro de la finca. El capital y los intereses regresan al mismo patrimonio, nunca al tesoro soberano. Se agregan cuentas coincidentes repetidas. La participación de los hogares está representada por estos fondos de patrimonio."
