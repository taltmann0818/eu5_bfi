 bfl_offer_commenda: "Financiar una operación de carga"
 bfl_offer_commenda_act: "Financiar una operación de carga"
 bfl_offer_commenda_desc: "Ofrecer capital de riesgo bajo los términos propuestos por el banco. La aceptación compra la carga nombrada a su costo original; la autorización no utilizada permanece en el banco. El capital y la rentabilidad nunca están garantizados."
 bfl_offer_commenda_effect_text: "Financiar una operación de carga"
 bfl_offer_commenda_effect_text_past: "Financiar una operación de carga"
 bfl_offer_commenda_tip: "Discovery o posterior, Overseas Investment e investigación de Commenda. Elija un operador, mercado de origen, destino y mercancías para una carga de diez unidades. La aceptación vuelve a verificar su autoridad, efectivo libre, capital y capacidad. Un acuerdo activo por operador; hasta ocho por banco."
 bfl_offer_credit: "Ofrecer un préstamo financiado"
 bfl_offer_credit_act: "$bfl_offer_credit$"
 bfl_offer_credit_desc: "El prestatario recibe una oferta explícita. No hay cambios en efectivo ni en los términos hasta la aceptación; La ejecución vuelve a verificar la autoridad, el perfil, la investigación y los fondos en vivo."
 bfl_offer_credit_effect_text: "$bfl_offer_credit$"
 bfl_offer_credit_effect_text_past: "$bfl_offer_credit$"
 bfl_offer_credit_tip: "Seleccione una empresa soberana o nativa elegible. Ambos perfiles prestan a soberanos; El crédito empresarial requiere financiación mercantil, reforma y crédito corporativo. El alivio de la deuda también requiere una reestructuración de la deuda renacentista."
 bfl_offer_goods_transfer: "Ofrecer transferencia de recibo de almacén"
 bfl_offer_goods_transfer_act: "$bfl_offer_goods_transfer$"
 bfl_offer_goods_transfer_desc: "Ofrecer el recibo más reciente seleccionado en Ofertas de bienes y reclamos de custodia. El destinatario revisa el precio y la cantidad antes de pagar al titular actual."
 bfl_offer_goods_transfer_effect_text: "$bfl_offer_goods_transfer$"
 bfl_offer_goods_transfer_effect_text_past: "$bfl_offer_goods_transfer$"
 bfl_offer_held_sovereign_bond: "Ofrecer un bono soberano mantenido"
 bfl_offer_held_sovereign_bond_act: "$bfl_offer_held_sovereign_bond$"
 bfl_offer_held_sovereign_bond_desc: "Seleccione un emisor y liste uno de sus bonos soberanos en 98% de valor nominal. Requiere un edificio de la Bolsa de Valores terminado en propiedad."
 bfl_offer_held_sovereign_bond_effect_text: "$bfl_offer_held_sovereign_bond$"
 bfl_offer_held_sovereign_bond_effect_text_past: "$bfl_offer_held_sovereign_bond$"
 bfl_offer_held_sovereign_bond_tip: "Indique un bono existente que posea durante tres meses. Usted conserva el reclamo hasta que un comprador financiado lo acepte; Los cupones y el canje siguen a ese comprador."
 bfl_offer_restructuring: "Ofrecer alivio de la deuda"
 bfl_offer_restructuring_act: "$bfl_offer_restructuring$"
 bfl_offer_restructuring_desc: "El prestatario recibe una oferta explícita. No hay cambios en efectivo ni en los términos hasta la aceptación; La ejecución vuelve a verificar la autoridad, el perfil, la investigación y los fondos en vivo."
 bfl_offer_restructuring_effect_text: "$bfl_offer_restructuring$"
 bfl_offer_restructuring_effect_text_past: "$bfl_offer_restructuring$"
 bfl_offer_restructuring_tip: "Seleccione una empresa soberana o nativa elegible. Ambos perfiles prestan a soberanos; El crédito empresarial requiere financiación mercantil, reforma y crédito corporativo. El alivio de la deuda también requiere una reestructuración de la deuda renacentista."
 bfl_offering_closed: "Cerrado"
 bfl_offering_open: "Abierto"
 bfl_operating_costs: "Gastos operativos mensuales"
 bfl_operating_costs_tip: "Los costos fijos mensuales escalan con cuentas de depósito activas, contratos, sucursales y clases de activos. La reforma del State Chartered Bank reduce los costos en 5%, Banca por 10%, Compensación avanzada por 15%y una administración simplificada por 10%. Los costos impagos siguen siendo pasivos y bloquean los dividendos."
 bfl_overview: "Cuentas y especialización"
 bfl_overview_hint: "Activos: anillo exterior = tipo; anillo interior = países. Pase el cursor para ver desgloses de colores."
 bfl_payout_0: "Retener ganancias"
 bfl_payout_0_short: "retener"
 bfl_payout_0_tip: "Conservar todas las ganancias realizadas elegibles. No se pagan nuevos dividendos bajo esta política; Las ganancias retenidas respaldan la liquidez y el capital."
 bfl_payout_25: "25% pago"
 bfl_payout_25_short: "25%"
 bfl_payout_25_tip: "asignar hasta 25% de ganancias realizadas elegibles a dividendos después de pérdidas. El efectivo disponible, el margen de capital y la propiedad registrada aún limitan el pago."
 bfl_payout_50: "50% pago"
 bfl_payout_50_short: "50%"
 bfl_payout_50_tip: "asignar hasta 50% de ganancias realizadas elegibles a dividendos después de pérdidas. El efectivo disponible, el margen de capital y la propiedad registrada aún limitan el pago."
 bfl_peasants_estate_workout_mandate: "Mandato de gestión patrimonial"
 bfl_peasants_estate_workout_mandate_desc: "Este poder autoriza explícitamente a su gobierno a revisar en su nombre las renegociaciones voluntarias de depósitos bancarios. Cada propuesta todavía necesita una aceptación por separado. Revocar este privilegio invalida los términos patrimoniales pendientes. Los pagos de recuperación continúan a la billetera del patrimonio."
 bfl_place_deposit_1: "abrir un 100 deposito a la vista de oro"
 bfl_place_deposit_1_act: "$bfl_place_deposit_1$"
 bfl_place_deposit_1_desc: "Los bancos independientes requieren una opinión de al menos +50 hacia usted para abrir una cuenta. Su banco autorizado ofrece un extra 1% interés anual. El interés a la vista se paga mensualmente cuando se financia; los intereses impagos siguen adeudados. La caída de las relaciones nunca impide la retirada de sus propios derechos maduros."
 bfl_place_deposit_1_effect_text: "$bfl_place_deposit_1$"
 bfl_place_deposit_1_effect_text_past: "$bfl_place_deposit_1$"
 bfl_place_deposit_2: "abrir un 100 depósito a plazo de oro"
 bfl_place_deposit_2_act: "$bfl_place_deposit_2$"
 bfl_place_deposit_2_desc: "Los bancos independientes requieren una opinión de al menos +50 hacia usted para abrir una cuenta. Su banco autorizado ofrece un extra 1% interés anual. El interés a la vista se paga mensualmente cuando se financia; los intereses impagos siguen adeudados. La caída de las relaciones nunca impide la retirada de sus propios derechos maduros."
 bfl_place_deposit_2_effect_text: "$bfl_place_deposit_2$"
 bfl_place_deposit_2_effect_text_past: "$bfl_place_deposit_2$"
 bfl_portfolio_bank_heading: "Inversiones mantenidas por [Country.GetName]"
 bfl_portfolio_history_axis: "Del más antiguo al más reciente · hasta 12 observaciones mensuales"
 bfl_portfolio_history_empty: "La historia comienza en el próximo cierre bancario mensual."
 bfl_portfolio_history_flows: "El valor incluye compras y ventas; este no es un índice de retorno de la inversión."
 bfl_portfolio_history_title: "Valor de la cartera a lo largo del tiempo"
 bfl_portfolio_owner_note: "Las tenencias del Tesoro y de los bancos tienen propietarios separados. Coloca el cursor sobre una entidad para sus finanzas."
 bfl_portfolio_total_heading: "Valor patrimonial actual"
 bfl_portfolio_treasury_heading: "Tenencias de tesorería soberana"
 bfl_prepare_bond_panel: "Bonos soberanos"
 bfl_prepare_bond_panel_tip: "Vea el financiamiento estatal y los reclamos existentes en Crédito."
 bfl_probe_P11: "Puerta de desarrollo: P11 debe medirse en el juego antes de que este adaptador pueda ejecutarse."
 bfl_profile_0: "Elige una especialización"
 bfl_profile_1: "Finanzas mercantiles"
 bfl_profile_2: "Inversión en el extranjero"
 bfl_project_security: "Seguridad del proyecto"
 bfl_project_security_desc: "Las empresas distantes son difíciles de supervisar para sus financistas. Los derechos sobre sus activos y ganancias, establecidos antes de que se anticipe el capital, brindan a los inversionistas un medio para proteger sus intereses cuando una empresa se desvía."
 bfl_project_security_tip: "#T Seguridad del proyecto#!\nAsegure una empresa contra reclamos de proyectos identificables. Requiere investigación de seguridad de proyectos, inversiones en el extranjero y la era del absolutismo o posterior. La ejecución de garantía nativa del proyecto no está disponible en esta compilación."
 bfl_protected_label: "Efectivo protegido"
 bfl_public_backstop: "Respaldo público"
 bfl_public_backstop_tip: "#T Soporte público seguro#!\nRevoluciones, respaldos financieros públicos y una carta viva con un Banco Central completo en el capital soberano. Aceptado explícitamente 75-los adelantos en oro utilizan el efectivo libre del propio banco público, un 25% corte de pelo de factura y al menos 9% interés anual. Sin recapitalización gratuita."
 bfl_public_financial_backstops: "Respaldos financieros públicos"
 bfl_public_financial_backstops_desc: "Cuando la quiebra de una gran casa bancaria amenaza el crédito y el comercio públicos, el gobierno puede intervenir. Este apoyo vincula los recursos del tesoro a la recuperación del banco y convierte las condiciones de la asistencia en una cuestión de política pública."
 bfl_purchase_funded_bill: "Comprar una factura de pago financiada"
 bfl_purchase_funded_bill_act: "$bfl_purchase_funded_bill$"
 bfl_purchase_funded_bill_desc: "Financiado con su propia tesorería después de verificaciones de perfil, edad, investigación y registro. El capital no es beneficio bancario. Una suscripción de capital bancaria compra participaciones a su valor liquidativo actual."
 bfl_purchase_funded_bill_effect_text: "$bfl_purchase_funded_bill$"
 bfl_purchase_funded_bill_effect_text_past: "$bfl_purchase_funded_bill$"
 bfl_purchase_native_loan: "Banco: compra de préstamo inmobiliario nativo"
 bfl_purchase_native_loan_act: "$bfl_purchase_native_loan$"
 bfl_purchase_native_loan_desc: "Su banco es el comprador. Se aplican el precio y la elegibilidad locales, con efectivo adicional y cheques de capital gratuitos. Los patrimonios bancarios reciben el precio de compra y el mismo préstamo cambia de propietario. Se excluyen los bonos y los préstamos que ya están en manos de los países."
 bfl_purchase_native_loan_effect_text: "$bfl_purchase_native_loan$"
 bfl_purchase_native_loan_effect_text_past: "$bfl_purchase_native_loan$"
 bfl_purchase_native_loan_tip: "#T Asumir el préstamo para el banco.#!\nSeleccione otro soberano con deuda patrimonial elegible. Su banco autorizado paga el precio de compra nativo a los bancos de ese país y se convierte en acreedor del mismo préstamo. Las cuentas por cobrar de principal e intereses pertenecen al banco; el soberano obtiene ingresos por préstamos a través de los dividendos de sus acciones. Los bancos también compran un préstamo elegible de forma autónoma cada mes cuando las reservas y el capital lo permiten. Se excluyen los bonos y los préstamos que ya están en manos de los países."
 bfl_rate_0: "Sin intereses a la vista para cuentas nuevas"
 bfl_rate_0_short: "0%"
 bfl_rate_0_tip: "oferta 0% interés anual sobre nuevos depósitos a la vista. Las cuentas a la vista existentes y la tasa de cuenta a plazo separada permanecen en sus tasas aceptadas."
 bfl_rate_1: "1% tasa de demanda anual para nuevas cuentas"
 bfl_rate_1_short: "1%"
 bfl_rate_1_tip: "oferta 1% interés anual sobre nuevos depósitos a la vista. El interés se acredita mensualmente con el acarreo de centavos. Las cuentas a la vista existentes mantienen sus tarifas aceptadas."
 bfl_rate_2: "2% tasa de demanda anual para nuevas cuentas"
 bfl_rate_2_short: "2%"
 bfl_rate_2_tip: "oferta 2% interés anual sobre nuevos depósitos a la vista. El interés se acredita mensualmente con el acarreo de centavos. Las cuentas a la vista existentes mantienen sus tarifas aceptadas."
 bfl_recapitalize_command: "Recapitalizar con 100 oro"
 bfl_recapitalize_command_tip: "pagar 100 oro del tesoro de su país como capital bancario. Requiere 100 oro y una oferta de reventa del distribuidor no superior al valor liquidativo tangible; El capital se detiene durante una prima de mercado mayor para evitar una ganancia inmediata de reventa. El rescate financiado con un valor liquidativo cero o negativo sigue estando disponible."
 bfl_redeem_bond: "Canjear"
 bfl_redeem_bond_01_tip: "Pague el valor nominal más todos los cupones acumulados al titular actual. Una escasez deja todo el bono pendiente. La redención cierra el reclamo una vez; Los bonos nativos no se ven afectados."
