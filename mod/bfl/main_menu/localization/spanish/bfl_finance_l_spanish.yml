 bfl_transfer_bank_bill_desc: "Elija el emisor y un beneficiario aceptador. El primer elegible 100-transferencias de reclamaciones de oro para 100 oro pagado a su poseedor actual. La garantía bloqueada no se puede transferir. Las notas requieren una investigación de aceptación de Revolutions. Todos los controles de financiación, propiedad y sucursales de capital se repiten en el momento de la ejecución."
