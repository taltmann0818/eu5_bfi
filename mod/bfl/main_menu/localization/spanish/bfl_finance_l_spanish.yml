 bfl_assets_detail_title: "Activos de [Country.GetName]"
 bfl_assets_label: "Activos"
 bfl_assets_label_tip: "#T Activos totales#!\nEfectivo y activos registrados propiedad del banco.\n\nCaja de tesorería: [Country.GetFixedPointCurrencyValue('gold')|2]@gold!\nCartera de préstamos: [Country.MakeScope.GetVariable('bfl_native_credit_value').GetValue|2]@gold!\nPosiciones de capital (valor en libros): [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_security_carrying')|2]@gold!\nCréditos y bonos personalizados: [Country.MakeScope.GetVariable('bfl_custom_credit_value').GetValue|2]@gold!\nInventario: [Country.MakeScope.GetVariable('bfl_inventory_value').GetValue|2]@gold!\nProyectos: [Country.MakeScope.GetVariable('bfl_project_value').GetValue|2]@gold!\nTotales: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_assets')|2]@gold!\n\nLos préstamos, las posiciones de capital, el inventario y los proyectos son valores de activos registrados, no efectivo disponible para gastar. Los reembolsos del principal intercambian un activo crediticio por efectivo; no generan ganancias."
 bfl_authorize_note_bank: "Autorizar billetes canjeables"
 bfl_authorize_note_bank_act: "$bfl_authorize_note_bank$"
 bfl_authorize_note_bank_desc: "Autorice a su banco autorizado, o a un banco independiente con una sucursal en su capital, a intercambiar dinero en efectivo por billetes canjeables totalmente respaldados después de la investigación requerida. Para nuevas emisiones también se requiere un Banco Central completo en su capital. La autorización no genera oro y puede retirarse."
 bfl_authorize_note_bank_effect_text: "$bfl_authorize_note_bank$"
 bfl_authorize_note_bank_effect_text_past: "$bfl_authorize_note_bank$"
 bfl_automation_notice: "Gestión de crédito"
 bfl_automation_notice_tip: "Utilice Gestión de crédito en el encabezado para permitir que el banco administre préstamos e inversiones. El banco mantiene reservas, paga a los acreedores y verifica la investigación y el efectivo antes de invertir."
 bfl_available: "Efectivo disponible"
 bfl_available_tip: "Efectivo que el banco puede utilizar después de mantener sus reservas."
 bfl_back_to_bank: "cuentas bancarias"
 bfl_balance_paid_tip: "Pago financiado recibido en la última liquidación mensual. Estas transferencias ya están en su tesorería y no deben agregarse nuevamente al total de ingresos nativos."
 bfl_balance_sheet_subtitle: "cuentas bancarias corrientes"
 bfl_bank_capital_subscriptions_desc: "Una casa bancaria no necesita depender exclusivamente de la fortuna de su familia fundadora. Las suscripciones atraen socios adicionales a la empresa, reuniendo su capital y registrando al mismo tiempo los derechos de cada inversor sobre su prosperidad futura."
 bfl_bank_dividends: "Dividendos bancarios (anual)"
 bfl_bank_equity_subscribe: "Tesorería bancaria: suscríbete 100 oro"
 bfl_bank_equity_subscribe_tip: "invertir 100 del excedente de efectivo y capital protegido del banco efectivamente administrado al valor liquidativo tangible del emisor seleccionado. Nuevas unidades pagadas ingresan a la cartera bancaria. Máximo 25% de un banco o 60% de una empresa autorizada en el extranjero. Se trata de financiación primaria, no de una compra a un accionista existente."
 bfl_bank_holdings: "Inversiones bancarias"
 bfl_bank_identity_tip: "[Country.GetName] posee su propia tesorería, activos y obligaciones. Estos totales pertenecen al banco, aparte del tesoro estatal. Merchant Finance se especializa en préstamos comerciales y corporativos; Overseas Investment se especializa en emprendimientos y empresas. Un banco elige una especialización permanente."
 bfl_bank_share_dealing: "Negociación de acciones bancarias"
 bfl_bank_share_dealing_desc: "La fortuna de un socio no tiene por qué permanecer ligada a la misma casa bancaria para siempre. Las transferencias de propiedad reconocidas permiten a los inversores vender sus intereses a otros mientras la institución continúa con su negocio sin retirar su capital."
 bfl_bank_share_transfer: "Transferencia bancaria de acciones"
 bfl_bank_share_transfer_tip: "#T transferencia bancaria de acciones#!\nTransferir unidades de propiedad bancaria registradas entre partes financiadas. Requiere investigación sobre transacciones bancarias con acciones y la era de la Reforma o posterior. Esta fila informa permiso; no ejecuta por sí mismo una operación secundaria de acciones."
 bfl_bank_status_tip: "Operativo: se permiten nuevos negocios cuando se cumplan sus demás requisitos. Efectivo bajo presión: el efectivo disponible se agota. Retiros en cola: las solicitudes de retiro impagas suspenden nuevos negocios. Insolvente: los pasivos superan a los activos. En resolución o Cerrado: se restringe el negocio ordinario. Las reclamaciones existentes siguen registradas."
 bfl_bank_subscription: "Suscripción bancaria"
 bfl_banking_finance_companies__expanded_details_desc: "Preferencia de presentación reservada para la vista de extracto detallado."
 bfl_banking_finance_companies__expanded_details_name: "Detalles de actividad ampliados"
 bfl_banking_finance_companies__finance_notifications_desc: "Preferencia de presentación de notificaciones; Las obligaciones nunca se cancelan al silenciar."
 bfl_banking_finance_companies__finance_notifications_name: "Notificaciones financieras"
 bfl_banking_finance_companies__interface_name: "Interfaz"
 bfl_banking_finance_companies__presentation__interface_name: "Interfaz"
 bfl_banking_finance_companies__presentation_name: "Presentación"
 bfl_banking_finance_companies__reduced_motion_desc: "Utilice recibos y advertencias de transacciones estáticas. Desactívelo para permitir resaltes breves y únicos de transacciones después de los pagos comprometidos; sin destellos financieros en bucle."
 bfl_banking_finance_companies__reduced_motion_name: "Movimiento reducido"
 bfl_banking_finance_companies_desc: "Sólo configuración de presentación. La política de la institución se gestiona en Economía."
 bfl_banking_finance_companies_name: "Empresas Bancarias, Financieras y Comerciales"
 bfl_bond_accept_tip: "Acepte la reducción de capital/cupón cotizada y el recorte de tasa anual después de volver a verificar el titular actual, el reclamo y la autoridad. Sin nueva garantía ni pago en efectivo."
 bfl_bond_capacity_label: "Crédito disponible"
 bfl_bond_capacity_label_tip: "Capital, interés mensual y espacio para nuevos préstamos."
 bfl_bond_coupon: "cupón mensual"
