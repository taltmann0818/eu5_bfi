 bfl_shares_heading: "Acciones"
 bfl_sovereign_accounts: "Cuentas soberanas: separadas de los activos bancarios"
 bfl_sovereign_accounts_subtitle: "Préstamos soberanos nativos, no activos bancarios"
 bfl_sovereign_accounts_tip: "Estas deudas y cuentas por cobrar nativas pertenecen al soberano, no a su banco. Los préstamos de propiedad bancaria se incluyen en el donut de activos; Los pasivos bancarios incluyen depósitos y gastos operativos impagos. El pago nativo mantiene al soberano como actor."
 bfl_sovereign_banknotes: "Billetes soberanos"
 bfl_sovereign_banknotes_desc: "Un banco apoyado por la autoridad pública puede hacer circular promesas de pago por escrito en lugar de monedas pesadas. Su aceptación se basa en la confianza de que la institución los redimirá y que la autoridad emisora ​​cumplirá con sus obligaciones."
 bfl_sovereign_credit: "Crédito soberano"
 bfl_sovereign_credit_tip: "#T crédito soberano#!\nUn préstamo de efectivo bancario a un estado terrateniente, con un derecho de reembolso registrado como un activo bancario. Requiere un banco operativo y las condiciones de préstamo nativas. La ejecución de nuevos préstamos no está disponible en esta compilación."
 bfl_sovereign_debt: "deuda soberana"
 bfl_sovereign_debt_heading: "deuda soberana de [Country.GetName]"
 bfl_sovereign_note: "Nota soberana"
 bfl_sovereign_note_tip: "#T Billetes canjeables#!\nAbsolutismo, investigación de Billetes Soberanos, autorización soberana, un Banco Central de capital y la Sucursal Bancaria del emisor. Intercambio 100 especie para un reclamo totalmente reservado. El límite independiente basado en acciones excluye el efectivo entrante de pagarés. Transferencias voluntarias a la par; Los pagos locales permanecen en oro."
 bfl_sovereign_receivables: "Cuentas por cobrar soberanas"
 bfl_sovereign_receivables_heading: "Cuentas por cobrar soberanas de [Country.GetName]"
 bfl_sovereign_restructuring: "Reestructuración soberana"
 bfl_sovereign_restructuring_tip: "#T Reestructuración soberana#!\nRenegociar deuda soberana bajo el avance de Reestructuración de Deuda. Requiere la edad permitida, un banco operativo y una transacción de deuda nativa respaldada. La ejecución de reestructuración nativa no está disponible en esta compilación."
 bfl_specialization_title: "Especialización bancaria"
 bfl_state_bonds_tip: "#T Capacidad de bonos estatales#!\nBonos estatales nativos pendientes: [GetPlayer.GetNumBonds]\nEspacios máximos para bonos nativos: [GetPlayer.GetDoubleModifierValue('max_bonds', 'max_bonds_modifier')|0]\n\nEstos son los bonos de su estado, separados de los depósitos, el capital y otros pasivos del banco. La capacidad incluye espacios base nativos y modificadores de capacidad de bonos. Vender un bono también requiere las condiciones de endeudamiento locales."
 bfl_state_bonds_value: "Bonos: [GetPlayer.GetNumBonds] / [GetPlayer.GetDoubleModifierValue('max_bonds', 'max_bonds_modifier')|0]"
 bfl_state_chartered_bank: "Banco estatal autorizado"
 bfl_state_chartered_bank_desc: "Un sujeto bancario nativo financiado por separado. Inicialmente, el soberano posee todas las acciones y fija el pago de dividendos mensual en Crédito. Las nuevas suscripciones bancarias aumentan el capital y diluyen la propiedad existente. Los depósitos estatales obtienen intereses preferenciales."
 bfl_state_credit: "crédito estatal"
 bfl_state_credit_value: "Crédito: [Multiply_CFixedPoint(GetPlayer.GetCreditworthiness, '(CFixedPoint)100')|0]"
 bfl_state_interest_value: "Interés: [GetPlayer.GetModifierValueNoFormat('bank_interest')]"
