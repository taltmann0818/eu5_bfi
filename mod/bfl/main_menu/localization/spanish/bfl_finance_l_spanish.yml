 bfl_charter_begin_tip: "Abra el selector de bancos estatales elegibles. No hay cambios de dinero ni de investigación hasta que se seleccione un banco; Cancelar deja ambas tesorerías sin cambios."
 bfl_charter_selection_tip: "Transferir [ROOT.GetCountry.MakeScope.ScriptValue('bfl_charter_investment')|0]@gold! al banco seleccionado como nuevo patrimonio estatal. Preservar su país, edificios, reclamaciones y obligaciones existentes, y luego elegir su especialización permanente."
 bfl_chartered_bank: "Banco autorizado"
 bfl_chartered_bank_desc: "Se instaló un banco estatal con sede en un edificio. Su efectivo y obligaciones permanecen separados de su soberano. No se cobra ningún tributo automático."
 bfl_clearing: "limpieza"
 bfl_clearing_tip: "#T Limpieza avanzada#!\nInvestigación sobre revoluciones, compensación avanzada y cámara de compensación nativa. Una Cámara de Compensación completa de propiedad y la admisión explícita de miembros permiten la liquidación neta atómica de letras vencidas casadas. Un miembro corto bloquea el lote y preserva todos los reclamos."
 bfl_clergy_estate_workout_mandate: "Mandato de gestión patrimonial"
 bfl_clergy_estate_workout_mandate_desc: "Este poder autoriza explícitamente a su gobierno a revisar en su nombre las renegociaciones voluntarias de depósitos bancarios. Cada propuesta todavía necesita una aceptación por separado. Revocar este privilegio invalida los términos patrimoniales pendientes. Los pagos de recuperación continúan a la billetera del patrimonio."
 bfl_close_bank_offering: "Cerrar oferta de acciones"
 bfl_close_bank_offering_tip: "Deja de aceptar suscripciones externas. Los derechos de propiedad y dividendos existentes siguen vigentes. El soberano todavía puede recapitalizar su propio banco."
 bfl_close_bond_offer: "Cerrar oferta de bonos"
 bfl_close_bond_offer_tip: "Retirar la oferta secundaria actual. La deuda pendiente y los cupones siguen adeudados."
 bfl_collateral: "garantía"
 bfl_collateralization: "Colateralización"
 bfl_collateralization_desc: "La confianza se fortalece cuando una promesa está respaldada por una propiedad. Al registrar una prenda y los derechos del acreedor sobre ella, los banqueros pueden prestar contra activos que pueden recuperarse si el deudor no cumple el acuerdo."
 bfl_commenda: "encomienda"
 bfl_commenda_available_color: "green"
 bfl_commenda_available_icon: "@bfl_commenda_opportunity!"
 bfl_commenda_available_left_click: "Revisar esta operación"
 bfl_commenda_available_name: "Commenda disponible para financiar"
 bfl_commenda_available_tooltip: "[GetPlayer.MakeScope.GetVariable('bfl_op_country').GetCountry.GetName] · 10 [GetPlayer.MakeScope.GetVariable('bfl_op_good').Goods.GetNameWithNoTooltip]\n[GetPlayer.MakeScope.GetVariable('bfl_op_from').GetMarket.GetName] → [GetPlayer.MakeScope.GetVariable('bfl_op_to').GetMarket.GetName]\nCosto bancario estimado: [GetPlayer.MakeScope.GetVariable('bfl_op_cost').GetValue|2]@gold!\nSuperávit bancario indicativo: +[GetPlayer.MakeScope.GetVariable('bfl_op_surplus').GetValue|2]@gold!\n\nCotizaciones de mercado actuales para una operación de carga de dos meses; el superávit excluye el capital recuperado. Los precios y el acceso pueden cambiar. El capital y los rendimientos están en riesgo. Sólo la venta real de esta carga paga el acuerdo. El operador debe aceptar. Las oportunidades se actualizan mensualmente y se verifican nuevamente antes de enviar una oferta."
 bfl_commenda_cargo: "Commenda: barco de carga en área descubierta"
 bfl_commenda_cargo_act: "Buque de carga en área descubierta"
 bfl_commenda_cargo_desc: "Seleccione el operador patrocinado y una carga de diez unidades de un mercado centrado o limítrofe con su área descubierta. Solo los fondos aceptados no utilizados pueden pagar su costo de compra original. Sin pago por descubrimiento ni atribución comercial no relacionada."
 bfl_commenda_cargo_effect_text: "Buque de carga en área descubierta"
 bfl_commenda_cargo_effect_text_past: "Buque de carga en área descubierta"
 bfl_commenda_cargo_tip: "Requiere el descubrimiento verificado de la expedición aceptada, la autorización restante, el acceso al mercado nativo y las existencias. El operador o controlador político comanda el viaje."
 bfl_commenda_desc: "Un comerciante que emprende un viaje puede poseer la habilidad para comerciar sin el capital para llenar un barco. La commenda une el dinero de un financiero al trabajo de un compañero de viaje y comparte las ganancias de la empresa según su acuerdo."
 bfl_commenda_expedition: "Financiar una expedición con nombre"
 bfl_commenda_expedition_act: "Financiar una expedición con nombre"
 bfl_commenda_expedition_desc: "Elija un operador, su puerto de lanzamiento, una zona marítima por descubrir y un explorador. Los objetivos marítimos deben estar dentro del alcance naval del operador; Las empresas sin tierra utilizan el rango del anfitrión de las instalaciones de propiedad seleccionada. Aceptación de fondos de preparación nativa en los términos propuestos. El banco no obtiene ningún control político."
 bfl_commenda_expedition_effect_text: "Financiar una expedición con nombre"
 bfl_commenda_expedition_effect_text_past: "Financiar una expedición con nombre"
 bfl_commenda_expedition_tip: "Elija un operador, área, puerto de lanzamiento y explorador antes de dar el consentimiento. La financiación cubre únicamente el costo real de preparación nativa. La preparación no es reembolsable. La autorización restante podrá financiar carga procedente de un mercado centrado en el área descubierta o limítrofe con ella; sólo sus ingresos medidos por la venta pueden pagar retornos."
 bfl_commenda_opportunity_consent: "Vuelva a verificar esta carga nombrada y su autoridad de financiación en vivo. Envíe una oferta utilizando sus Términos actuales; no se mueve dinero hasta que el operador acepta."
 bfl_commenda_opportunity_later: "Considere más tarde"
 bfl_commenda_opportunity_propose: "Envía estos términos al operador."
 bfl_commenda_opportunity_review: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_op_country').GetCountry.GetName] · 10 [ROOT.GetCountry.MakeScope.GetVariable('bfl_op_good').Goods.GetNameWithNoTooltip]\n[ROOT.GetCountry.MakeScope.GetVariable('bfl_op_from').GetMarket.GetName] → [ROOT.GetCountry.MakeScope.GetVariable('bfl_op_to').GetMarket.GetName]\nCosto bancario estimado: [ROOT.GetCountry.MakeScope.GetVariable('bfl_op_cost').GetValue|2]@gold!\nSuperávit bancario indicativo: +[ROOT.GetCountry.MakeScope.GetVariable('bfl_op_surplus').GetValue|2]@gold!\n\nCotizaciones de mercado actuales para una operación de carga de dos meses; el superávit excluye el capital recuperado. Los precios y el acceso pueden cambiar. El capital y los rendimientos están en riesgo. Sólo la venta real de esta carga paga el acuerdo. El operador debe aceptar. Las oportunidades se actualizan mensualmente y se verifican nuevamente antes de enviar una oferta."
 bfl_commenda_tip: "#T encomienda#!\nComprometer capital para un viaje o empresa comercial a cambio de una participación definida en las ganancias. Requiere investigación de Commenda, inversión en el extranjero y la era Discovery o posterior. La ejecución nativa del proyecto no está disponible en esta compilación."
 bfl_commercial_bill: "Factura Comercial"
 bfl_commercial_bills: "Facturas Comerciales"
 bfl_commercial_bills_desc: "Transportar monedas entre centros comerciales es costoso y peligroso. Las letras emitidas permiten a los comerciantes liquidar obligaciones a través de bancos confiables, haciendo de la reputación del emisor un instrumento de comercio."
 bfl_commodity_forward: "Productos a plazo"
 bfl_commodity_forward_tip: "#T Adelanto de productos básicos#!\nAcordar una entrega futura de bienes financiada. Requiere investigación de Commodity Forwards, Merchant Finance y la era del absolutismo o posterior. La entrega física y la liquidación no están disponibles en esta versión."
 bfl_commodity_forwards: "Forward de materias primas"
 bfl_commodity_forwards_desc: "Un pedido de cosecha, envío o taller podrá venderse antes de su entrega. Los acuerdos que fijan un precio futuro ayudan a los comerciantes a organizar sus asuntos a pesar de la incertidumbre de los mercados distantes y los cambios de estaciones."
 bfl_commodity_inventory: "Inventario de productos básicos"
 bfl_commodity_inventory_tip: "#T Inventario de productos básicos#!\nBienes financieros mantenidos para el comercio. Requiere investigación de inversiones en productos básicos, finanzas comerciales y la era Discovery o posterior. La compra, custodia y entrega de bienes físicos no están disponibles en esta compilación."
 bfl_commodity_investments: "Inversiones en materias primas"
 bfl_commodity_investments_desc: "Los banqueros que financian el comercio también pueden poseer los bienes. Los cereales, la lana y otras mercancías se convierten en inversiones cuyo valor depende del almacenamiento, el transporte y las necesidades cambiantes de los mercados distantes."
 bfl_companies_empty: "No hay empresas operativas bajo su control."
 bfl_company_crew: "Transferir 250 marineros a la empresa"
 bfl_company_crew_desc: "Administre una empresa nativa que controla actualmente. El capital financiado está excluido de los ingresos operativos."
 bfl_company_crew_tip: "Administre una empresa nativa que controla actualmente. Los aportes de capital son financiación. Las distribuciones de las empresas utilizan las ganancias comerciales retenidas después de los costos nativos, las pérdidas acumuladas, las reservas de deuda y las reservas de efectivo. El señor político y el dueño financiero están separados."
 bfl_company_equity: "Patrimonio de la empresa"
 bfl_company_equity_desc: "Las grandes empresas comerciales necesitan fortunas que pocos comerciantes pueden suministrar por sí solos. Dividir la propiedad entre inversores permite a una empresa reunir capital duradero mientras distribuye los riesgos y recompensas de sus empresas."
 bfl_company_equity_tip: "#T Patrimonio de la empresa#!\nSuscribir capital por una participación en la propiedad de una empresa reconocida. Requiere investigación sobre el capital de la empresa, inversiones en el extranjero y la era de la Reforma o posterior. La emisión de empresas nativas y la liquidación de titulares no están disponibles en esta versión."
 bfl_company_expedition: "Empresa: preparar exploración nativa."
 bfl_company_expedition_desc: "Utilice la tesorería, los marineros y el explorador de la empresa para preparar una exploración marítima en las instalaciones de la empresa. Se aplica la preparación y el progreso nativos. Discovery no produce efectivo ni ganancias de inversión."
 bfl_company_expedition_tip: "Requiere un mandato comercial y de exploración, elaboración de mapas, una empresa exploradora elegible, marineros y un presupuesto de riesgo disponible. Se aplica tiempo de preparación nativo."
 bfl_company_exploration_capacity: "Establecimiento de exploración de la empresa"
 bfl_company_exploration_capacity_desc: "Capacidad para 500 marineros mientras se autoriza un mandato de exploración. Los marineros deben proceder de la empresa o de una transferencia financiada por su interventor político."
 bfl_company_explore: "Mandato de la empresa: comercio y exploración."
 bfl_company_explore_desc: "Administre una empresa nativa que controla actualmente. El capital financiado está excluido de los ingresos operativos."
 bfl_company_explore_tip: "Administre una empresa nativa que controla actualmente. Los aportes de capital son financiación. Las distribuciones de las empresas utilizan las ganancias comerciales retenidas después de los costos nativos, las pérdidas acumuladas, las reservas de deuda y las reservas de efectivo. El señor político y el dueño financiero están separados."
 bfl_company_fund: "Contribuir 100 oro al capital de la empresa"
 bfl_company_fund_desc: "Administre una empresa nativa que controla actualmente. El capital financiado está excluido de los ingresos operativos."
 bfl_company_fund_tip: "Administre una empresa nativa que controla actualmente. Los aportes de capital son financiación. Las distribuciones de las empresas utilizan las ganancias comerciales retenidas después de los costos nativos, las pérdidas acumuladas, las reservas de deuda y las reservas de efectivo. El señor político y el dueño financiero están separados."
 bfl_company_list_equity: "Autorizar la cotización en acciones de la empresa"
 bfl_company_list_equity_desc: "Autorizar suscripciones primarias de NAV pagas y operaciones secundarias. Las adquisiciones bancarias requieren inversiones en el extranjero, investigación del capital de la empresa y el intercambio completo para operaciones secundarias. El dominio político se mantiene sin cambios."
 bfl_company_list_equity_tip: "El controlador político vivo autoriza la participación en el mercado. No se conceden efectivo ni unidades."
 bfl_company_overview_note: "El efectivo de la empresa pertenece a la empresa. Credit Management dirige su comercio y exploración. Los dividendos de los propietarios utilizan ganancias financiadas después de las reservas; Se excluyen los nuevos capitales y los descubrimientos."
 bfl_company_overview_subtitle: "Cuentas de empresa · última liquidación"
 bfl_company_overview_title: "[Country.GetName]"
 bfl_company_panel: "Empresas operativas"
 bfl_company_retain: "Mandato de la empresa: pausar nuevas operaciones"
 bfl_company_retain_desc: "Administre una empresa nativa que controla actualmente. El capital financiado está excluido de los ingresos operativos."
 bfl_company_retain_tip: "Administre una empresa nativa que controla actualmente. Los aportes de capital son financiación. Las distribuciones de las empresas utilizan las ganancias comerciales retenidas después de los costos nativos, las pérdidas acumuladas, las reservas de deuda y las reservas de efectivo. El señor político y el dueño financiero están separados."
 bfl_company_route: "Empresa: ruta comercial nativa abierta"
 bfl_company_route_desc: "Abra una ruta nativa propiedad de la empresa utilizando 0.1 capacidad mercantil. Requiere un mandato comercial, presupuesto operativo disponible, acceso al mercado nativo, excedente y capacidad. Máximo una ruta comandada por empresa al mes. La IA nativa conserva su propio comportamiento comercial."
 bfl_company_route_tip: "Seleccione la empresa, mercado de origen, mercado de destino, mercado comercial y bienes. Los costos comerciales nativos los cobra el motor."
 bfl_company_select: "Seleccionar empresa operadora"
 bfl_company_select_desc: "Inspeccione una empresa nativa bajo su control político actual."
 bfl_company_select_tip: "Inspeccionar una empresa bajo su control."
 bfl_company_strategy_construction: "Reinvertir las reservas de la empresa en una instalación comercial local"
 bfl_company_trade: "Mandato de la empresa: comercio"
 bfl_company_trade_desc: "Administre una empresa nativa que controla actualmente. El capital financiado está excluido de los ingresos operativos."
 bfl_company_trade_tip: "Administre una empresa nativa que controla actualmente. Los aportes de capital son financiación. Las distribuciones de las empresas utilizan las ganancias comerciales retenidas después de los costos nativos, las pérdidas acumuladas, las reservas de deuda y las reservas de efectivo. El señor político y el dueño financiero están separados."
 bfl_corporate_credit: "Crédito Corporativo"
 bfl_corporate_credit_desc: "A medida que las empresas comerciales superan un solo viaje o una temporada, su necesidad de crédito se vuelve más duradera. Las casas bancarias aprenden a juzgar los recursos y las perspectivas de una empresa, así como la posición de sus comerciantes individuales."
 bfl_corporate_credit_tip: "#T Crédito corporativo#!\nPréstamo a una empresa comercial reconocida. Requiere investigación de crédito corporativo, finanzas comerciales y la era de la Reforma o posterior. La nueva ejecución de préstamos de empresa nativa no está disponible en esta compilación."
 bfl_cost_accounts: "Cuentas de depósito: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_operating_accounts_count')|0] × 0.05"
 bfl_cost_asset_types: "Clases de activos distintos del efectivo: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_operating_asset_types_count')|0] × 0.25"
 bfl_cost_base: "administración de bases"
 bfl_cost_branches: "Sucursales: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_operating_branches_count')|0] × 0.50"
 bfl_cost_contracts: "Contratos financieros personalizados: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_operating_contracts_count')|0] × 0.10"
