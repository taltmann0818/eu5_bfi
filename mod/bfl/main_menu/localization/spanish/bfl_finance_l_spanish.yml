 bfl_cost_payment_detail: "Los costos aumentan con la complejidad, no con el valor de los activos. Se cobra una vez al mes por encima de las reservas protegidas; los gastos impagos restringen los dividendos. Los intereses de depósito y los gastos nativos están separados. Las reducciones se suman; el total se redondea a centavos."
