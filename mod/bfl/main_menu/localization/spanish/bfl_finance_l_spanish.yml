 bfl_loan_button: "hacerse cargo del préstamo"
 bfl_loans_columns: "Meses de interés del principal del prestatario"
 bfl_loans_empty: "Sin préstamos bancarios. Las ofertas de préstamos y las adquisiciones completadas aparecen aquí."
 bfl_log_charter: "Estableció y capitalizó un banco estatal para"
 bfl_manage_shareholdings: "Decisiones de los accionistas"
 bfl_manage_shareholdings_desc: "Fijar dividendos para [ROOT.GetCountry.MakeScope.GetVariable('bfl_exchange_selected').GetCountry.GetName]. La mayoría de los votos financieros controla los pagos de empresas y bancos independientes. El Estado controla su propio banco autorizado. Las opciones de reserva de las empresas no modifican el control político."
 bfl_manage_shareholdings_tip: "Elija una empresa o banco para fijar dividendos. Requiere una mayoría de votos financieros o el control de su banco autorizado. Las participaciones minoritarias siguen siendo visibles con su exigencia insatisfecha."
 bfl_margining: "Margen"
 bfl_margining_and_risk_management: "Margen y gestión de riesgos"
 bfl_margining_and_risk_management_desc: "Los comerciantes que prometen entregas futuras enfrentan precios cambiantes mucho antes de que venzan sus contratos. Exigir seguridad adicional a medida que aumentan las exposiciones brinda a los banqueros un medio para contener las pérdidas antes de que un mercado desfavorable se convierta en incumplimiento."
 bfl_margining_tip: "#T Gestión de márgenes y riesgos#!\nRequerir garantía y margen de variación contra la exposición cambiante a las materias primas. Requiere investigación sobre márgenes y gestión de riesgos, finanzas comerciales y la era de las revoluciones. La ejecución de márgenes respaldados por bienes no está disponible en esta versión."
 bfl_market_company_requirement: "Las acciones de la empresa requieren una investigación sobre inversiones en el extranjero y patrimonio de la empresa. Las acciones bancarias utilizan la negociación de acciones."
 bfl_market_funds_requirement: "Su banco puede permitirse acciones dentro de sus límites de efectivo, capital y propiedad."
 bfl_market_holder_requirement: "El emisor tiene un espacio libre para accionistas o ya registra a su banco comprador como accionista."
 bfl_market_portfolio_requirement: "Su banco comprador tiene un espacio de cartera libre o ya posee este título."
 bfl_market_sort_price: "Ordenar por precio por acción"
 bfl_monetary: "Política monetaria y liquidez"
 bfl_monetary_explanation: "Intercambiar especies por billetes reservados con autoridad soberana y un Banco Central completo. Descuento de letras de terceros bancos después de las Líneas de Garantía y Liquidez; Revolutions agrega compensación de miembros financiados y apoyo público asegurado limitado. Las tarifas aceptadas permanecen fijas."
 bfl_monetary_tip: "#T Instrumentos monetarios#!\nPermisos de vencimiento posterior para notas soberanas, liquidez asegurada, compensación y apoyo público. Cada uno requiere su propia autorización, respaldo y condiciones de funcionamiento."
 bfl_money_accept: "Alternar aceptación y descuentos"
 bfl_money_accept_tip: "Los billetes se intercambian en especie por un derecho totalmente reservado. La aceptación es voluntaria. Avance de descuentos 75 oro contra un 100-billete de oro de un tercer banco. La compensación liquida las facturas vencidas coincidentes sólo cuando cada miembro puede pagar su débito neto. Los reclamos existentes sobreviven a la autoridad y los edificios perdidos."
 bfl_money_acceptance_action: "Cambiar aceptación voluntaria"
 bfl_money_authorize: "autorizar notas"
 bfl_money_authorize_tip: "El controlador soberano autoriza su banco autorizado. En el capital actual se necesita un Banco Central de propiedad soberana y completo. Una nueva emisión también requiere la investigación de la sucursal bancaria y el capital del emisor."
 bfl_money_clear: "Liquidar facturas de miembros"
 bfl_money_clear_open: "Admisión de compensación"
 bfl_money_clear_open_tip: "Abrir o cerrar admisión a su grupo de compensación. Requiere investigación de Revoluciones, Cámara de Compensación y Compensación Avanzada, y una Cámara de Compensación completa propiedad del banco o su soberano vivo. Cuatro miembros máximo."
 bfl_money_clear_tip: "Liquide las facturas de miembros vencidas coincidentes una vez este mes. Cada miembro debe cubrir su débito neto protegiendo al mismo tiempo otras reservas. Un miembro corto conserva todo el lote. Se excluyen las reclamaciones pignoradas y de no miembros."
 bfl_money_empty: "No hay billetes en circulación. La investigación monetaria, la autoridad y los edificios terminados desbloquean nuevos servicios."
 bfl_money_empty_tip: "Los billetes se intercambian en especie por un derecho totalmente reservado. La aceptación es voluntaria. Avance de descuentos 75 oro contra un 100-billete de oro de un tercer banco. La compensación liquida las facturas vencidas coincidentes sólo cuando cada miembro puede pagar su débito neto. Los reclamos existentes sobreviven a la autoridad y los edificios perdidos."
