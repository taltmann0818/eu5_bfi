 AM_bfl_chartered_bank: "Banco autorizado"
 LEAD_bfl_chartered_bank: "Contralor del banco autorizado"
 MODIFIER_TYPE_DESC_bfl_enable_advanced_clearing: "Desbloquea la liquidación neta de obligaciones recíprocas verificadas entre las instituciones participantes. La compensación debe preservar el derecho de cada titular y liquidar el saldo neto financiado sin crear dinero. La liquidación interbancaria nativa sigue no disponible."
 MODIFIER_TYPE_DESC_bfl_enable_bank_capital_subscriptions: "Permite suscripciones primarias de 100 oro en un banco. Las nuevas unidades de propiedad se cotizan al valor liquidativo actual. Los ingresos por suscripción aumentan el capital pagado en lugar de las ganancias realizadas y compran un derecho proporcional sobre distribuciones posteriores."
 MODIFIER_TYPE_DESC_bfl_enable_bank_share_dealing: "Permite que el servicio de transferencia bancaria de acciones mueva unidades registradas existentes entre titulares identificados. Una transferencia cambia de propietario sin emitir nuevas unidades ni generar beneficios bancarios. El registro debe tener capacidad y preservar el derecho de cada titular."
 MODIFIER_TYPE_DESC_bfl_enable_collateralization: "Desbloquea promesas de garantía registradas y sus controles de elegibilidad. Los activos gravados no pueden garantizar un segundo reclamo y la recuperación debe preservar la relación de deuda original. La ejecución colateral nativa sigue no disponible."
 MODIFIER_TYPE_DESC_bfl_enable_commenda: "Desbloquea el mandato de asociación para viajes de inversión en el extranjero. Cada empresa requiere un socio identificado, capital financiado, un acuerdo de participación en las ganancias registrado y una liquidación de los ingresos obtenidos. La ejecución del proyecto sigue no disponible en esta versión de desarrollo."
 MODIFIER_TYPE_DESC_bfl_enable_commercial_bills: "Permite el pago de facturas totalmente financiadas. el comprador paga 100 oro antes de la emisión; el banco registra un compromiso igual por pagar y en efectivo. El titular designado podrá canjear la letra después de un mes, una sola vez. La emisión no es ganancia."
 MODIFIER_TYPE_DESC_bfl_enable_commodity_forwards: "Desbloquea contratos de entrega a plazo de Merchant Finance. Cada contrato debe consignar su contraparte, bienes, cantidad, fecha de entrega y respaldo sin reutilizar inventario gravado. La ejecución comercial nativa sigue no disponible."
 MODIFIER_TYPE_DESC_bfl_enable_commodity_investments: "Desbloquea el mandato de inventario de Merchant Finance. Las posiciones en materias primas deben representar tenencias de bienes locales financiadas y preservar el costo de adquisición, la cantidad y la custodia. La ejecución comercial sigue no disponible en esta versión de desarrollo."
 MODIFIER_TYPE_DESC_bfl_enable_company_equity: "Desbloquea el mandato de acciones de la empresa de inversiones en el extranjero. Las participaciones financieras se registran separadamente del control de sujetos políticos. Sólo las distribuciones de empresas verificadas pueden convertirse en ingresos bancarios; Se excluyen las suscripciones y la devolución de capital. La ejecución nativa sigue no disponible."
 MODIFIER_TYPE_DESC_bfl_enable_corporate_credit: "Desbloquea el mandato de crédito corporativo de Merchant Finance. Los préstamos deben transferir efectivo bancario a una empresa identificada y crear un derecho recuperable igual; los reembolsos del principal no se incluyen en los beneficios. La ejecución nativa sigue no disponible."
 MODIFIER_TYPE_DESC_bfl_enable_debt_restructuring: "Desbloquea el mandato de reestructuración soberana. El vencimiento revisado, los intereses y el principal deberán acompañar al crédito existente, con el acuerdo del deudor. La ejecución no está disponible hasta que se respalde la conciliación de la deuda nativa."
 MODIFIER_TYPE_DESC_bfl_enable_liquidity_facilities: "Desbloquea liquidez temporal asegurada. La financiación debe provenir de una contraparte real, mantenerse dentro de los límites de efectivo y capital y contar con garantías registradas. Los retiros en cola mantienen la prioridad. La ejecución de la instalación nativa sigue no disponible."
 MODIFIER_TYPE_DESC_bfl_enable_margining_and_risk_management: "Desbloquea los requisitos de margen para posiciones a plazo de Merchant Finance. La exposición debe medirse en función de la garantía y el efectivo disponibles, y se requiere financiación adicional antes de que aumenten los compromisos. El comercio nativo y la ejecución de márgenes siguen no disponibles."
 MODIFIER_TYPE_DESC_bfl_enable_project_security: "Desbloquea la seguridad para proyectos de inversión en el extranjero. Los activos y los ingresos del proyecto identificados deben pignorarse a una única obligación registrada, preservando la prioridad mediante la liquidación o la recuperación. La ejecución nativa del proyecto sigue no disponible."
 MODIFIER_TYPE_DESC_bfl_enable_public_financial_backstops: "Desbloquea el mandato de respaldo público para un banco autorizado. La asistencia requiere una contribución real del tesoro y derechos registrados o unidades de propiedad; las garantías no pueden generar efectivo ni borrar pérdidas. La ejecución del respaldo permanente aún no se ha implementado."
 MODIFIER_TYPE_DESC_bfl_enable_sovereign_banknotes: "Desbloquea la emisión de billetes soberanos para un banco autorizado. Los pagarés son pasivos rescatables; El respaldo excluye el efectivo recaudado mediante la venta de los propios billetes. La emisión nativa y la ruta de pago al titular siguen no disponibles."
 MODIFIER_TYPE_DESC_bfl_enable_term_deposits: "Permite depósitos a tasa fija de 100 oro con vencimiento a doce meses. Los intereses se acumulan mensualmente a la tasa aceptada cuando se abre la cuenta; El capital inmaduro no se puede retirar. Los depósitos siguen siendo pasivos del banco."
 MODIFIER_TYPE_DESC_bfl_enable_warehouse_receipts: "Desbloquea recibos de Merchant Finance respaldados por lotes de inventario identificados. Cada recibo reserva diez unidades libres de cargas y cobra una tarifa de custodia financiada. Se debe respaldar la custodia de bienes nativos antes de que se puedan emitir nuevos recibos."
 MODIFIER_TYPE_DESC_bfl_no_automatic_tribute_cost_modifier: "La relación de fletamento no tiene tributo automático. Los ingresos del Estado provienen de los intereses de los depósitos y de los dividendos sobre las acciones de los bancos."
