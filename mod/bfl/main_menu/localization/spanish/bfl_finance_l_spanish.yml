 bfl_goods_accept: "Acepta estos términos"
 bfl_goods_accept_branch_tip: "Aceptar el contrato de Aduana de doce meses mostrado. Las tarifas de acceso financiadas mensuales van al anfitrión que da su consentimiento; aceptar no genera stock, reclamo de bienes o compra inmediata."
 bfl_goods_accept_quote_tip: "Pague el precio del contrato mostrado más la tarifa de custodia separada de un oro al custodio. Vuelva a verificar el respaldo en vivo, el precio, las partes, los permisos, el acceso y los fondos protegidos; Los términos modificados o obsoletos no mueven dinero."
 bfl_goods_accept_transfer_tip: "Pague el precio de transferencia mostrado al titular actual. Vuelva a verificar el titular, la cantidad, la generación del lote, la investigación, el vencimiento y la financiación antes de transferir el recibo existente una vez."
 bfl_goods_branch_desc: "El anfitrión ofrece acceso a su mercado de capitales para 12 meses en 1 oro por mes, pagado al anfitrión. Las compras nativas conservan su propio cargo en efectivo; Este es un servicio de custodia separado. El acceso requiere que el anfitrión tenga la propia Aduana completa y en paz. El acceso impago, la caducidad, la pérdida del edificio o la guerra detienen nuevas compras y entregas. El anfitrión podrá congelar la custodia local; no se crea efectivo ni bienes. Renovar con el mismo host para restaurar el acceso."
 bfl_goods_branch_title: "Acuerdo de custodia de la Aduana"
 bfl_goods_browser_desc: "Seleccione un lote físico para revisar su oferta. Los titulares existentes pueden solicitar la entrega; el anfitrión de la Aduana que dé su consentimiento puede congelar la custodia inaccesible y liberarla después de renovar el acceso. No se produce ninguna aceptación de oferta en el momento de la selección."
 bfl_goods_browser_title: "Ofertas de bienes y reclamaciones de custodia."
 bfl_goods_claim_desc: "Solicite la entrega de este recibo en su mercado de capitales. La entrega en todos los mercados tarda dos meses y cuesta 1 oro y pierde 1% de cantidad. Como alternativa, cierre esta ventana y utilice Ofrecer transferencia de recibo de almacén en diplomacia. Las transferencias requieren Revoluciones y Margen y Gestión de Riesgos por parte del custodio; El comprador debe aceptar una cotización actual."
 bfl_goods_claim_title: "Su reclamo de almacén"
 bfl_goods_close: "Cerrar"
 bfl_goods_decline: "Rechazar"
 bfl_goods_deliver: "Solicitar entrega fisica"
 bfl_goods_explanation: "El inventario nativo financiado, los recibos respaldados y los forwards requieren Merchant Finance, sus anticipos y la verificación de ejecución/custodia P09. Los bienes gravados no pueden respaldar una segunda reclamación."
 bfl_goods_forward_title: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_goods_quote_type').Goods.GetNameWithNoTooltip] delantero fisico"
 bfl_goods_inventory_empty: "No hay bienes bajo custodia. Las compras automáticas comienzan en el próximo cierre bancario mensual elegible."
 bfl_goods_inventory_hint: "Pase el cursor sobre bienes, cantidades, valor y devolución"
 bfl_goods_inventory_note: "Valor de venta nativo indicativo; retorno no realizado contra el costo restante pagado. Los recibos de terceros están excluidos del total bancario. Los costos, el deterioro y la pérdida de acceso afectan los ingresos. Desplácese por cada posición almacenada."
 bfl_goods_inventory_subtitle: "Custodia física · valor de mercado indicativo"
 bfl_goods_inventory_title: "inventario de mercancías"
 bfl_goods_next: "próximos lotes"
