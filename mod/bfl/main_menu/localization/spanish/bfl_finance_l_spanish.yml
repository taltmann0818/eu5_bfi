 bfl_view_goods: "Bienes"
 bfl_view_loans: "Préstamos"
 bfl_view_monetary: "Servicios monetarios"
 bfl_view_monetary_tip: "Billetes de banco, liquidez garantizada y compensación."
 bfl_view_shares: "Acciones"
 bfl_view_trade: "Financiación del comercio"
 bfl_warehouse_receipt: "Recibo de almacén"
 bfl_warehouse_receipt_tip: "#T recibo de almacén#!\nEmitir un reclamo contra bienes almacenados identificables. Requiere investigación de recibos de almacén, finanzas comerciales y la era del absolutismo o posterior. El almacenamiento verificado y la ejecución de mercancías no están disponibles en esta compilación."
 bfl_warehouse_receipts: "Recibos de almacén"
 bfl_warehouse_receipts_desc: "Los bienes mantenidos en un almacén de buena reputación pueden respaldar el comercio sin tener que moverse en cada venta. Un recibo establece un derecho sobre la mercancía almacenada, permitiendo a su propietario obtener financiación mientras la mercancía permanece bajo custodia."
 bfl_withdraw: "Retirar depósitos estatales vencidos"
 bfl_withdraw_tip: "#T Retirar depósitos estatales vencidos#!\nSolicite el reembolso de las cuentas a la vista y las cuentas a plazo vencidas de su estado. El banco paga el capital y los intereses acreditados con el efectivo disponible. Los montos impagos permanecen registrados en la cola de retiro y suspenden nuevos negocios. Las cuentas extranjeras y los depósitos a plazo no vencidos no se pueden retirar mediante esta acción."
 bfl_workout_decline: "Mantenga el reclamo completo"
 bfl_workout_desc: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_workout_bank').GetCountry.GetName] propone condiciones para su depósito de [ROOT.GetCountry.MakeScope.GetVariable('bfl_workout_claim').GetValue|2] oro. Puedes renunciar 20% del reclamo restante, convertir todo el reclamo en acciones de nueva emisión al valor liquidativo tangible previo a la conversión, o conservar su reclamo. La conversión requiere un valor liquidativo positivo y capacidad de los accionistas y no está disponible para los acreedores bancarios. Grupo de acreedores [ROOT.GetCountry.MakeScope.GetVariable('bfl_workout_pool').GetValue|0]: 0 tesorería, 1 burgueses, 2 nobles, 3 clero, 4 campesinos. Los términos del patrimonio requieren el Mandato de Ejercicio promulgado por ese patrimonio. La cotización vence este mes; la recuperación o un cambio de dirección lo invalida."
 bfl_workout_equity: "Convertir el reclamo en acciones (se requiere NAV positivo)"
 bfl_workout_haircut: "Aceptar un 20% reducción"
 bfl_workout_title: "Propuesta de solución de acreedores"
 bfl_workout_trade_access: "Concesión comercial de ejercicio"
 bfl_workout_trade_access_desc: "La protección comercial se levanta mediante una renegociación de bonos aceptada por separado por hasta dos años. Los acuerdos ordinarios de acceso al comercio existentes son independientes de esta concesión."
