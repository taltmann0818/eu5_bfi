 bfl_feedback_5: "Reventa de bonos resuelta"
 bfl_feedback_6: "Ingresos de la empresa recibidos"
 bfl_feedback_7: "#O Nueva advertencia de liquidez#!"
 bfl_feedback_8: "Resolución cerrada · las pérdidas registradas siguen siendo visibles"
 bfl_feedback_9: "#O El objetivo de instalación no fue financiado#!"
 bfl_feedback_note: "Última transacción comprometida · el importe ya está reservado. Al abrir esta vista no se reproducen efectos pasados. El movimiento reducido conserva el mismo recibo y advertencias. El descubrimiento por sí solo no produce ningún indicador de pago."
