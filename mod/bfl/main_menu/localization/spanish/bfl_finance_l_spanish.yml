 bfl_cost_title: "Gastos operativos de [Country.GetName]"
 bfl_credit_1_desc: "Un banco ofrece 100 oro para 60 meses a la tasa anual cotizada. La aceptación vuelve a verificar la financiación, la autoridad, la capacidad de endeudamiento y su elegibilidad. El capital es financiación, no ingresos.\nTasa anual: [ROOT.GetCountry.MakeScope.GetVariable('bfl_credit_offer_rate').GetValue|%1]."
 bfl_credit_1_title: "oferta de crédito"
 bfl_credit_2_desc: "Su prestamista ofrece un 20% reducción del principal y una reducción de la tasa anual de un punto porcentual (mínimo 1%). Esto cambia únicamente el préstamo no garantizado existente. Su madurez se mantiene sin cambios."
