 bfl_bond_secured_accept_tip: "Aceptar la reducción citada junto con la promesa exclusiva de ingresos por dos años y la concesión de protección comercial. La ejecución real sigue limitada por el efectivo disponible del emisor."
 bfl_bond_summary_tip: "Principal, intereses adeudados cada mes y espacio para nuevos préstamos."
 bfl_bond_underwriting: "Suscripción de bonos"
 bfl_bond_underwriting_tip: "#T suscripción de bonos#!\nSu banco autorizado paga en efectivo real por un bono soberano personalizado. Ambas especializaciones pueden suscribir. Los cupones anuales fijos se pagan mensualmente; el tenedor actual recibe el valor nominal al momento del canje. La emisión requiere liquidez bancaria, capital y capacidad soberana."
 bfl_bond_unpaid: "Cupones impagos"
 bfl_bond_workout_accept: "Aceptar la reestructuración de bonos"
 bfl_bond_workout_desc: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_bond_workout_issuer').GetCountry.GetName] le pide a usted, el titular actual, que renuncie 20% del principal y de los cupones impagos de este bono y reducir su cupón anual en un punto porcentual, con un 1% piso. Rechazar preserva todos los términos. La propuesta vence este mes; pago, transferencia u otro cambio lo invalida. La aceptación ordinaria no proporciona ninguna seguridad nueva. Cuando se ofrece, la aceptación asegurada añade una concesión de protección comercial de dos años y una promesa exclusiva de hasta 10% de ingresos mensuales por cupones impagos. La aplicación de la ley utiliza únicamente el oro de tesorería disponible, antes que otros cupones de bonos personalizados; no crea ninguna garantía ni pago de principal."
 bfl_bond_workout_secured: "Aceptar con una concesión comercial de dos años y una promesa de ingresos."
 bfl_bond_workout_title: "Propuesta de reestructuración de bonos"
 bfl_bonds_short: "Bonos soberanos"
 bfl_bonds_short_tip: "Pida prestado a su banco o revise los bonos existentes."
 bfl_borrow_amount: "pedir prestado al banco"
 bfl_borrow_amount_desc: "Elija el principal de un nuevo bono soberano. El banco paga al Estado y retiene el bono. Los intereses se pagan mensualmente. El efectivo, el capital, la capacidad de endeudamiento y el límite mensual compartido se verifican al confirmar."
 bfl_borrow_amount_tip: "Elija cuánto pedir prestado. Disponible ahora: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bfl_bond_draw_max')|0]@gold!. El límite mensual aumenta con los ingresos estatales. Cada emisión financiada crea un bono."
 bfl_branch_construction: "Establecer una sucursal bancaria de capital"
 bfl_branch_required: "Los nuevos negocios soberanos requieren la sucursal bancaria completa de este banco en la capital actual. Las transacciones entre bancos están exentas; las reclamaciones existentes siguen siendo adeudadas."
 bfl_browse_bond_issuers: "Explorar emisores y participaciones"
 bfl_browse_bond_issuers_desc: "Elija un emisor para inspeccionar los bonos y ofertas pendientes, incluidos los reclamos en poder de su banco."
 bfl_browse_bond_issuers_tip: "Seleccione un emisor activo con bonos personalizados en circulación. Esto no compra ni vende nada."
 bfl_browse_goods: "Ofertas de bienes y reclamaciones de custodia."
 bfl_browse_goods_act: "$bfl_browse_goods$"
 bfl_browse_goods_desc: "Revisar ofertas de custodia física, reclamos existentes o un acuerdo voluntario de acceso a la Aduana. Seleccionar un país no mueve dinero."
 bfl_browse_goods_effect_text: "$bfl_browse_goods$"
 bfl_browse_goods_effect_text_past: "$bfl_browse_goods$"
 bfl_burghers_estate_workout_mandate: "Mandato de gestión patrimonial"
 bfl_burghers_estate_workout_mandate_desc: "Este poder autoriza explícitamente a su gobierno a revisar en su nombre las renegociaciones voluntarias de depósitos bancarios. Cada propuesta todavía necesita una aceptación por separado. Revocar este privilegio invalida los términos patrimoniales pendientes. Los pagos de recuperación continúan a la billetera del patrimonio."
 bfl_buy_bill: "Factura de pago financiada · 100 oro"
 bfl_buy_bill_tip: "#T Factura de pago financiada#!\nTransferir 100 oro estatal al banco para obtener una factura de pago financiada. La factura se registra como una deuda por pagar, en lugar de una ganancia bancaria o un préstamo sin garantía. Requiere investigación de facturas comerciales, espacio para mesas de contratos y un banco operativo que acepte este negocio."
 bfl_buy_capital: "Suscribir capital · 100 oro"
 bfl_buy_capital_tip: "#T Suscribir capital bancario#!\nTransferir 100 oro estatal para comprar nuevas unidades de propiedad bancaria. El precio de las unidades se basa en el capital bancario positivo por unidad existente. Esto aumenta el efectivo bancario y el capital pagado, en lugar de ganancias. Desbloqueado por una investigación bancaria nativa, un espacio en la tabla de capital y un banco operativo que acepta este negocio. El capital está expuesto a pérdidas y no puede retirarse como depósito."
 bfl_buy_confirm_desc: "Compra [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_quantity').GetValue|3] acciones de [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_issuer').GetCountry.GetName] para [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_total').GetValue|2]@gold!. Estas son acciones existentes del inventario de creadores de mercado. El emisor no recibe financiación y las acciones emitidas no cambian. El precio cotizado, el acceso al mercado en vivo, las unidades disponibles, el efectivo protegido y el límite de concentración se verifican nuevamente al momento de la aceptación. La liquidación consume un diplomático e inicia el tiempo de reutilización de compra/venta de un mes de este emisor."
 bfl_buy_confirm_title: "Confirmar compra de acciones"
 bfl_buy_secondary_confirm_desc: "comprar [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_quantity').GetValue|3] acciones existentes de [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_issuer').GetCountry.GetName] de [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_seller').GetCountry.GetName] para [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_total').GetValue|2]@gold!. El vendedor actual recibe el pago. El emisor no recibe financiación y las acciones emitidas no cambian. La disponibilidad, el acceso, los fondos protegidos y la revisión de esta oferta se verifican nuevamente al momento de la aceptación. La liquidación consume un diplomático e inicia el tiempo de reutilización de compra/venta de un mes de este emisor."
 bfl_buy_selected_bond: "Comprar reclamo existente"
 bfl_buy_selected_bond_tip: "Pague el precio cotizado al vendedor actual. El emisor no recibe dinero nuevo. En la ejecución se revisan titularidad, vencimiento, generación, tanto de permutas como de atrasos y caja."
 bfl_buy_shares: "comprar acciones"
 bfl_buy_shares_desc: "Elija un banco o empresa, establezca una cantidad de acciones y luego revise el total. Comprar transfiere acciones existentes de una oferta de venta o inventario de un creador de mercado. Utilice la acción de suscripción de capital separada para financiar nuevas emisiones."
 bfl_buy_shares_tip: "Elija un banco o empresa, establezca una cantidad de acciones y luego revise el total. Comprar transfiere acciones existentes de una oferta de venta o inventario de un creador de mercado. Utilice la acción de suscripción de capital separada para financiar nuevas emisiones.\nRequiere un intercambio completo, negociación de acciones y al menos un diplomático. Cada operación exitosa consume un diplomático y comienza un tiempo de reutilización de un mes para ese emisor. Diplomáticos disponibles: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bfl_available_trade_diplomats')|2]. Los pedidos deben tener un valor en efectivo de al menos 0.01 oro."
 bfl_buy_sovereign_bond: "Comprar un bono soberano ofrecido"
 bfl_buy_sovereign_bond_act: "$bfl_buy_sovereign_bond$"
 bfl_buy_sovereign_bond_desc: "Comprar un bono soberano existente a su tenedor actual. Requiere un edificio de la Bolsa de Valores terminado en propiedad."
 bfl_buy_sovereign_bond_effect_text: "$bfl_buy_sovereign_bond$"
 bfl_buy_sovereign_bond_effect_text_past: "$bfl_buy_sovereign_bond$"
 bfl_buy_sovereign_bond_tip: "Seleccione el emisor de una oferta abierta. El pago va al titular actual; el emisor no recibe nuevos ingresos. Todo el reclamo cambia de manos con su cupón anual fijo y su principal intactos."
 bfl_buy_state_confirm_desc: "Recomprar [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_quantity').GetValue|3] acciones existentes de [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_issuer').GetCountry.GetName] del inventario de creadores de mercado para [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_total').GetValue|2]@gold!, pagado con cargo al tesoro de su país. Estas acciones vuelven a su participación en tesorería. El banco no recibe financiación y las acciones emitidas no cambian. Se verifican nuevamente las acciones de distribuidor disponibles, la cotización de mercado actual, la autoridad de fletamento en vivo y el efectivo de tesorería. La liquidación consume un diplomático e inicia el enfriamiento de compra/venta de un mes de este banco."
 bfl_cancel: "Cancelar"
 bfl_cancel_selected_bond_offer: "Cancelar listado"
 bfl_cancel_selected_bond_offer_tip: "Retire una oferta de su propiedad o de su banco autorizado. La deuda y el cupón se mantienen sin cambios."
 bfl_capital_button: "Suscribir capital · 100 oro"
 bfl_capital_heading: "capital bancario"
 bfl_cash: "efectivo"
 bfl_cash_detail_title: "efectivo de [Country.GetName]"
 bfl_cash_tip: "#T efectivo del tesoro#!\nOro actualmente en poder del banco.\n\nEfectivo total: [Country.GetFixedPointCurrencyValue('gold')|2]@gold!\nEfectivo protegido: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_protected_cash')|2]@gold!\nEfectivo disponible: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_free_cash')|2]@gold!\n\nReservas de efectivo protegidas 25% de pasivos restantes después de los retiros en cola, la cola de retiro completa, un 25 colchón operativo de oro y efectivo comprometido. El efectivo disponible es efectivo de tesorería menos esa reserva, con un mínimo de cero. El efectivo protegido es una reserva requerida; puede exceder el efectivo realmente retenido."
 bfl_chart_debt_01: "Deuda: [Country.MakeScope.GetVariable('bfl_history_debt_01').GetValue|2]@gold! · mes contable [Country.MakeScope.GetVariable('bfl_history_period_01').GetValue|0]"
