l_spanish:
 wisselbank_desc: "El banco de cambio de la ciudad reúne monedas y letras bajo el techo del viejo ayuntamiento y ordena un comercio que cruza todas las fronteras. Sus reservas y libros cuidadosos mantienen la confianza en el crédito público. Una Wisselbank terminada reduce la administración del banco autorizado en 15% y permite servicios monetarios tras los avances necesarios."
 riksbank_desc: "Bajo la custodia de los estamentos, un banco permanente guarda las reservas del reino y ordena su crédito público. Sus empleados reciben depósitos, liquidan obligaciones y preservan la confianza en las promesas del Estado. Una Riksbank terminada reduce la administración del banco autorizado en 15% y permite servicios monetarios tras los avances necesarios."
