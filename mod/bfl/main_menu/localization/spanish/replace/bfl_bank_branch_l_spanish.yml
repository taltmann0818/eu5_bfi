l_spanish:
 banking_office: "Sucursal bancaria"
 banking_office_desc: "Una oficina bancaria local. Un soberano con banco autorizado puede financiar sucursales extranjeras mediante la construcción normal, sujeta a las relaciones con el anfitrión y los requisitos habituales. Al terminarse, la sucursal pertenece al banco autorizado. Los nuevos créditos soberanos, depósitos e inversiones requieren una sucursal terminada del banco en la capital actual del soberano. Las reclamaciones existentes siguen administrándose."
