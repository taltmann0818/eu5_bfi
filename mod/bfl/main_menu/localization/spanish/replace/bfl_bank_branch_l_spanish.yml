l_spanish:
 banking_office: "Sucursal bancaria"
 banking_office_desc: "Una oficina bancaria local. Los nuevos créditos, depósitos e inversiones soberanos requieren una sucursal completa de propiedad del banco en el capital actual del soberano. Las reclamaciones existentes siguen siendo válidas; Los negocios de banco a banco no necesitan sucursales."
