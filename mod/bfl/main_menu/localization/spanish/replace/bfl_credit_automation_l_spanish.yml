l_spanish:
 AUTOMATED_SYSTEM_CREDIT: "Gestión de crédito"
 AUTOMATED_SYSTEM_CREDIT_DESC: "Gestionar préstamos y bonos estatales. Su banco también revisa las adquisiciones de préstamos, ofrece préstamos financiados a prestatarios que necesitan efectivo e invierte el efectivo sobrante en acciones disponibles. Las empresas gestionan el comercio y la exploración. El banco mantiene reservas y controla la capacidad de endeudamiento; los prestatarios deben aceptar nuevos préstamos."
 AUTOMATE_SYSTEM_TOOLTIP_CREDIT: "Habilite la gestión de crédito en automatización: deuda estatal, préstamos bancarios, inversiones y operaciones de la empresa."
 DEAUTOMATE_SYSTEM_TOOLTIP_CREDIT: "Deshabilite la gestión de crédito. Se siguen pagando los préstamos, depósitos y pagos prometidos existentes."
