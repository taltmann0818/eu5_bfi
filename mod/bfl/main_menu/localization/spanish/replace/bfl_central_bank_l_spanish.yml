l_spanish:
 central_bank_desc: "Una institución central para la custodia de las reservas y la ordenación del crédito público reúne bajo un mismo techo los dispersos negocios financieros. Un banco autorizado y respaldado por un Banco Central completo paga 15% menos en costos de administración y gana acceso a servicios monetarios a medida que se investigan los avances necesarios. Los pagarés siguen siendo obligaciones respaldadas; su emisión no genera beneficios bancarios."
