l_polish:
 central_bank_desc: "Centralna instytucja zajmująca się przechowywaniem rezerw i zarządzaniem kredytem publicznym skupia pod jednym dachem rozproszoną działalność finansową. Płaci bank licencjonowany wspierany przez ukończony Bank Centralny 15% mniejsze koszty administracyjne i uzyskuje dostęp do usług pieniężnych w miarę poszukiwania niezbędnych postępów. Obligacje pozostają zobowiązaniami zabezpieczonymi; ich emisja nie generuje zysku banku."
