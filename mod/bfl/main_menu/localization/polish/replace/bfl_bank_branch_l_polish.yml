l_polish:
 banking_office: "Oddział Banku"
 banking_office_desc: "Lokalny oddział bankowy. Władca posiadający bank uprzywilejowany może finansować zagraniczne oddziały przez zwykłą budowę, zgodnie ze stosunkami z gospodarzem i standardowymi wymaganiami. Ukończony oddział należy do banku. Nowe kredyty państwowe, depozyty i inwestycje wymagają ukończonego oddziału banku w obecnej stolicy państwa. Istniejące należności są nadal obsługiwane."
