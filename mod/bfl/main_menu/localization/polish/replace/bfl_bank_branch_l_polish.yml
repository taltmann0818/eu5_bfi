l_polish:
 banking_office: "Oddział Banku"
 banking_office_desc: "Lokalne biuro banku. Nowe państwowe kredyty, depozyty i inwestycje wymagają skompletowania oddziału będącego własnością banku w obecnym kapitale państwa. Istniejące roszczenia pozostają wykonalne; Działalność międzybankowa nie wymaga oddziału."
