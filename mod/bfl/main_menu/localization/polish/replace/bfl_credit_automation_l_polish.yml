l_polish:
 AUTOMATED_SYSTEM_CREDIT: "Zarządzanie kredytami"
 AUTOMATED_SYSTEM_CREDIT_DESC: "Zarządzaj pożyczkami państwowymi i obligacjami. Twój bank sprawdza również przejęcia kredytów, oferuje pożyczki kapitałowe pożyczkobiorcom potrzebującym gotówki i inwestuje wolne środki w zbadane akcje. Firmy zarządzają handlem i eksploracją. Bank utrzymuje rezerwy i sprawdza zdolność zadłużenia; pożyczkobiorcy muszą zaakceptować nowe pożyczki."
 AUTOMATE_SYSTEM_TOOLTIP_CREDIT: "Włącz zarządzanie kredytami w automatyzacji: dług państwa, kredyty bankowe, inwestycje i operacje firmy."
 DEAUTOMATE_SYSTEM_TOOLTIP_CREDIT: "Wyłącz zarządzanie kredytami. Istniejące kredyty, depozyty i przyrzeczone płatności są w dalszym ciągu obsługiwane."
