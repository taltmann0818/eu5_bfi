l_polish:
 wisselbank_desc: "Miejski bank wymiany gromadzi monety i weksle pod dachem starego ratusza, porządkując handel ponad granicami. Rezerwy i staranne księgi podtrzymują zaufanie do kredytu publicznego. Ukończony Wisselbank obniża koszty administracji banku uprzywilejowanego o 15% i umożliwia usługi monetarne po opracowaniu wymaganych postępów."
 riksbank_desc: "Pod opieką stanów stały bank przechowuje rezerwy królestwa i porządkuje jego kredyt publiczny. Urzędnicy przyjmują depozyty, rozliczają zobowiązania i podtrzymują zaufanie do obietnic państwa. Ukończony Riksbank obniża koszty administracji banku uprzywilejowanego o 15% i umożliwia usługi monetarne po opracowaniu wymaganych postępów."
