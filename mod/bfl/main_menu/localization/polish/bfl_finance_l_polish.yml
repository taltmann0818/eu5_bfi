 bfl_custom_bond_flows: "W tym miesiącu: wydany [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bfl_bond_financing_display')|2]@gold! · kupony zapłacone [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bfl_bond_cost_display')|2]@gold! · odkupiony [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bfl_bond_redemption_display')|2]@gold!"
 bfl_custom_bond_terms: "Kupony na nowe obligacje"
 bfl_custom_bond_totals: "Znakomity: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bfl_bond_debt')|2]@gold! · kupon miesięczny: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bfl_bond_monthly_coupon')|2]@gold! · nieopłacone: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bfl_bond_arrears')|2]@gold!"
 bfl_custom_bonds_title: "Obligacje skarbowe"
 bfl_custom_bonds_title_tip: "Bank pożycza państwu gotówkę i otrzymuje obligację. Jego właściciel otrzymuje miesięczne odsetki i spłatę. Całkowite zadłużenie ogranicza się do 24 miesięcy dochodu rodzimego, z a 500- złoty dodatek startowy. Oprocentowanie obligacji może zostać wykorzystane co najwyżej 25% dochodu rodzimego. Niezapłacone odsetki blokują nowe obligacje i sprzedaż."
 bfl_cycle_bond_rate_tip: "Zmiana rocznego oprocentowania nowych obligacji: 1%, 3% lub 6%. Istniejące obligacje utrzymują swoje oprocentowanie."
 bfl_cycle_deposit_rate_tip: "Zmień oprocentowanie nowych lokat: 0%, 1% lub 2% rok. Istniejące konta zachowują swoją stawkę."
 bfl_cycle_facility_tip: "Zmień miesięczne finansowanie: Wył., Wydatki lub Bufor gotówkowy. Wydatki stanowią część wydatków państwa. Bufor gotówkowy uzupełnia stan gotówki. Obydwa dzielą miesięczny limit z pożyczaniem ręcznym."
 bfl_cycle_payout_tip: "Zmień dywidendę: zatrzymaj cały zysk, zapłać 25%lub zapłać 50%. Płatności wykorzystują wypracowany zysk po kosztach i stratach. Wymaga kontroli polityki dywidendowej."
 bfl_cycle_share_offering_tip: "Otwórz lub zamknij subskrypcje nowych akcji. Płatne subskrypcje dodają kapitał i nowe akcje; obecni właściciele zachowują swoje udziały i prawa do dywidendy."
 bfl_dealer_inventory_class: "Inwentarz animatora rynku · brak głosów"
 bfl_debt: "Rodzimy portfel wierzytelności"
 bfl_debt_explanation: "Bank licencjonowany finansuje niestandardowe obligacje skarbowe. Handel wtórny wymaga ukończenia Giełd Papierów Wartościowych po obu stronach, w tym dotacji na wcześniejsze wydarzenia. Natywny kredyt korzysta z zaakceptowanych ofert i bada redukcję zadłużenia z utrwalonymi zapisami roszczeń."
 bfl_debt_facility: "Instrument Długowy"
 bfl_debt_resale: "Odsprzedaż długu"
 bfl_debt_resale_tip: "#T Odsprzedaż obligacji skarbowych#!\nSprzedaż i kupno wtórnych obligacji skarbowych wymaga zaliczki giełdowej i posiadania budynku giełdy. Oferta otwarta przenosi to samo roszczenie niestandardowe 98% wartości nominalnej; emitent nie uzyskuje żadnych nowych wpływów. Kupony i realizacja podążają za kupującym."
 bfl_debt_restructuring: "Restrukturyzacja zadłużenia"
 bfl_debt_restructuring_desc: "Dług, którego nie da się odzyskać w wyznaczonym terminie, nie musi być bezwartościowy. Wierzyciele mogą zabezpieczyć większą część swoich roszczeń, zgadzając się na nowe warunki, niż naciskając znajdującego się w trudnej sytuacji dłużnika, aby całkowicie nie wywiązał się ze zobowiązań."
 bfl_debt_tip: "#T Dług i kredyt#!\nZezwolenia na udzielanie kredytów, gwarantowanie emisji, restrukturyzację i przelewy wierzytelności. Każdy rząd ma własne wymagania dotyczące badań, specjalizacji, płynności i wykonania. Blokada oznacza, że ​​nowe pochodzenie jest niedostępne; nie anuluje istniejących roszczeń."
 bfl_demand_deposit: "Depozyt na żądanie"
 bfl_deposit_1: "Depozyt 100 złoto na zamówienie"
 bfl_deposit_1_tip: "#T Depozyt na żądanie#!\nPrzeniesienie 100 stan złota do swojego banku czarterowego. Oferta roczna dla nowego konta obejmuje wyświetlaną stawkę podstawową plus a 1% premia czarterowa. Odsetki na żądanie są wypłacane co miesiąc do Twojego skarbca, w przypadku zasilenia, z przeniesieniem centa; niezapłacone odsetki pozostają należne. Istniejące konta zachowują zaakceptowaną stawkę. Wycofanie spłaca kwotę główną i niezapłacone odsetki. Niezależne banki przyjmują depozyty za pośrednictwem dyplomacji pod adresem +50 zdaniem lub lepiej i zaoferuj stawkę podstawową."
 bfl_deposit_2: "Depozyt 100 złoto za 12 miesiące"
 bfl_deposit_2_tip: "#T Lokata terminowa#!\nPrzeniesienie 100 złoto stanowe do Twojego banku czarterowego na dwanaście miesięcy. Oferta roczna dla nowego konta obejmuje wyświetlaną stawkę terminową plus a 1% premia czarterowa. Odsetki naliczane są co miesiąc i spłacane razem z kapitałem w terminie zapadalności. Wymaga natywnej bankowości, dozwolonego wieku i wolnego miejsca na koncie. Niezależne konta terminowe są dostępne za pośrednictwem dyplomacji pod adresem +50 zdaniem lub lepiej."
 bfl_deposit_accounts_heading: "Konta depozytowe"
 bfl_deposit_amount: "Depozyt"
 bfl_deposit_amount_desc: "Wybierz kwotę wpłaty. Lokaty terminowe są prowadzone przez dwanaście miesięcy."
 bfl_deposit_amount_label: "Kwota depozytu"
 bfl_deposit_amount_tip: "Wybierz bank i kwotę. Przelej gotówkę ze skarbca na konto. Odsetki i wypłaty należą do deponenta. Po potwierdzeniu bank ponownie sprawdza środki i warunki."
 bfl_deposit_decline_tip: "Zachowaj pełne roszczenie o depozyt. Nie ma żadnych przepływów pieniężnych ani emisji akcji."
 bfl_deposit_equity_tip: "Zamień podaną wierzytelność na realne akcje tylko wtedy, gdy bank, który przetrwa, ma dodatnią namacalną NAV i zdolność akcjonariuszy. Nie są tworzone żadne środki pieniężne ani zarobki z subskrypcji."
 bfl_deposit_explanation: "Każde konto przechowuje zaakceptowaną stałą stawkę roczną. Zmiana stawki ma wpływ na nowe konta. Konta terminowe zapadają po 12 miesiące. Niedobory związane z wypłatami pozostają zobowiązaniami i wstrzymują nowe zobowiązania."
 bfl_deposit_haircut_tip: "Zaakceptuj cytat 20% redukcja po ponownym sprawdzeniu wierzyciela, pozostałej wierzytelności, badań i uprawnień. Rejestrowana gwarancja publiczna jest nadal finansowana oddzielnie."
 bfl_deposit_income_tip: "Zażądaj odsetek faktycznie zapłaconych w tym miesiącu przez Twój bank licencjonowany i banki niezależne. Niezapłacone odsetki pozostają do spłaty. Wypłaty główne i wkłady kapitałowe są wyłączone."
 bfl_deposit_interest: "Odsetki od depozytu"
 bfl_deposit_ledger_help: "Każde konto zachowuje ustaloną stopę procentową. Lokaty terminowe trwają dwanaście miesięcy. Pieniądze i odsetki wracają do deponenta."
 bfl_deposit_ledger_subtitle: "Rachunki bieżące"
 bfl_deposit_ledger_title: "Deponenci"
 bfl_deposit_ledger_title_tip: "Kto ma pieniądze w tym banku. Najedź kursorem, aby sprawdzić konta i wypłaty."
 bfl_deposit_policy_title: "Stopa depozytowa"
 bfl_deposit_policy_title_tip: "Roczna stawka oferowana nowym depozytom. Istniejące depozyty zachowują ustalone oprocentowanie."
 bfl_deposit_total: "Depozyty"
 bfl_deposit_total_tip: "Pieniądze, które bank jest winien swoim deponentom, łącznie z niezapłaconymi odsetkami."
 bfl_deposits: "Depozyty i stawki"
 bfl_deposits_label: "Roszczenia depozytowe"
 bfl_dev_notice: "Kredyty kapitałowe, obligacje skarbowe, inwestycje przedsiębiorstw, towary, polecenia i usługi pieniężne są zgodne z ich wymaganiami badawczymi, profilowymi i budowlanymi. Bilans kampanii i zgodność w całej wersji są w trakcie sprawdzania."
 bfl_distress: "Bramy cierpienia i rozwoju"
 bfl_distribution_title: "Wypłata dywidendy"
 bfl_distribution_title_tip: "Część kwalifikowanego miesięcznego zysku wypłacana właścicielom. Reszta zostaje w banku."
 bfl_dividend_breakdown: "Dywidendy bankowe"
 bfl_dividend_breakdown_subtitle: "Stawka roczna i rozliczenie miesięczne"
 bfl_dividend_calculation: "Kalkulacja miesięcznej dywidendy"
 bfl_dividend_explanation: "Miesięczny zysk netto po uwzględnieniu odsetek od depozytów, kosztów operacyjnych i poniesionych strat z tytułu dywidend. Każdy właściciel otrzymuje posiadane akcje pomnożone przez kwotę wypłaty na akcję pozostającą w obrocie. Zyski zatrzymane nie będą ponownie wypłacane w przyszłym miesiącu."
 bfl_dividend_rate_note: "Stawka roczna to ostatnie miesięczne wpływy pomnożone przez dwanaście, a nie obietnica. Koszty banku obejmują odsetki od depozytów, koszty operacyjne i poniesione straty. Każdy właściciel otrzymuje swoją część wypłaconej kwoty, zaokrągloną w dół do dukatów i centów."
 bfl_draw_bond: "Pożycz 100 z banku"
 bfl_draw_bond_tip: "Bank licencjonowany płaci 100 złoto za wieczystą obligację państwową. W każdym miesiącu można finansować kilka emisji, do kwoty 1,000 w sumie złoto. Bank musi utrzymywać wystarczającą ilość gotówki i kapitału, a państwo musi zapewniać odsetki. Dochody stanowią finansowanie. Spłać wartość nominalną obecnemu posiadaczowi, aby go wycofać."
 bfl_equity_debt: "Kapitał własny i dług banku"
 bfl_equity_debt_tip: "#T Kapitał własny i dług banku#!\nDo dwunastu rzeczywistych miesięcznych migawek rozliczeń. Zielony to aktywa minus pasywa; czerwony to całkowite zobowiązania banku. Obydwa korzystają z tej samej automatycznie skalowanej osi złota, włączając ujemny kapitał własny. Próbki są wyświetlane od najstarszego po lewej stronie do najnowszego po prawej stronie. Najedź kursorem na próbkę, aby wyświetlić jej wartość i miesiąc rozliczeniowy. Pożyczki państwowe nie są uwzględniane w tej historii banku."
 bfl_equity_detail_title: "Kapitał własny [Country.GetName]"
 bfl_equity_label: "Kapitał własny"
 bfl_equity_label_tip: "#T Kapitał własny banku#!\nWartość końcowa należąca do właścicieli banku po jego zobowiązaniach.\n\nAktywa: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_assets')|2]@gold!\nMniejsze zadłużenie całkowite: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_liabilities')|2]@gold!\nKapitał własny: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_equity')|2]@gold!\n\nZarejestrowane jednostki stanu: [Country.MakeScope.GetVariable('bfl_state_units').GetValue|2]\nCałkowita liczba jednostek własności: [Country.MakeScope.GetVariable('bfl_total_units').GetValue|2]\nKapitałowa przestrzeń nad głową: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_capital_headroom')|2]@gold!\n\nUjemny kapitał własny oznacza niewypłacalność. Rezerwa kapitałowa jest powyżej kapitału własnego 10% aktywów, minimalnie zero; dystrybucje są ograniczone zarówno tą rezerwą, jak i dostępną gotówką. Kapitał własny nie jest kwotą, którą można natychmiast wypłacić."
 bfl_equity_market: "Cena akcji i historia"
 bfl_equity_subscribe_0: "Skarbiec: subskrybuj 100 złoto"
 bfl_equity_subscribe_0_tip: "Podstawowa subskrypcja NAV: płaci emitentowi i rozwodni istniejących posiadaczy. Zakupy nieruchomości korzystają z rzeczywistego portfela nieruchomości, zachowując 25 złoto. Inwestor bankowy wykorzystuje wyłącznie własne chronione środki pieniężne i nadwyżki kapitału; kapitał spółki wymaga badań dotyczących inwestycji zagranicznych."
 bfl_equity_subscribe_1: "Mieszczanie: subskrybuj 100 złoto"
 bfl_equity_subscribe_1_tip: "Podstawowa subskrypcja NAV: płaci emitentowi i rozwodni istniejących posiadaczy. Zakupy nieruchomości korzystają z rzeczywistego portfela nieruchomości, zachowując 25 złoto. Inwestor bankowy wykorzystuje wyłącznie własne chronione środki pieniężne i nadwyżki kapitału; kapitał spółki wymaga badań dotyczących inwestycji zagranicznych."
 bfl_equity_subscribe_2: "Szlachta: subskrybuj 100 złoto"
 bfl_equity_subscribe_2_tip: "Podstawowa subskrypcja NAV: płaci emitentowi i rozwodni istniejących posiadaczy. Zakupy nieruchomości korzystają z rzeczywistego portfela nieruchomości, zachowując 25 złoto. Inwestor bankowy wykorzystuje wyłącznie własne chronione środki pieniężne i nadwyżki kapitału; kapitał spółki wymaga badań dotyczących inwestycji zagranicznych."
 bfl_equity_subscribe_3: "Duchowni: subskrybuj 100 złoto"
 bfl_equity_subscribe_3_tip: "Podstawowa subskrypcja NAV: płaci emitentowi i rozwodni istniejących posiadaczy. Zakupy nieruchomości korzystają z rzeczywistego portfela nieruchomości, zachowując 25 złoto. Inwestor bankowy wykorzystuje wyłącznie własne chronione środki pieniężne i nadwyżki kapitału; kapitał spółki wymaga badań dotyczących inwestycji zagranicznych."
 bfl_equity_subscribe_4: "Chłopi: subskrybujcie 100 złoto"
 bfl_equity_subscribe_4_tip: "Podstawowa subskrypcja NAV: płaci emitentowi i rozwodni istniejących posiadaczy. Zakupy nieruchomości korzystają z rzeczywistego portfela nieruchomości, zachowując 25 złoto. Inwestor bankowy wykorzystuje wyłącznie własne chronione środki pieniężne i nadwyżki kapitału; kapitał spółki wymaga badań dotyczących inwestycji zagranicznych."
 bfl_equity_vote_payout_0: "Większość głosów: 0% wypłatę dywidendy"
 bfl_equity_vote_payout_0_tip: "Wymaga więcej niż połowy wydanych głosów finansowych. Wyłącznie zasady dotyczące zysków zatrzymanych firmy i niezależnego banku. Wyznaczona polityka pieniężna i dotycząca wypłat pozostaje w gestii kontrolera lądującego na żywo. Żadnego transferu tematów politycznych."
 bfl_equity_vote_payout_25: "Większość głosów: 25% wypłatę dywidendy"
 bfl_equity_vote_payout_25_tip: "Wymaga więcej niż połowy wydanych głosów finansowych. Wyłącznie zasady dotyczące zysków zatrzymanych firmy i niezależnego banku. Wyznaczona polityka pieniężna i dotycząca wypłat pozostaje w gestii kontrolera lądującego na żywo. Żadnego transferu tematów politycznych."
 bfl_equity_vote_payout_50: "Większość głosów: 50% wypłatę dywidendy"
