 bfl_money_hint_tip: "Notatki podlegają wymianie na w pełni zastrzeżone roszczenie. Akceptacja jest dobrowolna. Zniżki z góry 75 złoto przeciwko A 100-złoty banknot trzeciego banku. Rozliczenie rozlicza pasujące zapadłe rachunki tylko wtedy, gdy każdy członek jest w stanie spłacić swoje debet netto. Istniejące roszczenia przetrwają utraconą władzę i budynki."
 bfl_money_leave: "Zostaw sprzątanie"
 bfl_money_leave_tip: "Notatki podlegają wymianie na w pełni zastrzeżone roszczenie. Akceptacja jest dobrowolna. Zniżki z góry 75 złoto przeciwko A 100-złoty banknot trzeciego banku. Rozliczenie rozlicza pasujące zapadłe rachunki tylko wtedy, gdy każdy członek jest w stanie spłacić swoje debet netto. Istniejące roszczenia przetrwają utraconą władzę i budynki."
 bfl_money_lending_rate: "Nowa baza kredytowa"
 bfl_money_lending_rate_tip: "Cyklicznie zmieniaj roczną podstawę dla przyszłych zwykłych pożyczek 3%, 6% i 9%. Korekty dotyczące pożyczkobiorców nadal obowiązują. Akceptowane pożyczki zachowują swoje stawki."
 bfl_money_notes: "Zdobądź 100 w notatkach"
 bfl_money_notes_tip: "Wymaga badań nad absolutyzmem, bankowością centralną i banknotami państwowymi, autoryzacją suwerena na żywo, wypełnionym oddziałem banku emitenta i ukończonym bankiem centralnym suwerena w bieżącym kapitale, 100 złoto skarbowe i niewykorzystana pojemność banknotów. Mniejszy z 25% kapitał banku i 500 obieg złotych kapsli."
 bfl_money_offer_accept: "Sfinansuj zabezpieczoną zaliczkę"
 bfl_money_offer_accept_tip: "Fundusz 75 złoto z dostępnych środków pożyczkodawcy, jeśli obecny zarządca, wycena i zabezpieczenie banku trzeciego pozostaną ważne. Przyjęta stawka roczna jest stała dla tego obiektu; przynajmniej opłaty za wsparcie publiczne 9%."
 bfl_money_offer_decline: "Odrzuć prośbę"
 bfl_money_offer_decline_tip: "Zamknij tę prośbę bez przenoszenia złota i składania zabezpieczenia."
 bfl_money_offer_desc: "Postęp 75 złoto w porównaniu z oddzielnie finansowanym funduszem 100-złoto wekslowe przechowywane w trzecim banku. A 25% strzyżenie chroni pożyczkodawcę. Przyjęta roczna stopa dyskontowa obowiązuje przez okres jednego miesiąca; przynajmniej opłaty za wsparcie publiczne 9%. W ramach ugody płaci się najpierw pożyczkodawcy, a resztę zwraca pożyczkobiorcy. Nierzeczywiste zabezpieczenie zabezpiecza oba roszczenia. To żądanie wygasa w tym miesiącu."
 bfl_money_offer_title: "Zabezpieczona możliwość rozliczenia"
 bfl_money_policy_rate: "Cyklowa przyszła stopa dyskontowa"
 bfl_money_policy_rate_tip: "Cyklicznie zmieniaj roczną stopę przyszłych zabezpieczonych zaliczek 6%, 9% i 12%. Przy odbiorze naliczany jest jeden miesiąc; istniejące obiekty zachowują swoje opłaty. Przynajmniej opłaty za wsparcie publiczne 9%."
 bfl_money_redeem: "Zrealizuj notatki państwowe"
 bfl_money_redeem_tip: "Wymień wszystkie banknoty posiadane przez suwerennego kontrolera na ich wartość nominalną. Utrata uprawnień, badań lub oddziałów nie anuluje istniejących roszczeń. Niezapłacone roszczenie pozostaje należne."
 bfl_money_repay: "Spłata zabezpieczonego obiektu"
 bfl_money_repay_tip: "Spłata bieżącej zabezpieczonej zaliczki wraz ze stałą zaakceptowaną opłatą w celu zwolnienia zastawu wekslowego w banku trzecim. Wymaga wystarczającej ilości dostępnego złota."
 bfl_money_revoke: "Odwołać władzę"
 bfl_money_revoke_tip: "Cofnij suwerenne zezwolenie na nowe banknoty. Istniejące banknoty nadal można wymienić."
 bfl_money_settings: "Polityka"
 bfl_money_settings_tip: "Pokaż lub ukryj politykę pieniężną, uprawnienia do obsługi banknotów, zabezpieczenia kredytów i kontrole rozliczeniowe."
 bfl_money_settings_tip_tip: "Notatki podlegają wymianie na w pełni zastrzeżone roszczenie. Akceptacja jest dobrowolna. Zniżki z góry 75 złoto przeciwko A 100-złoty banknot trzeciego banku. Rozliczenie rozlicza pasujące zapadłe rachunki tylko wtedy, gdy każdy członek jest w stanie spłacić swoje debet netto. Istniejące roszczenia przetrwają utraconą władzę i budynki."
 bfl_money_subtitle: "Wierzytelności podlegające umorzeniu · rozliczenie kapitałowe"
 bfl_money_subtitle_tip: "Notatki podlegają wymianie na w pełni zastrzeżone roszczenie. Akceptacja jest dobrowolna. Zniżki z góry 75 złoto przeciwko A 100-złoty banknot trzeciego banku. Rozliczenie rozlicza pasujące zapadłe rachunki tylko wtedy, gdy każdy członek jest w stanie spłacić swoje debet netto. Istniejące roszczenia przetrwają utraconą władzę i budynki."
 bfl_money_terms: "Kwota główna i emisja są wyłączone z dochodu. Stopy dyskontowe mają charakter roczny i są stałe w momencie akceptacji. Zaufanie spada do 25 w przypadku niedoboru rezerw; w pełni zabezpieczone banknoty nie powodują inflacji. Płatności waniliowe w dalszym ciągu korzystają z rodzimego złota."
 bfl_money_terms_tip: "Notatki podlegają wymianie na w pełni zastrzeżone roszczenie. Akceptacja jest dobrowolna. Zniżki z góry 75 złoto przeciwko A 100-złoty banknot trzeciego banku. Rozliczenie rozlicza pasujące zapadłe rachunki tylko wtedy, gdy każdy członek jest w stanie spłacić swoje debet netto. Istniejące roszczenia przetrwają utraconą władzę i budynki."
 bfl_money_title: "Pieniądze i rozliczenie"
 bfl_money_title_tip: "Kwota główna i emisja są wyłączone z dochodu. Stopy dyskontowe mają charakter roczny i są stałe w momencie akceptacji. Zaufanie spada do 25 w przypadku niedoboru rezerw; w pełni zabezpieczone banknoty nie powodują inflacji. Płatności waniliowe w dalszym ciągu korzystają z rodzimego złota."
 bfl_native_credit_label: "Portfel kredytów"
 bfl_native_credit_label_tip: "Kredyty posiadane przez bank według ewidencjonowanej wartości nabycia. Wiersze pokazują kwotę główną, roczne odsetki i miesiące pozostałe do ostatniego przeglądu."
 bfl_native_tab: "Pożyczki państwowe"
 bfl_native_takeover: "Rodzime przejęcie"
 bfl_new_capital_subscription: "Subskrybuj nowy kapitał"
 bfl_new_capital_subscription_desc: "Inwestuj 100@gold! środków Twojego banku w [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_issuer').GetCountry.GetName] jako nowo wyemitowany kapitał własny według materialnej NAV. Emitent otrzymuje płatność, a obecni posiadacze ulegają rozwodnieniu. Jest to subskrypcja kapitału, odrębna od Kupna akcji. Wykonanie ponownie sprawdza przejętą NAV, wydane jednostki, badania, fundusze chronione i limit koncentracji. Zużywa jednego dyplomatę i rozpoczyna miesięczny okres odnowienia handlu tego emitenta."
 bfl_new_capital_subscription_tip: "Finansowanie podstawowe: inwestować 100 złoto z zarządzanego banku. Emitent otrzymuje środki pieniężne i emituje nowe akcje. Jest to odrębne od handlu istniejącymi akcjami."
 bfl_no_automatic_tribute: "Brak automatycznego daniny czarterowej"
 bfl_no_automatic_tribute_cost_modifier: "Automatyczny koszt daniny czarterowej"
 bfl_no_bank: "Wyczarteruj istniejący bank państwowy poprzez decyzje lub zagraj w niezależny kraj bankowy. Aby założyć bank, Twój kraj musi posiadać swój rynek kapitałowy."
 bfl_no_bank_holdings: "Bank nie posiada akcji."
 bfl_no_bank_short: "Brak banku licencjonowanego"
 bfl_no_deposit_accounts: "Żadnych depozytów"
 bfl_nobles_estate_workout_mandate: "Nakaz treningu majątku"
 bfl_nobles_estate_workout_mandate_desc: "Posiadłość ta wyraźnie upoważnia swój rząd do dokonywania w jej imieniu przeglądu dobrowolnych wypłat depozytów bankowych. Każda propozycja nadal wymaga osobnej akceptacji. Odwołanie tego przywileju powoduje unieważnienie oczekujących warunków majątkowych. Płatności windykacyjne nadal trafiają do portfela majątku."
 bfl_offer_bank_shares: "Zaoferuj nowe akcje banku"
 bfl_offer_bank_shares_tip: "Pozwól innym bankom i krajom subskrybować 100 złota według aktualnej wartości aktywów netto banku. Nowe akcje emitowane są wyłącznie po opłaceniu; obecni właściciele są rozwodnieni. Nadal potrzebne są badania w zakresie rodzimej bankowości i dodatni kapitał własny."
 bfl_offer_bond: "Zaoferuj obligację skarbową przechowywaną w banku"
 bfl_offer_bond_tip: "Wymień najstarszą obligację przechowywaną w banku przez trzy miesiące na godz 98% wartości nominalnej. Zarówno sprzedaż, jak i zakup wymagają posiadania ukończonego budynku Giełdy Papierów Wartościowych. Akceptacja polega na ponownym sprawdzeniu sprzedawcy, aktualnego posiadacza, generacji, środków i wygaśnięcia. Zaległości blokują handel."
 bfl_offer_bond_workout_01: "Restrukturyzacja oferty"
 bfl_offer_bond_workout_01_tip: "Poproś obecnego posiadacza, aby zaakceptował a 20% obniżka kwoty głównej i niezapłaconych kuponów oraz roczna obniżka kuponu o jeden punkt procentowy, przy czym: 1% piętro. Żadne pieniądze nie zostaną przeniesione, chyba że posiadacz osobno wyrazi na to zgodę. Wycena wygasa w tym miesiącu, a zmiany w roszczeniu powodują jej unieważnienie."
 bfl_offer_bond_workout_02: "Restrukturyzacja oferty"
