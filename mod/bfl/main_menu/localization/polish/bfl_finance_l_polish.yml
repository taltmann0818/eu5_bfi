 bfl_loan_button: "Przejmij pożyczkę"
 bfl_loans_columns: "Miesiące odsetek głównych pożyczkobiorcy"
 bfl_loans_empty: "Żadnych kredytów bankowych. Tutaj pojawiają się oferty pożyczek i zrealizowane przejęcia."
 bfl_log_charter: "Czarterowany i kapitalizowany przez Bank Stanowy"
 bfl_manage_shareholdings: "Decyzje akcjonariuszy"
 bfl_manage_shareholdings_desc: "Ustal dywidendę dla [ROOT.GetCountry.MakeScope.GetVariable('bfl_exchange_selected').GetCountry.GetName]. Większość głosów finansowych kontroluje wypłaty spółek i niezależnych banków. Państwo kontroluje swój własny bank licencjonowany. Wybory dotyczące rezerw spółki pozostawiają kontrolę polityczną bez zmian."
 bfl_manage_shareholdings_tip: "Wybierz spółkę lub bank, aby ustalić dywidendę. Wymaga większości głosów finansowych lub kontroli nad licencjonowanym bankiem. Widoczne są nadal udziały mniejszościowe z niespełnionym wymogiem."
 bfl_margining: "Marginesy"
 bfl_margining_and_risk_management: "Marża i zarządzanie ryzykiem"
 bfl_margining_and_risk_management_desc: "Sprzedawcy, którzy obiecują przyszłe dostawy, muszą mierzyć się ze zmieniającymi się cenami na długo przed wygaśnięciem kontraktów. Wymaganie dodatkowego zabezpieczenia w miarę wzrostu ekspozycji daje bankierom możliwość powstrzymania strat, zanim niekorzystny rynek stanie się niewypłacalny."
 bfl_margining_tip: "#T Zarządzanie marżą i ryzykiem#!\nWymagaj zabezpieczenia i zmiennego depozytu zabezpieczającego w przypadku zmieniającej się ekspozycji na towary. Wymaga badań nad marżą i zarządzaniem ryzykiem, finansami handlowymi i wiekiem rewolucji. W tej wersji nie jest dostępna realizacja marży zabezpieczonej towarami."
 bfl_market_company_requirement: "Akcje spółki wymagają badania inwestycji zagranicznych i kapitału spółki. Akcje banku korzystają z mechanizmu Share Dealing."
 bfl_market_funds_requirement: "Twój bank może sobie pozwolić na akcje w ramach swoich limitów gotówkowych, kapitałowych i własnościowych."
 bfl_market_holder_requirement: "Emitent ma wolne miejsce dla akcjonariuszy lub już rejestruje Twój bank kupujący jako akcjonariusza."
 bfl_market_portfolio_requirement: "Twój bank kupujący ma wolne miejsce w portfelu lub już posiada to zabezpieczenie."
 bfl_market_sort_price: "Sortuj według ceny za akcję"
 bfl_monetary: "Polityka pieniężna i płynność"
 bfl_monetary_explanation: "Wymieniaj gatunek na banknoty zastrzeżone z władzami suwerennymi i wypełnionym Bankiem Centralnym. Dyskontowe weksle banku trzeciego po zabezpieczeniu i instrumentach płynnościowych; Rewolucje dodają siatki członkowskie finansowane i ograniczone publiczne zabezpieczone wsparcie. Akceptowane stawki pozostają stałe."
 bfl_monetary_tip: "#T Instrumenty monetarne#!\nPóźniejsze pozwolenia na obligacje państwowe, zabezpieczona płynność, rozliczenia i wsparcie publiczne. Każdy z nich wymaga własnego zezwolenia, wsparcia i warunków działania."
 bfl_money_accept: "Przełącz akceptację i rabaty"
 bfl_money_accept_tip: "Notatki podlegają wymianie na w pełni zastrzeżone roszczenie. Akceptacja jest dobrowolna. Zniżki z góry 75 złoto przeciwko A 100-złoty banknot trzeciego banku. Rozliczenie rozlicza pasujące zapadłe rachunki tylko wtedy, gdy każdy członek jest w stanie spłacić swoje debet netto. Istniejące roszczenia przetrwają utraconą władzę i budynki."
 bfl_money_acceptance_action: "Zmień dobrowolną akceptację"
 bfl_money_authorize: "Autoryzuj notatki"
 bfl_money_authorize_tip: "Suwerenny kontroler autoryzuje swój licencjonowany bank. W obecnym kapitale wymagany jest ukończony bank centralny będący własnością państwa. Nowa emisja wymaga także oddziału banku w kapitale emitenta oraz badania banknotów."
 bfl_money_clear: "Ureguluj rachunki członkowskie"
 bfl_money_clear_open: "Oczyszczanie wstępu"
 bfl_money_clear_open_tip: "Otwórz lub zamknij dostęp do swojej grupy rozliczeniowej. Wymaga badań dotyczących rewolucji, izby rozliczeniowej i zaawansowanego rozliczeń oraz ukończonej izby rozliczeniowej będącej własnością banku lub jego rzeczywistego suwerena. Maksymalnie czterech członków."
 bfl_money_clear_tip: "Raz w tym miesiącu rozlicz pasujące rachunki za zaległy członkostwo. Każdy członek musi pokryć swój debet netto, chroniąc jednocześnie inne rezerwy. Jeden krótki członek zachowuje całą partię. Roszczenia zastawne i nieczłonkowskie są wyłączone."
 bfl_money_empty: "Brak banknotów w obiegu. Badania monetarne, uprawnienia i ukończone budynki odblokowują nowe usługi."
 bfl_money_empty_tip: "Notatki podlegają wymianie na w pełni zastrzeżone roszczenie. Akceptacja jest dobrowolna. Zniżki z góry 75 złoto przeciwko A 100-złoty banknot trzeciego banku. Rozliczenie rozlicza pasujące zapadłe rachunki tylko wtedy, gdy każdy członek jest w stanie spłacić swoje debet netto. Istniejące roszczenia przetrwają utraconą władzę i budynki."
