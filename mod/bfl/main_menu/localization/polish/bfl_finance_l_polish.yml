 bfl_venture_policy: "Warunki"
 bfl_venture_preset_0: "Jednostronne · 75% nadwyżka bankowa"
 bfl_venture_preset_1: "Dwustronne · równa nadwyżka"
 bfl_venture_preset_tip: "Jednostronne: bank finansuje cały kapitał i otrzymuje 75% nadwyżki. Dwustronne: fundusze banku dwie trzecie, operator jedna trzecia, nadwyżka podzielona równo. Straty wynikają z wkładów kapitałowych."
 bfl_venture_settings_tip: "Rozwiń proponowane warunki. Zmiany dotyczą wyłącznie przyszłych ofert; zaakceptowane projekty zachowują pierwotną umowę."
 bfl_venture_state_1: "Aktywny · kapitał zagrożony"
 bfl_venture_state_2: "Zamknięte · kapitał odzyskany"
 bfl_venture_state_3: "Zamknięte · strata rozpoznana"
 bfl_venture_state_4: "Brak środków · wykonanie niedostępne"
 bfl_venture_subtitle: "Nazwane działania · zmierzone koszty i sprzedaż"
 bfl_venture_ticket_100: "Limit finansowania · 100 złoto"
 bfl_venture_ticket_200: "Limit finansowania · 200 złoto"
 bfl_venture_ticket_400: "Limit finansowania · 400 złoto"
 bfl_venture_ticket_tip: "Cykl maksymalnej autoryzacji banku 100, 200 lub 400 złoto. Rysowany jest tylko rzeczywisty koszt działania. Niewykorzystane finansowanie ładunku jest natychmiast uwalniane; niewykorzystane fundusze na wyprawę pozostają zarezerwowane dla kwalifikującego się ładunku z obszaru odkrytego do momentu zapadalności. Warunki dwustronne wymagają zdolności do połowy autoryzacji bankowej od operatora."
 bfl_venture_title: "Commenda podejmuje ryzyko"
 bfl_ventures: "Przedsięwzięcia i firmy · Inwestycje zagraniczne"
 bfl_ventures_explanation: "Commenda zaczyna się w Discovery; rodzime firmy i kapitał firmowy wymagają Reformacji. Kontrola zwierzchnictwa politycznego i własność finansowa pozostają oddzielone. Kapitał projektowy nie jest dywidendą."
 bfl_ventures_tip: "#T Przedsięwzięcia i firmy#!\nZezwolenia na finansowane przedsięwzięcia, inwestycje firm, zabezpieczenia projektów i transfery akcji bankowych. Narażają one kapitał na ryzyko inwestycyjne i wymagają odpowiednich badań i specjalizacji."
 bfl_view_companies: "Firmy"
 bfl_view_goods: "Towary"
 bfl_view_loans: "Pożyczki"
 bfl_view_monetary: "Usługi pieniężne"
 bfl_view_monetary_tip: "Banknoty, zabezpieczona płynność i rozliczenia."
 bfl_view_shares: "Akcje"
 bfl_view_trade: "Finansowanie handlu"
 bfl_warehouse_receipt: "Odbiór magazynowy"
 bfl_warehouse_receipt_tip: "#T Odbiór magazynowy#!\nZłóż reklamację w związku z możliwym do zidentyfikowania przechowywanym towarem. Wymaga badań w zakresie wpływów magazynowych, finansów handlowych i epoki absolutyzmu lub nowszej. W tej wersji niedostępne jest zweryfikowane składowanie i realizacja towarów."
 bfl_warehouse_receipts: "Przychody z magazynu"
 bfl_warehouse_receipts_desc: "Towar przechowywany w renomowanym magazynie może wspierać handel bez konieczności przemieszczania go przy każdej sprzedaży. Paragon stanowi roszczenie do przechowywanego towaru, umożliwiając jego właścicielowi uzyskanie środków finansowych w czasie przechowywania towaru."
 bfl_withdraw: "Wycofaj dojrzałe depozyty państwowe"
 bfl_withdraw_tip: "#T Wycofaj dojrzałe depozyty państwowe#!\nPoproś o spłatę rachunków na żądanie swojego stanu i rachunków terminowych o terminie zapadalności. Bank spłaca kapitał i kredytowane odsetki z dostępnych środków pieniężnych. Niezapłacone kwoty pozostają zapisane w kolejce wypłat i wstrzymują nowe transakcje. W ramach tej akcji nie można wycofać rachunków zagranicznych ani lokat terminowych."
 bfl_workout_decline: "Zachowaj pełne roszczenie"
 bfl_workout_desc: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_workout_bank').GetCountry.GetName] proponuje warunki depozytu [ROOT.GetCountry.MakeScope.GetVariable('bfl_workout_claim').GetValue|2] złoto. Możesz odstąpić 20% pozostałego roszczenia, zamień całość roszczenia na nowo wyemitowane akcje po rzeczywistej NAV sprzed konwersji lub zachowaj swoje roszczenie. Konwersja wymaga dodatniej NAV i zdolności akcjonariuszy i jest niedostępna dla wierzycieli banku. Pula wierzycieli [ROOT.GetCountry.MakeScope.GetVariable('bfl_workout_pool').GetValue|0]: 0 skarbiec, 1 mieszczanie, 2 szlachta, 3 duchowieństwo, 4 chłopi. Warunki nieruchomości wymagają uchwalenia nakazu treningowego dla tego osiedla. Oferta wygasa w tym miesiącu; odzyskanie lub zmiana zarządu powoduje jego unieważnienie."
 bfl_workout_equity: "Zamień wierzytelność na akcje (wymagana dodatnia NAV)"
 bfl_workout_haircut: "Zaakceptuj 20% redukcja"
 bfl_workout_title: "Propozycja uregulowania wierzycieli"
 bfl_workout_trade_access: "Koncesja na handel treningami"
 bfl_workout_trade_access_desc: "Ochronę handlu znosi się w drodze oddzielnie zaakceptowanego spłaty obligacji na okres do dwóch lat. Istniejące zwykłe umowy o dostępie do handlu są niezależne od tej koncesji."
