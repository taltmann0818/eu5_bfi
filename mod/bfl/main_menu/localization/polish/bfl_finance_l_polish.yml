 bfl_assets_label: "Aktywa"
 bfl_assets_label_tip: "#T Aktywa ogółem#!\nŚrodki pieniężne i zarejestrowane aktywa będące własnością banku.\n\nGotówka skarbowa: [Country.GetFixedPointCurrencyValue('gold')|2]@gold!\nPortfel kredytów: [Country.MakeScope.GetVariable('bfl_native_credit_value').GetValue|2]@gold!\nPozycje kapitałowe (wartość bilansowa): [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_security_carrying')|2]@gold!\nKredyty niestandardowe i obligacje: [Country.MakeScope.GetVariable('bfl_custom_credit_value').GetValue|2]@gold!\nZapasy: [Country.MakeScope.GetVariable('bfl_inventory_value').GetValue|2]@gold!\nProjekty: [Country.MakeScope.GetVariable('bfl_project_value').GetValue|2]@gold!\nRazem: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_assets')|2]@gold!\n\nPożyczki, pozycje kapitałowe, zapasy i projekty są rejestrowaną wartością aktywów, a nie gotówką dostępną do wydania. Spłaty kwoty głównej powodują wymianę aktywów pożyczkowych na gotówkę; nie generują zysku."
 bfl_authorize_note_bank: "Autoryzuj wymienialne banknoty"
 bfl_authorize_note_bank_act: "$bfl_authorize_note_bank$"
 bfl_authorize_note_bank_desc: "Upoważnij swój bank licencjonowany lub niezależny bank z oddziałem w Twojej stolicy do wymiany walut na w pełni zabezpieczone banknoty wymienne po przeprowadzeniu niezbędnych badań. Do nowych emisji wymagany jest także wypełniony Bank Centralny w Twojej stolicy. Autoryzacja nie tworzy złota i może zostać cofnięta."
 bfl_authorize_note_bank_effect_text: "$bfl_authorize_note_bank$"
 bfl_authorize_note_bank_effect_text_past: "$bfl_authorize_note_bank$"
 bfl_automation_notice: "Zarządzanie kredytami"
 bfl_automation_notice_tip: "Użyj opcji Zarządzanie kredytami w nagłówku, aby umożliwić bankowi zarządzanie akcjami kredytowymi i inwestycjami. Bank utrzymuje rezerwy, płaci wierzycielom oraz sprawdza badania i środki pieniężne przed inwestycją."
 bfl_available: "Dostępna gotówka"
 bfl_available_tip: "Gotówka, którą bank może wykorzystać po utrzymaniu rezerw."
 bfl_back_to_bank: "Konta bankowe"
 bfl_balance_paid_tip: "Płatność finansowana w ramach ostatniego miesięcznego rozliczenia. Transfery te znajdują się już w Twoim skarbcu i nie można ich ponownie dodawać do całkowitego dochodu rodzimego."
 bfl_balance_sheet_subtitle: "Aktualne rachunki bankowe"
 bfl_bank_capital_subscriptions_desc: "Dom bankowy nie musi całkowicie polegać na fortunie rodziny założycieli. Subskrypcje wprowadzają do przedsiębiorstwa dodatkowych partnerów, którzy łączą ich kapitały, jednocześnie rejestrując roszczenia każdego inwestora dotyczące jego przyszłego dobrobytu."
 bfl_bank_dividends: "Dywidendy bankowe (roczne)"
 bfl_bank_equity_subscribe: "Skarbiec banku: subskrybuj 100 złoto"
 bfl_bank_equity_subscribe_tip: "Inwestuj 100 rzeczywistej nadwyżki środków pieniężnych i kapitału chronionego zarządzanego banku przy namacalnej NAV wybranego emitenta. Do portfela banku trafiają nowe płatne jednostki. Maksymalnie 25% banku lub 60% firmy z zezwoleniem zagranicznym. Jest to finansowanie pierwotne, a nie zakup od istniejącego akcjonariusza."
 bfl_bank_holdings: "Inwestycje banku"
 bfl_bank_identity_tip: "[Country.GetName] posiada własny skarbiec, aktywa i zobowiązania. Sumy te należą do banku, oddzielnie od skarbu państwa. Merchant Finance specjalizuje się w pożyczkach handlowych i korporacyjnych; Overseas Investment specjalizuje się w przedsięwzięciach i spółkach. Bank wybiera jedną stałą specjalizację."
 bfl_bank_share_dealing: "Obrót akcjami banku"
 bfl_bank_share_dealing_desc: "Majątek wspólnika nie musi być na zawsze związany z tym samym domem bankowym. Uznane przeniesienia własności umożliwiają inwestorom sprzedaż swoich udziałów innym osobom, podczas gdy instytucja może kontynuować swoją działalność bez wycofywania kapitału."
 bfl_bank_share_transfer: "Transfer akcji bankowych"
 bfl_bank_share_transfer_tip: "#T Transfer akcji banku#!\nPrzenoszenie zarejestrowanych jednostek własności banku pomiędzy finansowanymi stronami. Wymaga badań w zakresie handlu akcjami bankowymi oraz epoki reformacji lub nowszej. Ten wiersz informuje o pozwoleniu; sama nie dokonuje wtórnego obrotu akcjami."
 bfl_bank_status_tip: "Działalność: nowa działalność jest dozwolona, jeśli spełnione są inne wymagania. Gotówka pod presją: dostępna gotówka się wyczerpała. Wypłaty w kolejce: niezapłacone żądania wypłat wstrzymują nowe transakcje. Niewypłacalny: zobowiązania przewyższają aktywa. W trakcie rozwiązywania lub Zamknięte: zwykła działalność jest ograniczona. Istniejące roszczenia pozostają rejestrowane."
 bfl_bank_subscription: "Abonament bankowy"
 bfl_banking_finance_companies__expanded_details_desc: "Zarezerwowane preferencje prezentacji dla widoku szczegółowego wyciągu."
 bfl_banking_finance_companies__expanded_details_name: "Rozszerzone szczegóły aktywności"
 bfl_banking_finance_companies__finance_notifications_desc: "Preferencje dotyczące prezentacji powiadomień; zobowiązania nigdy nie są anulowane przez wyciszenie."
 bfl_banking_finance_companies__finance_notifications_name: "Powiadomienia finansowe"
 bfl_banking_finance_companies__interface_name: "Interfejs"
 bfl_banking_finance_companies__presentation__interface_name: "Interfejs"
 bfl_banking_finance_companies__presentation_name: "Prezentacja"
 bfl_banking_finance_companies__reduced_motion_desc: "Używaj statycznych potwierdzeń transakcji i ostrzeżeń. Wyłącz, aby umożliwić krótkie, pojedyncze podkreślanie transakcji po zatwierdzonych płatnościach; żadnych zapętlonych błysków finansowych."
 bfl_banking_finance_companies__reduced_motion_name: "Ograniczony ruch"
 bfl_banking_finance_companies_desc: "Tylko ustawienia prezentacji. Polityka instytucji jest zarządzana w Ekonomii."
 bfl_banking_finance_companies_name: "Firmy bankowe, finansowe i handlowe"
 bfl_bond_accept_tip: "Zaakceptuj podaną obniżkę kwoty głównej/kuponu i roczną obniżkę stawki po ponownym sprawdzeniu aktualnego posiadacza, roszczenia i upoważnienia. Żadnych nowych zabezpieczeń ani płatności gotówkowych."
 bfl_bond_capacity_label: "Dostępny kredyt"
 bfl_bond_capacity_label_tip: "Kapitał, miesięczne odsetki i miejsce na nową pożyczkę."
 bfl_bond_coupon: "Kupon miesięczny"
 bfl_bond_coupon_label: "Miesięczne odsetki"
 bfl_bond_coupon_label_tip: "Kapitał, miesięczne odsetki i miejsce na nową pożyczkę."
 bfl_bond_coupons: "Kupony obligacji skarbowych"
 bfl_bond_debt_label: "Zaległy dług"
 bfl_bond_debt_label_tip: "Kapitał, miesięczne odsetki i miejsce na nową pożyczkę."
 bfl_bond_decline_tip: "Zachowaj pełne istniejące roszczenie o kaucję i zaakceptowane warunki. Żadnych ruchów pieniężnych."
 bfl_bond_empty: "Brak wyemitowanych obligacji. Finansowanie pojawi się tutaj, gdy bank sfinansuje emisję."
 bfl_bond_exchange_note: "Obie strony potrzebują skompletowanej posiadanej giełdy. Wczesne wymiany przyznane w ramach wydarzenia kwalifikują się przed badaniami."
 bfl_bond_filter_all: "Wszystko"
 bfl_bond_filter_arrears: "Niezapłacone odsetki"
 bfl_bond_filter_offered: "Na sprzedaż"
 bfl_bond_filter_owned: "Trzymane przez nas"
 bfl_bond_income_tip: "Niestandardowe kupony obligacji skarbowych faktycznie wypłacone Ci w tym miesiącu przez ich emitentów. Nie uwzględnia się umorzeń głównych i wpływów ze sprzedaży wtórnej."
 bfl_bond_issue_detail: "Otrzymaj 100 złoto z Twojego licencjonowanego banku. Zobowiązanie wieczyste powstaje dopiero po jego sfinansowaniu przez bank."
 bfl_bond_issue_title: "NOWE FINANSOWANIE"
 bfl_bond_list_label: "Lista o godz 98%"
 bfl_bond_mandate_detail: "Pierwsze środki dłużne 60% prognozowanych wydatków. Cele buforowe 200 złoto. Obydwa zatrzymują się na 500 złoto państwowe i 100 miesięcznie."
