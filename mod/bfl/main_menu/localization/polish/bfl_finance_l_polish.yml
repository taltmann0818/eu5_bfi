 bfl_request_deposit_withdrawal: "Wycofaj zapadłe depozyty"
 bfl_request_deposit_withdrawal_act: "$bfl_request_deposit_withdrawal$"
 bfl_request_deposit_withdrawal_desc: "Wycofaj swoje zapadłe roszczenia. Niezapłacone kwoty pozostają zaległymi zobowiązaniami banku. Żadna wypłata nie może przekroczyć zarejestrowanej kwoty głównej wraz z naliczonymi odsetkami."
 bfl_request_deposit_withdrawal_effect_text: "$bfl_request_deposit_withdrawal$"
 bfl_request_deposit_withdrawal_effect_text_past: "$bfl_request_deposit_withdrawal$"
 bfl_request_discount: "Poproś o zabezpieczony kredyt rozliczeniowy"
 bfl_request_discount_act: "$bfl_request_discount$"
 bfl_request_discount_command: "$bfl_request_discount$"
 bfl_request_discount_command_desc: "$bfl_request_discount_desc$"
 bfl_request_discount_desc: "Poproś o 75-złota zaliczka na poczet środków 100-złoty banknot trzeciego banku. Menedżer pożyczkodawcy na żywo przegląda wniosek; akceptacja ponownie sprawdza wszystkie strony i zabezpieczenia. Pomiędzy bankami nie jest wymagany żaden oddział banku."
 bfl_request_discount_effect_text: "$bfl_request_discount$"
 bfl_request_discount_effect_text_past: "$bfl_request_discount$"
 bfl_request_discount_tip: "Wybierz pożyczkodawcę dla 75-złota miesięczna zaliczka na poczet niezadeklarowanych środków 100-złoto w banku trzecim. Wymaga zabezpieczenia i instrumentów zapewniających płynność. Pożyczkodawca musi wyrazić zgodę; pomiędzy bankami nie jest wymagany oddział banku."
 bfl_request_public_support: "Poproś o publiczne zabezpieczone wsparcie"
 bfl_request_public_support_act: "$bfl_request_public_support$"
 bfl_request_public_support_command: "$bfl_request_public_support$"
 bfl_request_public_support_command_desc: "$bfl_request_public_support_desc$"
 bfl_request_public_support_desc: "Poproś o 75-złota zaliczka na poczet środków 100-złoty banknot trzeciego banku. Menedżer pożyczkodawcy na żywo przegląda wniosek; akceptacja ponownie sprawdza wszystkie strony i zabezpieczenia. Pomiędzy bankami nie jest wymagany żaden oddział banku."
 bfl_request_public_support_effect_text: "$bfl_request_public_support$"
 bfl_request_public_support_effect_text_past: "$bfl_request_public_support$"
 bfl_request_public_support_tip: "Wybierz licencjonowanego pożyczkodawcę z publicznym zabezpieczeniem finansowym i pełnym kapitałem jego suwerena, Bankiem Centralnym. Jej obecny menadżer musi wyrazić zgodę. The 75-Zaliczka zabezpieczona złotem wykorzystuje co najmniej gotówkę bankową i opłaty 9% rocznie; nie stwarza żadnej gwarancji ani dokapitalizowania."
 bfl_reserves: "Zarezerwowana gotówka"
 bfl_reserves_tip: "Gotówka przeznaczona na depozyty i przyrzeczone płatności."
 bfl_resolution_begin_command: "Rozpocznij rozwiązanie"
 bfl_resolution_begin_command_tip: "Uporządkowane rozwiązanie wstrzymuje nowe zobowiązania i wypłaty. Oddzielne rezerwy pieniężne i powiernicze pozostają chronione; depozyty dzielą dostępną gotówkę proporcjonalnie przed zaległościami w wydatkach i kapitałem własnym. Brakujący wierzyciele zachowują swoje roszczenia. Warunki dobrowolne wymagają aktualnej zgody wierzyciela i restrukturyzacji zadłużenia Renaissance. Gwarancja publiczna obejmuje 50% przyjętych strat depozytowych, do 100 łącznie złoto, ufundowane przez zarejestrowanego suwerena; nieopłacone połączenia pozostają oczekujące. Zamknięcie wymaga rozliczenia wszystkich zobowiązań i aktywów niepieniężnych. Zamknięte osiedla nie mogą zostać ponownie otwarte."
 bfl_resolution_call_command: "Zapłać w oczekiwaniu na gwarancję"
 bfl_resolution_call_command_tip: "Uporządkowane rozwiązanie wstrzymuje nowe zobowiązania i wypłaty. Oddzielne rezerwy pieniężne i powiernicze pozostają chronione; depozyty dzielą dostępną gotówkę proporcjonalnie przed zaległościami w wydatkach i kapitałem własnym. Brakujący wierzyciele zachowują swoje roszczenia. Warunki dobrowolne wymagają aktualnej zgody wierzyciela i restrukturyzacji zadłużenia Renaissance. Gwarancja publiczna obejmuje 50% przyjętych strat depozytowych, do 100 łącznie złoto, ufundowane przez zarejestrowanego suwerena; nieopłacone połączenia pozostają oczekujące. Zamknięcie wymaga rozliczenia wszystkich zobowiązań i aktywów niepieniężnych. Zamknięte osiedla nie mogą zostać ponownie otwarte."
 bfl_resolution_close_command: "Zamknąć osiedle"
 bfl_resolution_close_command_tip: "Uporządkowane rozwiązanie wstrzymuje nowe zobowiązania i wypłaty. Oddzielne rezerwy pieniężne i powiernicze pozostają chronione; depozyty dzielą dostępną gotówkę proporcjonalnie przed zaległościami w wydatkach i kapitałem własnym. Brakujący wierzyciele zachowują swoje roszczenia. Warunki dobrowolne wymagają aktualnej zgody wierzyciela i restrukturyzacji zadłużenia Renaissance. Gwarancja publiczna obejmuje 50% przyjętych strat depozytowych, do 100 łącznie złoto, ufundowane przez zarejestrowanego suwerena; nieopłacone połączenia pozostają oczekujące. Zamknięcie wymaga rozliczenia wszystkich zobowiązań i aktywów niepieniężnych. Zamknięte osiedla nie mogą zostać ponownie otwarte."
 bfl_resolution_guarantee_command: "Autoryzuj gwarancję"
 bfl_resolution_guarantee_command_tip: "Uporządkowane rozwiązanie wstrzymuje nowe zobowiązania i wypłaty. Oddzielne rezerwy pieniężne i powiernicze pozostają chronione; depozyty dzielą dostępną gotówkę proporcjonalnie przed zaległościami w wydatkach i kapitałem własnym. Brakujący wierzyciele zachowują swoje roszczenia. Warunki dobrowolne wymagają aktualnej zgody wierzyciela i restrukturyzacji zadłużenia Renaissance. Gwarancja publiczna obejmuje 50% przyjętych strat depozytowych, do 100 łącznie złoto, ufundowane przez zarejestrowanego suwerena; nieopłacone połączenia pozostają oczekujące. Zamknięcie wymaga rozliczenia wszystkich zobowiązań i aktywów niepieniężnych. Zamknięte osiedla nie mogą zostać ponownie otwarte."
 bfl_resolution_heading: "Rozwiązanie i odzyskanie wierzycieli"
 bfl_resolution_heading_tip: "Trwałe rozwiązanie finansowe; odzyskane środki pieniężne i zmiany wynikające z konsensusu są rejestrowane oddzielnie od zysków."
 bfl_resolution_help: "Rezerwy zabezpieczone i powiernicze → depozyty proporcjonalne → zaległości w wydatkach → pozostali akcjonariusze. Roszczenia przetrwają braki i utratę organu pochodzenia. Wprowadź uchwałę przed zaoferowaniem warunków."
 bfl_resolution_liquidate_command: "Wykorzystaj dostępne zasoby"
 bfl_resolution_liquidate_command_tip: "Sprzedawaj dostępne, nieobciążone zasoby rodzime i zbieraj zapadłe depozyty, weksle i banknoty za pośrednictwem istniejących usług. Rzeczywiste wpływy finansują kaskadę ożywienia gospodarczego. Niedostępne lub niedojrzałe pozycje pozostają rejestrowane; żadna wartość bilansowa nie staje się złotem."
 bfl_resolution_next_command: "Kolejne konto depozytowe"
 bfl_resolution_next_command_tip: "Cykl aktywnych kont depozytowych. Wierzyciele majątkowi wymagają uchwalonego Mandatu Treningowego, zanim ich rząd będzie mógł zaakceptować dobrowolne warunki. Wpłaty wracają do zarejestrowanego skarbca lub portfela majątkowego."
 bfl_resolution_notice_acknowledge: "Potwierdź ostateczny wynik"
 bfl_resolution_notice_desc: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_notice_bank').GetCountry.GetName] zamknęła swoją działalność finansową.\n\nOdzyski depozytów wypłacone: [ROOT.GetCountry.MakeScope.GetVariable('bfl_notice_bank').GetCountry.MakeScope.GetVariable('bfl_resolution_paid').GetValue|2]@gold!\nUzgodnione straty depozytowe: [ROOT.GetCountry.MakeScope.GetVariable('bfl_notice_bank').GetCountry.MakeScope.GetVariable('bfl_resolution_waived').GetValue|2]@gold!\nZarejestrowane straty ustawowe: [ROOT.GetCountry.MakeScope.GetVariable('bfl_notice_bank').GetCountry.MakeScope.GetVariable('bfl_resolution_statutory_loss').GetValue|2]@gold!\n\nZarejestrowane straty to niezapłacone kwoty, a nie kwoty odzyskane lub nowe dochody. Własność historyczna i majątek ostateczny pozostają zarejestrowane; zamknięta instytucja nie może zostać ponownie otwarta."
 bfl_resolution_notice_title: "Uchwała banku zamknięta"
 bfl_resolution_offer_command: "Zaoferuj warunki wierzyciela"
 bfl_resolution_offer_command_tip: "Uporządkowane rozwiązanie wstrzymuje nowe zobowiązania i wypłaty. Oddzielne rezerwy pieniężne i powiernicze pozostają chronione; depozyty dzielą dostępną gotówkę proporcjonalnie przed zaległościami w wydatkach i kapitałem własnym. Brakujący wierzyciele zachowują swoje roszczenia. Warunki dobrowolne wymagają aktualnej zgody wierzyciela i restrukturyzacji zadłużenia Renaissance. Gwarancja publiczna obejmuje 50% przyjętych strat depozytowych, do 100 łącznie złoto, ufundowane przez zarejestrowanego suwerena; nieopłacone połączenia pozostają oczekujące. Zamknięcie wymaga rozliczenia wszystkich zobowiązań i aktywów niepieniężnych. Zamknięte osiedla nie mogą zostać ponownie otwarte."
 bfl_resolution_pay_command: "Odzyskiwanie płatności"
 bfl_resolution_pay_command_tip: "Uporządkowane rozwiązanie wstrzymuje nowe zobowiązania i wypłaty. Oddzielne rezerwy pieniężne i powiernicze pozostają chronione; depozyty dzielą dostępną gotówkę proporcjonalnie przed zaległościami w wydatkach i kapitałem własnym. Brakujący wierzyciele zachowują swoje roszczenia. Warunki dobrowolne wymagają aktualnej zgody wierzyciela i restrukturyzacji zadłużenia Renaissance. Gwarancja publiczna obejmuje 50% przyjętych strat depozytowych, do 100 łącznie złoto, ufundowane przez zarejestrowanego suwerena; nieopłacone połączenia pozostają oczekujące. Zamknięcie wymaga rozliczenia wszystkich zobowiązań i aktywów niepieniężnych. Zamknięte osiedla nie mogą zostać ponownie otwarte."
 bfl_resolution_resume_command: "Wznów po wyzdrowieniu"
 bfl_resolution_resume_command_tip: "Uporządkowane rozwiązanie wstrzymuje nowe zobowiązania i wypłaty. Oddzielne rezerwy pieniężne i powiernicze pozostają chronione; depozyty dzielą dostępną gotówkę proporcjonalnie przed zaległościami w wydatkach i kapitałem własnym. Brakujący wierzyciele zachowują swoje roszczenia. Warunki dobrowolne wymagają aktualnej zgody wierzyciela i restrukturyzacji zadłużenia Renaissance. Gwarancja publiczna obejmuje 50% przyjętych strat depozytowych, do 100 łącznie złoto, ufundowane przez zarejestrowanego suwerena; nieopłacone połączenia pozostają oczekujące. Zamknięcie wymaga rozliczenia wszystkich zobowiązań i aktywów niepieniężnych. Zamknięte osiedla nie mogą zostać ponownie otwarte."
 bfl_review_trade: "Przegląd handlu"
 bfl_review_trade_tip: "Przejrzyj wybrane jednostki i dokładną płatność. Sprzedaż musi być zaokrąglona co najmniej do 0.01 złoto; zwiększ ilość, jeśli recenzja jest niedostępna. Żaden dyplomata nie jest wydawany, dopóki nie zostanie rozstrzygnięta ważna transakcja."
 bfl_safeguards_title: "Płynność i zabezpieczenia"
 bfl_safeguards_title_tip: "#T Płynność i zabezpieczenia#!\nDostępna gotówka bankowa: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_free_cash')|2]@gold!\nChronione zapotrzebowanie na gotówkę: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_protected_cash')|2]@gold!\nWypłaty w kolejce: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_withdrawals_due')|2]@gold!\n\nDokapitalizowanie zasila kapitał państwa. Zawieszenie depozytów wstrzymuje finansowanie nowego konta, zachowując jednocześnie istniejące zobowiązania."
 bfl_sale_unavailable: "Nie udało się rozliczyć zlecenia akcji"
 bfl_sale_unavailable_desc: "Emitentowi przysługuje miesięczny okres zawieszenia handlu, brakuje Ci dyplomaty, Twoja wycena wygasła lub zmieniły się dostępne akcje, fundusze lub dostęp do giełdy. Otwórz ponownie Kup lub Sprzedaj akcje, aby uzyskać nową wycenę. Nie przesunięto żadnych środków pieniężnych ani akcji."
 bfl_secured_liquidity: "Zabezpieczona płynność"
 bfl_secured_liquidity_tip: "#T Zabezpieczona płynność#!\nAbsolutyzm, zabezpieczenie i instrumenty płynnościowe. Postęp 75 złoto w porównaniu z oddzielnie finansowanym funduszem 100-złoty banknot trzeciego banku. Zabezpieczenie jest blokowane jednorazowo. Stała przyjęta stawka roczna jest dzielona przez 12. Nie jest wymagany żaden oddział między bankami."
 bfl_security_bank_results: "Zamknięcie ostatniego banku"
 bfl_security_financial_heading: "Wymierna sytuacja finansowa"
 bfl_security_financial_subtitle: "Co wspiera cenę akcji"
 bfl_security_financial_title: "Kapitał własny [Country.GetName]"
 bfl_security_price_heading: "Cena akcji i własność"
 bfl_security_price_math: "Cena rynkowa = wymierna NAV na akcję × miesięczna premia rynkowa. Presja zamówień, zmienność, odwrócenie średniej i niepokój mogą zmienić tę premię. Kapitał podstawowy pozostaje wyceniony na poziomie NAV; niezrealizowane zyski nie służą finansowaniu akcji kredytowej ani dywidend."
 bfl_security_primary_note: "Dywidendy jednokrotnie zmniejszają stan środków pieniężnych i NAV. Nowy kapitał wyceniany jest według NAV i nie wywołuje sygnału presji kupna. Subskrypcje zostają wstrzymane, gdy oferta odsprzedaży dealera przekracza NAV, co uniemożliwia gwarantowany natychmiastowy zysk. Historia zawiera rzeczywiste obserwacje; przeładowanie nie powoduje ponownego losowania zapisanego miesięcznego szoku."
 bfl_select_buy_shares: "Kup akcje banku i spółki"
 bfl_select_profile: "Wybierz oczekującą specjalizację"
 bfl_select_profile_tip: "#T Specjalizacja banku#!\nOtwórz wybór specjalizacji, jeśli ten bank nie wybrał jeszcze stałego profilu. Merchant Finance i Overseas Investment otwierają różne ścieżki badawcze. Za pomocą tego przycisku nie można zastąpić ukończonej specjalizacji."
 bfl_select_sell_shares: "Sprzedaj posiadane akcje"
 bfl_selector_next: "Następne banki"
 bfl_selector_previous: "Poprzednie banki"
 bfl_sell_confirm_desc: "Sprzedaj [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_quantity').GetValue|3] udziały [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_issuer').GetCountry.GetName] dla [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_total').GetValue|2]@gold!. Ukryty animator rynku gwarantuje tę sprzedaż, łącznie z podanym spreadem transakcyjnym, dopóki oferta jest ważna. Akcje natychmiast opuszczają Twój portfel; zakupy AI w tle nie opóźniają płatności. Wpływy trafiają do skarbca Twojego banku. Rozliczenie pochłania jednego dyplomatę i rozpoczyna miesięczny okres odnowienia kupna/sprzedaży tego emitenta."
 bfl_sell_confirm_title: "Potwierdź natychmiastową sprzedaż akcji"
 bfl_sell_shares: "Sprzedaj akcje"
 bfl_sell_shares_desc: "Wybierz jeden ze swoich zasobów i ilość. Ukryty animator rynku natychmiast kupuje Twoje akcje po cenie rynkowej pomniejszonej o wyświetlony spread dealera. Banki AI kupują swoje zapasy w tle."
 bfl_sell_shares_tip: "Wybierz jeden ze swoich zasobów i ilość. Ukryty animator rynku natychmiast kupuje Twoje akcje po cenie rynkowej pomniejszonej o wyświetlony spread dealera. Banki AI kupują swoje zapasy w tle.\nWymaga zakończonej wymiany, handlu akcjami i co najmniej jednego dyplomaty. Każda udana transakcja pochłania jednego dyplomatę i rozpoczyna miesięczny okres odnowienia dla tego emitenta. Dostępni dyplomaci: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bfl_available_trade_diplomats')|2]. Zamówienia muszą mieć wartość pieniężną min 0.01 złoto."
 bfl_sell_state_confirm_desc: "Sprzedaj [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_quantity').GetValue|3] udziałów w twoim skarbcu [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_issuer').GetCountry.GetName] dla [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_total').GetValue|2]@gold!, wpłacane do skarbu państwa. Bank nie otrzymuje finansowania, a wyemitowane akcje nie ulegają zmianie. Ukryty dealer gwarantuje wyświetlaną wycenę, w tym podany spread dealera. Rozliczenie pochłania jednego dyplomatę i rozpoczyna miesięczny okres odnowienia kupna/sprzedaży dla tego emitenta. Władza monetarna Twojej Karty pozostaje z Tobą."
