 bfl_finance_title: "Bankowość i finanse"
 bfl_financial_advance: "Zaliczka bankowa"
 bfl_financial_advance_desc: "Wiedza finansowa dla niezależnych domów bankowych i banków posiadających uprawnienia państwowe."
 bfl_founder_class: "Założyciele · lokalny basen mieszczański"
 bfl_free_cash_label: "Dostępna gotówka"
 bfl_funded_bill_button: "Rachunek finansowany · 100 złoto"
 bfl_funding_tab: "Finansowanie i zadłużenie"
 bfl_funding_title: "Depozyty i kapitał"
 bfl_funding_title_tip: "Depozyty, kapitał bankowy i rezerwy."
 bfl_goods: "Towary i opieka · Merchant Finance"
 bfl_goods_accept: "Zaakceptuj te warunki"
 bfl_goods_accept_branch_tip: "Zaakceptuj wyświetloną dwunastomiesięczną umowę Izby Celnej. Miesięczne opłaty za dostęp finansowane są na rzecz gospodarza, który wyraził zgodę; akceptacja nie powoduje powstania zapasów, reklamacji towaru ani natychmiastowego zakupu."
 bfl_goods_accept_quote_tip: "Zapłać depozytariuszowi wyświetloną cenę kontraktową plus oddzielną opłatę za przechowanie w wysokości jednego złota. Sprawdź ponownie wsparcie na żywo, cenę, imprezy, uprawnienia, dostęp i chronione fundusze; zmienione lub nieaktualne warunki nie przenoszą pieniędzy."
 bfl_goods_accept_transfer_tip: "Zapłać wyświetloną cenę transferu obecnemu posiadaczowi. Przed jednorazowym przeniesieniem istniejącego paragonu sprawdź ponownie posiadacza, ilość, generację partii, badania, datę ważności i finansowanie."
 bfl_goods_branch_desc: "Host oferuje dostęp do swojego rynku kapitałowego dla 12 miesiące o godz 1 złoto miesięcznie, płacone gospodarzowi. Zakupy natywne zachowują własną opłatę gotówkową; jest to osobna usługa opieki. Dojazd wymaga od gospodarza własnej, wypełnionej Izby Celnej i spokoju. Niepłatny dostęp, wygaśnięcie, utrata budynku lub wojna wstrzymują nowe zakupy i dostawy. Gospodarz może zamrozić lokalny areszt; nie powstają żadne środki pieniężne ani towary. Odnów z tym samym hostem, aby przywrócić dostęp."
 bfl_goods_branch_title: "Umowa o przechowanie w Izbie Celnej"
 bfl_goods_browser_desc: "Wybierz działkę fizyczną i sprawdź jej ofertę. Obecni posiadacze mogą zażądać dostawy; wyrażający zgodę gospodarz Izby Celnej może zamrozić niedostępny areszt i zwolnić go po ponownym udostępnieniu. Przy wyborze nie następuje akceptacja oferty."
 bfl_goods_browser_title: "Oferty towarów i roszczenia z tytułu opieki"
 bfl_goods_claim_desc: "Poproś o dostarczenie tego potwierdzenia na swój rynek kapitałowy. Dostawa na rynki trwa dwa miesiące i kosztuje 1 złoto i traci 1% ilości. Alternatywnie zamknij to okno i skorzystaj z opcji Zaoferuj przelew z magazynu w dyplomacji. Transfery wymagają obrotów i depozytu zabezpieczającego oraz zarządzania ryzykiem u depozytariusza; kupujący musi zaakceptować aktualną ofertę."
 bfl_goods_claim_title: "Twoje roszczenie magazynowe"
 bfl_goods_close: "Zamknij"
 bfl_goods_decline: "Odmów"
 bfl_goods_deliver: "Poproś o fizyczną dostawę"
 bfl_goods_explanation: "Zapasy natywne finansowane, potwierdzone wpływy i transakcje forward wymagają Merchant Finance, ich zaliczek i weryfikacji wykonania/przechowywania P09. Towar obciążony nie może stanowić podstawy do drugiego roszczenia."
 bfl_goods_forward_title: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_goods_quote_type').Goods.GetNameWithNoTooltip] fizyczny do przodu"
 bfl_goods_inventory_empty: "Brak towaru w areszcie. Automatyczne zakupy rozpoczynają się od następnego kwalifikującego się miesięcznego zamknięcia banku."
 bfl_goods_inventory_hint: "Najedź kursorem, aby wyświetlić towary, ilości, wartość i zwrot"
 bfl_goods_inventory_note: "Orientacyjna rodzima wartość sprzedaży; niezrealizowany zwrot na poczet pozostałych zapłaconych kosztów. Wpływy osób trzecich są wyłączone z sumy bankowej. Koszty, psucie się i utrata dostępu wpływają na dochody. Przewiń dla każdej zapisanej pozycji."
 bfl_goods_inventory_subtitle: "Opieka fizyczna · orientacyjna wartość rynkowa"
 bfl_goods_inventory_title: "Inwentarz towarów"
 bfl_goods_next: "Kolejne partie"
 bfl_goods_policy_allocation_0: "Przydział · 0%"
 bfl_goods_policy_allocation_10: "Przydział · 10%"
 bfl_goods_policy_allocation_25: "Przydział · 25%"
 bfl_goods_policy_allocation_50: "Przydział · 50%"
 bfl_goods_policy_button: "Polityka"
 bfl_goods_policy_contracts_0: "Umowy · Tylko spot"
 bfl_goods_policy_contracts_1: "Umowy · Potwierdzenia ofert"
 bfl_goods_policy_contracts_2: "Umowy · Oferta forwardów"
 bfl_goods_policy_help: "Kliknij ustawienie, aby włączyć cykl. Bank dokonuje wyboru towaru i ilości na zamknięciu miesiąca. Najedź kursorem na każde ustawienie, aby zapoznać się z jego regułami."
 bfl_goods_policy_mandate_0: "Mandat · Wstrzymano"
 bfl_goods_policy_mandate_1: "Mandat · Automatyczny"
 bfl_goods_policy_mandate_2: "Mandat · Uciekaj"
 bfl_goods_policy_risk_0: "Ryzyko · Ostrożnie"
 bfl_goods_policy_risk_1: "Ryzyko · Zrównoważone"
 bfl_goods_policy_risk_2: "Ryzyko · Przygodowy"
 bfl_goods_policy_turnover_12: "Trzymaj się · 12 miesiące"
 bfl_goods_policy_turnover_24: "Trzymaj się · 24 miesiące"
 bfl_goods_policy_turnover_6: "Trzymaj się · 6 miesiące"
 bfl_goods_previous: "Poprzednie partie"
 bfl_goods_quote_desc: "Ilość: [ROOT.GetCountry.MakeScope.GetVariable('bfl_goods_quote_quantity').GetValue|3]. Cena: [ROOT.GetCountry.MakeScope.GetVariable('bfl_goods_quote_price').GetValue|2] złoto z plusem 1 opłata za przechowywanie złota. Kwit magazynowy stanowi natychmiastową własność towaru. Fizyczny spedytor w pełni finansuje dostawę w ciągu trzech miesięcy. Obydwa wymagają towarów zabezpieczonych. Koszty przechowywania 0.1 miesięcznie; jest strata fizyczna 2% rocznie. Kontrahent zachowuje stałą ilość: brakujący zwrot jednostek proporcjonalnie plus równa rekompensata za zabezpieczenie sprzedawcy. Dostawa na inny rynek trwa dwa miesiące, kosztuje 1 złoto i traci 1% ilości. Straty magazynowe i transportowe zmniejszają ilość przyjęć. Nieprawidłowe strony lub utrata dostępu pozwalają zachować towary i zabezpieczenia w celu ich odzyskania. Zaakceptuj tylko wtedy, gdy te warunki Ci odpowiadają."
 bfl_goods_quote_title: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_goods_quote_type').Goods.GetNameWithNoTooltip] paragon magazynowy"
 bfl_goods_set_allocation_tip: "Cykl 0%, 10%, 25% lub 50% środków pieniężnych banku plus koszt własnych zapasów. Chroniona gotówka jest zawsze zatrzymywana. Zmniejszenie alokacji powoduje sprzedaż dostępnych wolnych pozycji aż do osiągnięcia wartości docelowej."
 bfl_goods_set_contracts_tip: "Tylko spot, automatycznie oferuj pokwitowania lub automatycznie oferuj fizyczne forwardy. Oferty wymagają wieku instrumentu i badań, pozostają zabezpieczone i oczekują na akceptację oddzielnego kontrahenta. Istniejące przyjęte zobowiązania pozostają chronione."
 bfl_goods_set_mandate_tip: "Automatycznie: kupuj i sprzedawaj zgodnie ze swoją polisą. Wstrzymano: brak transakcji uznaniowych. Ucieczka: sprzedawaj dostępne bezpłatne zasoby bez ich wymiany. Istniejące umowy, składowanie i straty są kontynuowane we wszystkich trybach."
 bfl_goods_set_risk_tip: "Ostrożnie: realizuj zysk +10%, zatrzymaj stratę −5%. Zrównoważony: +20% / −15%. Przygodowy: +35% / −25%. Limity korzystają z natywnych ofert sprzedaży w stosunku do pozostałych kosztów; realizacja odbywa się co miesiąc, a ceny mogą się zmieniać."
 bfl_goods_set_turnover_tip: "Maksymalny okres utrzymywania: 6, 12 lub 24 miesiące. Bank sprzedaje dostępne bezpłatne pozycje po wygaśnięciu i automatycznie wybiera nowe towary."
 bfl_goods_settings: "Polityka handlowa"
 bfl_goods_settings_tip: "Ustaw mandat banku, alokację, limity ryzyka, okres utrzymywania i politykę kontraktową. Bank wybiera wszystkie towary i ilości na zamknięciu miesiąca."
 bfl_goods_tip: "#T Towary i handel#!\nInstrumenty Merchant Finance obejmujące zapasy, wpływy, przyszłe dostawy i marżę. Zarejestrowane zezwolenie nie tworzy towarów ani szlaku handlowego; wymagane jest wykonanie fizyczne."
 bfl_goods_trading_locked: "Handel zablokowany · najedź kursorem, aby wyświetlić wymagania"
 bfl_goods_transfer_desc: "Cena: [ROOT.GetCountry.MakeScope.GetVariable('bfl_goods_transfer_price').GetValue|2] złoto. Ilość: [ROOT.GetCountry.MakeScope.GetVariable('bfl_goods_transfer_quantity').GetValue|3]. Twoja płatność trafia do obecnego posiadacza. Opieka pozostaje w banku; warunki przechowywania, psucia się i dostawy obowiązują nadal. Akceptacja odrzuca zmianę podłoża, posiadacza, generacji partii lub ceny."
 bfl_goods_transfer_title: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_goods_transfer_type').Goods.GetNameWithNoTooltip] przelew paragonowy"
 bfl_grant_goods_branch: "Zaoferuj dostęp do aresztu Izby Celnej"
 bfl_grant_goods_branch_act: "$bfl_grant_goods_branch$"
 bfl_grant_goods_branch_desc: "Zapoznaj się z ofertami opieki fizycznej, istniejącymi roszczeniami lub dobrowolną umową o dostępie Izby Celnej. Wybór kraju nie powoduje przeniesienia pieniędzy."
 bfl_grant_goods_branch_effect_text: "$bfl_grant_goods_branch$"
 bfl_grant_goods_branch_effect_text_past: "$bfl_grant_goods_branch$"
 bfl_history_empty: "Historia zaczyna się od kolejnego miesięcznego rozliczenia."
 bfl_investment_tab: "Kredyty i inwestycje"
 bfl_investment_title: "Pożyczanie"
 bfl_invite_equity_capital: "Dodaj kapitał własny banku"
 bfl_invite_equity_capital_desc: "Subskrybuj 100 złoto do [ROOT.GetCountry.MakeScope.GetVariable('bfl_capital_issuer').GetCountry.GetName] z wybranego skarbca lub portfela majątkowego. Abonent otrzymuje nowe akcje po cenie rynkowej. Portfele nieruchomości przynajmniej zachowują 25 złoto. Własność finansowa, przyszłe dywidendy i rozwodnienie podążają za opłaconymi akcjami."
 bfl_invite_equity_capital_tip: "Wybierz skarbiec lub portfel nieruchomości, który chcesz subskrybować 100 złoto przy aktualnej NAV banku. Nowe akcje rozwadniają istniejących posiadaczy; bank otrzymuje płatność."
 bfl_join_clearing_group: "Dołącz do grupy rozliczeniowej"
 bfl_join_clearing_group_act: "$bfl_join_clearing_group$"
 bfl_join_clearing_group_command: "$bfl_join_clearing_group$"
 bfl_join_clearing_group_command_desc: "$bfl_join_clearing_group_desc$"
 bfl_join_clearing_group_desc: "Dołącz do operatora akceptującego członków. Cztery banki na grupę; dopasowane, zapadłe rachunki płatnicze rozliczane są w drodze debetu netto. Krótki element blokuje partię bez usuwania roszczeń."
 bfl_join_clearing_group_effect_text: "$bfl_join_clearing_group$"
 bfl_join_clearing_group_effect_text_past: "$bfl_join_clearing_group$"
 bfl_join_clearing_group_tip: "Wybierz sprawdzonego operatora rozliczeniowego przyjmującego członków. Wymagane są badania Revolutions, Clearing House i Advanced Clearing. Maksymalnie cztery banki przyłączają się jawnie; krótki członek zachowuje wszystkie roszczenia."
 bfl_liabilities_detail_title: "Zobowiązania [Country.GetName]"
 bfl_liabilities_label: "Zobowiązania"
 bfl_liabilities_label_tip: "#T Całkowity dług#!\nZobowiązania zapisane na rachunkach banku. Jest to odrębne od rodzimych pożyczek i obligacji twojego stanu.\n\nKwota depozytu: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_deposit_principal')|2]@gold!\nKredytowane odsetki od depozytu: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_deposit_interest')|2]@gold!\nUwagi wybitne: [Country.MakeScope.GetVariable('bfl_notes_outstanding').GetValue|2]@gold!\nInne zobowiązania: [Country.MakeScope.GetVariable('bfl_other_payables').GetValue|2]@gold!\nRazem: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_liabilities')|2]@gold!\n\nWypłaty w kolejce [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_withdrawals_due')|2]@gold! są już częścią roszczeń depozytowych i nie są dodawane po raz drugi."
 bfl_liquidity_facilities: "Instrumenty płynnościowe"
 bfl_liquidity_facilities_desc: "Nawet wypłacalny dom bankowy może nie być w stanie zaspokoić całego zapotrzebowania na monety na raz. Tymczasowe zaliczki na rzecz zdrowego majątku mogą załatać ten niedobór, pod warunkiem że pomoc nie zakrywa strat, których instytucja nie jest w stanie ponieść."
 bfl_liquidity_warning: "Płynność banku wymaga uwagi"
 bfl_liquidity_warning_desc: "Twój bank zalega w kolejce z wypłatami lub ma niewystarczający kapitał. Otwarta Gospodarka → Bankowość i Finanse w celu przeglądu depozytów i dokapitalizowania."
