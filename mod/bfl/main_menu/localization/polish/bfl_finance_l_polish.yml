 AM_bfl_chartered_bank: "Bank czarterowy"
 LEAD_bfl_chartered_bank: "Kontroler Chartered Bank"
 MODIFIER_TYPE_DESC_bfl_enable_advanced_clearing: "Odblokowuje rozliczenie netto zweryfikowanych wzajemnych zobowiązań pomiędzy uczestniczącymi instytucjami. Rozliczenie musi zachować uprawnienia każdego posiadacza i rozliczyć wpłacone saldo netto bez tworzenia pieniędzy. Natywne rozliczenia międzybankowe pozostają niedostępne."
 MODIFIER_TYPE_DESC_bfl_enable_bank_capital_subscriptions: "Umożliwia subskrypcję podstawową 100 złoto do banku. Nowe jednostki własnościowe wyceniane są według aktualnej wartości aktywów netto. Wpływy z subskrypcji zwiększają wpłacony kapitał, a nie zrealizowany zysk, i kupują proporcjonalne prawo do kolejnych wypłat."
 MODIFIER_TYPE_DESC_bfl_enable_bank_share_dealing: "Umożliwia usłudze transferu akcji bankowych przenoszenie istniejących zarejestrowanych jednostek pomiędzy zidentyfikowanymi posiadaczami. Transfer zmienia właściciela bez wydawania nowych jednostek i tworzenia zysku banku. Rejestr musi posiadać odpowiednią pojemność i chronić uprawnienia każdego posiadacza."
 MODIFIER_TYPE_DESC_bfl_enable_collateralization: "Odblokowuje zarejestrowane zastawy zabezpieczające i kontrole ich kwalifikowalności. Aktywa obciążone nie mogą stanowić zabezpieczenia drugiego roszczenia, a odzyskanie musi zachować pierwotny stosunek zadłużenia. Egzekucja z zabezpieczenia rodzimego pozostaje niedostępna."
 MODIFIER_TYPE_DESC_bfl_enable_commenda: "Odblokowuje zlecenie partnerstwa w zakresie inwestycji zagranicznych. Każde przedsięwzięcie wymaga zidentyfikowanego partnera, kapitału, zarejestrowanej umowy o podziale zysków i rozliczenia zrealizowanych wpływów. Wykonanie projektu pozostaje niedostępne w tej wersji rozwojowej."
 MODIFIER_TYPE_DESC_bfl_enable_commercial_bills: "Umożliwia w pełni finansowane rachunki płatnicze. Kupujący płaci 100 złoto przed emisją; bank rejestruje równe zaangażowanie płatne i pieniężne. Nazwany posiadacz może wykupić weksel po upływie jednego miesiąca tylko raz. Emisja nie jest zyskiem."
 MODIFIER_TYPE_DESC_bfl_enable_commodity_forwards: "Odblokowuje kontrakty terminowe na dostawę Merchant Finance. Każda umowa musi rejestrować kontrahenta, towar, ilość, datę dostawy i zabezpieczenie bez ponownego wykorzystania obciążonych zapasów. Natywna realizacja transakcji pozostaje niedostępna."
 MODIFIER_TYPE_DESC_bfl_enable_commodity_investments: "Odblokowuje zlecenie dotyczące zapasów Merchant Finance. Pozycje towarowe muszą reprezentować finansowane zasoby towarów rodzimych i uwzględniać koszty nabycia, ilość i opiekę. W tej wersji rozwojowej realizacja transakcji pozostaje niedostępna."
 MODIFIER_TYPE_DESC_bfl_enable_company_equity: "Odblokowuje mandat kapitałowy spółki zagranicznej inwestycyjnej. Udziały finansowe są rejestrowane oddzielnie od kontroli podmiotu politycznego. Tylko zweryfikowane wypłaty firmy mogą stać się dochodem banku; wykluczone są zapisy i zwrot kapitału. Wykonanie natywne pozostaje niedostępne."
 MODIFIER_TYPE_DESC_bfl_enable_corporate_credit: "Odblokowuje zezwolenie na kredyt korporacyjny Merchant Finance. Pożyczki muszą przenosić środki bankowe na rzecz zidentyfikowanego przedsiębiorstwa i tworzyć równorzędną wierzytelność podlegającą zwrotowi; spłaty kapitału nie wchodzą w zyski. Wykonanie natywne pozostaje niedostępne."
 MODIFIER_TYPE_DESC_bfl_enable_debt_restructuring: "Odblokowuje suwerenny mandat restrukturyzacyjny. Zmieniony termin wymagalności, odsetki i kwota główna muszą zostać dołączone do istniejącego roszczenia, za zgodą dłużnika. Wykonanie pozostaje niedostępne do czasu obsługi rodzimego uzgadniania długów."
 MODIFIER_TYPE_DESC_bfl_enable_liquidity_facilities: "Odblokowuje zabezpieczoną tymczasową płynność. Finansowanie musi pochodzić od rzeczywistego kontrahenta, mieścić się w granicach środków pieniężnych i kapitałowych oraz posiadać zarejestrowane zabezpieczenie. Wypłaty w kolejce zachowują priorytet. Natywne wykonanie obiektu pozostaje niedostępne."
 MODIFIER_TYPE_DESC_bfl_enable_margining_and_risk_management: "Odblokowuje wymagania dotyczące depozytu zabezpieczającego dla pozycji terminowych Merchant Finance. Ekspozycja musi być mierzona w oparciu o dostępne zabezpieczenia i środki pieniężne, przy czym przed zwiększeniem zobowiązań wymagane jest dodatkowe finansowanie. Handel natywny i realizacja depozytu zabezpieczającego pozostają niedostępne."
 MODIFIER_TYPE_DESC_bfl_enable_project_security: "Odblokowuje zabezpieczenia dla projektów inwestycji zagranicznych. Zidentyfikowane aktywa i wpływy z projektu muszą zostać zastawione w ramach jednego zarejestrowanego zobowiązania, z zachowaniem pierwszeństwa w drodze rozliczenia lub odzyskania. Natywne wykonanie projektu pozostaje niedostępne."
 MODIFIER_TYPE_DESC_bfl_enable_public_financial_backstops: "Odblokowuje publiczny mandat ochronny dla autoryzowanego banku licencjonowanego. Pomoc wymaga wkładu rzeczowego skarbu oraz ewidencyjnych wierzytelności lub jednostek własności; gwarancje nie mogą wypłacić gotówki ani wymazać strat. Stałe wykonanie mechanizmu ochronnego nie zostało jeszcze wdrożone."
 MODIFIER_TYPE_DESC_bfl_enable_sovereign_banknotes: "Odblokowuje emisję banknotów państwowych dla autoryzowanego banku czarterowego. Obligacje są zobowiązaniami podlegającymi wykupowi; zabezpieczenie nie obejmuje środków pieniężnych zebranych w wyniku sprzedaży samych banknotów. Natywne przekierowywanie wydawania i płatności dla posiadacza pozostają niedostępne."
 MODIFIER_TYPE_DESC_bfl_enable_term_deposits: "Umożliwia depozyty o stałym oprocentowaniu 100 złoto z dwunastomiesięcznym terminem zapadalności. Odsetki naliczane są co miesiąc według stawki przyjętej w momencie otwarcia konta; niedojrzałego kapitału nie można wycofać. Depozyty pozostają pasywami banku."
 MODIFIER_TYPE_DESC_bfl_enable_warehouse_receipts: "Odblokowuje rachunki Merchant Finance poparte zidentyfikowanymi partiami zapasów. Każdy paragon rezerwuje dziesięć nieobciążonych jednostek i pobiera opłatę za przechowanie finansowane. Przed wystawieniem nowych potwierdzeń należy zapewnić obsługę magazynu towarów rodzimych."
 MODIFIER_TYPE_DESC_bfl_no_automatic_tribute_cost_modifier: "Związek czarterowy nie ma automatycznego daniny. Dochody państwa pochodzą z odsetek od depozytów i dywidend od posiadanych akcji banków."
