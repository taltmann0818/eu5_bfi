 bfl_finance.110.desc: "Inwestycja kupuje nowy kapitał państwowy. Konwersja pozwala zachować tożsamość kraju banku. Zamknięcie tego wyboru nie powoduje przeniesienia żadnych pieniędzy. Na stronie wyświetlanych jest osiem kwalifikujących się tematów bezpośrednich; użyj Dalej, aby dotrzeć do dodatkowych banków."
