 bfl_facility_0: "Obiekt wyłączony"
 bfl_facility_0_definition: "Wył.: brak automatycznego wypożyczania. Nadal możesz wypożyczać ręcznie."
 bfl_facility_0_short: "Wyłączone"
 bfl_facility_0_tip: "Wyłącz mandat dotyczący stałego długu. Nie jest wymagane żadne zaplanowane finansowanie bankowe. Istniejące zobowiązania pozostają wymagalne."
 bfl_facility_1: "Kredyt pierwszy"
 bfl_facility_1_definition: "Wydatki: pożyczyć do 60% prognozowanych wydatków stanu w każdym miesiącu, niezależnie od stanu środków pieniężnych. Finansowanie kończy się na wspólnym miesięcznym limicie, zdolności kredytowej oraz bankowych limitach gotówkowych i kapitałowych."
 bfl_facility_1_short: "Wydatki"
 bfl_facility_1_tip: "Poproś o niestandardowe finansowanie obligacji dla 60% prognozowanych miesięcznych wydatków, w ramach wspólnego 1,000 miesięczny limit złota. Pomiń losowania, gdy dotrze stanowa gotówka 500 złota lub bankowi lub emitentowi brakuje mocy produkcyjnych."
 bfl_facility_2: "Obiekt buforowy"
 bfl_facility_2_definition: "Bufor gotówkowy: pożycz tyle, aby zwiększyć prognozowaną gotówkę stanu 200 dukaty. Finansowanie kończy się na wspólnym miesięcznym limicie, zdolności kredytowej oraz bankowych limitach gotówkowych i kapitałowych."
 bfl_facility_2_short: "Bufor gotówkowy"
 bfl_facility_2_tip: "Poproś o niestandardowe finansowanie obligacji w kierunku 200 stan złota po prognozowanym saldzie, w ramach wspólnego 1,000 miesięczny limit złota. Żądania bez środków nie powodują powstania długu ani gotówki."
 bfl_facility_reason_1: "#O Sprawdź badania, dostęp do oddziałów, dochód emitenta i pojemność kuponu.#!"
 bfl_facility_reason_2: "#O Chroniona gotówka pozostawia niewystarczającą ilość płynnych środków bankowych.#!"
 bfl_facility_reason_3: "#O Nowe roszczenie przekroczyłoby rezerwę kapitałową banku.#!"
 bfl_facility_reason_4: "#O Połączone zobowiązania państwowe osiągnęły zdolność zadłużenia emitenta.#!"
 bfl_facility_reason_5: "#O Niezapłacone kupony suwerenne blokują dalszą emisję.#!"
 bfl_facility_reason_6: "#O Suweren wyemitował już obligację w tym miesiącu.#!"
 bfl_facility_reason_7: "#O Wszystkie miejsca na zapisy na obligacje skarbowe są zajęte.#!"
 bfl_facility_tip: "Środki pieniężne bankowe faktycznie otrzymane z emisji niestandardowych obligacji skarbowych w tym miesiącu. Finansowanie tworzy zadłużenie i jest wyłączone z wypracowanego dochodu."
 bfl_facility_title: "Finansowanie miesięczne"
 bfl_facility_title_tip: "#T Mandat dotyczący kredytu dłużnego#!\nBank finansuje niestandardowe obligacje skarbowe o stałym kuponie rocznym. Wył. zatrzymuje zaplanowane problemy. Pierwsze prośby o zadłużenie 60% prognozowanych wydatków. Cele buforowe 200 stan złota po prognozowanym miesięcznym saldzie. Obydwa zatrzymują się na 500 stanowe złoto.\n\nOstatnia prośba: [Country.MakeScope.GetVariable('bfl_facility_requested').GetValue|2]@gold!\nOstatnio dofinansowane: [Country.MakeScope.GetVariable('bfl_facility_paid').GetValue|2]@gold!\n\nLosowania ręczne i automatyczne są wspólne a 1,000 miesięczny limit złota. Chroniona gotówka bankowa, kapitał, pojemność emitenta i niezapłacone kupony mogą zapobiec losowaniu. Wpływy stanowią finansowanie, a nie dochód."
 bfl_feedback_1: "Otrzymany kapitał czarterowy"
 bfl_feedback_2: "Depozyt otrzymany"
 bfl_feedback_3: "Wypłata opłacona"
 bfl_feedback_4: "Dywidenda wypłacona"
 bfl_feedback_5: "Odsprzedaż obligacji rozliczona"
 bfl_feedback_6: "Otrzymane wpływy z przedsięwzięcia"
 bfl_feedback_7: "#O Nowe ostrzeżenie dotyczące płynności#!"
 bfl_feedback_8: "Rezolucja zamknięta · odnotowane straty pozostają widoczne"
 bfl_feedback_9: "#O Cel instrumentu nie został sfinansowany#!"
 bfl_feedback_note: "Ostatnia potwierdzona transakcja · kwota jest już zaksięgowana. Otwarcie tego widoku nie odtwarza wcześniejszych efektów. Zmniejszony ruch zachowuje ten sam paragon i ostrzeżenia. Samo odkrycie nie generuje żadnego wskaźnika płatności."
 bfl_feedback_signature: "[GetPlayer.GetTag]:[GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bfl_player_feedback_period')|0]:[GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bfl_player_feedback_sequence')|0]"
 bfl_finance.100.desc: "Wybierz jedną stałą specjalizację. Obydwa służą państwowym kredytom i depozytom. Merchant Finance opracowuje towarowe i korporacyjne instrumenty kredytowe; Overseas Investment rozwija rekomendacje i kapitał spółki. Badania i bramy wiekowe nadal obowiązują."
