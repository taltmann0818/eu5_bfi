 bfl_report_native_cost_title: "Natywna strata budżetu"
 bfl_report_native_gross_definition: "Zrealizowana rodzima nadwyżka budżetowa odnotowana przez bank, po sklasyfikowaniu obserwowanych odsetek kredytu. To jest natywny kanał sieciowy; depozyty, emisja obligacji i nowy kapitał nie są ujęte w przychodach wypracowanych."
