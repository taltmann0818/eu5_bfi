 bfl_share_state_tip: "#T [Country.MakeScope.GetVariable('bfl_state_owner').GetCountry.GetName]#!\nPosiadane akcje: [Country.MakeScope.GetVariable('bfl_state_units').GetValue|2] / [Country.MakeScope.GetVariable('bfl_total_units').GetValue|2]\nWłasność: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_state_share_fraction')|%2]\nOstatnia miesięczna dywidenda: [Country.MakeScope.GetVariable('bfl_state_dividend_paid').GetValue|2]@gold!"
 bfl_share_subtitle: "Znakomity kapitał własny banku"
 bfl_share_title: "Udział w własności [Country.GetName]"
 bfl_share_trade: "Niedawny handel akcjami"
 bfl_share_trade_note: "Wybierz wiersz, ustaw ilość poniżej, a następnie przejrzyj transakcję."
 bfl_share_value_label: "Wartość portfela"
 bfl_shares_heading: "Akcje"
 bfl_sovereign_accounts: "Rachunki państwowe – oddzielone od aktywów bankowych"
 bfl_sovereign_accounts_subtitle: "Rodzime pożyczki państwowe – a nie aktywa bankowe"
 bfl_sovereign_accounts_tip: "Te rodzime długi i należności należą do suwerena, a nie jego banku. Pożyczki należące do banków są uwzględnione w zestawie aktywów; pasywa banków obejmują depozyty i niezapłacone koszty operacyjne. Natywna spłata utrzymuje suwerena w roli aktora."
 bfl_sovereign_banknotes: "Banknoty suwerenne"
 bfl_sovereign_banknotes_desc: "Bank wspierany przez władzę publiczną może rozpowszechniać pisemne obietnice zapłaty zamiast ciężkiej monety. Ich przyjęcie opiera się na pewności, że instytucja je wykupi, a organ wydający dotrzyma swoich zobowiązań."
 bfl_sovereign_credit: "Kredyt państwowy"
 bfl_sovereign_credit_tip: "#T Kredyt państwowy#!\nPożyczka z gotówki bankowej dla państwa ziemskiego, z roszczeniem o spłatę zarejestrowaną jako aktywa bankowe. Wymaga działającego banku i rodzimych warunków kredytu. Egzekucja nowej pożyczki jest niedostępna w tej kompilacji."
 bfl_sovereign_debt: "Dług państwowy"
 bfl_sovereign_debt_heading: "Dług publiczny [Country.GetName]"
 bfl_sovereign_note: "Notatka Suwerenna"
 bfl_sovereign_note_tip: "#T Banknoty podlegające wymianie#!\nAbsolutyzm, badania banknotów suwerennych, autoryzacja suwerenna, kapitałowy bank centralny i oddział banku emitenta. Wymiana 100 gatunek objęty w pełni zastrzeżonym roszczeniem. Niezależny limit oparty na kapitale własnym nie obejmuje przychodzącej gotówki wekslowej. Dobrowolne przelewy nominalne; płatności natywne pozostają w złocie."
 bfl_sovereign_receivables: "Należności państwowe"
 bfl_sovereign_receivables_heading: "Należności skarbowe od [Country.GetName]"
 bfl_sovereign_restructuring: "Restrukturyzacja suwerenna"
 bfl_sovereign_restructuring_tip: "#T Restrukturyzacja suwerenna#!\nRenegocjacja długu publicznego w ramach zaliczki na restrukturyzację długu. Wymaga dozwolonego wieku, działającego banku i obsługiwanej transakcji długiem rodzimym. W tej kompilacji nie jest dostępne natywne wykonanie restrukturyzacji."
 bfl_specialization_title: "Specjalizacja banku"
 bfl_state_bonds_tip: "#T Zdolność obligacji państwowych#!\nWybitne rodzime obligacje państwowe: [GetPlayer.GetNumBonds]\nMaksymalne miejsca na obligacje natywne: [GetPlayer.GetDoubleModifierValue('max_bonds', 'max_bonds_modifier')|0]\n\nSą to obligacje państwa, odrębne od depozytów banku, kapitału własnego i innych zobowiązań. Pojemność obejmuje natywne gniazda podstawowe i modyfikatory pojemności wiązań. Sprzedaż obligacji wymaga również spełnienia rodzimych warunków pożyczkowych."
 bfl_state_bonds_value: "Obligacje: [GetPlayer.GetNumBonds] / [GetPlayer.GetDoubleModifierValue('max_bonds', 'max_bonds_modifier')|0]"
 bfl_state_chartered_bank: "Bank państwowy"
 bfl_state_chartered_bank_desc: "Odrębnie finansowany rodzimy podmiot bankowy. Suweren początkowo jest właścicielem wszystkich akcji i ustala miesięczną wypłatę dywidendy w kredycie. Nowe subskrypcje bankowe podnoszą kapitał i rozwadniają istniejącą własność. Depozyty państwowe są oprocentowane na preferencyjnych warunkach."
 bfl_state_credit: "Kredyt państwowy"
 bfl_state_credit_value: "Kredyt: [Multiply_CFixedPoint(GetPlayer.GetCreditworthiness, '(CFixedPoint)100')|0]"
 bfl_state_interest_value: "Zainteresowanie: [GetPlayer.GetModifierValueNoFormat('bank_interest')]"
 bfl_statement_subtitle: "Ostatnie zakończone rozliczenie"
 bfl_status_0: "Działający"
 bfl_status_1: "Gotówka pod presją"
 bfl_status_2: "Wypłaty w kolejce"
 bfl_status_3: "Niewypłacalny"
 bfl_status_4: "W rozdzielczości"
 bfl_status_5: "Zamknięte"
 bfl_strategy_automatic: "Mandat AI · automatyczny"
 bfl_strategy_credit: "Ostatnia opinia: kredyt oferowany za zgodą"
 bfl_strategy_delegated: "Mandat inwestycyjny · delegowany"
 bfl_strategy_deposit: "Ostatnia recenzja: 100 złoto oferowane na żądanie"
 bfl_strategy_disable: "Zarządzaj inwestycjami"
 bfl_strategy_disable_tip: "Zatrzymaj automatyczne zakupy pożyczek, oferty nowych strategii i popyt na miejsca docelowe. Istniejące kredyty, depozyty i należności oczekujące w kolejce są w dalszym ciągu obsługiwane. Zasady dotyczące towarów, akcji i oddziałów pozostają odrębne."
 bfl_strategy_enable: "Deleguj inwestycje"
 bfl_strategy_enable_tip: "Autoryzuj punktowane zakupy istniejących pożyczek rodzimych, ofert kredytów i ładunków dla kwalifikujących się kontrahentów AI oraz lokowanie nadwyżek gotówkowych na żądanie. Niska płynność może skutkować wystawieniem jednej posiadanej obligacji skarbowej na poziomie 98% twarzy; zaakceptowana odsprzedaż może spowodować stratę. Cargo korzysta z Twoich aktualnych Warunków oraz zwykłej zgody i rozliczenia fizycznego. Pożyczki państwowe, dywidendy, towary i władza monetarna zachowują odrębną politykę. Nowe sprawy biznesowe zatrzymują się w trakcie rozwiązywania."
 bfl_strategy_idle: "Ostatnia recenzja: zachowana płynność"
 bfl_strategy_manual: "Mandat inwestycyjny · podręcznik"
 bfl_strategy_recall: "Ostatnia recenzja: zażądano wycofania depozytu"
 bfl_strategy_resale: "Ostatnia recenzja: posiadana obligacja jest oferowana w celu zapewnienia płynności"
 bfl_strategy_secondary_statement: "Automatyczne zakupy w ramach pożyczki rodzimej: [Country.MakeScope.GetVariable('bfl_strategy_takeovers').GetValue|0] · Notowania odsprzedaży obligacji: [Country.MakeScope.GetVariable('bfl_strategy_resales').GetValue|0]"
 bfl_strategy_secondary_tip: "Przegląd zakupów istniejących kredytów u co najwyżej dwunastu zrealizowanych klientów oddziałów kapitałowych. Kredytobiorca potrzebuje płynności, spokoju, nieujemnego budżetu i przynajmniej 0.50 zdolność kredytowa. Zakupy zostają 100 wolna gotówka, ogranicz premię za przejęcie do 25% pozostałego kapitału i całkowitego zaangażowania kredytobiorcy na poziomie 25% kapitału własnego. Oczekiwana marża miesięczna musi wynosić co najmniej 0.10 złoto po uwzględnieniu składki, dodatku serwisowego i konserwatywnych kosztów finansowania. To jest szacunek; wcześniejsza spłata i niewypłacalność mogą nadal powodować straty. Niska płynność może dotyczyć jednej posiadanej obligacji skarbowej 98% twarzy poprzez ukończoną Giełdę Papierów Wartościowych. Żadne wpływy z odsprzedaży nie są księgowane przed zgodą kupującego posiadającego środki."
 bfl_strategy_statement: "Recenzje miesięczne: [Country.MakeScope.GetVariable('bfl_strategy_reviewed').GetValue|0]/12  · Wynik: [Country.MakeScope.GetVariable('bfl_strategy_score').GetValue|2]\nOferty kredytowe: [Country.MakeScope.GetVariable('bfl_strategy_offers').GetValue|0]  · Depozyty złożone: [Country.MakeScope.GetVariable('bfl_strategy_placements').GetValue|0]  · Przypomina: [Country.MakeScope.GetVariable('bfl_strategy_recalls').GetValue|0]"
 bfl_strategy_title: "Mandat inwestycyjny"
 bfl_strategy_title_tip: "Konserwatywny mandat miesięczny. Przejrzyj maksymalnie dwunastu kandydatów na kredyt, dwunastu połączonych operatorów przedsięwzięć z czterema rynkami źródłowymi każdy lub dwanaście banków depozytowych. Maksymalnie jedna oferta kredytowa, oferta cargo lub 100- Miesięczne lokowanie popytu na złoto. Oferty kredytowe i cargo mogą zostać schłodzone na trzy miesiące. Ładunek wymaga podanej marży co najmniej 10% i jedna nadwyżka banku złota, zatrzymuje 500 wolnej gotówki i jest ograniczona do dwóch aktywnych umów oraz 25% kapitał własny. Cytaty mogą się zmieniać; straty są nadal możliwe. Chronione środki pieniężne, badania, oddziały i uprawnienia profilowe nadal obowiązują."
 bfl_strategy_venture: "Ostatnia recenzja: partnerstwo cargo oferowane za zgodą"
 bfl_streamline_bank: "Usprawnij administrację · 100 złoto"
 bfl_streamline_bank_tip: "Zapłać 100 stan złota raz, aby zmniejszyć stałe koszty działalności banku o 10%. Reforma statutu, Bankowość i Zaawansowane Rozliczenia zapewniają dodatkowe obniżki. Decyzja ta nie generuje zysku banku."
 bfl_subscribe_bank: "Subskrybuj 100 złoto kapitału banku"
 bfl_subscribe_bank_act: "$bfl_subscribe_bank$"
 bfl_subscribe_bank_desc: "Finansowane z własnego skarbca po sprawdzeniu profilu, wieku, badań i rejestru. Kapitał nie jest zyskiem banku. Bankowa subskrypcja kapitału pozwala na zakup jednostek po aktualnej wartości aktywów netto."
 bfl_subscribe_bank_effect_text: "$bfl_subscribe_bank$"
 bfl_subscribe_bank_effect_text_past: "$bfl_subscribe_bank$"
 bfl_suspend_command: "Zawieś nowe depozyty"
 bfl_suspend_command_tip: "#T Zawieś nowe depozyty#!\nPrzestań akceptować nowe depozyty i działania związane z finansowaniem, które wymagają akceptacji depozytu. Istniejące konta, zobowiązania odsetkowe i wnioski o wypłatę pozostają rejestrowane. Kontrola ta nie powoduje zamknięcia banku ani umorzenia jego długów."
 bfl_term_accept: "Zaakceptuj te stałe warunki"
 bfl_term_amount: "Lokata terminowa"
 bfl_term_amount_desc: "Wybierz kwotę wpłaty. Lokaty terminowe są prowadzone przez dwanaście miesięcy."
 bfl_term_amount_tip: "Wybierz bank i kwotę. Przelej gotówkę ze skarbca na konto. Odsetki i wypłaty należą do deponenta. Po potwierdzeniu bank ponownie sprawdza środki i warunki."
 bfl_term_decline: "Zachowaj istniejące konto"
 bfl_term_deposit: "Lokata terminowa"
 bfl_term_deposits_desc: "Kupcy nie zawsze mogą od razu wykorzystać swoje pieniądze. Powierzając go domowi bankowemu na uzgodniony okres, dają bankierowi stabilniejsze źródło kapitału i otrzymują rekompensatę za rezygnację z natychmiastowego dostępu do swoich środków."
 bfl_term_offer_1_desc: "Odnów swoją dojrzałość [ROOT.GetCountry.MakeScope.GetVariable('bfl_deposit_offer_principal').GetValue|2] złoty kapitał dla 12 miesiące o godz [ROOT.GetCountry.MakeScope.GetVariable('bfl_deposit_offer_rate').GetValue|%1] rocznie. Naliczone odsetki pozostają należne oddzielnie. Żaden nowy dyrektor nie jest przenoszony. Oferta ta wygasa z końcem miesiąca; zmienione roszczenia wymagają nowej oferty."
 bfl_term_offer_1_title: "Odnów dojrzałą lokatę terminową"
 bfl_term_offer_2_desc: "Kolejka do wcześniejszej wypłaty [ROOT.GetCountry.MakeScope.GetVariable('bfl_deposit_offer_principal').GetValue|2] złota kwota główna po anulowaniu [ROOT.GetCountry.MakeScope.GetVariable('bfl_deposit_offer_penalty').GetValue|2] złoto z naliczonymi odsetkami (co najwyżej 1% dyrektora). Nie ma zastosowania żadna kara główna. Niedobory gotówki pozostają w kolejce do wypłat. Oferta ta wygasa z końcem miesiąca; zmienione roszczenia wymagają nowej oferty."
 bfl_term_offer_2_title: "Oferta wcześniejszej wypłaty"
 bfl_term_service_1: "Odnów pierwsze zapadłe konto terminowe"
 bfl_term_service_1_act: "$bfl_term_service_1$"
 bfl_term_service_1_desc: "Zapytaj o ofertę obsługi terminowej w wybranym banku. Akceptacja zachowuje niezapłacone roszczenia i ponownie sprawdza wygenerowanie partii."
 bfl_term_service_1_effect_text: "$bfl_term_service_1$"
 bfl_term_service_1_effect_text_past: "$bfl_term_service_1$"
 bfl_term_service_1_tip: "Wybiera pierwszą kwalifikującą się partię terminową. Bank przedstawia stałe warunki jednoznacznej akceptacji. Odnowienie wymaga aktualnych zezwoleń wstępu i kadencji; wczesne wyjście i dojrzałe wycofanie pozostają dostępne po utracie relacji lub władzy. Nie można wykonać zmienionych lub wygasłych ofert."
 bfl_term_service_2: "Poproś o wcześniejsze wycofanie"
 bfl_term_service_2_act: "$bfl_term_service_2$"
 bfl_term_service_2_desc: "Zapytaj o ofertę obsługi terminowej w wybranym banku. Akceptacja zachowuje niezapłacone roszczenia i ponownie sprawdza wygenerowanie partii."
