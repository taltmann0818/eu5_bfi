 bfl_establish_chartered_bank.desc: "Przekształć jeden istniejący Bank Stanowy w miejsce i zyskaj Tradycje Bankowe po ukończeniu statutu. Obecna inwestycja 500 / 750 / 1,000 / 1,500 / 2,000 / 3,000 złoto przekazywane jest do jego skarbca jako kapitał państwowy. Musisz posiadać swój rynek kapitałowy. Wybierz bank przed dokonaniem jakiejkolwiek płatności lub badania."
