 bfl_portfolio_history_axis: "Od najstarszych do najnowszych · do 12 miesięczne obserwacje"
 bfl_portfolio_history_empty: "Historia zaczyna się od następnego miesięcznego zamknięcia banku."
 bfl_portfolio_history_flows: "Wartość obejmuje zakupy i sprzedaż; nie jest to wskaźnik zwrotu z inwestycji."
 bfl_portfolio_history_title: "Wartość portfela w czasie"
 bfl_portfolio_owner_note: "Holdingi skarbowe i bankowe mają odrębnych właścicieli. Najedź kursorem na podmiot, aby zobaczyć jego finanse."
 bfl_portfolio_total_heading: "Aktualna wartość kapitału własnego"
 bfl_portfolio_treasury_heading: "Udziały skarbu państwa"
 bfl_prepare_bond_panel: "Obligacje państwowe"
 bfl_prepare_bond_panel_tip: "Zobacz finansowanie państwowe i istniejące roszczenia w kredycie."
 bfl_probe_P11: "Brama rozwojowa: P11 musi zostać zmierzony w grze, zanim adapter będzie mógł zostać uruchomiony."
 bfl_profile_0: "Wybierz specjalizację"
 bfl_profile_1: "Finanse handlowe"
 bfl_profile_2: "Inwestycje zagraniczne"
 bfl_project_security: "Bezpieczeństwo projektu"
 bfl_project_security_desc: "Odległe przedsiębiorstwa są trudne do nadzorowania przez ich finansistów. Roszczenia do ich aktywów i wpływów, ustalone przed wpłatą kapitału, dają inwestorom możliwość ochrony ich interesów w przypadku niepowodzenia przedsięwzięcia."
 bfl_project_security_tip: "#T Bezpieczeństwo projektu#!\nZabezpiecz przedsięwzięcie przed możliwymi do zidentyfikowania roszczeniami projektowymi. Wymaga badań w zakresie bezpieczeństwa projektu, inwestycji zagranicznych i epoki absolutyzmu lub nowszej. W tej kompilacji nie jest dostępna natywna realizacja zabezpieczeń projektu."
 bfl_protected_label: "Chroniona gotówka"
 bfl_public_backstop: "Publiczna ochrona"
 bfl_public_backstop_tip: "#T Wsparcie publiczne zabezpieczone#!\nRewolucje, zabezpieczenia finansów publicznych i statut na żywo z ukończonym Bankiem Centralnym w stolicy suwerennej. Wyraźnie zaakceptowane 75-pożyczki w złocie korzystają z wolnych środków pieniężnych banku publicznego, a 25% strzyżenie rachunków i przynajmniej 9% odsetki roczne. Żadnego bezpłatnego dokapitalizowania."
 bfl_public_financial_backstops: "Publiczne zabezpieczenia finansowe"
 bfl_public_financial_backstops_desc: "Kiedy upadek wielkiego domu bankowego zagraża kredytowi publicznemu i handlowi, rząd może interweniować. Takie wsparcie wiąże zasoby skarbu państwa z naprawą banku i sprawia, że ​​warunki pomocy stają się przedmiotem porządku publicznego."
 bfl_purchase_funded_bill: "Kup rachunek z płatnościami finansowanymi"
 bfl_purchase_funded_bill_act: "$bfl_purchase_funded_bill$"
 bfl_purchase_funded_bill_desc: "Finansowane z własnego skarbca po sprawdzeniu profilu, wieku, badań i rejestru. Kapitał nie jest zyskiem banku. Bankowa subskrypcja kapitału pozwala na zakup jednostek po aktualnej wartości aktywów netto."
 bfl_purchase_funded_bill_effect_text: "$bfl_purchase_funded_bill$"
 bfl_purchase_funded_bill_effect_text_past: "$bfl_purchase_funded_bill$"
 bfl_purchase_native_loan: "Bank: kup rodzimy kredyt na nieruchomość"
 bfl_purchase_native_loan_act: "$bfl_purchase_native_loan$"
 bfl_purchase_native_loan_desc: "Twój bank jest kupującym. Obowiązuje natywna cena i uprawnienia, z dodatkowymi bezpłatnymi kontrolami gotówkowymi i kapitałowymi. Majątki bankowe otrzymują cenę zakupu, a kredyt zmienia właściciela. Nie uwzględnia się obligacji i pożyczek posiadanych już w kraju."
 bfl_purchase_native_loan_effect_text: "$bfl_purchase_native_loan$"
 bfl_purchase_native_loan_effect_text_past: "$bfl_purchase_native_loan$"
 bfl_purchase_native_loan_tip: "#T Przejąć kredyt dla banku#!\nWybierz innego suwerena z kwalifikującym się długiem majątkowym. Twój bank licencjonowany płaci rodzimą cenę zakupu majątkom bankowym tego kraju i staje się wierzycielem tej samej pożyczki. Należności kapitałowe i odsetkowe należą do banku; suweren uzyskuje dochód z pożyczek poprzez dywidendy z akcji. Banki nabywają również samodzielnie co miesiąc jedną kwalifikującą się pożyczkę, jeśli pozwalają na to rezerwy i kapitał. Nie uwzględnia się obligacji i pożyczek posiadanych już w kraju."
 bfl_rate_0: "Brak żądanych odsetek dla nowych kont"
 bfl_rate_0_short: "0%"
 bfl_rate_0_tip: "Oferta 0% roczne odsetki od nowych depozytów na żądanie. Istniejące rachunki na żądanie i odrębna stopa rachunku terminowego pozostają na dotychczasowych stawkach."
 bfl_rate_1: "1% roczna stopa zapotrzebowania na nowe rachunki"
 bfl_rate_1_short: "1%"
 bfl_rate_1_tip: "Oferta 1% roczne odsetki od nowych depozytów na żądanie. Odsetki naliczane są co miesiąc wraz z procentem przeniesienia. Istniejące konta popytu zachowują zaakceptowane stawki."
 bfl_rate_2: "2% roczna stopa zapotrzebowania na nowe rachunki"
 bfl_rate_2_short: "2%"
 bfl_rate_2_tip: "Oferta 2% roczne odsetki od nowych depozytów na żądanie. Odsetki naliczane są co miesiąc wraz z procentem przeniesienia. Istniejące konta popytu zachowują zaakceptowane stawki."
 bfl_recapitalize_command: "Dokapitalizuj za pomocą 100 złoto"
 bfl_recapitalize_command_tip: "Zapłać 100 złoto ze skarbca twojego kraju jako kapitał banku. Wymaga 100 złoto i oferta odsprzedaży dealera nie wyższa niż rzeczywista NAV; kapitał zatrzymuje się podczas wyższej premii rynkowej, aby zapobiec natychmiastowemu zyskowi z odsprzedaży. Nadal dostępna jest finansowana pomoc ratunkowa przy zerowej lub ujemnej NAV."
 bfl_redeem_bond: "Wykorzystaj"
 bfl_redeem_bond_01_tip: "Zapłać wartość nominalną plus wszystkie naliczone kupony obecnemu posiadaczowi. Niedobór powoduje, że cała obligacja pozostaje niezapłacona. Wykup raz zamyka roszczenie; obligacje rodzime pozostają nienaruszone."
