 bfl_cost_title: "Koszty operacyjne [Country.GetName]"
 bfl_credit_1_desc: "Oferta banku 100 złoto za 60 miesięcy według podanej stawki rocznej. Akceptacja ponownie sprawdza finansowanie, uprawnienia, zdolność zadłużenia i kwalifikowalność. Podstawą jest finansowanie, a nie dochód.\nStawka roczna: [ROOT.GetCountry.MakeScope.GetVariable('bfl_credit_offer_rate').GetValue|%1]."
 bfl_credit_1_title: "Oferta kredytowa"
 bfl_credit_2_desc: "Twój pożyczkodawca oferuje 20% obniżka kwoty głównej i roczna obniżka stopy procentowej o jeden punkt procentowy (minimum 1%). Zmienia to tylko istniejącą pożyczkę niezabezpieczoną. Jego dojrzałość pozostaje niezmieniona."
 bfl_credit_2_title: "Oferta umorzenia długów"
