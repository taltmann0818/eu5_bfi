 bfl_venture_accept: "Zaakceptuj partnerstwo"
 bfl_venture_accept_tip: "Sprawdź ponownie autorytet inwestora na żywo, niezmienione warunki oferty, wiek, badania, wolne środki pieniężne, kapitał, pojemność i wkład operatora. Finansowanie pokrywa tylko rzeczywisty koszt natywny wybranego działania. Nie przyznaje żadnych udziałów w spółce ani kontroli politycznej."
 bfl_venture_decline: "Odmów"
 bfl_venture_duration_12: "Czas trwania · 12 miesiące"
 bfl_venture_duration_120: "Czas trwania · 120 miesiące"
 bfl_venture_duration_24: "Czas trwania · 24 miesiące"
 bfl_venture_duration_6: "Czas trwania · 6 miesiące"
 bfl_venture_duration_60: "Czas trwania · 60 miesiące"
 bfl_venture_duration_tip: "Cykl 6, 12, 24, 60 lub 120 miesiące. Terminy długoterminowe uwzględniają eksplorację rodzimą. Ładunek sprzedaje się po dwóch miesiącach, jeśli dostęp natywny pozostaje ważny; zablokowany ładunek pozostaje w areszcie. Koszty ekspedycji niepowiązane z wpływami ze sprzedaży są odpisywane w terminie zapadalności."
 bfl_venture_empty: "Brak aktywnych przedsięwzięć. Zanim zaoferujesz warunki, wybierz operację cargo lub wyprawę krajową."
 bfl_venture_help: "Kliknij termin, aby przejść do cyklu. Każdy operator akceptuje osobno. Istniejące umowy obowiązują po zmianie polityki lub badań."
 bfl_venture_hint: "Najedź kursorem, aby zobaczyć aktywność, koszty, ładunek i zwroty"
 bfl_venture_locked: "Nowe przedsięwzięcia zablokowane · najedź kursorem, aby zobaczyć wymagania"
 bfl_venture_note: "Kapitał jest odzyskiwany przed zyskiem. Straty podążają za wkładami. Tylko ładunek nabyty w ramach określonej operacji może sfinansować jej dochody. Niepowiązany handel nigdy nie płaci za tę umowę. Samo odkrycie nic nie daje. Zamknięte wiersze pozostają do czasu zastąpienia ich nowo zaakceptowaną umową."
 bfl_venture_offer_desc: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_bank').GetCountry.GetName] oferty [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_ticket').GetValue|0] złoto za [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_duration').GetValue|0] miesiące. Wstępnie ustawione [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_preset').GetValue|0]: 0 = inwestor finansuje cały kapitał, otrzymuje 75% nadwyżki; 1 = inwestor wnosi dwie trzecie, operator jedną trzecią, nadwyżka zostaje podzielona równo. W pierwszej kolejności odzyskiwany jest kapitał; straty podążają za wkładami. Tylko rzeczywiste wpływy ze sprzedaży określonej operacji mogą wypłacić zysk. Sukces w eksploracji daje szansę, nigdy złoto. Oferta ta wygasa za trzy miesiące."
 bfl_venture_offer_desc_0: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_bank').GetCountry.GetName] upoważnia do [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_ticket').GetValue|0] złoto finansowania bankowego [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_duration').GetValue|0] miesiące. Kup 10 [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_good').Goods.GetNameWithNoTooltip] w [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_from').GetMarket.GetName], noś je przez dwa miesiące, a potem sprzedaj [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_to').GetMarket.GetName]. Bank finansuje wszystkie koszty i otrzymuje 75% nadwyżki.\n\nRysowane są tylko rzeczywiste koszty własne. Niewykorzystane środki pozostają w banku. Kapitał jest odzyskiwany przed nadwyżką; straty podążają za wkładami. Jedynie wyceniony przychód ze sprzedaży tego ładunku stanowi rozliczenie niniejszej umowy. Niepowiązane dochody i odkrycia nic nie przynoszą. Oferta wygasa za trzy miesiące."
 bfl_venture_offer_desc_1: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_bank').GetCountry.GetName] upoważnia do [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_ticket').GetValue|0] złoto finansowania bankowego [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_duration').GetValue|0] miesiące. Kup 10 [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_good').Goods.GetNameWithNoTooltip] w [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_from').GetMarket.GetName], noś je przez dwa miesiące, a potem sprzedaj [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_to').GetMarket.GetName]. Bank finansuje dwie trzecie kosztów; płacisz jedną trzecią. Nadwyżka jest dzielona równo.\n\nRysowane są tylko rzeczywiste koszty własne. Niewykorzystane środki pozostają w banku. Kapitał jest odzyskiwany przed nadwyżką; straty podążają za wkładami. Jedynie wyceniony przychód ze sprzedaży tego ładunku stanowi rozliczenie niniejszej umowy. Niepowiązane dochody i odkrycia nic nie przynoszą. Oferta wygasa za trzy miesiące."
 bfl_venture_offer_desc_2: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_bank').GetCountry.GetName] upoważnia do [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_ticket').GetValue|0] złoto finansowania bankowego [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_duration').GetValue|0] miesiące. Przygotuj natywną eksplorację [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_area').GetArea.GetName] od [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_port').GetLocation.GetName] z [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_explorer').GetCharacter.GetName]. Bank finansuje wszystkie uzgodnione koszty i otrzymane złoto 75% nadwyżki kontraktowej. Przygotowanie nie podlega zwrotowi, włączając anulowanie. Zapewniasz załogę, lokalne utrzymanie i opcjonalne wydatki na wyprawę poza niniejszą umową o finansowaniu. Pozostała autoryzacja bankowa może sfinansować jeden dziesięciojednostkowy ładunek z rynku skupionego na odkrytym obszarze lub graniczącego z nim, pod warunkiem rodzimego dostępu. Tylko zmierzona sprzedaż tego ładunku, pomniejszona o zarejestrowane koszty przygotowania i ładunku, może pokryć nadwyżkę umowną. Odkrycie i niepowiązany handel nic nie dają. Oferta wygasa za trzy miesiące. "
 bfl_venture_offer_desc_3: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_bank').GetCountry.GetName] upoważnia do [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_ticket').GetValue|0] złoto finansowania bankowego [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_duration').GetValue|0] miesiące. Przygotuj natywną eksplorację [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_area').GetArea.GetName] od [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_port').GetLocation.GetName] z [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_explorer').GetCharacter.GetName]. Bank finansuje dwie trzecie uzgodnionych kosztów złota; płacisz jedną trzecią. Nadwyżka kontraktowa jest dzielona równo. Przygotowanie nie podlega zwrotowi, włączając anulowanie. Zapewniasz załogę, lokalne utrzymanie i opcjonalne wydatki na wyprawę poza niniejszą umową o finansowaniu. Pozostała autoryzacja bankowa może sfinansować jeden dziesięciojednostkowy ładunek z rynku skupionego na odkrytym obszarze lub graniczącego z nim, pod warunkiem rodzimego dostępu. Tylko zmierzona sprzedaż tego ładunku, pomniejszona o zarejestrowane koszty przygotowania i ładunku, może pokryć nadwyżkę umowną. Odkrycie i niepowiązany handel nic nie dają. Oferta wygasa za trzy miesiące. "
 bfl_venture_offer_title: "Godne pochwały partnerstwo"
 bfl_venture_outcome_1: "Połączona wyprawa rodzima w toku"
 bfl_venture_outcome_10: "Zmieniono koszt lub czynność · Wydano autoryzację"
 bfl_venture_outcome_2: "Odkrycie zarejestrowane · wymagane są jeszcze rachunki handlowe"
 bfl_venture_outcome_3: "Wyprawa zakończyła się bez zweryfikowanego odkrycia"
 bfl_venture_outcome_4: "Ładunek w tranzycie · dokonano zakupu rodzimego"
 bfl_venture_outcome_5: "Dostawa zablokowana · zatrzymany ładunek"
 bfl_venture_outcome_6: "Ładunek sprzedany · rozliczane są tylko zmierzone wpływy"
 bfl_venture_outcome_7: "Spływ dotychczasowy · brak nadwyżki związanej z działalnością"
