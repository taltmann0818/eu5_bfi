 bfl_charter_begin_tip: "Otwórz odpowiedni selektor banku stanowego. Żadne pieniądze ani badania nie zostaną zmienione, dopóki nie zostanie wybrany bank; Anuluj pozostawia oba skarbce bez zmian."
 bfl_charter_selection_tip: "Przeniesienie [ROOT.GetCountry.MakeScope.ScriptValue('bfl_charter_investment')|0]@gold! wybranemu bankowi jako nowy kapitał państwowy. Zachowaj swój kraj, budynki, istniejące roszczenia i zobowiązania, a następnie wybierz stałą specjalizację."
 bfl_chartered_bank: "Bank czarterowy"
 bfl_chartered_bank_desc: "Działający w oparciu o budynek Bank Stanowy, czarterowany na miejscu. Jego środki pieniężne i zobowiązania pozostają oddzielone od suwerena. Nie pobiera się automatycznie daniny."
 bfl_clearing: "Rozliczanie"
 bfl_clearing_tip: "#T Zaawansowane oczyszczanie#!\nRewolucje, Advanced Clearing i badania rodzimej Izby Rozliczeniowej. Własna, ukończona Izba Rozliczeniowa i wyraźne przyjęcie członka umożliwiają atomowe rozliczenie netto dopasowanych zapadających bonów. Krótki element blokuje partię i zachowuje każde roszczenie."
 bfl_clergy_estate_workout_mandate: "Nakaz treningu majątku"
 bfl_clergy_estate_workout_mandate_desc: "Posiadłość ta wyraźnie upoważnia swój rząd do dokonywania w jej imieniu przeglądu dobrowolnych wypłat depozytów bankowych. Każda propozycja nadal wymaga osobnej akceptacji. Odwołanie tego przywileju powoduje unieważnienie oczekujących warunków majątkowych. Płatności windykacyjne nadal trafiają do portfela majątku."
 bfl_close_bank_offering: "Zamknij ofertę akcji"
 bfl_close_bank_offering_tip: "Przestań akceptować subskrypcje zewnętrzne. Dotychczasowe prawa własności i prawa do dywidendy pozostają w mocy. Suweren może nadal dokapitalizować swój własny bank."
 bfl_close_bond_offer: "Zamknij ofertę obligacji"
 bfl_close_bond_offer_tip: "Wycofaj obecną ofertę dodatkową. Zaległy dług i kupony pozostają należne."
 bfl_collateral: "Zabezpieczenie"
 bfl_collateralization: "Zabezpieczenie"
 bfl_collateralization_desc: "Zaufanie wzmacnia się, gdy obietnica jest poparta majątkiem. Rejestrując zastaw i prawa wierzyciela do niego, bankierzy mogą pożyczać pod majątek, który można odzyskać, jeśli dłużnik nie wywiąże się z umowy."
 bfl_commenda: "Pochwała"
 bfl_commenda_available_color: "green"
 bfl_commenda_available_icon: "@bfl_commenda_opportunity!"
 bfl_commenda_available_left_click: "Przejrzyj tę operację"
 bfl_commenda_available_name: "Commenda dostępna do sfinansowania"
 bfl_commenda_available_tooltip: "[GetPlayer.MakeScope.GetVariable('bfl_op_country').GetCountry.GetName] · 10 [GetPlayer.MakeScope.GetVariable('bfl_op_good').Goods.GetNameWithNoTooltip]\n[GetPlayer.MakeScope.GetVariable('bfl_op_from').GetMarket.GetName] → [GetPlayer.MakeScope.GetVariable('bfl_op_to').GetMarket.GetName]\nSzacunkowy koszt bankowy: [GetPlayer.MakeScope.GetVariable('bfl_op_cost').GetValue|2]@gold!\nOrientacyjna nadwyżka banku: +[GetPlayer.MakeScope.GetVariable('bfl_op_surplus').GetValue|2]@gold!\n\nAktualne notowania rynkowe dotyczące dwumiesięcznej operacji cargo; nadwyżka nie obejmuje kapitału odzyskanego. Ceny i dostęp mogą ulec zmianie. Kapitał i zyski są zagrożone. Tylko rzeczywista sprzedaż tego ładunku opłaca umowę. Operator musi zaakceptować. Możliwości odświeżają się co miesiąc i są ponownie sprawdzane przed wysłaniem oferty."
 bfl_commenda_cargo: "Commenda: statek z ładunkiem na obszarze odkrytym"
 bfl_commenda_cargo_act: "Statek z odkrytym obszarem ładunku"
 bfl_commenda_cargo_desc: "Wybierz sponsorowanego operatora i dziesięciojednostkowy ładunek z rynku skupionego na odkrytym obszarze lub graniczącego z nim. Tylko niewykorzystane zaakceptowane środki mogą pokryć rodzimy koszt zakupu. Brak wypłaty za odkrycie lub niepowiązane przypisanie transakcji."
 bfl_commenda_cargo_effect_text: "Statek z odkrytym obszarem ładunku"
 bfl_commenda_cargo_effect_text_past: "Statek z odkrytym obszarem ładunku"
 bfl_commenda_cargo_tip: "Wymaga zweryfikowanego odkrycia zaakceptowanej ekspedycji, pozostałej autoryzacji, dostępu do rynku rodzimego i zapasów. Operator lub kontroler polityczny dowodzi rejsem."
 bfl_commenda_desc: "Kupiec wyruszający w podróż może posiadać umiejętność handlu bez kapitału potrzebnego do zapełnienia statku. Komenda łączy pieniądze finansisty z pracą partnera podróży, dzieląc się dochodami z przedsięwzięcia zgodnie z ich umową."
 bfl_commenda_expedition: "Ufunduj nazwaną wyprawę"
 bfl_commenda_expedition_act: "Ufunduj nazwaną wyprawę"
 bfl_commenda_expedition_desc: "Wybierz operatora, jego port startowy, nieodkryty obszar morski i odkrywcę. Cele morskie muszą znajdować się w zasięgu marynarki operatora; firmy bezrolne korzystają z oferty gospodarza wybranego obiektu. Akceptacja środków przygotowania rodzimego na proponowanych warunkach. Bank nie zyskuje kontroli politycznej."
 bfl_commenda_expedition_effect_text: "Ufunduj nazwaną wyprawę"
 bfl_commenda_expedition_effect_text_past: "Ufunduj nazwaną wyprawę"
 bfl_commenda_expedition_tip: "Wybierz operatora, obszar, port startowy i eksploratora przed wyrażeniem zgody. Finansowanie pokrywa jedynie rzeczywiste koszty przygotowania natywnego. Przygotowanie nie podlega zwrotowi. Pozostałe zezwolenia mogą finansować ładunek z rynku skupionego na odkrytym obszarze lub graniczącego z nim; jedynie wymierzone wpływy ze sprzedaży mogą przynieść zwrot."
 bfl_commenda_opportunity_consent: "Sprawdź ponownie ten nazwany ładunek i swój organ finansujący na żywo. Wyślij ofertę, korzystając z aktualnych Warunków; żadne pieniądze nie zostaną przesunięte, dopóki operator nie wyrazi zgody."
 bfl_commenda_opportunity_later: "Rozważ później"
 bfl_commenda_opportunity_propose: "Wyślij te warunki do operatora"
 bfl_commenda_opportunity_review: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_op_country').GetCountry.GetName] · 10 [ROOT.GetCountry.MakeScope.GetVariable('bfl_op_good').Goods.GetNameWithNoTooltip]\n[ROOT.GetCountry.MakeScope.GetVariable('bfl_op_from').GetMarket.GetName] → [ROOT.GetCountry.MakeScope.GetVariable('bfl_op_to').GetMarket.GetName]\nSzacunkowy koszt bankowy: [ROOT.GetCountry.MakeScope.GetVariable('bfl_op_cost').GetValue|2]@gold!\nOrientacyjna nadwyżka banku: +[ROOT.GetCountry.MakeScope.GetVariable('bfl_op_surplus').GetValue|2]@gold!\n\nAktualne notowania rynkowe dotyczące dwumiesięcznej operacji cargo; nadwyżka nie obejmuje kapitału odzyskanego. Ceny i dostęp mogą ulec zmianie. Kapitał i zyski są zagrożone. Tylko rzeczywista sprzedaż tego ładunku opłaca umowę. Operator musi zaakceptować. Możliwości odświeżają się co miesiąc i są ponownie sprawdzane przed wysłaniem oferty."
 bfl_commenda_tip: "#T Pochwała#!\nZaangażuj kapitał w podróż lub przedsięwzięcie handlowe w zamian za określony udział w zysku. Wymaga badań Commenda, inwestycji zagranicznych i wieku Discovery lub nowszego. Natywne wykonanie projektu jest niedostępne w tej kompilacji."
 bfl_commercial_bill: "Projekt ustawy komercyjnej"
 bfl_commercial_bills: "Rachunki komercyjne"
 bfl_commercial_bills_desc: "Przenoszenie monet pomiędzy centrami handlowymi jest kosztowne i niebezpieczne. Pisemne weksle pozwalają akceptantom regulować zobowiązania za pośrednictwem zaufanych domów bankowych, czyniąc z reputacji emitenta instrument handlu."
 bfl_commodity_forward: "Forward towarowy"
 bfl_commodity_forward_tip: "#T Towar do przodu#!\nUzgodnij finansowaną przyszłą dostawę towarów. Wymaga badań w zakresie forwardów towarowych, finansów handlowych i epoki absolutyzmu lub nowszej. Fizyczna dostawa i rozliczenie są niedostępne w tej kompilacji."
 bfl_commodity_forwards: "Forwardy towarowe"
 bfl_commodity_forwards_desc: "Zamówienie ze zbiorów, wysyłki lub warsztatu może zostać sprzedane przed dostawą. Umowy ustalające przyszłą cenę pomagają kupcom uporządkować swoje sprawy pomimo niepewności odległych rynków i zmieniających się pór roku."
 bfl_commodity_inventory: "Inwentarz towarów"
 bfl_commodity_inventory_tip: "#T Inwentarz towarów#!\nTowary finansowe przeznaczone do handlu. Wymaga badań w zakresie inwestycji towarowych, finansów handlowych i wieku Discovery lub nowszego. Zakup, przechowywanie i dostawa towarów fizycznych są niedostępne w tej wersji."
 bfl_commodity_investments: "Inwestycje towarowe"
 bfl_commodity_investments_desc: "Bankierzy finansujący handel mogą również samodzielnie przechowywać towary. Zboże, wełna i inne towary stają się inwestycjami, których wartość zależy od przechowywania, transportu i zmieniających się potrzeb odległych rynków."
 bfl_companies_empty: "Brak firm operacyjnych pod Twoją kontrolą."
 bfl_company_crew: "Przeniesienie 250 marynarze do towarzystwa"
 bfl_company_crew_desc: "Zarządzaj natywną firmą, którą aktualnie kontrolujesz. Kapitał własny nie jest uwzględniony w przychodach operacyjnych."
 bfl_company_crew_tip: "Zarządzaj natywną firmą, którą aktualnie kontrolujesz. Wkłady kapitałowe stanowią finansowanie. Dystrybucje spółki wykorzystują zatrzymane zyski handlowe po kosztach rodzimych, poniesionych stratach, rezerwach dłużnych i buforach gotówkowych. Władca polityczny i właściciel finansowy to dwie odrębne sprawy."
 bfl_company_equity: "Kapitał Spółki"
 bfl_company_equity_desc: "Duże przedsiębiorstwa handlowe wymagają fortun, które niewielu kupców jest w stanie zapewnić samodzielnie. Podział własności pomiędzy inwestorów umożliwia spółce gromadzenie trwałego kapitału przy jednoczesnym podziale ryzyka i korzyści związanych ze swoimi przedsięwzięciami."
 bfl_company_equity_tip: "#T Kapitał własny spółki#!\nSubskrybuj kapitał na udział własnościowy w uznanej spółce. Wymaga badań kapitału spółki, inwestycji zagranicznych i epoki reformacji lub później. Emisja natywnych firm i rozliczenia posiadaczy są niedostępne w tej kompilacji."
 bfl_company_expedition: "Firma: przygotuj natywną eksplorację"
 bfl_company_expedition_desc: "Skorzystaj ze skarbca firmy, żeglarzy i odkrywców, aby przygotować eksplorację morza w placówce firmowej. Obowiązuje natywne przygotowanie i postęp. Discovery nie generuje zysków pieniężnych ani inwestycyjnych."
 bfl_company_expedition_tip: "Wymaga mandatu do handlu i eksploracji, tworzenia map, uprawnionego odkrywcy, żeglarzy i dostępnego budżetu przedsięwzięcia. Obowiązuje natywny czas przygotowania."
 bfl_company_exploration_capacity: "Założenie firmy eksploracyjnej"
 bfl_company_exploration_capacity_desc: "Pojemność dla 500 marynarzy, gdy upoważniony jest mandat poszukiwawczy. Marynarze muszą pochodzić z firmy lub w ramach transferu środków od jej kontrolera politycznego."
 bfl_company_explore: "Zadania firmy: handel i eksploracja"
 bfl_company_explore_desc: "Zarządzaj natywną firmą, którą aktualnie kontrolujesz. Kapitał własny nie jest uwzględniony w przychodach operacyjnych."
 bfl_company_explore_tip: "Zarządzaj natywną firmą, którą aktualnie kontrolujesz. Wkłady kapitałowe stanowią finansowanie. Dystrybucje spółki wykorzystują zatrzymane zyski handlowe po kosztach rodzimych, poniesionych stratach, rezerwach dłużnych i buforach gotówkowych. Władca polityczny i właściciel finansowy to dwie odrębne sprawy."
 bfl_company_fund: "Przyczynić się 100 złoto do kapitału spółki"
 bfl_company_fund_desc: "Zarządzaj natywną firmą, którą aktualnie kontrolujesz. Kapitał własny nie jest uwzględniony w przychodach operacyjnych."
 bfl_company_fund_tip: "Zarządzaj natywną firmą, którą aktualnie kontrolujesz. Wkłady kapitałowe stanowią finansowanie. Dystrybucje spółki wykorzystują zatrzymane zyski handlowe po kosztach rodzimych, poniesionych stratach, rezerwach dłużnych i buforach gotówkowych. Władca polityczny i właściciel finansowy to dwie odrębne sprawy."
 bfl_company_list_equity: "Zezwól na notowanie akcji spółki"
 bfl_company_list_equity_desc: "Autoryzuj płatne subskrypcje podstawowe NAV i handel wtórny. Przejęcia banków wymagają inwestycji zagranicznych, badań kapitału spółki i zakończonej wymiany na transakcje wtórne. Zwierzchnictwo polityczne pozostaje niezmienione."
 bfl_company_list_equity_tip: "Kontroler polityczny na żywo zezwala na udział w rynku. Nie przyznaje się środków pieniężnych ani jednostek."
 bfl_company_overview_note: "Pieniądze firmowe należą do firmy. Credit Management zajmuje się handlem i poszukiwaniami. Dywidendy właściciela obejmują zyski kapitałowe po uwzględnieniu rezerw; nowy kapitał i odkrycia są wykluczone."
 bfl_company_overview_subtitle: "Rachunki firmowe · ostatnie rozliczenie"
 bfl_company_overview_title: "[Country.GetName]"
 bfl_company_panel: "Spółki operacyjne"
 bfl_company_retain: "Mandat firmy: wstrzymanie nowych operacji"
 bfl_company_retain_desc: "Zarządzaj natywną firmą, którą aktualnie kontrolujesz. Kapitał własny nie jest uwzględniony w przychodach operacyjnych."
 bfl_company_retain_tip: "Zarządzaj natywną firmą, którą aktualnie kontrolujesz. Wkłady kapitałowe stanowią finansowanie. Dystrybucje spółki wykorzystują zatrzymane zyski handlowe po kosztach rodzimych, poniesionych stratach, rezerwach dłużnych i buforach gotówkowych. Władca polityczny i właściciel finansowy to dwie odrębne sprawy."
 bfl_company_route: "Firma: otwórz rodzimy szlak handlowy"
 bfl_company_route_desc: "Otwórz jedną natywną trasę należącą do firmy, używając 0.1 pojemność handlową. Wymaga mandatu handlowego, dostępnego budżetu operacyjnego, dostępu do rynku rodzimego, nadwyżek i mocy produkcyjnych. Maksymalnie jedna wyznaczona trasa na firmę miesięcznie. Natywna sztuczna inteligencja zachowuje swoje własne zachowanie handlowe."
 bfl_company_route_tip: "Wybierz firmę, rynek źródłowy, rynek docelowy, rynek handlowy i towary. Natywne koszty handlu pobierane są przez silnik."
 bfl_company_select: "Wybierz firmę obsługującą"
 bfl_company_select_desc: "Sprawdź rodzimą firmę znajdującą się pod twoją obecną kontrolą polityczną."
 bfl_company_select_tip: "Sprawdź kontrolowaną przez siebie firmę."
 bfl_company_strategy_construction: "Reinwestuj rezerwy firmy w rodzimy instrument handlowy"
 bfl_company_trade: "Zakres działalności firmy: handel"
 bfl_company_trade_desc: "Zarządzaj natywną firmą, którą aktualnie kontrolujesz. Kapitał własny nie jest uwzględniony w przychodach operacyjnych."
 bfl_company_trade_tip: "Zarządzaj natywną firmą, którą aktualnie kontrolujesz. Wkłady kapitałowe stanowią finansowanie. Dystrybucje spółki wykorzystują zatrzymane zyski handlowe po kosztach rodzimych, poniesionych stratach, rezerwach dłużnych i buforach gotówkowych. Władca polityczny i właściciel finansowy to dwie odrębne sprawy."
 bfl_corporate_credit: "Kredyt korporacyjny"
 bfl_corporate_credit_desc: "W miarę jak przedsiębiorstwa komercyjne wyrastają z jednego rejsu lub sezonu, ich zapotrzebowanie na kredyt staje się coraz bardziej trwałe. Domy bankowe uczą się oceniać zasoby i perspektywy przedsiębiorstwa, a także sytuację poszczególnych jego kupców."
 bfl_corporate_credit_tip: "#T Kredyt korporacyjny#!\nPożycz uznanej firmie handlowej. Wymaga badań nad kredytem korporacyjnym, finansami handlowymi i wiekiem reformacji lub nowszym. W tej kompilacji nie jest dostępna nowa natywna realizacja pożyczek firmowych."
 bfl_cost_accounts: "Konta depozytowe: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_operating_accounts_count')|0] × 0.05"
 bfl_cost_asset_types: "Klasy aktywów niepieniężnych: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_operating_asset_types_count')|0] × 0.25"
 bfl_cost_base: "Administracja bazą"
 bfl_cost_branches: "Oddziały: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_operating_branches_count')|0] × 0.50"
 bfl_cost_contracts: "Niestandardowe umowy finansowe: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_operating_contracts_count')|0] × 0.10"
 bfl_cost_current: "Aktualny koszt miesięczny: #R [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_operating_expense')|2]@gold!#!"
 bfl_cost_payment_detail: "Koszty rosną wraz ze złożonością, a nie wartością aktywów. Opłata raz w miesiącu powyżej rezerw chronionych; niezapłacone wydatki ograniczają dywidendy. Odsetki od depozytów i wydatki rodzime są odrębne. Redukcje sumują się; sumę zaokrągla się do centów."
 bfl_cost_reduction_administration: "Usprawniona administracja"
