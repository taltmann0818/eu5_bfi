 bfl_accept_money_claims.desc: "Dobrowolnie przyjmuj lub przestań akceptować w pełni opłacane rachunki i banknoty oferowane po cenie nominalnej poprzez interakcje modów. Transfer nadal wymaga posiadania dostępnego skarbca. Zaakceptowane roszczenia pozostają możliwe do zrealizowania po zamknięciu akceptacji. Płatności natywne w dalszym ciągu korzystają ze złota."
 bfl_accept_money_claims.title: "Przełącz akceptację roszczeń o płatność bankową"
 bfl_accounts_explanation: "Rodzimym skarbem jest gotówka. Depozyty i weksle są zobowiązaniami. Udzielenie pożyczki powoduje wymianę gotówki na aktywa; kapitał, subskrypcje i emisja nie są zyskiem."
 bfl_activity_title: "Dochód netto"
 bfl_activity_title_tip: "Obserwacje kuponów rodzimych klasyfikują natywny budżet netto; nigdy nie przesuwają złota dwa razy. Rozliczone wpływy z natywnych wypłat uwalniają rzeczywisty koszt nabycia przed ujęciem zysku lub straty. Dystrybucje firmowe i wpływy finansowane na zamówienie trafiają do osobnych koszyków. Kwota główna, depozyty i subskrypcje są wyłączone z zysków."
 bfl_administer_estates: "Zarządzaj odziedziczonymi majątkami finansowymi"
 bfl_administer_estates.desc: "Przegląd oddzielnie posiadanych środków pieniężnych i zobowiązań zniszczonej instytucji. Organ powierniczy nigdy nie czyni swoich środków pieniężnych częścią skarbu państwa."
 bfl_administer_estates.title: "Zarządzaj odziedziczonymi majątkami finansowymi"
 bfl_administer_estates_desc: "Przegląd oddzielnie posiadanych środków pieniężnych i zobowiązań zniszczonej instytucji. Organ powierniczy nigdy nie czyni swoich środków pieniężnych częścią skarbu państwa."
 bfl_advanced_clearing: "Zaawansowane rozliczanie"
 bfl_advanced_clearing_desc: "Domy bankowe, które zawdzięczają sobie wiele płatności, nie muszą osobno regulować każdego zobowiązania w monecie. Konta rozliczeniowe uzgadniają swoje roszczenia i przekazują jedynie pozostałe saldo, zmniejszając kwotę potrzebną do utrzymania handlu."
 bfl_advanced_tip: "Badania odblokowują mandat. Bank musi także spełniać swoje wymogi specjalizacyjne, płynnościowe i operacyjne. Niedostępne wykonanie pozostaje wyłączone."
 bfl_ai_equity_offering: "Dopuść bank i otwórz ofertę płatnego kapitału"
 bfl_ai_equity_offering_desc: "Zarządzanie AI może przyznać swój rzeczywisty bank i autoryzować płatne subskrypcje podstawowe po rozdaniu akcji i zakończonej wymianie. Przez przyjęcie nie powstają żadne środki pieniężne ani akcje."
 bfl_ai_equity_purchase: "Rozważ inwestycję finansowaną na giełdzie"
 bfl_ai_equity_purchase_desc: "Zakup AI wykorzystuje te same badania na żywo, budynki, uprawnienia, pojemność i dokładne sprawdzenie wyceny, co gracz. Miesięczny przegląd możliwości, obejmujący co najmniej 500 złoto w gotówce i nadwyżki kapitału. Żadnych zapytań ponadrynkowych."
 bfl_ai_exchange_priority: "Nadaj priorytet dostępowi do giełdy"
 bfl_annual_dividends: "Roczna stopa dywidendy"
