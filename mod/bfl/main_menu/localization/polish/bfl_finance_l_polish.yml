 bfl_transfer_bank_bill: "Sprzedaj weksel bankowy po cenie nominalnej"
 bfl_transfer_bank_bill_act: "$bfl_transfer_bank_bill$"
 bfl_transfer_bank_bill_command: "$bfl_transfer_bank_bill$"
 bfl_transfer_bank_bill_command_desc: "$bfl_transfer_bank_bill_desc$"
 bfl_transfer_bank_bill_desc: "Wybierz emitenta i beneficjenta akceptującego. Pierwszy kwalifikujący się 100-złote transfery roszczeń dla 100 złoto wypłacone obecnemu posiadaczowi. Zamkniętego zabezpieczenia nie można przenieść. Notatki wymagają badań akceptacji Rewolucji. Wszystkie kontrole finansowania, własności i oddziałów kapitałowych powtarzają się przy realizacji."
 bfl_transfer_bank_bill_effect_text: "$bfl_transfer_bank_bill$"
 bfl_transfer_bank_bill_effect_text_past: "$bfl_transfer_bank_bill$"
 bfl_transfer_bank_bill_tip: "Wybierz wystawcę i akceptującego kupującego. Przenieś jednego niezaprzysiężonego 100- roszczenie o złoto na poziomie nominalnym; wpływy trafiają do obecnego posiadacza."
