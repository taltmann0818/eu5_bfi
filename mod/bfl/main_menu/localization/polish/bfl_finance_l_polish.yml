 bfl_credit_partial: "Zamiast tego spłacaj 25% tego roszczenia, łącznie z pozostałymi odsetkami natywnymi"
 bfl_credit_refinance: "Zamiast tego załatw to roszczenie i zrefinansowaj jego kwotę główną 60 miesiące"
