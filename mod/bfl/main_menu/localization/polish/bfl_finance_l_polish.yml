 bfl_bond_secured_accept_tip: "Zaakceptuj podaną obniżkę wraz z wyłącznym dwuletnim zobowiązaniem dotyczącym przychodów i koncesją na ochronę handlu. Rzeczywista egzekucja pozostaje ograniczona dostępną gotówką emitenta."
 bfl_bond_summary_tip: "Kapitał, odsetki należne co miesiąc i miejsce na nową pożyczkę."
 bfl_bond_underwriting: "Ubezpieczenie obligacji"
 bfl_bond_underwriting_tip: "#T Ubezpieczenie obligacji#!\nTwój bank czarterowy płaci rzeczywistą gotówkę za niestandardową obligację skarbową. Obie specjalizacje mogą gwarantować. Stałe kupony roczne wypłacane są co miesiąc; aktualny posiadacz otrzymuje wartość nominalną w momencie umorzenia. Emisja wymaga płynności banku, kapitału i zdolności suwerennej."
 bfl_bond_unpaid: "Niezapłacone kupony"
 bfl_bond_workout_accept: "Zaakceptuj restrukturyzację obligacji"
 bfl_bond_workout_desc: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_bond_workout_issuer').GetCountry.GetName] prosi Ciebie, obecnego posiadacza, o zrzeczenie się 20% kapitału i niezapłaconych kuponów tej obligacji oraz obniżyć jej kupon roczny o jeden punkt procentowy, przy czym: 1% piętro. Odrzucenie powoduje zachowanie wszystkich warunków. Propozycja wygasa w tym miesiącu; płatność, przelew lub inna zmiana powoduje jej nieważność. Zwykła akceptacja nie zapewnia żadnego nowego zabezpieczenia. Tam, gdzie jest to oferowane, zabezpieczona akceptacja obejmuje dwuletnią koncesję na ochronę handlu i wyłączne zastawy na kwotę do 10% miesięcznego dochodu z tytułu niezapłaconych kuponów. Egzekucja wykorzystuje wyłącznie dostępne złoto skarbowe, przed innymi kuponami obligacji niestandardowych; nie tworzy żadnej gwarancji ani płatności głównej."
 bfl_bond_workout_secured: "Zaakceptuj z dwuletnią koncesją handlową i zastawem dochodów"
 bfl_bond_workout_title: "Propozycja restrukturyzacji obligacji"
 bfl_bonds_short: "Obligacje państwowe"
 bfl_bonds_short_tip: "Pożycz w swoim banku lub przejrzyj istniejące obligacje."
 bfl_borrow_amount: "Pożycz z banku"
 bfl_borrow_amount_desc: "Wybierz kwotę główną nowej obligacji skarbowej. Bank płaci państwu i przechowuje obligacje. Odsetki płatne są miesięcznie. Po potwierdzeniu sprawdzane są środki pieniężne, kapitał, zdolność zadłużeniowa i wspólny limit miesięczny."
 bfl_borrow_amount_tip: "Wybierz, ile chcesz pożyczyć. Dostępne teraz: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bfl_bond_draw_max')|0]@gold!. Miesięczny limit zależy od dochodu państwa. Każda sfinansowana emisja tworzy jedną obligację."
 bfl_branch_construction: "Utworzenie oddziału banku kapitałowego"
 bfl_branch_required: "Nowa suwerenna działalność wymaga ukończenia Oddziału Banku w obecnej stolicy. Działalność międzybankowa jest zwolniona; istniejące roszczenia pozostają wymagalne."
 bfl_browse_bond_issuers: "Przeglądaj emitentów i holdingi"
 bfl_browse_bond_issuers_desc: "Wybierz emitenta, aby sprawdzić zaległe obligacje i oferty, w tym roszczenia Twojego banku."
 bfl_browse_bond_issuers_tip: "Wybierz emitenta na żywo z zaległymi obligacjami niestandardowymi. W ten sposób niczego nie kupujesz ani nie sprzedajesz."
 bfl_browse_goods: "Oferty towarów i roszczenia z tytułu opieki"
 bfl_browse_goods_act: "$bfl_browse_goods$"
 bfl_browse_goods_desc: "Zapoznaj się z ofertami opieki fizycznej, istniejącymi roszczeniami lub dobrowolną umową o dostępie Izby Celnej. Wybór kraju nie powoduje przeniesienia pieniędzy."
 bfl_browse_goods_effect_text: "$bfl_browse_goods$"
 bfl_browse_goods_effect_text_past: "$bfl_browse_goods$"
 bfl_burghers_estate_workout_mandate: "Nakaz treningu majątku"
 bfl_burghers_estate_workout_mandate_desc: "Posiadłość ta wyraźnie upoważnia swój rząd do dokonywania w jej imieniu przeglądu dobrowolnych wypłat depozytów bankowych. Każda propozycja nadal wymaga osobnej akceptacji. Odwołanie tego przywileju powoduje unieważnienie oczekujących warunków majątkowych. Płatności windykacyjne nadal trafiają do portfela majątku."
 bfl_buy_bill: "Rachunek finansowany · 100 złoto"
 bfl_buy_bill_tip: "#T Finansowany rachunek płatniczy#!\nPrzeniesienie 100 stan złota do banku w celu uzyskania rachunku finansowanego. Rachunek jest rejestrowany jako zobowiązanie do zapłaty, a nie zysk banku lub niezabezpieczona pożyczka. Wymaga badania rachunków komercyjnych, miejsca na stole kontraktowym i banku operacyjnego akceptującego tę działalność."
 bfl_buy_capital: "Subskrybuj kapitał · 100 złoto"
 bfl_buy_capital_tip: "#T Subskrybuj kapitał banku#!\nPrzeniesienie 100 państwowe złoto na zakup nowych jednostek własności banków. Jednostki wyceniane są na podstawie dodatniego kapitału własnego banku na istniejącą jednostkę. Zwiększa to gotówkę bankową i kapitał wpłacony, a nie zysk. Odblokowane dzięki natywnym badaniom bankowym, przestrzeni tabeli kapitałowej i bankowi operacyjnemu akceptującemu ten biznes. Kapitał jest narażony na straty i nie można go wycofać w formie depozytu."
 bfl_buy_confirm_desc: "Zakup [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_quantity').GetValue|3] udziały [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_issuer').GetCountry.GetName] dla [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_total').GetValue|2]@gold!. Są to istniejące akcje z zapasów animatora rynku. Emitent nie otrzymuje finansowania, a wyemitowane akcje nie ulegają zmianie. Kwotowana cena, dostęp do rynku na żywo, dostępne jednostki, zabezpieczone środki pieniężne i limit koncentracji są sprawdzane ponownie w momencie akceptacji. Rozliczenie pochłania jednego dyplomatę i rozpoczyna miesięczny okres odnowienia kupna/sprzedaży tego emitenta."
 bfl_buy_confirm_title: "Potwierdź zakup akcji"
 bfl_buy_secondary_confirm_desc: "Kup [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_quantity').GetValue|3] istniejące udziały [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_issuer').GetCountry.GetName] od [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_seller').GetCountry.GetName] dla [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_total').GetValue|2]@gold!. Obecny sprzedawca otrzymuje płatność. Emitent nie otrzymuje finansowania, a wyemitowane akcje nie ulegają zmianie. Dostępność, dostęp, chronione środki i rewizja tej oferty są sprawdzane ponownie po akceptacji. Rozliczenie pochłania jednego dyplomatę i rozpoczyna miesięczny okres odnowienia kupna/sprzedaży tego emitenta."
 bfl_buy_selected_bond: "Kup istniejące roszczenie"
 bfl_buy_selected_bond_tip: "Zapłać podaną cenę obecnemu sprzedawcy. Emitent nie otrzymuje żadnych nowych pieniędzy. Egzekucja polega na ponownym sprawdzeniu własności, wygaśnięcia, wygenerowania, obu wymian, zaległości i środków pieniężnych."
 bfl_buy_shares: "Kup akcje"
 bfl_buy_shares_desc: "Wybierz bank lub firmę, ustal liczbę akcji, a następnie sprawdź całość. Kup przenosi istniejące akcje z oferty sprzedaży lub zapasów animatora rynku. Skorzystaj z oddzielnej akcji subskrypcji kapitału, aby sfinansować nową emisję."
 bfl_buy_shares_tip: "Wybierz bank lub firmę, ustal liczbę akcji, a następnie sprawdź całość. Kup przenosi istniejące akcje z oferty sprzedaży lub zapasów animatora rynku. Skorzystaj z oddzielnej akcji subskrypcji kapitału, aby sfinansować nową emisję.\nWymaga zakończonej wymiany, handlu akcjami i co najmniej jednego dyplomaty. Każda udana transakcja pochłania jednego dyplomatę i rozpoczyna miesięczny okres odnowienia dla tego emitenta. Dostępni dyplomaci: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bfl_available_trade_diplomats')|2]. Zamówienia muszą mieć wartość pieniężną min 0.01 złoto."
 bfl_buy_sovereign_bond: "Kup oferowaną obligację skarbową"
 bfl_buy_sovereign_bond_act: "$bfl_buy_sovereign_bond$"
 bfl_buy_sovereign_bond_desc: "Kup istniejącą obligację skarbową od jej obecnego posiadacza. Wymaga posiadania ukończonego budynku Giełdy Papierów Wartościowych."
 bfl_buy_sovereign_bond_effect_text: "$bfl_buy_sovereign_bond$"
 bfl_buy_sovereign_bond_effect_text_past: "$bfl_buy_sovereign_bond$"
 bfl_buy_sovereign_bond_tip: "Wybierz wystawcę oferty otwartej. Płatność trafia do istniejącego posiadacza; emitent nie uzyskuje żadnych nowych wpływów. Całe roszczenie zmienia właściciela ze stałym kuponem rocznym i kapitałem nienaruszonym."
 bfl_buy_state_confirm_desc: "Odkup [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_quantity').GetValue|3] istniejące udziały [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_issuer').GetCountry.GetName] z zapasów animatora rynku dla [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_total').GetValue|2]@gold!, opłacane ze skarbca twojego kraju. Akcje te wracają do Twojego pakietu skarbowego. Bank nie otrzymuje finansowania, a wyemitowane akcje nie ulegają zmianie. Dostępne akcje dealerów, aktualne notowania rynkowe, uprawnienia do czarteru na żywo i środki pieniężne ze skarbca są sprawdzane ponownie. Osada pochłania jednego dyplomatę i rozpoczyna miesięczny okres oczekiwania na kupno/sprzedaż w tym banku."
 bfl_cancel: "Anuluj"
 bfl_cancel_selected_bond_offer: "Anuluj aukcję"
 bfl_cancel_selected_bond_offer_tip: "Wycofaj ofertę posiadaną przez Ciebie lub Twój licencjonowany bank. Dług i kupon pozostają niezmienione."
 bfl_capital_button: "Subskrybuj kapitał · 100 złoto"
 bfl_capital_heading: "Kapitał banku"
 bfl_cash: "Gotówka"
 bfl_cash_detail_title: "Gotówka z [Country.GetName]"
 bfl_cash_tip: "#T Kasa skarbowa#!\nZłoto aktualnie posiadane przez bank.\n\nRazem gotówka: [Country.GetFixedPointCurrencyValue('gold')|2]@gold!\nChroniona gotówka: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_protected_cash')|2]@gold!\nDostępna gotówka: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_free_cash')|2]@gold!\n\nChronione rezerwy gotówkowe 25% zobowiązań pozostałych po wypłatach z kolejki, pełna kolejka wypłat, a 25 bufor operacyjny w złocie i zaangażowana gotówka. Dostępna gotówka to gotówka skarbowa pomniejszona o rezerwę, przy czym minimalna wartość wynosi zero. Gotówka chroniona stanowi rezerwę obowiązkową; może przekroczyć faktycznie posiadaną gotówkę."
 bfl_chart_debt_01: "Dług: [Country.MakeScope.GetVariable('bfl_history_debt_01').GetValue|2]@gold! · miesiąc rozliczeniowy [Country.MakeScope.GetVariable('bfl_history_period_01').GetValue|0]"
 bfl_chart_debt_02: "Dług: [Country.MakeScope.GetVariable('bfl_history_debt_02').GetValue|2]@gold! · miesiąc rozliczeniowy [Country.MakeScope.GetVariable('bfl_history_period_02').GetValue|0]"
