 bfl_offer_commenda: "Sfinansuj operację cargo"
 bfl_offer_commenda_act: "Sfinansuj operację cargo"
 bfl_offer_commenda_desc: "Zaoferuj kapitał podwyższonego ryzyka na warunkach zaproponowanych przez bank. Akceptacja kupuje wskazany ładunek po jego rodzimym koszcie; niewykorzystane uprawnienia pozostają w banku. Kapitał i zyski nigdy nie są gwarantowane."
 bfl_offer_commenda_effect_text: "Sfinansuj operację cargo"
 bfl_offer_commenda_effect_text_past: "Sfinansuj operację cargo"
 bfl_offer_commenda_tip: "Discovery lub później, inwestycje zagraniczne i badania Commenda. Wybierz operatora, rynek źródłowy, miejsce docelowe i towary dla ładunku składającego się z dziesięciu jednostek. Akceptacja ponownie sprawdza Twoje uprawnienia, wolną gotówkę, kapitał i możliwości. Jedna aktywna umowa na operatora; do ośmiu na bank."
 bfl_offer_credit: "Zaoferuj pożyczkę kapitałową"
 bfl_offer_credit_act: "$bfl_offer_credit$"
 bfl_offer_credit_desc: "Kredytobiorca otrzymuje wyraźną ofertę. Żadna gotówka ani warunki nie ulegają zmianie do czasu akceptacji; wykonanie ponownie sprawdza autorytet, profil, badania i fundusze na żywo."
 bfl_offer_credit_effect_text: "$bfl_offer_credit$"
 bfl_offer_credit_effect_text_past: "$bfl_offer_credit$"
 bfl_offer_credit_tip: "Wybierz suwerenną lub kwalifikującą się firmę rodzimą. Obydwa profile pożyczają władcom; kredyt firmowy wymaga Merchant Finance, Reformation i Corporate Credit. Redukcja długów wymaga także renesansowej restrukturyzacji zadłużenia."
 bfl_offer_goods_transfer: "Zaproponuj przeniesienie paragonu magazynowego"
 bfl_offer_goods_transfer_act: "$bfl_offer_goods_transfer$"
 bfl_offer_goods_transfer_desc: "Zaoferuj paragon wybrany ostatnio w Oferty towarów i roszczenia o opiekę. Odbiorca sprawdza cenę i ilość przed zapłaceniem obecnemu posiadaczowi."
 bfl_offer_goods_transfer_effect_text: "$bfl_offer_goods_transfer$"
 bfl_offer_goods_transfer_effect_text_past: "$bfl_offer_goods_transfer$"
 bfl_offer_held_sovereign_bond: "Zaoferuj posiadaną obligację skarbową"
 bfl_offer_held_sovereign_bond_act: "$bfl_offer_held_sovereign_bond$"
 bfl_offer_held_sovereign_bond_desc: "Wybierz emitenta i wymień jedną ze swoich obligacji skarbowych na stronie 98% wartości nominalnej. Wymaga posiadania ukończonego budynku Giełdy Papierów Wartościowych."
 bfl_offer_held_sovereign_bond_effect_text: "$bfl_offer_held_sovereign_bond$"
 bfl_offer_held_sovereign_bond_effect_text_past: "$bfl_offer_held_sovereign_bond$"
 bfl_offer_held_sovereign_bond_tip: "Wymień istniejącą obligację, którą posiadasz na trzy miesiące. Zatrzymujesz roszczenie do czasu zaakceptowania przez kupującego środków; kupony i wykup, a następnie podążaj za tym kupującym."
 bfl_offer_restructuring: "Zaproponuj umorzenie długów"
 bfl_offer_restructuring_act: "$bfl_offer_restructuring$"
 bfl_offer_restructuring_desc: "Kredytobiorca otrzymuje wyraźną ofertę. Żadna gotówka ani warunki nie ulegają zmianie do czasu akceptacji; wykonanie ponownie sprawdza autorytet, profil, badania i fundusze na żywo."
 bfl_offer_restructuring_effect_text: "$bfl_offer_restructuring$"
 bfl_offer_restructuring_effect_text_past: "$bfl_offer_restructuring$"
 bfl_offer_restructuring_tip: "Wybierz suwerenną lub kwalifikującą się firmę rodzimą. Obydwa profile pożyczają władcom; kredyt firmowy wymaga Merchant Finance, Reformation i Corporate Credit. Redukcja długów wymaga także renesansowej restrukturyzacji zadłużenia."
 bfl_offering_closed: "Zamknięte"
 bfl_offering_open: "Otwórz"
 bfl_operating_costs: "Miesięczne koszty operacyjne"
 bfl_operating_costs_tip: "Stała miesięczna skala kosztów z aktywnymi kontami depozytowymi, umowami, oddziałami i klasami aktywów. Reforma State Chartered Bank zmniejsza koszty o 5%, Bankowość wg 10%, Zaawansowane rozliczenie przez 15%i usprawnione administrowanie przez 10%. Niezapłacone koszty pozostają zobowiązaniami i dywidendami blokowymi."
 bfl_overview: "Rachunki i specjalizacja"
 bfl_overview_hint: "Aktywa: pierścień zewnętrzny = typ; pierścień wewnętrzny = kraje. Najedź kursorem, aby wyświetlić kolorowe zestawienia."
 bfl_payout_0: "Zachowaj zyski"
 bfl_payout_0_short: "Zachowaj"
 bfl_payout_0_tip: "Zatrzymaj cały kwalifikujący się zrealizowany zysk. Zgodnie z tą polityką nie jest wypłacana żadna nowa dywidenda; zatrzymany zysk wspiera płynność i kapitał własny."
 bfl_payout_25: "25% wypłata"
 bfl_payout_25_short: "25%"
 bfl_payout_25_tip: "Przydziel do 25% kwalifikowanego zrealizowanego zysku na dywidendę po stratach. Dostępna gotówka, zapas kapitału i udokumentowana własność nadal ograniczają płatności."
 bfl_payout_50: "50% wypłata"
 bfl_payout_50_short: "50%"
 bfl_payout_50_tip: "Przydziel do 50% kwalifikowanego zrealizowanego zysku na dywidendę po stratach. Dostępna gotówka, zapas kapitału i udokumentowana własność nadal ograniczają płatności."
 bfl_peasants_estate_workout_mandate: "Nakaz treningu majątku"
 bfl_peasants_estate_workout_mandate_desc: "Posiadłość ta wyraźnie upoważnia swój rząd do dokonywania w jej imieniu przeglądu dobrowolnych wypłat depozytów bankowych. Każda propozycja nadal wymaga osobnej akceptacji. Odwołanie tego przywileju powoduje unieważnienie oczekujących warunków majątkowych. Płatności windykacyjne nadal trafiają do portfela majątku."
 bfl_place_deposit_1: "Otwórz 100 depozyt złota na żądanie"
 bfl_place_deposit_1_act: "$bfl_place_deposit_1$"
 bfl_place_deposit_1_desc: "Niezależne banki wymagają opinii min +50 do Ciebie, aby otworzyć konto. Twój licencjonowany bank oferuje coś ekstra 1% odsetki roczne. Odsetki na żądanie są płacone co miesiąc, jeśli są finansowane; niezapłacone odsetki pozostają należne. Upadające relacje nigdy nie uniemożliwiają wycofania własnych dojrzałych roszczeń."
 bfl_place_deposit_1_effect_text: "$bfl_place_deposit_1$"
 bfl_place_deposit_1_effect_text_past: "$bfl_place_deposit_1$"
 bfl_place_deposit_2: "Otwórz 100 lokata terminowa w złocie"
 bfl_place_deposit_2_act: "$bfl_place_deposit_2$"
 bfl_place_deposit_2_desc: "Niezależne banki wymagają opinii min +50 do Ciebie, aby otworzyć konto. Twój licencjonowany bank oferuje coś ekstra 1% odsetki roczne. Odsetki na żądanie są płacone co miesiąc, jeśli są finansowane; niezapłacone odsetki pozostają należne. Upadające relacje nigdy nie uniemożliwiają wycofania własnych dojrzałych roszczeń."
