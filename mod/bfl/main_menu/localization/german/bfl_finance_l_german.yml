 bfl_estate_review_desc: "Nachlass: [ROOT.GetCountry.MakeScope.GetVariable('bfl_managed_estate').GetCountry.GetName]. Finanzlage [ROOT.GetCountry.MakeScope.GetVariable('bfl_estate_state_display').GetValue|0] (4 lösen, 5 geschlossen). Separates Bargeld: [ROOT.GetCountry.MakeScope.GetVariable('bfl_estate_cash_display').GetValue|2] Gold. Noch geschuldete Anzahlungen: [ROOT.GetCountry.MakeScope.GetVariable('bfl_estate_deposits_display').GetValue|2]. Noch geschuldete Empfängerentschädigung: [ROOT.GetCountry.MakeScope.GetVariable('bfl_estate_receiver_display').GetValue|2]. Gezahlte Kautionsrückzahlungen: [ROOT.GetCountry.MakeScope.GetVariable('bfl_estate_recovered_display').GetValue|2]. Für die Wartung werden tatsächliche Verkaufserlöse und Rückzahlungen verwendet. Nicht verfügbare Ansprüche bleiben erfasst; Die Schließung erfordert die Abwicklung aller Verbindlichkeiten und nicht zahlungswirksamen Positionen."
