 bfl_bond_secured_accept_tip: "Akzeptieren Sie die angegebene Reduzierung zusammen mit der exklusiven zweijährigen Umsatzzusage und dem Handelsschutzzugeständnis. Die tatsächliche Durchsetzung bleibt durch das verfügbare Bargeld des Emittenten begrenzt."
 bfl_bond_summary_tip: "Kapital, monatlich geschuldete Zinsen und Spielraum für neue Kredite."
 bfl_bond_underwriting: "Anleihen-Underwriting"
 bfl_bond_underwriting_tip: "#T Anleihen-Underwriting#!\nIhre konzessionierte Bank zahlt den tatsächlichen Betrag für eine maßgeschneiderte Staatsanleihe. Beide Spezialisierungen können zeichnen. Feste jährliche Coupons werden monatlich ausgezahlt; Der aktuelle Inhaber erhält bei der Rücknahme den Nennwert. Für die Emission sind Bankliquidität, Kapital und staatliche Kapazitäten erforderlich."
 bfl_bond_unpaid: "Unbezahlte Gutscheine"
 bfl_bond_workout_accept: "Akzeptieren Sie die Umstrukturierung der Anleihe"
 bfl_bond_workout_desc: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_bond_workout_issuer').GetCountry.GetName] bittet Sie als derzeitigen Inhaber um einen Verzicht 20% des Nennbetrags und der nicht ausgezahlten Kupons dieser Anleihe und reduzieren den jährlichen Kupon um einen Prozentpunkt, mit a 1% Boden. Beim Ablehnen bleiben alle Bedingungen erhalten. Der Vorschlag läuft diesen Monat aus; Durch Zahlung, Überweisung oder sonstige Änderung wird es ungültig. Eine ordentliche Abnahme bietet keine neue Sicherheit. Sofern angeboten, beinhaltet die gesicherte Annahme eine zweijährige Handelsschutzkonzession und eine exklusive Verpfändung von bis zu 10% des monatlichen Einkommens für nicht bezahlte Coupons. Bei der Durchsetzung wird ausschließlich verfügbares Staatsgold vor anderen Coupons für kundenspezifische Anleihen verwendet. es entsteht keine Garantie oder Tilgungszahlung."
 bfl_bond_workout_secured: "Akzeptieren Sie es mit einer zweijährigen Handelskonzession und einer Umsatzzusage"
 bfl_bond_workout_title: "Vorschlag zur Umstrukturierung von Anleihen"
 bfl_bonds_short: "Staatsanleihen"
 bfl_bonds_short_tip: "Nehmen Sie einen Kredit bei Ihrer Bank auf oder überprüfen Sie bestehende Anleihen."
 bfl_borrow_amount: "Von der Bank leihen"
 bfl_borrow_amount_desc: "Wählen Sie den Kapitalbetrag einer neuen Staatsanleihe. Die Bank bezahlt den Staat und hält die Anleihe. Die Zinsen werden monatlich gezahlt. Bei der Bestätigung werden Barmittel, Kapital, Verschuldungskapazität und das gemeinsame Monatslimit überprüft."
 bfl_borrow_amount_tip: "Wählen Sie, wie viel Sie leihen möchten. Jetzt verfügbar: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bfl_bond_draw_max')|0]@gold!. Die monatliche Grenze richtet sich nach dem Staatseinkommen. Mit jeder finanzierten Emission entsteht eine Anleihe."
 bfl_branch_construction: "Errichten Sie eine Filiale einer Kapitalbank"
 bfl_branch_required: "Neue Staatsgeschäfte erfordern die Fertigstellung einer Bankfiliale dieser Bank in der aktuellen Hauptstadt. Bank-zu-Bank-Geschäfte sind ausgenommen; bestehende Forderungen bleiben geschuldet."
 bfl_browse_bond_issuers: "Durchsuchen Sie Emittenten und Bestände"
 bfl_browse_bond_issuers_desc: "Wählen Sie einen Emittenten aus, um ausstehende Anleihen und Angebote zu prüfen, einschließlich der Forderungen Ihrer Bank."
 bfl_browse_bond_issuers_tip: "Wählen Sie einen Live-Emittenten mit ausstehenden kundenspezifischen Anleihen aus. Dadurch wird nichts gekauft oder verkauft."
 bfl_browse_goods: "Warenangebote und Sorgerechtsansprüche"
 bfl_browse_goods_act: "$bfl_browse_goods$"
 bfl_browse_goods_desc: "Prüfen Sie Angebote zur physischen Verwahrung, bestehende Ansprüche oder eine freiwillige Vereinbarung über den Zugang zum Zollamt. Durch die Auswahl eines Landes wird kein Geld bewegt."
 bfl_browse_goods_effect_text: "$bfl_browse_goods$"
 bfl_browse_goods_effect_text_past: "$bfl_browse_goods$"
 bfl_burghers_estate_workout_mandate: "Mandat zur Nachlassabwicklung"
 bfl_burghers_estate_workout_mandate_desc: "Dieser Nachlass ermächtigt seine Regierung ausdrücklich, in seinem Namen freiwillige Bankeinlagenabwicklungen zu überprüfen. Jeder Vorschlag bedarf noch einer gesonderten Annahme. Durch den Widerruf dieses Privilegs werden ausstehende Nachlassbedingungen ungültig. Die Rückzahlungszahlungen werden weiterhin in den Nachlassbestand eingezahlt."
 bfl_buy_bill: "Rechnung über finanzierte Zahlungen · 100 Gold"
 bfl_buy_bill_tip: "#T Rechnung mit finanzierter Zahlung#!\nÜbertragen 100 Staatsgold an die Bank für eine gedeckte Zahlungsrechnung. Die Rechnung wird als Verbindlichkeit verbucht und nicht als Bankgewinn oder als ungesicherter Kredit. Erfordert Recherche zu Handelsrechnungen, Platz auf dem Vertragstisch und eine Bank, die dieses Geschäft akzeptiert."
 bfl_buy_capital: "Zeichnungskapital · 100 Gold"
 bfl_buy_capital_tip: "#T Bankkapital zeichnen#!\nÜbertragen 100 Staatsgold zum Erwerb neuer Bankbesitzanteile. Der Preis der Einheiten basiert auf dem positiven Bankeigenkapital pro bestehender Einheit. Dies erhöht die Barmittel und das eingezahlte Kapital der Bank und nicht den Gewinn. Freigeschaltet durch lokale Bankforschung, Kapitaltabellenraum und eine operative Bank, die dieses Geschäft akzeptiert. Das Kapital ist Verlusten ausgesetzt und kann nicht als Einlage abgehoben werden."
 bfl_buy_confirm_desc: "Kauf [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_quantity').GetValue|3] Anteile an [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_issuer').GetCountry.GetName] für [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_total').GetValue|2]@gold!. Hierbei handelt es sich um bestehende Aktien aus dem Market-Maker-Bestand. Der Emittent erhält keine Finanzierung und die ausgegebenen Aktien ändern sich nicht. Der notierte Preis, der Live-Marktzugang, die verfügbaren Einheiten, das geschützte Bargeld und das Konzentrationslimit werden bei der Annahme erneut überprüft. Die Abwicklung verbraucht einen Diplomaten und startet die einmonatige Kauf-/Verkaufs-Abklingzeit dieses Emittenten."
 bfl_buy_confirm_title: "Aktienkauf bestätigen"
 bfl_buy_secondary_confirm_desc: "Kaufen [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_quantity').GetValue|3] bestehende Aktien von [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_issuer').GetCountry.GetName] von [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_seller').GetCountry.GetName] für [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_total').GetValue|2]@gold!. Der aktuelle Verkäufer erhält die Zahlung. Der Emittent erhält keine Finanzierung und die ausgegebenen Aktien ändern sich nicht. Verfügbarkeit, Zugang, geschützte Mittel und die Überarbeitung dieses Angebots werden bei Annahme erneut geprüft. Die Abwicklung verbraucht einen Diplomaten und startet die einmonatige Kauf-/Verkaufs-Abklingzeit dieses Emittenten."
 bfl_buy_selected_bond: "Bestehenden Anspruch kaufen"
 bfl_buy_selected_bond_tip: "Zahlen Sie den angegebenen Preis an den aktuellen Verkäufer. Der Emittent erhält kein neues Geld. Bei der Ausführung werden Eigentum, Ablauf, Generation, beide Umtausche, Zahlungsrückstände und Bargeld erneut überprüft."
 bfl_buy_shares: "Aktien kaufen"
 bfl_buy_shares_desc: "Wählen Sie eine Bank oder ein Unternehmen aus, legen Sie eine Anteilsmenge fest und überprüfen Sie dann die Gesamtsumme. Beim Kauf werden vorhandene Aktien aus einem Verkaufsangebot oder Market-Maker-Bestand übertragen. Nutzen Sie die separate Kapitalzeichnungsaktion, um Neuemissionen zu finanzieren."
 bfl_buy_shares_tip: "Wählen Sie eine Bank oder ein Unternehmen aus, legen Sie eine Anteilsmenge fest und überprüfen Sie dann die Gesamtsumme. Beim Kauf werden vorhandene Aktien aus einem Verkaufsangebot oder Market-Maker-Bestand übertragen. Nutzen Sie die separate Kapitalzeichnungsaktion, um Neuemissionen zu finanzieren.\nErfordert einen abgeschlossenen Austausch, Aktienhandel und mindestens einen Diplomaten. Jeder erfolgreiche Handel verbraucht einen Diplomaten und startet eine einmonatige Abklingzeit für diesen Emittenten. Verfügbare Diplomaten: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bfl_available_trade_diplomats')|2]. Bestellungen müssen einen Barwert von mindestens haben 0.01 Gold."
 bfl_buy_sovereign_bond: "Kaufen Sie eine angebotene Staatsanleihe"
 bfl_buy_sovereign_bond_act: "$bfl_buy_sovereign_bond$"
 bfl_buy_sovereign_bond_desc: "Kaufen Sie eine bestehende Staatsanleihe von ihrem aktuellen Inhaber. Erfordert ein eigenes, fertiggestelltes Börsengebäude."
 bfl_buy_sovereign_bond_effect_text: "$bfl_buy_sovereign_bond$"
 bfl_buy_sovereign_bond_effect_text_past: "$bfl_buy_sovereign_bond$"
 bfl_buy_sovereign_bond_tip: "Wählen Sie den Emittenten eines offenen Angebots aus. Die Zahlung geht an den bestehenden Inhaber; Der Emittent erhält keinen neuen Erlös. Die gesamte Forderung wechselt den Besitzer, wobei der feste jährliche Kupon und das Kapital intakt bleiben."
 bfl_buy_state_confirm_desc: "Zurückkaufen [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_quantity').GetValue|3] bestehende Aktien von [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_issuer').GetCountry.GetName] aus Market-Maker-Inventar für [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_total').GetValue|2]@gold!, bezahlt aus der Staatskasse Ihres Landes. Diese Aktien fließen in Ihren eigenen Anteil zurück. Die Bank erhält keine Finanzierung und ausgegebene Aktien verändern sich nicht. Der verfügbare Händlerbestand, die aktuelle Marktnotierung, die Live-Charterberechtigung und die Kassenbestände werden erneut überprüft. Die Abwicklung verbraucht einen Diplomaten und startet die einmonatige Kauf-/Verkaufs-Abklingzeit dieser Bank."
 bfl_cancel: "Abbrechen"
 bfl_cancel_selected_bond_offer: "Eintrag stornieren"
 bfl_cancel_selected_bond_offer_tip: "Ziehen Sie ein Angebot zurück, das Ihnen oder Ihrer konzessionierten Bank gehört. Die Schulden und der Kupon bleiben unverändert."
 bfl_capital_button: "Zeichnungskapital · 100 Gold"
 bfl_capital_heading: "Bankkapital"
 bfl_cash: "Bargeld"
 bfl_cash_detail_title: "Bargeld von [Country.GetName]"
 bfl_cash_tip: "#T Bargeld aus der Staatskasse#!\nDerzeit von der Bank gehaltenes Gold.\n\nGesamtes Bargeld: [Country.GetFixedPointCurrencyValue('gold')|2]@gold!\nGeschütztes Bargeld: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_protected_cash')|2]@gold!\nVerfügbares Bargeld: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_free_cash')|2]@gold!\n\nGeschützte Barreserven 25% der Verbindlichkeiten, die nach Abhebungen in der Warteschlange verbleiben, die vollständige Abhebungswarteschlange, a 25 Gold-Betriebspuffer und zugesagtes Bargeld. Bei den verfügbaren Barmitteln handelt es sich um Barmittel der Staatskasse abzüglich dieser Reserve, mit einem Mindestbetrag von Null. Geschütztes Bargeld ist eine erforderliche Reserve; es kann die tatsächlich gehaltenen Barmittel übersteigen."
