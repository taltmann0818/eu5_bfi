 bfl_facility_0: "Anlage ausgeschaltet"
 bfl_facility_0_definition: "Aus: keine automatische Ausleihe. Sie können weiterhin manuell ausleihen."
 bfl_facility_0_short: "Aus"
 bfl_facility_0_tip: "Deaktivieren Sie das Dauerkreditmandat. Es wird keine geplante Bankfinanzierung beantragt. Bestehende Verpflichtungen bleiben zahlbar."
 bfl_facility_1: "Debt-First-Fazilität"
 bfl_facility_1_definition: "Kosten: Ausleihe bis zu 60% der prognostizierten Staatsausgaben jeden Monat, unabhängig vom Kassenbestand des Staates. Die Finanzierung endet bei der gemeinsamen monatlichen Obergrenze, der Schuldenkapazität sowie den Bargeld- und Kapitalgrenzen der Bank."
 bfl_facility_1_short: "Ausgaben"
 bfl_facility_1_tip: "Fordern Sie eine individuelle Anleihenfinanzierung an für 60% der prognostizierten monatlichen Ausgaben innerhalb eines gemeinsamen Plans 1,000 Gold-Monatslimit. Überspringen Sie Ziehungen, wenn das Staatsgeld erreicht ist 500 Gold oder es mangelt der Bank oder dem Emittenten an Kapazitäten."
 bfl_facility_2: "Pufferanlage"
 bfl_facility_2_definition: "Bargeldpuffer: Nehmen Sie genügend Kredite auf, um die prognostizierte Staatskasse zu erreichen 200 Dukaten. Die Finanzierung endet bei der gemeinsamen monatlichen Obergrenze, der Schuldenkapazität sowie den Bargeld- und Kapitalgrenzen der Bank."
 bfl_facility_2_short: "Bargeldpuffer"
 bfl_facility_2_tip: "Fordern Sie eine individuelle Anleihefinanzierung an 200 Staatsgold nach dem prognostizierten Saldo, innerhalb eines Shared 1,000 Gold-Monatslimit. Bei nicht finanzierten Anträgen entstehen weder Schulden noch Bargeld."
 bfl_facility_reason_1: "#O Überprüfen Sie Recherche, Filialzugang, Emittenteneinkommen und Couponkapazität.#!"
 bfl_facility_reason_2: "#O Geschütztes Bargeld führt zu unzureichenden liquiden Bankmitteln.#!"
 bfl_facility_reason_3: "#O Die neue Forderung würde den Kapitalspielraum der Bank überschreiten.#!"
 bfl_facility_reason_4: "#O Die kombinierten Staatsanleihen haben die Schuldenkapazität des Emittenten erreicht.#!"
 bfl_facility_reason_5: "#O Nicht eingezahlte Staatskupons blockieren die weitere Ausgabe.#!"
 bfl_facility_reason_6: "#O Der Staat hat diesen Monat bereits eine Anleihe ausgegeben.#!"
 bfl_facility_reason_7: "#O Alle Datensätze für Staatsanleihen sind belegt.#!"
 bfl_facility_tip: "In diesem Monat erhielten die Banken tatsächlich Bargeld aus der Emission von Zoll-Staatsanleihen. Die Finanzierung führt zu Schulden und ist vom Erwerbseinkommen ausgeschlossen."
 bfl_facility_title: "Monatliche Finanzierung"
 bfl_facility_title_tip: "#T Mandat zur Schuldenfazilität#!\nDie Bank finanziert maßgeschneiderte Staatsanleihen mit festen jährlichen Kupons. Aus stoppt geplante Probleme. Schulden erste Anfragen 60% der prognostizierten Ausgaben. Pufferziele 200 Staatsgold nach dem prognostizierten Monatssaldo. Beide bleiben stehen 500 Staatsgold.\n\nZuletzt angefragt: [Country.MakeScope.GetVariable('bfl_facility_requested').GetValue|2]@gold!\nZuletzt gefördert: [Country.MakeScope.GetVariable('bfl_facility_paid').GetValue|2]@gold!\n\nManuelle und automatische Ziehungen teilen sich a 1,000 Gold-Monatslimit. Geschützte Bankgelder, Kapital, Emittentenkapazität und unbezahlte Kupons können eine Auslosung verhindern. Der Erlös dient der Finanzierung, nicht dem Einkommen."
