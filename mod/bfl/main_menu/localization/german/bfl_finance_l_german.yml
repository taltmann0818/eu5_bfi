 bfl_asset_investments_title: "Eigenkapital & Ventures"
 bfl_asset_legend_footer: "Äußerer Ring: Asset-Typen. Innenring und farbige Schlüssel: Länder/Banken. Prozentsätze sind Anteile am gesamten Bankvermögen; Beträge sind Buchwerte."
 bfl_asset_mix: "Bankvermögen"
