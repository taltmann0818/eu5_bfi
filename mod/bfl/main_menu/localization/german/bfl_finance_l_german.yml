 bfl_equity_vote_reserve_200_tip: "Die Mehrheit der Finanzabstimmungen kann über die Reinvestitionsreserve des Unternehmens und das Handelsbudget entscheiden. Politische Mandate, einheimische Oberherrschaft, Bargeld und bestehende Gläubigerforderungen bleiben getrennt."
 bfl_establish_chartered_bank.a: "Wählen Sie die vorhandene Staatsbank aus"
 bfl_establish_chartered_bank.desc: "Wandeln Sie eine bestehende Staatsbank um und profitieren Sie von Banktraditionen, wenn die Gründung abgeschlossen ist. Die aktuelle Investition von 500 / 750 / 1,000 / 1,500 / 2,000 / 3,000 Gold wird als Staatskapital in die Staatskasse überwiesen. Sie müssen Eigentümer Ihres Kapitalmarktes sein. Wählen Sie eine Bank aus, bevor Sie eine Zahlung oder eine Recherche durchführen."
 bfl_establish_chartered_bank.title: "Gründen Sie eine staatlich zugelassene Bank"
 bfl_estate_bond_back: "Zurück zur Nachlassverwaltung"
 bfl_estate_bond_desc: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_managed_estate').GetCountry.GetName] schuldet [ROOT.GetCountry.MakeScope.GetVariable('bfl_estate_bond_face').GetValue|2] Schulleiter und [ROOT.GetCountry.MakeScope.GetVariable('bfl_estate_bond_due').GetValue|2] unbezahlte Gutscheine an [ROOT.GetCountry.MakeScope.GetVariable('bfl_estate_bond_holder').GetCountry.GetName]. Die Bargeldrückgewinnung teilt sich die unbesicherte Klasse mit Einlagen. Eine freiwillige Reduzierung erfordert einen neuen Vorschlag und die ausdrückliche Zustimmung dieses Inhabers; Zahlungen oder ein Wechsel des Treuhänders machen ausstehende Bedingungen ungültig."
 bfl_estate_bond_next: "Wählen Sie die nächste Anleihe aus"
 bfl_estate_bond_title: "Gläubiger einer Nachlassanleihe"
 bfl_estate_close_tip: "Schließen Sie diese vollständig beglichene Immobilie endgültig, nachdem Sie alle Verpflichtungen, unbaren Rechte und Eigentümer überprüft haben."
 bfl_estate_default_tip: "Schließen Sie diese erschöpfte, zerstörte Institution ab: Erfassen Sie unbezahlte Gläubigerverluste einmal und tilgen Sie Junior-Ausgaben. Kein Aktionär erhält einen Erlös."
