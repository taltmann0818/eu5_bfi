 bfl_asset_unsecured_heading: "Unbesicherte Kredite von [Country.GetName]"
 bfl_asset_unsecured_summary: "Unbesicherte Kredite: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_asset_fraction_unsecured')|%2]"
 bfl_asset_unsecured_title: "Unbesicherte Kredite"
 bfl_assets_detail_title: "Vermögenswerte von [Country.GetName]"
 bfl_assets_label: "Vermögenswerte"
 bfl_assets_label_tip: "#T Gesamtvermögen#!\nBargeld und verbuchte Vermögenswerte im Besitz der Bank.\n\nBargeld aus der Staatskasse: [Country.GetFixedPointCurrencyValue('gold')|2]@gold!\nKreditportfolio: [Country.MakeScope.GetVariable('bfl_native_credit_value').GetValue|2]@gold!\nEigenkapitalpositionen (Buchwert): [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_security_carrying')|2]@gold!\nKundenspezifische Kredite und Anleihen: [Country.MakeScope.GetVariable('bfl_custom_credit_value').GetValue|2]@gold!\nInventar: [Country.MakeScope.GetVariable('bfl_inventory_value').GetValue|2]@gold!\nProjekte: [Country.MakeScope.GetVariable('bfl_project_value').GetValue|2]@gold!\nGesamt: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_assets')|2]@gold!\n\nBei Krediten, Eigenkapitalpositionen, Vorräten und Projekten handelt es sich um erfasste Vermögenswerte, nicht um auszugebende Barmittel. Bei Tilgungszahlungen wird ein Darlehensvermögenswert gegen Bargeld getauscht. Sie erwirtschaften keinen Gewinn."
 bfl_authorize_note_bank: "Einlösbare Banknoten autorisieren"
 bfl_authorize_note_bank_act: "$bfl_authorize_note_bank$"
 bfl_authorize_note_bank_desc: "Ermächtigen Sie Ihre konzessionierte Bank oder eine unabhängige Bank mit einer Filiale in Ihrer Hauptstadt, nach der erforderlichen Recherche Bargeld in vollständig abgesicherte rückzahlbare Schuldverschreibungen umzutauschen. Auch für Neuemissionen ist eine vollständige Zentralbank in Ihrer Hauptstadt erforderlich. Die Autorisierung erzeugt kein Gold und kann widerrufen werden."
 bfl_authorize_note_bank_effect_text: "$bfl_authorize_note_bank$"
 bfl_authorize_note_bank_effect_text_past: "$bfl_authorize_note_bank$"
 bfl_automation_notice: "Kreditmanagement"
 bfl_automation_notice_tip: "Verwenden Sie Credit Management im Header, damit die Bank Kredite und Investitionen verwalten kann. Die Bank hält Reserven, bezahlt Gläubiger und prüft Recherchen und Bargeld, bevor sie investiert."
 bfl_available: "Verfügbares Bargeld"
 bfl_available_tip: "Bargeld, das die Bank verwenden kann, nachdem sie ihre Reserven behalten hat."
 bfl_back_to_bank: "Bankkonten"
 bfl_balance_paid_tip: "Finanzierte Zahlung, die bei der letzten monatlichen Abrechnung eingegangen ist. Diese Überweisungen befinden sich bereits in Ihrer Kasse und dürfen nicht erneut zum Gesamteinkommen des Einheimischen addiert werden."
 bfl_balance_sheet_subtitle: "Aktuelle Bankkonten"
 bfl_banco_del_giro: "Banco del Giro"
 bfl_banco_del_giro_desc: "Unter den Arkaden des Rialto laufen die öffentlichen Kredite von Buch zu Buch. Die Bank nimmt Münzen entgegen, begleicht die Verbindlichkeiten der Kaufleute und gibt der Republik eine dauerhafte Grundlage für ihre Schulden."
 bfl_banco_del_giro_maintenance: "Verwaltung der Banco del Giro"
 bfl_banco_mediceo: "Banco Mediceo"
 bfl_banco_mediceo_desc: "Hinter den mächtigen Steinmauern dieses Bankhauses begleichen Kaufleute ihre Rechnungen und Fürsten suchen den Kredit der Medici. Seine Schreiber ordnen den Strom von Wechseln und Münzen durch Mailand und stützen Staatsfinanzen und Bankgeschäfte. Das fertiggestellte Haus senkt die Verwaltungskosten der konzessionierten Bank um 15% und ermöglicht nach den erforderlichen Fortschritten Währungsdienste."
 bfl_bank_capital_subscriptions_desc: "Ein Bankhaus muss sich nicht ausschließlich auf das Vermögen seiner Gründerfamilie verlassen. Durch Abonnements werden zusätzliche Partner in das Unternehmen einbezogen, die ihr Kapital bündeln und gleichzeitig den Anspruch jedes Investors auf dessen künftigen Wohlstand festhalten."
 bfl_bank_dividends: "Bankdividenden (jährlich)"
 bfl_bank_eng.1.a: "Überlassen Sie das Register der Bank, zu fünf Prozent."
 bfl_bank_eng.1.b: "Bezahlen Sie für ein unabhängiges Finanzregister."
 bfl_bank_eng.1.c: "Lassen Sie die Verbrauchsteuerbauern das Geld finden."
 bfl_bank_eng.1.desc: "Das Unterhaus hat eine neue Verwendung für die Bank of England gefunden. Anstatt jede Zeichnung, Übertragung und Dividende in den Händen der Staatskasse zu belassen, würde die Bank ein öffentliches Register der Staatsaktien führen. Die Direktoren bieten an, eine Emission selbst zu zeichnen, sofern ihr Interesse gewürdigt wird. Beamte des Finanzministeriums wenden ein, dass der Registerführer zum Pförtner des öffentlichen Kredits werde. Die Verbrauchsteuerbauern hingegen versprechen Einnahmen, ohne so viel Autorität an die Stadt abzugeben."
 bfl_bank_eng.1.entry: "Die Mittel und Wege des öffentlichen Kredits"
 bfl_bank_eng.1.title: "Die Mittel und Wege des öffentlichen Kredits"
 bfl_bank_eng.3.a: "Bauen Sie eine Einrichtung auf, die der öffentlichen Anerkennung würdig ist."
 bfl_bank_eng.3.b: "Akzeptieren Sie den Flügel der Eigentümer und ihre Zugeständnisse."
 bfl_bank_eng.3.c: "Behalten Sie die gemieteten Hallen und die Münze der Staatskasse."
 bfl_bank_eng.3.desc: "In den gemieteten Räumen der Bank wimmelt es von Kassenbüchern, Kassierern und Inhabern, die auf ihre Dividenden warten. Seine Direktoren haben Pläne für eine dauerhafte Niederlassung in der Threadneedle Street gesichert. Ein öffentliches Gebäude würde dem Finanzministerium eine feste Hand in seiner Verwaltung geben, aber der Preis ist beträchtlich. Die Kaufleute bieten als Gegenleistung für Zugeständnisse an die Stadt ein günstigeres Abonnement an. Der Verbleib in den alten Räumen würde heute Geld sparen und gleichzeitig die wachsenden Kosten für verstreute Büros der Bank überlassen."
 bfl_bank_eng.3.entry: "Das Threadneedle Street Establishment"
 bfl_bank_eng.3.title: "Das Threadneedle Street Establishment"
 bfl_bank_eng.4.a: "Eröffnen Sie ein betreutes Discount-Büro für solide Geschäfte."
 bfl_bank_eng.4.b: "Legen Sie Staatsmünzen hinter die Reserven der Bank."
 bfl_bank_eng.4.c: "Es darf keine öffentlichen Unterkünfte geben."
 bfl_bank_eng.4.desc: "Eine zerrissene Kette von Geldscheinen hat Not von London nach Schottland und über das Meer getragen. Häuser, die wohlhabend erschienen, können die Münze nicht erhalten, um ihre morgigen Zahlungen zu bezahlen. Die Bank of England wird gebeten, ihre Entgegenkommen zu erweitern, doch ihre Direktoren bestehen darauf, dass ein solider Handelswechsel vom Papier eines ruinierten Spekulanten unterschieden werden muss. Händler fordern Entlastung ohne demütigende Nachfragen. Das Finanzministerium kann stattdessen die Bank stärken oder erklären, dass die Verluste denjenigen gehören, die sie erlitten haben."
 bfl_bank_eng.4.entry: "Die Rechnungen vom Juni"
 bfl_bank_eng.4.title: "Die Rechnungen vom Juni"
 bfl_bank_equity_subscribe: "Bankkasse: Abonnieren 100 Gold"
 bfl_bank_equity_subscribe_tip: "Investieren 100 des tatsächlich verwalteten Bargeld- und Kapitalüberschusses der tatsächlich verwalteten Bank zum materiellen Nettoinventarwert des ausgewählten Emittenten. Neue bezahlte Einheiten gelangen in das Bankportfolio. Maximal 25% einer Bank bzw 60% eines im Ausland zugelassenen Unternehmens. Hierbei handelt es sich um eine Primärfinanzierung, nicht um einen Kauf von einem bestehenden Aktionär."
 bfl_bank_flo.1.a: "Ehre den Guelph-Vertrag."
 bfl_bank_flo.1.b: "Die Bank bedient Florenz vor jeder Partei."
 bfl_bank_flo.1.c: "Kaufen Sie eine Versöhnung zwischen den Häusern."
 bfl_bank_flo.1.desc: "Die Bardi haben die Allianzen nicht vergessen, die ihr Haus in Florenz zu einer Macht machten. Ihre Verwandten berufen sich auf die alte Buondelmonti-Sache und fordern, dass die Stadtbank offen auf der Seite der Freunde des Papsttums steht. Die Beamten der Signoria befürchten, dass jeder Bericht eine fraktionelle Färbung annimmt. Eine öffentliche Bank mag zwar die Partei der Stadt stärken, aber Kaufleuten, deren Geschäfte über die alten Grenzen hinausgehen, wäre es lieber, wenn ihre Türen für beide Seiten offen blieben."
 bfl_bank_flo.1.entry: "Die Buondelmonti-Verpflichtung"
 bfl_bank_flo.1.title: "Die Buondelmonti-Verpflichtung"
 bfl_bank_flo.2.a: "Lassen Sie die Faktoren den Wollschiffen folgen."
 bfl_bank_flo.2.b: "Werben Sie um die Krone und akzeptieren Sie den politischen Preis."
 bfl_bank_flo.2.c: "Konzentrieren Sie unsere Konten in Italien."
 bfl_bank_flo.2.desc: "Die Faktoren unserer Bankiers in England bringen der Signoria zwei Arten von Geschäften. Wollhändler bieten einen stetigen Handel mit Ballen, Rechnungen und Zollbelegen an. Königliche Agenten bieten Zugang zu einem viel größeren Geldbeutel, obwohl der Geldbeutel selten sofort geöffnet wird. Die Direktoren würden ihr englisches Haus unter dem Schutz unserer Charta erneuern. Die Frage ist, ob seine Angestellten den Wollschiffen folgen, den Hof pflegen oder englische Versprechen einer anderen Bank überlassen sollten."
 bfl_bank_flo.2.entry: "Wolle, Geldscheine und eine englische Krone"
 bfl_bank_flo.2.title: "Wolle, Geldscheine und eine englische Krone"
 bfl_bank_flo.3.a: "Geben Sie einen Kapellenzyklus im Namen Bardi in Auftrag."
 bfl_bank_flo.3.b: "Gib der Stadt einen Altar, ohne den Triumph einer Familie."
 bfl_bank_flo.3.c: "Bewahren Sie das Geld auf den Konten der Bank auf."
 bfl_bank_flo.3.desc: "Die Brüder von Santa Croce haben sich mit Plänen für eine bemalte Kapelle an die Bardi gewandt. Die Frömmigkeit der Familie würde in Farbe und Stein in Erinnerung bleiben, während die Signoria die Welt daran erinnern würde, dass Florenz mehr ist als eine Stadt der Geschäftsbücher. Ein großer Gemäldezyklus würde die Gönner der Bank ehren. Ein bescheidenerer Altar, der im Namen der Stadt bezahlt wird, könnte mehr Zuneigung über die Familie hinaus gewinnen. Die Kassierer sehen nur die Forderungen, die bereits auf ihren Schreibtischen liegen."
 bfl_bank_flo.3.entry: "Die Bankiers und die Brüder"
 bfl_bank_flo.3.title: "Die Bankiers und die Brüder"
 bfl_bank_flo.4.a: "Erwerben Sie einen öffentlichen Vergleich der umstrittenen Konten."
 bfl_bank_flo.4.b: "Belasten Sie die Bankpartner, nicht die ganze Stadt."
 bfl_bank_flo.4.c: "Lassen Sie die Gerichte und Gläubiger die Verluste klären."
 bfl_bank_flo.4.desc: "Das Scheitern der großen Bankhäuser hinterließ mehr als nur unbezahlte englische Versprechen. Die erhaltenen Bücher enthalten umstrittene Forderungen, Vorschüsse gegen Wolle und Konten, deren Besitzer darauf bestehen, dass die Stadt sie nun schützen müsse. Unsere Charta hat den Streit neu entfacht: Soll Florenz für einen öffentlichen Vergleich aufkommen, die Partner zur Zahlung einer außerordentlichen Abgabe verpflichten oder die alten Ansprüche den Gerichten überlassen? Die englische Krone ist nur ein Name in einer Geschichte voller Kriege, Rückzüge und gebrochenem Vertrauen, aber es ist der Name, der im Plenarsaal am häufigsten gesprochen wird."
 bfl_bank_flo.4.entry: "Die Abrechnung der englischen Schulden"
 bfl_bank_flo.4.title: "Die Abrechnung der englischen Schulden"
 bfl_bank_gen.1.a: "Verknüpfen Sie das kaiserliche Konto enger mit San Giorgio."
 bfl_bank_gen.1.b: "Senden Sie unsere Faktoren stattdessen an mehrere Gerichte."
 bfl_bank_gen.1.c: "An erster Stelle muss die Rechnungslegung der Republik stehen."
 bfl_bank_gen.1.desc: "Ein kaiserlicher Gesandter ist mit Einnahmeversprechen und der Bitte um weitere Kredite nach San Giorgio gekommen. Die Beschützer kennen den Vorteil eines Kontos, das sich über ganz Europa erstreckt, und die Gefahr, zuzulassen, dass ein großer Schuldner den Rest in den Schatten stellt. Die Kaufleute der Republik würden von der kaiserlichen Gunst profitieren. Seine Diplomaten warnen, dass Gunst bei einem Gericht Misstrauen bei einem anderen hervorruft. Den Direktoren der Bank muss mitgeteilt werden, ob die Republik eine imperiale Verbindung, einen größeren Kreis von Kreditnehmern oder ein kleineres, sichereres Geschäftsportfolio wünscht."
 bfl_bank_gen.1.entry: "Der Bericht des Kaisers"
 bfl_bank_gen.1.title: "Der Bericht des Kaisers"
 bfl_bank_gen.2.a: "Erkennen Sie das Albergo und die Autorität seiner Ältesten an."
 bfl_bank_gen.2.b: "Lassen Sie Notare einen beaufsichtigten Vertrag erstellen."
 bfl_bank_gen.2.c: "Keine Familie darf innerhalb der Republik einen Staat bilden."
 bfl_bank_gen.2.desc: "Die Grimaldi schlagen vor, ihre verstreuten Familieninteressen in einem Albergo zu bündeln. Gemeinsame Artikel, gemeinsame Verantwortlichkeiten und ein gemeinsamer Name würden ihrer Bank eine Beständigkeit verleihen, die kein einzelner Haushalt versprechen kann. Die Familie verlangt, dass ihre eigenen Ältesten den Pakt regeln. Eine andere Möglichkeit bieten Notare, die die Bücher unter öffentliche Aufsicht stellen. Beide Siedlungen würden das Haus stärken; Die Frage ist, wer die Schlüssel zu seinen Angelegenheiten erwerben würde."
 bfl_bank_gen.2.entry: "Das Grimaldi Albergo"
 bfl_bank_gen.2.title: "Das Grimaldi Albergo"
 bfl_bank_gen.3.a: "Geben Sie den Bankiers eine feste Stimme im Kapitänsamt."
 bfl_bank_gen.3.b: "Balancieren Sie die Häuser unter einer gemeinsamen Magistratur."
 bfl_bank_gen.3.c: "Die Beamten der Republik sollen nicht ihre Bankiers sein."
 bfl_bank_gen.3.desc: "Die Spinola-Banker haben einen alten Präzedenzfall in den Ratssaal gebracht. Galeotto Spinola und Raffaele Doria hatten einst gemeinsam das Amt des Kapitäns inne und beendeten damit den Aufstieg des Königs von Neapel in Genua. Ihre Nachkommen argumentieren, dass die Männer, die den Kredit der Republik aufrechterhalten, wieder einen festen Platz in ihrer Regierung haben sollten. Einige bevorzugen das Kapitänsamt eines Bankiers, andere bevorzugen ein Gleichgewicht zwischen rivalisierenden Häusern. Die Richter würden es vorziehen, wenn die Kreditgeber außerhalb der Büros blieben, die über ihre Ansprüche entscheiden müssen."
 bfl_bank_gen.3.entry: "Der Präzedenzfall der Kapitäne"
 bfl_bank_gen.3.title: "Der Präzedenzfall der Kapitäne"
 bfl_bank_headquarters_cost_reduction: "Senkung der Betriebskosten der Chartered-Bank-Zentrale"
 bfl_bank_holdings: "Bankinvestitionen"
 bfl_bank_identity_tip: "[Country.GetName] verfügt über eigene Kassen, Vermögenswerte und Verbindlichkeiten. Diese Beträge gehören der Bank, getrennt von Ihrer Staatskasse. Merchant Finance ist auf Handels- und Unternehmenskredite spezialisiert; Overseas Investment ist auf Ventures und Unternehmen spezialisiert. Eine Bank wählt eine dauerhafte Spezialisierung."
 bfl_bank_loan_yield_bonus: "Zinsen für neue Bankkreditangebote"
 bfl_bank_of_england_founding_tt: "Richten Sie die Bank of England als unsere Chartered Bank in London ein, finanziert aus verfügbaren Kassenmitteln bis hin zur Standard-Charterinvestition."
 bfl_bank_of_england_name: "Bank von England"
 bfl_bank_palace_cost_reduction: "Reduzierung der Betriebskosten der Bank"
 bfl_bank_petitions.1.a: "Geben Sie das Bürgerabonnement ein und schlagen Sie die Bücher auf."
 bfl_bank_petitions.1.b: "Wir werden den öffentlichen Anteil nicht verwässern."
 bfl_bank_petitions.1.desc: "Die Eröffnung der Börse hat den Aktien unserer zugelassenen Bank ein Leben über die Erstzeichner hinaus beschert. Ihre Direktoren bitten nun um Erlaubnis, frisches Kapital aufzunehmen, und die führenden Bürger sind bereit, einen Teil der neuen Aktien zu übernehmen. Sie versprechen, dass eine größere Gruppe von Eigentümern Münzen und Verbindungen zur Bank bringen wird. Unser Schatzmeister ist weniger begeistert: Jede neue Aktie verringert den Anteil des Staates an künftigen Dividenden, es sei denn, wir zeichnen zusammen mit den Händlern."
 bfl_bank_petitions.1.entry: "Ein neues Abonnement"
 bfl_bank_petitions.1.title: "Ein neues Abonnement"
 bfl_bank_petitions.2.a: "Akzeptieren Sie eine angemessene Bezahlung für diesen Anteil unserer Aktien."
 bfl_bank_petitions.2.b: "Der öffentliche Anteil bleibt bestehen."
 bfl_bank_petitions.2.desc: "Die Direktoren unserer zugelassenen Bank haben angeboten, einen Teil der von der Staatskasse gehaltenen Aktien zu erwerben. Die Zertifikate würden entwertet, so dass die verbleibenden Eigentümer einen größeren Teil der künftigen Erträge der Bank hätten. Die Bürger begrüßen den Vorschlag, während unser Schatzmeister eine sofortige Zahlung als Gegenleistung für noch zu erwartende Einnahmen erwartet. Heute zurückgegebene Aktien können jedoch morgen nicht ohne erneute Zeichnung erneut angeboten werden. Die Direktoren warten auf unsere Antwort."
 bfl_bank_petitions.2.entry: "Die Aktien des Souveräns"
 bfl_bank_petitions.2.title: "Die Aktien des Souveräns"
 bfl_bank_petitions.3.a: "Behalten Sie die Erträge zwei Jahre lang bei der Bank."
 bfl_bank_petitions.3.b: "Die Staatskasse benötigt ihr übliches Einkommen."
 bfl_bank_petitions.3.desc: "Die Direktoren der Bank haben ihre Bücher dem Finanzministerium vorgelegt und um Geduld gebeten. Anstatt die kommenden Gewinne auszuschütten, würden sie sie in der Bank behalten, bis ihre Reserven stärker sind. Die Handelsbesitzer haben zugestimmt, abzuwarten, ob der Souverän das Gleiche tut. Unsere Beamten protestieren, dass die erwarteten Dividenden bereits ihren Platz in den öffentlichen Konten haben. Eine Ablehnung würde unser Einkommen schützen, aber die Direktoren davon überzeugen, dass für uns die nächste Zahlung wichtiger ist als die Zukunft der Bank."
 bfl_bank_petitions.3.entry: "Die Dividende muss warten"
 bfl_bank_petitions.3.title: "Die Dividende muss warten"
 bfl_bank_share_dealing: "Bankaktienhandel"
 bfl_bank_share_dealing_desc: "Das Vermögen eines Partners muss nicht für immer an dasselbe Bankhaus gebunden bleiben. Anerkannte Eigentumsübertragungen ermöglichen es Anlegern, ihre Anteile an andere zu verkaufen, während das Institut seine Geschäfte weiterführt, ohne sein Kapital abzuziehen."
 bfl_bank_share_price_bonus: "Aktienkurs der Bank"
 bfl_bank_share_transfer: "Bankanteilübertragung"
 bfl_bank_share_transfer_tip: "#T Aktienübertragung per Bank#!\nÜbertragen Sie erfasste Bankeigentumseinheiten zwischen finanzierten Parteien. Erfordert Recherchen zum Bankaktienhandel und zum Reformationszeitalter oder später. In dieser Zeile wird die Berechtigung angegeben. es führt selbst keinen sekundären Aktienhandel durch."
 bfl_bank_status_tip: "Betrieblich: Neue Geschäfte sind zulässig, wenn die übrigen Voraussetzungen erfüllt sind. Bargeld unter Druck: Das verfügbare Bargeld ist erschöpft. Auszahlungen in der Warteschlange: Unbezahlte Auszahlungsanträge unterbrechen Neugeschäft. Insolvenz: Verbindlichkeiten übersteigen Vermögenswerte. In Auflösung oder geschlossen: Der normale Geschäftsbetrieb ist eingeschränkt. Bestehende Forderungen bleiben erfasst."
 bfl_bank_subscription: "Bankabonnement"
 bfl_bank_ven.1.a: "Machen Sie den Giro zu einer dauerhaften Institution der Republik."
 bfl_bank_ven.1.b: "Nach Belieben des Senats kann es um ein Jahr verlängert werden."
 bfl_bank_ven.1.c: "Beenden Sie das Experiment. Betreuung der bestehenden Konten."
 bfl_bank_ven.1.desc: "Die Banco del Giro sollte ein Ausweg sein: Drei Jahre Zeit, um die übertragbaren Verbindlichkeiten der Republik anzuordnen, und dann würde ihr Geschäft eingestellt. Die Frist ist abgelaufen, aber in den Büchern der Händler stehen mehr Überweisungen als je zuvor. Der Senat muss sich zwischen einer dauerhaften öffentlichen Institution, einem weiteren kurzen Mandat und einem geordneten Ende des Neugeschäfts entscheiden. Jede Verzögerung macht es schwieriger, die temporäre Bank zu entlassen; Jede Dauerschuld bindet die Republik stärker an ihre Gläubiger."
 bfl_bank_ven.1.entry: "Die drei Jahre des Giro"
 bfl_bank_ven.1.title: "Die drei Jahre des Giro"
 bfl_bank_ven.2.a: "Zahlen Sie für die Entlastung und halten Sie die öffentlichen Finanzen in Bewegung."
 bfl_bank_ven.2.b: "Geben Sie den Militärkonten Vorrang."
 bfl_bank_ven.2.c: "Lassen Sie die Pfarreien und Nachbarschaften die Hilfe tragen."
 bfl_bank_ven.2.desc: "Die Bücher des Giro sind zu einem Treffpunkt für die Notfälle der Republik geworden. Opferpflichtige legen Militärrechnungen vor, während die Beamten des öffentlichen Gesundheitswesens die Bezahlung ihrer eigenen Gebühren verlangen. Jeder Forderung unverzüglich nachzukommen, würde die Staatskasse belasten; Die Bevorzugung der Galeeren würde den zivilen Handel warten lassen. Einige Senatoren wälzen die Arbeit auf Gemeinden und Stadtteile ab und schonen so die öffentlichen Kassen auf Kosten derjenigen, die ohnehin schon die schwersten Lasten tragen."
 bfl_bank_ven.2.entry: "Die Bücher über Krieg und Pest"
 bfl_bank_ven.2.title: "Die Bücher über Krieg und Pest"
 bfl_bank_ven.3.a: "Finanzieren Sie ein öffentliches Anlagefenster mit Rücklagen der Staatskasse."
 bfl_bank_ven.3.b: "Lassen Sie die Bank auf eigene Kosten ein engeres Fenster vorbereiten."
 bfl_bank_ven.3.c: "Behalten Sie die günstigere öffentliche Transferstelle bei."
 bfl_bank_ven.3.desc: "Die Kaufleute wollen nicht mehr, dass ein guter Eintrag in einem öffentlichen Buch das Ende der Sache bedeutet. Sie fordern ein regelmäßiges Zeitfenster, in dem Guthaben in Silber beglichen werden können, und warnen, dass der Ruf des Giro von der Antwort abhängt. Die Senatoren können für eine gut finanzierte Spesenfazilität aufkommen, von der Bank verlangen, aus eigenen Mitteln ein engeres Zeitfenster bereitzustellen, oder die günstigeren Transfermechanismen bevorzugen. Für die Zusage, dass die Münzen bereitliegen, sind Münzen in den Tresoren und Angestellte an der Theke erforderlich."
 bfl_bank_ven.3.entry: "Silber für das Geld des Giro"
 bfl_bank_ven.3.title: "Silber für das Geld des Giro"
 bfl_bank_ven.4.a: "Machen Sie den Giro zu einer dauerhaften Institution der Republik."
 bfl_bank_ven.4.b: "Nach Belieben des Senats kann es um ein Jahr verlängert werden."
 bfl_bank_ven.4.c: "Beenden Sie das Experiment. Betreuung der bestehenden Konten."
 bfl_bank_ven.4.desc: "Ein weiteres Jahresmandat ist abgelaufen. Die Sachbearbeiter des Giro fragen den Senat erneut, ob er neue Bücher vorbereiten oder mit der Schließung der alten beginnen soll. Händler, die einst ein vorübergehendes Hilfsmittel begrüßten, behandeln seine Übertragungen heute als Teil des normalen Geschäftsverkehrs. Die Erneuerung des Mandats wahrt den Ermessensspielraum des Senats, erfordert jedoch einen weiteren Mitteleinsatz. Dauerhaftigkeit würde die Frage klären; Die Schließung neuer Geschäfte würde es der Republik überlassen, die Konsequenzen zu tragen."
 bfl_bank_ven.4.entry: "Ein weiteres Jahr für den Giro"
 bfl_bank_ven.4.title: "Ein weiteres Jahr für den Giro"
 bfl_banking_company: "Bankunternehmen"
 bfl_banking_company_desc: "Die Geschäfte dieser Bank sind über den Haushalt hinausgewachsen, der einst ihre Bücher führte. Eine Gruppe von Direktoren beaufsichtigt nun die Angestellten, während gemeinsame Konten und etablierte Büros ein Unternehmen zusammenhalten, das über das Vermögen einer einzelnen Familie hinaus Bestand haben kann. Die Erfahrung wird von einer Generation von Bediensteten an die nächste weitergegeben und bringt Ordnung und Wirtschaftlichkeit in das tägliche Kreditgeschäft."
