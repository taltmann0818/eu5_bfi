 bfl_offer_commenda: "Finanzieren Sie einen Frachtbetrieb"
 bfl_offer_commenda_act: "Finanzieren Sie einen Frachtbetrieb"
 bfl_offer_commenda_desc: "Bieten Sie Risikokapital zu den von der Bank vorgeschlagenen Konditionen an. Acceptance kauft die genannte Ladung zum Selbstkostenpreis; Nicht in Anspruch genommene Ermächtigungen verbleiben bei der Bank. Kapital und Rendite sind niemals garantiert."
 bfl_offer_commenda_effect_text: "Finanzieren Sie einen Frachtbetrieb"
 bfl_offer_commenda_effect_text_past: "Finanzieren Sie einen Frachtbetrieb"
 bfl_offer_commenda_tip: "Discovery oder später Overseas Investment und Commenda Research. Wählen Sie einen Betreiber, einen Quellmarkt, ein Ziel und Waren für eine Ladung mit zehn Einheiten. Bei der Annahme werden Ihre Autorität, Ihr freies Bargeld, Ihr Kapital und Ihre Kapazität erneut überprüft. Eine aktive Vereinbarung pro Betreiber; bis zu acht pro Bank."
 bfl_offer_credit: "Bieten Sie ein finanziertes Darlehen an"
 bfl_offer_credit_act: "$bfl_offer_credit$"
 bfl_offer_credit_desc: "Der Kreditnehmer erhält ein konkretes Angebot. Bis zur Annahme ändern sich weder Bargeld noch Konditionen; Die Ausführung überprüft die Live-Autorität, das Profil, die Forschung und die Mittel erneut."
 bfl_offer_credit_effect_text: "$bfl_offer_credit$"
 bfl_offer_credit_effect_text_past: "$bfl_offer_credit$"
 bfl_offer_credit_tip: "Wählen Sie ein staatliches oder berechtigtes einheimisches Unternehmen aus. Beide Profile verleihen Kredite an Staaten; Unternehmenskredite erfordern Merchant Finance, Reformation und Corporate Credit. Ein Schuldenerlass erfordert auch eine Renaissance-Schuldenumstrukturierung."
 bfl_offer_goods_transfer: "Bieten Sie die Übertragung von Lagerbelegen an"
 bfl_offer_goods_transfer_act: "$bfl_offer_goods_transfer$"
 bfl_offer_goods_transfer_desc: "Bieten Sie die zuletzt in Warenangebote und Verwahrungsansprüche ausgewählte Quittung an. Der Empfänger überprüft Preis und Menge, bevor er den Betrag an den aktuellen Inhaber zahlt."
 bfl_offer_goods_transfer_effect_text: "$bfl_offer_goods_transfer$"
 bfl_offer_goods_transfer_effect_text_past: "$bfl_offer_goods_transfer$"
 bfl_offer_held_sovereign_bond: "Bieten Sie eine gehaltene Staatsanleihe an"
 bfl_offer_held_sovereign_bond_act: "$bfl_offer_held_sovereign_bond$"
 bfl_offer_held_sovereign_bond_desc: "Wählen Sie einen Emittenten aus und listen Sie eine Ihrer Staatsanleihen auf 98% vom Nennwert. Erfordert ein eigenes, fertiggestelltes Börsengebäude."
 bfl_offer_held_sovereign_bond_effect_text: "$bfl_offer_held_sovereign_bond$"
 bfl_offer_held_sovereign_bond_effect_text_past: "$bfl_offer_held_sovereign_bond$"
 bfl_offer_held_sovereign_bond_tip: "Listen Sie eine bestehende Anleihe auf, die Sie drei Monate lang besitzen. Sie behalten den Anspruch, bis ein finanzierter Käufer akzeptiert; Gutscheine und Einlösung folgen dann diesem Käufer."
 bfl_offer_restructuring: "Bieten Sie einen Schuldenerlass an"
 bfl_offer_restructuring_act: "$bfl_offer_restructuring$"
 bfl_offer_restructuring_desc: "Der Kreditnehmer erhält ein konkretes Angebot. Bis zur Annahme ändern sich weder Bargeld noch Konditionen; Die Ausführung überprüft die Live-Autorität, das Profil, die Forschung und die Mittel erneut."
 bfl_offer_restructuring_effect_text: "$bfl_offer_restructuring$"
 bfl_offer_restructuring_effect_text_past: "$bfl_offer_restructuring$"
 bfl_offer_restructuring_tip: "Wählen Sie ein staatliches oder berechtigtes einheimisches Unternehmen aus. Beide Profile verleihen Kredite an Staaten; Unternehmenskredite erfordern Merchant Finance, Reformation und Corporate Credit. Ein Schuldenerlass erfordert auch eine Renaissance-Schuldenumstrukturierung."
 bfl_offering_closed: "Geschlossen"
 bfl_offering_open: "Offen"
 bfl_operating_costs: "Monatliche Betriebskosten"
 bfl_operating_costs_tip: "Feste monatliche Kostenstaffel mit aktiven Depotkonten, Verträgen, Filialen und Anlageklassen. Die Reform der State Chartered Bank senkt die Kosten um 5%, Banking von 10%, Erweitertes Clearing von 15%und eine optimierte Verwaltung durch 10%. Unbezahlte Kosten bleiben Verbindlichkeiten und blockieren Dividenden."
 bfl_overview: "Konten und Spezialisierung"
 bfl_overview_hint: "Vermögenswerte: Außenring = Typ; innerer Ring = Länder. Bewegen Sie den Mauszeiger, um farbige Aufschlüsselungen anzuzeigen."
 bfl_payout_0: "Gewinne behalten"
 bfl_payout_0_short: "Behalten"
 bfl_payout_0_tip: "Behalten Sie alle anrechenbaren realisierten Gewinne ein. Im Rahmen dieser Richtlinie wird keine neue Dividende gezahlt; Der einbehaltene Gewinn unterstützt Liquidität und Eigenkapital."
 bfl_payout_25: "25% Auszahlung"
 bfl_payout_25_short: "25%"
 bfl_payout_25_tip: "Bis zu zuweisen 25% des anrechenbaren realisierten Gewinns in Dividenden nach Verlusten. Verfügbare Barmittel, Kapitalspielraum und eingetragenes Eigentum schränken die Zahlung weiterhin ein."
 bfl_payout_50: "50% Auszahlung"
 bfl_payout_50_short: "50%"
 bfl_payout_50_tip: "Bis zu zuweisen 50% des anrechenbaren realisierten Gewinns in Dividenden nach Verlusten. Verfügbare Barmittel, Kapitalspielraum und eingetragenes Eigentum schränken die Zahlung weiterhin ein."
 bfl_peasants_estate_workout_mandate: "Mandat zur Nachlassabwicklung"
 bfl_peasants_estate_workout_mandate_desc: "Dieser Nachlass ermächtigt seine Regierung ausdrücklich, in seinem Namen freiwillige Bankeinlagenabwicklungen zu überprüfen. Jeder Vorschlag bedarf noch einer gesonderten Annahme. Durch den Widerruf dieses Privilegs werden ausstehende Nachlassbedingungen ungültig. Die Rückzahlungszahlungen werden weiterhin in den Nachlassbestand eingezahlt."
 bfl_place_deposit_1: "Öffnen Sie ein 100 Sichteinlage aus Gold"
 bfl_place_deposit_1_act: "$bfl_place_deposit_1$"
 bfl_place_deposit_1_desc: "Unabhängige Banken benötigen mindestens ein Gutachten +50 an Sie, um ein Konto zu eröffnen. Ihre Vertragsbank bietet ein Extra an 1% Jahreszins. Bedarfszinsen werden bei Finanzierung monatlich gezahlt; Nicht gezahlte Zinsen bleiben geschuldet. Sinkende Verhältnisse verhindern nie den Rückzug der eigenen fälligen Forderungen."
 bfl_place_deposit_1_effect_text: "$bfl_place_deposit_1$"
 bfl_place_deposit_1_effect_text_past: "$bfl_place_deposit_1$"
 bfl_place_deposit_2: "Öffnen Sie ein 100 Gold-Termineinlage"
 bfl_place_deposit_2_act: "$bfl_place_deposit_2$"
 bfl_place_deposit_2_desc: "Unabhängige Banken benötigen mindestens ein Gutachten +50 an Sie, um ein Konto zu eröffnen. Ihre Vertragsbank bietet ein Extra an 1% Jahreszins. Bedarfszinsen werden bei Finanzierung monatlich gezahlt; Nicht gezahlte Zinsen bleiben geschuldet. Sinkende Verhältnisse verhindern nie den Rückzug der eigenen fälligen Forderungen."
 bfl_place_deposit_2_effect_text: "$bfl_place_deposit_2$"
 bfl_place_deposit_2_effect_text_past: "$bfl_place_deposit_2$"
 bfl_portfolio_bank_heading: "Investitionen gehalten von [Country.GetName]"
 bfl_portfolio_history_axis: "Vom Ältesten zum Neuesten · bis zu 12 monatliche Beobachtungen"
 bfl_portfolio_history_empty: "Die Historie beginnt mit dem nächsten monatlichen Bankschluss."
 bfl_portfolio_history_flows: "Der Wert umfasst Käufe und Verkäufe; Dies ist kein Anlage-Rendite-Index."
 bfl_portfolio_history_title: "Portfoliowert im Zeitverlauf"
 bfl_portfolio_owner_note: "Treasury- und Bankbeteiligungen haben getrennte Eigentümer. Bewegen Sie den Mauszeiger über ein Unternehmen, um dessen Finanzen anzuzeigen."
 bfl_portfolio_total_heading: "Aktueller Eigenkapitalwert"
 bfl_portfolio_treasury_heading: "Staatsschatzbestände"
 bfl_prepare_bond_panel: "Staatsanleihen"
 bfl_prepare_bond_panel_tip: "Staatsfinanzierung und bestehende Forderungen im Kreditbereich einsehen."
 bfl_probe_P11: "Entwicklungstor: P11 muss im Spiel gemessen werden, bevor dieser Adapter ausgeführt werden kann."
 bfl_profile_0: "Wählen Sie eine Spezialisierung"
 bfl_profile_1: "Handelsfinanzierung"
 bfl_profile_2: "Auslandsinvestitionen"
 bfl_project_security: "Projektsicherheit"
 bfl_project_security_desc: "Entfernte Unternehmen sind für ihre Finanziers schwer zu überwachen. Ansprüche auf ihr Vermögen und ihre Erlöse, die vor der Kapitalbereitstellung festgelegt werden, bieten Anlegern die Möglichkeit, ihre Interessen zu schützen, wenn ein Unternehmen scheitert."
 bfl_project_security_tip: "#T Projektsicherheit#!\nSichern Sie ein Unternehmen gegen erkennbare Projektansprüche ab. Erfordert Projektsicherheitsforschung, Auslandsinvestitionen und das Zeitalter des Absolutismus oder später. Die Ausführung nativer Projektsicherheiten ist in diesem Build nicht verfügbar."
 bfl_protected_label: "Geschütztes Bargeld"
 bfl_public_backstop: "Öffentlicher Backstop"
 bfl_public_backstop_tip: "#T Öffentliche gesicherte Unterstützung#!\nRevolutionen, öffentliche Finanzsicherungen und eine Live-Charta mit einer fertiggestellten Zentralbank in der souveränen Hauptstadt. Ausdrücklich akzeptiert 75-Goldvorschüsse nutzen das eigene freie Bargeld der öffentlichen Bank, a 25% Bill Haarschnitt und zumindest 9% Jahreszins. Keine kostenlose Rekapitalisierung."
 bfl_public_financial_backstops: "Öffentliche Finanzsicherungen"
 bfl_public_financial_backstops_desc: "Wenn der Zusammenbruch eines großen Bankhauses die öffentliche Kreditwürdigkeit und den Handel gefährdet, kann die Regierung eingreifen. Eine solche Unterstützung bindet die Ressourcen des Finanzministeriums an die Sanierung der Bank und macht die Bedingungen der Unterstützung zu einer Angelegenheit der öffentlichen Ordnung."
 bfl_purchase_funded_bill: "Kaufen Sie eine Rechnung mit finanzierter Zahlung"
 bfl_purchase_funded_bill_act: "$bfl_purchase_funded_bill$"
 bfl_purchase_funded_bill_desc: "Finanziert aus Ihrer eigenen Kasse nach Profil-, Alters-, Recherche- und Registrierungsprüfungen. Kapital ist kein Bankgewinn. Bei einer Bankkapitalzeichnung werden Anteile zum aktuellen Nettoinventarwert erworben."
 bfl_purchase_funded_bill_effect_text: "$bfl_purchase_funded_bill$"
 bfl_purchase_funded_bill_effect_text_past: "$bfl_purchase_funded_bill$"
 bfl_purchase_native_loan: "Bank: Kauf eines Immobiliendarlehens"
 bfl_purchase_native_loan_act: "$bfl_purchase_native_loan$"
 bfl_purchase_native_loan_desc: "Ihre Bank ist der Käufer. Es gelten der ortsansässige Preis und die entsprechende Berechtigung, mit zusätzlichen kostenlosen Bargeld- und Kapitalschecks. Banknachlässe erhalten den Kaufpreis und derselbe Kredit wechselt den Besitzer. Ausgenommen sind Anleihen und bereits vom Land gehaltene Kredite."
 bfl_purchase_native_loan_effect_text: "$bfl_purchase_native_loan$"
 bfl_purchase_native_loan_effect_text_past: "$bfl_purchase_native_loan$"
 bfl_purchase_native_loan_tip: "#T Kredit für die Bank übernehmen#!\nWählen Sie einen anderen Staat mit zulässigen Nachlassschulden aus. Ihre konzessionierte Bank zahlt den einheimischen Kaufpreis an die Bankvermögen dieses Landes und wird zum Gläubiger desselben Darlehens. Kapital- und Zinsforderungen gehören der Bank; Der Staat erzielt Krediteinnahmen durch seine Aktiendividenden. Banken erwerben außerdem jeden Monat selbstständig einen geeigneten Kredit, wenn die Reserven und das Kapital dies zulassen. Ausgenommen sind Anleihen und bereits vom Land gehaltene Kredite."
 bfl_rate_0: "Für neue Konten fallen keine Zinsen an"
 bfl_rate_0_short: "0%"
 bfl_rate_0_tip: "Angebot 0% Jährlicher Zinssatz für neue Sichteinlagen. Bestehende Tagesgeldkonten und der separate Terminkontotarif bleiben zu den jeweils gültigen Konditionen bestehen."
 bfl_rate_1: "1% Jährlicher Nachfragesatz für neue Konten"
 bfl_rate_1_short: "1%"
 bfl_rate_1_tip: "Angebot 1% Jährlicher Zinssatz für neue Sichteinlagen. Die Zinsgutschrift erfolgt monatlich mit Cent Carry. Bestehende Girokonten behalten ihre akzeptierten Tarife."
 bfl_rate_2: "2% Jährlicher Nachfragesatz für neue Konten"
 bfl_rate_2_short: "2%"
 bfl_rate_2_tip: "Angebot 2% Jährlicher Zinssatz für neue Sichteinlagen. Die Zinsgutschrift erfolgt monatlich mit Cent Carry. Bestehende Girokonten behalten ihre akzeptierten Tarife."
 bfl_recapitalize_command: "Rekapitalisieren Sie mit 100 Gold"
 bfl_recapitalize_command_tip: "Bezahlen 100 Gold aus der Staatskasse Ihres Landes als Bankkapital. Erfordert 100 Gold und ein Weiterverkaufsgebot des Händlers, das nicht höher ist als der materielle Nettoinventarwert; Das Kapital pausiert während einer größeren Marktprämie, um einen sofortigen Weiterverkaufsgewinn zu verhindern. Eine finanzierte Rettung bei einem Nettoinventarwert von Null oder einem negativen Nettoinventarwert bleibt weiterhin möglich."
