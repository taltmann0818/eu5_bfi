 bfl_loan_button: "Darlehen übernehmen"
 bfl_loans_columns: "Monate des Kapitalzinses des Kreditnehmers"
 bfl_loans_empty: "Keine Bankkredite. Hier erscheinen Kreditangebote und abgeschlossene Übernahmen."
 bfl_log_charter: "Gründung und Kapitalisierung einer Staatsbank für"
 bfl_manage_shareholdings: "Entscheidungen der Aktionäre"
 bfl_manage_shareholdings_desc: "Dividenden festlegen für [ROOT.GetCountry.MakeScope.GetVariable('bfl_exchange_selected').GetCountry.GetName]. Eine Mehrheit der Finanzabstimmungen kontrolliert die Auszahlungen von Unternehmen und unabhängigen Banken. Der Staat kontrolliert seine eigene zugelassene Bank. Die Wahl der Unternehmensreserven lässt die politische Kontrolle unverändert."
 bfl_manage_shareholdings_tip: "Wählen Sie ein Unternehmen oder eine Bank aus, um die Dividende festzulegen. Erfordert eine Mehrheit der Finanzstimmen oder die Kontrolle Ihrer zugelassenen Bank. Minderheitsbeteiligungen bleiben mit ihrem nicht erfüllten Bedarf sichtbar."
 bfl_margining: "Marginierung"
 bfl_margining_and_risk_management: "Margining und Risikomanagement"
 bfl_margining_and_risk_management_desc: "Händler, die künftige Lieferungen versprechen, müssen sich lange vor Vertragsende mit sich ändernden Preisen konfrontiert sehen. Das Erfordernis zusätzlicher Sicherheit bei steigenden Engagements bietet Bankern die Möglichkeit, Verluste einzudämmen, bevor ein ungünstiger Markt zu einem Zahlungsausfall führt."
 bfl_margining_tip: "#T Margen- und Risikomanagement#!\nFordern Sie Sicherheiten und Nachschusszahlungen für das sich ändernde Rohstoffrisiko. Erfordert Margin- und Risikomanagement-Forschung, Handelsfinanzierung und das Zeitalter der Revolutionen. Die durch Waren gesicherte Margin-Ausführung ist in diesem Build nicht verfügbar."
 bfl_market_company_requirement: "Unternehmensaktien erfordern eine Analyse von Auslandsinvestitionen und Unternehmensaktien. Bankaktien nutzen den Aktienhandel."
 bfl_market_funds_requirement: "Ihre Bank kann sich Aktien im Rahmen ihrer Barmittel-, Kapital- und Eigentumsgrenzen leisten."
 bfl_market_holder_requirement: "Der Emittent verfügt über einen freien Aktionärsplatz oder verzeichnet Ihre kaufende Bank bereits als Aktionär."
 bfl_market_portfolio_requirement: "Ihre kaufende Bank verfügt über einen freien Depotplatz oder hält diese Sicherheit bereits."
 bfl_market_sort_price: "Sortieren nach Preis pro Aktie"
 bfl_mediceo_maintenance: "Verwaltung der Banco Mediceo"
 bfl_medici_decline: "Unsere Staatskasse hat andere Aufgaben."
 bfl_medici_desc: "Von ihren steinernen Palästen aus lenken die Medici ein Kreditnetz über Italien und die Alpen hinaus. Ein ständiges Haus in Mailand würde ihre Schreiber und Reserven unserem Hof näherbringen. Für eine Konzession und eine Einlage von zweitausend Dukaten bietet die Bank an, ihr Schicksal mit unserem Staatskredit zu verbinden und ihre bestehenden Konten und Verpflichtungen zu bewahren."
 bfl_medici_fund: "Abonnieren 2,000 Dukaten zeichnen und die Konzession erteilen."
 bfl_medici_funding_tt: "Übertragen 2,000 Dukaten an die Medici-Bank übertragen und sie zu unserer konzessionierten Bank machen. Das Banco Mediceo in Mailand und fertige Bankfilialen in Mailand und unserer heutigen Hauptstadt errichten. Bestehende Kredite und Verpflichtungen bleiben erhalten. Eine bereits von einem anderen Herrscher konzessionierte Bank kann nicht übernommen werden."
 bfl_medici_house_only: "Das Bankhaus ohne staatliche Einlage willkommen heißen."
 bfl_medici_house_only_tt: "Das Gebäude Banco Mediceo in Mailand ohne Finanzierung oder Konzessionierung der Medici-Bank errichten."
 bfl_medici_title: "Das Banco Mediceo in Mailand"
 bfl_mendes_spice_house: "Das Haus Mendes"
 bfl_mendes_spice_house_desc: "Auf der anderen Seite der Meere binden die Faktoren des Mendes-Haushalts die Gewürzhäfen an die Zählhäuser Europas. Ihre Korrespondenz eröffnet Märkte für Pfeffer und Nelken, während der stetige Transport von Geldscheinen und Fracht einen Handel aufrechterhält, der über die Grenzen der Fürsten hinausgeht. Indem wir diesem Haus eine dauerhafte Verfassung verleihen, stellen wir seine Erfahrungen in den Dienst eines freieren Austauschs."
 bfl_monetary: "Geldpolitik und Liquidität"
 bfl_monetary_explanation: "Tauschen Sie Bargeld gegen reservierte Banknoten mit souveräner Autorität und einer vollwertigen Zentralbank. Diskontrechnungen Dritter nach Besicherung und Liquiditätsfazilitäten; Revolutions fügt eine finanzierte Mitgliedervernetzung und eine begrenzte öffentlich gesicherte Unterstützung hinzu. Akzeptierte Tarife bleiben unverändert."
 bfl_monetary_tip: "#T Geldinstrumente#!\nSpätere Genehmigungen für Staatsanleihen, gesicherte Liquidität, Clearing und öffentliche Unterstützung. Für jedes sind eigene Genehmigungen, Unterstützungs- und Betriebsbedingungen erforderlich."
 bfl_money_accept: "Akzeptanz und Rabatte umschalten"
 bfl_money_accept_tip: "Banknoten tauschen Bargeld gegen eine vollständig reservierte Forderung. Die Annahme ist freiwillig. Rabatte im Voraus 75 Gold gegen a 100-Gold-Drittbank-Schein. Das Clearing gleicht fällige Rechnungen nur dann aus, wenn jedes Mitglied seine Nettolast begleichen kann. Bestehende Ansprüche überdauern den Verlust von Behörden und Gebäuden."
 bfl_money_acceptance_action: "Die freiwillige Annahme ändern"
 bfl_money_authorize: "Notizen autorisieren"
 bfl_money_authorize_tip: "Der souveräne Controller autorisiert seine konzessionierte Bank. In der aktuellen Hauptstadt ist eine staatliche Zentralbank erforderlich. Neuemissionen erfordern außerdem die Kapitalaufnahme der Bankfiliale des Emittenten und eine Analyse der Schuldverschreibungen."
 bfl_money_clear: "Begleichen Sie die Rechnungen Ihrer Mitglieder"
 bfl_money_clear_open: "Clearing-Zulassung"
 bfl_money_clear_open_tip: "Öffnen oder schließen Sie die Zulassung zu Ihrer Clearing-Gruppe. Erfordert Revolutionen, Clearing House- und Advanced Clearing-Recherchen sowie ein fertiggestelltes Clearing House, das der Bank oder ihrem Live-Souverän gehört. Maximal vier Mitglieder."
 bfl_money_clear_tip: "Begleichen Sie einmal in diesem Monat die entsprechenden fälligen Mitgliederrechnungen. Jedes Mitglied muss seine Nettoschulden decken und gleichzeitig andere Rücklagen schützen. Ein kurzes Mitglied bewahrt den gesamten Stapel. Verpfändungen und Ansprüche Dritter sind ausgeschlossen."
 bfl_money_empty: "Keine Banknoten im Umlauf. Finanzielle Forschung, Autorität und fertiggestellte Gebäude erschließen neue Dienstleistungen."
 bfl_money_empty_tip: "Banknoten tauschen Bargeld gegen eine vollständig reservierte Forderung. Die Annahme ist freiwillig. Rabatte im Voraus 75 Gold gegen a 100-Gold-Drittbank-Schein. Das Clearing gleicht fällige Rechnungen nur dann aus, wenn jedes Mitglied seine Nettolast begleichen kann. Bestehende Ansprüche überdauern den Verlust von Behörden und Gebäuden."
 bfl_money_help: "Banknoten tauschen Bargeld gegen eine vollständig reservierte Forderung. Die Annahme ist freiwillig. Rabatte im Voraus 75 Gold gegen a 100-Gold-Drittbank-Schein. Das Clearing gleicht fällige Rechnungen nur dann aus, wenn jedes Mitglied seine Nettolast begleichen kann. Bestehende Ansprüche überdauern den Verlust von Behörden und Gebäuden."
