 bfl_request_deposit_withdrawal: "Fällige Einlagen abheben"
 bfl_request_deposit_withdrawal_act: "$bfl_request_deposit_withdrawal$"
 bfl_request_deposit_withdrawal_desc: "Ziehen Sie Ihre eigenen fälligen Forderungen zurück. Nicht bezahlte Beträge verbleiben in der Warteschleife der Verbindlichkeiten der Bank. Eine Auszahlung darf den ausgewiesenen Kapitalbetrag zuzüglich der gutgeschriebenen Zinsen nicht überschreiten."
