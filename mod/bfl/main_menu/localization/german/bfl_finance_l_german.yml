 bfl_strategy_automatic: "KI-Mandat · automatisch"
 bfl_strategy_credit: "Letzte Überprüfung: Kredit zur Einwilligung angeboten"
 bfl_strategy_delegated: "Anlageauftrag · delegiert"
 bfl_strategy_deposit: "Letzte Rezension: 100 Gold auf Nachfrage platziert"
 bfl_strategy_disable: "Verwalten Sie Investitionen"
 bfl_strategy_disable_tip: "Stoppen Sie automatische Kreditkäufe, neue Strategieangebote und Bedarfsplatzierungen. Bestehende Kredite, Einlagen und anstehende Forderungen werden weiterhin bedient. Waren-, Aktien- und Filialversicherung bleiben getrennt."
 bfl_strategy_enable: "Investitionen delegieren"
 bfl_strategy_enable_tip: "Genehmigen Sie bewertete Käufe bestehender einheimischer Kredite, Kredit- und Frachtangebote an geeignete KI-Kontrahenten sowie die Platzierung überschüssiger Bargeldnachfrage. Bei geringer Liquidität kann eine eigene Staatsanleihe notieren 98% vom Gesicht; Ein angenommener Weiterverkauf kann zu einem Verlust führen. Cargo verwendet Ihre aktuellen Geschäftsbedingungen und die übliche Einwilligung sowie die physische Abwicklung. Staatsanleihen, Dividenden, Güter und Währungsbehörden behalten ihre getrennten Richtlinien bei. Neue Geschäfte bleiben in der Abwicklung stehen."
 bfl_strategy_idle: "Letzte Überprüfung: einbehaltene Liquidität"
 bfl_strategy_manual: "Anlagemandat · Handbuch"
 bfl_strategy_recall: "Letzte Überprüfung: Rückruf der Anzahlung beantragt"
 bfl_strategy_resale: "Letzte Überprüfung: Für Liquidität wird eine eigene Anleihe angeboten"
 bfl_strategy_secondary_statement: "Automatische Käufe mit einheimischen Krediten: [Country.MakeScope.GetVariable('bfl_strategy_takeovers').GetValue|0] · Angebote für den Wiederverkauf von Anleihen: [Country.MakeScope.GetVariable('bfl_strategy_resales').GetValue|0]"
 bfl_strategy_secondary_tip: "Bestandskreditkäufe prüfen höchstens zwölf abgeschlossene Kapitalfilialkunden. Der Kreditnehmer braucht Liquidität, Ruhe, ein nicht negatives Budget und zumindest 0.50 Kreditwürdigkeit. Einkäufe bleiben erhalten 100 kostenloses Bargeld, Obergrenze der Akquisitionsprämie bei 25% des verbleibenden Kapitals und des gesamten Kreditnehmerengagements bei 25% des Eigenkapitals. Die erwartete monatliche Marge muss mindestens betragen 0.10 Gold nach der Prämie, einer Wartungspauschale und konservativen Finanzierungskosten. Dies ist eine Schätzung; Eine vorzeitige Rückzahlung und ein Zahlungsausfall können dennoch zu einem Verlust führen. Bei geringer Liquidität kann eine eigene Staatsanleihe notieren 98% von Gesicht durch eine abgeschlossene Börse. Vor der Zustimmung des finanzierten Käufers werden keine Weiterverkaufserlöse verbucht."
 bfl_strategy_statement: "Monatliche Rezensionen: [Country.MakeScope.GetVariable('bfl_strategy_reviewed').GetValue|0]/12  · Ergebnis: [Country.MakeScope.GetVariable('bfl_strategy_score').GetValue|2]\nKreditangebote: [Country.MakeScope.GetVariable('bfl_strategy_offers').GetValue|0]  · Einzahlungen getätigt: [Country.MakeScope.GetVariable('bfl_strategy_placements').GetValue|0]  · Erinnert sich: [Country.MakeScope.GetVariable('bfl_strategy_recalls').GetValue|0]"
 bfl_strategy_title: "Anlageauftrag"
 bfl_strategy_title_tip: "Ein konservatives monatliches Mandat. Prüfen Sie bis zu zwölf Kreditkandidaten, zwölf angeschlossene Venture-Betreiber mit jeweils vier Quellmärkten oder zwölf Depotbanken. Höchstens ein Kreditangebot, Frachtangebot bzw 100- monatliche Goldnachfrageplatzierung. Kredit- und Frachtangebote gelten für drei Monate. Für Fracht ist eine angegebene Marge von mindestens erforderlich 10% und ein Goldbanküberschuss, behält 500 kostenloses Bargeld und ist auf zwei aktive Vereinbarungen und begrenzt 25% Eigenkapital. Zitate können sich ändern; Verluste bleiben möglich. Geschützte Bargeld-, Recherche-, Zweigstellen- und Profilberechtigungen gelten weiterhin."
 bfl_strategy_venture: "Letzte Überprüfung: Frachtpartnerschaft zur Zustimmung angeboten"
 bfl_streamline_bank: "Optimieren Sie die Verwaltung · 100 Gold"
 bfl_streamline_bank_tip: "Bezahlen 100 Staatsgold einmal, um die festen Betriebskosten der Banken zu senken 10%. Die Charterreform, Banking und Advanced Clearing sorgen für zusätzliche Ermäßigungen. Durch diese Entscheidung entsteht kein Bankgewinn."
 bfl_subscribe_bank: "Abonnieren 100 Gold des Bankkapitals"
 bfl_subscribe_bank_act: "$bfl_subscribe_bank$"
 bfl_subscribe_bank_desc: "Finanziert aus Ihrer eigenen Kasse nach Profil-, Alters-, Recherche- und Registrierungsprüfungen. Kapital ist kein Bankgewinn. Bei einer Bankkapitalzeichnung werden Anteile zum aktuellen Nettoinventarwert erworben."
 bfl_subscribe_bank_effect_text: "$bfl_subscribe_bank$"
 bfl_subscribe_bank_effect_text_past: "$bfl_subscribe_bank$"
 bfl_suspend_command: "Neue Einzahlungen aussetzen"
 bfl_suspend_command_tip: "#T Neue Einzahlungen aussetzen#!\nHören Sie auf, neue Einlagen und Finanzierungsmaßnahmen anzunehmen, die die Annahme von Einlagen erfordern. Bestehende Konten, Zinsverpflichtungen und Auszahlungswünsche bleiben erfasst. Diese Kontrolle führt weder zur Schließung der Bank noch zum Schuldenerlass."
 bfl_term_accept: "Akzeptieren Sie diese festen Bedingungen"
 bfl_term_amount: "Festgeld"
 bfl_term_amount_desc: "Wählen Sie, wie viel Sie einzahlen möchten. Festgelder haben eine Laufzeit von zwölf Monaten."
 bfl_term_amount_tip: "Wählen Sie eine Bank und einen Betrag. Übertragen Sie Bargeld auf ein Konto. Zinsen und Auszahlungen gehören dem Einleger. Bei Ihrer Bestätigung prüft die Bank erneut die Mittel und Konditionen."
 bfl_term_decline: "Behalten Sie das bestehende Konto"
 bfl_term_deposit: "Festgeld"
 bfl_term_deposits_desc: "Händler können ihr Geld nicht immer auf einmal einsetzen. Indem sie es einem Bankhaus für eine vereinbarte Laufzeit anvertrauen, verschaffen sie dem Bankier eine stabilere Kapitalquelle und erhalten eine Entschädigung für den Verzicht auf sofortigen Zugriff auf ihre Mittel."
 bfl_term_offer_1_desc: "Erneuern Sie Ihre Reife [ROOT.GetCountry.MakeScope.GetVariable('bfl_deposit_offer_principal').GetValue|2] Goldkapital für 12 Monate bei [ROOT.GetCountry.MakeScope.GetVariable('bfl_deposit_offer_rate').GetValue|%1] jährlich. Aufgelaufene Zinsen bleiben gesondert geschuldet. Es wird kein neuer Auftraggeber übertragen. Dieses Angebot endet am Monatsende; geänderte Ansprüche erfordern ein neues Angebot."
 bfl_term_offer_1_title: "Fällige Festgeldeinlage erneuern"
 bfl_term_offer_2_desc: "Eine vorzeitige Auszahlung von in die Warteschlange stellen [ROOT.GetCountry.MakeScope.GetVariable('bfl_deposit_offer_principal').GetValue|2] Goldkapital nach der Stornierung [ROOT.GetCountry.MakeScope.GetVariable('bfl_deposit_offer_penalty').GetValue|2] Gold der aufgelaufenen Zinsen (höchstens 1% des Auftraggebers). Es kommt keine Hauptstrafe zur Anwendung. Bargelddefizite bleiben in der Auszahlungswarteschlange geschuldet. Dieses Angebot endet am Monatsende; geänderte Ansprüche erfordern ein neues Angebot."
 bfl_term_offer_2_title: "Vorzeitiges Auszahlungsangebot"
 bfl_term_service_1: "Erneuern Sie das erste fällige Laufzeitkonto"
 bfl_term_service_1_act: "$bfl_term_service_1$"
 bfl_term_service_1_desc: "Fordern Sie bei der ausgewählten Bank ein Laufzeitservice-Angebot an. Durch die Annahme bleiben unbezahlte Forderungen erhalten und die Losgenerierung wird erneut überprüft."
 bfl_term_service_1_effect_text: "$bfl_term_service_1$"
 bfl_term_service_1_effect_text_past: "$bfl_term_service_1$"
 bfl_term_service_1_tip: "Wählt Ihr erstes teilnahmeberechtigtes Laufzeitlos aus. Für die ausdrückliche Annahme legt die Bank feste Konditionen vor. Für die Verlängerung sind aktuelle Zulassungs- und Semestererlaubnisse erforderlich; Vorzeitiger Ausstieg und fristgerechter Austritt bleiben auch nach Beziehungs- oder Autoritätsverlust möglich. Geänderte oder abgelaufene Angebote können nicht ausgeführt werden."
 bfl_term_service_2: "Beantragen Sie einen vorzeitigen Rücktritt"
