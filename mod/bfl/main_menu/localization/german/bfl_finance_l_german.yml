 bfl_equity_vote_payout_0: "Mehrheitsvotum: 0% Dividendenausschüttung"
 bfl_equity_vote_payout_0_tip: "Erfordert mehr als die Hälfte der ausgegebenen Finanzstimmen. Nur Gewinnrücklagen des Unternehmens und Auszahlungsrichtlinie einer unabhängigen Bank. Die festgelegte Geld- und Auszahlungspolitik verbleibt beim Live-Land-Controller. Kein politischer Thementransfer."
