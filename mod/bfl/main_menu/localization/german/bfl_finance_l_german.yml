 bfl_florentine_altar: "Der Altar der Florentiner Kommune"
 bfl_florentine_altar_desc: "Ein Altarbild, das im Namen der Florentiner Gemeinde und nicht im Namen einer einzelnen Bankiersdynastie gestiftet wurde. Im Mittelpunkt stehen die Jungfrau und das Kind, begleitet vom Heiligen Johannes dem Täufer und dem Heiligen Franziskus; Darunter zeigen kleine Szenen Almosen, ehrliche Arbeit und die Erleichterung eines in Not geratenen Haushalts. Die zurückhaltende Vergoldung fängt das Licht der Kapelle ein, ohne die klaren Farben und die gemessenen Figuren zu überfordern. Die Lilie der Stadt erscheint unter den unteren Ornamenten, während keine Stifterfamilie den vordersten Platz beansprucht. Seine bescheidene Größe lädt zum Gottesdienst aus nächster Nähe ein und stellt die bürgerliche Wohltätigkeit als eine gemeinsame Verpflichtung und nicht als Denkmal für das Vermögen eines Hauses dar."
 bfl_florentine_choice_acciaioli: "Vertrauen Sie auf Acciaioli."
 bfl_florentine_choice_bardi: "Vertrauen Sie unseren öffentlichen Kredit den Bardi an."
 bfl_florentine_choice_cash: "Nehmen Sie einen Beitrag an und lassen Sie die Banken unabhängig."
 bfl_florentine_choice_cash_tt: "Empfangen 250 Dukaten. Die Banken behalten ihr Eigentum, ihre Satzungen, Gebäude und Konten."
 bfl_florentine_choice_desc: "Im Schatten der Signoria sind die großen Bankhäuser zu eigenständigen Mächten geworden. Ihre Angestellten wägen die Versprechen der Könige neben den Rechnungen der Tuchhändler ab, und der Kredit von Florenz wandert überall dorthin, wo ihre Faktoren einen Schreibtisch haben. Nun muss die Stadt entscheiden, ob sie eines dieser Häuser stärker an die Staatskasse bindet. Eine Charta würde ihre Erfahrung in unseren Dienst stellen, während ein neuer Palast den Handel in Stein gemeißelt verkünden würde. Dennoch möchten einige Stadträte heute lieber einen Beitrag leisten und die Bankiers ihren eigenen Angelegenheiten überlassen."
