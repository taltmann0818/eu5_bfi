 bfl_venture_accept: "Akzeptieren Sie die Partnerschaft"
 bfl_venture_accept_tip: "Überprüfen Sie noch einmal die Befugnisse der Live-Investoren, die unveränderten Angebotsbedingungen, das Alter, das Research, das freie Bargeld, das Kapital, die Kapazität und den Betreiberbeitrag. Durch die Finanzierung werden nur die tatsächlichen nativen Kosten der ausgewählten Aktivität bezahlt. Es gewährt keine Unternehmensanteile oder politische Kontrolle."
 bfl_venture_decline: "Ablehnen"
 bfl_venture_duration_12: "Dauer · 12 Monate"
 bfl_venture_duration_120: "Dauer · 120 Monate"
 bfl_venture_duration_24: "Dauer · 24 Monate"
 bfl_venture_duration_6: "Dauer · 6 Monate"
 bfl_venture_duration_60: "Dauer · 60 Monate"
 bfl_venture_duration_tip: "Zyklus 6, 12, 24, 60 oder 120 Monate. Lange Laufzeiten ermöglichen die Erkundung einheimischer Natur. Fracht wird nach zwei Monaten verkauft, wenn der einheimische Zugang gültig bleibt; Die blockierte Ladung bleibt in Gewahrsam. Expeditionskosten ohne damit verbundenen Verkaufserlös werden bei Fälligkeit abgeschrieben."
 bfl_venture_empty: "Keine aktiven Unternehmungen. Wählen Sie einen Frachtbetrieb oder eine einheimische Expedition aus, bevor Sie Konditionen anbieten."
 bfl_venture_help: "Klicken Sie auf einen Begriff, um ihn zu durchlaufen. Jeder Betreiber akzeptiert separat. Bestehende Vereinbarungen bleiben auch nach einer Richtlinien- oder Forschungsänderung bestehen."
 bfl_venture_hint: "Bewegen Sie den Mauszeiger über Aktivität, Kosten, Fracht und Retouren"
 bfl_venture_locked: "Neue Unternehmungen gesperrt · Warten Sie auf Anforderungen"
 bfl_venture_note: "Das Kapital wird vor dem Gewinn zurückgewonnen. Verluste folgen Beiträgen. Nur die erworbene Fracht des genannten Unternehmens kann seinen Erlös finanzieren. Unabhängiger Handel zahlt diese Vereinbarung niemals. Entdeckung allein zahlt sich nicht aus. Geschlossene Reihen bleiben bestehen, bis sie durch eine neu akzeptierte Vereinbarung ersetzt werden."
 bfl_venture_offer_desc: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_bank').GetCountry.GetName] Angebote [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_ticket').GetValue|0] Gold für [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_duration').GetValue|0] Monate. Voreingestellt [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_preset').GetValue|0]: 0 = Investor investiert das gesamte Kapital, erhält 75% von Überschuss; 1 = Investor trägt zwei Drittel bei, Betreiber ein Drittel, Überschuss wird zu gleichen Teilen aufgeteilt. Zuerst wird das Kapital zurückgewonnen; Verluste folgen Beiträgen. Nur der tatsächliche Verkaufserlös des genannten Betriebes kann einen Gewinn abwerfen. Der Erfolg einer Exploration bietet eine Chance, niemals Gold. Dieses Angebot endet in drei Monaten."
 bfl_venture_offer_desc_0: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_bank').GetCountry.GetName] genehmigt bis zu [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_ticket').GetValue|0] Gold der Bankfinanzierung für [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_duration').GetValue|0] Monate. Kaufen 10 [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_good').Goods.GetNameWithNoTooltip] in [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_from').GetMarket.GetName], trage sie zwei Monate lang und verkaufe sie dann [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_to').GetMarket.GetName]. Die Bank übernimmt alle Kosten und Einnahmen [GuiScope.SetRoot(ROOT.GetCountry.MakeScope).ScriptValue('bfl_venture_offered_profit_fraction')|%1] des Überschusses. Den Rest behalten Sie.\n\nEs werden nur die tatsächlichen nativen Kosten berücksichtigt. Ungenutzte Mittel verbleiben bei der Bank. Das Kapital wird vor dem Überschuss zurückgewonnen; Verluste folgen Beiträgen. Nur der gemessene Verkaufserlös dieser Ladung erfüllt diese Vereinbarung. Unabhängiges Einkommen und Entdeckung zahlen nichts. Das Angebot endet in drei Monaten."
 bfl_venture_offer_desc_1: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_bank').GetCountry.GetName] genehmigt bis zu [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_ticket').GetValue|0] Gold der Bankfinanzierung für [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_duration').GetValue|0] Monate. Kaufen 10 [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_good').Goods.GetNameWithNoTooltip] in [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_from').GetMarket.GetName], trage sie zwei Monate lang und verkaufe sie dann [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_to').GetMarket.GetName]. Die Bank übernimmt zwei Drittel der Kosten; Sie zahlen ein Drittel. Die Bank erhält [GuiScope.SetRoot(ROOT.GetCountry.MakeScope).ScriptValue('bfl_venture_offered_profit_fraction')|%1] des Überschusses und Sie behalten den Rest.\n\nEs werden nur die tatsächlichen nativen Kosten berücksichtigt. Ungenutzte Mittel verbleiben bei der Bank. Das Kapital wird vor dem Überschuss zurückgewonnen; Verluste folgen Beiträgen. Nur der gemessene Verkaufserlös dieser Ladung erfüllt diese Vereinbarung. Unabhängiges Einkommen und Entdeckung zahlen nichts. Das Angebot endet in drei Monaten."
 bfl_venture_offer_desc_2: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_bank').GetCountry.GetName] genehmigt bis zu [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_ticket').GetValue|0] Gold der Bankfinanzierung für [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_duration').GetValue|0] Monate. Bereiten Sie die native Erkundung vor [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_area').GetArea.GetName] von [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_port').GetLocation.GetName] mit [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_explorer').GetCharacter.GetName]. Die Bank finanziert alle vereinbarten Goldkosten und -einnahmen [GuiScope.SetRoot(ROOT.GetCountry.MakeScope).ScriptValue('bfl_venture_offered_profit_fraction')|%1] des vertraglichen Überschusses. Den Rest behalten Sie. Für die Vorbereitung ist keine Rückerstattung möglich, auch nicht bei Stornierung. Sie übernehmen die Besatzung, den Unterhalt vor Ort und optionale Expeditionskosten außerhalb dieser Finanzierungsvereinbarung. Mit der verbleibenden Bankgenehmigung kann eine Ladung von zehn Einheiten von einem Markt in oder an der Grenze des entdeckten Gebiets finanziert werden, vorbehaltlich des örtlichen Zugangs. Nur der gemessene Umsatz dieser Fracht abzüglich der erfassten Vorbereitungs- und Frachtkosten kann den vertraglichen Überschuss decken. Entdeckung und unabhängiger Handel zahlen nichts. Das Angebot läuft in drei Monaten ab. "
 bfl_venture_offer_desc_3: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_bank').GetCountry.GetName] genehmigt bis zu [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_ticket').GetValue|0] Gold der Bankfinanzierung für [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_duration').GetValue|0] Monate. Bereiten Sie die native Erkundung vor [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_area').GetArea.GetName] von [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_port').GetLocation.GetName] mit [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_explorer').GetCharacter.GetName]. Die Bank finanziert zwei Drittel der vereinbarten Goldkosten; Sie zahlen ein Drittel. Die Bank erhält [GuiScope.SetRoot(ROOT.GetCountry.MakeScope).ScriptValue('bfl_venture_offered_profit_fraction')|%1] des Vertragsüberschusses und Sie behalten den Rest. Für die Vorbereitung ist keine Rückerstattung möglich, auch nicht bei Stornierung. Sie übernehmen die Besatzung, den Unterhalt vor Ort und optionale Expeditionskosten außerhalb dieser Finanzierungsvereinbarung. Mit der verbleibenden Bankgenehmigung kann eine Ladung von zehn Einheiten von einem Markt in oder an der Grenze des entdeckten Gebiets finanziert werden, vorbehaltlich des örtlichen Zugangs. Nur der gemessene Umsatz dieser Fracht abzüglich der erfassten Vorbereitungs- und Frachtkosten kann den vertraglichen Überschuss decken. Entdeckung und unabhängiger Handel zahlen nichts. Das Angebot läuft in drei Monaten ab. "
