 bfl_goods_accept_branch_tip: "Akzeptieren Sie die angezeigte Zwölfmonatsvereinbarung mit dem Zollamt. Monatlich finanzierte Zugangsgebühren gehen an den zustimmenden Gastgeber; Durch die Annahme entsteht kein Lagerbestand, keine Warenreklamation oder kein Sofortkauf."
 bfl_goods_accept_quote_tip: "Zahlen Sie den angezeigten Vertragspreis zuzüglich der separaten Depotgebühr von einem Gold an die Depotbank. Überprüfen Sie die Live-Unterstützung, den Preis, die Parteien, die Berechtigungen, den Zugang und die geschützten Mittel erneut. Geänderte oder veraltete Bedingungen bewegen kein Geld."
 bfl_goods_accept_transfer_tip: "Zahlen Sie den angezeigten Transferpreis an den aktuellen Inhaber. Überprüfen Sie den Inhaber, die Menge, die Losgenerierung, die Recherche, das Ablaufdatum und die Finanzierung erneut, bevor Sie den vorhandenen Beleg einmalig übertragen."
 bfl_goods_branch_desc: "Der Gastgeber bietet Zugang zu seinem Kapitalmarkt für 12 Monate bei 1 Gold pro Monat, gezahlt an den Gastgeber. Einheimische Einkäufe behalten ihre eigene Bargebühr; Hierbei handelt es sich um einen separaten Verwahrdienst. Der Zugang erfordert, dass der Gastgeber über ein eigenes Zollhaus und Ruhe verfügt. Unbezahlter Zugriff, Ablauf, Gebäudeverlust oder Krieg verhindern Neukäufe und Lieferungen. Der Gastgeber kann das örtliche Sorgerecht einfrieren; Es entstehen weder Bargeld noch Waren. Erneuern Sie die Verbindung mit demselben Host, um den Zugriff wiederherzustellen."
 bfl_goods_branch_title: "Verwahrungsvereinbarung des Zollamtes"
 bfl_goods_browser_desc: "Wählen Sie ein physisches Los aus, um dessen Angebot zu prüfen. Bestehende Inhaber können die Lieferung anfordern; Der zustimmende Zollhauswirt kann die unzugängliche Verwahrung einfrieren und nach erneutem Zugang freigeben. Bei Auswahl erfolgt keine Angebotsannahme."
 bfl_goods_browser_title: "Warenangebote und Sorgerechtsansprüche"
 bfl_goods_claim_desc: "Fordern Sie die Lieferung dieser Quittung an Ihren Kapitalmarkt an. Die marktübergreifende Lieferung dauert zwei Monate und kostet 1 Gold und verliert 1% der Menge. Alternativ können Sie dieses Fenster schließen und in der Diplomatie die Option „Übertragung von Lagerbelegen anbieten“ verwenden. Übertragungen erfordern Revolutionen sowie Margining und Risikomanagement bei der Depotbank; Der Käufer muss ein aktuelles Angebot annehmen."
 bfl_goods_claim_title: "Ihr Lageranspruch"
 bfl_goods_close: "Schließen"
 bfl_goods_decline: "Ablehnen"
 bfl_goods_deliver: "Fordern Sie eine physische Lieferung an"
 bfl_goods_explanation: "Für finanziertes natives Inventar, gesicherte Quittungen und Weiterleitungen sind Merchant Finance, deren Vorschüsse und eine P09-Ausführungs-/Verwahrungsüberprüfung erforderlich. Belastete Waren können keinen zweiten Anspruch begründen."
 bfl_goods_forward_title: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_goods_quote_type').Goods.GetNameWithNoTooltip] physisch nach vorne"
 bfl_goods_inventory_empty: "Keine Ware in Verwahrung. Automatische Käufe beginnen mit dem nächsten berechtigten monatlichen Bankschluss."
 bfl_goods_inventory_hint: "Bewegen Sie den Mauszeiger über Waren, Mengen, Wert und Rückgabe"
 bfl_goods_inventory_note: "Indikativer einheimischer Verkaufswert; nicht realisierte Rendite gegen verbleibende bezahlte Kosten. Fremdeinnahmen sind von der Banksumme ausgeschlossen. Kosten, Verderb und verlorener Zugang wirken sich auf den Erlös aus. Scrollen Sie für jede gespeicherte Position."
 bfl_goods_inventory_subtitle: "Physische Verwahrung · indikativer Marktwert"
 bfl_goods_inventory_title: "Warenbestand"
 bfl_goods_next: "Nächste Lose"
 bfl_goods_policy_allocation_0: "Zuordnung · 0%"
 bfl_goods_policy_allocation_10: "Zuordnung · 10%"
 bfl_goods_policy_allocation_25: "Zuordnung · 25%"
 bfl_goods_policy_allocation_50: "Zuordnung · 50%"
 bfl_goods_policy_button: "Politik"
 bfl_goods_policy_contracts_0: "Verträge · Nur Spot"
 bfl_goods_policy_contracts_1: "Verträge · Angebotsbelege"
 bfl_goods_policy_contracts_2: "Verträge · Angebot vorwärts"
 bfl_goods_policy_help: "Klicken Sie auf eine Einstellung, um zu wechseln. Die Bank wählt Waren und Mengen zum Monatsabschluss aus. Bewegen Sie den Mauszeiger über jede Einstellung, um die Regeln anzuzeigen."
 bfl_goods_policy_mandate_0: "Mandat · Pausiert"
 bfl_goods_policy_mandate_1: "Mandat · Automatisch"
 bfl_goods_policy_mandate_2: "Mandat · Weglaufen"
 bfl_goods_policy_risk_0: "Risiko · Vorsicht"
 bfl_goods_policy_risk_1: "Risiko · Ausgewogen"
 bfl_goods_policy_risk_2: "Risiko · Abenteuerlich"
 bfl_goods_policy_turnover_12: "Halten Sie durch · 12 Monate"
 bfl_goods_policy_turnover_24: "Halten Sie durch · 24 Monate"
 bfl_goods_policy_turnover_6: "Halten Sie durch · 6 Monate"
 bfl_goods_previous: "Vorherige Lose"
 bfl_goods_quote_desc: "Menge: [ROOT.GetCountry.MakeScope.GetVariable('bfl_goods_quote_quantity').GetValue|3]. Preis: [ROOT.GetCountry.MakeScope.GetVariable('bfl_goods_quote_price').GetValue|2] Gold plus 1 Goldverwahrungsgebühr. Ein Lagerschein besitzt die Ware sofort. Durch einen physischen Forward ist die Lieferung innerhalb von drei Monaten vollständig vorfinanziert. Beide erfordern gesicherte Waren. Lagerkosten 0.1 pro Monat; körperlicher Verlust ist 2% jährlich. Ein Forward behält seine feste Menge: fehlende Einheiten werden anteilig erstattet, zuzüglich der gleichen Sicherheitsentschädigung des Verkäufers. Die Lieferung in einen anderen Markt dauert zwei Monate und kostet 1 Gold und verliert 1% der Menge. Lager- und Transportverluste reduzieren die Belegmenge. Ungültige Parteien oder verlorener Zugang bewahren Waren und Sicherheiten zur Wiedereinziehung auf. Akzeptieren Sie nur, wenn diese Bedingungen für Sie in Frage kommen."
 bfl_goods_quote_title: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_goods_quote_type').Goods.GetNameWithNoTooltip] Lagerbeleg"
 bfl_goods_set_allocation_tip: "Zyklus 0%, 10%, 25% oder 50% Bankbargeld plus Kosten für eigene Lagerbestände. Geschütztes Bargeld bleibt immer erhalten. Durch die Reduzierung der Zuteilung werden zugängliche freie Positionen verkauft, bis sie unter dem Zielwert liegen."
 bfl_goods_set_contracts_tip: "Nur Spot, bieten Sie automatisch Quittungen an oder bieten Sie automatisch physische Forwards an. Angebote erfordern das Alter und die Forschung des Instruments, bleiben gesichert und warten auf die separate Annahme durch die Gegenpartei. Bestehende übernommene Verpflichtungen bleiben geschützt."
 bfl_goods_set_mandate_tip: "Automatisch: Kaufen und verkaufen Sie im Rahmen Ihrer Police. Pausiert: keine diskretionären Trades. Auslaufen: Verkaufen Sie zugänglichen kostenlosen Bestand, ohne ihn zu ersetzen. Bestehende Verträge, Lagerung und Verluste bleiben in allen Modi bestehen."
 bfl_goods_set_risk_tip: "Vorsicht: Gewinn mitnehmen +10%, Stop-Loss −5%. Ausgewogen: +20% / −15%. Abenteuerlich: +35% / −25%. Limits nutzen native Verkaufsangebote gegen Restkosten; Die Ausführung erfolgt monatlich und die Preise können sich ändern."
 bfl_goods_set_turnover_tip: "Maximale Haltedauer: 6, 12 oder 24 Monate. Die Bank verkauft bei Ablauf verfügbare freie Positionen und wählt automatisch neue Waren aus."
 bfl_goods_settings: "Handelspolitik"
 bfl_goods_settings_tip: "Legen Sie das Mandat, die Allokation, die Risikolimits, die Haltedauer und die Vertragspolitik der Bank fest. Die Bank wählt alle Waren und Mengen bei ihrem Monatsabschluss aus."
 bfl_goods_tip: "#T Waren und Handel#!\nMerchant-Finance-Instrumente, die Inventar, Quittungen, zukünftige Lieferungen und Marge umfassen. Eine eingetragene Genehmigung schafft keine Waren oder einen Handelsweg; körperliche Hinrichtung ist erforderlich."
 bfl_goods_trading_locked: "Handel gesperrt · Bewegen Sie den Mauszeiger über die Anforderungen"
 bfl_goods_transfer_desc: "Preis: [ROOT.GetCountry.MakeScope.GetVariable('bfl_goods_transfer_price').GetValue|2] Gold. Menge: [ROOT.GetCountry.MakeScope.GetVariable('bfl_goods_transfer_quantity').GetValue|3]. Ihre Zahlung geht an den aktuellen Inhaber. Die Verwahrung verbleibt bei der Bank; Die Lager-, Verderb- und Lieferbedingungen bleiben bestehen. Die Annahme lehnt geänderte Träger, Inhaber, Losgenerierung oder Preise ab."
 bfl_goods_transfer_title: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_goods_transfer_type').Goods.GetNameWithNoTooltip] Quittung übertragen"
 bfl_grant_goods_branch: "Bieten Sie Zugang zum Zollamt an"
 bfl_grant_goods_branch_act: "$bfl_grant_goods_branch$"
 bfl_grant_goods_branch_desc: "Prüfen Sie Angebote zur physischen Verwahrung, bestehende Ansprüche oder eine freiwillige Vereinbarung über den Zugang zum Zollamt. Durch die Auswahl eines Landes wird kein Geld bewegt."
 bfl_grant_goods_branch_effect_text: "$bfl_grant_goods_branch$"
 bfl_grant_goods_branch_effect_text_past: "$bfl_grant_goods_branch$"
 bfl_grimaldi_albergo: "Das Grimaldi Albergo"
 bfl_grimaldi_albergo_desc: "Gemeinsame Artikel binden die Grimaldi-Haushalte zu einer fortlaufenden Körperschaft. Die Ältesten der Familie regeln ihre gemeinsamen Pflichten und bewahren ihre Kreditwürdigkeit über die Schicksale eines einzelnen Zweigs hinaus."
 bfl_historical_bank_independent: "Lassen Sie die Bank ein gewöhnliches Institut bleiben."
 bfl_history_empty: "Die Geschichte beginnt mit der nächsten Monatsabrechnung."
 bfl_investment_bank: "Investmentbank"
 bfl_investment_bank_desc: "Während der Handel entfernte Königreiche in einen gemeinsamen Austausch einbezieht, muss die Bank über die Straßen rund um ihr Kontorhaus hinausblicken. Seine Korrespondenten sammeln die Versprechen von Kaufleuten und Fürsten ein, während erfahrene Partner nach Unternehmungen über die Meere suchen. Der Unterhalt einer größeren Einrichtung ist kostspielig, doch ihr Ruf erfordert bessere Konditionen für das ihr anvertraute Kapital."
 bfl_investment_tab: "Kredite und Investitionen"
 bfl_investment_title: "Kreditvergabe"
 bfl_invite_equity_capital: "Fügen Sie Eigenkapital der Bank hinzu"
 bfl_invite_equity_capital_desc: "Abonnieren 100 Gold zu [ROOT.GetCountry.MakeScope.GetVariable('bfl_capital_issuer').GetCountry.GetName] aus der ausgewählten Schatzkammer oder Nachlassmappe. Der Zeichner erhält neue Aktien zum Marktpreis. Nachlassbrieftaschen behalten zumindest 25 Gold. Finanzielles Eigentum, zukünftige Dividenden und Verwässerung richten sich nach den gezahlten Aktien."
 bfl_invite_equity_capital_tip: "Wählen Sie die Schatzkammer oder ein Nachlass-Wallet zum Abonnieren 100 Gold zum aktuellen Nettoinventarwert der Bank. Neue Aktien verwässern bestehende Inhaber; die Bank erhält die Zahlung."
 bfl_join_clearing_group: "Treten Sie einer Clearinggruppe bei"
 bfl_join_clearing_group_act: "$bfl_join_clearing_group$"
 bfl_join_clearing_group_command: "$bfl_join_clearing_group$"
 bfl_join_clearing_group_command_desc: "$bfl_join_clearing_group_desc$"
 bfl_join_clearing_group_desc: "Treten Sie einem Betreiber bei, der Mitglieder akzeptiert. Vier Banken pro Gruppe; Abgeglichene Rechnungen mit fälliger Zahlung werden durch gedeckte Nettolastschrift beglichen. Ein kurzes Mitglied blockiert den Batch, ohne Ansprüche zu löschen."
 bfl_join_clearing_group_effect_text: "$bfl_join_clearing_group$"
 bfl_join_clearing_group_effect_text_past: "$bfl_join_clearing_group$"
 bfl_join_clearing_group_tip: "Wählen Sie einen recherchierten Clearing-Betreiber, der Mitglieder akzeptiert. Revolutionen, Clearing House und Advanced Clearing-Forschung sind erforderlich. Bis zu vier Banken treten explizit bei; Ein kurzes Mitglied behält alle Ansprüche."
 bfl_liabilities_detail_title: "Verbindlichkeiten von [Country.GetName]"
 bfl_liabilities_label: "Verbindlichkeiten"
 bfl_liabilities_label_tip: "#T Gesamtschulden#!\nAuf den Konten der Bank erfasste Verpflichtungen. Dies ist unabhängig von den einheimischen Krediten und Anleihen Ihres Staates.\n\nEinzahlungskapital: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_deposit_principal')|2]@gold!\nGutgeschriebener Einlagenzins: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_deposit_interest')|2]@gold!\nAusstehende Notizen: [Country.MakeScope.GetVariable('bfl_notes_outstanding').GetValue|2]@gold!\nSonstige Verbindlichkeiten: [Country.MakeScope.GetVariable('bfl_other_payables').GetValue|2]@gold!\nGesamt: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_liabilities')|2]@gold!\n\nAbhebungen in der Warteschlange von [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_withdrawals_due')|2]@gold! sind bereits Bestandteil der Kautionsforderungen und werden nicht noch einmal hinzugerechnet."
 bfl_liquidity_facilities: "Liquiditätsfazilitäten"
 bfl_liquidity_facilities_desc: "Selbst ein zahlungsfähiges Bankhaus ist möglicherweise nicht in der Lage, jeden Münzbedarf auf einmal zu decken. Befristete Vorschüsse auf solide Vermögenswerte können diesen Mangel überbrücken, sofern die Unterstützung keine Verluste verbirgt, die das Institut nicht tragen kann."
 bfl_liquidity_warning: "Die Liquidität der Banken erfordert Aufmerksamkeit"
 bfl_liquidity_warning_desc: "Ihre Bank hat Abhebungen in der Warteschlange oder verfügt über nicht genügend Kapital. Open Economy → Banking & Finance zur Überprüfung von Einlagen und Rekapitalisierung."
