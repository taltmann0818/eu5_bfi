 bfl_estate_bond_desc: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_managed_estate').GetCountry.GetName] schuldet [ROOT.GetCountry.MakeScope.GetVariable('bfl_estate_bond_face').GetValue|2] Schulleiter und [ROOT.GetCountry.MakeScope.GetVariable('bfl_estate_bond_due').GetValue|2] unbezahlte Gutscheine an [ROOT.GetCountry.MakeScope.GetVariable('bfl_estate_bond_holder').GetCountry.GetName]. Die Bargeldrückgewinnung teilt sich die unbesicherte Klasse mit Einlagen. Eine freiwillige Reduzierung erfordert einen neuen Vorschlag und die ausdrückliche Zustimmung dieses Inhabers; Zahlungen oder ein Wechsel des Treuhänders machen ausstehende Bedingungen ungültig."
