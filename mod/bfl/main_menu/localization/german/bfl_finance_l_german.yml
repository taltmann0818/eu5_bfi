 bfl_fuggerhauser_desc: "Die hinter dieser Augsburger Fassade geführten Hauptbücher binden fürstliche Schulden aus dem Kupferhandel. Das Haus reduziert den Fremdkapitalzins seines Eigentümers um einen halben Prozentpunkt. Sein Kupfergeschäft erhöht die Nachfrage auf dem lokalen Markt und stützt den Kupferpreis, sofern Angebot und Nachfrage dies zulassen."
