 STATIC_MODIFIER_DESC_bfl_company_exploration_capacity: "Kapazität für 500 Seeleute, solange ein Explorationsauftrag genehmigt ist. Die Matrosen müssen vom Unternehmen kommen oder eine finanzierte Übertragung von dessen politischem Vorgesetzten erhalten."
 STATIC_MODIFIER_DESC_bfl_dhe_annual_giro: "Die Bank kann noch ein weiteres Jahr bestehen bleiben, wobei ihre Autorität weiterhin vom Senat abhängt."
 STATIC_MODIFIER_DESC_bfl_dhe_balanced_captains: "Ein gemeinsames Magistrat gleicht konkurrierende Häuser aus, unterstützt den Handel und teilt gleichzeitig die öffentlichen Einnahmen auf."
 STATIC_MODIFIER_DESC_bfl_dhe_banker_captains: "Die Bankiersfamilien haben einen festen Einfluss auf die Ämter und Einnahmen der Republik erlangt."
 STATIC_MODIFIER_DESC_bfl_dhe_bardi_patronage: "Die Pracht der Familienkapelle verleiht dem Bankhaus etwas Besonderes."
 STATIC_MODIFIER_DESC_bfl_dhe_bubble_contagion: "Der Zusammenbruch spekulativer Zeichnungen schwächt das Vertrauen in die börsennotierten Aktien der Bank."
 STATIC_MODIFIER_DESC_bfl_dhe_bubble_restructuring: "Die Rettung stärkt das Vertrauen in die Bank, während die Verwaltung der sanierten Konten ihre Kosten erhöht."
 STATIC_MODIFIER_DESC_bfl_dhe_city_concessions: "Der Beitrag der Kaufleute zur Bank wurde durch Konzessionen an die Stadt gesichert."
 STATIC_MODIFIER_DESC_bfl_dhe_civic_neutrality: "Die Signoria verlangt von ihrer Bank, dass sie die Kommune parteiübergreifend bedient."
 STATIC_MODIFIER_DESC_bfl_dhe_civic_notaries: "Die Notare der Republik führen eine klarere öffentliche Darstellung des Bankenvertrags."
 STATIC_MODIFIER_DESC_bfl_dhe_credit_contraction_1772: "Das Scheitern privater Kredite belastet den Handel und die damit verbundenen Einnahmen."
 STATIC_MODIFIER_DESC_bfl_dhe_credit_relief_1772: "Das Finanzministerium hat Ressourcen bereitgestellt, um die Kreditwürdigkeit während der Krise zu stabilisieren."
 STATIC_MODIFIER_DESC_bfl_dhe_discount_1772: "Fachsachbearbeiter prüfen neue Kreditgeschäfte genauer und verbessern so die Konditionen bei höheren wiederkehrenden Kosten."
 STATIC_MODIFIER_DESC_bfl_dhe_english_court_accounts: "Königliche Verbindungen unterstützen profitablere neue Kreditangebote, erfordern jedoch einen teuren Gerichtsbesuch."
 STATIC_MODIFIER_DESC_bfl_dhe_english_wool_factors: "Faktoren folgen dem englischen Wollhandel und unterhalten Handelsbeziehungen und ihr eigenes teures Haus."
 STATIC_MODIFIER_DESC_bfl_dhe_european_factors: "Ein breiteres Spektrum von Faktoren verbindet die Bank mit mehreren Gerichten und Märkten."
 STATIC_MODIFIER_DESC_bfl_dhe_exchequer_register: "Das Finanzministerium führt sein eigenes Register und wahrt so seine Unabhängigkeit auf Kosten von Spannungen mit der Stadt."
 STATIC_MODIFIER_DESC_bfl_dhe_farmed_excises: "Private Sammler garantieren die Verbrauchsteuern und verlangen ihren Preis vom Handel."
 STATIC_MODIFIER_DESC_bfl_dhe_florentine_settlement: "Eine öffentliche Einigung hilft dem Handel, sich zu erholen, während gleichzeitig die Staatskasse für die alten Streitigkeiten belastet wird."
 STATIC_MODIFIER_DESC_bfl_dhe_giro_measured_specie: "Eine kleinere Einrichtung bietet eine maßvolle Unterbringung bei fortlaufenden Kosten für die Bank."
 STATIC_MODIFIER_DESC_bfl_dhe_giro_senate: "Der Senat akzeptiert eine fortdauernde öffentliche Gebühr für sein dauerhaftes Bankinstitut."
 STATIC_MODIFIER_DESC_bfl_dhe_giro_specie: "Treasury-Reserven und besetzte Schalter untermauern den Ruf der neuen Anlage."
 STATIC_MODIFIER_DESC_bfl_dhe_giro_transfer_office: "Der Giro bevorzugt kostengünstige Buchübertragungen, obwohl die Händler eine breitere Zahlungsmöglichkeit fordern."
 STATIC_MODIFIER_DESC_bfl_dhe_giro_winddown: "Das Ende des Neugeschäfts beim Giro stört Händler, die an seine Transferbücher gewöhnt sind."
 STATIC_MODIFIER_DESC_bfl_dhe_grimaldi_concessions: "Die Republik hat im Gegenzug für den Fortbestand des Grimaldi-Konzerns Familienprivilegien anerkannt."
 STATIC_MODIFIER_DESC_bfl_dhe_guelph_compact: "Die angestammten Bündnisse der Bardi binden die öffentliche Anerkennung an die Freunde des Papsttums."
 STATIC_MODIFIER_DESC_bfl_dhe_hired_halls: "Verstreute Büros und überfüllte Schalter erhöhen die Kosten der wachsenden Bank."
 STATIC_MODIFIER_DESC_bfl_dhe_imperial_accounts: "Der Besuch des kaiserlichen Hofes begünstigt neue Kreditkonditionen und erhöht die Kosten für die Geschäfte der Bank."
 STATIC_MODIFIER_DESC_bfl_dhe_italian_concentration: "Die Bank reduziert ihre Fernverbindlichkeiten und die Kosten für deren Aufrechterhaltung."
 STATIC_MODIFIER_DESC_bfl_dhe_military_giro: "Die Republik räumt Militärkonten Vorrang vor den gewöhnlichen Geschäften ihrer Kaufleute ein."
 STATIC_MODIFIER_DESC_bfl_dhe_notarial_albergo: "Bürgernotare bringen die Pflichten der Familie in eine gemeinsame, überwachte Ordnung."
 STATIC_MODIFIER_DESC_bfl_dhe_old_litigation: "Die ungelösten Schulden der großen Bankhäuser behindern weiterhin den Handel."
 STATIC_MODIFIER_DESC_bfl_dhe_ordered_books: "Erfahrene Sachbearbeiter bringen die verstreuten Konten der Bank in Ordnung."
 STATIC_MODIFIER_DESC_bfl_dhe_parish_burden: "Die Gemeinden und Stadtteile erhalten Hilfsgelder, deren Finanzierung die Staatskasse jedoch ablehnt."
 STATIC_MODIFIER_DESC_bfl_dhe_partners_levy: "Die Partner zahlen eine außerordentliche Abgabe, wodurch öffentliche Ressourcen auf Kosten ihres gesamten Geschäfts geschont werden."
 STATIC_MODIFIER_DESC_bfl_dhe_permanent_giro: "Der Giro verfügt über eine geregelte Verwaltung anstelle einer Reihe auslaufender Mandate."
 STATIC_MODIFIER_DESC_bfl_dhe_plague_accounts: "Die Bank muss zusätzliche Register und Sachbearbeiter für die Nothilfemittel führen."
 STATIC_MODIFIER_DESC_bfl_dhe_public_bubble_relief: "Die Kosten für die Wiederherstellung des Vertrauens nach dem Zusammenbruch der Abonnements trägt die öffentliche Hand."
 STATIC_MODIFIER_DESC_bfl_dhe_public_register: "Öffentliche Zeichnungen und Übertragungen werden im Rahmen einer vereinbarten Vereinbarung mit der Bank erfasst."
 STATIC_MODIFIER_DESC_bfl_dhe_register_clerks: "Ein festes Personal führt das öffentliche Aktienregister und zahlt die Dividenden aus."
 STATIC_MODIFIER_DESC_bfl_dhe_republic_first: "Die Republik bevorzugt ihre eigenen Einnahmen gegenüber den diplomatischen Vorteilen ausländischer Gerichtskonten."
 STATIC_MODIFIER_DESC_bfl_dhe_reserves_1772: "Ein öffentlicher Beitrag stärkt das Vertrauen in die Reserven der Bank."
 STATIC_MODIFIER_DESC_bfl_dhe_retained_earnings: "Neue Erträge verbleiben in der Bank und werden nicht an die Eigentümer ausgeschüttet. Mit Ablauf dieser Vereinbarung gilt die bisherige Dividendenpolitik wieder, es sei denn, es wurde eine andere Politik beschlossen."
 STATIC_MODIFIER_DESC_bfl_dhe_separate_offices: "Banker müssen mit Beamten verhandeln, anstatt ihre eigenen Staatsangelegenheiten zu regeln."
 STATIC_MODIFIER_DESC_bfl_dhe_south_sea_failures: "Fehlgeschlagene Abonnements und angefochtene Schulden unterbrechen den normalen Geschäftsbetrieb der Stadt."
 STATIC_MODIFIER_DESC_bfl_dhe_threadneedle_merchants: "Die Eigentümer haben für einen dauerhaften Flügel und ein effizienteres Bankhaus bezahlt."
 STATIC_MODIFIER_DESC_bfl_dhe_threadneedle_public: "Eine ständige öffentliche Einrichtung unterstellt die Abteilungen der Bank einer geordneten Verwaltung."
 STATIC_MODIFIER_DESC_bfl_dhe_ungilded_accounts: "Öffentliche Mittel wurden auf den Konten verwahrt und nicht für die Schirmherrschaft der Familie ausgegeben."
 STATIC_MODIFIER_DESC_bfl_dhe_venetian_relief: "Öffentliche Mittel unterstützen den zivilen Handel und belasten gleichzeitig die Einnahmen der Republik."
 STATIC_MODIFIER_DESC_bfl_dhe_war_accounts: "Der Giro verfügt über eine separate und kostspielige Verwaltung für Militärzahlungen."
