 bfl_custom_bond_terms: "Kupons auf neue Anleihen"
 bfl_custom_bond_totals: "Hervorragend: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bfl_bond_debt')|2]@gold! · monatlicher Coupon: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bfl_bond_monthly_coupon')|2]@gold! · unbezahlt: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bfl_bond_arrears')|2]@gold!"
 bfl_custom_bonds_title: "Staatsanleihen"
 bfl_custom_bonds_title_tip: "Die Bank leiht dem Staat Bargeld und erhält eine Anleihe. Der Eigentümer erhält monatlich Zinsen und Tilgung. Die Gesamtkreditaufnahme ist begrenzt auf 24 Monate einheimisches Einkommen, mit a 500-goldene Einstiegsvergütung. Obligationenzinsen können höchstens verwendet werden 25% des einheimischen Einkommens. Nicht gezahlte Zinsen blockieren neue Anleihen und Verkäufe."
 bfl_cycle_bond_rate_tip: "Jahreszins für neue Anleihen ändern: 1%, 3% oder 6%. Bestehende Anleihen behalten ihren Zinssatz."
 bfl_cycle_deposit_rate_tip: "Zinsen für neue Einlagen ändern: 0%, 1% oder 2% ein Jahr. Bestehende Konten behalten ihren Tarif."
 bfl_cycle_facility_tip: "Ändern Sie die monatliche Finanzierung: Aus, Ausgaben oder Bargeldpuffer. Ausgaben finanzieren einen Teil der Staatsausgaben. Der Bargeldpuffer füllt die Staatskasse auf. Bei der manuellen Kreditaufnahme teilen sich beide das monatliche Limit."
 bfl_cycle_payout_tip: "Dividenden ändern: gesamten Gewinn einbehalten, auszahlen 25%, oder bezahlen 50%. Bei den Zahlungen wird der erwirtschaftete Gewinn nach Kosten und Verlusten verwendet. Erfordert die Kontrolle der Dividendenpolitik."
 bfl_cycle_share_offering_tip: "Neue Aktienabonnements eröffnen oder schließen. Durch bezahlte Abonnements werden Kapital und neue Aktien hinzugefügt; Die bestehenden Eigentümer behalten ihre Anteile und Dividendenrechte."
 bfl_dealer_inventory_class: "Market-Maker-Inventar · keine Stimmen"
 bfl_debt: "Natives Schuldenportfolio"
 bfl_debt_explanation: "Die zugelassene Bank finanziert maßgeschneiderte Staatsanleihen. Der Sekundärhandel erfordert abgeschlossene Börsen auf beiden Seiten, einschließlich frühzeitiger Zuschüsse. Native Credit nutzt akzeptierte Angebote und recherchierte Schuldenerleichterungen mit dauerhaften Anspruchsaufzeichnungen."
 bfl_debt_facility: "Schuldenfazilität"
 bfl_debt_resale: "Schuldenweiterverkauf"
 bfl_debt_resale_tip: "#T Weiterverkauf von Staatsanleihen#!\nFür den Verkauf und Kauf sekundärer Staatsanleihen sind ein Börsenvorschuss und ein eigenes Börsengebäude erforderlich. Ein offenes Angebot überträgt denselben Zollanspruch für 98% vom Nennwert; Der Emittent erhält keinen neuen Erlös. Gutscheine und Einlösung folgen dem Käufer."
 bfl_debt_restructuring: "Umschuldung"
 bfl_debt_restructuring_desc: "Eine Schuld, die am vereinbarten Termin nicht eingezogen werden kann, muss nicht wertlos sein. Gläubiger können ihre Forderungen besser schützen, wenn sie neuen Bedingungen zustimmen, als wenn sie einen notleidenden Schuldner in die völlige Zahlungsunfähigkeit drängen."
 bfl_debt_tip: "#T Schulden und Kredit#!\nGenehmigungen für Kreditvergabe, Übernahme, Umstrukturierung und Schuldenübertragung. Jede Zeile hat ihre eigenen Forschungs-, Spezialisierungs-, Liquiditäts- und Ausführungsanforderungen. Eine Sperre bedeutet, dass kein neuer Ursprung verfügbar ist. bestehende Ansprüche werden dadurch nicht aufgehoben."
 bfl_demand_deposit: "Sichteinlage"
 bfl_deposit_1: "Anzahlung 100 Gold auf Anfrage"
 bfl_deposit_1_tip: "#T Sichteinlage#!\nÜbertragen 100 Geben Sie das Gold bei Ihrer Vertragsbank an. Das Jahresangebot für Neukunden beträgt den angezeigten Basispreis plus a 1% Charterprämie. Bedarfszinsen werden bei Finanzierung monatlich an Ihre Kasse gezahlt, mit Cent-Carry; nicht gezahlte Zinsen bleiben geschuldet. Bestehende Konten behalten ihren akzeptierten Tarif. Beim Abheben werden Kapital und unbezahlte Zinsen zurückgezahlt. Unabhängige Banken akzeptieren Einlagen durch Diplomatie unter +50 Meinung oder besser und bieten Sie den Basispreis an."
 bfl_deposit_2: "Anzahlung 100 Gold für 12 Monate"
 bfl_deposit_2_tip: "#T Festgeld#!\nÜbertragen 100 Geben Sie Ihr Staatsgold zwölf Monate lang an Ihre zugelassene Bank weiter. Das Jahresangebot für Neukunden beträgt den angezeigten Laufzeitpreis plus a 1% Charterprämie. Die Zinsen fallen monatlich an und werden bei Fälligkeit mit dem Kapital ausgezahlt. Erfordert natives Banking, das zulässige Alter und einen freien Kontoplatz. Unabhängige Terminkonten sind über Diplomatie unter erhältlich +50 Meinung oder besser."
 bfl_deposit_accounts_heading: "Einlagenkonten"
 bfl_deposit_amount: "Anzahlung"
 bfl_deposit_amount_desc: "Wählen Sie, wie viel Sie einzahlen möchten. Festgelder haben eine Laufzeit von zwölf Monaten."
 bfl_deposit_amount_label: "Einzahlungsbetrag"
 bfl_deposit_amount_tip: "Wählen Sie eine Bank und einen Betrag. Übertragen Sie Bargeld auf ein Konto. Zinsen und Auszahlungen gehören dem Einleger. Bei Ihrer Bestätigung prüft die Bank erneut die Mittel und Konditionen."
 bfl_deposit_decline_tip: "Behalten Sie den gesamten Kautionsanspruch ein. Es werden keine Bargeldbewegungen durchgeführt und keine Aktien ausgegeben."
 bfl_deposit_equity_tip: "Wandeln Sie die börsennotierte Forderung nur dann in echte Aktien um, wenn die überlebende Bank über einen positiven materiellen Nettoinventarwert und eine positive Aktionärskapazität verfügt. Es werden keine Abonnementgelder oder Einnahmen generiert."
 bfl_deposit_explanation: "Jedes Konto speichert seinen akzeptierten festen Jahreszins. Die Änderung des Tarifs wirkt sich auf neue Konten aus. Terminkonten werden danach fällig 12 Monate. Entnahmeengpässe bleiben Verbindlichkeiten und setzen neue Verpflichtungen aus."
 bfl_deposit_haircut_tip: "Akzeptieren Sie das Zitat 20% Kürzung nach erneuter Gläubiger-, Restforderungs-, Recherche- und Vollmachtsprüfung. Eine eingetragene öffentliche Garantie bleibt separat finanziert."
 bfl_deposit_income_tip: "Fordern Sie Zinsen an, die in diesem Monat tatsächlich von Ihrer konzessionierten Bank und unabhängigen Banken gezahlt wurden. Nicht gezahlte Zinsen bleiben geschuldet. Kapitalbezüge und Kapitaleinlagen sind ausgeschlossen."
 bfl_deposit_interest: "Einzahlungszinsen"
 bfl_deposit_ledger_help: "Jedes Konto behält seinen vereinbarten Zinssatz. Termineinlagen haben eine Laufzeit von zwölf Monaten. Geld und Zinsen gehen an den Einleger zurück."
 bfl_deposit_ledger_subtitle: "Girokonten"
 bfl_deposit_ledger_title: "Einleger"
 bfl_deposit_ledger_title_tip: "Wer hat Geld auf dieser Bank? Bewegen Sie den Mauszeiger, um Konten und Abhebungen zu überprüfen."
 bfl_deposit_policy_title: "Einzahlungssatz"
 bfl_deposit_policy_title_tip: "Der jährliche Zinssatz für neue Einlagen. Bestehende Einlagen behalten ihren vereinbarten Zinssatz."
 bfl_deposit_total: "Einlagen"
 bfl_deposit_total_tip: "Geld, das die Bank ihren Einlegern schuldet, einschließlich unbezahlter Zinsen."
 bfl_deposits: "Einlagen und Zinssätze"
 bfl_deposits_label: "Kautionsansprüche"
 bfl_dev_notice: "Finanzierte Kredite, Staatsanleihen, Unternehmensinvestitionen, Waren, Commenda und Finanzdienstleistungen folgen ihren Forschungs-, Profil- und Bauanforderungen. Das Gleichgewicht und die Kompatibilität der veröffentlichungsweiten Kampagne werden noch überprüft."
 bfl_dhe_annual_giro: "Ein jährliches Mandat für den Giro"
 bfl_dhe_annual_giro_desc: "Die Bank kann noch ein weiteres Jahr bestehen bleiben, wobei ihre Autorität weiterhin vom Senat abhängt."
 bfl_dhe_annuity_tt: "Erstellen Sie eine finanzierte Staatsanleihe von 100@gold! von der Bank gehalten und zahlt einen festen Betrag 5% Jahresgutschein. Bestehende Anleihen behalten ihre Zinsen."
 bfl_dhe_approve_tt: "Die Meinung der Bank über uns steigt 15 und die Zufriedenheit der Bürger steigt 5 Prozentpunkte."
 bfl_dhe_audit_tt: "Bezahlen 100 Dukaten, um die Bücher der Bank neu zu ordnen. Die Kosten für die Bankverwaltung sinken 5 Prozentpunkte für 10 Jahre."
 bfl_dhe_balanced_captains: "Die ausgewogene Magistratur"
 bfl_dhe_balanced_captains_desc: "Ein gemeinsames Magistrat gleicht konkurrierende Häuser aus, unterstützt den Handel und teilt gleichzeitig die öffentlichen Einnahmen auf."
 bfl_dhe_banker_captains: "Die Banker-Kapitäne"
 bfl_dhe_banker_captains_desc: "Die Bankiersfamilien haben einen festen Einfluss auf die Ämter und Einnahmen der Republik erlangt."
 bfl_dhe_bardi_patronage: "Die Pracht der Bardi-Patronage"
 bfl_dhe_bardi_patronage_desc: "Die Pracht der Familienkapelle verleiht dem Bankhaus etwas Besonderes."
 bfl_dhe_bubble_contagion: "Die Bank und die gescheiterten Abonnements"
 bfl_dhe_bubble_contagion_desc: "Der Zusammenbruch spekulativer Zeichnungen schwächt das Vertrauen in die börsennotierten Aktien der Bank."
 bfl_dhe_bubble_restructuring: "Die Umstrukturierungskonten der Südsee"
 bfl_dhe_bubble_restructuring_desc: "Die Rettung stärkt das Vertrauen in die Bank, während die Verwaltung der sanierten Konten ihre Kosten erhöht."
 bfl_dhe_buyback_quote_tt: "Bankzahlung: [SCOPE.sCountry('bfl_event_bank').MakeScope.GetVariable('bfl_dhe_buy_price').GetValue|2]@gold!\nAnteile storniert: [SCOPE.sCountry('bfl_event_bank').MakeScope.GetVariable('bfl_dhe_buy_units').GetValue|3]\nNAV pro Aktie: [SCOPE.sCountry('bfl_event_bank').MakeScope.GetVariable('bfl_dhe_buy_nav').GetValue|3]@gold!"
 bfl_dhe_buyback_tt: "Die Bank zahlt der Staatskasse bis zu 5% seiner ausstehenden Anteile zum notierten Nettoinventarwert und löscht diese Anteile dann. Die Bank muss die Zahlung aus freiem Bargeld und Kapitalreserven decken. Andere Aktionäre behalten ihre Anteile."
 bfl_dhe_city_concessions: "Zugeständnisse an die Stadt"
 bfl_dhe_city_concessions_desc: "Der Beitrag der Kaufleute zur Bank wurde durch Konzessionen an die Stadt gesichert."
 bfl_dhe_civic_neutrality: "Eine Bank über den Fraktionen"
 bfl_dhe_civic_neutrality_desc: "Die Signoria verlangt von ihrer Bank, dass sie die Kommune parteiübergreifend bedient."
 bfl_dhe_civic_notaries: "Die Notare der Republik"
 bfl_dhe_civic_notaries_desc: "Die Notare der Republik führen eine klarere öffentliche Darstellung des Bankenvertrags."
 bfl_dhe_credit_contraction_1772: "Die Kontraktion des Kredits"
 bfl_dhe_credit_contraction_1772_desc: "Das Scheitern privater Kredite belastet den Handel und die damit verbundenen Einnahmen."
 bfl_dhe_credit_relief_1772: "Die Krediterleichterung des Finanzministeriums"
 bfl_dhe_credit_relief_1772_desc: "Das Finanzministerium hat Ressourcen bereitgestellt, um die Kreditwürdigkeit während der Krise zu stabilisieren."
 bfl_dhe_discount_1772: "Das überwachte Rabattbüro"
 bfl_dhe_discount_1772_desc: "Fachsachbearbeiter prüfen neue Kreditgeschäfte genauer und verbessern so die Konditionen bei höheren wiederkehrenden Kosten."
 bfl_dhe_english_court_accounts: "Die englischen Gerichtsberichte"
 bfl_dhe_english_court_accounts_desc: "Königliche Verbindungen unterstützen profitablere neue Kreditangebote, erfordern jedoch einen teuren Gerichtsbesuch."
 bfl_dhe_english_wool_factors: "Die englischen Wollfaktoren"
 bfl_dhe_english_wool_factors_desc: "Faktoren folgen dem englischen Wollhandel und unterhalten Handelsbeziehungen und ihr eigenes teures Haus."
 bfl_dhe_european_factors: "Die europäischen Faktoren von San Giorgio"
 bfl_dhe_european_factors_desc: "Ein breiteres Spektrum von Faktoren verbindet die Bank mit mehreren Gerichten und Märkten."
 bfl_dhe_exchequer_register: "Ein unabhängiges Finanzregister"
 bfl_dhe_exchequer_register_desc: "Das Finanzministerium führt sein eigenes Register und wahrt so seine Unabhängigkeit auf Kosten von Spannungen mit der Stadt."
 bfl_dhe_farmed_excises: "Verbrauchsteuern, die an private Sammler weitergegeben werden"
 bfl_dhe_farmed_excises_desc: "Private Sammler garantieren die Verbrauchsteuern und verlangen ihren Preis vom Handel."
 bfl_dhe_favored: "Unterstützte die Position der Bank"
 bfl_dhe_florentine_settlement: "Die öffentliche Abrechnung der alten Rechnungen"
 bfl_dhe_florentine_settlement_desc: "Eine öffentliche Einigung hilft dem Handel, sich zu erholen, während gleichzeitig die Staatskasse für die alten Streitigkeiten belastet wird."
 bfl_dhe_fund_tt: "Abonnieren 100 Dukaten aus der Kasse zum Nettoinventarwert der Bank. Erhalten Sie neu ausgegebene Aktien; bestehende Eigentümer werden proportional verwässert."
 bfl_dhe_giro_measured_specie: "Das Fenster „Gemessene Arten“."
 bfl_dhe_giro_measured_specie_desc: "Eine kleinere Einrichtung bietet eine maßvolle Unterbringung bei fortlaufenden Kosten für die Bank."
 bfl_dhe_giro_senate: "Die permanente Bankgebühr des Senats"
 bfl_dhe_giro_senate_desc: "Der Senat akzeptiert eine fortdauernde öffentliche Gebühr für sein dauerhaftes Bankinstitut."
 bfl_dhe_giro_specie: "Das öffentliche Artenfenster des Giro"
 bfl_dhe_giro_specie_desc: "Treasury-Reserven und besetzte Schalter untermauern den Ruf der neuen Anlage."
 bfl_dhe_giro_transfer_office: "Das öffentliche Transferbüro"
 bfl_dhe_giro_transfer_office_desc: "Der Giro bevorzugt kostengünstige Buchübertragungen, obwohl die Händler eine breitere Zahlungsmöglichkeit fordern."
 bfl_dhe_giro_winddown: "Das Ende des Giro"
 bfl_dhe_giro_winddown_desc: "Das Ende des Neugeschäfts beim Giro stört Händler, die an seine Transferbücher gewöhnt sind."
 bfl_dhe_grimaldi_concessions: "Die Zugeständnisse der Familie Grimaldi"
 bfl_dhe_grimaldi_concessions_desc: "Die Republik hat im Gegenzug für den Fortbestand des Grimaldi-Konzerns Familienprivilegien anerkannt."
 bfl_dhe_guelph_compact: "Der Bardi Guelph Compact"
 bfl_dhe_guelph_compact_desc: "Die angestammten Bündnisse der Bardi binden die öffentliche Anerkennung an die Freunde des Papsttums."
 bfl_dhe_hired_halls: "Überfüllte Mietsäle"
 bfl_dhe_hired_halls_desc: "Verstreute Büros und überfüllte Schalter erhöhen die Kosten der wachsenden Bank."
 bfl_dhe_imperial_accounts: "Die kaiserlichen Konten von San Giorgio"
 bfl_dhe_imperial_accounts_desc: "Der Besuch des kaiserlichen Hofes begünstigt neue Kreditkonditionen und erhöht die Kosten für die Geschäfte der Bank."
 bfl_dhe_issue_tt: "Die Bürger zahlen 100 Dukaten für neu ausgegebene Bankaktien zum Nettoinventarwert. Öffnen Sie die Bank für weitere Kapitalzeichnungen und notieren Sie ihre Aktien. Bestehende Eigentümer werden verwässert. Bei späteren Weiterverkäufen zahlt der Verkäufer."
 bfl_dhe_italian_concentration: "Eine italienische Konzentration"
 bfl_dhe_italian_concentration_desc: "Die Bank reduziert ihre Fernverbindlichkeiten und die Kosten für deren Aufrechterhaltung."
 bfl_dhe_military_giro: "Priorität für die Militärkonten"
 bfl_dhe_military_giro_desc: "Die Republik räumt Militärkonten Vorrang vor den gewöhnlichen Geschäften ihrer Kaufleute ein."
 bfl_dhe_notarial_albergo: "Der Notarvertrag"
 bfl_dhe_notarial_albergo_desc: "Bürgernotare bringen die Pflichten der Familie in eine gemeinsame, überwachte Ordnung."
 bfl_dhe_old_litigation: "Der Rechtsstreit um die alten Bankschulden"
 bfl_dhe_old_litigation_desc: "Die ungelösten Schulden der großen Bankhäuser behindern weiterhin den Handel."
 bfl_dhe_ordered_books: "Bestellte Bankbücher"
 bfl_dhe_ordered_books_desc: "Erfahrene Sachbearbeiter bringen die verstreuten Konten der Bank in Ordnung."
 bfl_dhe_papal_friend: "Ausgezeichnet mit dem Guelph Compact"
 bfl_dhe_papal_respect: "Versöhnte die Florentiner Häuser"
 bfl_dhe_parish_burden: "Die Belastung der venezianischen Gemeinden"
 bfl_dhe_parish_burden_desc: "Die Gemeinden und Stadtteile erhalten Hilfsgelder, deren Finanzierung die Staatskasse jedoch ablehnt."
 bfl_dhe_partners_levy: "Die Abgabe auf die Bankpartner"
 bfl_dhe_partners_levy_desc: "Die Partner zahlen eine außerordentliche Abgabe, wodurch öffentliche Ressourcen auf Kosten ihres gesamten Geschäfts geschont werden."
 bfl_dhe_permanent_giro: "Die permanente Banco del Giro"
 bfl_dhe_permanent_giro_desc: "Der Giro verfügt über eine geregelte Verwaltung anstelle einer Reihe auslaufender Mandate."
 bfl_dhe_petition_granted: "Habe die Petition der Bank gehört"
 bfl_dhe_petition_refused: "Die Petition der Bank wurde abgelehnt"
 bfl_dhe_plague_accounts: "Die Hilfskonten des Giro"
 bfl_dhe_plague_accounts_desc: "Die Bank muss zusätzliche Register und Sachbearbeiter für die Nothilfemittel führen."
 bfl_dhe_primary_shares_tt: "Die Bürger erhalten neu ausgegebene Aktien zum Nettoinventarwert, wodurch die bestehenden Eigentümer verwässert werden."
 bfl_dhe_public_bubble_relief: "Die öffentlichen Kosten der Südseerettung"
 bfl_dhe_public_bubble_relief_desc: "Die Kosten für die Wiederherstellung des Vertrauens nach dem Zusammenbruch der Abonnements trägt die öffentliche Hand."
 bfl_dhe_public_register: "Das öffentliche Register der Bank"
 bfl_dhe_public_register_desc: "Öffentliche Zeichnungen und Übertragungen werden im Rahmen einer vereinbarten Vereinbarung mit der Bank erfasst."
 bfl_dhe_rebuffed: "Lehnte die Position der Bank ab"
 bfl_dhe_refuse_tt: "Die Meinung der Bank über uns geht unter 20 und die Bürgerzufriedenheit lässt nach 5 Prozentpunkte."
 bfl_dhe_register_clerks: "Die Sachbearbeiter des öffentlichen Registers"
 bfl_dhe_register_clerks_desc: "Ein festes Personal führt das öffentliche Aktienregister und zahlt die Dividenden aus."
 bfl_dhe_republic_first: "Die Republik vor fremden Kronen"
 bfl_dhe_republic_first_desc: "Die Republik bevorzugt ihre eigenen Einnahmen gegenüber den diplomatischen Vorteilen ausländischer Gerichtskonten."
 bfl_dhe_reserves_1772: "Reserven in der Kreditkrise gestärkt"
 bfl_dhe_reserves_1772_desc: "Ein öffentlicher Beitrag stärkt das Vertrauen in die Reserven der Bank."
 bfl_dhe_retain_tt: "Aussetzung neuer Dividendenausschüttungen für 24 Monate. Es gilt dann die bisherige Auszahlungspolitik, sofern diese nicht zwischenzeitlich geändert wurde. Anerkannte Forderungen bleiben zahlbar."
 bfl_dhe_retained_earnings: "In der Bank verbleibende Dividenden"
 bfl_dhe_retained_earnings_desc: "Neue Erträge verbleiben in der Bank und werden nicht an die Eigentümer ausgeschüttet. Mit Ablauf dieser Vereinbarung gilt die bisherige Dividendenpolitik wieder, es sei denn, es wurde eine andere Politik beschlossen."
 bfl_dhe_royal_friend: "Kultivierte das Konto der Krone"
 bfl_dhe_royal_rival: "Bevorzugt eine Rivalenkrone"
 bfl_dhe_separate_offices: "Getrennte öffentliche und Bankbüros"
 bfl_dhe_separate_offices_desc: "Banker müssen mit Beamten verhandeln, anstatt ihre eigenen Staatsangelegenheiten zu regeln."
 bfl_dhe_south_sea_failures: "Ausfälle in der Exchange Alley"
 bfl_dhe_south_sea_failures_desc: "Fehlgeschlagene Abonnements und angefochtene Schulden unterbrechen den normalen Geschäftsbetrieb der Stadt."
 bfl_dhe_stale: "Die Umstände haben sich geändert; die Petition abweisen."
 bfl_dhe_threadneedle_merchants: "Der Eigentümerflügel"
 bfl_dhe_threadneedle_merchants_desc: "Die Eigentümer haben für einen dauerhaften Flügel und ein effizienteres Bankhaus bezahlt."
 bfl_dhe_threadneedle_public: "Das Threadneedle Street Establishment"
 bfl_dhe_threadneedle_public_desc: "Eine ständige öffentliche Einrichtung unterstellt die Abteilungen der Bank einer geordneten Verwaltung."
 bfl_dhe_trade_friend: "Begrüßte die English Factors"
 bfl_dhe_ungilded_accounts: "Konten vor der Schirmherrschaft"
 bfl_dhe_ungilded_accounts_desc: "Öffentliche Mittel wurden auf den Konten verwahrt und nicht für die Schirmherrschaft der Familie ausgegeben."
 bfl_dhe_venetian_relief: "Die Hilfsmittel der Republik"
 bfl_dhe_venetian_relief_desc: "Öffentliche Mittel unterstützen den zivilen Handel und belasten gleichzeitig die Einnahmen der Republik."
 bfl_dhe_war_accounts: "Die Militärregister des Giro"
 bfl_dhe_war_accounts_desc: "Der Giro verfügt über eine separate und kostspielige Verwaltung für Militärzahlungen."
 bfl_distress: "Not und Entwicklungstore"
 bfl_distribution_title: "Dividendenausschüttung"
 bfl_distribution_title_tip: "Der Anteil des anrechenbaren monatlichen Gewinns, der an die Eigentümer gezahlt wird. Der Rest bleibt auf der Bank."
 bfl_dividend_breakdown: "Bankdividenden"
 bfl_dividend_breakdown_subtitle: "Jahresrate und monatliche Abrechnung"
 bfl_dividend_calculation: "Monatliche Dividendenberechnung"
 bfl_dividend_explanation: "Der monatliche Nettogewinn nach Einlagenzinsen, Betriebskosten und Verlustvorträgen finanziert Dividenden. Jeder Eigentümer erhält eigene Aktien multipliziert mit der finanzierten Auszahlung pro ausstehender Aktie. Der einbehaltene Gewinn wird im nächsten Monat nicht erneut ausgeschüttet."
 bfl_dividend_rate_note: "Der Jahreszins ergibt sich aus den letzten Monatseinnahmen multipliziert mit zwölf und ist kein Versprechen. Zu den Bankkosten zählen Einlagenzinsen, Betriebskosten und Verlustvorträge. Jeder Eigentümer erhält seinen Anteil an der geförderten Auszahlung, abgerundet auf Dukaten und Cent."
 bfl_draw_bond: "Ausleihen 100 von der Bank"
 bfl_draw_bond_tip: "Die Zahlung erfolgt durch die konzessionierte Bank 100 Gold für eine ewige Staatsanleihe. Pro Monat können mehrere Ausgaben gefördert werden, bis zu 1,000 Insgesamt Gold. Die Bank muss ausreichend Bargeld und Kapital vorhalten und der Staat muss die Zinsen zahlen. Der Erlös dient der Finanzierung. Zahlen Sie den Nennwert an den aktuellen Inhaber zurück, um ihn in den Ruhestand zu schicken."
 bfl_equity_debt: "Eigenkapital und Schulden der Banken"
 bfl_equity_debt_tip: "#T Eigenkapital und Schulden der Banken#!\nBis zu zwölf tatsächliche monatliche Abrechnungs-Snapshots. Grün ist Vermögen minus Verbindlichkeiten; Rot ist die Gesamtverbindlichkeit der Bank. Beide verwenden dieselbe automatisch skalierte Goldachse, einschließlich des negativen Eigenkapitals. Die Stichproben laufen vom ältesten auf der linken Seite bis zum neuesten auf der rechten Seite. Bewegen Sie den Mauszeiger über eine Stichprobe, um deren Wert und Abrechnungsmonat anzuzeigen. Staatsanleihen sind in dieser Bankhistorie nicht enthalten."
 bfl_equity_detail_title: "Eigenkapital von [Country.GetName]"
 bfl_equity_label: "Eigenkapital"
 bfl_equity_label_tip: "#T Eigenkapital der Bank#!\nDer Restwert, der den Eigentümern der Bank nach ihren Verpflichtungen gehört.\n\nVermögenswerte: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_assets')|2]@gold!\nAbzüglich Gesamtverschuldung: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_liabilities')|2]@gold!\nEigenkapital: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_equity')|2]@gold!\n\nAufgezeichnete staatliche Einheiten: [Country.MakeScope.GetVariable('bfl_state_units').GetValue|2]\nGesamte Eigentumseinheiten: [Country.MakeScope.GetVariable('bfl_total_units').GetValue|2]\nKapitalspielraum: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_capital_headroom')|2]@gold!\n\nNegatives Eigenkapital bedeutet Insolvenz. Der Kapitalspielraum ist höher als das Eigenkapital 10% von Vermögenswerten, mit einem Minimum von Null; Ausschüttungen werden sowohl durch diesen Spielraum als auch durch das verfügbare Bargeld begrenzt. Eigenkapital ist nicht der Betrag, der sofort abgehoben werden kann."
 bfl_equity_market: "Aktienkurs und Geschichte"
 bfl_equity_subscribe_0: "Finanzministerium: abonnieren 100 Gold"
 bfl_equity_subscribe_0_tip: "Zeichnung des primären Nettoinventarwerts: Bezahlt den Emittenten und verwässert bestehende Inhaber. Bei Nachlasskäufen wird die tatsächliche Nachlassmappe genutzt und somit konserviert 25 Gold. Ein Bankinvestor verwendet nur seine eigenen geschützten Barmittel und Kapitalüberschüsse; Unternehmenskapital erfordert eine Analyse von Auslandsinvestitionen."
