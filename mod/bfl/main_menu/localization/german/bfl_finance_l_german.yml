 bfl_chart_equity_10: "Eigenkapital: [Country.MakeScope.GetVariable('bfl_history_equity_10').GetValue|2]@gold! · Abrechnungsmonat [Country.MakeScope.GetVariable('bfl_history_period_10').GetValue|0]"
 bfl_chart_equity_11: "Eigenkapital: [Country.MakeScope.GetVariable('bfl_history_equity_11').GetValue|2]@gold! · Abrechnungsmonat [Country.MakeScope.GetVariable('bfl_history_period_11').GetValue|0]"
 bfl_chart_equity_12: "Eigenkapital: [Country.MakeScope.GetVariable('bfl_history_equity_12').GetValue|2]@gold! · Abrechnungsmonat [Country.MakeScope.GetVariable('bfl_history_period_12').GetValue|0]"
 bfl_charter_begin_tip: "Öffnen Sie die Auswahl der berechtigten Staatsbanken. Keine Geld- oder Rechercheänderungen, bis eine Bank ausgewählt wird; Durch Abbrechen bleiben beide Staatskassen unverändert."
 bfl_charter_selection_tip: "Übertragen [ROOT.GetCountry.MakeScope.ScriptValue('bfl_charter_investment')|0]@gold! als neues Landeskapital an die ausgewählte Bank überwiesen. Bewahren Sie sein Land, seine Gebäude, bestehende Ansprüche und Verpflichtungen und wählen Sie dann seine dauerhafte Spezialisierung."
 bfl_chartered_bank: "Chartered Bank"
 bfl_chartered_bank_desc: "Eine gebäudebasierte Staatsbank wurde gegründet. Sein Bargeld und seine Verbindlichkeiten bleiben von seinem Souverän getrennt. Es wird kein automatischer Tribut erhoben."
 bfl_clearing: "Clearing"
 bfl_clearing_tip: "#T Erweitertes Clearing#!\nRevolutionen, Advanced Clearing und native Clearing House-Recherche. Eine eigene eingerichtete Clearingstelle und die ausdrückliche Mitgliedschaft als Mitglied ermöglichen die atomare Nettoabwicklung von abgeglichenen fälligen Wechseln. Ein kurzes Mitglied blockiert die Charge und bewahrt jeden Anspruch."
 bfl_clergy_estate_workout_mandate: "Mandat zur Nachlassabwicklung"
 bfl_clergy_estate_workout_mandate_desc: "Dieser Nachlass ermächtigt seine Regierung ausdrücklich, in seinem Namen freiwillige Bankeinlagenabwicklungen zu überprüfen. Jeder Vorschlag bedarf noch einer gesonderten Annahme. Durch den Widerruf dieses Privilegs werden ausstehende Nachlassbedingungen ungültig. Die Rückzahlungszahlungen werden weiterhin in den Nachlassbestand eingezahlt."
 bfl_close_bank_offering: "Aktienangebot abschließen"
 bfl_close_bank_offering_tip: "Akzeptieren Sie keine externen Abonnements mehr. Bestehende Eigentums- und Dividendenrechte bleiben bestehen. Der Staat kann seine eigene Bank immer noch rekapitalisieren."
 bfl_close_bond_offer: "Anleiheemission abschließen"
 bfl_close_bond_offer_tip: "Ziehen Sie das aktuelle Zweitangebot zurück. Ausstehende Schulden und Kupons bleiben geschuldet."
 bfl_collateral: "Sicherheiten"
 bfl_collateralization: "Besicherung"
 bfl_collateralization_desc: "Vertrauen wird gestärkt, wenn ein Versprechen durch Eigentum gestützt wird. Durch die Erfassung einer Verpfändung und der Rechte des Gläubigers daran können Banker Kredite gegen Vermögenswerte aufnehmen, die möglicherweise zurückerlangt werden, wenn der Schuldner die Vereinbarung nicht einhält."
 bfl_commenda: "Commenda"
 bfl_commenda_available_color: "green"
 bfl_commenda_available_icon: "@bfl_commenda_opportunity!"
 bfl_commenda_available_left_click: "Überprüfen Sie diesen Vorgang"
 bfl_commenda_available_name: "Commenda zur Finanzierung verfügbar"
 bfl_commenda_available_tooltip: "[GetPlayer.MakeScope.GetVariable('bfl_op_country').GetCountry.GetName] · 10 [GetPlayer.MakeScope.GetVariable('bfl_op_good').Goods.GetNameWithNoTooltip]\n[GetPlayer.MakeScope.GetVariable('bfl_op_from').GetMarket.GetName] → [GetPlayer.MakeScope.GetVariable('bfl_op_to').GetMarket.GetName]\nGeschätzte Bankkosten: [GetPlayer.MakeScope.GetVariable('bfl_op_cost').GetValue|2]@gold!\nIndikativer Banküberschuss: +[GetPlayer.MakeScope.GetVariable('bfl_op_surplus').GetValue|2]@gold!\n\nAktuelle Marktnotierungen für einen zweimonatigen Frachtbetrieb; Der Überschuss schließt das zurückgewonnene Kapital aus. Preise und Zugang können sich ändern. Kapital und Rendite sind gefährdet. Nur der tatsächliche Verkauf dieser Ladung zahlt den Vertrag. Der Betreiber muss akzeptieren. Opportunities werden monatlich aktualisiert und erneut überprüft, bevor ein Angebot gesendet wird."
 bfl_commenda_cargo: "Commenda: Schiffsfracht im entdeckten Gebiet"
 bfl_commenda_cargo_act: "Versenden Sie Fracht aus entdecktem Gebiet"
 bfl_commenda_cargo_desc: "Wählen Sie den gesponserten Betreiber und eine Ladung mit zehn Einheiten von einem Markt aus, der in seinem entdeckten Gebiet liegt oder an dieses grenzt. Nur ungenutzte akzeptierte Mittel können den ursprünglichen Kaufpreis decken. Keine Entdeckungsauszahlung oder unabhängige Handelszuordnung."
 bfl_commenda_cargo_effect_text: "Versenden Sie Fracht aus entdecktem Gebiet"
 bfl_commenda_cargo_effect_text_past: "Versenden Sie Fracht aus entdecktem Gebiet"
 bfl_commenda_cargo_tip: "Erfordert die verifizierte Entdeckung, die verbleibende Genehmigung, den lokalen Marktzugang und den Lagerbestand der akzeptierten Expedition. Der Betreiber oder politische Kontrolleur befiehlt die Reise."
 bfl_commenda_desc: "Ein Kaufmann, der eine Reise unternimmt, verfügt möglicherweise über die Fähigkeit, Handel zu treiben, ohne über das Kapital zu verfügen, um ein Schiff zu füllen. Die Commenda verbindet das Geld eines Finanziers mit der Arbeitskraft eines reisenden Partners und teilt den Erlös des Unternehmens entsprechend ihrer Vereinbarung."
 bfl_commenda_expedition: "Finanzieren Sie eine benannte Expedition"
 bfl_commenda_expedition_act: "Finanzieren Sie eine benannte Expedition"
 bfl_commenda_expedition_desc: "Wählen Sie einen Betreiber, seinen Starthafen, ein unentdecktes Meeresgebiet und einen Entdecker. Seeziele müssen innerhalb der Marinereichweite des Betreibers liegen; Grundstückslose Unternehmen nutzen das Sortiment des ausgewählten Eigentümers der Anlage. Die Akzeptanz finanziert die muttersprachliche Vorbereitung gemäß den vorgeschlagenen Bedingungen. Die Bank erlangt keine politische Kontrolle."
 bfl_commenda_expedition_effect_text: "Finanzieren Sie eine benannte Expedition"
 bfl_commenda_expedition_effect_text_past: "Finanzieren Sie eine benannte Expedition"
 bfl_commenda_expedition_tip: "Wählen Sie vor der Zustimmung einen Betreiber, ein Gebiet, einen Starthafen und einen Entdecker. Durch die Finanzierung werden nur die tatsächlichen Vorbereitungskosten der Einheimischen gedeckt. Die Vorbereitung ist nicht erstattungsfähig. Die verbleibende Genehmigung kann Fracht von einem Markt finanzieren, der sich auf das entdeckte Gebiet konzentriert oder an dieses grenzt; Nur der gemessene Verkaufserlös kann eine Rendite erwirtschaften."
 bfl_commenda_opportunity_consent: "Überprüfen Sie diese benannte Fracht noch einmal und Ihre aktuelle Finanzierungsbehörde. Senden Sie ein Angebot unter Verwendung Ihrer aktuellen Bedingungen. Es bewegt sich kein Geld, bis der Betreiber es akzeptiert."
 bfl_commenda_opportunity_later: "Betrachten Sie es später"
 bfl_commenda_opportunity_propose: "Senden Sie diese Bedingungen an den Betreiber"
 bfl_commenda_opportunity_review: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_op_country').GetCountry.GetName] · 10 [ROOT.GetCountry.MakeScope.GetVariable('bfl_op_good').Goods.GetNameWithNoTooltip]\n[ROOT.GetCountry.MakeScope.GetVariable('bfl_op_from').GetMarket.GetName] → [ROOT.GetCountry.MakeScope.GetVariable('bfl_op_to').GetMarket.GetName]\nGeschätzte Bankkosten: [ROOT.GetCountry.MakeScope.GetVariable('bfl_op_cost').GetValue|2]@gold!\nIndikativer Banküberschuss: +[ROOT.GetCountry.MakeScope.GetVariable('bfl_op_surplus').GetValue|2]@gold!\n\nAktuelle Marktnotierungen für einen zweimonatigen Frachtbetrieb; Der Überschuss schließt das zurückgewonnene Kapital aus. Preise und Zugang können sich ändern. Kapital und Rendite sind gefährdet. Nur der tatsächliche Verkauf dieser Ladung zahlt den Vertrag. Der Betreiber muss akzeptieren. Opportunities werden monatlich aktualisiert und erneut überprüft, bevor ein Angebot gesendet wird."
 bfl_commenda_tip: "#T Commenda#!\nStellen Sie Kapital für eine Reise oder ein Handelsunternehmen bereit und erhalten Sie dafür einen definierten Gewinnanteil. Erfordert Commenda-Recherche, Overseas Investment und das Discovery-Alter oder höher. Die native Projektausführung ist in diesem Build nicht verfügbar."
 bfl_commercial_bill: "Handelsgesetz"
 bfl_commercial_bills: "Handelsrechnungen"
 bfl_commercial_bills_desc: "Der Transport von Münzen zwischen Handelszentren ist kostspielig und gefährlich. Schriftliche Rechnungen ermöglichen es Händlern, Verpflichtungen über vertrauenswürdige Bankhäuser zu begleichen, wodurch der Ruf des Ausstellers zu einem Handelsinstrument wird."
 bfl_commodity_forward: "Rohstoffvorwärts"
 bfl_commodity_forward_tip: "#T Rohstoff vorwärts#!\nVereinbaren Sie eine finanzierte zukünftige Warenlieferung. Erfordert Commodity Forwards-Forschung, Merchant Finance und das Zeitalter des Absolutismus oder später. Physische Lieferung und Abrechnung sind in diesem Build nicht verfügbar."
 bfl_commodity_forwards: "Rohstofftermingeschäfte"
 bfl_commodity_forwards_desc: "Eine Ernte-, Versand- oder Werkstattbestellung kann vor der Auslieferung verkauft werden. Vereinbarungen, die einen zukünftigen Preis festlegen, helfen Händlern, ihre Geschäfte trotz der Unsicherheit entfernter Märkte und wechselnder Jahreszeiten zu regeln."
 bfl_commodity_inventory: "Warenbestand"
 bfl_commodity_inventory_tip: "#T Warenbestand#!\nFinanzieren Sie Waren, die für den Handel gehalten werden. Erfordert Commodity Investments Research, Merchant Finance und das Discovery-Alter oder höher. Der Kauf, die Aufbewahrung und die Lieferung physischer Güter sind in diesem Build nicht verfügbar."
 bfl_commodity_investments: "Rohstoffinvestitionen"
 bfl_commodity_investments_desc: "Banker, die den Handel finanzieren, können die Waren auch selbst halten. Getreide, Wolle und andere Waren werden zu Investitionen, deren Wert von Lagerung, Transport und den sich ändernden Bedürfnissen entfernter Märkte abhängt."
 bfl_companies_empty: "Keine Betreibergesellschaften unter Ihrer Kontrolle."
 bfl_company_crew: "Übertragen 250 Matrosen zur Gesellschaft"
 bfl_company_crew_desc: "Verwalten Sie ein einheimisches Unternehmen, das Sie derzeit kontrollieren. Das finanzierte Kapital ist von den Betriebserträgen ausgeschlossen."
 bfl_company_crew_tip: "Verwalten Sie ein einheimisches Unternehmen, das Sie derzeit kontrollieren. Kapitaleinlagen sind Finanzierung. Bei den Unternehmensausschüttungen werden einbehaltene Handelserträge nach Abzug der Eigenkosten, Verlustvorträge, Schuldenreserven und Barmittelpuffer verwendet. Der politische Oberherr und der finanzielle Eigentümer sind getrennt."
 bfl_company_equity: "Unternehmenseigenkapital"
 bfl_company_equity_desc: "Große Handelsunternehmen benötigen Vermögen, die nur wenige Händler allein aufbringen können. Durch die Aufteilung des Eigentums unter den Anlegern kann ein Unternehmen dauerhaftes Kapital aufbauen und gleichzeitig die Risiken und Chancen seiner Unternehmungen verteilen."
 bfl_company_equity_tip: "#T Eigenkapital des Unternehmens#!\nZeichnen Sie Kapital für einen Eigentumsanteil an einem anerkannten Unternehmen. Erfordert Unternehmenskapitalrecherchen, Auslandsinvestitionen und das Reformationszeitalter oder später. Die Ausgabe lokaler Unternehmen und die Abwicklung durch Inhaber sind in diesem Build nicht verfügbar."
 bfl_company_expedition: "Unternehmen: Vorbereitung der einheimischen Erkundung"
 bfl_company_expedition_desc: "Nutzen Sie die Unternehmenskasse, Matrosen und Entdecker, um eine Meereserkundung in einer Unternehmensanlage vorzubereiten. Es gelten die native Vorbereitung und der Fortschritt. Discovery erwirtschaftet weder Bargeld noch Investitionsgewinne."
 bfl_company_expedition_tip: "Erfordert ein Handels- und Explorationsmandat, Kartenerstellung, einen berechtigten Unternehmensforscher, Seeleute und ein verfügbares Projektbudget. Es gilt die native Vorbereitungszeit."
 bfl_company_exploration_capacity: "Explorationseinrichtung des Unternehmens"
 bfl_company_exploration_capacity_desc: "Kapazität für 500 Seeleute, solange ein Explorationsauftrag genehmigt ist. Die Matrosen müssen vom Unternehmen kommen oder eine finanzierte Übertragung von dessen politischem Vorgesetzten erhalten."
 bfl_company_explore: "Unternehmensauftrag: Handel und Exploration"
 bfl_company_explore_desc: "Verwalten Sie ein einheimisches Unternehmen, das Sie derzeit kontrollieren. Das finanzierte Kapital ist von den Betriebserträgen ausgeschlossen."
 bfl_company_explore_tip: "Verwalten Sie ein einheimisches Unternehmen, das Sie derzeit kontrollieren. Kapitaleinlagen sind Finanzierung. Bei den Unternehmensausschüttungen werden einbehaltene Handelserträge nach Abzug der Eigenkosten, Verlustvorträge, Schuldenreserven und Barmittelpuffer verwendet. Der politische Oberherr und der finanzielle Eigentümer sind getrennt."
 bfl_company_fund: "Mitmachen 100 Gold zu Unternehmenskapital"
 bfl_company_fund_desc: "Verwalten Sie ein einheimisches Unternehmen, das Sie derzeit kontrollieren. Das finanzierte Kapital ist von den Betriebserträgen ausgeschlossen."
 bfl_company_fund_tip: "Verwalten Sie ein einheimisches Unternehmen, das Sie derzeit kontrollieren. Kapitaleinlagen sind Finanzierung. Bei den Unternehmensausschüttungen werden einbehaltene Handelserträge nach Abzug der Eigenkosten, Verlustvorträge, Schuldenreserven und Barmittelpuffer verwendet. Der politische Oberherr und der finanzielle Eigentümer sind getrennt."
 bfl_company_list_equity: "Genehmigen Sie die Börsennotierung des Unternehmens"
 bfl_company_list_equity_desc: "Genehmigen Sie kostenpflichtige NAV-Primärzeichnungen und Sekundärhandel. Bankübernahmen erfordern Auslandsinvestitionen, Unternehmenskapitalrecherchen und den abgeschlossenen Austausch für Sekundärgeschäfte. Die politische Oberhoheit bleibt unverändert."
 bfl_company_list_equity_tip: "Der aktive politische Controller genehmigt die Marktteilnahme. Es werden keine Barmittel oder Anteile gewährt."
 bfl_company_overview_note: "Firmengelder gehören dem Unternehmen. Credit Management betreibt Handel und Exploration. Eigentümerdividenden verwenden finanzierte Erträge nach Rücklagen; Neukapital und Entdeckungen sind ausgeschlossen."
 bfl_company_overview_subtitle: "Firmenkonten · letzte Abrechnung"
 bfl_company_overview_title: "[Country.GetName]"
 bfl_company_panel: "Betreibergesellschaften"
 bfl_company_retain: "Unternehmensauftrag: Neue Operationen pausieren"
 bfl_company_retain_desc: "Verwalten Sie ein einheimisches Unternehmen, das Sie derzeit kontrollieren. Das finanzierte Kapital ist von den Betriebserträgen ausgeschlossen."
 bfl_company_retain_tip: "Verwalten Sie ein einheimisches Unternehmen, das Sie derzeit kontrollieren. Kapitaleinlagen sind Finanzierung. Bei den Unternehmensausschüttungen werden einbehaltene Handelserträge nach Abzug der Eigenkosten, Verlustvorträge, Schuldenreserven und Barmittelpuffer verwendet. Der politische Oberherr und der finanzielle Eigentümer sind getrennt."
 bfl_company_route: "Unternehmen: Offene einheimische Handelsroute"
 bfl_company_route_desc: "Öffnen Sie eine unternehmenseigene native Route mit 0.1 Handelskapazität. Erfordert ein Handelsmandat, ein verfügbares Betriebsbudget, Zugang zum einheimischen Markt, Überschuss und Kapazität. Maximal eine befohlene Route pro Unternehmen und Monat. Die native KI behält ihr eigenes Handelsverhalten bei."
 bfl_company_route_tip: "Wählen Sie das Unternehmen, den Quellmarkt, den Zielmarkt, den Händlermarkt und die Waren aus. Die Kosten für den einheimischen Handel werden von der Engine berechnet."
 bfl_company_select: "Betreibergesellschaft auswählen"
 bfl_company_select_desc: "Untersuchen Sie ein einheimisches Unternehmen, das unter Ihrer aktuellen politischen Kontrolle steht."
 bfl_company_select_tip: "Untersuchen Sie ein Unternehmen unter Ihrer Kontrolle."
 bfl_company_strategy_construction: "Reinvestieren Sie die Unternehmensreserven in eine lokale Handelseinrichtung"
 bfl_company_trade: "Firmenauftrag: Handel"
 bfl_company_trade_desc: "Verwalten Sie ein einheimisches Unternehmen, das Sie derzeit kontrollieren. Das finanzierte Kapital ist von den Betriebserträgen ausgeschlossen."
 bfl_company_trade_tip: "Verwalten Sie ein einheimisches Unternehmen, das Sie derzeit kontrollieren. Kapitaleinlagen sind Finanzierung. Bei den Unternehmensausschüttungen werden einbehaltene Handelserträge nach Abzug der Eigenkosten, Verlustvorträge, Schuldenreserven und Barmittelpuffer verwendet. Der politische Oberherr und der finanzielle Eigentümer sind getrennt."
 bfl_corporate_credit: "Unternehmenskredit"
 bfl_corporate_credit_desc: "Wenn Handelsunternehmen aus einer einzigen Reise oder Saison herauswachsen, wird ihr Bedarf an Krediten dauerhafter. Bankhäuser lernen, die Ressourcen und Aussichten eines Unternehmens sowie das Ansehen seiner einzelnen Händler einzuschätzen."
 bfl_corporate_credit_tip: "#T Unternehmenskredit#!\nVerleihen Sie Ihr Geld an ein anerkanntes Handelsunternehmen. Erfordert Unternehmenskreditrecherche, Handelsfinanzierung und das Reformationszeitalter oder später. Die Ausführung neuer nativer Unternehmenskredite ist in diesem Build nicht verfügbar."
