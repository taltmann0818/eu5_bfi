 bfl_establish_chartered_bank.a: "Wählen Sie die vorhandene Staatsbank aus"
 bfl_establish_chartered_bank.desc: "Wandeln Sie eine bestehende Staatsbank um und profitieren Sie von Banktraditionen, wenn die Gründung abgeschlossen ist. Die aktuelle Investition von 500 / 750 / 1,000 / 1,500 / 2,000 / 3,000 Gold wird als Staatskapital in die Staatskasse überwiesen. Sie müssen Eigentümer Ihres Kapitalmarktes sein. Wählen Sie eine Bank aus, bevor Sie eine Zahlung oder eine Recherche durchführen."
