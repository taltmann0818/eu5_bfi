 bfl_cost_asset_types: "Nicht zahlungswirksame Anlageklassen: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_operating_asset_types_count')|0] × 0.25"
 bfl_cost_base: "Basisverwaltung"
 bfl_cost_branches: "Filialen: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_operating_branches_count')|0] × 0.50"
 bfl_cost_contracts: "Individuelle Finanzverträge: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_operating_contracts_count')|0] × 0.10"
 bfl_cost_current: "Aktuelle monatliche Kosten: #R [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_operating_expense')|2]@gold!#!"
 bfl_cost_payment_detail: "Die Kosten skalieren mit der Komplexität, nicht mit dem Vermögenswert. Wird einmal monatlich über den geschützten Reserven berechnet; unbezahlte Ausgaben schränken die Dividende ein. Einlagenzinsen und einheimische Kosten sind getrennt. Ermäßigungen addieren sich; die Summe wird auf Cent gerundet."
