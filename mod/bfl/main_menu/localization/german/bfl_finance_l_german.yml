 bfl_goods_inventory_empty: "Keine Ware in Verwahrung. Automatische Käufe beginnen mit dem nächsten berechtigten monatlichen Bankschluss."
 bfl_goods_inventory_hint: "Bewegen Sie den Mauszeiger über Waren, Mengen, Wert und Rückgabe"
 bfl_goods_inventory_note: "Indikativer einheimischer Verkaufswert; nicht realisierte Rendite gegen verbleibende bezahlte Kosten. Fremdeinnahmen sind von der Banksumme ausgeschlossen. Kosten, Verderb und verlorener Zugang wirken sich auf den Erlös aus. Scrollen Sie für jede gespeicherte Position."
