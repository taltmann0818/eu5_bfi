 bfl_bardi_chapel_cycle: "Der Bardi-Kapellen-Zyklus"
 bfl_bardi_chapel_cycle_desc: "Ein Freskenzyklus für eine Franziskanerkapelle in Florenz, in Auftrag gegeben im Namen Bardi. In der gemalten Architektur spielen sich Szenen aus dem Leben des Heiligen Franziskus ab: der Verzicht auf weltliche Besitztümer, die Fürsorge für die Armen und der letzte Segen des Heiligen. Ruhige Gesichter und bewusste Gesten verleihen der heiligen Geschichte die Ernsthaftigkeit eines miterlebten Ereignisses. Die Stifter knien unter den Heiligen, ihre kostbaren Gewänder bilden einen Kontrast zu den schlichten Gewohnheiten der Brüder. Der Kontrast verkündet sowohl die Hingabe der Familie als auch die unbehagliche Stellung großen Reichtums neben apostolischer Armut. Hinter dem Altar bewahren die Bardi-Wappen die Erinnerung an das Haus, das diese Mauern finanziert hat."
