 bfl_report_history_heading: "Monatliche Historie · Einnahmen/Ausgaben"
 bfl_report_impairment_definition: "Neue Reduzierungen des erfassten Werts von Bankkrediten in diesem Monat. Frühere Verluste sind ausgeschlossen."
 bfl_report_impairment_title: "Ausfälle und Wertberichtigungen"
 bfl_report_legend: "#G Bruttoeinkommen#!     #R Bruttoausgaben#!"
 bfl_report_losses_definition: "Der Verlustsaldo, der zur Berechnung des ausschüttbaren Gewinns verwendet wird. Dies kann frühere Monate umfassen und ist nicht die Bruttoausgabenreihe."
 bfl_report_losses_title: "Kosten und Verlustvorträge"
 bfl_report_native_cost_definition: "Ein realisierter Verlust im Budget der einheimischen Bank, nach gesonderter Klassifizierung der Darlehenszinsen. Einheimische Bruttoeinnahmen und -ausgaben werden nicht aus den prognostizierten Einnahmen abgeleitet."
 bfl_report_native_cost_title: "Nativer Budgetverlust"
 bfl_report_native_gross_definition: "Der von der Bank erfasste realisierte Haushaltsüberschuss nach Klassifizierung der beobachteten Kreditzinsen. Dies ist ein Net Native-Kanal; Einlagen, Anleiheemissionen und neues Kapital sind vom Erwerbseinkommen ausgeschlossen."
 bfl_report_native_gross_title: "Sonstige Bankeinnahmen"
 bfl_report_operating_cost_definition: "Die Bankverwaltungsgebühr wurde diesen Monat festgesetzt. Hover Betriebskosten für seine Formel."
 bfl_report_operating_cost_title: "Verwaltung"
 bfl_report_principal_definition: "Der Kreditbetrag wurde an die Bank zurückgegeben. Dadurch wird ein Anspruch in Bargeld umgewandelt und ist vom Einkommen ausgeschlossen."
 bfl_report_principal_title: "Schulleiter zurückgekehrt"
 bfl_report_recovery_loss_definition: "Anschaffungskosten, die durch zurückgezahlte Kredite verloren gehen. Zurückgezahltes Kapital ist vom Einkommen ausgeschlossen."
 bfl_report_recovery_loss_title: "Kreditverluste"
 bfl_report_retained_profit_definition: "Anrechenbarer Gewinn abzüglich des tatsächlich an die Aktionäre ausgezahlten Betrags."
 bfl_report_retained_profit_title: "Einbehaltener Gewinn"
 bfl_report_services_definition: "Gebühren für erbrachte Bankdienstleistungen."
 bfl_report_services_title: "Dienstleistungen"
 bfl_report_trading_definition: "Realisierte Gewinne oder Verluste aus verkauften oder zurückgezahlten Wertpapieren. Nicht verkaufte Preisänderungen sind ausgeschlossen."
 bfl_report_trading_title: "Wertpapierhandel"
 bfl_report_ventures_definition: "Realisierter Gewinn aus abgeschlossenen Investitionen. Neues Kapital ist ausgeschlossen."
