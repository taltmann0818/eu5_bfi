 bfl_request_discount: "Fordern Sie einen gesicherten Abrechnungskredit an"
 bfl_request_discount_act: "$bfl_request_discount$"
 bfl_request_discount_command: "$bfl_request_discount$"
 bfl_request_discount_command_desc: "$bfl_request_discount_desc$"
 bfl_request_discount_desc: "Fordern Sie eine an 75-Goldvorschuss gegen Ihre Finanzierung 100-Gold-Drittbank-Schein. Der Live-Kreditgebermanager überprüft die Anfrage. Die Annahme überprüft alle Parteien und Sicherheiten erneut. Zwischen den Banken ist keine Bankfiliale erforderlich."
 bfl_request_discount_effect_text: "$bfl_request_discount$"
 bfl_request_discount_effect_text_past: "$bfl_request_discount$"
 bfl_request_discount_tip: "Wählen Sie einen Kreditgeber für a 75-Gold-Einmonatsvorschuss gegen Ihr nicht verpfändetes, finanziertes Guthaben 100-Goldschein bei einer dritten Bank. Erfordert Besicherungs- und Liquiditätsfazilitäten. Der Kreditgeber muss zustimmen; Zwischen den Banken ist keine Bankfiliale erforderlich."
 bfl_request_public_support: "Fordern Sie öffentlich gesicherten Support an"
 bfl_request_public_support_act: "$bfl_request_public_support$"
 bfl_request_public_support_command: "$bfl_request_public_support$"
 bfl_request_public_support_command_desc: "$bfl_request_public_support_desc$"
 bfl_request_public_support_desc: "Fordern Sie eine an 75-Goldvorschuss gegen Ihre Finanzierung 100-Gold-Drittbank-Schein. Der Live-Kreditgebermanager überprüft die Anfrage. Die Annahme überprüft alle Parteien und Sicherheiten erneut. Zwischen den Banken ist keine Bankfiliale erforderlich."
 bfl_request_public_support_effect_text: "$bfl_request_public_support$"
 bfl_request_public_support_effect_text_past: "$bfl_request_public_support$"
 bfl_request_public_support_tip: "Wählen Sie einen zugelassenen Kreditgeber mit Public Financial Backstops und der Zentralbank des Staates mit vollständiger Kapitalausstattung. Der aktuelle Manager muss zustimmen. Die 75-Goldgesicherter Vorschuss erfordert mindestens Bankgeld und Gebühren 9% jährlich; es entsteht keine Garantie oder Rekapitalisierung."
 bfl_reserves: "Bargeld reserviert"
 bfl_reserves_tip: "Bargeld wird für Einzahlungen und versprochene Zahlungen aufbewahrt."
 bfl_resolution_begin_command: "Beginnen Sie mit der Lösung"
 bfl_resolution_begin_command_tip: "Durch eine ordnungsgemäße Abwicklung werden neue Zusagen und Ausschüttungen eingefroren. Getrennte Geld- und Depotreserven bleiben geschützt; Die Einlagen teilen sich die verfügbaren Barmittel proportional vor Kostenrückständen und Eigenkapital. Fehlende Gläubiger behalten ihre Forderungen. Freiwillige Bedingungen erfordern die aktuelle Zustimmung des Gläubigers und eine Renaissance-Schuldenumstrukturierung. Eine öffentliche Bürgschaft deckt ab 50% der akzeptierten Einlagenverluste, bis zu 100 Gold insgesamt, finanziert durch seinen eingetragenen Souverän; unbezahlte Anrufe bleiben ausstehend. Für den Abschluss müssen alle Verbindlichkeiten und unbaren Vermögenswerte beglichen werden. Geschlossene Anwesen können nicht wieder geöffnet werden."
 bfl_resolution_call_command: "Bezahlen Sie die ausstehende Garantie"
 bfl_resolution_call_command_tip: "Durch eine ordnungsgemäße Abwicklung werden neue Zusagen und Ausschüttungen eingefroren. Getrennte Geld- und Depotreserven bleiben geschützt; Die Einlagen teilen sich die verfügbaren Barmittel proportional vor Kostenrückständen und Eigenkapital. Fehlende Gläubiger behalten ihre Forderungen. Freiwillige Bedingungen erfordern die aktuelle Zustimmung des Gläubigers und eine Renaissance-Schuldenumstrukturierung. Eine öffentliche Bürgschaft deckt ab 50% der akzeptierten Einlagenverluste, bis zu 100 Gold insgesamt, finanziert durch seinen eingetragenen Souverän; unbezahlte Anrufe bleiben ausstehend. Für den Abschluss müssen alle Verbindlichkeiten und unbaren Vermögenswerte beglichen werden. Geschlossene Anwesen können nicht wieder geöffnet werden."
 bfl_resolution_close_command: "Nachlass schließen"
 bfl_resolution_close_command_tip: "Durch eine ordnungsgemäße Abwicklung werden neue Zusagen und Ausschüttungen eingefroren. Getrennte Geld- und Depotreserven bleiben geschützt; Die Einlagen teilen sich die verfügbaren Barmittel proportional vor Kostenrückständen und Eigenkapital. Fehlende Gläubiger behalten ihre Forderungen. Freiwillige Bedingungen erfordern die aktuelle Zustimmung des Gläubigers und eine Renaissance-Schuldenumstrukturierung. Eine öffentliche Bürgschaft deckt ab 50% der akzeptierten Einlagenverluste, bis zu 100 Gold insgesamt, finanziert durch seinen eingetragenen Souverän; unbezahlte Anrufe bleiben ausstehend. Für den Abschluss müssen alle Verbindlichkeiten und unbaren Vermögenswerte beglichen werden. Geschlossene Anwesen können nicht wieder geöffnet werden."
 bfl_resolution_guarantee_command: "Garantie genehmigen"
 bfl_resolution_guarantee_command_tip: "Durch eine ordnungsgemäße Abwicklung werden neue Zusagen und Ausschüttungen eingefroren. Getrennte Geld- und Depotreserven bleiben geschützt; Die Einlagen teilen sich die verfügbaren Barmittel proportional vor Kostenrückständen und Eigenkapital. Fehlende Gläubiger behalten ihre Forderungen. Freiwillige Bedingungen erfordern die aktuelle Zustimmung des Gläubigers und eine Renaissance-Schuldenumstrukturierung. Eine öffentliche Bürgschaft deckt ab 50% der akzeptierten Einlagenverluste, bis zu 100 Gold insgesamt, finanziert durch seinen eingetragenen Souverän; unbezahlte Anrufe bleiben ausstehend. Für den Abschluss müssen alle Verbindlichkeiten und unbaren Vermögenswerte beglichen werden. Geschlossene Anwesen können nicht wieder geöffnet werden."
 bfl_resolution_heading: "Abwicklung und Gläubigerrückgewinnung"
 bfl_resolution_heading_tip: "Anhaltende finanzielle Lösung; Bareinnahmen und einvernehmliche Änderungen werden getrennt vom Ergebnis erfasst."
 bfl_resolution_help: "Gesicherte und verwahrte Rücklagen → anteilige Einlagen → Spesenrückstände → Restaktionäre. Ansprüche überdauern Fehlbeträge und den Verlust der Ursprungsbefugnis. Geben Sie eine Lösung ein, bevor Sie Konditionen anbieten."
 bfl_resolution_liquidate_command: "Verfügbare Vermögenswerte realisieren"
 bfl_resolution_liquidate_command_tip: "Verkaufen Sie zugängliches, unbelastetes einheimisches Inventar und kassieren Sie fällige Einlagen, Wechsel und Banknoten über ihre bestehenden Dienste. Tatsächliche Einnahmen finanzieren den Erholungswasserfall. Nicht verfügbare oder unausgereifte Positionen bleiben erfasst; Kein Buchwert wird zu Gold."
 bfl_resolution_next_command: "Nächstes Einzahlungskonto"
 bfl_resolution_next_command_tip: "Zyklus aktiver Einlagenkonten. Nachlassgläubiger benötigen ihr erlassenes Trainingsmandat, bevor ihre Regierung freiwillige Bedingungen akzeptieren kann. Zahlungen fließen zurück in die registrierte Staatskasse oder in die Nachlassmappe."
 bfl_resolution_notice_acknowledge: "Bestätigen Sie das Endergebnis"
 bfl_resolution_notice_desc: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_notice_bank').GetCountry.GetName] hat seine Finanzgeschäfte eingestellt.\n\nGezahlte Kautionsrückzahlungen: [ROOT.GetCountry.MakeScope.GetVariable('bfl_notice_bank').GetCountry.MakeScope.GetVariable('bfl_resolution_paid').GetValue|2]@gold!\nEinverstandene Einlagenverluste: [ROOT.GetCountry.MakeScope.GetVariable('bfl_notice_bank').GetCountry.MakeScope.GetVariable('bfl_resolution_waived').GetValue|2]@gold!\nErfasste gesetzliche Verluste: [ROOT.GetCountry.MakeScope.GetVariable('bfl_notice_bank').GetCountry.MakeScope.GetVariable('bfl_resolution_statutory_loss').GetValue|2]@gold!\n\nBei den erfassten Verlusten handelt es sich um unbezahlte Beträge, nicht um Rückerstattungen oder neue Einnahmen. Die historischen Eigentumsverhältnisse und der endgültige Nachlass bleiben erfasst; die geschlossene Einrichtung kann nicht wiedereröffnet werden."
 bfl_resolution_notice_title: "Bankabwicklung abgeschlossen"
 bfl_resolution_offer_command: "Bieten Sie Gläubigerkonditionen an"
 bfl_resolution_offer_command_tip: "Durch eine ordnungsgemäße Abwicklung werden neue Zusagen und Ausschüttungen eingefroren. Getrennte Geld- und Depotreserven bleiben geschützt; Die Einlagen teilen sich die verfügbaren Barmittel proportional vor Kostenrückständen und Eigenkapital. Fehlende Gläubiger behalten ihre Forderungen. Freiwillige Bedingungen erfordern die aktuelle Zustimmung des Gläubigers und eine Renaissance-Schuldenumstrukturierung. Eine öffentliche Bürgschaft deckt ab 50% der akzeptierten Einlagenverluste, bis zu 100 Gold insgesamt, finanziert durch seinen eingetragenen Souverän; unbezahlte Anrufe bleiben ausstehend. Für den Abschluss müssen alle Verbindlichkeiten und unbaren Vermögenswerte beglichen werden. Geschlossene Anwesen können nicht wieder geöffnet werden."
 bfl_resolution_pay_command: "Lohnrückerstattung"
 bfl_resolution_pay_command_tip: "Durch eine ordnungsgemäße Abwicklung werden neue Zusagen und Ausschüttungen eingefroren. Getrennte Geld- und Depotreserven bleiben geschützt; Die Einlagen teilen sich die verfügbaren Barmittel proportional vor Kostenrückständen und Eigenkapital. Fehlende Gläubiger behalten ihre Forderungen. Freiwillige Bedingungen erfordern die aktuelle Zustimmung des Gläubigers und eine Renaissance-Schuldenumstrukturierung. Eine öffentliche Bürgschaft deckt ab 50% der akzeptierten Einlagenverluste, bis zu 100 Gold insgesamt, finanziert durch seinen eingetragenen Souverän; unbezahlte Anrufe bleiben ausstehend. Für den Abschluss müssen alle Verbindlichkeiten und unbaren Vermögenswerte beglichen werden. Geschlossene Anwesen können nicht wieder geöffnet werden."
 bfl_resolution_resume_command: "Nach der Genesung fortfahren"
 bfl_resolution_resume_command_tip: "Durch eine ordnungsgemäße Abwicklung werden neue Zusagen und Ausschüttungen eingefroren. Getrennte Geld- und Depotreserven bleiben geschützt; Die Einlagen teilen sich die verfügbaren Barmittel proportional vor Kostenrückständen und Eigenkapital. Fehlende Gläubiger behalten ihre Forderungen. Freiwillige Bedingungen erfordern die aktuelle Zustimmung des Gläubigers und eine Renaissance-Schuldenumstrukturierung. Eine öffentliche Bürgschaft deckt ab 50% der akzeptierten Einlagenverluste, bis zu 100 Gold insgesamt, finanziert durch seinen eingetragenen Souverän; unbezahlte Anrufe bleiben ausstehend. Für den Abschluss müssen alle Verbindlichkeiten und unbaren Vermögenswerte beglichen werden. Geschlossene Anwesen können nicht wieder geöffnet werden."
 bfl_review_trade: "Überprüfen Sie den Handel"
 bfl_review_trade_tip: "Überprüfen Sie die ausgewählten Einheiten und die genaue Zahlung. Ein Verkauf muss auf mindestens runden 0.01 Gold; Erhöhen Sie die Menge, wenn die Bewertung nicht verfügbar ist. Es wird kein Diplomat ausgegeben, bis ein gültiger Handel abgeschlossen ist."
 bfl_safeguards_title: "Liquidität und Absicherung"
 bfl_safeguards_title_tip: "#T Liquidität und Absicherung#!\nVerfügbares Bankguthaben: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_free_cash')|2]@gold!\nAnforderungen an geschütztes Bargeld: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_protected_cash')|2]@gold!\nAbhebungen in der Warteschlange: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_withdrawals_due')|2]@gold!\n\nDurch die Rekapitalisierung wird Landeskapital bereitgestellt. Durch die Aussetzung von Einzahlungen wird die Finanzierung neuer Konten unterbunden, bestehende Verpflichtungen bleiben jedoch bestehen."
 bfl_sale_unavailable: "Der Aktienauftrag konnte nicht abgewickelt werden"
 bfl_sale_unavailable_desc: "Der Emittent hat eine Handelsabklingzeit von einem Monat, Sie haben keinen Diplomaten, Ihr Angebot ist abgelaufen oder die verfügbaren Aktien, Gelder oder der Börsenzugang haben sich geändert. Öffnen Sie „Aktien kaufen“ oder „Verkaufen“ erneut, um ein neues Angebot zu erhalten. Es wurden weder Bargeld noch Aktien bewegt."
 bfl_secured_liquidity: "Gesicherte Liquidität"
 bfl_secured_liquidity_tip: "#T Gesicherte Liquidität#!\nAbsolutismus, Besicherung und Liquiditätsfazilitäten. Vorwärts 75 Gold gegen eine separat finanzierte 100-Gold-Drittbank-Schein. Sicherheiten werden einmalig gesperrt. Der fest akzeptierte Jahreszins wird durch geteilt 12. Keine Filiale zwischen Banken erforderlich."
 bfl_security_bank_results: "Letzte Bankschließung"
 bfl_security_financial_heading: "Greifbare Finanzlage"
 bfl_security_financial_subtitle: "Was den Aktienkurs stützt"
 bfl_security_financial_title: "Eigenkapital von [Country.GetName]"
 bfl_security_price_heading: "Aktienkurs und Eigentum"
 bfl_security_price_math: "Marktpreis = materieller NAV pro Aktie × monatliche Marktprämie. Auftragsdruck, Volatilität, Mean-Reversion und Distress können diese Prämie verändern. Der Preis des Primärkapitals bleibt beim NAV; Nicht realisierte Gewinne finanzieren weder Kredite noch Dividenden."
 bfl_security_primary_note: "Dividenden reduzieren einmalig die Barmittel und den Nettoinventarwert. Neues Kapital wird zum Nettoinventarwert bewertet und erzeugt kein Kaufdrucksignal. Abonnements werden pausiert, während das Wiederverkaufsgebot des Händlers den Nettoinventarwert übersteigt, wodurch ein garantierter sofortiger Gewinn verhindert wird. Die Geschichte enthält tatsächliche Beobachtungen; Durch das Neuladen wird ein gespeicherter monatlicher Schock nicht erneut gewürfelt."
 bfl_select_buy_shares: "Kaufen Sie Bank- und Unternehmensaktien"
 bfl_select_profile: "Wählen Sie die ausstehende Spezialisierung"
 bfl_select_profile_tip: "#T Bankspezialisierung#!\nÖffnen Sie die Spezialisierungsauswahl, wenn diese Bank noch kein dauerhaftes Profil ausgewählt hat. Merchant Finance und Overseas Investment eröffnen unterschiedliche Forschungswege. Eine abgeschlossene Spezialisierung kann durch diesen Button nicht ersetzt werden."
 bfl_select_sell_shares: "Verkaufen Sie Aktien, die Sie besitzen"
 bfl_selector_next: "Nächste Banken"
 bfl_selector_previous: "Bisherige Banken"
 bfl_sell_confirm_desc: "Verkaufen [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_quantity').GetValue|3] Anteile an [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_issuer').GetCountry.GetName] für [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_total').GetValue|2]@gold!. Der Hidden Market Maker garantiert diesen Verkauf, einschließlich der notierten Handelsspanne, solange die Notierung gültig ist. Aktien verlassen Ihr Portfolio sofort; Hintergrund-KI-Käufe verzögern die Zahlung nicht. Der Erlös fließt in die Kasse Ihrer Bank. Die Abwicklung verbraucht einen Diplomaten und startet die einmonatige Kauf-/Verkaufs-Abklingzeit dieses Emittenten."
 bfl_sell_confirm_title: "Bestätigen Sie den sofortigen Aktienverkauf"
 bfl_sell_shares: "Aktien verkaufen"
 bfl_sell_shares_desc: "Wählen Sie einen Ihrer Bestände und eine Menge. Der Hidden Market Maker kauft Ihre Aktien sofort zum Marktkurs abzüglich des angezeigten Händler-Spreads. KI-Banken kaufen ihre Bestände im Hintergrund."
 bfl_sell_shares_tip: "Wählen Sie einen Ihrer Bestände und eine Menge. Der Hidden Market Maker kauft Ihre Aktien sofort zum Marktkurs abzüglich des angezeigten Händler-Spreads. KI-Banken kaufen ihre Bestände im Hintergrund.\nErfordert einen abgeschlossenen Austausch, Aktienhandel und mindestens einen Diplomaten. Jeder erfolgreiche Handel verbraucht einen Diplomaten und startet eine einmonatige Abklingzeit für diesen Emittenten. Verfügbare Diplomaten: [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bfl_available_trade_diplomats')|2]. Bestellungen müssen einen Barwert von mindestens haben 0.01 Gold."
 bfl_sell_state_confirm_desc: "Verkaufen [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_quantity').GetValue|3] Anteile Ihrer Treasury-Beteiligung an [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_issuer').GetCountry.GetName] für [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_total').GetValue|2]@gold!, an die Staatskasse Ihres Landes gezahlt. Die Bank erhält keine Finanzierung und ausgegebene Aktien verändern sich nicht. Der versteckte Händler garantiert den angezeigten Kurs, einschließlich des angegebenen Händler-Spreads. Die Abwicklung verbraucht einen Diplomaten und startet eine einmonatige Kauf-/Verkaufs-Abklingzeit für diesen Emittenten. Die Währungshoheit Ihrer Charta bleibt bei Ihnen."
 bfl_share_01_tip: "#T [Country.MakeScope.GetVariable('bfl_shr_01_party').GetCountry.GetName]#!\nAktien: [Country.MakeScope.GetVariable('bfl_shr_01_units').GetValue|2]\nEigentum: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_share_fraction_01')|%2]"
