 AM_bfl_chartered_bank: "Chartered Bank"
 LEAD_bfl_chartered_bank: "Controller einer Chartered Bank"
 MODIFIER_TYPE_DESC_bfl_bank_headquarters_cost_reduction: "Eine fertiggestellte Zentrale unterstützt die Bank oder die von ihrem Staat zugelassene Bank bei dieser Reduzierung wiederkehrender Verwaltungsarbeiten. Die Unterstützung durch das Hauptquartier ist auf begrenzt 15% und erfordert kein souveränes Kapital."
 MODIFIER_TYPE_DESC_bfl_bank_loan_yield_bonus: "Fügt Prozentpunkte zu den Zinssätzen hinzu, die für neue Bankdarlehen angeboten werden, im Rahmen des Normalwerts 20% Decke. Der Zugang zu einheimischen Gütern skaliert den Beitrag des Gebäudes. Bestehende Kredite behalten ihre akzeptierten Zinssätze."
 MODIFIER_TYPE_DESC_bfl_bank_operating_expenses_modifier: "Ändert den wiederkehrenden Verwaltungsaufwand der Bank nach Reduzierungen im Rahmen der gewöhnlichen Geschäftstätigkeit. Positive Werte erhöhen die Kosten; negative Werte reduzieren sie. Dadurch ändert sich die Verwaltung, nicht die Einlagenzinsen, die lokale Gebäudeinstandhaltung oder bestehende Kreditverträge."
 MODIFIER_TYPE_DESC_bfl_bank_palace_cost_reduction: "Reduziert den wiederkehrenden Verwaltungsaufwand der Eigentümerbank. Der Zugang zu einheimischen Gütern skaliert den Beitrag des Gebäudes. Kautionszinsen, lokale Gebäudeunterhaltung und bestehende Verträge werden gesondert berechnet."
 MODIFIER_TYPE_DESC_bfl_bank_share_price_bonus: "Erhöht den Sekundäraktienkurs der besitzenden Bank um diesen Prozentsatz. Der Zugang zu einheimischen Gütern skaliert den Beitrag des Gebäudes. Nettoinventarwert, Barmittel und Eigentumsanteile bleiben unverändert."
 MODIFIER_TYPE_DESC_bfl_base_share_value_modifier: "Erhöht den sekundären Aktienkurs der Bank im Vergleich zu ihrer gewöhnlichen Bewertung. Es werden keine Barmittel geschaffen, der Nettoinventarwert wird nicht verändert, es werden keine neuen Aktien ausgegeben oder Eigentumsanteile geändert."
 MODIFIER_TYPE_DESC_bfl_commenda_expertise: "Ein vertrauenswürdiges Netzwerk erhöht die Bereitschaft der Länder, profitable Commenda-Angebote anzunehmen, und erhöht den ausgehandelten Anteil der Bank am realisierten Risikoüberschuss um diesen Prozentsatz. A 10% Bonusänderungen a 75% teilen zu 82.5%, oder ein 50% teilen zu 55%. Es entsteht kein Gewinn: Sämtliche Zahlungen erfolgen aus den tatsächlichen Erlösen der genannten Tätigkeit. Akzeptierte Vereinbarungen behalten ihre ursprünglichen Bedingungen."
 MODIFIER_TYPE_DESC_bfl_copper_market_demand: "Der abgeschlossene Fuggerhauser fügt eine benannte, nicht stapelbare Nachfrage nach Kupfer in seinem eigenen Markt hinzu. Einheimisches Angebot und Nachfrage bestimmen den resultierenden Preis. Warenverträge behalten ihre vereinbarten Bedingungen."
 MODIFIER_TYPE_DESC_bfl_enable_advanced_clearing: "Schaltet die Nettoabwicklung verifizierter gegenseitiger Verpflichtungen zwischen teilnehmenden Institutionen frei. Das Clearing muss die Ansprüche jedes Inhabers wahren und den finanzierten Nettosaldo begleichen, ohne Geld zu schaffen. Die native Interbankenabwicklung ist weiterhin nicht möglich."
 MODIFIER_TYPE_DESC_bfl_enable_bank_capital_subscriptions: "Ermöglicht primäre Abonnements von 100 Gold in eine Bank. Neue Eigentumsanteile werden zum aktuellen Nettoinventarwert bewertet. Der Zeichnungserlös erhöht das eingezahlte Kapital und nicht den realisierten Gewinn und erwirbt einen proportionalen Anspruch auf spätere Ausschüttungen."
 MODIFIER_TYPE_DESC_bfl_enable_bank_share_dealing: "Ermöglicht dem Bankaktienübertragungsdienst die Übertragung bestehender registrierter Anteile zwischen identifizierten Inhabern. Durch eine Übertragung wird der Eigentümer gewechselt, ohne dass neue Anteile ausgegeben werden oder ein Bankgewinn entsteht. Das Register muss über Kapazitäten verfügen und den Anspruch jedes Inhabers wahren."
 MODIFIER_TYPE_DESC_bfl_enable_collateralization: "Schaltet aufgezeichnete Sicherheiten und deren Berechtigungsprüfungen frei. Belastete Vermögenswerte können keine Zweitforderung sichern, und die Beitreibung muss das ursprüngliche Schuldverhältnis wahren. Die Ausführung nativer Sicherheiten ist weiterhin nicht verfügbar."
 MODIFIER_TYPE_DESC_bfl_enable_commenda: "Schaltet akzeptierte Commenda-Partnerschaften nach Basic Financial Instruments in the Age of Discovery frei. Ausländische Investmentbanken können einen identifizierten Frachtvorgang oder eine Expedition finanzieren. Native Kosten, Verwahrung und gemessener Verkaufserlös bestimmen die Rendite; Das Kapital bleibt gefährdet."
 MODIFIER_TYPE_DESC_bfl_enable_commercial_bills: "Ermöglicht vollständig finanzierte Zahlungsrechnungen. Der Käufer zahlt 100 Gold vor der Ausgabe; Die Bank weist eine gleichwertige Verbindlichkeit und Barverpflichtung aus. Der genannte Inhaber kann den Wechsel nach einem Monat nur einmal einlösen. Ausgabe ist kein Gewinn."
 MODIFIER_TYPE_DESC_bfl_enable_commodity_forwards: "Schaltet Merchant Finance-Forward-Delivery-Verträge frei. In jeder Vereinbarung müssen Vertragspartner, Waren, Menge, Liefertermin und Sicherheit erfasst werden, ohne dass belastete Bestände wiederverwendet werden. Die native Handelsausführung ist weiterhin nicht verfügbar."
 MODIFIER_TYPE_DESC_bfl_enable_commodity_investments: "Schaltet das Merchant Finance-Inventarmandat frei. Rohstoffpositionen müssen finanzierte einheimische Warenbestände darstellen und Anschaffungskosten, Menge und Verwahrung wahren. Die Handelsausführung ist in diesem Entwicklungs-Build weiterhin nicht verfügbar."
 MODIFIER_TYPE_DESC_bfl_enable_company_equity: "Schaltet das Aktienmandat der Overseas Investment Company frei. Finanzielle Anteile werden getrennt von der politischen Subjektkontrolle erfasst. Nur geprüfte Unternehmensausschüttungen können zu Bankeinnahmen werden; Zeichnungen und Kapitalrückzahlungen sind ausgeschlossen. Die native Ausführung bleibt weiterhin nicht verfügbar."
 MODIFIER_TYPE_DESC_bfl_enable_corporate_credit: "Schaltet das Merchant Finance-Firmenkreditmandat frei. Kredite müssen Bankgelder an ein identifiziertes Unternehmen übertragen und einen gleichwertigen einbringlichen Anspruch begründen; Tilgungszahlungen gehen nicht in den Gewinn ein. Die native Ausführung bleibt weiterhin nicht verfügbar."
 MODIFIER_TYPE_DESC_bfl_enable_debt_restructuring: "Schaltet das souveräne Restrukturierungsmandat frei. Die geänderte Fälligkeit, Zinsen und Kapital müssen mit Zustimmung des Schuldners an die bestehende Forderung angehängt werden. Die Ausführung bleibt solange nicht verfügbar, bis der native Schuldenausgleich unterstützt wird."
 MODIFIER_TYPE_DESC_bfl_enable_liquidity_facilities: "Schaltet gesicherte temporäre Liquidität frei. Die Finanzierung muss von einer echten Gegenpartei erfolgen, innerhalb der Barmittel- und Kapitalgrenzen bleiben und über eingetragene Sicherheiten verfügen. Abhebungen in der Warteschlange behalten Vorrang. Die Ausführung der nativen Einrichtung ist weiterhin nicht verfügbar."
 MODIFIER_TYPE_DESC_bfl_enable_margining_and_risk_management: "Schaltet Margin-Anforderungen für Merchant Finance-Forward-Positionen frei. Das Risiko muss anhand der verfügbaren Sicherheiten und Barmittel gemessen werden, wobei zusätzliche Mittel erforderlich sind, bevor die Verpflichtungen steigen. Nativer Handel und Margin-Ausführung sind weiterhin nicht verfügbar."
 MODIFIER_TYPE_DESC_bfl_enable_project_security: "Schaltet Sicherheit für Auslandsinvestitionsprojekte frei. Identifizierte Projektvermögenswerte und -erlöse müssen an eine einzige erfasste Verpflichtung verpfändet werden, wobei der Vorrang durch Begleichung oder Einziehung gewahrt bleiben muss. Die native Projektausführung bleibt weiterhin nicht verfügbar."
 MODIFIER_TYPE_DESC_bfl_enable_public_financial_backstops: "Schaltet das öffentliche Backstop-Mandat für eine autorisierte, konzessionierte Bank frei. Für die Unterstützung sind ein echter Treasury-Beitrag und eingetragene Forderungen oder Eigentumsanteile erforderlich. Garantien können weder Bargeld prägen noch Verluste ausgleichen. Die Ausführung einer ständigen Rücklaufsperre ist noch nicht implementiert."
 MODIFIER_TYPE_DESC_bfl_enable_sovereign_banknotes: "Schaltet die Ausgabe von Staatsanleihen für eine autorisierte, zugelassene Bank frei. Schuldverschreibungen sind rückzahlbare Verbindlichkeiten; Die Deckung schließt Barmittel aus, die durch den Verkauf der Schuldverschreibungen selbst erzielt werden. Die native Ausgabe und Weiterleitung von Inhaberzahlungen ist weiterhin nicht verfügbar."
 MODIFIER_TYPE_DESC_bfl_enable_term_deposits: "Ermöglicht Festzinseinlagen von 100 Gold mit einer Laufzeit von zwölf Monaten. Die Zinsen fallen monatlich zu dem bei der Kontoeröffnung akzeptierten Zinssatz an; unreifes Kapital kann nicht zurückgezogen werden. Einlagen bleiben Verbindlichkeiten der Bank."
 MODIFIER_TYPE_DESC_bfl_enable_warehouse_receipts: "Schaltet Merchant Finance-Belege frei, die durch identifizierte Lagerbestände gesichert sind. Jede Quittung reserviert zehn unbelastete Einheiten und erhebt eine Gebühr für die gedeckte Verwahrung. Die Verwahrung einheimischer Waren muss unterstützt werden, bevor neue Quittungen ausgestellt werden können."
 MODIFIER_TYPE_DESC_bfl_fine_cloth_market_demand: "Der fertiggestellte Palazzo Peruzzi fügt eine benannte, nicht stapelnde Nachfrage nach feinen Stoffen auf seinem eigenen Markt hinzu. Einheimisches Angebot und Nachfrage bestimmen den resultierenden Preis. Warenverträge behalten ihre vereinbarten Bedingungen."
 MODIFIER_TYPE_DESC_bfl_global_bank_access: "Die Bank kann ein Land bedienen, in dessen Hauptstadt es keine vollständige Bankfiliale gibt. Es gelten weiterhin Forschungs-, Spezialisierungs-, Diplomatie-, Einwilligungs-, Liquiditäts- und Kapitalanforderungen."
 MODIFIER_TYPE_DESC_bfl_loan_profitability_modifier: "Multipliziert die Zinssätze für neu angebotene Kredite. A 5% Bonusänderungen a 10% Zitat zu 10.5%, vorbehaltlich der normalen 20% Decke. Der Kreditnehmer muss das Angebot annehmen; Bestehende Kredite behalten ihre vereinbarten Zinssätze."
 MODIFIER_TYPE_DESC_bfl_no_automatic_tribute_cost_modifier: "Die Charterbeziehung hat keinen automatischen Tribut. Die Staatseinnahmen stammen aus Einlagenzinsen und Dividenden auf eigene Bankaktien."
