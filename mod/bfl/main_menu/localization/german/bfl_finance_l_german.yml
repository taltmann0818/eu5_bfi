 bfl_cost_title: "Betriebskosten von [Country.GetName]"
 bfl_credit_1_desc: "Eine Bank bietet an 100 Gold für 60 Monate zum angegebenen Jahrespreis. Bei der Annahme werden Finanzierung, Autorität, Schuldenkapazität und Ihre Berechtigung erneut überprüft. Das Wichtigste ist die Finanzierung, nicht das Einkommen.\nJahresrate: [ROOT.GetCountry.MakeScope.GetVariable('bfl_credit_offer_rate').GetValue|%1]."
 bfl_credit_1_title: "Kreditangebot"
 bfl_credit_2_desc: "Ihr Kreditgeber bietet a 20% Kapitalermäßigung und eine jährliche Zinsermäßigung um einen Prozentpunkt (mindestens). 1%). Dadurch ändert sich lediglich das bestehende ungesicherte Darlehen. Seine Reife bleibt unverändert."
 bfl_credit_2_title: "Angebot zur Entschuldung"
 bfl_credit_accept: "Akzeptieren Sie die Bedingungen"
 bfl_credit_partial: "Stattdessen zurückzahlen 25% dieser Forderung einschließlich ihrer ursprünglichen Restzinsen"
 bfl_credit_refinance: "Begleichen Sie stattdessen diese Forderung und refinanzieren Sie den Kapitalbetrag 60 Monate"
