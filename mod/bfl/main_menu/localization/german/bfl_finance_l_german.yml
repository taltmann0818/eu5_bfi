 bfl_cost_payment_detail: "Die Kosten skalieren mit der Komplexität, nicht mit dem Vermögenswert. Wird einmal monatlich über den geschützten Reserven berechnet; unbezahlte Ausgaben schränken die Dividende ein. Einlagenzinsen und einheimische Kosten sind getrennt. Ordentliche Ermäßigungen addieren sich, dann gilt der Kostenmultiplikator der Bankenverfassung. Die Gesamtsumme wird auf Cent gerundet."
