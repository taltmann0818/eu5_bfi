 bfl_accept_money_claims.desc: "Akzeptieren Sie freiwillig vollständig finanzierte Rechnungen und Banknoten, die durch Mod-Interaktionen zum Nennwert angeboten werden, oder hören Sie auf, sie anzunehmen. Eine Überweisung erfordert weiterhin Ihre verfügbare Kasse. Anerkannte Forderungen bleiben auch nach Annahmeschluss einlösbar. Für einheimische Zahlungen wird weiterhin Gold verwendet."
 bfl_accept_money_claims.title: "Aktivieren Sie die Option „Annahme von Bankzahlungsansprüchen“."
 bfl_accounts_explanation: "Die einheimische Staatskasse ist Bargeld. Einlagen und Schuldscheine sind Verbindlichkeiten. Bei der Kreditvergabe wird Bargeld gegen einen Vermögenswert eingetauscht. Kapital, Zeichnungen und Emissionen sind kein Gewinn."
 bfl_activity_title: "Nettoeinkommen"
 bfl_activity_title_tip: "Native Coupon-Beobachtungen klassifizieren das native Nettobudget; Sie bewegen Gold nie zweimal. Der abgerechnete native Rückzahlungserlös gibt die tatsächlichen Anschaffungskosten frei, bevor ein Gewinn oder Verlust erfasst wird. Unternehmensausschüttungen und individuell finanzierte Einnahmen werden in eigene Bereiche aufgenommen. Kapitalbeträge, Einlagen und Abonnements sind vom Gewinn ausgeschlossen."
 bfl_administer_estates: "Verwalten Sie geerbte Vermögensgegenstände"
 bfl_administer_estates.desc: "Überprüfen Sie separat gehaltene Barmittel und Verbindlichkeiten eines zerstörten Instituts. Die Treuhänderbehörde macht ihr Bargeld niemals zu einem Teil der Staatskasse."
 bfl_administer_estates.title: "Verwalten Sie geerbte Vermögensgegenstände"
 bfl_administer_estates_desc: "Überprüfen Sie separat gehaltene Barmittel und Verbindlichkeiten eines zerstörten Instituts. Die Treuhänderbehörde macht ihr Bargeld niemals zu einem Teil der Staatskasse."
 bfl_advanced_clearing: "Erweitertes Clearing"
 bfl_advanced_clearing_desc: "Bankhäuser, die einander viele Zahlungen schulden, müssen nicht jede Verbindlichkeit einzeln in Münzen begleichen. Verrechnungskonten gleichen ihre Forderungen ab und übertragen nur den Restbetrag, wodurch der Geldbedarf zur Aufrechterhaltung des Handels verringert wird."
 bfl_advanced_tip: "Forschung erschließt das Mandat. Darüber hinaus muss die Bank ihre Spezialisierungs-, Liquiditäts- und Betriebsanforderungen erfüllen. Die nicht verfügbare Ausführung bleibt deaktiviert."
 bfl_ai_equity_offering: "Zulassung von Bank- und offenen Kapitalangeboten"
 bfl_ai_equity_offering_desc: "Das AI-Management kann nach dem Aktienhandel und einem abgeschlossenen Umtausch seine eigene Bank angeben und bezahlte Hauptzeichnungen genehmigen. Durch die Aufnahme entstehen keine Barmittel oder Anteile."
 bfl_ai_equity_purchase: "Erwägen Sie finanzierte Börseninvestitionen"
 bfl_ai_equity_purchase_desc: "Der KI-Kauf nutzt die gleichen Live-Recherchen, Gebäude, Autorität, Kapazität und Bestätigungsprüfungen für exakte Angebote wie der Spieler. Monatliche Chancenüberprüfung, mit mindestens 500 Gold aus Bargeld und Kapitalüberschuss. Keine über dem Markt liegenden Anfragen."
 bfl_ai_exchange_priority: "Priorisieren Sie den Börsenzugang"
 bfl_annual_dividends: "Jährlicher Dividendensatz"
