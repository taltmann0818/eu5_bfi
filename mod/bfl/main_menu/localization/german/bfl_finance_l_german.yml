 bfl_venture_accept: "Akzeptieren Sie die Partnerschaft"
 bfl_venture_accept_tip: "Überprüfen Sie noch einmal die Befugnisse der Live-Investoren, die unveränderten Angebotsbedingungen, das Alter, das Research, das freie Bargeld, das Kapital, die Kapazität und den Betreiberbeitrag. Durch die Finanzierung werden nur die tatsächlichen nativen Kosten der ausgewählten Aktivität bezahlt. Es gewährt keine Unternehmensanteile oder politische Kontrolle."
 bfl_venture_decline: "Ablehnen"
 bfl_venture_duration_12: "Dauer · 12 Monate"
 bfl_venture_duration_120: "Dauer · 120 Monate"
 bfl_venture_duration_24: "Dauer · 24 Monate"
 bfl_venture_duration_6: "Dauer · 6 Monate"
 bfl_venture_duration_60: "Dauer · 60 Monate"
 bfl_venture_duration_tip: "Zyklus 6, 12, 24, 60 oder 120 Monate. Lange Laufzeiten ermöglichen die Erkundung einheimischer Natur. Fracht wird nach zwei Monaten verkauft, wenn der einheimische Zugang gültig bleibt; Die blockierte Ladung bleibt in Gewahrsam. Expeditionskosten ohne damit verbundenen Verkaufserlös werden bei Fälligkeit abgeschrieben."
 bfl_venture_empty: "Keine aktiven Unternehmungen. Wählen Sie einen Frachtbetrieb oder eine einheimische Expedition aus, bevor Sie Konditionen anbieten."
 bfl_venture_help: "Klicken Sie auf einen Begriff, um ihn zu durchlaufen. Jeder Betreiber akzeptiert separat. Bestehende Vereinbarungen bleiben auch nach einer Richtlinien- oder Forschungsänderung bestehen."
 bfl_venture_hint: "Bewegen Sie den Mauszeiger über Aktivität, Kosten, Fracht und Retouren"
 bfl_venture_locked: "Neue Unternehmungen gesperrt · Warten Sie auf Anforderungen"
 bfl_venture_note: "Das Kapital wird vor dem Gewinn zurückgewonnen. Verluste folgen Beiträgen. Nur die erworbene Fracht des genannten Unternehmens kann seinen Erlös finanzieren. Unabhängiger Handel zahlt diese Vereinbarung niemals. Entdeckung allein zahlt sich nicht aus. Geschlossene Reihen bleiben bestehen, bis sie durch eine neu akzeptierte Vereinbarung ersetzt werden."
 bfl_venture_offer_desc: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_bank').GetCountry.GetName] Angebote [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_ticket').GetValue|0] Gold für [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_duration').GetValue|0] Monate. Voreingestellt [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_preset').GetValue|0]: 0 = Investor investiert das gesamte Kapital, erhält 75% von Überschuss; 1 = Investor trägt zwei Drittel bei, Betreiber ein Drittel, Überschuss wird zu gleichen Teilen aufgeteilt. Zuerst wird das Kapital zurückgewonnen; Verluste folgen Beiträgen. Nur der tatsächliche Verkaufserlös des genannten Betriebes kann einen Gewinn abwerfen. Der Erfolg einer Exploration bietet eine Chance, niemals Gold. Dieses Angebot endet in drei Monaten."
 bfl_venture_offer_desc_0: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_bank').GetCountry.GetName] genehmigt bis zu [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_ticket').GetValue|0] Gold der Bankfinanzierung für [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_duration').GetValue|0] Monate. Kaufen 10 [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_good').Goods.GetNameWithNoTooltip] in [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_from').GetMarket.GetName], trage sie zwei Monate lang und verkaufe sie dann [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_to').GetMarket.GetName]. Die Bank übernimmt alle Kosten und Einnahmen 75% des Überschusses.\n\nEs werden nur die tatsächlichen nativen Kosten berücksichtigt. Ungenutzte Mittel verbleiben bei der Bank. Das Kapital wird vor dem Überschuss zurückgewonnen; Verluste folgen Beiträgen. Nur der gemessene Verkaufserlös dieser Ladung erfüllt diese Vereinbarung. Unabhängiges Einkommen und Entdeckung zahlen nichts. Das Angebot endet in drei Monaten."
 bfl_venture_offer_desc_1: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_bank').GetCountry.GetName] genehmigt bis zu [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_ticket').GetValue|0] Gold der Bankfinanzierung für [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_duration').GetValue|0] Monate. Kaufen 10 [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_good').Goods.GetNameWithNoTooltip] in [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_from').GetMarket.GetName], trage sie zwei Monate lang und verkaufe sie dann [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_to').GetMarket.GetName]. Die Bank übernimmt zwei Drittel der Kosten; Sie zahlen ein Drittel. Der Überschuss wird zu gleichen Teilen aufgeteilt.\n\nEs werden nur die tatsächlichen nativen Kosten berücksichtigt. Ungenutzte Mittel verbleiben bei der Bank. Das Kapital wird vor dem Überschuss zurückgewonnen; Verluste folgen Beiträgen. Nur der gemessene Verkaufserlös dieser Ladung erfüllt diese Vereinbarung. Unabhängiges Einkommen und Entdeckung zahlen nichts. Das Angebot endet in drei Monaten."
 bfl_venture_offer_desc_2: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_bank').GetCountry.GetName] genehmigt bis zu [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_ticket').GetValue|0] Gold der Bankfinanzierung für [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_duration').GetValue|0] Monate. Bereiten Sie die native Erkundung vor [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_area').GetArea.GetName] von [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_port').GetLocation.GetName] mit [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_explorer').GetCharacter.GetName]. Die Bank finanziert alle vereinbarten Goldkosten und -einnahmen 75% des vertraglichen Überschusses. Für die Vorbereitung ist keine Rückerstattung möglich, auch nicht bei Stornierung. Sie übernehmen die Besatzung, den Unterhalt vor Ort und optionale Expeditionskosten außerhalb dieser Finanzierungsvereinbarung. Mit der verbleibenden Bankgenehmigung kann eine Ladung von zehn Einheiten von einem Markt in oder an der Grenze des entdeckten Gebiets finanziert werden, vorbehaltlich des örtlichen Zugangs. Nur der gemessene Umsatz dieser Fracht abzüglich der erfassten Vorbereitungs- und Frachtkosten kann den vertraglichen Überschuss decken. Entdeckung und unabhängiger Handel zahlen nichts. Das Angebot läuft in drei Monaten ab. "
 bfl_venture_offer_desc_3: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_bank').GetCountry.GetName] genehmigt bis zu [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_ticket').GetValue|0] Gold der Bankfinanzierung für [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_duration').GetValue|0] Monate. Bereiten Sie die native Erkundung vor [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_area').GetArea.GetName] von [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_port').GetLocation.GetName] mit [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_explorer').GetCharacter.GetName]. Die Bank finanziert zwei Drittel der vereinbarten Goldkosten; Sie zahlen ein Drittel. Der vertragliche Überschuss wird zu gleichen Teilen aufgeteilt. Für die Vorbereitung ist keine Rückerstattung möglich, auch nicht bei Stornierung. Sie übernehmen die Besatzung, den Unterhalt vor Ort und optionale Expeditionskosten außerhalb dieser Finanzierungsvereinbarung. Mit der verbleibenden Bankgenehmigung kann eine Ladung von zehn Einheiten von einem Markt in oder an der Grenze des entdeckten Gebiets finanziert werden, vorbehaltlich des örtlichen Zugangs. Nur der gemessene Umsatz dieser Fracht abzüglich der erfassten Vorbereitungs- und Frachtkosten kann den vertraglichen Überschuss decken. Entdeckung und unabhängiger Handel zahlen nichts. Das Angebot läuft in drei Monaten ab. "
 bfl_venture_offer_title: "Eine empfehlenswerte Partnerschaft"
 bfl_venture_outcome_1: "Verknüpfte einheimische Expedition im Gange"
 bfl_venture_outcome_10: "Kosten oder Aktivität geändert · Autorisierung freigegeben"
 bfl_venture_outcome_2: "Entdeckung erfasst · Handelsquittungen sind noch erforderlich"
 bfl_venture_outcome_3: "Die Expedition endete ohne bestätigten Fund"
 bfl_venture_outcome_4: "Fracht im Transit · Einheimischer Kauf durchgeführt"
 bfl_venture_outcome_5: "Lieferung gesperrt · übernommene Ladung einbehalten"
 bfl_venture_outcome_6: "Fracht verkauft · nur gemessener Erlös abgerechnet"
 bfl_venture_outcome_7: "Legacy-Abfluss · kein aktivitätsbezogener Überschuss"
 bfl_venture_outcome_8: "Native Vorbereitung oder Ergebnis warten auf Bestätigung"
 bfl_venture_outcome_9: "Betreiber existiert nicht mehr · Sorgerecht beeinträchtigt"
 bfl_venture_policy: "Bedingungen"
 bfl_venture_preset_0: "Einseitig · 75% Banküberschuss"
 bfl_venture_preset_1: "Bilateral · gleicher Überschuss"
 bfl_venture_preset_tip: "Einseitig: Die Bank finanziert das gesamte Kapital und erhält es 75% des Überschusses. Bilateral: Bank finanziert zwei Drittel, Betreiber ein Drittel, Überschüsse werden zu gleichen Teilen aufgeteilt. Verluste folgen Kapitaleinlagen."
 bfl_venture_settings_tip: "Erweitern Sie die vorgeschlagenen Begriffe. Änderungen betreffen nur zukünftige Angebote; Akzeptierte Projekte behalten ihre ursprüngliche Vereinbarung."
 bfl_venture_state_1: "Aktiv · Risikokapital"
 bfl_venture_state_2: "Geschlossen · Kapital zurückgewonnen"
 bfl_venture_state_3: "Geschlossen · Verlust erfasst"
 bfl_venture_state_4: "Nicht finanziert · Ausführung nicht verfügbar"
 bfl_venture_subtitle: "Benannte Aktivitäten · gemessene Kosten und Umsätze"
 bfl_venture_ticket_100: "Fördergrenze · 100 Gold"
 bfl_venture_ticket_200: "Fördergrenze · 200 Gold"
 bfl_venture_ticket_400: "Fördergrenze · 400 Gold"
 bfl_venture_ticket_tip: "Zyklus eine maximale Bankautorisierung von 100, 200 oder 400 Gold. Es werden nur die tatsächlichen Kosten der Aktivität berücksichtigt. Ungenutzte Frachtmittel werden sofort freigegeben; Ungenutzte Expeditionsgelder bleiben bis zur Fälligkeit für eine berechtigte entdeckte Fracht reserviert. Bei bilateralen Bedingungen ist eine Kapazität für die Hälfte der Bankgenehmigung des Betreibers erforderlich."
 bfl_venture_title: "Commenda Ventures"
 bfl_ventures: "Ventures und Unternehmen · Auslandsinvestitionen"
 bfl_ventures_explanation: "Commenda beginnt in Discovery; Einheimische Unternehmen und Unternehmensbeteiligungen bedürfen einer Reformation. Die Kontrolle des politischen Oberherrn und das finanzielle Eigentum bleiben getrennt. Projektkapital ist keine Dividende."
 bfl_ventures_tip: "#T Unternehmungen und Unternehmen#!\nGenehmigungen für finanzierte Unternehmungen, Unternehmensinvestitionen, Projektsicherheiten und Bankanteilübertragungen. Diese setzen das Kapital einem Anlagerisiko aus und erfordern entsprechende Forschung und Spezialisierung."
 bfl_view_companies: "Unternehmen"
 bfl_view_goods: "Waren"
 bfl_view_loans: "Kredite"
 bfl_view_monetary: "Gelddienstleistungen"
 bfl_view_monetary_tip: "Banknoten, gesicherte Liquidität und Clearing."
 bfl_view_shares: "Aktien"
 bfl_view_trade: "Handelsfinanzierung"
 bfl_warehouse_receipt: "Lagerbeleg"
 bfl_warehouse_receipt_tip: "#T Lagerbeleg#!\nGelten Sie eine Reklamation gegen identifizierbare gelagerte Waren. Erfordert Recherche zu Lagerbelegen, Handelsfinanzierung und dem Zeitalter des Absolutismus oder später. Verifizierte Lagerung und Warenausführung sind in diesem Build nicht verfügbar."
 bfl_warehouse_receipts: "Lagerbelege"
 bfl_warehouse_receipts_desc: "Waren, die in einem seriösen Lager aufbewahrt werden, können den Handel unterstützen, ohne dass sie bei jedem Verkauf bewegt werden müssen. Eine Quittung begründet einen Anspruch auf die gelagerte Ware und ermöglicht dem Eigentümer, eine Finanzierung zu erhalten, während die Ware in Verwahrung bleibt."
 bfl_withdraw: "Ziehen Sie fällige staatliche Einlagen ab"
 bfl_withdraw_tip: "#T Ziehen Sie fällige staatliche Einlagen ab#!\nFordern Sie die Rückzahlung der Tagesgeldkonten und fälligen Terminkonten Ihres Staates an. Die Bank zahlt Kapital und gutgeschriebene Zinsen aus dem verfügbaren Bargeld. Unbezahlte Beträge bleiben in der Auszahlungswarteschlange erfasst und neue Geschäfte werden ausgesetzt. Ausländische Konten und nicht fällige Termineinlagen können durch diese Aktion nicht abgehoben werden."
 bfl_workout_decline: "Behalten Sie den vollständigen Anspruch"
 bfl_workout_desc: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_workout_bank').GetCountry.GetName] schlägt Konditionen für Ihre Einzahlung vor [ROOT.GetCountry.MakeScope.GetVariable('bfl_workout_claim').GetValue|2] Gold. Sie können darauf verzichten 20% des verbleibenden Anspruchs, wandeln Sie den gesamten Anspruch in neu ausgegebene Aktien zum materiellen Nettoinventarwert vor der Umwandlung um oder behalten Sie Ihren Anspruch. Die Umwandlung erfordert einen positiven Nettoinventarwert und eine positive Aktionärskapazität und steht Bankgläubigern nicht zur Verfügung. Gläubigerpool [ROOT.GetCountry.MakeScope.GetVariable('bfl_workout_pool').GetValue|0]: 0 Schatzkammer, 1 Bürger, 2 Adlige, 3 Geistliche, 4 Bauern. Die Bedingungen des Nachlasses erfordern das vom Nachlass erlassene Trainingsmandat. Das Angebot läuft diesen Monat ab; eine Sanierung oder ein Wechsel in der Geschäftsführung macht es ungültig."
 bfl_workout_equity: "Wandeln Sie den Anspruch in Aktien um (positiver NAV erforderlich)"
 bfl_workout_haircut: "Akzeptiere a 20% Reduzierung"
 bfl_workout_title: "Vorschlag zur Gläubigerbereinigung"
 bfl_workout_trade_access: "Konzession für den Fitnesshandel"
 bfl_workout_trade_access_desc: "Der Handelsschutz wird durch eine gesondert vereinbarte Anleiheabwicklung für bis zu zwei Jahre aufgehoben. Bestehende gewöhnliche Handelszugangsabkommen sind von diesem Zugeständnis unabhängig."
