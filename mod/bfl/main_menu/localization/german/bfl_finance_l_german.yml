 bfl_sovereign_accounts: "Staatskonten – getrennt vom Bankvermögen"
 bfl_sovereign_accounts_subtitle: "Einheimische Staatsanleihen – keine Bankvermögenswerte"
 bfl_sovereign_accounts_tip: "Diese einheimischen Schulden und Forderungen gehören dem Staat, nicht seiner Bank. Bankkredite sind im Asset Donut enthalten; Zu den Bankverbindlichkeiten zählen Einlagen und unbezahlte Betriebskosten. Die einheimische Rückzahlung behält den Souverän als Akteur."
 bfl_sovereign_banknotes: "Souveräne Banknoten"
 bfl_sovereign_banknotes_desc: "Eine von der öffentlichen Hand unterstützte Bank kann anstelle schwerer Münzen schriftliche Zahlungsversprechen in Umlauf bringen. Ihre Annahme beruht auf der Gewissheit, dass die Institution sie einlösen wird und dass die ausstellende Behörde ihren Verpflichtungen nachkommen wird."
 bfl_sovereign_credit: "Staatskredit"
 bfl_sovereign_credit_tip: "#T Staatskredit#!\nEin Darlehen aus Bankgeldern an einen Grundeigentum, wobei ein Rückzahlungsanspruch als Bankvermögenswert erfasst wird. Erfordert eine funktionierende Bank und die lokalen Kreditbedingungen. Die Ausführung neuer Kredite ist in diesem Build nicht verfügbar."
 bfl_sovereign_debt: "Staatsschulden"
 bfl_sovereign_debt_heading: "Staatsschulden von [Country.GetName]"
 bfl_sovereign_note: "Staatsanleihe"
 bfl_sovereign_note_tip: "#T Einlösbare Banknoten#!\nAbsolutismus, Forschung zu Staatsbanknoten, staatliche Autorisierung, eine Kapitalzentralbank und die Bankfiliale des Emittenten. Austausch 100 Art für eine vollständig vorbehaltene Forderung. Die unabhängige aktienbasierte Obergrenze schließt eingehende Barmittel aus. Freiwillige Paritätsübertragungen; Einheimische Zahlungen bleiben in Gold."
 bfl_sovereign_receivables: "Staatsforderungen"
 bfl_sovereign_receivables_heading: "Staatsforderungen von [Country.GetName]"
 bfl_sovereign_restructuring: "Staatliche Umstrukturierung"
 bfl_sovereign_restructuring_tip: "#T Staatliche Umstrukturierung#!\nVerhandeln Sie die Staatsschulden im Rahmen des Schuldenrestrukturierungsvorschusses neu. Erfordert das zulässige Alter, eine funktionierende Bank und eine unterstützte lokale Schuldentransaktion. Die native Umstrukturierungsausführung ist in diesem Build nicht verfügbar."
 bfl_specialization_title: "Bankspezialisierung"
 bfl_state_bonds_tip: "#T Staatsanleihekapazität#!\nAusstehende einheimische Staatsanleihen: [GetPlayer.GetNumBonds]\nMaximale native Bond-Slots: [GetPlayer.GetDoubleModifierValue('max_bonds', 'max_bonds_modifier')|0]\n\nHierbei handelt es sich um die Anleihen Ihres Staates, getrennt von den Einlagen, dem Eigenkapital und anderen Verbindlichkeiten der Bank. Die Kapazität umfasst native Basisslots und Bindungskapazitätsmodifikatoren. Auch für den Verkauf einer Anleihe gelten die einheimischen Kreditbedingungen."
 bfl_state_bonds_value: "Anleihen: [GetPlayer.GetNumBonds] / [GetPlayer.GetDoubleModifierValue('max_bonds', 'max_bonds_modifier')|0]"
 bfl_state_chartered_bank: "Staatlich anerkannte Bank"
 bfl_state_chartered_bank_desc: "Ein separat finanziertes einheimisches Banksubjekt. Der Staat besitzt zunächst alle Aktien und legt die monatliche Dividendenausschüttung in Kredit fest. Neue Bankzeichnungen erhöhen das Kapital und verwässern bestehende Eigentumsverhältnisse. Staatliche Einlagen werden privilegiert verzinst."
 bfl_state_credit: "Staatskredit"
 bfl_state_credit_value: "Kredit: [Multiply_CFixedPoint(GetPlayer.GetCreditworthiness, '(CFixedPoint)100')|0]"
 bfl_state_interest_value: "Interesse: [GetPlayer.GetModifierValueNoFormat('bank_interest')]"
