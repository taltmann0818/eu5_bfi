 bfl_money_hint: "Bewegen Sie den Mauszeiger über Reserven, Inhaber und Abrechnung"
 bfl_money_hint_tip: "Banknoten tauschen Bargeld gegen eine vollständig reservierte Forderung. Die Annahme ist freiwillig. Rabatte im Voraus 75 Gold gegen a 100-Gold-Drittbank-Schein. Das Clearing gleicht fällige Rechnungen nur dann aus, wenn jedes Mitglied seine Nettolast begleichen kann. Bestehende Ansprüche überdauern den Verlust von Behörden und Gebäuden."
 bfl_money_leave: "Verlassen Sie die Lichtung"
 bfl_money_leave_tip: "Banknoten tauschen Bargeld gegen eine vollständig reservierte Forderung. Die Annahme ist freiwillig. Rabatte im Voraus 75 Gold gegen a 100-Gold-Drittbank-Schein. Das Clearing gleicht fällige Rechnungen nur dann aus, wenn jedes Mitglied seine Nettolast begleichen kann. Bestehende Ansprüche überdauern den Verlust von Behörden und Gebäuden."
 bfl_money_lending_rate: "Neue Kreditbasis"
 bfl_money_lending_rate_tip: "Durchlaufen Sie die jährliche Basis für zukünftige normale Kredite 3%, 6% und 9%. Es gelten weiterhin Kreditnehmeranpassungen. Akzeptierte Kredite behalten ihre Zinssätze."
 bfl_money_notes: "Erwerben 100 in Notizen"
 bfl_money_notes_tip: "Erfordert Absolutismus, Recherche zu Zentralbanken und Staatsbanknoten, Live-Autorisierung des Staates, die vollständige Bankfiliale des Emittenten und die vollständige Zentralbank des Staates in der aktuellen Hauptstadt. 100 Schatzgold und ungenutzte Banknotenkapazität. Der kleinere von 25% Bankeigenkapital und 500 Goldkappen zirkulieren."
 bfl_money_offer_accept: "Finanzieren Sie den gesicherten Vorschuss"
 bfl_money_offer_accept_tip: "Fonds 75 Gold aus dem verfügbaren Bargeld des Kreditgebers, wenn der aktuelle Manager, das Angebot und die Sicherheiten der Drittbank weiterhin gültig sind. Der akzeptierte Jahressatz ist für diese Einrichtung festgelegt; Zumindest öffentliche Fördergebühren 9%."
 bfl_money_offer_decline: "Lehnen Sie die Anfrage ab"
 bfl_money_offer_decline_tip: "Schließen Sie diese Anfrage ab, ohne Gold zu bewegen oder Sicherheiten zu verpfänden."
 bfl_money_offer_desc: "Vorwärts 75 Gold gegen eine separat finanzierte 100-Goldschein, der bei einer dritten Bank aufbewahrt wird. A 25% Der Schuldenschnitt schützt den Kreditgeber. Der akzeptierte jährliche Diskontsatz gilt für einen Monat; Zumindest öffentliche Fördergebühren 9%. Bei der Abwicklung wird zunächst der Kreditgeber ausgezahlt und der Restbetrag an den Kreditnehmer zurückgegeben. Ungedeckte Sicherheiten sichern beide Ansprüche. Diese Anfrage läuft diesen Monat ab."
 bfl_money_offer_title: "Eine gesicherte Siedlungseinrichtung"
 bfl_money_policy_rate: "Zyklus zukünftiger Diskontsatz"
 bfl_money_policy_rate_tip: "Lassen Sie die Jahresrate für zukünftige gesicherte Vorschüsse durchlaufen 6%, 9% und 12%. Bei Abnahme wird ein Monat berechnet; bestehende Einrichtungen behalten ihre Gebühr. Zumindest öffentliche Fördergebühren 9%."
 bfl_money_redeem: "Staatsscheine einlösen"
 bfl_money_redeem_tip: "Lösen Sie alle vom souveränen Kontrolleur gehaltenen Banknoten zu ihrem Nennwert ein. Entgangene Befugnisse, Recherchen oder Zweigstellen heben bestehende Ansprüche nicht auf. Eine unbezahlte Forderung bleibt geschuldet."
 bfl_money_repay: "Gesicherte Einrichtung zurückzahlen"
 bfl_money_repay_tip: "Zahlen Sie den aktuell gesicherten Vorschuss zuzüglich der akzeptierten Festgebühr zurück, um die Verpfändung der Drittbankrechnung freizugeben. Erfordert ausreichend verfügbares Gold."
 bfl_money_revoke: "Autorität widerrufen"
 bfl_money_revoke_tip: "Hoheitliche Ermächtigung für neue Banknoten entziehen. Bestehende Scheine bleiben einlösbar."
 bfl_money_settings: "Politik"
 bfl_money_settings_tip: "Geldpolitik, Notenautorität, gesicherte Kredit- und Clearingkontrollen ein- oder ausblenden."
 bfl_money_settings_tip_tip: "Banknoten tauschen Bargeld gegen eine vollständig reservierte Forderung. Die Annahme ist freiwillig. Rabatte im Voraus 75 Gold gegen a 100-Gold-Drittbank-Schein. Das Clearing gleicht fällige Rechnungen nur dann aus, wenn jedes Mitglied seine Nettolast begleichen kann. Bestehende Ansprüche überdauern den Verlust von Behörden und Gebäuden."
 bfl_money_subtitle: "Einlösbare Forderungen · finanzierter Vergleich"
 bfl_money_subtitle_tip: "Banknoten tauschen Bargeld gegen eine vollständig reservierte Forderung. Die Annahme ist freiwillig. Rabatte im Voraus 75 Gold gegen a 100-Gold-Drittbank-Schein. Das Clearing gleicht fällige Rechnungen nur dann aus, wenn jedes Mitglied seine Nettolast begleichen kann. Bestehende Ansprüche überdauern den Verlust von Behörden und Gebäuden."
 bfl_money_terms: "Kapital und Ausgabe sind vom Einkommen ausgeschlossen. Die Abzinsungssätze gelten jährlich und werden bei Annahme festgelegt. Das Vertrauen sinkt 25 bei einem Reservedefizit; Vollständig abgesicherte Schuldverschreibungen verursachen keine Inflation. Bei Vanilla-Zahlungen wird weiterhin einheimisches Gold verwendet."
 bfl_money_terms_tip: "Banknoten tauschen Bargeld gegen eine vollständig reservierte Forderung. Die Annahme ist freiwillig. Rabatte im Voraus 75 Gold gegen a 100-Gold-Drittbank-Schein. Das Clearing gleicht fällige Rechnungen nur dann aus, wenn jedes Mitglied seine Nettolast begleichen kann. Bestehende Ansprüche überdauern den Verlust von Behörden und Gebäuden."
 bfl_money_title: "Geld & Abrechnung"
 bfl_money_title_tip: "Kapital und Ausgabe sind vom Einkommen ausgeschlossen. Die Abzinsungssätze gelten jährlich und werden bei Annahme festgelegt. Das Vertrauen sinkt 25 bei einem Reservedefizit; Vollständig abgesicherte Schuldverschreibungen verursachen keine Inflation. Bei Vanilla-Zahlungen wird weiterhin einheimisches Gold verwendet."
 bfl_mortzenhaus: "Mortzenhaus"
 bfl_mortzenhaus_desc: "Vom Mortzenhaus aus leiten Kaufleute Schiffe, Briefe und Kredite über die nördlichen Häfen. Die Zählräume entlasten die Verwaltung und das Netzwerk der Kanzlei lockt den Handel nach Hamburg."
 bfl_mortzenhaus_maintenance: "Verwaltung Mortzenhaus"
 bfl_native_credit_label: "Kreditportfolio"
 bfl_native_credit_label_tip: "Von der Bank gehaltene Kredite zum erfassten Anschaffungswert. Die Zeilen zeigen Kapital, Jahreszins und verbleibende Monate bei der letzten Überprüfung."
 bfl_native_tab: "Staatsdarlehen"
 bfl_native_takeover: "Native Übernahme"
 bfl_native_takeover_result_tt: "Unsere Bank erwirbt ein geeignetes Nachlassdarlehen zum angegebenen lokalen Preis. Die Nachlässe werden ausgezahlt, das gleiche Darlehen geht an die Bank über und der Kreditnehmer erhält kein neues Kapital. Die Bank muss über eine operative Niederlassung im Kapital des Kreditnehmers sowie über ausreichend freie Barmittel und Kapital verfügen."
 bfl_new_capital_subscription: "Zeichnen Sie neues Kapital"
 bfl_new_capital_subscription_desc: "Investieren 100@gold! der Mittel Ihrer Bank [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_issuer').GetCountry.GetName] als neu ausgegebenes Eigenkapital zu seinem materiellen Nettoinventarwert. Der Emittent erhält die Zahlung und bestehende Inhaber werden verwässert. Hierbei handelt es sich um eine Kapitalzeichnung, getrennt vom Aktienkauf. Bei der Ausführung werden der erfasste Nettoinventarwert, die ausgegebenen Einheiten, das Research, die geschützten Mittel und die Konzentrationsgrenze erneut überprüft. Es verbraucht einen Diplomaten und startet die einmonatige Handelsabklingzeit dieses Emittenten."
 bfl_new_capital_subscription_tip: "Primärfinanzierung: investieren 100 Gold von der verwalteten Bank. Der Emittent erhält Bargeld und gibt neue Aktien aus. Dies ist unabhängig vom Handel mit bestehenden Aktien."
 bfl_no_automatic_tribute: "Kein automatischer Charter-Tribut"
 bfl_no_automatic_tribute_cost_modifier: "Automatische Charter-Tributkosten"
 bfl_no_bank: "Chartern Sie eine bestehende Staatsbank durch Entscheidungen oder spielen Sie ein unabhängiges Bankenland. Um eine Bank gründen zu können, muss Ihr Land über einen eigenen Kapitalmarkt verfügen."
 bfl_no_bank_holdings: "Keine Aktien im Besitz der Bank."
 bfl_no_bank_short: "Keine zugelassene Bank"
 bfl_no_deposit_accounts: "Keine Einzahlungen"
 bfl_nobles_estate_workout_mandate: "Mandat zur Nachlassabwicklung"
 bfl_nobles_estate_workout_mandate_desc: "Dieser Nachlass ermächtigt seine Regierung ausdrücklich, in seinem Namen freiwillige Bankeinlagenabwicklungen zu überprüfen. Jeder Vorschlag bedarf noch einer gesonderten Annahme. Durch den Widerruf dieses Privilegs werden ausstehende Nachlassbedingungen ungültig. Die Rückzahlungszahlungen werden weiterhin in den Nachlassbestand eingezahlt."
 bfl_offer_bank_shares: "Bieten Sie neue Bankaktien an"
 bfl_offer_bank_shares_tip: "Erlauben Sie anderen Banken und Ländern, sich anzumelden 100 Gold zum aktuellen Nettoinventarwert der Bank. Neue Aktien werden erst gegen Bezahlung ausgegeben; bestehende Eigentümer werden verwässert. Native Banking-Forschung und positives Eigenkapital bleiben weiterhin erforderlich."
 bfl_offer_bond: "Bieten Sie eine von einer Bank gehaltene Staatsanleihe an"
 bfl_offer_bond_tip: "Listen Sie die älteste Bankanleihe seit drei Monaten auf 98% vom Nennwert. Sowohl der Verkauf als auch der Kauf erfordern ein eigenes, fertiggestelltes Börsengebäude. Bei der Annahme werden der Verkäufer, der aktuelle Inhaber, die Generation, die Mittel und das Ablaufdatum erneut überprüft. Blockhandel mit Zahlungsrückständen."
 bfl_offer_bond_workout_01: "Angebot Umstrukturierung"
 bfl_offer_bond_workout_01_tip: "Bitten Sie diesen aktuellen Inhaber, eine zu akzeptieren 20% Reduzierung des Kapitalbetrags und unbezahlter Kupons sowie eine jährliche Kuponkürzung um einen Prozentpunkt, mit a 1% Boden. Es wird kein Geld bewegt, es sei denn, der Inhaber akzeptiert dies gesondert. Das Angebot läuft in diesem Monat ab und Änderungen am Anspruch machen es ungültig."
