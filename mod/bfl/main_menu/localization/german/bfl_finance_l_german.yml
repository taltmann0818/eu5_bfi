 bfl_transfer_bank_bill_command: "$bfl_transfer_bank_bill$"
 bfl_transfer_bank_bill_command_desc: "$bfl_transfer_bank_bill_desc$"
 bfl_transfer_bank_bill_desc: "Wählen Sie den Emittenten und einen akzeptierenden Begünstigten. Der erste Anspruchsberechtigte 100-Goldforderungsübertragungen für 100 Gold an seinen derzeitigen Besitzer ausgezahlt. Gesperrte Sicherheiten können nicht übertragen werden. Notizen erfordern Revolutions-Akzeptanzforschung. Alle Finanzierungs-, Eigentums- und Kapitalzweigprüfungen werden bei der Ausführung wiederholt."
