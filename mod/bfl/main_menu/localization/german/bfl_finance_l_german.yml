 bfl_exchange.1.desc: "Kaufen [ROOT.GetCountry.MakeScope.GetVariable('bfl_order_units').GetValue|3] bestehende Einheiten von [ROOT.GetCountry.MakeScope.GetVariable('bfl_order_issuer').GetCountry.GetName] von [ROOT.GetCountry.MakeScope.GetVariable('bfl_order_seller').GetCountry.GetName] für [ROOT.GetCountry.MakeScope.GetVariable('bfl_order_price').GetValue|2]@gold!. Der Verkäufer erhält die Zahlung. Der Emittent erhält keine neue Finanzierung. Bei der Ausführung werden sowohl Börsen, Forschung, Live-Autorität, Einheiten, Kapital, Bargeld als auch die Überarbeitung dieses Angebots erneut überprüft."
