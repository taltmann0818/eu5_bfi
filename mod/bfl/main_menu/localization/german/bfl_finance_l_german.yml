 bfl_equity_vote_reserve_100_tip: "Die Mehrheit der Finanzabstimmungen kann über die Reinvestitionsreserve des Unternehmens und das Handelsbudget entscheiden. Politische Mandate, einheimische Oberherrschaft, Bargeld und bestehende Gläubigerforderungen bleiben getrennt."
