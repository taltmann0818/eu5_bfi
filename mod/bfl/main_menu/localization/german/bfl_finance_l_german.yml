 bfl_venture_policy: "Bedingungen"
 bfl_venture_preset_0: "Einseitig · 75% Banküberschuss"
 bfl_venture_preset_1: "Bilateral · gleicher Überschuss"
 bfl_venture_preset_tip: "Einseitig: Die Bank finanziert das gesamte Kapital und erhält es 75% des Überschusses. Bilateral: Bank finanziert zwei Drittel, Betreiber ein Drittel, Überschüsse werden zu gleichen Teilen aufgeteilt. Verluste folgen Kapitaleinlagen."
 bfl_venture_settings_tip: "Erweitern Sie die vorgeschlagenen Begriffe. Änderungen betreffen nur zukünftige Angebote; Akzeptierte Projekte behalten ihre ursprüngliche Vereinbarung."
 bfl_venture_state_1: "Aktiv · Risikokapital"
 bfl_venture_state_2: "Geschlossen · Kapital zurückgewonnen"
 bfl_venture_state_3: "Geschlossen · Verlust erfasst"
 bfl_venture_state_4: "Nicht finanziert · Ausführung nicht verfügbar"
 bfl_venture_subtitle: "Benannte Aktivitäten · gemessene Kosten und Umsätze"
 bfl_venture_ticket_100: "Fördergrenze · 100 Gold"
 bfl_venture_ticket_200: "Fördergrenze · 200 Gold"
 bfl_venture_ticket_400: "Fördergrenze · 400 Gold"
 bfl_venture_ticket_tip: "Zyklus eine maximale Bankautorisierung von 100, 200 oder 400 Gold. Es werden nur die tatsächlichen Kosten der Aktivität berücksichtigt. Ungenutzte Frachtmittel werden sofort freigegeben; Ungenutzte Expeditionsgelder bleiben bis zur Fälligkeit für eine berechtigte entdeckte Fracht reserviert. Bei bilateralen Bedingungen ist eine Kapazität für die Hälfte der Bankgenehmigung des Betreibers erforderlich."
 bfl_venture_title: "Commenda Ventures"
 bfl_ventures: "Ventures und Unternehmen · Auslandsinvestitionen"
 bfl_ventures_explanation: "Commenda beginnt in Discovery; Einheimische Unternehmen und Unternehmensbeteiligungen bedürfen einer Reformation. Die Kontrolle des politischen Oberherrn und das finanzielle Eigentum bleiben getrennt. Projektkapital ist keine Dividende."
 bfl_ventures_tip: "#T Unternehmungen und Unternehmen#!\nGenehmigungen für finanzierte Unternehmungen, Unternehmensinvestitionen, Projektsicherheiten und Bankanteilübertragungen. Diese setzen das Kapital einem Anlagerisiko aus und erfordern entsprechende Forschung und Spezialisierung."
 bfl_view_companies: "Unternehmen"
 bfl_view_goods: "Waren"
 bfl_view_loans: "Kredite"
 bfl_view_monetary: "Gelddienstleistungen"
 bfl_view_monetary_tip: "Banknoten, gesicherte Liquidität und Clearing."
 bfl_view_shares: "Aktien"
 bfl_view_trade: "Handelsfinanzierung"
 bfl_warehouse_receipt: "Lagerbeleg"
 bfl_warehouse_receipt_tip: "#T Lagerbeleg#!\nGelten Sie eine Reklamation gegen identifizierbare gelagerte Waren. Erfordert Recherche zu Lagerbelegen, Handelsfinanzierung und dem Zeitalter des Absolutismus oder später. Verifizierte Lagerung und Warenausführung sind in diesem Build nicht verfügbar."
 bfl_warehouse_receipts: "Lagerbelege"
 bfl_warehouse_receipts_desc: "Waren, die in einem seriösen Lager aufbewahrt werden, können den Handel unterstützen, ohne dass sie bei jedem Verkauf bewegt werden müssen. Eine Quittung begründet einen Anspruch auf die gelagerte Ware und ermöglicht dem Eigentümer, eine Finanzierung zu erhalten, während die Ware in Verwahrung bleibt."
 bfl_welserhaus: "Welserhaus"
 bfl_welserhaus_desc: "Von diesem Augsburger Haus aus schicken die Faktoren ihre Anweisungen über die Straßen und Seewege des Handels. Seine etablierte Kreditwürdigkeit senkt die Kreditzinsen des Eigentümers um einen halben Prozentpunkt, während sein Netzwerk die Handelskapazität und die Handelseinnahmen um zehn Prozent erhöht."
 bfl_welserhaus_maintenance: "Verwaltung Welserhaus"
 bfl_wisselbank_founding_tt: "Wisselbank als unsere konzessionierte Bank gründen und aus verfügbaren Staatsmitteln bis zur üblichen Konzessionseinlage finanzieren."
 bfl_wisselbank_name: "Wisselbank"
 bfl_withdraw: "Ziehen Sie fällige staatliche Einlagen ab"
 bfl_withdraw_tip: "#T Ziehen Sie fällige staatliche Einlagen ab#!\nFordern Sie die Rückzahlung der Tagesgeldkonten und fälligen Terminkonten Ihres Staates an. Die Bank zahlt Kapital und gutgeschriebene Zinsen aus dem verfügbaren Bargeld. Unbezahlte Beträge bleiben in der Auszahlungswarteschlange erfasst und neue Geschäfte werden ausgesetzt. Ausländische Konten und nicht fällige Termineinlagen können durch diese Aktion nicht abgehoben werden."
 bfl_workout_decline: "Behalten Sie den vollständigen Anspruch"
 bfl_workout_desc: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_workout_bank').GetCountry.GetName] schlägt Konditionen für Ihre Einzahlung vor [ROOT.GetCountry.MakeScope.GetVariable('bfl_workout_claim').GetValue|2] Gold. Sie können darauf verzichten 20% des verbleibenden Anspruchs, wandeln Sie den gesamten Anspruch in neu ausgegebene Aktien zum materiellen Nettoinventarwert vor der Umwandlung um oder behalten Sie Ihren Anspruch. Die Umwandlung erfordert einen positiven Nettoinventarwert und eine positive Aktionärskapazität und steht Bankgläubigern nicht zur Verfügung. Gläubigerpool [ROOT.GetCountry.MakeScope.GetVariable('bfl_workout_pool').GetValue|0]: 0 Schatzkammer, 1 Bürger, 2 Adlige, 3 Geistliche, 4 Bauern. Die Bedingungen des Nachlasses erfordern das vom Nachlass erlassene Trainingsmandat. Das Angebot läuft diesen Monat ab; eine Sanierung oder ein Wechsel in der Geschäftsführung macht es ungültig."
 bfl_workout_equity: "Wandeln Sie den Anspruch in Aktien um (positiver NAV erforderlich)"
 bfl_workout_haircut: "Akzeptiere a 20% Reduzierung"
 bfl_workout_title: "Vorschlag zur Gläubigerbereinigung"
 bfl_workout_trade_access: "Konzession für den Fitnesshandel"
 bfl_workout_trade_access_desc: "Der Handelsschutz wird durch eine gesondert vereinbarte Anleiheabwicklung für bis zu zwei Jahre aufgehoben. Bestehende gewöhnliche Handelszugangsabkommen sind von diesem Zugeständnis unabhängig."
