 bfl_llotja_de_mar: "Llotja de Mar"
 bfl_llotja_de_mar_desc: "Die Kaufleute Barcelonas versammeln sich unter dem großen Dach der Börse, um Rechnungen zu begleichen und das Schicksal ferner Reisen abzuwägen. Die Ordnung seiner Konten stärkt die öffentliche Bank der Stadt und den Kredit der Krone."
