 bfl_portfolio_bank_heading: "Investitionen gehalten von [Country.GetName]"
 bfl_portfolio_history_axis: "Vom Ältesten zum Neuesten · bis zu 12 monatliche Beobachtungen"
 bfl_portfolio_history_empty: "Die Historie beginnt mit dem nächsten monatlichen Bankschluss."
 bfl_portfolio_history_flows: "Der Wert umfasst Käufe und Verkäufe; Dies ist kein Anlage-Rendite-Index."
 bfl_portfolio_history_title: "Portfoliowert im Zeitverlauf"
 bfl_portfolio_owner_note: "Treasury- und Bankbeteiligungen haben getrennte Eigentümer. Bewegen Sie den Mauszeiger über ein Unternehmen, um dessen Finanzen anzuzeigen."
 bfl_portfolio_total_heading: "Aktueller Eigenkapitalwert"
 bfl_portfolio_treasury_heading: "Staatsschatzbestände"
 bfl_prepare_bond_panel: "Staatsanleihen"
 bfl_prepare_bond_panel_tip: "Staatsfinanzierung und bestehende Forderungen im Kreditbereich einsehen."
 bfl_probe_P11: "Entwicklungstor: P11 muss im Spiel gemessen werden, bevor dieser Adapter ausgeführt werden kann."
 bfl_profile_0: "Wählen Sie eine Spezialisierung"
 bfl_profile_1: "Handelsfinanzierung"
 bfl_profile_2: "Auslandsinvestitionen"
 bfl_project_security: "Projektsicherheit"
 bfl_project_security_desc: "Entfernte Unternehmen sind für ihre Finanziers schwer zu überwachen. Ansprüche auf ihr Vermögen und ihre Erlöse, die vor der Kapitalbereitstellung festgelegt werden, bieten Anlegern die Möglichkeit, ihre Interessen zu schützen, wenn ein Unternehmen scheitert."
 bfl_project_security_tip: "#T Projektsicherheit#!\nSichern Sie ein Unternehmen gegen erkennbare Projektansprüche ab. Erfordert Projektsicherheitsforschung, Auslandsinvestitionen und das Zeitalter des Absolutismus oder später. Die Ausführung nativer Projektsicherheiten ist in diesem Build nicht verfügbar."
 bfl_protected_label: "Geschütztes Bargeld"
 bfl_public_backstop: "Öffentlicher Backstop"
 bfl_public_backstop_tip: "#T Öffentliche gesicherte Unterstützung#!\nRevolutionen, öffentliche Finanzsicherungen und eine Live-Charta mit einer fertiggestellten Zentralbank in der souveränen Hauptstadt. Ausdrücklich akzeptiert 75-Goldvorschüsse nutzen das eigene freie Bargeld der öffentlichen Bank, a 25% Bill Haarschnitt und zumindest 9% Jahreszins. Keine kostenlose Rekapitalisierung."
 bfl_public_financial_backstops: "Öffentliche Finanzsicherungen"
 bfl_public_financial_backstops_desc: "Wenn der Zusammenbruch eines großen Bankhauses die öffentliche Kreditwürdigkeit und den Handel gefährdet, kann die Regierung eingreifen. Eine solche Unterstützung bindet die Ressourcen des Finanzministeriums an die Sanierung der Bank und macht die Bedingungen der Unterstützung zu einer Angelegenheit der öffentlichen Ordnung."
 bfl_purchase_funded_bill: "Kaufen Sie eine Rechnung mit finanzierter Zahlung"
 bfl_purchase_funded_bill_act: "$bfl_purchase_funded_bill$"
 bfl_purchase_funded_bill_desc: "Finanziert aus Ihrer eigenen Kasse nach Profil-, Alters-, Recherche- und Registrierungsprüfungen. Kapital ist kein Bankgewinn. Bei einer Bankkapitalzeichnung werden Anteile zum aktuellen Nettoinventarwert erworben."
 bfl_purchase_funded_bill_effect_text: "$bfl_purchase_funded_bill$"
 bfl_purchase_funded_bill_effect_text_past: "$bfl_purchase_funded_bill$"
 bfl_purchase_native_loan: "Bank: Kauf eines Immobiliendarlehens"
 bfl_purchase_native_loan_act: "$bfl_purchase_native_loan$"
 bfl_purchase_native_loan_desc: "Kaufen Sie über Ihre Bank ein geeignetes Nachlassdarlehen. Die Bank benötigt eine eigene abgeschlossene Kapitalfiliale, den vollständigen Kaufpreis in verfügbaren Barmitteln und ausreichend Kapital. Ausgenommen sind Anleihen, staatlich gehaltene Kredite und Kredite mit einer Restlaufzeit von vierzig oder weniger Monaten. Die Nachlässe werden entlohnt; Der Kreditnehmer nimmt keine neuen Schulden auf."
 bfl_purchase_native_loan_effect_text: "$bfl_purchase_native_loan$"
 bfl_purchase_native_loan_effect_text_past: "$bfl_purchase_native_loan$"
 bfl_purchase_native_loan_tip: "#T Kredit für die Bank übernehmen#!\nWählen Sie einen anderen Staat mit zulässigen Nachlassschulden aus. Ihre konzessionierte Bank zahlt den einheimischen Kaufpreis an die Bankvermögen dieses Landes und wird zum Gläubiger desselben Darlehens. Kapital- und Zinsforderungen gehören der Bank; Der Staat erzielt Krediteinnahmen durch seine Aktiendividenden. Banken erwerben außerdem jeden Monat selbstständig einen geeigneten Kredit, wenn die Reserven und das Kapital dies zulassen. Ausgenommen sind Anleihen und bereits vom Land gehaltene Kredite."
 bfl_rate_0: "Für neue Konten fallen keine Zinsen an"
 bfl_rate_0_short: "0%"
 bfl_rate_0_tip: "Angebot 0% Jährlicher Zinssatz für neue Sichteinlagen. Bestehende Tagesgeldkonten und der separate Terminkontotarif bleiben zu den jeweils gültigen Konditionen bestehen."
 bfl_rate_1: "1% Jährlicher Nachfragesatz für neue Konten"
 bfl_rate_1_short: "1%"
 bfl_rate_1_tip: "Angebot 1% Jährlicher Zinssatz für neue Sichteinlagen. Die Zinsgutschrift erfolgt monatlich mit Cent Carry. Bestehende Girokonten behalten ihre akzeptierten Tarife."
 bfl_rate_2: "2% Jährlicher Nachfragesatz für neue Konten"
 bfl_rate_2_short: "2%"
 bfl_rate_2_tip: "Angebot 2% Jährlicher Zinssatz für neue Sichteinlagen. Die Zinsgutschrift erfolgt monatlich mit Cent Carry. Bestehende Girokonten behalten ihre akzeptierten Tarife."
 bfl_recapitalize_command: "Rekapitalisieren Sie mit 100 Gold"
 bfl_recapitalize_command_tip: "Bezahlen 100 Gold aus der Staatskasse Ihres Landes als Bankkapital. Erfordert 100 Gold und ein Weiterverkaufsgebot des Händlers, das nicht höher ist als der materielle Nettoinventarwert; Das Kapital pausiert während einer größeren Marktprämie, um einen sofortigen Weiterverkaufsgewinn zu verhindern. Eine finanzierte Rettung bei einem Nettoinventarwert von Null oder einem negativen Nettoinventarwert bleibt weiterhin möglich."
 bfl_redeem_bond: "Einlösen"
 bfl_redeem_bond_01_tip: "Zahlen Sie den Nennwert zuzüglich aller aufgelaufenen Coupons an den aktuellen Inhaber. Bei einem Mangel bleibt die gesamte Anleihe ausstehend. Durch die Einlösung wird der Anspruch einmalig geschlossen; Einheimische Anleihen bleiben davon unberührt."
