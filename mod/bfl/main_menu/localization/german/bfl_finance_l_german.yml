 bfl_finance.110.desc: "Die Investition erwirbt neues Staatskapital. Bei der Umwandlung bleibt die Landesidentität der Bank erhalten. Beim Schließen dieser Auswahl wird kein Geld überwiesen. Pro Seite werden acht wählbare Direktthemen angezeigt; Verwenden Sie „Weiter“, um weitere Banken zu erreichen."
