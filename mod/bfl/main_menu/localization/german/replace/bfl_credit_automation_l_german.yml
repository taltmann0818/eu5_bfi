l_german:
 AUTOMATED_SYSTEM_CREDIT: "Kreditmanagement"
 AUTOMATED_SYSTEM_CREDIT_DESC: "Verwalten Sie staatliche Kredite und Anleihen. Ihre Bank prüft auch Kreditübernahmen, bietet Kreditnehmern, die Bargeld benötigen, finanzierte Darlehen an und investiert überschüssiges Bargeld in recherchierte Aktien. Unternehmen verwalten Handel und Exploration. Die Bank hält Reserven und prüft die Schuldenfähigkeit; Kreditnehmer müssen neue Kredite aufnehmen."
 AUTOMATE_SYSTEM_TOOLTIP_CREDIT: "Aktivieren Sie das Kreditmanagement in der Automatisierung: Staatsschulden, Bankkredite, Investitionen und Unternehmensabläufe."
 DEAUTOMATE_SYSTEM_TOOLTIP_CREDIT: "Deaktivieren Sie das Kreditmanagement. Bestehende Kredite, Einlagen und zugesagte Zahlungen werden weiterhin bedient."
