l_german:
 banking_office: "Bankfiliale"
 banking_office_desc: "Eine örtliche Bankfiliale. Ein Herrscher mit konzessionierter Bank kann ausländische Filialen durch normalen Bau finanzieren, abhängig von Beziehungen zum Gastgeber und den üblichen Bauanforderungen. Nach Fertigstellung gehört die Filiale der Bank. Neue Staatskredite, Einlagen und Investitionen erfordern eine fertige Filiale der Bank in der aktuellen Hauptstadt des Staates. Bestehende Forderungen bleiben bedienbar."
