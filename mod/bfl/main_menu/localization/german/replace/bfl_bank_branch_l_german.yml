 banking_office: "Bankfiliale"
 banking_office_desc: "Eine örtliche Bankfiliale. Neue staatliche Kredite, Einlagen und Investitionen erfordern eine fertiggestellte Zweigstelle im Besitz der Bank im aktuellen Kapital des Staates. Bestehende Ansprüche bleiben bestehen; Bank-zu-Bank-Geschäfte benötigen keine Filiale."
