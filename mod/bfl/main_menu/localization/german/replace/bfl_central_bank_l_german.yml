 central_bank_desc: "Eine zentrale Einrichtung zur Verwahrung von Reserven und zur Vergabe öffentlicher Kredite bündelt die verstreuten Finanzgeschäfte unter einem Dach. Eine zugelassene Bank, die von einer vollwertigen Zentralbank unterstützt wird, zahlt 15% weniger Verwaltungskosten und erhält Zugang zu Gelddienstleistungen, da die notwendigen Fortschritte erforscht werden. Schuldverschreibungen bleiben besicherte Schuldverschreibungen; Ihre Emission bringt keinen Bankgewinn."
