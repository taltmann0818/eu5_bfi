l_german:
 wisselbank_desc: "Unter dem Dach des alten Rathauses sammelt die Wechselbank der Stadt Münzen und Wechsel und ordnet einen grenzüberschreitenden Handel. Reserven und sorgfältige Bücher stärken das Vertrauen in den Staatskredit. Eine fertiggestellte Wisselbank senkt die Verwaltungskosten der konzessionierten Bank um 15% und ermöglicht nach den erforderlichen Fortschritten Währungsdienste."
 riksbank_desc: "Unter dem Schutz der Stände verwahrt eine ständige Bank die Reserven des Reiches und ordnet seinen Staatskredit. Ihre Schreiber nehmen Einlagen an, begleichen Verpflichtungen und sichern Vertrauen in staatliche Versprechen. Eine fertiggestellte Riksbank senkt die Verwaltungskosten der konzessionierten Bank um 15% und ermöglicht nach den erforderlichen Fortschritten Währungsdienste."
