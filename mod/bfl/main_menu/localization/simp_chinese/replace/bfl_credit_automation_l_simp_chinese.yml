l_simp_chinese:
 AUTOMATED_SYSTEM_CREDIT: "信用管理"
 AUTOMATED_SYSTEM_CREDIT_DESC: "管理国家贷款和债券。您的银行还会审查贷款收购，向需要现金的借款人提供资助贷款，并将闲置现金投资于研究的股票。公司管理贸易和勘探。银行保留准备金并检查债务能力；借款人必须接受新贷款。"
 AUTOMATE_SYSTEM_TOOLTIP_CREDIT: "实现自动化信用管理：国家债务、银行贷款、投资和公司运营。"
 DEAUTOMATE_SYSTEM_TOOLTIP_CREDIT: "禁用信用管理。现有贷款、存款和承诺付款将继续得到服务。"
