 bfl_native_credit_label: "贷款组合"
 bfl_native_tab: "国家贷款"
 bfl_native_takeover: "本土收购"
 bfl_new_capital_subscription: "认购新资本"
 bfl_new_capital_subscription_desc: "投资 100@gold! 您银行的资金 [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_issuer').GetCountry.GetName] 作为按其有形资产净值新发行的股本。发行人收到付款，现有持有人被稀释。这是资本认购，与购买股票分开。执行过程会重新检查捕获的资产净值、发行单位、研究、受保护资金和集中度限制。它消耗了一名外交官并开始该发行人为期一个月的交易冷却。"
 bfl_new_capital_subscription_tip: "主要融资方式：投资 100 来自管理银行的黄金。发行人收到现金并发行新股。这与现有股票的交易是分开的。"
 bfl_no_automatic_tribute: "没有自动包机致敬"
