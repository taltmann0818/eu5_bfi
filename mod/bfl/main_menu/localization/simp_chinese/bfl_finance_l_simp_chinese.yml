 bfl_strategy_credit: "最后审查：提供同意信用"
 bfl_strategy_delegated: "投资授权·委托"
 bfl_strategy_deposit: "最后评论： 100 按需黄金"
 bfl_strategy_disable: "管理投资"
 bfl_strategy_disable_tip: "停止自动贷款购买、新策略提供和需求安置。现有贷款、存款和排队索赔继续得到服务。商品、股票和分支政策保持独立。"
 bfl_strategy_enable: "委托投资"
 bfl_strategy_enable_tip: "授权对符合条件的 AI 交易对手现有的本地贷款、信贷和货运报价进行计分购买，以及超额现金需求安置。低流动性可能会将一只拥有的主权债券上市 98% 脸；接受转售可能会造成损失。 Cargo 使用您当前的条款以及普通同意和实物结算。主权借款、股息、商品和货币当局保留各自的政策。新业务在解决过程中停止。"
 bfl_strategy_idle: "最后回顾：保留流动性"
 bfl_strategy_manual: "投资授权·手册"
 bfl_strategy_recall: "最后一次审查：要求撤回存款"
 bfl_strategy_resale: "最新评论：提供自有债券以提高流动性"
 bfl_strategy_secondary_statement: "自动本地贷款购买： [Country.MakeScope.GetVariable('bfl_strategy_takeovers').GetValue|0] · 债券转售报价： [Country.MakeScope.GetVariable('bfl_strategy_resales').GetValue|0]"
 bfl_strategy_secondary_tip: "现有贷款购买审查最多十二个已完成的资本分支客户。借款人需要流动性、和平、非负预算，并且至少 0.50 信用度。购买保留 100 自由现金，收购溢价上限为 25% 剩余本金和借款人总风险敞口 25% 股权。预期每月保证金必须至少为 0.10 扣除溢价、服务津贴和保守的融资成本后的黄金。这是一个估计；提前还款和违约仍可能造成损失。低流动性可能会对一只拥有的主权债券进行报价 98% 通过一个完整的证券交易所的面子。在获得资助的买家同意之前，不会记入转售收益。"
 bfl_strategy_statement: "每月评论： [Country.MakeScope.GetVariable('bfl_strategy_reviewed').GetValue|0]/12  · 分数： [Country.MakeScope.GetVariable('bfl_strategy_score').GetValue|2]\n信用优惠： [Country.MakeScope.GetVariable('bfl_strategy_offers').GetValue|0]  · 存款： [Country.MakeScope.GetVariable('bfl_strategy_placements').GetValue|0]  · 召回： [Country.MakeScope.GetVariable('bfl_strategy_recalls').GetValue|0]"
 bfl_strategy_title: "投资授权"
 bfl_strategy_title_tip: "保守的每月任务。审核最多 12 名信贷候选者、12 名各自拥有四个来源市场的互联风险投资运营商或 12 家存款银行。最多一项信用报价、货运报价或 100- 每月黄金需求安置。信贷和货运报价冷却三个月。货物要求的报价保证金至少为 10% 和一家黄金银行盈余，保留 500 自由现金，上限为两项有效协议，并且 25% 股权。报价可能会发生变化；损失仍然是可能的。受保护的现金、研究、分支机构和个人资料权限仍然适用。"
 bfl_strategy_venture: "最后评论：货运合作伙伴关系已征求同意"
 bfl_streamline_bank: "精简行政· 100 黄金"
 bfl_streamline_bank_tip: "支付 100 国金一度将银行固定运营开支减少 10%。章程改革、银行业务和高级清算提供了额外的削减。这一决定不会创造银行利润。"
 bfl_subscribe_bank: "订阅 100 银行资本黄金"
 bfl_subscribe_bank_act: "$bfl_subscribe_bank$"
 bfl_subscribe_bank_desc: "经过个人资料、年龄、研究和注册检查后，由您自己的财务资助。本金不是银行利润。银行资本认购按当前资产净值购买单位。"
 bfl_subscribe_bank_effect_text: "$bfl_subscribe_bank$"
 bfl_subscribe_bank_effect_text_past: "$bfl_subscribe_bank$"
 bfl_suspend_command: "暂停新存款"
 bfl_suspend_command_tip: "#T 暂停新存款#!\n停止接受新的存款和需要接受存款的融资行为。现有账户、利息义务和提款请求均保留记录。这种控制不会关闭银行或免除其债务。"
