 bfl_money_hint: "将鼠标悬停在储备金、持有人和结算上"
 bfl_money_hint_tip: "纸币可以用硬币换取完全保留的索赔权。接受是自愿的。提前折扣 75 黄金兑 100- 第三银行金币。仅当每个成员都能支付其净借方时，清算才会结算匹配的到期票据。现有的索赔在失去权威和建筑物后仍然存在。"
 bfl_money_leave: "离开清场"
 bfl_money_leave_tip: "纸币可以用硬币换取完全保留的索赔权。接受是自愿的。提前折扣 75 黄金兑 100- 第三银行金币。仅当每个成员都能支付其净借方时，清算才会结算匹配的到期票据。现有的索赔在失去权威和建筑物后仍然存在。"
 bfl_money_lending_rate: "新的贷款基地"
 bfl_money_lending_rate_tip: "未来普通贷款的年度基数循环通过 3%, 6% 和 9%。借款人调整仍然适用。接受的贷款保持利率不变。"
 bfl_money_notes: "获取 100 在笔记中"
 bfl_money_notes_tip: "需要绝对主义、中央银行和主权纸币研究、实时主权授权、发行人完整的银行分行和主权完整的中央银行的现有资本， 100 国库黄金和未使用的票据容量。较小的 25% 银行股本和 500 金帽流通。"
 bfl_money_offer_accept: "为担保预付款提供资金"
 bfl_money_offer_accept_tip: "基金 75 如果当前管理人、报价和第三家银行抵押品仍然有效，则从贷款人的可用现金中提取黄金。该设施接受的年费率是固定的；至少公共支持费用 9%."
 bfl_money_offer_decline: "拒绝请求"
 bfl_money_offer_decline_tip: "关闭此请求，无需移动黄金或质押抵押品。"
 bfl_money_offer_desc: "提前 75 黄金对抗单独资助的 100- 在第三家银行持有的金币。一个 25% 理发可以保护贷款人。接受的年度折扣率适用一个月；至少公共支持费用 9%。结算时先向贷款人付款，然后将剩余部分返还给借款人。没有资金支持的抵押品保留这两种主张。该请求将于本月到期。"
 bfl_money_offer_title: "安全的结算设施"
 bfl_money_policy_rate: "周期未来贴现率"
 bfl_money_policy_rate_tip: "未来担保预付款的年利率循环通过 6%, 9% 和 12%。验收时按1个月收费；现有设施保持收费。公共支持费用至少 9%."
 bfl_money_redeem: "兑换状态票据"
 bfl_money_redeem_tip: "按面值兑换主权控制人持有的所有票据。失去权威、研究或分支机构并不会取消现有的主张。仍欠未付索赔。"
 bfl_money_repay: "偿还担保设施"
 bfl_money_repay_tip: "偿还当前担保预付款加上其固定承兑费用以解除第三银行票据质押。需要足够的可用金币。"
 bfl_money_revoke: "撤销权限"
 bfl_money_revoke_tip: "撤回对新票据的主权授权。现有票据仍然可以赎回。"
 bfl_money_settings: "政策"
 bfl_money_settings_tip: "显示或隐藏货币政策、票据授权、担保信贷和清算控制。"
 bfl_money_settings_tip_tip: "纸币可以用硬币换取完全保留的索赔权。接受是自愿的。提前折扣 75 黄金兑 100- 第三银行金币。仅当每个成员都能支付其净借方时，清算才会结算匹配的到期票据。现有的索赔在失去权威和建筑物后仍然存在。"
 bfl_money_subtitle: "可赎回的债权·资助和解"
 bfl_money_subtitle_tip: "纸币可以用硬币换取完全保留的索赔权。接受是自愿的。提前折扣 75 黄金兑 100- 第三银行金币。仅当每个成员都能支付其净借方时，清算才会结算匹配的到期票据。现有的索赔在失去权威和建筑物后仍然存在。"
