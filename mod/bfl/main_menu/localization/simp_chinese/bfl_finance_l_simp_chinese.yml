 bfl_clearing: "清算"
 bfl_clearing_tip: "#T Advanced clearing#!\n革命、高级清算和本地清算所研究。拥有完整的清算所和明确的会员准入可以实现匹配的到期票据的原子净结算。一个矮的成员会阻止该批次并保留每个索赔。"
