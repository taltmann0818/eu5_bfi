 bfl_commenda_opportunity_propose: "将这些条款发送给运营商"
 bfl_commenda_opportunity_review: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_op_country').GetCountry.GetName] · 10 [ROOT.GetCountry.MakeScope.GetVariable('bfl_op_good').Goods.GetNameWithNoTooltip]\n[ROOT.GetCountry.MakeScope.GetVariable('bfl_op_from').GetMarket.GetName] → [ROOT.GetCountry.MakeScope.GetVariable('bfl_op_to').GetMarket.GetName]\nEstimated bank cost: [ROOT.GetCountry.MakeScope.GetVariable('bfl_op_cost').GetValue|2]@gold!\n指示性银行盈余：+[ROOT.GetCountry.MakeScope.GetVariable('bfl_op_surplus').GetValue|2]@gold!\n\n两个月货运业务的当前市场报价；盈余不包括回收的资本。价格和访问权限可能会发生变化。资本和回报都面临风险。只有该货物的实际销售才支付协议费用。经营者必须接受。机会每月刷新一次，并在发送报价之前再次检查。"
 bfl_commenda_tip: "#T 科门达#!\n向航程或贸易企业投入资本，以换取规定的利润份额。需要 Commenda 研究、海外投资和发现时代或更高版本。本机项目执行在此版本中不可用。"
 bfl_commercial_bill: "商业汇票"
 bfl_commercial_bills: "商业汇票"
 bfl_commercial_bills_desc: "在商业中心之间携带硬币既昂贵又危险。书面汇票允许商人通过值得信赖的银行结算债务，使发行人的声誉成为一种贸易工具。"
 bfl_commodity_forward: "商品远期"
 bfl_commodity_forward_tip: "#T 商品远期#!\n同意资助未来的货物交付。需要商品远期研究、商业金融和专制主义时代或更晚的时期。此版本不支持实物交割和结算。"
 bfl_commodity_forwards: "商品远期"
 bfl_commodity_forwards_desc: "收获、装运或车间订单可以在交付前出售。尽管遥远的市场和季节变化存在不确定性，但确定未来价格的协议有助于商人安排事务。"
 bfl_commodity_inventory: "商品库存"
 bfl_commodity_inventory_tip: "#T 商品库存#!\n为贸易而持有的货物提供融资。需要商品投资研究、商业金融和发现时代或更高版本。此版本不支持实物商品的购买、保管和交付。"
 bfl_commodity_investments: "商品投资"
 bfl_commodity_investments_desc: "为贸易提供融资的银行家也可以自己持有货物。谷物、羊毛和其他商品成为投资，其价值取决于储存、运输和遥远市场不断变化的需求。"
 bfl_company_crew: "转乘 250 水手到公司"
 bfl_company_crew_desc: "管理您目前控制的本土公司。融资资本不计入营业收入。"
 bfl_company_crew_tip: "管理您目前控制的本土公司。出资额为融资。公司分配使用扣除本地成本、附带损失、债务准备金和现金缓冲后的留存贸易收益。政治上的霸主和金融上的主人是分开的。"
 bfl_company_equity: "公司股权"
 bfl_company_equity_desc: "大型贸易企业需要的财富是很少有商人能够单独提供的。在投资者之间划分所有权可以让公司聚集持久的资本，同时分配其事业的风险和回报。"
 bfl_company_equity_tip: "#T 公司股权#!\n认购认可公司所有权股份的资本。需要公司股权研究、海外投资和宗教改革时代或更晚的时间。本版本中不支持原生公司发行和持有人结算。"
 bfl_company_expedition: "公司：准备本土探索"
 bfl_company_expedition_desc: "利用公司财务、水手和探险家在公司设施内准备海上探险。本地准备和进度适用。 Discovery 不产生现金或投资利润。"
 bfl_company_expedition_tip: "需要贸易和勘探授权、地图制作、合格的公司探险家、水手和可用的风险预算。本机准备时间适用。"
 bfl_company_exploration_capacity: "公司勘探设立"
 bfl_company_exploration_capacity_desc: "容量 500 授权勘探任务时的水手。水手必须来自公司或来自其政治控制者的资金转移。"
 bfl_company_explore: "公司使命：贸易和勘探"
 bfl_company_explore_desc: "管理您目前控制的本土公司。融资资本不计入营业收入。"
 bfl_company_explore_tip: "管理您目前控制的本土公司。出资额为融资。公司分配使用扣除本地成本、附带损失、债务准备金和现金缓冲后的留存贸易收益。政治上的霸主和金融上的主人是分开的。"
 bfl_company_fund: "贡献 100 黄金到公司资本"
 bfl_company_fund_desc: "管理您目前控制的本土公司。融资资本不计入营业收入。"
 bfl_company_fund_tip: "管理您目前控制的本土公司。出资额为融资。公司分配使用扣除本地成本、附带损失、债务准备金和现金缓冲后的留存贸易收益。政治上的霸主和金融上的主人是分开的。"
 bfl_company_list_equity: "授权公司股权上市"
 bfl_company_list_equity_desc: "授权付费资产净值一级认购和二级交易。银行收购需要海外投资、公司股权研究以及完成二级交易的交换。政治霸权没有改变。"
 bfl_company_list_equity_tip: "现场政治控制者授权市场参与。不授予现金或单位。"
 bfl_company_native_channels: "本地总部收入和主题付款仍保留在本地预算中。公司股票市场、银行企业信贷和commenda 使用各自独立的研究和交付通道。"
 bfl_company_panel: "运营公司"
 bfl_company_panel_tip: "公司金库和政治控制仍然与银行账户分开。本地总部所有者收入、总部直接领主收入和本地臣民付款仍归其本地接收者所有。只有执行的保留交易扣除本地成本才能为额外的所有者分配提供资金。资本和发现被排除在外。"
 bfl_company_retain: "公司使命：保留收益"
 bfl_company_retain_desc: "管理您目前控制的本土公司。融资资本不计入营业收入。"
 bfl_company_retain_tip: "管理您目前控制的本土公司。出资额为融资。公司分配使用扣除本地成本、附带损失、债务准备金和现金缓冲后的留存贸易收益。政治上的霸主和金融上的主人是分开的。"
 bfl_company_route: "公司：开辟本土贸易航线"
 bfl_company_route_desc: "使用以下方式打开一条公司拥有的本地路由 0.1 商户能力。需要贸易授权、可用的运营预算、本地市场准入、盈余和产能。每个连每月最多指挥一条路线。原生人工智能保留了自己的交易行为。"
 bfl_company_route_tip: "选择公司、来源市场、目的地市场、商户市场和货物。原生交易费用由引擎收取。"
 bfl_company_select: "选择运营公司"
 bfl_company_select_desc: "检查一家在你当前政治控制下的本土公司。"
 bfl_company_select_tip: "选择您当前控制的本地公司。选择和报表显示不会移动现金或关闭一个月。"
 bfl_company_statement: "现金： [Country.GetFixedPointCurrencyValue('gold')|2]@gold!   预留缓冲区： [Country.MakeScope.GetVariable('bfl_company_buffer').GetValue|2]@gold!\n本土贸易： [Country.MakeScope.GetVariable('bfl_company_trade_receipts').GetValue|2]   净预算： [Country.MakeScope.GetVariable('bfl_company_native_net').GetValue|2]\n符合资格的收入： [Country.MakeScope.GetVariable('bfl_company_verified_profit').GetValue|2]   支付给业主： [Country.MakeScope.GetVariable('bfl_company_dividend').GetValue|2]@gold!\n设施： [Country.MakeScope.GetVariable('bfl_company_facility_count').GetValue|0]   路线： [Country.MakeScope.GetVariable('bfl_company_route_count').GetValue|0]   执行量： [Country.MakeScope.GetVariable('bfl_company_volume').GetValue|2]\n贸易预算： 50   再投资准备金： 100   创业预算： 100   业主付款： 25%"
