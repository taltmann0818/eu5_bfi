 bfl_assets_label: "总资产"
 bfl_assets_label_tip: "#T 总资产#!\n银行拥有的现金和记录资产。\n\n国库现金： [Country.GetFixedPointCurrencyValue('gold')|2]@gold!\n贷款组合： [Country.MakeScope.GetVariable('bfl_native_credit_value').GetValue|2]@gold!\n股权头寸（账面价值）： [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_security_carrying')|2]@gold!\n定制信贷和债券： [Country.MakeScope.GetVariable('bfl_custom_credit_value').GetValue|2]@gold!\n库存： [Country.MakeScope.GetVariable('bfl_inventory_value').GetValue|2]@gold!\n项目： [Country.MakeScope.GetVariable('bfl_project_value').GetValue|2]@gold!\n总计： [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_assets')|2]@gold!\n\n贷款、股权、库存和项目均记录为资产价值，而不是可用于支出的现金。本金偿还将贷款资产兑换成现金；他们不创造利润。"
 bfl_authorize_note_bank: "授权可兑换纸币"
 bfl_authorize_note_bank_act: "$bfl_authorize_note_bank$"
 bfl_authorize_note_bank_desc: "在进行必要的研究后，授权您的特许银行或在您首都设有分行的独立银行将硬币兑换为完全支持的可赎回票据。新的发行还需要在您的首都建立一个完整的中央银行。授权不会创造黄金并且可以撤回。"
 bfl_authorize_note_bank_effect_text: "$bfl_authorize_note_bank$"
 bfl_authorize_note_bank_effect_text_past: "$bfl_authorize_note_bank$"
 bfl_back_to_bank: "银行账户"
 bfl_balance_paid_tip: "最后每月结算时收到的资助付款。这些转移已经存在于您的国库中，不得再次添加到本地收入总额中。"
 bfl_bank_capital_subscriptions_desc: "银行不必完全依赖其创始家族的财富。认购将更多的合作伙伴带入企业，汇集他们的资本，同时记录每个投资者对其未来繁荣的主张。"
 bfl_bank_dividends: "银行股息"
 bfl_bank_equity_subscribe: "银行金库：认购 100 黄金"
 bfl_bank_equity_subscribe_tip: "投资 100 实际管理银行的受保护现金和资本盈余按选定发行人的有形资产净值计算。新的付费单位进入银行投资组合。最大 25% 银行或 60% 海外许可公司的。这是主要融资，而不是从现有股东处购买。"
 bfl_bank_identity_tip: "[Country.GetName] 拥有自己的金库、资产和债务。这些总额属于银行，与国库分开。 Merchant Finance 专门从事贸易和企业贷款；海外投资专注于企业和公司。银行选择一个永久的专业化。"
 bfl_bank_share_dealing: "银行股票交易"
 bfl_bank_share_dealing_desc: "合伙人的财富不必永远与同一家银行挂钩。经认可的所有权转让允许投资者将其权益出售给其他人，而机构则可以在不撤回资本的情况下继续开展业务。"
 bfl_bank_share_transfer: "银行股份转让"
 bfl_bank_share_transfer_tip: "#T 银行股份转让#!\n在受资助方之间转移记录的银行所有权单位。需要银行股票交易研究和宗教改革时代或更晚的时间。该行报告权限；它本身并不执行二级股票交易。"
 bfl_bank_status_tip: "经营：在满足其他要求的情况下允许开展新业务。现金压力：可用现金已耗尽。提款排队：未支付的提款请求将暂停新业务。资不抵债：负债超过资产。决议中或已关闭：普通业务受到限制。现有索赔仍被记录。"
 bfl_bank_subscription: "银行认购"
