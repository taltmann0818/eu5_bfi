 bfl_loan_button: "接管贷款"
 bfl_log_charter: "特许成立一家国家银行并为其注资"
 bfl_manage_shareholdings: "股东决策"
 bfl_manage_shareholdings_desc: "选择金融控股。半数以上的已发行投票权可以设定独立银行股息或公司派息和再投资政策。现场控制人可以行使其管理银行的投票权。特许货币政策和政治霸权仍然是分开的。"
 bfl_margining: "保证金"
 bfl_margining_and_risk_management: "保证金和风险管理"
 bfl_margining_and_risk_management_desc: "承诺未来交货的商家早在合同到期之前就面临着价格变化。随着风险敞口的增加，要求额外的担保为银行家提供了一种在不利的市场变成违约之前控制损失的方法。"
 bfl_margining_tip: "#T 保证金和风险管理#!\n要求针对不断变化的商品风险提供抵押品和变动保证金。需要保证金和风险管理研究、商业金融和革命时代。在此版本中，商品支持保证金执行不可用。"
 bfl_market_sort_price: "按每股价格排序"
 bfl_monetary: "货币政策和流动性"
 bfl_monetary_explanation: "与主权机构和完整的中央银行交换保留票据的货币。抵押和流动性便利后贴现第三家银行票据； Revolutions 增加了资助的成员净额并限制了公共安全支持。接受的费率保持固定。"
 bfl_monetary_tip: "#T 货币工具#!\n主权票据的后期许可、有保障的流动性、清算和公共支持。每个都需要自己的授权、支持和操作条件。"
 bfl_money_accept: "切换接受和折扣"
 bfl_money_accept_tip: "纸币可以用硬币换取完全保留的索赔权。接受是自愿的。提前折扣 75 黄金兑 100- 第三银行金币。仅当每个成员都能支付其净借方时，清算才会结算匹配的到期票据。现有的索赔在失去权威和建筑物后仍然存在。"
 bfl_money_acceptance_action: "变更自愿接受"
 bfl_money_authorize: "授权笔记"
 bfl_money_authorize_tip: "主权控制人授权其特许银行。现有资本需要一个主权拥有的完整中央银行。新发行还需要发行人的资金银行分行和票据研究。"
 bfl_money_clear: "结算会员账单"
 bfl_money_clear_open: "清算入场"
 bfl_money_clear_open_tip: "打开或关闭您的清算组的准入。需要革命、清算所和高级清算研究，以及由银行或其实际主权拥有的完整清算所。最多四名成员。"
 bfl_money_clear_tip: "本月结算一次匹配的到期会员账单。每个成员必须偿还其净借方，同时保护其他储备金。一个短成员保存整批。承诺索赔和非会员索赔不包括在内。"
 bfl_money_empty: "没有流通纸币。货币研究、权威和已竣工的建筑开启了新的服务。"
 bfl_money_empty_tip: "纸币可以用硬币换取完全保留的索赔权。接受是自愿的。提前折扣 75 黄金兑 100- 第三银行金币。仅当每个成员都能支付其净借方时，清算才会结算匹配的到期票据。现有的索赔在失去权威和建筑物后仍然存在。"
