 bfl_invite_equity_capital_desc: "订阅 100 黄金到 [ROOT.GetCountry.MakeScope.GetVariable('bfl_capital_issuer').GetCountry.GetName] 从选定的金库或遗产钱包中。认购者按市场报价收到新股。遗产钱包至少保留 25 黄金。财务所有权、未来股息和稀释遵循缴付股份。"
 bfl_invite_equity_capital_tip: "选择国库或遗产钱包进行认购 100 黄金按银行当前的资产净值计算。新股稀释现有持有人；银行收到付款。"
 bfl_join_clearing_group: "加入清算组"
 bfl_join_clearing_group_act: "$bfl_join_clearing_group$"
 bfl_join_clearing_group_command: "$bfl_join_clearing_group$"
 bfl_join_clearing_group_command_desc: "$bfl_join_clearing_group_desc$"
 bfl_join_clearing_group_desc: "加入接受会员的运营商。每组四家银行；匹配的到期付款账单通过资助的净借方结算。一个矮的成员会阻止该批次，但不会删除声明。"
 bfl_join_clearing_group_effect_text: "$bfl_join_clearing_group$"
 bfl_join_clearing_group_effect_text_past: "$bfl_join_clearing_group$"
 bfl_join_clearing_group_tip: "选择一个经过研究的接受会员的清算运营商。需要革命、清算所和高级清算研究。最多四家银行明确加入；空头成员保留所有索赔。"
 bfl_liabilities_label: "银行负债"
 bfl_liabilities_label_tip: "#T 债务总额#!\n记录在银行账户中的义务。这与您所在州的本地贷款和债券是分开的。\n\n存款本金： [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_deposit_principal')|2]@gold!\n存入存款利息： [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_deposit_interest')|2]@gold!\n未完成注释： [Country.MakeScope.GetVariable('bfl_notes_outstanding').GetValue|2]@gold!\n其他应付款： [Country.MakeScope.GetVariable('bfl_other_payables').GetValue|2]@gold!\n总计： [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_liabilities')|2]@gold!\n\n排队提款 [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_withdrawals_due')|2]@gold! 已经是存款索赔的一部分，不会再次添加。"
 bfl_liquidity_facilities: "流动性设施"
 bfl_liquidity_facilities_desc: "即使是有偿付能力的银行也可能无法同时满足对硬币的所有需求。针对健全资产的临时垫款可以弥补这一不足，前提是援助不会掩盖机构无法承担的损失。"
 bfl_liquidity_warning: "银行流动性需要关注"
 bfl_liquidity_warning_desc: "您的银行已排队提款或资本不足。开放经济→银行与金融审查存款和资本重组。"
