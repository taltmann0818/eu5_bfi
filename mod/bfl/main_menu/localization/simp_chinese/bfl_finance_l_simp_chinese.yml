 bfl_term_decline: "保留现有账户"
 bfl_term_deposit: "定期存款"
 bfl_term_deposits_desc: "商人不能总是立即使用他们的钱。通过按约定期限将资金委托给银行，他们为银行家提供了更稳定的资金来源，并因放弃立即使用其资金而获得补偿。"
 bfl_term_offer_1_desc: "更新你的成熟 [ROOT.GetCountry.MakeScope.GetVariable('bfl_deposit_offer_principal').GetValue|2] 黄金本金 12 月于 [ROOT.GetCountry.MakeScope.GetVariable('bfl_deposit_offer_rate').GetValue|%1] 每年。应计利息仍单独支付。没有新的本金被转移。此优惠于月底到期；更改的索赔需要新的报价。"
 bfl_term_offer_1_title: "更新到期定期存款"
 bfl_term_offer_2_desc: "排队提前提款 [ROOT.GetCountry.MakeScope.GetVariable('bfl_deposit_offer_principal').GetValue|2] 取消后的黄金本金 [ROOT.GetCountry.MakeScope.GetVariable('bfl_deposit_offer_penalty').GetValue|2] 应计利息黄金（最多 1% 校长）。不适用主罚。提款队列中仍存在现金短缺问题。此优惠于月底到期；更改的索赔需要新的报价。"
