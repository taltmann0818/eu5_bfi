 bfl_browse_goods_desc: "审查实际监管提议、现有索赔或自愿海关进入协议。选择一个国家不会带来金钱。"
 bfl_browse_goods_effect_text: "$bfl_browse_goods$"
 bfl_browse_goods_effect_text_past: "$bfl_browse_goods$"
 bfl_burghers_estate_workout_mandate: "遗产处理授权"
 bfl_burghers_estate_workout_mandate_desc: "该阶层明确授权其政府代表其审查自愿银行存款计划。每个提案仍需要单独接受。撤销此特权将使待决的遗产条款失效。追偿款项继续存入遗产钱包。"
 bfl_buy_bill: "资金支付账单· 100 黄金"
 bfl_buy_bill_tip: "#T 资金支付账单#!\n转乘 100 国家黄金向银行支付票据资金。该票据被记录为应付账款，而不是银行利润或无担保贷款。需要商业票据研究、合同表空间和接受该业务的运营银行。"
 bfl_buy_capital: "认购资金· 100 黄金"
 bfl_buy_capital_tip: "#T 认购银行资本#!\n转乘 100 国家黄金购买新的银行所有权单位。单位的定价取决于现有单位的正银行股本。这增加了银行现金和实收资本，而不是利润。由本地银行研究、资本表空间和接受此项业务的运营银行解锁。资本面临损失，不能作为存款提取。"
 bfl_buy_confirm_desc: "购买 [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_quantity').GetValue|3] shares of [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_issuer').GetCountry.GetName] 为了 [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_total').GetValue|2]@gold!。这些是做市商库存中的现有股票。发行人未获得融资，已发行股份未发生变化。报价、实时市场准入、可用单位、受保护现金和集中度限额在接受时再次检查。结算会消耗一名外交官，并开始该发行人为期一个月的买入/卖出冷却时间。"
 bfl_buy_confirm_title: "Confirm share purchase"
 bfl_buy_secondary_confirm_desc: "购买 [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_quantity').GetValue|3] existing shares of [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_issuer').GetCountry.GetName] 来自 [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_seller').GetCountry.GetName] 为了 [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_total').GetValue|2]@gold!。当前卖家收到付款。发行人未获得融资，已发行股份未发生变化。可用性、访问权限、受保护资金以及此优惠的修订将在接受后再次检查。结算会消耗一名外交官，并开始该发行人为期一个月的买入/卖出冷却时间。"
 bfl_buy_selected_bond: "Buy existing claim"
 bfl_buy_selected_bond_tip: "向当前卖家支付报价。发行人没有收到新资金。执行会重新检查所有权、到期日、生成、交换、欠款和现金。"
 bfl_buy_shares: "Buy shares"
 bfl_buy_shares_desc: "选择一家银行或公司，设置股票数量，然后查看总数。买入从卖出报价或做市商库存中转移现有股票。利用单独的资本认购行动为新发行提供资金。"
 bfl_buy_shares_tip: "选择一家银行或公司，设置股票数量，然后查看总数。买入从卖出报价或做市商库存中转移现有股票。利用单独的资本认购行动为新发行提供资金。\n需要完成交易所、股票交易和至少一名外交官。每笔成功的交易都会消耗一名外交官，并为该发行人启动一个月的冷却时间。可用的外交官： [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bfl_available_trade_diplomats')|2]。订单的现金价值必须至少为 0.01 黄金。"
 bfl_buy_sovereign_bond: "购买发行的主权债券"
 bfl_buy_sovereign_bond_act: "$bfl_buy_sovereign_bond$"
 bfl_buy_sovereign_bond_desc: "从当前持有者手中购买现有的主权债券。需要拥有一座已竣工的证券交易所大楼。"
 bfl_buy_sovereign_bond_effect_text: "$bfl_buy_sovereign_bond$"
 bfl_buy_sovereign_bond_effect_text_past: "$bfl_buy_sovereign_bond$"
 bfl_buy_sovereign_bond_tip: "选择公开发行的发行人。付款支付给现有持有人；发行人没有收到新的收益。整个债权易手，其固定年度息票和本金完好无损。"
 bfl_buy_state_confirm_desc: "回购 [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_quantity').GetValue|3] existing shares of [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_issuer').GetCountry.GetName] 来自做市商库存 [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_total').GetValue|2]@gold!，从贵国国库支付。这些股份将返回您的库存股份。该银行没有收到任何融资，发行的股票也没有变化。再次检查可用经销商库存、当前市场报价、实时包机授权和库存现金。结算会消耗一名外交官，并开始该银行为期一个月的买卖冷却时间。"
