 bfl_sell_shares_tip: "选择您持有的股票之一和数量。隐藏的做市商立即以市场报价减去显示的交易商点差购买您的股票。人工智能银行在后台购买库存。\n需要完成交易所、股票交易和至少一名外交官。每笔成功的交易都会消耗一名外交官，并为该发行人启动一个月的冷却时间。可用的外交官： [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('bfl_available_trade_diplomats')|2]。订单的现金价值必须至少为 0.01 黄金。"
