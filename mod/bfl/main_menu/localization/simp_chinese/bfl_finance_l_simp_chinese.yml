 bfl_venture_ticket_100: "资金限额· 100 黄金"
 bfl_venture_ticket_200: "资金限额· 200 黄金"
 bfl_venture_ticket_400: "资金限额· 400 黄金"
 bfl_venture_ticket_tip: "循环最大银行授权 100, 200 或 400 黄金。仅绘制活动的实际成本。未使用的货运资金立即释放；未使用的探险资金将保留给符合条件的已发现区域货物，直至到期。双边条款要求运营商提供一半银行授权的能力。"
 bfl_venture_title: "康门达投资公司"
 bfl_ventures: "企业与公司·海外投资"
 bfl_ventures_explanation: "Commenda 从 Discovery 开始；本土公司和公司股权需要改革。政治霸主控制权和金融所有权保持分离。项目资本不是股息。"
 bfl_ventures_tip: "#T 风险投资和公司#!\n资助企业、公司投资、项目安全和银行股份转让的许可。这些使资本面临投资风险，需要相关的研究和专业化。"
 bfl_warehouse_receipt: "仓单"
 bfl_warehouse_receipt_tip: "#T 仓单#!\n针对可识别的存储货物提出索赔。需要仓单研究、商业金融和专制主义时代或更高版本。此版本中不提供经过验证的存储和货物执行。"
 bfl_warehouse_receipts: "仓单"
 bfl_warehouse_receipts_desc: "保存在信誉良好的仓库中的货物可以支持商业活动，而无需在每次销售时都进行移动。收据确立了对所存储商品的索取权，允许其所有者在商品保管期间获得融资。"
 bfl_withdraw: "提取到期的国家存款"
 bfl_withdraw_tip: "#T 提取到期的国家存款#!\n请求偿还您所在州的活期账户和到期定期账户。银行用可用现金支付本金和贷记利息。未支付的金额仍记录在提款队列中，并暂停新业务。国外账户和未到期定期存款不能通过此操作提取。"
 bfl_workout_decline: "保留完整的索赔"
 bfl_workout_desc: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_workout_bank').GetCountry.GetName] 提出您的存款条款 [ROOT.GetCountry.MakeScope.GetVariable('bfl_workout_claim').GetValue|2] 黄金。你可以放弃 20% 剩余的债权，按转换前的有形资产净值将整个债权转换为新发行的股份，或保留您的债权。转换需要正的资产净值和股东能力，而银行债权人无法获得。债权人池 [ROOT.GetCountry.MakeScope.GetVariable('bfl_workout_pool').GetValue|0]: 0 国库、 1 市民, 2 贵族, 3 神职人员, 4 农民。遗产条款要求该遗产颁布锻炼授权。报价本月到期；恢复或管理变更使其失效。"
 bfl_workout_equity: "将债权转换为股票（需要正资产净值）"
 bfl_workout_haircut: "接受一个 20% 减少"
 bfl_workout_title: "债权人重组提案"
