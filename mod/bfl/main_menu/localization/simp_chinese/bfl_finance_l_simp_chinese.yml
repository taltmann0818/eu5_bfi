 bfl_goods_branch_desc: "主办方提供进入其资本市场的机会 12 月于 1 每月金币，支付给主人。本地购买保留自己的现金费用；这是一项单独的托管服务。访问需要主人自己完成海关大楼和和平。未付费访问、到期、建筑物损失或战争会停止新的购买和交付。东道主可以冻结当地监护权；没有创造任何现金或商品。使用同一主机续订以恢复访问。"
