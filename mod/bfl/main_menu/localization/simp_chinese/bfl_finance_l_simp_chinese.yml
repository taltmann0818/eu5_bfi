 bfl_accept_money_claims.desc: "自愿接受或停止接受通过 mod 交互按面值提供的全额资助的票据和票据。转账仍然需要您可用的资金。接受结束后，已接受的索赔仍然可以赎回。本地支付继续使用黄金。"
 bfl_accept_money_claims.title: "切换接受银行付款索赔"
 bfl_accounts_explanation: "本国国库是现金。存款和票据都是负债。贷款以现金换取资产；本金、认购和发行均不产生利润。"
 bfl_activity_title: "每月活动报表"
 bfl_activity_title_tip: "原生息票观察对原生净预算进行分类；他们从来不会两次转移黄金。已结算的本机支付收益在确认损益之前释放实际购置成本。公司分配和定制资助的收据进入各自的桶。本金、存款和认购不计入利润。"
 bfl_administer_estates: "管理继承的金融财产"
 bfl_administer_estates.desc: "审查被摧毁机构单独持有的现金和债务。受托机构从未将其现金纳入国库。"
 bfl_administer_estates.title: "管理继承的金融财产"
 bfl_administer_estates_desc: "审查被摧毁机构单独持有的现金和债务。受托机构从未将其现金纳入国库。"
 bfl_advanced_clearing: "高级清算"
 bfl_advanced_clearing_desc: "相互欠债多笔的银行无需用硬币单独偿还每一项债务。清算账户可以核对其债权并仅转移剩余余额，从而减少维持商业所需的资金。"
 bfl_advanced_tip: "研究解锁了任务。银行还必须满足其专业化、流动性和运营要求。不可用的执行保持禁用状态。"
 bfl_ai_equity_offering: "承认银行和公开付费资本发行"
 bfl_ai_equity_offering_desc: "AI管理层可以承认其实际银行并在股票交易和完成交换后授权付费初级认购。入场不会产生现金或股票。"
 bfl_ai_equity_purchase: "考虑资助外汇投资"
 bfl_ai_equity_purchase_desc: "AI购买使用与玩家相同的实时研究、建筑、权限、容量和精确报价确认检查。每月机会审查，至少 500 现金和资本盈余的黄金。没有高于市场的要求。"
 bfl_ai_exchange_priority: "优先进入证券交易所"
