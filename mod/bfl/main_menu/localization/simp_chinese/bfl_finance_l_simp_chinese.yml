 bfl_deposit_policy_title: "新存款利率"
 bfl_deposit_policy_title_tip: "#T 新存款利率#!\n选择新活期账户接受的年利率。\n\n目前报价： [Country.MakeScope.GetVariable('bfl_demand_rate').GetValue|%2]\n定期账户优惠： [Country.MakeScope.GetVariable('bfl_term_rate').GetValue|%2]\n\n现有账户保留开立时商定的利率。每月贷记利息会增加银行的负债并减少其留存收益；在付款之前，它不会转移现金。"
 bfl_deposits: "存款和利率"
 bfl_deposits_label: "存款索赔"
 bfl_dev_notice: "融资信贷、主权债券、公司投资、商品、商品和货币服务均遵循其研究、概况和建设要求。版本范围内的活动平衡性和兼容性仍在验证中。"
 bfl_distress: "困境与发展之门"
 bfl_distribution_title: "利润分配"
 bfl_distribution_title_tip: "#T 每月股利#!\n主权股息=主权股×（（每月银行净利润×派息率）/已发行股票）。\n\n支付比例： [Country.MakeScope.GetVariable('bfl_payout_ratio').GetValue|%0]\n扣除成本和亏损后的净利润： [Country.MakeScope.GetVariable('bfl_monthly_net_income').GetValue|2]@gold!\n主权股份： [Country.MakeScope.GetVariable('bfl_state_units').GetValue|2]\n已发行股票： [Country.MakeScope.GetVariable('bfl_total_units').GetValue|2]\n最后总股息： [Country.MakeScope.GetVariable('bfl_dividend_paid').GetValue|2]@gold!\n最后一次主权股息： [Country.MakeScope.GetVariable('bfl_state_dividend_paid').GetValue|2]@gold!\n\n主权国家最初拥有 100%。新的银行认购增加了资本并稀释了所有权。现金、资本和未偿债务限制了资助支出。负收入不支付股息；下个月不再计算留存利润。本金、存款、认购和借款不包括在内。"
 bfl_dividend_explanation: "扣除存款利息、营业费用和亏损基金股息后的每月净收入。每位所有者收到的拥有股份乘以每股已发行股份的资助支出。下个月不再分配留存收益。"
 bfl_draw_bond: "借用 100 从银行"
 bfl_draw_bond_tip: "特许银行支付 100 黄金作为永久主权债券。每月发行一期，受受保护的现金、资本和发行人债务能力的限制。 Proceeds are financing.向当前持有人偿还面值以将其注销。"
 bfl_equity_debt: "银行股本和债务"
 bfl_equity_debt_tip: "#T 银行股本和债务#!\n最多十二个实际每月结算快照。绿色是资产减去负债；红色是银行的总负债。两者都使用相同的自动缩放黄金轴，包括负资产。示例从左侧最旧的到右侧最新的。将鼠标悬停在样本上即可查看其价值和会计月份。国家贷款不包括在该银行历史记录中。"
 bfl_equity_label: "银行股本"
 bfl_equity_label_tip: "#T 银行股本#!\n履行义务后的剩余价值属于银行所有者。\n\nAssets: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_assets')|2]@gold!\n减去总债务： [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_liabilities')|2]@gold!\n股权： [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_equity')|2]@gold!\n\nRecorded state units: [Country.MakeScope.GetVariable('bfl_state_units').GetValue|2]\nTotal ownership units: [Country.MakeScope.GetVariable('bfl_total_units').GetValue|2]\nCapital headroom: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_capital_headroom')|2]@gold!\n\n负资产意味着资不抵债。资本净空高于股本 10% 资产，最少为零；分配受到净空和可用现金的限制。权益不是可以立即提取的金额。"
