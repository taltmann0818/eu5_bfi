 bfl_offer_commenda: "资助货运业务"
 bfl_offer_commenda_act: "资助货运业务"
 bfl_offer_commenda_desc: "根据银行提议的条款提供风险资本。承兑按原价购买指定货物；未使用的授权仍由银行保留。资本和回报永远得不到保证。"
 bfl_offer_commenda_effect_text: "资助货运业务"
 bfl_offer_commenda_effect_text_past: "资助货运业务"
 bfl_offer_commenda_tip: "发现或后来的海外投资和 Commenda 研究。为十件货物选择运营商、来源市场、目的地和货物。接受会重新检查您的权力、自由现金、资本和能力。每个运营商一份有效协议；每家银行最多 8 个。"
