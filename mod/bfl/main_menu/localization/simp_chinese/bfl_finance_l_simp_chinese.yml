 bfl_offer_credit_effect_text_past: "$bfl_offer_credit$"
 bfl_offer_credit_tip: "选择一家主权或合格的本土公司。这两种情况都向主权国家提供贷款；公司信用需要商业金融、改革和企业信用。债务减免还需要文艺复兴债务重组。"
