 bfl_goods_previous: "之前拍品"
 bfl_goods_quote_desc: "数量： [ROOT.GetCountry.MakeScope.GetVariable('bfl_goods_quote_quantity').GetValue|3]。价格： [ROOT.GetCountry.MakeScope.GetVariable('bfl_goods_quote_price').GetValue|2] 黄金加 1 黄金保管费。仓单立即拥有货物。实物远期可在三个月内全额预付交割资金。两者都需要有支持的货物。仓储成本 0.1 每月；物理损失是 2% 每年。远期保持其固定数量：缺失单位按比例退款加上同等的卖方保证金。运送到另一个市场需要两个月的时间，成本 1 黄金和损失 1% 的数量。储存和运输损失减少了收货数量。无效当事人或失去访问权可以保留货物和抵押品以供追回。仅当这些条款适合您时才接受。"
