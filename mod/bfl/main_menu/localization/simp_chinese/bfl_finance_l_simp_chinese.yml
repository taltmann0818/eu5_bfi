 bfl_sell_confirm_desc: "出售 [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_quantity').GetValue|3] shares of [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_issuer').GetCountry.GetName] 为了 [ROOT.GetCountry.MakeScope.GetVariable('bfl_market_total').GetValue|2]@gold!。隐性做市商在报价有效的情况下保证本次交易，包括报价的交易点差。股票立即离开您的投资组合；后台AI购买不延迟付款。收益进入您银行的金库。结算会消耗一名外交官，并开始该发行人为期一个月的买入/卖出冷却时间。"
