 bfl_sovereign_note_tip: "#T 可兑换纸币#!\n专制主义、主权纸币研究、主权授权、资本中央银行和发行人银行分行。交流 100 完全保留索赔的硬币。基于独立股权的上限不包括收到的票据现金。自愿平价转让；本地支付仍以黄金形式支付。"
 bfl_sovereign_receivables: "主权应收款"
 bfl_sovereign_receivables_heading: "主权应收款 [Country.GetName]"
 bfl_sovereign_restructuring: "主权重组"
 bfl_sovereign_restructuring_tip: "#T 主权重组#!\n根据债务重组预付款重新谈判主权债务。需要允许的年龄、运营银行和受支持的本地债务交易。本机重组执行在此版本中不可用。"
 bfl_specialization_title: "银行专业化"
 bfl_state_bonds_tip: "#T 国家债券容量#!\n未偿还的本土国家债券： [GetPlayer.GetNumBonds]\n最大原生债券槽位： [GetPlayer.GetDoubleModifierValue('max_bonds', 'max_bonds_modifier')|0]\n\n这些是您所在州的债券，与银行的存款、股本和其他负债分开。该容量包括本机基本插槽和键容量修饰符。出售债券还需要本地借款条件。"
 bfl_state_bonds_value: "债券： [GetPlayer.GetNumBonds] / [GetPlayer.GetDoubleModifierValue('max_bonds', 'max_bonds_modifier')|0]"
 bfl_state_chartered_bank: "渣打银行"
 bfl_state_chartered_bank_desc: "单独资助的本土银行科目。主权国家最初拥有所有股份，并以信贷形式设定每月股息支付。新的银行认购增加了资本并稀释了现有的所有权。国家存款可享受优惠利息。"
