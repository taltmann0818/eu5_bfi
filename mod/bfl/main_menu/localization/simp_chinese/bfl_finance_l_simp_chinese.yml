 bfl_cash: "国库现金"
 bfl_cash_tip: "#T 国库现金#!\n黄金目前由银行持有。\n\n现金总额： [Country.GetFixedPointCurrencyValue('gold')|2]@gold!\n受保护的现金： [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_protected_cash')|2]@gold!\nAvailable cash: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_free_cash')|2]@gold!\n\n受保护的现金储备 25% 排队取款后剩余的负债，完整的取款队列，a 25 黄金运营缓冲和承诺现金。可用现金是国库现金减去储备金，最少为零。受保护的现金是必要的准备金；它可以超过实际持有的现金。"
