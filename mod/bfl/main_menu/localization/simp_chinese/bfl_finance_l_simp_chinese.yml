 bfl_safeguards_title: "流动性和保障措施"
 bfl_safeguards_title_tip: "#T 流动性和保障措施#!\n可用银行现金： [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_free_cash')|2]@gold!\n受保护的现金需求： [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_protected_cash')|2]@gold!\n排队提款： [GuiScope.SetRoot(Country.MakeScope).ScriptValue('bfl_withdrawals_due')|2]@gold!\n\n资本重组提供国有资本。暂停存款将停止向新账户提供资金，同时保留现有义务。"
