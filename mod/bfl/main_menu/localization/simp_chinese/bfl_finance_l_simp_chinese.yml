 bfl_venture_accept: "接受合作伙伴关系"
 bfl_venture_accept_tip: "重新检查实时投资者的权威、不变的报价条款、年龄、研究、自由现金、资本、能力和运营商贡献。资金仅支付所选活动的实际成本。它不授予任何公司股份或政治控制权。"
 bfl_venture_decline: "拒绝"
 bfl_venture_duration_12: "持续时间· 12 月"
 bfl_venture_duration_120: "持续时间· 120 月"
 bfl_venture_duration_24: "持续时间· 24 月"
 bfl_venture_duration_6: "持续时间· 6 月"
 bfl_venture_duration_60: "持续时间· 60 月"
 bfl_venture_duration_tip: "循环 6, 12, 24, 60 或 120 几个月。从长远来看，适应本土探索。如果本地访问仍然有效，货物将在两个月后出售；被封锁的货物仍被扣留。没有关联销售收益的远征成本将在到期时冲销。"
 bfl_venture_empty: "没有活跃的企业。在提供条款之前选择货运业务或本地探险。"
 bfl_venture_help: "单击一个术语即可循环。每个运营商单独接受。政策或研究发生变化后，现有协议仍然有效。"
 bfl_venture_hint: "将鼠标悬停在活动、成本、货物和退货上"
 bfl_venture_locked: "新企业已锁定 · 悬停以获取要求"
 bfl_venture_note: "资本先于利润收回。损失跟随贡献。只有指定运营商所收购的货物才能为其收益提供资金。无关贸易从不支付此协议。光是发现就不需要付出任何代价。关闭的行将保留，直到被新接受的协议取代。"
 bfl_venture_offer_desc: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_bank').GetCountry.GetName] 优惠 [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_ticket').GetValue|0] 黄金为 [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_duration').GetValue|0] 几个月。预设 [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_preset').GetValue|0]: 0 = 投资者投入所有资金，收到 75% 盈余； 1 = 投资者出资三分之二，运营商出资三分之一，盈余平分。先收回资金；损失跟随贡献。只有指定业务的实际销售收入才能支付利润。勘探的成功给予的是机会，而不是黄金。此优惠将在三个月后到期。"
 bfl_venture_offer_desc_0: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_bank').GetCountry.GetName] 授权最多 [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_ticket').GetValue|0] 银行融资的黄金 [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_duration').GetValue|0] 几个月。购买 10 [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_good').Goods.GetNameWithNoTooltip] 在 [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_from').GetMarket.GetName]，持有两个月，然后出售 [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_to').GetMarket.GetName]。银行资助所有费用并收到 75% 的盈余。\n\n仅绘制实际的本地成本。未使用的资金留在银行。资本在盈余之前收回；损失跟随贡献。只有该货物的测量销售收入才能达成本协议。不相关的收入和发现无需支付任何费用。优惠将于三个月后到期。"
 bfl_venture_offer_desc_1: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_bank').GetCountry.GetName] 授权最多 [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_ticket').GetValue|0] 银行融资的黄金 [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_duration').GetValue|0] 几个月。购买 10 [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_good').Goods.GetNameWithNoTooltip] 在 [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_from').GetMarket.GetName]，持有两个月，然后出售 [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_to').GetMarket.GetName]。银行承担三分之二的费用；你付三分之一。盈余平分。\n\n仅绘制实际的本地成本。未使用的资金留在银行。资本在盈余之前收回；损失跟随贡献。只有该货物的测量销售收入才能达成本协议。不相关的收入和发现无需支付任何费用。优惠将于三个月后到期。"
 bfl_venture_offer_desc_2: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_bank').GetCountry.GetName] 授权最多 [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_ticket').GetValue|0] 银行融资的黄金 [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_duration').GetValue|0] 几个月。准备原生探索 [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_area').GetArea.GetName] 来自 [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_port').GetLocation.GetName] 与 [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_explorer').GetCharacter.GetName]。银行资助所有商定的黄金成本并收到 75% 的合同盈余。准备工作不可退款，包括取消。您在本资助协议之外提供船员、本地维护和可选的探险支出。剩余的银行授权可以为来自被发现区域中心或周边市场的一件十单位货物提供资金，但须符合当地准入条件。只有货物的实测销售额减去记录的准备和货运成本，才能支付合同盈余。发现和不相关的贸易没有任何回报。该优惠将在三个月后到期。 "
 bfl_venture_offer_desc_3: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_bank').GetCountry.GetName] 授权最多 [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_ticket').GetValue|0] 银行融资的黄金 [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_duration').GetValue|0] 几个月。准备原生探索 [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_area').GetArea.GetName] 来自 [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_port').GetLocation.GetName] 与 [ROOT.GetCountry.MakeScope.GetVariable('bfl_venture_offer_explorer').GetCharacter.GetName]。该银行为商定的黄金成本提供三分之二的资金；你付三分之一。合同盈余平均分配。准备工作不可退款，包括取消。您在本资助协议之外提供船员、本地维护和可选的探险支出。剩余的银行授权可以为来自被发现区域中心或周边市场的一件十单位货物提供资金，但须符合当地准入条件。只有货物的实测销售额减去记录的准备和货运成本，才能支付合同盈余。发现和不相关的贸易没有任何回报。该优惠将在三个月后到期。 "
