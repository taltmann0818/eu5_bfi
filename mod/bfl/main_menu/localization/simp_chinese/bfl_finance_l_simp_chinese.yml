 AM_bfl_chartered_bank: "Chartered Bank"
 LEAD_bfl_chartered_bank: "渣打银行财务总监"
 MODIFIER_TYPE_DESC_bfl_enable_advanced_clearing: "解锁参与机构之间经过验证的互惠义务的净额结算。清算必须保护每个持有人的权利并在不创造货币的情况下结算资助的净余额。本地银行间结算仍然不可用。"
 MODIFIER_TYPE_DESC_bfl_enable_bank_capital_subscriptions: "允许主要订阅 100 黄金存入银行。新所有权单位按当前资产净值定价。认购收益增加实收资本而不是已实现利润，并购买后续分配的比例索取权。"
 MODIFIER_TYPE_DESC_bfl_enable_bank_share_dealing: "允许银行股份转让服务在确定的持有人之间转移现有的注册单位。转让会改变所有权，但不会发行新单位或创造银行利润。登记机构必须有能力并保护每个持有人的权利。"
 MODIFIER_TYPE_DESC_bfl_enable_collateralization: "解锁记录的抵押品承诺及其资格检查。担保资产不能获得第二次债权，追回必须保留原有的债务关系。本地抵押品执行仍然不可用。"
 MODIFIER_TYPE_DESC_bfl_enable_commenda: "解锁海外投资航程合作授权。每个企业都需要一个确定的合作伙伴、融资资本、记录的利润分享协议以及已实现收益的结算。在此开发版本中项目执行仍然不可用。"
 MODIFIER_TYPE_DESC_bfl_enable_commercial_bills: "允许全额支付账单。购买者支付 100 发行前的黄金；银行记录了等额应付和现金承诺。指定持有人可在一个月后赎回票据，仅限一次。发行不是利润。"
 MODIFIER_TYPE_DESC_bfl_enable_commodity_forwards: "解锁商业金融远期交割合同。每份协议必须记录其交易对手、货物、数量、交货日期和支持，不得重复使用抵押库存。本地交易执行仍然不可用。"
 MODIFIER_TYPE_DESC_bfl_enable_commodity_investments: "解锁商业金融库存授权。商品头寸必须代表受资助的本土商品持有量，并保留收购成本、数量和保管权。在此开发版本中，交易执行仍然不可用。"
 MODIFIER_TYPE_DESC_bfl_enable_company_equity: "解锁海外投资公司股权授权。金融股与政治主体控制分开记录。只有经过验证的公司分配才可能成为银行收入；认购和资本返还不包括在内。本机执行仍然不可用。"
 MODIFIER_TYPE_DESC_bfl_enable_corporate_credit: "解锁商业金融企业信贷授权。贷款必须将银行现金转移给指定的企业并产生同等的可收回债权；本金偿还不计入利润。本机执行仍然不可用。"
 MODIFIER_TYPE_DESC_bfl_enable_debt_restructuring: "解锁主权重组授权。经债务人同意，修改后的到期日、利息和本金必须附加到现有债权上。在支持本地债务调节之前，执行仍然不可用。"
 MODIFIER_TYPE_DESC_bfl_enable_liquidity_facilities: "释放有保障的临时流动性。资金必须来自真正的交易对手，保持在现金和资本限额内，并携带记录的抵押品。排队提款保留优先权。本机设施执行仍然不可用。"
 MODIFIER_TYPE_DESC_bfl_enable_margining_and_risk_management: "解锁商业金融远期头寸的保证金要求。风险敞口必须根据可用的抵押品和现金来衡量，并在承诺增加之前需要额外的资金。本地交易和保证金执行仍然不可用。"
 MODIFIER_TYPE_DESC_bfl_enable_project_security: "解锁海外投资项目的安全性。已确定的项目资产和收益必须抵押给单一记录的债务，并通过结算或追偿保留优先权。本机项目执行仍然不可用。"
 MODIFIER_TYPE_DESC_bfl_enable_public_financial_backstops: "解锁授权特许银行的公共支持授权。援助需要真实的国库捐款和记录的索赔或所有权单位；担保不能创造现金或消除损失。站立逆止执行尚未实施。"
 MODIFIER_TYPE_DESC_bfl_enable_sovereign_banknotes: "为授权特许银行解锁主权票据发行。票据是可赎回负债；支持不包括通过出售票据本身筹集的现金。本地发行和持有人支付路由仍然不可用。"
 MODIFIER_TYPE_DESC_bfl_enable_term_deposits: "允许固定利率存款 100 期限为十二个月的黄金。利息按开户时接受的利率每月累积；未到期本金不能提取。存款仍然是银行的负债。"
 MODIFIER_TYPE_DESC_bfl_enable_warehouse_receipts: "解锁由已识别库存批次支持的商业财务收据。每张收据保留十个未支配单位，并收取一定的托管费。在开具新收据之前，必须支持本地货物保管。"
 MODIFIER_TYPE_DESC_bfl_no_automatic_tribute_cost_modifier: "包机关系没有自动贡品。国家收入来自银行股票的存款利息和股息。"
