 bfl_goods_set_contracts_tip: "仅现货，自动提供收据，或自动提供实物远期。报价需要工具的年龄​​和研究，保持支持并等待单独的交易对手接受。现有已接受的义务仍然受到保护。"
 bfl_goods_set_mandate_tip: "自动：根据您的政策进行买卖。暂停：无任意交易。流失：出售可获取的免费库存而不更换它。现有合同、存储和损失在所有模式下均继续存在。"
 bfl_goods_set_risk_tip: "谨慎：获利了结 +10%、止损 −5%。平衡： +20% / −15%。喜欢冒险： +35% / −25%。限制使用本地销售报价与剩余成本；执行是每月一次，价格可能会变动。"
 bfl_goods_set_turnover_tip: "最长持有期限： 6, 12 或 24 几个月。银行在到期时出售可用的自由头寸并自动选择新的商品。"
