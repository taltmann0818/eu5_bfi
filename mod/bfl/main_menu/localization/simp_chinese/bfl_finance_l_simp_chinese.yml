 bfl_custom_bonds_title: "主权债券"
 bfl_custom_bonds_title_tip: "该银行为定制的永久主权债券提供资金。当前持有者每月可获得优惠券和面值兑换。海关债务能力和本国债务能力之和为 24 个月的原生收入 100- 黄金最低限度；自定义优惠券最多可消费 25% 的原生收入。未支付的优惠券会阻止新的发行和转售。"
 bfl_dealer_inventory_class: "做市商库存·无票"
 bfl_debt: "原生债务组合"
 bfl_debt_explanation: "特许银行基金定制主权债券。二级交易需要双方完成证券交易所，包括早期活动赠款。本地信贷使用已接受的报价并通过持久的索赔记录研究债务减免。"
 bfl_debt_facility: "债务融资"
 bfl_debt_resale: "债务转售"
 bfl_debt_resale_tip: "#T 主权债券转售#!\n出售和购买二级主权债券需要证券交易所预付款和拥有的证券交易所大楼。公开发行转让相同的自定义声明 98% 面值；发行人没有收到新的收益。优惠券和兑换跟随买家。"
 bfl_debt_restructuring: "债务重组"
 bfl_debt_restructuring_desc: "无法在指定日期收回的债务不一定毫无价值。债权人可以通过同意新条款来保留更多的债权，而不是迫使陷入困境的债务人彻底违约。"
 bfl_debt_tip: "#T 债务和信用#!\n贷款、承销、重组和债务转让许可。每个行都有自己的研究、专业化、流动性和执行要求。锁定意味着新的发起不可用；它不会取消现有的索赔。"
 bfl_demand_deposit: "活期存款"
 bfl_deposit_1: "押金 100 按需黄金"
 bfl_deposit_1_tip: "#T 活期存款#!\n转乘 100 将黄金存入您的特许银行。其新帐户年度优惠是显示的基本费率加上 1% 包机费。当资金到位时，每月向您的国库支付活期利息，并带有分利差；仍欠未付利息。现有帐户保持其接受率。提款偿还本金和未付利息。独立银行通过外交接受存款 +50 意见或更好并提供基本费率。"
 bfl_deposit_2: "押金 100 黄金为 12 月"
 bfl_deposit_2_tip: "#T 定期存款#!\n转乘 100 将黄金存入您的特许银行十二个月。其新账户年度优惠是显示的期限利率加上 1% 包机费。利息按月累积，到期时与本金一起支付。需要本地银行业务、允许的年龄和免费账户位置。独立定期账户可通过外交途径获得： +50 意见或更好。"
 bfl_deposit_decline_tip: "保留全额存款索赔。没有现金流动，也没有发行股票。"
 bfl_deposit_equity_tip: "仅当幸存银行具有正的有形资产净值和股东能力时，才将报价债权转换为实际股份。不会产生任何认购现金或收入。"
 bfl_deposit_explanation: "每个账户都存储其接受的固定年利率。更改费率会影响新帐户。定期账户到期后 12 几个月。提款短缺仍然是负债，并暂停新的承诺。"
 bfl_deposit_haircut_tip: "接受报价 20% 重新审查债权人、剩余债权、研究和权限后减少。已记录的公共担保仍单独提供资金。"
 bfl_deposit_income_tip: "您的特许银行和独立银行本月实际支付的活期利息。仍欠未付利息。本金提取和资本投入不包括在内。"
 bfl_deposit_interest: "存款利息"
