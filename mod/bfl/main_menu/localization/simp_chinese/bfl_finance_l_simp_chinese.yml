 bfl_browse_bond_issuers: "浏览发行人和持股"
 bfl_browse_bond_issuers_desc: "选择发行人来检查未偿还的债券和要约，包括您的银行持有的债权。"
 bfl_browse_bond_issuers_tip: "选择具有未偿定制债券的实时发行人。这不会购买或出售任何东西。"
