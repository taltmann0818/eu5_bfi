 bfl_commenda_available_tooltip: "[GetPlayer.MakeScope.GetVariable('bfl_op_country').GetCountry.GetName] · 10 [GetPlayer.MakeScope.GetVariable('bfl_op_good').Goods.GetNameWithNoTooltip]\n[GetPlayer.MakeScope.GetVariable('bfl_op_from').GetMarket.GetName] → [GetPlayer.MakeScope.GetVariable('bfl_op_to').GetMarket.GetName]\nEstimated bank cost: [GetPlayer.MakeScope.GetVariable('bfl_op_cost').GetValue|2]@gold!\n指示性银行盈余：+[GetPlayer.MakeScope.GetVariable('bfl_op_surplus').GetValue|2]@gold!\n\n两个月货运业务的当前市场报价；盈余不包括回收的资本。价格和访问权限可能会发生变化。资本和回报都面临风险。只有该货物的实际销售才支付协议费用。经营者必须接受。机会每月刷新一次，并在发送报价之前再次检查。"
 bfl_commenda_cargo: "Commenda：运送发现区域的货物"
 bfl_commenda_cargo_act: "运送发现区域的货物"
 bfl_commenda_cargo_desc: "选择赞助的运营商和来自其发现区域中心或周边市场的十单位货物。只有未使用的接受资金才能支付其原生购买成本。没有发现支出或不相关的贸易归属。"
 bfl_commenda_cargo_effect_text: "运送发现区域的货物"
 bfl_commenda_cargo_effect_text_past: "运送发现区域的货物"
 bfl_commenda_cargo_tip: "需要接受的探险队经过验证的发现、剩余授权、当地市场准入和库存。操作员或政治控制员指挥航行。"
 bfl_commenda_desc: "进行航行的商人可能拥有贸易技能，但没有资本来装满一艘船。推荐人将金融家的资金与旅行伙伴的劳动结合起来，根据协议分享合资企业的收益。"
 bfl_commenda_expedition: "资助一次命名探险"
 bfl_commenda_expedition_act: "资助一次命名探险"
 bfl_commenda_expedition_desc: "选择运营商、发射港、未被发现的海域和探险家。海上目标必须在操作员海军范围内；无土地公司使用选定的自有设施主机的范围。根据提议的条款，接受资金进行本地准备。该银行没有获得政治控制权。"
 bfl_commenda_expedition_effect_text: "资助一次命名探险"
 bfl_commenda_expedition_effect_text_past: "资助一次命名探险"
 bfl_commenda_expedition_tip: "在同意之前选择运营商、区域、发射港和探索者。资金仅支付实际的原生准备成本。准备工作不予退还。剩余的授权可以为来自被发现区域中心或周边市场的货物提供融资；只有经过衡量的销售收入才能支付回报。"
 bfl_commenda_opportunity_consent: "重新检查该指定货物和您的实时资金授权。使用您当前的条款发送报价；在运营商接受之前，资金不会流动。"
