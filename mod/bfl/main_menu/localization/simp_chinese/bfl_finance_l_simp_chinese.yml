 bfl_bond_selected_name: "[Country.GetName]"
 bfl_bond_underwriting: "债券承销"
 bfl_bond_underwriting_tip: "#T 债券承销#!\n您的特许银行为定制主权债券支付实际现金。两个专业都可以承保。固定年度优惠券按月支付；当前持有者在赎回时收到面值。发行需要银行流动性、资本和主权能力。"
 bfl_bond_unpaid: "未付优惠券"
 bfl_bond_workout_accept: "接受债券重组"
 bfl_bond_workout_desc: "[ROOT.GetCountry.MakeScope.GetVariable('bfl_bond_workout_issuer').GetCountry.GetName] 要求您（当前持有人）放弃 20% 该债券的本金和未付息票，并将其年息票减少一个百分点，其中 1% 地板。拒绝保留所有条款。该提案本月到期；付款、转账或其他变更使其无效。普通承兑并不提供新的保障。如果提供的话，担保接受会增加两年的贸易保护让步和最多达的排他性承诺 10% 未付优惠券的月收入。执法仅使用可用的国库黄金，然后再使用其他定制债券优惠券；它不产生任何担保或本金支付。"
