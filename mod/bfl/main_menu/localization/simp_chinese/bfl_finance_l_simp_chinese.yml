 bfl_project_security: "项目安全"
 bfl_project_security_desc: "距离遥远的企业很难被金融家监管。在预付资本之前设定的对其资产和收益的债权，为投资者在企业误入歧途时提供了保护其利益的手段。"
 bfl_project_security_tip: "#T 项目安全#!\n确保企业免受可识别的项目索赔的影响。需要项目安全研究、海外投资和专制时代或更晚的时期。本机项目附属执行在此版本中不可用。"
 bfl_protected_label: "受保护的现金"
 bfl_public_backstop: "公共支持"
 bfl_public_backstop_tip: "#T 公共安全支持#!\n革命、公共金融支持以及在主权首都拥有完整中央银行的实时章程。明确接受 75- 黄金预付款使用公共银行自己的自由现金， 25% 比尔理发至少 9% 年利息。没有自由资本重组。"
 bfl_public_financial_backstops: "公共财政支持"
 bfl_public_financial_backstops_desc: "当一家大银行的倒闭威胁到公共信用和商业时，政府可能会进行干预。这种支持将财政部的资源与银行的复苏联系起来，并使援助条款成为公共政策问题。"
 bfl_purchase_funded_bill: "购买资金付款账单"
 bfl_purchase_funded_bill_act: "$bfl_purchase_funded_bill$"
 bfl_purchase_funded_bill_desc: "经过个人资料、年龄、研究和注册检查后，由您自己的财务资助。本金不是银行利润。银行资本认购按当前资产净值购买单位。"
 bfl_purchase_funded_bill_effect_text: "$bfl_purchase_funded_bill$"
 bfl_purchase_funded_bill_effect_text_past: "$bfl_purchase_funded_bill$"
 bfl_purchase_native_loan: "银行：购买本土房产贷款"
 bfl_purchase_native_loan_act: "$bfl_purchase_native_loan$"
 bfl_purchase_native_loan_desc: "你的银行是买家。适用本地价格和资格，并提供额外的免费现金和资本支票。银行地产收到购买价格，同样的贷款也改变了所有者。债券和国家已经持有的贷款不包括在内。"
 bfl_purchase_native_loan_effect_text: "$bfl_purchase_native_loan$"
 bfl_purchase_native_loan_effect_text_past: "$bfl_purchase_native_loan$"
 bfl_purchase_native_loan_tip: "#T 接管银行贷款#!\n选择另一个拥有合格遗产债务的主权国家。您的特许银行向该国的银行资产支付当地购买价格，并成为同一笔贷款的债权人。应收本金和利息属于银行；主权国家通过其股票股息赚取贷款收入。在准备金和资本允许的情况下，银行每月还会自主购买一笔合格贷款。债券和国家已经持有的贷款不包括在内。"
 bfl_rate_0: "新账户无活期利息"
 bfl_rate_0_short: "0%"
 bfl_rate_0_tip: "优惠 0% 新活期存款的年利息。现有的活期账户和单独的定期账户利率保持在其可接受的利率。"
 bfl_rate_1: "1% 新账户年需求率"
 bfl_rate_1_short: "1%"
 bfl_rate_1_tip: "优惠 1% 新活期存款的年利息。利息每月记入分利差。现有活期账户保持其可接受的汇率。"
 bfl_rate_2: "2% 新账户年需求率"
 bfl_rate_2_short: "2%"
 bfl_rate_2_tip: "优惠 2% 新活期存款的年利息。利息每月记入分利差。现有活期账户保持其可接受的汇率。"
 bfl_recapitalize_command: "资本重组 100 黄金"
 bfl_recapitalize_command_tip: "支付 100 来自贵国财政部的黄金作为银行资本。需要 100 黄金和经销商转售出价不高于有形资产净值；在市场溢价较大时，资本会暂停，以防止立即获得转售利润。零资产净值或负资产净值的资助救援仍然可用。"
