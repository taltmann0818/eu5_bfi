 bfl_resolution_begin_command: "开始解决"
 bfl_resolution_begin_command_tip: "有序决议冻结新的承诺和分配。独立的货币和托管储备受到保护；存款按比例分享在拖欠费用和权益之前的可用现金。失踪债权人保留其债权。自愿条款需要当前债权人的同意和复兴债务重组。公共担保涵盖 50% 接受的存款损失，高达 100 黄金总量，由其记录的主权提供资金；未付费电话仍悬而未决。关闭需要清算所有债务和非现金资产。关闭的屋村无法重新开放。"
