name: Package GitHub release
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate committed runtime
        run: |
          python -m unittest discover -s tests
          if ($LASTEXITCODE -ne 0) { throw 'Offline tests failed' }
          python tools/validate_sources.py
          if ($LASTEXITCODE -ne 0) { throw 'Source validation failed' }
          python tools/generate_scripts.py
          if ($LASTEXITCODE -ne 0) { throw 'Generation failed' }
          git diff --exit-code -- mod/bfl
          if ($LASTEXITCODE -ne 0) { throw 'Committed runtime is not reproducible' }
      - name: Stage tagged package and upload release assets
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          ./tools/stage_release.ps1 -ReleaseVersion $env:RELEASE_TAG
          $releaseAssets = Get-ChildItem -LiteralPath dist -File | Where-Object { $_.Name -match '\.(zip|manifest\.json)$' }
          if ($releaseAssets.Count -ne 2) { throw 'Expected one ZIP and one SHA-256 manifest' }
          gh release upload $env:RELEASE_TAG @($releaseAssets.FullName) --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed' }
